# One documented finding and independent repair per README decision row.
# "Dependencies pinned" is not applicable to Go: a go.mod require names a minimum version, which minimal version selection may raise,
# so no require can be pinned the way an exact version pins a package.
commands = [["go", "vet", "./..."], ["go", "test", "./..."]]

[[rows]]
row = "Lock directory structure"
rule = "local/top-level-directories"
path = "scripts/seed.go"
edits = [
  { path = "tastemaker.toml", find = "\"src/**\",", replace = "\"src/**\", \"scripts/**\"," },
]

[[rows]]
row = "Consistent file names"
rule = "local/use-case#count"
path = "src/inbound/use_cases/archive_todo"
edits = [
  { path = "src/inbound/use_cases/archive_todo/archive.go", delete = true },
  { path = "src/inbound/use_cases/archive_todo/use_case.go", replace = "// The operation of this use case, run with the ports it takes.\npackage archive_todo\n\nimport \"example.com/todo-api/src/domain/todo\"\n\ntype ArchiveTodoUseCase struct{ Store todo.Store }\n\nfunc (useCase ArchiveTodoUseCase) Run(id string) bool { return useCase.Store.Archive(id) }\n" },
  { path = "src/inbound/use_cases/archive_todo/archive_test.go", delete = true },
  { path = "src/inbound/use_cases/archive_todo/use_case_test.go", replace = "package archive_todo\n\nimport (\n\t\"example.com/todo-api/src/outbound/todos\"\n\t\"testing\"\n)\n\nfunc TestRun(t *testing.T) {\n\tstore := todos.New()\n\tuseCase := ArchiveTodoUseCase{Store: store}\n\tadded := store.Add(\"Milk\")\n\tif !useCase.Run(added.ID) || useCase.Run(added.ID) || len(store.All()) != 0 {\n\t\tt.Fatal(\"archive result\")\n\t}\n}\n" },
]

[[rows]]
row = "Naming convention"
rule = "local/use-case-type-name"
path = "src/inbound/use_cases/list_todos/use_case.go"
edits = [
  { path = "src/inbound/use_cases/list_todos/use_case.go", find = "type Lister struct", replace = "type ListTodosUseCase struct" },
  { path = "src/inbound/use_cases/list_todos/use_case.go", find = "useCase Lister)", replace = "useCase ListTodosUseCase)" },
  { path = "src/inbound/use_cases/list_todos/use_case_test.go", find = "useCase := Lister{", replace = "useCase := ListTodosUseCase{" },
  { path = "src/routes/todos/routes.go", find = "list_todos.Lister{", replace = "list_todos.ListTodosUseCase{" },
]

[[rows]]
row = "Import direction"
rule = "local/no-framework-imports"
path = "src/inbound/use_cases/complete_todo/use_case.go"
line = 8
edits = [
  { path = "src/inbound/use_cases/complete_todo/use_case.go", find = "\t\"net/http\"", replace = "" },
  { path = "src/inbound/use_cases/complete_todo/use_case.go", find = "fmt.Errorf(\"%s: %w\", http.StatusText(http.StatusNotFound), err)", replace = "fmt.Errorf(\"complete todo: %w\", err)" },
]

[[rows]]
row = "Required tests"
rule = "local/tests-for-sources"
path = "src/domain/user/types.go"
edits = [
  { path = "src/domain/user/types_test.go", replace = "package user\n\nimport \"testing\"\n\nfunc TestIdentity(t *testing.T) {\n user := User{ID: \"seven\", Name: \"Ann\"}\n if user.ID != \"seven\" || user.Name != \"Ann\" { t.Fatal(user) }\n}\n" },
]

[[rows]]
row = "Framework conventions"
rule = "local/method-routing-patterns"
path = "src/routes/todos/routes.go"
line = 56
edits = [
  { path = "src/routes/todos/routes.go", find = "mux.HandleFunc(\"/todos/count\",", replace = "mux.HandleFunc(\"GET /todos/count\"," },
]

[[rows]]
row = "Complexity limits"
rule = "local/too-many-parameters"
path = "src/domain/todo/titles.go"
line = 11
edits = [
  { path = "src/domain/todo/titles.go", find = "due string, tag string) string", replace = "due string) string" },
  { path = "src/domain/todo/titles.go", find = "owner, due, tag}", replace = "owner, due}" },
  { path = "src/domain/todo/titles_test.go", find = "true, \"ann\", \"monday\", \"home\")", replace = "true, \"ann\", \"monday\")" },
]

[[rows]]
row = "Dependency graph"
rule = "local/independent-use-cases"
path = "src/inbound/use_cases/create_todo/use_case.go"
line = 8
edits = [
  { path = "src/inbound/use_cases/create_todo/use_case.go", find = "\t\"example.com/todo-api/src/inbound/use_cases/list_todos\"", replace = "" },
  { path = "src/inbound/use_cases/create_todo/use_case.go", find = "return list_todos.List(useCase.Store)", replace = "return useCase.Store.All()" },
]

[[rows]]
row = "Banned patterns"
rule = "local/no-todo-comments"
path = "src/main.go"
line = 15
edits = [
  { path = "src/main.go", find = "// TODO: make the listen address configurable", replace = "// The listen address for the sample." },
]

[[rows]]
row = "Duplicate code"
rule = "local/duplicate-function-bodies"
path = "src/domain/todo/titles.go"
line = 5
edits = [
  { path = "src/inbound/use_cases/create_todo/use_case.go", find = "\t\"strings\"", replace = "" },
  { path = "src/inbound/use_cases/create_todo/use_case.go", find = "// planted: Duplicate code\nfunc NormaliseTitle(title string) string {\n\twords := strings.Fields(title)\n\treturn strings.Join(words, \" \")\n}\n\n", replace = "" },
  { path = "src/inbound/use_cases/create_todo/use_case.go", find = "useCase.Store.Add(NormaliseTitle(title))", replace = "useCase.Store.Add(todo.NormaliseTitle(title))" },
]

[[rows]]
row = "Idiomatic code"
rule = "local/no-dot-imports"
path = "src/main.go"
line = 5
edits = [
  { path = "src/main.go", find = ". \"fmt\"", replace = "\"fmt\"" },
  { path = "src/main.go", find = "return Sprintf(", replace = "return fmt.Sprintf(" },
]

[[rows]]
row = "Markdown: README sections"
rule = "local/readme-sections"
path = "README.md"
edits = [
  { path = "README.md", find = "Run `go run ./src` to listen on port 3000.", replace = "```sh\ngo run ./src\n```" },
]

[[rows]]
row = "go.mod: dependencies in order"
rule = "local/sorted-dependencies"
path = "go.mod"
line = 7
edits = [
  { path = "go.mod", find = "\tgithub.com/google/uuid v1.6.0\n\texample.com/todo-label v0.0.0\n", replace = "\texample.com/todo-label v0.0.0\n\tgithub.com/google/uuid v1.6.0\n" },
]
