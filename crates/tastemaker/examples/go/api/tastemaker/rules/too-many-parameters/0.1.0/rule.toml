description = "No function declares more than `max-params` parameters."
why = "A function with many parameters is called with them in the wrong order sooner or later, and usually does more than one thing. Pass an object of named fields, or split the function."

query = '''
param max-params: integer;
let counted = group-count(from="parameter", keys=["owner", "file"], count="arity", distinct="id");
let wide = select * from counted where $max-params < arity;
let placed = select l."file" as "file", r."span" as "span", l."arity" as "arity", r."name" as "name" from wide as l join "function" as r on l."owner" = r."id" and l."file" = r."file";
emit placed subject "file" key("span");
'''

[params.max-params]
type = "integer"
description = "The most parameters a function may declare."

[diagnostic]
primary = "span"
message = "`{name}` declares {arity} parameters, over the limit"
help = "Pass one object of named fields, or split the function."

[given]
include = ["**"]
params = { max-params = 4 }

[[scenarios]]
id = "five-parameters"
scenario = "Five parameters exceed the limit of four."
given.files."src/main.go" = "package p\nfunc f(a int, b int, c int, d int, e int) int { return a+b+c+d+e }\n"
then.findings = [{ path = "src/main.go", line = 2 }]

[[scenarios]]
id = "four-parameters"
scenario = "Four parameters are allowed."
given.files."src/main.go" = "package p\nfunc f(a int, b int, c int, d int) int { return a+b+c+d }\n"
