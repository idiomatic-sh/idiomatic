# The todo API in JavaScript on Hono, one rule, spec or template per row of the Tastemaker README's table. Each row has
# one violation planted in the code and commented `// planted: <row>`, so `tm check` reports each row once.
closed = false
tastemaker = "0.1.2"
workspace = { name = "local", dependencies = [{ package = "local", path = "tastemaker" }] }
rules = [
  { rule = "local/top-level-directories", include = ["."], params = { allowed = [
    "src/**",
    "tests/**",
    "tastemaker/**",
    "package.json",
    "package-lock.json",
    "packages/**",
    ".gitignore",
    "README.md",
    "tastemaker.toml",
    "tastemaker.lock",
    "fixes.toml",
  ] }, description = "No top-level directories except those declared: src, tests and the Tastemaker package." },
  { rule = "local/tests-for-sources", include = ["src", "tests"], description = "Every file in `src/` has a `<name>.test.js` in `tests/`." },
  { rule = "local/async-handlers", include = ["src/routes/*/routes.js"], description = "Every handler in `routes.js` is `async`." },
  { rule = "local/too-many-parameters", include = ["src"], params = { max-params = 4 }, description = "No function declares more than 4 parameters." },
  { rule = "local/use-case-import-cycles", include = ["src"], description = "No import cycle between the use cases under `inbound/use_cases/`." },
  { rule = "local/no-todo-comments", include = ["src"], description = "No TODO comments." },
  { rule = "local/duplicate-function-bodies", include = ["src"], params = { min-tokens = 10 }, description = "No two functions spell the same body." },
  { rule = "local/no-loose-equality", include = ["src"], description = "Equality comparisons use `===` or `!==`." },
  { rule = "local/pinned-dependencies", include = ["package.json"], description = "Every dependency is pinned to one exact version." },
  { rule = "local/sorted-dependencies", include = ["package.json"], description = "Each dependency table is in alphabetical order." },
  { rule = "local/package-identity", include = ["package.json"], description = "The manifest has a non-empty name and description." },
  { rule = "local/readme-sections", include = ["README.md"], description = "The README has Install, Usage with a fenced code block, and Development, in order." },
]
specs = [
  { spec = "local/use-case", include = ["src/inbound/use_cases/{use-case}"], description = "Each directory in `inbound/use_cases/<use-case>/` contains `use_case.js`." },
]
