description = "Equality comparisons use === or !==."
why = "Coercing equality accepts values of a different type; compare the values with their types intact."

query = '''
let found = select * from "syntax-tree" where text = "==" or text = "!=";
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this equality comparison coerces its operands"
help = "Use === or !== after converting input at the boundary."

[given]
include = ["**"]

[[scenarios]]
id = "coercing-equality"
scenario = "A coercing comparison is reported."
given.files."src/main.js" = "export function same(a, b) { return a == b; }\n"
then.findings = [{ path = "src/main.js", line = 1 }]

[[scenarios]]
id = "strict-equality"
scenario = "A strict comparison is not reported."
given.files."src/main.js" = "export function same(a, b) { return a === b; }\n"
