description = "Every handler function written in `routes.js` is `async`."
why = "A route handler that is not `async` cannot await the use case it calls, so the next edit that does adds a floating promise. The rule reads the arrow functions of the routes file: each starts with `async`."

query = '''
let tree = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l;
let arrows = select * from tree where kind = "arrow-function-expression" and text = "";
let edges = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from arrows as l join "syntax-child" as r on l."id" = r."parent";
let async-tokens = select * from tree where text = "async";
let marked = select l."id" as "id" from edges as l join async-tokens as r on l."child" = r."id";
let sync = antijoin(left=arrows, right=marked, left-on=["id"], right-on=["id"]);
emit sync subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this handler is not `async`"
help = "Write the handler as `async (c) => ...`, and await what it calls."

[given]
include = ["**"]

[[scenarios]]
id = "sync-handler"
scenario = "A handler that is not async is reported."
given.files."src/routes.js" = "routes.get(\"/\", (c) => c.json(1));\n"
then.findings = [{ path = "src/routes.js", line = 1 }]

[[scenarios]]
id = "async-handler"
scenario = "An async handler is not reported."
given.files."src/routes.js" = "routes.get(\"/\", async (c) => c.json(1));\n"
