description = "Every `.js` file under `src/` has the test file `<name>.test.js` at the same place under `tests/`."
why = "A source file with no test beside it in the tree is behaviour nobody runs. The test file mirrors the source path: `src/domain/todo/titles.js` is tested by `tests/domain/todo/titles.test.js`, and `src/main.js` by `tests/main.test.js`."

query = '''
let nested = capture(from="filesystem.file", path="path", pattern="src/{*dir}/{name}.js", captures=["dir", "name"]);
let top = capture(from="filesystem.file", path="path", pattern="src/{name}.js", captures=["name"]);
let nested-tests = capture(from="filesystem.file", path="path", pattern="tests/{*dir}/{name}.test.js", captures=["dir", "name"]);
let top-tests = capture(from="filesystem.file", path="path", pattern="tests/{name}.test.js", captures=["name"]);
let nested-test-keys = project(from=nested-tests, columns=["dir", "name"]);
let top-test-keys = project(from=top-tests, columns=["name"]);
let nested-missing = antijoin(left=nested, right=nested-test-keys, left-on=["dir", "name"], right-on=["dir", "name"]);
let top-missing = antijoin(left=top, right=top-test-keys, left-on=["name"], right-on=["name"]);
let nested-paths = project(from=nested-missing, columns=["path"]);
let top-paths = project(from=top-missing, columns=["path"]);
let missing = union(left=nested-paths, right=top-paths);
emit missing subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "`{path}` has no test file `<name>.test.js` under `tests/`"
help = "Add the test file at the mirrored path under `tests/`."

[given]
include = ["**"]
files."src/main.js" = "export const x = 1;\n"
files."src/domain/order.js" = "export const x = 1;\n"
files."tests/main.test.js" = "export const x = 1;\n"

[[scenarios]]
id = "source-without-a-test"
scenario = "A source file with no test file is reported."
then.findings = [{ path = "src/domain/order.js" }]

[[scenarios]]
id = "sources-with-tests"
scenario = "Source files with their tests are not reported."
given.files."tests/domain/order.test.js" = "export const x = 1;\n"
