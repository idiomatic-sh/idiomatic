description = "No two packages under `src/services/` import each other, directly or through others."
why = "Services that import each other in a ring cannot be read, tested or moved one at a time. The nodes are the packages `src/services/<service>/`, the edges the imports of one package's files from another's, matched on the dotted path `src.services.<service>`. A cycle is reported once per import that closes it from the package named first in alphabetical order, so a ring of two is one finding. Not seen: an import written relative to the file."

query = '''
let imports = select l."file" as "file", l."span" as "span", l."target" as "target" from "static-import" as l;
let from-packages = capture(from=imports, path="file", pattern="src/services/{pkg}/{*rest}", captures=["pkg", "rest"]);
let edges-with-files = capture(from=from-packages, path="target", pattern="src.services.{tpkg}.{*trest}", captures=["tpkg", "trest"]);
let foreign = select * from edges-with-files where pkg != tpkg;
let edges = project(from=foreign, columns=["pkg", "tpkg"]);
let cyclic = cycles(edges=edges, source="pkg", destination="tpkg");
let members = project(from=cyclic, columns=["pkg"]);
let member-targets = select l."pkg" as "tpkg" from members as l;
let from-members = select l."file" as "file", l."span" as "span", l."pkg" as "pkg", l."tpkg" as "tpkg" from foreign as l join members as r on l."pkg" = r."pkg";
let inside = select l."file" as "file", l."span" as "span", l."pkg" as "pkg", l."tpkg" as "tpkg" from from-members as l join member-targets as r on l."tpkg" = r."tpkg";
let closing = select * from inside where pkg < tpkg;
emit closing subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{pkg}` imports `{tpkg}`, which imports it back"
help = "Move what both services need into a module both import, or pass the value in as a parameter."

[given]
include = ["**"]
files."src/services/orders/orders_service.py" = "from src.services.users.service import UserService\n"

[[scenarios]]
id = "two-services-import-each-other"
scenario = "Two services that import each other are reported once."
given.files."src/services/users/service.py" = "from src.services.orders.orders_service import total\n"
then.findings = [{ path = "src/services/orders/orders_service.py", line = 1 }]

[[scenarios]]
id = "one-service-imports-another"
scenario = "A service that imports another, which does not import it back, is not reported."
given.files."src/services/users/service.py" = "from src.models.user import User\n"
