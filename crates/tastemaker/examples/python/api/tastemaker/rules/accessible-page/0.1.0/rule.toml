description = "Every `<img>` has an `alt` attribute, and every `<html>` has a `lang` attribute."
why = "A screen reader says nothing useful for an image without `alt`, and reads a page in the wrong voice without `lang`. The rule reads each element by its name and the names of its attributes; an image that only decorates takes `alt=\"\"`."

query = '''
let elements = select * from "syntax-tree" where kind = "element";
let names = select l."parent" as "owner", r."text" as "name" from "syntax-child" as l join "syntax-tree" as r on l."child" = r."id" where l."field" = "name";
let named = select l."id" as "id", l."file" as "file", l."span" as "span", r."name" as "name" from elements as l join names as r on l."id" = r."owner";
let attributes = select l."parent" as "element", r."name" as "attribute" from "syntax-child" as l join names as r on l."child" = r."owner" where l."field" = "attribute";
let images = select * from named where name = "img";
let alts = select * from attributes where attribute = "alt";
let bare-images = antijoin(left=images, right=alts, left-on=["id"], right-on=["element"]);
let pages = select * from named where name = "html";
let langs = select * from attributes where attribute = "lang";
let silent-pages = antijoin(left=pages, right=langs, left-on=["id"], right-on=["element"]);
let image-places = project(from=bare-images, columns=["file", "span"]);
let page-places = project(from=silent-pages, columns=["file", "span"]);
let found = union(left=image-places, right=page-places);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this element lacks the attribute a reader needs: `alt` on an image, `lang` on the page"
help = "Say what the image shows in `alt` (or `alt=\"\"` when it only decorates), and the page's language in `<html lang>`."

[given]
include = ["**"]

[[scenarios]]
id = "image-without-alt-and-page-without-lang"
scenario = "An image without `alt` and a page without `lang` are both reported."
given.files."index.html" = "<!doctype html>\n<html>\n<body>\n<img src=\"a.png\" alt=\"A todo\">\n<img src=\"b.png\">\n</body>\n</html>\n"
then.findings = [{ path = "index.html", line = 2 }, { path = "index.html", line = 5 }]

[[scenarios]]
id = "described-page"
scenario = "A page with `lang` whose images have `alt`, an empty one included, is not reported."
given.files."index.html" = "<!doctype html>\n<html lang=\"en\">\n<body>\n<img src=\"a.png\" alt=\"A todo\">\n<img src=\"b.png\" alt=\"\">\n</body>\n</html>\n"
