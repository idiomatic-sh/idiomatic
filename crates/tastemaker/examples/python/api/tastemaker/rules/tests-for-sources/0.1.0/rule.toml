description = "Every `.py` file under `src/` has the test file `test_<name>.py` at the same place under `tests/`."
why = "A source file with no test beside it in the tree is behaviour nobody runs. The test file mirrors the source path: `src/services/users/service.py` is tested by `tests/services/users/test_service.py`, and `src/main.py` by `tests/test_main.py`. Read as the file names say: a source and its test are paired when they share the directory and the name, from the workspace's directory."

query = '''
let nested = capture(from="filesystem.file", path="path", pattern="src/{*dir}/{name}.py", captures=["dir", "name"]);
let top = capture(from="filesystem.file", path="path", pattern="src/{name}.py", captures=["name"]);
let nested-tests = capture(from="filesystem.file", path="path", pattern="tests/{*dir}/test_{name}.py", captures=["dir", "name"]);
let top-tests = capture(from="filesystem.file", path="path", pattern="tests/test_{name}.py", captures=["name"]);
let nested-test-keys = project(from=nested-tests, columns=["dir", "name"]);
let top-test-keys = project(from=top-tests, columns=["name"]);
let nested-missing = antijoin(left=nested, right=nested-test-keys, left-on=["dir", "name"], right-on=["dir", "name"]);
let top-missing = antijoin(left=top, right=top-test-keys, left-on=["name"], right-on=["name"]);
let nested-paths = project(from=nested-missing, columns=["path"]);
let top-paths = project(from=top-missing, columns=["path"]);
let missing = union(left=nested-paths, right=top-paths);
emit missing subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "`{path}` has no test file `test_<name>.py` under `tests/`"
help = "Add the test file at the mirrored path under `tests/`."

[given]
include = ["**"]
files."src/main.py" = "x = 1\n"
files."tests/test_main.py" = "x = 1\n"

[[scenarios]]
id = "source-without-a-test"
scenario = "A source file with no test file is reported."
given.files."src/models/order.py" = "x = 1\n"
then.findings = [{ path = "src/models/order.py" }]

[[scenarios]]
id = "sources-with-tests"
scenario = "Source files with their tests are not reported."
given.files."src/services/users/service.py" = "x = 1\n"
given.files."tests/services/users/test_service.py" = "x = 1\n"
