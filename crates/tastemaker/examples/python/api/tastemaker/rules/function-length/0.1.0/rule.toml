description = "A function spans at most `max-lines` line breaks between its signature and its end."
why = "A long function does several things that each want a name and a test of their own. The count is the line-ending tokens under the function, so a run of blank lines counts, a line break inside a string literal does not, and a nested function counts toward every function around it. The last line break of a function's body belongs to the module, so a function is counted one line short."

query = '''
param max-lines: integer;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let functions = select * from tree-nodes where kind = "function-def";
let function-nodes = axis(from=functions, relation="syntax-child", direction=descendant, domain=tree-nodes);
let below-edges = select r."child" as "child", l."id" as "id", l."file" as "file", l."span" as "span" from function-nodes as l join "syntax-child" as r on l."related" = r."parent";
let own-edges = select r."child" as "child", l."id" as "id", l."file" as "file", l."span" as "span" from functions as l join "syntax-child" as r on l."id" = r."parent";
let function-edges = union(left=below-edges, right=own-edges);
let line-breaks = select * from tree-tokens where glob_any(kind, "{newline,nl}");
let function-breaks = select l."id" as "id", l."file" as "file", l."span" as "span", r."id" as "token" from function-edges as l join line-breaks as r on l."child" = r."id";
let counted = group-count(from=function-breaks, keys=["id", "file", "span"], count="lines", distinct="token");
let long = select * from counted where $max-lines < lines;
emit long subject "file" key("span");
'''

[params.max-lines]
type = "integer"
description = "The most line breaks a function may hold."

[diagnostic]
primary = "span"
message = "this function spans {lines} line breaks, over the limit"
help = "Split it into functions that each do one named thing."

[given]
include = ["**"]
params = { max-lines = 3 }

[[scenarios]]
id = "long-function"
scenario = "A function over the limit is reported."
given.files."src/main.py" = "def long() -> int:\n    a = 1\n    b = 2\n    c = 3\n    d = 4\n    return a\n"
then.findings = [{ path = "src/main.py", line = 1 }]

[[scenarios]]
id = "short-function"
scenario = "A function within the limit is not reported."
given.files."src/main.py" = "def short() -> int:\n    return 1\n"
