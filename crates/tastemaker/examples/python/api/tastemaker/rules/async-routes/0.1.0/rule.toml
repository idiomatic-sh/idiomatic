description = "Every function in the files it is placed on is `async def`."
why = "A synchronous route runs in a thread pool and blocks it under load, so the team writes every route `async def`. The Python reader records each function's `refinement`, `function` or `async-function`; the entry places the rule on the files that hold routes, such as `routes.py`."

query = '''
let found = select * from "defines" where kind = "function" and refinement != "async-function";
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this route is not `async def`"
help = "Write the route as `async def`."

[given]
include = ["**"]

[[scenarios]]
id = "synchronous-route"
scenario = "A route written with def is reported."
given.files."src/routers/users/routes.py" = "def count_users() -> int:\n    return 0\n"
then.findings = [{ path = "src/routers/users/routes.py", line = 1 }]

[[scenarios]]
id = "asynchronous-route"
scenario = "A route written with async def is not reported."
given.files."src/routers/users/routes.py" = "async def count_users() -> int:\n    return 0\n"
