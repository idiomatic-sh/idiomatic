description = "One service of the API: the package `services/<service>/` that holds its `service.py`."
why = "Every service has the same shape, so a reader and a tool find any service the same way: `service.py` holds the operations, in a class named for the service, and imports no router. The spec is not closed: a service may hold further modules of its own."
closed = false

templates = [
  { template = "local/service@0.1.0", file = "service.py", description = "The service's operations." },
]
rules = [
  { rule = "local/service-class-name@0.1.0", include = ["service.py"], description = "`service.py` declares a class named `<Name>Service`." },
  { rule = "local/no-router-imports@0.1.0", include = ["service.py"], params = { forbidden = ["src.routers", "src.routers.*"] }, description = "`service.py` does not import from `routers/`." },
]

[given]
at = "src/services/{service}"

[[scenarios]]
id = "complete-service"
scenario = "A service package with its service.py has no finding."
given.files."src/services/users/service.py" = '''
"""The users service."""

__all__ = ["UsersService"]


class UsersService:
    pass
'''

[[scenarios]]
id = "service-without-service-py"
scenario = "A service package with no service.py is reported."
given.files."src/services/orders/orders_service.py" = '''
"""The orders service."""
'''
then.findings = [{ rule = "#count", path = "src/services/orders" }]
