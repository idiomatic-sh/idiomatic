# crates/tastemaker/examples/python/api/tastemaker.toml   (paths are relative to this file's directory)
# The todo API in Python the Tastemaker README describes, one rule, spec or template per row of its table. Each row has one
# violation planted in the code and commented `# planted: <row>`, so `tm check` reports each row once.
closed = false
tastemaker = "0.1.3"
workspace = { name = "local", dependencies = [
  { package = "local", path = "tastemaker" },
] }
rules = [
  { rule = "local/top-level-directories", include = ["."], params = { allowed = [
    "src/**",
    "tests/**",
    "templates/**",
    "static/**",
    "tastemaker/**",
    "pyproject.toml",
    "uv.lock",
    ".gitignore",
    "README.md",
    "tastemaker.toml",
    "tastemaker.lock",
    "fixes.toml",
  ] }, description = "No top-level directories except those declared: src, tests, templates, static and the Tastemaker package." },
  { rule = "local/tests-for-sources", include = ["src", "tests"], description = "Every file in `src/` has a `test_*.py` in `tests/`." },
  { rule = "local/async-routes", include = ["src/routers/*/routes.py"], description = "Every route in `routes.py` is `async def`." },
  { rule = "local/function-length", include = ["src"], params = { max-lines = 60 }, description = "No function is over 60 lines." },
  { rule = "local/service-import-cycles", include = ["src"], description = "No import cycle between the packages under `services/`." },
  { rule = "local/no-todo-comments", include = ["src"], description = "No TODO comments." },
  { rule = "local/duplicate-function-bodies", include = ["src"], params = { min-tokens = 10 }, description = "No two functions spell the same body." },
  { rule = "local/public-names-in-all", include = ["src"], description = "`__all__` lists only public names, and lists every public top-level name." },
  { rule = "local/pinned-dependencies", include = ["pyproject.toml"], description = "Every dependency is pinned with `==`." },
  { rule = "local/sorted-dependencies", include = ["pyproject.toml"], description = "Each dependency list is in alphabetical order." },
  { rule = "local/project-identity", include = ["pyproject.toml"], description = "`[project]` has a non-empty name and description." },
  { rule = "local/readme-sections", include = ["README.md"], description = "The README has Install, Usage with a fenced code block, and Development, in order." },
  { rule = "local/accessible-page", include = ["templates"], description = "Images have `alt`, and the page has `lang`." },
  { rule = "local/low-specificity-styles", include = ["static"], description = "No ID selectors and no `!important`." },
]
specs = [
  { spec = "local/service", include = ["src/services/{service}"], description = "Each package in `services/<service>/` contains `service.py`." },
]
