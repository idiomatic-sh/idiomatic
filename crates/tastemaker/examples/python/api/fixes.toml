# What `tm check` reports on this sample, one finding per row of the Tastemaker README's table, and the fix of each row:
# the tests apply a row's edits, see its finding go and nothing else change, then restore the files and see it back; with
# every row applied, the sample's own tests pass. A finding's path is from this directory; a row names its finding by rule
# and path. An edit replaces the one occurrence of `find` in `path` with `replace`; an edit with no `find` writes `replace`
# as a new file, and an edit with `delete = true` removes the file.

# The commands that build the sample with every row fixed and run its own tests, in order, from its directory.
commands = [["uv", "run", "--quiet", "pytest", "-q", "-p", "no:warnings"]]

[[rows]]
row = "Lock directory structure"
rule = "local/top-level-directories"
path = "scripts/seed.py"
edits = [{ path = "tastemaker.toml", find = '"src/**",', replace = '"src/**", "scripts/**",' }]

