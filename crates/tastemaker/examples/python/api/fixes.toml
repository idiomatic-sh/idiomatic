path = "src/services/tags"
edits = [
  { path = "src/services/tags/tags_service.py", delete = true },
  { path = "src/services/tags/service.py", replace = """
\"\"\"The tags service: the tags a todo's title carries.\"\"\"

__all__ = ["TagsService"]

class TagsService:
    def tag(self, title: str, tag: str) -> str:
        return f"{title} #{tag}"
""" },
  { path = "tests/services/tags/test_tags_service.py", delete = true },
  { path = "tests/services/tags/test_service.py", replace = """
from src.services.tags.service import TagsService

def test_a_tag_follows_the_title() -> None:
    assert TagsService().tag("Buy milk", "home") == "Buy milk #home"
""" },
]

