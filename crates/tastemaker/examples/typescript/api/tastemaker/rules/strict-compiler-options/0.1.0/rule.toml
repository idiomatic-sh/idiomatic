description = "Every `tsconfig.json` sets `compilerOptions.strict` to `true`."
why = "Without `strict`, the compiler lets `null` and `undefined` into every type and lets parameters go untyped, so a bug the types would show compiles. The rule reads each `tsconfig.json` from the file down: a file with no `compilerOptions`, and options whose `strict` is not the boolean `true`, are both reported."

query = '''
let configs = select * from "filesystem.file" where glob_any(path, "{tsconfig.json,**/tsconfig.json}");
let roots = select * from "mapping" where owner = id;
let options = select r."file" as "file", r."span" as "span", r."occurrence" as "occurrence" from roots as l join "entry" as r on l."id" = r."owner" where r."key" = "compilerOptions" and (r."kind" = "mapping" or r."kind" = "inline-mapping");
let bodies = select l."file" as "file", l."span" as "span", r."id" as "body" from options as l join "mapping" as r on l."occurrence" = r."owner";
let strict = select l."file" as "file", l."span" as "span" from bodies as l join "entry" as r on l."body" = r."owner" where r."key" = "strict" and r."boolean" = "true";
let placed = project(from=bodies, columns=["file", "span"]);
let lax = difference(left=placed, right=strict);
let with-options = project(from=options, columns=["file"]);
let without-options = antijoin(left=configs, right=with-options, left-on=["path"], right-on=["file"]);
let tops = antijoin(left="syntax-tree", right="syntax-child", left-on=["id"], right-on=["child"]);
let bare = select r."file" as "file", r."span" as "span" from without-options as l join tops as r on l."path" = r."file";
let found = union(left=lax, right=bare);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this `tsconfig.json` does not set `compilerOptions.strict` to `true`"
help = "Set `\"strict\": true` in `compilerOptions`, and fix what the compiler then reports."

[given]
include = ["**"]

[[scenarios]]
id = "strict-off"
scenario = "Compiler options that set `strict` to `false` are reported where they are written."
given.files."tsconfig.json" = "{\n  \"compilerOptions\": {\n    \"strict\": false\n  }\n}\n"
then.findings = [{ path = "tsconfig.json", line = 2 }]

[[scenarios]]
id = "strict-as-text"
scenario = "A `strict` written as the text `\"true\"` is no boolean, and is reported."
given.files."tsconfig.json" = "{\n  \"compilerOptions\": {\n    \"strict\": \"true\"\n  }\n}\n"
then.findings = [{ path = "tsconfig.json", line = 2 }]

[[scenarios]]
id = "no-compiler-options"
scenario = "A `tsconfig.json` with no `compilerOptions` at all is reported at its top."
given.files."tsconfig.json" = "{\n  \"include\": [\"src\"]\n}\n"
then.findings = [{ path = "tsconfig.json", line = 1 }]

[[scenarios]]
id = "strict-on"
scenario = "Compiler options that set `strict` to `true` are not reported."
given.files."tsconfig.json" = "{\n  \"compilerOptions\": {\n    \"strict\": true\n  }\n}\n"
then.findings = []
