description = "A use case's `use_case.ts`: its doc comment, to be filled in with the use case's operation."
why = "Every `inbound/use_cases/<use-case>/` holds a `use_case.ts`, so a reader finds a use case's operation in the same file. The template is the file a new use case starts from; an existing file may hold more than the template."
content = '''
/** The operation of this use case, run with the ports it takes. */
'''

[given]
file = "use_case.ts"

[[scenarios]]
id = "file-holds-the-content"
scenario = "A placed file that holds the template's content has no finding."
given.files."use_case.ts" = '''
/** The operation of this use case, run with the ports it takes. */
'''

[[scenarios]]
id = "file-is-missing"
scenario = "A placed file that is missing is reported."
then.findings = [{ rule = "#count", path = "tastemaker.toml" }]
