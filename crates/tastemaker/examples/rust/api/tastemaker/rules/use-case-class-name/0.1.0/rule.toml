description = "Every `use_case.rs` declares a struct named for its directory: the directory in Pascal case, then `UseCase`."
why = "A reader finds a use case's struct by its directory's name, and a tool can call it without reading the file. The class is the directory's name in Pascal case followed by `UseCase`: `create_todo/use_case.rs` declares `CreateTodoUseCase`."

query = '''
let files = select * from "filesystem.file";
let cases = capture(from=files, path="path", pattern="src/inbound/use_cases/{pkg}/use_case.rs", captures=["pkg"]);
let classes = select * from "defines" where kind = "struct";
let named = select c."file" as "file", c."name" as "name", p."pkg" as "pkg" from classes as c join cases as p on c."file" = p."path" where c.name = concat(pascal(p.pkg), "UseCase");
let missing = antijoin(left=cases, right=named, left-on=["path"], right-on=["file"]);
emit missing subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "`{path}` declares no struct named for its directory `{pkg}`: the directory in Pascal case, then `UseCase`"
help = "Name the use case's struct after its directory, or move the file to the directory its struct names."

[given]
include = ["**"]

[[scenarios]]
id = "struct-not-named-for-its-directory"
scenario = "A use case whose struct is not named for its directory is reported."
given.files."src/inbound/use_cases/list_todos/use_case.rs" = "pub struct Lister;\n"
then.findings = [{ path = "src/inbound/use_cases/list_todos/use_case.rs" }]

[[scenarios]]
id = "struct-named-for-its-directory"
scenario = "A use case whose struct is named for its directory is not reported."
given.files."src/inbound/use_cases/list_todos/use_case.rs" = "pub struct ListTodosUseCase;\n"
