description = "Every handler function written in `routes.rs` is `async`."
why = "A route handler that is not `async` cannot await the use case it calls, so the next edit that does adds a floating promise. The rule reads the functions of the routes file: each is an `async fn`."

query = '''
let functions = select * from "function";
let async-tokens = select l."id" as "id" from "syntax-tree" as l where l."kind" = "async-kw";
let edges = select l."id" as "id", r."child" as "child" from functions as l join "syntax-child" as r on l."id" = r."parent";
let marked = select l."id" as "id" from edges as l join async-tokens as r on l."child" = r."id";
let sync = antijoin(left=functions, right=marked, left-on=["id"], right-on=["id"]);
emit sync subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this handler is not `async`"
help = "Write the handler as an `async fn`, and await what it calls."

[given]
include = ["**"]

[[scenarios]]
id = "sync-handler"
scenario = "A handler that is not async is reported."
given.files."src/routes.rs" = "pub fn count() -> u8 {\n    0\n}\n"
then.findings = [{ path = "src/routes.rs", line = 1 }]

[[scenarios]]
id = "async-handler"
scenario = "An async handler is not reported."
given.files."src/routes.rs" = "pub async fn count() -> u8 {\n    0\n}\n"
