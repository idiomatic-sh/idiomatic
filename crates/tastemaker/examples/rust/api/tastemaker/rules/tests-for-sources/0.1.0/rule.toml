description = "Every `.rs` file under `src/` has the test file `<name>.rs` at the same place under `tests/`."
why = "A source file with no test beside it in the tree is behaviour nobody runs. The test file mirrors the source path: `src/domain/todo/titles.rs` is tested by `tests/domain/todo/titles.rs`, and `src/main.rs` by `tests/main.rs`."

query = '''
let nested = capture(from="filesystem.file", path="path", pattern="src/{*dir}/{name}.rs", captures=["dir", "name"]);
let top = capture(from="filesystem.file", path="path", pattern="src/{name}.rs", captures=["name"]);
let nested-tests = capture(from="filesystem.file", path="path", pattern="tests/{*dir}/{name}.rs", captures=["dir", "name"]);
let top-tests = capture(from="filesystem.file", path="path", pattern="tests/{name}.rs", captures=["name"]);
let nested-test-keys = project(from=nested-tests, columns=["dir", "name"]);
let top-test-keys = project(from=top-tests, columns=["name"]);
let nested-missing = antijoin(left=nested, right=nested-test-keys, left-on=["dir", "name"], right-on=["dir", "name"]);
let top-missing = antijoin(left=top, right=top-test-keys, left-on=["name"], right-on=["name"]);
let nested-paths = project(from=nested-missing, columns=["path"]);
let top-paths = project(from=top-missing, columns=["path"]);
let missing = union(left=nested-paths, right=top-paths);
emit missing subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "`{path}` has no test file `<name>.rs` under `tests/`"
help = "Add the test file at the mirrored path under `tests/`."

[given]
include = ["**"]
files."src/main.rs" = "fn main() {}\n"
files."src/domain/order.rs" = "pub struct Order;\n"
files."tests/main.rs" = "#[test]\nfn main_is_there() {}\n"

[[scenarios]]
id = "source-without-a-test"
scenario = "A source file with no test file is reported."
then.findings = [{ path = "src/domain/order.rs" }]

[[scenarios]]
id = "sources-with-tests"
scenario = "Source files with their tests are not reported."
given.files."tests/domain/order.rs" = "#[test]\nfn order_is_there() {}\n"
