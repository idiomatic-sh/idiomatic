description = "No `use` imports a module's names with a wildcard."
why = "A wildcard import hides where a name comes from and lets a new item in the module shadow a name the file meant from elsewhere. Name what the file uses."

query = '''
let found = select * from "static-import" where glob_any(target, "*::[*]");
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this imports every name of `{target}`"
help = "Import the names the file uses, one by one."

[given]
include = ["**"]

[[scenarios]]
id = "wildcard-import"
scenario = "A wildcard import is reported."
given.files."src/main.rs" = "use std::collections::*;\nfn main() {}\n"
then.findings = [{ path = "src/main.rs", line = 1 }]

[[scenarios]]
id = "named-import"
scenario = "An import that names what it uses is not reported."
given.files."src/main.rs" = "use std::collections::HashMap;\nfn main() {}\n"
