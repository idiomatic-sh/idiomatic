# What `tm check` reports on this sample, one finding per row of the Tastemaker README's table, and the fix of each row:
# the tests apply a row's edits, see its finding go and nothing else change, then restore the files and see it back; with
# every row applied, the sample builds and its own tests pass. A finding's path is from this directory; a row names its
# finding by rule and path. An edit replaces the one occurrence of `find` in `path` with `replace`; an edit with no `find`
# writes `replace` as a new file, and an edit with `delete = true` removes the file.

# The commands that build the sample with every row fixed and run its own tests, in order, from its directory.
commands = [["cargo", "test", "--locked", "--quiet"]]

[[rows]]
row = "Lock directory structure"
rule = "local/top-level-directories"
path = "scripts/seed.rs"
edits = [{ path = "tastemaker.toml", find = '"src/**",', replace = '"src/**", "scripts/**",' }]

[[rows]]
row = "Consistent file names"
rule = "local/use-case#count"
path = "src/inbound/use_cases/archive_todo"
edits = [
  { path = "src/inbound/use_cases/archive_todo/archive.rs", delete = true },
  { path = "src/inbound/use_cases/archive_todo/use_case.rs", replace = """
//! The operation of this use case, run with the ports it takes.
pub struct ArchiveTodoUseCase;

impl ArchiveTodoUseCase {
    pub async fn run(&self, id: u64) -> u64 {
        id
    }
}
""" },
  { path = "src/lib.rs", find = "pub mod archive;", replace = "pub mod use_case;" },
  { path = "tests/inbound/use_cases/archive_todo/archive.rs", delete = true },
  { path = "tests/inbound/use_cases/archive_todo/use_case.rs", replace = """
use todo_api::inbound::use_cases::archive_todo::use_case::ArchiveTodoUseCase;

#[tokio::test]
async fn archiving_answers_the_id_archived() {
    assert_eq!(ArchiveTodoUseCase.run(3).await, 3);
}
""" },
  { path = "tests/lib.rs", find = "mod archive;", replace = "mod use_case;" },
]

[[rows]]
row = "Naming convention"
rule = "local/use-case-class-name"
path = "src/inbound/use_cases/list_todos/use_case.rs"
edits = [
  { path = "src/inbound/use_cases/list_todos/use_case.rs", find = "pub struct Lister<'a> {", replace = "pub struct ListTodosUseCase<'a> {" },
  { path = "src/inbound/use_cases/list_todos/use_case.rs", find = "impl<'a> Lister<'a> {", replace = "impl<'a> ListTodosUseCase<'a> {" },
  { path = "src/inbound/use_cases/create_todo/use_case.rs", find = "use crate::inbound::use_cases::list_todos::use_case::Lister;", replace = "use crate::inbound::use_cases::list_todos::use_case::ListTodosUseCase;" },
  { path = "src/inbound/use_cases/create_todo/use_case.rs", find = "Lister { store: self.store }", replace = "ListTodosUseCase { store: self.store }" },
  { path = "src/routes/todos/routes.rs", find = "use crate::inbound::use_cases::list_todos::use_case::Lister;", replace = "use crate::inbound::use_cases::list_todos::use_case::ListTodosUseCase;" },
  { path = "src/routes/todos/routes.rs", find = "Lister { store: &store }", replace = "ListTodosUseCase { store: &store }" },
  { path = "tests/inbound/use_cases/list_todos/use_case.rs", find = "use todo_api::inbound::use_cases::list_todos::use_case::Lister;", replace = "use todo_api::inbound::use_cases::list_todos::use_case::ListTodosUseCase;" },
  { path = "tests/inbound/use_cases/list_todos/use_case.rs", find = "Lister { store: &store }", replace = "ListTodosUseCase { store: &store }" },
]

[[rows]]
row = "Import direction"
rule = "local/no-framework-imports"
path = "src/inbound/use_cases/complete_todo/use_case.rs"
line = 2
edits = [
  { path = "src/inbound/use_cases/complete_todo/use_case.rs", find = "use axum::http::StatusCode;\n", replace = "" },
  { path = "src/inbound/use_cases/complete_todo/use_case.rs", find = "Result<Todo, StatusCode>", replace = "Option<Todo>" },
  { path = "src/inbound/use_cases/complete_todo/use_case.rs", find = "self.store.complete(id).ok_or(StatusCode::NOT_FOUND)", replace = "self.store.complete(id)" },
]

[[rows]]
row = "Required tests"
rule = "local/tests-for-sources"
path = "src/domain/user/types.rs"
edits = [
  { path = "tests/domain/user/types.rs", replace = """
use todo_api::domain::user::types::User;

#[test]
fn a_user_keeps_its_id_and_name() {
    let user = User { id: 7, name: "Ann".to_owned() };
    assert_eq!((user.id, user.name.as_str()), (7, "Ann"));
}
""" },
  { path = "tests/lib.rs", find = "        mod types;\n    }\n}\nmod inbound {", replace = "        mod types;\n    }\n    mod user {\n        mod types;\n    }\n}\nmod inbound {" },
]

[[rows]]
row = "Framework conventions"
rule = "local/async-handlers"
path = "src/routes/todos/routes.rs"
line = 12
edits = [
  { path = "src/routes/todos/routes.rs", find = "pub fn count() -> Json<usize> {", replace = "pub async fn count() -> Json<usize> {" },
  { path = "src/main.rs", find = "get(|| async { count() })", replace = "get(count)" },
]

[[rows]]
row = "Complexity limits"
rule = "local/too-many-parameters"
path = "src/domain/todo/titles.rs"
line = 7
edits = [
  { path = "src/domain/todo/titles.rs", find = ", due: &str, tag: &str) -> String {", replace = ", due: &str) -> String {" },
  { path = "src/domain/todo/titles.rs", find = "owner, due, tag].join", replace = "owner, due].join" },
  { path = "tests/domain/todo/titles.rs", find = "describe(\"Buy milk\", true, \"ann\", \"monday\", \"home\")", replace = "describe(\"Buy milk\", true, \"ann\", \"monday\")" },
]

[[rows]]
row = "Dependency graph"
rule = "local/use-case-import-cycles"
path = "src/inbound/use_cases/create_todo/use_case.rs"
line = 2
edits = [
  { path = "src/inbound/use_cases/list_todos/use_case.rs", find = "use crate::inbound::use_cases::create_todo::use_case::CreateTodoUseCase;\n", replace = "" },
  { path = "src/inbound/use_cases/list_todos/use_case.rs", find = "\n\n    pub fn creator(&self) -> CreateTodoUseCase<'a> {\n        CreateTodoUseCase { store: self.store }\n    }", replace = "" },
]

[[rows]]
row = "Banned patterns"
rule = "local/no-todo-comments"
path = "src/main.rs"
line = 5
edits = [{ path = "src/main.rs", find = "// TODO: read the address from the environment (planted: Banned patterns)", replace = "// The address the server listens on." }]

[[rows]]
row = "Duplicate code"
rule = "local/duplicate-function-bodies"
path = "src/domain/todo/titles.rs"
line = 1
edits = [
  { path = "src/inbound/use_cases/create_todo/use_case.rs", find = """
// planted: Duplicate code (a copy of normalise_title)
pub fn normalise_title(title: &str) -> String {
    let trimmed = title.trim();
    let single = trimmed.split_whitespace().collect::<Vec<_>>().join(" ");
    single.to_uppercase()
}

""", replace = "" },
  { path = "src/inbound/use_cases/create_todo/use_case.rs", find = "use crate::domain::todo::ports::TodoStore;", replace = "use crate::domain::todo::ports::TodoStore;\nuse crate::domain::todo::titles::normalise_title;" },
]

[[rows]]
row = "Idiomatic code"
rule = "local/no-wildcard-imports"
path = "src/outbound/todos/adapter.rs"
line = 5
edits = [{ path = "src/outbound/todos/adapter.rs", find = "use crate::domain::todo::types::*;", replace = "use crate::domain::todo::types::Todo;" }]

[[rows]]
row = "Markdown: README sections"
rule = "local/readme-sections"
path = "README.md"
edits = [{ path = "README.md", find = """
Run the tests""", replace = """
## Development

Run the tests""" }]

[[rows]]
row = "TOML: dependencies pinned"
rule = "local/pinned-dependencies"
path = "Cargo.toml"
line = 12
edits = [{ path = "Cargo.toml", find = 'axum = "0.7"', replace = 'axum = "=0.7.9"' }]

[[rows]]
row = "TOML: dependencies in order"
rule = "local/sorted-dependencies"
path = "Cargo.toml"
line = 16
edits = [{ path = "Cargo.toml", find = """
todo-shared = { path = "crates/shared" }
todo-clock = { path = "crates/clock" }
""", replace = """
todo-clock = { path = "crates/clock" }
todo-shared = { path = "crates/shared" }
""" }]
