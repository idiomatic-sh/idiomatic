# The todo API in Rust on axum, one rule, spec or template per row of the Tastemaker README's table. Each row has one
# violation planted in the code and commented `// planted: <row>`, so `tm check` reports each row once.
closed = false
tastemaker = "0.1.3"
workspace = { name = "local", dependencies = [{ package = "local", path = "tastemaker" }] }
rules = [
  { rule = "local/top-level-directories", include = ["."], params = { allowed = [
    "src/**",
    "tests/**",
    "crates/**",
    "tastemaker/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "tastemaker.toml",
    "tastemaker.lock",
    "fixes.toml",
  ] }, description = "No top-level directories except those declared: src, tests, crates and the Tastemaker package." },
  { rule = "local/tests-for-sources", include = ["src", "tests"], description = "Every file in `src/` has a test file at the same place in `tests/`." },
  { rule = "local/async-handlers", include = ["src/routes/*/routes.rs"], description = "Every handler in `routes.rs` is an `async fn`." },
  { rule = "local/too-many-parameters", include = ["src"], params = { max-params = 4 }, description = "No function declares more than 4 parameters." },
  { rule = "local/use-case-import-cycles", include = ["."], description = "No import cycle between the use cases under `inbound/use_cases/`." },
  { rule = "local/no-todo-comments", include = ["src"], description = "No TODO comments." },
  { rule = "local/duplicate-function-bodies", include = ["src"], params = { min-tokens = 10 }, description = "No two functions spell the same body." },
  { rule = "local/no-wildcard-imports", include = ["src"], description = "No `use` imports a module's names with a wildcard." },
  { rule = "local/pinned-dependencies", include = ["Cargo.toml"], description = "Every registry dependency is pinned with `=`." },
  { rule = "local/sorted-dependencies", include = ["Cargo.toml"], description = "Each dependency table is in alphabetical order." },
  { rule = "local/readme-sections", include = ["README.md"], description = "The README has Install, Usage with a fenced code block, and Development, in order." },
]
specs = [
  { spec = "local/use-case", include = ["src/inbound/use_cases/{use-case}"], description = "Each directory in `inbound/use_cases/<use-case>/` contains `use_case.rs`." },
]
