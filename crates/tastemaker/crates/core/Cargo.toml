[package]
name = "idiomatic-sh-tastemaker-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Architecture definition and checking services for Tastemaker"
keywords = ["architecture", "lint", "scaffold", "static-analysis", "conventions"]
categories = ["development-tools"]
autobenches = false

[lib]
name = "tastemaker_core"

[dependencies]
blake3.workspace = true
foldhash.workspace = true
globset.workspace = true
heck.workspace = true
ignore.workspace = true
minijinja.workspace = true
rayon.workspace = true
regex.workspace = true
postcard.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../../ryo/crates/sdk", version = "0.2.0" }

[dev-dependencies]
cargo_metadata.workspace = true
cucumber.workspace = true
divan.workspace = true
tokio.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-tastemaker-core = { path = ".", features = ["fixtures"] }

[[test]]
name = "bdd"
harness = false

[[bench]]
name = "repository"
path = "benches/performance/repository/bench.rs"
harness = false

[[bench]]
name = "scheduler"
path = "benches/performance/scheduler/bench.rs"
harness = false

[[bench]]
name = "analysis"
path = "benches/performance/analysis/bench.rs"
harness = false

[features]
fixtures = []

[lints]
workspace = true
