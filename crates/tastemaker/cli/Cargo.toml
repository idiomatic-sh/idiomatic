[package]
name = "idiomatic-sh-tastemaker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Define, scaffold and check software architecture"
keywords = ["architecture", "lint", "scaffold", "static-analysis", "conventions"]
categories = ["development-tools", "command-line-utilities"]
autobenches = false

[lib]
name = "tastemaker_cli"

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
clap.workspace = true
indicatif.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde-sarif.workspace = true
serde_json.workspace = true
shlex.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
tastemaker_core = { package = "idiomatic-sh-tastemaker-core", path = "../crates/core", version = "0.1.0" }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../ryo/crates/sdk", version = "0.2.0" }
tempfile = { workspace = true, optional = true }
ryo_javascript = { package = "idiomatic-sh-ryo-javascript", path = "../../ryo/languages/javascript", optional = true, version = "0.2.0" }
ryo_json = { package = "idiomatic-sh-ryo-json", path = "../../ryo/languages/json", optional = true, version = "0.2.0" }
ryo_css = { package = "idiomatic-sh-ryo-css", path = "../../ryo/languages/css", optional = true, version = "0.2.0" }
ryo_go = { package = "idiomatic-sh-ryo-go", path = "../../ryo/languages/go", optional = true, version = "0.2.0" }
ryo_html = { package = "idiomatic-sh-ryo-html", path = "../../ryo/languages/html", optional = true, version = "0.2.0" }
ryo_typescript = { package = "idiomatic-sh-ryo-typescript", path = "../../ryo/languages/typescript", optional = true, version = "0.2.0" }
ryo_markdown = { package = "idiomatic-sh-ryo-markdown", path = "../../ryo/languages/markdown", optional = true, version = "0.2.0" }
ryo_python = { package = "idiomatic-sh-ryo-python", path = "../../ryo/languages/python", optional = true, version = "0.2.0" }
ryo_rust = { package = "idiomatic-sh-ryo-rust", path = "../../ryo/languages/rust", optional = true, version = "0.2.0" }
ryo_toml = { package = "idiomatic-sh-ryo-toml", path = "../../ryo/languages/toml", optional = true, version = "0.2.0" }

[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
sha2.workspace = true
ignore.workspace = true
sysinfo.workspace = true
toml.workspace = true
# The crate itself with the language its tests and benches read, so the tests read that language whatever the defaults.
idiomatic-sh-tastemaker = { path = ".", features = ["markdown", "python", "rust", "toml"] }
tastemaker_core = { package = "idiomatic-sh-tastemaker-core", path = "../crates/core", features = ["fixtures"] }
cpu-time.workspace = true
ryo_markdown = { package = "idiomatic-sh-ryo-markdown", path = "../../ryo/languages/markdown" }
ryo_python = { package = "idiomatic-sh-ryo-python", path = "../../ryo/languages/python" }
ryo_rust = { package = "idiomatic-sh-ryo-rust", path = "../../ryo/languages/rust" }
ryo_toml = { package = "idiomatic-sh-ryo-toml", path = "../../ryo/languages/toml" }
snapbox.workspace = true
tempfile.workspace = true
trycmd.workspace = true
shlex.workspace = true

[[bench]]
name = "commands"
path = "benches/performance/main.rs"
harness = false

# One feature for each language this build links. Every language is a default:
# a registry's build or a check names its own set with `--no-default-features --features ...`.
[features]
distribution = []
default = ["css", "go", "html", "javascript", "json", "markdown", "python", "rust", "toml", "typescript"]
fixtures = ["dep:tempfile"]
# A diagnostic build: `--timings=phases` prints the outer phases of a command and when each began and ended (Linux).
phase-diagnostic = []
javascript = ["dep:ryo_javascript"]
json = ["dep:ryo_json"]
css = ["dep:ryo_css"]
go = ["dep:ryo_go"]
html = ["dep:ryo_html"]
typescript = ["dep:ryo_typescript"]
markdown = ["dep:ryo_markdown"]
python = ["dep:ryo_python"]
rust = ["dep:ryo_rust"]
toml = ["dep:ryo_toml"]

[lints]
workspace = true

[[test]]
name = "distribution"
path = "../distribution/smoke_test.rs"
required-features = ["distribution"]
test = false

[[bench]]
name = "distribution"
path = "../distribution/benches/bench.rs"
harness = false
required-features = ["distribution"]
test = false

# cargo-binstall's prebuilt binary: the GitHub Release of the package's own tag, `<package>-v<version>`, holds one archive
# per target, `<package>-<target>.tar.gz` (`.zip` on Windows), with the bare command inside.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
