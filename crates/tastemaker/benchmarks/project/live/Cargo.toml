[package]
name = "tm-project-session"
version = "0.0.0"
edition = "2024"
publish = false

# The Tastemaker benchmark package: the bench `tm` (the product's main with the bench entry points in front). Its own workspace (no lint table applies to benchmark glue); the product crates are
# path dependencies and the patch table below makes every ryo crate the workspace's own, exactly as crates/tastemaker's own workspace does.
[workspace]

[lib]
path = "lib.rs"

[[bin]]
name = "tm"
path = "tm.rs"

[dependencies]
rayon = "1"
ryo_sdk = { package = "idiomatic-sh-ryo-sdk", path = "../../../../ryo/crates/sdk", features = ["bench-hooks"] }
ryo_executor = { package = "idiomatic-sh-ryo-executor", path = "../../../../ryo/crates/executor" }
ryo_css = { package = "idiomatic-sh-ryo-css", path = "../../../../ryo/languages/css" }
ryo_go = { package = "idiomatic-sh-ryo-go", path = "../../../../ryo/languages/go" }
ryo_html = { package = "idiomatic-sh-ryo-html", path = "../../../../ryo/languages/html" }
ryo_json = { package = "idiomatic-sh-ryo-json", path = "../../../../ryo/languages/json" }
ryo_markdown = { package = "idiomatic-sh-ryo-markdown", path = "../../../../ryo/languages/markdown" }
ryo_python = { package = "idiomatic-sh-ryo-python", path = "../../../../ryo/languages/python" }
ryo_rust = { package = "idiomatic-sh-ryo-rust", path = "../../../../ryo/languages/rust" }
ryo_toml = { package = "idiomatic-sh-ryo-toml", path = "../../../../ryo/languages/toml" }
ryo_typescript = { package = "idiomatic-sh-ryo-typescript", path = "../../../../ryo/languages/typescript" }
tastemaker_cli = { package = "idiomatic-sh-tastemaker", path = "../../../cli" }
tastemaker_core = { package = "idiomatic-sh-tastemaker-core", path = "../../../crates/core" }
tastemaker_values = { package = "idiomatic-sh-tastemaker-values", path = "../../../crates/values" }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false, features = ["v2"] }

[target.'cfg(not(any(target_os = "windows", target_os = "openbsd", target_os = "aix", target_os = "android")))'.dependencies]
tikv-jemallocator = { version = "=0.6.1", default-features = false, features = ["background_threads_runtime_support"] }

[patch.crates-io]
idiomatic-sh-ryo-core = { path = "../../../../ryo/crates/core" }
idiomatic-sh-ryo-css = { path = "../../../../ryo/languages/css" }
idiomatic-sh-ryo-go = { path = "../../../../ryo/languages/go" }
idiomatic-sh-ryo-html = { path = "../../../../ryo/languages/html" }
idiomatic-sh-ryo-json = { path = "../../../../ryo/languages/json" }
idiomatic-sh-ryo-language = { path = "../../../../ryo/crates/language" }
idiomatic-sh-ryo-markdown = { path = "../../../../ryo/languages/markdown" }
idiomatic-sh-ryo-python = { path = "../../../../ryo/languages/python" }
idiomatic-sh-ryo-query_language = { path = "../../../../ryo/crates/query_language" }
idiomatic-sh-ryo-rust = { path = "../../../../ryo/languages/rust" }
idiomatic-sh-ryo-sdk = { path = "../../../../ryo/crates/sdk" }
idiomatic-sh-ryo-toml = { path = "../../../../ryo/languages/toml" }
idiomatic-sh-ryo-typescript = { path = "../../../../ryo/languages/typescript" }
idiomatic-sh-ryo-values = { path = "../../../../ryo/crates/values" }

# The images are built with the release's profile: fat LTO, one codegen unit.
[profile.release]
lto = "fat"
codegen-units = 1
