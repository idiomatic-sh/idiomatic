[package]
name = "tm-project-session"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[features]
default = ["vec-glibc", "product-session"]
vec-glibc = []
product-session = []

[dependencies]
release_sdk = { package = "idiomatic-sh-ryo-sdk", version = "=0.1.4", features = ["fixtures"] }
serde = { version = "1", features = ["derive"] }
serde_json = {version="1", features=["raw_value"]}
sha2 = "0.10"
globset = "0.4"
cpu-time = "1"
bumpalo = "3"
regex = "1"
rustc-hash = "2"
smallvec = "1"
unicode-width = "=0.2.2"
toml = "1"
ryo_engine = { package = "idiomatic-sh-ryo-engine", path = "../../../../ryo/crates/engine" }
ryo_execution_domain = { package = "idiomatic-sh-ryo-execution-domain", path = "../../../../ryo/crates/execution_domain" }
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../../../../ryo/crates/language" }
ryo_operators = { package = "idiomatic-sh-ryo-operators", path = "../../../../ryo/crates/operators" }
ryo_query_language = { package = "idiomatic-sh-ryo-query_language", path = "../../../../ryo/crates/query_language" }
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../../../../ryo/crates/relations" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../../../../ryo/crates/values" }
ryo_sdk = { package = "idiomatic-sh-ryo-sdk", path = "../../../../ryo/crates/sdk", features = ["fixtures"] }

release_execution_domain = { package = "idiomatic-sh-ryo-execution-domain", version = "=0.1.4" }
release_language = { package = "idiomatic-sh-ryo-language", version = "=0.1.4" }
release_relations = { package = "idiomatic-sh-ryo-relations", version = "=0.1.4" }
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../../../../ryo/crates/matching" }

ryo_rust = { package = "idiomatic-sh-ryo-rust", path = "../../../../ryo/languages/rust" }
blake3="1"
postcard={version="1",default-features=false,features=["use-std"]}
tempfile="3"
object={version="=0.37.3",default-features=false,features=["read","std"]}
ryo_toml = { package = "idiomatic-sh-ryo-toml", path = "../../../../ryo/languages/toml" }
ryo_json = { package = "idiomatic-sh-ryo-json", path = "../../../../ryo/languages/json" }

[target.'cfg(all(target_os = "linux", any(target_arch = "aarch64", target_arch = "x86_64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemalloc-sys = "0.6.1"
