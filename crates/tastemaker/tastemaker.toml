# crates/tastemaker/tastemaker.toml   (paths are relative to this file's directory)
# Tastemaker is placed by the specs ryo is placed by (tastemaker): two crates, the command line and
# its core, the core a nu-hex. A crate exists only when something outside calls it.
# Distribution policy inputs deliberately include findings and ignore directives; their scenario expectations validate them.
tastemaker = "0.1.2"
workspace = { name = "tastemaker", dependencies = [{ package = "idiomatic.arch", path = "../../tastemaker" }] }
rules = [
  { rule = "idiomatic.arch/no-language-names", params = { languages = ["css", "html", "javascript", "python", "rust", "typescript"], written = ["go", "Go", "Go[!A-Za-z0-9]*", "*[!A-Za-z0-9]Go", "*[!A-Za-z0-9]Go[!A-Za-z0-9]*", "*golang*", "*JavaScript*", "*TypeScript*"] }, include = ["crates/core/src/**", "cli/src/**", "cli/Cargo.toml"], exclude = ["**/*_test.rs", "**/fixtures/**", "**/fixtures.rs", "**/acceptance.rs"], description = "The core names no language and dispatches on no file extension: a language decides its files, and the query names the relations." },
  { rule = "idiomatic.arch/library-surface", include = ["**"], exclude = ["**/tests/fixtures/**"], params = { library = ["ryo", "ryo::*"], surface = ["ryo::query::validate", "ryo::query::validate::*", "ryo::query::ValidateRequest", "ryo::query::ValidateRequest::*", "ryo::query::ValidateError", "ryo::query::ValidateError::*", "ryo::query::RyoQlQuery", "ryo::query::RyoQlQuery::*", "ryo::linter::lint", "ryo::linter::lint::*", "ryo::linter::lint_with", "ryo::linter::lint_with::*", "ryo::linter::Linter", "ryo::linter::Linter::*", "ryo::linter::WorkerPool", "ryo::linter::WorkerPool::*", "ryo::linter::LintRequest", "ryo::linter::LintRequest::*", "ryo::linter::LintReport", "ryo::linter::LintReport::*", "ryo::linter::LintError", "ryo::linter::LintError::*", "ryo::linter::Languages", "ryo::linter::Languages::*", "ryo::languages::Recognition", "ryo::languages::Recognition::*", "ryo::linter::HostDeclaration", "ryo::linter::HostDeclaration::*", "ryo::linter::HostRelation", "ryo::linter::HostRelation::*", "ryo::linter::HostRelationName", "ryo::linter::HostRelationName::*", "ryo::linter::HostColumn", "ryo::linter::HostColumn::*", "ryo::linter::HostColumnName", "ryo::linter::HostColumnName::*", "ryo::linter::HostKind", "ryo::linter::HostKind::*", "ryo::linter::HostRow", "ryo::linter::HostRow::*", "ryo::linter::Cell", "ryo::linter::Cell::*", "ryo::linter::Slot", "ryo::linter::Slot::*", "ryo::linter::HostText", "ryo::linter::HostText::*", "ryo::linter::HostNumber", "ryo::linter::HostNumber::*", "ryo::linter::Cache", "ryo::linter::Cache::*", "ryo::linter::CaseSource", "ryo::linter::CaseSource::*", "ryo::linter::ExecutablePermission", "ryo::linter::ExecutablePermission::*", "ryo::linter::GivenProjectInventory", "ryo::linter::GivenProjectInventory::*", "ryo::linter::ProjectInventoryCompleteness", "ryo::linter::ProjectInventoryCompleteness::*", "ryo::linter::ProjectSearchScope", "ryo::linter::ProjectSearchScope::*", "ryo::linter::RuleApplicability", "ryo::linter::RuleApplicability::*", "ryo::linter::SourceLanguage", "ryo::linter::SourceLanguage::*", "ryo::linter::Corpus", "ryo::linter::Corpus::*", "ryo::linter::FlagState", "ryo::linter::FlagState::*", "ryo::linter::Glob", "ryo::linter::Glob::*", "ryo::linter::MemoryBudget", "ryo::linter::MemoryBudget::*", "ryo::linter::ParameterName", "ryo::linter::ParameterName::*", "ryo::linter::ParameterNumber", "ryo::linter::ParameterNumber::*", "ryo::linter::ParameterNumbers", "ryo::linter::ParameterNumbers::*", "ryo::linter::ParameterText", "ryo::linter::ParameterText::*", "ryo::linter::ParameterTable", "ryo::linter::ParameterTable::*", "ryo::linter::ParameterCell", "ryo::linter::ParameterCell::*", "ryo::linter::ParameterValue", "ryo::linter::ParameterValue::*", "ryo::linter::RelativePath", "ryo::linter::RelativePath::*", "ryo::linter::Rule", "ryo::linter::Rule::*", "ryo::linter::RuleId", "ryo::linter::RuleId::*", "ryo::linter::SourceText", "ryo::linter::SourceText::*", "ryo::linter::Workers", "ryo::linter::Workers::*", "ryo::relation::list", "ryo::relation::list::*", "ryo::relation::describe", "ryo::relation::describe::*", "ryo::relation::DescribeRequest", "ryo::relation::DescribeRequest::*", "ryo::relation::DescribeError", "ryo::relation::DescribeError::*", "ryo::relation::RelationDescription", "ryo::relation::RelationDescription::*", "ryo::relation::Reading", "ryo::relation::Reading::*", "ryo::operator::list", "ryo::operator::list::*", "ryo::operator::describe", "ryo::operator::describe::*", "ryo::operator::DescribeRequest", "ryo::operator::DescribeRequest::*", "ryo::operator::DescribeError", "ryo::operator::DescribeError::*", "ryo::operator::OperatorDescription", "ryo::operator::OperatorDescription::*", "ryo::operator::Requirement", "ryo::operator::Requirement::*", "ryo::query::describe", "ryo::query::describe::*", "ryo::query::DescribeReport", "ryo::query::DescribeReport::*", "ryo::query::RelationName", "ryo::query::RelationName::*", "ryo::query::OperatorName", "ryo::query::OperatorName::*"] }, description = "tastemaker names of ryo the two calls and what they take and give (goal 4): `ryo::query::validate` and `ryo::linter::lint` (or `lint_with` over one `Linter` built by `Linter::new` on the run's `WorkerPool`, its memory budget and its cache), with their requests, reports, errors and the languages handed to them; and, for `explain` and `list`, the catalog calls `ryo::relation::{list, describe}`, `ryo::operator::{list, describe}` and `ryo::query::describe`." },
]
templates = [
  { template = "idiomatic.arch/unchecked", file = "crates/core/LICENSE", description = "A link to the repository's LICENSE, the license text the crate ships: a path, never followed." },
  { template = "idiomatic.arch/unchecked", file = "distribution/registries/pypi/LICENSE", description = "A link to the repository's LICENSE, the license text the PyPI package ships: a path, never followed." },
  { template = "idiomatic.arch/clippy-config", file = "clippy.toml", description = "The product's clippy configuration: the in-tests allowances that go with the restriction lints at deny." },
  { template = "idiomatic.arch/cargo-workspace", file = "Cargo.toml", params = { version = "0.1.2" }, description = "The product's Cargo workspace: its two crates as members, the shared dependencies and the lints every crate inherits." },
  { template = "idiomatic.arch/cargo-lock", file = "Cargo.lock", description = "The product's Cargo.lock, committed so every build resolves the same dependencies." },
  { template = "idiomatic.arch/unchecked", file = "release-plz.toml", description = "The release pull request's configuration: release-plz opens it, every crate at the workspace's new version and the changelog, and nothing else." },
  { template = "idiomatic.arch/unchecked", file = "CHANGELOG.md", count = { min = 0 }, description = "The product's changelog, which each release pull request writes: absent until the first." },
  { template = "idiomatic.arch/tastemaker-lock", file = "tastemaker.lock", description = "This file's lock: the definition versions the product resolved." },
  { template = "idiomatic.arch/product-readme", file = "README.md", params = { product = "tastemaker" }, description = "The product's README: what it is for, how to install it and one checked command line example." },
  { template = "idiomatic.arch/deny-config", file = "deny.toml", description = "The product's cargo-deny policy for licenses, bans and sources." },
  { template = "idiomatic.arch/mutants-config", file = ".cargo/mutants.toml", description = "The product's cargo-mutants configuration." },
  { template = "idiomatic.arch/nextest-config", file = ".config/nextest.toml", description = "The product's cargo-nextest configuration." },
  { template = "idiomatic.arch/asymptote-config", file = "asymptote.toml", description = "The tools whose findings the product's asymptote lock ratchets." },
  { template = "idiomatic.arch/asymptote-lock", file = ".asymptote/operations/{operation}.lock", count = { min = 0 }, description = "One of the lock files asymptote writes: the findings accepted for one operation." },
  { template = "idiomatic.arch/doc-page", file = "docs/{*page}", description = "A design page of the product." },
]
specs = [
  { spec = "idiomatic.arch/pipeline", include = ["crates/core/src/inbound/use_cases/check"], description = "Retained work preserves source freshness, bounded resource lifetimes and exact serial/parallel outcomes." },
  { spec = "idiomatic.arch/pipeline", include = ["crates/core/src/inbound/use_cases/validate"], description = "Retained work preserves source freshness, bounded resource lifetimes and exact serial/parallel outcomes." },
  { alias = "cli-crate", spec = "idiomatic.arch/crate", include = ["cli"], params = { package = "idiomatic-sh-tastemaker", library = "tastemaker_cli", binary = "tm", distribution = "shipped" }, description = "The command line's crate, package `idiomatic-sh-tastemaker`, binary `tm`, library `tastemaker_cli`." },
  { spec = "idiomatic.arch/cli", include = ["cli"], params = { library = "tastemaker_cli", markdown = "offered", product = "tm", writes = ["workspace init", "workspace add", "workspace create", "workspace scaffold", "workspace update", "workspace explain"] }, description = "The command line's shell: main, the command tree of the one resource `workspace`, the output module and the command benches." },
  { alias = "crate-core", spec = "idiomatic.arch/crate", include = ["crates/core"], params = { package = "idiomatic-sh-tastemaker-core", library = "tastemaker_core", binary = "absent", distribution = "absent" }, description = "The `core` crate: package `idiomatic-sh-tastemaker-core`, library `tastemaker_core`." },
  { spec = "idiomatic.arch/nu-hex", include = ["crates/core"], params = { exposed = [], plugins = [], implements = [], item-trait = "absent" }, description = "tastemaker's core: one use case per command, the rules it places by, and the ports it reaches ryo, the disk and its store through, each with its adapters." },
  { spec = "idiomatic.arch/idiomatic-rust", include = ["."], params = { test-contracts = [], apart = "languages", allowed-paths = ["**/constants.rs", "**/errors.rs", "**/schemas.rs", "cli/src/**", "**/*_test.rs", "**/src/inbound/use_cases/*/acceptance.rs", "**/tests/**", "**/fixtures/**", "**/fixtures.rs", "**/benches/**"], libraries = ["globset::*", "regex::*", "minijinja::*", "toml::*", "toml_edit::*", "blake3::*", "postcard::*", "ignore::*", "heck::*", "tempfile::*", "serde_sarif::*", "ryo::*"] }, description = "The Rust policy rules every product that writes Rust places once." },
  { spec = "idiomatic.arch/idiomatic-project", include = ["."], description = "The rules every product of the monorepo is held to: file length, catch-all names, the Cargo workspace and no tab-separated tables." },
  { spec = "idiomatic.arch/distribution", include = ["distribution"], params = { check = "check --format json", configuration = "tastemaker.toml", languages = "linked", organization = "idiomatic_sh", command = "tm", product = "tastemaker" }, description = "A product's `distribution` directory, beside its command line crate: the root of the `distribution` test target that crate's manifest declares, the check that holds a build's findings on real projects to the expected ones, the `distribution` bench that measures those projects and prints Bencher Metric Format, and one directory per registry under `registries`, each holding that registry's build, its package files, its targets (pinned real projects) and the smoke test that installs the package and gives the install its targets are checked through. Every product ships to Cargo; a product that places npm's package file and PyPI's project file ships to those too, and one that places neither ships to Cargo alone." },
]
