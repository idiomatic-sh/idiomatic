
# What tastemaker checks this target with: a run places this file in the project's directory, under tastemaker's own name for it.
workspace = { name = "hono-distribution", dependencies = [{ package = "idiomatic.arch", path = ".policy" }, { package = "idiomatic.benchmarks", path = ".benchmarks" }] }
closed = false
rules = [
  { rule = "idiomatic.benchmarks/empty-else", include = ["**"] },
  { rule = "idiomatic.benchmarks/long-function", include = ["**"], params = { max-lines = 100 } },
  { rule = "idiomatic.benchmarks/match-on-bool", include = ["**"] },
  { rule = "idiomatic.benchmarks/too-many-parameters", include = ["**"], params = { max-parameters = 7 } },
  { rule = "idiomatic.benchmarks/unseparated-literals", include = ["**"] },
]
