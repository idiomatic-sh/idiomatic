[workspace]
members = ["cargo:../../../cli"]

[dist]
cargo-dist-version = "0.33.0"
dist = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin"]
source-tarball = false
unix-archive = ".tar.gz"
windows-archive = ".zip"
# The languages npm's build links: a language is added here, in this one place.
default-features = false
features = ["css", "go", "html", "javascript", "json", "markdown", "python", "rust", "toml", "typescript"]
