[[tools]]
id = "cargo-fmt"
group = "lint"
run = ["cargo", "fmt", "--all", "--", "--check"]
fix = ["cargo", "fmt", "--all"]
timeout-seconds = 300
inputs = [".", "../../rustfmt.toml", "../../rust-toolchain.toml"]

[[tools]]
id = "tastemaker"
group = "lint"
# ryo's gate is Tastemaker, built from this checkout's crates/tastemaker and the crates/ryo it links.
run = ["tm", "check", "--format", "sarif"]
output = "sarif"
timeout-seconds = 1800
inputs = [".", "../tastemaker", "../../tastemaker"]

[[tools]]
id = "cargo-machete"
group = "lint"
run = ["bash", "-c", "set -o pipefail; cargo metadata --no-deps --locked --format-version 1 | jq -j '.packages[].manifest_path + \"\\u0000\"' | xargs -0 -r cargo-machete --with-metadata"]
timeout-seconds = 1800

[[tools]]
id = "cargo-deny"
group = "lint"
run = ["cargo-deny", "check", "bans", "licenses", "sources"]
timeout-seconds = 1800

[[tools]]
id = "cargo-clippy"
group = "check"
# Every clippy and compiler warning is a SARIF result the lock ratchets (clippy-sarif,
# pinned in Cargo.toml); a compile error or a denied lint fails the run, never clean.
run = ["bash", "-c", "set -o pipefail; clippy-sarif --version </dev/null >&2 && CARGO_BUILD_JOBS=6 cargo clippy --workspace --all-targets --all-features --locked --message-format=json | clippy-sarif"]
output = "sarif"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "sdk-api"
group = "check"
# The SDK's public API under [workspace.metadata.api]: what it leaks, what it records and what it breaks; a product that names none passes.
run = ["uv", "run", "../../ci/scripts/checks/sdk_api.py"]
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo", "../../ci/scripts/checks"]

[[tools]]
id = "test-core"
group = "check"
# The core crates' tests, every feature on: each test tool builds the workspace once, as the others do, and runs the
# packages its filter names, so its run is kept while its own inputs did not move. The BDD runners and the doctests,
# which nextest cannot list, run in `test-bdd` and `test-doc`.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo-core) | package(=idiomatic-sh-ryo-language) | package(=idiomatic-sh-ryo-query_language) | package(=idiomatic-sh-ryo-sdk) | package(=idiomatic-sh-ryo-values)"]
timeout-seconds = 3600
inputs = ["Cargo.toml", "Cargo.lock", ".config", "crates", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-language"
group = "check"
# Each language's tests, one tool per directory of `languages`, so an edit in one language reruns its tool alone. A
# language reaches crates/language and every other crate through crates/sdk, so all of them are its inputs.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo-{lang})"]
timeout-seconds = 3600
inputs = ["Cargo.toml", "Cargo.lock", ".config", "languages/{lang}", "crates/language", "crates/sdk", "crates/core", "crates/query_language", "crates/values", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-cli"
group = "check"
# The command line's tests: it links every crate of the product, so the product is its input.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo)"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-bdd"
group = "check"
# The cucumber runners (`tests/bdd.rs`, `harness = false`), which nextest's default filter leaves out.
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--test", "bdd"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-doc"
group = "check"
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--doc"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-doc"
group = "check"
# The rustdoc lints of `[workspace.lints.rustdoc]`: only a documentation build reports them.
run = ["cargo", "doc", "--workspace", "--no-deps", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-clippy-default"
group = "release"
# The same, with the default features: code a feature turns off is compiled and linted as a user builds it.
run = ["bash", "-c", "set -o pipefail; clippy-sarif --version </dev/null >&2 && CARGO_BUILD_JOBS=6 cargo clippy --workspace --all-targets --locked --message-format=json | clippy-sarif"]
output = "sarif"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-default"
group = "release"
# Tests are strictly pass or fail: no lock holds a failing test. nextest runs every libtest target; the BDD runners and the
# doctests, which it cannot list, run in `test-bdd` and `test-doc`.
run = ["cargo", "nextest", "run", "--workspace", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-hack"
group = "release"
# Each package with no features, each feature alone and the default: one of the slowest checks, so CI's.
run = ["cargo", "hack", "check", "--workspace", "--each-feature", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-dylint"
group = "release"
run = ["cargo", "dylint", "--path", "../../tools/lints", "--workspace", "--", "--all-targets", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tools/lints", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "coverage"
group = "release"
# Line coverage, a report with no threshold: the run fails only when a test does.
run = ["cargo", "llvm-cov", "--workspace", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-msrv"
group = "release"
# The declared `rust-version` checks the whole workspace: cargo-msrv reads it from the command line crate, the one every product has.
run = ["cargo", "msrv", "verify", "--path", "cli", "--output-format", "minimal", "--", "cargo", "check", "--workspace", "--all-targets", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-distribution"
group = "release"
# The `distribution` test target's findings: each target checked through the crate installed with its registry's languages.
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--test", "distribution", "--", "target_test::", "targets_have_their_findings", "every_registry_is_declared"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "release-smoke"
group = "release"
# Each registry's package is built from the crate, installed in a scratch directory and run. Only the release workflow runs the `release` group.
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--test", "distribution", "--", "cargo::", "npm::", "pypi::"]
timeout-seconds = 7200
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "fresh-resolution"
group = "release"
# Each published crate packaged without the workspace's Cargo.lock and built from its package: its dependencies resolve
# fresh, as a user's `cargo install` or `cargo add` resolves them, so a crate that builds only against our lock is caught.
run = ["cargo", "package", "--workspace", "--exclude-lockfile"]
timeout-seconds = 7200
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance"
group = "perf"
# The benches print the Bencher Metric Format: the lock holds each measure's best and asymptote judges against it.
run = ["cargo", "bench", "--locked", "--workspace", "--bench", "commands"]
output = "bmf"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance-distribution"
group = "perf"
# The `distribution` bench: each registry's targets through the installed command, cold, warm and after an edit.
run = ["cargo", "bench", "--locked", "--workspace", "--all-features", "--bench", "distribution"]
output = "bmf"
timeout-seconds = 7200
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance-lint"
group = "perf"
# ryo's cost over ruff on the same target: the medians of five rounds (cold) and three (the rest), with an equal page cache; run it on a quiet machine.
run = ["cargo", "bench", "--locked", "--workspace", "--bench", "lint"]
output = "bmf"
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "build"
group = "build"
# Compiles what the `check` group's tools compile, as they compile it, so that CI builds once per machine and every group's job
# reuses the build from the cache this job saves: clippy's analysis, the test targets nextest and `cargo test` run, and the docs.
run = ["bash", "-c", "set -e; cargo clippy --workspace --all-targets --all-features --locked; cargo test --workspace --locked --all-features --no-run; cargo doc --workspace --no-deps --all-features --locked"]
timeout-seconds = 7200
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]
