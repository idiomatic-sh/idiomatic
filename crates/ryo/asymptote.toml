[[tools]]
id = "cargo-fmt"
group = "lint"
run = ["cargo", "fmt", "--all", "--", "--check"]
fix = ["cargo", "fmt", "--all"]
timeout-seconds = 300
inputs = [".", "../../rustfmt.toml", "../../rust-toolchain.toml"]

[[tools]]
id = "tastemaker"
group = "lint"
# ryo's gate is Tastemaker, the release the root's tastemaker.toml pins.
run = ["tm", "check", "--format", "sarif"]
output = "sarif"
timeout-seconds = 1800
inputs = [".", "../../tastemaker"]

[[tools]]
id = "cargo-machete"
group = "lint"
run = ["bash", "-c", "set -o pipefail; cargo metadata --no-deps --locked --format-version 1 | jq -j '.packages[].manifest_path + \"\\u0000\"' | xargs -0 -r cargo-machete --with-metadata"]
timeout-seconds = 1800

[[tools]]
id = "cargo-deny"
group = "lint"
run = ["cargo-deny", "check", "bans", "licenses", "sources"]
timeout-seconds = 1800

[[tools]]
id = "cargo-clippy"
group = "clippy"
# Every clippy and compiler warning is a SARIF result the lock ratchets (clippy-sarif,
# pinned in Cargo.toml); a denied lint is capped to a warning so the lock decides (a finding the lock
# does not hold fails), and a compile error still fails the run, never clean.
run = ["bash", "-c", "set -o pipefail; clippy-sarif --version </dev/null >&2 && CARGO_BUILD_JOBS=6 cargo clippy --workspace --all-targets --all-features --locked --message-format=json -- --cap-lints warn | python3 ../../ci/scripts/checks/cargo_diagnostics.py | clippy-sarif"]
output = "sarif"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "sdk-api"
group = "api"
# The SDK's public API under [workspace.metadata.api]: what it leaks, what it records and what it breaks; a product that names none passes.
run = ["uv", "run", "../../ci/scripts/checks/sdk_api.py"]
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo", "../../ci/scripts/checks"]

[[tools]]
id = "test-core"
group = "check"
# The core crates' tests, every feature on: each test tool builds the workspace once, as the others do, and runs the
# packages its filter names, so its run is kept while its own inputs did not move. The BDD runners and the doctests,
# which nextest cannot list, run in `test-bdd` and `test-doc`.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo-core) | package(=idiomatic-sh-ryo-language) | package(=idiomatic-sh-ryo-query_language) | package(=idiomatic-sh-ryo-sdk) | package(=idiomatic-sh-ryo-values) | package(=idiomatic-sh-ryo-benchmark)"]
timeout-seconds = 3600
inputs = ["Cargo.toml", "Cargo.lock", ".config", "crates", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-cli"
group = "check"
# The command line's tests: it links every crate of the product, so the product is its input.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo) and not test(/^peak::/)"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-bdd"
group = "check"
# The cucumber runners (`tests/bdd.rs`, `harness = false`), which nextest's default filter leaves out.
run = ["bash", "-c", "mkdir -p target/checks/bdd; set +e; cargo test --workspace --locked --all-features --test bdd > target/checks/bdd/stdout.log 2> target/checks/bdd/stderr.log; tool_status=$?; cat target/checks/bdd/stdout.log; cat target/checks/bdd/stderr.log >&2; printf '%s\\n' \"$tool_status\" > target/checks/bdd/status; exit \"$tool_status\""]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-doc"
group = "check"
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--doc"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-doc"
group = "check"
# The rustdoc lints of `[workspace.lints.rustdoc]`: only a documentation build reports them.
run = ["cargo", "doc", "--workspace", "--no-deps", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-clippy-default"
group = "release-clippy"
# The same, with the default features: code a feature turns off is compiled and linted as a user builds it.
run = ["bash", "-c", "set -o pipefail; clippy-sarif --version </dev/null >&2 && CARGO_BUILD_JOBS=6 cargo clippy --workspace --all-targets --locked --message-format=json -- --cap-lints warn | clippy-sarif"]
output = "sarif"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-default"
group = "release-tests"
# Tests are strictly pass or fail: no lock holds a failing test. nextest runs every libtest target; the BDD runners and the
# doctests, which it cannot list, run in `test-bdd` and `test-doc`. The warm run's memory peak is measured in `peak`, in the
# perf group, and does not gate a release until it holds its bound on every runner.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "-E", "not test(/^peak::/)"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-hack"
group = "release-hack"
# Each package with no features, each feature alone and the default: one of the slowest checks, so CI's.
run = ["cargo", "hack", "check", "--workspace", "--each-feature", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-dylint"
group = "release-dylint"
run = ["cargo", "dylint", "--path", "../../tools/lints", "--workspace", "--", "--all-targets", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tools/lints", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "coverage"
group = "release-coverage"
# Line coverage, a report with no threshold: the run fails only when a test does.
run = ["cargo", "llvm-cov", "--workspace", "--all-features", "--locked", "--", "--skip", "peak::"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-msrv"
group = "release-msrv"
# The declared `rust-version` checks the whole workspace: cargo-msrv reads it from the command line crate, the one every product has.
run = ["cargo", "msrv", "verify", "--path", "cli", "--output-format", "minimal", "--", "cargo", "check", "--workspace", "--all-targets", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-distribution"
group = "release-tests"
# The `distribution` test target's findings: each target checked through the crate installed with its registry's languages.
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--test", "distribution", "--", "target_test::", "targets_have_their_findings", "every_registry_is_declared"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "release-smoke"
group = "release-tests"
# Each registry's package is built from the crate, installed in a scratch directory and run. Only the release workflow runs the `release-*` groups.
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--test", "distribution", "--", "cargo::", "npm::", "pypi::"]
timeout-seconds = 7200
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "fresh-resolution"
group = "release-resolution"
# Each published crate packaged without the workspace's Cargo.lock and built from its package: its dependencies resolve
# fresh, as a user's `cargo install` or `cargo add` resolves them, so a crate that builds only against our lock is caught.
run = ["cargo", "package", "--workspace", "--exclude-lockfile"]
timeout-seconds = 7200
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance"
group = "perf"
# The benches print the Bencher Metric Format: the lock holds each measure's best and asymptote judges against it.
run = ["cargo", "bench", "--locked", "--workspace", "--bench", "commands"]
output = "bmf"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance-distribution"
group = "perf"
# The `distribution` bench: each registry's targets through the installed command, cold, warm and after an edit.
run = ["cargo", "bench", "--locked", "--workspace", "--all-features", "--bench", "distribution"]
output = "bmf"
timeout-seconds = 7200
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-language"
group = "check"
# Each language's tests, one tool per directory of `languages`, so an edit in one language reruns its tool alone. A
# language reaches crates/language and every other crate through crates/sdk, so all of them are its inputs.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo-{lang})"]
timeout-seconds = 3600
inputs = ["Cargo.toml", "Cargo.lock", ".config", "languages/{lang}", "crates/language", "crates/sdk", "crates/core", "crates/query_language", "crates/values", "crates/benchmark", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "correctness-python-ruff"
group = "check"
# All 104 native query assets retain their 2,211 authored cases under explicitly declared
# singleton selections. The full combined candidate cohort stays a separate tool; no
# reference arrays are rewritten and every staged execution identity is recorded.
run = ["python3", "-c", "import os, shutil, subprocess, sys\nfrom pathlib import Path\nexecutable = shutil.which('ruff')\nif executable is None:\n    sys.exit('pinned Ruff executable is missing')\nhelper = Path('languages/python/benchmarks/linters/ruff/verify_profiles.py').resolve()\nguards = subprocess.run([sys.executable, str(helper), '--self-test-native-standalone'])\nif guards.returncode:\n    sys.exit(guards.returncode)\noutput = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / ('ruff-native-standalone-' + os.environ.get('GITHUB_RUN_ID', 'local') + '-' + str(os.getpid()))\nenvironment = {**os.environ, 'CARGO_BUILD_JOBS': '6'}\nsys.exit(subprocess.run([sys.executable, str(helper), executable, '--native-standalone', '--output-dir', str(output)], env=environment).returncode)"]
timeout-seconds = 3600
inputs = ["Cargo.toml", "Cargo.lock", "languages/python", "crates/benchmark", "crates/sdk", "crates/core", "crates/language", "crates/query_language", "crates/values", "../../tools/install.py", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "correctness-python-ruff-candidates"
group = "ruff-candidates"
# This job checks authoring guards and optimized Python release behavior. The dedicated
# ruff-all-defaults CI job owns strict 413-rule verification and its receipts.
run = ["python3", "-c", "import os, shutil, subprocess, sys\nfrom pathlib import Path\nexecutable = shutil.which('ruff')\nif executable is None:\n    sys.exit('pinned Ruff executable is missing')\nhelper = Path('languages/python/benchmarks/linters/ruff/verify_profiles.py').resolve()\nself_test = subprocess.run([sys.executable, str(helper), '--self-test'])\nif self_test.returncode:\n    sys.exit(self_test.returncode)\nrelease_tests = [\n    ['cargo', 'test', '--release', '--locked', '-p', 'idiomatic-sh-ryo-python', '--lib', 'boolean_parser_payload_is_written_in_optimized_builds'],\n]\nenvironment = {**os.environ, 'CARGO_BUILD_JOBS': '6'}\nfor command in release_tests:\n    result = subprocess.run(command, env=environment)\n    if result.returncode:\n        sys.exit(result.returncode)\nsys.exit(0)"]
timeout-seconds = 3600
inputs = ["Cargo.toml", "Cargo.lock", "languages/python", "crates/benchmark", "crates/sdk", "crates/core", "crates/language", "crates/query_language", "crates/values", "../../tools/install.py", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "peak"
group = "perf"
# The warm run's memory peak over ruff, held to its bound (`cli/tests/replay/peak.rs`): measured here, apart from the release's
# tests, until it holds its bound on every runner.
run = ["cargo", "nextest", "run", "--package", "idiomatic-sh-ryo", "--locked", "-E", "test(/^peak::/)"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance-lint"
group = "perf"
# ryo's cost over ruff on the same target: the medians of five rounds (cold) and three (the rest), with an equal page cache; run it on a quiet machine.
run = ["cargo", "bench", "--locked", "--workspace", "--bench", "lint"]
output = "bmf"
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "build"
group = "build"
# Compile reusable test/doc artifacts before independent quality and speed jobs.
# Clippy remains mandatory in its quality group; denied style findings do not gate Rust speed execution.
run = ["bash", "-c", "set -eo pipefail; mkdir -p target/checks/build; cargo check --workspace --all-targets --all-features --locked 2>&1 | tee target/checks/build/compile.log; cargo test --workspace --locked --all-features --no-run 2>&1 | tee target/checks/build/test.log; cargo doc --workspace --no-deps --all-features --locked 2>&1 | tee target/checks/build/doc.log"]
timeout-seconds = 7200
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance-python-ruff"
group = "perf"
# Complete default disposition accounting and case certification precede every run.
# Both contestants select the complete immutable configured inventory (all413 Ruff defaults). Missing
# tools, mismatched pins and unassessed defaults are failures, never skipped work.
run = ["bash", "-o", "pipefail", "-c", "set -euo pipefail\nmkdir -p target/benchmark/python\ncargo build --locked --release -p idiomatic-sh-ryo-benchmark --bin ryo-benchmark-collector --message-format=json > target/benchmark/python/collector-build.jsonl\npython3 ../../.github/scripts/seal_cargo_artifact.py target/benchmark/python/collector-build.jsonl ryo-benchmark-collector bin /crates/benchmark/src/main.rs false target/benchmark/python/collector\ncargo bench --no-run --locked -p idiomatic-sh-ryo-python-ruff-benchmark --bench ruff --message-format=json > target/benchmark/python/worker-build.jsonl\npython3 ../../.github/scripts/seal_cargo_artifact.py target/benchmark/python/worker-build.jsonl ruff bench /languages/python/benchmarks/linters/ruff/bench.rs true target/benchmark/python/worker\nproof=\"$(mktemp -d target/benchmark/python/cases.XXXXXX)\"\n# Source preparation requires a fresh destination; the shared Rust runner owns execution.\nrmdir \"$proof\"\npython3 languages/python/benchmarks/linters/ruff/verify_profiles.py \"$(command -v ruff)\" --full-inventory --prepare-inventory --worker \"$PWD/target/benchmark/python/worker\" --output-dir \"$PWD/$proof\"\n{ target/benchmark/python/worker measure-valid \"$(command -v ruff)\" target/benchmark/python/state \"$PWD/target/benchmark/python/collector\" \"--case-inventory=$PWD/$proof/registration.json\" 2>&1 1>&3 | tee target/benchmark/python/observations.log >&2; } 3>&1 | tee target/benchmark/python/measurements.json"]
output = "bmf"
timeout-seconds = 14400
inputs = [".", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance-python-ruff-parity"
group = "perf"
# Every rule the committed Ruff profile configures (benchmark.toml defaults, all 413) runs in ryo and in the pinned Ruff over the whole
# Django corpus, compared finding by finding through the shared benchmark runner; a request selecting any other rule set is refused.
# The corpus stays outside the repository: its pinned run-ryo request is placed (or linked) at
# target/benchmark/python/django/cold-request.json, and the digest docs/contracts/evidence/parity/django-413/accepted-differences.json
# names ties the run to it. The measures are the rules that differ and the differences that file does not accept; target/benchmark/python/parity/per-rule.json
# holds each rule's row.
run = ["bash", "-o", "pipefail", "-c", "set -euo pipefail\nout=target/benchmark/python/parity\nrm -rf \"$out\"\nmkdir -p \"$out\"\ncargo bench --no-run --locked -p idiomatic-sh-ryo-python-ruff-benchmark --bench ruff --message-format=json > \"$out/worker-build.jsonl\"\npython3 ../../.github/scripts/seal_cargo_artifact.py \"$out/worker-build.jsonl\" ruff bench /languages/python/benchmarks/linters/ruff/bench.rs true \"$out/worker\" >&2\npython3 languages/python/benchmarks/linters/ruff/verify_profiles.py --stage-request target/benchmark/python/django/cold-request.json --output-dir \"$PWD/$out/stage\" >&2\n\"$out/worker\" parity \"$(command -v ruff)\" \"$PWD/$out/worker\" \"$PWD/$out/stage/request.json\" docs/contracts/evidence/parity/django-413/accepted-differences.json \"$out/per-rule.json\""]
output = "bmf"
timeout-seconds = 7200
inputs = [".", "../../rust-toolchain.toml", "../../.cargo"]
