[[tools]]
id = "cargo-fmt"
group = "lint"
run = ["cargo", "fmt", "--all", "--", "--check"]
fix = ["cargo", "fmt", "--all"]
timeout-seconds = 300
inputs = [".", "../../rustfmt.toml", "../../rust-toolchain.toml"]

[[tools]]
id = "tastemaker"
group = "lint"
# ryo's gate is Tastemaker, the release the root's tastemaker.toml pins.
# `tm check` reads every tastemaker.lock of the repository (a version no lock reads is refused), so the whole tree is its input.
run = ["tm", "check", "--format", "sarif"]
output = "sarif"
timeout-seconds = 1800
inputs = [".", "../../tastemaker", "../.."]

[[tools]]
id = "cargo-machete"
group = "lint"
# Every member's unused dependencies, as tastemaker's and asymptote's lint groups find theirs. Without `--with-metadata`: with it,
# cargo-machete 0.9.2 reports the `dhat` of every language's harness-less allocation test and a crate's own fixtures
# dev-dependency as unused, which the source names.
run = ["bash", "-c", "set -o pipefail; cargo metadata --no-deps --locked --format-version 1 | jq -j '.packages[].manifest_path + \"\\u0000\"' | xargs -0 -r cargo-machete"]
timeout-seconds = 1800

[[tools]]
id = "cargo-deny"
group = "lint"
run = ["cargo-deny", "check", "bans", "licenses", "sources"]
timeout-seconds = 1800

[[tools]]
id = "cargo-clippy"
group = "clippy"
# Every clippy and compiler warning is a SARIF result the lock ratchets (clippy-sarif,
# pinned in Cargo.toml); a denied lint is capped to a warning so the lock decides (a finding the lock
# does not hold fails), and a compile error still fails the run, never clean.
run = ["bash", "-c", "set -o pipefail; clippy-sarif --version </dev/null >&2 && CARGO_BUILD_JOBS=6 cargo clippy --workspace --all-targets --all-features --locked --message-format=json -- --cap-lints warn | python3 ../../ci/scripts/checks/cargo_diagnostics.py | clippy-sarif"]
output = "sarif"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo", "../../ci/scripts/checks/cargo_diagnostics.py"]

[[tools]]
id = "sdk-api"
group = "api"
# The SDK's public API under [workspace.metadata.api]: what it leaks, what it records and what it breaks; a product that names none passes.
run = ["uv", "run", "../../ci/scripts/checks/sdk_api.py"]
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo", "../../ci/scripts/checks"]

[[tools]]
id = "test-core"
group = "check"
# The tests of every package under crates/, every feature on. `--workspace` builds every member whatever the filter names, so
# the inputs are the whole workspace (`.`), with what ryo's tests read beyond it (../tastemaker, ../../tastemaker) and the
# template's entries first. Every test tool of ryo names the same: inputs are coarse and safe. The BDD runners and the doctests,
# which nextest cannot list, run in `test-bdd` and `test-doc`.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo-core) | package(=idiomatic-sh-ryo-language) | package(=idiomatic-sh-ryo-query_language) | package(=idiomatic-sh-ryo-sdk) | package(=idiomatic-sh-ryo-values) | package(=idiomatic-sh-ryo-benchmark) | package(=idiomatic-sh-ryo-benchmark-contracts) | package(=idiomatic-sh-ryo-derived) | package(=idiomatic-sh-ryo-execution) | package(=idiomatic-sh-ryo-execution-domain) | package(=idiomatic-sh-ryo-execution-runtime) | package(=idiomatic-sh-ryo-matching) | package(=idiomatic-sh-ryo-operators) | package(=idiomatic-sh-ryo-relations)"]
timeout-seconds = 3600
inputs = ["Cargo.toml", "Cargo.lock", ".config", "crates", "../../rust-toolchain.toml", "../../.cargo", "../../tastemaker", ".", "../tastemaker"]

[[tools]]
id = "test-cli"
group = "check"
# The command line's tests: it links every crate of the product, so the product is its input.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo)"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker"]

[[tools]]
id = "test-bdd"
group = "check"
# The cucumber runners (`tests/bdd.rs`, `harness = false`), which nextest's default filter leaves out.
run = ["bash", "-c", "mkdir -p target/checks/bdd; set +e; cargo test --workspace --locked --all-features --test bdd > target/checks/bdd/stdout.log 2> target/checks/bdd/stderr.log; tool_status=$?; cat target/checks/bdd/stdout.log; cat target/checks/bdd/stderr.log >&2; printf '%s\\n' \"$tool_status\" > target/checks/bdd/status; exit \"$tool_status\""]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker"]

[[tools]]
id = "test-doc"
group = "check"
# On the nightly `[workspace.metadata.api] nightly` of Cargo.toml pins: only a nightly rustdoc checks the error code of a
# `compile_fail,E0…` doctest, and on stable such a doctest passes for any error, so a renamed field or a wrong code proves nothing.
run = ["bash", "-c", "set -e; nightly=$(python3 -c 'import tomllib; print(tomllib.load(open(\"Cargo.toml\", \"rb\"))[\"workspace\"][\"metadata\"][\"api\"][\"nightly\"])'); cargo \"+$nightly\" test --workspace --locked --all-features --doc"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker"]

[[tools]]
id = "cargo-doc"
group = "check"
# The rustdoc lints of `[workspace.lints.rustdoc]`: only a documentation build reports them.
run = ["cargo", "doc", "--workspace", "--no-deps", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-boundary-contract"
group = "check"
# The execution crate's boundary contract suite, its ignored tests too: it fails when the suite lists no test.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "--no-tests=fail", "--run-ignored", "all", "-E", "package(=idiomatic-sh-ryo-execution) & kind(test) & binary(=boundary_contract)"]
timeout-seconds = 3600
inputs = [".", "../tastemaker", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-execution-use-case"
group = "check"
# The execution use case's tests in the execution crate's lib, its ignored tests too: it fails when none is listed.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "--no-tests=fail", "--run-ignored", "all", "-E", "package(=idiomatic-sh-ryo-execution) & kind(lib) & test(/^inbound::use_cases::execution::/)"]
timeout-seconds = 3600
inputs = [".", "../tastemaker", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-operators-doc"
group = "check"
# The operators crate's doctests exist: test-doc runs them on nightly; this fails when none is listed. The listing is read whole
# before grep looks in it: `grep -q` quits at its first match, and the rustdoc still writing the list would fail on the closed pipe.
run = ["bash", "-c", "set -euo pipefail; nightly=$(python3 -c 'import tomllib; print(tomllib.load(open(\"Cargo.toml\", \"rb\"))[\"workspace\"][\"metadata\"][\"api\"][\"nightly\"])'); listing=$(cargo \"+$nightly\" test --locked --all-features -p idiomatic-sh-ryo-operators --doc -- --list); grep -Eq ': test$' <<< \"$listing\""]
timeout-seconds = 3600
inputs = [".", "../tastemaker", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-bench"
group = "check"
# Each linter bench package's own tests (tests.rs), one tool per bench.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "--no-tests=fail", "-E", "package(=idiomatic-sh-ryo-{lang}-{linter}-benchmark)"]
timeout-seconds = 3600
inputs = ["languages/{lang}", "languages/{lang}/benchmarks/linters/{linter}", ".", "../tastemaker", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-benches"
group = "check"
# Every bench target in test mode, with the default features, as ownership-contracts' `cargo test --workspace --all-targets` ran
# them (nextest's default filter leaves out kind(bench)): a divan bench runs each benchmark once.
# The default features leave out the `distribution` bench (required-features = ["distribution"]). The linter workers
# (idiomatic-sh-ryo-<lang>-<linter>-benchmark) are excluded: each is the collector's executable, which takes `<verb> <reference>`
# and has nothing to run without one; the bench groups run it and test-bench runs its tests.
run = ["cargo", "test", "--workspace", "--locked", "--benches", "--exclude", "idiomatic-sh-ryo-*-*-benchmark"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker"]

[[tools]]
id = "cargo-clippy-default"
group = "release-clippy"
# The same, with the default features: code a feature turns off is compiled and linted as a user builds it.
run = ["bash", "-c", "set -o pipefail; clippy-sarif --version </dev/null >&2 && CARGO_BUILD_JOBS=6 cargo clippy --workspace --all-targets --locked --message-format=json -- --cap-lints warn | python3 ../../ci/scripts/checks/cargo_diagnostics.py | clippy-sarif"]
output = "sarif"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo", "../../ci/scripts/checks/cargo_diagnostics.py"]

[[tools]]
id = "test-default"
group = "release-tests"
# Tests are strictly pass or fail: no lock holds a failing test. nextest runs every libtest target; the BDD runners and the
# doctests, which it cannot list, run in `test-bdd` and `test-doc`.
run = ["cargo", "nextest", "run", "--workspace", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker"]

[[tools]]
id = "cargo-hack"
group = "release-hack"
# Each package with no features, each feature alone and the default: one of the slowest checks, so CI's.
run = ["cargo", "hack", "check", "--workspace", "--each-feature", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "cargo-dylint"
group = "release-dylint"
run = ["bash", "-c", "set -o pipefail; cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.publish != []) | \"--package=\" + .name' | xargs cargo dylint --path ../../tools/lints -- --all-targets --all-features --locked"]
timeout-seconds = 3600
inputs = [".", "../../tools/lints", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "coverage"
group = "release-coverage"
# Line coverage, a report with no threshold: the run fails only when a test does.
run = ["cargo", "llvm-cov", "--workspace", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker"]

[[tools]]
id = "cargo-msrv"
group = "release-msrv"
# The declared `rust-version` checks the whole workspace: cargo-msrv reads it from the command line crate, the one every product has.
run = ["cargo", "msrv", "verify", "--path", "cli", "--output-format", "minimal", "--", "cargo", "check", "--workspace", "--all-targets", "--all-features", "--locked"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-distribution"
group = "release-tests"
# The `distribution` test target's findings: each target checked through the crate installed with its registry's languages.
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--test", "distribution", "--", "target_test::", "targets_have_their_findings", "every_registry_is_declared"]
timeout-seconds = 3600
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker"]

[[tools]]
id = "release-smoke"
group = "release-tests"
# Each registry's package is built from the crate, installed in a scratch directory and run. Only the release workflow runs the `release-*` groups.
run = ["cargo", "test", "--workspace", "--locked", "--all-features", "--test", "distribution", "--", "cargo::", "npm::", "pypi::"]
timeout-seconds = 7200
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker"]

[[tools]]
id = "fresh-resolution"
group = "release-resolution"
# Each published crate packaged without the workspace's Cargo.lock and built from its package: its dependencies resolve
# fresh, as a user's `cargo install` or `cargo add` resolves them, so a crate that builds only against our lock is caught.
run = ["bash", "-c", "set -o pipefail; cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.publish != []) | \"--package=\" + .name' | xargs cargo package --exclude-lockfile"]
timeout-seconds = 7200
inputs = [".", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance"
group = "perf"
# The benches print the Bencher Metric Format: the lock holds each measure's best and asymptote judges against it.
run = ["cargo", "bench", "--locked", "--workspace", "--bench", "commands"]
output = "bmf"
timeout-seconds = 3600
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "performance-distribution"
group = "perf"
# The `distribution` bench: each registry's targets through the installed command, cold, warm and after an edit.
run = ["cargo", "bench", "--locked", "--workspace", "--all-features", "--bench", "distribution"]
output = "bmf"
timeout-seconds = 7200
inputs = [".", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "profile"
group = "profile"
run = ["cargo", "run", "--quiet", "--release", "--locked", "-p", "idiomatic-sh-ryo-benchmark", "--bin", "ryo-benchmark-collector", "--", "profile", "languages/{lang}/benchmarks/linters/{linter}"]
output = "bmf"
timeout-seconds = 21600
inputs = ["languages/{lang}", "languages/{lang}/benchmarks/linters/{linter}", ".", "../../tools/install.py", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "test-language"
group = "check"
# Each language's tests, one tool per directory of `languages` (the capture), each reported on its own. `--workspace` builds
# every member, and the conformance reads the command line's default features (cli/Cargo.toml), so its inputs are the
# whole workspace: an edit anywhere in ryo reruns every language.
run = ["cargo", "nextest", "run", "--workspace", "--locked", "--all-features", "-E", "package(=idiomatic-sh-ryo-{lang})"]
timeout-seconds = 3600
inputs = ["languages/{lang}", ".", "../tastemaker", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "correctness-python-release-build"
group = "python-release"
# The Python provider's boolean parser payload is written in an optimized build: the one test that needs a release build,
# kept in its own group so the check matrix does not build release on every row. Ruff correctness is the bench
# group's (tool bench).
run = ["cargo", "test", "--release", "--locked", "-p", "idiomatic-sh-ryo-python", "--lib", "boolean_parser_payload_is_written_in_optimized_builds"]
timeout-seconds = 3600
inputs = [".", "../tastemaker", "../../tastemaker", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "memory-allocation"
group = "memory"
# The core's allocation harness (`crates/core/tests/allocation.rs`, `--bmf`), over the core's own corpus and the fake language: the most
# blocks any file allocates, after warm-up, beyond what the parser does on its own (`fake/blocks-per-file-beyond-parser`). `dhat` counts
# every block, so the number repeats; it varies by a few blocks between files, because a vector the findings fill doubles now and then,
# so the measure may rise 2% over its best. Target, not a gate: one block per file.
run = ["cargo", "test", "--locked", "--package", "idiomatic-sh-ryo-core", "--all-features", "--test", "allocation", "--", "--bmf"]
output = "bmf"
tolerance-percent = { blocks-per-file-beyond-parser = 2 }
timeout-seconds = 3600
inputs = [".", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "build"
group = "build"
# Compile reusable test/doc artifacts before independent quality and speed jobs.
# Clippy remains mandatory in its quality group; denied style findings do not gate Rust speed execution.
run = ["bash", "-c", "set -eo pipefail; mkdir -p target/checks/build; cargo check --workspace --all-targets --all-features --locked 2>&1 | tee target/checks/build/compile.log; cargo test --workspace --locked --all-features --no-run 2>&1 | tee target/checks/build/test.log; cargo doc --workspace --no-deps --all-features --locked 2>&1 | tee target/checks/build/doc.log"]
timeout-seconds = 7200
inputs = [".", "../../clippy.toml", "../../rust-toolchain.toml", "../../.cargo", "../tastemaker", "../../tastemaker"]

[[tools]]
id = "bench"
group = "bench"
# Each linter bench over every project of its language: every default verified against its cases, then ryo and the pinned
# reference over each project, any difference a failure, and the run's deterministic measures as one BMF document: what the
# cold run leaves in its store (`store-bytes`, `store-files`, held exactly) and the peak memory of each run. The pull request's
# `bench` job judges these alone: a shared runner moves the run's times from run to run, so they are `bench-timing`'s,
# which no pull request is judged by. The whole process tree runs on processors 0-3 with RAYON_NUM_THREADS=4, and the collector refuses any
# processor count but four. benchmarks.yml's hand-run bench-seed job seeds the lock on the runner that judges it.
run = ["taskset", "-c", "0-3", "env", "RAYON_NUM_THREADS=4", "cargo", "run", "--locked", "--release", "-p", "idiomatic-sh-ryo-benchmark", "--bin", "ryo-benchmark-collector", "--", "bench", "languages/{lang}/benchmarks/linters/{linter}"]
output = "bmf"
tolerance-percent = { peak-rss-bytes = 5, warm-peak-rss-bytes = 5, edited-peak-rss-bytes = 5, store-bytes = 1 }
timeout-seconds = 21600
inputs = ["languages/{lang}", "languages/{lang}/benchmarks/linters/{linter}", ".", "../../tools/install.py", "../../rust-toolchain.toml", "../../.cargo"]

[[tools]]
id = "bench-timing"
group = "bench-timing"
# The same run as `bench`, publishing its timing measures alone: the cold, warm and edited runs' CPU and wall seconds, each
# rule's verification times and each shape's growth. A shared runner moves them from run to run, so no pull request is judged
# by them. It repeats the whole bench, so no workflow runs it (no job runs the bench twice): a developer runs it alone to
# read a change's cost. The one pin of every timed measure: the whole process tree runs on processors 0-3 with
# RAYON_NUM_THREADS=4.
run = ["taskset", "-c", "0-3", "env", "RAYON_NUM_THREADS=4", "cargo", "run", "--locked", "--release", "-p", "idiomatic-sh-ryo-benchmark", "--bin", "ryo-benchmark-collector", "--", "bench-timing", "languages/{lang}/benchmarks/linters/{linter}"]
output = "bmf"
tolerance-percent = { cpu-s = 10, wall-s = 15, warm-cpu-s = 10, edited-cpu-s = 10, total-ms = 10, max-case-ms = 10, compile-ms = 10, doubling-ratio = 10, larger-ms = 10 }
timeout-seconds = 21600
inputs = ["languages/{lang}", "languages/{lang}/benchmarks/linters/{linter}", ".", "../../tools/install.py", "../../rust-toolchain.toml", "../../.cargo"]
