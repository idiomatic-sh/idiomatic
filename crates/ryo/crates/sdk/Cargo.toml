[package]
name = "idiomatic-sh-ryo-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Embed Ryo source queries with independent language providers"
keywords = ["static-analysis", "language-provider", "query", "lint", "ryo"]
categories = ["development-tools"]
autobenches = false

[lib]
name = "ryo"

[dependencies]
ryo_execution = { package = "idiomatic-sh-ryo-execution", path = "../execution", version = "0.1.4" }
ryo_execution_runtime = { package = "idiomatic-sh-ryo-execution-runtime", path = "../execution_runtime", version = "0.1.4" }
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.1.4" }
ryo_core = { package = "idiomatic-sh-ryo-core", path = "../core", version = "0.1.4" }
ryo_operators = { package = "idiomatic-sh-ryo-operators", path = "../operators", version = "0.1.4" }
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../matching", version = "0.1.4" }
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.1.4" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.1.4" }
ryo_query_language = { package = "idiomatic-sh-ryo-query_language", path = "../query_language", version = "0.1.4" }
rayon.workspace = true
thiserror.workspace = true
# The runner of the allocation row a language links (`languages::contract`), test support only.
libtest-mimic = { workspace = true, optional = true }

[dev-dependencies]
divan.workspace = true
idiomatic-sh-ryo-sdk = { path = ".", features = ["fixtures"] }
tempfile.workspace = true
trybuild.workspace = true

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
diagnostic-row-progress = ["ryo_core/diagnostic-row-progress"]
# Branch-only spike, never merged: the core's fused evaluator, so one package's build can switch it on.
fused-evaluation = ["ryo_core/fused-evaluation"]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["dep:libtest-mimic", "ryo_core/fixtures", "ryo_language/fixtures", "ryo_values/fixtures"]

[lints]
workspace = true
