[package]
name = "idiomatic-sh-ryo-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Embed Ryo source queries with independent language providers"
keywords = ["static-analysis", "language-provider", "query", "lint", "ryo"]
categories = ["development-tools"]
autobenches = false

[lib]
name = "ryo"

[dependencies]
ryo_execution = { package = "idiomatic-sh-ryo-execution", path = "../execution", version = "0.2.0" }
ryo_execution_runtime = { package = "idiomatic-sh-ryo-execution-runtime", path = "../execution_runtime", version = "0.2.0" }
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.2.0" }
ryo_core = { package = "idiomatic-sh-ryo-core", path = "../core", version = "0.2.0" }
ryo_operators = { package = "idiomatic-sh-ryo-operators", path = "../operators", version = "0.2.0" }
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../matching", version = "0.2.0" }
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.2.0" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.2.0" }
ryo_query_language = { package = "idiomatic-sh-ryo-query_language", path = "../query_language", version = "0.2.0" }
ryo_executor = { package = "idiomatic-sh-ryo-executor", path = "../executor", version = "0.2.0" }
globset.workspace = true
blake3.workspace = true
rustc-hash.workspace = true
sha2.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
divan.workspace = true
idiomatic-sh-ryo-sdk = { path = ".", features = ["fixtures"] }
tempfile.workspace = true
trybuild.workspace = true
# A real small language for the tests of what a lint answers (`tests/lint.rs`): an integration test links the SDK once, and the language links the same one.
idiomatic-sh-ryo-toml = { path = "../../languages/toml" }

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
# The images' measurement hooks (link an executor wrapper, print the counters): only the benchmark package that builds the images switches it on; a product binary builds without it.
bench-hooks = []
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo_core/fixtures", "ryo_execution_runtime/fixtures", "ryo_language/fixtures", "ryo_values/fixtures"]

[lints]
workspace = true
