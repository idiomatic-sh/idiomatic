[package]
name = "idiomatic-sh-ryo-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared correctness and performance harness for Ryo language benchmarks"
autobenches = false

[lib]
name = "ryo_benchmark"

[dependencies]
ryo-benchmark-contracts = { package = "idiomatic-sh-ryo-benchmark-contracts", path = "../benchmark_contracts", version = "0.1.4" }
globset.workspace = true
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../sdk", version = "0.1.4" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.1.4" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-chrome.workspace = true
tempfile.workspace = true
cargo_metadata.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wait4.workspace = true

# Every bench, the collector and this crate's own targets run on the allocator the command line ships (ruff and uv ship the
# same): jemalloc where it builds, mimalloc on Windows.
[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
divan.workspace = true
tempfile.workspace = true
cucumber.workspace = true
cargo_metadata.workspace = true
tokio.workspace = true
idiomatic-sh-ryo-benchmark = { path = ".", features = ["fixtures"] }

[[test]]
name = "bdd"
harness = false

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo/fixtures"]
# jemalloc built with its heap profiler (`--enable-prof`), for the profile run's heap profile; it samples nothing until the
# profile run sets `_RJEM_MALLOC_CONF`, so a bench built with it still runs its other commands unprofiled.
heap-profile = ["tikv-jemallocator/profiling"]

[lints]
workspace = true

[[bin]]
name = "ryo-benchmark-collector"
path = "src/main.rs"

[[test]]
name = "collector"
path = "src/outbound/execution/adapters/timed/adapter_test.rs"
