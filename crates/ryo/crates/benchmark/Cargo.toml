[package]
name = "idiomatic-sh-ryo-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared correctness and performance harness for Ryo language benchmarks"
autobenches = false

[lib]
name = "ryo_benchmark"

[dependencies]
ryo-benchmark-contracts = { package = "idiomatic-sh-ryo-benchmark-contracts", path = "../benchmark_contracts", version = "0.1.2" }
globset.workspace = true
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../sdk", version = "0.1.2" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.1.2" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-chrome.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wait4.workspace = true

[dev-dependencies]
divan.workspace = true
tempfile.workspace = true
cucumber.workspace = true
cargo_metadata.workspace = true
tokio.workspace = true
idiomatic-sh-ryo-benchmark = { path = ".", features = ["fixtures"] }

[[test]]
name = "bdd"
harness = false

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
fixtures = ["ryo/fixtures"]

[lints]
workspace = true

[[bin]]
name = "ryo-benchmark-collector"
path = "src/main.rs"

[[test]]
name = "collector"
path = "src/outbound/execution/adapters/timed/adapter_test.rs"
