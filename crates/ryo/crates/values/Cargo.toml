[package]
name = "idiomatic-sh-ryo-values"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Shared source query value types for Ryo"
keywords = ["static-analysis", "query", "ryo"]
categories = ["development-tools"]
autobenches = false

[lib]
name = "ryo_values"

[dependencies]
thiserror.workspace = true
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.1.3" }
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.1.3" }

[dev-dependencies]
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-values = { path = ".", features = ["fixtures"] }


[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = []

[lints]
workspace = true

