[package]
name = "idiomatic-sh-ryo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Source query execution services for Ryo"
keywords = ["query", "lint", "static-analysis", "ryoql", "ryo"]
categories = ["development-tools"]
autobenches = false

[lib]
name = "ryo_core"

[dependencies]
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../matching", version = "0.1.4" }
ryo_execution = { package = "idiomatic-sh-ryo-execution", path = "../execution", version = "0.1.4" }
ryo_execution_runtime = { package = "idiomatic-sh-ryo-execution-runtime", path = "../execution_runtime", version = "0.1.4" }
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.1.4" }
thiserror.workspace = true
ignore.workspace = true
rayon.workspace = true
memchr.workspace = true
serde.workspace = true
blake3.workspace = true
rustc-hash.workspace = true
sysinfo.workspace = true
tracing.workspace = true
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.1.4" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.1.4" }
ryo_operators = { package = "idiomatic-sh-ryo-operators", path = "../operators", version = "0.1.4" }
ryo_query_language = { package = "idiomatic-sh-ryo-query_language", path = "../query_language", version = "0.1.4" }
dhat = { workspace = true, optional = true }
# Branch-only (spike ryo-5cnx): the fused evaluator behind `fused-evaluation`; never merged.
ryo_evaluation = { package = "idiomatic-sh-ryo-evaluation", path = "../evaluation", optional = true }
postcard.workspace = true
tempfile.workspace = true

[dev-dependencies]
cargo_metadata.workspace = true
cucumber.workspace = true
divan.workspace = true
tokio.workspace = true
dhat.workspace = true
libtest-mimic.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-core = { path = ".", features = ["fixtures"] }

[[test]]
name = "bdd"
harness = false

[[test]]
name = "allocation"
harness = false

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
diagnostic-row-progress = []
# Branch-only (spike ryo-5cnx): each file's rules run in the fused evaluator in place of `run_file`, and the parse step builds the
# tree only. Never merged: the one-execution-path rule keeps a single interpreter on main.
fused-evaluation = ["dep:ryo_evaluation"]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["dep:dhat", "ryo_execution/fixtures", "ryo_execution_runtime/fixtures", "ryo_language/fixtures", "ryo_values/fixtures"]

[lints]
workspace = true
