[package]
name = "idiomatic-sh-ryo-operators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Portable operator semantics for Ryo"
keywords = ["query", "static-analysis", "ryo"]
categories = ["development-tools"]
autobenches = false

[lib]
name = "ryo_operators"

[dependencies]
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../matching", version = "0.1.2" }
rustc-hash.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.1.2" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.1.2" }

[dev-dependencies]
idiomatic-sh-ryo-operators = { path = ".", features = ["fixtures"] }
idiomatic-sh-ryo-values = { path = "../values", features = ["fixtures"] }
cargo_metadata.workspace = true
cucumber.workspace = true
tokio.workspace = true

[[test]]
name = "bdd"
harness = false

[features]
fixtures = []

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["idiomatic-sh-ryo-operators"]
