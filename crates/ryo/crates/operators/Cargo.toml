[package]
name = "idiomatic-sh-ryo-operators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Portable operator semantics for Ryo"
keywords = ["query", "static-analysis", "ryo"]
categories = ["development-tools"]
autobenches = false

[lib]
name = "ryo_operators"

[dependencies]
dhat = { workspace = true, optional = true }
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.1.4" }
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../matching", version = "0.1.4" }
rustc-hash.workspace = true
hashbrown.workspace = true
heck.workspace = true
num-bigint.workspace = true
ryo_derived = { package = "idiomatic-sh-ryo-derived", path = "../derived", version = "0.1.4" }
thiserror.workspace = true
unicode-width.workspace = true
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.1.4" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.1.4" }

[dev-dependencies]
idiomatic-sh-ryo-operators = { path = ".", features = ["fixtures"] }
idiomatic-sh-ryo-values = { path = "../values", features = ["fixtures"] }
idiomatic-sh-ryo-relations = { path = "../relations", features = ["fixtures"] }
cargo_metadata.workspace = true
cucumber.workspace = true
divan.workspace = true
libtest-mimic.workspace = true
tokio.workspace = true

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false
required-features = ["fixtures"]

[[test]]
name = "allocation"
harness = false

[[test]]
name = "bdd"
harness = false

[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["dep:dhat", "ryo_relations/fixtures"]

[lints]
workspace = true

