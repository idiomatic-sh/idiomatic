[package]
name = "idiomatic-sh-ryo-operators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Portable operator semantics for Ryo"
keywords = ["query", "static-analysis", "ryo"]
categories = ["development-tools"]

[lib]
name = "ryo_operators"

[dependencies]
cpu-time.workspace = true
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.2.0" }
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../matching", version = "0.2.0" }
rustc-hash.workspace = true
hashbrown.workspace = true
num-bigint.workspace = true
ryo_derived = { package = "idiomatic-sh-ryo-derived", path = "../derived", version = "0.2.0" }
thiserror.workspace = true
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.2.0" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.2.0" }

[dev-dependencies]
idiomatic-sh-ryo-operators = { path = ".", features = ["fixtures"] }
idiomatic-sh-ryo-values = { path = "../values", features = ["fixtures"] }
idiomatic-sh-ryo-relations = { path = "../relations", features = ["fixtures"] }

[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo_relations/fixtures"]

[lints]
workspace = true
