[package]
name = "idiomatic-sh-ryo-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The vector executor: the check's rules lowered to plans and run over columns of the walked files"
autobenches = false

[lib]
name = "ryo_executor"

[dependencies]
ryo_core = { package = "idiomatic-sh-ryo-core", path = "../core", version = "0.2.0" }
ryo_engine = { package = "idiomatic-sh-ryo-engine", path = "../engine", version = "0.2.0" }
ryo_execution_domain = { package = "idiomatic-sh-ryo-execution-domain", path = "../execution_domain", version = "0.2.0" }
# The language contract the executor reads files through. The `fixtures` feature is what the session package builds it with
# today: `Collect`, the row writer of a project read, lives in the language crate's fixtures (bead ryo-fmx3.1.11, step 5).
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.2.0", features = ["fixtures"] }
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../matching", version = "0.2.0" }
ryo_query_language = { package = "idiomatic-sh-ryo-query_language", path = "../query_language", version = "0.2.0" }
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.2.0" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.2.0" }
# The columns' scratch arena and the small per-row lists.
bumpalo.workspace = true
smallvec.workspace = true
# The request store: the answers a run keeps, keyed by a digest of the request and of the executable.
blake3.workspace = true
postcard.workspace = true
# The store writes a file beside its destination and renames it into place.
tempfile.workspace = true
# The store names the running executable by its build identity, read from its object file.
object.workspace = true
# The store's shards are read in place from the file.
memmap2.workspace = true
# The measuring clock, the workers' pool and the receipts' digest.
cpu-time.workspace = true
rayon.workspace = true
sha2.workspace = true
rustc-hash.workspace = true
regex.workspace = true
unicode-width.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Diagnostic prints of the pair decisions, off in every image: nothing enables it today.
pair-diagnostics = []

[lints]
workspace = true
