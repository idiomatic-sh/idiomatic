[package]
name = "idiomatic-sh-ryo-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "The file-phase engine: rules lowered to per-candidate programs over the walk and fact contracts"
autobenches = false

[lib]
name = "ryo_engine"

[dependencies]
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.2.0" }
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../relations", version = "0.2.0" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.2.0" }
thiserror.workspace = true

[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo_language/fixtures"]

[dev-dependencies]
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-engine = { path = ".", features = ["fixtures"] }
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../language", version = "0.2.0", features = ["fixtures"] }
cargo_metadata.workspace = true
cucumber.workspace = true
tokio.workspace = true

[[test]]
name = "bdd"
harness = false

[lints]
workspace = true
