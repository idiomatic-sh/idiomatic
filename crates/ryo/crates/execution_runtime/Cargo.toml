[package]
name = "idiomatic-sh-ryo-execution-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Ryo execution runtime: the compiled program's scheduling, admission, readiness, permits, source admission and restore, and the ports they call"

[lib]
name = "ryo_execution_runtime"

[dependencies]
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.2.0" }
blake3.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
idiomatic-sh-ryo-execution-runtime = { path = ".", features = ["fixtures"] }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../values", version = "0.2.0", features = ["fixtures"] }

[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo_values/fixtures"]

[lints]
workspace = true
