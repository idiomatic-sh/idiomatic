# ignore: idiomatic.arch/file-length - one list, the replaced set the census and the clippy lock read as a whole; a split would make two definitions of one set
# The fused rewrite's replaced set (runtime port design rev 8, section 7.1, with the interpreter test directories of 7.3 L6), one
# crates/ryo-relative file per entry, grouped by crate, at the merged port head. The census's edit footprint and the clippy lock's records read it.
# Runtime: program/{runtime,kernel_session,facade_runtime,admission,native_walk,preparation,restored,project_population}, the E
# concepts' service bodies, file_dag/{invocation,execution,axis_resources,graph_resources,predicates,executor,ordered_existence,
# resources,service}, and frontiers/observations but frontiers/errors.rs. Domain: executable_program, file_program, readiness.
# Tests: execution tests/interpreter, the execution use case's interpreter tests, core cross_file's interpreter tests. The store's
# workspace family (row 5) is not listed: it moved to the oxlint phase, unmeasured.

