  { spec = "idiomatic.arch/sdk", include = ["crates/sdk"], count = { min = 0 }, params = { reexports = [{ resource = "languages", path = "ryo_relations::domain::catalog::types::OptionalCapability", as = "OptionalCapability" }, { resource = "languages", path = "ryo_language::domain::files::types::ProjectEntries", as = "ProjectEntries" }, { resource = "languages", path = "ryo_language::domain::answers::service::native_semantic_child", as = "native_semantic_child" }, { resource = "languages", path = "ryo_language::domain::answers::service::native_semantic_syntax", as = "native_semantic_syntax" }, { resource = "languages", path = "ryo_language::domain::builders::service::builder_position", as = "builder_position" }, { resource = "languages", path = "ryo_language::domain::elements::service::embedded_source_at", as = "embedded_source_at" }, { resource = "languages", path = "ryo_language::domain::expansions::service::embedded_expressions", as = "embedded_expressions" }, { resource = "languages", path = "ryo_language::domain::expansions::service::write_embedded", as = "write_embedded" }, { resource = "languages", path = "ryo_relations::domain::elements::types::EmbeddedMapping", as = "EmbeddedMapping" }, { resource = "languages", path = "ryo_relations::domain::elements::types::EmbeddedSource", as = "EmbeddedSource" }, { resource = "languages", path = "ryo_relations::domain::relations::types::Locatedness", as = "Locatedness" }, { resource = "languages", path = "ryo_language::domain::builders::service::enter_implied_node", as = "enter_implied_node" }, { resource = "languages", path = "ryo_language::domain::builders::service::node_property", as = "node_property" }, { resource = "languages", path = "ryo_language::domain::decoded::service::property_at", as = "property_at" }, { resource = "languages", path = "ryo_language::domain::elements::service::source_order", as = "source_order" }, { resource = "languages", path = "ryo_language::domain::elements::types::SourceOrder", as = "So