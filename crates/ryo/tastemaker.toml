  { rule = "idiomatic.ryo/absence-cites-the-standard", include = ["languages/*/src/inbound/contracts/*/contract.rs"], description = "A language contract's answer that the language lacks a relation, `AbsenceCause::NoSuchConstruct` or `AbsenceCause::NoManifests`, cites the standard: a `standard:` comment in the method names the document and section that lacks it." },
  { rule = "idiomatic.arch/operator-meaning-once", include = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**", "crates/values/src/domain/query_operators/types.rs"], exclude = ["**/*_test.rs", "**/test.rs", "**/tests.rs", "**/fixtures/**", "**/fixtures.rs", "**/acceptance/**", "**/*_test/**"], params = { calls = ["{OperatorCall,*::OperatorCall}::*"], engine-calls = ["{OperatorCall,*::OperatorCall}::{Evaluate,OrderedExistence,ReduceCount,ReduceDigest}"], engine = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**"], kinds = ["crates/values/src/domain/query_operators/types.rs"], modules = ["crates/execution_domain/src/domain/operator.rs", "crates/execution_domain/src/domain/operator/**"] }, description = "Execution reaches a kind's row meaning only through the operators' one evaluation call; besides it, the engine makes the ordered-existence driver call and the two reductions that prepare a grouping resource. The kinds are those `operation_kinds!` lists in values." },
  { rule = "idiomatic.arch/driver-implementers", include = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**", "crates/operators/src/domain/**"], exclude = ["**/*_test.rs", "**/test.rs", "**/tests.rs", "**/fixtures/**", "**/fixtures.rs", "**/acceptance/**", "**/*_test/**"], params = { ports = ["crates/operators/src/domain/**"], traits = ["*Driver"], implementers = ["crates/execution_runtime/src/application/file_dag/ordered_existence.rs", "crates/execution_domain/src/domain/operator/contract/**"] }, description = "The operators' driver ports are implemented by the engine's strategies only: its join candidates, walks, graphs and delivery under `domain/operator/contract`, and the ordered-existence driver." },
