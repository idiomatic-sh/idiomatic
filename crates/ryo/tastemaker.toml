  { alias = "crate-core", spec = "idiomatic.arch/crate", include = ["crates/core"], params = { package = "idiomatic-sh-ryo-core", library = "ryo_core", binary = "absent", distribution = "absent" }, description = "The `core` crate: package `idiomatic-sh-ryo-core`, library `ryo_core`." },
  { alias = "crate-query-language", spec = "idiomatic.arch/crate", include = ["crates/query_language"], params = { package = "idiomatic-sh-ryo-query_language", library = "ryo_query_language", binary = "absent", distribution = "absent" }, description = "The `query_language` crate: package `idiomatic-sh-ryo-query_language`, library `ryo_query_language`." },
  { alias = "crate-language", spec = "idiomatic.arch/crate", include = ["crates/language"], params = { package = "idiomatic-sh-ryo-language", library = "ryo_language", binary = "absent", distribution = "absent" }, description = "The `language` crate: package `idiomatic-sh-ryo-language`, library `ryo_language`." },
  { alias = "crate-relations", spec = "idiomatic.arch/crate", include = ["crates/relations"], params = { package = "idiomatic-sh-ryo-relations", library = "ryo_relations", binary = "absent", distribution = "absent" }, description = "The portable relation contract crate." },
  { alias = "crate-values", spec = "idiomatic.arch/crate", include = ["crates/values"], params = { package = "idiomatic-sh-ryo-values", library = "ryo_values", binary = "absent", distribution = "absent" }, description = "The `values` crate: package `idiomatic-sh-ryo-values`, library `ryo_values`." },
