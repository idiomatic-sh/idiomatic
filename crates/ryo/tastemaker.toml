# crates/ryo/tastemaker.toml (paths are relative to this file's directory)
# A crate sits at crates/<crate>. A product
# starts with one crate of the one kind: `crates/core`, a
# nu-hex (the use cases the command line calls, the core's values and rules, the ports it
# needs from outside, and under each port its adapters and the factory the command line's
# compositions call). Add a nu-hex with an entry as this one is placed.
tastemaker = "0.1.2"
variables = { internal-packages = ["idiomatic-sh-ryo", "idiomatic-sh-ryo-benchmark", "idiomatic-sh-ryo-benchmark-contracts", "idiomatic-sh-ryo-core", "idiomatic-sh-ryo-css", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-execution-domain", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-execution-store", "idiomatic-sh-ryo-go", "idiomatic-sh-ryo-html", "idiomatic-sh-ryo-javascript", "idiomatic-sh-ryo-json", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-markdown", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-python", "idiomatic-sh-ryo-python-ruff-benchmark", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-rust", "idiomatic-sh-ryo-sdk", "idiomatic-sh-ryo-toml", "idiomatic-sh-ryo-typescript", "idiomatic-sh-ryo-values"] }
workspace = { name = "ryo", members = ["crates/execution", "crates/execution_domain", "crates/execution_runtime", "crates/execution_store", "crates/sdk", "crates/execution_runtime/src/application/file_dag", "crates/execution_store/src/application/file_dag", "languages/*", "languages/*/src"], rules-exclude = ["**/tests/fixtures/refusals/**", "languages/*/tests/fixtures/relations/*/input.*", "**/tests/fixtures/suite/**/*.*", "**/tests/fixtures/standard/**/*.*", "**/tests/fixtures/corpus/**/*.*", "languages/go/tests/fixtures/manifests/workspace/skip/**", "languages/*/tests/fixtures/manifests/invalid-*/**"], dependencies = [{ package = "idiomatic.arch", path = "../../tastemaker" }, { package = "idiomatic.ryo", path = "tastemaker" }] }
rules = [
  { rule = "idiomatic.arch/test-directory-layout", include = ["**"], description = "All placed compiled-owner proofs and grouped inbound controls use generic role filenames and normal registration." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/sdk/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-core", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The sdk owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/core/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The core owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution-domain", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-execution-store", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The execution owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution_domain/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The engine's domain, the bottom of the engine crates, depends only on the semantic crates below it: never on execution, core or any crate above it." },
  { rule = "idiomatic.arch/library-surface", include = ["**/*.rs"], exclude = ["crates/execution/**", "crates/execution_domain/**", "crates/execution_runtime/**", "crates/execution_store/**", "crates/core/**", "crates/sdk/**", "cli/**", "**/tests/fixtures/**"], params = { library = ["ryo_execution_domain", "ryo_execution_domain::*", "ryo_execution_store", "ryo_execution_store::*", "ryo_execution_runtime", "ryo_execution_runtime::*"], surface = ["ryo_execution_runtime::outbound", "ryo_execution_runtime::outbound::*"] }, description = "The engine crates are internal: no file outside execution, its domain, its store and its runtime names `ryo_execution_domain` or `ryo_execution_store`, and of the runtime only its outbound ports (digest, facts, operators), so the items the engine crates make public for each other reach no other crate. Core, the SDK and the command line reach the domain's, the store's and the runtime's application types only through the execution use cases that forward them (the prepare interface forwards the store's `DerivedAccess`), and compose the derived port through `ryo_execution::derived`, the one composition execution offers them. The three ports are named at their definition: core implements and calls them and the edges compose their adapters, and an interface may not forward an outbound port (`no-reexports` 0.5.0)." },
  { rule = "idiomatic.arch/library-surface", include = ["crates/core/**/*.rs", "crates/sdk/**/*.rs", "cli/**/*.rs"], exclude = ["**/tests/fixtures/**"], params = { library = ["ryo_execution_domain", "ryo_execution_domain::*", "ryo_execution_store", "ryo_execution_store::*", "ryo_execution_runtime", "ryo_execution_runtime::*", "ryo_execution::inbound::use_cases::execution::interface::*"], surface = ["ryo_execution_runtime::outbound", "ryo_execution_runtime::outbound::*", "ryo_execution::inbound::use_cases::execution::interface::{FileRunInput,CaptureContext,FileRules,RanRule,EmittedRoot,RuleAfter,FileEnd,FileStop,FinishedReadiness,KindSupport,SemanticSupport,SourceLanguage,RuleOutcome,RootOutcome,ProjectOutputOutcome,ProjectObservation,ObservedPublication,AdmittedOutput,PreparedExecution,PreparedExecutionProgram,PreparedReporting,Demand,NamedLayout,ObservationContract,ReplayClosure,SemanticNeed,ObservedFrontierRoot,ExecutionRequest,RequestExecution,ProjectRootExecution,ProjectStage,ObservationExecution,PhaseRules,ObservationBatches,BatchNumber,BatchOccurrence,Install,OccurrenceNumber,PhasePartials,PhaseStop,ProjectBatch,PreparationError,RuleIndex,OperatingError,Covered,FileObservationReadiness,FilePartial,InapplicableFiles,Partial,Partials,RefusedFiles,Arena,SemanticLookup,RuleIntentError,ApplicabilityReason,CaptureIntent,DiagnosticDelivery,FileRuleIntent,ObservationDemand,RelationRead,ExecutionUseCase}{,::*}"] }, description = "Core, the SDK and the command line name only the seam's vocabulary, the list execution forwards, and of the engine crates below it only the runtime's outbound ports (the general entry's rule for them, which this one carries); a new forward needs a seam owner." },
  # T2 admits the store port's own vocabulary (RelationOwner, ProducerScope, PublicationBody, ProducerId): the store port is part of the outer seam the suite is written against (goal exit 1), and S15 drives it as a store of its own.
  { rule = "idiomatic.arch/library-surface", include = ["crates/execution/tests/**/*.rs"], exclude = ["crates/execution/tests/interpreter/**", "crates/execution/tests/fixtures/**"], params = { library = ["ryo_execution_runtime", "ryo_execution_runtime::*", "ryo_execution_store", "ryo_execution_store::*", "ryo_execution_domain::domain::{executable_program,file_program,readiness}{,::*}"], surface = ["ryo_execution_runtime::application::file_dag::program::{file_session,project_phase,request_execution,observation_stage,rule_outcome,prepared_execution,observed_publication}::{interface,types}{,::*}", "ryo_execution_runtime::application::file_dag::program::{prepared_execution::service::prepare,request_execution::service::begin}", "ryo_execution_runtime::application::file_dag::frontiers::errors{,::*}", "ryo_execution_runtime::outbound::{digest,facts,operators,observer}::{interface,types,errors,factory,fixtures}{,::*}", "ryo_execution_store::application::file_dag::relations::interface{,::*}", "ryo_execution_store::application::file_dag::relations::types::ReuseEligibility{,::*}", "ryo_execution_store::application::file_dag::relations::RelationOwner{,::fixture}", "ryo_execution_store::application::file_dag::relations::publication::types::{ProducerScope,PublicationBody}{,::*}", "ryo_execution_store::application::file_dag::relations::types::ProducerId{,::*}", "ryo_execution_store::outbound::derived::factory{,::*}"] }, description = "The seam contract suite names only the outer seam, its entry functions, its ports with their fixtures, the store facade with its fixture, and the composition factories. The current interpreter's own tests live in tests/interpreter/, which the rewrite deletes." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/execution_store/Cargo.toml"], params = { allowed-siblings = ["execution_domain", "derived", "relations", "values", "language", "matching"] }, description = "The execution store sits on the domain and the portable semantic crates; it never depends on the engine above it." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution_store/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-execution-domain", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching"] }, description = "The same direction for aliased, published and git internal packages." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/execution_runtime/Cargo.toml"], params = { allowed-siblings = ["execution_domain", "execution_store", "derived", "relations", "values", "language", "matching", "operators"] }, description = "The execution runtime sits on the store, the domain and the portable semantic crates; it never depends on the execution crate above it." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution_runtime/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-execution-domain", "idiomatic-sh-ryo-execution-store", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators"] }, description = "The same direction for aliased, published and git internal packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["cli/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-core", "idiomatic-sh-ryo-css", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-go", "idiomatic-sh-ryo-html", "idiomatic-sh-ryo-javascript", "idiomatic-sh-ryo-json", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-markdown", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-python", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-rust", "idiomatic-sh-ryo-sdk", "idiomatic-sh-ryo-toml", "idiomatic-sh-ryo-typescript", "idiomatic-sh-ryo-values"] }, description = "The command line takes the core, execution, the semantic crates and the languages it links, the SDK only for its tests (`edges-apart` refuses it as a normal dependency), and of the engine crates below execution only the runtime, whose outbound adapters (the digest, the facts store, the operators) its composition root wires (`library-surface` confines it to `ryo_execution_runtime::outbound`); never the engine's domain or store: a renamed binding (`dom = { package = ... }`) does not change the package." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/benchmark/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-benchmark-contracts", "idiomatic-sh-ryo-sdk", "idiomatic-sh-ryo-values"] }, description = "The benchmark workflow uses the SDK, its data vocabulary and the values; it never takes an engine crate, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/derived/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The portable derived semantics sit on the foundation crates; they never depend on the engine above them, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/query_language/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The query language sits on the foundation crates; it never depends on the engine above it, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/values/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-language", "idiomatic-sh-ryo-relations"] }, description = "The values sit on the language and relation foundation; they never depend on the engine above them, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["languages/*/Cargo.toml"], exclude = ["languages/python/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-sdk"] }, description = "A language depends on the SDK alone among the internal packages, never on the core or an engine crate, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["languages/python/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-sdk"] }, description = "Python depends on the SDK only; its Ruff bake-off, which takes the benchmark and its data vocabulary, is its own unpublished package under benchmarks/linters/ruff. Never on the core or an engine crate, under any binding." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/benchmark_contracts/Cargo.toml"], params = { allowed-siblings = ["sdk"] }, description = "Benchmark data uses the SDK public vocabulary only; it has no direct engine or benchmark workflow dependency." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/benchmark_contracts/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-sdk"] }, description = "Aliased, published and git dependencies preserve the same neutral-data adjacency." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/matching/Cargo.toml"], params = { allowed-siblings = [] }, description = "Matching semantics cannot depend on execution, core, or internal semantic owners." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/matching/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = [] }, description = "The same boundary rejects aliased, published and git internal engine dependencies." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/relations/Cargo.toml"], params = { allowed-siblings = [] }, description = "Exact reviewed foundational manifest direction." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/relations/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = [] }, description = "The foundational direction also applies to aliases and published/git internal packages." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/language/Cargo.toml"], params = { allowed-siblings = ["relations"] }, description = "Exact reviewed foundational manifest direction." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/language/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-relations"] }, description = "The foundational direction also applies to aliases and published/git internal packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/operators/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values", "idiomatic-sh-ryo-matching"] }, description = "The operator capability uses the relation foundation, portable plan values and public matching semantics; published and aliased dependencies follow the same boundary." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/operators/Cargo.toml"], params = { allowed-siblings = ["relations", "values", "matching"] }, description = "Exact operator sibling manifests; engine, language and derived implementations stay outside the capability." },
  { rule = "idiomatic.arch/bdd-members", include = ["languages/*/src/inbound/use_cases/*.rs", "languages/*/src/inbound/contracts/*.rs", "languages/*/src/inbound/use_cases/*/acceptance.*", "languages/*/src/inbound/contracts/*/acceptance.*", "languages/*/tests/bdd.rs", "crates/execution/src/inbound/use_cases/publication.rs", "crates/execution/src/inbound/use_cases/publication/acceptance.*", "crates/execution/tests/bdd.rs"], exclude = ["**/tests/fixtures/**"], description = "Colocated acceptance pairs have their owner and are declared by the integration harness across owned scopes." },
  # The import order between the crates, a v2 file's `layers` and `independent`: a crate depends on none above it, top to bottom the command line, the benchmark and its data vocabulary (which a language takes for its tests only), the languages, the SDK, the core, the query language, the values, the language crate (PE68); the command line and the SDK share nothing (PE48). Cargo refuses a cycle.
  { alias = "crate-layers", rule = "idiomatic.arch/layer-order", include = ["**/Cargo.toml"], exclude = ["cli/Cargo.toml", "**/tests/fixtures/**"], params = { layers = [["cli"], ["benchmark"], ["benchmark_contracts"], ["markdown", "python", "rust", "toml"], ["sdk"], ["core"], ["execution"], ["execution_runtime"], ["execution_store"], ["execution_domain"], ["operators", "derived"], ["query_language"], ["values"], ["language"], ["relations"], ["matching"]] }, description = "No crate depends on a crate of a layer above it: the edges use the core, the core the crates it calls, never the reverse." },
  { alias = "edges-apart", rule = "idiomatic.arch/layer-order", include = ["cli/Cargo.toml"], params = { layers = [["sdk"], ["cli"]] }, description = "The command line, the top layer, depends on no crate of the SDK: the two edges share nothing, so for the command line the SDK is a layer above." },
  { rule = "idiomatic.arch/distribution-wiring", include = ["**/cli/Cargo.toml", "**/distribution/smoke_test.rs"], description = "Cargo runs the placed sibling distribution proof behind its explicit feature." },
  { rule = "idiomatic.arch/extension-point-ports", include = ["languages"], params = { exposed = [] }, description = "A port an SDK resource module re-exports has no adapters in the core and its trait is its plain noun; every other port has at least one adapter." },
  # A cfg(any(test, feature = "fixtures")) seal crosses crates: the core's fixtures feature turns the engine's on (ExecutionRequest::open_file).
  { rule = "idiomatic.arch/fixtures-only-in-tests", include = ["**/*.rs", "**/Cargo.toml"], description = "An item gated by `cfg(any(test, feature = \"fixtures\"))` is named only by test code: a production call of a gated method (one in a gated `impl` block included) in any crate, or a production path naming a gated module, function, constant or type of its own crate, is a finding." },
  { rule = "idiomatic.arch/workspace-fixtures-feature", include = ["Cargo.toml", "**/Cargo.toml"], exclude = ["**/tests/fixtures/**"], description = "A `[workspace.dependencies]` entry that enables `fixtures` is inherited only by `[dev-dependencies]`: the crate and language specs' `fixtures-feature` read only each crate's own manifest, so the workspace manifest's half of an inherited edge is held here." },
  { rule = "idiomatic.arch/no-default-trait-methods", include = ["crates/language/src/**/*.rs", "crates/relations/src/**/*.rs", "crates/sdk/src/resources/languages.rs", "crates/sdk/src/resources/languages/**/*.rs", "crates/execution_runtime/src/application/file_dag/program/runtime/service.rs"], description = "The traits a language answers (the catalog, the row writer, the use cases) have no default method: adding a method breaks every language until it answers. Runtime kernel callbacks are also mandatory; omitted shared-walk admission cannot silently decline." },
  # Only the src tree placed by the SDK spec below is the product's reexport surface.
  { rule = "idiomatic.arch/no-language-names", params = { languages = ["css", "html", "javascript", "python", "rust", "typescript"], written = ["go", "Go", "Go[!A-Za-z0-9]*", "*[!A-Za-z0-9]Go", "*[!A-Za-z0-9]Go[!A-Za-z0-9]*", "*golang*", "*JavaScript*", "*TypeScript*"] }, include = ["crates/**", "cli/**"], exclude = ["**/*_test.rs", "**/test.rs", "**/tests/**", "**/fixtures/**", "**/fixtures.rs", "**/acceptance.rs", "**/distinct_integration/**", "**/compiled_parity/**", "cli/src/languages.rs", "crates/execution/**/tastemaker.toml", "crates/execution_runtime/**/tastemaker.toml", "crates/execution_domain/tastemaker.toml", "crates/execution_store/**/tastemaker.toml"], description = "No comment and no string literal of an engine crate names a language, and no string literal of its core is a bare file extension: the engine owns the concepts and every language fulfils them. The one file excepted is `cli/src/languages.rs`, which `cli/build.rs` writes from the directories of `languages/`: the single edge that names the languages it links, behind the Cargo feature of each name (LG3, LG4)." },
  # Every error variant is matched by a test beside its errors.rs (U3).
  # The outside world, threads and JSON are reached only at the boundary: adapters, the
  # composition root, main.rs, a build script, tests, benches and test fixtures.
  # A command's and an SDK function's service calls are the methods of the interfaces they can reach, in any crate.
  # Rules that cross a namespace and its parts cannot be a spec's: a spec's rule reads only the files its own instance owns.
  { rule = "idiomatic.arch/collection-members", include = ["languages/*/src/**/collections.rs", "languages/*/src/**/collections/**"], exclude = ["languages/*/src/domain/relations/collections.rs", "languages/*/src/domain/relations/collections/**", "languages/*/src/domain/manifests/collections.rs", "languages/*/src/domain/manifests/collections/**", "languages/*/src/domain/links/collections.rs", "languages/*/src/domain/links/collections/**"], description = "A collection is whole: its list, its module file, its interface and its items, named apart from its neighbours. Excepted are the collections of a language's relations, manifests and links: ryo owns the shape of their items, which a language implements and never defines, so they have no interface of their own." },
  { rule = "idiomatic.arch/interface-present-unless-item-trait", include = ["**/src/**/collections/*/interface.rs", "**/src/**/collections/*/*/item.rs"], description = "A collection has an interface.rs exactly when its items import it: a collection whose items implement a trait of another crate (its pair in `item-trait`) has none. Held here, over the workspace: a collection spec's rules cannot see the files of the item instances nested in it." },
  { rule = "idiomatic.arch/item-contract", include = ["languages/*/src/**/collections/**"], description = "Each item's test runs its collection's shared cases when the collection has a fixtures/contract.rs." },
  { rule = "idiomatic.arch/item-fixtures", include = ["crates/core/**", "languages/**"], description = "Each relation and operator item has fixtures: an input and the expected rows, which the allocation and call-count tests read. A language whose relations are not written yet has the findings as its work list." },
  { rule = "idiomatic.ryo/derived-view-acquisition", include = ["crates/core/src/**", "crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**"], params = { confined = ["DerivedPort", "admit_view", "admit_partition", "acquire_stored", "acquire_stored_with_route", "try_acquire_rows", "scoped_build", "prepare_graph", "acquire_graph", "acquire_graph_domain", "graph_row", "prepare_program_file", "DemandAnswers", "AcquiredView", "GraphHandle", "DomainHandle", "RootAnswer", "CachedGraph", "DerivedAccess"], allowed = [{ file = "crates/execution_runtime/src/application/file_dag/axis_resources/mod.rs", name = "AcquiredView" }, { file = "crates/execution_runtime/src/application/file_dag/axis_resources/view.rs", name = "AcquiredView" }, { file = "crates/execution_store/src/application/file_dag/closure_partitions.rs", name = "AcquiredView" }, { file = "crates/execution_store/src/application/file_dag/closure_partitions.rs", name = "admit_partition" }, { file = "crates/execution_store/src/application/file_dag/closure_partitions.rs", name = "scoped_build" }, { file = "crates/execution_store/src/application/file_dag/closure_partitions/schemas.rs", name = "AcquiredView" }, { file = "crates/execution_store/src/application/file_dag/closure_partitions/schemas.rs", name = "acquire_stored" }, { file = "crates/execution_store/src/application/file_dag/closure_partitions/schemas.rs", name = "admit_partition" }, { file = "crates/execution_store/src/application/file_dag/closure_partitions/schemas.rs", name = "admit_view" }, { file = "crates/execution_store/src/application/file_dag/derived/prepare.rs", name = "DerivedAccess" }, { file = "crates/execution_store/src/application/file_dag/derived/request/mod.rs", name = "DerivedAccess" }, { file = "crates/execution_runtime/src/application/file_dag/execution/lease.rs", name = "graph_row" }, { file = "crates/execution_runtime/src/application/file_dag/invocation.rs", name = "AcquiredView" }, { file = "crates/execution_runtime/src/application/file_dag/invocation.rs", name = "CachedGraph" }, { file = "crates/execution_runtime/src/application/file_dag/invocation/index.rs", name = "AcquiredView" }, { file = "crates/execution_runtime/src/application/file_dag/invocation/service.rs", name = "prepare_graph" }, { file = "crates/execution_runtime/src/application/file_dag/invocation/views/mod.rs", name = "AcquiredView" }, { file = "crates/execution_runtime/src/application/file_dag/program/facade_runtime/file_execution.rs", name = "prepare_program_file" }, { file = "crates/execution_runtime/src/application/file_dag/program/facade_runtime/types.rs", name = "DerivedAccess" }, { file = "crates/execution_runtime/src/application/file_dag/program/preparation/service.rs", name = "DerivedAccess" }, { file = "crates/execution_runtime/src/application/file_dag/program/prepared_execution/service.rs", name = "DerivedAccess" }, { file = "crates/execution_store/src/application/file_dag/relations/interface.rs", name = "DerivedAccess" }, { file = "crates/execution_runtime/src/application/file_dag/program/prepared_execution/types.rs", name = "DerivedAccess" }, { file = "crates/execution_store/src/application/file_dag/relations.rs", name = "DerivedAccess" }, { file = "crates/execution_store/src/application/file_dag/service.rs", name = "DerivedAccess" }, { file = "crates/execution_runtime/src/application/file_dag/service.rs", name = "DerivedAccess" }, { file = "crates/execution_store/src/application/file_dag/workspace/mod.rs", name = "AcquiredView" }, { file = "crates/execution_store/src/application/file_dag/workspace/mod.rs", name = "admit_view" }, { file = "crates/execution_store/src/application/file_dag/workspace/mod.rs", name = "try_acquire_rows" }, { file = "crates/execution_store/src/application/file_dag/workspace/service.rs", name = "AcquiredView" }, { file = "crates/execution_store/src/application/file_dag/workspace/service.rs", name = "acquire_stored" }, { file = "crates/execution_store/src/application/file_dag/workspace/service.rs", name = "admit_view" }, { file = "crates/execution/src/inbound/use_cases/prepare/use_case.rs", name = "DerivedAccess" }, { file = "crates/core/src/**", name = "admit_view" }, { file = "crates/execution_store/src/outbound/derived/**", name = "DerivedPort" }, { file = "crates/execution/src/lib.rs", name = "DerivedAccess" }, { file = "crates/execution/src/inbound/use_cases/prepare/interface.rs", name = "DerivedAccess" }, { file = "crates/core/src/application/engine/service.rs", name = "DerivedAccess" }, { file = "crates/core/src/inbound/use_cases/lint/use_case.rs", name = "DerivedAccess" }, { file = "crates/core/src/inbound/use_cases/lint/fixtures/engine.rs", name = "DerivedAccess" }] }, description = "Only the derived-view implementation and application owner may reach the resolved registry/build entrypoints; domain operators use prepared contracts. The owner's acquiring entries (admit, acquire, scoped build, graph preparation and rows, demand answers, program-file preparation) are called, and the views and handles it issues (`AcquiredView`, `CachedGraph`, `DerivedAccess` and the graph handles) are held, only by the files `allowed` lists: the workspace and closure partitions inside the store, the invocation, execution lease and program facade above it, and the request plumbing that hands `DerivedAccess` to the owner. The builder port `DerivedPort` is named only by its own hex; execution's `derived` builds it from the store's factories as the owner-issued `DerivedAccess`, which the prepare interface forwards, so outside the engine crates core holds that access and never the port. The core's `admit_view` is its own column admission, a different function of the same name. The store facade's test fixture names the derived access a store is opened over, as the owner's own constructor does." },
  { rule = "idiomatic.ryo/runtime-authority", include = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**"], params = { owner-records = [{ record = "AdmittedViewInputs", visibility = "private" }, { record = "GraphHandle", visibility = "private" }, { record = "DomainHandle", visibility = "private" }, { record = "DerivedStorage", visibility = "private" }, { record = "RequestDerived", visibility = "private" }, { record = "CacheBackend", visibility = "pub(in crate::application::file_dag::derived::owner)" }] }, description = "Seal real runtime authority, admitted-input and slot representations; only runtime.rs issues KernelAdmission. The derived owner's admitted view inputs, graph and domain handles, storage and request plan keep private fields, and its cache backend's fields stay within the owner." },
  { rule = "idiomatic.ryo/program-implementation-boundary", include = ["crates/core/src/**", "crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**"], description = "Only the executable-program owner and its explicit physical-kernel bridges may depend on internal admission, runtime, restoration, and permit implementations; callers use the facade." },
