# crates/ryo/tastemaker.toml (paths are relative to this file's directory)
# A crate sits at crates/<crate>. A product
# starts with one crate of the one kind: `crates/core`, a
# nu-hex (the use cases the command line calls, the core's values and rules, the ports it
# needs from outside, and under each port its adapters and the factory the command line's
# compositions call). Add a nu-hex with an entry as this one is placed.
tastemaker = "0.1.3"
variables = { internal-packages = ["idiomatic-sh-ryo", "idiomatic-sh-ryo-benchmark", "idiomatic-sh-ryo-benchmark-contracts", "idiomatic-sh-ryo-core", "idiomatic-sh-ryo-css", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-execution-domain", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-execution-store", "idiomatic-sh-ryo-go", "idiomatic-sh-ryo-html", "idiomatic-sh-ryo-javascript", "idiomatic-sh-ryo-json", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-markdown", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-python", "idiomatic-sh-ryo-python-ruff-benchmark", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-rust", "idiomatic-sh-ryo-sdk", "idiomatic-sh-ryo-toml", "idiomatic-sh-ryo-typescript", "idiomatic-sh-ryo-typescript-oxlint-benchmark", "idiomatic-sh-ryo-values"], confined-derived-names = ["DerivedPort", "admit_view", "admit_partition", "acquire_stored", "acquire_stored_with_route", "try_acquire_rows", "scoped_build", "prepare_graph", "acquire_graph", "acquire_graph_domain", "graph_row", "prepare_program_file", "DemandAnswers", "AcquiredView", "GraphHandle", "DomainHandle", "RootAnswer", "CachedGraph", "DerivedAccess", "acquire_rows", "acquire_derived", "try_native_lookup", "take_current"] }
workspace = { name = "ryo", members = ["crates/execution", "crates/execution_domain", "crates/execution_runtime", "crates/execution_store", "crates/sdk", "crates/execution_runtime/src/application/file_dag", "crates/execution_store/src/application/file_dag", "languages/*", "languages/*/src"], rules-exclude = ["languages/*/tests/fixtures/relations/*/input.*", "**/tests/fixtures/suite/**/*.*", "**/tests/fixtures/standard/**/*.*", "**/tests/fixtures/corpus/**/*.*", "languages/go/tests/fixtures/manifests/workspace/skip/**", "languages/*/tests/fixtures/manifests/invalid-*/**"], dependencies = [{ package = "idiomatic.arch", path = "../../tastemaker" }, { package = "idiomatic.ryo", path = "tastemaker" }] }
rules = [
  { rule = "idiomatic.arch/test-directory-layout", include = ["**"], description = "All placed compiled-owner proofs and grouped inbound controls use generic role filenames and normal registration." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/sdk/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-core", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The sdk owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/core/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The core owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution-domain", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-execution-store", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The execution owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution_domain/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The engine's domain, the bottom of the engine crates, depends only on the semantic crates below it: never on execution, core or any crate above it." },
  { rule = "idiomatic.arch/library-surface", include = ["crates/benchmark/**/*.rs", "crates/benchmark_contracts/**/*.rs", "crates/derived/**/*.rs", "crates/language/**/*.rs", "crates/matching/**/*.rs", "crates/operators/**/*.rs", "crates/query_language/**/*.rs", "crates/relations/**/*.rs", "crates/values/**/*.rs", "languages/**/*.rs", "distribution/**/*.rs", "crates/core/**/*.rs", "crates/sdk/**/*.rs", "cli/**/*.rs"], exclude = ["**/tests/fixtures/**"], params = { library = ["ryo_execution_domain", "ryo_execution_domain::*", "ryo_execution_store", "ryo_execution_store::*", "ryo_execution_runtime", "ryo_execution_runtime::*", "ryo_execution::inbound::use_cases::execution::interface::*", "ryo_execution::application", "ryo_execution::application::*"], surface = ["ryo_execution_runtime::outbound", "ryo_execution_runtime::outbound::*", "ryo_execution::inbound::use_cases::execution::interface::{ObservationArenas,FrontierCaptures,Observing,FileRunInput,Partiality,CaptureContext,FileRules,RanRule,EmittedRoot,RuleAfter,FileEnd,FileStop,FinishedReadiness,KindSupport,SemanticSupport,SourceLanguage,RuleOutcome,RootOutcome,ProjectOutputOutcome,ProjectObservation,ObservedPublication,AdmittedOutput,ProgramPreparedExecutionPort,PreparedExecutionProgram,PreparedReporting,Demand,NamedLayout,ObservationContract,ReplayClosure,SemanticNeed,ObservedFrontierRoot,ProgramRequestExecutionPort,RequestExecution,ProjectRootExecution,ProgramProjectPhasePort,ProgramObservationStagePort,PhaseRules,ObservationBatches,BatchNumber,BatchOccurrence,Install,OccurrenceNumber,PhasePartials,PhaseStop,ProjectBatch,FrontiersError,RuleIndex,OperatingError,Covered,FileObservationReadiness,FilePartial,InapplicableFiles,Partial,Partials,RefusedFiles,Arena,SemanticLookup,RuleIntentError,ApplicabilityReason,CaptureIntent,DiagnosticDelivery,FileRuleIntent,ObservationDemand,RelationRead,ExecutionUseCase}{,::*}"] }, description = "Core, the SDK and the command line name only the seam's vocabulary, the list execution forwards, and of the engine crates below it only the runtime's outbound ports (the general entry's rule for them, which this one carries); a new forward needs a seam owner." },
  { rule = "idiomatic.arch/library-surface", include = ["crates/execution/tests/**/*.rs", "crates/execution/src/inbound/use_cases/*/acceptance.rs"], exclude = ["crates/execution/tests/fixtures/**"], params = { library = ["ryo_execution_runtime{,::*}", "ryo_execution_store{,::*}", "ryo_execution_domain{,::*}", "ryo_execution::application{,::*}", "ryo_execution::inbound::use_cases::execution::interface::*"], surface = ["ryo_execution::inbound::use_cases::execution::interface::{ObservationArenas,FrontierCaptures,Observing,FileRunInput,Partiality,CaptureContext,FileRules,RanRule,EmittedRoot,RuleAfter,FileEnd,FileStop,FinishedReadiness,KindSupport,SemanticSupport,SourceLanguage,RuleOutcome,RootOutcome,ProjectOutputOutcome,ProjectObservation,ObservedPublication,AdmittedOutput,ProgramPreparedExecutionPort,PreparedExecutionProgram,PreparedReporting,Demand,NamedLayout,ObservationContract,ReplayClosure,SemanticNeed,ObservedFrontierRoot,ProgramRequestExecutionPort,RequestExecution,ProjectRootExecution,ProgramProjectPhasePort,ProgramObservationStagePort,PhaseRules,ObservationBatches,BatchNumber,BatchOccurrence,Install,OccurrenceNumber,PhasePartials,PhaseStop,ProjectBatch,FrontiersError,RuleIndex,OperatingError,Covered,FileObservationReadiness,FilePartial,InapplicableFiles,Partial,Partials,RefusedFiles,Arena,SemanticLookup,RuleIntentError,ApplicabilityReason,CaptureIntent,DiagnosticDelivery,FileRuleIntent,ObservationDemand,RelationRead,ExecutionUseCase,ProgramFileSessionPort,ObserverPort,FactsWorker,ObservationStage,ProjectPhase,FileSession,FileInput,SourceRows,FileFinished,RowEmission,RuleDemand,EmitDemand,FrontierPurpose,FrontierCapture,CapturedFrontier}{,::*}", "ryo_execution_runtime::outbound::{digest,facts,operators,observer}::{interface,types,errors,factory,fixtures}{,::*}"] }, description = "The seam's witness, every integration test target of execution, the interpreter's own tests and the bdd acceptance modules tests/bdd.rs compiles by #[path] included, names only the seam it implements: the execution interface's forwards, among them the traits it implements and the handles they return, and the runtime's outbound ports with their fakes. It never names a runtime application, store or domain path. Core, the SDK and the command line keep their narrower caller surface (`:16`)." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/execution_store/Cargo.toml"], params = { allowed-siblings = ["execution_domain", "derived", "relations", "values", "language", "matching"] }, description = "The execution store sits on the domain and the portable semantic crates; it never depends on the engine above it." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution_store/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-execution-domain", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching"] }, description = "The same direction for aliased, published and git internal packages." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/execution_runtime/Cargo.toml"], params = { allowed-siblings = ["execution_domain", "execution_store", "derived", "relations", "values", "language", "matching", "operators"] }, description = "The execution runtime sits on the store, the domain and the portable semantic crates; it never depends on the execution crate above it." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution_runtime/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-execution-domain", "idiomatic-sh-ryo-execution-store", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators"] }, description = "The same direction for aliased, published and git internal packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["cli/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-core", "idiomatic-sh-ryo-css", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-execution-runtime", "idiomatic-sh-ryo-go", "idiomatic-sh-ryo-html", "idiomatic-sh-ryo-javascript", "idiomatic-sh-ryo-json", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-markdown", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-python", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-rust", "idiomatic-sh-ryo-sdk", "idiomatic-sh-ryo-toml", "idiomatic-sh-ryo-typescript", "idiomatic-sh-ryo-values"] }, description = "The command line takes the core, execution, the semantic crates and the languages it links, the SDK only for its tests (`edges-apart` refuses it as a normal dependency), and of the engine crates below execution only the runtime, whose outbound adapters (the digest, the facts store, the operators) its composition root wires (`library-surface` confines it to `ryo_execution_runtime::outbound`); never the engine's domain or store: a renamed binding (`dom = { package = ... }`) does not change the package." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/benchmark/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-benchmark-contracts", "idiomatic-sh-ryo-sdk", "idiomatic-sh-ryo-values"] }, description = "The benchmark workflow uses the SDK, its data vocabulary and the values; it never takes an engine crate, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/derived/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The portable derived semantics sit on the foundation crates; they never depend on the engine above them, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/query_language/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The query language sits on the foundation crates; it never depends on the engine above it, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/values/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-language", "idiomatic-sh-ryo-relations"] }, description = "The values sit on the language and relation foundation; they never depend on the engine above them, under any binding." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["languages/*/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-sdk"] }, description = "A language depends on the SDK alone among the internal packages, never on the core or an engine crate, under any binding." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/benchmark_contracts/Cargo.toml"], params = { allowed-siblings = ["sdk"] }, description = "Benchmark data uses the SDK public vocabulary only; it has no direct engine or benchmark workflow dependency." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/benchmark_contracts/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-sdk"] }, description = "Aliased, published and git dependencies preserve the same neutral-data adjacency." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/matching/Cargo.toml"], params = { allowed-siblings = [] }, description = "Matching semantics cannot depend on execution, core, or internal semantic owners." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/matching/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = [] }, description = "The same boundary rejects aliased, published and git internal engine dependencies." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/relations/Cargo.toml"], params = { allowed-siblings = [] }, description = "Exact reviewed foundational manifest direction." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/relations/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = [] }, description = "The foundational direction also applies to aliases and published/git internal packages." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/language/Cargo.toml"], params = { allowed-siblings = ["relations"] }, description = "Exact reviewed foundational manifest direction." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/language/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-relations"] }, description = "The foundational direction also applies to aliases and published/git internal packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/operators/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-language"] }, description = "The operator capability uses the relation foundation, portable plan values, public matching semantics and the language's tree and symbol types, which a run's resources lend; published and aliased dependencies follow the same boundary." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/operators/Cargo.toml"], params = { allowed-siblings = ["relations", "values", "matching", "language"] }, description = "Exact operator sibling manifests: the language crate only for the tree and symbol types a run's resources lend; engine implementations stay outside the capability." },
  { rule = "idiomatic.arch/bdd-members", include = ["**/src/inbound/use_cases/*.rs", "**/src/inbound/contracts/*.rs", "**/src/inbound/use_cases/*/acceptance.*", "**/src/inbound/contracts/*/acceptance.*", "**/tests/bdd.rs"], exclude = ["**/tests/fixtures/**"], description = "Colocated acceptance pairs have their owner and are declared by the integration harness across owned scopes." },
  # The import order between the crates, a v2 file's `layers` and `independent`: a crate depends on none above it, top to bottom the command line, the benchmark and its data vocabulary (which a language takes for its tests only), the languages, the SDK, the core, the query language, the values, the language crate (PE68); the command line and the SDK share nothing (PE48). Cargo refuses a cycle.
  { alias = "crate-layers", rule = "idiomatic.arch/layer-order", include = ["**/Cargo.toml"], exclude = ["cli/Cargo.toml", "**/tests/fixtures/**"], params = { layers = [["cli"], ["benchmark"], ["benchmark_contracts"], ["markdown", "python", "rust", "toml"], ["sdk"], ["core"], ["execution"], ["execution_runtime"], ["execution_store"], ["execution_domain"], ["operators", "derived"], ["query_language"], ["values"], ["language"], ["relations"], ["matching"]] }, description = "No crate depends on a crate of a layer above it: the edges use the core, the core the crates it calls, never the reverse." },
  { alias = "edges-apart", rule = "idiomatic.arch/layer-order", include = ["cli/Cargo.toml"], params = { layers = [["sdk"], ["cli"]] }, description = "The command line, the top layer, depends on no crate of the SDK: the two edges share nothing, so for the command line the SDK is a layer above." },
  { rule = "idiomatic.arch/distribution-wiring", include = ["**/cli/Cargo.toml", "**/distribution/smoke_test.rs"], description = "Cargo runs the placed sibling distribution proof behind its explicit feature." },
  { rule = "idiomatic.arch/extension-point-ports", include = ["languages"], params = { exposed = [] }, description = "A port an SDK resource module re-exports has no adapters in the core and its trait is its plain noun; every other port has at least one adapter." },
  # A cfg(any(test, feature = "fixtures")) seal crosses crates: the core's fixtures feature turns the engine's on (ProgramRequestExecutionPort::open_file).
  { rule = "idiomatic.arch/fixtures-only-in-tests", include = ["**/*.rs", "**/Cargo.toml"], description = "An item gated by `cfg(any(test, feature = \"fixtures\"))` is named only by test code: a production call of a gated method (one in a gated `impl` block included) in any crate, or a production path naming a gated module, function, constant or type of its own crate, is a finding." },
  { rule = "idiomatic.arch/workspace-fixtures-feature", include = ["Cargo.toml", "**/Cargo.toml"], exclude = ["**/tests/fixtures/**"], description = "A `[workspace.dependencies]` entry that enables `fixtures` is inherited only by `[dev-dependencies]`: the crate and language specs' `fixtures-feature` read only each crate's own manifest, so the workspace manifest's half of an inherited edge is held here." },
  { rule = "idiomatic.arch/no-default-trait-methods", include = ["crates/language/src/**/*.rs", "crates/relations/src/**/*.rs", "crates/sdk/src/resources/languages.rs", "crates/sdk/src/resources/languages/**/*.rs", "crates/execution_runtime/src/application/file_dag/program/runtime/service.rs", "crates/execution_runtime/src/outbound/facts/interface.rs", "crates/operators/src/domain/contract/types.rs", "crates/operators/src/inbound/use_cases/operators/interface.rs", "crates/operators/src/domain/physical_plan/types.rs", "crates/operators/src/inbound/use_cases/plan/interface.rs", "crates/operators/src/inbound/use_cases/run/interface.rs"], description = "The traits a language answers (the catalog, the row writer, the use cases) have no default method: adding a method breaks every language until it answers. Runtime kernel callbacks are also mandatory; omitted shared-walk admission cannot silently decline. The facts port's traits, the operators' contract, the plan's inputs and resources, and the operators, plan and run use cases are required in full too: a source, a resource, a planner or an operator never answers by a default." },
  { rule = "idiomatic.arch/no-negated-feature-cfg", include = ["cli/src/**/*.rs", "crates/benchmark/src/**/*.rs", "crates/benchmark_contracts/src/**/*.rs", "crates/core/src/**/*.rs", "crates/derived/src/**/*.rs", "crates/execution/src/**/*.rs", "crates/execution_domain/src/**/*.rs", "crates/execution_store/src/**/*.rs", "crates/language/src/**/*.rs", "crates/matching/src/**/*.rs", "crates/operators/src/**/*.rs", "crates/query_language/src/**/*.rs", "crates/relations/src/**/*.rs", "crates/sdk/src/**/*.rs", "crates/values/src/**/*.rs", "languages/*/src/**/*.rs", "languages/*/benchmarks/linters/*/src/**/*.rs"], description = "No code is compiled only when a feature is off: features are additive, so no build flag selects between two paths. Every crate but the execution runtime, whose four sites are in code the fused engine deletes." },
  # Only the src tree placed by the SDK spec below is the product's reexport surface.
  { rule = "idiomatic.arch/no-language-names", params = { languages = ["css", "html", "javascript", "python", "rust", "typescript"], written = ["go", "Go", "Go[!A-Za-z0-9]*", "*[!A-Za-z0-9]Go", "*[!A-Za-z0-9]Go[!A-Za-z0-9]*", "*golang*", "*JavaScript*", "*TypeScript*"] }, include = ["crates/**", "cli/**"], exclude = [
    "**/*_test.rs",
    "**/test.rs",
    "**/tests/**",
    "**/fixtures/**",
    "**/fixtures.rs",
    "**/acceptance.rs",
    "cli/src/languages.rs",
  ], description = "No comment and no string literal of an engine crate names a language, and no string literal of its core is a bare file extension: the engine owns the concepts and every language fulfils them. The one file excepted is `cli/src/languages.rs`, which `cli/build.rs` writes from the directories of `languages/`: the single edge that names the languages it links, behind the Cargo feature of each name (LG3, LG4)." },
  # Every error variant is matched by a test beside its errors.rs (U3).
  # The outside world, threads and JSON are reached only at the boundary: adapters, the
  # composition root, main.rs, a build script, tests, benches and test fixtures.
  # A command's and an SDK function's service calls are the methods of the interfaces they can reach, in any crate.
  # Rules that cross a namespace and its parts cannot be a spec's: a spec's rule reads only the files its own instance owns.
  { rule = "idiomatic.arch/collection-members", include = ["languages/*/src/**/collections.rs", "languages/*/src/**/collections/**"], params = { item-trait = [{ collection = "relations", trait = "ryo::languages::ReadItem" }, { collection = "manifests", trait = "ryo::languages::ReadItem" }, { collection = "links", trait = "ryo::languages::ReadItem" }] }, description = "A collection is whole: its list, its module file, its interface and its items, named apart from its neighbours. A language's relations, manifests and links collections bind relation rows through `ryo::reads!`, so their items implement ryo's `ReadItem`, the trait that states their shape: they have no interface of their own." },
  { rule = "idiomatic.arch/interface-present-unless-item-trait", include = ["**/src/**/collections/*/interface.rs", "**/src/**/collections/*/*/item.rs"], description = "A collection has an interface.rs exactly when its items import it: a collection whose items implement a trait of another crate (its pair in `item-trait`) has none. Held here, over the workspace: a collection spec's rules cannot see the files of the item instances nested in it." },
  { rule = "idiomatic.arch/item-contract", include = ["languages/*/src/**/collections/**"], description = "Each item's test runs its collection's shared cases when the collection has a fixtures/contract.rs." },
  { rule = "idiomatic.arch/item-fixtures", include = ["crates/core/**", "languages/**"], description = "Each relation and operator item has fixtures: an input and the expected rows, which the allocation and call-count tests read. A language whose relations are not written yet has the findings as its work list." },
  { rule = "idiomatic.ryo/derived-view-acquisition", include = ["crates/execution_runtime/src/**"], params = { confined = { variable = "confined-derived-names" }, owner-concept = "application/file_dag/derived" }, description = "Only the derived owner's concept, `application/file_dag/derived`, calls its acquiring entries (admit, acquire, scoped build, graph preparation and rows, demand answers, program-file preparation) and holds the views and handles it issues (`AcquiredView`, `CachedGraph`, `DerivedAccess` and the graph handles); domain operators use prepared contracts. A confined identifier anywhere else in a production file of the crate is reported." },
  { rule = "idiomatic.ryo/derived-view-acquisition", include = ["crates/execution_store/src/**"], params = { confined = { variable = "confined-derived-names" }, owner-concept = "application/file_dag/derived" }, description = "The store's derived owner concept, `application/file_dag/derived`, is the one place that acquires and holds the owner's views and access, as the runtime's entry says." },
  { rule = "idiomatic.ryo/derived-view-acquisition", include = ["crates/core/src/**"], params = { confined = { variable = "confined-derived-names" }, owner-concept = "application/derived" }, description = "Core holds none of the derived owner's access or views: it holds execution's opaque `DerivedViews` handle and names no confined identifier anywhere; `application/derived` is the owner concept the rule takes, and core has none." },
  { rule = "idiomatic.ryo/derived-view-acquisition", include = ["crates/execution/src/**", "crates/execution_domain/src/**"], params = { confined = { variable = "confined-derived-names" }, owner-concept = "application/derived" }, description = "The execution crate holds the derived owner's access only in its owner concept, `application/derived`, as core's entry has it; the domain crate names none of the confined identifiers." },
  { rule = "idiomatic.ryo/runtime-authority", include = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**"], params = { owner-records = [{ record = "AdmittedViewInputs", visibility = "private" }, { record = "GraphHandle", visibility = "private" }, { record = "DomainHandle", visibility = "private" }, { record = "DerivedStorage", visibility = "private" }, { record = "RequestDerived", visibility = "private" }, { record = "CacheBackend", visibility = "pub(in crate::application::file_dag::derived::owner)" }] }, description = "Seal real runtime authority, admitted-input and slot representations; only runtime.rs issues KernelAdmission. The derived owner's admitted view inputs, graph and domain handles, storage and request plan keep private fields, and its cache backend's fields stay within the owner." },
  { rule = "idiomatic.ryo/program-implementation-boundary", include = ["crates/core/src/**", "crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**"], description = "Only the executable-program owner and its explicit physical-kernel bridges may depend on internal admission, runtime, restoration, and permit implementations; callers use the facade." },
  { rule = "idiomatic.arch/compiler-ui", include = ["crates/language/tests/compile_fail.rs", "crates/sdk/tests/compile_fail.rs"], description = "The two trybuild runners, beside their compile-fail template entries, run the pass cases and then the compile-fail cases under tests/ui, directly: a runner that folds both into one glob is reported. Never placed per crate, where it would report every other file." },
  { rule = "idiomatic.ryo/absence-cites-the-standard", include = ["languages/*/src/inbound/contracts/*/contract.rs"], description = "A language contract's answer that the language lacks a relation, `AbsenceCause::NoSuchConstruct` or `AbsenceCause::NoManifests`, cites the standard: a `standard:` comment in the method names the document and section that lacks it." },
  { rule = "idiomatic.arch/operator-meaning-once", include = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**", "crates/values/src/domain/query_operators/types.rs"], exclude = ["**/*_test.rs", "**/fixtures.rs", "**/fixtures/**", "**/acceptance.rs"], params = { calls = ["{OperatorCall,*::OperatorCall}::*"], engine-calls = ["{OperatorCall,*::OperatorCall}::{Evaluate,OrderedExistence,ReduceCount,ReduceDigest}"], engine = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**"], kinds = ["crates/values/src/domain/query_operators/types.rs"], modules = ["crates/execution_domain/src/domain/operator.rs", "crates/execution_domain/src/domain/operator/**"], functions = ["crates/execution_runtime/src/application/file_dag/file_pass/**", "crates/execution_domain/src/domain/executable_program/**", "crates/execution_runtime/src/application/file_dag/fact_lookup/**"] }, description = "Execution reaches a kind's row meaning only through the operators' one evaluation call; besides it, the engine makes the ordered-existence driver call and the two reductions that prepare a grouping resource. No function where the evaluator lives (the file pass, the executable program, the fact lookup beside the pass) is named after a kind. The kinds are those `operation_kinds!` lists in values. Test code, fixtures and acceptance files are left out." },
  { rule = "idiomatic.arch/driver-implementers", include = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**", "crates/operators/src/domain/**"], params = { ports = ["crates/operators/src/domain/**"], traits = ["*Driver"], implementers = ["crates/execution_runtime/src/application/file_dag/ordered_existence/service.rs", "crates/execution_domain/src/domain/operator/contract/**", "crates/execution_domain/src/domain/operator/types/lease_driver/value.rs"] }, description = "The operators' driver ports are implemented by the engine's strategies only: the lease driver (`domain/operator/types/lease_driver/value.rs`), which hands each port to its join candidates, walks, graph lookups and row delivery, the prepared adjacency under `domain/operator/contract`, and the ordered-existence driver." },
  { rule = "idiomatic.arch/entry-traits-witnessed", include = ["crates/execution/src/inbound/use_cases/compile_rules/interface.rs", "crates/execution/src/inbound/use_cases/prepare/interface.rs", "crates/execution/src/inbound/use_cases/execution/interface.rs", "crates/execution_runtime/src/application/file_dag/program/prepared_execution/interface.rs", "crates/execution_runtime/src/application/file_dag/program/request_execution/interface.rs", "crates/execution_runtime/src/application/file_dag/program/file_session/interface.rs", "crates/execution_runtime/src/application/file_dag/program/project_phase/interface.rs", "crates/execution_runtime/src/application/file_dag/program/observation_stage/interface.rs", "crates/execution/tests/boundary_contract/submission/witness/fixtures.rs"], params = { interfaces = ["crates/execution/src/inbound/use_cases/compile_rules/interface.rs", "crates/execution/src/inbound/use_cases/prepare/interface.rs", "crates/execution/src/inbound/use_cases/execution/interface.rs", "crates/execution_runtime/src/application/file_dag/program/prepared_execution/interface.rs", "crates/execution_runtime/src/application/file_dag/program/request_execution/interface.rs", "crates/execution_runtime/src/application/file_dag/program/file_session/interface.rs", "crates/execution_runtime/src/application/file_dag/program/project_phase/interface.rs", "crates/execution_runtime/src/application/file_dag/program/observation_stage/interface.rs"], witness = ["crates/execution/tests/boundary_contract/submission/witness/fixtures.rs"], implementer = ["Witness"], non-entries = [{ trait = "CompileRulesUseCase", why = "compiles the rules a request declares into plans and identities before any root exists" }, { trait = "ProgramPreparedExecutionPort", why = "read-only metadata of a prepared program: a rule outside it answers an error and nothing is held, admitted or changed" }, { trait = "PreparedReporting", why = "reads the run metadata and the replay closure of a finished preparation; it takes no root" }, { trait = "ProgramFileSessionPort", why = "the engine's own per-rule session under run_file, opened only by the interpreter's own cases; a file is submitted through run_file, whose refusal control the witness carries" }] }, description = "Every public trait of the submission surface (the three use case interfaces and the interface of each program handle) is implemented by the submission witness, whose methods each have a refusal control, or is named here as read-only with its reason." },
  { rule = "idiomatic.arch/catalog-lists-every-item", include = ["crates/relations/src/domain/relations/collections/relations.rs", "crates/relations/src/domain/catalog/service.rs"], params = { collection = ["crates/relations/src/domain/relations/collections/relations.rs"], catalog = ["crates/relations/src/domain/catalog/service.rs"], except = ["interface"] }, description = "Every relation module of the relations collection is listed by `each_relation!`, the catalog every crate that handles each relation calls." },
  { rule = "idiomatic.arch/grammar-lists-every-parser", include = ["crates/query_language/src/outbound/syntax/adapters/winnow/adapter.rs", "crates/query_language/src/outbound/syntax/adapters/winnow/constants.rs", "crates/values/src/domain/descriptions/constants.rs", "crates/relations/src/domain/relations/constants.rs"], params = { parsers = ["crates/query_language/src/outbound/syntax/adapters/winnow/adapter.rs"], grammar = ["crates/query_language/src/outbound/syntax/adapters/winnow/constants.rs"], input = ["&mut Input*"], field = ["name"] }, description = "Every parser function of the RyoQL winnow adapter has its `GRAMMAR` row, which `--help` and `explain` print, and every row names a parser; a row named by a shared constant reads it from the values and relations constants." },
  { rule = "idiomatic.ryo/shared-walk-owner", include = ["crates/execution/src/**", "crates/execution_runtime/src/**", "crates/execution_domain/src/**", "crates/execution_store/src/**"], description = "Every execution layer respects the required private file-walk owner; only its semantic service and exact registered unit proof may use raw walk semantics." },
]
templates = [
  { template = "idiomatic.arch/clippy-config", file = "clippy.toml", description = "The product's clippy configuration: the in-tests allowances that go with the restriction lints at deny." },
  { template = "idiomatic.arch/build-script", file = "cli/build.rs", description = "The command line's build script: it writes `src/languages.rs`, the one file that links the language crates, from the directories of `languages/` (LG3, LG4)." },
  { template = "idiomatic.arch/compile-fail", file = "crates/language/tests/compile_fail.rs", description = "The trybuild runner of the language crate's compile cases: the cases that compile, then the ones that do not." },
  { template = "idiomatic.arch/ui-case", file = "crates/language/tests/ui/fail_{rejected}.rs", params = { case = "{rejected}" }, count = { min = 8 }, description = "A use of the contract the compiler must reject: a `Parse` that leaves a relation unanswered, a `Project` that leaves a manifest relation unanswered, and a reader that writes the row of another relation." },
  { template = "idiomatic.arch/ui-stderr", file = "crates/language/tests/ui/fail_{rejected}.stderr", params = { case = "{rejected}" }, count = { min = 8 }, description = "What the compiler says of each rejected case: it names the item left out." },
  { template = "idiomatic.arch/ui-pass", file = "crates/language/tests/ui/pass_{accepted}.rs", params = { case = "{accepted}" }, description = "A use of the contract the compiler accepts: every relation answered, and a reader that writes the rows of its own." },
  { template = "idiomatic.arch/allocation-test", file = "crates/language/tests/allocation.rs", description = "The kernel language crate's allocation test: it runs alone in its process, with dhat as the global allocator." },
  { alias = "sdk-compile-fail", template = "idiomatic.arch/compile-fail", file = "crates/sdk/tests/compile_fail.rs", description = "The SDK's own compile cases: what a program that reads or declares through the SDK must not be able to write." },
  { alias = "sdk-ui-case", template = "idiomatic.arch/ui-case", file = "crates/sdk/tests/ui/fail_{sdk_rejected}.rs", params = { case = "{sdk_rejected}" }, count = { min = 8 }, description = "The SDK's own compile cases: what a program that reads or declares through the SDK must not be able to write." },
  { alias = "sdk-ui-stderr", template = "idiomatic.arch/ui-stderr", file = "crates/sdk/tests/ui/fail_{sdk_rejected}.stderr", params = { case = "{sdk_rejected}" }, count = { min = 8 }, description = "The SDK's own compile cases: what a program that reads or declares through the SDK must not be able to write." },
  { alias = "sdk-ui-pass", template = "idiomatic.arch/ui-pass", file = "crates/sdk/tests/ui/pass_{sdk_accepted}.rs", params = { case = "{sdk_accepted}" }, description = "The SDK's own compile cases: what a program that reads or declares through the SDK must not be able to write." },
  { template = "idiomatic.arch/lint-allocation-test", file = "crates/core/tests/allocation.rs", description = "The allocation row of the whole per-file path over the core's own corpus (the fake language), run alone in its process; a language's own allocation test is in the language." },
  { template = "idiomatic.arch/lint-call-count-test", file = "cli/tests/call_count.rs", description = "The call-count row of the whole per-file path: a port is called for a file, never for a row." },
  { template = "idiomatic.arch/cargo-workspace", file = "Cargo.toml", params = { version = "0.1.4" }, description = "The product's Cargo workspace: its crates as members, the shared dependencies and the lints every crate inherits." },
  { template = "idiomatic.arch/cargo-lock", file = "Cargo.lock", description = "The product's Cargo.lock, committed so every build resolves the same dependencies." },
  { template = "idiomatic.arch/unchecked", file = "release-plz.toml", description = "The release pull request's configuration: release-plz opens it, every crate at the workspace's new version and the changelog, and nothing else." },
  { template = "idiomatic.arch/unchecked", file = "CHANGELOG.md", count = { min = 0 }, description = "The product's changelog, which each release pull request writes: absent until the first." },
  { template = "idiomatic.arch/tastemaker-lock", file = "tastemaker.lock", description = "This file's lock: the definition versions the product resolved." },
  { template = "idiomatic.arch/product-readme", file = "README.md", params = { product = "ryo" }, description = "The product's README: what it is for, how to install it and one checked command line example." },
  { template = "idiomatic.arch/public-api", file = "crates/sdk/api.txt", params = { library = "ryo" }, description = "The recorded public API of the SDK, written by `cargo public-api`: the baseline of its semver gate." },
  { template = "idiomatic.arch/deny-config", file = "deny.toml", description = "The product's cargo-deny policy for licenses, bans and sources." },
  { template = "idiomatic.arch/mutants-config", file = ".cargo/mutants.toml", description = "The product's cargo-mutants configuration." },
  { template = "idiomatic.arch/nextest-config", file = ".config/nextest.toml", description = "The product's cargo-nextest configuration." },
  { template = "idiomatic.arch/asymptote-config", file = "asymptote.toml", description = "The tools whose findings the product's asymptote lock ratchets." },
  { template = "idiomatic.arch/asymptote-lock", file = ".asymptote/operations/{operation}.lock", count = { min = 0 }, description = "One of the lock files asymptote writes: the findings accepted for one operation." },
  { template = "idiomatic.arch/doc-page", file = "docs/{*page}", count = { min = 0 }, description = "A page of the product's docs." },
  { alias = "benchmark-doc-page", template = "idiomatic.arch/doc-page", file = "crates/benchmark/docs/{*page}", count = { min = 0 }, description = "The measured per-rule Django bottleneck tables of the benchmark crate." },
]
specs = [
  { spec = "idiomatic.arch/crate", include = ["crates/matching"], params = { package = "idiomatic-sh-ryo-matching", library = "ryo_matching", binary = "absent", distribution = "absent" } },
  { alias = "crate-execution-domain", spec = "idiomatic.arch/crate", include = ["crates/execution_domain"], params = { package = "idiomatic-sh-ryo-execution-domain", library = "ryo_execution_domain", binary = "absent", distribution = "absent" }, description = "The engine's domain crate, the bottom of the engine crates: its package files, library root, README and the case support of a crate with a domain and no use case." },
  { alias = "nu-hex-execution-domain", spec = "idiomatic.arch/nu-hex", include = ["crates/execution_domain"], params = { exposed = [], plugins = [], implements = [], item-trait = [] }, description = "The execution engine's domain layer as a crate of its own: the compiled program, operator contracts and drivers, tables, shared walk and the pure semantics the engine crates share; no use case, no port, and only the engine crates name it." },
  { alias = "nu-hex-matching", spec = "idiomatic.arch/nu-hex", include = ["crates/matching"], params = { exposed = [], plugins = [], implements = [], item-trait = [] }, description = "Pure regex and glob semantics behind public inbound use cases; engine owns acquisition and lifetime." },
  { alias = "crate-operators", spec = "idiomatic.arch/crate", include = ["crates/operators"], params = { package = "idiomatic-sh-ryo-operators", library = "ryo_operators", binary = "absent", distribution = "absent" }, description = "Portable operator capability behind its inbound contract; core scheduling and ownership remain outside this crate." },
  { alias = "nu-hex-operators", spec = "idiomatic.arch/nu-hex", include = ["crates/operators"], params = { exposed = [], plugins = [], implements = [], item-trait = [] }, description = "The operator capability uses the same inbound/application/domain/outbound responsibilities and injected contracts as every hex." },
  { alias = "crate-derived", spec = "idiomatic.arch/crate", include = ["crates/derived"], params = { package = "idiomatic-sh-ryo-derived", library = "ryo_derived", binary = "absent", distribution = "absent" }, description = "Portable derived-view semantics behind its inbound contracts; acquisition and lifetime belong to the caller." },
  { alias = "nu-hex-derived", spec = "idiomatic.arch/nu-hex", include = ["crates/derived"], params = { exposed = [], plugins = [], implements = [], item-trait = [] }, description = "The derived capability uses the same inbound and domain responsibilities and injected contracts as every hex." },
  { alias = "crate-benchmark", spec = "idiomatic.arch/crate", include = ["crates/benchmark"], params = { package = "idiomatic-sh-ryo-benchmark", library = "ryo_benchmark", binary = "ryo-benchmark-collector", distribution = "absent" }, description = "The shared development benchmark harness." },
  { spec = "idiomatic.ryo/benchmark-collector", include = ["crates/benchmark"], description = "The explicit isolated collector executable and its resource proof." },
  { alias = "nu-hex-benchmark", spec = "idiomatic.arch/nu-hex", include = ["crates/benchmark"], params = { exposed = [], plugins = [], implements = [], item-trait = [] }, description = "Shared benchmark use cases, domain and outbound contracts." },
