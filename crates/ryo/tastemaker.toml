  { spec = "idiomatic.ryo/provider-imports", include = ["languages/{lang}/src", "languages/{lang}/tests", "languages/{lang}/benchmarks/provider"], imports = { default = "deny", allow = ["ryo_benchmark::*", "ryo_*::fixtures::*", "ryo::linter::*", "languages::*", "ryo::resources::languages::*", "ryo::languages", "ryo::languages::*", "crate::*", "self::*", "super::*", "std::sync::Arc", "std::cell::Ref", "std::cell::RefCell", "std::collections::*", "std::hash::*", "std::fmt::*", "std::str::*", "std::string::*", "std::ops::*", "std::iter::*", "std::cmp::*", "std::convert::*", "std::mem::*", "std::borrow::*", "std::path::*", "std::error::*", "std::marker::*", "std::num::*", "std::slice::*", "std::vec::*", "std::option::*", "std::result::*", "std::char::*", "core::*", "thiserror::*", "strum::*"] }, description = "The existing provider import allowlist applies to implementation, tests and provider benchmarks, while linter evidence belongs to its own closed benchmark roles." },
