# crates/ryo/tastemaker.toml (paths are relative to this file's directory)
# A crate sits at crates/<crate>. A product
# starts with one crate of the one kind: `crates/core`, a
# nu-hex (the use cases the command line calls, the core's values and rules, the ports it
# needs from outside, and under each port its adapters and the factory the command line's
# compositions call). Add a nu-hex with an entry as this one is placed.
tastemaker = "0.1.0"
variables = { internal-packages = ["idiomatic-sh-ryo", "idiomatic-sh-ryo-benchmark", "idiomatic-sh-ryo-benchmark-contracts", "idiomatic-sh-ryo-core", "idiomatic-sh-ryo-css", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-go", "idiomatic-sh-ryo-html", "idiomatic-sh-ryo-javascript", "idiomatic-sh-ryo-json", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-markdown", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-python", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-rust", "idiomatic-sh-ryo-sdk", "idiomatic-sh-ryo-toml", "idiomatic-sh-ryo-typescript", "idiomatic-sh-ryo-values"] }
workspace = { name = "ryo", members = ["crates/execution", "crates/sdk", "crates/execution/src/application/file_dag", "languages/*", "languages/*/src"], rules-exclude = ["**/tests/fixtures/refusals/**", "languages/*/tests/fixtures/relations/*/input.*", "**/tests/fixtures/suite/**/*.*", "**/tests/fixtures/standard/**/*.*", "**/tests/fixtures/corpus/**/*.*", "languages/go/tests/fixtures/manifests/workspace/skip/**", "languages/*/tests/fixtures/manifests/invalid-*/**"], dependencies = [{ package = "idiomatic.arch", path = "../../tastemaker" }, { package = "idiomatic.ryo", path = "tastemaker" }] }
rules = [
  { rule = "idiomatic.arch/test-directory-layout", include = ["**"], description = "All placed compiled-owner proofs and grouped inbound controls use generic role filenames and normal registration." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/sdk/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-core", "idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The sdk owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/core/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-execution", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The core owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/execution/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-derived", "idiomatic-sh-ryo-language", "idiomatic-sh-ryo-matching", "idiomatic-sh-ryo-operators", "idiomatic-sh-ryo-query_language", "idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values"] }, description = "The execution owner cannot acquire a benchmark-only data or workflow dependency, including renamed, registry and git packages." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/benchmark_contracts/Cargo.toml"], params = { allowed-siblings = ["sdk"] }, description = "Benchmark data uses the SDK public vocabulary only; it has no direct engine or benchmark workflow dependency." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/benchmark_contracts/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-sdk"] }, description = "Aliased, published and git dependencies preserve the same neutral-data adjacency." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/matching/Cargo.toml"], params = { allowed-siblings = [] }, description = "Matching semantics cannot depend on execution, core, or internal semantic owners." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/matching/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = [] }, description = "The same boundary rejects aliased, published and git internal engine dependencies." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/relations/Cargo.toml"], params = { allowed-siblings = [] }, description = "Exact reviewed foundational manifest direction." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/relations/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = [] }, description = "The foundational direction also applies to aliases and published/git internal packages." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/language/Cargo.toml"], params = { allowed-siblings = ["relations"] }, description = "Exact reviewed foundational manifest direction." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/language/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-relations"] }, description = "The foundational direction also applies to aliases and published/git internal packages." },
  { rule = "idiomatic.arch/internal-package-allowlist", include = ["crates/operators/Cargo.toml"], params = { internal-packages = { variable = "internal-packages" }, allowed-packages = ["idiomatic-sh-ryo-relations", "idiomatic-sh-ryo-values", "idiomatic-sh-ryo-matching"] }, description = "The operator capability uses the relation foundation, portable plan values and public matching semantics; published and aliased dependencies follow the same boundary." },
  { rule = "idiomatic.arch/local-dependency-allowlist", include = ["crates/operators/Cargo.toml"], params = { allowed-siblings = ["relations", "values", "matching"] }, description = "Exact operator sibling manifests; engine, language and derived implementations stay outside the capability." },
  { rule = "idiomatic.arch/bdd-members", include = ["languages/*/src/inbound/use_cases/*.rs", "languages/*/src/inbound/contracts/*.rs", "languages/*/src/inbound/use_cases/*/acceptance.*", "languages/*/src/inbound/contracts/*/acceptance.*", "languages/*/tests/bdd.rs", "crates/execution/src/inbound/use_cases/publication.rs", "crates/execution/src/inbound/use_cases/publication/acceptance.*", "crates/execution/tests/bdd.rs"], exclude = ["**/tests/fixtures/**"], description = "Colocated acceptance pairs have their owner and are declared by the integration harness across owned scopes." },
  # The import order between the crates, a v2 file's `layers` and `independent`: a crate depends on none above it, top to bottom the command line, the languages, the SDK, the core, the query language, the values, the language crate (PE68); the command line and the SDK share nothing (PE48). Cargo refuses a cycle.
  { alias = "crate-layers", rule = "idiomatic.arch/layer-order", include = ["**/Cargo.toml"], exclude = ["cli/Cargo.toml", "**/tests/fixtures/**"], params = { layers = [["cli"], ["markdown", "python", "rust", "toml"], ["benchmark"], ["benchmark_contracts"], ["sdk"], ["core"], ["execution"], ["operators", "derived"], ["query_language"], ["values"], ["language"], ["relations"], ["matching"]] }, description = "No crate depends on a crate of a layer above it: the edges use the core, the core the crates it calls, never the reverse." },
  { alias = "edges-apart", rule = "idiomatic.arch/layer-order", include = ["cli/Cargo.toml"], params = { layers = [["sdk"], ["cli"]] }, description = "The command line, the top layer, depends on no crate of the SDK: the two edges share nothing, so for the command line the SDK is a layer above." },
  { rule = "idiomatic.arch/distribution-wiring", include = ["**/cli/Cargo.toml", "**/distribution/smoke_test.rs"], description = "Cargo runs the placed sibling distribution proof behind its explicit feature." },
  { rule = "idiomatic.arch/extension-point-ports", include = ["languages"], params = { exposed = [] }, description = "A port an SDK resource module re-exports has no adapters in the core and its trait is its plain noun; every other port has at least one adapter." },
  { rule = "idiomatic.arch/no-default-trait-methods", include = ["crates/language/src/**/*.rs", "crates/relations/src/**/*.rs", "crates/sdk/src/resources/languages.rs", "crates/sdk/src/resources/languages/**/*.rs", "crates/execution/src/application/file_dag/program/runtime/service.rs"], description = "The traits a language answers (the catalog, the row writer, the use cases) have no default method: adding a method breaks every language until it answers. Runtime kernel callbacks are also mandatory; omitted shared-walk admission cannot silently decline." },
  # Only the src tree placed by the SDK spec below is the product's reexport surface.
  { rule = "idiomatic.arch/no-language-names", params = { languages = ["css", "html", "javascript", "python", "rust", "typescript"], written = ["go", "Go", "Go[!A-Za-z0-9]*", "*[!A-Za-z0-9]Go", "*[!A-Za-z0-9]Go[!A-Za-z0-9]*", "*golang*", "*JavaScript*", "*TypeScript*"] }, include = ["crates/**", "cli/**"], exclude = ["**/*_test.rs", "**/test.rs", "**/tests/**", "**/fixtures/**", "**/fixtures.rs", "**/acceptance.rs", "**/distinct_integration/**", "**/compiled_parity/**", "cli/src/languages.rs", "crates/execution/**/tastemaker.toml"], description = "No comment and no string literal of an engine crate names a language, and no string literal of its core is a bare file extension: the engine owns the concepts and every language fulfils them. The one file excepted is `cli/src/languages.rs`, which `cli/build.rs` writes from the directories of `languages/`: the single edge that names the languages it links, behind the Cargo feature of each name (LG3, LG4)." },
  # Every error variant is matched by a test beside its errors.rs (U3).
  # The outside world, threads and JSON are reached only at the boundary: adapters, the
  # composition root, main.rs, a build script, tests, benches and test fixtures.
  # A command's and an SDK function's service calls are the methods of the interfaces they can reach, in any crate.
  # Rules that cross a namespace and its parts cannot be a spec's: a spec's rule reads only the files its own instance owns.
  { rule = "idiomatic.arch/collection-members", include = ["languages/*/src/**/collections.rs", "languages/*/src/**/collections/**"], exclude = ["languages/*/src/domain/relations/collections.rs", "languages/*/src/domain/relations/collections/**", "languages/*/src/domain/manifests/collections.rs", "languages/*/src/domain/manifests/collections/**", "languages/*/src/domain/links/collections.rs", "languages/*/src/domain/links/collections/**"], description = "A collection is whole: its list, its module file, its interface and its items, named apart from its neighbours. Excepted are the collections of a language's relations, manifests and links: ryo owns the shape of their items, which a language implements and never defines, so they have no interface of their own." },
  { rule = "idiomatic.arch/interface-present-unless-item-trait", include = ["**/src/**/collections/*/interface.rs", "**/src/**/collections/*/*/item.rs"], description = "A collection has an interface.rs exactly when its items import it: a collection whose items implement a trait of another crate (its pair in `item-trait`) has none. Held here, over the workspace: a collection spec's rules cannot see the files of the item instances nested in it." },
  { rule = "idiomatic.arch/item-contract", include = ["languages/*/src/**/collections/**"], description = "Each item's test runs its collection's shared cases when the collection has a fixtures/contract.rs." },
  { rule = "idiomatic.arch/item-fixtures", include = ["crates/core/**", "languages/**"], description = "Each relation and operator item has fixtures: an input and the expected rows, which the allocation and call-count tests read. A language whose relations are not written yet has the findings as its work list." },
  { rule = "idiomatic.ryo/derived-view-acquisition", include = ["crates/core/src/**", "crates/execution/src/**"], description = "Only the derived-view implementation and application owner may reach the resolved registry/build entrypoints; domain operators use prepared contracts." },
  { rule = "idiomatic.ryo/runtime-authority", include = ["crates/execution/src/**"], description = "Seal real runtime authority, admitted-input and slot representations; only runtime.rs issues KernelAdmission." },
  { rule = "idiomatic.ryo/program-implementation-boundary", include = ["crates/core/src/**", "crates/execution/src/**"], description = "Only the executable-program owner and its explicit physical-kernel bridges may depend on internal admission, runtime, restoration, and permit implementations; callers use the facade." },
  { rule = "idiomatic.arch/compiler-ui", include = ["crates/language/tests/compile_fail.rs", "crates/sdk/tests/compile_fail.rs"], description = "The two trybuild runners, beside their compile-fail template entries, run the pass cases and then the compile-fail cases under tests/ui, directly: a runner that folds both into one glob is reported. Never placed per crate, where it would report every other file." },
  { rule = "idiomatic.ryo/absence-cites-the-standard", include = ["languages/*/src/inbound/contracts/*/contract.rs"], description = "A language contract's answer that the language lacks a relation, `AbsenceCause::NoSuchConstruct` or `AbsenceCause::NoManifests`, cites the standard: a `standard:` comment in the method names the document and section that lacks it." },
  { rule = "idiomatic.ryo/shared-walk-owner", include = ["crates/execution/src/**"], description = "Every execution layer respects the required private file-walk owner; only its semantic service and exact registered unit proof may use raw walk semantics." }, { rule = "idiomatic.ryo/project-batch-owner", include = ["crates/core/src"], description = "What the rule checks, on one line." },
]
templates = [
  { alias = "lint-project-budget-module", template = "idiomatic.ryo/program-runtime-proof", file = "crates/core/src/inbound/use_cases/lint/use_case_test/project_budget/mod.rs", description = "Normal module registration for real lint project budget controls." },
  { alias = "lint-project-budget-fixtures", template = "idiomatic.ryo/program-runtime-proof", file = "crates/core/src/inbound/use_cases/lint/use_case_test/project_budget/fixtures/mod.rs", description = "Injected memory pressure follows actual portable reduction work through the production lint fixture." },
  { alias = "lint-project-budget-test", template = "idiomatic.arch/unit-test", file = "crates/core/src/inbound/use_cases/lint/use_case_test/project_budget/test.rs", params = { kind = "use-case", part = "project_budget" }, description = "Six independent real lint ordinary/named budget, unreadable-memory and success rows." },
  { alias = "lint-inapplicable-identity-module", template = "idiomatic.ryo/program-runtime-proof", file = "crates/core/src/inbound/use_cases/lint/use_case_test/inapplicable_identity/mod.rs", description = "Normal module registration for the lint controls over rules that skip different files." },
  { alias = "lint-inapplicable-identity-fixtures", template = "idiomatic.ryo/program-runtime-proof", file = "crates/core/src/inbound/use_cases/lint/use_case_test/inapplicable_identity/fixtures/mod.rs", description = "A producer and a consumer of a named observation, one of which skips the file the language rejects, through the production lint fixture." },
  { alias = "lint-inapplicable-identity-test", template = "idiomatic.arch/unit-test", file = "crates/core/src/inbound/use_cases/lint/use_case_test/inapplicable_identity/test.rs", params = { kind = "use-case", part = "inapplicable_identity" }, description = "Cold, warm and rows runs of rules with different inapplicable files answer alike in the memory and postcard stores." },
  { template = "idiomatic.arch/value", file = "crates/matching/src/inbound/use_cases/matching/compiled.rs", description = "Opaque compiled semantic values own their regex/glob representation; only inbound operations inspect it." },
  { template = "idiomatic.arch/value", file = "crates/values/src/domain/observations/validated.rs", description = "The checked view of frontier readiness is sealed: only the observations service constructs it." },
  { template = "idiomatic.arch/unchecked", file = "crates/derived/LICENSE", description = "The shared repository license shipped with the derived capability." },
  { template = "idiomatic.arch/unchecked", file = "crates/operators/LICENSE", description = "The shared repository license shipped with the operator capability." },
  { template = "idiomatic.arch/unchecked", file = "crates/core/LICENSE", description = "A link to the repository's LICENSE, the license text the crate ships: a path, never followed." },
  { template = "idiomatic.arch/unchecked", file = "crates/language/LICENSE", description = "A link to the repository's LICENSE, the license text the crate ships: a path, never followed." },
