  { spec = "idiomatic.ryo/executable-program-owner", include = ["crates/execution/src/application/file_dag"], description = "The cohesive file DAG executable-program application owner and its exact nested parts." }, { spec = "idiomatic.arch/nu-hex", include = ["crates/execution"], params = { exposed = "[]", implements = "[]", item-trait = "[]", plugins = "[]" }, description = "Domain owns core concepts, invariants, algorithms and data models, independent of I/O and workflow. Application owns cohesive operations over domain and outbound, including shared state and its lifetime. Outbound owns injected contracts and adapters for external facts, storage and effects. Inbound/use cases provide slim, readable orchestration. Separation of responsibilities does not require copied data or repeated computations. Within one crate, imports: inbound → application/domain/outbound; application → domain/outbound; domain and outbound → no other architectural layers. Own-layer, standard-library and external dependencies are allowed. Edges construct outbound store adapters from path configuration and inject their interfaces. Application owns their use and lifetime; domain never opens storage." }, { spec = "idiomatic.arch/use-case", include = ["crates/execution/src/inbound/use_cases/execution"], params = { implements = "[]" }, description = "One use case of a core: the interface an edge calls, the body that holds its injected ports and explicitly owned invocation state, its test, and the plain types and errors it has." }, { spec = "idiomatic.arch/concept", include = ["crates/values/src/domain/query_bindings"], params = { item-trait = "[]" }, description = "One domain concept." }, { spec = "idiomatic.arch/concept", include = ["crates/values/src/domain/rule_requests"], params = { item-trait = "[]" }, description = "One domain concept." }, { spec = "idiomatic.arch/crate", include = ["crates/execution"], params = { binary = "absent", distribution = "absent", library = "ryo_execution", package = "idiomatic-sh-ryo-execution" }, description = "A crate: its package files, named for its product and folder, its library root, its README and its bench (split by workload when it grows, S2), and the test support its unit tests share. Its tests are of three kinds: the unit test beside its primitive (`*_test.rs`, one `CASES` table run by the four case words), the contract a port exports for its implementations to run (`fixtures/contract.rs`), and the crate's behaviour through its surface, one colocated `acceptance.feature` and `acceptance.rs` per use case, run by `tests/bdd.rs`, using production storage adapters for lifecycle acceptance. It places no composition root, which only an edge holds (a command, an SDK function, a macro crate, a language provider)." }, { alias = "crate-benchmark-contracts", spec = "idiomatic.arch/crate", include = ["crates/benchmark_contracts"], params = { binary = "absent", distribution = "absent", library = "ryo_benchmark_contracts", package = "idiomatic-sh-ryo-benchmark-contracts" }, description = "A crate: its package files, named for its product and folder, its library root, its README and its bench (split by workload when it grows, S2), and the test support its unit tests share. Its tests are of three kinds: the unit test beside its primitive (`*_test.rs`, one `CASES` table run by the four case words), the contract a port exports for its implementations to run (`fixtures/contract.rs`), and the crate's behaviour through its surface, one colocated `acceptance.feature` and `acceptance.rs` per use case, run by `tests/bdd.rs`, using production storage adapters for lifecycle acceptance. It places no composition root, which only an edge holds (a command, an SDK function, a macro crate, a language provider)." }, { alias = "nu-hex-benchmark-contracts", spec = "idiomatic.arch/nu-hex", include = ["crates/benchmark_contracts"], params = { exposed = "[]", implements = "[]", item-trait = "[]", plugins = "[]" }, description = "Domain owns core concepts, invariants, algorithms and data models, independent of I/O and workflow. Application owns cohesive operations over domain and outbound, including shared state and its lifetime. Outbound owns injected contracts and adapters for external facts, storage and effects. Inbound/use cases provide slim, readable orchestration. Separation of responsibilities does not require copied data or repeated computations. Within one crate, imports: inbound → application/domain/outbound; application → domain/outbound; domain and outbound → no other architectural layers. Own-layer, standard-library and external dependencies are allowed. Edges construct outbound store adapters from path configuration and inject their interfaces. Application owns their use and lifetime; domain never opens storage." }, { spec = "idiomatic.arch/concept", include = ["crates/execution/src/domain/executable_program/observations"], params = { item-trait = "[]" }, description = "One domain concept." },
]
