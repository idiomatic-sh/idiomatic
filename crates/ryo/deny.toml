[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  # ruff_python_parser's ruff_unicode_names2 ships the Unicode Character Database under it (OSI approved).
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# clig.dev, "Interactivity" and "Signals": a command line takes every input as a flag or an
# argument and never prompts, and Ctrl-C ends it at once, so no crate that prompts or
# handles a signal is linked.
deny = [
  { crate = "dialoguer", reason = "a command line never prompts: every input is a flag or an argument (clig.dev, Interactivity)" },
  { crate = "inquire", reason = "a command line never prompts: every input is a flag or an argument (clig.dev, Interactivity)" },
  { crate = "rpassword", reason = "a command line never prompts, and takes no secret (clig.dev, Interactivity)" },
  { crate = "ctrlc", reason = "Ctrl-C ends a command line at once, with no handler (clig.dev, Signals and control characters)" },
  { crate = "signal-hook", reason = "Ctrl-C ends a command line at once, with no handler (clig.dev, Signals and control characters)" },
  # Ryo carries no Tastemaker concern: Ryo runs the `tm` binary as a tool and never links Tastemaker's crates.
  { crate = "idiomatic-sh-tastemaker", reason = "no Tastemaker concern is in Ryo: Ryo runs the tm binary as a tool, never links it" },
  { crate = "idiomatic-sh-tastemaker-core", reason = "no Tastemaker concern is in Ryo: Ryo runs the tm binary as a tool, never links it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
