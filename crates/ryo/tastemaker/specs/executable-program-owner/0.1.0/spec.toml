description = "The cohesive file DAG executable-program application owner and its exact nested parts."
why = "The application service owns one request's preparation, admission, invocation, and publication. These exact files are declared so a new nested implementation must be deliberately placed; the existing application-service sibling boundary and program implementation dependency rule remain active."
closed      = false

templates = [
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program.rs", description = "The executable-program module boundary." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/admission.rs", description = "Owner-issued source admission and lineage." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/context.rs", description = "Owner-bound run context and symbol generation." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/preparation/mod.rs", description = "Private registration of immutable request preparation roles." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/preparation/types.rs", description = "Immutable prepared program and request metadata, independent of run orchestration." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/preparation/service.rs", description = "Request compilation, identity preparation and immutable metadata access." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/protocol/mod.rs", description = "Private registration of neutral execution protocol roles." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/protocol/types.rs", description = "Neutral run intents, output DTOs and opaque admitted handovers." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/protocol/service.rs", description = "Validation of admitted handovers without execution policy." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/facade_runtime.rs", description = "Outer file and project execution orchestration." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/facade_runtime/file_execution.rs", description = "File-owned frontier capture and commit." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/facade_runtime/project_execution.rs", description = "Project-owned deferred source admission." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/facade_runtime/source_admission.rs", description = "Typed deferred source handles." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/kernel_session.rs", description = "Borrowed physical-kernel bridge under invocation permit." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/native_walk.rs", description = "Application-owned shared native pass admission and publication." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/project_population/mod.rs", description = "Private project input/invocation population namespace; normal Rust registration remains required." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/project_population/service.rs", description = "Phase-owned canonical input backing and population-qualified invocation identity; admission remains demand-driven." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/project_population/types.rs", description = "Neutral structural source and invocation records; no facade or session dependency." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/request_identity.rs", description = "One request's source and generation identity." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/restored.rs", description = "Validated deferred restoration." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/selection.rs", description = "Admitted compact selection construction and publication proof." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/native_join.rs", description = "Permit-bound native traversal kernel delivery." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "relations/positioned.rs", description = "Relation-owner native tuple validation and immutable population issuance." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "relations/selection.rs", description = "Relation-owner selected population validation and resource ownership." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/runtime/mod.rs", description = "Private registration of the sole invocation runtime owner." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/runtime/types.rs", description = "Runtime-owned state, contracts and unforgeable authority with owner-scoped representations." },
  { template = "idiomatic.ryo/executable-program-part@0.1.0", file = "program/runtime/service.rs", description = "Sole admission interpreter, authority issuance, semantic dispatch and release." },
]
rules = []

