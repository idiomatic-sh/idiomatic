description = "The language-local artifacts and entry points of one benchmark linter."
why = "Placed beside the standard adapter spec, this existing artifact spec owns thin Cargo registration/composition, pinned inventory and canonical rules/<id>/query.ryoql with cases.toml. The shared benchmark application owns execution, continuation and PASS/FAIL/DEFERRED publication: a default the profile defers under a named capability, with no authored query, is DEFERRED and runs nothing, and a run passes when no row is FAIL. Canonical cold/warm/edit measurements require exact equality with the immutable declared complete rule inventory, captured before projection; an explicit diagnostic mode may narrow selection but cannot publish headline benchmark metrics; a linter supplies inventory and its external adapter. The adapter spec retains adapter, settings and schemas roles. Archived profiles preserve exact historical bytes and never become a second active source. Imports and AST capability checks are structural rails, not proof that runtime policy is shared; the shared runner must pass its two-provider behavioral contract."
