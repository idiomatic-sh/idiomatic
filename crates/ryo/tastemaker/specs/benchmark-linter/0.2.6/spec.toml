  { rule = "idiomatic.arch/file-length@0.3.1", include = ["*.rs", "composition/**/*.rs"], params = { max-lines = { param = "source-line-limit" } }, description = "Apply the existing product file-length rule to active linter sources, including composition." },
  { rule = "idiomatic.arch/orphan-rust-files@0.1.0", include = ["*.rs"], description = "Every companion is reachable from its Cargo target." },
  { rule = "companions", include = ["benchmark.toml", "bench.rs", "tests.rs", "composition.rs", "composition/**/*.rs", "adapter.rs", "adapter_test.rs", "schemas.rs", "schemas_test.rs", "settings.rs", "rules/*/query.ryoql", "rules/*/cases.toml"], description = "Canonical queries/cases are paired; thin entry/composition roles cannot implement execution capabilities or loops." },
]

[given]
params = { source-line-limit = 400 }

[[scenarios]]
id = "authored-query-has-cases"
scenario = "An authored rule and its cases remain colocated."
given.files.'rules/F001/query.ryoql' = ''
given.files.'rules/F001/cases.toml' = ''
then.only = ['idiomatic.ryo/benchmark-linter/companions']
[[scenarios]]
id = "authored-query-missing-cases"
scenario = "An implemented rule cannot lose its independent cases."
given.files.'rules/F001/query.ryoql' = ''
then.only = ['idiomatic.ryo/benchmark-linter/companions']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter/companions', path = 'rules/F001/query.ryoql' }]

[[scenarios]]
id = "private-engine-is-not-a-benchmark-dependency"
scenario = "Benchmark entry points cannot import a private engine."
given.files.'bench.rs' = 'use ryo_core::domain::engine::Engine;'
given.files.'tests.rs' = '''
mod schemas;
#[path = "schemas_test.rs"]
mod schemas_test;
'''
given.files.'composition.rs' = ''
then.only = ["idiomatic.ryo/benchmark-linter/companions"]
then.findings = [{ rule = "idiomatic.ryo/benchmark-linter/companions", path = "bench.rs" }]

[[scenarios]]
id = "unnamed-evidence-is-refused"
scenario = "An arbitrary output file is not silently accepted as evidence."
given.files.'results/scratch.txt' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter#closed', path = 'results/scratch.txt' }]

[[scenarios]]
id = "dated-evidence-has-explicit-roles"
scenario = "A profile's independent oracle program and its observed output are placed as evidence."
given.files.'profiles/B031/evidence/oracle.py' = ''
given.files.'profiles/B031/evidence/oracle.json' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']

[[scenarios]]
id = "evidence-program-is-placed"
scenario = "An evidence program a rule's cases declare is data, under a profile, a rule or a fragment's evidence."
given.files.'profiles/F401/evidence/F401_0.py' = ''
given.files.'profiles/F401/evidence/phase/program.py' = ''
given.files.'rules/F402/evidence/probe.py' = ''
given.files.'fragments/shared.evidence/probe.py' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']

[[scenarios]]
id = "a-python-program-outside-evidence-is-refused"
scenario = "No Python program of a bench is placed outside its evidence: an authoring script is refused."
given.files.'authoring/x.py' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter#closed', path = 'authoring/x.py' }]

[[scenarios]]
id = "unplaced-candidate-assets-are-refused"
scenario = "Candidate assets use their explicit path instead of becoming an unowned profile copy."
given.files.'profiles/F401/query.ryoql' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter#closed', path = 'profiles/F401/query.ryoql' }]

[params.source-line-limit]
type = "integer"
description = "The existing product line budget for active source; fixtures may lower it to exercise the real counter."

[[scenarios]]
id = "active-candidate-is-not-admitted"
scenario = "An active candidate filename cannot bypass canonical query admission."
given.files.'rules/F001/candidate.ryoql' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter#closed', path = 'rules/F001/candidate.ryoql' }]

[[scenarios]]
id = "composition-cannot-import-shared-application-policy"
scenario = "Composition enters the shared inbound use case instead of reaching into its application implementation."
given.files.'composition.rs' = 'use ryo_benchmark::application::run::inventory::verify;'
then.only = ['idiomatic.ryo/benchmark-linter/companions']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter/companions', path = 'composition.rs' }]

[[scenarios]]
id = "composition-is-held-to-the-existing-line-counter"
scenario = "An oversized role fails the actual filesystem line-count rule, with a reduced fixture budget."
given.params = { source-line-limit = 3 }
given.files.'composition.rs' = '''
pub fn run() {
    let supplied = ();
    shared::run(supplied)
}
'''
then.only = ['idiomatic.arch/file-length']
then.findings = [{ rule = 'idiomatic.arch/file-length', path = 'composition.rs' }]

[[scenarios]]
id = "profile-capture-cannot-invent-an-active-rule"
scenario = "A profile name does not create a required rules/<profile>/cases.toml instance."
given.files.'profiles/target-variant/benchmark.toml' = ''
given.files.'rules/F001/query.ryoql' = ''
given.files.'rules/F001/cases.toml' = ''
then.only = ['idiomatic.ryo/benchmark-linter/cases#missing']

[[scenarios]]
id = "real-query-still-requires-its-case-file"
scenario = "The canonical query capture requires actual cases even when unrelated profiles exist."
given.files.'profiles/target-variant/benchmark.toml' = ''
given.files.'rules/F001/query.ryoql' = ''
then.only = ['idiomatic.ryo/benchmark-linter/cases#missing']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter/cases#missing', path = 'rules/F001/cases.toml' }]

[[scenarios]]
id = "typed-archive-and-authoring-roles"
scenario = "Shared query fragments and a profile's oracle program and output have explicit roles."
given.files.'fragments/lookup.ryoql' = ''
given.files.'profiles/old/evidence/oracle.py' = ''
given.files.'profiles/old/evidence/oracle.json' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed', 'idiomatic.ryo/benchmark-linter/companions']

[[scenarios]]
id = "typed-evidence-does-not-open-unrecognized-source"
scenario = "Unknown executable files cannot hide beside raw oracle observations."
given.files.'profiles/old/evidence/escape.rs' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter#closed', path = 'profiles/old/evidence/escape.rs' }]

[[scenarios]]
id = "archived-experiment-is-not-a-new-linter"
scenario = "An independent evidence reproduction does not require a second linter adapter or active canonical case pair."
given.files.'evidence/observed/F001/benchmark.toml' = ''
given.files.'evidence/observed/F001/fragments/lookup.ryoql' = ''
given.files.'evidence/observed/F001/cases.jsonl' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed', 'idiomatic.ryo/benchmark-linter/companions']

[[scenarios]]
id = "supplemental-cases-cannot-replace-canonical-cases"
scenario = "An alternate target inventory never satisfies the active rule correctness obligation."
given.files.'rules/F001/query.ryoql' = ''
given.files.'rules/F001/cases-py313.toml' = ''
then.only = ['idiomatic.ryo/benchmark-linter/cases#missing', 'idiomatic.ryo/benchmark-linter/companions']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter/cases#missing', path = 'rules/F001/cases.toml' }, { rule = 'idiomatic.ryo/benchmark-linter/companions', path = 'rules/F001/query.ryoql' }]

[[scenarios]]
id = "evidence-cannot-admit-nested-arbitrary-json"
scenario = "A phase subdirectory does not authorize arbitrary data files."
given.files.'profiles/old/evidence/phase/arbitrary.json' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter#closed', path = 'profiles/old/evidence/phase/arbitrary.json' }]

[[scenarios]]
