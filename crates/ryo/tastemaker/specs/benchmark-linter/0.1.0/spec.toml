description = "The language-local artifacts and entry points of one benchmark linter."
why = "Placed beside the standard adapter spec at the same directory, this artifact spec owns Cargo runners, composition, tool pins and candidate rules. The adapter spec alone owns adapter, settings and schemas roles; neither scope exempts the other."
specs = [
  { spec = "idiomatic.arch/benchmark-executable@0.1.0", include = ["."], imports = { default = "deny", allow = ["ryo_benchmark::*", "ryo::*", "std::*", "serde::*", "serde_json::*", "toml::*", "tempfile::*", "crate::*", "self::*", "super::*", "composition::*"] }, description = "The Cargo benchmark workflow owns artifact lifetimes at the executable boundary." },
]
templates = [
  { alias = "runner-constants", template = "source", file = "composition/constants.rs", count = { min = 0, max = 1 }, description = "Executable command and artifact protocol vocabulary." },
  { alias = "runner-guide", template = "evidence", file = "README.md", count = { min = 0, max = 1 }, description = "Language-local runner commands and the scope of its benchmark claims." },
  { template = "linter", file = "benchmark.toml", description = "Benchmark linter contract." },
  { template = "source", file = "verify_profiles.py", count = { min = 0, max = 1 }, description = "Portable candidate-profile materializer and verifier." },
  { alias = "bench", template = "source", file = "bench.rs", imports = { default = "deny", allow = ["ryo_benchmark::*", "ryo::*", "std::*", "serde::*", "serde_json::*", "toml::*", "tempfile::*", "crate::*", "self::*", "super::*", "composition::*"] }, description = "The linter bench implementation." },
  { template = "cargo-schema-tests", file = "tests.rs", imports = { default = "deny", allow = ["ryo_benchmark::*", "ryo::*", "std::*", "serde::*", "serde_json::*", "toml::*", "tempfile::*", "crate::*", "self::*", "super::*"] }, description = "The linter tests implementation." },
  { alias = "engine-test", template = "source", file = "engine_test.rs", count = { min = 0 }, imports = { default = "deny", allow = ["ryo_benchmark::*", "ryo::*", "std::*", "serde::*", "serde_json::*", "toml::*", "tempfile::*", "crate::*", "self::*", "super::*"] }, description = "Optional real-SDK integration proof, compiled by the linter test target." },
  { alias = "result-report", template = "evidence", file = "results/report.md", count = { min = 0, max = 1 }, description = "Human interpretation of measured correctness and performance." },
  { alias = "result-measurements", template = "evidence", file = "results/measurements.json", count = { min = 0, max = 1 }, description = "Observed metric values in Bencher Metric Format." },
  { alias = "result-observations", template = "evidence", file = "results/observations.log", count = { min = 0, max = 1 }, description = "Captured process output supporting the report." },
  { alias = "result-environment", template = "evidence", file = "results/environment.txt", count = { min = 0, max = 1 }, description = "Execution environment and measurement boundary." },
  { alias = "result-correctness", template = "evidence", file = "results/correctness.json", count = { min = 0, max = 1 }, description = "Canonical corpus comparison evidence." },
  { alias = "result-fixtures", template = "evidence", file = "results/fixtures.json", count = { min = 0, max = 1 }, description = "Independent fixture verification evidence." },
  { alias = "result-profile", template = "evidence", file = "results/profile.json", count = { min = 0, max = 1 }, description = "Observed cold phase profiling evidence, separate from timed trials." },
  { alias = "result-trace", template = "evidence", file = "results/trace.json", count = { min = 0, max = 1 }, description = "Observed cold phase profiling evidence, separate from timed trials." },
  { alias = "result-profile-text", template = "evidence", file = "results/profile.txt", count = { min = 0, max = 1 }, description = "Observed cold phase profiling evidence, separate from timed trials." },
  { alias = "result-identity", template = "evidence", file = "results/identity.json", count = { min = 0, max = 1 }, description = "Pinned inputs and contestant artifact identities." },
  { alias = "acceptance-profiles", template = "evidence", file = "profiles/prepared.json", count = { min = 0, max = 1 }, description = "Hash-pinned candidate acceptance profile inputs and exact case inventories." },
  { alias = "acceptance-profile", template = "linter", file = "profiles/{rule}/benchmark.toml", count = { min = 0 }, description = "One-rule tool selection for isolated candidate acceptance." },
  { alias = "candidate-profile-oracle", template = "evidence", file = "profiles/{profile}/oracle.json", count = { min = 0 }, description = "Pinned Ruff outputs for an unpromoted candidate or reference-audit profile." },
  { alias = "combined-profile-expectations", template = "evidence", file = "profiles/{profile}/expectations.json", count = { min = 0 }, description = "Reviewed expected-output overlay for combined full-report cohorts." },
  { template = "query", file = "rules/{implemented}/query.ryoql", count = { min = 0 }, description = "Benchmark query contract." },
  { alias = "candidate-query", template = "query", file = "rules/{rule}/candidate.ryoql", count = { min = 0 }, description = "Unpromoted query candidate, kept outside the shipped-rule audit." },
  { template = "cases", file = "rules/{rule}/cases.toml", description = "Benchmark cases contract." },
]
rules = [
  { rule = "idiomatic.arch/orphan-rust-files@0.1.0", include = ["*.rs"], description = "Every companion is reachable from its Cargo target." },
  { rule = "companions", include = ["**"], description = "Each authored query has cases and the integration roles are complete." },
]

[[scenarios]]
id = "authored-query-has-cases"
scenario = "An authored rule and its cases remain colocated."
given.files.'rules/F001/query.ryoql' = ''
given.files.'rules/F001/cases.toml' = ''
then.only = ['idiomatic.ryo/benchmark-linter/companions']
[[scenarios]]
id = "authored-query-missing-cases"
scenario = "An implemented rule cannot lose its independent cases."
given.files.'rules/F001/query.ryoql' = ''
then.only = ['idiomatic.ryo/benchmark-linter/companions']
then.findings = [{ rule = 'idiomatic.ryo/benchmark-linter/companions', path = 'rules/F001/query.ryoql' }]

[[scenarios]]
id = "private-engine-is-not-a-benchmark-dependency"
scenario = "Benchmark entry points cannot import a private engine."
given.files.'benchmark.toml' = ''
given.files.'bench.rs' = 'use ryo_core::domain::engine::Engine;'
given.files.'tests.rs' = '''
mod schemas;
#[path = "schemas_test.rs"]
mod schemas_test;
'''
given.files.'composition.rs' = ''
given.files.'rules/F001/cases.toml' = ''
then.findings = [
  { rule = "idiomatic.ryo/benchmark-linter/source(bench)#imports", path = "bench.rs", line = 1 },
  { rule = "idiomatic.arch/benchmark-executable#imports", path = "bench.rs", line = 1 },
  { rule = "idiomatic.arch/orphan-rust-files", path = "bench.rs" },
  { rule = "idiomatic.arch/orphan-rust-files", path = "composition.rs" },
  { rule = "idiomatic.arch/orphan-rust-files", path = "tests.rs" },
]

[[scenarios]]
id = "named-evidence-is-placed"
scenario = "Published benchmark evidence has an explicit role."
given.files.'results/report.md' = ''
given.files.'results/measurements.json' = ''
given.files.'results/observations.log' = ''
given.files.'results/environment.txt' = ''
given.files.'results/correctness.json' = ''
given.files.'results/fixtures.json' = ''
given.files.'results/identity.json' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']

[[scenarios]]
id = "unnamed-evidence-is-refused"
scenario = "An arbitrary output file is not silently accepted as evidence."
given.files.'results/scratch.txt' = ''
then.only = ['idiomatic.arch/benchmark-executable#closed']
then.findings = [{ rule = 'idiomatic.arch/benchmark-executable#closed', path = 'results/scratch.txt' }]

[[scenarios]]
id = "acceptance-profile-inputs-are-placed"
scenario = "Portable profile references and their materializer have explicit owners."
given.files.'verify_profiles.py' = ''
given.files.'profiles/prepared.json' = ''
given.files.'profiles/F401/benchmark.toml' = ''
given.files.'rules/F401/candidate.ryoql' = ''
given.files.'rules/F401/cases.toml' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']

[[scenarios]]
id = "unplaced-candidate-assets-are-refused"
scenario = "Candidate assets use their explicit path instead of becoming an unowned profile copy."
given.files.'profiles/F401/query.ryoql' = ''
then.only = ['idiomatic.arch/benchmark-executable#closed']
then.findings = [{ rule = 'idiomatic.arch/benchmark-executable#closed', path = 'profiles/F401/query.ryoql' }]

[[scenarios]]
id = "shape-combined-evidence-is-placed"
scenario = "The combined candidate profile records its pinned reference outputs and scope overlay."
given.files.'profiles/shape-110/benchmark.toml' = ''
given.files.'profiles/shape-110/oracle.json' = ''
given.files.'profiles/shape-110/expectations.json' = ''
given.files.'profiles/expanded-defaults/benchmark.toml' = ''
given.files.'profiles/expanded-defaults/oracle.json' = ''
given.files.'profiles/expanded-defaults/expectations.json' = ''
then.only = ['idiomatic.ryo/benchmark-linter#closed']

[[scenarios]]
id = "unplaced-expanded-report-is-refused"
scenario = "The expanded full-report cohort cannot hide unreviewed oracle outputs."
given.files.'profiles/expanded-defaults/unreviewed.json' = ''
then.only = ['idiomatic.arch/benchmark-executable#closed']
then.findings = [{ rule = 'idiomatic.arch/benchmark-executable#closed', path = 'profiles/expanded-defaults/unreviewed.json' }]

[[scenarios]]
id = "unplaced-shape-combined-evidence-is-refused"
scenario = "Combined candidate profiles cannot hide unreviewed files."
given.files.'profiles/shape-110/unreviewed.txt' = ''
then.only = ['idiomatic.arch/benchmark-executable#closed']
then.findings = [{ rule = 'idiomatic.arch/benchmark-executable#closed', path = 'profiles/shape-110/unreviewed.txt' }]
