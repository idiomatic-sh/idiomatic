rules = [
  { alias = "test-public-boundary", rule = "idiomatic.arch/import-directions@0.1.0", include = ["tests.rs", "engine_test.rs", "engine_test/**/*.rs", "compiler_feature_test.rs", "project_context_test.rs", "worker_request_input.rs", "worker_request_input_constants.rs"], params = { forbidden = ["ryo_core", "ryo_core::*", "ryo_execution::application", "ryo_execution::application::*", "ryo_execution::domain", "ryo_execution::domain::*", "ryo_operators::application", "ryo_operators::application::*", "ryo_operators::domain", "ryo_operators::domain::*", "ryo_matching::application", "ryo_matching::application::*", "ryo_matching::domain", "ryo_matching::domain::*"] }, description = "Real public API controls do not bypass private semantic or engine owners. Unlike entry imports, this existing AST/reference rule is explicitly applied to the test roles too; Rust privacy and actual runtime controls remain required." },

  { rule = "idiomatic.arch/import-directions@0.1.0", include = ["host_policy.rs"], params = { forbidden = ["std::env", "std::env::*", "std::fs", "std::fs::*", "std::process", "std::process::*", "std::net", "std::net::*", "tokio::fs", "tokio::fs::*", "tokio::process", "tokio::process::*", "tokio::net", "tokio::net::*", "*::host", "*::host::*"] }, description = "The argument-based applicability policy does not obtain ambient host observations or call the probe; review still checks semantic purity and macro limits." },
  { rule = "idiomatic.arch/file-length@0.3.0", include = ["*.rs", "composition/**/*.rs", "verify_profiles.py"], params = { max-lines = { param = "source-line-limit" } }, description = "Apply the existing product file-length rule to active linter sources, including composition." },
  { rule = "idiomatic.arch/orphan-rust-files@0.1.0", include = ["*.rs"], description = "Every companion is reachable from its Cargo target." },
