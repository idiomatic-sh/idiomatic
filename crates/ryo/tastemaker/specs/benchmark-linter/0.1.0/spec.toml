  { alias = "run-target-result", template = "evidence", file = "results/{run}/{target}/result.json", count = { min = 0 }, description = "Target-specific execution result." },
  { alias = "run-target-oracle", template = "evidence", file = "results/{run}/{target}/oracle.json", count = { min = 0 }, description = "Target-specific independent oracle result." },
  { alias = "run-target-preflight", template = "evidence", file = "results/{run}/{target}/initial-staging.stderr", count = { min = 0 }, description = "Preserved failed staging preflight output." },
  { alias = "run-phase-cases", template = "evidence", file = "results/{run}/{phase}/{target}/cases.jsonl", count = { min = 0 }, description = "Follow-up phase case receipts for one target." },
  { alias = "run-phase-offline", template = "evidence", file = "results/{run}/{phase}/{target}/offline-audit.json", count = { min = 0 }, description = "Follow-up phase offline audit for one target." },
  { alias = "run-phase-registration", template = "evidence", file = "results/{run}/{phase}/{target}/registration.json", count = { min = 0 }, description = "Follow-up phase registration identity for one target." },
  { alias = "run-phase-result", template = "evidence", file = "results/{run}/{phase}/{target}/result.json", count = { min = 0 }, description = "Follow-up phase execution result for one target." },
  { template = "query", file = "rules/{implemented}/query.ryoql", count = { min = 0 }, description = "Benchmark query contract." },
  { template = "cases", file = "rules/{implemented}/cases.toml", description = "The correctness cases of each actually implemented canonical rule, using the same rule capture as query.ryoql." },
]
rules = [
  { rule = "idiomatic.arch/import-directions@0.1.0", include = ["host_policy.rs"], params = { forbidden = ["std::env", "std::env::*", "std::fs", "std::fs::*", "std::process", "std::process::*", "std::net", "std::net::*", "tokio::fs", "tokio::fs::*", "tokio::process", "tokio::process::*", "tokio::net", "tokio::net::*", "*::host", "*::host::*"] }, description = "The argument-based applicability policy does not obtain ambient host observations or call the probe; review still checks semantic purity and macro limits." },
  { rule = "idiomatic.arch/file-length@0.3.0", include = ["*.rs", "composition/**/*.rs", "verify_profiles.py"], params = { max-lines = { param = "source-line-limit" } }, description = "Apply the existing product file-length rule to active linter sources, including composition." },
  { rule = "idiomatic.arch/orphan-rust-files@0.1.0", include = ["*.rs"], description = "Every companion is reachable from its Cargo target." },
  { rule = "companions", include = ["**"], description = "Canonical queries/cases are paired; thin entry/composition roles cannot implement execution capabilities or loops." },
]

[given]
params = { source-line-limit = 400 }

