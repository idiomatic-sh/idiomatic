mod constants;
mod schemas;
mod settings;

fn main() -> std::process::ExitCode {
    let mut output = std::io::stdout().lock();
    let mut observations = std::io::stderr().lock();
    let command = ryo_benchmark::domain::command_line::arguments(std::env::args().skip(1));
    let outcome = composition::run(command, &mut output, &mut observations);
    match outcome {
        Ok(()) => std::process::ExitCode::SUCCESS,
        Err(error) => {
            drop(std::io::Write::write_fmt(
                &mut observations,
                format_args!("{error}\n"),
            ));
            std::process::ExitCode::FAILURE
        }
    }
}
'''

[[scenarios]]
id = 'own-main'
scenario = 'A bench whose main ignores the shared command-line protocol.'
given.files.'bench.rs' = '''
//! The linter bench composes the shared benchmark and its candidate and reference.
mod adapter;
mod composition;
mod constants;
mod schemas;
mod settings;

fn main() -> std::process::ExitCode {
    let mut output = std::io::stdout().lock();
    let mut observations = std::io::stderr().lock();
    drop(composition::run(Vec::new(), &mut output, &mut observations));
    std::process::ExitCode::SUCCESS
}
'''
then.findings = [{ rule = 'bench-entry#template', path = 'bench.rs' }]

[[scenarios]]
id = 'missing'
scenario = 'The entry is missing.'
then.findings = [{ rule = 'bench-entry#count', path = '.' }]
