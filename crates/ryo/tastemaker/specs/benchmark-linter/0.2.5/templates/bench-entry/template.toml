description = "The shared command-line protocol at the linter bench's process entry."
why = "Every linter bench gets the shared worker protocol and can be profiled by the collector. The scaffold writes this entry."
match = "text"
content = '''
//! The linter bench composes the shared benchmark and its candidate and reference.
mod adapter;
mod composition;
mod constants;
{%- if present["frontend-projection-module"] | default(false) %}
mod frontend_projection;
{%- endif %}
mod schemas;
mod settings;

fn main() -> std::process::ExitCode {
    let mut output = std::io::stdout().lock();
    let mut observations = std::io::stderr().lock();
    let command = ryo_benchmark::domain::command_line::arguments(std::env::args().skip(1));
    let outcome = composition::run(command, &mut output, &mut observations);
    match outcome {
        Ok(()) => std::process::ExitCode::SUCCESS,
        Err(error) => {
            drop(std::io::Write::write_fmt(
                &mut observations,
                format_args!("{error}\n"),
            ));
            std::process::ExitCode::FAILURE
        }
    }
}
'''

[given]
file = 'bench.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'bench.rs' = '''
