'''

[[scenarios]]
id = 'own-main'
scenario = 'A bench whose main runs without the profile run.'
given.files.'bench.rs' = '''
//! One executable composes the shared benchmark and its linter: the harness records any profile, then the composition runs the command.
mod adapter;
mod composition;
mod constants;
mod schemas;
mod settings;

fn main() -> std::process::ExitCode {
    let mut output = std::io::stdout().lock();
    let mut observations = std::io::stderr().lock();
    drop(composition::run(Vec::new(), &mut output, &mut observations));
    std::process::ExitCode::SUCCESS
}
'''
then.findings = [{ rule = 'bench-entry#template', path = 'bench.rs' }]

[[scenarios]]
id = 'missing'
scenario = 'The entry is missing.'
then.findings = [{ rule = 'bench-entry#count', path = '.' }]
