    })?;
    Ok(std::env::args().skip(1).map(BenchmarkArgument).collect())
}
'''
then.findings = [{ rule = 'composition-profile#template', path = 'composition/profile.rs' }]

[[scenarios]]
id = 'missing'
scenario = 'The wiring is missing.'
then.findings = [{ rule = 'composition-profile#count', path = '.' }]
