description = "One explicitly named benchmark evidence artifact."
why = "The linter spec owns each publication role individually. The harness binds evidence to input and executable identities; arbitrary result files are not accepted by placement."
content = ''

[given]
file = 'artifact.txt'
[[scenarios]]
id = 'present'
scenario = 'The evidence artifact exists.'
given.files.'artifact.txt' = ''
[[scenarios]]
id = 'missing'
scenario = 'A required artifact instance is absent.'
then.findings = [{ rule = 'evidence#count', path = '.' }]
