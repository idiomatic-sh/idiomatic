description = "Collector process and regression files have explicit Cargo target registrations."
why = "The resource proof must launch the actual Cargo-built executable, not a substitute."
query = '''
let files = project(from="filesystem.file", columns=["path"]);
let binaries = capture(from=files, path="path", pattern="{*root}/src/main.rs", captures=["root"]);
let tests = capture(from=files, path="path", pattern="{*root}/src/outbound/execution/adapters/timed/adapter_test.rs", captures=["root"]);
let entries = project(from="entry", columns=["file", "owner", "occurrence", "key", "decoded"]);
let headings = select * from entries where key = "bin" or key = "test";
let elements = select r."occurrence" as "element", l."key" as "target_kind" from headings as l join "sequence-element" as r on l."occurrence" = r."owner";
let members = select * from "mapping" where kind = "sequence-member";
let tables = select r."id" as "table", l."target_kind" as "target_kind" from elements as l join members as r on l."element" = r."owner";
let paths = select * from entries where key = "path";
let targeted = select l."file" as "file", l."decoded" as "target", r."target_kind" as "target_kind" from paths as l join tables as r on l."owner" = r."table";
let manifests = capture(from=targeted, path="file", pattern="{*root}/Cargo.toml", captures=["root"]);
let bin-wired = select * from manifests where target_kind = "bin" and target = "src/main.rs";
let test-wired = select * from manifests where target_kind = "test" and target = "src/outbound/execution/adapters/timed/adapter_test.rs";
let missing-bin = antijoin(left=binaries, right=bin-wired, left-on=["root"], right-on=["root"]);
let missing-test = antijoin(left=tests, right=test-wired, left-on=["root"], right-on=["root"]);
let missing = union(left=missing-bin, right=missing-test);
emit missing subject "path" key("path");
'''
[diagnostic]
primary = "path"
message = "collector source is not registered as its required Cargo target"
help = "Declare the main process in [[bin]] and the resource regression in [[test]], each with its explicit path."

[given]
include=["**"]
[[scenarios]]
id="wired"
scenario="Explicit binary and integration target registrations."
given.files.'crate/src/main.rs'='fn main() {}'
given.files.'crate/src/outbound/execution/adapters/timed/adapter_test.rs'=''
given.files.'crate/Cargo.toml'='''
[[bin]]
name="ryo-benchmark-collector"
path="src/main.rs"
[[test]]
name="collector"
path="src/outbound/execution/adapters/timed/adapter_test.rs"
'''
[[scenarios]]
id="unwired"
scenario="Source files without Cargo targets are refused."
given.files.'crate/src/main.rs'='fn main() {}'
given.files.'crate/src/outbound/execution/adapters/timed/adapter_test.rs'=''
given.files.'crate/Cargo.toml'=''
then.findings=[{path="crate/src/main.rs"},{path="crate/src/outbound/execution/adapters/timed/adapter_test.rs"}]
