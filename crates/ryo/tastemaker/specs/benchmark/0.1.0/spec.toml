description = "A language's comparative lint benchmark: shared project inputs and local linter integrations."
why = "Project revisions and edit patches belong to the language. Each pinned linter owns its invocation, decoding, shipped-default profile and RyoQL rules. Case-only directories are pending test-first work, never implemented coverage. Every query requires cases. The shared benchmark crate audits these inputs before measuring; incomplete defaults never produce a parity or performance claim."
specs = [
  { spec = "idiomatic.ryo/benchmark-linter@0.1.0", include = ["linters/{linter}"], description = "The pinned profile, runners and rule assets of each linter." },
  { alias = "linter-adapter", spec = "idiomatic.arch/adapter@0.2.0", include = ["linters/{linter}"], params = { core = "ryo_benchmark", port = "linter" }, description = "The shared harness owns the port; the existing adapter spec governs its external implementation." },
]
templates = [
  { template = "manifest", file = "benchmark.toml", description = "The language's shared pinned workloads." },
  { template = "patch", file = "patches/{project}.patch", count = { min = 2, max = 3 }, description = "Shared deterministic project edits." },
]
[[scenarios]]
id = "complete-shape"
scenario = "All benchmark artifacts are placed."
given.files.'benchmark.toml' = ''
given.files.'patches/one.patch' = ''
given.files.'patches/two.patch' = ''
given.files.'linters/tool/benchmark.toml' = ''
given.files.'linters/tool/bench.rs' = ''
given.files.'linters/tool/tests.rs' = ''
given.files.'linters/tool/composition.rs' = ''
given.files.'linters/tool/adapter.rs' = ''
given.files.'linters/tool/adapter_test.rs' = ''
given.files.'linters/tool/schemas.rs' = ''
given.files.'linters/tool/schemas_test.rs' = ''
given.files.'linters/tool/settings.rs' = ''
given.files.'linters/tool/rules/F001/query.ryoql' = ''
given.files.'linters/tool/rules/F001/cases.toml' = ''

then.only = ["idiomatic.ryo/benchmark#closed", "idiomatic.ryo/benchmark-linter#closed", "idiomatic.ryo/benchmark-linter/companions"]
[[scenarios]]
id = "stray-artifact"
scenario = "Unowned benchmark artifacts are rejected."
given.files.'benchmark.toml' = ''
given.files.'patches/one.patch' = ''
given.files.'patches/two.patch' = ''
given.files.'linters/tool/benchmark.toml' = ''
given.files.'linters/tool/bench.rs' = ''
given.files.'linters/tool/tests.rs' = ''
given.files.'linters/tool/composition.rs' = ''
given.files.'linters/tool/adapter.rs' = ''
given.files.'linters/tool/adapter_test.rs' = ''
given.files.'linters/tool/schemas.rs' = ''
given.files.'linters/tool/schemas_test.rs' = ''
given.files.'linters/tool/settings.rs' = ''
given.files.'linters/tool/rules/F001/query.ryoql' = ''
given.files.'linters/tool/rules/F001/cases.toml' = ''
given.files.'reference/unowned.txt' = ''
then.findings = [{ rule = 'benchmark#closed', path = 'reference/unowned.txt' }]

then.only = ["idiomatic.ryo/benchmark#closed", "idiomatic.ryo/benchmark-linter#closed", "idiomatic.ryo/benchmark-linter/companions"]
