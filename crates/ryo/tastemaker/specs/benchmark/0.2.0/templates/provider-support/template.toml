description = "A provider-only workload helper beneath the provider runner."
why = "Manifest and embedded workloads can keep their own modules; Cargo compiles them through the provider target. The provider runner and target remain required and uniquely named."
content = ''

[[scenarios]]
id = 'provider-support-module'
scenario = 'A provider workload helper is placed beneath the provider runner.'
given.file = 'provider/performance/{*support}'
given.count = { min = 0 }
given.files.'provider/performance/manifest_reading/bench.rs' = 'fn workload() {}'

[[scenarios]]
id = 'required-provider-helper-missing'
scenario = 'A required helper would be reported missing.'
given.file = 'provider/performance/{*support}'
given.count = { min = 1 }
then.findings = [{ rule = 'provider-support#count', path = '.' }]
