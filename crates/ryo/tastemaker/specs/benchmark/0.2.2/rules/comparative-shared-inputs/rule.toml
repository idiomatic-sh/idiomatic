description = "A comparative linter runner has a shared project profile and two distinct pinned edit patches."
why = "Provider-only parsing benchmarks have no comparative project profile. Once a linter runner exists, cold, warm and edit comparisons need their shared corpus profile and distinct edits; the old benchmark spec required these assets for comparative benchmarks."
query = '''
let files = select l."path" as "path" from "filesystem.file" as l;
let linters = select * from files where glob_any(path, "{linters/*/bench.rs,**/linters/*/bench.rs}");
let manifests = select * from files where glob_any(path, "{benchmark.toml,**/benchmarks/benchmark.toml}");
let patches = select * from files where glob_any(path, "{patches/*.patch,**/benchmarks/patches/*.patch}");
let linter_groups = extend(from=linters, values={"group": "comparative"});
let manifest_groups = extend(from=manifests, values={"group": "comparative"});
let patch_groups = extend(from=patches, values={"group": "comparative"});
let patch_counts = group-count(from=patch_groups, keys=["group"], count="count", distinct="path");
let sufficient_patches = select * from patch_counts where count >= 2;
let assets = select l."group" as "group" from manifest_groups as l join sufficient_patches as r on l."group" = r."group";
let missing = antijoin(left=linter_groups, right=assets, left-on=["group"], right-on=["group"]);
emit missing subject "path" key("path");
'''
[diagnostic]
primary = "path"
message = "comparative linter lacks a shared benchmark profile or two pinned edit patches"
help = "Keep benchmark.toml and at least two distinct patches/*.patch beside the linter runners; provider-only languages do not need them."
[given]
include = ["**"]

[[scenarios]]
id = "provider-only"
scenario = "A provider-only language has no invented comparative project inputs."
given.files.'provider/bench.rs' = ''

[[scenarios]]
id = "comparative-complete"
scenario = "A linter runner has its shared profile and two pinned edits."
given.files.'linters/tool/bench.rs' = ''
given.files.'benchmark.toml' = ''
given.files.'patches/first.patch' = ''
given.files.'patches/second.patch' = ''

[[scenarios]]
id = "comparative-missing-profile"
scenario = "A linter cannot use edits without the project profile."
given.files.'linters/tool/bench.rs' = ''
given.files.'patches/first.patch' = ''
given.files.'patches/second.patch' = ''
then.findings = [{ path = 'linters/tool/bench.rs' }]

[[scenarios]]
id = "comparative-one-edit"
scenario = "A single edit cannot satisfy the comparative edit contract."
given.files.'linters/tool/bench.rs' = ''
given.files.'benchmark.toml' = ''
given.files.'patches/first.patch' = ''
then.findings = [{ path = 'linters/tool/bench.rs' }]

[[scenarios]]
id = "comparative-no-edits"
scenario = "A linter runner cannot silently omit the edit comparison."
given.files.'linters/tool/bench.rs' = ''
given.files.'benchmark.toml' = ''
then.findings = [{ path = 'linters/tool/bench.rs' }]
