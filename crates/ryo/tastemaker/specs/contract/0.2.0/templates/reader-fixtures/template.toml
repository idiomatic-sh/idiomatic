description = "A reader concept's test support, declared by its module file under the fixtures gate."
why = "A reader's proof may need data beyond literals; it lives in the concept's fixtures, which only tests read (`no-runtime-fixtures`)."
content = '''
//! The test support of the `{{ concept }}` readers.
'''

[params]
concept = { type = "identifier", description = "The reader concept, captured from its path." }

[given]
file = 'readers/format/fixtures.rs'
params = { concept = 'format' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'readers/format/fixtures.rs' = '''
//! The test support of the `format` readers.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'reader-fixtures#count', path = '.' },
]
