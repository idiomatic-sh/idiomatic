//! The `{{ part }}` contract: the language's implementation of `{{ trait }}`. It names no manifest and reads nothing, and answers
//! every manifest relation of ryo's catalog as not in the language. A language with manifests lists their names in `manifests`, reads
//! them in `resolve` and answers the relations its readers write with `languages::reads`.

use ryo::languages::{
    self, ManifestName, ManifestReader, Project, ProjectError, ProjectRequest, AbsenceCause, Resolved,
    Support,
};

/// `{{ part }}`, implementing `{{ trait }}`.
pub(crate) struct {{ part | pascal }}Contract;

impl {{ part | pascal }}Contract {
    /// `{{ part }}`, which calls no port.
    #[must_use]
    pub(crate) fn new() -> Self {
        Self
    }
}

impl Project for {{ part | pascal }}Contract {
    type Derived = ();

    fn manifests(&self) -> &'static [ManifestName] {
        &[]
    }

    fn primary_role(&self, path: languages::SourcePath<'_>) -> languages::PrimaryFileRole {
        languages::primary_role_from_manifests(
            path,
            self.manifests().iter().map(|manifest| manifest.0),
        )
    }

    fn resolve(&self, _request: &ProjectRequest) -> Result<Resolved<()>, ProjectError> {
        Ok(Resolved {
            refused: Vec::new(),
            unlisted: Vec::new(),
            consulted: Vec::new(),
            derived: (),
        })
    }
    fn manifest_diagnostic(&self) -> Support<ManifestReader<languages::ManifestDiagnostic, ()>> {
        languages::absent(AbsenceCause::NotYetRead)
    }

    fn module_identity(&self) -> Support<ManifestReader<languages::ModuleIdentity, ()>> {
        languages::absent(AbsenceCause::NotYetRead)
    }
{% for relation in ["package_dependency", "workspace_member", "source_dependency", "file_package", "analyzed_source"] %}
    fn {{ relation }}(&self) -> Support<ManifestReader<languages::{{ relation | pascal }}, ()>> {
        languages::absent(AbsenceCause::NoManifests)
    }
{% endfor -%}
}
{%- endif %}
