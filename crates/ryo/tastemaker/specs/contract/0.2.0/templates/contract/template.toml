description = "One contract's body: the struct `<Part>Contract` implementing the engine's trait, imported by its path."
why = "Holds a language's fulfilment of one trait the engine declares in a directory of its own, so the contract is found by its directory's name, its struct carries that name and its code sits beside its proof. The trait is the engine's (`ryo::languages::Parse`), never redeclared here, so the compiler lists every method the language leaves out. The template asks for the import, the struct and the `impl`; the fields and methods are the language's."
