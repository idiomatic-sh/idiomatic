description = "A method a contract implements that takes a file's data (any parameter beside `self`) never returns an owned heap value: no `Vec`, `String`, `Box` or map in its return type, and no associated type of `Self` by value. The engine owns the per-file buffers and the language fills them."
why = "A contract method runs once for every file, on every worker. When it returns a `Vec` or a `String` it allocates for each file what the engine could allocate once and reuse; a language is fast only when it writes into the buffer the engine gives it (`&mut Vec`, a builder, the model passed in) and returns nothing owned. An associated type returned by value (`Self::FileModel`) is the same allocation under another name: the engine keeps one for each worker and hands it to the method to refill. Read as written: a function inside an `impl <Trait> for <Type>` block of the files the entry selects, with at least one parameter beside `self`, whose return type names `Vec`, `VecDeque`, `String`, `Box`, `BTreeMap`, `BTreeSet`, `HashMap` or `HashSet`, at any depth of a generic, or is a path `Self::<Name>` itself (`-> Self::FileModel`, not `Result<Resolved<Self::Derived>, E>`, which names the state a use case derives for the whole run). A method with no parameter beside `self` answers once for the language and is not seen; a function of an inherent `impl` is not seen either; neither is a type behind an alias."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let idents = select * from tree-tokens where kind = "ident";
let heap-idents = select * from idents where glob_any(text, "{Vec,VecDeque,String,Box,BTreeMap,BTreeSet,HashMap,HashSet}");
let heap-parents = select r."parent" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from heap-idents as l join "syntax-child" as r on l."id" = r."child";
let name-refs = select * from tree-nodes where kind = "name-ref";
let heap-refs = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from heap-parents as l join name-refs as r on l."id" = r."id";
let self-tokens = select * from tree-tokens where kind = "self-type-kw";
let self-idents = select * from self-tokens where text = "Self";
let self-parents = select r."parent" as "id", l."file" as "file", l."span" as "span" from self-idents as l join "syntax-child" as r on l."id" = r."child";
let self-refs = select l."id" as "id", l."file" as "file", l."span" as "span" from self-parents as l join name-refs as r on l."id" = r."id";
let self-segments = select r."parent" as "id", l."file" as "file", l."span" as "span" from self-refs as l join "syntax-child" as r on l."id" = r."child";
let self-paths = select r."parent" as "id", l."file" as "file", l."span" as "span" from self-segments as l join "syntax-child" as r on l."id" = r."child";
let paths = select * from tree-nodes where kind = "path";
let self-qualifiers = select l."id" as "id", l."file" as "file", l."span" as "span" from self-paths as l join paths as r on l."id" = r."id";
let qualified-parents = select r."parent" as "id", l."file" as "file", l."span" as "span" from self-qualifiers as l join "syntax-child" as r on l."id" = r."child";
let qualified = select l."id" as "id", l."file" as "file", l."span" as "span" from qualified-parents as l join paths as r on l."id" = r."id";
let path-types = select * from tree-nodes where kind = "path-type";
let qualified-type-parents = select r."parent" as "id", l."file" as "file", l."span" as "span" from qualified as l join "syntax-child" as r on l."id" = r."child";
let qualified-types = select l."id" as "id", l."file" as "file", l."span" as "span" from qualified-type-parents as l join path-types as r on l."id" = r."id";
let type-parents = select l."id" as "id", l."file" as "file", l."span" as "span", r."parent" as "parent" from qualified-types as l join "syntax-child" as r on l."id" = r."child";
let ret-types = select * from tree-nodes where kind = "ret-type";
let direct = select l."id" as "id", l."file" as "file", l."span" as "span" from type-parents as l join ret-types as r on l."parent" = r."id";
let self-assoc = extend(from=direct, values={"text": "Self::"});
let heap-found = project(from=heap-refs, columns=["id", "file", "span", "text"]);
let owned = union(left=heap-found, right=self-assoc);
let in-returns = axis(from=owned, relation="syntax-child", direction=ancestor, domain=ret-types);
let return-fns = select r."parent" as "fn", l."file" as "file", l."span" as "span", l."text" as "text" from in-returns as l join "syntax-child" as r on l."related" = r."child";
let fns = select * from tree-nodes where kind = "fn";
let owned-fns = select l."fn" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from return-fns as l join fns as r on l."fn" = r."id";
let for-kws = select * from tree-tokens where kind = "for-kw";
let for-parents = select r."parent" as "id" from for-kws as l join "syntax-child" as r on l."id" = r."child";
let impls = select * from tree-nodes where kind = "impl";
let trait-impls = select l."id" as "id" from for-parents as l join impls as r on l."id" = r."id";
let in-trait-impls = axis(from=owned-fns, relation="syntax-child", direction=ancestor, domain=trait-impls);
let trait-fns = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from owned-fns as l join in-trait-impls as r on l."id" = r."id";
let param-lists = select * from tree-nodes where kind = "param-list";
let params = select * from tree-nodes where kind = "param";
let list-params = select l."id" as "list", r."child" as "param" from param-lists as l join "syntax-child" as r on l."id" = r."parent";
let real-params = select l."list" as "list" from list-params as l join params as r on l."param" = r."id";
let fn-lists = select r."parent" as "id", l."list" as "list" from real-params as l join "syntax-child" as r on l."list" = r."child";
let per-file = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from trait-fns as l join fn-lists as r on l."id" = r."id";
emit per-file subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this method takes a file and returns an owned `{text}`: it allocates for each file"
help = "Take the buffer the engine owns (`&mut Vec<..>`, a builder, the model passed in) and fill it; return nothing owned."

[given]
include = ['**/*.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'fills-a-buffer'
scenario = 'A method that fills the buffer it is given.'
given.files.'src/inbound/contracts/parse/contract.rs' = '''
use ryo::languages::Parse;

pub struct ParseContract;

impl Parse for ParseContract {
    type FileModel = ();

    fn read_tree(&self, request: &Request, out: &mut Buffer) -> Result<(), Error> {
        out.push(request.byte());
        Ok(())
    }

    fn file_model(&self, tree: &Tree, model: &mut Self::FileModel) {}
}
'''

