description = "One contract's test: the language's own cases in the one test shape."
why = "The engine owns the conformance of a contract, written once; a language's own test holds what is the language's alone, in the same shape as every other part's test, so none runs untested."
content = '''
{% if part == "parse" -%}
//! The `{{ part }}` contract's own cases, beside the engine's conformance: the engine's refusals run through it over the syntax port's fake, and a file it does not recognize is refused.

use std::sync::Arc;

use ryo::languages::{self, contract};

use super::contract::ParseContract;
use crate::cases::{Case, CaseName, Expect, Word, run};
use crate::outbound::syntax::fixtures::fake::SyntaxFake;

/// What a row does: reads a file at a path, or runs the engine's refusals.
#[derive(Clone, Copy)]
enum Given {
    Read(&'static str),
    Contract,
}

type Input = Given;
/// How many elements the file's table has.
type Value = usize;
type Failure = languages::ParseError;

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: CaseName("passes_the_engines_refusals"),
        word: Word::Succeeds,
        input: || Given::Contract,
        expect: Expect::Value(0),
    },
    Case {
        name: CaseName("a_file_the_language_does_not_recognize_is_unsupported"),
        word: Word::Refuses,
        input: || Given::Read("source"),
        expect: Expect::Error(languages::ParseError::Unsupported),
    },
];

/// Reads one file, or runs the engine's refusals, through the contract over the fake of the syntax port.
fn subject(given: Input) -> Result<Value, Failure> {
    let language = ParseContract::new(Arc::new(SyntaxFake));
    let Given::Read(path) = given else {
        contract::parse(&language);
        return Ok(0);
    };
    let (mut table, mut symbols) = (
        languages::Elements::default(),
        languages::Symbols::default(),
    );
    contract::read(
        &language,
        languages::ParseRequest {
            path: languages::SourcePath(path),
            file: languages::FileId(0),
            bytes: languages::ByteSlice(b"source"),
            notes: languages::NoteRequest::Unwanted,
            fields: languages::FieldRequest::Unwanted,
        },
        &mut table,
        &mut symbols,
        &[],
        &mut contract::Collect::default(),
    )?;
    Ok(contract::element_count(&table).0)
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}

#[test]
fn refuses() {
    run(CASES, Word::Refuses, subject);
}
{%- else -%}
//! The `{{ part }}` contract's own cases, beside the engine's conformance: the engine's rows run through it, and it names no manifest and refuses none.

use ryo::languages::{self, Project, contract};

use super::contract::ProjectContract;
use crate::cases::{Case, CaseName, Expect, Word, run};

type Input = ();
/// How many manifests it names and how many it refused.
type Value = usize;
type Failure = languages::ProjectError;

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[Case {
    name: CaseName("names_no_manifest_and_refuses_none"),
    word: Word::Succeeds,
    input: || (),
    expect: Expect::Value(0),
}];

/// Runs the engine's rows against the contract, then asks it to resolve a repository that has no manifest.
fn subject((): Input) -> Result<Value, Failure> {
    let language = ProjectContract::new();
    contract::project(&language);
    let resolved = language.resolve(&languages::ProjectRequest {
        search_scope: Default::default(),
        given_inventory: Default::default(),
        observed_entries: Default::default(),
        repository: languages::Repository::Disk,
        root: languages::RootPath(Box::default()),
        manifests: Vec::new(),
        files: Vec::new(),
        notes: Vec::new(),
        wanted: Vec::new(),
    })?;
    Ok(language.manifests().len() + resolved.refused.len())
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}
{%- endif %}
'''

