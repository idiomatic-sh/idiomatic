description = "A contract part's test support, declared by its module file under the test gate."
why = "A contract's own cases may need grouped data and bodies beyond literals; each group lives in the part's fixtures, which only tests read (`no-runtime-fixtures`)."
content = '''
//! The test support of the contract's cases.
'''

[given]
file = 'fixtures.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'fixtures.rs' = '''
//! The test support of the contract's cases.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'contract-fixtures#count', path = '.' },
]
