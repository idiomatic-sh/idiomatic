description = "One contract a language fulfils: the struct implementing a trait the engine declares, and its test."
why = "Ryo owns the concepts and the language fulfils them. `parse` and `project` are not use cases: they have no method named for them, no interface of their own and no fakes, only a trait of the engine (`ryo::languages::Parse`, `Project`) that the language implements. A contract part is that and nothing else: `contract.rs` imports the engine's trait and implements it for one struct, and `contract_test.rs` is the language's own cases beside the engine's conformance. A language whose contract file does not implement its trait is a finding (`contract-implements`), and a contract part declares no trait of its own, so the engine's trait is the one definition."
templates = [
  { template = "contract", file = "contract.rs", params = { trait = { param = "trait" } }, description = "The contract's body: the struct that implements the engine's trait, imported by its path." },
  { template = "contract-test", file = "contract_test.rs", description = "The language's own cases of the contract, beside the engine's conformance, in the one test shape." },
  { template = "idiomatic.arch/constants@0.1.0", alias = "contract-constants", file = "constants.rs", count = { min = 0 }, description = "The words the contract's code uses: no literal sits in code." },
  { template = "idiomatic.arch/service@0.1.0", alias = "contract-service", file = "service.rs", count = { min = 0 }, params = { concept = "contract" }, description = "The contract's pure operations: free functions the contract calls." },
  { template = "reader-list", file = "readers.rs", count = { min = 0 }, description = "The list of the contract's reader concepts, one module each, when it has readers." },
  { template = "reader-module", file = "readers/{concept}.rs", count = { min = 0 }, description = "One reader concept's module file." },
  { template = "reader-composition", file = "readers/{concept}/composition.rs", count = { min = 0 }, description = "The concept's readers bound to the grammar adapters that serve them: the home of a parse reader." },
  { template = "idiomatic.arch/service@0.1.0", alias = "reader-service", file = "readers/{concept}/service.rs", count = { min = 0 }, description = "The concept's pure helpers the readers call: free functions." },
  { template = "idiomatic.arch/types@0.1.0", alias = "reader-types", file = "readers/{concept}/types.rs", count = { min = 0 }, params = { kind = "concept" }, description = "The concept's plain types." },
  { template = "idiomatic.arch/constants@0.1.0", alias = "reader-constants", file = "readers/{concept}/constants.rs", count = { min = 0 }, description = "The words of the concept's readers." },
  { template = "idiomatic.arch/unit-test@0.1.0", alias = "reader-test", file = "readers/{concept}/composition_test.rs", count = { min = 0 }, params = { kind = "item" }, description = "The proof of the concept's readers, in the one test shape." },
  { template = "idiomatic.arch/unit-test@0.1.0", alias = "reader-test-group", file = "readers/{concept}/composition_test/{group}_test.rs", count = { min = 0 }, params = { kind = "item" }, description = "A declared group of the proof's cases." },
  { template = "idiomatic.arch/unit-test@0.1.0", alias = "reader-service-test", file = "readers/{concept}/service_test.rs", count = { min = 0 }, params = { kind = "concept" }, description = "The proof of the concept's helpers, on values alone." },
  { template = "contract-fixtures", file = "fixtures.rs", count = { min = 0 }, description = "The part's own test support, declared under the test gate, when its proof is grouped." },
  { template = "contract-fixture", file = "fixtures/{group}.rs", count = { min = 0 }, description = "One group of the part's own cases: its table and the bodies it runs." },
  { template = "reader-fixtures", file = "readers/{concept}/fixtures.rs", count = { min = 0 }, description = "The concept's test support, declared under the fixtures gate." },
  { template = "reader-fixture", file = "readers/{concept}/fixtures/{fixture}.rs", count = { min = 0 }, description = "One file of the concept's test support." },
]
rules = [
  { rule = "contract-implements", include = ["contract.rs"], params = { trait = { param = "trait" } }, description = "The contract file imports the trait its `trait` param names and implements it in an `impl <Trait> for`." },
  { rule = "contract-fills-buffers", include = ["contract.rs"], description = "A method of the contract that takes a file never returns an owned heap value: the engine owns the per-file buffers and the language fills them." },
  { rule = "idiomatic.arch/hollow-artifacts@0.1.0", include = ["*.rs"], description = "No file of a part is only comments and imports, and no type in it is an empty placeholder." },
  { rule = "idiomatic.arch/validation-at-edges@0.1.0", include = ["*.rs"], exclude = ["schemas.rs", "*_test.rs"], description = "A `TryFrom`, an `impl FromStr` or a fallible constructor is written only in a schemas.rs." },
  { rule = "idiomatic.arch/no-runtime-fixtures@0.2.0", include = ["*.rs"], exclude = ["*_test.rs", "fixtures.rs"], description = "Nothing in a part but its tests and its fixtures reads a `fixtures` module." },
  { rule = "idiomatic.arch/factory-calls@0.1.0", include = ["*.rs"], exclude = ["composition.rs", "fixtures.rs", "*_test.rs"], description = "Only an edge's composition (and the part's fixtures and tests) names a `factory` module: only an edge builds an adapter." },
  { rule = "idiomatic.arch/test-shape@0.1.0", include = ["*_test.rs"], description = "Every test of a part is one of the four runners over a `CASES` table." },
  { rule = "idiomatic.arch/test-runners-match-rows@0.1.0", include = ["*_test.rs"], description = "A test file has a runner `run(CASES, Word::<word>, subject)` exactly for each case word its `CASES` table has rows of." },
  { rule = "idiomatic.arch/case-expectation@0.1.0", include = ["*_test.rs"], description = "A row of a part's table expects a value or an error variant, never any success." },
  { rule = "idiomatic.arch/no-vacuous-tests@0.1.0", include = ["*_test.rs"], description = "Proofs execute a real subject over nonempty cases." },
  { rule = "idiomatic.arch/unit-cases@0.2.0", include = ["*.rs", "*_test/**/*.rs"], description = "A part's test has a `succeeds` row, and a `refuses` row where its errors.rs has a variant of its own." },
]

