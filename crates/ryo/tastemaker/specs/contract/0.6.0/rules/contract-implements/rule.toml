description = "A contract part's `contract.rs` imports the engine trait its `trait` param names and implements it in an `impl <Trait> for`: a contract that does not implement its trait is not a contract."
why = "A language fulfils the engine's concepts by implementing the traits the engine declares (`ryo::languages::Parse` and `Project`), and a contract part is that implementation: a `contract.rs` that does not implement its trait leaves the language's answers unwritten, whatever else it declares. The trait is found by the path the file imports (`use ryo::languages::Parse;`), whose last segment is the name in the file's `impl <Trait> for`. Read as written: the `impl` blocks of the file with a trait before `for`; an impl generated by a macro is not seen."
params = { trait = { type = "string", description = "The path of the engine trait the contract implements (`ryo::languages::Parse`)." } }

query = '''
param trait: string;
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = project(from=listed-files, columns=["file"]);
let item-files = capture(from=files, path="file", pattern="{*dir}/contract.rs", captures=["dir"]);
let item-paths = project(from=item-files, columns=["file"]);
let imports = select * from "static-import" where target = $trait;
let token-edges = select l."parent" as "parent", r."id" as "token", r."kind" as "kind", r."text" as "text" from "syntax-child" as l join tree-tokens as r on l."child" = r."id";
let paths = select * from tree-nodes where kind = "path";
let segments = select * from tree-nodes where kind = "path-segment";
let name-refs = select * from tree-nodes where kind = "name-ref";
let path-segment-edges = select l."id" as "pathnode", r."child" as "child" from paths as l join "syntax-child" as r on l."id" = r."parent";
let path-segments = select l."pathnode" as "pathnode", r."id" as "segment" from path-segment-edges as l join segments as r on l."child" = r."id";
let segment-ref-edges = select l."pathnode" as "pathnode", r."child" as "child" from path-segments as l join "syntax-child" as r on l."segment" = r."parent";
let segment-refs = select l."pathnode" as "pathnode", r."id" as "nameref" from segment-ref-edges as l join name-refs as r on l."child" = r."id";
let path-names = select l."pathnode" as "pathnode", r."text" as "name" from segment-refs as l join token-edges as r on l."nameref" = r."parent";
let impls = select * from tree-nodes where kind = "impl";
let impl-children = select r."child" as "child", l."id" as "id", l."file" as "file", r."ordinal" as "ordinal" from impls as l join "syntax-child" as r on l."id" = r."parent";
let path-types = select * from tree-nodes where kind = "path-type";
let impl-types = select l."child" as "type", l."id" as "id", l."file" as "file", l."ordinal" as "ordinal" from impl-children as l join path-types as r on l."child" = r."id";
let for-tokens = select * from tree-tokens where kind = "for-kw";
let impl-for = select l."id" as "id", l."ordinal" as "for" from impl-children as l join for-tokens as r on l."child" = r."id";
let impl-types-for = select r."for" as "for", l."id" as "id", l."file" as "file", l."ordinal" as "ordinal", l."type" as "type" from impl-types as l join impl-for as r on l."id" = r."id";
let trait-types = select * from impl-types-for where ordinal < for;
let trait-path-edges = select r."child" as "child", l."id" as "impl", l."file" as "file" from trait-types as l join "syntax-child" as r on l."type" = r."parent";
let trait-paths = select l."impl" as "impl", l."file" as "file", r."id" as "pathnode" from trait-path-edges as l join paths as r on l."child" = r."id";
let trait-names = select l."impl" as "impl", l."file" as "file", r."name" as "trait" from trait-paths as l join path-names as r on l."pathnode" = r."pathnode";
let implementing = select l."file" as "file" from trait-names as l join imports as r on l."file" = r."file" and l."trait" = r."binding";
let implementers = project(from=implementing, columns=["file"]);
let lacking = antijoin(left=item-paths, right=implementers, left-on=["file"], right-on=["file"]);
let lacking-rows = extend(from=lacking, values={"problem": "does not import the contract's `trait` and implement it in an `impl <Trait> for`"});
emit lacking-rows subject "file" key("problem");
'''

[diagnostic]
primary = "file"
message = "this contract {problem}"
help = "Import the engine trait the contract is for (`use ryo::languages::Parse;`) and implement it for the contract's struct. An ignore is not legitimate here: a contract that does not implement its trait is not a contract."

[given]
include = ['**/*.rs']
params = { trait = 'ryo::languages::Parse' }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'contract-imports-engine-trait-implements'
scenario = 'A contract that imports the engine trait and implements it.'
given.files.'src/inbound/contracts/parse/contract.rs' = '''
use ryo::languages::Parse;

pub struct ParseContract;

impl ParseContract {
    /// `parse` over the ports it calls, which the edge injects.
    #[must_use]
    pub fn new() -> Self {
        Self
    }
}

impl Parse for ParseContract {}
'''

[[scenarios]]
id = 'not-implemented'
scenario = 'A contract that imports the trait and implements nothing.'
given.files.'src/inbound/contracts/parse/contract.rs' = '''
use ryo::languages::Parse;

pub struct ParseContract;

impl ParseContract {
    /// `parse` over the ports it calls, which the edge injects.
    #[must_use]
    pub fn new() -> Self {
        Self
    }
}
'''
then.findings = [
  { path = 'src/inbound/contracts/parse/contract.rs' },
]

[[scenarios]]
id = 'other-trait'
scenario = 'A contract that implements another trait than its own.'
given.files.'src/inbound/contracts/parse/contract.rs' = '''
use ryo::languages::Parse;
use ryo::languages::Project;

pub struct ParseContract;

impl ParseContract {
    /// `parse` over the ports it calls, which the edge injects.
    #[must_use]
    pub fn new() -> Self {
        Self
    }
}

impl Project for ParseContract {}
'''
then.findings = [
  { path = 'src/inbound/contracts/parse/contract.rs' },
]

[[scenarios]]
id = 'not-imported'
scenario = 'A contract that implements a trait of the name without importing the engine path.'
given.files.'src/inbound/contracts/parse/contract.rs' = '''
pub struct ParseContract;

impl ParseContract {
    /// `parse` over the ports it calls, which the edge injects.
    #[must_use]
    pub fn new() -> Self {
        Self
    }
}

impl Parse for ParseContract {}
'''
then.findings = [
  { path = 'src/inbound/contracts/parse/contract.rs' },
]
