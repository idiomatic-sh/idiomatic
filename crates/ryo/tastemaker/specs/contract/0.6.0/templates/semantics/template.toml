description = "The parse contract's answers to the catalog's optional relations: the contract's struct implementing `ryo::languages::Semantics`."
why = "`Semantics` is the engine's second trait on the parse contract's struct: what a language answers of the relations the catalog declares `optional`, beside the baseline ones `Parse` answers in `contract.rs`. A language that answers any of them answers each here, in the file named for the trait, so `contract.rs` keeps one list and this file the other, and `Parse::semantics` hands this implementation out with `Some(self)`. A language that answers none of them has no `semantics.rs` and answers `None`. Only the parse contract has one: `Semantics` is handed out by `Parse`."
