description = "A file of a syntax adapter, the implementation of the syntax port for one parser library: `src/outbound/syntax/adapters/<library>/schemas.rs`."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! What the parser gives, which the adapter does not control, and its conversion into the language's kinds: the one declaration of
//! how each of the library's kinds is a kind of the language's trees.

use super::types::Piece;
use crate::domain::nodes::types::Node;
use crate::domain::syntax::types::Kind;
use crate::domain::tokens::types::Token;

{% if scaffold | default(false) %}
/// How the library names a part of a file.
pub(super) struct PieceSchema(pub(super) Piece);
{% endif %}

{% if scaffold | default(false) %}
impl From<PieceSchema> for Kind {
    fn from(schema: PieceSchema) -> Self {
        match schema.0 {
            Piece::File => Self::Node(Node::SourceFile),
            Piece::Text => Self::Token(Token::Text),
        }
    }
}
{% endif %}

{% if scaffold | default(false) %}
/// The language's kind for a part of a file the library names `piece`.
pub(super) fn piece_kind(piece: Piece) -> Kind {
    Kind::from(PieceSchema(piece))
}
{% endif %}

{% if scaffold | default(false) %}
#[cfg(test)]
#[path = "schemas_test.rs"]
mod tests;
{% endif %}
'''

[given]
file = 'src/outbound/syntax/adapters/{library}/schemas.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/outbound/syntax/adapters/demo_parser/schemas.rs' = '''
//! What the parser gives, which the adapter does not control, and its conversion into the language's kinds: the one declaration of
//! how each of the library's kinds is a kind of the language's trees.

use super::types::Piece;
use crate::domain::nodes::types::Node;
use crate::domain::syntax::types::Kind;
use crate::domain::tokens::types::Token;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
