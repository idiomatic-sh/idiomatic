description = "The constants.rs of the `nodes` concept: the nodes of the language's trees, named as its standard names them: the text and numbers its code uses, so no literal sits in code."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The names of the `nodes` concept.

{% if scaffold | default(false) %}
/// The standard the node names come from, and its version.
#[cfg(any(test, feature = "fixtures"))]
pub(crate) const STANDARD: &str = "{{ lang }}, not yet pinned";
{% endif %}
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'src/domain/nodes/constants.rs'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/domain/nodes/constants.rs' = '''
//! The names of the `nodes` concept.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/domain/nodes/constants.rs' = '''
//! The names of the `nodes` concept.


// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-domain-nodes-constants#count', path = '.' },
]
