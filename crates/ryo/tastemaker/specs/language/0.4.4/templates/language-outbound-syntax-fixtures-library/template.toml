description = "A file of the syntax port, which the parser library implements: `src/outbound/syntax/fixtures/library.rs`."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
{%- set library = captures.library | default(["library"]) | first -%}
//! The library of the `{{ library }}` adapter, as the conformance reads it: the walk of its own tree, and its own reading of the file.

use ryo::languages::contract::{LibraryWalk, Oracle};

/// How the library walks its own tree of a file: what the conformance holds our tree to the shape of.
#[must_use]
pub(crate) fn walk() -> LibraryWalk {
    crate::outbound::syntax::adapters::{{ library }}::fixtures::walk::walked
}

/// How the library reads the document of a file: what the conformance holds the rows to.
#[must_use]
pub(crate) fn oracle() -> Oracle {
    crate::outbound::syntax::adapters::{{ library }}::fixtures::oracle::oracle
}
'''

[given]
file = 'src/outbound/syntax/fixtures/library.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/outbound/syntax/fixtures/library.rs' = '''
