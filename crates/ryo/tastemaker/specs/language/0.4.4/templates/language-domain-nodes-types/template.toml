description = "The types.rs of the `nodes` concept: the nodes of the language's trees, named as its standard names them: its plain data: the types of the concept, with public fields and derives."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The types of the `nodes` concept: plain data, public fields and derives, with no constructor and no inherent impl. A node is named
//! as the standard names it, in kebab case.

/// What a node of a {{ lang }} syntax tree is. One closed list, each name once.
#[derive(
    Clone,
    Copy,
    Debug,
    PartialEq,
    Eq,
    Hash,
    strum::EnumIter,
    strum::IntoStaticStr,
    strum::FromRepr,
    strum::EnumCount,
)]
#[strum(serialize_all = "kebab-case")]
#[repr(u16)]
pub(crate) enum Node {
    /// The whole file. `source-file`.
    SourceFile,
}
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'src/domain/nodes/types.rs'
params = { lang = 'demo' }

