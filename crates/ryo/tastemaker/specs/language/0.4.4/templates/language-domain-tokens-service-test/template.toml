description = "The service_test.rs of the `tokens` concept: the tokens of the language's trees, named as its standard names them: the proof of its service, in the one test shape."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The `tokens` service's cases.

use super::service::standard;
use super::types::Token;
use crate::cases::{Case, CaseName, Expect, Word, run};
use crate::domain::syntax::service::kind_name;
use crate::domain::syntax::types::Kind;
use strum::EnumCount;

/// What a row asks: a token's name, how many tokens there are, or the standard.
type Input = Question;
/// The answer, as text.
type Value = &'static str;
type Failure = ();

{% if scaffold | default(false) %}
/// What a row asks of the service.
#[derive(Clone, Copy, Debug)]
enum Question {
    /// The name of a token, as the standard names it.
    Name(Token),
    /// How many tokens there are.
    Count,
    /// The standard the names come from.
    Standard,
}
{% endif %}

/// The rows of this part's cases.
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: CaseName("token_is_named_as_the_standard_names_it"),
        word: Word::Succeeds,
        input: || Question::Name(Token::Text),
        expect: Expect::Value("text"),
    },
    Case {
        name: CaseName("the_names_come_from_the_standard"),
        word: Word::Succeeds,
        input: || Question::Standard,
        expect: Expect::Value("{{ lang }}, not yet pinned"),
    },
    Case {
        name: CaseName("the_language_has_one_token_so_far"),
        word: Word::Succeeds,
        input: || Question::Count,
        expect: Expect::Value("1"),
    },
];

fn subject(question: Input) -> Value {
    match question {
        Question::Name(each) => kind_name(Kind::Token(each)).0,
        Question::Count => Box::leak(Token::COUNT.to_string().into_boxed_str()),
        Question::Standard => standard().0,
    }
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, |input| Ok(subject(input)));
}
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'src/domain/tokens/service_test.rs'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
