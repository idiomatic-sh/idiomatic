description = "A file of a syntax adapter, the implementation of the syntax port for one parser library: `src/outbound/syntax/adapters/<library>/constants.rs`."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The text the `{{ library }}` adapter reads with.

{% if scaffold | default(false) %}
/// What the adapter says of bytes that are not UTF-8.
pub(super) const NOT_UTF8: &str =
    "invalid UTF-8: the language reads a file as UTF-8 text, and the parser reads it no further";
{% endif %}
'''

[given]
file = 'src/outbound/syntax/adapters/{library}/constants.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/outbound/syntax/adapters/demo_parser/constants.rs' = '''
//! The text the `demo_parser` adapter reads with.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/outbound/syntax/adapters/demo_parser/constants.rs' = '''
//! The text the `demo_parser` adapter reads with.


// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-outbound-syntax-adapters-library-constants#count', path = '.' },
]
