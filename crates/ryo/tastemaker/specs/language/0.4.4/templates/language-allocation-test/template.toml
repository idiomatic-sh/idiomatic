'''
then.findings = [
  { rule = 'language-allocation-test#template', path = 'tests/allocation.rs' },
]

[[scenarios]]
id = 'extra-logic'
scenario = "A test of the language's own in a file that is the engine's."
given.files.'tests/allocation.rs' = '''
