)]

pub(crate) mod inbound;
pub(crate) mod outbound;

mod domain;

/// The {{ lang }} language, composed over its syntax port: what an edge links to read {{ lang }}.
#[must_use]
pub fn linked() -> ryo::languages::Language {
    use std::sync::Arc;

    use crate::inbound::contracts::parse::contract::ParseContract;
    use crate::inbound::contracts::project::contract::ProjectContract;
    use crate::outbound::syntax::factory::{{ library }};

    ryo::link!(
        domain::language::constants::NAME,
        parse: Arc::new(ParseContract::new(Arc::new({{ library }}()))),
        project: Arc::new(ProjectContract::new()),
    )
}

#[cfg(any(test, feature = "fixtures"))]
pub mod cases;

#[cfg(any(test, feature = "fixtures"))]
pub mod fixtures;
