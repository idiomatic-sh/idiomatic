description = "The service.rs of the `language` concept: which files are the language's: its service: free functions named by verb over the types, with no IO and no ports."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The `language` service: free functions named by verb over the domain's types, with no IO and
//! no ports. It says which files are {{ lang }}.

use super::constants::EXTENSION;
use ryo::languages;

{% if scaffold | default(false) %}
/// Whether `path` names a {{ lang }} file: one ending in the language's extension.
#[must_use]
pub fn reads(path: languages::SourcePath<'_>) -> languages::Recognition {
    if path.0.ends_with(EXTENSION) {
        languages::Recognition::Reads
    } else {
        languages::Recognition::Declines
    }
}
{% endif %}
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'src/domain/language/service.rs'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/domain/language/service.rs' = '''
//! The `language` service: free functions named by verb over the domain's types, with no IO and
//! no ports. It says which files are demo.

use super::constants::EXTENSION;
use ryo::languages;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/domain/language/service.rs' = '''
//! The `language` service: free functions named by verb over the domain's types, with no IO and
//! no ports. It says which files are demo.

use super::constants::EXTENSION;
use ryo::languages;


// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-domain-language-service#count', path = '.' },
]
