description = "The language's source import allowance, `src/tastemaker.toml`: the crates its own placement declares, written as the literal list its source is held to."
why = "Every language's source scope needs its import allowance, `src/tastemaker.toml` (the product places `provider-imports` on `src`, which denies by default), and a scaffold writes only the files the entry it scaffolds places, so the language spec places it, alone: a file is placed by one template entry. It renders the library of each syntax adapter, and a placed file must list each of them; `source-import-allowlist`, in the language's own placement, holds the whole list to exactly the root's `libraries` and `domain-libraries`."
content = '''
imports-allow = [{% for library in captures.library | default(["library"]) %}"{{ library }}::*"{% if not loop.last %}, {% endif %}{% endfor %}]
'''

[given]
file = 'own.toml'

[[scenarios]]
id = 'source-allowance-written'
scenario = 'The scaffolded language allows its source the library of its syntax adapter.'
given.files.'own.toml' = '''
imports-allow = ["library::*"]
'''

[[scenarios]]
id = 'source-allowance-missing'
scenario = 'The source allowance is missing.'
then.findings = [
  { rule = 'language-source-allowances#count', path = '.' },
]

[[scenarios]]
id = 'source-allowance-holds-more-crates'
scenario = 'A language that reads with more crates lists them after the library it was scaffolded with.'
given.files.'own.toml' = '''
imports-allow = ["library::*", "library_lexer::*", "indexmap::*"]
'''

[[scenarios]]
id = 'source-allowance-without-its-library'
scenario = 'A source allowance that lists other crates but not the library is not the scaffolded allowance.'
given.files.'own.toml' = '''
imports-allow = ["indexmap::*"]
'''
then.findings = [
  { rule = 'language-source-allowances#template', path = 'own.toml' },
]
