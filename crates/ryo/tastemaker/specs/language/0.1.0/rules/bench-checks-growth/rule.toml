description = "A language's benches/performance.rs checks the growth of its parse: a function `complexity` that reads a generated input at sizes N and 4N and fails above about five times the time, against a `GROWTH_LIMIT`, called only when the bench is run for timing (under `BENCH_FLAG`)."
why = "A parser that is quadratic on a long file passes every fixture and fails real repositories. The bench reads a generated input at N and at four times N and fails when the larger takes more than about five times the smaller (four is linear, sixteen is quadratic), so a language that grows faster than linearly is found by its own gate. The check times the reading, so only the timing run (`cargo bench`, which passes `--bench`) makes it: the call to `complexity` sits in an `if` that tests `BENCH_FLAG`, and `cargo test`, which passes no such argument, builds the bench and never times it."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = project(from=listed-files, columns=["file"]);
let benches = select * from files where glob_any(file, "{benches/performance.rs,**/benches/performance.rs}");
let idents = select * from tree-tokens where kind = "ident";
let limits = select * from idents where text = "GROWTH_LIMIT";
let limit-paths = project(from=limits, columns=["file"]);
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let ifs = select * from tree-nodes where kind = "if-expr";
let complexities = select * from idents where text = "complexity";
let complexity-refs = select r."parent" as "id" from complexities as l join "syntax-child" as r on l."id" = r."child";
let complexity-ifs = axis(from=complexity-refs, relation="syntax-child", direction=ancestor, domain=ifs);
let flags = select * from idents where text = "BENCH_FLAG";
let flag-refs = select r."parent" as "id" from flags as l join "syntax-child" as r on l."id" = r."child";
let flag-ifs = axis(from=flag-refs, relation="syntax-child", direction=ancestor, domain=ifs);
let guarded = select l."related" as "related" from complexity-ifs as l join flag-ifs as r on l."related" = r."related";
let guarded-ifs = select r."file" as "file" from guarded as l join ifs as r on l."related" = r."id";
let guarded-paths = project(from=guarded-ifs, columns=["file"]);
let both = select l."file" as "file" from limit-paths as l join guarded-paths as r on l."file" = r."file";
let both-paths = project(from=both, columns=["file"]);
let missing = antijoin(left=benches, right=both-paths, left-on=["file"], right-on=["file"]);
emit missing subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "this bench has no growth check, or runs it unguarded"
help = "Add a `complexity` function that reads a generated input of `SIZE` and of `4 * SIZE` through the linked language and asserts the larger took less than `GROWTH_LIMIT` (5) times the smaller, and call it before the workloads run, only under the bench flag: `const BENCH_FLAG: &str = \"--bench\";` and `if std::env::args().any(|argument| argument == BENCH_FLAG) { complexity(); }`."

[given]
include = ['benches/performance.rs']

[[scenarios]]
id = 'bench-complexity-check-run-only-under-bench'
scenario = 'A bench with a complexity check run only under the bench flag.'
given.files.'benches/performance.rs' = '''
const GROWTH_LIMIT: u32 = 5;

fn complexity() {
    let _ = GROWTH_LIMIT;
}

/// The argument `cargo bench` passes to a bench and `cargo test` does not: the growth check times the reading, so only the timing run makes it.
const BENCH_FLAG: &str = "--bench";

fn main() {
    if std::env::args().any(|argument| argument == BENCH_FLAG) {
        complexity();
    }
}
'''

[[scenarios]]
id = 'bench-without-one'
scenario = 'A bench without one.'
given.files.'benches/performance.rs' = '''
fn main() {}
'''
then.findings = [
  { path = 'benches/performance.rs' },
]

[[scenarios]]
id = 'bench-runs-check-whenever-run'
scenario = 'A bench that runs the check whenever it is run.'
given.files.'benches/performance.rs' = '''
const GROWTH_LIMIT: u32 = 5;

fn complexity() {
    let _ = GROWTH_LIMIT;
}

fn main() {
    complexity();
}
'''
then.findings = [
  { path = 'benches/performance.rs' },
]
