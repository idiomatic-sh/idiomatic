pub(crate) struct SourceText<'a>(pub &'a [u8]);

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-outbound-syntax-types#count', path = '.' },
]
