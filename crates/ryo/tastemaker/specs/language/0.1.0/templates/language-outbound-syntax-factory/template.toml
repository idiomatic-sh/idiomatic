description = "A file of the syntax port, which the parser library implements: `src/outbound/syntax/factory.rs`."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
{%- set library = captures.library | default(["library"]) | first -%}
//! Builds the syntax adapters, one function each. Every dependency arrives as a
//! parameter from the edge that composes. A factory builds nothing else, chooses nothing, and is called
//! only by an edge.

/// The `{{ library }}` syntax adapter: the parser library the language reads with.
#[must_use]
pub(crate) fn {{ library }}() -> impl crate::outbound::syntax::interface::SyntaxPort {
    super::adapters::{{ library }}::adapter::Syntax{{ library | pascal }}Adapter
}
'''

[given]
file = 'src/outbound/syntax/factory.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
