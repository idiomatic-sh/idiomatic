description = "The types.rs of the `syntax` concept: the kind of an element of a tree, its number and its name: its plain data: the types of the concept, with public fields and derives."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The types of the `syntax` concept: plain data, public fields and derives, with no constructor
//! and no inherent impl. A kind of node or token is a node, a token or an extra, named in kebab case; the element table holds its number.

use crate::domain::extras::types::Extra;
use crate::domain::nodes::types::Node;
use crate::domain::tokens::types::Token;

/// What a node or a token of a {{ lang }} syntax tree is: a node or a token of the standard, or an extra the standard lacks. The element table
/// holds its number: the nodes first, then the tokens, then the extras, each in the order of its enum.
#[derive(Clone, Copy, Debug, PartialEq, Eq, Hash)]
pub(crate) enum Kind {
    /// A node.
    Node(Node),
    /// A token.
    Token(Token),
    /// A kind the standard lacks.
    Extra(Extra),
}

{% if scaffold | default(false) %}
/// Whether an element is a token, a leaf, or a node: what `is_token` of the scaffolded service answers. A language whose readers
/// never ask it, as HTML's do not, keeps none.
#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub(crate) enum Leaf {
    /// A token.
    Token,
    /// A node.
    Node,
}
{% endif %}
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'src/domain/syntax/types.rs'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
