[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-cargo#count', path = '.' },
]

[[scenarios]]
id = 'required-timing-schema-cannot-change-silently'
scenario = 'A language cannot replace its established timing identity schema with an unrecognised one.'
given.files.'Cargo.toml' = '''

[package]
name = "idiomatic-sh-ryo-demo"
