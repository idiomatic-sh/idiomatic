description = "The crate's manifest: the SDK and the derives it uses, the closed test targets, the bench and the `fixtures` feature."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
[package]
name = "idiomatic-sh-ryo-{{ lang }}"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
{% if scaffold | default(false) %}
publish = false
{% endif %}
autobenches = false
autotests = false

[lib]
name = "ryo_{{ lang }}"

[dependencies]
strum.workspace = true
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk" }

[dev-dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-{{ lang }} = { path = ".", features = ["fixtures"] }
divan.workspace = true

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
fixtures = ["ryo/fixtures"]

[lints]
workspace = true

# Its `allocation` test target (`harness = false`) sets `dhat` as the global allocator, which machete does not see.
[package.metadata.cargo-machete]
ignored = ["dhat"]

# Established generated parser timing identities; native CPU/RSS are not inferred from Divan.
[package.metadata.ryo.performance]
schema = "divan-timing/v1"
workloads = { generated_every_relation = [2500, 10000] }
metrics = ["median-ns"]

'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'Cargo.toml'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'Cargo.toml' = '''
