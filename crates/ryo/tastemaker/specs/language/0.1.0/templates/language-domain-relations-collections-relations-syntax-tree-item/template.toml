description = "A file of the `relations` collection (the syntax_tree item): item.rs."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The `syntax_tree` relation of the language: every node and every token, white space and comments included.

use crate::domain::syntax::service::{kind_symbol, token_text};
use ryo::languages;

pub(crate) struct SyntaxTreeItem;

ryo::reads! {
    SyntaxTreeItem => languages::SyntaxTree |tree, at, symbols| {
        kinds: every,
        row {
            id: node(at),
            kind: value(kind_symbol(tree, symbols, at)),
            text: value(token_text(tree, at)),
            file: file,
            span: span(at),
        }
    }
}
'''

[given]
file = 'src/domain/relations/collections/relations/syntax_tree/item.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
