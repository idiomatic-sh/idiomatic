description = "A file of the `relations` collection (its shared cases): contract.rs, whose `check` runs the kernel's rows against one item."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold. Its one check runs the shared rows the language kernel states once (`ryo::languages::contract::check_item`), so no language copies them."
content = '''
//! What every item of the `relations` collection must pass: the shared rows of the language kernel.

/// Runs the kernel's shared rows against one item.
pub(crate) fn check<Item: ryo::languages::ReadItem>() {
    ryo::languages::contract::check_item::<Item>();
}
'''

[given]
file = 'src/domain/relations/collections/relations/fixtures/contract.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
