description = "The constants.rs of the `syntax` concept: the kind of an element of a tree, its number and its name: the text and numbers its code uses, so no literal sits in code."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The names of the `syntax` concept: the reasons no relation models a kind of the trees, which `sample` gives.

{% if scaffold | default(false) %}
/// Text the parser could not read.
#[cfg(any(test, feature = "fixtures"))]
pub const UNREAD_TEXT: &str =
    "text the parser could not read as any token: `syntax_error` reads what the library said of it";
{% endif %}
'''

[given]
file = 'src/domain/syntax/constants.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/domain/syntax/constants.rs' = '''
//! The names of the `syntax` concept: the reasons no relation models a kind of the trees, which `sample` gives.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/domain/syntax/constants.rs' = '''
//! The names of the `syntax` concept: the reasons no relation models a kind of the trees, which `sample` gives.


// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-domain-syntax-constants#count', path = '.' },
]
