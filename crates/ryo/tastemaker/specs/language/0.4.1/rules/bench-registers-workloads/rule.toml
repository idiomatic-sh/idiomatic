description = "A language's benchmarks/provider/bench.rs registers at least one workload: a function with `#[divan::bench]`."
why = "A bench with no workload holds nothing: it builds, runs and reports no time, so a language's speed is unwatched while its gate is green. At least one function carries the `bench` attribute of `divan` (`#[divan::bench]`, with or without arguments), so the numbers the bench reports exist. Read as written: an identifier `bench` in an attribute of the file; a workload registered in a macro or in another file is not seen."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = project(from=listed-files, columns=["file"]);
let benches = select * from files where glob_any(file, "{benchmarks/provider/bench.rs,**/benchmarks/provider/bench.rs}");
let idents = select * from tree-tokens where kind = "ident";
let named = select * from idents where text = "bench";
let refs = select r."parent" as "id" from named as l join "syntax-child" as r on l."id" = r."child";
let attrs = select * from tree-nodes where kind = "attr";
let registered = axis(from=refs, relation="syntax-child", direction=ancestor, domain=attrs);
let owners = select r."file" as "file" from registered as l join attrs as r on l."related" = r."id";
let owner-paths = project(from=owners, columns=["file"]);
let empty = antijoin(left=benches, right=owner-paths, left-on=["file"], right-on=["file"]);
emit empty subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "this bench registers no workload"
help = "Register the workloads the language is held to: a function with `#[divan::bench]` that reads a generated or a fixture input through the linked language. A bench with none measures nothing. An ignore is never the fix."

[given]
include = ['benchmarks/provider/bench.rs']

[[scenarios]]
id = 'workload-registered'
scenario = 'A workload is registered.'
given.files.'benchmarks/provider/bench.rs' = '''
fn main() {
    divan::main();
}

#[divan::bench]
fn read() -> usize {
    "a = 1".len()
}
'''

[[scenarios]]
id = 'registered-with-args'
scenario = 'A workload with arguments is registered.'
given.files.'benchmarks/provider/bench.rs' = '''
fn main() {
    divan::main();
}

#[divan::bench(args = [1, 4])]
fn read(size: usize) -> usize {
    size
}
'''

[[scenarios]]
id = 'empty-bench'
scenario = 'The bench only runs the harness.'
given.files.'benchmarks/provider/bench.rs' = '''
fn main() {
    divan::Divan::default().config_with_args().main();
}
'''
then.findings = [
  { path = 'benchmarks/provider/bench.rs' },
]
