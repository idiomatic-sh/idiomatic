description = "The root of the typed fixtures of the language: the module that gathers how its kinds are shown and the rows each relation fixture gives, and `expected`, which the conformance test reads."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! What the language's conformance is held to besides the files of its fixtures: how each kind of its trees is shown and the typed rows
//! each fixture must give. The language has no project, so it gives no rows of one.

pub mod contracts;
pub(crate) mod kinds;
#[cfg(test)]
pub(crate) mod reading;
#[cfg(not(bless))]
mod relations;

use crate::outbound::syntax::fixtures::library;
use ryo::languages::contract::{Fixtures, Shape};

/// The fixtures of the language.
#[must_use]
pub fn expected() -> Fixtures {
    Fixtures {
        kinds: kinds::shown(),
        relations: stated_relations(),
        manifests: Vec::new(),
        semantic: Vec::new(),
        shape: Shape::Walk(library::walk()),
        oracle: library::oracle(),
        unfilled: Vec::new(),
    }
}

/// The rows each relation read from trees is held to.
#[cfg(not(bless))]
fn stated_relations() -> Vec<ryo::languages::contract::Expected> {
    relations::expected()
}

/// The rows each relation read from trees is held to: none while they are written (`--bless`).
#[cfg(bless)]
fn stated_relations() -> Vec<ryo::languages::contract::Expected> {
    Vec::new()
}
'''

[given]
file = 'src/fixtures.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
