mod syntax_tree {
    include!("../../tests/fixtures/relations/syntax_tree/expected.rs");
}

/// The rows of every relation.
pub(super) fn expected() -> Vec<Expected> {
    vec![syntax_tree::expected()]
}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
