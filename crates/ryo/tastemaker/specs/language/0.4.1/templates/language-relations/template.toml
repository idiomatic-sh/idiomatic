description = "The rows each relation the language reads must give for its fixture, one module for each relation, each the `expected.rs` of its fixture."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The rows each relation read from trees must give for its fixture, one module for each relation.

use ryo::languages::contract::Expected;

mod syntax_tree {
    include!("../../tests/fixtures/relations/syntax_tree/expected.rs");
}

/// The rows of every relation.
pub(super) fn expected() -> Vec<Expected> {
    vec![syntax_tree::expected()]
}
'''

[given]
file = 'src/fixtures/relations.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/fixtures/relations.rs' = '''
//! The rows each relation read from trees must give for its fixture, one module for each relation.

