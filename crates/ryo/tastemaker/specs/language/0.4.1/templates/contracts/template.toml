description = "The language's contracts: one public module per contract part the language spec places, and nothing else."
why = "Declares each contract part (`parse`, `project`) so the crate's inbound surface is the list of the engine traits the language fulfils. The list is the two contract parts the spec places, so a contract that is placed and not declared here is a finding."
content = '''
//! The {{ lang }} language's contracts, one module each.

pub(crate) mod parse;
pub(crate) mod project;
'''
match = "declarations"

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'src/inbound/contracts.rs'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/inbound/contracts.rs' = '''
//! The demo language's contracts, one module each.

pub(crate) mod parse;
pub(crate) mod project;
'''

[[scenarios]]
id = 'stray-module'
scenario = 'The list declares a module no contract part is placed for.'
given.files.'src/inbound/contracts.rs' = '''
//! The demo language's contracts, one module each.

pub(crate) mod parse;
pub(crate) mod project;
pub mod stray;
'''
then.findings = [
  { rule = 'contracts#template', path = 'src/inbound/contracts.rs' },
]

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'contracts#count', path = '.' },
]
