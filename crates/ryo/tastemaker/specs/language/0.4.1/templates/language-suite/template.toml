description = "The README of a language's pinned test suite: where the suite comes from and which version is pinned."
why = "A language is held to the official test suite of its own grammar, copied into `tests/fixtures/suite/` and pinned: the files are a snapshot, so the page beside them says what they are a snapshot of, the source (the repository or the site that publishes the suite) and the version or commit pinned, so that an update is a visible change and no one has to guess which release a failing case came from. The template is open: it asks that the page exist and shows the two headings it names, and the suite's text is the language's own."
content = '''
# {{ lang }} test suite

## Source

The official test suite of the language and where it is published.

## Version

The release or commit of the suite that is pinned here.
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'tests/fixtures/suite/README.md'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'tests/fixtures/suite/README.md' = '''
# demo test suite

## Source

The official test suite of the language and where it is published.

## Version

The release or commit of the suite that is pinned here.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A page may carry more than its template.'
given.files.'tests/fixtures/suite/README.md' = '''
# demo test suite

## Source

The official test suite of the language and where it is published.

## Version

The release or commit of the suite that is pinned here.

## Notes

Cases are copied unchanged.
'''

[[scenarios]]
id = 'page-missing'
scenario = 'The page is missing.'
then.findings = [
  { rule = 'language-suite#count', path = '.' },
]
