description = "One contract's module file: the contract, public, and its test under #[cfg(test)]."
why = "Declares one contract's body and its test, so every contract of every language compiles the same way and none runs untested. The module file lies outside the part, beside its directory, like a use case's."
content = '''
//! The {{ lang }} language's `{{ contract }}` contract.

pub(crate) mod contract;

#[cfg(test)]
mod contract_test;
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }
contract = { type = "identifier", description = "The contract, captured from its path." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'src/inbound/contracts/parse.rs'
given.params = { lang = 'demo', contract = 'parse' }
given.files.'src/inbound/contracts/parse.rs' = '''
//! The demo language's `parse` contract.

pub(crate) mod contract;

#[cfg(test)]
mod contract_test;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'src/inbound/contracts/parse.rs'
given.params = { lang = 'demo', contract = 'parse' }
given.files.'src/inbound/contracts/parse.rs' = '''
//! The demo language's `parse` contract.

pub(crate) mod contract;

#[cfg(test)]
mod contract_test;

// kept
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/inbound/contracts/parse.rs'
given.params = { lang = 'demo', contract = 'parse' }
then.findings = [
  { rule = 'contract-module#count', path = '.' },
]
