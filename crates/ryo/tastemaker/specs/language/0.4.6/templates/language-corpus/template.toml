description = "The README of a language's real-world corpus: where its files come from and which version of each is pinned."
why = "A language is held to real-world files, copied unchanged into `tests/fixtures/corpus/` and pinned: the files are a snapshot, so the page beside them says what they are a snapshot of, the source and the version or commit pinned, so that an update is a visible change. The template is open: it asks that the page exist and shows the two headings it names, and the corpus is the language's own."
content = '''
# {{ lang }} corpus

## Source

The real-world files of the {{ lang }} language that are held here and where each is published.

## Version

The release or commit of each source that is pinned here.
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'tests/fixtures/corpus/README.md'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'tests/fixtures/corpus/README.md' = '''
# demo corpus

## Source

The real-world files of the demo language that are held here and where each is published.

## Version

The release or commit of each source that is pinned here.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A page may carry more than its template.'
given.files.'tests/fixtures/corpus/README.md' = '''
# demo corpus

## Source

The real-world files of the demo language that are held here and where each is published.

## Version

The release or commit of each source that is pinned here.

## Files

Cargo.toml of this repository.
'''

[[scenarios]]
id = 'page-missing'
scenario = 'The page is missing.'
then.findings = [
  { rule = 'language-corpus#count', path = '.' },
]
