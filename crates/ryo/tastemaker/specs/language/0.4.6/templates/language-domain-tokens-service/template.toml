description = "The service.rs of the `tokens` concept: the tokens of the language's trees, named as its standard names them: its service: free functions named by verb over the types, with no IO and no ports."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The `tokens` service: free functions named by verb over the token kinds, with no IO and no ports.

#[cfg(any(test, feature = "fixtures"))]
use super::constants::STANDARD;
#[cfg(any(test, feature = "fixtures"))]
use ryo::languages::NameText;

{% if scaffold | default(false) %}
/// The standard the token names come from, and its version.
#[cfg(any(test, feature = "fixtures"))]
#[must_use]
pub(crate) fn standard() -> NameText<'static> {
    NameText(STANDARD)
}
{% endif %}
'''

[given]
file = 'src/domain/tokens/service.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/domain/tokens/service.rs' = '''
//! The `tokens` service: free functions named by verb over the token kinds, with no IO and no ports.

