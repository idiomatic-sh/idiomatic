description = "A file of a syntax adapter, the implementation of the syntax port for one parser library: `src/outbound/syntax/adapters/<library>/types.rs`."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The types of the `{{ library }}` adapter: plain data, public fields and derives, with no constructor and no inherent impl.

{% if scaffold | default(false) %}
/// What the adapter reads a part of a file as: the library's own kinds stand here, and the schemas map each to the language's.
#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub(super) enum Piece {
    /// The whole file.
    File,
    /// Text the parser read.
    Text,
}
{% endif %}
'''

[given]
file = 'src/outbound/syntax/adapters/{library}/types.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/outbound/syntax/adapters/demo_parser/types.rs' = '''
//! The types of the `demo_parser` adapter: plain data, public fields and derives, with no constructor and no inherent impl.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/outbound/syntax/adapters/demo_parser/types.rs' = '''
//! The types of the `demo_parser` adapter: plain data, public fields and derives, with no constructor and no inherent impl.


// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-outbound-syntax-adapters-library-types#count', path = '.' },
]
