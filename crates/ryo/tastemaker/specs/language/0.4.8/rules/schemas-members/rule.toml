description = "An adapter that parses or writes an external format (a file of its directory derives or names `Serialize` or `Deserialize`, or names `serde`, `serde_json`, `postcard`, `toml`, `ra_ap_syntax` or `ra_ap_parser`) and whose port carries data has a `schemas.rs` and its `schemas_test.rs`; an adapter whose port carries none has neither; an adapter with no external format (an in-memory adapter) owes none."
why = "Validation exists only where the shape of the data is not ours. An adapter is such an edge when it parses or writes an external format (no hollow artifacts: an in-memory adapter gets no placeholder `schemas.rs`), which this rule reads mechanically: the `.rs` files directly in the adapter's directory name `Serialize`, `Deserialize`, `serde`, `serde_json`, `postcard`, `toml`, `ra_ap_syntax` or `ra_ap_parser` as an identifier (a derive, a path segment, an import). It is owed when that holds and the port carries data: a spec count cannot say which adapters, so this rule decides, from the adapter's own `adapter.rs` and not from a list. Read as written: the methods of the `impl <Name>Port for..` blocks of `adapter.rs` carry data when one has a parameter besides `self`, or a return type other than `()` and `Result<(), _>`; an adapter with no such method (the scaffold's empty impl, a `flush`, a fallible `ping`) is the one exemption and has no schemas. A `schemas.rs` beside a port that carries no data is as much a finding as a missing one (an adapter whose port carries data and has no external format may still write one), and `schemas_test.rs` holds its accepted and refused inputs. The files of one adapter are paired by their directory, so one adapter never answers for another. Not seen: a port impl written outside `adapter.rs` or by a macro, and a method whose data hides behind a type alias for `()`."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let for-keywords = select * from tree-tokens where kind = "for-kw";
let path-types = select * from tree-nodes where kind = "path-type";
let type-children = select r."child" as "node", l."id" as "type" from path-types as l join "syntax-child" as r on l."id" = r."parent";
let paths = select * from tree-nodes where kind = "path";
let type-paths = select l."node" as "node", l."type" as "type" from type-children as l join paths as r on l."node" = r."id";
let type-path-children = select r."child" as "node", l."type" as "type" from type-paths as l join "syntax-child" as r on l."node" = r."parent";
let segments = select * from tree-nodes where kind = "path-segment";
let type-segments = select l."node" as "segment", l."type" as "type" from type-path-children as l join segments as r on l."node" = r."id";
let segment-children = select r."child" as "node", l."segment" as "segment", l."type" as "type" from type-segments as l join "syntax-child" as r on l."segment" = r."parent";
let name-refs = select * from tree-nodes where kind = "name-ref";
let segment-refs = select l."node" as "node", l."segment" as "segment", l."type" as "type" from segment-children as l join name-refs as r on l."node" = r."id";
let ref-tokens = select l."segment" as "segment", r."child" as "token", l."type" as "type" from segment-refs as l join "syntax-child" as r on l."node" = r."parent";
let type-names = select r."text" as "name", l."segment" as "segment", l."type" as "type" from ref-tokens as l join tree-tokens as r on l."token" = r."id";
let impl-path-types = select l."parent" as "impl", l."ordinal" as "ordinal", l."child" as "type" from "syntax-child" as l join path-types as r on l."child" = r."id";
let for-ordinals = select l."parent" as "impl", l."ordinal" as "keyword" from "syntax-child" as l join for-keywords as r on l."child" = r."id";
let trait-impl-types = select l."impl" as "impl", r."keyword" as "keyword", l."ordinal" as "ordinal", l."type" as "type" from impl-path-types as l join for-ordinals as r on l."impl" = r."impl";
let trait-traits = select * from trait-impl-types where ordinal < keyword;
let trait-names = select l."impl" as "impl", r."name" as "trait" from trait-traits as l join type-names as r on l."type" = r."type";
let functions = select * from tree-nodes where kind = "fn";
let item-lists = select * from tree-nodes where kind = "assoc-item-list";
let argument-lists = select * from tree-nodes where kind = "generic-arg-list";
let type-arguments = select * from tree-nodes where kind = "type-arg";
let list-type-arguments = select l."child" as "child", l."ordinal" as "ordinal", l."parent" as "parent" from "syntax-child" as l join type-arguments as r on l."child" = r."id";
let argument-pairs = select l."child" as "child", r."ordinal" as "earlier", l."ordinal" as "ordinal" from list-type-arguments as l join list-type-arguments as r on l."parent" = r."parent";
let later-arguments = select * from argument-pairs where ordinal > earlier;
let first-arguments = antijoin(left=list-type-arguments, right=later-arguments, left-on=["child"], right-on=["child"]);
let adapter-files = capture(from=listed-files, path="file", pattern="{*dir}/adapter.rs", captures=["dir"]);
let adapters = project(from=adapter-files, columns=["file", "dir"]);
let schema-files = capture(from=listed-files, path="file", pattern="{*dir}/schemas.rs", captures=["dir"]);
let schemas = project(from=schema-files, columns=["file", "dir"]);
let schema-test-files = capture(from=listed-files, path="file", pattern="{*dir}/schemas_test.rs", captures=["dir"]);
let schema-tests = project(from=schema-test-files, columns=["file", "dir"]);
let port-impls = select * from trait-names where glob_any(trait, "*Port");
let port-impl-children = select l."impl" as "impl", r."child" as "node" from port-impls as l join "syntax-child" as r on l."impl" = r."parent";
let impl-lists = select l."impl" as "impl", l."node" as "list" from port-impl-children as l join item-lists as r on l."node" = r."id";
let list-items = select l."impl" as "impl", r."child" as "node" from impl-lists as l join "syntax-child" as r on l."list" = r."parent";
let impl-functions = select l."node" as "function", r."file" as "file" from list-items as l join functions as r on l."node" = r."id";
let adapter-functions = select l."function" as "function", l."file" as "file" from impl-functions as l join adapters as r on l."file" = r."file";
let function-children = select l."function" as "function", r."child" as "node" from adapter-functions as l join "syntax-child" as r on l."function" = r."parent";
let param-lists = select * from tree-nodes where kind = "param-list";
let function-param-lists = select l."function" as "function", l."node" as "list" from function-children as l join param-lists as r on l."node" = r."id";
let param-list-children = select l."function" as "function", r."child" as "node" from function-param-lists as l join "syntax-child" as r on l."list" = r."parent";
let params = select * from tree-nodes where kind = "param";
let data-in = select l."function" as "function" from param-list-children as l join params as r on l."node" = r."id";
let return-types = select * from tree-nodes where kind = "ret-type";
let function-returns = select l."function" as "function", l."node" as "returns" from function-children as l join return-types as r on l."node" = r."id";
let return-children = select l."function" as "function", r."child" as "node" from function-returns as l join "syntax-child" as r on l."returns" = r."parent";
let return-nodes = select l."function" as "function", l."node" as "type", r."kind" as "kind" from return-children as l join tree-nodes as r on l."node" = r."id";
let returning = project(from=return-nodes, columns=["function"]);
let tuple-returns = select * from return-nodes where kind = "tuple-type";
let tuple-children = select l."function" as "function", l."type" as "type", r."child" as "node" from tuple-returns as l join "syntax-child" as r on l."type" = r."parent";
let tuple-members = select l."function" as "function", l."type" as "type" from tuple-children as l join tree-nodes as r on l."node" = r."id";
let unit-returns = antijoin(left=tuple-returns, right=tuple-members, left-on=["function", "type"], right-on=["function", "type"]);
let unit-functions = project(from=unit-returns, columns=["function"]);
let path-returns = select * from return-nodes where kind = "path-type";
let returned-names = select l."function" as "function", l."type" as "type", r."name" as "name", r."segment" as "segment" from path-returns as l join type-names as r on l."type" = r."type";
let results = select * from returned-names where name = "Result";
let result-children = select l."function" as "function", l."type" as "type", r."child" as "node" from results as l join "syntax-child" as r on l."segment" = r."parent";
let result-lists = select l."function" as "function", l."type" as "type", l."node" as "list" from result-children as l join argument-lists as r on l."node" = r."id";
let result-first = select l."function" as "function", l."type" as "type", r."child" as "node" from result-lists as l join first-arguments as r on l."list" = r."parent";
let result-first-args = select l."function" as "function", l."type" as "type", l."node" as "node" from result-first as l join type-arguments as r on l."node" = r."id";
let first-type-children = select l."function" as "function", l."type" as "type", r."child" as "node" from result-first-args as l join "syntax-child" as r on l."node" = r."parent";
let tuple-types = select * from tree-nodes where kind = "tuple-type";
let first-tuples = select l."function" as "function", l."type" as "type", l."node" as "tuple" from first-type-children as l join tuple-types as r on l."node" = r."id";
let first-tuple-children = select l."function" as "function", l."type" as "type", r."child" as "node" from first-tuples as l join "syntax-child" as r on l."tuple" = r."parent";
let first-tuple-members = select l."function" as "function", l."type" as "type" from first-tuple-children as l join tree-nodes as r on l."node" = r."id";
let unit-results = antijoin(left=first-tuples, right=first-tuple-members, left-on=["function", "type"], right-on=["function", "type"]);
let unit-result-functions = project(from=unit-results, columns=["function"]);
let no-data-functions = union(left=unit-functions, right=unit-result-functions);
let data-out = antijoin(left=returning, right=no-data-functions, left-on=["function"], right-on=["function"]);
let data-functions = union(left=data-in, right=data-out);
let carrying-rows = select l."file" as "file" from adapter-functions as l join data-functions as r on l."function" = r."function";
let carrying-paths = project(from=carrying-rows, columns=["file"]);
let carrying = select l."file" as "file", l."dir" as "dir" from adapters as l join carrying-paths as r on l."file" = r."file";
let dataless = antijoin(left=adapters, right=carrying, left-on=["dir"], right-on=["dir"]);
let identifiers = select * from tree-tokens where kind = "ident";
let format-names = select * from identifiers where glob_any(text, "{Serialize,Deserialize,serde,serde_json,postcard,toml,ra_ap_syntax,ra_ap_parser}");
let format-file-all = capture(from=format-names, path="file", pattern="{*dir}/{name}.rs", captures=["dir", "name"]);
let format-files = select * from format-file-all where not glob_any(name, "*_test");
let format-counts = group-count(from=format-files, keys=["dir"], count="n", distinct="file");
let format-dirs = project(from=format-counts, columns=["dir"]);
let parsing = select l."file" as "file", l."dir" as "dir" from carrying as l join format-dirs as r on l."dir" = r."dir";
let unwritten = antijoin(left=parsing, right=schemas, left-on=["dir"], right-on=["dir"]);
let unwritten-rows = extend(from=unwritten, values={"problem": "parses or writes an external format (a file of it derives or names `Serialize`, `Deserialize`, `serde`, `serde_json`, `postcard`, `toml`, `ra_ap_syntax` or `ra_ap_parser`) and has no `schemas.rs`: the shape of what it reads and writes, and its checked conversion, are written there"});
let carrying-schemas = select l."file" as "file", l."dir" as "dir" from schemas as l join carrying as r on l."dir" = r."dir";
let untested = antijoin(left=carrying-schemas, right=schema-tests, left-on=["dir"], right-on=["dir"]);
let untested-rows = extend(from=untested, values={"problem": "has a `schemas.rs` and no `schemas_test.rs`: its accepted and refused inputs are proven beside it"});
let dataless-schemas = select l."file" as "file", l."dir" as "dir" from schemas as l join dataless as r on l."dir" = r."dir";
let exempt-rows = extend(from=dataless-schemas, values={"problem": "has a `schemas.rs` but its port carries no data either way: delete it and its test"});
let stray = antijoin(left=schema-tests, right=schemas, left-on=["dir"], right-on=["dir"]);
let stray-rows = extend(from=stray, values={"problem": "has a `schemas_test.rs` and no `schemas.rs` to prove"});
let findings-1 = union(left=unwritten-rows, right=untested-rows);
let findings-2 = union(left=findings-1, right=exempt-rows);
let findings = union(left=findings-2, right=stray-rows);
emit findings subject "file" key("file", "problem");
'''

[diagnostic]
primary = "file"
message = "this adapter {problem}"
help = "Write `schemas.rs` beside `adapter.rs` when the adapter parses or writes an external format and its port's methods take or return data (the wire shape, its checked conversion into the core's types and back), with its `schemas_test.rs` of accepted and refused inputs; delete both when the port carries no data. `tm workspace scaffold` writes them. Ignore only an adapter whose port impl a macro writes, which this rule cannot read: `// ignore: idiomatic.ryo/language/schemas-members - <the macro that writes the impl>` at the top of the file the finding names."

