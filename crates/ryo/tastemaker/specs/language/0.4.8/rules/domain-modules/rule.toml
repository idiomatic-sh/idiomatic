description = "A `domain.rs` only declares its concepts' modules: every item at its top level is a `mod <concept>;` without a body."
why = "The domain is decomposed by concept: each concept's service and its test live in `domain/<concept>/`, so `domain.rs` holds no function, type, impl or import. A rule written in `domain.rs` is the single undivided domain file again, and a module written inline is a concept outside its directory. Items generated by macros are not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let files = select * from tree-nodes where kind = "source-file";
let item-edges = select r."child" as "child" from files as l join "syntax-child" as r on l."id" = r."parent";
let items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from item-edges as l join tree-nodes as r on l."child" = r."id";
let other-rows = select * from items where kind != "module";
let other-projected = project(from=other-rows, columns=["file", "span", "kind"]);
let other = extend(from=other-projected, values={"problem": "is not a concept's module"});
let modules = select * from items where kind = "module";
let module-children = select r."child" as "child", l."kind" as "kind", l."file" as "file", l."span" as "span" from modules as l join "syntax-child" as r on l."id" = r."parent";
let bodies = select * from tree-nodes where kind = "item-list";
let inline-rows = select l."kind" as "kind", l."file" as "file", l."span" as "span" from module-children as l join bodies as r on l."child" = r."id";
let inline = extend(from=inline-rows, values={"problem": "is written inline rather than in its `domain/<concept>/` directory"});
let findings = union(left=other, right=inline);
emit findings subject "file" key("span", "kind");
'''

[diagnostic]
primary = "span"
message = "this `{kind}` in `domain.rs` {problem}"
help = "Map the rules into their concepts first, then file each by its kind: a rule over several of the domain's types goes to `domain/<concept>/service.rs`, with its test in `service_test.rs` beside it and `pub(crate) mod <concept>;` here; a rule over one type is a trait impl in `types.rs` or a function in a service; orchestration of ports is a use case. `domain.rs` declares only the concepts' modules."

[given]
include = ['**/domain.rs']

[[scenarios]]
id = 'one-module-declared-per-concept'
scenario = 'One module declared per concept.'
given.files.'src/greeting/domain.rs' = '''
//! The greeting domain's rules, one module per concept.

pub(crate) mod length;
#[cfg(feature = "short")]
pub(crate) mod short;
'''

[[scenarios]]
id = 'rules-at-root'
scenario = 'A rule written in domain.rs, the undivided domain file.'
given.files.'src/greeting/domain.rs' = '''
//! The greeting domain's rules: pure functions over its values, with no IO and no ports.

/// The greetings shorter than `limit`, in their order.
pub fn short(greetings: &[String], limit: usize) -> Vec<&String> {
    greetings.iter().filter(|greeting| greeting.len() < limit).collect()
}
'''
then.findings = [
  { path = 'src/greeting/domain.rs', line = 4 },
]

[[scenarios]]
id = 'import-beside-modules'
scenario = 'An import beside the modules.'
given.files.'src/greeting/domain.rs' = '''
//! The greeting domain's rules, one module per concept.

use super::types::Greeting;

pub(crate) mod short;
'''
then.findings = [
  { path = 'src/greeting/domain.rs', line = 3 },
]

[[scenarios]]
id = 'inline-module'
scenario = 'A concept written inline.'
given.files.'src/greeting/domain.rs' = '''
//! The greeting domain's rules, one module per concept.

pub(crate) mod short {
    /// A concept written inline.
    pub fn short() {}
}
'''
then.findings = [
  { path = 'src/greeting/domain.rs', line = 3 },
]
