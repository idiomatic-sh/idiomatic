description = "A file of a syntax adapter, the implementation of the syntax port for one parser library: `src/outbound/syntax/adapters/<library>/fixtures.rs`."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! What the conformance holds the adapter to, which only tests and the `fixtures` feature use: the library's own walk of a tree and
//! its own reading of the items of a file.

pub(crate) mod oracle;
pub(crate) mod walk;
'''

[given]
file = 'src/outbound/syntax/adapters/{library}/fixtures.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/outbound/syntax/adapters/demo_parser/fixtures.rs' = '''
//! What the conformance holds the adapter to, which only tests and the `fixtures` feature use: the library's own walk of a tree and
//! its own reading of the items of a file.

pub(crate) mod oracle;
pub(crate) mod walk;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/outbound/syntax/adapters/demo_parser/fixtures.rs' = '''
//! What the conformance holds the adapter to, which only tests and the `fixtures` feature use: the library's own walk of a tree and
//! its own reading of the items of a file.

pub(crate) mod oracle;
pub(crate) mod walk;

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-outbound-syntax-adapters-library-fixtures#count', path = '.' },
]
