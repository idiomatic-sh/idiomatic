description = "A crate's `fixtures` feature is enabled only from `[dev-dependencies]`: never in a `[dependencies]` or `[build-dependencies]` entry's `features`, and never by a feature of the crate's own `[features]` (its own `fixtures` or `<dep>/fixtures`), except that the `fixtures` feature itself, and only it, may enable `<dep>/fixtures`."
why = "A domain's fakes and test values live in `fixtures.rs`, compiled for the crate's own tests and, through the `fixtures` feature, for other crates' tests. Enabled from a production dependency, or by any feature (which `default` or a production dependency could then enable), the fakes ship in the product; so no feature enables `fixtures`, not even an exported contract's `conformance`, and a test that runs another crate's exported contract enables both `conformance` and `fixtures` from `[dev-dependencies]`. `fixtures` is test-only with no exception. The crate's own `fixtures` feature, and only it, may enable `<dep>/fixtures`: its fixtures stand on the fakes of the ports they call, each from the hex that owns it, every feature has to compile alone (cargo-hack), and only `[dev-dependencies]` can enable `fixtures`, so `default` and every other feature still reach no fixtures."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let fixture-elements = select * from "sequence-element" where decoded = "fixtures";
let feature-lists = select * from "entry" where key = "features";
let listed = select r."owner" as "list", l."file" as "file", l."span" as "span" from fixture-elements as l join feature-lists as r on l."owner" = r."occurrence";
let dependency-tables = select r."owner" as "dependency", l."file" as "file", l."span" as "span" from listed as l join "mapping" as r on l."list" = r."id";
let dependency-entries = select r."key" as "name", l."file" as "file", r."owner" as "section", l."span" as "span" from dependency-tables as l join "entry" as r on l."dependency" = r."occurrence";
let section-tables = select r."owner" as "heading", l."name" as "name", l."file" as "file", l."span" as "span" from dependency-entries as l join "mapping" as r on l."section" = r."id";
let section-entries = select l."name" as "name", l."file" as "file", r."key" as "section", l."span" as "span" from section-tables as l join "entry" as r on l."heading" = r."occurrence";
let production-dependencies = select * from section-entries where glob_any(section, "{dependencies,build-dependencies}");
let from-dependencies = project(from=production-dependencies, columns=["file", "span", "name", "section"]);
let feature-elements = select * from "sequence-element" where glob_any(decoded, "{fixtures,*/fixtures}");
let feature-owners = select l."decoded" as "decoded", r."key" as "name", l."file" as "file", l."span" as "span", r."owner" as "table" from feature-elements as l join "entry" as r on l."owner" = r."occurrence";
let feature-tables = select l."decoded" as "decoded", r."owner" as "heading", l."name" as "name", l."file" as "file", l."span" as "span" from feature-owners as l join "mapping" as r on l."table" = r."id";
let feature-headings = select l."decoded" as "decoded", l."name" as "name", l."file" as "file", r."owner" as "root", r."key" as "section", l."span" as "span" from feature-tables as l join "entry" as r on l."heading" = r."occurrence";
let documents = select * from tree-nodes where kind = "toml";
let top-level-features = select l."decoded" as "decoded", l."name" as "name", l."file" as "file", l."section" as "section", l."span" as "span" from feature-headings as l join documents as r on l."root" = r."id";
let features-table = select * from top-level-features where section = "features";
let carrying-features = select * from features-table where name != "fixtures";
let from-features = project(from=carrying-features, columns=["file", "span", "name", "section"]);
let findings = union(left=from-dependencies, right=from-features);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`fixtures` is enabled from `[{section}]` `{name}`, which ships it outside tests"
help = "Remove `fixtures` from this entry's `features` and enable it only from `[dev-dependencies]`, as that dependency's `features = [\"fixtures\"]`; the crate's own `fixtures` feature, and no other feature, may enable `<dep>/fixtures`. Fixtures never ship, so an ignore is never the fix."

[given]
include = ['Cargo.toml']

[[scenarios]]
id = 'dev-dependency'
scenario = 'Fixtures enabled from dev-dependencies, inline and as a table, and a conformance feature that does not enable fixtures.'
given.files.'Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[features]
fixtures = []
conformance = []

[dev-dependencies]
demo-store = { path = "../store", features = ["fixtures"] }

[dev-dependencies.demo-cache]
path = "../cache"
features = ["fixtures"]
'''

[[scenarios]]
id = 'production-dependency'
scenario = 'A production dependency enables fixtures.'
given.files.'Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[dependencies]
demo-store = { path = "../store", features = ["fixtures"] }
'''
then.findings = [
  { path = 'Cargo.toml', line = 7 },
]

[[scenarios]]
id = 'build-dependency'
scenario = 'A build dependency enables fixtures.'
given.files.'Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[build-dependencies.demo-store]
path = "../store"
features = ["fixtures"]
'''
then.findings = [
  { path = 'Cargo.toml', line = 8 },
]

[[scenarios]]
id = 'target-dependency'
scenario = 'A target-specific production dependency enables fixtures.'
given.files.'Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[target.'cfg(unix)'.dependencies]
demo-store = { path = "../store", features = ["fixtures"] }
'''
then.findings = [
  { path = 'Cargo.toml', line = 7 },
]

[[scenarios]]
id = 'default-feature'
scenario = 'The default feature enables fixtures.'
given.files.'Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[features]
default = ["fixtures"]
fixtures = []
'''
then.findings = [
  { path = 'Cargo.toml', line = 7 },
]

[[scenarios]]
id = 'feature-forwards'
scenario = "A feature of the crate's own enables fixtures, which default then carries."
given.files.'Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[features]
default = ["conformance"]
conformance = ["fixtures"]
fixtures = []
'''
then.findings = [
  { path = 'Cargo.toml', line = 8 },
]

[[scenarios]]
id = 'feature-enables-dependency'
scenario = "A feature of the crate enables a dependency's fixtures."
given.files.'Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[features]
fixtures = []
support = ["demo-store/fixtures"]

[dependencies]
demo-store = { path = "../store" }
'''
then.findings = [
  { path = 'Cargo.toml', line = 8 },
]

[[scenarios]]
id = 'fixtures-enables-dependency'
scenario = "The crate's own fixtures feature enables its dependencies' fixtures."
given.files.'Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[features]
fixtures = ["demo-store/fixtures", "dep:demo-cache", "demo-cache/fixtures"]
conformance = []

[dependencies]
demo-store = { path = "../store" }
demo-cache = { path = "../cache", optional = true }

[dev-dependencies]
demo-app = { path = ".", features = ["fixtures"] }
'''
