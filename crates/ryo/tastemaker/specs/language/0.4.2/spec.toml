/// The demo language, composed over its syntax port: what an edge links to read it.
#[must_use]
pub fn linked() -> ryo::languages::Language {
    use std::sync::Arc;

    use crate::inbound::contracts::parse::contract::ParseContract;
    use crate::inbound::contracts::project::contract::ProjectContract;
    use crate::outbound::syntax::factory::demo;

    ryo::link!(
        stringify!(demo),
        parse: Arc::new(ParseContract::new(Arc::new(demo()))),
        project: Arc::new(ProjectContract::new()),
    )
}

#[cfg(any(test, feature = "fixtures"))]
pub mod fixtures;
