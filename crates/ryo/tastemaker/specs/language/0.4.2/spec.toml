description = "A language: the crate that fulfils ryo's concepts for one language, applied beside its `crate` and `nu-hex` entries. It names what a language must have and holds each part to it: its two contracts, `parse` and `project` (the only place its answers live), its one file of kinds, a syntax adapter for each parser library, an adapter for each manifest tool of its manifest reading port and for each host framework of its embedded port (where it has them), its fixtures, and the two tests every language runs."
why = "Ryo owns the concepts, the language fulfils them. The compiler holds that `Parse` and `Project` answer every relation of the catalog; the conformance holds each answer to the language's fixtures; this spec holds the rest, so that a language added by the directory is complete or says what it lacks: no part is optional, none is left for an author to remember, and no list of languages, of parsers or of rules is kept anywhere else. Shared-engine changes must pass every established language's declared correctness, allocation, and performance gates. Discover language benchmarks from their declarations; absent, skipped, incomplete, or failed evidence is not a pass. Preserve pinned workloads, settings, source and executable identities and enforce each supported CPU, wall, and memory bound independently, including cold, retained-cache warm, and edit conditions where established. A gain in one language or metric cannot offset a regression in another; existing thresholds must not be weakened to admit an engine change."
closed = false
specs = [
  { alias = "benchmark", spec = "idiomatic.ryo/benchmark@0.2.1", include = ["benchmarks"], count = { min = 1 }, params = { lang = { param = "lang" } }, description = "Comparative lint benchmarks, when this language has begun its rollout; the shared harness audits completeness." },
  { alias = "parse-contract", spec = "idiomatic.ryo/contract@0.3.0", include = ["src/inbound/contracts/parse"], params = { trait = "ryo::languages::Parse" }, description = "The parse contract: the language's implementation of `ryo::languages::Parse`, which answers every syntax relation of the catalog." },
  { alias = "project-contract", spec = "idiomatic.ryo/contract@0.3.0", include = ["src/inbound/contracts/project"], params = { trait = "ryo::languages::Project" }, description = "The project contract: the language's implementation of `ryo::languages::Project`, which answers every manifest relation of the catalog." },
]
