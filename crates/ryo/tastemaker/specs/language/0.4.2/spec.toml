  { rule = "error-shape", include = ["**"], description = "Every error type of the crate is a `thiserror` derive, never a hand-written `Error` or `Display` impl. (Held over the language's crate parts.)" },
  { rule = "fixtures-feature", include = ["Cargo.toml"], description = "The crate's `fixtures` feature is switched on only from `[dev-dependencies]`, so its fakes never ship. (Held over the language's crate parts.)" },
  { rule = "idiomatic.ryo/language-parts@0.1.0", include = ["Cargo.toml", "tastemaker.toml", "src/**", "benchmarks/provider/bench.rs", "tests/fixtures/relations/**", "tests/fixtures/manifests/**", "tests/fixtures/allocation/**"], description = "What a placement cannot say of a language, held over its tree: no directory of kinds, the manifest reading adapter and its cases when it has manifest items, the sample files its allocation test reads, and the `model` concept when its file model is not `()`." },
  { rule = "idiomatic.ryo/extras-iff-variant@0.1.0", include = ["src/domain/syntax/types.rs", "src/domain/extras/**"], description = "A language has the concept `extras` exactly when its kind enum has an `Extra` variant." },
  { rule = "idiomatic.ryo/readers-in-items@0.2.0", include = ["src/**/*.rs"], exclude = ["**/fixtures/**", "**/*_test.rs"], params = { homes = ["**/src/domain/{relations,manifests,links}/collections/*/*/item.rs", "**/src/inbound/contracts/parse/readers/*/composition.rs"] }, description = "A reader is an item in `domain/{relations,manifests,links}/collections/<collection>/<name>/item.rs` or the composition of a parse reader concept, `inbound/contracts/parse/readers/<concept>/composition.rs`, the two answers to where it lives, and nowhere else." },
  { rule = "idiomatic.ryo/language-depends-on-ryo-only@0.2.0", include = ["Cargo.toml"], description = "A language depends on the SDK, `ryo`, and on no other crate of ryo: the engine's macros and types are the engine's, so that a relation added to the catalog is a compile error in every language until it answers it." },
  { rule = "idiomatic.ryo/language-test-entries@0.1.0", include = ["Cargo.toml"], description = "A language's manifest declares its closed tests, `conformance` and `allocation`, as targets without the libtest harness: a file Cargo never builds proves nothing." },
  { rule = "idiomatic.arch/io-at-boundary@0.1.0", include = ["src/**"], exclude = ["**/outbound/*/adapters/**", "**/tests/**", "**/*_test.rs"], description = "A language reaches the file system, the network, the environment and processes only in the adapters of its outbound ports; the domain reads what it is given." },
]

