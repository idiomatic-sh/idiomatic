//! The library's own tree of a file, in the language's kinds: what the shape rail of the conformance holds our tree to. It parses the
//! text with the library and gathers each node and token the library gives, at its own range; it reads nothing of the adapter, its
//! schemas or the element table, so a tree the adapter writes wrongly is a difference and not the same mistake twice.

use ryo::languages::Offset;
use ryo::languages::contract::{Leafness, Walked};

use crate::domain::nodes::types::Node;
use crate::domain::syntax::service::kind_bits;
use crate::domain::syntax::types::Kind;
use crate::domain::tokens::types::Token;

/// The library's tree of `text`: parsed by the library, each node and token gathered with its range.
#[must_use]
pub(crate) fn walked(text: &str) -> Walked {
    // A scaffold: replace this with the parse by the library and the gathering of its nodes and tokens.
    let length = Offset(u32::try_from(text.len()).unwrap_or(u32::MAX));
    let text_token = Walked {
        kind: kind_bits(Kind::Token(Token::Text)),
        leaf: Leafness::Token,
        start: Offset(0),
        end: length,
        children: Vec::new(),
    };
    Walked {
        kind: kind_bits(Kind::Node(Node::SourceFile)),
        leaf: Leafness::Node,
        start: Offset(0),
        end: length,
        children: if text.is_empty() {
            Vec::new()
        } else {
            vec![text_token]
        },
    }
