//! demo's workloads and the growth of its parse.

/// The size of the generated input the growth check starts from.
const SIZE: usize = 1_000;

/// The growth of the time for four times the input beyond which the parse is not linear enough: four is linear, sixteen is quadratic.
const GROWTH_LIMIT: u32 = 5;

/// The argument `cargo bench` passes to a bench and `cargo test` does not: the growth check times the reading, so only the timing run makes it.
const BENCH_FLAG: &str = "--bench";

fn main() {
    if std::env::args().any(|argument| argument == BENCH_FLAG) {
        complexity();
    }
    divan::Divan::default()
        .max_time(std::time::Duration::from_secs(10))
        .config_with_args()
        .main();
}

#[divan::bench]
fn workload(bencher: divan::Bencher) {
    let source = generated(SIZE);
    bencher.bench_local(|| read(&source));
}

/// Reads input of `SIZE` and of four times `SIZE` and fails when the larger takes more than `GROWTH_LIMIT` times the smaller.
fn complexity() {
    let small = timed(&generated(SIZE));
    let large = timed(&generated(4 * SIZE));
    assert!(
        large < small * GROWTH_LIMIT,
        "reading four times the input took {large:?} against {small:?}: the parse grows faster than linearly"
    );
}

fn timed(source: &str) -> std::time::Duration {
    let started = std::time::Instant::now();
    read(source);
    started.elapsed()
}

fn generated(size: usize) -> String {
    "a = 1\n".repeat(size)
}

fn read(source: &str) -> usize {
    source.len()
}
'''
given.files.'demo/src/fixtures/kinds.rs' = '''
//! How each kind of the language's trees is shown: the source whose tree holds it, or the reason no relation reads it.

use ryo::languages::contract::KindSample;
use ryo::languages::{KindName, Sample, SampleText, Why};

use crate::domain::extras::types::Extra;
use crate::domain::nodes::types::Node;
use crate::domain::syntax::constants::UNREAD_TEXT;
use crate::domain::syntax::service::{kind_bits, kinds};
use crate::domain::syntax::types::Kind;
use crate::domain::tokens::types::Token;

/// Every kind, in the order of their numbers, with how the language shows it.
pub(super) fn shown() -> Vec<KindSample> {
    kinds()
        .map(|kind| KindSample {
            kind: KindName(format!("{kind:?}").into()),
            bits: kind_bits(kind),
            sample: sample(kind),
        })
        .collect()
}

/// How the language shows a kind of its trees: the source whose tree holds it, for a kind a relation reads, and for every other the
/// reason no relation models it. The match has no wildcard arm, so a kind the
/// grammar gains is a compile error until it is shown.
#[must_use]
pub(crate) const fn sample(kind: Kind) -> Sample {
    match kind {
        Kind::Node(Node::SourceFile) => Sample::Node(SampleText("")),
        Kind::Token(Token::Text) => Sample::Token(SampleText("a")),
        Kind::Extra(Extra::Error) => Sample::Unread(Why(UNREAD_TEXT)),
    }
}
'''
