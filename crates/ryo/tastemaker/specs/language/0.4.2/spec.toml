given.files.'demo/src/outbound/syntax/adapters/demo_parser/adapter.rs' = '''
//! The syntax port, implemented with `demo_parser`: the library's reading of a file is written straight into the element table. The
//! file is the root node and the text the library read is its token; bytes past the last valid UTF-8 are text it could not read, and
//! the library's names stop in the schemas: what leaves is the language's own `Kind`.

use ryo::languages::{self, Count, Offset};

use crate::domain::extras::types::Extra;
use crate::domain::syntax::service::kind_bits;
use crate::domain::syntax::types::Kind;
use crate::outbound::syntax::interface::SyntaxPort;
use crate::outbound::syntax::types::SourceText;

use super::constants::NOT_UTF8;
use super::schemas::piece_kind;
use super::types::Piece;

/// The `demo_parser` syntax adapter.
#[derive(Debug)]
pub struct SyntaxDemoParserAdapter;


/// The offset of a byte index of the text.
fn offset(index: Count) -> Offset {
    Offset(u32::try_from(index.0).unwrap_or(u32::MAX))
}


impl SyntaxPort for SyntaxDemoParserAdapter {
    fn read(&self, bytes: SourceText<'_>, builder: &mut languages::TableBuilder<'_>) {
        let readable = match std::str::from_utf8(bytes.0) {
            Ok(text) => text.len(),
            Err(error) => error.valid_up_to(),
        };
        let (valid, length) = (offset(Count(readable)), offset(Count(bytes.0.len())));
        languages::enter_node(builder, kind_bits(piece_kind(Piece::File)), Offset(0));
        if valid > Offset(0) {
            languages::token(builder, kind_bits(piece_kind(Piece::Text)), Offset(0), valid);
        }
        if valid < length {
            languages::token(
                builder,
                kind_bits(Kind::Extra(Extra::Error)),
                valid,
                length,
            );
            languages::diagnose(builder, languages::ReportText(NOT_UTF8), valid, length);
        }
        languages::leave_node(builder, length);
    }
}
'''
