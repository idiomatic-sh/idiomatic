rules = [
  { rule = "idiomatic.arch/adapter-writer-layering@0.1.0", include = ["src/outbound/syntax/adapters/*/*.rs"], description = "The parser adapter orchestrates its writer; schemas and data never call the traversal back." },
  { rule = "idiomatic.arch/schema-visibility@0.1.0", include = ["src/outbound/syntax/adapters/*/writer.rs"], description = "Serialization entry points remain inside the owning adapter." },
  { rule = "idiomatic.ryo/benchmark-outside-runtime@0.1.0", include = ["src/**"], description = "The benchmark is allowed only in the development edge, never provider source." },
  { rule = "idiomatic.ryo/benchmark-targets@0.1.0", include = ["Cargo.toml", "benches/**", "benchmarks/provider/bench.rs", "benchmarks/linters/*/bench.rs", "benchmarks/linters/*/tests.rs"], description = "Provider and linter benchmark executables are distinct named Cargo targets; the former benches/performance.rs cannot coexist." },
  { rule = "bench-registers-workloads", include = ["benchmarks/provider/bench.rs"], description = "A language's bench, which exists exactly when it has a workload, registers at least one workload, a function with `#[divan::bench]`." },
  { rule = "bench-checks-growth", include = ["benchmarks/provider/bench.rs"], description = "A language's bench, which exists exactly when it has a workload, checks the growth of the parse: a function `complexity` against a `GROWTH_LIMIT`, called only under `BENCH_FLAG`." },
  { rule = "domain-modules", include = ["src/domain.rs"], description = "The list of domain concepts only declares modules and holds no rule." },
  { rule = "idiomatic.arch/validation-at-edges@0.1.0", include = ["src/*.rs", "src/inbound/*.rs", "src/inbound/use_cases/*.rs", "src/inbound/contracts/*.rs", "src/domain/*.rs", "src/outbound/*.rs"], exclude = ["**/schemas.rs", "**/*_test.rs"], description = "Nothing in the core's namespace files validates: a `TryFrom`, an `impl FromStr` or a fallible constructor stands only in a schemas.rs." },
  { rule = "idiomatic.arch/no-runtime-fixtures@0.1.0", include = ["src/*.rs", "src/inbound/*.rs", "src/inbound/use_cases/*.rs", "src/inbound/contracts/*.rs", "src/domain/*.rs", "src/outbound/*.rs"], exclude = ["**/*_test.rs", "src/fixtures.rs"], description = "Nothing in the core's namespace files but its tests and its fixtures reads a `fixtures` module." },
  { rule = "idiomatic.arch/hollow-artifacts@0.1.0", include = ["src/*.rs", "src/inbound/*.rs", "src/inbound/use_cases/*.rs", "src/inbound/contracts/*.rs", "src/domain/*.rs", "src/outbound/*.rs"], description = "No namespace file of the core is only comments and imports, and no type in it is an empty placeholder." },
  { rule = "service-has-fn", include = ["src/domain/*/service.rs"], description = "A service declares at least one free function: a concept that declares none has no service.rs. (Held over the language's concept parts.)" },
  { rule = "fns-only-in-service", include = ["src/domain/*/types.rs", "src/domain/*/errors.rs"], description = "A concept declares its functions in service.rs, so one that declares a function has a service and its test. (Held over the language's concept parts.)" },
  { rule = "service-shape", include = ["src/domain/*/service.rs"], description = "A concept's service is free functions only: no struct, enum, union, trait or impl. (Held over the language's concept parts.)" },
  { rule = "idiomatic.arch/constants-once@0.2.0", include = ["src/**/*.rs"], exclude = ["**/*_test.rs", "**/fixtures/**", "**/fixtures.rs"], description = "A string constant is declared in one file of the language: the same name holding the same string in two of its files is one concept written twice. (Held over each language's own source.)" },
  { rule = "idiomatic.arch/no-serde-in-domain@0.1.0", include = ["src/**/*.rs"], exclude = ["**/*_test.rs", "**/fixtures/**", "**/fixtures.rs"], description = "Serde is used only in an outbound adapter's schemas: a language's domain and ports encode nothing." },
