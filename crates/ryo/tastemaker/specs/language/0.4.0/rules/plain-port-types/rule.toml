description = "A port's `types.rs` holds plain data: every struct and enum derives `Clone`, `Debug` and `PartialEq` (a type with a lifetime parameter, a borrowed view, is exempt from `Clone`), and none names `File`, a sync type (`Mutex`, `RwLock`, an atomic, `OnceLock`, `LazyLock`, `Condvar`, `Barrier`; `Arc<Mutex<..>>` included) or `dyn`."
why = "A port speaks plain data across the boundary: a value a caller can copy, print and compare, so a fake, a contract row and a test can build and check it without the adapter behind it. A file, a lock, an atomic or a `dyn` handle in a port's types is an adapter's working state leaked into the port's vocabulary: the adapter owns it and an object the port hands out is a trait declared in its interface.rs, which is also where a handle lives. A client library of the outside (an infrastructure crate) is named in a port's types.rs by no path: that half is `client-at-adapter`'s, whose placement leaves a port's types.rs and errors.rs inside its reach, so the concept is stated once. Read as written: the derives named in the item's own attributes (`derive(Clone, Debug, PartialEq)`; a `core::clone::Clone` path counts by its last word), and the words `File`, `Mutex`, `RwLock`, `Atomic*`, `OnceLock`, `LazyLock`, `Condvar`, `Barrier` and `dyn` anywhere in the file. Not seen: a derive written by a macro or a `cfg_attr`, and a manual `impl Clone` (a port's types derive)."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let items = select * from tree-nodes where glob_any(kind, "{struct,enum}");
let item-rows = project(from=items, columns=["id", "file", "span"]);
let attrs = select * from tree-nodes where kind = "attr";
let item-attr-edges = select l."id" as "item", r."child" as "child" from item-rows as l join "syntax-child" as r on l."id" = r."parent";
let item-attrs = select r."id" as "id", l."item" as "item" from item-attr-edges as l join attrs as r on l."child" = r."id";
let attr-parts = axis(from=item-attrs, relation="syntax-child", direction=descendant, domain=tree-nodes);
let attr-part-rows = project(from=attr-parts, columns=["item", "related"]);
let token-edges = select l."parent" as "parent", l."file" as "file", r."span" as "span", r."text" as "text" from "syntax-child" as l join tree-tokens as r on l."child" = r."id";
let attr-words = select l."item" as "id", r."text" as "derive" from attr-part-rows as l join token-edges as r on l."related" = r."parent";
let lifetime-params = select * from tree-nodes where kind = "lifetime-param";
let item-lifetimes = axis(from=item-rows, relation="syntax-child", direction=descendant, domain=lifetime-params);
let views = select l."id" as "id" from item-lifetimes as l join lifetime-params as r on l."related" = r."id";
let clone-owners = antijoin(left=item-rows, right=views, left-on=["id"], right-on=["id"]);
let clone-needs = extend(from=clone-owners, values={"derive": "Clone"});
let debug-needs = extend(from=item-rows, values={"derive": "Debug"});
let eq-needs = extend(from=item-rows, values={"derive": "PartialEq"});
let needs-two = union(left=clone-needs, right=debug-needs);
let needs = union(left=needs-two, right=eq-needs);
let missing = antijoin(left=needs, right=attr-words, left-on=["id", "derive"], right-on=["id", "derive"]);
let missing-clone = select * from missing where derive = "Clone";
let missing-debug = select * from missing where derive = "Debug";
let missing-eq = select * from missing where derive = "PartialEq";
let clone-rows = project(from=missing-clone, columns=["file", "span"]);
let clone-found = extend(from=clone-rows, values={"problem": "does not derive `Clone` (only a type with a lifetime parameter, a borrowed view, is exempt): a port's types are plain data a caller can copy"});
let debug-rows = project(from=missing-debug, columns=["file", "span"]);
let debug-found = extend(from=debug-rows, values={"problem": "does not derive `Debug`: a port's types are plain data a caller can print"});
let eq-rows = project(from=missing-eq, columns=["file", "span"]);
let eq-found = extend(from=eq-rows, values={"problem": "does not derive `PartialEq`: a port's types are plain data a contract row can compare"});
let derive-found-a = union(left=clone-found, right=debug-found);
let derive-found = union(left=derive-found-a, right=eq-found);
let file-words = select * from token-edges where text = "File";
let file-rows = project(from=file-words, columns=["file", "span"]);
let file-found = extend(from=file-rows, values={"problem": "names `File`: an open file is an adapter's working state; it lives in the adapter that opened it, never in a port's plain types"});
let sync-words = select * from token-edges where glob_any(text, "{Mutex,RwLock,Atomic*,OnceLock,LazyLock,Condvar,Barrier}");
let sync-rows = project(from=sync-words, columns=["file", "span"]);
let sync-found = extend(from=sync-rows, values={"problem": "names a sync type (a lock, an atomic or a once cell, alone or inside an `Arc`): shared mutable state is an adapter's working state; it lives in the adapter, never in a port's plain types"});
let dyn-words = select * from token-edges where text = "dyn";
let dyn-rows = project(from=dyn-words, columns=["file", "span"]);
let dyn-found = extend(from=dyn-rows, values={"problem": "names `dyn`: a handle is a trait the port's interface.rs declares and a method returns; it is not part of the port's plain types"});
let word-found-a = union(left=file-found, right=sync-found);
let word-found = union(left=word-found-a, right=dyn-found);
let findings = union(left=derive-found, right=word-found);
emit findings subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "this type {problem}"
help = "Make the port's types plain data: derive `Clone`, `Debug` and `PartialEq` on every struct and enum (a view with a lifetime parameter derives `Debug` and `PartialEq` only), and move a file, a lock, an atomic or a `dyn` handle out of types.rs: the adapter owns its working state, and an object the port hands back is a trait declared in interface.rs that a method returns. An ignore is never the fix."

[given]
include = ['src/outbound/*/types.rs']

[[scenarios]]
id = 'plain-data-deriving-clone-debug-partialeq-passes'
scenario = 'Plain data deriving Clone, Debug and PartialEq passes.'
given.files.'src/outbound/store/types.rs' = '''
//! The types of the `store` port.

#[derive(Clone, Debug, PartialEq)]
pub struct Row {
    pub id: u32,
}

#[derive(Clone, Debug, PartialEq)]
pub enum Kind {
    Small,
    Large,
}
'''

