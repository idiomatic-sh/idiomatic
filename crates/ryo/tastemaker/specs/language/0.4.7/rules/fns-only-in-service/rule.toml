description = "A concept's `types.rs` and `errors.rs` declare no free function."
why = "A concept holds its verbs in one service.rs and its data in types.rs, errors.rs and constants.rs; a concept that declares no function has no service.rs and no service_test.rs, and one that declares a function has both. The trigger is mechanical: where a function is written, at the top of the file or in a module the file declares inline (a `mod` holding a serde `with` pair is functions too); a method in an `impl` or a trait is not a free function."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let files = select * from tree-nodes where glob_any(kind, "{source-file,item-list}");
let kids = select l."id" as "id", r."child" as "child" from files as l join "syntax-child" as r on l."id" = r."parent";
let fns = select * from tree-nodes where kind = "fn";
let found = select r."file" as "file", r."span" as "span" from kids as l join fns as r on l."child" = r."id";
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this function is declared outside the concept's service"
help = "A concept that declares a function has a service.rs and a service_test.rs: write the function in service.rs and prove it in service_test.rs."

[given]
include = ['**/types.rs', '**/errors.rs']

[[scenarios]]
id = 'data-only'
scenario = 'Data files declare no function.'
given.files.'src/types.rs' = '''
#[derive(Debug)]
pub struct Point {
    pub x: u8,
}
'''

[[scenarios]]
id = 'fn-in-types'
scenario = 'A function in types.rs.'
given.files.'src/types.rs' = '''
pub struct Point {
    pub x: u8,
}

pub fn origin() -> Point {
    Point { x: 0 }
}
'''
then.findings = [
  { path = 'src/types.rs', line = 5 },
]

[[scenarios]]
id = 'fn-in-inline-module'
scenario = 'A function in a module types.rs declares inline, as a serde `with` module.'
given.files.'src/types.rs' = '''
pub struct Point {
    pub x: u8,
}

mod chained {
    pub(super) fn serialize(point: &super::Point) -> u8 {
        point.x
    }
}

impl Point {
    pub fn x(&self) -> u8 {
        self.x
    }
}
'''
then.findings = [
  { path = 'src/types.rs', line = 6 },
]
