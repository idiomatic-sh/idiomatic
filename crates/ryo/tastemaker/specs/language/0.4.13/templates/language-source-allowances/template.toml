description = "The language's source import allowance, `src/tastemaker.toml`: the crates its own placement declares, written as the literal list its source is held to."
why = "Every language's source scope needs its import allowance, `src/tastemaker.toml` (the product places `provider-imports` on `src`, which denies by default), and a scaffold writes only the files the entry it scaffolds places. The file was placed by the language's own `tastemaker.toml` (`provider-allowances`), which `tm scaffold language` writes but does not read, so a fresh language was a `provider-allowances#count` finding before its author wrote a line (ryo-hce3). A file is placed by one template entry, so the language spec places it here, alone. It renders the library the syntax adapter is named for; a language that reads with more crates lists them after it, and `source-import-allowlist`, in the language's own placement, refuses any entry its `libraries` and `domain-libraries` do not declare."
content = '''
{%- set library = captures.library | default(["library"]) | first -%}
imports-allow = ["{{ library }}::*"]
'''

[given]
file = 'own.toml'

[[scenarios]]
id = 'source-allowance-written'
scenario = 'The scaffolded language allows its source the library its own placement declares.'
given.files.'own.toml' = '''
imports-allow = ["library::*"]
'''

[[scenarios]]
id = 'source-allowance-missing'
scenario = 'The source allowance is missing.'
then.findings = [
  { rule = 'language-source-allowances#count', path = '.' },
]

[[scenarios]]
id = 'source-allowance-holds-more-crates'
scenario = 'A language that reads with more crates lists them after the library it was scaffolded with.'
given.files.'own.toml' = '''
imports-allow = ["library::*", "library_lexer::*", "indexmap::*"]
'''

[[scenarios]]
id = 'source-allowance-without-its-library'
scenario = 'A source allowance that lists other crates but not the library is not the scaffolded allowance.'
given.files.'own.toml' = '''
imports-allow = ["indexmap::*"]
'''
then.findings = [
  { rule = 'language-source-allowances#template', path = 'own.toml' },
]
