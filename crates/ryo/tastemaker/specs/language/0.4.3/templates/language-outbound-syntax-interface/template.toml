description = "A file of the syntax port, which the parser library implements: `src/outbound/syntax/interface.rs`."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! What the `syntax` port asks of the outside: {{ lang }} text in, the element table of its syntax tree
//! out.

use super::types::SourceText;
use ryo::languages::TableBuilder;

/// What every `syntax` adapter implements.
pub(crate) trait SyntaxPort: Send + Sync {
    /// Reads {{ lang }} text into the table `builder` builds, a pre-order table of its nodes and tokens, each token's text interned. A file
    /// with errors still gives the elements that could be read, and what the library said of the rest: reading never fails.
    fn read(&self, text: SourceText<'_>, builder: &mut TableBuilder<'_>);
}
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'src/outbound/syntax/interface.rs'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/outbound/syntax/interface.rs' = '''
