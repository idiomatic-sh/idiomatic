description = "A `settings.rs` declares exactly one `struct`, named `<Port><Dir>Settings`."
why = "An adapter's configuration is one struct named for its port, its implementation and its role: `NamesMemorySettings` for the `memory` adapter of the `names` port, so the settings an edge passes to a factory are found by name. RyoQL cannot compare a PascalCase name with a snake_case directory, so the stem of the name is pinned by the part spec's templates, which write the declaration named from the directory; this rule gives that declaration its role and its suffix. Read as written: in each file the entry selects, the `struct` items at the top level of the file; a struct generated by a macro is not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let top-items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from top-edges as l join tree-nodes as r on l."child" = r."id";
let structs = select * from top-items where kind = "struct";
let s-name-nodes-all = select * from tree-nodes where kind = "name";
let s-kids = select l."id" as "id", r."child" as "child" from structs as l join "syntax-child" as r on l."id" = r."parent";
let s-name-nodes = select l."id" as "id", r."id" as "name-node" from s-kids as l join s-name-nodes-all as r on l."child" = r."id";
let s-name-tokens = select l."id" as "id", r."child" as "token" from s-name-nodes as l join "syntax-child" as r on l."name-node" = r."parent";
let s-name-texts = select l."id" as "id", r."text" as "name" from s-name-tokens as l join tree-tokens as r on l."token" = r."id";
let struct-rows = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."name" as "name" from structs as l join s-name-texts as r on l."id" = r."id";
let struct-paths = project(from=structs, columns=["file"]);
let absent = antijoin(left=source-files, right=struct-paths, left-on=["file"], right-on=["file"]);
let absent-rows = project(from=absent, columns=["file", "span"]);
let absent-findings = extend(from=absent-rows, values={"name": "settings.rs", "problem": "declares no `struct`: the file holds the one struct of its role"});
let counts = group-count(from=structs, keys=["file"], count="n", distinct="id");
let plural = select * from counts where n > 1;
let plural-rows = select l."file" as "file", l."span" as "span", l."name" as "name" from struct-rows as l join plural as r on l."file" = r."file";
let plural-findings = extend(from=plural-rows, values={"problem": "is one of several structs in this file, which holds exactly one"});
let well-named = select * from struct-rows where glob_any(name, "*Settings");
let misnamed = antijoin(left=struct-rows, right=well-named, left-on=["id"], right-on=["id"]);
let misnamed-rows = project(from=misnamed, columns=["file", "span", "name"]);
let misnamed-findings = extend(from=misnamed-rows, values={"problem": "is not named `<Name>Settings`"});
let all-1 = union(left=absent-findings, right=plural-findings);
let all-2 = union(left=all-1, right=misnamed-findings);
emit all-2 subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "`{name}` {problem}"
help = "Keep exactly one `struct <Port><Dir>Settings` in `settings.rs` (the port, the adapter's directory in PascalCase, then `Settings`): rename a struct that ends otherwise, and move a second struct to the adapter's `types.rs`. An ignore is not legitimate here: an adapter has one settings type."

[given]
include = ['**/settings.rs']

[[scenarios]]
id = 'one-struct-named-port-adapter-role'
scenario = 'The one struct named for its port, adapter and role.'
given.files.'src/names/adapters/memory/settings.rs' = '''
//! What the `memory` names adapter is configured with.

/// The `memory` names adapter's settings.
#[derive(Debug)]
pub struct NamesMemorySettings {
    /// The most names it keeps.
    pub capacity: usize,
}
'''

[[scenarios]]
id = 'no-struct'
scenario = 'A file with no struct.'
given.files.'src/names/adapters/memory/settings.rs' = '''
//! Settings.
'''
then.findings = [
  { path = 'src/names/adapters/memory/settings.rs', line = 1 },
]

[[scenarios]]
id = 'enum-only'
scenario = 'An enum is not the settings struct.'
given.files.'src/names/adapters/memory/settings.rs' = '''
//! Settings.

pub enum NamesMemorySettings {
    Small,
}
'''
then.findings = [
  { path = 'src/names/adapters/memory/settings.rs', line = 3 },
]

[[scenarios]]
id = 'two-structs'
scenario = 'Two structs in one file.'
given.files.'src/names/adapters/memory/settings.rs' = '''
//! What the `memory` names adapter is configured with.

/// The `memory` names adapter's settings.
#[derive(Debug)]
pub struct NamesMemorySettings {
    /// The most names it keeps.
    pub capacity: usize,
}

/// More.
pub struct NamesMemoryLimits;
'''
then.findings = [
  { path = 'src/names/adapters/memory/settings.rs', line = 4 },
  { path = 'src/names/adapters/memory/settings.rs', line = 11 },
  { path = 'src/names/adapters/memory/settings.rs', line = 11 },
]

[[scenarios]]
id = 'struct-named-settings'
scenario = 'A struct not named for settings.'
given.files.'src/names/adapters/memory/settings.rs' = '''
//! What the `memory` names adapter is configured with.

/// The `memory` names adapter's settings.
#[derive(Debug)]
pub struct NamesMemoryConfig {
    /// The most names it keeps.
    pub capacity: usize,
}
'''
then.findings = [
  { path = 'src/names/adapters/memory/settings.rs', line = 4 },
]
