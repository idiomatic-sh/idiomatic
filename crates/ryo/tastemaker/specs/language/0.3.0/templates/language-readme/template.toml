description = "The crate's README: its name, what it is for, how a program links it, one runnable example and a line for each of its domains."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
# idiomatic-sh-ryo-{{ lang }}

The {{ lang }} language of ryo: it reads `.{{ ext | default(lang) }}` files into syntax trees and the relations of ryo's catalog.

## Usage

Link the language with `ryo_{{ lang }}::linked()` and hand the result to the SDK's calls.

```rust
let language = ryo_{{ lang }}::linked();
assert_eq!(&*language.name().0, "{{ lang }}");
```

## Domains

### extras

The {{ lang }} domain's `extras` concept: the kinds of its trees that its standard has no name for.

### language

The {{ lang }} domain's `language` concept.

### nodes

The {{ lang }} domain's `nodes` concept: the nodes of its trees, named as its standard names them.

### relations

The {{ lang }} domain's `relations` concept: one reader for each relation the language reads.

### syntax

The {{ lang }} domain's `syntax` concept.

### tokens

The {{ lang }} domain's `tokens` concept: the tokens of its trees, named as its standard names them.

## Differences from the standard

Where the {{ lang }} language's trees and answers differ from the standard that defines it, and why; or that there is none.
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'README.md'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
