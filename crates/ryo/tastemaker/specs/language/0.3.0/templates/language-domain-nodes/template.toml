description = "The module file of the `nodes` concept: the nodes of the language's trees, named as its standard names them: it declares the files beside it."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
//! The {{ lang }} domain's `nodes` concept: the nodes of its trees, named as its standard names them.

{% if scaffold | default(false) %}
pub(crate) mod constants;
{% endif %}
pub(crate) mod service;
pub(crate) mod types;

#[cfg(test)]
mod service_test;
'''

[params]
lang = { type = "identifier", from = "directory-name", description = "The language, its directory's name." }

[given]
file = 'src/domain/nodes.rs'
params = { lang = 'demo' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/domain/nodes.rs' = '''
//! The demo domain's `nodes` concept: the nodes of its trees, named as its standard names them.

pub(crate) mod service;
pub(crate) mod types;

#[cfg(test)]
mod service_test;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/domain/nodes.rs' = '''
//! The demo domain's `nodes` concept: the nodes of its trees, named as its standard names them.

pub(crate) mod service;
pub(crate) mod types;

#[cfg(test)]
mod service_test;

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'language-domain-nodes#count', path = '.' },
]
