description = "The contracts of the language over its own ports, for the tests and benches outside the crate."
why = "The language is complete or says what it lacks: this file is placed at count 1 for every language, so a language added by its directory has it from the first scaffold, in the shape every other language has, and a language that lacks it is a finding at the language. The template asks for the declarations the file makes; the bodies and the language's words are the author's."
content = '''
{%- set library = captures.library | default(["library"]) | first -%}
//! The contracts of the language over its own ports, for the tests and benches outside the crate.

use std::sync::Arc;

use ryo::languages;

use crate::inbound::contracts::parse::contract::ParseContract;
use crate::outbound::syntax::factory::{{ library }};

/// The `parse` contract, over the language's syntax port.
#[must_use]
pub fn parse() -> impl languages::Parse {
    ParseContract::new(Arc::new({{ library }}()))
}
'''

[given]
file = 'src/fixtures/contracts.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/fixtures/contracts.rs' = '''
