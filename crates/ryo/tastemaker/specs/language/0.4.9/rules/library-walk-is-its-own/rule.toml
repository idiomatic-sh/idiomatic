description = "A syntax adapter's `fixtures/walk.rs` and `fixtures/oracle.rs` name nothing of the adapter, its schemas or the element table: no path to the adapter or to `schemas`, no `Elements`, `Symbols`, `table_builder` or `TableBuilder`."
why = "The walk is the library's own tree and the oracle the library's own reading, and the conformance holds our tree and our rows to them. A walk that reads the table the adapter wrote, or maps the library's kinds through the adapter's schemas, is the adapter compared with itself: a node the adapter places wrongly is placed the same way by the walk and nothing differs. So these two files reach the library, the kernel's `Walked` and `OracleRows`, and the language's domain, and never the adapter's own parts. The evidence is a written path or an import naming `adapter`, `schemas`, `Elements`, `Symbols`, `table_builder` or `TableBuilder`, whether written out or by an imported name. Not seen: a path inside an attribute or a macro invocation."

query = '''
let imports = project(from="static-import", columns=["file", "span", "target"]);
let references = project(from="reference", columns=["file", "span", "target"]);
let mentions = union(left=imports, right=references);
let own = select * from mentions where glob_any(target, "{*::adapter,*::adapter::*,adapter::*,*::schemas,*::schemas::*,schemas::*,Elements,Symbols,TableBuilder,table_builder,*::Elements,*::Symbols,*::TableBuilder,*::table_builder}");
emit own subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this walk or oracle names `{target}`, a part of the adapter's own"
help = "Read the library's own tree: parse the text with the library and gather its nodes and tokens into `ryo::languages::contract::Walked`, naming the language's kinds through the domain's `kind_bits`, and write the oracle from the library's own reading. Take nothing from `adapter`, `schemas`, `Elements`, `Symbols`, `table_builder` or `TableBuilder`. An ignore is never the fix."

[given]
include = ['walk.rs']

[[scenarios]]
id = 'library-only'
scenario = 'A walk that reaches only the library, the kernel and the domain.'
given.files.'walk.rs' = '''
use ryo::languages::contract::{Leafness, Walked};
use ryo::languages::Offset;

use crate::domain::syntax::service::kind_bits;

pub(crate) fn walked(text: &str) -> Walked {
    let length = Offset(text.len() as u32);
    let _ = kind_bits;
    Walked { kind: kind_bits(crate::domain::syntax::types::Kind::Extra(crate::domain::extras::types::Extra::Error)), leaf: Leafness::Node, start: Offset(0), end: length, children: Vec::new() }
}
'''

[[scenarios]]
id = 'imports-the-adapter'
scenario = 'A walk that imports the adapter.'
given.files.'walk.rs' = '''
use super::super::adapter::SyntaxDemoParserAdapter;

pub(crate) fn walked(text: &str) -> usize {
    let _ = SyntaxDemoParserAdapter;
    text.len()
}
'''
then.findings = [
  { path = 'walk.rs', line = 1 },
]

[[scenarios]]
id = 'imports-the-schemas'
scenario = "A walk that imports the adapter's schemas."
given.files.'walk.rs' = '''
use super::super::schemas::{node_kind, token_kind};

pub(crate) fn walked(text: &str) -> usize {
    let _ = (node_kind, token_kind);
    text.len()
}
'''
then.findings = [
  { path = 'walk.rs', line = 1 },
  { path = 'walk.rs', line = 1 },
]

[[scenarios]]
id = 'imports-by-crate-path'
scenario = 'A walk that reaches the adapter by an absolute path.'
given.files.'walk.rs' = '''
use crate::outbound::syntax::adapters::demo_parser::adapter::read_all;

pub(crate) fn walked(text: &str) -> usize {
    read_all(text)
}
'''
then.findings = [
  { path = 'walk.rs', line = 1 },
]

[[scenarios]]
id = 'imports-the-elements'
scenario = 'A walk that imports the element table.'
given.files.'walk.rs' = '''
use ryo::languages::{ByteSlice, Elements, Position};

pub(crate) fn walked(elements: &Elements, at: Position) -> usize {
    let _ = ByteSlice(&[]);
    at.0 + elements.flags.len()
}
'''
then.findings = [
  { path = 'walk.rs', line = 1 },
  { path = 'walk.rs', line = 3 },
]

[[scenarios]]
id = 'builds-the-table'
scenario = 'A walk that builds the element table.'
given.files.'walk.rs' = '''
use ryo::languages;

pub(crate) fn walked(text: &str) -> usize {
    let (mut elements, mut symbols) = (languages::Elements::default(), languages::Symbols::default());
    let _ = languages::table_builder(&mut elements, &mut symbols, languages::ByteSlice(text.as_bytes()));
    0
}
'''
then.findings = [
  { path = 'walk.rs', line = 5 },
]
