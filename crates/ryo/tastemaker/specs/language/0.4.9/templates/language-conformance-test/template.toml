description = "A language's conformance row: a test of its own that holds every answer the language gives for the catalog to its fixtures."
why = "A language implements `Parse` and `Project`, and the compiler holds that each answers every relation of the catalog. The compiler cannot hold that an answer is true: a relation answered `NotInThisLanguage` for a construct the language has, or answered `Reads` by a reader that writes nothing, compiles. The contract's `conformance` holds each answer to the language's fixtures, the same for every language: `Reads` has a fixture with expected rows and the rows are written, `NotInThisLanguage` has no fixture with the construct in it and says why, a manifest relation read gives rows from a project fixture. The test is the engine's, written once, and the file is placed closed, exactly as the template renders it, so test logic added to a language is a finding."
match = "declarations"
content = '''
//! The conformance row of the language contract: every relation the language answers `Reads` is shown by a fixture and written as expected, every one it answers `NotInThisLanguage` has no fixture with the construct in it and says why, every manifest relation it reads gives rows from a project fixture, and every kind of its trees is shown or marked unread.

fn main() {
    ryo::languages::contract::conformance(
        &ryo_{{ lang }}::linked(),
        ryo::languages::contract::ManifestDir(env!("CARGO_MANIFEST_DIR")),
        &ryo_{{ lang }}::fixtures::expected(),
    );
}
'''

[params]
lang = { type = "identifier", description = "The language, the name of its directory under `languages/`: its crate is `ryo_<lang>`. The `{lang}` capture of the entry that places the file." }

[given]
file = 'tests/conformance.rs'
params = { lang = 'example' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'tests/conformance.rs' = '''
//! The conformance row of the language contract: every relation the language answers `Reads` is shown by a fixture and written as expected, every one it answers `NotInThisLanguage` has no fixture with the construct in it and says why, every manifest relation it reads gives rows from a project fixture, and every kind of its trees is shown or marked unread.

fn main() {
    ryo::languages::contract::conformance(
        &ryo_example::linked(),
        ryo::languages::contract::ManifestDir(env!("CARGO_MANIFEST_DIR")),
        &ryo_example::fixtures::expected(),
    );
}
'''

[[scenarios]]
id = 'not-run'
scenario = 'The test does not run the conformance.'
given.files.'tests/conformance.rs' = '''
//! The conformance row of the language contract.

#[test]
fn nothing_is_held() {}
'''
then.findings = [
  { rule = 'language-conformance-test#template', path = 'tests/conformance.rs' },
  { rule = 'language-conformance-test#template', path = 'tests/conformance.rs' },
]

[[scenarios]]
id = 'extra-test'
scenario = "A test of the language's own in a file that is the engine's."
given.params = { lang = 'demo' }
given.files.'tests/conformance.rs' = '''
//! The conformance row of the language contract: every relation the language answers `Reads` is shown by a fixture and written as expected, every one it answers `NotInThisLanguage` has no fixture with the construct in it and says why, every manifest relation it reads gives rows from a project fixture, and every kind of its trees is shown or marked unread.

fn main() {
    ryo::languages::contract::conformance(
        &ryo_example::linked(),
        ryo::languages::contract::ManifestDir(env!("CARGO_MANIFEST_DIR")),
        &ryo_example::fixtures::expected(),
    );
}

#[test]
fn also_this() {}
'''
then.findings = [
  { rule = 'language-conformance-test#template', path = 'tests/conformance.rs' },
]
