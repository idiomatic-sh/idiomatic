description = "Semantic construction belongs to the admitted derived owner; consumers borrow acquired views."
why = "The execution owner alone binds live source proofs to semantic construction, shared keys and required leases for every derived kind. Resolved dependencies to the actual semantic bridge plus precise imported build spans reject renamed, qualified and newly added-module bypasses. Resolved injected-port users may prepare immutable descriptors but may not call build outside that bridge. Portable semantic API proofs are legitimate callers of the public semantic use case; production engine consumers are not. Rust private fields and required permit/source capabilities separately prohibit forged acquisition or raw invocation authority. The method guard associates resolved semantic-port references and build calls in the same file; it does not infer receiver types across macros or follow arbitrary re-export chains, so runtime and Rust controls remain required. Who reaches the owner is confined too: an identifier of `confined` (the owner's acquiring entries, and the leased views and handles it issues) written in a production file outside the owner's concept is a finding: the concept is the one directory `owner-concept` names beneath a crate's `src/` (`application/file_dag/derived`), not any directory that shares its last name, so acquisition is collapsed into one owner module per crate, and a new caller of `admit_view` or a new holder of an `AcquiredView` outside it is a change of who reaches the owner, which moves the code into the concept rather than naming the file in a list. The builder port itself (`DerivedPort`) can be confined the same way, so it is named only by its own hex and the compositions that hand it to the owner: the port's own outbound files, beneath its crate's `outbound/derived`, are the port (its interface, factory, adapters and fakes), so the port's own name, an identifier its `outbound/derived/interface.rs` defines, written there is not a finding; any other confined identifier there, and the port's name beneath another crate's `outbound/derived`, still is. Test code (the files placed as proofs, test-named files and fixtures) is not production and is left out; a build call is left out of a fixtures role too, a `fixtures.rs` or a file beneath `fixtures/` whose module, or a module above it, is declared under a `cfg` naming `test` or the `fixtures` feature, while the same file declared without that gate is production."

query = '''
param confined: set<string>;
param owner-concept: string;
let directory-sources = capture(from="source-dependency", path="source", pattern="{*source-root}/domain/{concept}/{*source-rest}", captures=["source-root", "concept", "source-rest"]);
let module-sources = capture(from="source-dependency", path="source", pattern="{*source-root}/domain/{concept}.rs", captures=["source-root", "concept"]);
let source-files = select source, target, span, source-root, concept from directory-sources;
let source-modules = select source, target, span, source-root, concept from module-sources;
let named-sources = union(left=source-files, right=source-modules);
let other-concepts = select source, target, span, source-root from named-sources where concept != "derived_views";
let root-source = capture(from="source-dependency", path="source", pattern="{*source-root}/domain.rs", captures=["source-root"]);
let domain-root = select source, target, span, source-root from root-source;
let outside = union(left=other-concepts, right=domain-root);
let registry-target = capture(from=outside, path="target", pattern="{*target-root}/domain/derived_views/collections/views/registration.rs", captures=["target-root"]);
let interface-target = capture(from=outside, path="target", pattern="{*target-root}/domain/derived_views/collections/views/interface.rs", captures=["target-root"]);
let registry-rows = select source, span, source-root, target-root from registry-target;
let interface-rows = select source, span, source-root, target-root from interface-target;
let entrypoints = union(left=registry-rows, right=interface-rows);
let local = select source as file, span from entrypoints where source-root = target-root;
let paths = capture(from="source-dependency", path="source", pattern="{*source-root}/{*source-tail}", captures=["source-root", "source-tail"]);
let bridges = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/derived/owner/acquisition/semantics/service.rs", captures=["target-root"]);
let raw-builds = select source as file, span from bridges where source-root = target-root and glob_any(source-root, "{src,**/src}") and glob_any(written, "{build,*::build}") and source-tail != "application/file_dag/derived/owner/acquisition/service.rs";
let build-imports = select file, span from "static-import" where glob_any(target, "{build,*::build}");
let raw-aliases = select l.source as file, l.span as span from bridges as l join build-imports as r on l.source = r.file and l.span = r.span where l.source-root = l.target-root and glob_any(l.source-root, "{src,**/src}") and l.source-tail != "application/file_dag/derived/owner/acquisition/service.rs";
let all-raw-builds = union(left=raw-builds, right=raw-aliases);
let port-targets = capture(from=paths, path="target", pattern="{*target-root}/outbound/derived/interface.rs", captures=["target-root"]);
let port-users = select source as file, source-tail from port-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let portable-targets = capture(from=paths, path="target", pattern="{*portable-root}/inbound/use_cases/derived/{portable-part}.rs", captures=["portable-root", "portable-part"]);
let portable-users = select source as file, source-tail from portable-targets where glob_any(source-root, "{src,**/src}") and glob_any(portable-part, "{interface,use_case}");
let semantic-users = union(left=port-users, right=portable-users);
let method-builds = select file, span from "static-call" where glob_any(target, "{build,*::build}");
let port-builds = select l.file as file, r.span as span from semantic-users as l join method-builds as r on l.file = r.file where l.source-tail != "application/file_dag/derived/owner/acquisition/semantics/service.rs";
let semantic-proofs = select path as file from "tastemaker.placed" where glob_any(template, "{unit-test,item-test,value-test,composition-test,domain-test,edge-fixtures,program-runtime-proof}");
let port-hex = select file from port-users where glob_any(source-tail, "outbound/derived/**");
let consumer-builds = antijoin(left=port-builds, right=port-hex, left-on=["file"], right-on=["file"]);
let fixture-rust-files = select l."path" as "file" from "filesystem.file" as l where glob_any(l."path", "**/*.rs");
let fixture-all-cfgs = select * from "decorates" where target = "cfg";
let fixture-cfgs = select * from fixture-all-cfgs where arguments = "test" or glob_any(arguments, "any(test, feature = ?fixtures?)") or glob_any(arguments, "any(test,feature=?fixtures?)");
let fixture-declared = select * from "defines" where kind = "namespace";
let fixture-gated-modules = select r."name" as "name", r."file" as "file" from fixture-cfgs as l join fixture-declared as r on l."declaration" = r."id";
let fixture-module-places = capture(from=fixture-gated-modules, path="file", pattern="{*dir}/{stem}.rs", captures=["dir", "stem"]);
let fixture-nested-files = capture(from=fixture-rust-files, path="file", pattern="{*dir}/{stem}/{child}.rs", captures=["dir", "stem", "child"]);
let fixture-nested = select r."file" as "file" from fixture-module-places as l join fixture-nested-files as r on l."dir" = r."dir" and l."stem" = r."stem" and l."name" = r."child";
let fixture-nested-trees = capture(from=fixture-rust-files, path="file", pattern="{*dir}/{stem}/{child}/{*rest}", captures=["dir", "stem", "child", "rest"]);
let fixture-nested-tree = select r."file" as "file" from fixture-module-places as l join fixture-nested-trees as r on l."dir" = r."dir" and l."stem" = r."stem" and l."name" = r."child";
let fixture-root-places = select * from fixture-module-places where glob_any(stem, "{lib,main,mod}");
let fixture-sibling-files = capture(from=fixture-rust-files, path="file", pattern="{*dir}/{child}.rs", captures=["dir", "child"]);
let fixture-root = select r."file" as "file" from fixture-root-places as l join fixture-sibling-files as r on l."dir" = r."dir" and l."name" = r."child";
let fixture-sibling-trees = capture(from=fixture-rust-files, path="file", pattern="{*dir}/{child}/{*rest}", captures=["dir", "child", "rest"]);
let fixture-root-tree = select r."file" as "file" from fixture-root-places as l join fixture-sibling-trees as r on l."dir" = r."dir" and l."name" = r."child";
let fixture-gated-0 = union(left=fixture-nested, right=fixture-nested-tree);
let fixture-gated-1 = union(left=fixture-gated-0, right=fixture-root);
let fixture-gated = union(left=fixture-gated-1, right=fixture-root-tree);
let fixture-roles = select * from fixture-gated where glob_any(file, "{**/fixtures.rs,**/fixtures/**}");
let proof-port-builds = antijoin(left=consumer-builds, right=semantic-proofs, left-on=["file"], right-on=["file"]);
let production-port-builds = antijoin(left=proof-port-builds, right=fixture-roles, left-on=["file"], right-on=["file"]);
let ordinary = union(left=local, right=all-raw-builds);
let build-violations = union(left=ordinary, right=production-port-builds);
let confined-names = select file, span, text as name from "syntax-tree" where kind = "ident" and glob_any(text, $confined) and glob_any(file, "{src,**/src}/**") and not glob_any(file, concat("{src,**/src}/", $owner-concept, "/**")) and not glob_any(file, "{**/*_test.rs,**/test.rs,**/fixtures.rs,**/fixtures/**,**/*_test/**}");
let port-definitions = capture(from="defines", path="file", pattern="{*port-root}/outbound/derived/interface.rs", captures=["port-root"]);
let port-own-names = select name, port-root from port-definitions;
let port-hex-names = capture(from=confined-names, path="file", pattern="{*port-root}/outbound/derived/{*port-rest}", captures=["port-root", "port-rest"]);
let port-naming-itself = select l.file as file, l.span as span from port-hex-names as l join port-own-names as r on l.port-root = r.port-root and l.name = r.name;
let confined-outside = antijoin(left=confined-names, right=port-naming-itself, left-on=["file", "span"], right-on=["file", "span"]);
let production-names = antijoin(left=confined-outside, right=semantic-proofs, left-on=["file"], right-on=["file"]);
let held = select file, span from production-names;
let violations = union(left=build-violations, right=held);
emit violations subject file key(span);
'''

[params.confined]
type = "set<string>"
description = "The identifiers only the owner and its listed callers and holders write: the acquiring entries (`admit_view`) and the views and handles the owner issues (`AcquiredView`)."

[params.owner-concept]
type = "string"
description = "The path of the owner's concept directory beneath a crate's `src/` (`application/file_dag/derived`): a production file beneath that directory is the owner's own and may write a confined identifier; every other production file may not, a file beneath another directory that is also named `derived` among them."

[diagnostic]
primary = "span"
message = "a consumer reaches derived semantic construction outside admitted acquisition"
help = "Declare the derived view in the operator contract and let the application owner acquire and release it. Metadata preparation may borrow the injected port; semantic build calls belong only to the admitted acquisition bridge. Never publish a semantic-port getter or a direct-build helper for engine consumers. A new caller of an acquiring entry or holder of a leased view outside the owner's concept is a change of who reaches the owner: move that code into the concept's directory, where the owner acquires and releases the view."

[given]
include = ["src/**"]
params = { confined = ["admit_view", "AcquiredView"], owner-concept = "application/file_dag/derived" }
