description = "File walk ownership and semantic dispatch stay inside the required engine boundary, from any crate of the workspace."
why = "All file invocation strategies receive one required file-walk owner and use its acquisition policy. Explicit project scope is checked against the live runtime permit; it is never an optional file owner. FileWalk and WalkResult have private representations in native_walk.rs; the issued PermittedWalk data and consuming semantic dispatch live in native_walk/lease/service.rs. Only that owner constructs the request from its actual ready-class queue and calls the semantic shared walker. Rust privacy resolves construction aliases; runtime controls prove scope, readiness, source identity and semantic barriers. The structural checks reject optional KernelSession state, moved or widened owner representations and written raw evaluator paths. From any crate of the workspace, resolved source dependencies also reject aliased access to the semantic service. Only execution_runtime's native_walk/lease/service.rs, the semantic service itself, and execution_domain's exact registered domain/shared_walk/service_test.rs proof may reference that service; the same relative path in another crate, test filenames and neighboring domain modules grant no authority. Fundamental shared-walk counters, predicate identities and file scratch belong to types.rs; prepared request values may depend on that common vocabulary, never the reverse. Resolved reverse dependencies reject counter/identity moves back into the prepared value. Macro expansion and facade re-export chains remain outside this source proof."
query = '''
let nodes = select id, kind, file, span from "syntax-tree" where text = "";
let tokens = select id, kind, file, span, text from "syntax-tree" where text != "";
let structs = select * from nodes where kind = "struct";
let names = select * from nodes where kind = "name";
let struct-children = select l.id as id, l.file as file, l.span as span, r.child as child from structs as l join "syntax-child" as r on l.id = r.parent;
let struct-names = select l.id as id, l.file as file, l.span as span, l.child as node from struct-children as l join names as r on l.child = r.id;
let name-children = select l.id as id, l.file as file, l.span as span, r.child as token from struct-names as l join "syntax-child" as r on l.node = r.parent;
let named-structs = select l.id as id, l.file as file, l.span as span, r.text as name from name-children as l join tokens as r on l.token = r.id;
let sealed = select * from named-structs where glob_any(name, "{FileWalk,PermittedWalk,WalkResult}");
let wrong-placement = select file, span from sealed where
    (name = "PermittedWalk" and not glob_any(file, "{src,**/src}/application/file_dag/program/native_walk/lease/service.rs"))
    or (glob_any(name, "{FileWalk,WalkResult}") and not glob_any(file, "{src,**/src}/application/file_dag/program/native_walk.rs"));
let lists = select r.child as list from sealed as l join "syntax-child" as r on l.id = r.parent;
let field-edges = select r.child as field from lists as l join "syntax-child" as r on l.list = r.parent;
let fields = select * from nodes where glob_any(kind, "{record-field,tuple-field}");
let sealed-fields = select r.id as id, r.file as file, r.span as span from field-edges as l join fields as r on l.field = r.id;
let visibilities = select * from nodes where kind = "visibility";
let visible-owners = select l.parent as id from "syntax-child" as l join visibilities as r on l.child = r.id;
let widened = select l.file as file, l.span as span from sealed-fields as l join visible-owners as r on l.id = r.id;
let sessions = select * from named-structs where name = "KernelSession";
let session-descendants = axis(from=sessions, relation="syntax-child", direction=descendant, domain=tokens);
let optional-session = select r.file as file, r.span as span from session-descendants as l join tokens as r on l.related = r.id where r.kind = "ident" and r.text = "Option";
let paths = select * from nodes where kind = "path";
let path-names = axis(from=paths, relation="syntax-child", direction=descendant, domain=tokens);
let shared-paths = select l.id as id from path-names as l join tokens as r on l.related = r.id where r.kind = "ident" and r.text = "shared_walk";
let evaluator-paths = select l.id as id from path-names as l join tokens as r on l.related = r.id where r.kind = "ident" and r.text = "evaluate";
let raw-evaluators = select l.id as id from shared-paths as l join evaluator-paths as r on l.id = r.id;
let raw-sites = select r.file as file, r.span as span from raw-evaluators as l join paths as r on l.id = r.id where not glob_any(r.file, "{,**/}{execution_runtime/src/application/file_dag/program/native_walk/lease/service.rs,execution_domain/src/domain/shared_walk/service.rs,execution_domain/src/domain/shared_walk/service_test.rs}");
let boundary = union(left=wrong-placement, right=widened);
let session-boundary = union(left=boundary, right=optional-session);
let dependencies = capture(from="source-dependency", path="source", pattern="{*source-root}/{*source-tail}", captures=["source-root", "source-tail"]);
let semantic-targets = capture(from=dependencies, path="target", pattern="{*target-root}/{*semantic-tail}", captures=["target-root", "semantic-tail"]);
let foreign-semantics = select source as file, span from semantic-targets where glob_any(source-root, "{src,**/src}") and glob_any(target-root, "{src,**/src}") and glob_any(semantic-tail, "{domain/shared_walk.rs,domain/shared_walk/service.rs}") and not glob_any(source, "{,**/}{execution_runtime/src/application/file_dag/program/native_walk/lease/service.rs,execution_domain/src/domain/shared_walk/service.rs,execution_domain/src/domain/shared_walk/service_test.rs}");
let visibility-paths = axis(from=visibilities, relation="syntax-child", direction=descendant, domain=paths);
let visibility-references = select r.file as file, r.span as span from visibility-paths as l join paths as r on l.related = r.id;
let callable-semantics = antijoin(left=foreign-semantics, right=visibility-references, left-on=["file", "span"], right-on=["file", "span"]);
let written-boundary = union(left=session-boundary, right=raw-sites);
let reverse-prepared-types = select source as file, span from semantic-targets where source-root = target-root and source-tail = "domain/shared_walk/types.rs" and glob_any(semantic-tail, "domain/shared_walk/types/**");
let semantic-boundary = union(left=written-boundary, right=callable-semantics);
let violations = union(left=semantic-boundary, right=reverse-prepared-types);
emit violations subject file key(span);
'''

[diagnostic]
primary = "span"
message = "shared file-walk ownership escapes its required private engine boundary"
help = "Keep FileWalk/WalkResult private in native_walk.rs and the permitted request private in native_walk/lease/service.rs. Give file sessions a required owner and project sessions an explicitly validated stage. Acquire shared results through the file owner."

