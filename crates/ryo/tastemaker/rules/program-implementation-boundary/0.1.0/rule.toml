[[scenarios]]
id = "direct-internal-import"
scenario = "An application peer cannot import the runtime implementation."
given.files.'src/application/caller.rs' = 'use crate::application::file_dag::program::runtime::execute;'
then.findings = [{ path = "src/application/caller.rs", line = 1 }]

[[scenarios]]
id = "new-nested-admission-implementation"
scenario = "A newly added nested implementation is protected without listing its filename."
given.files.'src/application/caller.rs' = 'pub fn run() { crate::application::file_dag::program::facade_runtime::source_admission::raw_admit(); }'
then.findings = [{ path = "src/application/caller.rs", line = 1 }]

[[scenarios]]
id = "renamed-relative-import"
