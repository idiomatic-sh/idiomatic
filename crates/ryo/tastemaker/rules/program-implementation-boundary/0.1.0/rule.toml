description = "Only declared owners and bridges may depend on execution implementation modules."
why = "The application program owns admission, publication, restoration, and physical dispatch; the domain dispatcher owns operator registration. A consumer that resolves an implementation module directly can bypass that owner. This checks resolved same-crate Rust source dependencies, including aliases and qualified paths. The facade, descriptors, and borrowed semantic interfaces remain available. Rust visibility and engine-issued permits separately enforce construction and invocation. This relation does not follow a facade re-export chain or resolve macro-generated paths, so it is one source boundary rather than proof of every callable route."

query = '''
let paths = capture(from="source-dependency", path="source", pattern="{*source-root}/{*source-tail}", captures=["source-root", "source-tail"]);
let targets = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/program/{*implementation-tail}", captures=["target-root", "implementation-tail"]);
let local = select source as file, span, source-tail, implementation-tail from targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let protected = select * from local where implementation-tail != "facade.rs";
let outsiders = select * from protected where not glob_any(source-tail, "{application/file_dag/program.rs,application/file_dag/program/**}");
let forbidden = select * from outsiders where implementation-tail != "admission.rs" or not glob_any(source-tail, "{application/file_dag/executor.rs,application/file_dag/execution.rs,application/file_dag/execution/lease.rs}");
let program-violations = select file, span from forbidden;
let lease-targets = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/execution/lease.rs", captures=["target-root"]);
let local-leases = select source as file, span, source-tail from lease-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let foreign-leases = select file, span from local-leases where not glob_any(source-tail, "{application/file_dag/execution.rs,application/file_dag/program/kernel_session.rs}");
let cache-targets = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/derived/owner/{cache-part}.rs", captures=["target-root", "cache-part"]);
let local-cache = select source as file, span, source-tail, cache-part from cache-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let raw-cache = select * from local-cache where glob_any(cache-part, "{acquisition,raw_scope,leases}");
let foreign-cache = select file, span from raw-cache where not glob_any(source-tail, "{application/file_dag/derived/owner.rs,application/file_dag/derived/owner/**,application/file_dag/testing.rs}");
let dispatch-violations = union(left=program-violations, right=foreign-leases);
let app-violations = union(left=dispatch-violations, right=foreign-cache);
let kernel-targets = capture(from=paths, path="target", pattern="{*target-root}/domain/executable_program/kernel.rs", captures=["target-root"]);
let local-kernel = select source as file, span, source-tail from kernel-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let foreign-kernel = select file, span from local-kernel where not glob_any(source-tail, "{domain/executable_program.rs,domain/executable_program/**,application/file_dag/execution.rs,application/file_dag/program/kernel_session.rs}");
let registry-targets = capture(from=paths, path="target", pattern="{*target-root}/domain/operator/contract/registration.rs", captures=["target-root"]);
let local-registry = select source as file, span, source-tail from registry-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let foreign-registry = select file, span from local-registry where not glob_any(source-tail, "{domain/operator/contract.rs,domain/operator/contract/**,domain/operator/service.rs,domain/executable_program/kernel.rs,application/file_dag/request.rs,application/file_dag/relations.rs,application/file_dag/testing.rs,application/file_dag/derived/owner/resource_fixture.rs,**/*_test.rs,**/tests.rs}");
let domain-violations = union(left=foreign-kernel, right=foreign-registry);
let violations = union(left=app-violations, right=domain-violations);
emit violations subject file key(span);
'''

[diagnostic]
primary = "span"
message = "a caller reaches the executable-program implementation"
help = "Call the application program facade with engine-issued inputs. Keep physical dispatch and registration in their declared owners and bridges; prepare operator contracts through their supported service."

[given]
include = ["src/**"]
files.'Cargo.toml' = '''
[package]
name = "program_boundary_fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = 'pub mod application; pub mod domain;'
files.'src/application.rs' = 'pub mod file_dag; pub mod caller;'
files.'src/application/file_dag.rs' = 'pub mod program; pub mod executor; pub mod execution; pub mod derived;'
files.'src/application/file_dag/program.rs' = 'pub mod facade; pub mod runtime; pub mod admission; pub mod restored; pub mod kernel_session; pub mod request_identity; pub mod facade_runtime;'
