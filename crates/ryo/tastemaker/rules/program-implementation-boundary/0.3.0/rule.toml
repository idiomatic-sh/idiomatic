description = "Only declared owners and bridges may depend on execution implementation modules."
why = "The application program owns admission, publication, restoration, and physical dispatch; the domain dispatcher owns operator registration. A domain primitive cannot depend on any application module, including a newly added acquisition or permit module. Other consumers cannot resolve the protected implementation modules directly. This checks resolved same-crate Rust source dependencies, including aliases and qualified paths. Exact syntax paths inside visibility restrictions are excluded by source file and span; visibility names an access scope and does not borrow or call that owner. Real imports, type references and calls at the same path remain subject to the boundary. The immutable preparation service/types, neutral protocol roles, outer file/project entry and borrowed semantic interfaces remain available. Lower implementations never depend on an orchestration facade. Public partition/applicability descriptors and opaque validated restoration retain their existing caller API at the actual defining module; their input/permit constructors remain Rust-private. Source admission validates explicit scope data and cannot depend on runtime state; protocol/preparation and runtime type roles cannot point back to their own workflow implementations. Rust visibility and engine-issued permits separately enforce construction and invocation. The source, invocation and semantic bridges have one production implementer each. Operator and physical representation implementers must be selected by the tail match of their actual RegisteredOperator/RegisteredRepresentation item method: only an unguarded direct immutable &Item arm result registers its resolved type, including qualified or renamed imports. Blocks, guards, patterns, unused matches and other methods supply no registration; a new implementation does not acquire a route merely by satisfying the trait. Registered proof roles may substitute implementations for negative controls. The kind enums drive exhaustive dispatch and real fixture coverage; this check does not establish runtime behavior. This relation does not follow a facade re-export chain or resolve macro-generated paths, so it is one source boundary rather than proof of every callable route."

query = '''
let dependency-nodes = select id, file, span, kind from "syntax-tree" where text = "";
let dependency-visibilities = select * from dependency-nodes where kind = "visibility";
let dependency-paths = select * from dependency-nodes where kind = "path";
let visibility-paths = axis(from=dependency-visibilities, relation="syntax-child", direction=descendant, domain=dependency-paths);
let visibility-references = select r.file as source, r.span as span from visibility-paths as l join dependency-paths as r on l.related = r.id;
let callable-dependencies = antijoin(left="source-dependency", right=visibility-references, left-on=["source", "span"], right-on=["source", "span"]);
let paths = capture(from=callable-dependencies, path="source", pattern="{*source-root}/{*source-tail}", captures=["source-root", "source-tail"]);
let targets = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/program/{*implementation-tail}", captures=["target-root", "implementation-tail"]);
let local = select source as file, span, source-tail, implementation-tail from targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let protected = select * from local where not glob_any(implementation-tail, "{preparation/service.rs,preparation/types.rs,rule_outcome/types.rs,observed_publication/types.rs,observed_publication/service.rs,prepared_execution/{interface,service,types}.rs,request_execution/{interface,service,types}.rs,file_session/{interface,types}.rs,project_phase/{interface,types}.rs,observation_stage/{interface,types}.rs,facade_runtime/mod.rs,facade_runtime/file_execution/mod.rs,facade_runtime/project_execution/mod.rs,facade_runtime/service.rs,facade_runtime/types.rs,admission/mod.rs,restored/mod.rs,restored/types.rs}");
let outsiders = select * from protected where not glob_any(source-tail, "{application/file_dag/program/mod.rs,application/file_dag/program/**}");
let ordinary-bridges = select * from outsiders where not glob_any(implementation-tail, "{admission/mod.rs,runtime/service.rs}") or not glob_any(source-tail, "{application/file_dag/executor/mod.rs,application/file_dag/execution/mod.rs,application/file_dag/execution/lease/mod.rs,application/file_dag/execution/lease/capability/service.rs}");
let bridges = select * from ordinary-bridges where source-tail != "application/file_dag/executor/mod.rs" or not glob_any(implementation-tail, "{native_walk/lease/service.rs,native_join/lease/service.rs}");
let forbidden = select * from bridges where implementation-tail != "runtime/service.rs" or not glob_any(source-tail, "{application/file_dag/derived/owner/raw_scope.rs,application/file_dag/derived/owner/acquisition/admission/service/issuance/service.rs}");
let program-violations = select file, span from forbidden;
let lease-targets = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/execution/lease/mod.rs", captures=["target-root"]);
let local-leases = select source as file, span, source-tail from lease-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let foreign-leases = select file, span from local-leases where not glob_any(source-tail, "{application/file_dag/executor/mod.rs,application/file_dag/execution/mod.rs,application/file_dag/program/kernel_session/mod.rs,application/file_dag/program/kernel_session/**}");
let cache-files = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/derived/owner/{cache-part}.rs", captures=["target-root", "cache-part"]);
let cache-modules = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/derived/owner/{cache-part}/mod.rs", captures=["target-root", "cache-part"]);
let cache-targets = union(left=cache-files, right=cache-modules);
let local-cache = select source as file, span, source-tail, cache-part from cache-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let raw-cache = select * from local-cache where glob_any(cache-part, "{acquisition,raw_scope,leases}");
let foreign-cache = select file, span from raw-cache where not glob_any(source-tail, "{application/file_dag/derived/owner.rs,application/file_dag/derived/owner/**,application/file_dag/testing/mod.rs}");
let capability-targets = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/execution/lease/capability/service.rs", captures=["target-root"]);
let foreign-capabilities = select source as file, span from capability-targets where source-root = target-root and glob_any(source-root, "{src,**/src}") and not glob_any(source-tail, "{application/file_dag/executor/mod.rs,application/file_dag/execution/mod.rs,application/file_dag/execution/lease/mod.rs}");
let lease-boundaries = union(left=foreign-leases, right=foreign-capabilities);
let dispatch-violations = union(left=program-violations, right=lease-boundaries);
let owner-violations = union(left=dispatch-violations, right=foreign-cache);
let positioned-targets = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/relations/{issuer}.rs", captures=["target-root", "issuer"]);
let foreign-positioned = select source as file, span from positioned-targets where source-root = target-root and glob_any(source-root, "{src,**/src}") and ((issuer = "positioned" and not glob_any(source-tail, "{application/file_dag/program/kernel_session/mod.rs,application/file_dag/program/kernel_session/**}")) or (issuer = "selection" and not glob_any(source-tail, "{application/file_dag/program/selection.rs,application/file_dag/derived/owner/selection/mod.rs}")));
let derived-targets = capture(from=paths, path="target", pattern="{*target-root}/application/file_dag/derived/owner/{*owned-tail}", captures=["target-root", "owned-tail"]);
let raw-derived = select source as file, span, source-tail from derived-targets where source-root = target-root and glob_any(source-root, "{src,**/src}") and glob_any(owned-tail, "{graphs/types/retained/**,selection/candidates/**,selection/fanout/**,acquisition/semantics/**}");
let foreign-derived = select file, span from raw-derived where not glob_any(source-tail, "{application/file_dag/derived/owner.rs,application/file_dag/derived/owner/**,application/file_dag/derived/owner_test.rs}");
let publication-violations = union(left=owner-violations, right=foreign-positioned);
let app-violations = union(left=publication-violations, right=foreign-derived);
let application-targets = capture(from=paths, path="target", pattern="{*target-root}/application/{*application-tail}", captures=["target-root", "application-tail"]);
let local-application = select source as file, span, source-tail from application-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let application-roots = capture(from=paths, path="target", pattern="{*target-root}/application.rs", captures=["target-root"]);
let local-application-roots = select source as file, span, source-tail from application-roots where source-root = target-root and glob_any(source-root, "{src,**/src}");
let all-application = union(left=local-application, right=local-application-roots);
let domain-application = select file, span from all-application where source-tail = "domain.rs" or glob_any(source-tail, "domain/**");
let protected-app = union(left=app-violations, right=domain-application);
let kernel-targets = capture(from=paths, path="target", pattern="{*target-root}/domain/executable_program/kernel/mod.rs", captures=["target-root"]);
let local-kernel = select source as file, span, source-tail from kernel-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let foreign-kernel = select file, span from local-kernel where not glob_any(source-tail, "{domain/executable_program.rs,domain/executable_program/**,application/file_dag/execution/mod.rs,application/file_dag/program/kernel_session/mod.rs,application/file_dag/program/kernel_session/**}");
let registry-targets = capture(from=paths, path="target", pattern="{*target-root}/domain/operator/contract/registration/mod.rs", captures=["target-root"]);
let local-registry = select source as file, span, source-tail from registry-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let foreign-registry = select file, span from local-registry where not glob_any(source-tail, "{domain/operator/contract/mod.rs,domain/operator/contract/**,domain/operator/service.rs,application/file_dag/execution/lease/capability/service.rs}");
let context-targets = capture(from=paths, path="target", pattern="{*target-root}/domain/operator/contract/context/mod.rs", captures=["target-root"]);
let local-context = select source as file, span, source-tail from context-targets where source-root = target-root and glob_any(source-root, "{src,**/src}");
let foreign-context = select file, span from local-context where source-tail != "application/file_dag/execution/lease/mod.rs";
let domain-entry-violations = union(left=foreign-kernel, right=foreign-registry);
let domain-violations = union(left=domain-entry-violations, right=foreign-context);
let neutral-backrefs = select file, span from local where
    (glob_any(source-tail, "application/file_dag/program/{rule_outcome,observed_publication}/**") and glob_any(implementation-tail, "{preparation/**,runtime/**,facade_runtime/mod.rs,facade_runtime/**,kernel_session/mod.rs,kernel_session/**,native_walk/mod.rs,native_join.rs}"))
    or (glob_any(source-tail, "application/file_dag/program/preparation/**") and glob_any(implementation-tail, "{rule_outcome/**,observed_publication/**,runtime/**,facade_runtime/mod.rs,facade_runtime/**,kernel_session/mod.rs,kernel_session/**,native_walk/mod.rs,native_join.rs}"))
    or (source-tail = "application/file_dag/program/admission/mod.rs" and glob_any(implementation-tail, "runtime/**"))
    or (source-tail = "application/file_dag/program/runtime/types.rs" and implementation-tail = "runtime/service.rs");
let invocation-boundary = union(left=protected-app, right=domain-violations);
let direct-implementations = select file, span, declaration, target as contract from "inherits" where glob_any(target, "{KernelInvocation,*::KernelInvocation,Inputs,*::Inputs,PrimitiveExecutor,*::PrimitiveExecutor,PrimitiveSemantics,*::PrimitiveSemantics,OperatorsItem,*::OperatorsItem,RepresentationsItem,*::RepresentationsItem}");
let implementation-imports = select file, span, binding, target from "static-import" where glob_any(target, "{KernelInvocation,*::KernelInvocation,Inputs,*::Inputs,PrimitiveExecutor,*::PrimitiveExecutor,PrimitiveSemantics,*::PrimitiveSemantics,OperatorsItem,*::OperatorsItem,RepresentationsItem,*::RepresentationsItem}");
let aliased-implementations = select l.file as file, l.span as span, l.declaration as declaration, r.target as contract from "inherits" as l join implementation-imports as r on l.file = r.file and l.target = r.binding;
let written-implementations = union(left=direct-implementations, right=aliased-implementations);
let local-dependencies = capture(from=paths, path="target", pattern="{*target-root}/{*target-tail}", captures=["target-root", "target-tail"]);
let contract-dependencies = select * from local-dependencies where source-root = target-root and glob_any(target-tail, "{application/file_dag/program/runtime/service.rs,application/file_dag/program/admission/mod.rs,application/file_dag/executor/mod.rs,domain/operator/contract/types.rs,domain/operator/collections/operators/interface.rs,domain/table_model/collections/representations/interface.rs}");
let qualified-implementations = select l.file as file, l.span as span, l.declaration as declaration, l.contract as contract, r.source-tail as source-tail, r.source-root as source-root from written-implementations as l join contract-dependencies as r on l.file = r.source and l.span = r.span;
let resolved-contract-imports = select l.file as file, l.binding as binding, l.target as contract, r.source-tail as source-tail, r.source-root as source-root from implementation-imports as l join contract-dependencies as r on l.file = r.source and l.span = r.span;
let imported-implementations = select l.file as file, l.span as span, l.declaration as declaration, r.contract as contract, r.source-tail as source-tail, r.source-root as source-root from "inherits" as l join resolved-contract-imports as r on l.file = r.file and l.target = r.binding;
let external-implementations = union(left=qualified-implementations, right=imported-implementations);
let local-trait-files = capture(from="defines", path="file", pattern="{*source-root}/{*source-tail}", captures=["source-root", "source-tail"]);
let local-traits = select * from local-trait-files where kind = "trait" and glob_any(name, "{KernelInvocation,Inputs,PrimitiveExecutor,PrimitiveSemantics,OperatorsItem,RepresentationsItem}") and glob_any(source-tail, "{application/file_dag/program/runtime/service.rs,application/file_dag/program/admission/mod.rs,application/file_dag/executor/mod.rs,domain/operator/contract/types.rs,domain/operator/collections/operators/interface.rs,domain/table_model/collections/representations/interface.rs}");
let self-implementations = select l.file as file, l.span as span, l.declaration as declaration, r.name as contract, r.source-tail as source-tail, r.source-root as source-root from "inherits" as l join local-traits as r on l.file = r.file and l.target = r.name;
let implementations = union(left=external-implementations, right=self-implementations);
let named-implementations = select l.file as file, l.span as span, l.contract as contract, l.source-tail as source-tail, l.source-root as source-root, r.name as name from implementations as l join "defines" as r on l.declaration = r.id;
let engine-implementations = select * from named-implementations where
    (glob_any(contract, "{KernelInvocation,*::KernelInvocation}") and source-tail = "application/file_dag/program/kernel_session/mod.rs" and name = "KernelSession")
    or (glob_any(contract, "{Inputs,*::Inputs}") and source-tail = "application/file_dag/program/facade_runtime/source_admission/mod.rs" and name = "SourceInputs")
    or (glob_any(contract, "{PrimitiveExecutor,*::PrimitiveExecutor}") and source-tail = "application/file_dag/execution/mod.rs" and name = "CommonOperatorEngine")
    or (glob_any(contract, "{PrimitiveSemantics,*::PrimitiveSemantics}") and source-tail = "application/file_dag/execution/mod.rs" and name = "PrimitiveSemanticsBridge");
let registry-uses = select source, target, span, written, source-root, source-tail from local-dependencies where source-root = target-root and glob_any(source-tail, "{domain/operator/contract/registration/mod.rs,domain/table_model/types/registered_representation/value.rs}");
let registry-nodes = select id, file, span, kind from "syntax-tree" where text = "";
let candidate-registry-owners = select * from "defines" where kind = "implementation" and ((name = "RegisteredOperator" and glob_any(file, "{src,**/src}/domain/operator/contract/registration/mod.rs")) or (name = "RegisteredRepresentation" and glob_any(file, "{src,**/src}/domain/table_model/types/registered_representation/value.rs")));
let registry-roots = select id from registry-nodes where kind = "source-file";
let root-children = select r.child as id from registry-roots as l join "syntax-child" as r on l.id = r.parent;
let registry-owners = select l.id as id from candidate-registry-owners as l join root-children as r on l.id = r.id;
let owner-children = select r.child as id from registry-owners as l join "syntax-child" as r on l.id = r.parent;
let owner-lists = select r.id as id from owner-children as l join registry-nodes as r on l.id = r.id where r.kind = "assoc-item-list";
let associated-items = select r.child as id from owner-lists as l join "syntax-child" as r on l.id = r.parent;
let registry-methods = select r.id as id, r.file as file from associated-items as l join "defines" as r on l.id = r.id where r.kind = "method" and r.name = "item";
let method-children = select r.child as id from registry-methods as l join "syntax-child" as r on l.id = r.parent;
let method-bodies = select r.id as id from method-children as l join registry-nodes as r on l.id = r.id where r.kind = "block-expr";
let body-children = select r.child as id from method-bodies as l join "syntax-child" as r on l.id = r.parent;
let statement-lists = select r.id as id from body-children as l join registry-nodes as r on l.id = r.id where r.kind = "stmt-list";
let tail-expressions = select r.child as id from statement-lists as l join "syntax-child" as r on l.id = r.parent;
let selected-matches = select r.id as id from tail-expressions as l join registry-nodes as r on l.id = r.id where r.kind = "match-expr";
let match-children = select r.child as id from selected-matches as l join "syntax-child" as r on l.id = r.parent;
let arm-lists = select r.id as id from match-children as l join registry-nodes as r on l.id = r.id where r.kind = "match-arm-list";
let arm-children = select r.child as id from arm-lists as l join "syntax-child" as r on l.id = r.parent;
let registry-arms = select r.id as id from arm-children as l join registry-nodes as r on l.id = r.id where r.kind = "match-arm";
let arm-values = select l.id as arm, r.child as id from registry-arms as l join "syntax-child" as r on l.id = r.parent;
let guarded-arms = select l.arm as id from arm-values as l join registry-nodes as r on l.id = r.id where r.kind = "match-guard";
let pure-arms = antijoin(left=registry-arms, right=guarded-arms, left-on=["id"], right-on=["id"]);
let selected-values = select r.child as id from pure-arms as l join "syntax-child" as r on l.id = r.parent;
let selected-references = select r.id as id from selected-values as l join registry-nodes as r on l.id = r.id where r.kind = "ref-expr";
let reference-children = select l.id as reference, r.child as id from selected-references as l join "syntax-child" as r on l.id = r.parent;
let mutable-references = select l.reference as id from reference-children as l join "syntax-tree" as r on l.id = r.id where r.kind = "mut-kw";
let immutable-references = antijoin(left=selected-references, right=mutable-references, left-on=["id"], right-on=["id"]);
let immutable-children = select r.child as id from immutable-references as l join "syntax-child" as r on l.id = r.parent;
let selected-path-expressions = select r.id as id from immutable-children as l join registry-nodes as r on l.id = r.id where r.kind = "path-expr";
let path-children = select r.child as id from selected-path-expressions as l join "syntax-child" as r on l.id = r.parent;
let dispatch-paths = select r.file as file, r.span as span from path-children as l join registry-nodes as r on l.id = r.id where r.kind = "path";
let qualified-dispatch-uses = select l.source as source, l.target as target, l.span as span, l.written as written, l.source-root as source-root, l.source-tail as source-tail from registry-uses as l join dispatch-paths as r on l.source = r.file and l.span = r.span;
let registry-imports = select l.source as source, l.target as target, l.span as span, l.source-root as source-root, l.source-tail as source-tail, r.binding as binding from registry-uses as l join "static-import" as r on l.source = r.file and l.span = r.span;
let dispatch-references = select l.file as file, l.span as span, l.target as target from "reference" as l join dispatch-paths as r on l.file = r.file and l.span = r.span;
let imported-dispatch-uses = select l.source as source, l.target as target, r.span as span, l.binding as written, l.source-root as source-root, l.source-tail as source-tail from registry-imports as l join dispatch-references as r on l.source = r.file and l.binding = r.target;
let dispatch-uses = union(left=qualified-dispatch-uses, right=imported-dispatch-uses);
let qualified-members = capture(from=dispatch-uses, path="written", pattern="{*member-prefix}::{name}", captures=["member-prefix", "name"]);
let qualified-member-names = select target as file, name, source-root, source-tail as registry from qualified-members;
let simple-members = select target as file, written as name, source-root, source-tail as registry from dispatch-uses;
let direct-members = union(left=qualified-member-names, right=simple-members);
let member-imports = capture(from="static-import", path="target", pattern="{*member-prefix}::{name}", captures=["member-prefix", "name"]);
let imported-members = select l.target as file, r.name as name, l.source-root as source-root, l.source-tail as registry from dispatch-uses as l join member-imports as r on l.source = r.file and l.written = r.binding;
let registered-members = union(left=direct-members, right=imported-members);
let catalog-implementations = select l.file as file, l.span as span, l.contract as contract, l.source-tail as source-tail, l.source-root as source-root, l.name as name from named-implementations as l join registered-members as r on l.file = r.file and l.name = r.name and l.source-root = r.source-root where
    (glob_any(l.contract, "{OperatorsItem,*::OperatorsItem}") and r.registry = "domain/operator/contract/registration/mod.rs")
    or (glob_any(l.contract, "{RepresentationsItem,*::RepresentationsItem}") and r.registry = "domain/table_model/types/registered_representation/value.rs");
let authorized-implementations = union(left=engine-implementations, right=catalog-implementations);
let registered-sites = select file, span from authorized-implementations;
let implementation-sites = select file, span from implementations;
let unregistered-sites = antijoin(left=implementation-sites, right=registered-sites, left-on=["file", "span"], right-on=["file", "span"]);
let implementation-proofs = select path as file from "tastemaker.placed" where (package = "idiomatic.arch" and glob_any(template, "{unit-test,item-test,value-test,composition-test,domain-test,edge-fixtures}")) or (package = "idiomatic.ryo" and template = "program-runtime-proof");
let unregistered-production = antijoin(left=unregistered-sites, right=implementation-proofs, left-on=["file"], right-on=["file"]);

let ownership-violations = union(left=invocation-boundary, right=neutral-backrefs);
let violations = union(left=ownership-violations, right=unregistered-production);
emit violations subject file key(span);
'''

[diagnostic]
primary = "span"
message = "a caller reaches the executable-program implementation"
help = "Domain primitives must use borrowed semantic interfaces and cannot call application owners or facades. Application and inbound callers must enter through preparation, protocol and outer file/project entry contracts; keep dispatch, admission and registration in their declared owners."

[given]
include = ["src/**"]
files.'Cargo.toml' = '''
[package]
name = "program_boundary_fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = 'pub mod application; pub mod domain;'
files.'src/application.rs' = 'pub mod file_dag; pub mod caller;'
files.'src/application/file_dag.rs' = 'pub mod program; pub mod executor; pub mod execution; pub mod derived; pub mod relations;'
files.'src/application/file_dag/program/mod.rs' = 'pub mod preparation; pub mod rule_outcome; pub mod runtime; pub mod admission; pub mod restored; pub mod kernel_session; pub mod request_identity; pub mod facade_runtime; pub mod positions; pub mod selection;'
files.'src/application/file_dag/program/facade_runtime/mod.rs' = 'pub mod source_admission;'
files.'src/application/file_dag/program/facade_runtime/source_admission/mod.rs' = "pub fn raw_admit() {} use super::super::admission::Inputs; pub struct SourceInputs; impl Inputs for SourceInputs {}"
files.'src/application/file_dag/program/preparation/mod.rs' = 'pub mod types; pub mod service;'
files.'src/application/file_dag/program/preparation/types.rs' = 'pub struct PreparedProgram;'
files.'src/application/file_dag/program/preparation/service.rs' = 'pub fn invoke() {}'
files.'src/application/file_dag/program/rule_outcome/mod.rs' = 'pub mod types; pub mod service;'
files.'src/application/file_dag/program/rule_outcome/types.rs' = 'pub struct LogicalCounts;'
files.'src/application/file_dag/program/rule_outcome/service.rs' = 'pub fn validate() {}'
files.'src/application/file_dag/program/runtime/mod.rs' = 'pub mod types; pub mod service;'
files.'src/application/file_dag/program/runtime/types.rs' = 'pub struct WorkCount;'
files.'src/application/file_dag/program/runtime/service.rs' = "pub struct KernelPermit; pub fn execute() {} pub trait KernelInvocation {}"
files.'src/application/file_dag/program/admission/mod.rs' = "pub struct Permit; pub trait Inputs {}"
files.'src/application/file_dag/program/restored/mod.rs' = 'pub fn restore() {}'
files.'src/application/file_dag/program/kernel_session/mod.rs' = "pub fn dispatch() {} use super::runtime::service::KernelInvocation; pub struct KernelSession; impl KernelInvocation for KernelSession {}"
files.'src/application/file_dag/program/request_identity/mod.rs' = 'pub struct RequestId;'
files.'src/application/file_dag/executor/mod.rs' = "pub fn bridge() {} pub trait PrimitiveExecutor {}"
files.'src/application/file_dag/execution/mod.rs' = "pub mod lease; use super::executor::PrimitiveExecutor; use crate::domain::operator::contract::types::PrimitiveSemantics; pub struct CommonOperatorEngine; impl PrimitiveExecutor for CommonOperatorEngine {} pub struct PrimitiveSemanticsBridge; impl PrimitiveSemantics for PrimitiveSemanticsBridge {}"
files.'src/application/file_dag/execution/lease/mod.rs' = 'pub fn bridge() {}'
