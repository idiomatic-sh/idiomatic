description = "A contract's answer that the language lacks a relation, `AbsenceCause::NoSuchConstruct` or `AbsenceCause::NoManifests`, cites the standard: a comment in the method says `standard:` and names the document and section that lacks it."
why = "`NoSuchConstruct` says the language has no such construct and `NoManifests` that it has no project manifest, and the only evidence that is not the author's say-so is the standard that defines the language: its grammar or its reference has no function, no decorator, no macro, and its tooling no manifest file. An answer that does not cite it is an unfinished reading hidden as an absence, which is what `NotYetRead` is for, and nothing then tells a reviewer which of the two it is. So each method that answers either carries a comment `// standard: <document>, <section>: <why it has none>` in its body. The evidence is a comment token inside the function that holds the identifier `NoSuchConstruct` or `NoManifests`; one comment may stand for the function's one answer. Not seen: whether the document and section named are right; a reviewer reads them against the pinned standard."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let functions = select * from tree-nodes where kind = "fn";
let idents = select * from tree-tokens where kind = "ident";
let absent = select * from idents where glob_any(text, "{NoSuchConstruct,NoManifests}");
let comments = select * from tree-tokens where kind = "comment";
let cites = select * from comments where glob_any(text, "*standard:*");
let absent-holders = axis(from=absent, relation="syntax-child", direction=ancestor, domain=functions);
let cite-holders = axis(from=cites, relation="syntax-child", direction=ancestor, domain=functions);
let holders = project(from=absent-holders, columns=["related"]);
let citing = project(from=cite-holders, columns=["related"]);
let uncited = antijoin(left=holders, right=citing, left-on=["related"], right-on=["related"]);
let located = select l."related" as "id", r."file" as "file", r."span" as "span" from uncited as l join functions as r on l."related" = r."id";
emit located subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this method answers that the language lacks a relation without citing the standard"
help = "Write `// standard: <document>, <section>: <why it has none>` in the method, naming the pinned document and the section of the standard that lacks the construct. A construct or a manifest the language has and the reader does not read yet is `NotYetRead`, never `NoSuchConstruct` or `NoManifests`. An ignore is never the fix."

[given]
include = ['contract.rs']

[[scenarios]]
id = 'method-cites-standard-s-document-section'
scenario = "A method that cites the standard's document and section."
given.files.'contract.rs' = '''
impl Parse for ParseContract {
    fn function(&self) -> Support<Reader<languages::Function, ()>> {
        // standard: the CSS Syntax Module Level 3, section 5, has no function declaration.
        languages::absent(AbsenceCause::NoSuchConstruct)
    }

    fn mapping(&self) -> Support<Reader<languages::Mapping, ()>> {
        languages::absent(AbsenceCause::NotAKeyedDocument)
    }
}
'''

[[scenarios]]
id = 'other-reasons-need-none'
scenario = 'The other reasons need no citation.'
given.files.'contract.rs' = '''
impl Parse for ParseContract {
    fn assigns(&self) -> Support<Reader<languages::Assigns, ()>> {
        languages::absent(AbsenceCause::NotYetRead)
    }

    fn prose(&self) -> Support<Reader<languages::Prose, ()>> {
        languages::absent(AbsenceCause::NotADocument)
    }
}
'''

[[scenarios]]
id = 'method-no-comment'
scenario = 'A method with no comment.'
given.files.'contract.rs' = '''
impl Parse for ParseContract {
    fn function(&self) -> Support<Reader<languages::Function, ()>> {
        languages::absent(AbsenceCause::NoSuchConstruct)
    }
}
'''
then.findings = [
  { path = 'contract.rs', line = 2 },
]

