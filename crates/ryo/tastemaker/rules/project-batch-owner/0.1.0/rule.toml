description = "Core project evaluation enters through the sealed application batch adapter."
why = "The core application captures the authoritative ordinary Todo inventory or named selected batch before preparation. Its private preparation owner issues SealedBatch only after every occurrence is ready or explicitly failed; Rust forbids forging that capability. Since core also depends on execution's public SDK, resolved references to its project entry contracts and static evaluate calls must meet the one application adapter. Aliases, qualified calls and newly added modules receive the same check. Placed unit/contract proofs may exercise the public SDK. This guard associates resolved project-contract users and evaluate calls in a file; it cannot infer receiver types through macros or prove declaration coverage, which the sealed owner and real runtime controls establish. Public SDK singleton clients in other crates are outside this core-only placement."
query = '''
let paths = capture(from="source-dependency", path="source", pattern="{*source-root}/{*source-tail}", captures=["source-root", "source-tail"]);
let project-targets = capture(from=paths, path="target", pattern="{*target-root}/inbound/use_cases/execution/{part}.rs", captures=["target-root", "part"]);
let project-users = select source as file, source-tail from project-targets where glob_any(source-root, "{src,**/core/src}") and glob_any(part, "{interface,types}");
let calls = select file, span from "static-call" where glob_any(target, "{evaluate,*::evaluate}");
let project-calls = select l.file as file, l.source-tail as source-tail, r.span as span from project-users as l join calls as r on l.file = r.file;
let outsiders = select file, span from project-calls where source-tail != "application/cross_file/service.rs";
let proof-files = select path as file from "tastemaker.placed" where glob_any(template, "{unit-test,item-test,value-test,composition-test,domain-test,edge-fixtures,program-runtime-proof}");
let forbidden = antijoin(left=outsiders, right=proof-files, left-on=["file"], right-on=["file"]);
emit forbidden subject file key(span);
'''
[diagnostic]
primary = "span"
message = "project stage execution bypasses the sealed core batch adapter"
help = "Capture the authoritative declared inventory with cross_file::preparation, account for every occurrence, and submit its SealedBatch to CrossFile::evaluate_batch. Keep SDK route proofs in normally registered test roles."
[given]
include = ["src/**"]
files.'Cargo.toml' = '''
[package]
name = "batch_owner_control"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = 'pub mod application; pub mod inbound;'
files.'src/application.rs' = 'pub mod cross_file; pub mod caller;'
files.'src/application/cross_file.rs' = 'pub mod service;'
files.'src/application/cross_file/service.rs' = 'use crate::inbound::use_cases::execution::interface::ProjectRootExecution; pub fn submit(stage: &impl ProjectRootExecution) { stage.evaluate(); }'
files.'src/application/caller.rs' = 'pub fn ordinary() {}'
files.'src/inbound.rs' = 'pub mod use_cases;'
files.'src/inbound/use_cases.rs' = 'pub mod execution;'
files.'src/inbound/use_cases/execution.rs' = 'pub mod interface; pub mod types;'
files.'src/inbound/use_cases/execution/interface.rs' = 'pub trait ProjectRootExecution { fn evaluate(&self); }'
files.'src/inbound/use_cases/execution/types.rs' = 'pub struct ProjectPhase;'
[[scenarios]]
id = "authorized-sealed-adapter"
scenario = "The sole adapter may invoke the actual project contract."
[[scenarios]]
id = "aliased-project-trait"
scenario = "Renaming the resolved project trait does not authorize a consumer."
given.files.'src/application/caller.rs' = 'use crate::inbound::use_cases::execution::interface::ProjectRootExecution as Roots; pub fn bypass(stage: &impl Roots) { stage.evaluate(); }'
then.findings = [{path="src/application/caller.rs",line=1}]
[[scenarios]]
id = "qualified-project-call"
scenario = "A qualified call cannot bypass the core adapter."
given.files.'src/application/caller.rs' = 'pub fn bypass<T: crate::inbound::use_cases::execution::interface::ProjectRootExecution>(stage: &T) { crate::inbound::use_cases::execution::interface::ProjectRootExecution::evaluate(stage); }'
then.findings = [{path="src/application/caller.rs",line=1}]
[[scenarios]]
id = "new-module-project-call"
scenario = "A newly registered production module receives the same boundary."
given.files.'src/application.rs' = 'pub mod cross_file; pub mod caller; pub mod new_route;'
given.files.'src/application/new_route.rs' = 'use crate::inbound::use_cases::execution::interface::ProjectRootExecution; pub fn bypass(stage: &impl ProjectRootExecution) { stage.evaluate(); }'
then.findings = [{path="src/application/new_route.rs",line=1}]
[[scenarios]]
id = "import-without-dispatch"
scenario = "The constructor's preparation can name project contracts without dispatching."
given.files.'src/application/caller.rs' = 'use crate::inbound::use_cases::execution::interface::ProjectRootExecution; pub fn prepare(_stage: &impl ProjectRootExecution) {}'
[[scenarios]]
id = "unplaced-test-name-does-not-authorize"
scenario = "A test-looking filename alone cannot authorize raw project calls."
given.files.'src/application/cross_file.rs' = 'pub mod service; #[cfg(test)] mod service_test;'
given.files.'src/application/cross_file/service_test.rs' = 'use crate::inbound::use_cases::execution::interface::ProjectRootExecution; pub fn check(stage: &impl ProjectRootExecution) { stage.evaluate(); }'
then.findings = [{path="src/application/cross_file/service_test.rs",line=1}]
[[scenarios]]
id = "placed-public-contract-proof"
scenario = "A normally registered placed unit proof may exercise the public project SDK."
given.files.'src/application/cross_file.rs' = 'pub mod service; #[cfg(test)] mod service_test;'
given.files.'src/application/cross_file/service_test.rs' = 'use crate::inbound::use_cases::execution::interface::ProjectRootExecution; pub fn check(stage: &impl ProjectRootExecution) { stage.evaluate(); }'
given.files.'tastemaker.toml' = '''
workspace = { name = "proof", dependencies = [{ package = "idiomatic.ryo", path = "../../.." }] }
rules = [{ rule = "idiomatic.ryo/project-batch-owner", include = ["src/**"] }]
templates = [{ template = "idiomatic.arch/unit-test", file = "src/application/cross_file/service_test.rs", params = { kind = "concept", part = "cross_file" } }]
'''
then.only = ["idiomatic.ryo/project-batch-owner"]
