description = "A language uses the SDK at runtime and may use the shared benchmark and its contract crate only as development dependencies."
why = "A language implements the contract the SDK exposes and nothing else of ryo's. The macro that lists the catalog and the types of the engine are in the engine's own crates; a language that depends on one of them can answer every relation in one line of macro, so that a relation added to the catalog is no longer a compile error in it, and can read what the SDK keeps from it (orchestrator ruling on the review of 74b44edcca). The crates of ryo are named by their key in the manifest and by their package, so a rename is found as well."

query = '''
let all-entries = project(from="entry", columns=["file", "owner", "occurrence", "key", "decoded"]);
let dev-headings = select * from all-entries where key = "dev-dependencies";
let dev-tables = select r."id" as "table" from dev-headings as l join "mapping" as r on l."occurrence" = r."owner";
let dev-dependencies = select r."occurrence" as "dependency" from dev-tables as l join all-entries as r on l."table" = r."owner";
let bodies = select r."id" as "body", l."dependency" as "dependency" from dev-dependencies as l join "mapping" as r on l."dependency" = r."owner";
let benchmark-packages = select * from all-entries where key = "package" and glob_any(decoded, "{idiomatic-sh-ryo-benchmark,idiomatic-sh-ryo-benchmark-contracts}");
let allowed = select l."dependency" as "occurrence", r."occurrence" as "package" from bodies as l join benchmark-packages as r on l."body" = r."owner";
let allowed-keys = project(from=allowed, columns=["occurrence"]);
let allowed-packages = select l."package" as "occurrence" from allowed as l;
let exemptions = union(left=allowed-keys, right=allowed-packages);
let entries = antijoin(left=all-entries, right=exemptions, left-on=["occurrence"], right-on=["occurrence"]);
let own = select * from entries where key = "name";
let named = select * from entries where glob_any(key, "{ryo_*,idiomatic-sh-ryo-*}");
let named-keys = project(from=named, columns=["file", "key"]);
let self-keys = select l."file" as "file", l."key" as "key" from named as l join own as r on l."key" = r."decoded";
let others = antijoin(left=named-keys, right=self-keys, left-on=["file", "key"], right-on=["file", "key"]);
let packages = select * from entries where key = "package";
let renamed = select * from packages where glob_any(decoded, "idiomatic-sh-ryo-*");
let renamed-names = project(from=renamed, columns=["file", "decoded"]);
let sdk = select * from renamed where decoded = "idiomatic-sh-ryo-sdk";
let sdk-names = project(from=sdk, columns=["file", "decoded"]);
let engine-names = antijoin(left=renamed-names, right=sdk-names, left-on=["file", "decoded"], right-on=["file", "decoded"]);
let self-packages = select l."file" as "file", l."decoded" as "decoded" from renamed as l join own as r on l."decoded" = r."decoded";
let others-renamed = antijoin(left=engine-names, right=self-packages, left-on=["file", "decoded"], right-on=["file", "decoded"]);
let by-key = project(from=others, columns=["file"]);
let by-package = project(from=others-renamed, columns=["file"]);
let rows = union(left=by-key, right=by-package);
emit rows subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "the language depends on a private ryo crate or uses the benchmark outside dev-dependencies"
help = "Depend on `ryo` (package `idiomatic-sh-ryo-sdk`) alone and name what you need through `ryo::languages`. The engine's crates are the engine's. An ignore is never the fix."

[given]
include = ['**']

[[scenarios]]
id = 'manifest-depends-ryo'
scenario = 'The manifest depends on ryo.'
given.files.'demo/Cargo.toml' = '''
[package]
name = "idiomatic-sh-ryo-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk" }

[dev-dependencies]
idiomatic-sh-ryo-demo = { path = ".", features = ["fixtures"] }
'''

[[scenarios]]
id = 'depends-on-the-engine'
scenario = 'The manifest depends on the language crate.'
given.files.'demo/Cargo.toml' = '''
[package]
name = "idiomatic-sh-ryo-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk" }
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../../crates/language" }
'''
then.findings = [
  { path = 'demo/Cargo.toml' },
]

[[scenarios]]
id = 'renames-the-engine'
scenario = 'The manifest renames a crate of the engine.'
given.files.'demo/Cargo.toml' = '''
[package]
name = "idiomatic-sh-ryo-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk" }
engine = { package = "idiomatic-sh-ryo-core", path = "../../crates/core" }
'''
then.findings = [
  { path = 'demo/Cargo.toml' },
]

[[scenarios]]
id = 'benchmark-development'
