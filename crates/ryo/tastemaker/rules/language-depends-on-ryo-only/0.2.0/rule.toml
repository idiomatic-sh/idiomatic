version = "0.1.0"
[dev-dependencies]
ryo_benchmark = { package = "idiomatic-sh-ryo-benchmark", path = "../../crates/benchmark" }
'''

[[scenarios]]
id = 'renamed-benchmark-development'
scenario = 'Checks renamed-benchmark-development dependency ownership.'
given.files.'demo/Cargo.toml' = '''
