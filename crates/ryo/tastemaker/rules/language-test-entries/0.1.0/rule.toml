description = "A language's manifest declares its two closed tests as targets of their own, `conformance` and `allocation`, each without the libtest harness."
why = "The conformance and the allocation row are files a language holds closed (the language spec's templates), and a file Cargo never builds proves nothing. With the tests found by their directory, deleting a `[[test]]` entry, or its `harness = false`, leaves the file byte-identical to its template and makes `cargo test` skip it, or run it as a libtest binary with no test in it, and report green. The manifest says each target by name, and this rule holds that it does."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let manifests = capture(from=listed-files, path="file", pattern="{*root}/Cargo.toml", captures=["root"]);
let entries = project(from="entry", columns=["file", "owner", "occurrence", "key", "kind", "decoded", "text"]);
let documents = select * from tree-nodes where kind = "toml";
let test-keys = select * from entries where key = "test";
let test-roots = select l."occurrence" as "entry" from test-keys as l join documents as r on l."owner" = r."id";
let elements = select l."occurrence" as "element", l."owner" as "entry" from "sequence-element" as l;
let test-elements = select r."element" as "element" from test-roots as l join elements as r on l."entry" = r."entry";
let members = select * from "mapping" where kind = "sequence-member";
let test-tables = select r."id" as "table" from test-elements as l join members as r on l."element" = r."owner";
let names = select * from entries where key = "name";
let harnesses = select * from entries where key = "harness";
let off = select * from harnesses where text = "false";
let conformance-names = select * from names where decoded = "conformance";
let conformance-targets = select l."file" as "file", l."owner" as "owner" from conformance-names as l join test-tables as r on l."owner" = r."table";
let conformance-wired = select l."file" as "file" from conformance-targets as l join off as r on l."owner" = r."owner";
let allocation-names = select * from names where decoded = "allocation";
let allocation-targets = select l."file" as "file", l."owner" as "owner" from allocation-names as l join test-tables as r on l."owner" = r."table";
let allocation-wired = select l."file" as "file" from allocation-targets as l join off as r on l."owner" = r."owner";
let no-conformance = antijoin(left=manifests, right=conformance-wired, left-on=["file"], right-on=["file"]);
let no-allocation = antijoin(left=manifests, right=allocation-wired, left-on=["file"], right-on=["file"]);
let missing-conformance = extend(from=no-conformance, values={"target": "conformance"});
let missing-allocation = extend(from=no-allocation, values={"target": "allocation"});
let p1 = project(from=missing-conformance, columns=["file", "target"]);
let p2 = project(from=missing-allocation, columns=["file", "target"]);
let rows = union(left=p1, right=p2);
emit rows subject "file" key("file", "target");
'''

[diagnostic]
primary = "file"
message = "the manifest declares no `[[test]]` target `{target}` with `harness = false`"
help = "Add `[[test]]` with `name = \"{target}\"` and `harness = false` to the manifest, beside the closed `tests/{target}.rs` it runs. An ignore is never the fix."

[given]
include = ['**']

[[scenarios]]
id = 'both-tests-declared-without-harness'
scenario = 'Both tests are declared without the harness.'
given.files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[[test]]
name = "conformance"
harness = false

[[test]]
name = "allocation"
harness = false
'''

[[scenarios]]
id = 'no-conformance'
scenario = 'The conformance target is gone.'
given.files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[[test]]
name = "allocation"
harness = false
'''
then.findings = [
  { path = 'demo/Cargo.toml' },
]

[[scenarios]]
id = 'no-allocation'
scenario = 'The allocation target is gone.'
given.files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[[test]]
name = "conformance"
harness = false
'''
then.findings = [
  { path = 'demo/Cargo.toml' },
]

[[scenarios]]
id = 'allocation-with-harness'
scenario = 'The allocation target has the harness.'
given.files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[[test]]
name = "conformance"
harness = false

[[test]]
name = "allocation"
'''
then.findings = [
  { path = 'demo/Cargo.toml' },
]
