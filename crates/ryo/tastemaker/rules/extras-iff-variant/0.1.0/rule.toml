description = "A language has the concept `extras` exactly when its kind enum has an `Extra` variant."
why = "A language's kinds are the nodes and the tokens of its standard; a kind the standard lacks and the parser library produces is an extra, and it is named, with the reason the standard lacks it, in the concept `extras`. The concept and the `Extra` variant are one fact: a variant without the concept leaves the kinds unnamed, and a concept without the variant names kinds nothing reads. The rule compares the two, so neither can be written without the other."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let idents = select * from tree-tokens where kind = "ident";
let extra-idents = select * from idents where text = "Extra";
let names = select * from tree-nodes where kind = "name";
let variants = select * from tree-nodes where kind = "variant";
let ident-names = select l."parent" as "name", l."file" as "file" from "syntax-child" as l join extra-idents as r on l."child" = r."id";
let extra-names = select l."name" as "name", l."file" as "file" from ident-names as l join names as r on l."name" = r."id";
let name-variants = select l."parent" as "variant", l."file" as "file" from "syntax-child" as l join extra-names as r on l."child" = r."name";
let extra-variants = select l."file" as "file" from name-variants as l join variants as r on l."variant" = r."id";
let kinds = capture(from=extra-variants, path="file", pattern="{*root}/src/domain/syntax/types.rs", captures=["root"]);
let variant-roots = project(from=kinds, columns=["file", "root"]);
let extra-files = capture(from=listed-files, path="file", pattern="{*root}/src/domain/extras/{*rest}", captures=["root", "rest"]);
let extra-types = capture(from=listed-files, path="file", pattern="{*root}/src/domain/extras/types.rs", captures=["root"]);
let extra-roots = project(from=extra-types, columns=["root"]);
let concept-less = antijoin(left=variant-roots, right=extra-roots, left-on=["root"], right-on=["root"]);
let missing-concept = extend(from=concept-less, values={"problem": "the kind enum has an `Extra` variant and the language has no concept `extras`: write src/domain/extras/types.rs, the extras and why the standard lacks each"});
let variant-keys = project(from=variant-roots, columns=["root"]);
let variant-less = antijoin(left=extra-files, right=variant-keys, left-on=["root"], right-on=["root"]);
let missing-variant = extend(from=variant-less, values={"problem": "the language has a concept `extras` and its kind enum has no `Extra` variant: add the variant to src/domain/syntax/types.rs, or delete the concept"});
let p1 = project(from=missing-concept, columns=["file", "problem"]);
let p2 = project(from=missing-variant, columns=["file", "problem"]);
let rows = union(left=p1, right=p2);
emit rows subject "file" key("file", "problem");
'''

[diagnostic]
primary = "file"
message = "{problem}"
help = "A kind enum has the variant `Extra` exactly when the language has the concept `extras`. An ignore is never the fix."

[given]
include = ['**']
files.'demo/Cargo.toml' = '''
[package]
'''
files.'demo/src/domain/syntax/types.rs' = '''
pub enum Kind {
    Node(Node),
    Token(Token),
}
'''

[[scenarios]]
id = 'no-extras'
scenario = 'Neither the variant nor the concept.'

[[scenarios]]
id = 'with-extras'
scenario = 'The variant and the concept.'
given.files.'demo/src/domain/extras/types.rs' = '''
pub enum Extra { A }
'''
given.files.'demo/src/domain/syntax/types.rs' = '''
pub enum Kind {
    Node(Node),
    Token(Token),
    Extra(Extra),
}
'''

[[scenarios]]
id = 'variant-without-concept'
scenario = 'The variant without the concept.'
given.files.'demo/src/domain/syntax/types.rs' = '''
pub enum Kind {
    Node(Node),
    Token(Token),
    Extra(Extra),
}
'''
then.findings = [
  { path = 'demo/src/domain/syntax/types.rs' },
]

[[scenarios]]
id = 'concept-without-variant'
scenario = 'The concept without the variant.'
given.files.'demo/src/domain/extras/types.rs' = '''
pub enum Extra { A }
'''
then.findings = [
  { path = 'demo/src/domain/extras/types.rs' },
]
