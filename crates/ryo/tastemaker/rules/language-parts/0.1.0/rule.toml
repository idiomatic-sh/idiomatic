given.files.'demo/src/inbound/contracts/parse/contract.rs' = '''
use ryo::languages::{self, Reader, AbsenceCause, Support};

pub struct ParseUseCaseImpl;

impl languages::Parse for ParseUseCaseImpl {
    type FileModel = Model;

    fn function(&self) -> Support<Reader<languages::Function>> {
        Support::Reads(FunctionItem::READER)
    }

    fn comment(&self) -> Support<Reader<languages::Comment>> {
        Support::NotInThisLanguage(AbsenceCause::NoSuchConstruct)
    }
}
'''
