description = "A language's reader is an item in `domain/<concept>/collections/<collection>/<name>/item.rs` of the concepts relations, manifests and links, and nowhere else."
why = "The author's first question is where a reader lives, and there is one answer: the item that implements `ReadItem` or `ManifestItem` is in the item folder of its collection, beside its fixtures' item_test.rs, so that the rules and the fixtures that look for items find every one. A reader in another place compiles and is held by the conformance, and every rule that looks for items does not see it; the `reads!` that writes one without code is looked for as well as the traits it implements. The marker traits in `languages::declared` are what keeps a hand-written impl from compiling by accident; a deliberate two-line marker impl still compiles, so a path through `declared` written in a language's source, which only a hand-written marker does (the macro's expansion is not source), is a finding wherever it stands."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let idents = select * from tree-tokens where kind = "ident";
let readers = select * from idents where glob_any(text, "{ReadItem,ManifestItem,READER}");
let declared-idents = select * from idents where text = "declared";
let declared-refs = select r."parent" as "node", l."file" as "file" from declared-idents as l join "syntax-child" as r on l."id" = r."child";
let declared-segments = select r."parent" as "node", l."file" as "file" from declared-refs as l join "syntax-child" as r on l."node" = r."child";
let declared-paths = select r."parent" as "node", l."file" as "file" from declared-segments as l join "syntax-child" as r on l."node" = r."child";
let declared-owners = select r."parent" as "node", l."file" as "file" from declared-paths as l join "syntax-child" as r on l."node" = r."child";
let path-nodes = select * from tree-nodes where kind = "path";
let qualified = select l."file" as "file" from declared-owners as l join path-nodes as r on l."node" = r."id";
let marker-paths = project(from=qualified, columns=["file"]);
let reads-idents = select * from idents where text = "reads";
let name-refs = select r."parent" as "node", l."file" as "file" from reads-idents as l join "syntax-child" as r on l."id" = r."child";
let segments = select r."parent" as "node", l."file" as "file" from name-refs as l join "syntax-child" as r on l."node" = r."child";
let paths = select r."parent" as "node", l."file" as "file" from segments as l join "syntax-child" as r on l."node" = r."child";
let owners = select r."parent" as "node", l."file" as "file" from paths as l join "syntax-child" as r on l."node" = r."child";
let macro-calls = select * from tree-nodes where kind = "macro-call";
let reads-calls = select l."file" as "file" from owners as l join macro-calls as r on l."node" = r."id";
let placed = capture(from=readers, path="file", pattern="{*root}/src/domain/{concept}/collections/{collection}/{reader}/item.rs", captures=["root", "concept", "collection", "reader"]);
let rightful = select * from placed where glob_any(concept, "{relations,manifests,links}");
let right-paths = project(from=rightful, columns=["file"]);
let placed-calls = capture(from=reads-calls, path="file", pattern="{*root}/src/domain/{concept}/collections/{collection}/{reader}/item.rs", captures=["root", "concept", "collection", "reader"]);
let rightful-calls = select * from placed-calls where glob_any(concept, "{relations,manifests,links}");
let right-call-paths = project(from=rightful-calls, columns=["file"]);
let reader-paths = project(from=readers, columns=["file"]);
let call-paths = project(from=reads-calls, columns=["file"]);
let outside-idents = antijoin(left=reader-paths, right=right-paths, left-on=["file"], right-on=["file"]);
let outside-calls = antijoin(left=call-paths, right=right-call-paths, left-on=["file"], right-on=["file"]);
let outside-reads = union(left=outside-idents, right=outside-calls);
let outside = union(left=outside-reads, right=marker-paths);
emit outside subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "a reader is outside an item folder, or a `declared` marker is written by hand"
help = "Move the item that implements `ReadItem` or `ManifestItem` to `src/domain/<concept>/collections/<collection>/<name>/item.rs`, the concept being relations, manifests or links,. Only `reads!` and `reads_manifest!` implement the markers of `languages::declared`; delete a hand-written impl of one. An ignore is never the fix."

[given]
include = ['**']
files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'in-an-item'
scenario = 'The reader is in an item folder.'
given.files.'demo/src/domain/relations/collections/relations/function/item.rs' = '''
pub struct FunctionItem;

impl ReadItem for FunctionItem {
    const READER: u8 = 0;
}
'''

[[scenarios]]
id = 'in-another-concept'
scenario = 'The reader is in another concept.'
given.files.'demo/src/domain/scopes/collections/scopes/function/item.rs' = '''
pub struct FunctionItem;

impl ReadItem for FunctionItem {
    const READER: u8 = 0;
}
'''
then.findings = [
  { path = 'demo/src/domain/scopes/collections/scopes/function/item.rs' },
]

[[scenarios]]
id = 'macro-in-an-item'
scenario = 'The reads macro is in an item folder.'
given.files.'demo/src/domain/relations/collections/relations/function/item.rs' = '''
ryo::reads! {
    FunctionItem => ryo::languages::Function {
        row: [ryo::languages::FunctionRow],
        kinds: [KIND],
        columns: { id: node },
    }
}
'''

[[scenarios]]
id = 'macro-in-another-concept'
scenario = 'The reads macro is in another concept.'
given.files.'demo/src/domain/scopes/collections/scopes/function/item.rs' = '''
ryo::reads! {
    FunctionItem => ryo::languages::Function {
        row: [ryo::languages::FunctionRow],
        kinds: [KIND],
        columns: { id: node },
    }
}
'''
then.findings = [
  { path = 'demo/src/domain/scopes/collections/scopes/function/item.rs' },
]

[[scenarios]]
id = 'macro-unqualified-outside'
scenario = 'The reads macro is called without its path, outside an item folder.'
given.files.'demo/src/domain/declarations/item.rs' = '''
reads! {
    FunctionItem => ryo::languages::Function {
        row: [ryo::languages::FunctionRow],
        kinds: [KIND],
        columns: { id: node },
    }
}
'''
then.findings = [
  { path = 'demo/src/domain/declarations/item.rs' },
]

[[scenarios]]
id = 'marker-by-hand'
scenario = 'A marker of the sealed traits is written by hand, even in an item folder.'
given.files.'demo/src/domain/relations/collections/relations/function/item.rs' = '''
pub struct FunctionItem;

impl ryo::languages::declared::Syntax for FunctionItem {}

impl ReadItem for FunctionItem {
    const READER: u8 = 0;
}
'''
then.findings = [
  { path = 'demo/src/domain/relations/collections/relations/function/item.rs' },
]
