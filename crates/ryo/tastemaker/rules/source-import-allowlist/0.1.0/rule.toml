description = "A provider source composition cannot widen its language's declared imports."
why = "The language root owns the parser and pure dependency declarations. Source allowances are derived data, not an independent permission grant."
query = '''
param libraries: set<string>;
param extra: set<string>;
let allowances = select occurrence from "entry" where key = "imports-allow";
let items = select r.file as file, r.span as span, r.kind as kind, r.decoded as decoded from allowances as l join "sequence-element" as r on l.occurrence = r.owner;
let denied = select * from items where kind != "string" or (decoded not in $libraries and decoded not in $extra);
emit denied subject file key(span);
'''
[params]
libraries = { type = "set<string>", description = "Parser import patterns declared at the language root." }
extra = { type = "set<string>", description = "Pure dependency import patterns declared at the language root." }
[diagnostic]
primary = "span"
message = "source import allowance is outside its language declaration"
help = "Regenerate source allowances from the language composition. Keep parser dependencies governed by client-at-adapter."
[given]
include = ["source.toml"]
params = { libraries = ["demo_parser::*"], extra = ["indexmap::*"] }
[[scenarios]]
id = "declared-allowances"
scenario = "Parser and pure dependencies come from the parent declaration."
given.files.'source.toml' = 'imports-allow = ["demo_parser::*", "indexmap::*"]'
[[scenarios]]
id = "foreign-allowance"
scenario = "A source composition cannot grant itself another crate."
given.files.'source.toml' = 'imports-allow = ["private_engine::*"]'
then.findings = [{ path = "source.toml", line = 1 }]
[[scenarios]]
id = "variable-cannot-hide-a-grant"
scenario = "A source composition cannot substitute a local variable for the checked list."
given.files.'source.toml' = 'imports-allow = [{ variable = "hidden" }]'
then.findings = [{ path = "source.toml", line = 1 }]
