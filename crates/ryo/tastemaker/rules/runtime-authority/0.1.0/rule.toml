description = "Runtime admission authority is sealed to its declaring owner concept."
why = "The runtime concept owns invocation state, permits, and semantic/physical authority. Runtime service records have strictly private fields in runtime/service.rs, and construction and retargeting are confined to the service.rs files of the runtime directory tree (runtime/**/service.rs: concept directories beneath the record module are its Rust-private descendants); independent scratch, counters and observed DTOs stay in types.rs and never depend back on issuance. The program source/proof admission module retains private admitted-input fields, while the separately qualified relation AdmittedInput proof has strictly private data in relations/admission/service.rs, with owner-dependent admission methods in its private issuance child and validates explicit owner, generation, partition and root requirements, never an interpreter object. KernelAdmission remains the unforgeable prerequisite of all three KernelPermit constructors. This AST rule rejects moved/widened representations, every visible field on every runtime issuer record including newly added records, and written named authority construction outside the runtime directory's service.rs files. It does not resolve constructor aliases or Self: those are rejected by Rust privacy on the actual production records, with independent source-overlay controls covering every catalog member. Aliased/Self field-widening scenarios prove TM rejects the representation weakening that previously made those constructions legal. Rust privacy independently resolves aliases and rejects sibling program construction or field retargeting. Constructor contracts, macro expansion and runtime admission behavior remain compiler/production obligations."
query = '''
let nodes = select id, kind, file, span from "syntax-tree" where text = "";
let tokens = select id, kind, file, span, text from "syntax-tree" where text != "";
let structs = select * from nodes where kind = "struct";
let names = select * from nodes where kind = "name";
let struct-children = select l.id as id, l.file as file, l.span as span, r.child as child from structs as l join "syntax-child" as r on l.id = r.parent;
let struct-names = select l.id as id, l.file as file, l.span as span, l.child as node from struct-children as l join names as r on l.child = r.id;
let name-children = select l.id as id, l.file as file, l.span as span, r.child as token from struct-names as l join "syntax-child" as r on l.node = r.parent;
let named-structs = select l.id as id, l.file as file, l.span as span, r.text as name from name-children as l join tokens as r on l.token = r.id;
let catalog = select * from named-structs where glob_any(name, "{KernelAdmission,KernelPermit,ReadySelection,SemanticPermit,PermittedPhysical,ProgramExecution,AdmittedInput,RuntimeState}");
let issuer-records = select * from named-structs where glob_any(file, "{src,**/src}/application/file_dag/program/runtime/**/service.rs");
let sealed = union(left=catalog, right=issuer-records);
let wrong-runtime = select file, span from sealed where name != "AdmittedInput" and not glob_any(file, "{src,**/src}/application/file_dag/program/runtime/**/service.rs");
let wrong-admission = select file, span from sealed where name = "AdmittedInput" and not glob_any(file, "{src,**/src}/application/file_dag/{program/admission.rs,relations/admission/service.rs}");
let lists = select r.child as list from sealed as l join "syntax-child" as r on l.id = r.parent;
let field-edges = select r.child as field from lists as l join "syntax-child" as r on l.list = r.parent;
let fields = select * from nodes where glob_any(kind, "{record-field,tuple-field}");
let sealed-fields = select r.id as id, r.file as file, r.span as span from field-edges as l join fields as r on l.field = r.id;
let visibilities = select * from nodes where kind = "visibility";
let visible-owners = select l.parent as id, r.id as visibility from "syntax-child" as l join visibilities as r on l.child = r.id;
let widened = select l.file as file, l.span as span from sealed-fields as l join visible-owners as r on l.id = r.id;
let records = select * from nodes where kind = "record-expr";
let paths = select * from nodes where kind = "path";
let record-children = select l.id as id, l.file as file, l.span as span, r.child as child from records as l join "syntax-child" as r on l.id = r.parent;
let record-paths = select l.id as id, l.file as file, l.span as span, l.child as path from record-children as l join paths as r on l.child = r.id;
let path-names = axis(from=paths, relation="syntax-child", direction=descendant, domain=tokens);
let authority-names = select l.id as path from path-names as l join tokens as r on l.related = r.id where r.kind = "ident" and glob_any(r.text, "{KernelAdmission,KernelPermit,ReadySelection,SemanticPermit,PermittedPhysical,ProgramExecution,RuntimeState}");
let authority-records = select l.file as file, l.span as span from record-paths as l join authority-names as r on l.path = r.path;
let foreign-issuers = select file, span from authority-records where not glob_any(file, "{src,**/src}/application/file_dag/program/runtime/**/service.rs");
let wrong-placement = union(left=wrong-runtime, right=wrong-admission);
let sealed-placement = union(left=wrong-placement, right=widened);
let violations = union(left=sealed-placement, right=foreign-issuers);
emit violations subject file key(span);
'''

[diagnostic]
primary = "span"
message = "runtime admission authority escapes its sealed owner"
help = "Keep runtime state and capability records in runtime/service.rs with strictly private fields; only the service.rs files of the runtime directory tree may construct or retarget them. Keep each qualified AdmittedInput private beside its actual admission operation. Independent DTOs stay in types.rs. Rust rejects aliases and Self constructors from parent and sibling modules."

[given]
include = ["src/**"]
files.'Cargo.toml' = '''
[package]
name = "runtime_authority_fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = 'mod application;'
files.'src/application.rs' = 'mod file_dag;'
files.'src/application/file_dag.rs' = 'mod program;'
files.'src/application/file_dag/program.rs' = 'mod runtime; mod admission; mod kernel_session;'
files.'src/application/file_dag/program/runtime/service.rs' = '''
pub(in crate::application::file_dag::program) struct KernelAdmission { execution: (), region: usize }
pub(in crate::application::file_dag::program) struct RuntimeState { generation: (), slots: () }
pub(in crate::application::file_dag::program) struct KernelPermit { region: usize }
fn issue() -> KernelAdmission { KernelAdmission { execution: (), region: 0 } }
'''
files.'src/application/file_dag/program/runtime/types.rs' = 'pub(super) struct WorkCount(pub usize);'
files.'src/application/file_dag/program/admission.rs' = 'pub(super) struct AdmittedInput { proof: () }'
files.'src/application/file_dag/program/runtime/mod.rs' = 'pub(super) mod types; pub(super) mod service;'
files.'src/application/file_dag/program/kernel_session.rs' = 'fn consume(_: &super::runtime::service::KernelPermit) {}'

[[scenarios]]
id = "private-owner-issuance"
scenario = "The runtime issues sealed authority and a sibling only borrows an existing permit."

[[scenarios]]
