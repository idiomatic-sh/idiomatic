scenario = "The sole issuer may construct its private records through aliases and Self without exposing those fields to its parent."
given.files.'src/application/file_dag/program/runtime/service.rs' = 'pub(super) struct KernelAdmission { region: usize } type Authority = KernelAdmission; impl Authority { fn issue() -> Self { Self { region: 0 } } } fn issue_alias() -> Authority { Authority { region: 0 } }'

[[scenarios]]
id = "program-proof-alias-cannot-regain-parent-fields"
scenario = "The qualified program-proof alias path cannot regain issuer-parent field access; actual Rust overlays independently reject private production-field access."
given.files.'src/application/file_dag/program/admission.rs' = 'pub(super) struct AdmittedInput { pub(super) root: usize }'
given.files.'src/application/file_dag/program.rs' = 'mod runtime; mod admission; mod kernel_session; use self::admission::AdmittedInput as Authority; fn forge(value: Authority) -> Authority { Authority { root: 0, ..value } }'
then.findings = [{ path = "src/application/file_dag/program/admission.rs", line = 1 }]

