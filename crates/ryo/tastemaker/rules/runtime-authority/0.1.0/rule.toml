given.files.'src/application/file_dag/program/kernel_session.rs' = 'fn bypass() { let _ = super::runtime::service::KernelAdmission { execution: (), region: 0 }; }'
then.findings = [{ path = "src/application/file_dag/program/kernel_session.rs", line = 1 }]

