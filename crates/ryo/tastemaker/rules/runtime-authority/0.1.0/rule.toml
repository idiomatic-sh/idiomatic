[[scenarios]]
id = "runtime-concept-directory-may-issue-authority"
scenario = "A concept directory beneath the runtime record module issues authority through its own service.rs."
given.files.'src/application/file_dag/program/runtime/service.rs' = 'pub(in crate::application::file_dag::program) struct KernelAdmission { execution: (), region: usize } mod admission;'
given.files.'src/application/file_dag/program/runtime/service/admission/mod.rs' = 'mod service;'
given.files.'src/application/file_dag/program/runtime/service/admission/service.rs' = 'fn issue() -> super::super::KernelAdmission { super::super::KernelAdmission { execution: (), region: 0 } }'

[[scenarios]]
id = "runtime-concept-directory-record-cannot-be-widened"
scenario = "A record declared in a concept directory's service.rs is an issuer record too and keeps strictly private fields."
given.files.'src/application/file_dag/program/runtime/service/admission/service.rs' = 'pub(super) struct Cursor { pub(super) region: usize }'
then.findings = [{ path = "src/application/file_dag/program/runtime/service/admission/service.rs", line = 1 }]

[[scenarios]]
id = "runtime-concept-directory-non-service-file-cannot-issue"
scenario = "Only the service.rs files of the runtime directory tree issue authority; another file in a concept directory is rejected."
given.files.'src/application/file_dag/program/runtime/service/admission/mod.rs' = 'mod service; mod types;'
given.files.'src/application/file_dag/program/runtime/service/admission/types.rs' = 'fn bypass() { let _ = super::super::KernelAdmission { execution: (), region: 0 }; }'
then.findings = [{ path = "src/application/file_dag/program/runtime/service/admission/types.rs", line = 1 }]

[[scenarios]]
id = "directory-lookalike-outside-runtime-cannot-issue"
scenario = "A service.rs outside the runtime directory, even one whose directory name begins with runtime, cannot issue authority."
given.files.'src/application/file_dag/program.rs' = 'mod runtime; mod admission; mod kernel_session; mod runtime_shadow;'
given.files.'src/application/file_dag/program/runtime_shadow/service.rs' = 'fn bypass() { let _ = super::runtime::service::KernelAdmission { execution: (), region: 0 }; }'
then.findings = [{ path = "src/application/file_dag/program/runtime_shadow/service.rs", line = 1 }]
