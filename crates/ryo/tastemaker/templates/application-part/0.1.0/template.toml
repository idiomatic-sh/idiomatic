description = "One explicitly placed nested part of a cohesive application operation."
why = "An application service may keep its publication algorithm and its behavioral test in named nested files. Exact placement admits those parts without opening the whole directory; the outbound port and the test still carry the behavior proof. This template is placement only, not an authority or privacy proof."
content = '''
//! A declared part of the owning application operation.
'''

[[scenarios]]
id = "declared-nested-part"
scenario = "The declared publication part contains real application work."
given.file = "publication.rs"
given.files."publication.rs" = '''
//! A declared part of the owning application operation.
pub fn publish() -> usize { 1 }
'''

[[scenarios]]
id = "missing-nested-part"
scenario = "A required declared part cannot disappear silently."
given.file = "publication.rs"
then.findings = [{ rule = "#count", path = "tastemaker.toml" }]
