description = "One exact pure borrowed native-position operator family."
why         = "These four declared families consume engine-admitted position borrows and return positions. Scheduling, acquisition, publication and release stay with the application executable-program owner. The template admits only its exact listed files; dependency and Rust contracts guard behavior separately."
content     = ''

[[scenarios]]
id       = "file-holds-the-content"
scenario = "A placed file that holds the template's content has no finding."
given.file = "example.rs"
given.files."example.rs" = ""

[[scenarios]]
id       = "file-is-missing"
scenario = "A placed file that is missing is reported."
given.file = "example.rs"
then.findings = [{ rule = "#count", path = "tastemaker.toml" }]
