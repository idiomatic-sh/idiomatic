description = "The provider source import allowance, derived from its language composition."
why = "Parser libraries are declared once at the language root. The source scope receives the same allowances while the root still prevents parser imports in domains and integration tests."
content = '''
imports-allow = {{ libraries[:-1] }}{% if extra != "[]" %}, {{ extra[1:] }}{% else %}]{% endif %}
'''
[params]
libraries = { type = "list<string>", description = "Parser clients declared by the language root." }
extra = { type = "list<string>", description = "Pure dependencies permitted outside parser adapters." }
[given]
file = "own.toml"
params = { libraries = ["demo_parser::*"], extra = ["indexmap::*"] }
[[scenarios]]
id = "derived-allowances-match"
scenario = "The generated scope agrees with its parent declaration."
given.files.'own.toml' = 'imports-allow = ["demo_parser::*", "indexmap::*"]'
[[scenarios]]
id = "missing-source-allowances"
scenario = "The generated source policy is mandatory."
then.findings = [{ rule = "provider-allowances#count", path = "tastemaker.toml" }]
