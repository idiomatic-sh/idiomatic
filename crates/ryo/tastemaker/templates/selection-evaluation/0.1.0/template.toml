description = "One exact shared tree-selection evaluator."
why         = "Selection uses one source-order candidate scan for ordinary and borrowed native execution. The file computes comparison meaning only; the application owns work counters and publication. This exact placement keeps that shared semantic part visible without opening the whole concept."
content     = ''

[[scenarios]]
id       = "file-holds-the-content"
scenario = "A placed file that holds the template's content has no finding."
given.file = "example.rs"
given.files."example.rs" = ""

[[scenarios]]
id       = "file-is-missing"
scenario = "A placed file that is missing is reported."
given.file = "example.rs"
then.findings = [{ rule = "#count", path = "tastemaker.toml" }]
