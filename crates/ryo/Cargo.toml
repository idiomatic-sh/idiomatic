[workspace]
members = ["cli", "crates/benchmark", "crates/benchmark_contracts", "crates/core", "crates/derived", "crates/execution", "crates/execution_domain", "crates/execution_runtime", "crates/execution_store", "crates/language", "crates/matching", "crates/operators", "crates/query_language", "crates/relations", "crates/sdk", "crates/values", "languages/*", "languages/python/benchmarks/linters/ruff"]
resolver = "3"
# The languages not yet written: each joins the workspace, the command line and the build when its author starts it, and the compiler
# then lists what its use cases lack. Their directories stay, with the part of each that a scaffold places.

# The SDK's public API is held by the gate (step `sdk-api`): no type of an internal crate is reachable from it, it is the one recorded in
# `listing`, and semver-checks finds nothing broken against its baseline. The baseline is the SDK's published crates.io version; until
# the first publish there is none, and `baseline-rev`, a revision of this repository, stands in for it. `allow` is what the SDK exposes
# of an internal crate, each entry with its reason beside it.
[workspace.metadata.api]
package = "idiomatic-sh-ryo-sdk"
library = "ryo"
nightly = "nightly-2026-08-01"
listing = "crates/sdk/api.txt"
baseline-rev = "e48028e553"
allow = [
  # The deliberate language-author contract, versioned and semver-checked with the SDK.
  "ryo::resources::languages",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/idiomatic-sh/idiomatic"

[workspace.dependencies]
unicode-width = "=0.2.2"
wait4 = "=0.2.0"
sha2 = "=0.10.9"
ignore = "=0.4.33"
rayon = "=1.12.0"
memchr = "=2.8.3"
num-bigint = "=0.4.8"
globset = "=0.4.18"
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std", "unicode"] }
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "meta", "hybrid", "unicode"] }
dhat = "=0.3.3"
# The allocators ruff and uv ship, pinned as ruff pins them: jemalloc where it builds, mimalloc on Windows (mimalloc v2: v3.3.2
# crashes on Windows CPUs without POPCNT).
mimalloc = { version = "=0.1.52", default-features = false, features = ["v2"] }
tikv-jemallocator = { version = "=0.6.1", default-features = false, features = ["background_threads_runtime_support"] }
hashbrown = "=0.17.1"
indexmap = "=2.14.2"
heck = "=0.5.0"
rustc-hash = "=2.1.3"
strum = { version = "=0.27.2", features = ["derive"] }
winnow = "=0.7.15"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
anstream = "=1.0.0"
cargo_metadata = "=0.23.1"
cargo-platform = "=0.3.3"
clap = { version = "=4.6.6", features = ["color", "derive", "wrap_help"] }
cpu-time = "=1.0.0"
cucumber = "=0.23.0"
divan = "=0.1.21"
dunce = "=1.0.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
blake3 = "=1.8.6"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
trybuild = "=1.0.120"
toml = "=1.1.4"
trycmd = "=0.15.11"
tracing = "=0.1.44"
tracing-chrome = "=0.7.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
indicatif = "=0.18.6"
snapbox = { version = "0.6", features = ["cmd"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# An unknown lint is reported without a source span, which clippy-sarif drops; fail instead.
unknown_lints = "deny"
# `--cfg bless` leaves a language's expected rows out of its build, so that `--bless` can write them where they do not compile.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bless)"] }
dead_code = "deny"
private_interfaces = "deny"
unnameable_types = "deny"
# rustc's lint groups and every stable allow-by-default lint at the pinned toolchain (rustc -W help, 1.97.1).
# Left out: edition-migration lints (rust-2018-compatibility, rust-2021-*, rust-2024-*, and the 2024 lints
# if_let_rescope, impl_trait_overcaptures, tail_expr_drop_order, deprecated_safe_2024, missing_unsafe_on_extern,
# unsafe_attr_outside_unsafe, edition_2024_expr_fragment_specifier): the edition is 2024. Feature-gated at 1.97.1,
# so unknown to stable (unknown_lints is deny): unqualified_local_imports, shadowing_supertrait_items,
# resolving_to_items_shadowing_supertrait_items, non_exhaustive_omitted_patterns, must_not_suspend,
# multiple_supertrait_upcastable, fuzzy_provenance_casts, lossy_provenance_casts, deprecated_llvm_intrinsic,
# unstable_features. linker_info is diagnostic noise; unused_crate_dependencies is cargo-machete's.
# variant_size_differences is off: a variant's size against an allocation is the performance pass's trade.
unused = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
refining_impl_trait = { level = "warn", priority = -1 }
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_results = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_import_braces = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
impl_trait_redundant_captures = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
unsafe_op_in_unsafe_fn = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
dead_code_pub_in_binary = "warn"
deprecated_in_future = "warn"
deref_into_dyn_supertrait = "warn"
ffi_unwind_calls = "warn"
macro_use_extern_crate = "warn"

[workspace.lints.clippy]
# Clippy's restriction lints, at deny: a
# match names every variant, a number is converted with `From`/`TryFrom`, and nothing unwraps
# or expects outside a test.
wildcard_enum_match_arm = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
# Clippy's default groups and pedantic, in full: asymptote ratchets every finding they
# report, so no lint of theirs is allowed away here. Correctness stays
# at clippy's own deny.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
# Pedantic's two doc sections, at deny: a public function that returns a Result states its errors, one that can
# panic states when; the Rust gate failed these by hand (332 F1).
missing_errors_doc = "deny"
missing_panics_doc = "deny"
pub_use = "deny"
missing_docs_in_private_items = "warn"
# Clippy restriction lints, each chosen (never the group: blanket_clippy_restriction_lints). Off, as fighting idiomatic
# code or the other side of a pair: absolute_paths, alloc_instead_of_core, arbitrary_source_item_ordering, arithmetic_side_effects,
# big_endian_bytes, decimal_literal_representation, exhaustive_enums, exhaustive_structs, float_arithmetic,
# impl_trait_in_params, implicit_return, inline_asm_x86_intel_syntax, integer_division, integer_division_remainder_used,
# little_endian_bytes, missing_inline_in_public_items, missing_trait_methods, module_name_repetitions,
# modulo_arithmetic, non_ascii_literal, pattern_type_mismatch, pub_with_shorthand, question_mark_used,
# self_named_module_files, semicolon_outside_block, separated_literal_suffix, shadow_reuse, shadow_same, single_call_fn,
# single_char_lifetime_names, std_instead_of_alloc, std_instead_of_core, tests_outside_test_module; panic_in_result_fn
# and unwrap_in_result, as a case table's subject returns the Err under test and must panic on a fixture that fails.
# nursery stays off.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
create_dir = "warn"
dbg_macro = "warn"
default_numeric_fallback = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
else_if_without_else = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
field_scoped_visibility_modifiers = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
host_endian_bytes = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
inline_asm_x86_att_syntax = "warn"
inline_modules = "warn"
inline_trait_bounds = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget = "warn"
min_ident_chars = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
mixed_read_write_in_expression = "warn"
multiple_inherent_impl = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
panic = "warn"
partial_pub_fields = "warn"
pathbuf_init_then_push = "warn"
pointer_format = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
semicolon_inside_block = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
# The cargo group but multiple_crate_versions: the resolved tree holds two majors of getrandom, syn, hashbrown and phf.
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[workspace.lints.rustdoc]
# Every rustdoc lint (rustdoc -W help, 1.97.1) but missing_doc_code_examples and private_doc_tests, which are
# feature-gated.
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"

[workspace.metadata.bin]
# The tools only this product runs; the shared ones are declared once, in `tools/install.py`.
cargo-semver-checks = { version = "0.51.0", locked = true }
cargo-public-api = { version = "0.52.0", locked = true, unavailable = { x86_64-unknown-linux-gnu = "no Linux prebuilt: the api group runs on macOS", aarch64-unknown-linux-gnu = "no Linux prebuilt: the api group runs on macOS" } }

# The replay of the recorded rules over ruff runs in `cargo test`: a debug build of the engine would take
# many minutes over its 10 million rows.
# The release build the measurements use: one codegen unit, fat link-time optimisation.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.dist]
inherits = "release"

[profile.gate]
inherits = "dev"

[profile.test.package.sysinfo]
opt-level = 3

[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
