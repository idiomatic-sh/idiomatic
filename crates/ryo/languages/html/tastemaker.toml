closed = false
# The html language's own placement (paths are directory-relative).
# The parser crates html reads with are declared here, once, as the variable `libraries`: `imports-allow` adds them to the
# language's allow-list, and its own `client-at-adapter` below keeps them in its syntax adapter. Its own Cargo.toml names them, and
# nothing else does.
variables = { domain-libraries = [], libraries = ["swc_html_parser::*", "swc_html_ast::*", "swc_common::*", "swc_atoms::*", "serde_json::*"] }
imports-allow = [{ variable = "libraries" }, { variable = "domain-libraries" }]
rules = [
  { rule = "idiomatic.ryo/source-import-allowlist", include = ["src/tastemaker.toml"], params = { libraries = { variable = "libraries" }, extra = { variable = "domain-libraries" } } },
  { rule = "idiomatic.arch/client-at-adapter", include = ["**"], exclude = ["**/factory.rs", "**/composition.rs", "**/*_test.rs", "**/tests/fixtures/**", "**/tests/allocation.rs", "**/tests/bdd.rs"], params = { libraries = { variable = "libraries" } } },
]
templates = [{ template = "idiomatic.ryo/provider-allowances", file = "src/tastemaker.toml", params = { libraries = { variable = "libraries" }, extra = { variable = "domain-libraries" } } }]
