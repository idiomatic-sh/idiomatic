[package]
name = "idiomatic-sh-ryo-json"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "JSON and JSON with comments language provider for Ryo"
keywords = ["json", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]

autotests = false

[lib]
name = "ryo_json"

[dependencies]
strum.workspace = true
jsonc-parser = "=0.34.0"
# The reading of a file by the standard: `serde_json` for json as the standard defines it. Only the adapter's own tests use it, behind the fixtures feature.
serde_json = { workspace = true, optional = true }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.2.0" }

[dev-dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-json = { path = ".", features = ["fixtures"] }

[[test]]
name = "numbered"

[[test]]
name = "routes"
harness = false

[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo/fixtures", "dep:serde_json"]

[lints]
workspace = true

[[test]]
name = "conformance"
harness = false
