[package]
name = "idiomatic-sh-ryo-json"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "JSON and JSON with comments language provider for Ryo"
keywords = ["json", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]

autobenches = false
autotests = false

[lib]
name = "ryo_json"

[dependencies]
strum.workspace = true
jsonc-parser = "=0.34.0"
# The oracle's readings of a file: `serde_json` for json as the standard defines it and `json5` for json with comments. Only the
# fixtures use them.
serde_json = { workspace = true, optional = true }                                       # ignore: idiomatic.arch/no-json-in-process - only the jsonc_parser adapter's oracle uses it: the language reads JSON files, and serde_json is the oracle they are compared with
json5 = { version = "=1.3.3", optional = true }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.1.2" }

[dev-dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-json = { path = ".", features = ["fixtures"] }
divan.workspace = true

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
fixtures = ["ryo/fixtures", "dep:serde_json", "dep:json5"]

[lints]
workspace = true

# Its `allocation` test target (`harness = false`) sets `dhat` as the global allocator, which machete does not see.
[package.metadata.cargo-machete]
ignored = ["dhat"]
