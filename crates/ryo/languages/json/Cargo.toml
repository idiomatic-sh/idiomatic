[package]
name = "idiomatic-sh-ryo-json"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "JSON and JSON with comments language provider for Ryo"
keywords = ["json", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]

autobenches = false
autotests = false

[lib]
name = "ryo_json"

[dependencies]
strum.workspace = true
jsonc-parser = "=0.34.0"
# The oracle's readings of a file: `serde_json` for json as the standard defines it and `json5` for json with comments. Only the
# fixtures use them.
serde_json = { workspace = true, optional = true }
json5 = { version = "=1.3.3", optional = true }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.1.4" }

[dev-dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-json = { path = ".", features = ["fixtures"] }
divan.workspace = true

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false

[[bench]]
name = "provider"
path = "benchmarks/provider/bench.rs"
harness = false

[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo/fixtures", "dep:serde_json", "dep:json5"]

[lints]
workspace = true

# Established generated parser timing identities; native CPU/RSS are not inferred from Divan.
[package.metadata.ryo.performance]
schema = "divan-timing/v1"
workloads = { generated_every_relation = [2500, 10000] }
metrics = ["median-ns"]
