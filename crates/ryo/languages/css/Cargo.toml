[package]
name = "idiomatic-sh-ryo-css"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "CSS language provider for Ryo"
keywords = ["css", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]
autobenches = false
autotests = false

[lib]
name = "ryo_css"

[dependencies]
strum.workspace = true
# Servo's CSS Syntax 3 tokenizer and rule parsers, the ones Firefox's style engine and lightningcss read with.
cssparser = "=0.38.0"
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.1.0" }

[dev-dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-css = { path = ".", features = ["fixtures"] }
divan.workspace = true

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
fixtures = ["ryo/fixtures"]

[lints]
workspace = true

# Its `allocation` test target (`harness = false`) sets `dhat` as the global allocator, which machete does not see.
[package.metadata.cargo-machete]
ignored = ["dhat"]
