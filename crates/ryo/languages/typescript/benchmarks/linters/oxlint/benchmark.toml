project-context-mode = "isolated"
# The standalone oxlint executable of the GitHub release apps_v1.76.0, built on oxc_parser 0.142.0, the parser both ryo providers
# link. Each SHA-256 is of the executable inside the release archive tools/install.py pins for the machine; the archive's own
# SHA-256 is beside it there.
tool = "oxlint"
version = "1.76.0"
sha256 = [
  # aarch64-unknown-linux-gnu
  "0e205fad5354dd63d9919f353b0999c203852656a1644d19bb19cd1602e633af",
  # x86_64-unknown-linux-gnu
  "b0afb2e23654d3940c3b36e7fe36659ceb699885626902cbb798f4246d45ec3a",
  # aarch64-apple-darwin
  "d5af4c10f0931bf011b451b4f98584f505d1ed502aadcaa707b4ed3b527dcf5e",
  # x86_64-apple-darwin
  "48b6842bbe0a711bb0400a78bd46b46f3684876acb34ddecdef90e3a0a914ce7",
  # x86_64-pc-windows-msvc
  "1d16b34de3044504499101712efc4dfa3c0a3614cfcf73ec472187626ec1bc92",
  # aarch64-pc-windows-msvc
  "71c5ffa6888ef60caaf9080d08626cfe2db921ac2485e3efbbead678f9d691d0",
]
# The rules a plain run of oxlint 1.76.0 enables: the rules `--print-config` lists, as `<plugin>.<rule>`, less the 15 type-aware
# ones, which run only with `--type-aware`; such a run reports `"number_of_rules": 96`.
