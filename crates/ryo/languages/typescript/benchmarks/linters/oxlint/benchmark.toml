[query-modules]
"typescript/oxlint/eslint-directives" = "fragments/eslint-directives.ryoql"
"typescript/oxlint/parenthesized" = "fragments/parenthesized.ryoql"
"typescript/oxlint/constness" = "fragments/constness.ryoql"

# Defaults deferred, each under the limitation that blocks it: the TypeScript provider answers the binding relations,
# `numeric_literal` and `expression_shape` absent and has no regular expression or control flow relation; oxlint reports
# the `typescript_silent` rules on no TypeScript file.
[deferred]
# Rules that resolve a name to its binding, not yet written: calls of builtins, shadowing, and the value a `const`
# initializer gives (unicorn.no-thenable follows `const k = "then"` into `o[k]`).
binding_relations = [
  "eslint.no-new-native-nonconstructor",
  "eslint.no-obj-calls",
  "oxc.bad-match-all-arg",
  "oxc.bad-replace-all-arg",
  "unicorn.no-invalid-fetch-options",
  "unicorn.no-thenable",
  "unicorn.prefer-set-size",
]
# Rules that compare numbers by value: `1`, `1.0` and `0x1` are one number (typescript.prefer-as-const compares
# `let x: 1 = 1.0` so).
numeric_literal = [
  "eslint.no-compare-neg-zero",
  "eslint.no-dupe-keys",
  "eslint.no-loss-of-precision",
  "oxc.bad-min-max-func",
  "oxc.const-comparisons",
  "oxc.erasing-op",
  "oxc.number-arg-out-of-range",
  "typescript.no-duplicate-enum-values",
  "typescript.prefer-as-const",
]
# Rules that compare two expressions by structure (oxc.double-comparisons treats `a.x` and `a.x` as one operand).
expression_shape = [
  "eslint.no-dupe-else-if",
  "eslint.no-duplicate-case",
  "oxc.double-comparisons",
]
regular_expressions = [
  "eslint.no-control-regex",
  "eslint.no-empty-character-class",
  "eslint.no-invalid-regexp",
  "eslint.no-misleading-character-class",
  "eslint.no-useless-backreference",
  "eslint.no-useless-escape",
  "unicorn.prefer-string-starts-ends-with",
]
control_flow = [
  "eslint.constructor-super",
  "eslint.no-this-before-super",
  "eslint.no-unreachable",
]
# oxlint 1.76.0 reports none of these on `.ts`, `.mts`, `.cts` or `.tsx`: getter-return runs on JavaScript only, oxc's
# TypeScript check reports a duplicate class member with no rule attached, and `with` does not parse in TypeScript.
typescript_silent = [
  "eslint.getter-return",
  "eslint.no-dupe-class-members",
  "eslint.no-with",
]
