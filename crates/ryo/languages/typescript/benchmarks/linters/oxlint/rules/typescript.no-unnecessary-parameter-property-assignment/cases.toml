files = { "case.ts" = "class A {\n  constructor(public x: number) {\n    y = this.x = x;\n    this.x = this.x = x;\n  }\n}\n" }
expected = []

[[cases]]
name = "other-object"
files = { "case.ts" = "class A {\n  constructor(public x: number) {\n    that.x = x;\n    this[x] = x;\n  }\n}\n" }
