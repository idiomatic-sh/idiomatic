[[cases]]
name = "object-right"
files = { "case.ts" = "if (x === {}) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 12 }]

[[cases]]
name = "object-left"
files = { "case.ts" = "if ({} == x) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 11 }]

[[cases]]
name = "array-right"
files = { "case.ts" = "if (x !== []) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 12 }]

[[cases]]
name = "array-left"
files = { "case.ts" = "if ([] != x) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 11 }]

[[cases]]
name = "non-empty-object"
files = { "case.ts" = "if (x === { a: 1 }) {}\n" }
expected = []

[[cases]]
name = "non-empty-array"
files = { "case.ts" = "if (x === [1]) {}\n" }
expected = []

[[cases]]
name = "relational"
files = { "case.ts" = "if (x < []) {}\n" }
expected = []

[[cases]]
name = "parenthesized"
files = { "case.ts" = "if (x === ({})) {}\n" }
expected = []

[[cases]]
name = "as-object"
files = { "case.ts" = "if (x === ({} as any)) {}\n" }
expected = []

[[cases]]
name = "assignment"
files = { "case.ts" = "x = {};\n" }
expected = []

[[cases]]
name = "directive"
files = { "case.ts" = "// eslint-disable-next-line bad-object-literal-comparison\nif (x === {}) {}\n" }
expected = []
