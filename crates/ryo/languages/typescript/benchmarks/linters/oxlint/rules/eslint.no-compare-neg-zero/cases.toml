[[cases]]
name = "strict-equality"
files = { "case.ts" = "if (x === -0) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 12 }]

[[cases]]
name = "left-operand"
files = { "case.ts" = "if (-0 > x) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 10 }]

[[cases]]
name = "every-comparison"
files = { "case.ts" = "a == -0;\na != -0;\na !== -0;\na < -0;\na <= -0;\na >= -0;\n" }
expected = [{ file = "case.ts", start = 0, end = 7 }, { file = "case.ts", start = 9, end = 16 }, { file = "case.ts", start = 18, end = 26 }, { file = "case.ts", start = 28, end = 34 }, { file = "case.ts", start = 36, end = 43 }, { file = "case.ts", start = 45, end = 52 }]

