[[cases]]
name = "declaration"
files = { "case.ts" = "function* gen() { f(); }\n" }
expected = [{ file = "case.ts", start = 10, end = 13 }]

[[cases]]
name = "with-yield"
files = { "case.ts" = "function* gen() { yield 1; }\n" }
expected = []

[[cases]]
name = "empty"
files = { "case.ts" = "function* gen() {}\n" }
expected = []

[[cases]]
name = "expression"
files = { "case.ts" = "const g = function* () { f(); };\n" }
expected = [{ file = "case.ts", start = 10, end = 31 }]

[[cases]]
name = "named-expression"
files = { "case.ts" = "const g = function* inner() { f(); };\n" }
expected = [{ file = "case.ts", start = 20, end = 25 }]

[[cases]]
name = "yield-in-nested"
files = { "case.ts" = "function* gen() { function* inner() { yield 1; } }\n" }
expected = [{ file = "case.ts", start = 10, end = 13 }]

[[cases]]
name = "yield-only-in-nested"
files = { "case.ts" = "function* gen() { f(function* () { yield 1; }); }\n" }
expected = [{ file = "case.ts", start = 10, end = 13 }]

[[cases]]
name = "class-method"
files = { "case.ts" = "class A { *gen() { f(); } }\n" }
expected = [{ file = "case.ts", start = 14, end = 25 }]

[[cases]]
name = "object-method"
files = { "case.ts" = "const o = { *gen() { f(); } };\n" }
expected = [{ file = "case.ts", start = 16, end = 27 }]

[[cases]]
name = "async-generator"
files = { "case.ts" = "async function* gen() { await f(); }\n" }
expected = [{ file = "case.ts", start = 16, end = 19 }]

[[cases]]
name = "plain-function"
files = { "case.ts" = "function gen() { f(); }\n" }
expected = []

[[cases]]
name = "yield-delegate"
files = { "case.ts" = "function* gen() { yield* other(); }\n" }
expected = []

[[cases]]
name = "yield-in-block"
files = { "case.ts" = "function* gen() { if (a) { yield; } }\n" }
expected = []

[[cases]]
name = "disable-inside-finding"
files = { "case.ts" = "const g = function* () {\n  /* eslint-disable require-yield */\n  f();\n};\n" }
