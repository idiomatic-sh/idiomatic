[[cases]]
name = "if-double-negation"
files = { "case.ts" = "if (!!a) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 7 }]

[[cases]]
name = "if-boolean"
files = { "case.ts" = "if (Boolean(a)) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 14 }]

[[cases]]
name = "while"
files = { "case.ts" = "while (!!a) {}\n" }
expected = [{ file = "case.ts", start = 7, end = 10 }]

[[cases]]
name = "do-while"
files = { "case.ts" = "do {} while (Boolean(a));\n" }
expected = [{ file = "case.ts", start = 13, end = 23 }]

[[cases]]
name = "for"
files = { "case.ts" = "for (; !!a; ) {}\n" }
expected = [{ file = "case.ts", start = 7, end = 10 }]

[[cases]]
name = "ternary"
files = { "case.ts" = "const x = !!a ? b : c;\n" }
expected = [{ file = "case.ts", start = 10, end = 13 }]

[[cases]]
name = "ternary-branch"
files = { "case.ts" = "const x = c ? !!a : b;\n" }
expected = []

[[cases]]
name = "negated-double"
files = { "case.ts" = "const x = !!!a;\n" }
expected = [{ file = "case.ts", start = 11, end = 14 }]

[[cases]]
name = "negated-boolean"
files = { "case.ts" = "const x = !Boolean(a);\n" }
expected = [{ file = "case.ts", start = 11, end = 21 }]

[[cases]]
