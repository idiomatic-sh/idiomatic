files = { "case.ts" = "switch (NaN) { case 1: break; }\n" }
expected = [{ file = "case.ts", start = 8, end = 11 }]

[[cases]]
name = "switch-case"
files = { "case.ts" = "switch (x) { case NaN: break; }\n" }
expected = [{ file = "case.ts", start = 18, end = 21 }]

[[cases]]
name = "assignment"
files = { "case.ts" = "x = NaN;\n" }
