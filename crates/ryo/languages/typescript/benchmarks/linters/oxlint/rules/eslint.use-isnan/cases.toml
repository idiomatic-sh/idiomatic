[[cases]]
name = "strict-equality"
files = { "case.ts" = "if (x === NaN) {}\n" }
expected = [{ file = "case.ts", start = 10, end = 13 }]

[[cases]]
name = "left-operand"
files = { "case.ts" = "if (NaN != x) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 7 }]

[[cases]]
name = "relational"
files = { "case.ts" = "if (x < NaN) {}\n" }
expected = [{ file = "case.ts", start = 8, end = 11 }]

[[cases]]
name = "number-nan"
files = { "case.ts" = "if (x == Number.NaN) {}\n" }
