[[cases]]
name = "read-let"
files = { "case.ts" = "let status;\nif (status === \"ready\") {\n  log(status);\n}\n" }
expected = [{ file = "case.ts", start = 4, end = 10 }]

[[cases]]
name = "read-var"
files = { "case.ts" = "var v;\nlog(v);\n" }
expected = [{ file = "case.ts", start = 4, end = 5 }]

[[cases]]
name = "annotated"
files = { "case.ts" = "let x: number | undefined;\nlog(x);\n" }
expected = [{ file = "case.ts", start = 4, end = 5 }]

[[cases]]
name = "read-in-closure"
files = { "case.ts" = "let config;\nexport function init() {\n  return config?.enabled;\n}\n" }
expected = [{ file = "case.ts", start = 4, end = 10 }]

[[cases]]
name = "each-declarator"
files = { "case.ts" = "let a, b = 1, c;\nlog(a, b, c);\n" }
expected = [{ file = "case.ts", start = 4, end = 5 }, { file = "case.ts", start = 14, end = 15 }]

[[cases]]
name = "assigned-later"
files = { "case.ts" = "let user;\nuser = load();\nlog(user);\n" }
expected = []

