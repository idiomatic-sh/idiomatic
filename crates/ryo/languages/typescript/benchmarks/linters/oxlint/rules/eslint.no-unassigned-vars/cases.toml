name = "assigned-in-closure"
files = { "case.ts" = "let one;\nexport const f = (two) => {\n  if (one !== two) one = two;\n};\n" }
expected = []

[[cases]]
name = "updated"
files = { "case.ts" = "let n;\nn++;\nlog(n);\n" }
expected = []

[[cases]]
name = "destructuring-assignment"
