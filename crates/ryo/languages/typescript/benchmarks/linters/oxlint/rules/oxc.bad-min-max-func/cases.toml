[[cases]]
name = "min-of-max"
files = { "case.ts" = "Math.min(Math.max(x, 10), 5);\n" }
expected = [{ file = "case.ts", start = 0, end = 28 }]

[[cases]]
name = "max-of-min"
files = { "case.ts" = "Math.max(Math.min(x, 5), 10);\n" }
expected = [{ file = "case.ts", start = 0, end = 28 }]

[[cases]]
name = "possible-clamp"
files = { "case.ts" = "Math.min(Math.max(x, 5), 10);\nMath.max(Math.min(x, 10), 5);\n" }
expected = []

[[cases]]
name = "constant-first"
files = { "case.ts" = "Math.min(Math.max(10, x), 5);\n" }
expected = [{ file = "case.ts", start = 0, end = 28 }]

[[cases]]
name = "inner-second"
files = { "case.ts" = "Math.min(5, Math.max(x, 10));\n" }
expected = [{ file = "case.ts", start = 0, end = 28 }]

[[cases]]
name = "values-not-spellings"
files = { "case.ts" = "Math.min(Math.max(x, 0x5), 10.0);\nMath.min(Math.max(x, 1e3), 5);\n" }
expected = [{ file = "case.ts", start = 34, end = 63 }]

