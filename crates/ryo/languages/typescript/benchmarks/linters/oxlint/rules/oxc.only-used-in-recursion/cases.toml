name = "other-position"
files = { "case.ts" = "function q(a) {\n  return q(a - 1, a);\n}\n" }
expected = []

[[cases]]
name = "spread"
files = { "case.ts" = "function u(a) {\n  return u(...a);\n}\n" }
expected = []

