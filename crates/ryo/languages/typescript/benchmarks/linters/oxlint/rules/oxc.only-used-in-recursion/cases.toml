[[cases]]
name = "declaration"
files = { "case.ts" = "function f(a: number, b: number): number {\n  if (b > 0) return f(a, b - 1);\n  return b;\n}\n" }
expected = [{ file = "case.ts", start = 11, end = 12 }]

[[cases]]
name = "arrow"
files = { "case.ts" = "const g = (n, acc) => (n ? g(n - 1, acc) : 0);\n" }
expected = [{ file = "case.ts", start = 14, end = 17 }]

[[cases]]
name = "function-expression"
files = { "case.ts" = "const h = function (n, m) {\n  return m ? h(n, m - 1) : 0;\n};\n" }
expected = [{ file = "case.ts", start = 20, end = 21 }]

[[cases]]
name = "named-expression"
files = { "case.ts" = "export const run = function inner(n, m) {\n  return m ? inner(n, m - 1) : 0;\n};\n" }
expected = []

[[cases]]
name = "exported"
files = { "case.ts" = "export function r(a, b) {\n  return b ? r(a, b - 1) : 0;\n}\n" }
expected = [{ file = "case.ts", start = 18, end = 19 }]

[[cases]]
name = "each-call"
files = { "case.ts" = "function f(a, b) {\n  if (b) return f(a, b - 1);\n  return f(a, 0);\n}\n" }
expected = [{ file = "case.ts", start = 11, end = 12 }]

[[cases]]
name = "used-elsewhere"
files = { "case.ts" = "function k(n) {\n  return k(n) + n;\n}\n" }
expected = []

[[cases]]
name = "swapped"
files = { "case.ts" = "function p(a, b) {\n  return p(b, a);\n}\n" }
expected = []

