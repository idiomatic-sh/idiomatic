[[cases]]
name = "disabled"
files = { "case.ts" = "// eslint-disable-next-line only-used-in-recursion\nfunction f(a, b) {\n  return b ? f(a, b - 1) : 0;\n}\nfunction g(a, b) { // oxlint-disable-line oxc/only-used-in-recursion\n  return b ? g(a, b - 1) : 0;\n}\nfunction h(a, b) {\n  return b ? h(a, b - 1) : 0;\n}\n" }
expected = [{ file = "case.ts", start = 214, end = 215 }]
