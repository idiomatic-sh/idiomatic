[[cases]]
name = "every"
files = { "case.ts" = "if (array.length === 0 || array.every(Boolean)) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 22 }]

[[cases]]
name = "some-greater"
files = { "case.ts" = "if (array.length > 0 && array.some(Boolean)) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 20 }]

[[cases]]
name = "some-inequality"
files = { "case.ts" = "if (array.length !== 0 && array.some(Boolean)) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 22 }]

[[cases]]
name = "call-first"
files = { "case.ts" = "if (array.every(Boolean) || array.length === 0) {}\n" }
expected = [{ file = "case.ts", start = 28, end = 46 }]

[[cases]]
name = "call-first-some"
files = { "case.ts" = "if (array.some(Boolean) && array.length !== 0) {}\n" }
expected = [{ file = "case.ts", start = 27, end = 45 }]

[[cases]]
name = "parenthesized"
files = { "case.ts" = "if ((( array.length > 0 )) && array.some(Boolean)) {}\n" }
expected = [{ file = "case.ts", start = 7, end = 23 }]

[[cases]]
name = "chain-of-three"
files = { "case.ts" = "if (array.length !== 0 && array.some(Boolean) && foo) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 22 }, { file = "case.ts", start = 4, end = 22 }]

[[cases]]
name = "chain-in-middle"
files = { "case.ts" = "if (foo && array.length > 0 && array.some(Boolean)) {}\n" }
expected = [{ file = "case.ts", start = 11, end = 27 }]

[[cases]]
name = "grouped-right"
files = { "case.ts" = "if (array.length > 0 && (array.some(Boolean) && foo)) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 20 }]

[[cases]]
name = "grouped-or"
files = { "case.ts" = "if ((array.length === 0 || array.every(Boolean)) || foo) {}\n" }
expected = [{ file = "case.ts", start = 5, end = 23 }, { file = "case.ts", start = 5, end = 23 }]

[[cases]]
name = "computed-length"
files = { "case.ts" = "if (array[\"length\"] === 0 || array.every(Boolean)) {}\n" }
expected = [{ file = "case.ts", start = 4, end = 25 }]

[[cases]]
name = "loose-equality"
files = { "case.ts" = "if (array.length == 0 || array.every(Boolean)) {}\n" }
expected = []

[[cases]]
name = "wrong-operator"
files = { "case.ts" = "if (array.length === 0 && array.every(Boolean)) {}\n" }
expected = []

[[cases]]
name = "coalesce"
files = { "case.ts" = "if (array.length === 0 ?? array.every(Boolean)) {}\n" }
expected = []

