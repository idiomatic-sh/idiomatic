expected = []

[[cases]]
name = "hex-zero"
files = { "case.ts" = "if (array.length === 0x0 || array.every(Boolean)) {}\n" }
expected = []

[[cases]]
name = "reversed-comparison"
files = { "case.ts" = "if (0 === array.length || array.every(Boolean)) {}\n" }
expected = []

[[cases]]
name = "optional-length"
files = { "case.ts" = "if (array?.length === 0 || array.every(Boolean)) {}\n" }
expected = []

[[cases]]
name = "optional-call"
files = { "case.ts" = "if (array.length === 0 || array.every?.(Boolean)) {}\n" }
expected = []

[[cases]]
name = "optional-member"
files = { "case.ts" = "if (array.length === 0 || array?.every(Boolean)) {}\n" }
expected = []

