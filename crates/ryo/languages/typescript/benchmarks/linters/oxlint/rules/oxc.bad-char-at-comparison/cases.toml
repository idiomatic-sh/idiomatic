[[cases]]
name = "long-string"
files = { "case.ts" = "if (s.charAt(0) === \"ab\") {}\n" }
expected = [{ file = "case.ts", start = 4, end = 15 }]

[[cases]]
name = "left-string"
files = { "case.ts" = "if (\"ab\" == s.charAt(0)) {}\n" }
expected = [{ file = "case.ts", start = 12, end = 23 }]

[[cases]]
name = "inequality"
files = { "case.ts" = "if (s.charAt(0) !== \"ab\") {}\n" }
expected = [{ file = "case.ts", start = 4, end = 15 }]

[[cases]]
name = "single-char"
files = { "case.ts" = "if (s.charAt(0) === \"a\") {}\n" }
expected = []

[[cases]]
name = "empty-string"
files = { "case.ts" = "if (s.charAt(0) === \"\") {}\n" }
expected = []

