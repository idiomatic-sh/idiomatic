[package]
name = "idiomatic-sh-ryo-typescript-oxlint-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The oxlint linter benchmark of the Ryo TypeScript provider: its rules, fragments, worker and parity tests"
autobenches = false
autotests = false

[dependencies]

[dev-dependencies]
ryo_typescript = { package = "idiomatic-sh-ryo-typescript", path = "../../.." }
ryo-benchmark-contracts = { package = "idiomatic-sh-ryo-benchmark-contracts", path = "../../../../../crates/benchmark_contracts" }
ryo_benchmark = { package = "idiomatic-sh-ryo-benchmark", path = "../../../../../crates/benchmark", features = ["fixtures"] }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../../../../crates/sdk" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true


[lints]
workspace = true

[[bench]]
name = "oxlint"
path = "bench.rs"
harness = false

[[test]]
name = "oxlint"
path = "tests.rs"
