# The typescript provider source placement (paths are relative to src/).
# The parser crates typescript reads with are declared here, once, as the variable `libraries`: `imports-allow` adds them to the
# language's allow-list, and its own `client-at-adapter` below keeps them in its syntax adapter. Its own Cargo.toml names them, and
# nothing else does.
variables = { libraries = ["oxc_parser::*", "oxc_allocator::*", "oxc_ast::*", "oxc_ast_visit::*", "oxc_span::*", "oxc_semantic::*", "serde::*", "serde_json::*", "jsonc_parser::*", "yaml_serde::*", "globset::*", "postcard::*"] }
imports-allow = [{ variable = "libraries" }]
rules = [
  { rule = "idiomatic.arch/client-at-adapter", include = ["**"], exclude = ["**/adapters/**", "**/factory.rs", "**/composition.rs", "**/*_test.rs", "**/tests/fixtures/**", "**/tests/allocation.rs", "**/tests/bdd.rs"], params = { libraries = { variable = "libraries" } } },
]
