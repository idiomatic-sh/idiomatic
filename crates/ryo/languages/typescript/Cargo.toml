[package]
name = "idiomatic-sh-ryo-typescript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "TypeScript language provider for Ryo"
keywords = ["typescript", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]
autobenches = false
autotests = false

[lib]
name = "ryo_typescript"

[dependencies]
serde.workspace = true
postcard.workspace = true
serde_json.workspace = true
globset.workspace = true
thiserror.workspace = true
jsonc-parser = { version = "=0.34.0", features = ["serde"] }
# serde_yaml is deprecated; this is its continuation, maintained by The YAML Organization.
yaml_serde = "=0.10.7"
strum.workspace = true
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_ast_visit = "=0.142.0"
oxc_parser = "=0.142.0"
oxc_span = "=0.142.0"
oxc_semantic = { version = "=0.142.0", features = ["cfg"] }
oxc_cfg = "=0.142.0"
oxc_regular_expression = "=0.142.0"
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.2.0" }

[dev-dependencies]
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../../crates/matching" }
ryo_operators = { package = "idiomatic-sh-ryo-operators", path = "../../crates/operators" }
bumpalo = "3"
smallvec = "1"
# Shared vector executor and in-process query compiler, only for the benchmark.
ryo_engine = { package = "idiomatic-sh-ryo-engine", path = "../../crates/engine" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../../crates/values" }
ryo_query_language = { package = "idiomatic-sh-ryo-query_language", path = "../../crates/query_language" }
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../../crates/relations" }
rustc-hash = "2"
regex = "1"
cpu-time = "1"
unicode-width = "=0.2.2"
oxc_syntax = "=0.142.0"
tikv-jemallocator.workspace = true
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-typescript = { path = ".", features = ["fixtures"] }
divan.workspace = true

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false

[[bench]]
name = "provider"
path = "benchmarks/provider/bench.rs"
harness = false

[[bench]]
name = "vec-ts"
path = "benchmarks/vec/bench.rs"
harness = false

[features]
# Instruments and widens the benchmark pair program for cost measurements.
pair-diagnostics = []
summary-diagnostics = []
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo/fixtures"]

[lints]
workspace = true

# Established generated parser timing identities; native CPU/RSS are not inferred from Divan.
[package.metadata.ryo.performance]
schema = "divan-timing/v1"
workloads = { generated_every_relation = [2500, 10000] }
metrics = ["median-ns"]
