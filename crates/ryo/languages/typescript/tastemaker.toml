closed = false
# The typescript language's own placement (paths are directory-relative).
# The parser crates typescript reads with are declared here, once, as the variable `libraries`: `imports-allow` adds them to the
# language's allow-list, and its own `client-at-adapter` below keeps them in its syntax adapter. Its own Cargo.toml names them, and
# nothing else does.
variables = { domain-libraries = [], libraries = ["oxc_parser::*", "oxc_allocator::*", "oxc_ast::*", "oxc_ast_visit::*", "oxc_span::*", "oxc_semantic::*", "serde::*", "serde_json::*", "jsonc_parser::*", "yaml_serde::*", "globset::*", "postcard::*"] }
imports-allow = [{ variable = "libraries" }, { variable = "domain-libraries" }]
rules = [
  { rule = "idiomatic.ryo/source-import-allowlist", include = ["src/tastemaker.toml"], params = { libraries = { variable = "libraries" }, extra = { variable = "domain-libraries" } } },
  { rule = "idiomatic.arch/client-at-adapter", include = ["**"], exclude = ["**/*_test.rs", "**/test.rs", "**/*_test/**", "**/fixtures/**", "**/fixtures.rs", "**/tests/**"], params = { libraries = { variable = "libraries" } } },
]
templates = [{ template = "idiomatic.ryo/provider-allowances", file = "src/tastemaker.toml", params = { libraries = { variable = "libraries" }, extra = { variable = "domain-libraries" } } }]
