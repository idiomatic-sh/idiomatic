[workspace]
members = ["cli", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/idiomatic-sh/idiomatic"

# Every version is one already pinned in the repository: ryo's where ryo pins it (one resolution with the SDK it
# links), the first canonical's otherwise.
[workspace.dependencies]
arrow-ipc = { version = "=60.0.0", default-features = false }
lru = { version = "=0.18.4", default-features = false }
arrow-array = { version = "=60.0.0", default-features = false }
sha2 = "=0.10.9"
anstream = "=1.0.0"
blake3 = "=1.8.6"
clap = { version = "=4.6.6", features = ["color", "derive", "wrap_help"] }
cpu-time = "=1.0.0"
cucumber = "=0.23.0"
cargo_metadata = "=0.23.1"
divan = "=0.1.21"
globset = "=0.4.18"
heck = "=0.5.0"
ignore = "=0.4.33"
indicatif = "=0.18.6"
minijinja = { version = "=2.12.0", default-features = false, features = ["builtins", "serde"] }
percent-encoding = "=2.3.2"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
rayon = "=1.12.0"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde-sarif = { version = "=0.8.0", default-features = false }
serde_json = { version = "=1.0.151" }
shlex = "=2.0.1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
snapbox = { version = "0.6", features = ["cmd"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
toml = "=1.1.4"
toml_edit = "=0.25.13"
tracing = "=0.1.44"
tracing-chrome = "=0.7.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
trycmd = "=0.15.11"

[workspace.lints.rust]
unsafe_code = "forbid"
unknown_lints = "deny"
dead_code = "deny"
private_interfaces = "deny"
unnameable_types = "deny"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
pub_use = "deny"

# The tools its asymptote.toml runs through cargo-run-bin, each pinned (`cargo bin <tool>`), the same versions ryo pins.
[workspace.metadata.bin]
cargo-deny = { version = "0.20.2", locked = true }
cargo-machete = { version = "0.9.2", locked = true }
cargo-hack = { version = "0.6.45", locked = true }
cargo-nextest = { version = "0.9.146", locked = true }
cargo-mutants = { version = "27.1.0", locked = true }
hyperfine = { version = "1.20.0", locked = true }
clippy-sarif = { version = "0.8.0", locked = true, default-features = true }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dist]
inherits = "release"

[profile.gate]
inherits = "dev"

[profile.test.package.sysinfo]
opt-level = 3

[profile.dev]
opt-level = 2
debug = "line-tables-only"
