closed = false
# The toml language's own placement (paths are directory-relative).
# The parser crates toml reads with are declared here, once, as the variable `libraries`: `imports-allow` adds them to the language's
# allow-list, and its own `client-at-adapter` below keeps them in its syntax adapter. Its own Cargo.toml names them, and nothing else does.
variables = { domain-libraries = [], libraries = ["toml_parser::*", "toml::*"] }
imports-allow = [{ variable = "libraries" }, { variable = "domain-libraries" }]
rules = [
  { rule = "idiomatic.ryo/source-import-allowlist", include = ["src/tastemaker.toml"], params = { libraries = { variable = "libraries" }, extra = { variable = "domain-libraries" } } },
  { rule = "idiomatic.arch/client-at-adapter", include = ["**"], params = { libraries = { variable = "libraries" } } },
]
templates = [{ template = "idiomatic.ryo/provider-allowances", file = "src/tastemaker.toml", params = { libraries = { variable = "libraries" }, extra = { variable = "domain-libraries" } } }]
