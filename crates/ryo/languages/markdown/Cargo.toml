[package]
name = "idiomatic-sh-ryo-markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Markdown language provider for Ryo"
keywords = ["markdown", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]
autotests = false

[lib]
name = "ryo_markdown"

[dependencies]
strum.workspace = true
# The CommonMark parser of mdBook and of the rustdoc ecosystem; its pull parser gives every event with its byte range.
pulldown-cmark = { version = "=0.13.4", default-features = false }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.2.0" }

[dev-dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-markdown = { path = ".", features = ["fixtures"] }

[[test]]
name = "numbered"

[[test]]
name = "routes"
harness = false

[features]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo/fixtures"]

[lints]
workspace = true

[[test]]
name = "conformance"
harness = false
