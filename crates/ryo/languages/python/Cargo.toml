[package]
name = "idiomatic-sh-ryo-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Python language provider for Ryo"
keywords = ["python", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]
autobenches = false
autotests = false

[lib]
name = "ryo_python"

[dependencies]
indexmap.workspace = true
strum.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
toml.workspace = true
pyproject-toml = "=0.13.7"
pep508_rs = "=0.9.1"
thiserror.workspace = true
postcard.workspace = true
# The parser ruff and ty run, with its tree and its text ranges: internal crates of ruff that break their API from one weekly release
# to the next, so all three are pinned exactly, at the same release.
ruff_python_parser = "=0.0.18"
ruff_python_ast = "=0.0.18"
ruff_text_size = "=0.0.18"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.1.2" }

# The worker binary runs on the allocator the command line ships (ruff and uv ship the same): jemalloc where it builds,
# mimalloc on Windows.
[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dev-dependencies]
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
mimalloc.workspace = true

[dev-dependencies]
ryo-benchmark-contracts = { package = "idiomatic-sh-ryo-benchmark-contracts", path = "../../crates/benchmark_contracts", version = "0.1.2" }
ryo_benchmark = { package = "idiomatic-sh-ryo-benchmark", path = "../../crates/benchmark", features = ["fixtures"] }
serde_json.workspace = true
tempfile.workspace = true
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-python = { path = ".", features = ["fixtures"] }
divan.workspace = true
dunce.workspace = true

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false

[[bench]]
name = "provider"
path = "benchmarks/provider/bench.rs"
harness = false

[features]
diagnostic-row-progress = ["ryo/diagnostic-row-progress"]
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo/fixtures", "dep:serde_json"]
# jemalloc built with its heap profiler (`--enable-prof`), for the benchmark worker's heap profile (method.md "Heap profile"); it
# names only this crate's dev-dependency allocator, so no release build takes it, and it samples nothing until `_RJEM_MALLOC_CONF` turns it on.
heap-profile = ["tikv-jemallocator/profiling"]

[lints]
workspace = true

# Its `allocation` test target (`harness = false`) sets `dhat` as the global allocator, which machete does not see.
[package.metadata.cargo-machete]
ignored = ["dhat"]

[[bench]]
name = "ruff"
path = "benchmarks/linters/ruff/bench.rs"
harness = false

[[test]]
name = "ruff"
path = "benchmarks/linters/ruff/tests.rs"

# Established generated parser timing identities; native CPU/RSS are not inferred from Divan.
[package.metadata.ryo.performance]
schema = "divan-timing/v1"
workloads = { generated_every_relation = [2500, 10000] }
metrics = ["median-ns"]

