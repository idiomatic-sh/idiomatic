[package]
name = "idiomatic-sh-ryo-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Python language provider for Ryo"
keywords = ["python", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]
autobenches = false
autotests = false

[lib]
name = "ryo_python"

[dependencies]
indexmap.workspace = true
strum.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
toml.workspace = true
pyproject-toml = "=0.13.7"
pep508_rs = "=0.9.1"
thiserror.workspace = true
postcard.workspace = true
# The parser ruff and ty run, with its tree and its text ranges: internal crates of ruff that break their API from one weekly release
# to the next, so all three are pinned exactly, at the same release.
ruff_python_parser = "=0.0.18"
ruff_python_ast = "=0.0.18"
ruff_text_size = "=0.0.18"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.2.0" }
# THROWAWAY (ryo-fmx3.1): the `vec` bench's Arrow kernels, behind `vec-arrow`.
arrow-array = { version = "=60.0.0", optional = true }
arrow-buffer = { version = "=60.0.0", optional = true }
arrow-select = { version = "=60.0.0", optional = true }
# THROWAWAY (ryo-fmx3.1 redo-alloc): the `vec` bench's global allocator A/B: mimalloc behind `vec-mimalloc`.
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
bumpalo = "3"
smallvec = "1"
serde_json.workspace = true
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-python = { path = ".", features = ["fixtures"] }
divan.workspace = true
# THROWAWAY (ryo-fmx3.1): the `vec` measurement bench.
cpu-time = "1"
aho-corasick = "1"
rustc-hash = "2"
foldhash = "0.2"
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../../crates/relations" }
# 8 (ryo-fmx3.1): the executor's kernels live in the engine crate; the bench calls them.
ryo_engine = { package = "idiomatic-sh-ryo-engine", path = "../../crates/engine" }
regex = "1"
# THROWAWAY (ryo-fmx3.1 redo-general): the `vec` probe's byte patterns from the plan's regexes (literal extraction).
regex-syntax = "0.8"
unicode-width = "=0.2.2"
# THROWAWAY (ryo-fmx3.1 redo-lowering): the `vec lower` edge, the one parser and the engine's plan lowering (engine above).
ryo_query_language = { package = "idiomatic-sh-ryo-query_language", path = "../../crates/query_language" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../../crates/values" }
# THROWAWAY (ryo-fmx3.1 redo-alloc): the `vec` bench's allocator, as the command line ships it on Linux (`vec-glibc`: glibc's).
tikv-jemallocator.workspace = true

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false

[[bench]]
name = "provider"
path = "benchmarks/provider/bench.rs"
harness = false

[[bench]]
name = "vec"
path = "benchmarks/vec/bench.rs"
harness = false

[features]
# Instruments and widens the benchmark pair program for cost measurements.
pair-diagnostics = []
# THROWAWAY (ryo-fmx3.1): the `vec` bench's Arrow kernels.
vec-arrow = ["dep:arrow-array", "dep:arrow-buffer", "dep:arrow-select"]
# THROWAWAY (ryo-fmx3.1 redo-alloc): the `vec` bench's global allocator, jemalloc with none of them (one at a time):
# glibc's, mimalloc, or dhat's counting profiler (allocation counts by call site; never timed).
vec-glibc = []
vec-mimalloc = ["dep:mimalloc"]
vec-dhat = []
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo/fixtures", "dep:serde_json"]

[lints]
workspace = true

# Established generated parser timing identities; native CPU/RSS are not inferred from Divan.
[package.metadata.ryo.performance]
schema = "divan-timing/v1"
workloads = { generated_every_relation = [2500, 10000], fillers_whole_and_by_key = [2000, 8000] }
metrics = ["median-ns"]
