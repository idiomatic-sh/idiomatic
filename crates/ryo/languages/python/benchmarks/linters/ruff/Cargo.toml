[package]
name = "idiomatic-sh-ryo-python-ruff-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Ruff linter benchmark of the Ryo Python provider: its rules, fragments, profiles, worker and parity tests"
autobenches = false
autotests = false

[dependencies]

[dev-dependencies]
ryo_python = { package = "idiomatic-sh-ryo-python", path = "../../..", features = ["fixtures"] }
ryo-benchmark-contracts = { package = "idiomatic-sh-ryo-benchmark-contracts", path = "../../../../../crates/benchmark_contracts" }
ryo_benchmark = { package = "idiomatic-sh-ryo-benchmark", path = "../../../../../crates/benchmark", features = ["fixtures"] }
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../../../../crates/sdk", features = ["fixtures"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
cpu-time.workspace = true
toml.workspace = true
dunce.workspace = true
# Spike (ryo-v1np): the blocks bake-off bench.
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../../../../../crates/language" }
ryo_relations = { package = "idiomatic-sh-ryo-relations", path = "../../../../../crates/relations" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../../../../../crates/values" }
ryo_execution = { package = "idiomatic-sh-ryo-execution", path = "../../../../../crates/execution" }
ryo_execution_runtime = { package = "idiomatic-sh-ryo-execution-runtime", path = "../../../../../crates/execution_runtime" }
rustc-hash.workspace = true
ryo_matching = { package = "idiomatic-sh-ryo-matching", path = "../../../../../crates/matching" }


[lints]
workspace = true

[[bench]]
name = "ruff"
path = "bench.rs"
harness = false

[[bench]]
name = "blocks"
path = "blocks.rs"
harness = false

[[test]]
name = "ruff"
path = "tests.rs"
