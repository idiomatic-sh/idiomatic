[[cases]]
name = "wrong-major-length"
files = { "case.pyi" = "import sys\nif sys.version_info[:1] == (3, 10):\n    ...\n" }
expected = [{ file = "case.pyi", start = 14, end = 45 }]

[[cases]]
name = "hex-major-length"
files = { "case.pyi" = "import sys\nif sys.version_info[:0x1] == (3, 10):\n    ...\n" }
expected = [{ file = "case.pyi", start = 14, end = 47 }]

[[cases]]
name = "lower-bound-is-not-tuple-length"
files = { "case.pyi" = "import sys\nif sys.version_info[0:1] == (3, 10):\n    ...\n" }
expected = []

[[cases]]
name = "wrong-major-minor-length"
files = { "case.pyi" = "import sys\nif sys.version_info[:2] == (3,):\n    ...\n" }
expected = [{ file = "case.pyi", start = 14, end = 42 }]

