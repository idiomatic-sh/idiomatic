# Exact Ruff 0.16.5 tag 9e4938c4a60bed3e87a11ee1e1db1bd23f4d964a; target py310; shipped default settings.

[[cases]]
name = "upstream-pinned-fixture"
comparison = "full"
files = { "case.py" = "class Wolf:\n    @staticmethod\n    def eat(self):  # [bad-staticmethod-argument]\n        pass\n\n\nclass Wolf:\n    @staticmethod\n    def eat(sheep):\n        pass\n\n\nclass Sheep:\n    @staticmethod\n    def eat(cls, x, y, z):  # [bad-staticmethod-argument]\n        pass\n\n    @staticmethod\n    def sleep(self, x, y, z):  # [bad-staticmethod-argument]\n        pass\n\n    def grow(self, x, y, z):\n        pass\n\n    @classmethod\n    def graze(cls, x, y, z):\n        pass\n\n\nclass Foo:\n    @staticmethod\n    def eat(x, self, z):\n        pass\n\n    @staticmethod\n    def sleep(x, cls, z):\n        pass\n\n    def grow(self, x, y, z):\n        pass\n\n    @classmethod\n    def graze(cls, x, y, z):\n        pass\n\n\nclass Foo:\n    @staticmethod\n    def __new__(cls, x, y, z):  # OK, see https://docs.python.org/3/reference/datamodel.html#basic-customization\n        pass\n\n# `__new__` is an implicit staticmethod, so this should still trigger (with\n# `self` but not with `cls` as first argument - see above).\nclass Foo:\n    def __new__(self, x, y, z):  # [bad-staticmethod-argument]\n        pass\n" }
expected = [{ rule = "PLW0211", file = "case.py", start = 42, end = 46 }, { rule = "PLW0211", file = "case.py", start = 203, end = 206 }, { rule = "PLW0211", file = "case.py", start = 295, end = 299 }, { rule = "PLW0211", file = "case.py", start = 1009, end = 1013 }]

