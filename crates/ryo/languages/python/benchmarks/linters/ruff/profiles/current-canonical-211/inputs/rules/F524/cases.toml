[[cases]]
name = "missing-automatic-positional"
comparison = "full"
files = { "case.py" = "\"{}\".format()\n" }
expected = [{ rule = "F524", file = "case.py", start = 0, end = 13 }]

[[cases]]
name = "missing-explicit-positional"
comparison = "full"
files = { "case.py" = "\"{1}\".format(value)\n" }
expected = [{ rule = "F524", file = "case.py", start = 0, end = 19 }]

[[cases]]
name = "all-positional-present"
comparison = "full"
files = { "case.py" = "\"{1}\".format(first, second)\n" }
expected = []

[[cases]]
name = "missing-keyword"
comparison = "full"
files = { "case.py" = "\"{name}\".format()\n" }
expected = [{ rule = "F524", file = "case.py", start = 0, end = 17 }]

[[cases]]
name = "keyword-present"
comparison = "full"
files = { "case.py" = "\"{name}\".format(name=value)\n" }
expected = []

[[cases]]
