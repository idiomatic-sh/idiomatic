[[cases]]
name = "upstream-pinned-fixture"
comparison = "full"
files = { "case.py" = "# Errors\nprint(\"foo %(foo)d bar %(bar)d\" % {\"foo\": \"1\", \"bar\": \"2\"})\n\n\"foo %e bar %s\" % (\"1\", 2)\n\n\"%d\" % \"1\"\n\"%o\" % \"1\"\n\"%(key)d\" % {\"key\": \"1\"}\n\"%x\" % 1.1\n\"%(key)x\" % {\"key\": 1.1}\n\"%d\" % []\n\"%d\" % ([],)\n\"%(key)d\" % {\"key\": []}\nprint(\"%d\" % (\"%s\" % (\"nested\",),))\n\"%d\" % ((1, 2, 3),)\n\"%d\" % (1 if x > 0 else [])\n\n# False negatives\nWORD = \"abc\"\n\"%d\" % WORD\n\"%d %s\" % (WORD, WORD)\nVALUES_TO_FORMAT = (1, \"2\", 3.0)\n\"%d %d %f\" % VALUES_TO_FORMAT\n\n# OK\n\"%d %s %f\" % VALUES_TO_FORMAT\n\"%s\" % \"1\"\n\"%s %s %s\" % (\"1\", 2, 3.5)\nprint(\"%d %d\"\n      %\n(1, 1.1))\n\"%s\" % 1\n\"%d\" % 1\n\"%f\" % 1\n\"%s\" % 1\n\"%(key)s\" % {\"key\": 1}\n\"%d\" % 1\n\"%(key)d\" % {\"key\": 1}\n\"%f\" % 1\n\"%(key)f\" % {\"key\": 1}\n\"%d\" % 1.1\n\"%(key)d\" % {\"key\": 1.1}\n\"%s\" % []\n\"%(key)s\" % {\"key\": []}\n\"%s\" % None\n\"%(key)s\" % {\"key\": None}\nprint(\"%s\" % (\"%s\" % (\"nested\",),))\nprint(\"%s\" % (\"%d\" % (5,),))\n\"%d %d\" % \"1\"\n\"%d\" \"%d\" % \"1\"\n\"-%f\" % time.time()\n\"%r\" % (object['dn'],)\nr'\\%03o' % (ord(c),)\n('%02X' % int(_) for _ in o)\n\"%s;range=%d-*\" % (attr, upper + 1)\n\"%d\" % (len(foo),)\n'(%r, %r, %r, %r)' % (hostname, address, username, '$PASSWORD')\n'%r' % ({'server_school_roles': server_school_roles, 'is_school_multiserver_domain': is_school_multiserver_domain}, )\n\"%d\" % (1 if x > 0 else 2)\n\n# Special cases for %c allowing single character strings\n# https://github.com/astral-sh/ruff/issues/8406\n\"%c\" % (\"x\",)\n\"%c\" % \"x\"\n\"%c\" % \"œ\"\n\n# No errors here, will be reported separately by bad-string-format-character.\n\"%b\" % b\"xx\"\n\n# bool is acceptable as int/float/character.\n\"%d %c %f\" % (True, True, True)\n" }
expected = [{ rule = "PLE1307", file = "case.py", start = 15, end = 67 }, { rule = "PLE1307", file = "case.py", start = 70, end = 96 }, { rule = "PLE1307", file = "case.py", start = 98, end = 108 }, { rule = "PLE1307", file = "case.py", start = 109, end = 119 }, { rule = "PLE1307", file = "case.py", start = 120, end = 144 }, { rule = "PLE1307", file = "case.py", start = 145, end = 155 }, { rule = "PLE1307", file = "case.py", start = 156, end = 180 }, { rule = "PLE1307", file = "case.py", start = 181, end = 190 }, { rule = "PLE1307", file = "case.py", start = 191, end = 203 }, { rule = "PLE1307", file = "case.py", start = 204, end = 227 }, { rule = "PLE1307", file = "case.py", start = 234, end = 262 }, { rule = "PLE1307", file = "case.py", start = 264, end = 283 }, { rule = "PLE1307", file = "case.py", start = 284, end = 311 }]

