[[cases]]
name = "unsupported-character"
comparison = "full"
files = { "case.py" = "\"%j\" % (1,)\n" }
expected = [{ rule = "F509", file = "case.py", start = 0, end = 11 }]

[[cases]]
name = "unsupported-unicode-character"
comparison = "full"
files = { "case.py" = "\"%\u00e9\" % (1,)\n" }
expected = [{ rule = "F509", file = "case.py", start = 0, end = 12 }]

[[cases]]
name = "multiple-unsupported-characters"
comparison = "full"
files = { "case.py" = "\"%j %k\" % (1, 2)\n" }
expected = [{ rule = "F509", file = "case.py", start = 0, end = 16 }]

