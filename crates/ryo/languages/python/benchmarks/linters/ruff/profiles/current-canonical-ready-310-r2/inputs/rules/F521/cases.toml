[[cases]]
name = "unmatched-opening-brace"
comparison = "full"
files = { "case.py" = "\"{\".format()\n" }
expected = [{ rule = "F521", file = "case.py", start = 0, end = 12 }]

[[cases]]
name = "invalid-field-path"
comparison = "full"
files = { "case.py" = "\"{x..}\".format(x=1)\n" }
expected = [{ rule = "F521", file = "case.py", start = 0, end = 19 }]

[[cases]]
name = "invalid-nested-field"
comparison = "full"
files = { "case.py" = "\"{x:{y..}}\".format(x=1,y=2)\n" }
expected = [{ rule = "F521", file = "case.py", start = 0, end = 27 }]

[[cases]]
name = "valid-automatic-field"
comparison = "full"
files = { "case.py" = "\"{}\".format(value)\n" }
expected = []

[[cases]]
name = "noqa-invalid-format"
comparison = "full"
files = { "case.py" = "\"{\".format()  # noqa: F521\n" }
expected = []
