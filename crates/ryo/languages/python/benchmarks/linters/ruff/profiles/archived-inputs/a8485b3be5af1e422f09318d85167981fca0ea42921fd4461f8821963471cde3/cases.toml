[[cases]]
name = "unique-members-control"
files = { "case.pyi" = "value: int | str\n" }
expected = []

[[cases]]
name = "python-file-duplicate"
files = { "case.py" = "value: int | int\n" }
expected = [{ file = "case.py", start = 13, end = 16 }]

[[cases]]
