[[cases]]
name = "global-then-nonlocal"
files = { "case.py" = "def f():\n    global value\n    nonlocal value\n" }
expected = [{ rule = "PLE0115", file = "case.py", start = 20, end = 25 }]

[[cases]]
name = "nonlocal-then-global"
files = { "case.py" = "def f():\n    nonlocal value\n    global value\n" }
expected = [{ rule = "PLE0115", file = "case.py", start = 39, end = 44 }]

[[cases]]
name = "same-name-in-separate-functions"
files = { "case.py" = "def a():\n    global value\ndef b():\n    nonlocal value\n" }
expected = []

[[cases]]
name = "outer-and-inner-functions-do-not-conflict"
files = { "case.py" = "def outer():\n    global value\n    def inner():\n        nonlocal value\n" }
expected = []

[[cases]]
name = "noqa-suppresses-conflicting-declaration"
files = { "case.py" = "def f():\n    global value  # noqa: PLE0115\n    nonlocal value\n" }
expected = []

[[cases]]
name = "latest-global-declaration-is-reported"
files = { "case.py" = "def f():\n    global value\n    global value\n    nonlocal value\n" }
expected = [{ rule = "PLE0115", file = "case.py", start = 37, end = 42 }]

[[cases]]
name = "each-nonlocal-declaration-retains-diagnostic-multiplicity"
files = { "case.py" = "def f():\n    nonlocal value\n    nonlocal value\n    global value\n" }
expected = [
  { rule = "PLE0115", file = "case.py", start = 58, end = 63 },
  { rule = "PLE0115", file = "case.py", start = 58, end = 63 },
]
