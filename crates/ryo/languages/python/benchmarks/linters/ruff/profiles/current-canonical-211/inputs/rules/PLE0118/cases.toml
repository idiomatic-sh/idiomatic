[[cases]]
name = "read-before-global"
files = { "case.py" = "def f():\n    print(value)\n    global value\n" }
expected = [{ rule = "PLE0118", file = "case.py", start = 19, end = 24 }]

[[cases]]
name = "reads-after-global-are-allowed"
files = { "case.py" = "def f():\n    global value\n    print(value)\n" }
expected = []

[[cases]]
name = "nested-function-read-does-not-precede-global"
files = { "case.py" = "def f():\n    def g():\n        print(value)\n    global value\n" }
expected = []

[[cases]]
name = "assignment-before-global"
files = { "case.py" = "def f():\n    value = 1\n    global value\n" }
expected = [{ rule = "PLE0118", file = "case.py", start = 13, end = 18 }]

[[cases]]
name = "delete-before-global"
files = { "case.py" = "def f():\n    del value\n    global value\n" }
expected = [{ rule = "PLE0118", file = "case.py", start = 17, end = 22 }]

[[cases]]
name = "every-prior-use-is-reported"
files = { "case.py" = "def f():\n    print(value)\n    print(value)\n    global value\n" }
expected = [{ rule = "PLE0118", file = "case.py", start = 19, end = 24 }, { rule = "PLE0118", file = "case.py", start = 36, end = 41 }]

[[cases]]
name = "noqa-suppresses-prior-use"
files = { "case.py" = "def f():\n    print(value)  # noqa: PLE0118\n    global value\n" }
expected = []
