[[cases]]
name = "info"
comparison = "full"
files = { "case.py" = "import logging\nlogging.info(\"x\")\n" }
expected = [{ rule = "LOG015", file = "case.py", start = 15, end = 32 }]

[[cases]]
name = "all-methods"
comparison = "full"
files = { "case.py" = "import logging\nlogging.debug(\"x\")\nlogging.info(\"x\")\nlogging.warn(\"x\")\nlogging.warning(\"x\")\nlogging.error(\"x\")\nlogging.critical(\"x\")\nlogging.log(1, \"x\")\nlogging.exception(\"x\")\n" }
expected = [{ rule = "LOG015", file = "case.py", start = 15, end = 33 }, { rule = "LOG015", file = "case.py", start = 34, end = 51 }, { rule = "LOG015", file = "case.py", start = 52, end = 69 }, { rule = "LOG015", file = "case.py", start = 70, end = 90 }, { rule = "LOG015", file = "case.py", start = 91, end = 109 }, { rule = "LOG015", file = "case.py", start = 110, end = 131 }, { rule = "LOG015", file = "case.py", start = 132, end = 151 }, { rule = "LOG015", file = "case.py", start = 152, end = 174 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import logging as log\nlog.error(\"x\")\n" }
expected = [{ rule = "LOG015", file = "case.py", start = 22, end = 36 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from logging import info\ninfo(\"x\")\n" }
expected = [{ rule = "LOG015", file = "case.py", start = 25, end = 34 }]

[[cases]]
name = "from-import-alias"
comparison = "full"
files = { "case.py" = "from logging import warning as warn\nwarn(\"x\")\n" }
expected = [{ rule = "LOG015", file = "case.py", start = 36, end = 45 }]

