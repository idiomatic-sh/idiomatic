[[cases]]
name = "direct-no-return"
comparison = "full"
files = { "case.pyi" = "from typing import NoReturn\ndef f(value: NoReturn) -> None: ...\n" }
expected = [{ rule = "PYI050", file = "case.pyi", start = 41, end = 49 }]

[[cases]]
name = "no-return-qualified-alias"
comparison = "full"
files = { "case.pyi" = "import typing as t\ndef f(value: t.NoReturn) -> None: ...\n" }
expected = [{ rule = "PYI050", file = "case.pyi", start = 32, end = 42 }]

[[cases]]
name = "no-return-extension"
comparison = "full"
files = { "case.pyi" = "from typing_extensions import NoReturn as NR\ndef f(value: NR) -> None: ...\n" }
expected = [{ rule = "PYI050", file = "case.pyi", start = 58, end = 60 }]

[[cases]]
name = "positional-only-argument"
comparison = "full"
files = { "case.pyi" = "from typing import NoReturn\ndef f(value: NoReturn, /) -> None: ...\n" }
expected = [{ rule = "PYI050", file = "case.pyi", start = 41, end = 49 }]

[[cases]]
name = "keyword-only-argument"
comparison = "full"
files = { "case.pyi" = "from typing import NoReturn\ndef f(*, value: NoReturn) -> None: ...\n" }
expected = [{ rule = "PYI050", file = "case.pyi", start = 44, end = 52 }]

[[cases]]
name = "variadic-arguments"
comparison = "full"
files = { "case.pyi" = "from typing import NoReturn\ndef f(*args: NoReturn, **kwargs: NoReturn) -> None: ...\n" }
expected = [{ rule = "PYI050", file = "case.pyi", start = 41, end = 49 }, { rule = "PYI050", file = "case.pyi", start = 61, end = 69 }]

[[cases]]
