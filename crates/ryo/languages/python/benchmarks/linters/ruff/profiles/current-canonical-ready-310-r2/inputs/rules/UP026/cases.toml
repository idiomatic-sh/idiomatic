[[cases]]
name = "module-before-import"
comparison = "full"
files = { "case.py" = "mock.mock.patch()\nimport mock\n" }
expected = [{ rule = "UP026", file = "case.py", start = 25, end = 29 }]

[[cases]]
name = "module-after-import"
comparison = "full"
files = { "case.py" = "import mock\nmock.mock.patch()\n" }
expected = [{ rule = "UP026", file = "case.py", start = 7, end = 11 }, { rule = "UP026", file = "case.py", start = 12, end = 21 }]

[[cases]]
name = "same-line-before"
comparison = "full"
files = { "case.py" = "mock.mock.patch(); import mock\n" }
expected = [{ rule = "UP026", file = "case.py", start = 26, end = 30 }]

[[cases]]
name = "deferred-function"
comparison = "full"
files = { "case.py" = "def f():\n    mock.mock.patch()\nimport mock\n" }
expected = [{ rule = "UP026", file = "case.py", start = 13, end = 22 }, { rule = "UP026", file = "case.py", start = 38, end = 42 }]

