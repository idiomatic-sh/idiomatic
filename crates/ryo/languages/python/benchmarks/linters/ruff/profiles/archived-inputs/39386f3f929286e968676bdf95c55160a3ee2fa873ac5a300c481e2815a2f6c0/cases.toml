[[cases]]
name = "integer-repeat"
files = { "case.py" = "values = {1: \"a\", 1: \"b\"}\n" }
expected = [{ rule = "F601", file = "case.py", start = 18, end = 19 }]

[[cases]]
name = "bool-int-repeat"
files = { "case.py" = "values = {True: \"a\", 1: \"b\", 1.0: \"c\"}\n" }
expected = [{ rule = "F601", file = "case.py", start = 21, end = 22 }, { rule = "F601", file = "case.py", start = 29, end = 32 }]

[[cases]]
name = "different-numeric"
files = { "case.py" = "values = {1: \"a\", 2: \"b\", 1.5: \"c\"}\n" }
expected = []

[[cases]]
name = "bytes-repeat"
files = { "case.py" = "values = {b\"x\": 1, b\"x\": 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 19, end = 23 }]

[[cases]]
name = "strings-concat"
files = { "case.py" = "values = {\"a\" \"b\": 1, \"ab\": 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 22, end = 26 }]

[[cases]]
name = "constant-tuple-repeat"
files = { "case.py" = "values = {(1, \"x\"): 1, (True, \"x\"): 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 23, end = 34 }]

[[cases]]
name = "nonconstant-tuple-repeat"
files = { "case.py" = "values = {(name, 1): 1, (name, 1): 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 24, end = 33 }]

[[cases]]
name = "fstring-repeat"
files = { "case.py" = "values = {f\"{x}\": 1, f\"{x}\": 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 21, end = 27 }]

[[cases]]
name = "signed-repeat"
files = { "case.py" = "values = {-1: 1, -1.0: 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 17, end = 21 }]

[[cases]]
name = "complex-add-repeat"
files = { "case.py" = "values = {1 + 2j: 1, 1.0 + 2j: 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 21, end = 29 }]

[[cases]]
name = "large-integer-exact"
files = { "case.py" = "values = {18446744073709551616: 1, 18446744073709551616: 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 35, end = 55 }]

