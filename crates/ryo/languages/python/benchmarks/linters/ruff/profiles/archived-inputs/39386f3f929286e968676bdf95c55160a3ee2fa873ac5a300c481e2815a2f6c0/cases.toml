[[cases]]
name = "multiple-later-duplicates"
files = { "case.py" = "values = {1: \"a\", 1: \"b\", 1.0: \"c\"}\n" }
expected = [{ rule = "F601", file = "case.py", start = 18, end = 19 }, { rule = "F601", file = "case.py", start = 26, end = 29 }]

[[cases]]
name = "independent-dicts"
files = { "case.py" = "a = {1: 1, 1: 2}\nb = {1: 1, 1: 2}\n" }
expected = [{ rule = "F601", file = "case.py", start = 11, end = 12 }, { rule = "F601", file = "case.py", start = 28, end = 29 }]

