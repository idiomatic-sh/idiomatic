files = { "case.py" = "# pylint: disable=missing-docstring, too-few-public-methods\nfrom abc import ABCMeta, abstractmethod\n\n\nclass Cls:\n    @property\n    def attribute(self, param, param1):  # [property-with-parameters]\n        return param + param1\n\n    @property\n    def attribute_keyword_only(self, *, param, param1):  # [property-with-parameters]\n        return param + param1\n\n    @property\n    def attribute_positional_only(self, param, param1, /):  # [property-with-parameters]\n        return param + param1\n\n\nclass MyClassBase(metaclass=ABCMeta):\n    \"\"\"MyClassBase.\"\"\"\n\n    @property\n    @abstractmethod\n    def example(self):\n        \"\"\"Getter.\"\"\"\n\n    @example.setter\n    @abstractmethod\n    def example(self, value):\n        \"\"\"Setter.\"\"\"\n\n\nclass VariadicParameters:\n    @property\n    def attribute_var_args(self, *args):  # [property-with-parameters]\n        return sum(args)\n\n    @property\n    def attribute_var_kwargs(self, **kwargs):  #[property-with-parameters]\n        return {key: value * 2 for key, value in kwargs.items()}\n\n\nfrom functools import cached_property\n\n\nclass Cached:\n    @cached_property\n    def cached_prop(self, value):  # [property-with-parameters]\n        ...\n\n\nimport abc\nimport enum\nimport types\n\n\nclass Baz:\n    @abc.abstractproperty\n    def prop2(self, param) -> None:  # [property-with-parameters]\n        return None\n\n    @types.DynamicClassAttribute\n    def prop3(self, param) -> None:  # [property-with-parameters]\n        return None\n\n    @enum.property\n    def prop4(self, param) -> None:  # [property-with-parameters]\n        return None\n" }
expected = [{ rule = "PLR0206", file = "case.py", start = 135, end = 144 }, { rule = "PLR0206", file = "case.py", start = 250, end = 272 }, { rule = "PLR0206", file = "case.py", start = 381, end = 406 }, { rule = "PLR0206", file = "case.py", start = 778, end = 796 }, { rule = "PLR0206", file = "case.py", start = 889, end = 909 }, { rule = "PLR0206", file = "case.py", start = 1106, end = 1117 }, { rule = "PLR0206", file = "case.py", start = 1259, end = 1264 }, { rule = "PLR0206", file = "case.py", start = 1379, end = 1384 }, { rule = "PLR0206", file = "case.py", start = 1485, end = 1490 }]

