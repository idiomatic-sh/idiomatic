
[[cases]]
name = "tagged-PYI062.py"
comparison = "full"
files = { "PYI062.py" = "from typing import Literal\nimport typing as t\nimport typing_extensions\n\nx: Literal[True, False, True, False]  # PYI062 twice here\n\ny: Literal[1, print(\"hello\"), 3, Literal[4, 1]]  # PYI062 on the last 1\n\nz: Literal[{1, 3, 5}, \"foobar\", {1,3,5}]  # PYI062 on the set literal\n\nLiteral[1, Literal[1]]  # once\nLiteral[1, 2, Literal[1, 2]]  # twice\nLiteral[1, Literal[1], Literal[1]]  # twice\nLiteral[1, Literal[2], Literal[2]]  # once\nt.Literal[1, t.Literal[2, t.Literal[1]]]  # once\ntyping_extensions.Literal[1, 1, 1]  # twice\nLiteral[\n    1, # comment\n    Literal[ # another comment\n        1\n    ]\n]  # once\n\n# Ensure issue is only raised once, even on nested literals\nMyType = Literal[\"foo\", Literal[True, False, True], \"bar\"]  # PYI062\n\nn: Literal[\"No\", \"duplicates\", \"here\", 1, \"1\"]\n\n\n# nested literals, all equivalent to `Literal[1]`\nLiteral[Literal[1]]  # no duplicate\nLiteral[Literal[Literal[1], Literal[1]]]  # once\nLiteral[Literal[1], Literal[Literal[Literal[1]]]]  # once\n" }
expected = [{ rule = "PYI062", file = "PYI062.py", start = 96, end = 100 }, { rule = "PYI062", file = "PYI062.py", start = 102, end = 107 }, { rule = "PYI062", file = "PYI062.py", start = 175, end = 176 }, { rule = "PYI062", file = "PYI062.py", start = 236, end = 243 }, { rule = "PYI062", file = "PYI062.py", start = 294, end = 295 }, { rule = "PYI062", file = "PYI062.py", start = 328, end = 329 }, { rule = "PYI062", file = "PYI062.py", start = 331, end = 332 }, { rule = "PYI062", file = "PYI062.py", start = 363, end = 364 }, { rule = "PYI062", file = "PYI062.py", start = 375, end = 376 }, { rule = "PYI062", file = "PYI062.py", start = 419, end = 420 }, { rule = "PYI062", file = "PYI062.py", start = 467, end = 468 }, { rule = "PYI062", file = "PYI062.py", start = 509, end = 510 }, { rule = "PYI062", file = "PYI062.py", start = 512, end = 513 }, { rule = "PYI062", file = "PYI062.py", start = 589, end = 590 }, { rule = "PYI062", file = "PYI062.py", start = 713, end = 717 }, { rule = "PYI062", file = "PYI062.py", start = 909, end = 910 }, { rule = "PYI062", file = "PYI062.py", start = 966, end = 967 }]

