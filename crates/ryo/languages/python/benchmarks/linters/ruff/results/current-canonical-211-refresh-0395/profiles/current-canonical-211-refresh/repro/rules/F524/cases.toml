[[cases]]
name = "missing-automatic-positional"
comparison = "full"
files = { "case.py" = "\"{}\".format()\n" }
expected = [{ "rule" = "F524", "file" = "case.py", "start" = 0, "end" = 13 }]

[[cases]]
name = "missing-explicit-positional"
comparison = "full"
files = { "case.py" = "\"{1}\".format(value)\n" }
expected = [{ "rule" = "F523", "file" = "case.py", "start" = 0, "end" = 19 }, { "rule" = "F524", "file" = "case.py", "start" = 0, "end" = 19 }, { "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 18 }]

[[cases]]
name = "all-positional-present"
comparison = "full"
files = { "case.py" = "\"{1}\".format(first, second)\n" }
expected = [{ "rule" = "F523", "file" = "case.py", "start" = 0, "end" = 27 }, { "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 18 }, { "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 26 }]

[[cases]]
name = "missing-keyword"
comparison = "full"
files = { "case.py" = "\"{name}\".format()\n" }
expected = [{ "rule" = "F524", "file" = "case.py", "start" = 0, "end" = 17 }]

[[cases]]
name = "malformed-field-path-does-not-require-keywords"
comparison = "full"
files = { "case.py" = "\"{x..}\".format()\n" }
expected = [{ "rule" = "F521", "file" = "case.py", "start" = 0, "end" = 16 }]

[[cases]]
name = "keyword-present"
comparison = "full"
files = { "case.py" = "\"{name}\".format(name=value)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 26 }]

[[cases]]
name = "nested-spec-missing-keyword"
comparison = "full"
files = { "case.py" = "\"{value:{width}}\".format(value=1)\n" }
expected = [{ "rule" = "F524", "file" = "case.py", "start" = 0, "end" = 33 }]

[[cases]]
name = "dynamic-positional-expansion-disables-check"
comparison = "full"
files = { "case.py" = "\"{1}\".format(*values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 14, "end" = 20 }]

[[cases]]
name = "dynamic-keyword-expansion-disables-check"
comparison = "full"
files = { "case.py" = "\"{name}\".format(**values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 18, "end" = 24 }]

[[cases]]
name = "noqa-missing-argument"
comparison = "full"
files = { "case.py" = "\"{}\".format()  # noqa: F524\n" }
expected = []
