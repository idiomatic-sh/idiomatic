[[cases]]
name = "logging-module"
comparison = "full"
files = { "case.py" = "import logging\nlogging.warn(\"x\")\n" }
expected = [{ "rule" = "G010", "file" = "case.py", "start" = 23, "end" = 27 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 32 }]

[[cases]]
name = "aliased-module"
comparison = "full"
files = { "case.py" = "import logging as log\nlog.warn(\"x\")\n" }
expected = [{ "rule" = "G010", "file" = "case.py", "start" = 26, "end" = 30 }, { "rule" = "LOG015", "file" = "case.py", "start" = 22, "end" = 35 }]

[[cases]]
name = "from-import"
comparison = "full"
