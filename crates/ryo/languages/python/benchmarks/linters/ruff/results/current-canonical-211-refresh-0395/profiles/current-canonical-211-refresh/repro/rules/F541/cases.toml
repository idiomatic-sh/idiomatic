[[cases]]
name = "static"
comparison = "full"
files = { "case.py" = "value = f\"hello\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 16 }]

[[cases]]
name = "interpolated"
comparison = "full"
files = { "case.py" = "value = f\"{name}\"\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 15 }]

[[cases]]
name = "braces"
comparison = "full"
files = { "case.py" = "value = f\"{{name}}\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 19 }]

[[cases]]
name = "concatenated"
comparison = "full"
files = { "case.py" = "value = f\"one\" \"two\" f\"three\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 14 }, { "rule" = "F541", "file" = "case.py", "start" = 21, "end" = 29 }]

[[cases]]
name = "mixed-interpolation"
comparison = "full"
files = { "case.py" = "value = f\"one\" f\"{name}\"\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 18, "end" = 22 }]

[[cases]]
name = "uppercase"
comparison = "full"
files = { "case.py" = "value = F\"hello\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 16 }]

[[cases]]
name = "raw-prefix"
comparison = "full"
files = { "case.py" = "value = rf\"hello\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 17 }]

[[cases]]
name = "nested"
comparison = "full"
files = { "case.py" = "value = f\"{f'hello'}\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 11, "end" = 19 }]

[[cases]]
name = "empty"
comparison = "full"
files = { "case.py" = "value = f\"\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 11 }]

[[cases]]
name = "multiline"
comparison = "full"
files = { "case.py" = "value = f\"\"\"one\ntwo\"\"\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 22 }]

[[cases]]
name = "multiline-noqa"
comparison = "full"
files = { "case.py" = "value = f\"\"\"one\ntwo\"\"\" # noqa\n" }
expected = []

[[cases]]
name = "format-spec"
comparison = "full"
files = { "case.py" = "value = f\"{name:>20}\"\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 15 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "value = f\"hello\" # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
comparison = "full"
files = { "case.py" = "value = f\"hello\" # noqa: F541\n" }
expected = []

[[cases]]
name = "other-code"
comparison = "full"
files = { "case.py" = "value = f\"hello\" # noqa: F401\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 16 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa\nvalue = f\"hello\"\n" }
expected = []

[[cases]]
name = "shared-block-suppressed"
comparison = "full"
files = { "case.py" = "# ruff: disable[F541]\nvalue = f\"hello\"\n\n# ruff: enable[F541]\n" }
expected = []

[[cases]]
name = "shared-block-reenabled"
comparison = "full"
files = { "case.py" = "# ruff: disable[F541]\n# ruff: enable[F541]\nvalue = f\"hello\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 51, "end" = 59 }]

[[cases]]
name = "shared-block-unmatched-disable"
comparison = "full"
files = { "case.py" = "# ruff: disable[F541]\nvalue = f\"hello\"\n" }
expected = []

[[cases]]
name = "shared-block-wrong-code"
comparison = "full"
files = { "case.py" = "# ruff: disable[E501]\nvalue = f\"hello\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 30, "end" = 38 }]

[[cases]]
name = "shared-file-ignore"
comparison = "full"
files = { "case.py" = "# ruff: file-ignore[F541]\nvalue = f\"hello\"\n" }
expected = []
