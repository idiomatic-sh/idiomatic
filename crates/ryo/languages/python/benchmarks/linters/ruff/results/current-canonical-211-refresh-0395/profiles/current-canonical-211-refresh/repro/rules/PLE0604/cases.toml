[[cases]]
name = "invalid-number"
comparison = "full"
files = { "case.py" = "__all__ = [1]\n" }
expected = [{ "rule" = "PLE0604", "file" = "case.py", "start" = 0, "end" = 7 }]

[[cases]]
name = "invalid-name"
comparison = "full"
files = { "case.py" = "__all__ = [Missing]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 18 }, { "rule" = "PLE0604", "file" = "case.py", "start" = 0, "end" = 7 }]

[[cases]]
name = "valid-strings"
comparison = "full"
files = { "case.py" = "__all__ = [\"ok\", 'also']\n" }
expected = [{ "rule" = "F822", "file" = "case.py", "start" = 11, "end" = 15 }, { "rule" = "F822", "file" = "case.py", "start" = 17, "end" = 23 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "__all__ = [1]  # noqa: PLE0604\n" }
expected = []

[[cases]]
name = "concatenated-list-invalid-member-gap"
comparison = "full"
files = { "case.py" = "__all__ = [\"A\"] + [Missing]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 26 }, { "rule" = "F822", "file" = "case.py", "start" = 11, "end" = 14 }, { "rule" = "PLE0604", "file" = "case.py", "start" = 0, "end" = 7 }]

[[cases]]
name = "list-call-invalid-member-gap"
comparison = "full"
files = { "case.py" = "__all__ = list([Missing])\n" }
expected = [{ "rule" = "C410", "file" = "case.py", "start" = 10, "end" = 25 }, { "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 23 }, { "rule" = "PLE0604", "file" = "case.py", "start" = 0, "end" = 7 }]

[[cases]]
name = "nested-function-is-not-module-export"
comparison = "full"
files = { "case.py" = "def f():\n    __all__ = 1\n" }
expected = [{ "rule" = "F841", "file" = "case.py", "start" = 13, "end" = 20 }]

[[cases]]
name = "list-set-constructor-invalid-member"
comparison = "full"
files = { "case.py" = "__all__ = list({Missing})\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 23 }, { "rule" = "PLE0604", "file" = "case.py", "start" = 0, "end" = 7 }]
