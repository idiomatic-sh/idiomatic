[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "dict((x, y) for x, y in values)\n" }
expected = [{ "rule" = "C402", "file" = "case.py", "start" = 0, "end" = 31 }, { "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 30 }]

[[cases]]
name = "assignment"
comparison = "full"
files = { "case.py" = "result = dict((x, y) for x, y in values)\n" }
expected = [{ "rule" = "C402", "file" = "case.py", "start" = 9, "end" = 40 }, { "rule" = "F821", "file" = "case.py", "start" = 33, "end" = 39 }]

[[cases]]
name = "parenthesized-function"
comparison = "full"
files = { "case.py" = "(dict)((x, y) for x, y in values)\n" }
expected = [{ "rule" = "C402", "file" = "case.py", "start" = 0, "end" = 33 }, { "rule" = "F821", "file" = "case.py", "start" = 26, "end" = 32 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "def f(dict):\n    dict((x, y) for x, y in values)\n" }
expected = [{ "rule" = "C402", "file" = "case.py", "start" = 17, "end" = 48 }, { "rule" = "F821", "file" = "case.py", "start" = 41, "end" = 47 }]

[[cases]]
name = "rebound"
comparison = "full"
files = { "case.py" = "dict = custom\ndict((x, y) for x, y in values)\n" }
expected = [{ "rule" = "C402", "file" = "case.py", "start" = 14, "end" = 45 }, { "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 38, "end" = 44 }]

[[cases]]
name = "qualified"
comparison = "full"
files = { "case.py" = "import builtins\nbuiltins.dict((x, y) for x, y in values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 49, "end" = 55 }]

[[cases]]
name = "imported-same-name"
comparison = "full"
files = { "case.py" = "from builtins import dict\ndict((x, y) for x, y in values)\n" }
expected = [{ "rule" = "C402", "file" = "case.py", "start" = 26, "end" = 57 }, { "rule" = "F821", "file" = "case.py", "start" = 50, "end" = 56 }, { "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 25 }]

[[cases]]
name = "imported-alias"
comparison = "full"
files = { "case.py" = "from builtins import dict as convert\nconvert((x, y) for x, y in values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 64, "end" = 70 }]

[[cases]]
name = "starred-argument"
comparison = "full"
files = { "case.py" = "dict(*[((x, y) for x, y in values)])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 27, "end" = 33 }]

[[cases]]
name = "empty"
comparison = "full"
files = { "case.py" = "dict()\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 6 }, { "rule" = "C408", "file" = "case.py", "start" = 0, "end" = 6 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "dict((x, y) for x, y in values) # noqa: C402\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 30 }]

[[cases]]
name = "range"
comparison = "full"
files = { "case.py" = "# ruff: disable[C402]\ndict((x, y) for x, y in values)\n# ruff: enable[C402]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 46, "end" = 52 }]

[[cases]]
name = "extra-positional"
comparison = "full"
files = { "case.py" = "dict(((x, y) for x, y in values), other)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }, { "rule" = "F821", "file" = "case.py", "start" = 34, "end" = 39 }]

[[cases]]
name = "keyword"
comparison = "full"
files = { "case.py" = "dict(((x, y) for x, y in values), unexpected=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }]

[[cases]]
name = "unpacked-keyword"
comparison = "full"
files = { "case.py" = "dict(((x, y) for x, y in values), **kwargs)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }, { "rule" = "F821", "file" = "case.py", "start" = 36, "end" = 42 }]

[[cases]]
name = "element-shape-0"
comparison = "full"
files = { "case.py" = "dict([x, y] for x, y in values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 30 }]

[[cases]]
name = "element-shape-1"
comparison = "full"
files = { "case.py" = "dict((x,) for x, y in values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 28 }]

[[cases]]
name = "element-shape-2"
comparison = "full"
files = { "case.py" = "dict((x, y, z) for x, y in values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 27, "end" = 33 }]

[[cases]]
name = "element-shape-3"
comparison = "full"
files = { "case.py" = "dict((*x, y) for x, y in values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }]
