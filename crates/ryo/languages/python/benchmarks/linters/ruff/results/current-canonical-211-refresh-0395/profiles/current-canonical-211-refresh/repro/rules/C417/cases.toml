[[cases]]
name = "direct-map"
comparison = "full"
files = { "case.py" = "result = map(lambda x: x + 1, values)\n" }
expected = [{ "rule" = "C417", "file" = "case.py", "start" = 9, "end" = 37 }, { "rule" = "F821", "file" = "case.py", "start" = 30, "end" = 36 }]

[[cases]]
name = "list-map"
comparison = "full"
files = { "case.py" = "result = list(map(lambda x: x + 1, values))\n" }
expected = [{ "rule" = "C417", "file" = "case.py", "start" = 9, "end" = 43 }, { "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 41 }]

