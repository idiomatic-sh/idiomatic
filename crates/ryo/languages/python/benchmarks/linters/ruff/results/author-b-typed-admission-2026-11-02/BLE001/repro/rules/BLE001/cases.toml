name = "upstream-pinned-BLE.py"
comparison = "full"
files = { "BLE.py" = "try:\n    pass\nexcept ValueError:\n    pass\nexcept Exception as e:\n    raise e\nfinally:\n    pass\n\n\ntry:\n    pass\nexcept BaseException as e:\n    raise e\nexcept TypeError:\n    pass\nelse:\n    pass\n\n\ntry:\n    pass\nexcept Exception as e:\n    raise e\nexcept BaseException:\n    pass\n\n\ntry:\n    pass\nexcept Exception:\n    pass\nfinally:\n    try:\n        pass\n    except BaseException as e:\n        raise e\n\n\ntry:\n    pass\nexcept Exception as e:\n    try:\n        raise e\n    except BaseException:\n        pass\n\n\ntry:\n    try:\n        pass\n    except BaseException as e:\n        raise e\nexcept Exception:\n    pass\n\n\ntry:\n    pass\nexcept Exception as e:\n    raise bad\nexcept BaseException:\n    pass\n\nimport logging\n\ntry:\n    pass\nexcept Exception:\n    logging.error(\"...\")  # BLE001\n\n\ntry:\n    pass\nexcept Exception:\n    logging.error(\"...\", exc_info=False)  # BLE001\n\n\ntry:\n    pass\nexcept Exception:\n    logging.error(\"...\", exc_info=None)  # BLE001\n\n\ntry:\n    pass\nexcept Exception:\n    logging.exception(\"...\")  # ok\n\n\ntry:\n    pass\nexcept Exception:\n    logging.error(\"...\", exc_info=True)  # ok\n\n\nfrom logging import critical, error, exception\n\ntry:\n    pass\nexcept Exception:\n    error(\"...\")  # BLE001\n\n\ntry:\n    pass\nexcept Exception:\n    error(\"...\", exc_info=False)  # BLE001\n\n\ntry:\n    pass\nexcept Exception:\n    error(\"...\", exc_info=None)  # BLE001\n\n\ntry:\n    pass\nexcept Exception:\n    critical(\"...\")  # BLE001\n\n\ntry:\n    pass\nexcept Exception:\n    critical(\"...\", exc_info=False)  # BLE001\n\n\ntry:\n    pass\nexcept Exception:\n    critical(\"...\", exc_info=None)  # BLE001\n\ntry:\n    pass\nexcept Exception:\n    exception(\"...\")  # ok\n\n\ntry:\n    pass\nexcept Exception:\n    error(\"...\", exc_info=True)  # ok\n\n\ntry:\n    pass\nexcept Exception:\n    critical(\"...\", exc_info=True)  # ok\n\n\ntry:\n    ...\nexcept Exception as e:\n    raise ValueError from e\n\ntry:\n    ...\nexcept Exception as e:\n    raise e from ValueError(\"hello\")\n\n\ntry:\n    pass\nexcept Exception:\n    if True:\n        exception(\"An error occurred\")\n    else:\n        exception(\"An error occurred\")\n\n# Test tuple exceptions\ntry:\n    pass\nexcept (Exception,):\n    pass\n\ntry:\n    pass\nexcept (Exception, ValueError):\n    pass\n\ntry:\n    pass\nexcept (ValueError, Exception):\n    pass\n\ntry:\n    pass\nexcept (ValueError, Exception) as e:\n    print(e)\n\ntry:\n    pass\nexcept (BaseException, TypeError):\n    pass\n\ntry:\n    pass\nexcept (TypeError, BaseException):\n    pass\n\ntry:\n    pass\nexcept (Exception, BaseException):\n    pass\n\ntry:\n    pass\nexcept (BaseException, Exception):\n    pass\n\n# Test nested tuples\ntry:\n    pass\nexcept ((Exception, ValueError), TypeError):\n    pass\n\ntry:\n    pass\nexcept (ValueError, (BaseException, TypeError)):\n    pass\n\n# Test valid tuple exceptions (should not trigger)\ntry:\n    pass\nexcept (ValueError, TypeError):\n    pass\n\ntry:\n    pass\nexcept (OSError, FileNotFoundError):\n    pass\n\ntry:\n    pass\nexcept (OSError, FileNotFoundError) as e:\n    print(e)\n\ntry:\n    pass\nexcept (Exception, ValueError):\n    critical(\"...\", exc_info=True)  # ok\n\ntry:\n    pass\nexcept (Exception, ValueError):\n    raise\n\ntry:\n    pass\nexcept (Exception, ValueError) as e:\n    raise e\n\n# `from None` cause\ntry:\n    pass\nexcept BaseException as e:\n    raise e from None\n\n\ntry:\n    pass\nexcept Exception as e:\n    logging.error(\"...\", exc_info=e)  # ok\n\n\ntry:\n    pass\nexcept Exception as e:\n    logging.debug(\"...\", exc_info=e)  # ok\n\n\ntry:\n    pass\nexcept Exception:\n    logging.info(\"...\", exc_info=True)  # ok \n\ntry:\n    pass\nexcept Exception as e:\n    logging.warn(\"...\", exc_info=e)  # ok\n\n\ntry:\n    pass\nexcept Exception:\n    logging.warning(\"...\", exc_info=True)  # ok\n\n\ntry:\n    pass\nexcept Exception as e:\n    logging.log(logging.INFO, \"...\", exc_info=e)  # ok\n" }
