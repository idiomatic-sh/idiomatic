[[cases]]
name = "automatic-then-indexed"
comparison = "full"
files = { "case.py" = "\"{} {0}\".format(value)\n" }
expected = [{ "rule" = "F525", "file" = "case.py", "start" = 0, "end" = 22 }, { "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 21 }]

[[cases]]
name = "indexed-then-automatic"
comparison = "full"
files = { "case.py" = "\"{0} {}\".format(value)\n" }
expected = [{ "rule" = "F525", "file" = "case.py", "start" = 0, "end" = 22 }, { "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 21 }]

[[cases]]
name = "mixed-in-nested-format-spec"
comparison = "full"
files = { "case.py" = "\"{:{0}}\".format(value, width)\n" }
expected = [{ "rule" = "F523", "file" = "case.py", "start" = 0, "end" = 29 }, { "rule" = "F525", "file" = "case.py", "start" = 0, "end" = 29 }, { "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 21 }, { "rule" = "F821", "file" = "case.py", "start" = 23, "end" = 28 }]

[[cases]]
name = "automatic-only"
comparison = "full"
files = { "case.py" = "\"{} {}\".format(a, b)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 16 }, { "rule" = "F821", "file" = "case.py", "start" = 18, "end" = 19 }]

[[cases]]
name = "indexed-only"
comparison = "full"
files = { "case.py" = "\"{0} {1}\".format(a, b)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 17, "end" = 18 }, { "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 21 }]

[[cases]]
name = "keyword-does-not-mix-with-automatic"
comparison = "full"
files = { "case.py" = "\"{name} {}\".format(value, name=other)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 24 }, { "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 36 }]

[[cases]]
name = "noqa-mixing"
comparison = "full"
files = { "case.py" = "\"{} {0}\".format(value)  # noqa: F525\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 21 }]
