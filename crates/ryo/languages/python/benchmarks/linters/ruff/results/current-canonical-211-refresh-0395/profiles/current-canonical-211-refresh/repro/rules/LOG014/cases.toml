[[cases]]
name = "error"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "LOG014", "file" = "case.py", "start" = 36, "end" = 49 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 50 }]

[[cases]]
name = "warn"
comparison = "full"
files = { "case.py" = "import logging\nlogging.warning(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "LOG014", "file" = "case.py", "start" = 38, "end" = 51 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 52 }]

[[cases]]
name = "log"
comparison = "full"
files = { "case.py" = "import logging\nlogging.log(logging.ERROR, \"bad\", exc_info=True)\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 63 }]

[[cases]]
name = "alias"
comparison = "full"
files = { "case.py" = "import logging as log\nlog.error(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "LOG014", "file" = "case.py", "start" = 39, "end" = 52 }, { "rule" = "LOG015", "file" = "case.py", "start" = 22, "end" = 53 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from logging import error\nerror(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "LOG014", "file" = "case.py", "start" = 39, "end" = 52 }, { "rule" = "LOG015", "file" = "case.py", "start" = 26, "end" = 53 }]

[[cases]]
name = "nonlogging"
comparison = "full"
files = { "case.py" = "other.error(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "other-method"
comparison = "full"
files = { "case.py" = "import logging\nlogging.exception(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "LOG014", "file" = "case.py", "start" = 40, "end" = 53 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 54 }]

[[cases]]
name = "false"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"bad\", exc_info=False)\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 51 }]

[[cases]]
name = "zero"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"bad\", exc_info=0)\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 47 }]

[[cases]]
name = "one"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"bad\", exc_info=1)\n" }
expected = [{ "rule" = "LOG014", "file" = "case.py", "start" = 36, "end" = 46 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 47 }]

[[cases]]
name = "nonliteral"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"bad\", exc_info=bool(1))\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 53 }]

[[cases]]
name = "handler"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    logging.error(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "G201", "file" = "case.py", "start" = 61, "end" = 66 }, { "rule" = "LOG015", "file" = "case.py", "start" = 53, "end" = 88 }]

[[cases]]
name = "nested-function-in-handler"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    def f():\n        logging.error(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "LOG015", "file" = "case.py", "start" = 70, "end" = 105 }]

[[cases]]
name = "function-outside"
comparison = "full"
files = { "case.py" = "import logging\ndef f():\n    logging.error(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "LOG014", "file" = "case.py", "start" = 49, "end" = 62 }, { "rule" = "LOG015", "file" = "case.py", "start" = 28, "end" = 63 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"bad\", exc_info=True)  # noqa: LOG014\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 50 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa: LOG014\nimport logging\nlogging.error(\"bad\", exc_info=True)\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 36, "end" = 71 }]

[[cases]]
name = "nonliteral-name"
