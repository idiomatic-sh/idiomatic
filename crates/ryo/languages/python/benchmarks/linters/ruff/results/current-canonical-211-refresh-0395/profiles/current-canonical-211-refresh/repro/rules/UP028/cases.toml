files = { "case.py" = "async def outer():\n    def inner():\n        for x in values:\n            yield x\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 53, "end" = 59 }, { "rule" = "UP028", "file" = "case.py", "start" = 44, "end" = 80 }]
