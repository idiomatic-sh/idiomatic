[[cases]]
name = "local-parameter-shadows-unused-module-import"
comparison = "full"
files = { "case.py" = "import datetime\ndef f(datetime):\n    return datetime.datetime.today()\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 15 }, { "rule" = "F811", "file" = "case.py", "start" = 22, "end" = 30 }]

[[cases]]
name = "for-target-shadow-is-owned-by-F402"
comparison = "full"
files = { "case.py" = "import os\nfor os in range(3):\n    pass\n" }
expected = [{ "rule" = "F402", "file" = "case.py", "start" = 14, "end" = 16 }]

[[cases]]
name = "lambda-parameter-does-not-redefine-outer-assignment"
comparison = "full"
files = { "case.py" = "list = custom\nx and not x and (lambda list: list())\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 14, "end" = 15 }, { "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 25 }]

[[cases]]
name = "lambda-parameter-does-not-redefine-later-function-assignment"
comparison = "full"
files = { "case.py" = "def f():\n    x or not x or (lambda list: list())\n    list = custom\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 13, "end" = 48 }, { "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 14 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 23 }, { "rule" = "F821", "file" = "case.py", "start" = 60, "end" = 66 }, { "rule" = "F841", "file" = "case.py", "start" = 53, "end" = 57 }, { "rule" = "SIM221", "file" = "case.py", "start" = 13, "end" = 48 }]

[[cases]]
name = "lambda-parameter-does-not-redefine-class-assignment"
comparison = "full"
files = { "case.py" = "class C:\n    list = custom\n    x or not x or (lambda list: list())\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 26 }, { "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 32 }, { "rule" = "F821", "file" = "case.py", "start" = 40, "end" = 41 }]

