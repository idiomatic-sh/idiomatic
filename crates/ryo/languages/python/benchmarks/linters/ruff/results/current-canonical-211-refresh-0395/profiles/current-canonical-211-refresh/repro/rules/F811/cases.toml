[[cases]]
name = "repeated-import"
comparison = "full"
files = { "case.py" = "import os\nimport os\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 17, "end" = 19 }, { "rule" = "F811", "file" = "case.py", "start" = 17, "end" = 19 }]

[[cases]]
name = "used-before-reimport"
comparison = "full"
files = { "case.py" = "import os\nprint(os.name)\nimport os\n" }
expected = []

[[cases]]
name = "read-after-reimport-is-not-prior-use"
comparison = "full"
files = { "case.py" = "import os\nimport os\nprint(os.name)\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 17, "end" = 19 }]

[[cases]]
name = "assignment-over-import"
comparison = "full"
files = { "case.py" = "import os\nos = 1\nprint(os)\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 10, "end" = 12 }]

[[cases]]
name = "function-redefinition"
comparison = "full"
files = { "case.py" = "def f():\n    pass\ndef f():\n    pass\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 22, "end" = 23 }]

[[cases]]
name = "different-branches"
comparison = "full"
files = { "case.py" = "if flag:\n    import os\nelse:\n    import os\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 40, "end" = 42 }, { "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 7 }]

[[cases]]
name = "same-branch-redefinition"
comparison = "full"
files = { "case.py" = "if flag:\n    import os\n    import os\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 34, "end" = 36 }, { "rule" = "F811", "file" = "case.py", "start" = 34, "end" = 36 }, { "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 7 }]

[[cases]]
name = "elif-arms-are-distinct"
comparison = "full"
files = { "case.py" = "if a:\n    import os\nelif b:\n    import os\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 39, "end" = 41 }, { "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 4 }, { "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 26 }]

[[cases]]
name = "elif-same-arm-redefinition"
comparison = "full"
files = { "case.py" = "if a:\n    import os\nelif b:\n    import os\n    import os\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 53, "end" = 55 }, { "rule" = "F811", "file" = "case.py", "start" = 53, "end" = 55 }, { "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 4 }, { "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 26 }]

[[cases]]
name = "deleted-before-reimport"
comparison = "full"
files = { "case.py" = "import os\ndel os\nimport os\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 24, "end" = 26 }]

[[cases]]
name = "conditional-delete-does-not-break-other-arm"
comparison = "full"
files = { "case.py" = "import os\nif flag:\n    del os\nelse:\n    import os\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 17 }]

[[cases]]
name = "conditional-delete-does-not-break-later-binding"
comparison = "full"
files = { "case.py" = "import os\nif flag:\n    del os\nimport os\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 17 }]

[[cases]]
name = "else-delete-breaks-static-history"
comparison = "full"
files = { "case.py" = "if flag:\n    import os\nelse:\n    del os\nimport os\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 7 }]

[[cases]]
name = "deferred-closure-uses-final-import"
comparison = "full"
files = { "case.py" = "import os\ndef f():\n    return os.name\nimport os\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 45, "end" = 47 }]

[[cases]]
name = "normalized-import-redefinition"
comparison = "full"
files = { "case.py" = "import os as ｘ\nimport os as x\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 30, "end" = 31 }, { "rule" = "F811", "file" = "case.py", "start" = 30, "end" = 31 }]

[[cases]]
name = "dummy-redefinition"
comparison = "full"
files = { "case.py" = "import os as _unused\nimport sys as _unused\n" }
