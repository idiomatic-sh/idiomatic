[[cases]]
name = "double"
comparison = "full"
files = { "case.py" = "value = not not x\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 17 }, { "rule" = "SIM208", "file" = "case.py", "start" = 8, "end" = 17 }]

[[cases]]
name = "parenthesized"
comparison = "full"
files = { "case.py" = "value = not (not x)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 17, "end" = 18 }, { "rule" = "SIM208", "file" = "case.py", "start" = 8, "end" = 19 }]

[[cases]]
name = "single"
comparison = "full"
files = { "case.py" = "value = not x\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 13 }]

[[cases]]
name = "mixed"
comparison = "full"
files = { "case.py" = "value = not -x\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 14 }]

[[cases]]
name = "boolean-test"
comparison = "full"
files = { "case.py" = "if not not x:\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 12 }, { "rule" = "SIM208", "file" = "case.py", "start" = 3, "end" = 12 }]

[[cases]]
name = "assert"
comparison = "full"
files = { "case.py" = "assert not not x\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 16 }, { "rule" = "SIM208", "file" = "case.py", "start" = 7, "end" = 16 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "value = not not x # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
comparison = "full"
files = { "case.py" = "value = not not x # noqa: SIM208\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 17 }]

[[cases]]
name = "other-code"
comparison = "full"
files = { "case.py" = "value = not not x # noqa: F401\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 17 }, { "rule" = "SIM208", "file" = "case.py", "start" = 8, "end" = 17 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa\nvalue = not not x\n" }
expected = []

