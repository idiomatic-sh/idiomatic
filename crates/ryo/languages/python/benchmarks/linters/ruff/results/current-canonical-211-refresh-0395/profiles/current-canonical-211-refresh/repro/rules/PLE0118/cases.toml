[[cases]]
name = "read-before-global"
comparison = "full"
files = { "case.py" = "def f():\n    print(value)\n    global value\n" }
expected = [{ "rule" = "PLE0118", "file" = "case.py", "start" = 19, "end" = 24 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 37, "end" = 42 }]

[[cases]]
name = "reads-after-global-are-allowed"
comparison = "full"
files = { "case.py" = "def f():\n    global value\n    print(value)\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 25 }]

[[cases]]
name = "nested-function-read-does-not-precede-global"
comparison = "full"
files = { "case.py" = "def f():\n    def g():\n        print(value)\n    global value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 54, "end" = 59 }]

[[cases]]
name = "assignment-before-global"
comparison = "full"
files = { "case.py" = "def f():\n    value = 1\n    global value\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 34, "end" = 39 }, { "rule" = "PLE0118", "file" = "case.py", "start" = 13, "end" = 18 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 34, "end" = 39 }]

[[cases]]
name = "delete-before-global"
comparison = "full"
files = { "case.py" = "def f():\n    del value\n    global value\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 17, "end" = 22 }, { "rule" = "PLE0118", "file" = "case.py", "start" = 17, "end" = 22 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 34, "end" = 39 }]

[[cases]]
name = "every-prior-use-is-reported"
comparison = "full"
files = { "case.py" = "def f():\n    print(value)\n    print(value)\n    global value\n" }
expected = [{ "rule" = "PLE0118", "file" = "case.py", "start" = 19, "end" = 24 }, { "rule" = "PLE0118", "file" = "case.py", "start" = 36, "end" = 41 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 54, "end" = 59 }]

[[cases]]
name = "noqa-suppresses-prior-use"
comparison = "full"
files = { "case.py" = "def f():\n    print(value)  # noqa: PLE0118\n    global value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 54, "end" = 59 }]
