[[cases]]
name = "future"
comparison = "full"
files = { "case.pyi" = "from __future__ import annotations\n" }
expected = [{ "rule" = "PYI044", "file" = "case.pyi", "start" = 0, "end" = 34 }]

[[cases]]
name = "multiple"
comparison = "full"
files = { "case.pyi" = "from __future__ import annotations, division\n" }
expected = [{ "rule" = "PYI044", "file" = "case.pyi", "start" = 0, "end" = 44 }, { "rule" = "UP010", "file" = "case.pyi", "start" = 0, "end" = 44 }]

[[cases]]
name = "alias"
comparison = "full"
files = { "case.pyi" = "from __future__ import annotations as feature\n" }
expected = [{ "rule" = "PYI044", "file" = "case.pyi", "start" = 0, "end" = 45 }]

[[cases]]
name = "other-feature"
comparison = "full"
files = { "case.pyi" = "from __future__ import division\n" }
expected = [{ "rule" = "UP010", "file" = "case.pyi", "start" = 0, "end" = 31 }]

