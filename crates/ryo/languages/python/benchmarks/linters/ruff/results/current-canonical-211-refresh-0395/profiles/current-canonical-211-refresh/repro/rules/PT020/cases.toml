[[cases]]
name = "basic"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.yield_fixture\ndef resource():\n    yield 1\n" }
expected = [{ "rule" = "PT020", "file" = "case.py", "start" = 14, "end" = 35 }]

[[cases]]
name = "call"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.yield_fixture()\ndef resource():\n    yield 1\n" }
