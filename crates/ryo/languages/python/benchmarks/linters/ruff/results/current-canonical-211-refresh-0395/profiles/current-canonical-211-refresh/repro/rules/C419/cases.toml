[[cases]]
name = "alias"
comparison = "full"
files = { "case.py" = "from builtins import any as some\nsome([x for x in values])\n" }
expected = [{ "rule" = "C419", "file" = "case.py", "start" = 38, "end" = 57 }, { "rule" = "F821", "file" = "case.py", "start" = 50, "end" = 56 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "def f(any):\n    any([x for x in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 32, "end" = 38 }]

[[cases]]
name = "async-generator"
comparison = "full"
files = { "case.py" = "async def f():\n    any([x async for x in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 41, "end" = 47 }]

[[cases]]
name = "await-element"
comparison = "full"
files = { "case.py" = "async def f():\n    any([await f(x) for x in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 44, "end" = 50 }]

[[cases]]
name = "nested-await-element"
comparison = "full"
files = { "case.py" = "async def f():\n    any([f(await g(x)) for x in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 32, "end" = 33 }, { "rule" = "F821", "file" = "case.py", "start" = 47, "end" = 53 }]

[[cases]]
name = "await-filter"
comparison = "full"
files = { "case.py" = "async def f():\n    any([x for x in values if await pred(x)])\n" }
expected = [{ "rule" = "C419", "file" = "case.py", "start" = 23, "end" = 59 }, { "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 41 }, { "rule" = "F821", "file" = "case.py", "start" = 51, "end" = 55 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "all([x for x in values]) # noqa: C419\n" }
