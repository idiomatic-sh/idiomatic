[[cases]]
name = "any-list"
comparison = "full"
files = { "case.py" = "any([x for x in values])\n" }
expected = [{ "rule" = "C419", "file" = "case.py", "start" = 4, "end" = 23 }, { "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 22 }]

