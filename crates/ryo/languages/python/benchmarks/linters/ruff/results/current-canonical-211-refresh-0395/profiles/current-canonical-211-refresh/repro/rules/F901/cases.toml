[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "raise NotImplemented\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 6, "end" = 20 }]

[[cases]]
name = "call"
comparison = "full"
files = { "case.py" = "raise NotImplemented(\"reason\")\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 6, "end" = 20 }]

[[cases]]
name = "parenthesized"
comparison = "full"
files = { "case.py" = "raise ((NotImplemented))\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 8, "end" = 22 }]

[[cases]]
name = "call-parenthesized"
comparison = "full"
files = { "case.py" = "raise (NotImplemented)()\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 7, "end" = 21 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "NotImplemented = ValueError\nraise NotImplemented\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 34, "end" = 48 }]

[[cases]]
name = "parameter"
comparison = "full"
files = { "case.py" = "def f(NotImplemented):\n    raise NotImplemented\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 33, "end" = 47 }]

[[cases]]
name = "qualified"
comparison = "full"
files = { "case.py" = "raise errors.NotImplemented\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 12 }]

[[cases]]
name = "error"
comparison = "full"
files = { "case.py" = "raise NotImplementedError\n" }
expected = []

[[cases]]
name = "cause-only"
comparison = "full"
files = { "case.py" = "raise ValueError from NotImplemented\n" }
expected = []

[[cases]]
name = "with-cause"
comparison = "full"
files = { "case.py" = "raise NotImplemented from ValueError\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 6, "end" = 20 }]

[[cases]]
name = "bare"
comparison = "full"
files = { "case.py" = "try:\n    f()\nexcept:\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 10 }, { "rule" = "TRY203", "file" = "case.py", "start" = 13, "end" = 30 }]

[[cases]]
name = "return"
comparison = "full"
files = { "case.py" = "def f():\n    return NotImplemented\n" }
expected = []

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "raise NotImplemented  # noqa: F901\n" }
expected = []

[[cases]]
name = "indented-range-does-not-cover-top-level"
comparison = "full"
files = { "case.py" = " # ruff: disable[F901]\nraise NotImplemented\n# ruff: enable[F901]\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 29, "end" = 43 }]

[[cases]]
name = "multiple"
comparison = "full"
files = { "case.py" = "raise NotImplemented; raise NotImplemented()\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 6, "end" = 20 }, { "rule" = "F901", "file" = "case.py", "start" = 28, "end" = 42 }]

[[cases]]
name = "nfkc-identifier-spelling"
comparison = "full"
files = { "case.py" = "raise ＮｏｔＩｍｐｌｅｍｅｎｔｅｄ\n" }
expected = [{ "rule" = "F901", "file" = "case.py", "start" = 6, "end" = 48 }]
