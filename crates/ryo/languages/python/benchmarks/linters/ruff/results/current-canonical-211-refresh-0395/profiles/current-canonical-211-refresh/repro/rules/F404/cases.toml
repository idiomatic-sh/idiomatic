[[cases]]
name = "first-future"
comparison = "full"
files = { "case.py" = "from __future__ import annotations\n" }
expected = []

[[cases]]
name = "module-docstring"
comparison = "full"
files = { "case.py" = "\"\"\"doc\"\"\"\nfrom __future__ import annotations\n" }
expected = []

[[cases]]
name = "consecutive-before-import"
comparison = "full"
files = { "case.py" = "from __future__ import annotations\nfrom __future__ import division\nimport os\nfrom __future__ import print_function\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 74, "end" = 76 }, { "rule" = "F404", "file" = "case.py", "start" = 77, "end" = 114 }, { "rule" = "UP010", "file" = "case.py", "start" = 35, "end" = 66 }, { "rule" = "UP010", "file" = "case.py", "start" = 77, "end" = 114 }]

[[cases]]
name = "after-assignment"
comparison = "full"
files = { "case.py" = "x = 1\nfrom __future__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 6, "end" = 40 }]

[[cases]]
name = "second-string-is-boundary"
comparison = "full"
files = { "case.py" = "\"doc\"\n\"extra\"\nfrom __future__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 14, "end" = 48 }]

[[cases]]
name = "inside-function"
comparison = "full"
files = { "case.py" = "def f():\n    from __future__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 13, "end" = 47 }]

[[cases]]
name = "inside-class"
comparison = "full"
files = { "case.py" = "class C:\n    from __future__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 13, "end" = 47 }]

[[cases]]
name = "inside-module-if"
comparison = "full"
files = { "case.py" = "if flag:\n    from __future__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 13, "end" = 47 }, { "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 7 }]

[[cases]]
name = "relative-future-is-not-future-statement"
comparison = "full"
files = { "case.py" = "from .__future__ import annotations\n" }
expected = []

[[cases]]
name = "unicode-prefix"
comparison = "full"
files = { "case.py" = "label = \"é\"\nfrom __future__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 13, "end" = 47 }]

[[cases]]
name = "inline-noqa"
comparison = "full"
files = { "case.py" = "x = 1\nfrom __future__ import annotations  # noqa: F404\n" }
expected = []

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa: F404\nx = 1\nfrom __future__ import annotations\n" }
expected = []

[[cases]]
name = "bytes-is-not-a-docstring"
comparison = "full"
files = { "case.py" = "b\"bytes\"\nfrom __future__ import annotations\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "F404", "file" = "case.py", "start" = 9, "end" = 43 }]

[[cases]]
name = "fstring-is-not-a-docstring"
comparison = "full"
files = { "case.py" = "f\"doc\"\nfrom __future__ import annotations\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 0, "end" = 6 }, { "rule" = "F404", "file" = "case.py", "start" = 7, "end" = 41 }, { "rule" = "F541", "file" = "case.py", "start" = 0, "end" = 6 }]

[[cases]]
name = "concatenated-string-docstring"
comparison = "full"
files = { "case.py" = "(\"doc\" \"string\")\nfrom __future__ import annotations\n" }
expected = []

[[cases]]
name = "second-docstring-is-a-boundary"
comparison = "full"
files = { "case.py" = "\"doc\"\nfrom __future__ import annotations\n\"second\"\nfrom __future__ import division\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 50, "end" = 81 }, { "rule" = "UP010", "file" = "case.py", "start" = 50, "end" = 81 }]

[[cases]]
name = "late-wildcard-future-import"
comparison = "full"
files = { "case.py" = "x = 1\nfrom __future__ import *\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 6, "end" = 30 }, { "rule" = "F407", "file" = "case.py", "start" = 29, "end" = 30 }]

[[cases]]
name = "multiline-future-import"
comparison = "full"
files = { "case.py" = "x = 1\nfrom __future__ import (\n    annotations,\n)\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 6, "end" = 49 }]

[[cases]]
name = "multiline-parent-noqa"
comparison = "full"
files = { "case.py" = "x = 1\nfrom __future__ import (  # noqa: F404\n    annotations,\n)\n" }
expected = []

[[cases]]
name = "relative-future-after-statement"
comparison = "full"
files = { "case.py" = "x=1\nfrom .__future__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 4, "end" = 39 }]

[[cases]]
name = "nested-relative-future"
comparison = "full"
files = { "case.py" = "def f():\n    from .__future__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 13, "end" = 48 }]

[[cases]]
name = "relative-then-absolute-before-boundary"
comparison = "full"
files = { "case.py" = "from .__future__ import annotations\nfrom __future__ import division\n" }
expected = [{ "rule" = "UP010", "file" = "case.py", "start" = 36, "end" = 67 }]

[[cases]]
name = "multi-code-inline-noqa"
comparison = "full"
files = { "case.py" = "x=1\nfrom __future__ import annotations # noqa: F401, F404\n" }
expected = []

[[cases]]
name = "multiline-import-inline-noqa"
comparison = "full"
files = { "case.py" = "x=1\nfrom __future__ import ( # noqa: F401, F404\n    annotations,\n)\n" }
expected = []

[[cases]]
name = "relative-future-permutation"
comparison = "full"
files = { "case.py" = "from .__future__ import annotations\nfrom .__future__ import division\n" }
expected = [{ "rule" = "UP010", "file" = "case.py", "start" = 36, "end" = 68 }]

[[cases]]
name = "nfkc-future-module-after-statement"
comparison = "full"
files = { "case.py" = "x=1\nfrom __ｆｕｔｕｒｅ__ import annotations\n" }
expected = [{ "rule" = "F404", "file" = "case.py", "start" = 4, "end" = 50 }]
