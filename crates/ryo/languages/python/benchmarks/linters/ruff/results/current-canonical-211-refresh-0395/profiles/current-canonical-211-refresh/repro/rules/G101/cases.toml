[[cases]]
name = "dict-literal"
comparison = "full"
files = { "case.py" = "import logging\nlogging.info(\"x\", extra={\"name\": \"a\", \"thread\": 1})\n" }
expected = [{ "rule" = "G101", "file" = "case.py", "start" = 40, "end" = 46 }, { "rule" = "G101", "file" = "case.py", "start" = 53, "end" = 61 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 66 }]

[[cases]]
name = "dict-concatenated-key"
comparison = "full"
files = { "case.py" = "import logging\nlogging.info(\"x\", extra={\"lev\" \"elname\": 1})\n" }
expected = [{ "rule" = "G101", "file" = "case.py", "start" = 40, "end" = 54 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 59 }]

[[cases]]
name = "dict-call"
comparison = "full"
files = { "case.py" = "import logging\nlogging.info(\"x\", extra=dict(name=\"a\", message=\"b\"))\n" }
expected = [{ "rule" = "C408", "file" = "case.py", "start" = 39, "end" = 66 }, { "rule" = "G101", "file" = "case.py", "start" = 44, "end" = 52 }, { "rule" = "G101", "file" = "case.py", "start" = 54, "end" = 65 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 67 }]

[[cases]]
name = "duplicate-key"
comparison = "full"
files = { "case.py" = "import logging\nlogging.info(\"x\", extra={\"name\": 1, \"name\": 2})\n" }
expected = [{ "rule" = "F601", "file" = "case.py", "start" = 51, "end" = 57 }, { "rule" = "G101", "file" = "case.py", "start" = 40, "end" = 46 }, { "rule" = "G101", "file" = "case.py", "start" = 51, "end" = 57 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 62 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from logging import error\nerror(\"x\", extra={\"args\": 1})\n" }
expected = [{ "rule" = "G101", "file" = "case.py", "start" = 44, "end" = 50 }, { "rule" = "LOG015", "file" = "case.py", "start" = 26, "end" = 55 }]

[[cases]]
name = "logger-instance"
comparison = "full"
files = { "case.py" = "import logging\nlogger = logging.getLogger(__name__)\nlogger.error(\"x\", extra={\"name\": 1})\n" }
expected = [{ "rule" = "G101", "file" = "case.py", "start" = 77, "end" = 83 }]

[[cases]]
name = "alias-module"
comparison = "full"
files = { "case.py" = "import logging as log\nlog.warning(\"x\", extra={\"process\": 1})\n" }
expected = [{ "rule" = "G101", "file" = "case.py", "start" = 46, "end" = 55 }, { "rule" = "LOG015", "file" = "case.py", "start" = 22, "end" = 60 }]

[[cases]]
name = "nonreserved"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"x\", extra={\"custom\": 1})\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 54 }]

[[cases]]
name = "nonstring-key"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"x\", extra={42: 1, key: 2})\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 48, "end" = 51 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 56 }]

[[cases]]
name = "nested-only"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"x\", extra={\"custom\": {\"name\": 1}})\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 64 }]

[[cases]]
name = "other-extra-name"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"x\", fields={\"name\": 1})\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 53 }]

[[cases]]
name = "not-logger"
comparison = "full"
files = { "case.py" = "other.error(\"x\", extra={\"name\": 1})\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "not-dict"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"x\", extra=items)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 40, "end" = 45 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 46 }]

[[cases]]
name = "builtin-dict-call"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"x\", extra=dict(**{\"name\": 1}))\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 60 }]

[[cases]]
name = "shadowed-dict"
comparison = "full"
files = { "case.py" = "import logging\ndef f(dict):\n    logging.error(\"x\", extra=dict(name=1))\n" }
expected = [{ "rule" = "LOG015", "file" = "case.py", "start" = 32, "end" = 70 }]

[[cases]]
