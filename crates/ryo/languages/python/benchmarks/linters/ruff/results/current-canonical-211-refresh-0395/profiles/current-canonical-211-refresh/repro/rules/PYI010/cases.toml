comparison = "full"
files = { "case.pyi" = "def f(): work()\n" }
expected = [{ "rule" = "F821", "file" = "case.pyi", "start" = 9, "end" = 13 }, { "rule" = "PYI010", "file" = "case.pyi", "start" = 9, "end" = 15 }]

