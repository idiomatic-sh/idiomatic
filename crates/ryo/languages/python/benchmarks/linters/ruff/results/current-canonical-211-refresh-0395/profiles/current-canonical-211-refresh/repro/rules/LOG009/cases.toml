[[cases]]
name = "import-warning"
comparison = "full"
files = { "case.py" = "import logging\nvalue = logging.WARN\n" }
expected = [{ "rule" = "LOG009", "file" = "case.py", "start" = 23, "end" = 35 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import logging as log\nvalue = log.WARN\n" }
expected = [{ "rule" = "LOG009", "file" = "case.py", "start" = 30, "end" = 38 }]

[[cases]]
name = "from-import-warning"
comparison = "full"
files = { "case.py" = "from logging import WARN\nvalue = WARN\n" }
expected = [{ "rule" = "LOG009", "file" = "case.py", "start" = 33, "end" = 37 }]

[[cases]]
name = "from-import-alias"
comparison = "full"
files = { "case.py" = "from logging import WARN as warning\nvalue = warning\n" }
expected = [{ "rule" = "LOG009", "file" = "case.py", "start" = 44, "end" = 51 }]

[[cases]]
name = "multiple-references"
comparison = "full"
files = { "case.py" = "import logging\na = logging.WARN\nb = logging.WARNING\nc = logging.WARN\n" }
expected = [{ "rule" = "LOG009", "file" = "case.py", "start" = 19, "end" = 31 }, { "rule" = "LOG009", "file" = "case.py", "start" = 56, "end" = 68 }]

[[cases]]
name = "other-module"
comparison = "full"
files = { "case.py" = "import other\nvalue = other.WARN\n" }
expected = []

[[cases]]
name = "no-import"
comparison = "full"
files = { "case.py" = "value = logging.WARN\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 15 }]

[[cases]]
name = "shadow-module"
comparison = "full"
files = { "case.py" = "import logging\nlogging = object()\nvalue = logging.WARN\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 15, "end" = 22 }]

[[cases]]
name = "string-attribute"
comparison = "full"
files = { "case.py" = "import logging\nvalue = getattr(logging, \"WARN\")\n" }
expected = [{ "rule" = "B009", "file" = "case.py", "start" = 23, "end" = 47 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "import logging\nvalue = logging.WARN  # noqa: LOG009\n" }
expected = []

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa: LOG009\nimport logging\nvalue = logging.WARN\n" }
expected = []

[[cases]]
name = "unicode-prefix"
comparison = "full"
files = { "case.py" = "import logging\nπ = 1\nvalue = logging.WARN\n" }
expected = [{ "rule" = "LOG009", "file" = "case.py", "start" = 30, "end" = 42 }]
