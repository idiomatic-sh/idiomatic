[[cases]]
name = "equal"
comparison = "full"
files = { "case.py" = "a == b\n" }
expected = [{ "rule" = "B015", "file" = "case.py", "start" = 0, "end" = 6 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 5, "end" = 6 }]

