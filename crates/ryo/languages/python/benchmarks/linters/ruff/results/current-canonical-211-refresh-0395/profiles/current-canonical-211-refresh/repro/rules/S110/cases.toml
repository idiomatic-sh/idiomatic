[[cases]]
name = "bare"
comparison = "full"
files = { "case.py" = "try:\n    f()\nexcept:\n    pass\n" }
expected = [{ "rule" = "E722", "file" = "case.py", "start" = 13, "end" = 19 }, { "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 10 }, { "rule" = "S110", "file" = "case.py", "start" = 13, "end" = 29 }]

[[cases]]
name = "exception"
comparison = "full"
files = { "case.py" = "try:\n    f()\nexcept Exception:\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 10 }, { "rule" = "S110", "file" = "case.py", "start" = 13, "end" = 39 }]

[[cases]]
name = "base"
comparison = "full"
files = { "case.py" = "try:\n    f()\nexcept BaseException:\n    pass\n" }
