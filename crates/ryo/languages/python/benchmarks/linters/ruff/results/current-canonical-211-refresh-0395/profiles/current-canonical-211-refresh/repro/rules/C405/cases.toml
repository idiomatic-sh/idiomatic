[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "set([1, 2])\n" }
expected = [{ "rule" = "C405", "file" = "case.py", "start" = 0, "end" = 11 }]

[[cases]]
name = "assignment"
comparison = "full"
files = { "case.py" = "result = set([1, 2])\n" }
expected = [{ "rule" = "C405", "file" = "case.py", "start" = 9, "end" = 20 }]

[[cases]]
name = "parenthesized-function"
comparison = "full"
files = { "case.py" = "(set)([1, 2])\n" }
expected = [{ "rule" = "C405", "file" = "case.py", "start" = 0, "end" = 13 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "def f(set):\n    set([1, 2])\n" }
expected = []

[[cases]]
name = "rebound"
comparison = "full"
files = { "case.py" = "set = custom\nset([1, 2])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 12 }]

[[cases]]
name = "qualified"
comparison = "full"
files = { "case.py" = "import builtins\nbuiltins.set([1, 2])\n" }
expected = []

