[[cases]]
name = "unused-import"
comparison = "full"
files = { "case.py" = "import os\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 9 }]

[[cases]]
name = "used-import"
comparison = "full"
files = { "case.py" = "import os\nprint(os.name)\n" }
expected = []

[[cases]]
name = "async-function-local-import"
comparison = "full"
files = { "case.py" = "async def f():\n    import os\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 26, "end" = 28 }]

[[cases]]
name = "sync-function-local-import-control"
