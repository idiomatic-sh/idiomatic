[[cases]]
name = "global-without-assignment"
comparison = "full"
files = { "case.py" = "def f():\n    global X\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 21 }]

[[cases]]
name = "global-read-without-assignment"
comparison = "full"
files = { "case.py" = "def f():\n    global X\n    print(X)\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 21 }]

[[cases]]
name = "assignment-after-global"
comparison = "full"
files = { "case.py" = "def f():\n    global X\n    X = 1\n" }
expected = []

[[cases]]
name = "delete-reference-is-not-an-all-load-global"
comparison = "full"
files = { "case.py" = "def f():\n    global X\n    del X\n" }
expected = []

[[cases]]
name = "global-declaration-is-suppressed-by-code-specific-noqa"
comparison = "full"
files = { "case.py" = "def f():\n    global X  # noqa: PLW0602\n" }
expected = []

[[cases]]
name = "module-global-is-not-function-global-warning"
comparison = "full"
files = { "case.py" = "global value # noqa: F401\n" }
expected = [{ "rule" = "PLW0604", "file" = "case.py", "start" = 0, "end" = 12 }]

[[cases]]
name = "delete-before-global-does-not-suppress-final-global-binding"
comparison = "full"
files = { "case.py" = "def f():\n    del value\n    global value\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 17, "end" = 22 }, { "rule" = "PLE0118", "file" = "case.py", "start" = 17, "end" = 22 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 34, "end" = 39 }]

[[cases]]
name = "class-global-at-module-level-is-a-nonmodule-scope"
comparison = "full"
files = { "case.py" = "class C:\n    global value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 25 }]

[[cases]]
name = "class-global-inside-function-uses-class-scope"
comparison = "full"
files = { "case.py" = "def f():\n    class C:\n        global value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 37, "end" = 42 }]

[[cases]]
name = "repeated-global-without-assignment-is-reported-once"
comparison = "full"
files = { "case.py" = "def f():\n    global value\n    global value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 37, "end" = 42 }]

[[cases]]
name = "binding-before-global-remains-final-global-binding"
comparison = "full"
files = { "case.py" = "def f():\n    value = 1\n    global value\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 34, "end" = 39 }, { "rule" = "PLE0118", "file" = "case.py", "start" = 13, "end" = 18 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 34, "end" = 39 }]
