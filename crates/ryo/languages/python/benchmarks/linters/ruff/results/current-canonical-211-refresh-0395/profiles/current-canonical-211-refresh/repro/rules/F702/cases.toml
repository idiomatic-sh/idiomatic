[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "continue\n" }
expected = [{ "rule" = "F702", "file" = "case.py", "start" = 0, "end" = 8 }]

[[cases]]
name = "function"
comparison = "full"
files = { "case.py" = "def f():\n    continue\n" }
expected = [{ "rule" = "F702", "file" = "case.py", "start" = 13, "end" = 21 }]

[[cases]]
name = "while"
comparison = "full"
files = { "case.py" = "while ready:\n    continue\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }]

[[cases]]
name = "for"
comparison = "full"
files = { "case.py" = "for item in items:\n    continue\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 17 }]

[[cases]]
name = "nested-if"
comparison = "full"
files = { "case.py" = "while ready:\n    if item:\n        continue\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }, { "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 24 }]

[[cases]]
name = "loop-else"
comparison = "full"
files = { "case.py" = "while ready:\n    pass\nelse:\n    continue\n" }
expected = [{ "rule" = "F702", "file" = "case.py", "start" = 32, "end" = 40 }, { "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }, { "rule" = "PLW0120", "file" = "case.py", "start" = 22, "end" = 26 }]

[[cases]]
name = "nested-else"
comparison = "full"
files = { "case.py" = "while ready:\n    for item in items:\n        pass\n    else:\n        continue\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }, { "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 34 }, { "rule" = "PLW0120", "file" = "case.py", "start" = 53, "end" = 57 }]

[[cases]]
name = "nested-function"
comparison = "full"
files = { "case.py" = "while ready:\n    def f():\n        continue\n" }
expected = [{ "rule" = "F702", "file" = "case.py", "start" = 34, "end" = 42 }, { "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }]

[[cases]]
name = "nested-class"
comparison = "full"
files = { "case.py" = "while ready:\n    class C:\n        continue\n" }
expected = [{ "rule" = "F702", "file" = "case.py", "start" = 34, "end" = 42 }, { "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }]

[[cases]]
name = "function-loop"
comparison = "full"
files = { "case.py" = "def f():\n    while ready:\n        continue\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 24 }]

