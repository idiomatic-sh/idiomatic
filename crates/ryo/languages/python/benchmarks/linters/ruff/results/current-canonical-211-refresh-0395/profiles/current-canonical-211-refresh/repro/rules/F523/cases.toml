[[cases]]
name = "extra-positional"
comparison = "full"
files = { "case.py" = "\"{}\".format(value, unused)\n" }
expected = [{ "rule" = "F523", "file" = "case.py", "start" = 0, "end" = 26 }, { "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 17 }, { "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 25 }]

[[cases]]
name = "all-positional-used"
comparison = "full"
files = { "case.py" = "\"{} {}\".format(first, second)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 20 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 28 }]

[[cases]]
name = "explicit-index-holes"
comparison = "full"
files = { "case.py" = "\"{1}\".format(unused, used, extra)\n" }
expected = [{ "rule" = "F523", "file" = "case.py", "start" = 0, "end" = 33 }, { "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 19 }, { "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 25 }, { "rule" = "F821", "file" = "case.py", "start" = 27, "end" = 32 }]

[[cases]]
name = "automatic-fields-use-each-position"
comparison = "full"
files = { "case.py" = "\"{} {}\".format(first, second, extra)\n" }
expected = [{ "rule" = "F523", "file" = "case.py", "start" = 0, "end" = 36 }, { "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 20 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 28 }, { "rule" = "F821", "file" = "case.py", "start" = 30, "end" = 35 }]

[[cases]]
name = "malformed-field-path-does-not-use-positionals"
comparison = "full"
files = { "case.py" = "\"{x..}\".format(value, unused)\n" }
expected = [{ "rule" = "F521", "file" = "case.py", "start" = 0, "end" = 29 }, { "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 20 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 28 }]

[[cases]]
name = "starred-leading-argument-shifts-index"
comparison = "full"
files = { "case.py" = "\"{1}\".format(*values, used, extra)\n" }
expected = [{ "rule" = "F523", "file" = "case.py", "start" = 0, "end" = 34 }, { "rule" = "F821", "file" = "case.py", "start" = 14, "end" = 20 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 26 }, { "rule" = "F821", "file" = "case.py", "start" = 28, "end" = 33 }]

[[cases]]
name = "unused-starred-argument-is-not-flagged"
comparison = "full"
files = { "case.py" = "\"{0}\".format(*values)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 14, "end" = 20 }]

[[cases]]
name = "noqa-extra-positional"
comparison = "full"
files = { "case.py" = "\"{}\".format(value, unused)  # noqa: F523\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 17 }, { "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 25 }]
