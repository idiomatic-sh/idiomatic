[[cases]]
name = "lambda-parameter-does-not-shadow-builtin-in-current-scope"
comparison = "full"
files = { "case.py" = "x and not x and (lambda list: list())\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 37 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 10, "end" = 11 }, { "rule" = "SIM220", "file" = "case.py", "start" = 0, "end" = 37 }]

[[cases]]
name = "module-annotation-does-not-shadow-builtin-in-current-scope"
