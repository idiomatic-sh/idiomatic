expected = [{ "rule" = "B018", "file" = "case.py", "start" = 13, "end" = 50 }, { "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 14 }, { "rule" = "F821", "file" = "case.py", "start" = 23, "end" = 24 }, { "rule" = "F821", "file" = "case.py", "start" = 62, "end" = 68 }, { "rule" = "F841", "file" = "case.py", "start" = 55, "end" = 59 }, { "rule" = "SIM220", "file" = "case.py", "start" = 13, "end" = 50 }]

