[[cases]]
name = "string"
comparison = "full"
files = { "case.py" = "class C:\n    __slots__ = \"name\"\n" }
expected = [{ "rule" = "PLC0205", "file" = "case.py", "start" = 13, "end" = 31 }]

[[cases]]
name = "tuple"
