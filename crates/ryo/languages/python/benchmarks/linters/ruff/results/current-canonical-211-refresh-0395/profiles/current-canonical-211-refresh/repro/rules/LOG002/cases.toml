[[cases]]
name = "local-after"
comparison = "full"
files = { "case.py" = "import logging\ndef f():\n    logging.getLogger(__file__)\n    __file__ = \"other\"\n" }
expected = [{ "rule" = "F823", "file" = "case.py", "start" = 46, "end" = 54 }, { "rule" = "F841", "file" = "case.py", "start" = 60, "end" = 68 }, { "rule" = "LOG002", "file" = "case.py", "start" = 46, "end" = 54 }]

[[cases]]
name = "delete-module"
comparison = "full"
files = { "case.py" = "import logging\n__file__ = \"other\"\ndel __file__\nlogging.getLogger(__file__)\n" }
