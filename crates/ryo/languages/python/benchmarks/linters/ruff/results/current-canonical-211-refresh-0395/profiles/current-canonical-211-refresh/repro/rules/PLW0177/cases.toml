expected = [{ "rule" = "B015", "file" = "case.py", "start" = 19, "end" = 30 }, { "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 20 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 24, "end" = 30 }]

[[cases]]
