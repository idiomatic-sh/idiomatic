[[cases]]
name = "math-nan"
comparison = "full"
files = { "case.py" = "import math\nx == math.nan\n" }
expected = [{ "rule" = "B015", "file" = "case.py", "start" = 12, "end" = 25 }, { "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 13 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 17, "end" = 25 }]

[[cases]]
name = "math-alias"
comparison = "full"
files = { "case.py" = "import math as m\nx != m.nan\n" }
expected = [{ "rule" = "B015", "file" = "case.py", "start" = 17, "end" = 27 }, { "rule" = "F821", "file" = "case.py", "start" = 17, "end" = 18 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 22, "end" = 27 }]

[[cases]]
