[[cases]]
name = "shared-block-reenabled"
comparison = "full"
files = { "case.py" = "# ruff: disable[B021]\n# ruff: enable[B021]\nf\"doc\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 43, "end" = 49 }, { "rule" = "F541", "file" = "case.py", "start" = 43, "end" = 49 }]

[[cases]]
name = "shared-block-unmatched-disable"
comparison = "full"
files = { "case.py" = "# ruff: disable[B021]\nf\"doc\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 22, "end" = 28 }]

[[cases]]
name = "shared-block-wrong-code"
comparison = "full"
files = { "case.py" = "# ruff: disable[E501]\nf\"doc\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 22, "end" = 28 }, { "rule" = "F541", "file" = "case.py", "start" = 22, "end" = 28 }]

[[cases]]
name = "shared-file-ignore"
comparison = "full"
files = { "case.py" = "# ruff: file-ignore[B021]\nf\"doc\"\n" }
