[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "f\"doc\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 0, "end" = 6 }, { "rule" = "F541", "file" = "case.py", "start" = 0, "end" = 6 }]

[[cases]]
name = "function"
comparison = "full"
files = { "case.py" = "def f():\n    f\"doc\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 13, "end" = 19 }, { "rule" = "F541", "file" = "case.py", "start" = 13, "end" = 19 }]

[[cases]]
name = "class"
comparison = "full"
files = { "case.py" = "class C:\n    f\"doc\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 13, "end" = 19 }, { "rule" = "F541", "file" = "case.py", "start" = 13, "end" = 19 }]

[[cases]]
name = "async"
comparison = "full"
files = { "case.py" = "async def f():\n    f\"doc\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 19, "end" = 25 }, { "rule" = "F541", "file" = "case.py", "start" = 19, "end" = 25 }]

[[cases]]
name = "second"
comparison = "full"
files = { "case.py" = "\"doc\"\nf\"later\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 6, "end" = 14 }]

[[cases]]
name = "if-body"
comparison = "full"
files = { "case.py" = "if True:\n    f\"doc\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 13, "end" = 19 }]

[[cases]]
name = "interpolation"
comparison = "full"
files = { "case.py" = "f\"{value}\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 0, "end" = 10 }, { "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 8 }]

[[cases]]
name = "comment"
comparison = "full"
files = { "case.py" = " # comment\nf\"doc\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 11, "end" = 17 }, { "rule" = "F541", "file" = "case.py", "start" = 11, "end" = 17 }]

[[cases]]
name = "normal"
comparison = "full"
files = { "case.py" = "\"doc\"\n" }
expected = []

[[cases]]
name = "concatenated"
comparison = "full"
files = { "case.py" = "\"doc\" f\"more\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 0, "end" = 13 }, { "rule" = "F541", "file" = "case.py", "start" = 6, "end" = 13 }]

[[cases]]
name = "parentheses"
comparison = "full"
files = { "case.py" = "(f\"doc\")\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "F541", "file" = "case.py", "start" = 1, "end" = 7 }]

[[cases]]
name = "multiline-string-noqa"
comparison = "full"
files = { "case.py" = "f\"\"\"doc\nmore\"\"\" # noqa\n" }
expected = []

[[cases]]
name = "multiline-concat-noqa"
comparison = "full"
files = { "case.py" = "(f\"one\"\n f\"two\") # noqa\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 0, "end" = 16 }, { "rule" = "F541", "file" = "case.py", "start" = 1, "end" = 7 }]

[[cases]]
name = "multiline-string"
comparison = "full"
files = { "case.py" = "f\"\"\"doc\nmore\"\"\"\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 0, "end" = 15 }, { "rule" = "F541", "file" = "case.py", "start" = 0, "end" = 15 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "f\"doc\" # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
comparison = "full"
files = { "case.py" = "f\"doc\" # noqa: B021\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 0, "end" = 6 }]

[[cases]]
name = "other-code"
comparison = "full"
files = { "case.py" = "f\"doc\" # noqa: F401\n" }
expected = [{ "rule" = "B021", "file" = "case.py", "start" = 0, "end" = 6 }, { "rule" = "F541", "file" = "case.py", "start" = 0, "end" = 6 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa\nf\"doc\"\n" }
expected = []

[[cases]]
name = "shared-block-suppressed"
