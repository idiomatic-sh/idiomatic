[[cases]]
name = "same-name-target-and-iterable"
comparison = "full"
files = { "case.py" = "items = [1, 2]\nfor items in items:\n    pass\n" }
expected = [{ "rule" = "B020", "file" = "case.py", "start" = 19, "end" = 24 }]

[[cases]]
name = "tuple-target-selects-the-overridden-name"
comparison = "full"
files = { "case.py" = "values = {}\nfor key, values in values.items():\n    pass\n" }
expected = [{ "rule" = "B020", "file" = "case.py", "start" = 21, "end" = 27 }]

[[cases]]
name = "lambda-parameter-shadows-iterator-name"
comparison = "full"
files = { "case.py" = "for item in items(key=lambda item: item):\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 17 }]

[[cases]]
name = "lambda-closure-reads-iterator-name"
comparison = "full"
files = { "case.py" = "for item in items(key=lambda: item):\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 17 }]

[[cases]]
name = "lambda-body-descendant-reads-iterator-name"
comparison = "full"
files = { "case.py" = "for item in items(key=lambda: use(item)):\n    pass\n" }
expected = [{ "rule" = "B020", "file" = "case.py", "start" = 4, "end" = 8 }, { "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 17 }, { "rule" = "F821", "file" = "case.py", "start" = 30, "end" = 33 }]

[[cases]]
name = "comprehension-target-is-not-an-iterator-read"
comparison = "full"
files = { "case.py" = "for item in [item for item in values]:\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 30, "end" = 36 }]

[[cases]]
name = "comprehension-iterator-read-is-included"
comparison = "full"
files = { "case.py" = "for items in [x for x in items]:\n    pass\n" }
expected = [{ "rule" = "B020", "file" = "case.py", "start" = 4, "end" = 9 }, { "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 30 }]

[[cases]]
name = "last-repeated-target-occurrence-is-reported"
comparison = "full"
files = { "case.py" = "for (item, item) in item:\n    pass\n" }
expected = [{ "rule" = "B020", "file" = "case.py", "start" = 11, "end" = 15 }, { "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 24 }]

[[cases]]
name = "noqa-suppresses-loop-target"
comparison = "full"
files = { "case.py" = "for items in items:  # noqa: B020\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 18 }]
