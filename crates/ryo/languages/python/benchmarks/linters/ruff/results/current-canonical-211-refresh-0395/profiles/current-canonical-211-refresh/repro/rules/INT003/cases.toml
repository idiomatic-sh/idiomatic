[[cases]]
name = "underscore"
comparison = "full"
files = { "case.py" = "_(\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 19 }, { "rule" = "INT003", "file" = "case.py", "start" = 2, "end" = 19 }]

[[cases]]
name = "gettext"
comparison = "full"
files = { "case.py" = "gettext(\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 7 }, { "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 25 }, { "rule" = "INT003", "file" = "case.py", "start" = 8, "end" = 25 }]

[[cases]]
name = "ngettext-first"
comparison = "full"
files = { "case.py" = "ngettext(\"hello %s\" % name, \"many\", n)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 26 }, { "rule" = "F821", "file" = "case.py", "start" = 36, "end" = 37 }, { "rule" = "INT003", "file" = "case.py", "start" = 9, "end" = 26 }]

[[cases]]
name = "plural-default-excluded"
comparison = "full"
files = { "case.py" = "ngettext(\"one\", \"hello %s\" % name, n)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 33 }, { "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 36 }]

[[cases]]
name = "unrelated"
comparison = "full"
files = { "case.py" = "other(\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }, { "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 23 }]

[[cases]]
name = "keyword"
comparison = "full"
files = { "case.py" = "_(message=\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 23, "end" = 27 }]

[[cases]]
name = "second"
comparison = "full"
files = { "case.py" = "_(\"first\", \"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }]

[[cases]]
name = "direct-shadow"
comparison = "full"
files = { "case.py" = "def f(_):\n    _(\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 33 }, { "rule" = "INT003", "file" = "case.py", "start" = 16, "end" = 33 }]

[[cases]]
name = "import-alias"
comparison = "full"
files = { "case.py" = "from gettext import gettext as translate\ntranslate(\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 64, "end" = 68 }, { "rule" = "INT003", "file" = "case.py", "start" = 51, "end" = 68 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import gettext as gt\ngt.gettext(\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 45, "end" = 49 }, { "rule" = "INT003", "file" = "case.py", "start" = 32, "end" = 49 }]

[[cases]]
name = "local-attribute"
comparison = "full"
files = { "case.py" = "obj.gettext(\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 3 }, { "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 29 }]

[[cases]]
name = "builtins"
comparison = "full"
files = { "case.py" = "import builtins\nbuiltins._(\"hello %s\" % name)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 40, "end" = 44 }, { "rule" = "INT003", "file" = "case.py", "start" = 27, "end" = 44 }]

[[cases]]
name = "plain"
comparison = "full"
files = { "case.py" = "_(\"hello\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "_(\"hello %s\" % name) # noqa: INT003\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 19 }]

[[cases]]
name = "nested"
comparison = "full"
files = { "case.py" = "_(wrapper(\"hello %s\" % name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 2, "end" = 9 }, { "rule" = "F821", "file" = "case.py", "start" = 23, "end" = 27 }]
