[[cases]]
name = "underscore"
comparison = "full"
files = { "case.py" = "_(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 15 }, { "rule" = "INT001", "file" = "case.py", "start" = 2, "end" = 17 }]

[[cases]]
name = "gettext"
comparison = "full"
files = { "case.py" = "gettext(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 7 }, { "rule" = "F821", "file" = "case.py", "start" = 17, "end" = 21 }, { "rule" = "INT001", "file" = "case.py", "start" = 8, "end" = 23 }]

[[cases]]
name = "ngettext-first"
comparison = "full"
files = { "case.py" = "ngettext(f\"hello {name}\", \"many\", n)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "F821", "file" = "case.py", "start" = 18, "end" = 22 }, { "rule" = "F821", "file" = "case.py", "start" = 34, "end" = 35 }, { "rule" = "INT001", "file" = "case.py", "start" = 9, "end" = 24 }]

[[cases]]
name = "plural-default-excluded"
comparison = "full"
files = { "case.py" = "ngettext(\"one\", f\"hello {name}\", n)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 29 }, { "rule" = "F821", "file" = "case.py", "start" = 33, "end" = 34 }]

[[cases]]
name = "unrelated"
comparison = "full"
files = { "case.py" = "other(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }, { "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 19 }]

[[cases]]
name = "keyword"
comparison = "full"
files = { "case.py" = "_(message=f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 23 }]

[[cases]]
name = "second"
comparison = "full"
files = { "case.py" = "_(\"first\", f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 24 }]

[[cases]]
name = "direct-shadow"
comparison = "full"
files = { "case.py" = "def f(_):\n    _(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 29 }, { "rule" = "INT001", "file" = "case.py", "start" = 16, "end" = 31 }]

[[cases]]
name = "import-alias"
comparison = "full"
files = { "case.py" = "from gettext import gettext as translate\ntranslate(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 60, "end" = 64 }, { "rule" = "INT001", "file" = "case.py", "start" = 51, "end" = 66 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import gettext as gt\ngt.gettext(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 41, "end" = 45 }, { "rule" = "INT001", "file" = "case.py", "start" = 32, "end" = 47 }]

[[cases]]
name = "local-attribute"
comparison = "full"
files = { "case.py" = "obj.gettext(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 3 }, { "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 25 }]

[[cases]]
name = "builtins"
comparison = "full"
files = { "case.py" = "import builtins\nbuiltins._(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 36, "end" = 40 }, { "rule" = "INT001", "file" = "case.py", "start" = 27, "end" = 42 }]

[[cases]]
name = "plain"
comparison = "full"
files = { "case.py" = "_(\"hello\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "_(f\"hello {name}\") # noqa: INT001\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 15 }]

[[cases]]
name = "nested"
comparison = "full"
files = { "case.py" = "_(wrapper(f\"hello {name}\"))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 2, "end" = 9 }, { "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 23 }]

[[cases]]
name = "nfkc-semantic-identifier"
comparison = "full"
files = { "case.py" = "ｇｅｔｔｅｘｔ(f\"hello {name}\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 21 }, { "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 35 }, { "rule" = "INT001", "file" = "case.py", "start" = 22, "end" = 37 }]
