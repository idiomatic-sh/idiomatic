[[cases]]
name = "nonempty"
comparison = "full"
files = { "case.pyi" = "class C:\n    x: int\n    ...\n" }
expected = [{ "rule" = "PYI013", "file" = "case.pyi", "start" = 24, "end" = 27 }]

[[cases]]
name = "empty"
comparison = "full"
files = { "case.pyi" = "class C: ...\n" }
expected = []

[[cases]]
name = "docstring"
comparison = "full"
files = { "case.pyi" = "class C:\n    \"doc\"\n    ...\n" }
expected = [{ "rule" = "PYI013", "file" = "case.pyi", "start" = 23, "end" = 26 }]

[[cases]]
name = "function"
comparison = "full"
files = { "case.pyi" = "def f():\n    x = 1\n    ...\n" }
expected = [{ "rule" = "F841", "file" = "case.pyi", "start" = 13, "end" = 14 }, { "rule" = "PYI048", "file" = "case.pyi", "start" = 4, "end" = 5 }]

[[cases]]
name = "nested-if"
comparison = "full"
files = { "case.pyi" = "class C:\n    x: int\n    if ready:\n        ...\n" }
expected = [{ "rule" = "F821", "file" = "case.pyi", "start" = 27, "end" = 32 }]

[[cases]]
name = "parentheses"
comparison = "full"
files = { "case.pyi" = "class C:\n    x: int\n    (...)\n" }
expected = [{ "rule" = "PYI013", "file" = "case.pyi", "start" = 24, "end" = 29 }]

[[cases]]
name = "runtime"
comparison = "full"
files = { "case.py" = "class C:\n    x: int\n    ...\n" }
expected = [{ "rule" = "PYI013", "file" = "case.py", "start" = 24, "end" = 27 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.pyi" = "class C:\n    x: int\n    ... # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
comparison = "full"
files = { "case.pyi" = "class C:\n    x: int\n    ... # noqa: PYI013\n" }
expected = []

[[cases]]
name = "other-code"
comparison = "full"
files = { "case.pyi" = "class C:\n    x: int\n    ... # noqa: F401\n" }
expected = [{ "rule" = "PYI013", "file" = "case.pyi", "start" = 24, "end" = 27 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.pyi" = "# ruff: noqa\nclass C:\n    x: int\n    ...\n" }
expected = []

[[cases]]
name = "ellipsis-assignment"
comparison = "full"
files = { "case.pyi" = "class C:\n    x = ...\n    y: int\n" }
expected = []

[[cases]]
name = "two-ellipses"
comparison = "full"
files = { "case.pyi" = "class C:\n    ...\n    ...\n" }
expected = [{ "rule" = "PYI013", "file" = "case.pyi", "start" = 13, "end" = 16 }, { "rule" = "PYI013", "file" = "case.pyi", "start" = 21, "end" = 24 }]

[[cases]]
name = "runtime-subscript"
comparison = "full"
files = { "case.py" = "class C:\n    x = a[...]\n    y: int\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 17, "end" = 18 }]

[[cases]]
name = "shared-block-suppressed"
comparison = "full"
files = { "case.pyi" = "# ruff: disable[PYI013]\nclass C:\n    x: int\n    ...\n\n# ruff: enable[PYI013]\n" }
expected = []

[[cases]]
name = "shared-block-reenabled"
comparison = "full"
files = { "case.pyi" = "# ruff: disable[PYI013]\n# ruff: enable[PYI013]\nclass C:\n    x: int\n    ...\n" }
expected = [{ "rule" = "PYI013", "file" = "case.pyi", "start" = 71, "end" = 74 }]

[[cases]]
name = "shared-block-unmatched-disable"
comparison = "full"
files = { "case.pyi" = "# ruff: disable[PYI013]\nclass C:\n    x: int\n    ...\n" }
expected = []

[[cases]]
name = "shared-block-wrong-code"
comparison = "full"
files = { "case.pyi" = "# ruff: disable[E501]\nclass C:\n    x: int\n    ...\n" }
expected = [{ "rule" = "PYI013", "file" = "case.pyi", "start" = 46, "end" = 49 }]

[[cases]]
name = "shared-file-ignore"
comparison = "full"
files = { "case.pyi" = "# ruff: file-ignore[PYI013]\nclass C:\n    x: int\n    ...\n" }
expected = []
