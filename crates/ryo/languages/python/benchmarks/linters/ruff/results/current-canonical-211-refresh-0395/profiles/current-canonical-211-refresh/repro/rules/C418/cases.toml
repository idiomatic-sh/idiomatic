[[cases]]
name = "empty"
comparison = "full"
files = { "case.py" = "dict()\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 6 }, { "rule" = "C408", "file" = "case.py", "start" = 0, "end" = 6 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "dict({\"x\": 1}) # noqa: C418\n" }
expected = []

[[cases]]
name = "range"
comparison = "full"
files = { "case.py" = "# ruff: disable[C418]\ndict({\"x\": 1})\n# ruff: enable[C418]\n" }
expected = []

[[cases]]
name = "comprehension"
comparison = "full"
files = { "case.py" = "dict({x: y for x, y in values})\n" }
expected = [{ "rule" = "C418", "file" = "case.py", "start" = 0, "end" = 31 }, { "rule" = "F821", "file" = "case.py", "start" = 23, "end" = 29 }]

[[cases]]
name = "empty-dict"
comparison = "full"
files = { "case.py" = "dict({})\n" }
