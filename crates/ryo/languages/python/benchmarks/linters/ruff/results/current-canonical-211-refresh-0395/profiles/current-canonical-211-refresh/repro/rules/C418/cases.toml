[[cases]]
name = "unpacked-dict"
comparison = "full"
files = { "case.py" = "dict({**other})\n" }
expected = [{ "rule" = "C418", "file" = "case.py", "start" = 0, "end" = 15 }, { "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 13 }]

[[cases]]
name = "variable"
comparison = "full"
files = { "case.py" = "dict(other)\n" }
