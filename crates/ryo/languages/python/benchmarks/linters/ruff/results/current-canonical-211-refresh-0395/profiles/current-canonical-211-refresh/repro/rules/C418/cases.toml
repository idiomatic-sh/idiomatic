[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "dict({\"x\": 1})\n" }
expected = [{ "rule" = "C418", "file" = "case.py", "start" = 0, "end" = 14 }]

[[cases]]
name = "assignment"
comparison = "full"
files = { "case.py" = "result = dict({\"x\": 1})\n" }
expected = [{ "rule" = "C418", "file" = "case.py", "start" = 9, "end" = 23 }]

[[cases]]
name = "parenthesized-function"
comparison = "full"
files = { "case.py" = "(dict)({\"x\": 1})\n" }
expected = [{ "rule" = "C418", "file" = "case.py", "start" = 0, "end" = 16 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "def f(dict):\n    dict({\"x\": 1})\n" }
expected = []

[[cases]]
name = "rebound"
comparison = "full"
files = { "case.py" = "dict = custom\ndict({\"x\": 1})\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 13 }]

[[cases]]
name = "qualified"
