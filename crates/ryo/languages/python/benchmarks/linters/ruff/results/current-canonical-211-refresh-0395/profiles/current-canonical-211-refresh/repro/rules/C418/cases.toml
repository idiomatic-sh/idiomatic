files = { "case.py" = "import builtins\nbuiltins.dict({\"x\": 1})\n" }
expected = []

[[cases]]
name = "imported-same-name"
comparison = "full"
files = { "case.py" = "from builtins import dict\ndict({\"x\": 1})\n" }
expected = [{ "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 25 }]

[[cases]]
name = "imported-alias"
comparison = "full"
files = { "case.py" = "from builtins import dict as convert\nconvert({\"x\": 1})\n" }
expected = []

[[cases]]
name = "extra-positional"
comparison = "full"
files = { "case.py" = "dict({\"x\": 1}, other)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 20 }]

[[cases]]
name = "keyword"
comparison = "full"
files = { "case.py" = "dict({\"x\": 1}, unexpected=True)\n" }
