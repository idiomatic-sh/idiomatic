[[cases]]
name = "shadowed-pytest"
comparison = "full"
files = { "case.py" = "import pytest\npytest = object()\n@pytest.fixture\n@pytest.mark.usefixtures(\"db\")\ndef resource():\n    pass\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 14, "end" = 20 }]

[[cases]]
name = "from-import-fixture"
comparison = "full"
files = { "case.py" = "from pytest import fixture\nimport pytest\n@fixture\n@pytest.mark.usefixtures(\"db\")\ndef resource():\n    pass\n" }
expected = [{ "rule" = "PT025", "file" = "case.py", "start" = 50, "end" = 80 }]

[[cases]]
name = "from-import-mark-alias"
comparison = "full"
files = { "case.py" = "import pytest\nfrom pytest.mark import usefixtures as fixtures\n@pytest.fixture\n@fixtures(\"db\")\ndef resource():\n    pass\n" }
expected = [{ "rule" = "PT025", "file" = "case.py", "start" = 78, "end" = 93 }]

[[cases]]
