[[cases]]
name = "multiple-marks"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.fixture\n@pytest.mark.usefixtures(\"db\")\n@pytest.mark.usefixtures(\"cache\")\ndef resource():\n    pass\n" }
expected = [{ "rule" = "PT025", "file" = "case.py", "start" = 30, "end" = 60 }, { "rule" = "PT025", "file" = "case.py", "start" = 61, "end" = 94 }]
