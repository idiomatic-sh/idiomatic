[[cases]]
name = "fixture-mark"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.fixture\n@pytest.mark.usefixtures(\"db\")\ndef resource():\n    pass\n" }
expected = [{ "rule" = "PT025", "file" = "case.py", "start" = 30, "end" = 60 }]

[[cases]]
name = "yield-fixture-mark"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.yield_fixture\n@pytest.mark.usefixtures(\"db\")\ndef resource():\n    yield 1\n" }
expected = [{ "rule" = "PT020", "file" = "case.py", "start" = 14, "end" = 35 }, { "rule" = "PT025", "file" = "case.py", "start" = 36, "end" = 66 }]

[[cases]]
name = "module-aliases"
comparison = "full"
files = { "case.py" = "import pytest as pt\n@pt.fixture\n@pt.mark.usefixtures(\"db\")\ndef resource():\n    pass\n" }
expected = [{ "rule" = "PT025", "file" = "case.py", "start" = 32, "end" = 58 }]

[[cases]]
