[[cases]]
name = "invalid-characters"
comparison = "full"
files = { "case.py" = "open(\"x\", \"rwx\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 10, "end" = 15 }]

[[cases]]
name = "duplicate-mode"
comparison = "full"
files = { "case.py" = "open(\"x\", \"rr\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 10, "end" = 14 }]

[[cases]]
name = "multiple-primary-modes"
comparison = "full"
files = { "case.py" = "open(\"x\", \"wa\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 10, "end" = 14 }]

[[cases]]
name = "plus-without-primary"
comparison = "full"
files = { "case.py" = "open(\"x\", \"+\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 10, "end" = 13 }]

[[cases]]
name = "universal-with-write"
comparison = "full"
files = { "case.py" = "open(\"x\", \"Uw\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 10, "end" = 14 }]

[[cases]]
name = "duplicate-plus"
comparison = "full"
files = { "case.py" = "open(\"x\", \"r++\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 10, "end" = 15 }]

[[cases]]
name = "valid-modes"
comparison = "full"
files = { "case.py" = "open(\"x\", \"rb+\")\nopen(\"x\", \"+ab\")\nopen(\"x\", \"U\")\nopen(\"x\", \"rU\")\n" }
expected = []

[[cases]]
name = "mode-keyword"
comparison = "full"
files = { "case.py" = "open(\"x\", mode=\"xw\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 15, "end" = 19 }]

[[cases]]
name = "pathlib-invalid"
comparison = "full"
files = { "case.py" = "from pathlib import Path\nPath(\"x\").open(\"rwx\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 40, "end" = 45 }]

[[cases]]
name = "pathlib-keyword"
comparison = "full"
files = { "case.py" = "from pathlib import Path\nPath(\"x\").open(mode=\"rwx\")\n" }
expected = [{ "rule" = "PLW1501", "file" = "case.py", "start" = 45, "end" = 50 }]

[[cases]]
name = "dynamic-mode"
comparison = "full"
files = { "case.py" = "open(\"x\", mode=mode)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 19 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "open(\"x\", \"rwx\")  # noqa: PLW1501\n" }
expected = []
