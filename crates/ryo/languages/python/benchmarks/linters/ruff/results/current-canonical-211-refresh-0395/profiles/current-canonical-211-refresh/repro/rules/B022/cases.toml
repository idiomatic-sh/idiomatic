[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib.suppress()\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 18, "end" = 39 }]

[[cases]]
name = "alias"
comparison = "full"
files = { "case.py" = "import contextlib as alias\nalias.suppress()\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 27, "end" = 43 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from contextlib import suppress as target\ntarget()\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 42, "end" = 50 }]

[[cases]]
name = "unimported"
comparison = "full"
files = { "case.py" = "contextlib.suppress()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 10 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "import contextlib\ndef f(contextlib):\n    contextlib.suppress()\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 17 }, { "rule" = "F811", "file" = "case.py", "start" = 24, "end" = 34 }]

[[cases]]
name = "rebound"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib = other\ncontextlib.suppress()\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 18, "end" = 28 }, { "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 36 }]

[[cases]]
name = "before-import"
comparison = "full"
files = { "case.py" = "contextlib.suppress()\nimport contextlib\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 29, "end" = 39 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 10 }]

[[cases]]
name = "deferred-body"
comparison = "full"
files = { "case.py" = "def f():\n    contextlib.suppress()\nimport contextlib\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 13, "end" = 34 }]

[[cases]]
name = "ordinary-call"
comparison = "full"
files = { "case.py" = "import contextlib\ndef f(x):\n    x()\n    contextlib.suppress()\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 40, "end" = 61 }]

[[cases]]
name = "attribute-only"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib.suppress\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 18, "end" = 37 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib.suppress() # noqa: B022\n" }
expected = []

[[cases]]
name = "range"
comparison = "full"
files = { "case.py" = "import contextlib\n# ruff: disable[B022]\ncontextlib.suppress()\n# ruff: enable[B022]\n" }
expected = []

[[cases]]
name = "positional"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib.suppress(ValueError)\n" }
expected = []

[[cases]]
name = "starred"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib.suppress(*errors)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 39, "end" = 45 }]

[[cases]]
name = "keyword-only"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib.suppress(error=ValueError)\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 18, "end" = 55 }]

[[cases]]
name = "unpacked-keyword"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib.suppress(**errors)\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 18, "end" = 47 }, { "rule" = "F821", "file" = "case.py", "start" = 40, "end" = 46 }]

[[cases]]
name = "wildcard-preserves-known-origin"
comparison = "full"
files = { "case.py" = "import contextlib\nfrom m import *\ncontextlib.suppress()\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 34, "end" = 55 }]

[[cases]]
name = "explicit-shadow-after-wildcard"
comparison = "full"
files = { "case.py" = "import contextlib\nfrom m import *\ncontextlib = custom\ncontextlib.suppress()\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 34, "end" = 44 }]

[[cases]]
name = "explicit-shadow-before-wildcard"
comparison = "full"
files = { "case.py" = "import contextlib\ncontextlib = custom\nfrom m import *\ncontextlib.suppress()\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 18, "end" = 28 }, { "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 37 }]

[[cases]]
name = "quoted-annotation-dispatch"
comparison = "full"
files = { "case.py" = "import contextlib\nx: \"contextlib.suppress()\"\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 22, "end" = 43 }]

[[cases]]
name = "escaped-annotation-host-span"
comparison = "full"
files = { "case.py" = "import contextlib\nx: \"contextlib.\\x73uppress()\"\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 21, "end" = 47 }]

[[cases]]
name = "concatenated-annotation-host-span"
comparison = "full"
files = { "case.py" = "import contextlib\nx: \"contextlib.\" \"suppress()\"\n" }
expected = [{ "rule" = "B022", "file" = "case.py", "start" = 21, "end" = 47 }]

[[cases]]
name = "literal-annotation-string-is-data"
comparison = "full"
files = { "case.py" = "import contextlib\nfrom typing import Literal\nx: Literal[\"contextlib.suppress()\"]\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 17 }]

[[cases]]
name = "annotated-metadata-is-data"
comparison = "full"
files = { "case.py" = "import contextlib\nfrom typing import Annotated\nx: Annotated[int, \"contextlib.suppress()\"]\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 17 }]
