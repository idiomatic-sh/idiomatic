[[cases]]
name = "missing"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(2020, 1, 1)\n" }
expected = [{ "rule" = "DTZ001", "file" = "case.py", "start" = 16, "end" = 45 }]

[[cases]]
name = "alias"
comparison = "full"
files = { "case.py" = "from datetime import datetime as D\nD(2020, 1, 1)\n" }
expected = [{ "rule" = "DTZ001", "file" = "case.py", "start" = 35, "end" = 48 }]

[[cases]]
name = "none"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(2020, 1, 1, tzinfo=None)\n" }
expected = [{ "rule" = "DTZ001", "file" = "case.py", "start" = 16, "end" = 58 }]

[[cases]]
name = "valid"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(2020, 1, 1, tzinfo=zone)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 53, "end" = 57 }]

[[cases]]
name = "positional"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(2020, 1, 1, 0, 0, 0, 0, zone)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 58, "end" = 62 }]

[[cases]]
name = "seventh-not-eighth"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(2020, 1, 1, 0, 0, 0, zone)\n" }
expected = [{ "rule" = "DTZ001", "file" = "case.py", "start" = 16, "end" = 60 }, { "rule" = "F821", "file" = "case.py", "start" = 55, "end" = 59 }]

[[cases]]
name = "converted"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(2020, 1, 1).replace(hour=1).astimezone()\n" }
expected = []

[[cases]]
name = "starred"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(*args)\n" }
expected = [{ "rule" = "DTZ001", "file" = "case.py", "start" = 16, "end" = 40 }, { "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 39 }]

[[cases]]
name = "starred-with-keyword"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(*args, tzinfo=zone)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 39 }, { "rule" = "F821", "file" = "case.py", "start" = 48, "end" = 52 }]

[[cases]]
name = "unpacked-keyword"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(**kwargs)\n" }
expected = [{ "rule" = "DTZ001", "file" = "case.py", "start" = 16, "end" = 43 }, { "rule" = "F821", "file" = "case.py", "start" = 36, "end" = 42 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "def f(datetime):\n    datetime.datetime(2020, 1, 1)\n" }
expected = []

[[cases]]
name = "unimported"
comparison = "full"
files = { "case.py" = "datetime.datetime(2020, 1, 1)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime(2020, 1, 1) # noqa: DTZ001\n" }
