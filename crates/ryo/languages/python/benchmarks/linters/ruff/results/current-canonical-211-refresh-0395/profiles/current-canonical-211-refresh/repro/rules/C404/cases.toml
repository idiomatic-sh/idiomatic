[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "dict([(x, y) for x, y in values])\n" }
expected = [{ "rule" = "C404", "file" = "case.py", "start" = 0, "end" = 33 }, { "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }]

[[cases]]
name = "assignment"
comparison = "full"
files = { "case.py" = "result = dict([(x, y) for x, y in values])\n" }
expected = [{ "rule" = "C404", "file" = "case.py", "start" = 9, "end" = 42 }, { "rule" = "F821", "file" = "case.py", "start" = 34, "end" = 40 }]

[[cases]]
name = "parenthesized-function"
comparison = "full"
files = { "case.py" = "(dict)([(x, y) for x, y in values])\n" }
expected = [{ "rule" = "C404", "file" = "case.py", "start" = 0, "end" = 35 }, { "rule" = "F821", "file" = "case.py", "start" = 27, "end" = 33 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "def f(dict):\n    dict([(x, y) for x, y in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 42, "end" = 48 }]

[[cases]]
name = "rebound"
comparison = "full"
files = { "case.py" = "dict = custom\ndict([(x, y) for x, y in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 39, "end" = 45 }]

[[cases]]
name = "qualified"
comparison = "full"
files = { "case.py" = "import builtins\nbuiltins.dict([(x, y) for x, y in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 50, "end" = 56 }]

[[cases]]
name = "imported-same-name"
comparison = "full"
files = { "case.py" = "from builtins import dict\ndict([(x, y) for x, y in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 51, "end" = 57 }, { "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 25 }]

[[cases]]
name = "imported-alias"
comparison = "full"
files = { "case.py" = "from builtins import dict as convert\nconvert([(x, y) for x, y in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 65, "end" = 71 }]

[[cases]]
name = "extra-positional"
comparison = "full"
files = { "case.py" = "dict([(x, y) for x, y in values], other)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }, { "rule" = "F821", "file" = "case.py", "start" = 34, "end" = 39 }]

[[cases]]
name = "keyword"
comparison = "full"
files = { "case.py" = "dict([(x, y) for x, y in values], unexpected=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }]

[[cases]]
name = "unpacked-keyword"
comparison = "full"
files = { "case.py" = "dict([(x, y) for x, y in values], **kwargs)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }, { "rule" = "F821", "file" = "case.py", "start" = 36, "end" = 42 }]

[[cases]]
name = "starred-argument"
comparison = "full"
files = { "case.py" = "dict(*[([(x, y) for x, y in values])])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 28, "end" = 34 }]

[[cases]]
name = "empty"
comparison = "full"
files = { "case.py" = "dict()\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 6 }, { "rule" = "C408", "file" = "case.py", "start" = 0, "end" = 6 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "dict([(x, y) for x, y in values]) # noqa: C404\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }]

[[cases]]
name = "range"
comparison = "full"
files = { "case.py" = "# ruff: disable[C404]\ndict([(x, y) for x, y in values])\n# ruff: enable[C404]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 47, "end" = 53 }]

[[cases]]
name = "element-shape-0"
comparison = "full"
files = { "case.py" = "dict([[x, y] for x, y in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }]

[[cases]]
name = "element-shape-1"
comparison = "full"
files = { "case.py" = "dict([(x,) for x, y in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 23, "end" = 29 }]

[[cases]]
name = "element-shape-2"
comparison = "full"
files = { "case.py" = "dict([(x, y, z) for x, y in values])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 14 }, { "rule" = "F821", "file" = "case.py", "start" = 28, "end" = 34 }]

[[cases]]
name = "element-shape-3"
comparison = "full"
files = { "case.py" = "dict([(*x, y) for x, y in values])\n" }
expected = [{ "rule" = "C404", "file" = "case.py", "start" = 0, "end" = 34 }, { "rule" = "F821", "file" = "case.py", "start" = 26, "end" = 32 }]
