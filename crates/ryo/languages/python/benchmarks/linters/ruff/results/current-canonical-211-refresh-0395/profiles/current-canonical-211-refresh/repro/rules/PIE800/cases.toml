[[cases]]
name = "spread"
comparison = "full"
files = { "case.py" = "value = {**{\"a\": 1}}\n" }
expected = [{ "rule" = "PIE800", "file" = "case.py", "start" = 11, "end" = 19 }]

[[cases]]
name = "empty"
comparison = "full"
files = { "case.py" = "value = {**{}}\n" }
expected = [{ "rule" = "PIE800", "file" = "case.py", "start" = 11, "end" = 13 }]

[[cases]]
name = "value"
comparison = "full"
files = { "case.py" = "value = {\"a\": {\"b\": 1}}\n" }
expected = []

[[cases]]
name = "call"
comparison = "full"
files = { "case.py" = "function(**{\"a\": 1})\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }]

[[cases]]
name = "variable"
comparison = "full"
files = { "case.py" = "value = {**mapping}\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 18 }]

[[cases]]
name = "two"
comparison = "full"
files = { "case.py" = "value = {**{}, **{\"a\": 1}}\n" }
expected = [{ "rule" = "PIE800", "file" = "case.py", "start" = 11, "end" = 13 }, { "rule" = "PIE800", "file" = "case.py", "start" = 17, "end" = 25 }]

[[cases]]
name = "paren"
comparison = "full"
files = { "case.py" = "value = {**({\"a\": 1})}\n" }
