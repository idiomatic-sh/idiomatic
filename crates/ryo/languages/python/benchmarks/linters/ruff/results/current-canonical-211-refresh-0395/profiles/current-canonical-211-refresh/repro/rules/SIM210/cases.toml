[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "value = True if condition else False\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 25 }, { "rule" = "SIM210", "file" = "case.py", "start" = 8, "end" = 36 }]

[[cases]]
name = "reverse"
comparison = "full"
files = { "case.py" = "value = False if condition else True\n" }
