[[cases]]
name = "comparison"
comparison = "full"
files = { "case.py" = "value = True if a == b else False\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 17 }, { "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 22 }, { "rule" = "SIM210", "file" = "case.py", "start" = 8, "end" = 33 }]

[[cases]]
