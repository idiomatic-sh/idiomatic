expected = []

[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess.run([\"echo\"])\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 18, "end" = 32 }]

[[cases]]
name = "alias"
comparison = "full"
files = { "case.py" = "import subprocess as alias\nalias.run([\"echo\"])\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 27, "end" = 36 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from subprocess import run as target\ntarget([\"echo\"])\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 37, "end" = 43 }]

[[cases]]
name = "unimported"
comparison = "full"
files = { "case.py" = "subprocess.run([\"echo\"])\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 10 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "import subprocess\ndef f(subprocess):\n    subprocess.run([\"echo\"])\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 17 }, { "rule" = "F811", "file" = "case.py", "start" = 24, "end" = 34 }]

[[cases]]
name = "rebound"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess = other\nsubprocess.run([\"echo\"])\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 18, "end" = 28 }, { "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 36 }]

[[cases]]
name = "before-import"
comparison = "full"
files = { "case.py" = "subprocess.run([\"echo\"])\nimport subprocess\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 32, "end" = 42 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 10 }]

[[cases]]
name = "deferred-body"
comparison = "full"
files = { "case.py" = "def f():\n    subprocess.run([\"echo\"])\nimport subprocess\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 13, "end" = 27 }]

[[cases]]
name = "ordinary-call"
comparison = "full"
files = { "case.py" = "import subprocess\ndef f(x):\n    x()\n    subprocess.run([\"echo\"])\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 40, "end" = 54 }]

[[cases]]
name = "attribute-only"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess.run\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 18, "end" = 32 }]

[[cases]]
name = "range"
comparison = "full"
files = { "case.py" = "import subprocess\n# ruff: disable[PLW1510]\nsubprocess.run([\"echo\"])\n# ruff: enable[PLW1510]\n" }
expected = []

[[cases]]
name = "unpacked"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess.run([], **options)\n" }
