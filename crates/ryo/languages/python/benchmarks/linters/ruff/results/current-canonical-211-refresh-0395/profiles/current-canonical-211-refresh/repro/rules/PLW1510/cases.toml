[[cases]]
name = "missing-check"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess.run([])\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 18, "end" = 32 }]

[[cases]]
name = "run-alias"
comparison = "full"
files = { "case.py" = "import subprocess as sp\nsp.run([])\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 24, "end" = 30 }]

