[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess.run([], stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 18, "end" = 32 }, { "rule" = "UP022", "file" = "case.py", "start" = 18, "end" = 84 }]

[[cases]]
name = "from-import-alias"
comparison = "full"
files = { "case.py" = "from subprocess import run as execute, PIPE as PIPE\nexecute([], stderr=PIPE, stdout=PIPE)\n" }
expected = [{ "rule" = "PLC0414", "file" = "case.py", "start" = 39, "end" = 51 }, { "rule" = "PLW1510", "file" = "case.py", "start" = 52, "end" = 59 }, { "rule" = "UP022", "file" = "case.py", "start" = 52, "end" = 89 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import subprocess as sp\nsp.run([], stdout=sp.PIPE, stderr=sp.PIPE)\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 24, "end" = 30 }, { "rule" = "UP022", "file" = "case.py", "start" = 24, "end" = 66 }]

[[cases]]
