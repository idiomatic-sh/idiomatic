[[cases]]
name = "list-string-index"
comparison = "full"
files = { "case.py" = "items[\"x\"]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "string-float-index"
comparison = "full"
files = { "case.py" = "\"hello\"[1.5]\n" }
expected = [{ "rule" = "RUF016", "file" = "case.py", "start" = 8, "end" = 11 }]

[[cases]]
name = "bytes-list-index"
comparison = "full"
files = { "case.py" = "b\"abc\"[[]]\n" }
expected = [{ "rule" = "RUF016", "file" = "case.py", "start" = 7, "end" = 9 }]

[[cases]]
name = "list-bool-index"
comparison = "full"
files = { "case.py" = "items[True]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "list-int-index"
comparison = "full"
files = { "case.py" = "items[1]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "list-slice-valid"
comparison = "full"
files = { "case.py" = "items[1:None:False]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "list-slice-bad-lower"
comparison = "full"
files = { "case.py" = "items[\"x\":2]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "list-slice-bad-upper"
comparison = "full"
files = { "case.py" = "items[1:2.5]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "list-slice-bad-step"
comparison = "full"
files = { "case.py" = "items[1:2:[]]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "list-slice-multiple-bad"
comparison = "full"
files = { "case.py" = "items[\"x\":{}:lambda: 1]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "list-slice-omitted"
comparison = "full"
files = { "case.py" = "items[:]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "other-value"
comparison = "full"
files = { "case.py" = "mapping[\"x\"]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 7 }]

[[cases]]
name = "list-comprehension-value"
comparison = "full"
files = { "case.py" = "[x for x in xs][\"a\"]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 14 }, { "rule" = "RUF016", "file" = "case.py", "start" = 16, "end" = 19 }]

[[cases]]
name = "joined-string-value"
comparison = "full"
files = { "case.py" = "f\"value\"[\"a\"]\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "RUF016", "file" = "case.py", "start" = 9, "end" = 12 }]

[[cases]]
name = "complex-index"
comparison = "full"
files = { "case.py" = "items[1j]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "none-index"
comparison = "full"
files = { "case.py" = "items[None]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "items[\"x\"] # noqa: RUF016\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa: RUF016\nitems[\"x\"]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 26 }]
