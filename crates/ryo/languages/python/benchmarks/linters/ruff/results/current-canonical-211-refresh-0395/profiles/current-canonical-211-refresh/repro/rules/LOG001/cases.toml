[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "import logging\nlogging.Logger(\"name\")\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 15, "end" = 29 }]

[[cases]]
name = "alias"
comparison = "full"
files = { "case.py" = "import logging as alias\nalias.Logger(\"name\")\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 24, "end" = 36 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from logging import Logger as target\ntarget(\"name\")\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 37, "end" = 43 }]

[[cases]]
name = "unimported"
comparison = "full"
files = { "case.py" = "logging.Logger(\"name\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 7 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "import logging\ndef f(logging):\n    logging.Logger(\"name\")\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 14 }, { "rule" = "F811", "file" = "case.py", "start" = 21, "end" = 28 }]

[[cases]]
name = "rebound"
comparison = "full"
files = { "case.py" = "import logging\nlogging = other\nlogging.Logger(\"name\")\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 15, "end" = 22 }, { "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 30 }]

[[cases]]
name = "before-import"
comparison = "full"
files = { "case.py" = "logging.Logger(\"name\")\nimport logging\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 30, "end" = 37 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 7 }]

[[cases]]
name = "deferred-body"
comparison = "full"
files = { "case.py" = "def f():\n    logging.Logger(\"name\")\nimport logging\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 13, "end" = 27 }]

[[cases]]
name = "ordinary-call"
comparison = "full"
files = { "case.py" = "import logging\ndef f(x):\n    x()\n    logging.Logger(\"name\")\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 37, "end" = 51 }]

[[cases]]
name = "attribute-only"
comparison = "full"
files = { "case.py" = "import logging\nlogging.Logger\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 15, "end" = 29 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "import logging\nlogging.Logger(\"name\") # noqa: LOG001\n" }
expected = []

[[cases]]
name = "range"
comparison = "full"
files = { "case.py" = "import logging\n# ruff: disable[LOG001]\nlogging.Logger(\"name\")\n# ruff: enable[LOG001]\n" }
expected = []

[[cases]]
name = "getlogger"
comparison = "full"
files = { "case.py" = "import logging\nlogging.getLogger(\"name\")\n" }
expected = []

[[cases]]
name = "no-arguments"
comparison = "full"
files = { "case.py" = "import logging\nlogging.Logger()\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 15, "end" = 29 }]

[[cases]]
name = "nfkc-identifier-spelling"
comparison = "full"
files = { "case.py" = "import logging as ｌｏｇ\nlog.Logger(\"name\")\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 28, "end" = 38 }]

[[cases]]
name = "quoted-annotation-dispatch"
comparison = "full"
files = { "case.py" = "import logging\nx: \"logging.Logger()\"\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 19, "end" = 33 }]

[[cases]]
name = "escaped-annotation-host-span"
comparison = "full"
files = { "case.py" = "import logging\nx: \"logging.\\x4cogger()\"\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 18, "end" = 39 }]

[[cases]]
name = "concatenated-annotation-host-span"
comparison = "full"
files = { "case.py" = "import logging\nx: \"logging.\" \"Logger()\"\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 18, "end" = 39 }]

[[cases]]
name = "literal-annotation-string-is-data"
comparison = "full"
files = { "case.py" = "import logging\nfrom typing import Literal\nx: Literal[\"logging.Logger()\"]\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 14 }]

[[cases]]
name = "annotated-metadata-is-data"
comparison = "full"
files = { "case.py" = "import logging\nfrom typing import Annotated\nx: Annotated[int, \"logging.Logger()\"]\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 14 }]

[[cases]]
name = "relocated-annotation-preserves-multiplicity"
comparison = "full"
files = { "case.py" = "import logging\nx: \"tuple[logging.Logger(), logging.\\x4cogger()]\"\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 18, "end" = 64 }, { "rule" = "LOG001", "file" = "case.py", "start" = 18, "end" = 64 }]

[[cases]]
name = "invalid-annotation-does-not-block-native-findings"
comparison = "full"
files = { "case.py" = "import logging\nx: \"not valid [\"\nlogging.Logger()\n" }
expected = [{ "rule" = "LOG001", "file" = "case.py", "start" = 32, "end" = 46 }]
