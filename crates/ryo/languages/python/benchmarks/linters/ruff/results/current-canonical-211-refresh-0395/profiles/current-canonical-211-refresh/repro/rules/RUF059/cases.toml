[[cases]]
name = "unused_unpacked_component"
comparison = "full"
files = { "case.py" = "def f():\n    first, second = values\n    return first\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 35 }, { "rule" = "RUF059", "file" = "case.py", "start" = 20, "end" = 26 }]

[[cases]]
name = "all_unpacked_components_used"
comparison = "full"
files = { "case.py" = "def f():\n    first, second = values\n    return first, second\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 35 }]

[[cases]]
name = "ordinary_unused_assignment_is_f841"
comparison = "full"
files = { "case.py" = "def f():\n    first = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 27 }, { "rule" = "F841", "file" = "case.py", "start" = 13, "end" = 18 }]

[[cases]]
name = "dummy_unpacked_component_is_ignored"
comparison = "full"
files = { "case.py" = "def f():\n    first, _ = values\n    return first\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 30 }]

[[cases]]
name = "unused_unpacked_assignment_in_nested_function"
comparison = "full"
files = { "case.py" = "def f():\n    def nested():\n        first, second = values\n        return first\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 51, "end" = 57 }, { "rule" = "RUF059", "file" = "case.py", "start" = 42, "end" = 48 }]

[[cases]]
name = "unpacked_component_used_by_nested_closure"
comparison = "full"
files = { "case.py" = "def f():\n    first, second = values\n    def nested():\n        return second\n    return first\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 35 }]

[[cases]]
name = "module-unpacking-is-not-a-function-local-unused-variable"
comparison = "full"
files = { "case.py" = "first, second = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 22 }]

[[cases]]
name = "class-body-unpacking-is-not-a-function-local-unused-variable"
comparison = "full"
files = { "case.py" = "class C:\n    first, second = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 35 }]

[[cases]]
name = "locals-call-disables-unused-variable-analysis-for-function"
comparison = "full"
files = { "case.py" = "def f():\n    first, second = values\n    locals()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 35 }]

[[cases]]
name = "debugger-magic-name-is-exempt"
comparison = "full"
files = { "case.py" = "def f():\n    __tracebackhide__, result = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 41, "end" = 47 }, { "rule" = "RUF059", "file" = "case.py", "start" = 32, "end" = 38 }]

[[cases]]
name = "nonlocal-declaration-is-not-reported-as-unused"
comparison = "full"
files = { "case.py" = "def outer():\n    first, second = values\n    def inner():\n        nonlocal second\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 33, "end" = 39 }, { "rule" = "RUF059", "file" = "case.py", "start" = 17, "end" = 22 }]

[[cases]]
name = "global-unpacking-is-not-function-local"
comparison = "full"
files = { "case.py" = "def f():\n    global first, second\n    first, second = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 54, "end" = 60 }]

[[cases]]
name = "literal-container-unpacking-is-not-ruf059"
comparison = "full"
files = { "case.py" = "def f():\n    x, y = (1, 2)\n" }
expected = [{ "rule" = "F841", "file" = "case.py", "start" = 13, "end" = 14 }, { "rule" = "F841", "file" = "case.py", "start" = 16, "end" = 17 }]
