[[cases]]
name = "dotted"
comparison = "full"
files = { "case.py" = "import os.path as path\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 18, "end" = 22 }, { "rule" = "PLR0402", "file" = "case.py", "start" = 7, "end" = 22 }]

