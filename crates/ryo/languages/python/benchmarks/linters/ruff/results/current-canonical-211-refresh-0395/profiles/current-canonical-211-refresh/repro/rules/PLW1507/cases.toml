[[cases]]
name = "copy-os-environ"
comparison = "full"
files = { "case.py" = "import copy, os\ncopy.copy(os.environ)\n" }
expected = [{ "rule" = "PLW1507", "file" = "case.py", "start" = 16, "end" = 37 }]

[[cases]]
name = "import-aliases"
comparison = "full"
files = { "case.py" = "from copy import copy as clone\nimport os as operating_system\nclone(operating_system.environ)\n" }
expected = [{ "rule" = "PLW1507", "file" = "case.py", "start" = 61, "end" = 92 }]

