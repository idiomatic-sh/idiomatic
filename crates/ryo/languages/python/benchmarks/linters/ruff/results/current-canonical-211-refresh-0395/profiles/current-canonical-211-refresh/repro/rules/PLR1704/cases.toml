[[cases]]
name = "loop_target_redefines_argument"
comparison = "full"
files = { "case.py" = "def f(value):\n    for value in values:\n        pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 37 }, { "rule" = "PLR1704", "file" = "case.py", "start" = 22, "end" = 27 }]

[[cases]]
name = "with_target_redefines_argument"
comparison = "full"
files = { "case.py" = "def f(value):\n    with ctx() as value:\n        pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 23, "end" = 26 }, { "rule" = "F841", "file" = "case.py", "start" = 32, "end" = 37 }, { "rule" = "PLR1704", "file" = "case.py", "start" = 32, "end" = 37 }]

[[cases]]
name = "exception_target_redefines_argument"
comparison = "full"
files = { "case.py" = "def f(value):\n    try:\n        pass\n    except Exception as value:\n        pass\n" }
expected = [{ "rule" = "F841", "file" = "case.py", "start" = 60, "end" = 65 }, { "rule" = "PLR1704", "file" = "case.py", "start" = 60, "end" = 65 }, { "rule" = "S110", "file" = "case.py", "start" = 40, "end" = 79 }]

[[cases]]
name = "ordinary_assignment_is_not_reported"
comparison = "full"
files = { "case.py" = "def f(value):\n    for item in values:\n        value = item\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 30, "end" = 36 }, { "rule" = "F841", "file" = "case.py", "start" = 46, "end" = 51 }]

[[cases]]
name = "dummy_parameter_is_ignored"
comparison = "full"
files = { "case.py" = "def f(_value):\n    for _value in values:\n        pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 33, "end" = 39 }]

[[cases]]
name = "generator_target_is_not_reported"
comparison = "full"
files = { "case.py" = "def f(value):\n    values = [value for value in values]\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 47, "end" = 53 }, { "rule" = "F841", "file" = "case.py", "start" = 18, "end" = 24 }]
