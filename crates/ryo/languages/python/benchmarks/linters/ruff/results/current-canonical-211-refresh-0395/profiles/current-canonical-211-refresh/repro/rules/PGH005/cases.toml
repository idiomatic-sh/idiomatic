[[cases]]
name = "uncalled"
comparison = "full"
files = { "case.py" = "mock.assert_called\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 18 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 4 }, { "rule" = "PGH005", "file" = "case.py", "start" = 0, "end" = 18 }]

[[cases]]
name = "async"
comparison = "full"
files = { "case.py" = "m.assert_awaited_once_with\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 26 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "PGH005", "file" = "case.py", "start" = 0, "end" = 26 }]

[[cases]]
name = "called"
comparison = "full"
files = { "case.py" = "mock.assert_called()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 4 }]

[[cases]]
name = "assigned"
comparison = "full"
files = { "case.py" = "method = mock.assert_called\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }]

[[cases]]
name = "returned"
comparison = "full"
files = { "case.py" = "def f():\n    return mock.assert_called\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 24 }]

[[cases]]
name = "missing-attribute"
comparison = "full"
files = { "case.py" = "assert mock.called_once\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 11 }, { "rule" = "PGH005", "file" = "case.py", "start" = 7, "end" = 23 }]

[[cases]]
name = "missing-call"
comparison = "full"
files = { "case.py" = "assert mock.called_once()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 11 }, { "rule" = "PGH005", "file" = "case.py", "start" = 7, "end" = 25 }]

[[cases]]
name = "missing-async"
comparison = "full"
files = { "case.py" = "assert m.awaited_with(1)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 8 }, { "rule" = "PGH005", "file" = "case.py", "start" = 7, "end" = 24 }]

[[cases]]
name = "valid-called"
comparison = "full"
files = { "case.py" = "assert m.called\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 8 }]

[[cases]]
name = "standalone-missing"
comparison = "full"
files = { "case.py" = "m.called_once()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }]

[[cases]]
name = "not-assert"
comparison = "full"
files = { "case.py" = "if m.called_once():\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 4 }]

[[cases]]
name = "boolean"
comparison = "full"
files = { "case.py" = "assert m.called_once() and ready\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 8 }, { "rule" = "F821", "file" = "case.py", "start" = 27, "end" = 32 }]

[[cases]]
name = "nested"
comparison = "full"
files = { "case.py" = "assert bool(m.called_once())\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 13 }]

[[cases]]
name = "assert-message"
comparison = "full"
files = { "case.py" = "assert ready, m.called_once()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 12 }, { "rule" = "F821", "file" = "case.py", "start" = 14, "end" = 15 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "mock.assert_called  # noqa: PGH005\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 18 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 4 }]

[[cases]]
name = "parenthesized"
comparison = "full"
files = { "case.py" = "(mock.assert_called)\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 1, "end" = 19 }, { "rule" = "F821", "file" = "case.py", "start" = 1, "end" = 5 }, { "rule" = "PGH005", "file" = "case.py", "start" = 1, "end" = 19 }]

[[cases]]
name = "nfkc-semantic-identifier"
comparison = "full"
files = { "case.py" = "mock.ａｓｓｅｒｔ_ｃａｌｌｅｄ\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 0, "end" = 42 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 4 }, { "rule" = "PGH005", "file" = "case.py", "start" = 0, "end" = 42 }]
