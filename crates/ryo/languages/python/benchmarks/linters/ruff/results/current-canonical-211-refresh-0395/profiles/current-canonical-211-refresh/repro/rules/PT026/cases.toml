[[cases]]
name = "bare"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.mark.usefixtures\ndef test_example():\n    pass\n" }
expected = [{ "rule" = "PT026", "file" = "case.py", "start" = 14, "end" = 38 }]

[[cases]]
name = "empty-call"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.mark.usefixtures()\ndef test_example():\n    pass\n" }
expected = [{ "rule" = "PT026", "file" = "case.py", "start" = 14, "end" = 40 }]

[[cases]]
name = "empty-multiline-call"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.mark.usefixtures(\n)\ndef test_example():\n    pass\n" }
expected = [{ "rule" = "PT026", "file" = "case.py", "start" = 14, "end" = 41 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import pytest as pt\n@pt.mark.usefixtures\ndef test_example():\n    pass\n" }
expected = [{ "rule" = "PT026", "file" = "case.py", "start" = 20, "end" = 40 }]

[[cases]]
name = "from-import-alias"
comparison = "full"
files = { "case.py" = "from pytest.mark import usefixtures as fixtures\n@fixtures\ndef test_example():\n    pass\n" }
expected = []

[[cases]]
name = "parenthesized"
comparison = "full"
files = { "case.py" = "import pytest\n@(pytest.mark.usefixtures)\ndef test_example():\n    pass\n" }
