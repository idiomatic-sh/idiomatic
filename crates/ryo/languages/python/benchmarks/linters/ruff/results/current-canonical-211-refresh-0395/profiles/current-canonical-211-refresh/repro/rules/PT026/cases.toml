[[cases]]
name = "multiple"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.mark.usefixtures\n@pytest.mark.usefixtures()\ndef test_example():\n    pass\n" }
expected = [{ "rule" = "PT026", "file" = "case.py", "start" = 14, "end" = 38 }, { "rule" = "PT026", "file" = "case.py", "start" = 39, "end" = 65 }]
