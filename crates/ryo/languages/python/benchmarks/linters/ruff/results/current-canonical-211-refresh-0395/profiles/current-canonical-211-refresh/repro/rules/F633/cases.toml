[[cases]]
name = "bare-builtin"
comparison = "full"
files = { "case.py" = "print >> stream\n" }
expected = [{ "rule" = "F633", "file" = "case.py", "start" = 0, "end" = 5 }, { "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 15 }]

[[cases]]
name = "other-left"
comparison = "full"
files = { "case.py" = "printer >> stream\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 7 }, { "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 17 }]

[[cases]]
name = "local-shadow"
comparison = "full"
files = { "case.py" = "def f(print):\n    print >> stream\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 27, "end" = 33 }]

[[cases]]
name = "module-shadow"
comparison = "full"
files = { "case.py" = "print = custom\nprint >> stream\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 14 }, { "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 30 }]

[[cases]]
name = "builtins-attribute"
comparison = "full"
files = { "case.py" = "import builtins as b\nb.print >> stream\n" }
expected = [{ "rule" = "F633", "file" = "case.py", "start" = 21, "end" = 28 }, { "rule" = "F821", "file" = "case.py", "start" = 32, "end" = 38 }]

[[cases]]
name = "from-builtins-alias"
comparison = "full"
files = { "case.py" = "from builtins import print as emit\nemit >> stream\n" }
expected = [{ "rule" = "F633", "file" = "case.py", "start" = 35, "end" = 39 }, { "rule" = "F821", "file" = "case.py", "start" = 43, "end" = 49 }]

[[cases]]
name = "parenthesized-builtin"
comparison = "full"
files = { "case.py" = "(print) >> stream\n" }
expected = [{ "rule" = "F633", "file" = "case.py", "start" = 1, "end" = 6 }, { "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 17 }]

[[cases]]
name = "unicode-prefix"
comparison = "full"
files = { "case.py" = "label = \"é\"\nprint >> stream\n" }
expected = [{ "rule" = "F633", "file" = "case.py", "start" = 13, "end" = 18 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 28 }]

[[cases]]
name = "nfkc-builtin-print"
comparison = "full"
files = { "case.py" = "ｐｒｉｎｔ >> stream\n" }
expected = [{ "rule" = "F633", "file" = "case.py", "start" = 0, "end" = 15 }, { "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 25 }]

[[cases]]
name = "inline-noqa"
comparison = "full"
files = { "case.py" = "print >> stream  # noqa: F633\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 15 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa: F633\nprint >> stream\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 28, "end" = 34 }]
