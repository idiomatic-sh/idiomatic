[[cases]]
name = "constant_exception_type"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept 42:\n    pass\n" }
expected = [{ "rule" = "B030", "file" = "case.py", "start" = 21, "end" = 23 }]

[[cases]]
name = "constant_in_exception_tuple"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept (ValueError, 42):\n    pass\n" }
expected = [{ "rule" = "B030", "file" = "case.py", "start" = 34, "end" = 36 }]

[[cases]]
name = "named_exception_type"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept ValueError:\n    pass\n" }
expected = []

[[cases]]
name = "list_expression_in_exception_type"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept [ValueError]:\n    pass\n" }
expected = [{ "rule" = "B030", "file" = "case.py", "start" = 21, "end" = 33 }]

[[cases]]
name = "nested-tuple-in-exception-types"
