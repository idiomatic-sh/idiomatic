[[cases]]
name = "tagged-UP030_0.py"
comparison = "full"
files = { "case.py" = "# Invalid calls; errors expected.\n\n\"{0}\" \"{1}\" \"{2}\".format(1, 2, 3)\n\n\"a {3} complicated {1} string with {0} {2}\".format(\n    \"first\", \"second\", \"third\", \"fourth\"\n)\n\n'{0}'.format(1)\n\n'{0:x}'.format(30)\n\nx = '{0}'.format(1)\n\n'''{0}\\n{1}\\n'''.format(1, 2)\n\nx = \"foo {0}\" \\\n    \"bar {1}\".format(1, 2)\n\n(\"{0}\").format(1)\n\n\"\\N{snowman} {0}\".format(1)\n\nprint(\n    'foo{0}'\n    'bar{1}'.format(1, 2)\n)\n\nprint(\n    'foo{0}'  # ohai\\n\"\n    'bar{1}'.format(1, 2)\n)\n\n'{' '0}'.format(1)\n\nargs = list(range(10))\nkwargs = {x: x for x in range(10)}\n\n\"{0}\".format(*args)\n\n\"{0}\".format(**kwargs)\n\n\"{0}_{1}\".format(*args)\n\n\"{0}_{1}\".format(1, *args)\n\n\"{0}_{1}\".format(1, 2, *args)\n\n\"{0}_{1}\".format(*args, 1, 2)\n\n\"{0}_{1}_{2}\".format(1, **kwargs)\n\n\"{0}_{1}_{2}\".format(1, 2, **kwargs)\n\n\"{0}_{1}_{2}\".format(1, 2, 3, **kwargs)\n\n\"{0}_{1}_{2}\".format(1, 2, 3, *args, **kwargs)\n\n\"{1}_{0}\".format(1, 2, *args)\n\n\"{1}_{0}\".format(1, 2)\n\nr\"\\d{{1,2}} {0}\".format(42)\n\n\"{{{0}}}\".format(123)\n" }
expected = [{ rule = "UP030", file = "case.py", start = 35, end = 68 }, { rule = "UP030", file = "case.py", start = 70, end = 164 }, { rule = "UP030", file = "case.py", start = 166, end = 181 }, { rule = "UP030", file = "case.py", start = 183, end = 201 }, { rule = "UP030", file = "case.py", start = 207, end = 222 }, { rule = "UP030", file = "case.py", start = 224, end = 253 }, { rule = "UP030", file = "case.py", start = 259, end = 297 }, { rule = "UP030", file = "case.py", start = 299, end = 316 }, { rule = "UP030", file = "case.py", start = 318, end = 345 }, { rule = "UP030", file = "case.py", start = 358, end = 392 }, { rule = "UP030", file = "case.py", start = 407, end = 452 }, { rule = "UP030", file = "case.py", start = 456, end = 474 }, { rule = "UP030", file = "case.py", start = 535, end = 554 }, { rule = "UP030", file = "case.py", start = 556, end = 578 }, { rule = "UP030", file = "case.py", start = 580, end = 603 }, { rule = "UP030", file = "case.py", start = 605, end = 631 }, { rule = "UP030", file = "case.py", start = 633, end = 662 }, { rule = "UP030", file = "case.py", start = 664, end = 693 }, { rule = "UP030", file = "case.py", start = 695, end = 728 }, { rule = "UP030", file = "case.py", start = 730, end = 766 }, { rule = "UP030", file = "case.py", start = 768, end = 807 }, { rule = "UP030", file = "case.py", start = 809, end = 855 }, { rule = "UP030", file = "case.py", start = 857, end = 886 }, { rule = "UP030", file = "case.py", start = 888, end = 910 }, { rule = "UP030", file = "case.py", start = 912, end = 939 }, { rule = "UP030", file = "case.py", start = 941, end = 962 }]

