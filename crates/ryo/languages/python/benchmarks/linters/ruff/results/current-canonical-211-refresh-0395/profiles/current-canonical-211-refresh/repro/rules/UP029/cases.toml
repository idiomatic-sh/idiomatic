[[cases]]
name = "builtins-str"
comparison = "full"
files = { "case.py" = "from builtins import str\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 21, "end" = 24 }, { "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 24 }]

[[cases]]
name = "builtins-range"
comparison = "full"
files = { "case.py" = "from builtins import range\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 21, "end" = 26 }, { "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 26 }]

[[cases]]
name = "io-open"
comparison = "full"
files = { "case.py" = "from io import open\n" }
