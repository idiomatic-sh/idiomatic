expected = [{ "rule" = "F401", "file" = "case.py", "start" = 16, "end" = 20 }, { "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 20 }]

[[cases]]
name = "six-moves"
comparison = "full"
files = { "case.py" = "from six.moves import zip\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 22, "end" = 25 }, { "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 25 }]

[[cases]]
name = "builtin-alias"
comparison = "full"
files = { "case.py" = "from builtins import str as text\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 28, "end" = 32 }]

[[cases]]
name = "other-builtin"
comparison = "full"
files = { "case.py" = "from builtins import property\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 21, "end" = 29 }]

[[cases]]
name = "relative"
comparison = "full"
files = { "case.py" = "from .builtins import str\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 22, "end" = 25 }]

[[cases]]
name = "wildcard"
comparison = "full"
files = { "case.py" = "from builtins import *\n" }
expected = [{ "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 22 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "str = custom\nfrom builtins import str\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 34, "end" = 37 }, { "rule" = "F811", "file" = "case.py", "start" = 34, "end" = 37 }, { "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 12 }]

[[cases]]
name = "multiple"
comparison = "full"
files = { "case.py" = "from builtins import str, range, property\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 21, "end" = 24 }, { "rule" = "F401", "file" = "case.py", "start" = 26, "end" = 31 }, { "rule" = "F401", "file" = "case.py", "start" = 33, "end" = 41 }, { "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 41 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "from builtins import str  # noqa: UP029\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 21, "end" = 24 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa: UP029\nfrom builtins import str\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 41, "end" = 44 }]

[[cases]]
name = "other-noqa"
comparison = "full"
files = { "case.py" = "from builtins import str  # noqa: F401\n" }
expected = [{ "rule" = "UP029", "file" = "case.py", "start" = 0, "end" = 24 }]

[[cases]]
name = "Unicode-leading"
comparison = "full"
files = { "case.py" = "π = 1\nfrom builtins import str\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 28, "end" = 31 }, { "rule" = "UP029", "file" = "case.py", "start" = 7, "end" = 31 }]
