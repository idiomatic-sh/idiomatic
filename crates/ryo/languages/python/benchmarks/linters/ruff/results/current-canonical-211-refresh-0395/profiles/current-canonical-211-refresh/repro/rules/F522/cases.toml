[[cases]]
name = "extra-name"
comparison = "full"
files = { "case.py" = "\"{name}\".format(name=value, unused=other)\n" }
expected = [{ "rule" = "F522", "file" = "case.py", "start" = 0, "end" = 41 }, { "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 26 }, { "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 40 }]

[[cases]]
name = "all-names-used"
comparison = "full"
files = { "case.py" = "\"{name}\".format(name=value)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 26 }]

[[cases]]
name = "duplicate-field-still-used"
comparison = "full"
files = { "case.py" = "\"{name} {name}\".format(name=value)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 28, "end" = 33 }]

[[cases]]
name = "nested-format-spec-name-used"
comparison = "full"
files = { "case.py" = "\"{value:{width}}\".format(value=1, width=3, unused=4)\n" }
expected = [{ "rule" = "F522", "file" = "case.py", "start" = 0, "end" = 52 }]

[[cases]]
name = "dynamic-keywords-disable-check"
comparison = "full"
files = { "case.py" = "\"{name}\".format(**values, unused=1)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 18, "end" = 24 }]

[[cases]]
name = "noqa-extra-name"
comparison = "full"
files = { "case.py" = "\"{name}\".format(name=value, unused=other)  # noqa: F522\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 21, "end" = 26 }, { "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 40 }]

[[cases]]
name = "malformed-field-path-does-not-consume-keywords"
comparison = "full"
files = { "case.py" = "\"{x..}\".format(x=1)\n" }
expected = [{ "rule" = "F521", "file" = "case.py", "start" = 0, "end" = 19 }]

[[cases]]
name = "malformed-nested-field-path-does-not-consume-keywords"
comparison = "full"
files = { "case.py" = "\"{x:{y..}}\".format(x=1, y=2)\n" }
expected = [{ "rule" = "F521", "file" = "case.py", "start" = 0, "end" = 28 }]

[[cases]]
name = "non-format-method"
comparison = "full"
files = { "case.py" = "render(\"{name}\", name=value, unused=other)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 6 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 27 }, { "rule" = "F821", "file" = "case.py", "start" = 36, "end" = 41 }]
