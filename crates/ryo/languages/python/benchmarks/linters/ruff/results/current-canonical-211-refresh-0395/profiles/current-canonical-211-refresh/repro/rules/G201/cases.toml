[[cases]]
name = "error-true"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    logging.error(\"x\", exc_info=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "G201", "file" = "case.py", "start" = 61, "end" = 66 }, { "rule" = "LOG015", "file" = "case.py", "start" = 53, "end" = 86 }]

[[cases]]
name = "error-sys-exc-info"
comparison = "full"
files = { "case.py" = "import logging\nimport sys\ntry:\n    work()\nexcept Exception:\n    logging.error(\"x\", exc_info=sys.exc_info())\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 39 }, { "rule" = "G201", "file" = "case.py", "start" = 72, "end" = 77 }, { "rule" = "LOG015", "file" = "case.py", "start" = 64, "end" = 107 }]

[[cases]]
name = "error-false"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    logging.error(\"x\", exc_info=False)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "LOG015", "file" = "case.py", "start" = 53, "end" = 87 }]

[[cases]]
name = "async-function-inside-handler-is-outside-handler-context"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    async def inner():\n        logging.error(\"x\", exc_info=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "LOG015", "file" = "case.py", "start" = 80, "end" = 113 }]

[[cases]]
name = "sync-function-inside-handler-control"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    def inner():\n        logging.error(\"x\", exc_info=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "LOG015", "file" = "case.py", "start" = 74, "end" = 107 }]

[[cases]]
name = "error-outside"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"x\", exc_info=True)\n" }
expected = [{ "rule" = "LOG014", "file" = "case.py", "start" = 34, "end" = 47 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 48 }]

