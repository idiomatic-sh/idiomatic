[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "global value\n" }
expected = [{ "rule" = "PLW0604", "file" = "case.py", "start" = 0, "end" = 12 }]

[[cases]]
name = "conditional"
comparison = "full"
files = { "case.py" = "if True:\n    global value\n" }
expected = [{ "rule" = "PLW0604", "file" = "case.py", "start" = 13, "end" = 25 }]

[[cases]]
name = "function"
comparison = "full"
files = { "case.py" = "def f():\n    global value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 25 }]

[[cases]]
name = "class"
comparison = "full"
files = { "case.py" = "class C:\n    global value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 25 }]

[[cases]]
name = "nested-function"
comparison = "full"
files = { "case.py" = "if True:\n    def f():\n        global value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 37, "end" = 42 }]

[[cases]]
name = "names"
comparison = "full"
files = { "case.py" = "global first, second\n" }
expected = [{ "rule" = "PLW0604", "file" = "case.py", "start" = 0, "end" = 20 }]

[[cases]]
name = "try"
comparison = "full"
files = { "case.py" = "try:\n    global value\nexcept:\n    pass\n" }
expected = [{ "rule" = "E722", "file" = "case.py", "start" = 22, "end" = 28 }, { "rule" = "PLW0604", "file" = "case.py", "start" = 9, "end" = 21 }, { "rule" = "S110", "file" = "case.py", "start" = 22, "end" = 38 }]

