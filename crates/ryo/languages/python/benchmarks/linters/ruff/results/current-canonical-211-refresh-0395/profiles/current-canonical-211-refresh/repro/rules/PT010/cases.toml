[[cases]]
name = "no-args"
comparison = "full"
files = { "case.py" = "import pytest\npytest.raises()\n" }
expected = [{ "rule" = "PT010", "file" = "case.py", "start" = 14, "end" = 27 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import pytest as pt\npt.raises()\n" }
expected = [{ "rule" = "PT010", "file" = "case.py", "start" = 20, "end" = 29 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from pytest import raises\nraises()\n" }
expected = [{ "rule" = "PT010", "file" = "case.py", "start" = 26, "end" = 32 }]

[[cases]]
name = "from-import-alias"
comparison = "full"
files = { "case.py" = "from pytest import raises as expect\nexpect()\n" }
expected = [{ "rule" = "PT010", "file" = "case.py", "start" = 36, "end" = 42 }]

