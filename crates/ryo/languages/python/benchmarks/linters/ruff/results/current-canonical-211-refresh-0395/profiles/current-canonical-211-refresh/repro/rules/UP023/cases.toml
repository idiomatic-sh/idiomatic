[[cases]]
name = "aliased-module"
comparison = "full"
files = { "case.py" = "import xml.etree.cElementTree as ET\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 33, "end" = 35 }, { "rule" = "UP023", "file" = "case.py", "start" = 7, "end" = 35 }]

[[cases]]
name = "module-without-alias"
comparison = "full"
files = { "case.py" = "import xml.etree.cElementTree\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 29 }]

[[cases]]
name = "aliased-member"
comparison = "full"
files = { "case.py" = "from xml.etree import cElementTree as ET\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 38, "end" = 40 }, { "rule" = "UP023", "file" = "case.py", "start" = 22, "end" = 40 }]

[[cases]]
name = "member-without-alias"
comparison = "full"
files = { "case.py" = "from xml.etree import cElementTree\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 22, "end" = 34 }]

[[cases]]
name = "from-module"
comparison = "full"
files = { "case.py" = "from xml.etree.cElementTree import XML\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 35, "end" = 38 }, { "rule" = "UP023", "file" = "case.py", "start" = 0, "end" = 38 }]

[[cases]]
name = "wildcard"
comparison = "full"
files = { "case.py" = "from xml.etree.cElementTree import *\n" }
expected = [{ "rule" = "UP023", "file" = "case.py", "start" = 0, "end" = 36 }]

[[cases]]
name = "relative"
comparison = "full"
files = { "case.py" = "from .xml.etree.cElementTree import XML\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 36, "end" = 39 }]

[[cases]]
name = "different-module"
comparison = "full"
files = { "case.py" = "from xml.etree.ElementTree import XML\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 34, "end" = 37 }]

[[cases]]
name = "multiple"
comparison = "full"
files = { "case.py" = "from xml.etree.cElementTree import XML, parse\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 35, "end" = 38 }, { "rule" = "F401", "file" = "case.py", "start" = 40, "end" = 45 }, { "rule" = "UP023", "file" = "case.py", "start" = 0, "end" = 45 }]

[[cases]]
name = "multiple-imports"
comparison = "full"
files = { "case.py" = "import os, xml.etree.cElementTree as ET\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 9 }, { "rule" = "F401", "file" = "case.py", "start" = 37, "end" = 39 }, { "rule" = "UP023", "file" = "case.py", "start" = 11, "end" = 39 }]

[[cases]]
name = "different-submodule"
comparison = "full"
files = { "case.py" = "import xml.etree.cElementTree.XML as XML\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 37, "end" = 40 }, { "rule" = "PLR0402", "file" = "case.py", "start" = 7, "end" = 40 }]

[[cases]]
name = "nested"
comparison = "full"
files = { "case.py" = "def f():\n    from xml.etree.cElementTree import XML\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 48, "end" = 51 }, { "rule" = "UP023", "file" = "case.py", "start" = 13, "end" = 51 }]

