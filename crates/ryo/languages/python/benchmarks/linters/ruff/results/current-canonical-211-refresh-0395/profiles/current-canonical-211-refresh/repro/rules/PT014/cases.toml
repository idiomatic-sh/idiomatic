[[cases]]
name = "separate-calls"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.mark.parametrize(\"x\", [1, 2])\n@pytest.mark.parametrize(\"y\", [1, 1])\ndef test(x, y): pass\n" }
