[[cases]]
name = "wrong-function"
comparison = "full"
files = { "case.py" = "import pytest\n@other.parametrize(\"x\", [1, 1])\ndef test(x): pass\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 15, "end" = 20 }]

[[cases]]
name = "shadowed-pytest"
comparison = "full"
files = { "case.py" = "import pytest\npytest = object()\n@pytest.mark.parametrize(\"x\", [1, 1])\ndef test(x): pass\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 14, "end" = 20 }]

[[cases]]
name = "inline-noqa"
