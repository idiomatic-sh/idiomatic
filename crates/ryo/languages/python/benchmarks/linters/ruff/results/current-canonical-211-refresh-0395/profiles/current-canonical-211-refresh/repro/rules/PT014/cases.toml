[[cases]]
name = "duplicate-integers"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.mark.parametrize(\"x\", [1, 1])\ndef test(x): pass\n" }
expected = [{ "rule" = "PT014", "file" = "case.py", "start" = 48, "end" = 49 }]

[[cases]]
name = "triple-integer"
comparison = "full"
files = { "case.py" = "import pytest\n@pytest.mark.parametrize(\"x\", [1, 1, 1])\ndef test(x): pass\n" }
expected = [{ "rule" = "PT014", "file" = "case.py", "start" = 48, "end" = 49 }, { "rule" = "PT014", "file" = "case.py", "start" = 51, "end" = 52 }]

[[cases]]
name = "nonadjacent-duplicate"
comparison = "full"
