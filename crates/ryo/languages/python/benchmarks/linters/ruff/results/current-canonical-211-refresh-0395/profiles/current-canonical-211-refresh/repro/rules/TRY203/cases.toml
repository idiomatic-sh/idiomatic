[[cases]]
name = "typed"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError:\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "TRY203", "file" = "case.py", "start" = 16, "end" = 44 }]

[[cases]]
name = "bare"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept:\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "TRY203", "file" = "case.py", "start" = 16, "end" = 33 }]

[[cases]]
name = "named"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError as error:\n    raise error\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "TRY203", "file" = "case.py", "start" = 16, "end" = 59 }]

[[cases]]
name = "wrong-name"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError as error:\n    raise other\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 54, "end" = 59 }, { "rule" = "F841", "file" = "case.py", "start" = 37, "end" = 42 }]

[[cases]]
name = "cause"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError as error:\n    raise error from None\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }]

[[cases]]
name = "logging"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError:\n    log()\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 39, "end" = 42 }]

[[cases]]
name = "unreachable"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError:\n    raise\n    log()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 49, "end" = 52 }, { "rule" = "TRY203", "file" = "case.py", "start" = 16, "end" = 54 }]

[[cases]]
name = "mixed"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError:\n    raise\nexcept TypeError:\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }]

[[cases]]
name = "all"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError:\n    raise\nexcept TypeError:\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "TRY203", "file" = "case.py", "start" = 16, "end" = 44 }, { "rule" = "TRY203", "file" = "case.py", "start" = 45, "end" = 72 }]

[[cases]]
name = "group"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept* ValueError:\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "TRY203", "file" = "case.py", "start" = 16, "end" = 45 }, { "rule" = "invalid-syntax", "file" = "case.py", "start" = 22, "end" = 23 }]

[[cases]]
name = "finally"
comparison = "full"
files = { "case.py" = "try:\n    work()\nfinally:\n    cleanup()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 36 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError: # noqa\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }]

[[cases]]
name = "code-noqa"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError: # noqa: TRY203\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }]

[[cases]]
name = "other-code"
comparison = "full"
files = { "case.py" = "try:\n    work()\nexcept ValueError: # noqa: F401\n    raise\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 13 }, { "rule" = "TRY203", "file" = "case.py", "start" = 16, "end" = 57 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa\ntry:\n    work()\nexcept ValueError:\n    raise\n" }
expected = []

