[[cases]]
name = "walrus"
comparison = "full"
files = { "case.py" = "(value := 1)\n" }
expected = [{ "rule" = "PLW0131", "file" = "case.py", "start" = 1, "end" = 11 }]

[[cases]]
name = "if"
comparison = "full"
files = { "case.py" = "if (value := 1):\n    pass\n" }
expected = []

[[cases]]
name = "argument"
comparison = "full"
files = { "case.py" = "print(value := 1)\n" }
expected = []

[[cases]]
name = "function"
comparison = "full"
files = { "case.py" = "def f():\n    (value := 1)\n" }
expected = [{ "rule" = "F841", "file" = "case.py", "start" = 14, "end" = 19 }, { "rule" = "PLW0131", "file" = "case.py", "start" = 14, "end" = 24 }]

