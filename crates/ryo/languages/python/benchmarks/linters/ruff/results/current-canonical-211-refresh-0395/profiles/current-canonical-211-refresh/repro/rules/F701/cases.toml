[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "break\n" }
expected = [{ "rule" = "F701", "file" = "case.py", "start" = 0, "end" = 5 }]

[[cases]]
name = "function"
comparison = "full"
files = { "case.py" = "def f():\n    break\n" }
expected = [{ "rule" = "F701", "file" = "case.py", "start" = 13, "end" = 18 }]

[[cases]]
name = "while"
comparison = "full"
files = { "case.py" = "while ready:\n    break\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }]

[[cases]]
name = "for"
comparison = "full"
files = { "case.py" = "for item in items:\n    break\n" }
