[[cases]]
name = "nested-if"
comparison = "full"
files = { "case.py" = "while ready:\n    if item:\n        break\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }, { "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 24 }]

[[cases]]
name = "loop-else"
comparison = "full"
files = { "case.py" = "while ready:\n    pass\nelse:\n    break\n" }
expected = [{ "rule" = "F701", "file" = "case.py", "start" = 32, "end" = 37 }, { "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }, { "rule" = "PLW0120", "file" = "case.py", "start" = 22, "end" = 26 }]

[[cases]]
name = "nested-else"
comparison = "full"
files = { "case.py" = "while ready:\n    for item in items:\n        pass\n    else:\n        break\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }, { "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 34 }, { "rule" = "PLW0120", "file" = "case.py", "start" = 53, "end" = 57 }]

[[cases]]
name = "nested-function"
comparison = "full"
files = { "case.py" = "while ready:\n    def f():\n        break\n" }
expected = [{ "rule" = "F701", "file" = "case.py", "start" = 34, "end" = 39 }, { "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }]

[[cases]]
