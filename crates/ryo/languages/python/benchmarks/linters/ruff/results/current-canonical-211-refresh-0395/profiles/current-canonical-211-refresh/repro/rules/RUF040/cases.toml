[[cases]]
name = "number"
comparison = "full"
files = { "case.py" = "assert value, 42\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 12 }, { "rule" = "RUF040", "file" = "case.py", "start" = 14, "end" = 16 }]

[[cases]]
name = "none"
comparison = "full"
files = { "case.py" = "assert value, None\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 12 }, { "rule" = "RUF040", "file" = "case.py", "start" = 14, "end" = 18 }]

[[cases]]
name = "bytes"
comparison = "full"
files = { "case.py" = "assert value, b\"message\"\n" }
