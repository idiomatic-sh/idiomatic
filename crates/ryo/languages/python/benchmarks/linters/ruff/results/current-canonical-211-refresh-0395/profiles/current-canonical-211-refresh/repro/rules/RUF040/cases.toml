[[cases]]
name = "bool"
comparison = "full"
files = { "case.py" = "assert value, False\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 12 }, { "rule" = "RUF040", "file" = "case.py", "start" = 14, "end" = 19 }]

[[cases]]
