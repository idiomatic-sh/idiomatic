[[cases]]
name = "asyncio-timeout-no-checkpoint"
comparison = "full"
files = { "case.py" = "import asyncio\nasync def f():\n    async with asyncio.timeout(1):\n        work()\n" }
expected = [{ "rule" = "ASYNC100", "file" = "case.py", "start" = 34, "end" = 79 }, { "rule" = "F821", "file" = "case.py", "start" = 73, "end" = 77 }]

