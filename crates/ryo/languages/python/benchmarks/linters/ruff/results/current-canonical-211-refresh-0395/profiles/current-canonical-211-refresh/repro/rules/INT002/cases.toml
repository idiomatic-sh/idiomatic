[[cases]]
name = "underscore"
comparison = "full"
files = { "case.py" = "_(\"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 20, "end" = 24 }, { "rule" = "INT002", "file" = "case.py", "start" = 2, "end" = 25 }]

[[cases]]
name = "gettext"
comparison = "full"
files = { "case.py" = "gettext(\"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 7 }, { "rule" = "F821", "file" = "case.py", "start" = 26, "end" = 30 }, { "rule" = "INT002", "file" = "case.py", "start" = 8, "end" = 31 }]

[[cases]]
name = "ngettext-first"
comparison = "full"
files = { "case.py" = "ngettext(\"hello {}\".format(name), \"many\", n)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "F821", "file" = "case.py", "start" = 27, "end" = 31 }, { "rule" = "F821", "file" = "case.py", "start" = 42, "end" = 43 }, { "rule" = "INT002", "file" = "case.py", "start" = 9, "end" = 32 }]

[[cases]]
name = "plural-default-excluded"
comparison = "full"
files = { "case.py" = "ngettext(\"one\", \"hello {}\".format(name), n)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }, { "rule" = "F821", "file" = "case.py", "start" = 34, "end" = 38 }, { "rule" = "F821", "file" = "case.py", "start" = 41, "end" = 42 }]

[[cases]]
name = "unrelated"
comparison = "full"
files = { "case.py" = "other(\"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }, { "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }]

[[cases]]
name = "keyword"
comparison = "full"
files = { "case.py" = "_(message=\"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 28, "end" = 32 }]

[[cases]]
name = "second"
comparison = "full"
files = { "case.py" = "_(\"first\", \"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "F821", "file" = "case.py", "start" = 29, "end" = 33 }]

[[cases]]
name = "direct-shadow"
comparison = "full"
files = { "case.py" = "def f(_):\n    _(\"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 34, "end" = 38 }, { "rule" = "INT002", "file" = "case.py", "start" = 16, "end" = 39 }]

[[cases]]
name = "import-alias"
comparison = "full"
files = { "case.py" = "from gettext import gettext as translate\ntranslate(\"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 69, "end" = 73 }, { "rule" = "INT002", "file" = "case.py", "start" = 51, "end" = 74 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import gettext as gt\ngt.gettext(\"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 50, "end" = 54 }, { "rule" = "INT002", "file" = "case.py", "start" = 32, "end" = 55 }]

[[cases]]
