[[cases]]
name = "builtins"
comparison = "full"
files = { "case.py" = "import builtins\nbuiltins._(\"hello {}\".format(name))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 45, "end" = 49 }, { "rule" = "INT002", "file" = "case.py", "start" = 27, "end" = 50 }]

[[cases]]
name = "plain"
comparison = "full"
files = { "case.py" = "_(\"hello\")\n" }
