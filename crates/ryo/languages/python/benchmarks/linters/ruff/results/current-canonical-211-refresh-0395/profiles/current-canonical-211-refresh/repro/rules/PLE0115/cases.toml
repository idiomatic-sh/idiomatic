[[cases]]
name = "global-then-nonlocal"
comparison = "full"
files = { "case.py" = "def f():\n    global value\n    nonlocal value\n" }
expected = [{ "rule" = "PLE0115", "file" = "case.py", "start" = 20, "end" = 25 }, { "rule" = "PLE0117", "file" = "case.py", "start" = 39, "end" = 44 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 25 }]

[[cases]]
name = "nonlocal-then-global"
comparison = "full"
files = { "case.py" = "def f():\n    nonlocal value\n    global value\n" }
expected = [{ "rule" = "PLE0115", "file" = "case.py", "start" = 39, "end" = 44 }, { "rule" = "PLE0117", "file" = "case.py", "start" = 22, "end" = 27 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 39, "end" = 44 }]

[[cases]]
name = "same-name-in-separate-functions"
comparison = "full"
files = { "case.py" = "def a():\n    global value\ndef b():\n    nonlocal value\n" }
expected = [{ "rule" = "PLE0117", "file" = "case.py", "start" = 48, "end" = 53 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 25 }]

[[cases]]
name = "outer-and-inner-functions-do-not-conflict"
comparison = "full"
files = { "case.py" = "def outer():\n    global value\n    def inner():\n        nonlocal value\n" }
expected = [{ "rule" = "PLW0602", "file" = "case.py", "start" = 24, "end" = 29 }]

[[cases]]
name = "noqa-suppresses-conflicting-declaration"
comparison = "full"
files = { "case.py" = "def f():\n    global value  # noqa: PLE0115\n    nonlocal value\n" }
expected = [{ "rule" = "PLE0117", "file" = "case.py", "start" = 56, "end" = 61 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 20, "end" = 25 }]

[[cases]]
name = "latest-global-declaration-is-reported"
comparison = "full"
files = { "case.py" = "def f():\n    global value\n    global value\n    nonlocal value\n" }
expected = [{ "rule" = "PLE0115", "file" = "case.py", "start" = 37, "end" = 42 }, { "rule" = "PLE0117", "file" = "case.py", "start" = 56, "end" = 61 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 37, "end" = 42 }]

[[cases]]
name = "each-nonlocal-declaration-retains-diagnostic-multiplicity"
comparison = "full"
files = { "case.py" = "def f():\n    nonlocal value\n    nonlocal value\n    global value\n" }
expected = [{ "rule" = "PLE0115", "file" = "case.py", "start" = 58, "end" = 63 }, { "rule" = "PLE0115", "file" = "case.py", "start" = 58, "end" = 63 }, { "rule" = "PLE0117", "file" = "case.py", "start" = 22, "end" = 27 }, { "rule" = "PLE0117", "file" = "case.py", "start" = 41, "end" = 46 }, { "rule" = "PLW0602", "file" = "case.py", "start" = 58, "end" = 63 }]
