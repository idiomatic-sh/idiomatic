[[cases]]
name = "return"
comparison = "full"
files = { "case.py" = "def f():\n    try:\n        pass\n    finally:\n        return\n" }
expected = [{ "rule" = "B012", "file" = "case.py", "start" = 52, "end" = 58 }]

[[cases]]
name = "continue"
comparison = "full"
files = { "case.py" = "for x in values:\n    try:\n        pass\n    finally:\n        continue\n" }
expected = [{ "rule" = "B012", "file" = "case.py", "start" = 60, "end" = 68 }, { "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 15 }]

[[cases]]
name = "break"
comparison = "full"
files = { "case.py" = "for x in values:\n    try:\n        pass\n    finally:\n        break\n" }
expected = [{ "rule" = "B012", "file" = "case.py", "start" = 60, "end" = 65 }, { "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 15 }]

[[cases]]
name = "inner-loop-break"
comparison = "full"
files = { "case.py" = "try:\n    pass\nfinally:\n    for x in values:\n        break\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 36, "end" = 42 }]

[[cases]]
name = "inner-loop-return"
comparison = "full"
files = { "case.py" = "def f():\n    try:\n        pass\n    finally:\n        for x in values:\n            return x\n" }
expected = [{ "rule" = "B012", "file" = "case.py", "start" = 81, "end" = 89 }, { "rule" = "F821", "file" = "case.py", "start" = 61, "end" = 67 }]

[[cases]]
name = "if-body"
comparison = "full"
files = { "case.py" = "def f():\n    try:\n        pass\n    finally:\n        if condition:\n            return\n" }
expected = [{ "rule" = "B012", "file" = "case.py", "start" = 78, "end" = 84 }, { "rule" = "F821", "file" = "case.py", "start" = 55, "end" = 64 }]

[[cases]]
name = "else-not-walked"
comparison = "full"
files = { "case.py" = "def f():\n    try:\n        pass\n    finally:\n        if condition:\n            pass\n        else:\n            return\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 55, "end" = 64 }]

[[cases]]
name = "inner-function"
comparison = "full"
files = { "case.py" = "try:\n    pass\nfinally:\n    def f():\n        return\n" }
expected = []

[[cases]]
name = "except-not-walked"
comparison = "full"
files = { "case.py" = "def f():\n    try:\n        pass\n    finally:\n        try:\n            pass\n        except:\n            return\n" }
expected = [{ "rule" = "E722", "file" = "case.py", "start" = 82, "end" = 88 }]

[[cases]]
name = "match"
comparison = "full"
files = { "case.py" = "def f():\n    try:\n        pass\n    finally:\n        match value:\n            case 1:\n                return\n" }
