[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "__metaclass__ = type\n" }
expected = [{ "rule" = "UP001", "file" = "case.py", "start" = 0, "end" = 20 }]

[[cases]]
name = "class"
comparison = "full"
files = { "case.py" = "class C:\n    __metaclass__ = type\n" }
expected = [{ "rule" = "UP001", "file" = "case.py", "start" = 13, "end" = 33 }]

[[cases]]
name = "function"
comparison = "full"
files = { "case.py" = "def f():\n    __metaclass__ = type\n" }
expected = [{ "rule" = "F841", "file" = "case.py", "start" = 13, "end" = 26 }, { "rule" = "UP001", "file" = "case.py", "start" = 13, "end" = 33 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "def f(type):\n    __metaclass__ = type\n" }
expected = [{ "rule" = "F841", "file" = "case.py", "start" = 17, "end" = 30 }, { "rule" = "UP001", "file" = "case.py", "start" = 17, "end" = 37 }]

