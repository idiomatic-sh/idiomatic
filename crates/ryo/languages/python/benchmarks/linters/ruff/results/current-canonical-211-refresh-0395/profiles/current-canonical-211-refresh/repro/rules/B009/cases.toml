[[cases]]
name = "getattr-valid"
comparison = "full"
files = { "case.py" = "value = getattr(obj, \"name\")\n" }
expected = [{ "rule" = "B009", "file" = "case.py", "start" = 8, "end" = 28 }, { "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 19 }]

[[cases]]
name = "getattr-default"
comparison = "full"
files = { "case.py" = "value = getattr(obj, \"name\", None)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 16, "end" = 19 }]

[[cases]]
name = "getattr-keyword-default"
comparison = "full"
files = { "case.py" = "value = getattr(obj, \"name\", default=None)\n" }
