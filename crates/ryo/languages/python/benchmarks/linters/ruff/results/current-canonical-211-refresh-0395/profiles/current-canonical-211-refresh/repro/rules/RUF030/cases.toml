[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "assert condition, print(\"bad\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }, { "rule" = "RUF030", "file" = "case.py", "start" = 18, "end" = 30 }]

[[cases]]
name = "empty-print"
comparison = "full"
files = { "case.py" = "assert condition, print()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }, { "rule" = "RUF030", "file" = "case.py", "start" = 18, "end" = 25 }]

[[cases]]
name = "format-print"
comparison = "full"
files = { "case.py" = "assert condition, print(\"bad\", value)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }, { "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 36 }, { "rule" = "RUF030", "file" = "case.py", "start" = 18, "end" = 37 }]

[[cases]]
name = "keyword-print"
comparison = "full"
files = { "case.py" = "assert condition, print(value, sep=\" \")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }, { "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 29 }, { "rule" = "RUF030", "file" = "case.py", "start" = 18, "end" = 39 }]

[[cases]]
name = "no-message"
comparison = "full"
files = { "case.py" = "assert condition\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }]

[[cases]]
name = "not-assert"
comparison = "full"
files = { "case.py" = "print(\"bad\")\n" }
expected = []

[[cases]]
name = "other-message"
comparison = "full"
files = { "case.py" = "assert condition, log(\"bad\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }, { "rule" = "F821", "file" = "case.py", "start" = 18, "end" = 21 }]

[[cases]]
name = "print-expression"
comparison = "full"
files = { "case.py" = "assert condition, (print(\"bad\"))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }, { "rule" = "RUF030", "file" = "case.py", "start" = 19, "end" = 31 }]

[[cases]]
name = "shadowed-parameter"
comparison = "full"
files = { "case.py" = "def f(print):\n    assert condition, print(\"bad\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 34 }]

[[cases]]
name = "shadowed-module"
comparison = "full"
files = { "case.py" = "print = custom\nassert condition, print(\"bad\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 14 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 31 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "assert condition, print(\"bad\")  # noqa: RUF030\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa: RUF030\nassert condition, print(\"bad\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 28, "end" = 37 }]

[[cases]]
name = "other-code"
comparison = "full"
files = { "case.py" = "assert condition, print(\"bad\")  # noqa: F401\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 16 }, { "rule" = "RUF030", "file" = "case.py", "start" = 18, "end" = 30 }]

[[cases]]
name = "multiple"
comparison = "full"
files = { "case.py" = "assert first, print(\"one\")\nassert second, print(\"two\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 12 }, { "rule" = "F821", "file" = "case.py", "start" = 34, "end" = 40 }, { "rule" = "RUF030", "file" = "case.py", "start" = 14, "end" = 26 }, { "rule" = "RUF030", "file" = "case.py", "start" = 42, "end" = 54 }]
