[[cases]]
name = "shadow-py"
comparison = "full"
files = { "case.py" = "import py\npy = object()\npy.path.local(\"x\")\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 10, "end" = 12 }]

[[cases]]
name = "shadow-local"
comparison = "full"
files = { "case.py" = "from py.path import local\ndef local(x): return x\nlocal(\"x\")\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 30, "end" = 35 }]

[[cases]]
name = "noqa"
comparison = "full"
