[[cases]]
name = "py-module"
comparison = "full"
files = { "case.py" = "import py\np = py.path.local(\"../foo\")\n" }
expected = [{ "rule" = "PTH124", "file" = "case.py", "start" = 14, "end" = 27 }]

[[cases]]
name = "aliased-module"
comparison = "full"
files = { "case.py" = "import py as p\np.path.local(\"x\")\n" }
expected = [{ "rule" = "PTH124", "file" = "case.py", "start" = 15, "end" = 27 }]

[[cases]]
name = "import-local"
comparison = "full"
files = { "case.py" = "from py.path import local\nlocal(\"x\")\n" }
expected = [{ "rule" = "PTH124", "file" = "case.py", "start" = 26, "end" = 31 }]

[[cases]]
name = "import-local-alias"
comparison = "full"
files = { "case.py" = "from py.path import local as path\npath(\"x\")\n" }
expected = [{ "rule" = "PTH124", "file" = "case.py", "start" = 34, "end" = 38 }]

[[cases]]
name = "multiple-calls"
comparison = "full"
files = { "case.py" = "import py\na = py.path.local(\"a\")\nb = py.path.local(\"b\")\n" }
expected = [{ "rule" = "PTH124", "file" = "case.py", "start" = 14, "end" = 27 }, { "rule" = "PTH124", "file" = "case.py", "start" = 37, "end" = 50 }]

[[cases]]
name = "nested-call"
comparison = "full"
files = { "case.py" = "import py\nvalue = wrap(py.path.local(\"x\"))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 18, "end" = 22 }, { "rule" = "PTH124", "file" = "case.py", "start" = 23, "end" = 36 }]

[[cases]]
name = "attribute-value"
comparison = "full"
files = { "case.py" = "import py\nvalue = py.path.local\n" }
expected = []

