[[cases]]
name = "multiple"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept (ValueError, TypeError):\n    pass\n" }
expected = []

[[cases]]
name = "empty"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept ():\n    pass\n" }
