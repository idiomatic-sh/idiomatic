[[cases]]
name = "group"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept* (ValueError,):\n    pass\n" }
expected = [{ "rule" = "B013", "file" = "case.py", "start" = 22, "end" = 35 }, { "rule" = "invalid-syntax", "file" = "case.py", "start" = 20, "end" = 21 }]

