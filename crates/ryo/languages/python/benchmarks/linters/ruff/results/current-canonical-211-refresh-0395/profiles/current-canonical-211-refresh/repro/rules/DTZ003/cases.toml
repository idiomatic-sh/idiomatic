[[cases]]
name = "module"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime.utcnow()\n" }
expected = [{ "rule" = "DTZ003", "file" = "case.py", "start" = 16, "end" = 42 }]

[[cases]]
name = "alias"
comparison = "full"
files = { "case.py" = "import datetime as alias\nalias.datetime.utcnow()\n" }
expected = [{ "rule" = "DTZ003", "file" = "case.py", "start" = 25, "end" = 48 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from datetime.datetime import utcnow as target\ntarget()\n" }
expected = [{ "rule" = "DTZ003", "file" = "case.py", "start" = 47, "end" = 55 }]

[[cases]]
name = "unimported"
comparison = "full"
files = { "case.py" = "datetime.datetime.utcnow()\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "import datetime\ndef f(datetime):\n    datetime.datetime.utcnow()\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 7, "end" = 15 }, { "rule" = "F811", "file" = "case.py", "start" = 22, "end" = 30 }]

[[cases]]
name = "rebound"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime = other\ndatetime.datetime.utcnow()\n" }
expected = [{ "rule" = "F811", "file" = "case.py", "start" = 16, "end" = 24 }, { "rule" = "F821", "file" = "case.py", "start" = 27, "end" = 32 }]

[[cases]]
name = "before-import"
comparison = "full"
files = { "case.py" = "datetime.datetime.utcnow()\nimport datetime\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 34, "end" = 42 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 8 }]

[[cases]]
name = "deferred-body"
comparison = "full"
files = { "case.py" = "def f():\n    datetime.datetime.utcnow()\nimport datetime\n" }
expected = [{ "rule" = "DTZ003", "file" = "case.py", "start" = 13, "end" = 39 }]

[[cases]]
name = "ordinary-call"
comparison = "full"
files = { "case.py" = "import datetime\ndef f(x):\n    x()\n    datetime.datetime.utcnow()\n" }
expected = [{ "rule" = "DTZ003", "file" = "case.py", "start" = 38, "end" = 64 }]

[[cases]]
name = "attribute-only"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime.utcnow\n" }
expected = [{ "rule" = "B018", "file" = "case.py", "start" = 16, "end" = 40 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "import datetime\ndatetime.datetime.utcnow() # noqa: DTZ003\n" }
expected = []

