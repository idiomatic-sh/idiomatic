[[cases]]
name = "set"
comparison = "full"
files = { "case.pyi" = "from collections.abc import Set\n" }
expected = [{ "rule" = "F401", "file" = "case.pyi", "start" = 28, "end" = 31 }, { "rule" = "PYI025", "file" = "case.pyi", "start" = 28, "end" = 31 }]

[[cases]]
name = "recommended"
comparison = "full"
files = { "case.pyi" = "from collections.abc import Set as AbstractSet\n" }
expected = [{ "rule" = "F401", "file" = "case.pyi", "start" = 35, "end" = 46 }]

[[cases]]
name = "other-alias"
comparison = "full"
files = { "case.pyi" = "from collections.abc import Set as Other\n" }
expected = [{ "rule" = "F401", "file" = "case.pyi", "start" = 35, "end" = 40 }, { "rule" = "PYI025", "file" = "case.pyi", "start" = 35, "end" = 40 }]

[[cases]]
name = "same-alias"
comparison = "full"
files = { "case.pyi" = "from collections.abc import Set as Set\n" }
expected = [{ "rule" = "PYI025", "file" = "case.pyi", "start" = 35, "end" = 38 }]

[[cases]]
name = "python"
comparison = "full"
files = { "case.py" = "from collections.abc import Set\n" }
expected = [{ "rule" = "F401", "file" = "case.py", "start" = 28, "end" = 31 }, { "rule" = "PYI025", "file" = "case.py", "start" = 28, "end" = 31 }]

[[cases]]
name = "relative"
comparison = "full"
files = { "case.pyi" = "from .collections.abc import Set\n" }
expected = [{ "rule" = "F401", "file" = "case.pyi", "start" = 29, "end" = 32 }]

[[cases]]
name = "other-set"
comparison = "full"
files = { "case.pyi" = "from typing import Set\n" }
expected = [{ "rule" = "F401", "file" = "case.pyi", "start" = 19, "end" = 22 }]

[[cases]]
name = "module-import"
comparison = "full"
files = { "case.pyi" = "import collections.abc.Set\n" }
expected = [{ "rule" = "F401", "file" = "case.pyi", "start" = 7, "end" = 26 }]

[[cases]]
name = "nested"
comparison = "full"
files = { "case.pyi" = "def f():\n    from collections.abc import Set\n" }
expected = [{ "rule" = "F401", "file" = "case.pyi", "start" = 41, "end" = 44 }, { "rule" = "PYI010", "file" = "case.pyi", "start" = 13, "end" = 44 }, { "rule" = "PYI025", "file" = "case.pyi", "start" = 41, "end" = 44 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.pyi" = "from collections.abc import Set # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
comparison = "full"
files = { "case.pyi" = "from collections.abc import Set # noqa: PYI025\n" }
