[[cases]]
name = "other-code"
comparison = "full"
files = { "case.pyi" = "from collections.abc import Set # noqa: F401\n" }
expected = [{ "rule" = "PYI025", "file" = "case.pyi", "start" = 28, "end" = 31 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.pyi" = "# ruff: noqa\nfrom collections.abc import Set\n" }
expected = []

