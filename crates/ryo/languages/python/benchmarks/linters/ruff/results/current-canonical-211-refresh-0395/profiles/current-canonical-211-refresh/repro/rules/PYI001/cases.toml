[[cases]]
name = "typevar"
comparison = "full"
files = { "case.pyi" = "from typing import TypeVar\nT = TypeVar(\"T\")\n" }
expected = [{ "rule" = "PYI001", "file" = "case.pyi", "start" = 31, "end" = 43 }]

