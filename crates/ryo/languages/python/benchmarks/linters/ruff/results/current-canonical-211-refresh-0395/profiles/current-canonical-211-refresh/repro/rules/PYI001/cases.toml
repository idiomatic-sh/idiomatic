[[cases]]
name = "typevar-inside-async-method-is-not-module-level"
comparison = "full"
files = { "case.pyi" = "from typing import TypeVar\nclass C:\n    async def f(self):\n        T = TypeVar(\"T\")\n" }
expected = [{ "rule" = "F841", "file" = "case.pyi", "start" = 67, "end" = 68 }, { "rule" = "PYI010", "file" = "case.pyi", "start" = 67, "end" = 83 }]

[[cases]]
name = "typevar-inside-sync-method-control"
