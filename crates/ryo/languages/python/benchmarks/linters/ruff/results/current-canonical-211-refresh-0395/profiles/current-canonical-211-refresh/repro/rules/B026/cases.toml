comparison = "full"
files = { "case.py" = "# ruff: disable[E501]\ncall(key=1, *args)\n" }
expected = [{ "rule" = "B026", "file" = "case.py", "start" = 34, "end" = 39 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 26 }, { "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 39 }]

[[cases]]
name = "shared-file-ignore"
comparison = "full"
files = { "case.py" = "# ruff: file-ignore[B026]\ncall(key=1, *args)\n" }
