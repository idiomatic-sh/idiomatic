[[cases]]
name = "redirected-range-code-RUF004"
comparison = "full"
files = { "case.py" = "# ruff: disable[RUF004]\ncall(key=1, *args)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "F821", "file" = "case.py", "start" = 37, "end" = 41 }]

