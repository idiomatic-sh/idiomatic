[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "import itertools\nitertools.starmap(function, zip(values))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 43 }, { "rule" = "F821", "file" = "case.py", "start" = 49, "end" = 55 }, { "rule" = "RUF058", "file" = "case.py", "start" = 17, "end" = 57 }]

[[cases]]
name = "from-alias"
comparison = "full"
files = { "case.py" = "from itertools import starmap as sm\nsm(function, zip(values))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 39, "end" = 47 }, { "rule" = "F821", "file" = "case.py", "start" = 53, "end" = 59 }, { "rule" = "RUF058", "file" = "case.py", "start" = 36, "end" = 61 }]

[[cases]]
name = "zip-alias"
comparison = "full"
files = { "case.py" = "import itertools\nfrom builtins import zip as z\nitertools.starmap(function, z(values))\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 65, "end" = 73 }, { "rule" = "F821", "file" = "case.py", "start" = 77, "end" = 83 }, { "rule" = "RUF058", "file" = "case.py", "start" = 47, "end" = 85 }]

