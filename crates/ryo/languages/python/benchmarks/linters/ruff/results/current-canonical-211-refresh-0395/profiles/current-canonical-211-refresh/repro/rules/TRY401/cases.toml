comparison = "full"
files = { "case.py" = "import logging\nlogging.exception(\"failure\", error)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 44, "end" = 49 }, { "rule" = "LOG015", "file" = "case.py", "start" = 15, "end" = 50 }]

