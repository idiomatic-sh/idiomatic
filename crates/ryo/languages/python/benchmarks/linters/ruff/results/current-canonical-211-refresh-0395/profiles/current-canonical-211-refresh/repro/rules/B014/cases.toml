[[cases]]
name = "duplicate"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept (ValueError, ValueError):\n    pass\n" }
expected = [{ "rule" = "B014", "file" = "case.py", "start" = 21, "end" = 45 }]

[[cases]]
name = "different"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept (ValueError, TypeError):\n    pass\n" }
expected = []

[[cases]]
name = "qualified"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept (pkg.Error, pkg.Error):\n    pass\n" }
expected = [{ "rule" = "B014", "file" = "case.py", "start" = 21, "end" = 43 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 25 }, { "rule" = "F821", "file" = "case.py", "start" = 33, "end" = 36 }]

[[cases]]
name = "qualified-spacing"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept (pkg . Error, pkg.Error):\n    pass\n" }
expected = [{ "rule" = "B014", "file" = "case.py", "start" = 21, "end" = 45 }, { "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 25 }, { "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 38 }]

[[cases]]
name = "different-qualifier"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept (pkg.Error, other.Error):\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 25 }, { "rule" = "F821", "file" = "case.py", "start" = 33, "end" = 38 }]

[[cases]]
name = "calls"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept (error(), error()):\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 22, "end" = 27 }, { "rule" = "F821", "file" = "case.py", "start" = 31, "end" = 36 }]

[[cases]]
name = "nested-tuple"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept ((ValueError,), (ValueError,)):\n    pass\n" }
expected = [{ "rule" = "B030", "file" = "case.py", "start" = 22, "end" = 35 }, { "rule" = "B030", "file" = "case.py", "start" = 37, "end" = 50 }]

[[cases]]
name = "separate"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept ValueError:\n    pass\nexcept ValueError:\n    pass\n" }
expected = [{ "rule" = "B025", "file" = "case.py", "start" = 49, "end" = 59 }]

[[cases]]
name = "group"
comparison = "full"
files = { "case.py" = "try:\n    pass\nexcept* (ValueError, ValueError):\n    pass\n" }
expected = [{ "rule" = "B014", "file" = "case.py", "start" = 22, "end" = 46 }, { "rule" = "invalid-syntax", "file" = "case.py", "start" = 20, "end" = 21 }]

