[[cases]]
name = "nonconstant-tuple-repeat"
comparison = "full"
files = { "case.py" = "values = {(name, 1): 1, (name, 1): 2}\n" }
expected = [{ "rule" = "F601", "file" = "case.py", "start" = 24, "end" = 33 }, { "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 15 }, { "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 29 }]

[[cases]]
name = "fstring-repeat"
comparison = "full"
files = { "case.py" = "values = {f\"{x}\": 1, f\"{x}\": 2}\n" }
expected = [{ "rule" = "F601", "file" = "case.py", "start" = 21, "end" = 27 }, { "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 14 }, { "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 25 }]

[[cases]]
name = "signed-repeat"
comparison = "full"
files = { "case.py" = "values = {-1: 1, -1.0: 2}\n" }
