[[cases]]
name = "hasattr"
comparison = "full"
files = { "case.py" = "hasattr(obj, \"__call__\")\n" }
expected = [{ "rule" = "B004", "file" = "case.py", "start" = 0, "end" = 24 }, { "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 11 }]

[[cases]]
name = "getattr"
comparison = "full"
files = { "case.py" = "getattr(obj, \"__call__\")\n" }
expected = [{ "rule" = "B004", "file" = "case.py", "start" = 0, "end" = 24 }, { "rule" = "B009", "file" = "case.py", "start" = 0, "end" = 24 }, { "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 11 }]

