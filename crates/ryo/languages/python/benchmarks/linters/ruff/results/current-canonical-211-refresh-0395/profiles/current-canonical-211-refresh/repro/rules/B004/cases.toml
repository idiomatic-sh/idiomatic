[[cases]]
name = "bytes"
comparison = "full"
files = { "case.py" = "hasattr(obj, b\"__call__\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 11 }]

[[cases]]
name = "concatenated"
comparison = "full"
files = { "case.py" = "hasattr(obj, \"__\" \"call__\")\n" }
expected = [{ "rule" = "B004", "file" = "case.py", "start" = 0, "end" = 27 }, { "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 11 }]

[[cases]]
name = "shadowed"
comparison = "full"
files = { "case.py" = "def f(hasattr):\n    hasattr(obj, \"__call__\")\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 28, "end" = 31 }]

[[cases]]
name = "alias"
comparison = "full"
files = { "case.py" = "from builtins import hasattr as check\ncheck(obj, \"__call__\")\n" }
expected = [{ "rule" = "B004", "file" = "case.py", "start" = 38, "end" = 60 }, { "rule" = "F821", "file" = "case.py", "start" = 44, "end" = 47 }]

[[cases]]
name = "qualified"
comparison = "full"
files = { "case.py" = "import builtins\nbuiltins.getattr(obj, \"__call__\")\n" }
expected = [{ "rule" = "B004", "file" = "case.py", "start" = 16, "end" = 49 }, { "rule" = "B009", "file" = "case.py", "start" = 16, "end" = 49 }, { "rule" = "F821", "file" = "case.py", "start" = 33, "end" = 36 }]

[[cases]]
name = "starred-first"
comparison = "full"
files = { "case.py" = "hasattr(*items, \"__call__\")\n" }
expected = [{ "rule" = "B004", "file" = "case.py", "start" = 0, "end" = 27 }, { "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 14 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "hasattr(obj, \"__call__\") # noqa: B004\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 11 }]

[[cases]]
name = "argument-rank-skips-punctuation-and-trivia"
comparison = "full"
files = { "case.py" = "hasattr( # comment before first argument\n    obj, # comment before second argument\n    \"__call__\",\n)\n" }
expected = [{ "rule" = "B004", "file" = "case.py", "start" = 0, "end" = 100 }, { "rule" = "F821", "file" = "case.py", "start" = 45, "end" = 48 }]

[[cases]]
name = "quoted-annotation-decoded-literal"
comparison = "full"
files = { "case.py" = "x: 'hasattr(obj, \"__call__\")'\n" }
expected = [{ "rule" = "B004", "file" = "case.py", "start" = 4, "end" = 28 }, { "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 15 }]
