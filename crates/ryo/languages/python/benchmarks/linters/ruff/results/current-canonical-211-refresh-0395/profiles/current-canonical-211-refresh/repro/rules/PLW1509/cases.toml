name = "preexec-alias"
comparison = "full"
files = { "case.py" = "import subprocess as sp\nsp.Popen([], preexec_fn=prepare)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 48, "end" = 55 }, { "rule" = "PLW1509", "file" = "case.py", "start" = 37, "end" = 55 }]

