[[cases]]
name = "preexec-value"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess.Popen([], preexec_fn=prepare)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 50, "end" = 57 }, { "rule" = "PLW1509", "file" = "case.py", "start" = 39, "end" = 57 }]

