[[cases]]
name = "increment"
comparison = "full"
files = { "case.py" = "x = ++value\n" }
expected = [{ "rule" = "B002", "file" = "case.py", "start" = 4, "end" = 11 }, { "rule" = "F821", "file" = "case.py", "start" = 6, "end" = 11 }]

[[cases]]
name = "decrement"
comparison = "full"
files = { "case.py" = "x = --value\n" }
