[[cases]]
name = "parenthesized"
comparison = "full"
files = { "case.py" = "x = +(+value)\n" }
expected = [{ "rule" = "B002", "file" = "case.py", "start" = 4, "end" = 13 }, { "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 12 }]

[[cases]]
name = "single"
comparison = "full"
