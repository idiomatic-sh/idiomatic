[[cases]]
name = "direct-module"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess.run([\"cmd\"], universal_newlines=True)\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 18, "end" = 32 }, { "rule" = "UP021", "file" = "case.py", "start" = 42, "end" = 60 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import subprocess as sp\nsp.run([], universal_newlines=False)\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 24, "end" = 30 }, { "rule" = "UP021", "file" = "case.py", "start" = 35, "end" = 53 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from subprocess import run\nrun([], universal_newlines=True)\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 27, "end" = 30 }, { "rule" = "UP021", "file" = "case.py", "start" = 35, "end" = 53 }]

[[cases]]
name = "from-alias"
comparison = "full"
files = { "case.py" = "from subprocess import run as execute\nexecute([], universal_newlines=True)\n" }
expected = [{ "rule" = "PLW1510", "file" = "case.py", "start" = 38, "end" = 45 }, { "rule" = "UP021", "file" = "case.py", "start" = 50, "end" = 68 }]

[[cases]]
