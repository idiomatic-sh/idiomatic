[[cases]]
name = "upstream"
comparison = "full"
files = { "case.py" = "from contextvars import ContextVar\nfrom types import MappingProxyType\nimport re\nimport collections\nimport time\n\n# Okay\nContextVar(\"cv\")\nContextVar(\"cv\", default=())\nContextVar(\"cv\", default=(1, 2, 3))\nContextVar(\"cv\", default=\"foo\")\nContextVar(\"cv\", default=tuple())\nContextVar(\"cv\", default=frozenset())\nContextVar(\"cv\", default=MappingProxyType({}))\nContextVar(\"cv\", default=re.compile(\"foo\"))\nContextVar(\"cv\", default=float(1))\nContextVar(\"cv\", default=frozenset[str]())\nContextVar[frozenset[str]](\"cv\", default=frozenset[str]())\n\n# Bad\nContextVar(\"cv\", default=[])\nContextVar(\"cv\", default={})\nContextVar(\"cv\", default=list())\nContextVar(\"cv\", default=set())\nContextVar(\"cv\", default=dict())\nContextVar(\"cv\", default=[char for char in \"foo\"])\nContextVar(\"cv\", default={char for char in \"foo\"})\nContextVar(\"cv\", default={char: idx for idx, char in enumerate(\"foo\")})\nContextVar(\"cv\", default=collections.deque())\nContextVar(\"cv\", default=set[str]())\nContextVar[set[str]](\"cv\", default=set[str]())\n\ndef bar() -> list[int]:\n    return [1, 2, 3]\n\nContextVar(\"cv\", default=bar())\nContextVar(\"cv\", default=time.time())\n\ndef baz(): ...\nContextVar(\"cv\", default=baz())\n" }
expected = [{ "rule" = "B039", "file" = "case.py", "start" = 565, "end" = 567 }, { "rule" = "B039", "file" = "case.py", "start" = 594, "end" = 596 }, { "rule" = "B039", "file" = "case.py", "start" = 623, "end" = 629 }, { "rule" = "B039", "file" = "case.py", "start" = 656, "end" = 661 }, { "rule" = "B039", "file" = "case.py", "start" = 688, "end" = 694 }, { "rule" = "B039", "file" = "case.py", "start" = 721, "end" = 745 }, { "rule" = "B039", "file" = "case.py", "start" = 772, "end" = 796 }, { "rule" = "B039", "file" = "case.py", "start" = 823, "end" = 868 }, { "rule" = "B039", "file" = "case.py", "start" = 895, "end" = 914 }, { "rule" = "B039", "file" = "case.py", "start" = 941, "end" = 951 }, { "rule" = "B039", "file" = "case.py", "start" = 988, "end" = 998 }, { "rule" = "B039", "file" = "case.py", "start" = 1072, "end" = 1077 }, { "rule" = "B039", "file" = "case.py", "start" = 1104, "end" = 1115 }, { "rule" = "B039", "file" = "case.py", "start" = 1158, "end" = 1163 }, { "rule" = "C408", "file" = "case.py", "start" = 258, "end" = 265 }, { "rule" = "C408", "file" = "case.py", "start" = 623, "end" = 629 }, { "rule" = "C408", "file" = "case.py", "start" = 688, "end" = 694 }]

