[[cases]]
name = "same-name-in-function"
comparison = "full"
files = { "case.py" = "def f(value):\n    return value == value\n" }
expected = [{ "rule" = "PLR0124", "file" = "case.py", "start" = 25, "end" = 30 }]

[[cases]]
name = "same-name-in-conditional-arm"
