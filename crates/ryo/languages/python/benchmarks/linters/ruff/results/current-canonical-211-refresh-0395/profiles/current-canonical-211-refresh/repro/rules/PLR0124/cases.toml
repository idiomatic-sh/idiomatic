[[cases]]
name = "same-name-equality"
comparison = "full"
files = { "case.py" = "foo == foo\n" }
expected = [{ "rule" = "B015", "file" = "case.py", "start" = 0, "end" = 10 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 3 }, { "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 10 }, { "rule" = "PLR0124", "file" = "case.py", "start" = 0, "end" = 3 }]

[[cases]]
name = "same-name-membership"
comparison = "full"
files = { "case.py" = "value in value\n" }
expected = [{ "rule" = "B015", "file" = "case.py", "start" = 0, "end" = 14 }, { "rule" = "F821", "file" = "case.py", "start" = 0, "end" = 5 }, { "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 14 }, { "rule" = "PLR0124", "file" = "case.py", "start" = 0, "end" = 5 }]

