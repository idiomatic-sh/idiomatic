[[cases]]
name = "decimal"
comparison = "full"
files = { "case.py" = "from decimal import Decimal\nDecimal(1.5)\n" }
expected = [{ "rule" = "RUF032", "file" = "case.py", "start" = 36, "end" = 39 }]

[[cases]]
name = "signed"
comparison = "full"
files = { "case.py" = "from decimal import Decimal\nDecimal(-+-1.5)\n" }
expected = [{ "rule" = "RUF032", "file" = "case.py", "start" = 36, "end" = 42 }]

