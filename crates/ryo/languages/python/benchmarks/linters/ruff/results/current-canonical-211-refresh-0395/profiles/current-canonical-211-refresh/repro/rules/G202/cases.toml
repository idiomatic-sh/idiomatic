files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    async def inner():\n        logging.exception(\"x\", exc_info=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "LOG015", "file" = "case.py", "start" = 80, "end" = 117 }]

[[cases]]
