[[cases]]
name = "exception-true"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    logging.exception(\"x\", exc_info=True)\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "G202", "file" = "case.py", "start" = 76, "end" = 89 }, { "rule" = "LOG015", "file" = "case.py", "start" = 53, "end" = 90 }]

[[cases]]
name = "exception-sys-exc-info"
comparison = "full"
files = { "case.py" = "import logging\nimport sys\ntry:\n    work()\nexcept Exception:\n    logging.exception(\"x\", exc_info=sys.exc_info())\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 35, "end" = 39 }, { "rule" = "G202", "file" = "case.py", "start" = 87, "end" = 110 }, { "rule" = "LOG015", "file" = "case.py", "start" = 64, "end" = 111 }]

[[cases]]
name = "exception-false"
