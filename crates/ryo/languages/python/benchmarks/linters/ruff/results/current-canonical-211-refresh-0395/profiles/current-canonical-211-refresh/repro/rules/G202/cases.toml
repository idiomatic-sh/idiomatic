expected = [{ "rule" = "F821", "file" = "case.py", "start" = 24, "end" = 28 }, { "rule" = "LOG015", "file" = "case.py", "start" = 53, "end" = 91 }]

[[cases]]
name = "async-function-inside-handler-is-outside-handler-context"
