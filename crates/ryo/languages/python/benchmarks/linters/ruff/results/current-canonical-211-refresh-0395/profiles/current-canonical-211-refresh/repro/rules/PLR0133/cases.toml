[[cases]]
name = "numbers"
comparison = "full"
files = { "case.py" = "value = 1 < 2\n" }
expected = [{ "rule" = "PLR0133", "file" = "case.py", "start" = 8, "end" = 9 }]

[[cases]]
name = "strings"
comparison = "full"
files = { "case.py" = "value = \"a\" == \"b\"\n" }
expected = [{ "rule" = "PLR0133", "file" = "case.py", "start" = 8, "end" = 11 }]

[[cases]]
name = "chain"
comparison = "full"
files = { "case.py" = "value = 1 < 2 < 3\n" }
expected = [{ "rule" = "PLR0133", "file" = "case.py", "start" = 8, "end" = 9 }, { "rule" = "PLR0133", "file" = "case.py", "start" = 12, "end" = 13 }]

[[cases]]
name = "separated"
comparison = "full"
files = { "case.py" = "value = 1 < x < 2\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 13 }]

[[cases]]
name = "trailing"
comparison = "full"
files = { "case.py" = "value = x < 1 < 2\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 9 }, { "rule" = "PLR0133", "file" = "case.py", "start" = 12, "end" = 13 }]

[[cases]]
name = "negative"
comparison = "full"
files = { "case.py" = "value = -1 < 2\n" }
expected = []

[[cases]]
name = "bool"
comparison = "full"
files = { "case.py" = "value = True is None\n" }
expected = [{ "rule" = "PLR0133", "file" = "case.py", "start" = 8, "end" = 12 }]

[[cases]]
name = "fstr"
comparison = "full"
files = { "case.py" = "value = f\"a\" == \"b\"\n" }
expected = [{ "rule" = "F541", "file" = "case.py", "start" = 8, "end" = 12 }]

[[cases]]
name = "paren"
comparison = "full"
files = { "case.py" = "value = (1) < (2)\n" }
expected = [{ "rule" = "PLR0133", "file" = "case.py", "start" = 9, "end" = 10 }]

[[cases]]
name = "list"
comparison = "full"
files = { "case.py" = "value = [1] == [2]\n" }
expected = []

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "value = 1 < 2 # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
comparison = "full"
files = { "case.py" = "value = 1 < 2 # noqa: PLR0133\n" }
expected = []

[[cases]]
name = "other-code"
comparison = "full"
files = { "case.py" = "value = 1 < 2 # noqa: F401\n" }
expected = [{ "rule" = "PLR0133", "file" = "case.py", "start" = 8, "end" = 9 }]

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa\nvalue = 1 < 2\n" }
expected = []

[[cases]]
name = "shared-block-suppressed"
comparison = "full"
files = { "case.py" = "# ruff: disable[PLR0133]\nvalue = 1 < 2\n\n# ruff: enable[PLR0133]\n" }
expected = []

[[cases]]
name = "shared-block-reenabled"
comparison = "full"
files = { "case.py" = "# ruff: disable[PLR0133]\n# ruff: enable[PLR0133]\nvalue = 1 < 2\n" }
expected = [{ "rule" = "PLR0133", "file" = "case.py", "start" = 57, "end" = 58 }]

[[cases]]
name = "shared-block-unmatched-disable"
comparison = "full"
files = { "case.py" = "# ruff: disable[PLR0133]\nvalue = 1 < 2\n" }
expected = []

[[cases]]
name = "shared-block-wrong-code"
comparison = "full"
files = { "case.py" = "# ruff: disable[E501]\nvalue = 1 < 2\n" }
expected = [{ "rule" = "PLR0133", "file" = "case.py", "start" = 30, "end" = 31 }]

[[cases]]
name = "shared-file-ignore"
comparison = "full"
files = { "case.py" = "# ruff: file-ignore[PLR0133]\nvalue = 1 < 2\n" }
