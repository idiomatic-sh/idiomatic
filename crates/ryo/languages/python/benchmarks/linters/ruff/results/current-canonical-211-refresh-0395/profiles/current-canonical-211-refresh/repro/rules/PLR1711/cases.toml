[[cases]]
name = "bare"
comparison = "full"
files = { "case.py" = "def f():\n    work()\n    return\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 17 }, { "rule" = "PLR1711", "file" = "case.py", "start" = 24, "end" = 30 }]

[[cases]]
name = "async-function-bare-return"
comparison = "full"
files = { "case.py" = "async def f():\n    work()\n    return\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 19, "end" = 23 }, { "rule" = "PLR1711", "file" = "case.py", "start" = 30, "end" = 36 }]

