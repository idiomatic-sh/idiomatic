[[cases]]
name = "tuple"
comparison = "full"
files = { "case.py" = "a, a = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 13 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 3, "end" = 4 }]

[[cases]]
name = "list"
comparison = "full"
files = { "case.py" = "[a, a] = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 15 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 4, "end" = 5 }]

[[cases]]
name = "nested"
comparison = "full"
files = { "case.py" = "a, [b, (a, b)] = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 17, "end" = 23 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 8, "end" = 9 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 11, "end" = 12 }]

[[cases]]
name = "starred"
comparison = "full"
files = { "case.py" = "a, *a = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 14 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 4, "end" = 5 }]

[[cases]]
name = "chained"
comparison = "full"
files = { "case.py" = "a = a = value\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 8, "end" = 13 }, { "rule" = "PLW0127", "file" = "case.py", "start" = 0, "end" = 1 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 4, "end" = 5 }]

[[cases]]
name = "unique"
comparison = "full"
files = { "case.py" = "a, b = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 13 }]

[[cases]]
name = "dummy"
comparison = "full"
files = { "case.py" = "_, _ignore, _, _ignore = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 25, "end" = 31 }]

[[cases]]
name = "trailing-underscore"
comparison = "full"
files = { "case.py" = "_a_, _a_ = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 17 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 5, "end" = 8 }]

[[cases]]
name = "unicode"
comparison = "full"
files = { "case.py" = "α, α = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 15 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 4, "end" = 6 }]

[[cases]]
name = "attribute"
comparison = "full"
files = { "case.py" = "a, obj.a = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 6 }, { "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 17 }]

[[cases]]
name = "subscript"
comparison = "full"
files = { "case.py" = "a, data[a] = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 3, "end" = 7 }, { "rule" = "F821", "file" = "case.py", "start" = 13, "end" = 19 }]

[[cases]]
name = "separate"
comparison = "full"
files = { "case.py" = "a = 1\na = 2\n" }
expected = []

[[cases]]
name = "loop"
comparison = "full"
files = { "case.py" = "for a, a in values:\n    pass\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 12, "end" = 18 }]

[[cases]]
name = "annotated"
comparison = "full"
files = { "case.py" = "a: int = a\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 9, "end" = 10 }, { "rule" = "PLW0127", "file" = "case.py", "start" = 0, "end" = 1 }]

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "a, a = values # noqa: PLW0128\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 7, "end" = 13 }]

[[cases]]
name = "three"
comparison = "full"
files = { "case.py" = "a, a, a = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 10, "end" = 16 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 3, "end" = 4 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 6, "end" = 7 }]

[[cases]]
name = "nfkc-semantic-identifier"
comparison = "full"
files = { "case.py" = "(x, ｘ) = values\n" }
expected = [{ "rule" = "F821", "file" = "case.py", "start" = 11, "end" = 17 }, { "rule" = "PLW0128", "file" = "case.py", "start" = 4, "end" = 7 }]
