[[cases]]
name = "spaces"
comparison = "full"
files = { "case.py" = "   #!/usr/bin/python3\npass\n" }
expected = [{ rule = "EXE004", file = "case.py", start = 0, end = 3 }]

[[cases]]
name = "tab"
comparison = "full"
files = { "case.py" = "\t#!/usr/bin/python3\n" }
expected = [{ rule = "EXE004", file = "case.py", start = 0, end = 1 }]

[[cases]]
name = "newline"
comparison = "full"
files = { "case.py" = "\n#!/usr/bin/python3\n" }
expected = [{ rule = "EXE004", file = "case.py", start = 0, end = 1 }]

[[cases]]
name = "mixed"
comparison = "full"
files = { "case.py" = " \t\f\r\n\t#!/usr/bin/env python\n" }
expected = [{ rule = "EXE004", file = "case.py", start = 0, end = 6 }]

