expected = [{ rule = "PLE2512", file = "case.py", start = 6, end = 7 }]

[[cases]]
name = "written-escape"
comparison = "full"
files = { "case.py" = "x = \"A\\x1aB\"\n" }
expected = []

[[cases]]
name = "comment-only"
comparison = "full"
files = { "case.py" = "# \u001a\nx = \"safe\"\n" }
expected = []

[[cases]]
name = "f-string-middle"
comparison = "full"
files = { "case.py" = "x = f\"A\u001aB\"\n" }
expected = [{ rule = "PLE2512", file = "case.py", start = 7, end = 8 }]

[[cases]]
name = "two-occurrences-one-token"
comparison = "full"
files = { "case.py" = "x = \"A\u001aB\u001a\"\n" }
