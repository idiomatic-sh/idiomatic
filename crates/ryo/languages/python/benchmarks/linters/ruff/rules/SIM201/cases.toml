[[cases]]
name = "statement-exception-check-and-comparison-dunder-scope"
comparison = "full"
files = { "case.py" = "class Buffer:\n    def __init__(self, x, allow_copy, values, assume_unique):\n        if x.strides[0] and not x.strides == (x.dtype.itemsize,):\n            x = x.copy()\n        if not assume_unique and not len(values) == len(set(values)):\n            raise ValueError(\"values should be unique\")\n        if allow_copy:\n            pass\n        elif not x == values:\n            raise ValueError(\"elif test of an exception check\")\n\n    def __eq__(self, other):\n        return not self.x == other.x\n\n    def __ne__(self, other):\n        def inner():\n            return not self.x == other.x\n\n        return inner() and (lambda: not self.x == other.x)()\n\n    def __custom__(self, other):\n        return not self.x == other.x\n\n\ndef unique(values, assume_unique):\n    if not assume_unique and not len(values) == len(set(values)):\n        raise ValueError(\"values should be unique\")\n    if not len(values) == 0:\n        raise ValueError(\"direct test\")\n    if len(values) == 1:\n        raise ValueError(\"raise body\")\n    elif not len(values) == 2:\n        pass\n\n\ndef __eq__(a, b):\n    return not a == b\n" }
expected = [{ rule = "SIM201", file = "case.py", start = 104, end = 140 }, { rule = "SIM201", file = "case.py", start = 346, end = 361 }, { rule = "SIM201", file = "case.py", start = 564, end = 585 }, { rule = "SIM201", file = "case.py", start = 623, end = 644 }, { rule = "SIM201", file = "case.py", start = 697, end = 718 }]
