[[cases]]
name="ruf019-tagged-RUF019-py"
comparison="full"
files={"case.py"="d = {}\n# RUF019\nif \"k\" in d and d[\"k\"]:\n    pass\n\nk = \"k\"\nif k in d and d[k]:\n    pass\n\nif (k) in d and d[k]:\n    pass\n\nif k in d and d[(k)]:\n    pass\n\nnot (\"key\" in dct and dct[\"key\"])\n\nbool(\"key\" in dct and dct[\"key\"])\n\n# OK\nv = \"k\" in d and d[\"k\"]\n\nif f() in d and d[f()]:\n    pass\n\n\nif (\n        \"key\" in d\n        and  # text\n        d [\"key\"]\n):\n    ...\n\n# https://github.com/astral-sh/ruff/issues/12953\n# F-string with non-literal interpolation — unsafe fix (may invoke __str__)\nclass Formatter:\n    def __str__(self):\n        print(\"side effect!\")\n        return \"key\"\n\nc = Formatter()\nif f\"{c}\" in d and d[f\"{c}\"]:\n    pass\n\n# F-string with only literal interpolation — safe fix\nif f\"{1}\" in d and d[f\"{1}\"]:\n    pass\n\n# Plain f-string without interpolation — safe fix\nif f\"key\" in d and d[f\"key\"]:\n    pass\n\n# Walrus operator is a side effect — should not emit\nif (k := \"key\") in d and d[(k := \"key\")]:\n    pass\n"}
expected=[{rule="RUF019", file="case.py", start=19, end=38}, {rule="RUF019", file="case.py", start=61, end=76}, {rule="RUF019", file="case.py", start=91, end=108}, {rule="RUF019", file="case.py", start=123, end=140}, {rule="RUF019", file="case.py", start=157, end=184}, {rule="RUF019", file="case.py", start=192, end=219}, {rule="RUF019", file="case.py", start=300, end=348}, {rule="RUF019", file="case.py", start=599, end=624}, {rule="RUF019", file="case.py", start=695, end=720}, {rule="RUF019", file="case.py", start=787, end=812}]

