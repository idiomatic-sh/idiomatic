# Pinned Ruff 0.16.5 fixture is reproduced verbatim in upstream-RUF068.

[[cases]]
name = "upstream-RUF068"
files = { "RUF068.py" = "import typing\n\n\nclass A: ...\n\n\nclass B: ...\n\n\n# Good\n__all__ = \"A\" + \"B\"\n__all__: list[str] = [\"A\", \"B\"]\n__all__: typing.Any = (\"A\", \"B\")\n__all__ = [\"A\", \"B\"]\n__all__ = [A, \"B\", \"B\"]\n__all__ += [\"A\", \"B\"]\n__all__.extend([\"A\", \"B\"])\n\n# Bad\n__all__: list[str] = [\"A\", \"B\", \"A\"]\n__all__: typing.Any = (\"A\", \"B\", \"B\")\n__all__ = [\"A\", \"B\", \"A\"]\n__all__ = [\"A\", \"A\", \"B\", \"B\"]\n__all__ = [\n    \"A\",\n    \"A\",\n    \"B\",\n    \"B\"\n]\n__all__ += [\"B\", \"B\"]\n__all__.extend([\"B\", \"B\"])\n\n# Bad, unsafe\n__all__ = [\n    \"A\",\n    \"A\",\n    \"B\",\n    # Comment\n    \"B\",  # 2\n    # 3\n]\n" }
expected = [{ rule = "RUF068", file = "RUF068.py", start = 178, end = 181 }, { rule = "RUF068", file = "RUF068.py", start = 271, end = 274 }, { rule = "RUF068", file = "RUF068.py", start = 309, end = 312 }, { rule = "RUF068", file = "RUF068.py", start = 335, end = 338 }, { rule = "RUF068", file = "RUF068.py", start = 356, end = 359 }, { rule = "RUF068", file = "RUF068.py", start = 366, end = 369 }, { rule = "RUF068", file = "RUF068.py", start = 396, end = 399 }, { rule = "RUF068", file = "RUF068.py", start = 414, end = 417 }, { rule = "RUF068", file = "RUF068.py", start = 437, end = 440 }, { rule = "RUF068", file = "RUF068.py", start = 463, end = 466 }, { rule = "RUF068", file = "RUF068.py", start = 509, end = 512 }, { rule = "RUF068", file = "RUF068.py", start = 541, end = 544 }]

