ins(filename: str, extension: str) -> None:\n    from builtins import len as builtins_len\n\n    return filename[:-builtins_len(extension)] if filename.endswith(extension) else filename\n\ndef okay_steps():\n    text = \"!x!y!z\"\n    if text.startswith(\"!\"):\n        text = text[1::1]\n    if text.startswith(\"!\"):\n        text = text[1::True]\n    if text.startswith(\"!\"):\n        text = text[1::None]\n    print(text)\n\n\n# this should be skipped\ndef ignore_step():\n    text = \"!x!y!z\"\n    if text.startswith(\"!\"):\n        text = text[1::2]\n    print(text)\n\ndef handle_unicode():\n    # should be skipped!\n    text = \"řetězec\"\n    if text.startswith(\"ř\"): \n        text = text[2:]\n\n    # should be linted\n    # with fix `text = text.removeprefix(\"ř\")`\n    text = \"řetězec\"\n    if text.startswith(\"ř\"): \n        text = text[1:]\n\n\ndef handle_surrogates():\n    # should be linted\n    text = \"\\ud800\\udc00heythere\"\n    if text.startswith(\"\\ud800\\udc00\"):\n        text = text[2:]\n    text = \"\\U00010000heythere\"\n    if text.startswith(\"\\U00010000\"):\n        text = text[1:]\n    \n    # should not be linted\n    text = \"\\ud800\\udc00heythere\"\n    if text.startswith(\"\\ud800\\udc00\"):\n        text = text[1:]\n\n# Regression test for\n# https://github.com/astral-sh/ruff/issues/16231\ndef func():\n    a = \"sjdfaskldjfakljklfoo\"\n    if a.endswith(\"foo\"):\n        a = a[: -len(\"foo\")]\n    print(a)\n\n\ndef example(filename: str, text: str):\n    filename = (\n        filename[:-4]  # text\n        if filename.endswith(\".txt\")  # text\n        else filename\n    )\n\n" }
