har}\")\n\n\n# OK\n\ndef _():\n    for line in lines:\n        Path(\"file\").open(\"w\").write(line)\n\n\ndef _():\n    with Path(\"file\").open(\"w\") as f:\n        for line in lines:\n            pass\n\n            f.write(line)\n\n\ndef _():\n    with Path(\"file\").open(\"w\") as f:\n        for line in lines:\n            f.write(line)\n        else:\n            pass\n\n\nasync def func():\n    with Path(\"file\").open(\"w\") as f:\n        async for line in lines:  # type: ignore\n            f.write(line)\n\n\ndef _():\n    with Path(\"file\").open(\"w\") as f:\n        for line in lines:\n            f.write()  # type: ignore\n\n\ndef _():\n    with open(\"file\", \"w\") as f:\n        global CURRENT_LINE\n        for CURRENT_LINE in lines:\n            f.write(CURRENT_LINE)\n\n\ndef _():\n    foo = 1\n    def __():\n        with open(\"file\", \"w\") as f:\n            nonlocal foo\n            for foo in lines:\n                f.write(foo)\n\n\ndef _():\n    with open(\"file\", \"w\") as f:\n        line = ''\n        for line in lines:\n            f.write(line)\n\n\ndef _():\n    with open(\"file\", \"w\") as f:\n        for a, b, c in d:\n            f.write((a, b))\n        print(a)\n\n\ndef _():\n    with open(\"file\", \"w\") as f:\n        for [*[*a]], b, [[c]] in d:\n            f.write((a, b))\n        print(c)\n\n\ndef _():\n    with open(\"file\", \"w\") as f:\n        global global_foo\n        for [a, b, (global_foo, c)] in d:\n            f.write((a, b))\n\n\n# Test cases for lambda and ternary expressions - https://github.com/astral-sh/ruff/issues/18590\n\ndef _():\n    with Path(\"file.txt\").open(\"w\", encoding=\"utf-8\") as f:\n        for l in lambda: 0:\n            f.write(f\"[{l}]\")\n\n\ndef _():\n    with Path(\"file.txt\").open(\"w\", encoding=\"utf-8\") as f:\n        for l in (1,) if True else (2,):\n            f.write(f\"[{l}]\")\n\n\n# don't need to add parentheses when making a function argument\ndef _():\n    with open