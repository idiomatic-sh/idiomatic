[[cases]]
name = "literal-last"
comparison = "full"
files = { "case.py" = "x or True\n" }
expected = [] # removed because the truthy/falsy operand is the final value

[[cases]]
name = "literal-first"
comparison = "full"
files = { "case.py" = "True or x\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 0, end = 9 }]

[[cases]]
name = "safe-opposite"
comparison = "full"
files = { "case.py" = "x or False\n" }
expected = []

[[cases]]
name = "literal-middle"
comparison = "full"
files = { "case.py" = "x or 1 or y\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 5, end = 11 }]

# Added oracle cases: Ruff 0.16.5, upstream tag commit 9e4938c4a60bed3e87a11ee1e1db1bd23f4d964a.

[[cases]]
name = "unicode-prefix"
comparison = "full"
files = { "case.py" = "é or 1 or y\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 6, end = 12 }]

[[cases]]
name = "multiline-suffix"
comparison = "full"
files = { "case.py" = "(\n    x\n    or 1\n    or y\n)\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 15, end = 25 }]

[[cases]]
name = "multiple-matching-literals"
comparison = "full"
files = { "case.py" = "x or 1 or True or y\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 5, end = 19 }]

[[cases]]
name = "known-literal-prefix"
comparison = "full"
files = { "case.py" = "False or True or x\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 0, end = 18 }]

[[cases]]
name = "terminal-known-prefix"
comparison = "full"
files = { "case.py" = "False or True\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 0, end = 13 }]

[[cases]]
# Known limitation: parenthesized_range includes opening parentheses outside the semantic AST operand span.
name = "parenthesized-start"
comparison = "full"
files = { "case.py" = "(x or (True) or y)\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 6, end = 17 }]

[[cases]]
# Known limitation: the query does not yet apply the boolean-test context/effect policy; AST ancestry makes context expressible.
name = "boolean-test-context"
comparison = "full"
files = { "case.py" = "if x or True:\n    pass\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 3, end = 12 }]

[[cases]]
name = "suffix-line-suppression"
comparison = "full"
files = { "case.py" = "(\n    x\n    or 1  # noqa: SIM222\n    or y\n)\n" }
expected = []

[[cases]]
name = "earlier-line-suppression"
comparison = "full"
files = { "case.py" = "(\n    x  # noqa: SIM222\n    or 1\n    or y\n)\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 31, end = 41 }]

[[cases]]
name = "test-opposite"
comparison = "full"
files = { "case.py" = "if x or False:\n    pass\n" }
expected = []

[[cases]]
name = "test-known-prefix"
comparison = "full"
files = { "case.py" = "if False or True:\n    pass\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 3, end = 16 }]

[[cases]]
name = "test-parenthesized-literal"
comparison = "full"
files = { "case.py" = "if x or (True):\n    pass\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 3, end = 14 }]

[[cases]]
name = "test-nonterminal-literal"
comparison = "full"
files = { "case.py" = "if x or True or y:\n    pass\n" }
expected = [{ rule = "SIM222", file = "case.py", start = 3, end = 17 }]
