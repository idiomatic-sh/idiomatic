[[cases]]
name = "policy-tagged-flake8_pie-PIE804.py"
comparison = "full"
files = { "case.py" = "foo(**{\"bar\": True})  # PIE804\n\nfoo(**{\"r2d2\": True})  # PIE804\n\nFoo.objects.create(**{\"bar\": True})  # PIE804\n\nFoo.objects.create(**{\"_id\": some_id})  # PIE804\n\nFoo.objects.create(**{**bar})  # PIE804\n\nfoo(**{})\n\nfoo(**{**data, \"foo\": \"buzz\"})\nfoo(**buzz)\nfoo(**{\"bar-foo\": True})\nfoo(**{\"bar foo\": True})\nfoo(**{\"1foo\": True})\nfoo(**{buzz: True})\nfoo(**{\"\": True})\nfoo(**{f\"buzz__{bar}\": True})\nabc(**{\"for\": 3})\nfoo(**{},)\n\n# Duplicated key names won't be fixed, to avoid syntax errors.\nabc(**{'a': b}, **{'a': c})  # PIE804\nabc(a=1, **{'a': c}, **{'b': c})  # PIE804\n\n# Some values need to be parenthesized.\ndef foo():\n    abc(foo=1, **{'bar': (bar := 1)})  # PIE804\n    abc(foo=1, **{'bar': (yield 1)})  # PIE804\n\n# https://github.com/astral-sh/ruff/issues/18036\n# The autofix for this is unsafe due to the comments inside the dictionary.\nfoo(\n    **{\n        # Comment 1\n        \"x\": 1.0,\n        # Comment 2\n        \"y\": 2.0,\n    }\n)\n" }
expected = [{ "rule" = "PIE804", "file" = "case.py", "start" = 4, "end" = 19 }, { "rule" = "PIE804", "file" = "case.py", "start" = 36, "end" = 52 }, { "rule" = "PIE804", "file" = "case.py", "start" = 84, "end" = 99 }, { "rule" = "PIE804", "file" = "case.py", "start" = 131, "end" = 149 }, { "rule" = "PIE804", "file" = "case.py", "start" = 181, "end" = 190 }, { "rule" = "PIE804", "file" = "case.py", "start" = 207, "end" = 211 }, { "rule" = "PIE804", "file" = "case.py", "start" = 419, "end" = 423 }, { "rule" = "PIE804", "file" = "case.py", "start" = 494, "end" = 504 }, { "rule" = "PIE804", "file" = "case.py", "start" = 506, "end" = 516 }, { "rule" = "PIE804", "file" = "case.py", "start" = 537, "end" = 547 }, { "rule" = "PIE804", "file" = "case.py", "start" = 549, "end" = 559 }, { "rule" = "PIE804", "file" = "case.py", "start" = 638, "end" = 659 }, { "rule" = "PIE804", "file" = "case.py", "start" = 686, "end" = 706 }, { "rule" = "PIE804", "file" = "case.py", "start" = 853, "end" = 938 }]
