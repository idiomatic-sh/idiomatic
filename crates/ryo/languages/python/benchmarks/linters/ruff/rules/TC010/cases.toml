[[cases]]
name = "upstream-TC010_1.py-py313"
files = { "TC010_1.py" = "from __future__ import annotations\n\nfrom typing import TypeVar\n\n\nx: \"int\" | str  # TC010\nx: (\"int\" | str) | \"bool\"  # TC010\n\n\ndef func():\n    x: \"int\" | str  # OK\n\n\nz: list[str, str | \"int\"] = []  # TC010\n\ntype A = Value[\"int\" | str]  # OK\n\nOldS = TypeVar('OldS', int | 'str', str)  # TC010\n" }
expected = [{ rule = "TC010", file = "TC010_1.py", start = 270, end = 275 }]

[[cases]]
name = "upstream-TC010_2.py-py313"
files = { "TC010_2.py" = "from typing import TypeVar\n\n\nx: \"int\" | str  # TC010\nx: (\"int\" | str) | \"bool\"  # TC010\n\n\ndef func():\n    x: \"int\" | str  # OK\n\n\nz: list[str, str | \"int\"] = []  # TC010\n\ntype A = Value[\"int\" | str]  # OK\n\nOldS = TypeVar('OldS', int | 'str', str)  # TC010\n" }
expected = [{ rule = "TC010", file = "TC010_2.py", start = 32, end = 37 }, { rule = "TC010", file = "TC010_2.py", start = 57, end = 62 }, { rule = "TC010", file = "TC010_2.py", start = 72, end = 78 }, { rule = "TC010", file = "TC010_2.py", start = 148, end = 153 }, { rule = "TC010", file = "TC010_2.py", start = 234, end = 239 }]

