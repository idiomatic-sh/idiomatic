# Complete Ruff 0.16.5 fixture from
# https://github.com/astral-sh/ruff/blob/0.16.5/crates/ruff_linter/resources/test/fixtures/ruff/RUF010.py
[[cases]]
name = "pinned-ruff-0-16-5"
comparison = "full"
files = { "case.py" = '''bla = b"bla"
d = {"a": b"bla", "b": b"bla", "c": b"bla"}


def foo(one_arg):
    pass


f"{str(bla)}, {repr(bla)}, {ascii(bla)}"  # RUF010

f"{str(d['a'])}, {repr(d['b'])}, {ascii(d['c'])}"  # RUF010

f"{(str(bla))}, {(repr(bla))}, {(ascii(bla))}"  # RUF010

f"{bla!s}, {(repr(bla))}, {(ascii(bla))}"  # RUF010

f"{foo(bla)}"  # OK

f"{str(bla, 'ascii')}, {str(bla, encoding='cp1255')}"  # OK

f"{bla!s} {[]!r} {'bar'!a}"  # OK

"Not an f-string {str(bla)}, {repr(bla)}, {ascii(bla)}"  # OK


def ascii_shadowing():
    def ascii(arg):
        pass

    f"{ascii(bla)}"  # OK

(
    f"Member of tuple mismatches type at index {i}. Expected {of_shape_i}. Got "
    " intermediary content "
    f" that flows {repr(obj)} of type {type(obj)}.{additional_message}"  # RUF010
)


# https://github.com/astral-sh/ruff/issues/16325
f"{str({})}"

f"{str({} | {})}"

import builtins

f"{builtins.repr(1)}"

f"{repr(1)=}"

f"{repr(lambda: 1)}"

f"{repr(x := 2)}"

f"{str(object=3)}"

f"{str(x for x in [])}"

f"{str((x for x in []))}"

# Debug text cases - should not trigger RUF010
f"{str(1)=}"
f"{ascii(1)=}"
f"{repr(1)=}"
f"{str('hello')=}"
f"{ascii('hello')=}"
f"{repr('hello')=}"

# Fix should be unsafe when it deletes a comment (https://github.com/astral-sh/ruff/issues/19745)
f"{ascii(
    # comment
    1
)}"

f"{repr(
    # comment
    1
)}"

f"{str(
    # comment
    1
)}"

# Fix should be unsafe when it deletes comments after the argument
f"{ascii(1  # comment
)}"

f"{repr((
    1
)  # comment
)}"

f"{str((
    1
)
    # comment
)}"

# Fix should be safe when the comment is preserved inside extra parentheses
f"{ascii((
    # comment
    1
))}"

f"{repr((
    1  # comment
))}"

f"{repr((
    1
    # comment
))}"

f"{repr((
    # comment
    1
))}"

f"{str((
    # comment
    1
))}"
''' }
expected = [
