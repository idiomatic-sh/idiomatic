[[cases]]
name = "undefined-export"
comparison = "full"
files = { "case.py" = "__all__ = [\"missing\"]\n" }
expected = [{ rule = "F822", file = "case.py", start = 11, end = 20 }]

[[cases]]
name = "defined-export"
comparison = "full"
files = { "case.py" = "x = 1\n__all__ = [\"x\"]\n" }
expected = []

[[cases]]
name = "imported-export"
comparison = "full"
files = { "case.py" = "from module import x\n__all__ = [\"x\"]\n" }
expected = []

[[cases]]
name = "later-module-definition"
