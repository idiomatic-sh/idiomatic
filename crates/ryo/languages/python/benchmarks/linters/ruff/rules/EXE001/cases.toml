[[cases]]
name = "ruff-0.16.5-EXE001_1.py"
comparison = "full"
files = { "EXE001_1.py" = "#!/usr/bin/python\n\nif __name__ == '__main__':\n    print('I should be executable.')\n" }
file-metadata = { "EXE001_1.py" = false }
expected = [{ "rule" = "EXE001", "file" = "EXE001_1.py", "start" = 0, "end" = 17 }]

