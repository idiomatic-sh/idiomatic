[[cases]]
name = "policy-tagged-pylint-nan_comparison.py"
comparison = "full"
files = { "case.py" = "import math\nfrom math import nan as bad_val\nimport numpy as np\nfrom numpy import nan as npy_nan\n\n\nx = float(\"nan\")\ny = np.NaN\n\n# PLW0117\nif x == float(\"nan\"):\n    pass\n\n# PLW0117\nif x == float(\"NaN\"):\n    pass\n\n# PLW0117\nif x == float(\"NAN\"):\n    pass\n\n# PLW0117\nif x == float(\"Nan\"):\n    pass\n\n# PLW0117\nif x == math.nan:\n    pass\n\n# PLW0117\nif x == bad_val:\n    pass\n\n# PLW0117\nif y == np.NaN:\n    pass\n\n# PLW0117\nif y == np.NAN:\n    pass\n\n# PLW0117\nif y == np.nan:\n    pass\n\n# PLW0117\nif y == npy_nan:\n    pass\n\nimport builtins\n\n# PLW0117\nif x == builtins.float(\"nan\"):\n    pass\n\n# https://github.com/astral-sh/ruff/issues/16374\nmatch number:\n    # Errors\n    case np.nan: ...\n    case math.nan: ...\n\n    # No errors\n    case np.nan(): ...\n    case math.nan(): ...\n    case float('nan'): ...\n    case npy_nan: ...\n\n# OK\nif math.isnan(x):\n    pass\n\n# OK\nif np.isnan(y):\n    pass\n\n# OK\nif x == 0:\n    pass\n\n# OK\nif x == float(\"32\"):\n    pass\n\n# OK\nif x == float(42):\n    pass\n\n# OK\nif y == np.inf:\n    pass\n\n# OK\nif x == \"nan\":\n    pass\n\n# PLW0117\n# https://github.com/astral-sh/ruff/issues/18596\nassert x == float(\"-NaN \")\nassert x == float(\" \\n+nan   \\t\")\n" }
expected = [{ "rule" = "PLW0177", "file" = "case.py", "start" = 145, "end" = 157 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 187, "end" = 199 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 229, "end" = 241 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 271, "end" = 283 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 313, "end" = 321 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 351, "end" = 358 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 388, "end" = 394 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 424, "end" = 430 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 460, "end" = 466 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 496, "end" = 503 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 550, "end" = 571 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 668, "end" = 674 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 689, "end" = 697 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 1110, "end" = 1126 }, { "rule" = "PLW0177", "file" = "case.py", "start" = 1139, "end" = 1160 }]
