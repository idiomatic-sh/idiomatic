[[cases]]
name = "string"
files = { "case.py" = "assert \"yes\"\n" }
expected = [{ file = "case.py", start = 7, end = 12 }]

[[cases]]
name = "empty"
files = { "case.py" = "assert \"\"\n" }
expected = [{ file = "case.py", start = 7, end = 9 }]

[[cases]]
name = "bytes"
files = { "case.py" = "assert b\"\"\n" }
expected = [{ file = "case.py", start = 7, end = 10 }]

[[cases]]
name = "fstring"
files = { "case.py" = "assert f\"{value}\"\n" }
expected = [{ file = "case.py", start = 7, end = 17 }]

[[cases]]
name = "number"
files = { "case.py" = "assert 1\n" }
expected = []

[[cases]]
name = "bool"
files = { "case.py" = "assert True\n" }
expected = []

[[cases]]
name = "message"
files = { "case.py" = "assert value, \"message\"\n" }
expected = []

[[cases]]
name = "concatenated"
files = { "case.py" = "assert \"one\" \"two\"\n" }
expected = [{ file = "case.py", start = 7, end = 18 }]

[[cases]]
name = "template"
files = { "case.py" = "assert t\"{value}\"\n" }
expected = []

[[cases]]
name = "multiline-string-noqa"
files = { "case.py" = "assert \"\"\"bad\nmore\"\"\" # noqa\n" }
expected = []

[[cases]]
name = "multiline-fstring-noqa"
files = { "case.py" = "assert f\"\"\"bad\n{value}\"\"\" # noqa\n" }
expected = []

[[cases]]
name = "multiline-concat-noqa"
files = { "case.py" = "assert (\"bad\"\n \"more\") # noqa\n" }
expected = [{ file = "case.py", start = 8, end = 21 }]

[[cases]]
name = "noqa"
files = { "case.py" = "assert \"yes\" # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
files = { "case.py" = "assert \"yes\" # noqa: PLW0129\n" }
expected = []

[[cases]]
name = "other-code"
files = { "case.py" = "assert \"yes\" # noqa: F401\n" }
expected = [{ file = "case.py", start = 7, end = 12 }]

[[cases]]
name = "file-noqa"
files = { "case.py" = "# ruff: noqa\nassert \"yes\"\n" }
expected = []

[[cases]]
name = "shared-block-suppressed"
files = { "case.py" = "# ruff: disable[PLW0129]\nassert \"yes\"\n\n# ruff: enable[PLW0129]\n" }
expected = []

[[cases]]
name = "shared-block-reenabled"
files = { "case.py" = "# ruff: disable[PLW0129]\n# ruff: enable[PLW0129]\nassert \"yes\"\n" }
expected = [{ file = "case.py", start = 56, end = 61 }]

[[cases]]
name = "shared-block-unmatched-disable"
files = { "case.py" = "# ruff: disable[PLW0129]\nassert \"yes\"\n" }
expected = []

[[cases]]
name = "shared-block-wrong-code"
files = { "case.py" = "# ruff: disable[E501]\nassert \"yes\"\n" }
expected = [{ file = "case.py", start = 29, end = 34 }]

[[cases]]
name = "shared-file-ignore"
files = { "case.py" = "# ruff: file-ignore[PLW0129]\nassert \"yes\"\n" }
expected = []
