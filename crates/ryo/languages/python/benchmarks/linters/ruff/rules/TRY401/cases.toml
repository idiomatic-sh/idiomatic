[[cases]]
name = "logging-module-call"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    pass\nexcept Exception as error:\n    logging.exception(\"failure %s\", error)\n" }
expected = [{ rule = "TRY401", file = "case.py", start = 92, end = 97 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import logging as log\ntry:\n    pass\nexcept Exception as error:\n    log.exception(f\"{error}\")\n" }
expected = [{ rule = "TRY401", file = "case.py", start = 84, end = 89 }]

[[cases]]
name = "from-import-alias"
comparison = "full"
files = { "case.py" = "from logging import exception as log_exception\ntry:\n    pass\nexcept Exception as error:\n    log_exception(\"failure\", error)\n" }
expected = [{ rule = "TRY401", file = "case.py", start = 117, end = 122 }]

[[cases]]
name = "nested-expression"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    pass\nexcept Exception as error:\n    logging.exception(\"failure\", str(error))\n" }
expected = [{ rule = "TRY401", file = "case.py", start = 93, end = 98 }]

[[cases]]
name = "nested-handler-outer-binding"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    pass\nexcept Exception as outer:\n    try:\n        pass\n    except ValueError:\n        logging.exception(\"failure\", outer)\n" }
expected = [{ rule = "TRY401", file = "case.py", start = 138, end = 143 }]

[[cases]]
name = "nested-handler-inner-binding"
comparison = "full"
files = { "case.py" = "import logging\ntry:\n    pass\nexcept Exception as outer:\n    try:\n        pass\n    except ValueError as inner:\n        logging.exception(\"failure\", inner)\n" }
expected = [{ rule = "TRY401", file = "case.py", start = 147, end = 152 }]

