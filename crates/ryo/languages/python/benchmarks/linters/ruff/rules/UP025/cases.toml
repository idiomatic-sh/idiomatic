[[cases]]
name = "lowercase"
files = { "case.py" = "value = u\"hello\"\n" }
expected = [{ file = "case.py", start = 8, end = 16 }]

[[cases]]
name = "uppercase"
files = { "case.py" = "value = U\"hello\"\n" }
expected = [{ file = "case.py", start = 8, end = 16 }]

[[cases]]
name = "ordinary"
files = { "case.py" = "value = \"hello\"\n" }
expected = []

[[cases]]
name = "bytes"
files = { "case.py" = "value = b\"hello\"\n" }
expected = []

[[cases]]
name = "raw"
files = { "case.py" = "value = r\"hello\"\n" }
expected = []

[[cases]]
name = "concatenated"
files = { "case.py" = "value = u\"one\" \"two\" u\"three\"\n" }
expected = [{ file = "case.py", start = 8, end = 14 }, { file = "case.py", start = 21, end = 29 }]

[[cases]]
name = "multiline"
files = { "case.py" = "value = u\"\"\"one\ntwo\"\"\"\n" }
expected = [{ file = "case.py", start = 8, end = 22 }]

[[cases]]
name = "multiline-noqa"
files = { "case.py" = "value = u\"\"\"one\ntwo\"\"\" # noqa\n" }
expected = []

[[cases]]
name = "noqa"
files = { "case.py" = "value = u\"hello\" # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
files = { "case.py" = "value = u\"hello\" # noqa: UP025\n" }
expected = []

[[cases]]
name = "other-code"
files = { "case.py" = "value = u\"hello\" # noqa: F401\n" }
expected = [{ file = "case.py", start = 8, end = 16 }]

[[cases]]
name = "file-noqa"
files = { "case.py" = "# ruff: noqa\nvalue = u\"hello\"\n" }
expected = []

[[cases]]
name = "shared-block-suppressed"
files = { "case.py" = "# ruff: disable[UP025]\nvalue = u\"hello\"\n\n# ruff: enable[UP025]\n" }
expected = []

[[cases]]
name = "shared-block-reenabled"
files = { "case.py" = "# ruff: disable[UP025]\n# ruff: enable[UP025]\nvalue = u\"hello\"\n" }
expected = [{ file = "case.py", start = 53, end = 61 }]

[[cases]]
name = "shared-block-unmatched-disable"
files = { "case.py" = "# ruff: disable[UP025]\nvalue = u\"hello\"\n" }
expected = []

[[cases]]
name = "shared-block-wrong-code"
files = { "case.py" = "# ruff: disable[E501]\nvalue = u\"hello\"\n" }
expected = [{ file = "case.py", start = 30, end = 38 }]

[[cases]]
name = "shared-file-ignore"
files = { "case.py" = "# ruff: file-ignore[UP025]\nvalue = u\"hello\"\n" }
expected = []

[[cases]]
name = "quoted-annotation-string-prefix"
files = { "case.py" = "x: \"list[u'foo']\"\n" }
expected = [{ file = "case.py", start = 9, end = 15 }]
