[[cases]]
name = "repeated-import"
comparison = "full"
files = { "case.py" = "import os\nimport os\n" }
expected = [{ rule = "F811", file = "case.py", start = 17, end = 19 }]

[[cases]]
name = "used-before-reimport"
comparison = "full"
files = { "case.py" = "import os\nprint(os.name)\nimport os\n" }
expected = []

[[cases]]
name = "read-after-reimport-is-not-prior-use"
comparison = "full"
files = { "case.py" = "import os\nimport os\nprint(os.name)\n" }
expected = [{ rule = "F811", file = "case.py", start = 17, end = 19 }]

[[cases]]
name = "assignment-over-import"
comparison = "full"
files = { "case.py" = "import os\nos = 1\nprint(os)\n" }
expected = [{ rule = "F811", file = "case.py", start = 10, end = 12 }]

[[cases]]
name = "function-redefinition"
comparison = "full"
files = { "case.py" = "def f():\n    pass\ndef f():\n    pass\n" }
expected = [{ rule = "F811", file = "case.py", start = 22, end = 23 }]

[[cases]]
name = "different-branches"
comparison = "full"
files = { "case.py" = "if flag:\n    import os\nelse:\n    import os\n" }
expected = []

[[cases]]
name = "deleted-before-reimport"
comparison = "full"
files = { "case.py" = "import os\ndel os\nimport os\n" }
expected = []

[[cases]]
name = "deferred-closure-uses-final-import"
comparison = "full"
files = { "case.py" = "import os\ndef f():\n    return os.name\nimport os\n" }
expected = [{ rule = "F811", file = "case.py", start = 45, end = 47 }]

[[cases]]
name = "normalized-import-redefinition"
comparison = "full"
files = { "case.py" = "import os as ｘ\nimport os as x\n" }
expected = [{ rule = "F811", file = "case.py", start = 30, end = 31 }]

[[cases]]
name = "dummy-redefinition"
comparison = "full"
files = { "case.py" = "import os as _unused\nimport sys as _unused\n" }
expected = [{ rule = "F811", file = "case.py", start = 35, end = 42 }]

[[cases]]
name = "annotated-assignment-stable-default"
