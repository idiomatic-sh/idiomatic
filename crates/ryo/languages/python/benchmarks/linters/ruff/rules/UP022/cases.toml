[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "import subprocess\nsubprocess.run([], stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n" }
expected = [{ rule = "UP022", file = "case.py", start = 18, end = 84 }]

[[cases]]
name = "from-import-alias"
comparison = "full"
files = { "case.py" = "from subprocess import run as execute, PIPE as PIPE\nexecute([], stderr=PIPE, stdout=PIPE)\n" }
expected = [{ rule = "UP022", file = "case.py", start = 52, end = 89 }]

