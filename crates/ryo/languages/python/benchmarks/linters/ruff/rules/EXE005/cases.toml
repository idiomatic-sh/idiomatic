[[cases]]
name = "after-comment"
files = { "case.py" = "# comment\n#!/usr/bin/python\n" }
expected = [{ file = "case.py", start = 10, end = 27 }]

[[cases]]
name = "first"
files = { "case.py" = "#!/usr/bin/python\n" }
expected = []

[[cases]]
name = "whitespace-only"
files = { "case.py" = "\n  #!/usr/bin/python\n" }
expected = []

[[cases]]
name = "inline"
files = { "case.py" = "x = 1 #!/usr/bin/python\n" }
expected = [{ file = "case.py", start = 6, end = 23 }]

[[cases]]
name = "second-shebang"
files = { "case.py" = "#!/usr/bin/python\n#!/usr/bin/python\n" }
expected = [{ file = "case.py", start = 18, end = 35 }]

[[cases]]
name = "empty-shebang"
files = { "case.py" = "# comment\n#!\n" }
expected = [{ file = "case.py", start = 10, end = 12 }]

[[cases]]
name = "not-shebang"
files = { "case.py" = "# comment\n# !/usr/bin/python\n" }
expected = []

[[cases]]
name = "string-lookalike"
files = { "case.py" = "text = \"#!/usr/bin/python\"\n" }
expected = []

[[cases]]
name = "noqa"
files = { "case.py" = "# comment\n#!/usr/bin/python # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
files = { "case.py" = "# comment\n#!/usr/bin/python # noqa: EXE005\n" }
expected = []

[[cases]]
name = "other-code"
files = { "case.py" = "# comment\n#!/usr/bin/python # noqa: F401\n" }
expected = [{ file = "case.py", start = 10, end = 40 }]

[[cases]]
name = "file-noqa"
files = { "case.py" = "# ruff: noqa\n# comment\n#!/usr/bin/python\n" }
expected = []

[[cases]]
name = "whitespace"
files = { "case.py" = "\n \t\f#!/usr/bin/python\n" }
expected = []

[[cases]]
name = "after-code"
files = { "case.py" = "x = 1\n#!/usr/bin/python\n" }
expected = [{ file = "case.py", start = 6, end = 23 }]

[[cases]]
name = "boundary-after-comment"
files = { "case.py" = "# header\n#!/usr/bin/python\n" }
expected = [{ file = "case.py", start = 9, end = 26 }]

[[cases]]
name = "boundary-inline"
files = { "case.py" = "x = 1  #!/bin/sh\n" }
expected = [{ file = "case.py", start = 7, end = 16 }]

[[cases]]
name = "second"
files = { "case.py" = "#!/usr/bin/python\n#!/bin/sh\n" }
expected = [{ file = "case.py", start = 18, end = 27 }]

[[cases]]
name = "ordinary"
files = { "case.py" = "# !/usr/bin/python\n" }
expected = []

[[cases]]
name = "string"
files = { "case.py" = "x = \"#!/usr/bin/python\"\n" }
expected = []

[[cases]]
name = "nested"
files = { "case.py" = "def f():\n    #!/usr/bin/python\n    pass\n" }
expected = [{ file = "case.py", start = 13, end = 30 }]

[[cases]]
name = "unicode"
files = { "case.py" = "# caf\u00e9\n#!/bin/sh\n" }
expected = [{ file = "case.py", start = 8, end = 17 }]

[[cases]]
name = "crlf"
files = { "case.py" = "# header\r\n#!/bin/sh\r\n" }
expected = [{ file = "case.py", start = 10, end = 19 }]

[[cases]]
name = "boundary-noqa"
files = { "case.py" = "# header\n#!/bin/sh # noqa: EXE005\n" }
