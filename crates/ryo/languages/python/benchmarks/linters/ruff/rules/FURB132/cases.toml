[[cases]]
name = "chained-collection-targets"
comparison = "full"
files = { "case.py" = "(out,other)=(alias,last)=({1},0)\nif x in out:\n    out.remove(x)\nif x in alias:\n    alias.remove(x)\n" }
expected = [{ rule = "FURB132", file = "case.py", start = 33, end = 63 }, { rule = "FURB132", file = "case.py", start = 64, end = 98 }]

