[[cases]]
name = "too-many-positional"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"%s\", \"value\", 1)\n" }
expected = [{ rule = "PLE1205", file = "case.py", start = 15, end = 28 }]

[[cases]]
name = "too-many-after-format"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"%s %s\", \"value\", 1, 2)\n" }
expected = [{ rule = "PLE1205", file = "case.py", start = 15, end = 28 }]

[[cases]]
name = "percent-no-conversion"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"%%\", \"value\")\n" }
expected = [{ rule = "PLE1205", file = "case.py", start = 15, end = 28 }]

[[cases]]
name = "mapping-format-count"
comparison = "full"
files = { "case.py" = "import logging\nlogging.error(\"%(name)s\", {\"name\": \"x\"}, 1)\n" }
expected = []

[[cases]]
name = "direct-import-alias"
comparison = "full"
files = { "case.py" = "from logging import error as log_error\nlog_error(\"%s\", \"x\", \"extra\")\n" }
