ools.groupby(items, key=lambda p: p[1]):\n    # Mutually exclusive branches shouldn't trigger the warning\n    if _section == \"greens\":\n        collect_shop_items(shopper, section_items)\n        if _section == \"greens\":\n            collect_shop_items(shopper, section_items)  # B031\n        elif _section == \"frozen items\":\n            collect_shop_items(shopper, section_items)  # B031\n        else:\n            collect_shop_items(shopper, section_items)  # B031\n        collect_shop_items(shopper, section_items)  # B031\n    elif _section == \"frozen items\":\n        # Mix `match` and `if` statements\n        match shopper:\n            case \"Jane\":\n                collect_shop_items(shopper, section_items)\n                if _section == \"fourth\":\n                    collect_shop_items(shopper, section_items)  # B031\n            case _:\n                collect_shop_items(shopper, section_items)\n    else:\n        collect_shop_items(shopper, section_items)\n    # Now, it should detect\n    collect_shop_items(shopper, section_items)  # B031\n\nfor _section, section_items in itertools.groupby(items, key=lambda p: p[1]):\n    # Mutually exclusive branches shouldn't trigger the warning\n    match _section:\n        case \"greens\":\n            collect_shop_items(shopper, section_items)\n            match shopper:\n                case \"Jane\":\n                    collect_shop_items(shopper, section_items)  # B031\n                case _:\n                    collect_shop_items(shopper, section_items)  # B031\n        case \"frozen items\":\n            collect_shop_items(shopper, section_items)\n            collect_shop_items(shopper, section_items)  # B031\n        case _:\n            collect_shop_items(shopper, section_items)\n    # Now, it should detect\n    collect_shop_items(shopper, section_items)  # B031\n\nfor group in groupby(items, key=lambda p: p[1]):\n    # This is bad, but not detected currently\n    collect_shop_items(\"Jane\", gro