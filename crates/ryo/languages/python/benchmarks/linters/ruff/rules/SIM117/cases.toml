files = { "case.py" = "# SIM117\nwith A() as a:\n    with B() as b:\n        print(\"hello\")\n\n# SIM117\nwith A():\n    with B():\n        with C():\n            print(\"hello\")\n\n# SIM117\nwith A() as a:\n    # Unfixable due to placement of this comment.\n    with B() as b:\n        print(\"hello\")\n\n# SIM117\nwith A() as a:\n    with B() as b:\n        # Fixable due to placement of this comment.\n        print(\"hello\")\n\n# OK\nwith A() as a:\n    a()\n    with B() as b:\n        print(\"hello\")\n\n# OK\nwith A() as a:\n    with B() as b:\n        print(\"hello\")\n    a()\n\n# OK, can't merge async with and with.\nasync with A() as a:\n    with B() as b:\n        print(\"hello\")\n\n# OK, can't merge async with and with.\nwith A() as a:\n    async with B() as b:\n        print(\"hello\")\n\n# SIM117\nasync with A() as a:\n    async with B() as b:\n        print(\"hello\")\n\nwhile True:\n    # SIM117\n    with A() as a:\n        with B() as b:\n            \"\"\"this\nis valid\"\"\"\n\n            \"\"\"the indentation on\n            this line is significant\"\"\"\n\n            \"this is\" \\\n\"allowed too\"\n\n            (\"so is\"\n\"this for some reason\")\n\n# SIM117\nwith (\n    A() as a,\n    B() as b,\n):\n    with C() as c:\n        print(\"hello\")\n\n# SIM117\nwith A() as a:\n    with (\n        B() as b,\n        C() as c,\n    ):\n        print(\"hello\")\n\n# SIM117\nwith (\n    A() as a,\n    B() as b,\n):\n    with (\n        C() as c,\n        D() as d,\n    ):\n        print(\"hello\")\n\n# SIM117 (auto-fixable)\nwith A(\"01ß9💣2ℝ8901ß9💣2ℝ8901ß9💣2ℝ89\") as a:\n    with B(\"01ß9💣2ℝ8901ß9💣2ℝ8901ß9💣2ℝ89\") as b:\n        print(\"hello\")\n\n# SIM117 (not auto-fixable too long)\nwith A(\"01ß9💣2ℝ8901ß9💣2ℝ8901ß9💣2ℝ890\") as a:\n    with B(\"01ß9💣2ℝ8901ß9💣2ℝ8901ß9💣2ℝ89\") as b:\n        print(\"hello\")\n\n# From issue #3025.\nasync def main():\n    async with A() as a: # SIM117.\n        async with B() as b:\n            print(\"async-inside!\")\n\n    return 0\n\n# OK. Can't merge across different kinds of with statements.\nwith a as a2:\n    async with b as b2:\n        with c as c2:\n            async with d as d2:\n                f(a2, b2, c2, d2)\n\n# OK. Can't merge across different kinds of with statements.\nasync with b as b2:\n    with c as c2:\n        async with d as d2:\n            f(b2, c2, d2)\n\n# SIM117\nwith A() as a:\n    with B() as b:\n        type ListOrSet[T] = list[T] | set[T]\n\n        class ClassA[T: str]:\n            def method1(self) -> T:\n                ...\n\n        f\" something { my_dict[\"key\"] } something else \"\n\n        f\"foo {f\"bar {x}\"} baz\"\n\n# Allow cascading for some statements.\nimport anyio\nimport asyncio\nimport trio\n\nasync with asyncio.timeout(1):\n    async with A() as a:\n        pass\n\nasync with A():\n    async with asyncio.timeout(1):\n        pass\n\nasync with asyncio.timeout(1):\n    async with asyncio.timeout_at(1):\n        async with anyio.CancelScope():\n            async with anyio.fail_after(1):\n                async with anyio.move_on_after(1):\n                    async with trio.fail_after(1):\n                        async with trio.fail_at(1):\n                            async with trio.move_on_after(1):\n                                async with trio.move_on_at(1):\n                                    pass\n\n# Do not suppress combination, if a context manager is already combined with another.\nasync with asyncio.timeout(1), A():\n    async with B():\n        pass\n" }
