comparison = "full"
files = { "case.py" = "from dataclasses import dataclass\nfrom functools import cache\nfrom enum import Enum\nclass Base(Enum): ...\nclass Middle(Base): ...\n@dataclass\nclass Subject(Middle):\n    @cache\n    def before(self): return 1\n    class Base: ...\n    @cache\n    def after(self): return 2\n" }
expected = [{ rule = "RUF049", file = "case.py", start = 130, end = 140 }]

