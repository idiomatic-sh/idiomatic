[[cases]]
name = "upstream-ruff-0.16.5-fixture"
comparison = "full"
files = { "RUF033.py" = "from dataclasses import InitVar, dataclass\n\n\n# OK\n@dataclass\nclass Foo:\n    bar: InitVar[int] = 0\n    baz: InitVar[int] = 1\n\n    def __post_init__(self, bar, baz) -> None: ...\n\n\n# RUF033\n@dataclass\nclass Foo:\n    bar: InitVar[int] = 0\n    baz: InitVar[int] = 1\n\n    def __post_init__(self, bar = 11, baz = 11) -> None: ...\n\n\n# RUF033\n@dataclass\nclass Foo:\n    def __post_init__(self, bar = 11, baz = 11) -> None: ...\n\n\n# OK\n@dataclass\nclass Foo:\n    def __something_else__(self, bar = 11, baz = 11) -> None: ...\n\n\n# OK\ndef __post_init__(foo: bool = True) -> None: ...\n\n\n# OK\nclass Foo:\n    def __post_init__(self, x=\"hmm\") -> None: ...\n\n\n# RUF033\n@dataclass\nclass Foo:\n    def __post_init__(self, bar: int = 11, baz: Something[Whatever | None] = 11) -> None: ...\n\n\n# RUF033\n@dataclass\nclass Foo:\n    \"\"\"A very helpful docstring.\n\n    Docstrings are very important and totally not a waste of time.\n    \"\"\"\n\n    ping = \"pong\"\n\n    def __post_init__(self, bar: int = 11, baz: int = 12) -> None: ...\n\n\n# RUF033\n@dataclass\nclass Foo:\n    bar = \"should've used attrs\"\n\n    def __post_init__(self, bar: str = \"ahhh\", baz: str = \"hmm\") -> None: ...\n\n\n# https://github.com/astral-sh/ruff/issues/18950\n@dataclass\nclass Foo:\n    def __post_init__(self, bar: int = (x := 1)) -> None:\n        pass\n\n\n@dataclass\nclass Foo:\n    def __post_init__(\n        self,\n        bar: int = (x := 1)  #  comment\n        ,\n        baz: int = (y := 2),  # comment\n        foo = (a := 1)  #  comment\n        ,\n        faz = (b := 2),  # comment\n    ) -> None:\n        pass\n\n\n@dataclass\nclass Foo:\n    def __post_init__(\n        self,\n        bar: int = 1,  # comment\n        baz: int = 2,  # comment\n    ) -> None:\n        pass\n\n\n@dataclass\nclass Foo:\n    def __post_init__(\n        self,\n        arg1: int = (1)  # comment\n        ,\n        arg2: int = ((1))  # comment\n        ,\n        arg2: int = (i for i in range(10))  # comment\n        ,\n    ) -> None:\n        pass\n\n\n# makes little sense, but is valid syntax\ndef fun_with_python_syntax():\n    @dataclass\n    class Foo:\n        def __post_init__(\n            self,\n            bar: (int) = (yield from range(5))  # comment\n            ,\n        ) -> None:\n            ...\n\n    return Foo\n\n\n@dataclass\nclass C:\n    def __post_init__(self, x: tuple[int, ...] = (\n        1,\n        2,\n    )) -> None:\n        self.x = x\n\n\n@dataclass\nclass D:\n    def __post_init__(self, x: int = \"\"\"\n    \"\"\") -> None:\n        self.x = x\n\n\n# https://github.com/astral-sh/ruff/issues/19628\n# No fix: annotation references a type variable scoped to `__post_init__`\n@dataclass\nclass E:\n    def __post_init__[T: (str, bytes)](self, a: T | None = None, b: T | None = None) -> None:\n        self.a = str(a)\n        self.b = str(b)\n" }
expected = [{ rule = "RUF033", file = "RUF033.py", start = 296, end = 298 }, { rule = "RUF033", file = "RUF033.py", start = 306, end = 308 }, { rule = "RUF033", file = "RUF033.py", start = 390, end = 392 }, { rule = "RUF033", file = "RUF033.py", start = 400, end = 402 }, { rule = "RUF033", file = "RUF033.py", start = 708, end = 710 }, { rule = "RUF033", file = "RUF033.py", start = 746, end = 748 }, { rule = "RUF033", file = "RUF033.py", start = 964, end = 966 }, { rule = "RUF033", file = "RUF033.py", start = 979, end = 981 }, { rule = "RUF033", file = "RUF033.py", start = 1102, end = 1108 }, { rule = "RUF033", file = "RUF033.py", start = 1121, end = 1126 }, { rule = "RUF033", file = "RUF033.py", start = 1254, end = 1260 }, { rule = "RUF033", file = "RUF033.py", start = 1366, end = 1372 }, { rule = "RUF033", file = "RUF033.py", start = 1416, end = 1422 }, { rule = "RUF033", file = "RUF033.py", start = 1451, end = 1457 }, { rule = "RUF033", file = "RUF033.py", start = 1496, end = 1502 }, { rule = "RUF033", file = "RUF033.py", start = 1624, end = 1625 }, { rule = "RUF033", file = "RUF033.py", start = 1657, end = 1658 }, { rule = "RUF033", file = "RUF033.py", start = 1781, end = 1782 }, { rule = "RUF033", file = "RUF033.py", start = 1827, end = 1828 }, { rule = "RUF033", file = "RUF033.py", start = 1872, end = 1894 }, { rule = "RUF033", file = "RUF033.py", start = 2119, end = 2138 }, { rule = "RUF033", file = "RUF033.py", start = 2287, end = 2316 }, { rule = "RUF033", file = "RUF033.py", start = 2405, end = 2416 }, { rule = "RUF033", file = "RUF033.py", start = 2650, end = 2654 }, { rule = "RUF033", file = "RUF033.py", start = 2670, end = 2674 }, { rule = "invalid-syntax", file = "RUF033.py", start = 1860, end = 1864 }]
