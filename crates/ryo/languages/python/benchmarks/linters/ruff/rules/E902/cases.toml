context = { logical-root = "project", missing = ["project/gone.txt"] }
expected = [{ rule = "E902", file = "gone.txt", start = 0, end = 0 }]

[[cases]]
name = "unrequested-missing-context-is-not-primary"
comparison = "full"
files = { "companion.py" = "value = 1\n" }
context = { logical-root = "project", missing = ["project/optional.py"] }
expected = []

