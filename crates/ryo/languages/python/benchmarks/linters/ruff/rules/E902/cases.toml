[[cases]]
name = "readable-invalid-syntax-remains-visible-beside-missing-input"
comparison = "full"
requested-files = ["invalid.py", "missing.py"]
files = { "invalid.py" = "def broken(\n" }
context = { logical-root = "project", missing = ["project/missing.py"] }
expected = [
  { rule = "invalid-syntax", file = "invalid.py", start = 12, end = 12 },
  { rule = "E902", file = "missing.py", start = 0, end = 0 },
]
