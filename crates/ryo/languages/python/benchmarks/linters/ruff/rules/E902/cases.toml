[[cases]]
name = "missing-explicit-primary"
comparison = "full"
requested-files = ["companion.py", "missing.py"]
files = { "companion.py" = "value = 1\n" }
context = { logical-root = "project", missing = ["project/missing.py"] }
expected = [{ rule = "E902", file = "missing.py", start = 0, end = 0 }]

[[cases]]
name = "nested-missing-primary"
comparison = "full"
requested-files = ["companion.py", "pkg/gone.py"]
files = { "companion.py" = "value = 1\n" }
context = { logical-root = "project", missing = ["project/pkg/gone.py"] }
expected = [{ rule = "E902", file = "pkg/gone.py", start = 0, end = 0 }]

[[cases]]
name = "missing-nonlanguage-primary"
