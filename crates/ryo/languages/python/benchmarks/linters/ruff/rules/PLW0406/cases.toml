
[[cases]]
name = "root-package-name-matches"
comparison = "full"
files = { "mod.py" = "import pkg.mod\n" }
context = { logical-root = "pkg", auxiliary-files = { "pkg/__init__.py" = "" }, missing = ["__init__.py"] }
expected = [{ rule = "PLW0406", file = "mod.py", start = 7, end = 14 }]

[[cases]]
name = "root-package-name-differs"
comparison = "full"
files = { "mod.py" = "import pkg.mod\n" }
context = { logical-root = "other", auxiliary-files = { "other/__init__.py" = "" }, missing = ["__init__.py"] }
expected = []

[[cases]]
name = "ancestor-package-above-root"
comparison = "full"
files = { "mod.py" = "import pkg.nested.mod\n" }
context = { logical-root = "pkg/nested", auxiliary-files = { "pkg/__init__.py" = "", "pkg/nested/__init__.py" = "" }, missing = ["__init__.py"] }
expected = [{ rule = "PLW0406", file = "mod.py", start = 7, end = 21 }]

[[cases]]
name = "ancestor-package-absent"
