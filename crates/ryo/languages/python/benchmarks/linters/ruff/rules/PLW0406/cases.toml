[[cases]]
name = "root-init-import-name"
comparison = "full"
files = { "__init__.py" = "import initpkg\nfrom initpkg import __init__\nfrom . import __init__\n" }
context = { logical-root = "initpkg", auxiliary-files = {  }, missing = ["__init__.py"] }
expected = [{ rule = "PLW0406", file = "__init__.py", start = 35, end = 43 }, { rule = "PLW0406", file = "__init__.py", start = 58, end = 66 }]

[[cases]]
name = "nested-upstream-module"
comparison = "full"
files = { "import_self/module.py" = "import import_self.module\nfrom import_self import module\nfrom . import module\n" }
context = { logical-root = "inventory", auxiliary-files = { "inventory/import_self/__init__.py" = "" }, missing = ["__init__.py", "inventory/__init__.py"] }
expected = [{ rule = "PLW0406", file = "import_self/module.py", start = 7, end = 25 }, { rule = "PLW0406", file = "import_self/module.py", start = 50, end = 56 }, { rule = "PLW0406", file = "import_self/module.py", start = 71, end = 77 }]

