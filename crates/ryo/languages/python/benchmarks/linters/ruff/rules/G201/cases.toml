[[cases]]
name = "error-true"
files = { "case.py" = "import logging\ntry:\n    work()\nexcept Exception:\n    logging.error(\"x\", exc_info=True)\n" }
expected = [{ rule = "G201", file = "case.py", start = 61, end = 66 }]

