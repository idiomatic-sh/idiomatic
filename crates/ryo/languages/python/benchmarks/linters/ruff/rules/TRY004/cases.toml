comparison = "full"
files = { "case.py" = "def melt(frame, var_name):\n    if var_name is None:\n        var_name = [\"variable\"]\n    elif is_list_like(var_name):\n        if isinstance(frame.columns, list):\n            var_name = list(var_name)\n        else:\n            raise ValueError(f\"{var_name=} must be a scalar.\")\n    else:\n        var_name = [var_name]\n    return var_name\n\n\ndef indicator_name(indicator):\n    if isinstance(indicator, str):\n        return indicator\n    elif isinstance(indicator, bool):\n        return \"_merge\" if indicator else None\n    else:\n        raise ValueError(\"indicator option can only accept boolean or string arguments\")\n\n\ndef subplots(value):\n    if isinstance(value, bool):\n        return value\n    elif not isinstance(value, list):\n        raise ValueError(\"subplots should be a bool or a list\")\n    return list(value)\n\n\ndef unstack(obj):\n    if isinstance(obj, dict):\n        if isinstance(obj.index, list):\n            return obj\n        else:\n            return obj.T\n    elif not isinstance(obj.index, list):\n        raise ValueError(\"index must be a list to unstack\")\n    return obj\n\n\ndef getitem(key):\n    if isinstance(key, int):\n        return key\n    elif isinstance(key, slice):\n        start = key.start\n        if start is None:\n            start = 0\n        return start\n    else:\n        raise ValueError(f\"key must be an int or slice, got {type(key).__name__}\")\n\n\ndef invert(x):\n    if ~isinstance(x, int):\n        raise ValueError(\"x must be an int\")\n" }
