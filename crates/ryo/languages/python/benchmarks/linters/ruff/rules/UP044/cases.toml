[[cases]]
name = "tagged-UP044.py"
comparison = "full"
files = { "case.py" = "from typing import Generic, TypeVarTuple, Unpack\n\nShape = TypeVarTuple(\"Shape\")\n\n\nclass C(Generic[Unpack[Shape]]):\n    pass\n\n\nclass D(Generic[Unpack[Shape]]):\n    pass\n\n\ndef f(*args: Unpack[tuple[int, ...]]):\n    pass\n\n\ndef f(*args: Unpack[other.Type]):\n    pass\n\n\ndef f(*args: Generic[int, Unpack[int]]):\n    pass\n\n\n# Valid syntax, but can't be unpacked.\ndef f(*args: Unpack[int | str]) -> None:\n    pass\n\n\ndef f(*args: Unpack[int and str]) -> None:\n    pass\n\n\ndef f(*args: Unpack[int > str]) -> None:\n    pass\n\n\nfrom typing import TypedDict\n\n\nclass KwargsDict(TypedDict):\n    x: int\n    y: int\n\n\n# OK\ndef f(name: str, /, **kwargs: Unpack[KwargsDict]) -> None:\n    pass\n\n\n# OK\ndef f() -> object:\n    return Unpack[tuple[int, ...]]\n\n\n# OK\ndef f(x: Unpack[int]) -> object: ...\n" }
expected = [{ rule = "UP044", file = "case.py", start = 98, end = 111 }, { rule = "UP044", file = "case.py", start = 142, end = 155 }, { rule = "UP044", file = "case.py", start = 183, end = 206 }, { rule = "UP044", file = "case.py", start = 233, end = 251 }, { rule = "UP044", file = "case.py", start = 291, end = 302 }]

