comparison = "full"
name = "full-upstream-continue_in_finally.py"
files = { "continue_in_finally.py" = "while True:\n    try:\n        pass\n    finally:\n        continue  # [continue-in-finally]\n\nwhile True:\n    try:\n        pass\n    except Exception:\n        continue\n    finally:\n        try:\n            pass\n        finally:\n            continue  # [continue-in-finally]\n        pass\n\nwhile True:\n    try:\n        pass\n    finally:\n        test = \"aa\"\n        match test:\n            case \"aa\":\n                continue  # [continue-in-finally]\n\nwhile True:\n    try:\n        pass\n    finally:\n        with \"aa\" as f:\n            continue  # [continue-in-finally]\n\nwhile True:\n    try:\n        pass\n    finally:\n        if True:\n            continue  # [continue-in-finally]\n        continue  # [continue-in-finally]\n\n        def test():\n            while True:\n                continue\n            try:\n                pass\n            finally:\n                continue  # [continue-in-finally]\n\n\nwhile True:\n    try:\n        pass\n    finally:\n        continue  # [continue-in-finally]\n\n        def test():\n            while True:\n                continue\n\n\nwhile True:\n    try:\n        pass\n    finally:\n        for i in range(12):\n            continue\n        continue  # [continue-in-finally]\n\n        while True:\n            pass\n        else:\n            continue  # [continue-in-finally]\n\n        def test():\n            continue\n            while True:\n                continue\n\n\nwhile True:\n    try:\n        pass\n    finally:\n        if True:\n            pass\n        elif False:\n            continue  # [continue-in-finally]\n        else:\n            continue  # [continue-in-finally]\n            for i in range(10):\n                pass\n            else:\n                continue  # [continue-in-finally]\n" }
