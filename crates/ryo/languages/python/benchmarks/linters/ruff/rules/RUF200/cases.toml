[[cases]]
name = "upstream-maturin"
comparison = "full"
files = { "pyproject.toml" = "# This is a valid pyproject.toml\n# https://github.com/PyO3/maturin/blob/87ac3d9f74dd79ef2df9a20880b9f1fa23f9a437/pyproject.toml\n[build-system]\nrequires = [\"setuptools\", \"wheel>=0.36.2\", \"tomli>=1.1.0 ; python_version<'3.11'\", \"setuptools-rust>=1.4.0\"]\nbuild-backend = \"setuptools.build_meta\"\n\n[project]\nname = \"maturin\"\nrequires-python = \">=3.7\"\nclassifiers = [\n    \"Topic :: Software Development :: Build Tools\",\n    \"Programming Language :: Rust\",\n    \"Programming Language :: Python :: Implementation :: CPython\",\n    \"Programming Language :: Python :: Implementation :: PyPy\",\n]\ndependencies = [\"tomli>=1.1.0 ; python_version<'3.11'\"]\ndynamic = [\n    \"authors\",\n    \"description\",\n    \"license\",\n    \"readme\",\n    \"version\"\n]\n\n[project.optional-dependencies]\nzig = [\n    \"ziglang~=0.10.0\",\n]\npatchelf = [\n    \"patchelf\",\n]\n\n[project.urls]\n\"Source Code\" = \"https://github.com/PyO3/maturin\"\nIssues = \"https://github.com/PyO3/maturin/issues\"\nDocumentation = \"https://maturin.rs\"\nChangelog = \"https://maturin.rs/changelog.html\"\n\n[tool.maturin]\nbindings = \"bin\"\n\n[tool.black]\ntarget_version = ['py37']\nextend-exclude = '''\n# Ignore cargo-generate templates\n^/src/templates\n'''\n\n[tool.ruff]\nline-length = 120\ntarget-version = \"py37\"\n\n[tool.mypy]\ndisallow_untyped_defs = true\ndisallow_incomplete_defs = true\nwarn_no_return = true\nignore_missing_imports = true\n" }
context = { logical-root = "project" }
expected = []

