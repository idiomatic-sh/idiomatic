comparison = "full"
files = { "RUF009_attrs_auto_attribs.py" = "import attr\nfrom attrs import define, field, frozen, mutable\n\n\nfoo = int\n\n\n@define  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@define()  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@define(auto_attribs=None)  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@frozen  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@frozen()  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@frozen(auto_attribs=None)  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@mutable  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@mutable()  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@mutable(auto_attribs=None)  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@attr.s  # auto_attribs = False\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@attr.s()  # auto_attribs = False\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@attr.s(auto_attribs=None)  # auto_attribs = None => True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@attr.s(auto_attribs=False)  # auto_attribs = False\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@attr.s(auto_attribs=True)  # auto_attribs = True\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n\n\n@attr.s(auto_attribs=[1, 2, 3])  # auto_attribs = False\nclass C:\n    a: str = 0\n    b = field()\n    c: int = foo()\n    d = list()\n" }
