
[[cases]]
name = "upstream-full-fixture"
comparison = "full"
files = { "SIM401.py" = "###\n# Positive cases\n###\n\na_dict = {}\n\n# SIM401 (pattern-1)\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var = \"default1\"\n\n# SIM401 (pattern-2)\nif key not in a_dict:\n    var = \"default2\"\nelse:\n    var = a_dict[key]\n\n# OK (default contains effect)\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var = val1 + val2\n\n# SIM401 (complex expression in key)\nif keys[idx] in a_dict:\n    var = a_dict[keys[idx]]\nelse:\n    var = \"default\"\n\ndicts = {\"key\": a_dict}\n\n# SIM401 (complex expression in dict)\nif key in dicts[idx]:\n    var = dicts[idx][key]\nelse:\n    var = \"default\"\n\n# SIM401 (complex expression in var)\nif key in a_dict:\n    vars[idx] = a_dict[key]\nelse:\n    vars[idx] = \"defaultß9💣2ℝ6789ß9💣2ℝ6789ß9💣2ℝ6789ß9💣2ℝ6789ß9💣2ℝ6789\"\n\n# SIM401\nif foo():\n    pass\nelse:\n    if key in a_dict:\n        vars[idx] = a_dict[key]\n    else:\n        vars[idx] = \"default\"\n\n###\n# Negative cases\n###\n\n# OK (too long)\nif key in a_dict:\n    vars[idx] = a_dict[key]\nelse:\n    vars[idx] = \"defaultß9💣2ℝ6789ß9💣2ℝ6789ß9💣2ℝ6789ß9💣2ℝ6789ß9💣2ℝ6789ß\"\n\n# OK (false negative)\nif not key in a_dict:\n    var = \"default\"\nelse:\n    var = a_dict[key]\n\n# OK (different dict)\nif key in a_dict:\n    var = other_dict[key]\nelse:\n    var = \"default\"\n\n# OK (different key)\nif key in a_dict:\n    var = a_dict[other_key]\nelse:\n    var = \"default\"\n\n# OK (different var)\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    other_var = \"default\"\n\n# OK (extra vars in body)\nif key in a_dict:\n    var = a_dict[key]\n    var2 = value2\nelse:\n    var = \"default\"\n\n# OK (extra vars in orelse)\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var2 = value2\n    var = \"default\"\n\n# OK (complex default value)\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var = foo()\n\n# OK (complex default value)\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var = a_dict[\"fallback\"]\n\n# OK (false negative for elif)\nif foo():\n    pass\nelif key in a_dict:\n    vars[idx] = a_dict[key]\nelse:\n    vars[idx] = \"default\"\n\nclass NotADictionary:\n    def __init__(self):\n        self._dict = {}\n\n    def __getitem__(self, key):\n        return self._dict[key]\n\n    def __setitem__(self, key, value):\n        self._dict[key] = value\n\n    def __iter__(self):\n        return self._dict.__iter__()\n\nnot_dict = NotADictionary()\nnot_dict[\"key\"] = \"value\"\n\n# OK (type `NotADictionary` is not a known dictionary type)\nif \"key\" in not_dict:\n    value = not_dict[\"key\"]\nelse:\n    value = None\n\n###\n# Positive cases (preview)\n###\n\n# SIM401\nvar = a_dict[key] if key in a_dict else \"default3\"\n\n# SIM401\nvar = \"default-1\" if key not in a_dict else a_dict[key]\n\n# OK (default contains effect)\nvar = a_dict[key] if key in a_dict else val1 + val2\n\n###\n# Lambda parameter defaults\n###\n\n# SIM401: literal defaults have no side effects.\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var = lambda x=0, /, y=1, *, z=2: (x, y, z)\n\n# OK: dict.get would evaluate the lambda's default even when the key exists.\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var = lambda value=initialize(): value\n\n# OK: positional-only defaults are also evaluated when the lambda is created.\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var = lambda value=initialize(), /: value\n\n# OK: keyword-only defaults can contain nested side effects.\nif key in a_dict:\n    var = a_dict[key]\nelse:\n    var = lambda *, value=(initialize(),): value\n" }
expected = [{ "rule" = "SIM401", "file" = "SIM401.py", "start" = 60, "end" = 126 }, { "rule" = "SIM401", "file" = "SIM401.py", "start" = 149, "end" = 219 }, { "rule" = "SIM401", "file" = "SIM401.py", "start" = 358, "end" = 435 }, { "rule" = "SIM401", "file" = "SIM401.py", "start" = 612, "end" = 764 }, { "rule" = "SIM401", "file" = "SIM401.py", "start" = 804, "end" = 893 }, { "rule" = "SIM401", "file" = "SIM401.py", "start" = 2528, "end" = 2572 }, { "rule" = "SIM401", "file" = "SIM401.py", "start" = 2589, "end" = 2638 }, { "rule" = "SIM401", "file" = "SIM401.py", "start" = 2810, "end" = 2903 }]

