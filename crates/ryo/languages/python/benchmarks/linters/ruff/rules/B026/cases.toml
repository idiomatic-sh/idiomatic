[[cases]]
name = "after-keyword"
files = { "case.py" = "call(key=1, *args)\n" }
expected = [{ file = "case.py", start = 12, end = 17 }]

[[cases]]
name = "before-keyword"
files = { "case.py" = "call(*args, key=1)\n" }
expected = []

[[cases]]
name = "two-starred"
files = { "case.py" = "call(*args, key=1, *more)\n" }
expected = [{ file = "case.py", start = 19, end = 24 }]

[[cases]]
name = "only-starred"
files = { "case.py" = "call(*args)\n" }
expected = []

[[cases]]
name = "multiple-keywords"
files = { "case.py" = "call(a=1, b=2, *args)\n" }
expected = [{ file = "case.py", start = 15, end = 20 }]

[[cases]]
name = "double-star"
files = { "case.py" = "call(key=1, **kwargs)\n" }
expected = []

[[cases]]
name = "method"
files = { "case.py" = "obj.call(key=1, *args)\n" }
expected = [{ file = "case.py", start = 16, end = 21 }]

[[cases]]
name = "noqa"
files = { "case.py" = "call(key=1, *args) # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
files = { "case.py" = "call(key=1, *args) # noqa: B026\n" }
expected = []

[[cases]]
name = "other-code"
files = { "case.py" = "call(key=1, *args) # noqa: F401\n" }
expected = [{ file = "case.py", start = 12, end = 17 }]

