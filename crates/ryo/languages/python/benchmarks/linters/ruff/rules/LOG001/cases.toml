[[cases]]
name = "getlogger"
files = { "case.py" = "import logging\nlogging.getLogger(\"name\")\n" }
expected = []

[[cases]]
name = "no-arguments"
files = { "case.py" = "import logging\nlogging.Logger()\n" }
