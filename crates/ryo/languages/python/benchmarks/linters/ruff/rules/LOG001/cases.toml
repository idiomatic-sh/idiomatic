files = { "case.py" = "import logging\nlogging.Logger(\"name\") # noqa: LOG001\n" }
expected = []

[[cases]]
name = "range"
files = { "case.py" = "import logging\n# ruff: disable[LOG001]\nlogging.Logger(\"name\")\n# ruff: enable[LOG001]\n" }
