
[[cases]]
name = "cross-PYI034-metaclass-class-local-shadow"
comparison = "full"
files = { "case.pyi" = "from typing import TypeVar,Protocol\nT=TypeVar(\"T\")\nclass A(type): ...\nclass Subject(A):\n class A: ...\n def __enter__(self) -> Subject: ...\n" }
