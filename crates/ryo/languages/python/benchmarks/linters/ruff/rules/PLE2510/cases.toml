[[cases]]
name = "raw-character"
comparison = "full"
files = { "case.py" = "x = \"A\bB\"\n" }
expected = [{ rule = "PLE2510", file = "case.py", start = 6, end = 7 }]

[[cases]]
name = "written-escape"
comparison = "full"
files = { "case.py" = "x = \"A\\bB\"\n" }
expected = []

[[cases]]
name = "comment-only"
comparison = "full"
files = { "case.py" = "# \b\nx = \"safe\"\n" }
expected = []

[[cases]]
name = "f-string-middle"
comparison = "full"
files = { "case.py" = "x = f\"A\bB\"\n" }
expected = [{ rule = "PLE2510", file = "case.py", start = 7, end = 8 }]

[[cases]]
name = "two-occurrences-one-token"
comparison = "full"
files = { "case.py" = "x = \"A\bB\b\"\n" }
expected = [{ rule = "PLE2510", file = "case.py", start = 6, end = 7 }, { rule = "PLE2510", file = "case.py", start = 8, end = 9 }]

[[cases]]
name = "same-line-noqa"
comparison = "full"
files = { "case.py" = "x = \"A\bB\b\"  # noqa: PLE2510\n" }
expected = []

[[cases]]
name = "multiline-occurrences"
comparison = "full"
files = { "case.py" = "x = \"\"\"A\b\nB\b\"\"\"\n" }
expected = [{ rule = "PLE2510", file = "case.py", start = 8, end = 9 }, { rule = "PLE2510", file = "case.py", start = 11, end = 12 }]

[[cases]]
name = "multiline-closing-noqa"
comparison = "full"
files = { "case.py" = "x = \"\"\"A\b\nB\b\"\"\"  # noqa: PLE2510\n" }
expected = []

[[cases]]
name = "multiline-f-string-occurrences"
comparison = "full"
files = { "case.py" = "x = f\"\"\"A\b\nB\b\"\"\"\n" }
expected = [{ rule = "PLE2510", file = "case.py", start = 9, end = 10 }, { rule = "PLE2510", file = "case.py", start = 12, end = 13 }]
