[[cases]]
name = "cross-RUF015-upstream-pinned-fixture-0"
comparison = "full"
files = { "case.py" = "x = range(10)\n\n# RUF015\nlist(x)[0]\ntuple(x)[0]\nlist(i for i in x)[0]\n[i for i in x][0]\n\n# OK (not indexing (solely) the first element)\nlist(x)\nlist(x)[1]\nlist(x)[-1]\nlist(x)[1:]\nlist(x)[:3:2]\nlist(x)[::2]\nlist(x)[::]\n[i for i in x]\n[i for i in x][1]\n[i for i in x][-1]\n[i for i in x][:1]\n[i for i in x][:1:1]\n[i for i in x][:1:2]\n[i for i in x][1:]\n[i for i in x][:3:2]\n[i for i in x][::2]\n[i for i in x][::]\n\n# RUF015 (doesn't mirror the underlying list)\n[i + 1 for i in x][0]\n[i for i in x if i > 5][0]\n[(i, i + 1) for i in x][0]\n\n# RUF015 (multiple generators)\ny = range(10)\n[i + j for i in x for j in y][0]\n\n# RUF015\nlist(range(10))[0]\nlist(x.y)[0]\nlist(x[\"y\"])[0]\n[*range(10)][0]\n[*x[\"y\"]][0]\n[*x.y][0]\n[* x.y][0]\n[\n    *x.y\n][0]\n\n# RUF015 (multi-line)\nrevision_heads_map_ast = [\n    a\n    for a in revision_heads_map_ast_obj.body\n    if isinstance(a, ast.Assign) and a.targets[0].id == \"REVISION_HEADS_MAP\"\n][0]\n\n# RUF015 (zip)\nlist(zip(x, y))[0]\n[*zip(x, y)][0]\n\n# RUF015 (pop)\nlist(x).pop(0)\n[i for i in x].pop(0)\nlist(i for i in x).pop(0)\n\n# OK\nlist(x).pop(1)\nlist(x).remove(0)\nlist(x).remove(1)\n\n\ndef test():\n    zip = list  # Overwrite the builtin zip\n    list(zip(x, y))[0]\n" }
expected = []

