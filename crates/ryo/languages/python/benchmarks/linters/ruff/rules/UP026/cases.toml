[[cases]]
name = "module-before-import"
files = { "case.py" = "mock.mock.patch()\nimport mock\n" }
expected = [{ file = "case.py", start = 25, end = 29 }]

[[cases]]
name = "module-after-import"
files = { "case.py" = "import mock\nmock.mock.patch()\n" }
expected = [{ file = "case.py", start = 7, end = 11 }, { file = "case.py", start = 12, end = 21 }]

[[cases]]
name = "same-line-before"
files = { "case.py" = "mock.mock.patch(); import mock\n" }
expected = [{ file = "case.py", start = 26, end = 30 }]

[[cases]]
name = "deferred-function"
files = { "case.py" = "def f():\n    mock.mock.patch()\nimport mock\n" }
expected = [{ file = "case.py", start = 13, end = 22 }, { file = "case.py", start = 38, end = 42 }]

[[cases]]
name = "noqa"
files = { "case.py" = "mock.mock.patch()\nimport mock # noqa\n" }
expected = []

[[cases]]
name = "code-noqa"
files = { "case.py" = "mock.mock.patch()\nimport mock # noqa: UP026\n" }
expected = []

[[cases]]
name = "other-code"
files = { "case.py" = "mock.mock.patch()\nimport mock # noqa: F401\n" }
expected = [{ file = "case.py", start = 25, end = 29 }]

[[cases]]
name = "file-noqa"
files = { "case.py" = "# ruff: noqa\nmock.mock.patch()\nimport mock\n" }
expected = []
