[[cases]]
name = "tagged-upstream-fixture"
comparison = "full"
files = { "case.py" = "input = [1, 2, 3]\notherInput = [2, 3, 4]\nfoo = [1, 2, 3, 4]\n\n# OK\nzip(input, otherInput)  # different inputs\nzip(input, otherInput[1:])  # different inputs\nzip(input, input[2:])  # not successive\nzip(input[:-1], input[2:])  # not successive\nlist(zip(input, otherInput))  # nested call\nzip(input, input[1::2])  # not successive\nzip(foo[:-1], foo[1:], foo, strict=False)  # more than 2 inputs\nzip(foo[:-1], foo[1:], foo, strict=True)  # more than 2 inputs\n\n# Errors\nzip(input, input[1:])\nzip(input, input[1::1])\nzip(input[:-1], input[1:])\nzip(input[1:], input[2:])\nzip(input[1:-1], input[2:])\nlist(zip(input, input[1:]))\nlist(zip(input[:-1], input[1:]))\nzip(foo[:-1], foo[1:], strict=True)\nzip(foo[:-1], foo[1:], strict=False)\nzip(foo[:-1], foo[1:], strict=bool(foo))\n" }
expected = [{ rule = "RUF007", file = "case.py", start = 464, end = 467 }, { rule = "RUF007", file = "case.py", start = 486, end = 489 }, { rule = "RUF007", file = "case.py", start = 510, end = 513 }, { rule = "RUF007", file = "case.py", start = 537, end = 540 }, { rule = "RUF007", file = "case.py", start = 563, end = 566 }, { rule = "RUF007", file = "case.py", start = 596, end = 599 }, { rule = "RUF007", file = "case.py", start = 624, end = 627 }, { rule = "RUF007", file = "case.py", start = 652, end = 655 }, { rule = "RUF007", file = "case.py", start = 688, end = 691 }, { rule = "RUF007", file = "case.py", start = 725, end = 728 }]
