[[cases]]
name = "comment-line"
comparison = "full"
files = { "case.py" = "# \u202e hidden\n" }
expected = [{ rule = "PLE2502", file = "case.py", start = 0, end = 13 }]

[[cases]]
name = "string-line"
comparison = "full"
files = { "case.py" = "x = \"a\u2066b\"\n" }
expected = [{ rule = "PLE2502", file = "case.py", start = 0, end = 12 }]

[[cases]]
name = "two-bidi-one-line"
comparison = "full"
files = { "case.py" = "x = \"a\u202eb\u200fc\"\n" }
expected = [{ rule = "PLE2502", file = "case.py", start = 0, end = 16 }]

[[cases]]
name = "two-affected-lines"
comparison = "full"
files = { "case.py" = "# \u202e\n# \u2069\n" }
expected = [{ rule = "PLE2502", file = "case.py", start = 0, end = 6 }, { rule = "PLE2502", file = "case.py", start = 6, end = 12 }]

[[cases]]
name = "left-to-right-mark-allowed"
comparison = "full"
files = { "case.py" = "x = \"a\u200eb\"\n" }
expected = []

[[cases]]
name = "leading-spaces-crlf"
comparison = "full"
files = { "case.py" = "  # \u061c\r\npass\r\n" }
expected = [{ rule = "PLE2502", file = "case.py", start = 0, end = 8 }]

[[cases]]
name = "bare-cr"
comparison = "full"
files = { "case.py" = "x = 1\r# \u202a\rpass\r" }
expected = [{ rule = "PLE2502", file = "case.py", start = 6, end = 12 }]

[[cases]]
name = "unterminated-final-line"
comparison = "full"
files = { "case.py" = "x = 1\n# \u202b" }
expected = [{ rule = "PLE2502", file = "case.py", start = 6, end = 11 }]

[[cases]]
name = "physical-noqa"
comparison = "full"
files = { "case.py" = "x = \"\u202d\"  # noqa: PLE2502\n" }
expected = []

[[cases]]
name = "malformed-syntax-recovered"
comparison = "full"
files = { "case.py" = "if True print(1)\n# \u2068\n" }
expected = [
  { rule = "invalid-syntax", file = "case.py", start = 8, end = 13 },
  { rule = "PLE2502", file = "case.py", start = 17, end = 23 },
]
[[cases]]
name = "same-module-anchor-block-one-line"
comparison = "full"
files = { "case.py" = "# ruff: disable[PLE2502]\n# \u202e\n# ruff: enable[PLE2502]\n# \u2069\n" }
expected = [{ rule = "PLE2502", file = "case.py", start = 55, end = 61 }]

[[cases]]
name = "same-module-anchor-block-after-first"
comparison = "full"
files = { "case.py" = "# \u202e\n# ruff: disable[PLE2502]\n# \u2069\n# ruff: enable[PLE2502]\n" }
expected = [{ rule = "PLE2502", file = "case.py", start = 0, end = 6 }]

[[cases]]
name = "line-range-inside-block"
comparison = "full"
files = { "case.py" = "# ruff: disable[PLE2502]\nx = \"\u202e\"\n# ruff: enable[PLE2502]\n" }
expected = []
