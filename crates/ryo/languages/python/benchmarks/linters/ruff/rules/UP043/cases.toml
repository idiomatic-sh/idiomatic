files = { "UP043.py" = "from collections.abc import Generator, AsyncGenerator\n\n\ndef func() -> Generator[int, None, None]:\n    yield 42\n\n\ndef func() -> Generator[int, None]:\n    yield 42\n\n\ndef func() -> Generator[int]:\n    yield 42\n\n\ndef func() -> Generator[int, int, int]:\n    foo = yield 42\n    return foo\n\n\ndef func() -> Generator[int, int, None]:\n    _ = yield 42\n    return None\n\n\ndef func() -> Generator[int, None, int]:\n    yield 42\n    return 42\n\n\nasync def func() -> AsyncGenerator[int, None]:\n    yield 42\n\n\nasync def func() -> AsyncGenerator[int]:\n    yield 42\n\n\nasync def func() -> AsyncGenerator[int, int]:\n    foo = yield 42\n    return foo\n\n\nfrom typing import Generator, AsyncGenerator\n\n\ndef func() -> Generator[str, None, None]:\n    yield \"hello\"\n\n\nasync def func() -> AsyncGenerator[str, None]:\n    yield \"hello\"\n\n\nasync def func() -> AsyncGenerator[  # type: ignore\n    str,\n    None\n]:\n    yield \"hello\"\n" }
expected = [{ rule = "UP043", file = "UP043.py", start = 70, end = 96 }, { rule = "UP043", file = "UP043.py", start = 127, end = 147 }, { rule = "UP043", file = "UP043.py", start = 299, end = 324 }, { rule = "UP043", file = "UP043.py", start = 451, end = 476 }, { rule = "UP043", file = "UP043.py", start = 692, end = 718 }, { rule = "UP043", file = "UP043.py", start = 760, end = 785 }, { rule = "UP043", file = "UP043.py", start = 827, end = 878 }]

