[[cases]]
name = "tagged-flake8_simplify-SIM113.py"
comparison = "full"
files = { "case.py" = "def func():\n    # SIM113\n    idx = 0\n    for x in range(5):\n        g(x, idx)\n        idx += 1\n        h(x)\n\n\ndef func():\n    # SIM113\n    sum = 0\n    idx = 0\n    for x in range(5):\n        if g(x):\n            break\n        idx += 1\n        sum += h(x, idx)\n\n\ndef func():\n    # SIM113\n    idx = 0\n    for x, y in zip(range(5), range(5)):\n        g(x)\n        h(x, y)\n        idx += 1\n\n\ndef func():\n    # SIM113\n    idx = 0\n    sum = 0\n    for x in range(5):\n        sum += h(x, idx)\n        idx += 1\n\n\ndef func():\n    # SIM113\n    sum, idx = 0, 0\n    for x in range(5):\n        g(x, idx)\n        idx += 1\n        h(x)\n\n\ndef func():\n    # SIM113\n    # https://github.com/astral-sh/ruff/pull/21395\n    idx = 10\n    for x in range(5):\n        g(x, idx)\n        idx += 1\n        h(x)\n\n\ndef func():\n    # OK (incremented by more than 1)\n    idx = 0\n    for x in range(5):\n        g(x, idx)\n        idx += 2\n        h(x)\n\n\ndef func():\n    # OK (incremented in `if`)\n    idx = 0\n    for x in range(5):\n        if g(x):\n            idx += 1\n        h(x)\n\n\ndef func():\n    # OK (`continue` in match-case)\n    idx = 0\n    for x in range(5):\n        match g(x):\n            case 1:\n                h(x)\n            case 2:\n                continue\n            case _:\n                h(idx)\n        idx += 1\n\n\ndef func():\n    # OK (`continue` inside `with` clause)\n    idx = 0\n    for x in range(5):\n        with context as c:\n            if g(x):\n                continue\n            h(x, idx, c)\n        idx += 1\n\n\ndef func():\n    # OK (incremented in `try` block)\n    idx = 0\n    for x in range(5):\n        try:\n            g(x, idx)\n        except:\n            h(x)\n            continue\n        idx += 1\n\n\ndef func(idx: 0):\n    # OK (index is an argument)\n    for x in range(5):\n        g(x, idx)\n        idx += 1\n\n\ndef func(x: int):\n    # OK (index _may_ be non-zero)\n    if x > 0:\n        idx = 1\n    else:\n        idx = 0\n    for x in range(5):\n        g(x, idx)\n        idx += 1\n        h(x)\n\n\ndef func():\n    # OK\n    idx = 0\n    for x in range(5):\n        g(x, idx)\n        idx += 1\n        idx += 1\n        h(x)\n\n\ndef func():\n    # OK\n    idx = 0\n    for x in range(5):\n        g(x, idx)\n        idx += 1\n        if idx > 10:\n            idx *= 2\n        h(x)\n\n\ndef func():\n    # OK (index used after loop)\n    idx = 0\n    for x in range(5):\n        g(x, idx)\n        idx += 1\n        h(x)\n    print(idx)\n\n\ndef func():\n    # OK (index within nested loop)\n    idx = 0\n    for x in range(5):\n        for y in range(5):\n            g(x, idx)\n            idx += 1\n\n\ndef func():\n    # OK (index used within inner)\n    idx = 0\n\n    def inner():\n        print(idx)\n\n    for x in range(5):\n        for y in range(5):\n            g(x, idx)\n            idx += 1\n\n\ndef func():\n    # OK (index used as nonlocal inner)\n    idx = 0\n\n    def inner():\n        nonlocal idx\n        idx = 3\n\n    for x in range(5):\n        for y in range(5):\n            g(x, idx)\n            idx += 1\n\n\ndef func():\n    # SIM113 x2 (same variable name reused in sibling loops)\n    i = 0\n    for val in [1, 2, 3]:\n        print(f\"{i}: {val}\")\n        i += 1\n\n    i = 0\n    for val in [1, 2, 3]:\n        print(f\"{i}: {val}\")\n        i += 1\n\n\ndef func():\n    # SIM113 (same variable name reused after an `enumerate` loop)\n    for i, val in enumerate([1, 2, 3]):\n        print(f\"{i}: {val}\")\n\n    i = 0\n    for val in [1, 2, 3]:\n        print(f\"{i}: {val}\")\n        i += 1\n\n\nasync def func():\n    # OK (for loop is async)\n    idx = 0\n\n    async for x in async_gen():\n        g(x, idx)\n        idx += 1\n" }
expected = [{ rule = "SIM113", file = "case.py", start = 86, end = 94 }, { rule = "SIM113", file = "case.py", start = 225, end = 233 }, { rule = "SIM113", file = "case.py", start = 376, end = 384 }, { rule = "SIM113", file = "case.py", start = 492, end = 500 }, { rule = "SIM113", file = "case.py", start = 597, end = 605 }, { rule = "SIM113", file = "case.py", start = 3116, end = 3122 }, { rule = "SIM113", file = "case.py", start = 3197, end = 3203 }, { rule = "SIM113", file = "case.py", start = 3428, end = 3434 }]

