name = "upstream-UP040.pyi"
files = { "UP040.pyi" = "import typing\nfrom typing import TypeAlias\n\n# UP040\n# Fixes in type stub files should be safe to apply unlike in regular code where runtime behavior could change\nx: typing.TypeAlias = int\nx: TypeAlias = int\n\n\n# comments in the value are preserved\nx: TypeAlias = tuple[\n    int,  # preserved\n    float,\n]\n\nT: TypeAlias = ( # comment0\n    # comment1\n    int  # comment2\n    # comment3\n    | # comment4\n    # comment5\n    str  # comment6\n    # comment7\n) # comment8\n" }
expected = [{ rule = "UP040", file = "UP040.pyi", start = 162, end = 187 }, { rule = "UP040", file = "UP040.pyi", start = 188, end = 206 }, { rule = "UP040", file = "UP040.pyi", start = 247, end = 303 }, { rule = "UP040", file = "UP040.pyi", start = 305, end = 451 }]

