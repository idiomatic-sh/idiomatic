[[cases]]
name = "upstream-UP014.py"
files = { "UP014.py" = "from typing import NamedTuple\nimport typing\n\n# with complex annotations\nMyType = NamedTuple(\"MyType\", [(\"a\", int), (\"b\", tuple[str, ...])])\n\n# with namespace\nMyType = typing.NamedTuple(\"MyType\", [(\"a\", int), (\"b\", str)])\n\n# invalid identifiers (OK)\nMyType = NamedTuple(\"MyType\", [(\"x-y\", int), (\"b\", tuple[str, ...])])\n\n# no fields\nMyType = typing.NamedTuple(\"MyType\")\n\n# empty fields\nMyType = typing.NamedTuple(\"MyType\", [])\n\n# keywords\nMyType = typing.NamedTuple(\"MyType\", a=int, b=tuple[str, ...])\n\n# unfixable\nMyType = typing.NamedTuple(\"MyType\", [(\"a\", int)], [(\"b\", str)])\nMyType = typing.NamedTuple(\"MyType\", [(\"a\", int)], b=str)\nMyType = typing.NamedTuple(typename=\"MyType\", a=int, b=str)\n\n# Regression test for: https://github.com/astral-sh/ruff/issues/8402#issuecomment-1788787357\nS3File = NamedTuple(\n    \"S3File\",\n    [\n        (\"dataHPK\",* str),\n    ],\n)\n\n# Unsafe fix if comments are present\nX = NamedTuple(\"X\", [\n    (\"some_config\", int),  # important\n])\n\n" }
expected = [{ rule = "UP014", file = "UP014.py", start = 72, end = 139 }, { rule = "UP014", file = "UP014.py", start = 158, end = 220 }, { rule = "UP014", file = "UP014.py", start = 332, end = 368 }, { rule = "UP014", file = "UP014.py", start = 385, end = 425 }, { rule = "UP014", file = "UP014.py", start = 438, end = 500 }, { rule = "UP014", file = "UP014.py", start = 906, end = 969 }]

