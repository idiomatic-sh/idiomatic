[[cases]]
name = "snake-case-type-alias"
files = { "case.pyi" = "from typing import TypeAlias\nfoo: TypeAlias = int\n" }
expected = [{ file = "case.pyi", start = 29, end = 32 }]

[[cases]]
name = "leading-underscore-snake-case"
files = { "case.pyi" = "from typing import TypeAlias\n_foo: TypeAlias = int\n" }
expected = [{ file = "case.pyi", start = 29, end = 33 }]

[[cases]]
name = "class-name-control"
files = { "case.pyi" = "from typing import TypeAlias\nFoo: TypeAlias = int\n" }
expected = []

[[cases]]
name = "ordinary-variable-control"
files = { "case.pyi" = "foo: int = 1\n" }
expected = []

[[cases]]
name = "runtime-file-alias"
files = { "case.py" = "from typing import TypeAlias\nfoo: TypeAlias = int\n" }
expected = [{ file = "case.py", start = 29, end = 32 }]

[[cases]]
name = "noqa-control"
files = { "case.pyi" = "from typing import TypeAlias\nfoo: TypeAlias = int  # noqa: PYI042\n" }
expected = []

[[cases]]
name = "typing-extensions-import-alias"
files = { "case.pyi" = "from typing_extensions import TypeAlias as TA\nfoo: TA = int\n" }
expected = [{ file = "case.pyi", start = 46, end = 49 }]

[[cases]]
name = "shadowed-typealias-control"
files = { "case.pyi" = "TypeAlias = object\nfoo: TypeAlias = int\n" }
expected = []
