[[cases]]
name="ruf041-tagged-RUF041-py"
comparison="full"
files={"case.py"="from typing import Literal\nimport typing as t\nimport typing_extensions\n\n\ny: Literal[1, print(\"hello\"), 3, Literal[4, 1]]\nLiteral[1, Literal[1]]\nLiteral[1, 2, Literal[1, 2]]\nLiteral[1, Literal[1], Literal[1]]\nLiteral[1, Literal[2], Literal[2]]\nt.Literal[1, t.Literal[2, t.Literal[1]]]\nLiteral[\n    1, # comment 1\n    Literal[ # another comment\n        1 # yet another comment\n    ]\n]  # once\n\n# Ensure issue is only raised once, even on nested literals\nMyType = Literal[\"foo\", Literal[True, False, True], \"bar\"]\n\n# nested literals, all equivalent to `Literal[1]`\nLiteral[Literal[1]]\nLiteral[Literal[Literal[1], Literal[1]]]\nLiteral[Literal[1], Literal[Literal[Literal[1]]]]\n\n# OK\nx: Literal[True, False, True, False]\nz: Literal[{1, 3, 5}, \"foobar\", {1,3,5}]\ntyping_extensions.Literal[1, 1, 1]\nn: Literal[\"No\", \"duplicates\", \"here\", 1, \"1\"]\n"}
expected=[{rule="RUF041", file="case.py", start=76, end=120}, {rule="RUF041", file="case.py", start=121, end=143}, {rule="RUF041", file="case.py", start=144, end=172}, {rule="RUF041", file="case.py", start=173, end=207}, {rule="RUF041", file="case.py", start=208, end=242}, {rule="RUF041", file="case.py", start=243, end=283}, {rule="RUF041", file="case.py", start=284, end=382}, {rule="RUF041", file="case.py", start=461, end=510}, {rule="RUF041", file="case.py", start=562, end=581}, {rule="RUF041", file="case.py", start=582, end=622}, {rule="RUF041", file="case.py", start=623, end=672}]

