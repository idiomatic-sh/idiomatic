[[cases]]
name = "rooted-multiple-comprehensions-and-owner-order"
files = { "case.py" = "async def f(items):\n    await work()\n    a = any([call(deep(x)) for x in items])\n    b = all({call(x) for x in items})\n    return a,b\n" }
expected = [{ "rule" = "C419", "file" = "case.py", "start" = 49, "end" = 79 }, { "rule" = "C419", "file" = "case.py", "start" = 93, "end" = 117 }]

[[cases]]
name = "rooted-unicode-multiline-elt"
files = { "case.py" = "async def f(items):\n    await work()\n    return any([\n        call(café)\n        for café in items\n    ])\n" }
expected = [{ "rule" = "C419", "file" = "case.py", "start" = 52, "end" = 106 }]

[[cases]]
name = "rooted-two-files-reused-identities"
files = { "a.py" = "async def f(items):\n    return any([await work(x) for x in items])\n", "b.py" = "async def f(items):\n    await work()\n    return any([call(deep(x)) for x in items])\n" }
expected = [{ "rule" = "C419", "file" = "b.py", "start" = 52, "end" = 82 }]

