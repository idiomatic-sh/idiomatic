[[cases]]
name = "direct"
comparison = "full"
files = { "case.py" = "import itertools\nitertools.starmap(function, zip(values))\n" }
expected = [{ rule = "RUF058", file = "case.py", start = 17, end = 57 }]

[[cases]]
name = "from-alias"
comparison = "full"
files = { "case.py" = "from itertools import starmap as sm\nsm(function, zip(values))\n" }
expected = [{ rule = "RUF058", file = "case.py", start = 36, end = 61 }]

[[cases]]
name = "zip-alias"
comparison = "full"
files = { "case.py" = "import itertools\nfrom builtins import zip as z\nitertools.starmap(function, z(values))\n" }
expected = [{ rule = "RUF058", file = "case.py", start = 47, end = 85 }]

[[cases]]
name = "one-starred"
comparison = "full"
files = { "case.py" = "import itertools\nitertools.starmap(function, zip(*values, extra))\n" }
