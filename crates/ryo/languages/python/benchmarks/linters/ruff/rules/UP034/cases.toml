[[cases]]
name = "nested-list"
comparison = "full"
files = { "case.py" = "f(([1,2]))\n" }
expected = [{ "rule" = "UP034", "file" = "case.py", "start" = 2, "end" = 9 }]

[[cases]]
name = "suppressed"
comparison = "full"
files = { "case.py" = "f((x))  # noqa: UP034\n" }
expected = []

[[cases]]
name = "unicode-span"
comparison = "full"
files = { "case.py" = "é = f((\"💣\"))\n" }
expected = [{ "rule" = "UP034", "file" = "case.py", "start" = 7, "end" = 15 }]

[[cases]]
name = "fstring-middle-yield-is-not-keyword"
files = { "case.py" = "f((f\"yield\"))\n" }
expected = [{ rule = "UP034", file = "case.py", start = 2, end = 12 }]

[[cases]]
name = "interpolated-fstring-middle-yield-is-not-keyword"
files = { "case.py" = "f((f\"{a}yield\"))\n" }
expected = [{ rule = "UP034", file = "case.py", start = 2, end = 15 }]
