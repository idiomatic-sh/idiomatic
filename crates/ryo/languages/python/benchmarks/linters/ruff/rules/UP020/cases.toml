[[cases]]
name = "direct-call"
comparison = "full"
files = { "case.py" = "import io\nio.open(\"file\")\n" }
expected = [{ rule = "UP020", file = "case.py", start = 10, end = 25 }]

[[cases]]
name = "module-alias"
comparison = "full"
files = { "case.py" = "import io as streams\nstreams.open(\"file\")\n" }
expected = [{ rule = "UP020", file = "case.py", start = 21, end = 41 }]

[[cases]]
name = "from-import"
comparison = "full"
files = { "case.py" = "from io import open\nopen(\"file\")\n" }
expected = [{ rule = "UP020", file = "case.py", start = 20, end = 32 }]

[[cases]]
name = "from-alias"
comparison = "full"
files = { "case.py" = "from io import open as open_file\nopen_file(\"file\")\n" }
expected = [{ rule = "UP020", file = "case.py", start = 33, end = 50 }]

[[cases]]
name = "keyword-call"
comparison = "full"
files = { "case.py" = "import io\nio.open(file=\"x\", mode=\"r\")\n" }
expected = [{ rule = "UP020", file = "case.py", start = 10, end = 37 }]

[[cases]]
name = "wrong-module"
comparison = "full"
files = { "case.py" = "import os as io\nio.open(\"file\")\n" }
expected = []

[[cases]]
name = "ordinary-open"
comparison = "full"
files = { "case.py" = "open(\"file\")\n" }
expected = []

[[cases]]
name = "other-attribute"
comparison = "full"
files = { "case.py" = "obj.open(\"file\")\n" }
expected = []

[[cases]]
name = "noqa"
comparison = "full"
files = { "case.py" = "import io\nio.open(\"file\")  # noqa: UP020\n" }
expected = []

[[cases]]
name = "file-noqa"
comparison = "full"
files = { "case.py" = "# ruff: noqa: UP020\nimport io\nio.open(\"file\")\n" }
expected = []

[[cases]]
name = "multiple"
comparison = "full"
files = { "case.py" = "import io\nfirst = io.open(\"a\")\nsecond = io.open(\"b\")\n" }
expected = [{ rule = "UP020", file = "case.py", start = 18, end = 30 }, { rule = "UP020", file = "case.py", start = 40, end = 52 }]
