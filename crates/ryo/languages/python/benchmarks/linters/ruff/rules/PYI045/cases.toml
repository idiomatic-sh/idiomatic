[[cases]]
name = "iter-direct-import"
comparison = "full"
files = { "case.pyi" = "from typing import Iterable\nclass C:\n    def __iter__(self) -> Iterable: ...\n" }
expected = [{ rule = "PYI045", file = "case.pyi", start = 63, end = 71 }]

[[cases]]
