name = "other-call"
files = { "case.py" = "import logging\nlogging.info(__file__)\n" }
expected = []

[[cases]]
name = "other-name"
files = { "case.py" = "import logging\nlogging.getLogger(filename=__file__)\n" }
expected = []

[[cases]]
name = "string-value"
files = { "case.py" = "import logging\nlogging.getLogger(\"__file__\")\n" }
