[[cases]]
name = "direct"
files = { "case.py" = "import logging\nlogging.getLogger(__file__)\n" }
expected = [{ rule = "LOG002", file = "case.py", start = 33, end = 41 }]

[[cases]]
name = "cached"
files = { "case.py" = "import logging\nlogging.getLogger(__cached__)\n" }
expected = [{ rule = "LOG002", file = "case.py", start = 33, end = 43 }]

[[cases]]
name = "keyword"
files = { "case.py" = "import logging\nlogging.getLogger(name=__file__)\n" }
expected = [{ rule = "LOG002", file = "case.py", start = 38, end = 46 }]

[[cases]]
name = "alias"
files = { "case.py" = "import logging as log\nlog.getLogger(__file__)\n" }
expected = [{ rule = "LOG002", file = "case.py", start = 36, end = 44 }]

[[cases]]
name = "from-import"
files = { "case.py" = "from logging import getLogger\ngetLogger(__file__)\n" }
expected = [{ rule = "LOG002", file = "case.py", start = 40, end = 48 }]

