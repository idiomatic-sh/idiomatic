
[[cases]]
name = "tagged-ruff-0-16-5-RET501"
comparison = "full"
files = { "case.py" = "def x(y):\n    if not y:\n        return\n    return None  # error\n\n\nclass BaseCache:\n    def get(self, key: str) -> str | None:\n        print(f\"{key} not found\")\n        return None\n\n    def get(self, key: str) -> None:\n        print(f\"{key} not found\")\n        return None\n\n    @property\n    def prop(self) -> None:\n        print(\"Property not found\")\n        return None\n\n\nfrom functools import cached_property\n\n\nclass BaseCache2:\n    @cached_property\n    def prop(self) -> None:\n        print(\"Property not found\")\n        return None\n\n\nimport abc\nimport enum\nimport types\n\n\nclass Baz:\n    @abc.abstractproperty\n    def prop2(self) -> None:\n        print(\"Override me\")\n        return None\n\n    @types.DynamicClassAttribute\n    def prop3(self) -> None:\n        print(\"Gotta make this a multiline function for it to be a meaningful test\")\n        return None\n\n    @enum.property\n    def prop4(self) -> None:\n        print(\"I've run out of things to say\")\n        return None\n\n\n# https://github.com/astral-sh/ruff/issues/18774\nclass _:\n    def foo(bar):\n        if not bar:\n            return\n        return (\n            None # comment\n        )\n" }
expected = [{ rule = "RET501", file = "case.py", start = 43, end = 54 }, { rule = "RET501", file = "case.py", start = 260, end = 271 }, { rule = "RET501", file = "case.py", start = 1100, end = 1145 }]

