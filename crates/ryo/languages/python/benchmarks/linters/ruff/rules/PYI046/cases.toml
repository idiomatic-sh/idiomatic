[[cases]]
name = "subscripted_protocol_unused"
files = { "case.py" = "from typing import Protocol, TypeVar\n_T = TypeVar(\"_T\")\nclass _Baz(Protocol[_T]):\n    x: _T\n" }
expected = [{ file = "case.py", start = 62, end = 66 }]

[[cases]]
name = "subscripted_protocol_unused_stub"
files = { "case.pyi" = "from typing import Protocol, TypeVar\n_T = TypeVar(\"_T\")\nclass _Baz(Protocol[_T]):\n    x: _T\n" }
