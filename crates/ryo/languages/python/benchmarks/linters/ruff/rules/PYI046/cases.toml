[[cases]]
name = "private-protocol-imported"
comparison = "full"
files = { "case.pyi" = "from typing import Protocol\nclass _Private(Protocol): ...\n" }
expected = [{ rule = "PYI046", file = "case.pyi", start = 34, end = 42 }]

[[cases]]
name = "private-protocol-qualified-alias"
comparison = "full"
files = { "case.pyi" = "import typing as t\nclass _Private(t.Protocol): ...\n" }
expected = [{ rule = "PYI046", file = "case.pyi", start = 25, end = 33 }]

