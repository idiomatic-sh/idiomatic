[[cases]]
name = "double_underscore_subscripted_protocol_unused"
files = { "case.py" = "from typing import Protocol, TypeVar\nT_co = TypeVar(\"T_co\", covariant=True)\nclass __SupportsInt(Protocol[T_co]):\n    def __int__(self) -> int: pass\n" }
expected = [{ file = "case.py", start = 82, end = 95 }]

