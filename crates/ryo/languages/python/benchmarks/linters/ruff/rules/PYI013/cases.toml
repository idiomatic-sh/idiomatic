[[cases]]
name = "two-ellipses"
files = { "case.pyi" = "class C:\n    ...\n    ...\n" }
expected = [{"file" = "case.pyi", "start" = 13, "end" = 16}, {"file" = "case.pyi", "start" = 21, "end" = 24}]

