# Directive cases follow the pinned lexer: astral-sh/ruff@0.16.5, crates/ruff_linter/src/noqa.rs.
# A malformed joined code invalidates the directive; a separated non-code starts trailing commentary.

[[cases]]
name = "squashed-code-list-target-last"
files = { "case.py" = "try:\n    pass\nexcept:  # noqa: F401E722\n    pass\n" }
expected = []

[[cases]]
name = "squashed-invalid-code-rejects-all"
files = { "case.py" = "try:\n    pass\nexcept:  # noqa: E722Ffoo\n    pass\n" }
expected = [{ file = "case.py", start = 14, end = 20 }]

[[cases]]
name = "separated-uppercase-tail-is-comment"
files = { "case.py" = "try:\n    pass\nexcept:  # noqa: E722 Ffoo\n    pass\n" }
expected = []

