[[cases]]
name = "bare-handler"
files = { "case.py" = "try:\n    pass\nexcept:\n    pass\n" }
expected = [{ file = "case.py", start = 14, end = 20 }]

[[cases]]
name = "typed-handler"
files = { "case.py" = "try:\n    pass\nexcept Exception:\n    pass\n" }
expected = []

[[cases]]
name = "unicode-before-handler"
files = { "case.py" = "label = \"é\"\ntry:\n    pass\nexcept:\n    pass\n" }
expected = [{ file = "case.py", start = 27, end = 33 }]

[[cases]]
name = "direct-reraise"
files = { "case.py" = "try:\n    pass\nexcept:\n    raise\n" }
expected = []

[[cases]]
name = "raising-new-exception"
files = { "case.py" = "try:\n    pass\nexcept:\n    raise ValueError()\n" }
