[[cases]]
name = "literal-default-sep"
comparison = "full"
files = { "case.py" = "\"a b c\".split()\n" }
expected = [{ rule = "SIM905", file = "case.py", start = 0, end = 15 }]

[[cases]]
name = "literal-sep"
comparison = "full"
files = { "case.py" = "\"a,b,c\".split(\",\")\n" }
expected = [{ rule = "SIM905", file = "case.py", start = 0, end = 18 }]

[[cases]]
name = "literal-maxsplit"
comparison = "full"
files = { "case.py" = "\"a,b,c\".split(\",\", 1)\n" }
expected = [{ rule = "SIM905", file = "case.py", start = 0, end = 21 }]

[[cases]]
name = "rsplit-maxsplit"
comparison = "full"
files = { "case.py" = "\"a,b,c\".rsplit(\",\", -1)\n" }
expected = [{ rule = "SIM905", file = "case.py", start = 0, end = 23 }]

[[cases]]
name = "keyword-maxsplit"
comparison = "full"
files = { "case.py" = "\"a b c\".split(maxsplit=1)\n" }
expected = [{ rule = "SIM905", file = "case.py", start = 0, end = 25 }]

[[cases]]
name = "keyword-sep-maxsplit"
comparison = "full"
files = { "case.py" = "\"a,b,c\".split(sep=\",\", maxsplit=1)\n" }
expected = [{ rule = "SIM905", file = "case.py", start = 0, end = 34 }]

[[cases]]
name = "dynamic-maxsplit"
