closed = false
# The python language's own placement (paths are directory-relative).
# The parser crates python reads with are declared here, once, as the variable `libraries`: `imports-allow` adds them to the language's
# allow-list, and its own `client-at-adapter` below keeps them in its syntax adapter. Its own Cargo.toml names them, and nothing else does.
variables = { domain-libraries = ["indexmap::*", "unicode_properties::*"], libraries = ["ruff_python_parser::*", "ruff_python_ast::*", "ruff_text_size::*", "toml::*", "serde::*", "postcard::*"] }
imports-allow = [{ variable = "libraries" }, { variable = "domain-libraries" }]
rules = [
  { rule = "idiomatic.ryo/source-import-allowlist", include = ["tastemaker.toml", "src/tastemaker.toml"] },
  { rule = "idiomatic.arch/client-at-adapter", include = ["**"], exclude = ["**/*_test.rs", "**/test.rs", "**/*_test/**", "**/fixtures/**", "**/fixtures.rs", "**/tests/**"], params = { libraries = { variable = "libraries" } } },
  { rule = "idiomatic.arch/no-library-types-at-boundary", include = ["src/**/*.rs"], params = { libraries = { variable = "libraries" }, domain-libraries = { variable = "domain-libraries" }, contracts = ["ryo::*"] } },
]
