[project]
name = "Root_Pkg"
dependencies = ["Lib-One>=1.0", "requests[security]>=2 ; python_version >= '3.9'", "wheel @ https://example.com/wheel-1.0.tar.gz"]
[project.optional-dependencies]
docs = ["lib.two"]
[dependency-groups]
dev = ["pytest", "lib-one"]
[build-system]
requires = ["setuptools>=61"]
[tool.uv]
override-dependencies = ["numpy==2.2.0"]
[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/skip"]
[tool.uv.sources]
requests = { git = "https://github.com/psf/requests", tag = "v2.32.0" }
lib-one = { workspace = true }
