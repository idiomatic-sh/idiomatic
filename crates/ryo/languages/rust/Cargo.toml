[package]
name = "idiomatic-sh-ryo-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Rust language provider for Ryo"
keywords = ["rust", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]
autobenches = false
autotests = false

[lib]
name = "ryo_rust"

[dependencies]
thiserror.workspace = true
toml.workspace = true
serde.workspace = true
globset.workspace = true
rayon.workspace = true
strum.workspace = true
cargo-platform.workspace = true
postcard.workspace = true
ra_ap_syntax = "=0.0.347"
ra_ap_parser = "=0.0.347"
# Not named by any source: the pin a consumer's own resolution inherits. ra-ap-rustc_lexer 0.166.0 refuses to compile when
# unicode-ident and unicode-properties 0.1.4 carry different Unicode versions, which unicode-ident 1.0.27 does.
unicode-ident = "=1.0.24"
# The same pin for unicode-properties: 0.1.5 (2026-10-31) carries a Unicode version unicode-ident 1.0.24 does not, so a fresh
# resolution fails ra-ap-rustc_lexer's check. It comes out once upstream agrees again.
rustc-literal-escaper = "=0.0.7"
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.2.0" }

[dev-dependencies]
object.workspace = true
serde_json.workspace = true
# Shared vector executor and in-process query compiler, only for the benchmark.
regex = "1"

ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
tempfile.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-rust = { path = ".", features = ["fixtures"] }

[[test]]
name = "numbered"
harness = false

[[test]]
name = "routes"
harness = false



[features]
# Instruments and widens the benchmark pair program for cost measurements.
pair-diagnostics = []
# Test support, not a public API: it may change without notice. Only a dev-dependency or this crate's own `fixtures` switches it on (`fixtures-feature`).
fixtures = ["ryo/fixtures"]

[package.metadata.cargo-machete]
# The two Unicode pins above are named by no source on purpose: they are the versions a consumer's fresh resolution inherits.
ignored = ["unicode-ident", "unicode-properties"]

[lints]
workspace = true

# Established generated parser timing identities; native CPU/RSS are not inferred from Divan.
[package.metadata.ryo.performance]
schema = "divan-timing/v1"
workloads = { generated_every_relation = [2500, 10000] }
metrics = ["median-ns"]

[[test]]
name = "conformance"
harness = false
