[package]
name = "idiomatic-sh-ryo-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Rust language provider for Ryo"
keywords = ["rust", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]
autobenches = false
autotests = false

[lib]
name = "ryo_rust"

[dependencies]
thiserror.workspace = true
toml.workspace = true
serde.workspace = true
globset.workspace = true
rayon.workspace = true
strum.workspace = true
cargo-platform.workspace = true
postcard.workspace = true
ra_ap_syntax = "=0.0.347"
ra_ap_parser = "=0.0.347"
# Not named by any source: the pin a consumer's own resolution inherits. ra-ap-rustc_lexer 0.166.0 refuses to compile when
# unicode-ident and unicode-properties 0.1.4 carry different Unicode versions, which unicode-ident 1.0.27 does.
unicode-ident = "=1.0.24"
# The same pin for unicode-properties: 0.1.5 (2026-10-31) carries a Unicode version unicode-ident 1.0.24 does not, so a fresh
# resolution fails ra-ap-rustc_lexer's check. It comes out once upstream agrees again.
unicode-properties = "=0.1.4"
rustc-literal-escaper = "=0.0.7"
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.1.2" }

[dev-dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
divan.workspace = true
tempfile.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-rust = { path = ".", features = ["fixtures"] }

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false


[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
fixtures = ["ryo/fixtures"]

[lints]
workspace = true

# The crate names itself as a dev-dependency to switch its own `fixtures` feature on for its tests: no source names it. Its `harness = false` test targets use dhat, which machete does not see. unicode-ident and unicode-properties are version pins no source names.
[package.metadata.cargo-machete]
ignored = ["idiomatic-sh-ryo-rust", "dhat", "unicode-ident", "unicode-properties"]
