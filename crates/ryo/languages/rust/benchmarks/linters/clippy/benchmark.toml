# Rules that read a doc comment as Markdown (lists, footnotes, reference definitions, code blocks): no relation holds a doc
# comment's Markdown tree.
doc_markdown = [
  "doc_lazy_continuation",
  "doc_nested_refdefs",
  "doc_overindented_list_items",
  "doc_suspicious_footnotes",
  "needless_doctest_main",
  "test_attr_in_doctest",
]
# Rules over the crate's module tree: a file loaded twice, a redundant single-segment import, and two that skip the items the
# crate does not export (`effective_visibilities.is_exported`); a declared `pub` is not reachability from the crate root.
module_tree = [
  "duplicate_mod",
  "missing_safety_doc",
  "single_component_path_imports",
  "upper_case_acronyms",
]
# Rules that read the package's `rust-version` (clippy's MSRV), which no Rust relation answers: approx_constant needs 1.94 for
# `EULER_GAMMA` and `GOLDEN_RATIO`, collapsible_if 1.88 for let chains.
msrv = [
  "approx_constant",
  "collapsible_if",
]
# Reported on Cargo.toml's `[lints]` table, a file the worker does not read as Rust.
manifest_lints = [
  "lint_groups_priority",
]
# Its default threshold is 0, which turns it off: a plain run never reports it.
off_by_default_configuration = [
  "excessive_nesting",
]
