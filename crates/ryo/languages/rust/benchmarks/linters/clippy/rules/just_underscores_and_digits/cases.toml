[[cases]]
name = "let-binding"
files = { "src/lib.rs" = "pub fn f() -> i32 {\n    let _1 = 1;\n    let __ = 2;\n    let _1_2 = 3;\n    _1 + __ + _1_2\n}\n" }
expected = [{ file = "src/lib.rs", start = 28, end = 30 }, { file = "src/lib.rs", start = 44, end = 46 }, { file = "src/lib.rs", start = 60, end = 64 }]

[[cases]]
name = "parameters"
files = { "src/lib.rs" = "pub fn f(_1: i32, ___: i32, _a1: i32, x_: i32) -> i32 {\n    _1 + ___ + _a1 + x_\n}\n" }
expected = [{ file = "src/lib.rs", start = 9, end = 11 }, { file = "src/lib.rs", start = 18, end = 21 }]

[[cases]]
name = "match-arms-and-nested-patterns"
files = { "src/lib.rs" = "pub fn f(mut v: Option<(i32, i32)>) -> i32 {\n    match v {\n        Some((_0, ref mut _9)) => _0 + *_9,\n        None => 0,\n    }\n}\npub fn g(v: &[i32]) -> i32 {\n    let [_1, rest @ ..] = v else { return 0 };\n    let &[_2] = rest else { return 0 };\n    _1 + _2\n}\n" }
expected = [{ file = "src/lib.rs", start = 73, end = 75 }, { file = "src/lib.rs", start = 85, end = 87 }, { file = "src/lib.rs", start = 168, end = 170 }, { file = "src/lib.rs", start = 216, end = 218 }]

[[cases]]
name = "conditions-loops-and-closures"
files = { "src/lib.rs" = "pub fn f(v: Option<i32>) -> i32 {\n    if let Some(_1) = v {\n        return _1;\n    }\n    while let Some(_2) = v {\n        return _2;\n    }\n    for _3 in 0..1 {\n        return _3;\n    }\n    let c = |_4: i32| {\n        let _5 = _4;\n        _5\n    };\n    c(0)\n}\n" }
expected = [{ file = "src/lib.rs", start = 221, end = 223 }]

[[cases]]
name = "struct-patterns-and-alternatives"
files = { "src/lib.rs" = "pub struct P {\n    pub a: i32,\n    pub b: i32,\n}\npub enum E {\n    A(i32, i32),\n    B(i32, i32),\n}\npub fn f(p: P, e: E) -> i32 {\n    let P { a: _1, b } = p;\n    let (E::A(_2, _3) | E::B(_3, _2)) = e;\n    _1 + b + _2 + _3\n}\npub fn g(e: E) -> i32 {\n    match e {\n        E::A(_4, x) | E::B(x, _4) => _4 + x,\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 143, end = 145 }, { file = "src/lib.rs", start = 170, end = 172 }, { file = "src/lib.rs", start = 174, end = 176 }, { file = "src/lib.rs", start = 273, end = 275 }]

[[cases]]
name = "subpatterns"
files = { "src/lib.rs" = "pub fn f(v: Option<i32>) -> i32 {\n    match v {\n        _1 @ Some(_) => _1.unwrap_or(0),\n        x @ None => x.unwrap_or(1),\n    }\n}\npub fn g(v: Option<i32>) -> i32 {\n    match v {\n        x @ Some(_2) => x.unwrap_or(_2),\n        None => 0,\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 56, end = 58 }]

[[cases]]
name = "methods-traits-and-tests"
files = { "src/lib.rs" = "pub struct S;\nimpl S {\n    pub fn m(&self, _1: i32) -> i32 {\n        let _2 = _1;\n        _2\n    }\n}\npub trait T {\n    fn provided(&self, _3: i32) -> i32 {\n        let _4 = _3;\n        _4\n    }\n    fn required(&self, _5: i32);\n}\nimpl T for S {\n    fn required(&self, _6: i32) {\n        let _7 = _6;\n        drop(_7);\n    }\n}\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn t() {\n        let _8 = 1;\n        assert_eq!(_8, 1);\n    }\n    fn helper() -> i32 {\n        let _9 = 1;\n        _9\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 43, end = 45 }, { file = "src/lib.rs", start = 73, end = 75 }, { file = "src/lib.rs", start = 267, end = 269 }, { file = "src/lib.rs", start = 290, end = 292 }, { file = "src/lib.rs", start = 387, end = 389 }, { file = "src/lib.rs", start = 465, end = 467 }]

[[cases]]
name = "nested-items-and-consts"
files = { "src/lib.rs" = "pub const C: i32 = {\n    let _1 = 1;\n    _1\n};\npub fn f() -> i32 {\n    const D: i32 = {\n        let _2 = 2;\n        _2\n    };\n    fn inner(_3: i32) -> i32 {\n        _3\n    }\n    let k = async {\n        let _4 = 4;\n        _4\n    };\n    drop(k);\n    inner(D)\n}\n" }
expected = [{ file = "src/lib.rs", start = 139, end = 141 }, { file = "src/lib.rs", start = 206, end = 208 }]

