[[cases]]
name = "shift-of-sum"
files = { "src/lib.rs" = "pub fn f(a: u32) -> (u32, u32, u32) {\n    (1 << 2 + a, a + 2 << 3, a * 2 >> 1)\n}\n" }
expected = [{ file = "src/lib.rs", start = 43, end = 53 }, { file = "src/lib.rs", start = 55, end = 65 }, { file = "src/lib.rs", start = 67, end = 77 }]

[[cases]]
name = "mask-of-arithmetic"
files = { "src/lib.rs" = "pub fn f(a: u32, b: u32) -> (u32, u32, u32) {\n    (a & b + 1, a | b * 2, a - 1 ^ b)\n}\n" }
expected = [{ file = "src/lib.rs", start = 51, end = 60 }, { file = "src/lib.rs", start = 62, end = 71 }, { file = "src/lib.rs", start = 73, end = 82 }]

[[cases]]
name = "parenthesized"
files = { "src/lib.rs" = "pub fn f(a: u32) -> (u32, u32, u32) {\n    ((1 << 2) + a, (a + 2) << 3, a & (a + 1))\n}\n" }
expected = []

[[cases]]
name = "bits-only"
files = { "src/lib.rs" = "pub fn f(a: u32, b: u32) -> (u32, u32, u32) {\n    (a & b << 1, a >> 1 | b, 1 << 2 << a)\n}\n" }
expected = []

[[cases]]
name = "both-sides"
files = { "src/lib.rs" = "pub fn f(a: u32, b: u32) -> (u32, u32, u32) {\n    (a + 1 << b - 1, a + 1 & b << 1, a << 1 | b << 2)\n}\n" }
expected = [{ file = "src/lib.rs", start = 51, end = 65 }, { file = "src/lib.rs", start = 67, end = 81 }]

[[cases]]
name = "in-constants"
files = { "src/lib.rs" = "pub const X: u32 = 1 << 2 + 1;\npub fn f() -> [u8; 1 << 1 + 1] {\n    [0; 1 << 1 + 1]\n}\n" }
expected = [{ file = "src/lib.rs", start = 19, end = 29 }, { file = "src/lib.rs", start = 50, end = 60 }, { file = "src/lib.rs", start = 72, end = 82 }]

[[cases]]
name = "arithmetic-only"
files = { "src/lib.rs" = "pub fn f(a: u32, b: u32) -> u32 {\n    a + b * 2 - a / 2 % b\n}\n" }
expected = []

[[cases]]
name = "nested"
files = { "src/lib.rs" = "pub fn f(a: u32, b: u32) -> u32 {\n    a | b << a + 1\n}\n" }
expected = [{ file = "src/lib.rs", start = 42, end = 52 }]

[[cases]]
name = "negated-method"
files = { "src/lib.rs" = "pub fn f() -> f64 {\n    -1.0_f64.abs()\n}\n" }
expected = []

[[cases]]
name = "compound-assignment"
files = { "src/lib.rs" = "pub fn f(mut a: u32) -> u32 {\n    a <<= 1 + 1;\n    a &= a + 1;\n    a\n}\n" }
expected = []

[[cases]]
name = "allowed-by-name"
files = { "src/lib.rs" = "#[allow(clippy::precedence)]\npub fn f(a: u32) -> u32 {\n    1 << 2 + a\n}\n" }
expected = []

[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::complexity)]\npub fn f(a: u32) -> u32 {\n    1 << 2 + a\n}\n#[allow(clippy::all)]\npub fn g(a: u32) -> u32 {\n    1 << 2 + a\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
files = { "src/lib.rs" = "#![allow(clippy::precedence)]\npub fn f(a: u32) -> u32 {\n    1 << 2 + a\n}\n" }
expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::complexity)]\n#[warn(clippy::precedence)]\npub fn f(a: u32) -> u32 {\n    1 << 2 + a\n}\npub fn g(a: u32) -> u32 {\n    1 << 2 + a\n}\n" }
expected = [{ file = "src/lib.rs", start = 88, end = 98 }]
