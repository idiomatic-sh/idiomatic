[[cases]]
name = "less-minus"
files = { "src/lib.rs" = "pub fn f(a: i32) -> bool {\n    a >- 1\n}\n" }
expected = [{ file = "src/lib.rs", start = 32, end = 36 }]

[[cases]]
name = "and-not"
files = { "src/lib.rs" = "pub fn f(a: bool, b: bool) -> bool {\n    a &&! b\n}\n" }
expected = [{ file = "src/lib.rs", start = 42, end = 47 }]

[[cases]]
name = "plus-minus-and-deref"
files = { "src/lib.rs" = "pub fn f(a: i32, r: &i32) -> (i32, i32) {\n    (a +- 1, a -* r)\n}\n" }
expected = [{ file = "src/lib.rs", start = 48, end = 52 }, { file = "src/lib.rs", start = 56, end = 60 }]

[[cases]]
name = "spacing"
files = { "src/lib.rs" = "pub fn f(a: i32) -> (i32, i32, i32, i32) {\n    (a +-1, a + - 1, a+- 1, a +-  1)\n}\n" }
expected = [{ file = "src/lib.rs", start = 65, end = 68 }, { file = "src/lib.rs", start = 72, end = 77 }]

[[cases]]
name = "doubled-operator"
files = { "src/lib.rs" = "pub fn f(a: i32, b: i32) -> (i32, bool) {\n    (a -- b, a !=! b)\n}\n" }
expected = [{ file = "src/lib.rs", start = 48, end = 52 }, { file = "src/lib.rs", start = 56, end = 61 }]

[[cases]]
name = "operand-on-next-line"
files = { "src/lib.rs" = "pub fn f(a: i32) -> i32 {\n    a +-\n    1\n}\n" }
expected = [{ file = "src/lib.rs", start = 31, end = 39 }]

[[cases]]
name = "comparison"
files = { "src/lib.rs" = "pub fn f(a: i32, b: bool) -> (bool, bool) {\n    (a ==- 1, b ||! b)\n}\n" }
expected = [{ file = "src/lib.rs", start = 50, end = 55 }, { file = "src/lib.rs", start = 59, end = 64 }]

[[cases]]
name = "assignment"
files = { "src/lib.rs" = "pub fn f(mut a: i32) -> i32 {\n    a =- 1;\n    a +=- 1;\n    a\n}\n" }
expected = []

[[cases]]
name = "allowed-by-name"
files = { "src/lib.rs" = "#[allow(clippy::suspicious_unary_op_formatting)]\npub fn f(a: i32) -> bool {\n    a >- 1\n}\n" }
expected = []

[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::suspicious)]\npub fn f(a: i32) -> bool {\n    a >- 1\n}\n#[allow(clippy::all)]\npub fn g(a: i32) -> bool {\n    a >- 1\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
files = { "src/lib.rs" = "#![allow(clippy::suspicious_unary_op_formatting)]\npub fn f(a: i32) -> bool {\n    a >- 1\n}\n" }
expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::suspicious)]\n#[warn(clippy::suspicious_unary_op_formatting)]\npub fn f(a: i32) -> bool {\n    a >- 1\n}\npub fn g(a: i32) -> bool {\n    a >- 1\n}\n" }
expected = [{ file = "src/lib.rs", start = 110, end = 114 }]
