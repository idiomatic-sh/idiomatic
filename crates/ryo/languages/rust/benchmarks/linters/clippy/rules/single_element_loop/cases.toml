[[cases]]
name = "array"
files = { "src/lib.rs" = "pub fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 32, end = 68 }]

[[cases]]
name = "borrowed-and-methods"
files = { "src/lib.rs" = "pub fn f(mut t: u8) -> u8 {\n    let mut v = 3;\n    for x in &[1] {\n        t += x;\n    }\n    for x in &mut [v] {\n        *x += 1;\n    }\n    for x in [2].iter() {\n        t += x;\n    }\n    for x in [v].iter_mut() {\n        *x += 1;\n    }\n    for x in [4].into_iter() {\n        t += x;\n    }\n    v += t;\n    v\n}\n" }
expected = [{ file = "src/lib.rs", start = 51, end = 88 }, { file = "src/lib.rs", start = 93, end = 135 }, { file = "src/lib.rs", start = 140, end = 183 }, { file = "src/lib.rs", start = 188, end = 236 }, { file = "src/lib.rs", start = 241, end = 289 }]

[[cases]]
name = "more-than-one"
files = { "src/lib.rs" = "pub fn f(mut t: u8) -> u8 {\n    for x in [1, 2] {\n        t += x;\n    }\n    for x in [1; 1] {\n        t += x;\n    }\n    for x in vec![1] {\n        t += x;\n    }\n    for x in [1].iter().rev() {\n        t += x;\n    }\n    t\n}\n" }
expected = []

[[cases]]
name = "trailing-comma"
files = { "src/lib.rs" = "pub fn f(mut t: u8) -> u8 {\n    for x in [1,] {\n        t += x;\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 32, end = 69 }]

[[cases]]
name = "empty-body"
files = { "src/lib.rs" = "pub fn f() {\n    for _x in [1] {}\n}\n" }
expected = []

[[cases]]
name = "break-and-continue"
files = { "src/lib.rs" = "pub fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        if x > 0 {\n            break;\n        }\n        t += x;\n    }\n    for x in [1] {\n        if x > 0 {\n            continue;\n        }\n        t += x;\n    }\n    for x in [1] {\n        loop {\n            break;\n        }\n        t += x;\n    }\n    t\n}\n" }
expected = []

[[cases]]
name = "inner-loops"
files = { "src/lib.rs" = "pub fn f(mut t: u8, v: &[u8]) -> u8 {\n    for x in [1] {\n        while t < 2 {\n            t += x;\n        }\n    }\n    for x in [1] {\n        for y in v {\n            t += x + y;\n        }\n    }\n    for x in [1] {\n        t += x;\n        loop {\n            return t;\n        }\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 199, end = 282 }]

[[cases]]
name = "in-async-function"
files = { "src/lib.rs" = "async fn one() -> u8 {\n    1\n}\npub async fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    for x in [1] {\n        t += x + one().await;\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 69, end = 105 }]

[[cases]]
name = "break-in-closure"
files = { "src/lib.rs" = "pub fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        let g = || loop {\n            break 2;\n        };\n        t += x + g();\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 32, end = 132 }]

[[cases]]
name = "ranges"
files = { "src/lib.rs" = "pub fn f(mut t: usize) -> usize {\n    for r in [0..3] {\n        t += r.len();\n    }\n    for r in &[1..=3] {\n        t += r.clone().count();\n    }\n    for r in [..3] {\n        t += r.end;\n    }\n    for r in [2..].iter() {\n        t += r.start;\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 47, end = 53 }, { file = "src/lib.rs", start = 97, end = 105 }, { file = "src/lib.rs", start = 150, end = 192 }, { file = "src/lib.rs", start = 206, end = 218 }]

[[cases]]
name = "labeled"
files = { "src/lib.rs" = "pub fn f(mut t: u8) -> u8 {\n    'outer: for x in [1] {\n        t += x;\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 32, end = 76 }]

[[cases]]
name = "nested-loops"
files = { "src/lib.rs" = "pub fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        for y in [2] {\n            t += x + y;\n        }\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 55, end = 103 }]

[[cases]]
name = "in-local-macro"
files = { "src/lib.rs" = "macro_rules! once {\n    ($e:expr, $t:ident) => {\n        for x in [$e] {\n            $t += x;\n        }\n    };\n}\npub fn f(mut t: u8) -> u8 {\n    once!(1, t);\n    t\n}\n" }
expected = []

[[cases]]
name = "allowed-by-name"
files = { "src/lib.rs" = "#[allow(clippy::single_element_loop)]\npub fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    t\n}\n" }
expected = []

[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::complexity)]\npub fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    t\n}\n#[allow(clippy::all)]\npub fn g(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    t\n}\n#[expect(warnings)]\npub fn h(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    t\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
files = { "src/lib.rs" = "#![allow(clippy::single_element_loop)]\npub fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    t\n}\n" }
expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::all)]\n#[warn(clippy::single_element_loop)]\npub fn f(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    t\n}\npub fn g(mut t: u8) -> u8 {\n    for x in [1] {\n        t += x;\n    }\n    t\n}\n" }
expected = [{ file = "src/lib.rs", start = 92, end = 128 }]
