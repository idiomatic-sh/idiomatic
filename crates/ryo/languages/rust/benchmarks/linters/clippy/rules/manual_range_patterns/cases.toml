[[cases]]
name = "in-let-and-guard"
files = { "src/lib.rs" = "pub fn f(o: Option<i32>) -> i32 {\n    if let Some(1 | 2 | 3) = o {\n        return 1;\n    }\n    match o {\n        Some(x) if x > 9 => 2,\n        Some(4 | 5 | 6) => 3,\n        _ => 0,\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 50, end = 59 }, { file = "src/lib.rs", start = 149, end = 158 }]

[[cases]]
name = "in-test-module"
files = { "src/lib.rs" = "#[cfg(test)]\nmod tests {\n    #[test]\n    fn t() {\n        let x = 2;\n        let y = match x {\n            1 | 2 | 3 => 1,\n            _ => 0,\n        };\n        assert_eq!(y, 1);\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 107, end = 116 }]

