[[cases]]
name = "chars-and-unsigned"
files = { "src/lib.rs" = "pub fn f0(x: char) -> u8 {\n    match x {\n        'a' | 'b' | 'c' => 1,\n        _ => 0,\n    }\n}\npub fn g0(x: u8) -> u8 {\n    match x {\n        0 | 1 | 2 => 1,\n        _ => 0,\n    }\n}\n" }
