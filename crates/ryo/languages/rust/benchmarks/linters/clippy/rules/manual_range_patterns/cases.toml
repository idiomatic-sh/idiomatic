[[cases]]
name = "three-numbers"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> u8 {\n    match x {\n        1 | 2 | 3 => 1,\n        _ => 0,\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 48, end = 57 }]

[[cases]]
name = "too-few"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> u8 {\n    match x {\n        1 | 2 => 1,\n        _ => 0,\n    }\n}\npub fn f1(x: i32) -> u8 {\n    match x {\n        1 | 3 | 5 => 1,\n        _ => 0,\n    }\n}\npub fn f2(x: i32) -> u8 {\n    match x {\n        1 | 2 | 4 => 1,\n        _ => 0,\n    }\n}\n" }
expected = []

[[cases]]
name = "unordered-and-repeated"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> u8 {\n    match x {\n        3 | 1 | 2 => 1,\n        _ => 0,\n    }\n}\npub fn f1(x: i32) -> u8 {\n    match x {\n        2 | 2 | 1 | 3 => 1,\n        _ => 0,\n    }\n}\npub fn f2(x: i32) -> u8 {\n    match x {\n        5 | 4 | 3 | 2 | 1 => 1,\n        _ => 0,\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 48, end = 57 }, { file = "src/lib.rs", start = 136, end = 149 }, { file = "src/lib.rs", start = 228, end = 245 }]

[[cases]]
name = "ranges"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> u8 {\n    match x {\n        1..=3 | 4 => 1,\n        _ => 0,\n    }\n}\npub fn f1(x: i32) -> u8 {\n    match x {\n        1..3 | 3 => 1,\n        _ => 0,\n    }\n}\npub fn f2(x: i32) -> u8 {\n    match x {\n        1..3 | 4 => 1,\n        _ => 0,\n    }\n}\npub fn f3(x: i32) -> u8 {\n    match x {\n        1..=3 | 4..=6 => 1,\n        _ => 0,\n    }\n}\npub fn f4(x: i32) -> u8 {\n    match x {\n        1..=3 | 5..=6 => 1,\n        _ => 0,\n    }\n}\npub fn f5(x: i32) -> u8 {\n    match x {\n        1..=5 | 2..=3 => 1,\n        _ => 0,\n    }\n}\npub fn f6(x: i32) -> u8 {\n    match x {\n        1..4 | 4..6 => 1,\n        _ => 0,\n    }\n}\npub fn f7(x: i32) -> u8 {\n    match x {\n        1..4 | 5..6 => 1,\n        _ => 0,\n    }\n}\npub fn f8(x: i32) -> u8 {\n    match x {\n        0..=2 | 4 | 3 => 1,\n        _ => 0,\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 48, end = 57 }, { file = "src/lib.rs", start = 136, end = 144 }, { file = "src/lib.rs", start = 310, end = 323 }, { file = "src/lib.rs", start = 494, end = 507 }, { file = "src/lib.rs", start = 586, end = 597 }, { file = "src/lib.rs", start = 766, end = 779 }]

[[cases]]
name = "open-before-closed"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> u8 {\n    match x {\n        1..4 | 4..=6 => 1,\n        _ => 0,\n    }\n}\npub fn f1(x: i32) -> u8 {\n    match x {\n        1..4 | 5..=6 => 1,\n        _ => 0,\n    }\n}\npub fn f2(x: i32) -> u8 {\n    match x {\n        1..=3 | 4..6 => 1,\n        _ => 0,\n    }\n}\npub fn f3(x: i32) -> u8 {\n    match x {\n        1..=3 | 5..6 => 1,\n        _ => 0,\n    }\n}\npub fn f4(x: i32) -> u8 {\n    match x {\n        1..=3 | 4..5 | 5 => 1,\n        _ => 0,\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 48, end = 60 }, { file = "src/lib.rs", start = 230, end = 242 }, { file = "src/lib.rs", start = 412, end = 428 }]

[[cases]]
name = "negative-and-hex"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> u8 {\n    match x {\n        -1 | 0 | 1 => 1,\n        _ => 0,\n    }\n}\npub fn f1(x: i32) -> u8 {\n    match x {\n        -3..=-1 | 0 => 1,\n        _ => 0,\n    }\n}\npub fn f2(x: i32) -> u8 {\n    match x {\n        0x1 | 0x2 | 3 => 1,\n        _ => 0,\n    }\n}\npub fn f3(x: i32) -> u8 {\n    match x {\n        -2 | -1 | 1 => 1,\n        _ => 0,\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 48, end = 58 }, { file = "src/lib.rs", start = 137, end = 148 }, { file = "src/lib.rs", start = 227, end = 240 }]

