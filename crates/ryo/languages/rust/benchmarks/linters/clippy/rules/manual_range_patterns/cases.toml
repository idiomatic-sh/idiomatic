[[cases]]
name = "leading-pipe-and-nested"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> u8 {\n    match x {\n        | 1 | 2 | 3 => 1,\n        _ => 0,\n    }\n}\npub fn f1(x: i32) -> u8 {\n    match x {\n        (1 | 2 | 3) => 1,\n        _ => 0,\n    }\n}\n" }
