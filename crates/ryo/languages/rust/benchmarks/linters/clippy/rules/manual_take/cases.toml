[[cases]]
name = "taken"
files = { "src/lib.rs" = "pub fn f(mut flag: bool) -> bool {\n    if flag {\n        flag = false;\n        true\n    } else {\n        false\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 39, end = 116 }]

[[cases]]
name = "negated"
files = { "src/lib.rs" = "pub fn f(mut flag: bool) -> bool {\n    if flag { flag = false; false } else { true }\n}\n" }
expected = [{ file = "src/lib.rs", start = 39, end = 84 }]

[[cases]]
name = "same-results"
files = { "src/lib.rs" = "pub fn f(mut flag: bool) -> bool {\n    if flag { flag = false; true } else { true }\n}\n" }
expected = []

[[cases]]
name = "assigns-true"
files = { "src/lib.rs" = "pub fn f(mut flag: bool) -> bool {\n    if flag { flag = true; true } else { false }\n}\n" }
expected = []

[[cases]]
name = "other-place"
files = { "src/lib.rs" = "pub fn f(a: bool, mut b: bool) -> bool {\n    let r = if a { b = false; true } else { false };\n    r && b\n}\n" }
expected = []

[[cases]]
name = "field-place"
files = { "src/lib.rs" = "pub struct S {\n    pub f: bool,\n}\npub fn f(s: &mut S) -> bool {\n    if s.f { s.f = false; true } else { false }\n}\n" }
expected = []

[[cases]]
name = "negated-condition"
files = { "src/lib.rs" = "pub fn f(mut flag: bool) -> bool {\n    if !flag { flag = false; true } else { false }\n}\n" }
expected = []

[[cases]]
name = "extra-statement"
files = { "src/lib.rs" = "pub fn f(mut flag: bool, mut n: u8) -> bool {\n    let r = if flag { n += 1; flag = false; true } else { false };\n    r && n > 0\n}\n" }
expected = []

[[cases]]
name = "else-with-statement"
files = { "src/lib.rs" = "pub fn f(mut flag: bool, mut n: u8) -> bool {\n    let r = if flag { flag = false; true } else { n += 1; false };\n    r && n > 0\n}\n" }
expected = []

[[cases]]
name = "else-if"
files = { "src/lib.rs" = "pub fn f(mut flag: bool, other: bool) -> bool {\n    if flag { flag = false; true } else if other { false } else { true }\n}\n" }
expected = []

[[cases]]
name = "as-statement-and-in-test-module"
files = { "src/lib.rs" = "pub fn f(mut flag: bool) {\n    let _ = flag;\n    if flag { flag = false; true } else { false };\n}\n#[cfg(test)]\nmod tests {\n    pub fn g(mut flag: bool) -> bool {\n        if flag { flag = false; true } else { false }\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 49, end = 94 }, { file = "src/lib.rs", start = 170, end = 215 }]

[[cases]]
name = "allowed-by-name"
files = { "src/lib.rs" = "#[allow(clippy::manual_take)]\npub fn f(mut flag: bool) -> bool {\n    if flag { flag = false; true } else { false }\n}\n" }
expected = []

[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::complexity)]\npub fn f(mut flag: bool) -> bool {\n    if flag { flag = false; true } else { false }\n}\n#[allow(clippy::all)]\npub fn g(mut flag: bool) -> bool {\n    if flag { flag = false; true } else { false }\n}\n#[expect(warnings)]\npub fn h(mut flag: bool) -> bool {\n    if flag { flag = false; true } else { false }\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
files = { "src/lib.rs" = "#![allow(clippy::manual_take)]\npub fn f(mut flag: bool) -> bool {\n    if flag { flag = false; true } else { false }\n}\n" }
expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::all)]\n#[warn(clippy::manual_take)]\npub fn f(mut flag: bool) -> bool {\n    if flag { flag = false; true } else { false }\n}\npub fn g(mut flag: bool) -> bool {\n    if flag { flag = false; true } else { false }\n}\n" }
expected = [{ file = "src/lib.rs", start = 91, end = 136 }]
