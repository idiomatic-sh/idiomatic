[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::suspicious)]\npub mod m {\n    #[inline]\n    #[inline]\n    pub fn f() {}\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
files = { "src/lib.rs" = "#![allow(clippy::duplicated_attributes)]\n#[inline]\n#[inline]\npub fn f() {}\n" }
expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::suspicious)]\n#[warn(clippy::duplicated_attributes)]\n#[inline]\n#[inline]\npub fn f() {}\n" }
expected = [{ file = "src/lib.rs", start = 79, end = 88 }]
