[[cases]]
name = "orderings-lesser-first"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> bool {\n    x < 5 && x > 10\n}\npub fn f1(x: i32) -> bool {\n    x < 5 && x > 5\n}\npub fn f2(x: i32) -> bool {\n    x < 5 && x > 3\n}\npub fn f3(x: i32) -> bool {\n    x <= 5 && x >= 5\n}\npub fn f4(x: i32) -> bool {\n    x <= 5 && x > 5\n}\npub fn f5(x: i32) -> bool {\n    x < 5 && x >= 5\n}\npub fn f6(x: i32) -> bool {\n    x <= 5 && x >= 10\n}\npub fn f7(x: i32) -> bool {\n    x <= 5 && x >= 3\n}\n" }
expected = [{ file = "src/lib.rs", start = 32, end = 47 }, { file = "src/lib.rs", start = 82, end = 96 }, { file = "src/lib.rs", start = 231, end = 246 }, { file = "src/lib.rs", start = 281, end = 296 }, { file = "src/lib.rs", start = 331, end = 348 }]

