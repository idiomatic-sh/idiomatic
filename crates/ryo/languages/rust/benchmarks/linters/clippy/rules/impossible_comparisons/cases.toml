[[cases]]
name = "places-and-calls"
files = { "src/lib.rs" = "pub struct S {\n    pub x: i32,\n    pub v: [i32; 2],\n}\npub fn f(s: &S) -> bool {\n    s.x < 5 && s.x > 10\n}\npub fn g(s: &S) -> bool {\n    s.v[0] < 5 && s.v[0] > 10\n}\npub fn h(s: &S) -> bool {\n    s.v.len() < 5 && s.v.len() > 10\n}\npub fn k(s: &S) -> bool {\n    -s.x < 5 && -s.x > 10\n}\npub fn m(s: &S) -> bool {\n    s.x + 1 < 5 && s.x + 1 > 10\n}\npub fn n(s: &S) -> bool {\n    s.x as i64 > 5 && s.x as i64 > 10\n}\n" }
expected = [{ file = "src/lib.rs", start = 84, end = 103 }, { file = "src/lib.rs", start = 136, end = 161 }, { file = "src/lib.rs", start = 258, end = 279 }, { file = "src/lib.rs", start = 312, end = 339 }]

[[cases]]
name = "chained"
files = { "src/lib.rs" = "pub fn f0(x: i32) -> bool {\n    x < 5 && x > 10 && x > 1\n}\npub fn f1(x: i32) -> bool {\n    x < 5 && (x > 10 && x > 1)\n}\npub fn f2(x: i32) -> bool {\n    x > 1 && x < 5 && x > 10\n}\n" }
