[[cases]]
name = "both-ends"
files = { "src/lib.rs" = "pub fn f() {\n    for _ in (1)..(10) {}\n}\n" }
expected = [{ file = "src/lib.rs", start = 26, end = 29 }, { file = "src/lib.rs", start = 31, end = 35 }]

[[cases]]
name = "inclusive"
files = { "src/lib.rs" = "pub fn f() -> std::ops::RangeInclusive<i32> {\n    (1)..=(2)\n}\n" }
expected = [{ file = "src/lib.rs", start = 50, end = 53 }, { file = "src/lib.rs", start = 56, end = 59 }]

[[cases]]
name = "characters"
files = { "src/lib.rs" = "pub fn f() -> std::ops::Range<char> {\n    ('a')..('z')\n}\n" }
expected = [{ file = "src/lib.rs", start = 42, end = 47 }, { file = "src/lib.rs", start = 49, end = 54 }]

[[cases]]
name = "one-end"
files = { "src/lib.rs" = "pub fn f() -> (std::ops::RangeFrom<u8>, std::ops::RangeTo<u8>) {\n    ((1).., ..(2))\n}\n" }
expected = [{ file = "src/lib.rs", start = 70, end = 73 }, { file = "src/lib.rs", start = 79, end = 82 }]

[[cases]]
name = "unsuffixed-float-start"
files = { "src/lib.rs" = "pub fn f() -> (std::ops::Range<f64>, std::ops::Range<f64>) {\n    ((1.0)..2.0, 1.0..(2.0))\n}\n" }
expected = [{ file = "src/lib.rs", start = 83, end = 88 }]

[[cases]]
name = "suffixed-float-start"
files = { "src/lib.rs" = "pub fn f() -> std::ops::Range<f64> {\n    (1.0f64)..2.0\n}\n" }
expected = [{ file = "src/lib.rs", start = 41, end = 49 }]

[[cases]]
name = "not-literals"
files = { "src/lib.rs" = "pub fn f(x: i32) -> (std::ops::Range<i32>, std::ops::Range<i32>) {\n    ((x)..(x + 1), (-1)..1)\n}\n" }
expected = []

[[cases]]
name = "nested-parens"
files = { "src/lib.rs" = "pub fn f() -> std::ops::Range<i32> {\n    ((1))..((2))\n}\n" }
expected = [{ file = "src/lib.rs", start = 41, end = 46 }, { file = "src/lib.rs", start = 48, end = 53 }]

[[cases]]
name = "plain"
files = { "src/lib.rs" = "pub fn f() -> std::ops::Range<i32> {\n    1..2\n}\n" }
expected = []

[[cases]]
name = "allowed-by-name"
files = { "src/lib.rs" = "#[allow(clippy::needless_parens_on_range_literals)]\npub fn f() -> std::ops::Range<i32> {\n    (1)..2\n}\n" }
expected = []

[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::style)]\npub fn f() -> std::ops::Range<i32> {\n    (1)..2\n}\n#[allow(clippy::all)]\npub fn g() -> std::ops::Range<i32> {\n    (1)..2\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
files = { "src/lib.rs" = "#![allow(clippy::needless_parens_on_range_literals)]\npub fn f() -> std::ops::Range<i32> {\n    (1)..2\n}\n" }
expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::style)]\n#[warn(clippy::needless_parens_on_range_literals)]\npub fn f() -> std::ops::Range<i32> {\n    (1)..2\n}\npub fn g() -> std::ops::Range<i32> {\n    (1)..2\n}\n" }
expected = [{ file = "src/lib.rs", start = 117, end = 120 }]
