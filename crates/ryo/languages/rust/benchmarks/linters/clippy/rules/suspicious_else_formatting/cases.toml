[[cases]]
name = "newline-after-else"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b {\n    } else\n    {\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 36, end = 46 }]

[[cases]]
name = "allman"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b\n    {\n    }\n    else\n    {\n    }\n}\n" }
expected = []

[[cases]]
name = "else-if-on-next-line"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b {\n    } else\n    if b {\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 36, end = 46 }]

[[cases]]
name = "allman-else-if"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b {\n    }\n    else\n    if b {\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 36, end = 50 }]

[[cases]]
name = "else-on-next-line"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b {\n    }\n    else {\n    }\n    if b {\n    }\n    else if b {\n    }\n}\n" }
expected = []

[[cases]]
name = "blank-lines"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b {\n    } else\n\n    {\n    }\n    if b {\n    }\n\n    else\n    {\n    }\n    if b {\n    }\n    else\n\n    {\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 36, end = 47 }, { file = "src/lib.rs", start = 71, end = 86 }, { file = "src/lib.rs", start = 110, end = 125 }]

[[cases]]
name = "comment"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b {\n    } else // c\n    {\n    }\n    if b {\n    } /* c */ else\n    {\n    }\n}\n" }
expected = []

[[cases]]
name = "same-line"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b {\n    } else {\n    }\n    if b {} else if b {} else {}\n}\n" }
expected = []

[[cases]]
name = "value-position"
files = { "src/lib.rs" = "pub fn f(b: bool) -> i32 {\n    let x = if b { 1 } else\n    { 2 };\n    x\n}\n" }
expected = [{ file = "src/lib.rs", start = 49, end = 59 }]

[[cases]]
name = "chain"
files = { "src/lib.rs" = "pub fn f(b: bool) {\n    if b {\n    } else\n    if b {\n    } else\n    {\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 36, end = 46 }, { file = "src/lib.rs", start = 58, end = 68 }]

[[cases]]
name = "allowed-by-name"
files = { "src/lib.rs" = "#[allow(clippy::suspicious_else_formatting)]\npub fn f(b: bool) {\n    if b {\n    } else\n    {\n    }\n}\n" }
expected = []

[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::suspicious)]\npub fn f(b: bool) {\n    if b {\n    } else\n    {\n    }\n}\n#[allow(clippy::all)]\npub fn g(b: bool) {\n    if b {\n    } else\n    {\n    }\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
files = { "src/lib.rs" = "#![allow(clippy::suspicious_else_formatting)]\npub fn f(b: bool) {\n    if b {\n    } else\n    {\n    }\n}\n" }
expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::suspicious)]\n#[warn(clippy::suspicious_else_formatting)]\npub fn f(b: bool) {\n    if b {\n    } else\n    {\n    }\n}\npub fn g(b: bool) {\n    if b {\n    } else\n    {\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 110, end = 120 }]
