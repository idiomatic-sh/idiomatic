[[cases]]
name = "function"
files = { "src/lib.rs" = "pub fn f(value: u8, _value: u8) -> u8 {\n    value\n}\n" }
expected = [{ file = "src/lib.rs", start = 9, end = 14 }]

[[cases]]
name = "underscore-first-or-doubled"
files = { "src/lib.rs" = "pub fn f(_value: u8, value: u8) -> u8 {\n    value\n}\npub fn g(value: u8, __value: u8) -> u8 {\n    value\n}\npub fn h(_value: u8, __value: u8) -> u8 {\n    0\n}\n" }
expected = []

[[cases]]
name = "mutable-reference-and-typed"
files = { "src/lib.rs" = "pub fn f(mut value: u8, _value: u8) -> u8 {\n    value += 1;\n    value\n}\npub fn g(ref value: u8, _value: &u8) -> u8 {\n    *value\n}\npub fn h(value @ _: u8, _value: u8) -> u8 {\n    value\n}\n" }
expected = [{ file = "src/lib.rs", start = 9, end = 18 }, { file = "src/lib.rs", start = 81, end = 90 }]

[[cases]]
name = "patterns-and-several"
files = { "src/lib.rs" = "pub fn f((value, other): (u8, u8), _value: u8, _other: u8) -> u8 {\n    value + other\n}\npub fn g(a: u8, b: u8, _b: u8, _a: u8, _a2: u8) -> u8 {\n    a + b\n}\n" }
expected = [{ file = "src/lib.rs", start = 96, end = 97 }, { file = "src/lib.rs", start = 103, end = 104 }]

[[cases]]
name = "methods-traits-and-closures"
files = { "src/lib.rs" = "pub struct S;\nimpl S {\n    pub fn m(&self, value: u8, _value: u8) -> u8 {\n        value\n    }\n}\npub trait T {\n    fn declared(value: u8, _value: u8);\n    fn provided(value: u8, _value: u8) -> u8 {\n        value\n    }\n}\npub fn c() -> u8 {\n    let k = |value: u8, _value: u8| value;\n    k(1, 2)\n}\n" }
expected = [{ file = "src/lib.rs", start = 43, end = 48 }, { file = "src/lib.rs", start = 126, end = 131 }, { file = "src/lib.rs", start = 166, end = 171 }, { file = "src/lib.rs", start = 251, end = 256 }]

[[cases]]
name = "foreign-and-pointer-types"
files = { "src/lib.rs" = "unsafe extern \"C\" {\n    pub fn external(value: i32, _value: i32) -> i32;\n}\npub type Pointer = fn(value: u8, _value: u8) -> u8;\n" }
expected = [{ file = "src/lib.rs", start = 40, end = 45 }]

[[cases]]
name = "raw-identifiers"
files = { "src/lib.rs" = "pub fn f(r#value: u8, _value: u8) -> u8 {\n    r#value\n}\n" }
expected = [{ file = "src/lib.rs", start = 9, end = 16 }]

[[cases]]
name = "nested-function-and-test-module"
files = { "src/lib.rs" = "pub fn outer() -> u8 {\n    fn inner(value: u8, _value: u8) -> u8 {\n        value\n    }\n    inner(1, 2)\n}\n#[cfg(test)]\nmod tests {\n    fn helper(value: u8, _value: u8) -> u8 {\n        value\n    }\n    #[test]\n    fn t() {\n        assert_eq!(super::outer(), helper(1, 2));\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 36, end = 41 }, { file = "src/lib.rs", start = 144, end = 149 }]

[[cases]]
name = "in-uncalled-macro"
files = { "src/lib.rs" = "macro_rules! m {\n    () => {\n        pub fn f(value: u8, _value: u8) -> u8 {\n            value\n        }\n    };\n}\n" }
expected = []

[[cases]]
name = "allowed-by-name"
files = { "src/lib.rs" = "#[allow(clippy::duplicate_underscore_argument)]\npub fn f(value: u8, _value: u8) -> u8 {\n    value\n}\n" }
expected = []

[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::style)]\npub fn f(value: u8, _value: u8) -> u8 {\n    value\n}\n#[allow(warnings)]\npub fn g(value: u8, _value: u8) -> u8 {\n    value\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
files = { "src/lib.rs" = "#![allow(clippy::duplicate_underscore_argument)]\npub fn f(value: u8, _value: u8) -> u8 {\n    value\n}\n" }
expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::style)]\n#[warn(clippy::duplicate_underscore_argument)]\npub fn f(value: u8, _value: u8) -> u8 {\n    value\n}\n" }
expected = [{ file = "src/lib.rs", start = 81, end = 86 }]

[[cases]]
name = "allowed-on-the-parameter"
files = { "src/lib.rs" = "pub fn f(#[allow(clippy::duplicate_underscore_argument)] value: u8, _value: u8) -> u8 {\n    value\n}\npub fn g(value: u8, #[allow(clippy::duplicate_underscore_argument)] _value: u8) -> u8 {\n    value\n}\n" }
expected = [{ file = "src/lib.rs", start = 57, end = 62 }, { file = "src/lib.rs", start = 109, end = 114 }]
