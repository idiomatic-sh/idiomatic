expected = []

[[cases]]
name = "let-else-parentheses-and-unsafe"
files = { "src/lib.rs" = "pub struct W(pub u8);\n#[allow(unused_unsafe)]\npub fn f(w: W) -> u8 {\n    let a = (match w {\n        W(v) => v,\n    });\n    let b = match W(1) {\n        W(v) => unsafe { v },\n    };\n    let c = match W(2) {\n        W(v) => (v),\n    };\n    a + b + c\n}\n" }
expected = [{ file = "src/lib.rs", start = 73, end = 118 }, { file = "src/lib.rs", start = 185, end = 233 }]

[[cases]]
name = "binding-modes-and-subpatterns"
files = { "src/lib.rs" = "pub struct W(pub u8);\npub fn f(w: W) -> u8 {\n    let mut a = match w {\n        W(mut v) => {\n            v += 1;\n            v\n        }\n    };\n    a += 1;\n    let b = match W(1) {\n        W(v @ _) => v,\n    };\n    let c = match W(2) {\n        W(v) => self::helper(v),\n    };\n    a + b + c\n}\nfn helper(v: u8) -> u8 {\n    v\n}\n" }
expected = [{ file = "src/lib.rs", start = 160, end = 210 }]

[[cases]]
name = "self-and-qualified-paths"
files = { "src/lib.rs" = "pub enum E {\n    Only(u8),\n}\nimpl E {\n    pub fn get(self) -> u8 {\n        let v = match self {\n            Self::Only(v) => v,\n        };\n        v\n    }\n    pub fn other(e: E) -> u8 {\n        let v = match e {\n            crate::E::Only(v) => v,\n        };\n        v\n    }\n}\n" }
expected = [{ file = "src/lib.rs", start = 194, end = 258 }]

[[cases]]
name = "in-test-module"
files = { "src/lib.rs" = "#[cfg(test)]\nmod tests {\n    struct W(u8);\n    #[test]\n    fn t() {\n        let x = match W(1) {\n            W(v) => v,\n        };\n        assert_eq!(x, 1);\n    }\n}\n" }
