[[cases]]
name = "single-arm"
files = { "src/lib.rs" = "pub struct W(pub u8);\npub fn f(w: W) -> u8 {\n    let x = match w {\n        W(v) => v,\n    };\n    x\n}\n" }
expected = [{ file = "src/lib.rs", start = 49, end = 92 }]

[[cases]]
name = "enum-variants-and-blocks"
files = { "src/lib.rs" = "pub enum E {\n    Only(String),\n}\npub fn f(e: E) -> String {\n    let s = match e {\n        E::Only(inner) => { inner }\n    };\n    s\n}\npub fn g(e: &E) -> usize {\n    let n = match *e {\n        E::Only(ref inner) => {{ inner }}\n    };\n    n.len()\n}\n" }
expected = [{ file = "src/lib.rs", start = 64, end = 124 }, { file = "src/lib.rs", start = 164, end = 231 }]

[[cases]]
name = "references-and-rest"
files = { "src/lib.rs" = "pub struct W(pub u8, pub u8);\npub struct R<'a>(pub &'a u8);\npub fn f(w: W, r: R<'_>) -> u8 {\n    let a = match w {\n        W(v, ..) => v,\n    };\n    let b = match r {\n        R(&v) => v,\n    };\n    let c = match (W(1, 2),) {\n        (W(.., last),) => last,\n    };\n    a + b + c\n}\n" }
expected = [{ file = "src/lib.rs", start = 97, end = 144 }, { file = "src/lib.rs", start = 149, end = 193 }]

[[cases]]
name = "not-infallible-shape"
files = { "src/lib.rs" = "pub struct W(pub u8);\npub struct P {\n    pub v: u8,\n}\npub fn f(w: W, p: P, o: Option<u8>) -> u8 {\n    let a = match w {\n        W(v) => v + 1,\n    };\n    let b = match p {\n        P { v } => v,\n    };\n    let c = match o {\n        Some(v) => v,\n        None => 0,\n    };\n    let d = match W(2) {\n        W(v) if v > 0 => v,\n        W(_) => 0,\n    };\n    let e = match W(3) {\n        W(v) => {\n            let _ = 0;\n            v\n        }\n    };\n    let g = match W(4) {\n        W(_) => 0,\n    };\n    a + b + c + d + e + g\n}\n" }
expected = []

[[cases]]
name = "unit-struct-and-const-patterns"
