expected = []

[[cases]]
name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::style)]\n#[warn(clippy::needless_pub_self)]\npub(self) fn a() {}\npub fn c() {\n    a();\n}\n" }
