expected = []

[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "#[allow(clippy::style)]\npub(self) fn a() {}\n#[allow(clippy::all)]\nmod m {\n    pub(self) fn b() {}\n    pub fn c() {\n        b();\n    }\n}\npub fn d() {\n    a();\n    m::c();\n}\n" }
expected = []

[[cases]]
name = "allowed-inner"
