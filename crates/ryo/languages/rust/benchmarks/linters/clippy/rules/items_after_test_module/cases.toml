[[cases]]
name = "item-after"
files = { "src/lib.rs" = "pub fn a() {}\n#[cfg(test)]\nmod tests {}\npub fn b() {}\n" }
expected = [{ file = "src/lib.rs", start = 27, end = 36 }]

[[cases]]
name = "visible-module-and-several-items"
files = { "src/lib.rs" = "/// The tests.\n#[cfg(test)]\npub(crate) mod tests {\n    #[test]\n    fn t() {}\n}\npub use std::fmt::Debug;\npub const C: u8 = 1;\npub struct S;\nimpl S {\n    pub fn f(&self) {}\n}\nmacro_rules! m {\n    () => {};\n}\npub type T = u8;\n" }
expected = [{ file = "src/lib.rs", start = 28, end = 48 }]

[[cases]]
name = "nothing-after"
files = { "src/lib.rs" = "pub fn a() {}\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn t() {}\n}\n" }
expected = []

[[cases]]
name = "file-module"
files = { "src/lib.rs" = "#[cfg(test)]\nmod tests;\npub fn b() {}\n", "src/tests.rs" = "#[test]\nfn t() {}\n" }
expected = []

[[cases]]
name = "module-after"
files = { "src/lib.rs" = "#[cfg(test)]\nmod tests {}\npub fn b() {}\npub mod other {}\n" }
expected = []

