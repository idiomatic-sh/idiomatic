[[cases]]
name = "allowed-by-group"
files = { "src/lib.rs" = "pub mod a {\n    #[allow(clippy::style)]\n    #[cfg(test)]\n    mod tests {}\n    pub fn b() {}\n}\npub mod c {\n    #[cfg(test)]\n    #[allow(clippy::all)]\n    mod tests {}\n    pub fn b() {}\n}\npub mod d {\n    #[cfg(test)]\n    #[expect(warnings)]\n    mod tests {}\n    pub fn b() {}\n}\n" }
