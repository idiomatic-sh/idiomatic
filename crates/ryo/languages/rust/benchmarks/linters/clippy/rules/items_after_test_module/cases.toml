name = "warn-reenables"
files = { "src/lib.rs" = "#![allow(clippy::all)]\npub mod a {\n    #[cfg(test)]\n    #[warn(clippy::items_after_test_module)]\n    mod tests {}\n    pub fn b() {}\n}\npub mod c {\n    #[cfg(test)]\n    mod tests {}\n    pub fn b() {}\n}\n" }
