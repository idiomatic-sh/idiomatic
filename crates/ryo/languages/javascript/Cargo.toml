[package]
name = "idiomatic-sh-ryo-javascript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "JavaScript language provider for Ryo"
keywords = ["javascript", "parser", "static-analysis", "language-provider", "ryo"]
categories = ["development-tools", "parser-implementations"]
autobenches = false
autotests = false

[lib]
name = "ryo_javascript"

[dependencies]
strum.workspace = true
serde.workspace = true
serde_json.workspace = true # ignore: idiomatic.arch/no-json-in-process - only the npm and bun manifest reading adapters use it: package.json and bun.lock are JSON by format
globset.workspace = true
thiserror.workspace = true
postcard.workspace = true
# serde_yaml is deprecated; this is its continuation, maintained by The YAML Organization.
yaml_serde = "=0.10.7"
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_ast_visit = "=0.142.0"
oxc_parser = "=0.142.0"
oxc_span = "=0.142.0"
oxc_semantic = "=0.142.0"

ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", version = "0.1.2" }

[dev-dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-ryo-javascript = { path = ".", features = ["fixtures"] }
divan.workspace = true

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[features]
fixtures = ["ryo/fixtures"]

[lints]
workspace = true

# Its `allocation` test target (`harness = false`) sets `dhat` as the global allocator, which machete does not see.
[package.metadata.cargo-machete]
ignored = ["dhat"]

# Established generated parser timing identities; native CPU/RSS are not inferred from Divan.
[package.metadata.ryo.performance]
schema = "divan-timing/v1"
workloads = { generated_every_relation = [2500, 10000] }
metrics = ["median-ns"]
