[package]
name = "idiomatic-sh-ryo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Query source code through independent language providers"
keywords = ["query", "lint", "static-analysis", "ryoql", "code-search"]
categories = ["development-tools", "command-line-utilities"]
autobenches = false

[lib]
name = "ryo_cli"

[[bin]]
name = "ryo"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
clap.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
ryo_core = { package = "idiomatic-sh-ryo-core", path = "../crates/core", version = "0.1.2" }
ryo_language = { package = "idiomatic-sh-ryo-language", path = "../crates/language", version = "0.1.2" }
ryo_values = { package = "idiomatic-sh-ryo-values", path = "../crates/values", version = "0.1.2" }
ryo_query_language = { package = "idiomatic-sh-ryo-query_language", path = "../crates/query_language", version = "0.1.2" }
ryo_css = { package = "idiomatic-sh-ryo-css", path = "../languages/css", optional = true, version = "0.1.2" }
ryo_go = { package = "idiomatic-sh-ryo-go", path = "../languages/go", optional = true, version = "0.1.2" }
ryo_html = { package = "idiomatic-sh-ryo-html", path = "../languages/html", optional = true, version = "0.1.2" }
ryo_javascript = { package = "idiomatic-sh-ryo-javascript", path = "../languages/javascript", optional = true, version = "0.1.2" }
ryo_json = { package = "idiomatic-sh-ryo-json", path = "../languages/json", optional = true, version = "0.1.2" }
ryo_markdown = { package = "idiomatic-sh-ryo-markdown", path = "../languages/markdown", optional = true, version = "0.1.2" }
ryo_python = { package = "idiomatic-sh-ryo-python", path = "../languages/python", optional = true, version = "0.1.2" }
ryo_rust = { package = "idiomatic-sh-ryo-rust", path = "../languages/rust", optional = true, version = "0.1.2" }
ryo_toml = { package = "idiomatic-sh-ryo-toml", path = "../languages/toml", optional = true, version = "0.1.2" }
ryo_typescript = { package = "idiomatic-sh-ryo-typescript", path = "../languages/typescript", optional = true, version = "0.1.2" }

[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
sha2.workspace = true
ignore.workspace = true
sysinfo.workspace = true
ryo_sdk = { package = "idiomatic-sh-ryo-sdk", path = "../crates/sdk" }
# The crate itself with the language its tests and benches read, so the tests read that language whatever the defaults.
idiomatic-sh-ryo = { path = ".", features = ["rust"] }
ryo_core = { package = "idiomatic-sh-ryo-core", path = "../crates/core", features = ["fixtures"] }
dhat.workspace = true
toml.workspace = true
# The language with its fixtures, which the call-count test reads.
ryo_rust = { package = "idiomatic-sh-ryo-rust", path = "../languages/rust", features = ["fixtures"] }
ryo_toml = { package = "idiomatic-sh-ryo-toml", path = "../languages/toml" }
cpu-time.workspace = true
trycmd.workspace = true
tempfile.workspace = true
snapbox.workspace = true
shlex = "=2.0.1"

[[test]]
name = "blocks"
harness = false

[[bench]]
name = "lint"
path = "benches/lint.rs"
harness = false

[[bench]]
name = "commands"
path = "benches/performance/main.rs"
harness = false

# One feature for each language: Cargo forces the list, and `build.rs` fails when a directory of `languages/` has none,
# so the file that links them, `src/languages.rs`, is written from the directory and nothing else names a language.
# Every language is a default: a plain `cargo install` reads all of them, and a registry's build or a check names its own set with `--no-default-features --features ...`.
[features]
distribution = []
default = ["css", "go", "html", "javascript", "json", "markdown", "python", "rust", "toml", "typescript"]
fixtures = []
# A diagnostic build: `--timings=phases` prints the outer phases of a command and when each began and ended (Linux).
phase-diagnostic = []
css = ["dep:ryo_css"]
go = ["dep:ryo_go"]
html = ["dep:ryo_html"]
javascript = ["dep:ryo_javascript"]
json = ["dep:ryo_json"]
markdown = ["dep:ryo_markdown"]
python = ["dep:ryo_python"]
rust = ["dep:ryo_rust"]
toml = ["dep:ryo_toml"]
typescript = ["dep:ryo_typescript"]

[lints]
workspace = true

[[test]]
name = "distribution"
path = "../distribution/smoke_test.rs"
required-features = ["distribution"]
test = false

[[bench]]
name = "distribution"
path = "../distribution/benches/bench.rs"
harness = false
required-features = ["distribution"]
test = false

# cargo-binstall's prebuilt binary: the GitHub Release of the package's own tag, `<package>-v<version>`, holds one archive
# per target, `<package>-<target>.tar.gz` (`.zip` on Windows), with the bare command inside.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
