# The project this target is, and the one revision of it every release is proven on.
#   repository = "<url>"      cloned once, at `revision`, into the cache
#   revision   = "<commit>"   the full commit id: a tag can move, so it never stands in for one
#   directory  = "<path>"     where in the project the command runs, `.` for its root
#   tag        = "<tag>"      the release that revision is, when the project tagged it
repository = "https://github.com/tokio-rs/tokio"
tag = "tokio-1.48.0"
revision = "556820ff84030b37e74e11b86b7733f5795770ea"
directory = "."
dependencies = [
  { source = "tastemaker", destination = ".benchmark/arch" },
  { source = "crates/tastemaker/distribution/registries/cargo/targets/tokio/tastemaker.lock", destination = "tastemaker.lock" },
]
