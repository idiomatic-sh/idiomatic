# The features of the language that ruff does not feed 1,000 rows, each with why. A feature listed here that is fed 1,000 rows or more
# fails the replay, so the list only shrinks; a feature not listed and fed fewer fails it too (plan-trace: migration row 12,).

[feature]

[feature."direction:NextSibling"]
why = "no rule walks to the next sibling yet."

[feature."direction:PreviousSibling"]
why = "read only by `macro-paths-hygienic`, which is not among the recorded rules."

[feature."family:EndsWith"]
why = "no recorded rule uses it."

[feature."family:FloatTextGreaterThanOrEqual"]
why = "used by `lossy-float-literals` only; 0 rows reach the comparison over ruff."

[feature."family:NotGlobAny"]
why = "no recorded rule uses it."

[feature."family:StartsWith"]
why = "no recorded rule uses it."

[feature."operation:Rank"]
why = "no recorded rule uses it: it was added for the `layer-order` rule, which ranks packages by layer."

[feature."operation:Rows"]
why = "read only by `list-matches-source`, which is not among the recorded rules."

[feature."operation:Words"]
why = "no recorded rule uses it."

[feature."relation:Assigns"]
why = "770 rows; read only by `repeated-bound-strings`."

[feature."relation:Comment"]
why = "no recorded rule reads the relation; `todo-comments`, `unsafe-without-safety` and `duplicate-function-bodies` read the comment tokens of the tree."

[feature."relation:Entry"]
why = "read only by `dependency-feature-sprawl`, recorded as pending: the Rust language of ryo does not provide `sequence-element`, `entry` and `mapping`."

[feature."relation:FilePackage"]
why = "added by the declarations batch; no recorded rule reads it yet."

[feature."relation:Mapping"]
why = "no recorded rule reads it."

[feature."relation:Directive"]
why = "no recorded rule reads it; ruff's files are Python and Rust, which have no build directive in source."

[feature."relation:Visibility"]
why = "no recorded rule reads it; it was added for the comparison of a template with its file."

[feature."relation:Mention"]
why = "added by the declarations batch; no recorded rule reads it yet."

[feature."relation:PackageDependency"]
why = "read only by `crate-dependency-cycles`, `crate-dependency-depth` and `layer-order`, recorded as pending: they read package-dependency, which the Rust language of ryo did not provide when they were recorded."

[feature."relation:SequenceElement"]
why = "no recorded rule reads it."

[feature."relation:SyntaxError"]
why = "read only by `parse-errors`; 0 rows over ruff."

[feature."relation:WorkspaceMember"]
why = "54 rows; read by `workspace-completeness` and `crate-dependency-depth` (recorded as pending)."

[feature."operation:Hosted"]
why = "the host's rows: no recorded rule names a relation the host declares, and the replay declares none."

[feature."relation:Prose"]
why = "0 rows: ruff's files are Python and Rust, which are not documents; only the Markdown language fills it."

[feature."relation:CallArgument"]
why = "added by the call-argument relation; no recorded rule reads it yet."

[feature."relation:Resolves"]
why = "added by the resolves relation; no recorded rule reads it yet."

