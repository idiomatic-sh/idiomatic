# Where what ryo could not decide over ruff differs from what v1 (today's Tastemaker) could not: one row for each rule that differs, with
# both numbers and why. The replay (`behavior::what_ryo_could_not_decide_over_ruff_is_the_golden_or_a_recorded_difference`) fails
# for a difference without a row, a row whose numbers are not the measured ones, and a row for a rule that no longer differs.

[rule.boxed-dyn-error-annotations]
ryo = 0
golden = 1447
why = "v1 read `annotates` as partial for every file with a destructuring `let` or a parameter whose pattern is not one name. ryo writes a row for a type on a pattern (the pattern or the parameter is its owner), so `annotates` is whole."

[rule.error-variant-never-constructed]
ryo = 0
golden = 1119
why = "v1 read `defines` as partial for every kind of row in a file with a destructuring `let`, so every rule that reads it could not decide. ryo writes the names a destructuring `let` binds as variables, so `defines` is whole; a name that starts as a constant does is the one case it cannot tell apart, and no file of ruff has one."

[rule.import-fan-in]
ryo = 0
golden = 2
why = "v1 gives unknowns here from the module and package relations (a module with no source file, two or a cycle; a manifest or a dependency it could not analyze; a file no crate root declares). ryo declares a module with no source file as partial at its file, and none of ruff's has one; a file no crate root declares is a known fact, not analyzed and with no dependency rows, which `orphan-rust-files` reports; the second of v1's is not identified."

[rule.module-cycles]
ryo = 0
golden = 1
why = "v1 could not decide over a file no crate root declares, which has no dependency rows; ryo knows such a file is not analyzed, so the cycles are decided over the files that are."

[rule.orphan-rust-files]
ryo = 0
golden = 1
why = "v1 could not decide over a file no crate root declares; ryo knows such a file is not analyzed, so the rule reports it instead of being undecided."

