# The rows ryo gives over ruff that the recording of today's Tastemaker does not have, one table for each rule: `extra` are the
# rows (a path and a key), `why` is what ryo sees that the recording could not. The replay (`behavior::every_recorded_rule_gives_the_recorded_rows`)
# takes these rows out before it compares, and fails for a row listed here that ryo no longer gives.

[rule.no-env-reads]
why = "The recorded rule reads the identifiers of token trees as well as the references, because today's ryo could not see inside a macro call. ryo reads the arguments of the standard expression macros as expressions, so `std::env::var(..)` inside `assert_eq!(..)` is a reference with the whole path as its span, beside the identifier of the token tree the rule still reads: one more finding, the same call. The rule reads references or mentions, never both, once Tastemaker's rules take `mention`."
extra = [
  { path = "crates/ruff_db/src/diagnostic/render/gitlab.rs", key = "1304..1317" },
]

[rule.nested-function-count]
why = "`scope` has a row for every scope of a file, the module, the modules, `impl`s and traits as well as the functions; the recorded rule counts the scopes below a function, so a function that holds an `impl` has one more below it, and its methods are below the `impl`. Today's Tastemaker had the functions alone."
extra = [
  { path = "crates/ty_python_semantic/src/types/call/bind.rs", key = "331070..332872" },
  { path = "crates/ty_python_semantic/src/types/constraints.rs", key = "80337..82970" },
  { path = "crates/ty_python_semantic/src/types/constraints/sequents.rs", key = "78533..80289" },
  { path = "crates/ty_python_semantic/src/types/infer/builder/redundant_conditions/diagnostic.rs", key = "2064..36694" },
  { path = "crates/ty_python_semantic/src/types/visitor.rs", key = "30308..32652" },
]

[rule.repeated-string-literals]
why = "The recorded rule could not see inside a macro call: today's ryo had no string-literal row for a literal in the arguments of a macro. ryo reads the arguments of the standard expression macros (`format!`, `assert_eq!`, `matches!`, ...) as expressions, so a literal there is a string-literal row, as grep sees it: each extra row is such a literal, written in as many files as the rule asks."
