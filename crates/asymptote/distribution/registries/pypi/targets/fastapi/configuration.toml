# What asymptote checks this target with: a run places this file in the project's directory, under asymptote's own name for it.
# The target is Python, and its linter is Ruff, at the version `tools/install.py` declares.
[[tools]]
id = "ruff"
group = "lint"
run = ["ruff", "check", "--no-cache", "--output-format", "sarif"]
output = "sarif"
timeout-seconds = 600
inputs = ["."]
