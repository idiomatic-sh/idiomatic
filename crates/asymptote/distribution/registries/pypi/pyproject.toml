[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "idiomatic-sh-asymptote"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]

[tool.maturin]
bindings = "bin"
manifest-path = "../../../cli/Cargo.toml"
module-name = "idiomatic_sh_asymptote"
python-source = "python"
profile = "dist"
