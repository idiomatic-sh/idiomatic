[package]
name = "idiomatic-sh-asymptote-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Diagnostic ratchet services for Asymptote"
keywords = ["sarif", "lint", "ratchet", "baseline", "ci"]
categories = ["development-tools"]
autobenches = false

[lib]
name = "asymptote_core"

[dependencies]
blake3.workspace = true
globset.workspace = true
jiff.workspace = true
percent-encoding.workspace = true
postcard.workspace = true
process-wrap.workspace = true
serde.workspace = true
serde-sarif.workspace = true
serde_json.workspace = true       # ignore: idiomatic.arch/no-json-in-process - only the SARIF and Bencher Metric Format adapters use it: they read other tools' output, which is JSON by format
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
cargo_metadata.workspace = true
cucumber.workspace = true
tokio.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
idiomatic-sh-asymptote-core = { path = ".", features = ["fixtures"] }

[[test]]
name = "bdd"
harness = false

[features]
fixtures = []

[lints]
workspace = true
