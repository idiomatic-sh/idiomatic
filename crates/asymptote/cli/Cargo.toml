[package]
name = "idiomatic-sh-asymptote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Ratchet diagnostic findings using SARIF"
keywords = ["sarif", "lint", "ratchet", "baseline", "ci"]
categories = ["development-tools", "command-line-utilities"]
autobenches = false

[lib]
name = "asymptote_cli"

[[bin]]
name = "asymptote"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
clap.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
tempfile = { workspace = true, optional = true }
asymptote_core = { package = "idiomatic-sh-asymptote-core", path = "../crates/core", version = "0.1.2" }

[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
sha2.workspace = true
ignore.workspace = true
sysinfo.workspace = true
toml.workspace = true
asymptote_core = { package = "idiomatic-sh-asymptote-core", path = "../crates/core", features = ["fixtures"] }
cpu-time.workspace = true
snapbox.workspace = true
tempfile.workspace = true
trycmd.workspace = true
shlex = "=2.0.1"

[[bench]]
name = "commands"
path = "benches/performance/main.rs"
harness = false

[features]
distribution = []
default = []
fixtures = ["dep:tempfile"]
# A diagnostic build: `--timings=phases` prints the outer phases of a command and when each began and ended (Linux).
phase-diagnostic = []

[lints]
workspace = true

[[test]]
name = "distribution"
path = "../distribution/smoke_test.rs"
required-features = ["distribution"]
test = false

[[bench]]
name = "distribution"
path = "../distribution/benches/bench.rs"
harness = false
required-features = ["distribution"]
test = false

# cargo-binstall's prebuilt binary: the GitHub Release of the package's own tag, `<package>-v<version>`, holds one archive
# per target, `<package>-<target>.tar.gz` (`.zip` on Windows), with the bare command inside.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
