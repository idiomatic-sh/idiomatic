# The asymptote this repository needs: every run of another stops, and `tools/install.py` installs this one.
asymptote = "0.1.1"

# The repository root is the asymptote workspace: its members are the products, each with an asymptote.toml and a lock of its own,
# and its own tools are the checks no product owns: the files, their text and the workflows. A product runs from its own directory.
members = ["crates/*"]

# The git hooks `asymptote init` installs, each running the groups named: the commit gate is the lint group.
[hooks]
pre-commit = ["lint"]

[[tools]]
id = "tastemaker"
group = "lint"
# The repository root is a Tastemaker workspace of its own, closed over every top-level file and directory beside the
# products: the whole tree is its input.
run = ["tm", "check", "--format", "sarif"]
output = "sarif"
timeout-seconds = 1800
inputs = ["."]

[[tools]]
id = "taplo"
group = "lint"
# Every TOML file parses and is formatted as taplo.toml says.
run = ["taplo", "fmt", "--check"]
fix = ["taplo", "fmt"]
timeout-seconds = 600

[[tools]]
id = "yamllint"
group = "lint"
# Every YAML file parses (.yamllint.yaml).
run = ["yamllint", "."]
timeout-seconds = 600

[[tools]]
id = "editorconfig"
group = "lint"
# Every text file ends with a newline and has no trailing whitespace (.editorconfig, .editorconfig-checker.json).
run = ["ec"]
timeout-seconds = 600

[[tools]]
id = "merge-conflict"
group = "lint"
# No file holds a leftover conflict marker, tracked or not: `git grep --untracked` reads the files an add would stage as well as the
# tracked ones, so a new file with a marker cannot pass and then be staged unchanged. Exit 1 is no match; any other exit is a failure.
run = ["bash", "-c", "git grep -n -I --untracked -E '^(<{7}|>{7}|[|]{7})( |$)|^={7}$' -- . ':(exclude,glob)**/snapshots/**' ':(exclude,glob)**/resources/**' ':(exclude,glob)crates/ryo/languages/*/tests/fixtures/suite/**' ':(exclude,glob)crates/ryo/languages/*/tests/fixtures/corpus/**'; [ $? -eq 1 ]"]
timeout-seconds = 300

[[tools]]
id = "typos"
group = "lint"
# Spelling (_typos.toml).
run = ["typos"]
fix = ["typos", "--write-changes"]
timeout-seconds = 600

[[tools]]
id = "shellcheck"
group = "lint"
# Every tracked shell script. Exit 1 is a finding; shellcheck writes no SARIF, so the run passes only when it finds none.
# shellcheck writes its messages as UTF-8 and fails under another locale.
run = ["bash", "-c", "git ls-files -z -- '*.sh' | LC_ALL=C.UTF-8 xargs -0 -r shellcheck"]
timeout-seconds = 600

[[tools]]
id = "actionlint"
group = "lint"
# GitHub's own schema and expressions in the workflows.
run = ["actionlint"]
timeout-seconds = 600
inputs = [".github"]

[[tools]]
id = "commitizen"
group = "lint"
# The branch's commit messages since a pinned baseline are conventional commits (cz.toml), through cz's own --rev-range.
# The baseline is the landed consolidation head (dcea2ee7df, 2026-11-09): the 901 non-conventional commits before it are history, not rewritten.
# A shallow clone, or one without the baseline, stops the tool: a range it cannot resolve is no range it checked.
run = ["bash", "-c", "set -e; [ \"$(git rev-parse --is-shallow-repository)\" = false ] || { echo 'commitizen: a shallow clone cannot resolve the range' >&2; exit 2; }; base=$(git rev-parse --verify \"dcea2ee7df7c02711f42c332cbc403ff7b84a034^0\"); ahead=$(git rev-list \"$base..HEAD\"); [ -z \"$ahead\" ] || cz check --rev-range \"$base..HEAD\""]
timeout-seconds = 300

[[tools]]
id = "gitleaks"
group = "lint"
# No secret is committed (.gitleaks.toml: gitleaks' default rules and the allowlist of what is proven not a secret; .gitleaksignore:
# single findings proven not secrets). The pre-commit hook runs the lint group, so this scans the staged change alone, which is
# fast; gitleaks-history scans the branch's commits. Exit 1 is a finding; --redact keeps the secret out of the output.
run = ["gitleaks", "git", "--pre-commit", "--staged", "--redact", "--no-banner", "."]
timeout-seconds = 600

[[tools]]
id = "gitleaks-history"
group = "check"
# Every commit of the branch since its merge-base with origin/main, so a secret committed and then deleted still fails, and a
# checkout of a pushed branch (CI's) scans the branch's own commits; secrets matter for the whole history, which was scanned once,
# on 2026-11-09. In the check group, which the CI checks job and the checkpoint workflow run and the pre-commit hook does not.
# A shallow clone, or one without origin/main (a --single-branch clone), stops the tool: a range it cannot resolve is no range it scanned.
run = ["bash", "-c", "set -e; [ \"$(git rev-parse --is-shallow-repository)\" = false ] || { echo 'gitleaks-history: a shallow clone cannot resolve the range' >&2; exit 2; }; base=$(git rev-parse --verify origin/main^0); ahead=$(git rev-list \"$base..HEAD\"); [ -z \"$ahead\" ] || gitleaks git --redact --no-banner \"--log-opts=$base..HEAD\" ."]
timeout-seconds = 600

[[tools]]
id = "ci-tests"
group = "check"
# The CI code's own tests, which read the workflows and the products' manifests.
run = ["bash", "-c", "mkdir -p target/checks/ci-tests; set +e; pytest --quiet -p no:cacheprovider --import-mode=importlib -o pythonpath=. -o 'python_files=*_test.py' -o python_classes= -o 'norecursedirs=.* __pycache__' ci > target/checks/ci-tests/stdout.log 2> target/checks/ci-tests/stderr.log; tool_status=$?; cat target/checks/ci-tests/stdout.log; cat target/checks/ci-tests/stderr.log >&2; printf '%s\\n' \"$tool_status\" > target/checks/ci-tests/status; exit \"$tool_status\""]
timeout-seconds = 1800
inputs = ["ci", ".claude/hooks", "asymptote.toml", "tastemaker.toml", ".github", "crates/*/asymptote.toml", "crates/*/Cargo.toml", "crates/*/release-plz.toml", "crates/*/distribution/registries/npm/dist-workspace.toml", "tools/install.py"]

[[tools]]
id = "checkpoint"
group = "checkpoint"
# The ryo checkpoint validation (crates/ryo/docs/contracts/evidence/checkpoint/README.md): run.py runs every command of
# commands.json over the checked-out source, writes each command's log and exit under target/checks/checkpoint, and writes
# validation.json, identity.json and tests.json beside itself; the checkpoint workflow uploads them with the logs. The commands
# build offline, so the two workspaces they build are fetched first. Its exit is run.py's, from the results alone (a red command no
# README row owns, or a ticked row the results do not prove), kept in target/checks/checkpoint/status. Its output is kept in
# summary.log, and on GitHub Actions each command it did not run (`NOT RUN ruff_parity: parity not run: ...`), each red and a stale
# record go to the run's summary, so an owned refusal is never folded into a green job unseen.
run = ["bash", "-c", "set -e; mkdir -p target/checks/checkpoint; cargo fetch --locked --manifest-path crates/ryo/Cargo.toml; cargo fetch --locked --manifest-path crates/tastemaker/Cargo.toml; set +e -o pipefail; python3 -I crates/ryo/docs/contracts/evidence/checkpoint/run.py target/checks/checkpoint | tee target/checks/checkpoint/summary.log; tool_status=$?; [ -z \"${GITHUB_STEP_SUMMARY:-}\" ] || grep -E '^(NOT RUN|RED|UNTICKED ROW|TICKED ROW|STALE RECORD) ' target/checks/checkpoint/summary.log >> \"$GITHUB_STEP_SUMMARY\"; printf '%s\\n' \"$tool_status\" > target/checks/checkpoint/status; exit \"$tool_status\""]
timeout-seconds = 21600

[[tools]]
id = "speed"
group = "speed"
# A pull request or manual validation's speed against main: main checked out beside the checkout, the `commands` bench of every
# product and ryo's `lint` bench (only when crates/ryo changed) run over both in turn for 5 rounds, and each measure's median
# head/main ratio judged: above 1.15 it fails, above 1.05 it warns. Every declared language parser timing is checked separately. Absolute times are never compared.
run = ["uv", "run", "ci/perf/command.py", "--against", "origin/main", "--bench", "commands", "--bench", "lint", "--bench", "languages", "--output", "target/benchmarks/speed"]
timeout-seconds = 14400

[[tools]]
id = "ryo-rust-peak"
group = "speed"
# The existing Ryo warm-memory regression guard belongs with the same change-speed job; running this focused test group avoids
# discovering unrelated custom Python test harnesses; Python allocation and linter guards remain separate.
run = ["bash", "-c", "mkdir -p target/benchmarks/speed; set +e; cargo nextest run --manifest-path crates/ryo/Cargo.toml --package idiomatic-sh-ryo --locked -E 'test(/^peak::/)' > target/benchmarks/speed/ryo-rust-peak.stdout.log 2> target/benchmarks/speed/ryo-rust-peak.stderr.log; peak_status=$?; cat target/benchmarks/speed/ryo-rust-peak.stdout.log; cat target/benchmarks/speed/ryo-rust-peak.stderr.log >&2; printf '%s\\n' \"$peak_status\" > target/benchmarks/speed/ryo-rust-peak.status; exit \"$peak_status\""]
timeout-seconds = 3600
inputs = ["crates/ryo", "tastemaker", "rust-toolchain.toml", ".cargo"]

[[tools]]
id = "benchmarks"
group = "benchmarks"
# The record of the whole-project benchmarks, run by hand: each product's `distribution` bench and ryo's `lint` bench run once, their
# Bencher Metric Format documents kept under target/benchmarks, which the benchmarks workflow uploads. It judges nothing.
run = ["uv", "run", "ci/perf/command.py", "--bench", "distribution", "--bench", "lint", "--output", "target/benchmarks"]
timeout-seconds = 21600
