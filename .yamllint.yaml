# Parse errors only: every YAML file parses, and nothing about style is judged, so the style rules are off.
rules:
  key-duplicates: enable
ignore: |
  # Not the repository's: build output and installed tools (git ignores them too).
  target/
  .bin/
  node_modules/
  .venv/
  snapshots/
  resources/
  /crates/ryo/languages/*/tests/fixtures/suite/
  /crates/ryo/languages/*/tests/fixtures/corpus/
