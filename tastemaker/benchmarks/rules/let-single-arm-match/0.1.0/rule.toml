description = "Benchmark: duplicates clippy's `match_single_binding`; ruff and eslint have none, for neither Python nor TypeScript has a `match` that is an expression a binding can take; not placed on this repo. A Rust `let` whose initializer is a `match` with exactly one arm."
why = "A `match` with one arm must be exhaustive with it, so its pattern is irrefutable: the `match` is a `let` of that pattern written with an extra block and indentation (clippy's `match_single_binding`, for the case of a `let`). Read from syntax: the initializer is the `let`'s direct `match-expr` child, and the arms are the `match-arm` children of its `match-arm-list`. Not seen: a single-arm `match` in any other position, and one inside a macro's tokens."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let lets = select * from tree-nodes where kind = "let-stmt";
let matches = select * from tree-nodes where kind = "match-expr";
let let-matches = axis(from=lets, relation="syntax-child", direction=child, domain=matches);
let arms = select * from tree-nodes where kind = "match-arm";
let arm-lists = select * from tree-nodes where kind = "match-arm-list";
let arm-parents = axis(from=arms, relation="syntax-child", direction=parent, domain=arm-lists);
let arm-counts = group-count(from=arm-parents, keys=["related"], count="arms", distinct="id");
let single-arm-lists = select * from arm-counts where arms = 1;
let list-owners = select r."parent" as "match" from single-arm-lists as l join "syntax-child" as r on l."related" = r."child";
let single-arm-lets = select l."file" as "file", l."span" as "span" from let-matches as l join list-owners as r on l."related" = r."match";
emit single-arm-lets subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this `let` binds a `match` with one arm"
help = "Write the arm's pattern as the `let`'s pattern, or its body as the initializer."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'single-arm'
scenario = 'A let binds a match with one arm.'
given.files.'src/lib.rs' = '''
pub fn sum(pair: (u32, u32)) -> u32 {
    let total = match pair {
        (left, right) => left + right,
    };
    total
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 2 },
]

[[scenarios]]
id = 'two-arms'
scenario = 'A let binds a match with two arms.'
given.files.'src/lib.rs' = '''
pub fn pick(value: Option<u32>) -> u32 {
    let picked = match value {
        Some(inner) => inner,
        None => 0,
    };
    picked
}
'''

[[scenarios]]
id = 'one-arm-match-let-s-initializer'
scenario = "A one-arm match that is not a let's initializer."
given.files.'src/lib.rs' = '''
pub fn show(pair: (u32, u32)) {
    match pair {
        (left, _) => {
            let _ = left;
        }
    }
}
'''
