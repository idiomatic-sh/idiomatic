description = "Benchmark: not placed on this repo. No Rust source file is named, through written paths, by more than `max-dependents` other source files."
why = "A file that most of a crate names is a hub: every change to it reaches all its dependents, and it tends to collect unrelated items because everything already reaches it. Edges are the provider's source dependencies (a written path in one file naming a module another file owns), counted once per depending file however many paths it writes. Not seen: a dependency written inside a macro invocation's tokens, or through a glob import the provider cannot resolve to a file."

query = '''
param max-dependents: integer;
let foreign = select * from "source-dependency" where source != target;
let dependents = group-count(from=foreign, keys=["target"], count="dependents", distinct="source");
let hubs = select * from dependents where dependents > $max-dependents;
let located = project(from=hubs, columns=["target", "dependents"]);
emit located subject "target" key("target");
'''

[params.max-dependents]
type = "integer"
description = "The most other files that may name one file's modules."

[diagnostic]
primary = "target"
message = "`{target}` is named by {dependents} other source files"
help = "Split the hub by what its dependents use, so each change reaches only the files that need it."

[given]
include = ['**']
params = { max-dependents = 2 }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/hub.rs' = '''
pub struct Hub;
'''
files.'src/user0.rs' = '''
use crate::hub::Hub;

pub struct User0(pub Hub);
'''
files.'src/user1.rs' = '''
use crate::hub::Hub;

pub struct User1(pub Hub);
'''

[[scenarios]]
id = 'three-files-name-one-file-over-limit'
scenario = 'Three files name one file over a limit of two.'
given.files.'src/lib.rs' = '''
mod hub;
mod user0;
mod user1;
mod user2;
'''
given.files.'src/user2.rs' = '''
use crate::hub::Hub;

pub struct User2(pub Hub);
'''
then.findings = [
  { path = 'src/hub.rs' },
]

[[scenarios]]
id = 'two-files-name-one-file'
scenario = 'Two files name one file.'
given.files.'src/lib.rs' = '''
mod hub;
mod user0;
mod user1;
'''
