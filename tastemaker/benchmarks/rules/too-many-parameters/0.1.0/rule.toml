description = "Benchmark: duplicates clippy's `too_many_arguments`, ruff's `PLR0913` (too-many-arguments) and eslint's `max-params`; not placed on this repo. A function, method, closure or lambda declares at most `max-parameters` parameters, a method's receiver (`self`) included."
why = "A long parameter list is a struct the caller has to assemble one argument at a time, in an order the types rarely check (clippy's `too_many_arguments`, ruff's `PLR0913`, eslint's `max-params`). Read from the shared `parameter` relation in every language, counted per callable: a parameter's owner is its callable's id, so a function over the limit is reported at the function, and a callable the function relation does not hold (a Rust closure, a Python lambda) at its own node. Variadic parameters (`*args`, `**kwargs`, `...rest`) count as one each. A callable with a parameter written as a pattern the relation has no row for (`_`, a tuple or struct pattern) is left undecided rather than guessed."

query = '''
param max-parameters: integer;
let counted = group-count(from="parameter", keys=["owner", "file"], count="parameters", distinct="id");
let over = select * from counted where $max-parameters < parameters;
let functions = select l."file" as "file", r."span" as "span", l."parameters" as "parameters" from over as l join "function" as r on l."owner" = r."id";
let closures-over = antijoin(left=over, right="function", left-on=["owner"], right-on=["id"]);
let closures = select l."file" as "file", r."span" as "span", l."parameters" as "parameters" from closures-over as l join "syntax-tree" as r on l."owner" = r."id";
let reported = union(left=functions, right=closures);
emit reported subject "file" key("span");
'''

[params.max-parameters]
type = "integer"
description = "The most parameters a callable may declare (clippy's default is 7)."

[diagnostic]
primary = "span"
message = "this callable declares {parameters} parameters, over the limit"
help = "Group the parameters that travel together into a struct."

[given]
include = ['**']
params = { max-parameters = 3 }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
mod code;
'''

[[scenarios]]
id = 'function-three-parameters'
scenario = 'A function with three parameters.'
given.files.'src/lib.rs' = '''
pub fn add(a: u8, b: u8, c: u8) -> u8 {
    a + b + c
}
'''

[[scenarios]]
id = 'function-four-parameters'
scenario = 'A function with four parameters.'
given.files.'src/code.rs' = '''
pub fn add(a: u8, b: u8, c: u8, d: u8) -> u8 {
    a + b + c + d
}
'''
then.findings = [
  { path = 'src/code.rs', line = 1 },
]

[[scenarios]]
id = 'method-whose-receiver-makes-four'
scenario = 'A method whose receiver makes four.'
given.files.'src/code.rs' = '''
pub struct Sum;

impl Sum {
    pub fn add(&self, a: u8, b: u8, c: u8) -> u8 {
        a + b + c
    }
}
'''
then.findings = [
  { path = 'src/code.rs', line = 4 },
]

[[scenarios]]
id = 'closure-four-parameters'
scenario = 'A closure with four parameters.'
given.files.'src/code.rs' = '''
pub fn value() -> u8 {
    let add = |a: u8, b: u8, c: u8, d: u8| a + b + c + d;
    add(1, 2, 3, 4)
}
'''
then.findings = [
  { path = 'src/code.rs', line = 2 },
]

[[scenarios]]
id = 'documented-function-shown-at-its-signature'
scenario = 'A documented function over the limit is shown at its signature, not its doc comment.'
given.files.'src/code.rs' = '''
/// Adds four numbers.
///
/// The sum wraps on overflow.
pub fn add(a: u8, b: u8, c: u8, d: u8) -> u8 {
    a.wrapping_add(b).wrapping_add(c).wrapping_add(d)
}
'''
then.findings = [
  { path = 'src/code.rs', line = 4 },
]

[[scenarios]]
id = 'plain-commented-function-shown-at-its-comment'
scenario = 'A function over the limit under a plain comment is shown at the comment: only documentation is passed over.'
given.files.'src/code.rs' = '''
// A copy.
pub fn add(a: u8, b: u8, c: u8, d: u8) -> u8 {
    a.wrapping_add(b).wrapping_add(c).wrapping_add(d)
}
'''
then.findings = [
  { path = 'src/code.rs', line = 1 },
]

[[scenarios]]
id = 'typescript-function-three-parameters'
scenario = 'A TypeScript function with three parameters.'
given.params = { max-parameters = 3 }
given.files.'src/add.ts' = '''
export function add(a: number, b: number, c: number): number {
  return a + b + c
}
'''

[[scenarios]]
id = 'typescript-function-method-and-arrow-four-parameters'
scenario = 'A TypeScript function, a method and an arrow function with four parameters each.'
given.params = { max-parameters = 3 }
given.files.'src/add.ts' = '''
export function add(a: number, b: number, c: number, d: number): number {
  return a + b + c + d
}

export class Sum {
  add(a: number, b: number, c: number, d: number): number {
    return a + b + c + d
  }
}

export const sum = (a: number, b: number, c: number, d: number): number => a + b + c + d
'''
then.findings = [
  { path = 'src/add.ts', line = 1 },
  { path = 'src/add.ts', line = 6 },
  { path = 'src/add.ts', line = 11 },
]

[[scenarios]]
id = 'python-function-three-parameters'
scenario = 'A Python function with three parameters.'
given.params = { max-parameters = 3 }
given.files.'pkg/add.py' = '''
def add(a, b, c):
    return a + b + c
'''

[[scenarios]]
id = 'python-function-method-and-lambda-four-parameters'
scenario = 'A Python function with variadic parameters, a method whose self makes four, and a lambda with four parameters.'
given.params = { max-parameters = 3 }
given.files.'pkg/add.py' = '''
def add(a, b, *args, **kwargs):
    return a + b


class Sum:
    def add(self, a, b, c):
        return a + b + c


total = lambda a, b, c, d: a + b + c + d
'''
then.findings = [
  { path = 'pkg/add.py', line = 1 },
  { path = 'pkg/add.py', line = 6 },
  { path = 'pkg/add.py', line = 10 },
]
