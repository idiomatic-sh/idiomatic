description = "Benchmark: the shared copy conflicts with the concept spec's one-file types.rs; not placed on this repo. A `types.rs` (a core's, an adapter hex's or an adapter's) holds only plain definitions, with no function body; a value with any hand-written behaviour lives in `types/<value>/value.rs`, and a `value.rs` without a function body is plain data that belongs in `types.rs`."
why = "Behaviour and definition are filed apart. A function body is the mechanical trigger, so where a value lives is never a choice: a plain struct or enum, derives included, is defined in `types.rs`; one with an `impl` holding a body, trait impls included, gets its own directory and its own test (`hex-members`). A body generated by a macro is not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let fn-nodes = select * from tree-nodes where kind = "fn";
let fn-children = select r."child" as "child", l."file" as "file", l."span" as "span" from fn-nodes as l join "syntax-child" as r on l."id" = r."parent";
let blocks = select * from tree-nodes where kind = "block-expr";
let bodied-fns = select l."file" as "file", l."span" as "span" from fn-children as l join blocks as r on l."child" = r."id";
let types-fns = select * from bodied-fns where glob_any(file, "{types.rs,**/types.rs}");
let behaviour = extend(from=types-fns, values={"problem": "is a function body in types.rs: move this value to `types/<value>/value.rs`"});
let files = select * from tree-nodes where kind = "source-file";
let value-files = select * from files where glob_any(file, "{types/*/value.rs,**/types/*/value.rs}");
let bodied-paths = project(from=bodied-fns, columns=["file"]);
let plain-files = antijoin(left=value-files, right=bodied-paths, left-on=["file"], right-on=["file"]);
let plain-rows = project(from=plain-files, columns=["file", "span"]);
let plain = extend(from=plain-rows, values={"problem": "is a value.rs with no function body: define this plain value in types.rs"});
let findings = union(left=behaviour, right=plain);
emit findings subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "this {problem}"
help = "A value with behaviour, any `impl` holding a function body, trait impls included, is `types/<value>/value.rs`, declared by `types/<value>.rs`, listed by `pub mod <value>;` in types.rs, and proven by `value_test.rs` beside it; a plain struct or enum, derives included, is defined in types.rs. In an adapter the same holds for each hex's `types/` and for each adapter's `adapters/<implementation>/types/`."

[given]
include = ['**/types.rs', '**/types/*/value.rs']

[[scenarios]]
id = 'plain-values-types-rs-values-behaviour-filed'
scenario = 'Plain values in types.rs and values with behaviour filed, in the hex and in an adapter.'
given.files.'src/greeting/adapters/memory/types.rs' = '''
//! The memory adapter's values.

pub mod shelf;
'''
given.files.'src/greeting/adapters/memory/types/shelf/value.rs' = '''
//! The `Shelf` value.

pub struct Shelf(Vec<String>);

impl Shelf {
    pub fn len(&self) -> usize {
        self.0.len()
    }
}
'''
given.files.'src/greeting/types.rs' = '''
//! The greeting domain's values.

pub mod greeting;

/// Someone to greet.
#[derive(Clone, Debug, Default, PartialEq, Eq)]
pub struct Name(String);
'''
given.files.'src/greeting/types/greeting/value.rs' = '''
//! The `Greeting` value.

/// A greeting's text.
pub struct Greeting(String);

impl std::fmt::Display for Greeting {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        f.write_str(&self.0)
    }
}
'''

[[scenarios]]
id = 'behaviour-in-types'
scenario = 'A function body in types.rs.'
given.files.'src/greeting/types.rs' = '''
//! The greeting domain's values.

/// Someone to greet.
pub struct Name(String);

impl Name {
    pub fn new(name: String) -> Self {
        Self(name)
    }
}
'''
then.findings = [
  { path = 'src/greeting/types.rs', line = 7 },
]

[[scenarios]]
id = 'trait-impl-in-adapter-types'
scenario = "A hand-written trait impl in an adapter's types.rs."
given.files.'src/greeting/adapters/memory/types.rs' = '''
//! The memory adapter's values.

pub struct Shelf(Vec<String>);

impl Default for Shelf {
    fn default() -> Self {
        Self(Vec::new())
    }
}
'''
then.findings = [
  { path = 'src/greeting/adapters/memory/types.rs', line = 6 },
]

[[scenarios]]
id = 'plain-value-file'
scenario = 'A value.rs holding only a plain definition.'
given.files.'src/greeting/types.rs' = '''
//! The greeting domain's values.

pub mod greeting;
'''
given.files.'src/greeting/types/greeting/value.rs' = '''
//! The `Greeting` value.

#[derive(Debug)]
pub struct Greeting(String);
'''
then.findings = [
  { path = 'src/greeting/types/greeting/value.rs', line = 3 },
]
