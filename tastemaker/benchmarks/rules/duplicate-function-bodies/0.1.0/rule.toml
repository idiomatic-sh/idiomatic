description = "Benchmark: reports the wiring use cases repeat by design (composition is not DRY); not placed on this repo. Two functions of one name in two files, each holding at least `min-tokens` significant tokens, whose bodies spell the same sequence of token texts: a likely copied body."
why = "A body copied between files is one behaviour kept in several places, and a fix to one copy misses the others. Two functions of one name in different files are a copy when they spell the same token texts (identifiers, keywords, literals and punctuation, not whitespace or comments) in the same order and number: each token is placed by how many tokens come before it in its function, and the two sequences must match token for token, so the same tokens reordered or repeated a different number of times (two relation items' `kinds()` arrays) are no copy. A copy that renamed the function, or changed one token, is not seen. Methods count as functions; a `fmt` (a `Display` or `Debug` implementation, alike by its trait) is not compared, and files a template places are left out by the entry's `exclude`."

query = '''
param min-tokens: integer;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let fn-nodes = select * from tree-nodes where kind = "fn";
let compared = select * from "function" where name != "fmt";
let functions = select l."id" as "function", r."id" as "id", l."name" as "name", l."file" as "file", l."span" as "span" from compared as l join fn-nodes as r on l."file" = r."file" and l."span" = r."span";
let function-nodes = axis(from=functions, relation="syntax-child", direction=descendant, domain=tree-nodes);
let function-token-edges = select r."child" as "child", l."function" as "function", l."name" as "name", l."file" as "file", l."span" as "span" from function-nodes as l join "syntax-child" as r on l."related" = r."parent";
let significant = select * from tree-tokens where kind != "whitespace";
let code-tokens = select * from significant where kind != "comment";
let function-tokens = select l."function" as "function", l."name" as "name", l."file" as "file", l."span" as "span", r."text" as "text", r."id" as "token" from function-token-edges as l join code-tokens as r on l."child" = r."id";
let token-counts = group-count(from=function-tokens, keys=["function", "file", "span", "name"], count="tokens", distinct="token");
let large = select * from token-counts where tokens >= $min-tokens;
let same-name = select l."function" as "function", l."name" as "name", r."function" as "other", r."file" as "other-path", l."file" as "file", l."span" as "span" from large as l join large as r on l."name" = r."name";
let pairs = select * from same-name where other-path != file;
let text-uses = group-count(from=function-tokens, keys=["function", "text"], count="uses", distinct="token");
let own-texts = select l."function" as "function", l."other" as "other", r."text" as "text", r."uses" as "uses" from pairs as l join text-uses as r on l."function" = r."function";
let own-only = antijoin(left=own-texts, right=text-uses, left-on=["other", "text", "uses"], right-on=["function", "text", "uses"]);
let own-mismatches = project(from=own-only, columns=["function", "other"]);
let other-texts = select l."function" as "function", l."other" as "other", r."text" as "text", r."uses" as "uses" from pairs as l join text-uses as r on l."other" = r."function";
let other-only = antijoin(left=other-texts, right=text-uses, left-on=["function", "text", "uses"], right-on=["function", "text", "uses"]);
let other-mismatches = project(from=other-only, columns=["function", "other"]);
let mismatches = union(left=own-mismatches, right=other-mismatches);
let alike = antijoin(left=pairs, right=mismatches, left-on=["function", "other"], right-on=["function", "other"]);
let alike-functions = project(from=alike, columns=["function"]);
let alike-tokens = select l."function" as "function", l."token" as "id", l."text" as "text" from function-tokens as l join alike-functions as r on l."function" = r."function";
let alike-nodes = select l."function" as "function", l."related" as "id" from function-nodes as l join alike-functions as r on l."function" = r."function";
let token-ancestors = axis(from=alike-tokens, relation="syntax-child", direction=ancestor, domain=tree-nodes);
let inner-ancestors = select l."function" as "function", l."id" as "token", l."related" as "place" from token-ancestors as l join alike-nodes as r on l."related" = r."id" and l."function" = r."function";
let token-selves = select l."function" as "function", l."id" as "token", r."id" as "place" from alike-tokens as l join alike-tokens as r on l."id" = r."id" and l."function" = r."function";
let places = union(left=inner-ancestors, right=token-selves);
let place-edges = select l."function" as "function", l."token" as "token", r."parent" as "parent", r."ordinal" as "ordinal" from places as l join "syntax-child" as r on l."place" = r."child";
let sibling-edges = select l."function" as "function", l."token" as "token", r."child" as "id", r."ordinal" as "sibling", l."ordinal" as "ordinal" from place-edges as l join "syntax-child" as r on l."parent" = r."parent";
let earlier = select * from sibling-edges where sibling < ordinal;
let earlier-selves = select l."function" as "function", l."token" as "token", r."id" as "before" from earlier as l join code-tokens as r on l."id" = r."id";
let earlier-descendants = axis(from=earlier, relation="syntax-child", direction=descendant, domain=code-tokens);
let earlier-below = select l."function" as "function", l."token" as "token", l."related" as "before" from earlier-descendants as l;
let earlier-tokens = union(left=earlier-selves, right=earlier-below);
let ranks = group-count(from=earlier-tokens, keys=["function", "token"], count="rank", distinct="before");
let ranked = select l."function" as "function", l."rank" as "rank", r."text" as "text" from ranks as l join alike-tokens as r on l."function" = r."function" and l."token" = r."id";
let own-sequence = select l."function" as "function", l."other" as "other", r."rank" as "rank", r."text" as "text" from alike as l join ranked as r on l."function" = r."function";
let out-of-place = antijoin(left=own-sequence, right=ranked, left-on=["other", "rank", "text"], right-on=["function", "rank", "text"]);
let reordered = project(from=out-of-place, columns=["function", "other"]);
let copies = antijoin(left=alike, right=reordered, left-on=["function", "other"], right-on=["function", "other"]);
let copied-files = project(from=copies, columns=["file", "span", "name", "other-path"]);
emit copied-files subject "file" key("span", "other-path");
'''

[params.min-tokens]
type = "integer"
description = "The fewest significant tokens a function must hold to be compared."

[diagnostic]
primary = "span"
message = "`{name}` spells the same tokens as its namesake in `{other-path}`"
help = "Keep one copy where the behaviour belongs and call it from the others."

[given]
include = ['**']
params = { min-tokens = 10 }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
mod other;

pub(crate) fn parse(text: &str) -> Option<u32> {
    let trimmed = text.trim();
    trimmed.parse::<u32>().ok()
}
'''

[[scenarios]]
id = 'one-parse-function-copied-into-two-files'
scenario = 'One parse function copied into two files; the copy under a plain comment is shown at the comment, which only documentation is passed over for.'
given.files.'src/other.rs' = '''
// A copy.
pub(crate) fn parse(text: &str) -> Option<u32> {
    let trimmed = text.trim();
    trimmed.parse::<u32>().ok()
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 3 },
  { path = 'src/other.rs', line = 1 },
]

[[scenarios]]
id = 'second-copy-calls-another-method'
scenario = 'The second copy calls another method.'
given.files.'src/other.rs' = '''
pub(crate) fn parse(text: &str) -> Option<u32> {
    let trimmed = text.trim_start();
    let clean = trimmed.trim_end();
    clean.parse::<u32>().ok()
}
'''

[[scenarios]]
id = 'body-under-min-tokens-two-files'
scenario = 'A body under min-tokens in two files.'
given.files.'src/lib.rs' = '''
mod other;

fn zero() {}
'''
given.files.'src/other.rs' = '''
fn zero() {}
'''

[[scenarios]]
id = 'parameterless-body-copied-into-two-files'
scenario = 'A parameterless body copied into two files.'
given.files.'src/lib.rs' = '''
mod other;

pub(crate) fn defaults() -> Vec<u32> {
    let mut values = Vec::new();
    values.push(1);
    values
}
'''
given.files.'src/other.rs' = '''
pub(crate) fn defaults() -> Vec<u32> {
    let mut values = Vec::new();
    values.push(1);
    values
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 3 },
  { path = 'src/other.rs', line = 1 },
]

[[scenarios]]
id = 'two-namesakes'
scenario = 'The other file holds two namesakes, one a copy.'
given.files.'src/lib.rs' = '''
mod other;

pub(crate) struct Meters(pub(crate) u32);

impl Meters {
    pub(crate) fn parse(text: &str) -> Option<u32> {
        let trimmed = text.trim();
        trimmed.parse::<u32>().ok()
    }
}
'''
given.files.'src/other.rs' = '''
pub(crate) struct Feet(pub(crate) u32);
pub(crate) struct Yards(pub(crate) u32);

impl Feet {
    pub(crate) fn parse(text: &str) -> Option<u32> {
        let trimmed = text.trim();
        trimmed.parse::<u32>().ok()
    }
}

impl Yards {
    pub(crate) fn parse(text: &str) -> Option<u32> {
        let trimmed = text.trim();
        trimmed.parse::<u32>().ok()
    }
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 6 },
  { path = 'src/other.rs', line = 5 },
  { path = 'src/other.rs', line = 12 },
]

[[scenarios]]
id = 'same-tokens-other-order-or-count'
scenario = 'Two namesakes spell the same token texts, one in another order and one with other counts: neither is a copy.'
given.files.'src/lib.rs' = '''
mod first;
mod second;
mod third;

pub(crate) enum Kind {
    File,
    Symbol,
    Flag,
}
'''
given.files.'src/first.rs' = '''
use crate::Kind;

pub(crate) fn kinds() -> &'static [Kind] {
    &[Kind::File, Kind::File, Kind::Symbol, Kind::Flag]
}
'''
given.files.'src/second.rs' = '''
use crate::Kind;

pub(crate) fn kinds() -> &'static [Kind] {
    &[Kind::File, Kind::Symbol, Kind::File, Kind::Flag]
}
'''
given.files.'src/third.rs' = '''
use crate::Kind;

pub(crate) fn kinds() -> &'static [Kind] {
    &[Kind::File, Kind::Symbol, Kind::Symbol, Kind::Flag]
}
'''
then.findings = []

[[scenarios]]
id = 'fmt-not-compared'
scenario = 'Two `fmt` implementations spelling the same tokens are not compared.'
given.files.'src/lib.rs' = '''
mod first;
mod second;
'''
given.files.'src/first.rs' = '''
pub(crate) struct First;

impl std::fmt::Display for First {
    fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        formatter.write_str("named")
    }
}
'''
given.files.'src/second.rs' = '''
pub(crate) struct Second;

impl std::fmt::Display for Second {
    fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        formatter.write_str("named")
    }
}
'''
then.findings = []
