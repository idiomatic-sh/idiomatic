description = "Benchmark: the shared copy conflicts with kind-suffix, which refuses the Interface suffix; not placed on this repo. A trait declared at module level in an `interface.rs` (an outbound port's, a use case's or a collection's) is named `<Name>Interface`, and one in a `types.rs` is not."
why = "A port is recognised by its name: the `Interface` suffix is what the nominal_types lint and `thin-command` look for, so a port named `Repository` escapes both. A trait in a `types.rs` is a value trait (no `self` method), implemented rather than called, so the suffix there would make it pass for a port. Traits local to a function body are not ports and are not checked."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let traits = select * from tree-nodes where kind = "trait";
let trait-parents = select l."id" as "id", r."parent" as "parent", l."file" as "file", l."span" as "span" from traits as l join "syntax-child" as r on l."id" = r."child";
let modules = select * from tree-nodes where glob_any(kind, "{source-file,item-list}");
let module-traits = select l."id" as "id", l."file" as "file", l."span" as "span" from trait-parents as l join modules as r on l."parent" = r."id";
let trait-name-nodes = select r."child" as "child", l."id" as "id" from module-traits as l join "syntax-child" as r on l."id" = r."parent";
let names = select * from tree-nodes where kind = "name";
let trait-names = select l."id" as "id", r."id" as "name" from trait-name-nodes as l join names as r on l."child" = r."id";
let name-tokens = select l."id" as "id", r."child" as "token" from trait-names as l join "syntax-child" as r on l."name" = r."parent";
let trait-texts = select l."id" as "id", r."text" as "text" from name-tokens as l join tree-tokens as r on l."token" = r."id";
let suffixed = select * from trait-texts where glob_any(text, "*Interface");
let unsuffixed-rows = antijoin(left=module-traits, right=suffixed, left-on=["id"], right-on=["id"]);
let unsuffixed-ports = capture(from=unsuffixed-rows, path="file", pattern="{*hex}/interface.rs", captures=["hex"]);
let unsuffixed-projected = project(from=unsuffixed-ports, columns=["file", "span"]);
let unsuffixed = extend(from=unsuffixed-projected, values={"problem": "a port trait's name does not end in `Interface`"});
let suffixed-rows = select l."file" as "file", l."span" as "span" from module-traits as l join suffixed as r on l."id" = r."id";
let suffixed-values = capture(from=suffixed-rows, path="file", pattern="{*hex}/types.rs", captures=["hex"]);
let suffixed-projected = project(from=suffixed-values, columns=["file", "span"]);
let misnamed-values = extend(from=suffixed-projected, values={"problem": "a value trait in types.rs is named like a port, `<Name>Interface`"});
let findings = union(left=unsuffixed, right=misnamed-values);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "{problem}"
help = "Rename the port in interface.rs to `<Name>Interface`; rename a value trait in types.rs for what it is, without the suffix."

[given]
include = ['**/interface.rs']

[[scenarios]]
id = 'module-level-trait-without-suffix'
scenario = 'A module-level trait without the suffix.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/greeting.rs' = '''
pub mod interface;
'''
given.files.'src/greeting/interface.rs' = '''
pub trait Repository {}
'''
given.files.'src/lib.rs' = '''
pub mod greeting;
'''
then.findings = [
  { path = 'src/greeting/interface.rs', line = 1 },
]

[[scenarios]]
id = 'inline-module-unnamed'
scenario = 'A trait in an inline module without the suffix.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/greeting.rs' = '''
pub mod interface;
'''
given.files.'src/greeting/interface.rs' = '''
pub trait RepositoryInterface {}
pub mod inner {
    pub trait Store {}
}
'''
given.files.'src/lib.rs' = '''
pub mod greeting;
'''
then.findings = [
  { path = 'src/greeting/interface.rs', line = 3 },
]

[[scenarios]]
id = 'suffixed-traits-trait-local-function'
scenario = 'Suffixed traits, and a trait local to a function.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/greeting.rs' = '''
pub mod interface;
'''
given.files.'src/greeting/interface.rs' = '''
pub trait RepositoryInterface {}
pub mod inner {
    pub trait StoreInterface {}
}
pub fn local() {
    trait Local {}
}
'''
given.files.'src/lib.rs' = '''
pub mod greeting;
'''

[[scenarios]]
id = 'trait-outside-interface-rs'
scenario = 'A trait outside interface.rs.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/greeting.rs' = '''
pub mod interface;
pub mod types;
'''
given.files.'src/greeting/interface.rs' = '''
pub trait GreetingInterface {}
'''
given.files.'src/greeting/types.rs' = '''
pub struct Store;
pub trait Repository {}
'''
given.files.'src/lib.rs' = '''
pub mod greeting;
'''

[[scenarios]]
id = 'value-trait-named'
scenario = 'A value trait in types.rs named for what it is.'
given.include = ['**/interface.rs', '**/types.rs']
given.files.'src/greeting/types.rs' = '''
pub trait Record: Sized {
    fn schema() -> usize;
}
'''

[[scenarios]]
id = 'value-trait-suffixed'
scenario = 'A value trait in types.rs named like a port.'
given.include = ['**/interface.rs', '**/types.rs']
given.files.'src/greeting/types.rs' = '''
pub trait RecordInterface: Sized {
    fn schema() -> usize;
}
'''
then.findings = [
  { path = 'src/greeting/types.rs', line = 1 },
]
