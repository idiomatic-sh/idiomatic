description = "Benchmark: not placed on this repo. A struct, enum or trait whose name is used in the source of another crate is also used in the source of the crate that declares it."
why = "A type only other crates use lives in the wrong crate: it belongs with its users, and its crate grows a dependency edge that exists only to carry it. A crate is the directory holding a `src` directory, captured from each path; a use is any path segment naming the type (`Type`, `Type::new`, `other::Type`, an import). Names are compared as written, not resolved, so a name two type-namespace declarations share anywhere (a struct, enum, union, trait, type alias or generic parameter) is ambiguous and never reported. Not seen: a use inside a macro invocation's tokens, and a type used nowhere."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let items = select * from tree-nodes where glob_any(kind, "{struct,enum,trait,union,type-alias,type-param}");
let item-children = select r."child" as "child", l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from items as l join "syntax-child" as r on l."id" = r."parent";
let names = select * from tree-nodes where kind = "name";
let item-names = select l."id" as "id", l."kind" as "kind", r."id" as "name-node", l."file" as "file", l."span" as "span" from item-children as l join names as r on l."child" = r."id";
let name-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."child" as "token" from item-names as l join "syntax-child" as r on l."name-node" = r."parent";
let nominal = select l."id" as "id", l."kind" as "kind", r."text" as "name", l."file" as "file", l."span" as "span" from name-tokens as l join tree-tokens as r on l."token" = r."id";
let types = select * from nominal where glob_any(kind, "{struct,enum,trait}");
let declarations = capture(from=types, path="file", pattern="{*parent}/{crate}/src/{*rest}", captures=["parent", "crate", "rest"]);
let name-counts = group-count(from=nominal, keys=["name"], count="declarations", distinct="id");
let ambiguous = select * from name-counts where declarations > 1;
let unique = antijoin(left=declarations, right=ambiguous, left-on=["name"], right-on=["name"]);
let identifiers = select * from tree-tokens where kind = "ident";
let identifier-parents = select r."parent" as "parent", l."file" as "file", l."text" as "target" from identifiers as l join "syntax-child" as r on l."id" = r."child";
let name-refs = select * from tree-nodes where kind = "name-ref";
let mentions = select l."file" as "file", l."target" as "target" from identifier-parents as l join name-refs as r on l."parent" = r."id";
let uses = capture(from=mentions, path="file", pattern="{*parent}/{crate}/src/{*rest}", captures=["parent", "crate", "rest"]);
let home-uses = project(from=uses, columns=["target", "parent", "crate"]);
let unused-at-home = antijoin(left=unique, right=home-uses, left-on=["name", "parent", "crate"], right-on=["target", "parent", "crate"]);
let used-elsewhere = select l."kind" as "kind", l."name" as "name", l."file" as "file", l."span" as "span", r."file" as "user" from unused-at-home as l join uses as r on l."name" = r."target";
let users = group-count(from=used-elsewhere, keys=["file", "span", "name", "kind"], count="files", distinct="user");
emit users subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{name}` ({kind}) is used by {files} files of other crates and none of its own"
help = "Move it to the crate that uses it, or to a crate shared by its users."

[given]
include = ['**']
files.'Cargo.toml' = '''
[workspace]
resolver = "3"
members = ["crates/*"]
'''
files.'crates/app/Cargo.toml' = '''
[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
model = { path = "../model" }
'''
files.'crates/app/src/lib.rs' = '''
use model::Ticket;
use model::Shared;

pub fn open(_ticket: Ticket, _shared: Shared) {}
'''
files.'crates/model/Cargo.toml' = '''
[package]
name = "model"
version = "0.1.0"
edition = "2024"
'''
files.'crates/model/src/lib.rs' = '''
pub struct Ticket;
'''

[[scenarios]]
id = 'foreign-only'
scenario = 'A type only another crate uses.'
given.files.'crates/model/src/lib.rs' = '''
pub struct Ticket;

pub struct Shared;

pub fn share(shared: Shared) -> Shared {
    shared
}
'''
then.findings = [
  { path = 'crates/model/src/lib.rs', line = 1 },
]

[[scenarios]]
id = 'used-at-home'
scenario = 'Each type is used by its own crate as well.'
given.files.'crates/model/src/lib.rs' = '''
pub struct Ticket;

pub struct Shared;

pub fn issue(ticket: Ticket, shared: Shared) -> (Ticket, Shared) {
    (ticket, shared)
}
'''

[[scenarios]]
id = 'qualified-home-use'
scenario = 'Its own crate uses each type only through a qualified path.'
given.files.'crates/model/src/lib.rs' = '''
pub struct Ticket;

pub struct Shared;

pub fn issue() -> (model_ticket::Ticket, Shared) {
    (crate::Ticket, Shared::default())
}

mod model_ticket {
    pub use crate::Ticket;
}
'''

[[scenarios]]
id = 'generic-parameter'
scenario = 'A generic parameter shares the name, so it is never reported.'
given.files.'crates/app/Cargo.toml' = '''
[package]
name = "app"
version = "0.1.0"
edition = "2024"
'''
given.files.'crates/app/src/lib.rs' = '''
pub fn open<Ticket>(_ticket: Ticket) {}
'''

[[scenarios]]
id = 'two-crates-declare-name-so-never-reported'
scenario = 'Two crates declare the name, so it is never reported.'
given.files.'crates/app/Cargo.toml' = '''
[package]
name = "app"
version = "0.1.0"
edition = "2024"
'''
given.files.'crates/app/src/lib.rs' = '''
pub struct Ticket;

pub fn open(_ticket: Ticket) {}
'''
