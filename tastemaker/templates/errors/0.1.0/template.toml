[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template: a wrapped port error.'
given.file = 'errors.rs'
given.params = { kind = 'use-case', part = 'greet' }
given.files.'errors.rs' = '''
//! The `greet` use case's failures.

/// Why a `greet` operation failed.
#[derive(Debug, thiserror::Error)]
pub enum GreetError {
    /// The names port refused the lookup.
    #[error("the names port refused the lookup")]
    Names(#[from] crate::outbound::names::errors::NamesError),
}
'''

