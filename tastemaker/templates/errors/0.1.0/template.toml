description = "The error a part produces: one thiserror enum `<Part>Error`, or `<Port><Part>Error` for an adapter."
why = "An error lives with the part that produces it: a use case's wraps the errors of the ports it can meet with `#[from]`, a port's is the one failure its adapters construct so no dependency's error crosses the port, a concept's belongs to its service, and an adapter's is its own, named for its port and itself and mapped onto the port's. The enum carries the part's name and the suffix `Error`. It is `pub` where another part returns or matches it, a use case's through its trait and a port's across crates, and private to the module otherwise."
content = '''
{%- set noun = {"use-case": "use case", "concept": "concept", "port": "port", "adapter": "adapter", "item": "item", "command": "command", "entry": "entry"}[kind] -%}
//! The `{{ part }}` {{ noun }}'s failures.

/// Why an operation of `{{ part }}` failed.
#[derive(Debug, thiserror::Error)]
{% if kind == "use-case" or kind == "port" or kind == "entry" %}pub {% endif %}enum {% if kind == "adapter" %}{{ port | pascal }}{% endif %}{{ part | pascal }}Error {}
'''

[params]
kind = { type = "string", description = "What the part is: use-case, concept, port or adapter." }
part = { type = "identifier", from = "directory-name", description = "The part's directory name: the stem of every name in it." }
port = { type = "identifier", from = "directory-name", description = "The outbound port an adapter implements, taken from the placing entry's `{port}` capture; the other kinds do not read it." }

[[scenarios]]
id = 'example-use-case'
scenario = 'The rendered template passes for a use case.'
given.file = 'errors.rs'
given.params = { kind = 'use-case', part = 'greet' }
given.files.'errors.rs' = '''
//! The `greet` use case's failures.

/// Why an operation of `greet` failed.
#[derive(Debug, thiserror::Error)]
pub enum GreetError {}
'''

