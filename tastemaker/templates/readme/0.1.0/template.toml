description = "A README: what the directory is for."
why = "Says what a directory is for, where no more specific README template applies."
content = '''
# {{ name }}
'''

[params]
name = { type = "identifier", from = "directory-name", description = "What the README describes, its directory's name." }

[given]
file = 'app/README.md'
params = { name = 'app' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'app/README.md' = '''
# app
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'app/README.md' = '''
# app
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'readme#count', path = 'tastemaker.toml' },
]
