description = "The repository's Cargo configuration: the mold linker on Linux, line tables instead of full debug info, no dependency debug info, no incremental state, and the aliases that run each workspace's pinned tools."
why = "Makes every workspace build and link the same way and run its pinned tools through one alias, so a build does not depend on what a machine has installed."
content = '''
# Statically link the C runtime so the shipped executable does not depend on a
# separately installed MSVC redistributable.
[target.'cfg(all(target_env = "msvc", target_os = "windows"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Link with mold on Linux: an incremental `cargo test --no-run` of a ryo provider
# crate fell from a median 10.0 s to 5.3 s. gcc and clang both take the flag.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Backtraces keep file and line; full debug info only fills target/. Line tables cut
# a Tastemaker test build's target directory by 34% and its compile CPU by 10%, and
# dropping dependency debug info entirely cut a ryo one by 9%.
#
# No incremental state. Work here is a fresh worktree built once: its `cargo check` and
# test build of ryo fell from 138 s to 96 s and its target directory from 17.1 GB to
# 8.9 GB, while rebuilding the tests after an edit to a crate everything depends on rose
# from 15 s to 30 s.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0

[alias]
# The cargo subcommands are installed at the versions tools/install.py declares (once for the repository, or in the one
# product that runs a tool), so `cargo deny`, `cargo hack`, `cargo nextest`, `cargo semver-checks` and `cargo public-api` need no alias.
mutate = ["mutants", "--test-workspace=true", "--annotations=none"]
mutate-all = ["mutate", "--workspace"]
coverage = ["llvm-cov", "--all-targets"]
coverage-all = ["coverage", "--workspace", "--all-features"]
performance = ["bench", "--benches", "--all-features"]
performance-all = ["performance", "--workspace"]
'''

[given]
file = '.cargo/config.toml'

