description = "Proves one domain concept's rules, beside them in domain/<concept>/."
why = "Keeps the proof of a concept's pure rules beside them, so each rule is tested on values alone, without ports, fakes or IO, and a rule never runs unproven."
content = '''
//! Proves the {{ domain }} domain's `{{ concept }}` rules.
'''

[params]
domain = { type = "identifier", from = "directory-name", description = "The domain, its directory's name." }
concept = { type = "identifier", description = "The concept, captured from its path." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'src/greeting/domain/short/domain_test.rs'
given.params = { domain = 'greeting', concept = 'short' }
given.files.'src/greeting/domain/short/domain_test.rs' = '''
//! Proves the greeting domain's `short` rules.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'src/greeting/domain/short/domain_test.rs'
given.params = { domain = 'greeting', concept = 'short' }
given.files.'src/greeting/domain/short/domain_test.rs' = '''
//! Proves the greeting domain's `short` rules.

use super::domain::short;

#[test]
fn short_succeeds() {
    assert!(short(&[], 3).is_empty());
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/greeting/domain/short/domain_test.rs'
given.params = { domain = 'greeting', concept = 'short' }
then.findings = [
  { rule = 'domain-test#count', path = 'tastemaker.toml' },
]
