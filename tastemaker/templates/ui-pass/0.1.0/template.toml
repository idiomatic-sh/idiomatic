description = "A compile-pass case: code the compiler must accept."
why = "Is code the compiler must accept, beside the code it must reject, so a crate's compile-time promises are proven from both sides: the case that fails shows what the type refuses, and the case that passes shows that what it refuses is not everything."
content = '''
//! {{ case }}: the compiler accepts this.

fn main() {}
'''

[params]
case = { type = "identifier", description = "The UI case, captured from its path." }

[given]
file = 'macros/tests/ui/pass_every_relation.rs'
params = { case = 'every_relation' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'macros/tests/ui/pass_every_relation.rs' = '''
//! every_relation: the compiler accepts this.

fn main() {}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'macros/tests/ui/pass_every_relation.rs' = '''
//! every_relation: the compiler accepts this.

use std::fmt;

fn main() {}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'ui-pass#count', path = 'tastemaker.toml' },
]

[[scenarios]]
id = 'no-main'
scenario = 'The case has no main.'
given.files.'macros/tests/ui/pass_every_relation.rs' = '''
//! every_relation: the compiler accepts this.
'''
then.findings = [
  { rule = 'ui-pass#template', path = 'macros/tests/ui/pass_every_relation.rs' },
]
