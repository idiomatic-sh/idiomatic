description = "One collection's module file in a feature or provider crate: the interface every item implements and each of its items as `pub(crate) mod`; its other files are declared as `module-declares` requires."
why = "Declares a collection's shape and its items: N implementations of one shape, the shape stated once at the collection. Its items are listed by the filesystem and compiled through this one file, in order. It declares only the members every collection has; the shared rule `module-declares` holds that it declares the others it sits beside, the shared cases, the types, the errors and their tests."
content = '''
//! One collection: the interface every item implements (when it declares its own), its items in order, and the types, errors and contract it has.

{%- set vis = "pub(crate) " if "ryo::languages::" in (item_trait | default("") | string) else "" %}
{%- if present["collection-interface"] | default(true) %}
mod interface;
{%- endif %}
{%- if present["collection-types"] | default(false) %}
pub(crate) mod types;
{%- endif %}
{%- if present["collection-errors"] | default(false) %}
pub(crate) mod errors;
{%- endif %}
{%- for name in captures.item | default([]) %}
{{ vis }}mod {{ name }};
{%- endfor %}
{%- if present["collection-fixtures"] | default(false) %}

#[cfg(any(test, feature = "fixtures"))]
pub(crate) mod fixtures;
{%- endif %}
'''

[params]
item-trait = { type = "list<string>", description = "The `<collection>=<trait path>` pairs of the crate: when a collection names a trait of the ryo language contract, its items are crate-private (`pub(crate)`), which the contracts of the language reach them by." }

[given]
file = 'src/collections/passes.rs'
params = { item-trait = [] }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/collections/passes.rs' = '''
//! One collection: the interface every item implements, and each of its items in order.

pub(crate) mod interface;
'''
given.files.'src/greeting/collections/phrases.rs' = '''
//! One collection: each of its items, one directory each.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/collections/passes.rs' = '''
//! One collection: the interface every item implements, and each of its items in order.

pub(crate) mod interface;

// More.
'''
given.files.'src/greeting/collections/phrases.rs' = '''
//! One collection: each of its items, one directory each.

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'collection#count', path = 'tastemaker.toml' },
]
