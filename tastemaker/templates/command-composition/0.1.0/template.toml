description = "A command's composition: its whole wiring, the one place its implementations are chosen and its shared resources built, as `compose(parts)` and the production `build()`."
why = "Composition is the edge's concern, one per command: the command's own composition.rs chooses implementations and builds each shared resource once. Splitting it into `compose`, which takes every port the command wires as a part, and `build`, which passes the production parts to `compose`, lets a bench or a test run the command with one part real and the rest faked, or with another adapter in one place, through the same wiring the command uses, so it never copies the wiring and never drifts from it."
content = '''
//! The wiring of `{{ resource }} {{ command }}`: the edge chooses each implementation, builds
//! every shared resource once and passes it to each factory that needs it, and builds the
//! service the command calls. Nothing here implements a port.
//!
//! `compose` is the one wiring, over every port the command's graph wires, each a field of
//! the parts; `build` hands it the production parts. A bench or a test calls `compose` with
//! any part replaced (a fake, a replay of a capture, another adapter), so it never copies the
//! command's wiring and never drifts from it.

/// Every port `{{ resource }} {{ command }}` wires: one field per port, generic over its interface.
pub struct {{ resource | pascal }}{{ command | pascal }}Parts;

/// The service `{{ resource }} {{ command }}` calls, wired from `parts`.
pub fn compose(_parts: {{ resource | pascal }}{{ command | pascal }}Parts) {}

/// The service `{{ resource }} {{ command }}` calls, from the production parts.
pub fn build() {
    compose({{ resource | pascal }}{{ command | pascal }}Parts);
}
'''

[params]
resource = { type = "identifier", description = "The resource, captured from its path." }
command = { type = "identifier", description = "The command, captured from its path." }

