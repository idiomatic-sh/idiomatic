//! every shared resource once and passes it to each factory that needs it, and builds the
//! service the command calls. Nothing here implements a port.
//!
//! `compose` is the one wiring, over every port the command's graph wires, each a field of
//! the parts; `build` hands it the production parts. A bench or a test calls `compose` with
//! any part replaced (a fake, a replay of a capture, another adapter), so it never copies the
//! command's wiring and never drifts from it.

/// Every port `greeting show` wires: one field per port, generic over its interface.
pub struct GreetingShowParts;

/// The service `greeting show` calls, wired from `parts`.
pub fn compose(_parts: GreetingShowParts) {}

/// The service `greeting show` calls, from the production parts.
pub fn build() {
    compose(GreetingShowParts);
}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A real wiring: the parts, compose over them, and build passing the production parts.'
given.file = 'cli/src/commands/greeting/show/composition.rs'
given.params = { resource = 'greeting', command = 'show' }
given.files.'cli/src/commands/greeting/show/composition.rs' = '''
//! The wiring of `greeting show`: the edge chooses each implementation, builds
//! every shared resource once and passes it to each factory that needs it, and builds the
//! service the command calls. Nothing here implements a port.
//!
//! `compose` is the one wiring, over every port the command's graph wires, each a field of
//! the parts; `build` hands it the production parts. A bench or a test calls `compose` with
//! any part replaced (a fake, a replay of a capture, another adapter), so it never copies the
//! command's wiring and never drifts from it.

use demo_greeting::greeting::use_cases::greet::use_case::GreetingGreet;
use demo_store::storage::interface::StorageInterface;

/// Every port `greeting show` wires: one field per port, generic over its interface.
pub struct GreetingShowParts<Storage> {
    pub storage: Storage,
}

/// The service `greeting show` calls, wired from `parts`.
pub fn compose<Storage: StorageInterface>(parts: GreetingShowParts<Storage>) -> GreetingGreet<Storage> {
    GreetingGreet::new(parts.storage)
}

/// The service `greeting show` calls, from the production parts.
pub fn build() -> GreetingGreet<impl StorageInterface> {
    compose(GreetingShowParts {
        storage: demo_store::storage::factory::memory(),
    })
}
'''

