description = "The allocation row of the whole per-file path: a test of its own that runs alone in its process with `dhat` as the global allocator, lints the core's own corpus (the fake language and every operator's rule), and checks that a file allocates no more than the parser does on its own."
why = "The language's own allocation row proves the language adds nothing per file; it cannot see what the core and the store add. The whole path has none after warm-up: the language writes each row once into the worker's table of the store, the operators read the store's columns in place, and the tables they compute in are the worker's, emptied and filled again. Only a count proves it, and only a process of its own can count: a global allocator counts every thread, so the test has no harness and no other test beside it. The measuring and the comparison are the core's contract (`ryo_core::inbound::use_cases::lint::fixtures::contract::allocation`), the same in every product: weakening a check means editing it there, once, and the test file is the allocator, the function that does only what the parser does for a file, and the call. The corpus is the core's own, never a language's."
content = '''
//! The allocation row of the whole per-file path: `lint` over the core's own corpus, the fake language and every
//! operator's rule, allocates no more for a file than the parser does on its own, which for the fake is nothing. No
//! language's corpus is read here: a language's own allocation test is `tests/allocation.rs` of the language. The
//! measuring and the comparison are the core's contract, the same for every product. It runs alone in its process,
//! with `dhat` as the global allocator, so nothing else counts.

use ryo_core::inbound::use_cases::lint::fixtures::contract;

#[global_allocator]
static ALLOCATOR: dhat::Alloc = dhat::Alloc;

/// What the parser does for a file by itself: the fake language reads a file without allocating.
fn library(_bytes: &[u8]) {}

fn main() {
    contract::allocation(&contract::fake_corpus(), &library);
}
'''

[given]
file = 'tests/allocation.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'tests/allocation.rs' = '''
