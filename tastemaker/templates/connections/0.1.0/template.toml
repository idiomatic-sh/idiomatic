description = "An edge's connections: the stores it opens and the clients it returns."
why = "Opening a store is I/O, and a command line or an SDK is an edge: its connections.rs is the one place the edge opens the stores it reads and writes and returns their clients with `connect`; use typed resource identities and, where the store is partitioned, pass partition bindings to adapter factories, so the composition beside it takes clients and only constructs, and its test runs the real wiring over fake connections. One primitive, one file: an edge that opens nothing has a connections.rs that returns nothing, never a connection in composition.rs."
content = '''
//! The connections of `{{ resource }} {{ part }}`: it opens the stores the edge reads and writes and returns their
//! clients. This is the only I/O of the edge; the composition takes the clients it returns and only constructs.

/// The clients of the stores `{{ resource }} {{ part }}` reaches, opened once.
pub(crate) struct {{ resource | pascal }}{{ part | pascal }}Connections;

/// Opens the stores and returns their clients.
pub(crate) fn connect() -> {{ resource | pascal }}{{ part | pascal }}Connections {
    {{ resource | pascal }}{{ part | pascal }}Connections
}
'''

[params]
resource = { type = "identifier", from = "directory-name", description = "The resource, captured from the path of the edge's part; the directory's own name where the part has no resource." }
part = { type = "identifier", from = "directory-name", description = "The edge's directory name: the command or the function." }

[[scenarios]]
id = 'example-command'
scenario = 'The rendered template passes for a command.'
given.file = 'src/commands/greeting/show/connections.rs'
given.params = { resource = 'greeting', part = 'show' }
given.files.'src/commands/greeting/show/connections.rs' = '''
//! The connections of `greeting show`: it opens the stores the edge reads and writes and returns their
//! clients. This is the only I/O of the edge; the composition takes the clients it returns and only constructs.

/// The clients of the stores `greeting show` reaches, opened once.
pub(crate) struct GreetingShowConnections;

/// Opens the stores and returns their clients.
pub(crate) fn connect() -> GreetingShowConnections {
    GreetingShowConnections
}
'''

