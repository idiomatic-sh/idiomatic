description = "A workspace's tastemaker.lock, written by `tm check --fix` and committed."
why = "Records every package and definition release the workspace resolved, so a check reads the same definitions on every machine until `tm check --fix` relocks."
content = '''
# Written by Tastemaker: the packages this workspace resolved,
# direct and transitive, and the definition releases it uses. Do not edit it by hand.
'''

[given]
file = 'product/tastemaker.lock'

[[scenarios]]
id = 'lock-resolved-packages-passes'
scenario = 'A lock with its resolved packages passes.'
given.files.'product/tastemaker.lock' = '''
# Written by Tastemaker: the packages this workspace resolved,
# direct and transitive, and the definition releases it uses. Do not edit it by hand.
dependencies = ["idiomatic.arch"]

[packages."idiomatic.arch"]
path = "../../tastemaker"

[packages."idiomatic.arch".specs]
crate = "0.1.0"
'''

[[scenarios]]
id = 'lock-missing'
scenario = 'The lock is missing.'
then.findings = [
  { rule = 'tastemaker-lock#count', path = 'tastemaker.toml' },
]
