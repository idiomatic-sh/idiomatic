description = "An adapter-owned traversal that serializes an external representation through its schemas."
why = "An external parser or protocol can require a visitor with traversal state. Its writer owns that serialization algorithm, while adapter.rs implements the port, schemas.rs owns checked wire conversions, and types.rs remains plain data. The writer is private to this adapter, may use its schemas and types, and cannot depend back on its adapter implementation. Existing adapter contract and schema cases prove its observable behavior; this role does not require a mirror test harness. It is not a general helper, domain service, or second port implementation."
content = '''
//! The adapter's traversal and serialization of its external representation.
// Implement the external visitor or writer here, using the adjacent schemas and plain types.
// Keep entry points private or pub(super); the port implementation owns orchestration.
'''

[given]
file = 'writer.rs'

[[scenarios]]
id = 'writer-present'
scenario = 'A writer is placed beside the adapter that owns its serialization.'
given.files.'writer.rs' = '''
//! The adapter's traversal and serialization of its external representation.
pub(super) fn write() {}
'''

[[scenarios]]
id = 'writer-missing'
scenario = 'A required writer placement cannot silently omit its file.'
then.findings = [{ rule = 'adapter-writer#count', path = 'tastemaker.toml' }]
