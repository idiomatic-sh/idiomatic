description = "A product's Cargo.lock, written by Cargo and committed."
why = "Commits the product's resolved dependency versions, so every build and gate compiles the same code."
content = '''
# This file is automatically @generated by Cargo.
# It is not intended for manual editing.
version = 4
'''

[given]
file = 'Cargo.lock'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'Cargo.lock' = '''
# This file is automatically @generated by Cargo.
# It is not intended for manual editing.
version = 4
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'Cargo.lock' = '''
# This file is automatically @generated by Cargo.
# It is not intended for manual editing.
version = 4

# More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'cargo-lock#count', path = 'tastemaker.toml' },
]
