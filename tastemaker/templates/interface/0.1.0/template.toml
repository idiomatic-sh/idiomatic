description = "The one trait a part offers: a use case's `<Part>UseCase` declaring its one method, or an outbound port's `<Part>Port`, in the core's own vocabulary."
why = "Names what a caller may rely on and nothing of the code behind it. A use case's trait is the one promise an edge calls, so a caller depends on exactly the use case it calls; a port's trait states what the core asks of the outside in the core's own types only, so no client, store or library name crosses it and an adapter of another crate implements it knowing nothing of the core's logic. The trait carries the part's directory name and the kind's suffix, `<Part>UseCase` or `<Part>Port`, and a use case's declares one method named like the part. It is `pub`: an edge calls a use case and an adapter of another crate implements a port. A port's interface takes and returns plain data, and an object it hands out is a handle, a trait this file declares and a method returns; it never takes an adapter's configuration, which the port's factory takes."
content = '''
{% if kind == "use-case" -%}
//! What the `{{ part }}` use case promises its callers, in the core's own vocabulary.

/// What `{{ part }}` offers its callers.
pub trait {{ part | pascal }}UseCase {
}
{%- else -%}
//! What the `{{ part }}` port asks of the outside, in the core's own vocabulary: plain data in and out,
//! and the handles (traits this file declares) it hands back. It never takes an adapter's
//! configuration (a directory, a budget, a client): the port's factory takes that.

{% if part in (exposed | default([])) -%}
/// What every `{{ part }}` implementation outside the core implements.
pub trait {{ part | pascal }} {}
{%- else -%}
/// What every `{{ part }}` adapter implements.
pub trait {{ part | pascal }}Port {}
{%- endif %}
{%- endif %}
'''

[params]
kind = { type = "string", description = "What the part is: use-case or port." }
exposed = { type = "list<string>", description = "The ports the product's SDK exposes: a listed port's trait is its plain noun (`Language`), every other port's ends in `Port`. Read only for a port." }
part = { type = "identifier", from = "directory-name", description = "The part's directory name: the stem of every name in it." }

[[scenarios]]
id = 'example-use-case'
scenario = 'The rendered template passes for a use case.'
given.file = 'interface.rs'
given.params = { kind = 'use-case', exposed = [], part = 'greet' }
given.files.'interface.rs' = '''
//! What the `greet` use case promises its callers, in the core's own vocabulary.

/// What `greet` offers its callers.
pub trait GreetUseCase {
    /// Runs `greet`.
    fn greet(&self);
}
'''

[[scenarios]]
id = 'example-port'
scenario = 'The rendered template passes for a port.'
given.file = 'interface.rs'
given.params = { kind = 'port', exposed = [], part = 'names' }
given.files.'interface.rs' = '''
//! What the `names` port asks of the outside, in the core's own vocabulary: plain data in and out,
//! and the handles (traits this file declares) it hands back. It never takes an adapter's
//! configuration (a directory, a budget, a client): the port's factory takes that.

/// What every `names` adapter implements.
pub trait NamesPort {}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template: the vocabulary and a full signature.'
given.file = 'interface.rs'
given.params = { kind = 'use-case', exposed = [], part = 'greet' }
given.files.'interface.rs' = '''
//! What the `greet` use case promises its callers, in the core's own vocabulary.

use super::errors::GreetError;
use super::types::Name;

/// Greets one person by name.
pub trait GreetUseCase: std::fmt::Debug {
    /// The greeting for `name`.
    ///
    /// # Errors
    ///
    /// `GreetError` when no greeting is stored for `name`.
    fn greet(&self, name: &Name) -> Result<String, GreetError>;
}
'''

