description = "Proves one part's body beside it, in the one test shape: a `CASES` table of rows and a runner for each case word the table has rows of."
why = "Keeps the proof of a use case, a concept's service or an item beside its code, one shape for all three: the rows are the part's cases, a name, one case word, an input and the expected value or error variant, and a runner for each case word the table has rows of (`succeeds`, `refuses`, `fails`, `rejects`) is the author's (`test-runners-match-rows`). A use case runs against the fakes of the ports it calls, from the crate's fixtures; a service runs on values alone; an item runs its own cases, and the collection's shared cases when the collection has any (`item-contract`)."
content = '''
{% if kind == "use-case" -%}
//! What the `{{ part }}` use case promises, against the fakes of the ports it calls, from its fixtures.
{%- elif kind == "concept" -%}
//! The `{{ part }}` service's cases, on values alone.
{%- else -%}
//! The `{{ part }}` item's cases, and the collection's shared cases when it has any.
{%- endif %}

use crate::cases::{Case, Word, run};

type Input = ();
type Value = ();
type Failure = ();

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[];

/// Calls the part on one input; the author states it.
fn subject(_input: Input) -> Result<Value, Failure> {
    Err(())
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}
'''

[params]
kind = { type = "string", description = "What the part is: use-case, concept or item." }
part = { type = "identifier", from = "directory-name", description = "The part's directory name: the stem of every name in it." }

