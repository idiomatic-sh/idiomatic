id = 'extra-content'
scenario = 'A file may carry more than its template: typed rows and a helper.'
given.file = 'use_case_test.rs'
given.params = { kind = 'use-case', part = 'greet' }
given.files.'use_case_test.rs' = '''
//! What the `greet` use case promises, against the fakes of the ports it calls, from its fixtures.

use crate::cases::{Case, Word, run};

type Input = u8;
type Value = u16;
type Failure = String;

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[];

/// Calls the part on one input; the author states it.
fn subject(input: Input) -> Result<Value, Failure> {
    Ok(u16::from(input))
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}

// More.
'''

