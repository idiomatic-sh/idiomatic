description = "A collections module: the list of the collections of a domain concept or an item, one `pub(crate) mod` each (feature and provider crates)."
why = "Gives repeated concepts one fixed namespace, `collections/`, declared by one file that lists each collection, so each is found in the same place wherever it appears and none hides among the other files."
content = '''
//! The collections here: each a repeated domain concept, one directory per item.
{%- set vis = "pub(crate) " if "ryo::languages::" in (item_trait | default("") | string) else "" %}
{% for name in captures.collection | default([]) %}
{{ vis }}mod {{ name }};
{%- endfor %}
'''

[params]
item-trait = { type = "list<string>", description = "The `<collection>=<trait path>` pairs of the crate: when a collection names a trait of the ryo language contract, its collections are crate-private (`pub(crate)`), which the contracts of the language reach them by." }

[given]
file = 'src/collections.rs'
params = { item-trait = [] }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/collections.rs' = '''
//! The collections here: each a repeated domain concept, one directory per item.
'''
given.files.'src/greeting/collections.rs' = '''
//! The collections here: each a repeated domain concept, one directory per item.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/collections.rs' = '''
//! The collections here: each a repeated domain concept, one directory per item.

// More.
'''
given.files.'src/greeting/collections.rs' = '''
//! The collections here: each a repeated domain concept, one directory per item.

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'collections#count', path = 'tastemaker.toml' },
]
