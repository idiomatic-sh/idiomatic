description = "The repository root's asymptote configuration: the workspace whose members are the products, and the tools no product owns."
why = "Makes the root the one place the repository's own checks are declared: the checks of its files, their text and the workflows, in the root-only groups `repository` (the git hook and CI), `repository-check` (CI) and `pull-request` (CI, from the event GitHub hands the run), which no product has, so `asymptote check --groups repository,repository-check` at the root runs these tools and no product's, and a check that is not here or in a product runs nowhere."
content = '''
# The repository root is the asymptote workspace: its members are the products, each with an asymptote.toml and a lock of its own,
# and its own tools are the checks no product owns: the files, their text and the workflows. A product runs from its own directory.
members = ["crates/*"]

# The git hooks `asymptote init` installs, each running the groups named: the commit gate is the products' lint groups and the
# root's `repository` group; CI runs `repository` and `repository-check`, which no product has, in a job of their own.
[hooks]
pre-commit = ["lint", "repository"]

[[tools]]
id = "tastemaker"
group = "repository"
# The repository root is a Tastemaker workspace of its own, closed over every top-level file and directory beside the
# products: the whole tree is its input.
run = ["tm", "check", "--format", "sarif"]
output = "sarif"
timeout-seconds = 1800
inputs = ["."]

[[tools]]
id = "taplo"
group = "repository"
# Every TOML file parses and is formatted as taplo.toml says (taplo-cli, pinned in the root Cargo.toml).
run = ["taplo", "fmt", "--check"]
fix = ["taplo", "fmt"]
timeout-seconds = 600

[[tools]]
id = "yamllint"
group = "repository"
# Every YAML file parses (.yamllint.yaml).
run = ["yamllint", "."]
timeout-seconds = 600

[[tools]]
id = "editorconfig"
group = "repository"
# Every text file ends with a newline and has no trailing whitespace (.editorconfig, .editorconfig-checker.json).
run = ["ec"]
timeout-seconds = 600

[[tools]]
id = "merge-conflict"
group = "repository"
# No file holds a leftover conflict marker, tracked or not: `git grep --untracked` reads the files an add would stage as well as the
# tracked ones, so a new file with a marker cannot pass and then be staged unchanged. Exit 1 is no match; any other exit is a failure.
run = ["bash", "-c", "git grep -n -I --untracked -E '^(<{7}|>{7}|[|]{7})( |$)|^={7}$' -- . ':(exclude,glob)**/snapshots/**' ':(exclude,glob)**/resources/**' ':(exclude,glob)crates/ryo/languages/*/tests/fixtures/suite/**' ':(exclude,glob)crates/ryo/languages/*/tests/fixtures/corpus/**'; [ $? -eq 1 ]"]
timeout-seconds = 300

[[tools]]
id = "typos"
group = "repository"
# Spelling (_typos.toml).
run = ["typos"]
fix = ["typos", "--write-changes"]
timeout-seconds = 600

[[tools]]
id = "shellcheck"
group = "repository"
# Every tracked shell script. Exit 1 is a finding; shellcheck writes no SARIF, so the run passes only when it finds none.
# shellcheck writes its messages as UTF-8 and fails under another locale.
run = ["bash", "-c", "git ls-files -z -- '*.sh' | LC_ALL=C.UTF-8 xargs -0 -r shellcheck"]
timeout-seconds = 600

[[tools]]
id = "actionlint"
group = "repository"
# GitHub's own schema and expressions in the workflows.
run = ["actionlint"]
timeout-seconds = 600
inputs = [".github"]

[[tools]]
id = "commitizen"
group = "pull-request"
# The message main keeps is a conventional commit (cz.toml). Main takes squash merges alone, so a pull request lands as its title:
# a pull request's run checks the title, and a push to main the commits it added. Both are read from the event GitHub hands the run
# ($GITHUB_EVENT_PATH), which is no file of the repository and no stamp holds, so its group is run by a job that keeps no asymptote
# store (check.yml's pull-request job) and it checks the live event every time. A run with no event has no message to check.
run = ["bash", "-c", "uv run ci/scripts/checks/commitizen.py \"${GITHUB_EVENT_PATH:-}\""]
timeout-seconds = 300
inputs = ["cz.toml", "ci/scripts/checks/commitizen.py"]

[[tools]]
id = "ci-tests"
group = "repository-check"
# The CI code's own tests. They read the workflows, every product's manifests, the secret scanner's and commit checker's
# settings, and cargo's metadata of every workspace: the whole tree is their input, so no file they read can change unseen.
run = ["pytest", "--quiet", "-p", "no:cacheprovider", "--import-mode=importlib", "-o", "pythonpath=.", "-o", "python_files=*_test.py", "-o", "python_classes=", "-o", "norecursedirs=.* __pycache__", "ci"]
timeout-seconds = 1800
inputs = ["."]
'''

[given]
file = 'asymptote.toml'

