timeout-seconds = 300

[[tools]]
id = "ci-tests"
group = "check"
# The CI code's own tests, which read the workflows and the products' manifests.
run = ["pytest", "--quiet", "-p", "no:cacheprovider", "--import-mode=importlib", "-o", "pythonpath=.", "-o", "python_files=*_test.py", "-o", "python_classes=", "-o", "norecursedirs=.* __pycache__", "ci"]
timeout-seconds = 1800
inputs = ["ci", "tastemaker.toml", ".github", "crates/*/asymptote.toml", "crates/*/Cargo.toml", "crates/*/distribution/registries/npm/dist-workspace.toml", "tools/install.py"]
'''

