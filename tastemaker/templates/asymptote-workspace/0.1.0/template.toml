description = "The repository root's asymptote configuration: the workspace whose members are the products, and the tools no product owns."
why = "Makes the root the one place `asymptote check` starts from, in a git hook or in CI: it runs the checks of the repository's files, their text and the workflows, then every product, so a check that is not here or in a product runs nowhere."
content = '''
# The repository root is the asymptote workspace: its members are the products, each with an asymptote.toml and a lock of its own,
# and its own tools are the checks no product owns: the files, their text and the workflows. A product runs from its own directory.
members = ["crates/*"]

# The git hooks `asymptote init` installs, each running the groups named: the commit gate is the lint group, and CI runs every group.
[hooks]
pre-commit = ["lint"]

[[tools]]
id = "tastemaker"
group = "lint"
# The repository root is a Tastemaker workspace of its own, closed over every top-level file and directory beside the
# products: the whole tree is its input.
run = ["tm", "check", "--format", "sarif"]
output = "sarif"
timeout-seconds = 1800
inputs = ["."]

[[tools]]
id = "taplo"
group = "lint"
# Every TOML file parses and is formatted as taplo.toml says (taplo-cli, pinned in the root Cargo.toml).
run = ["taplo", "fmt", "--check"]
fix = ["taplo", "fmt"]
timeout-seconds = 600

[[tools]]
id = "yamllint"
group = "lint"
# Every YAML file parses (.yamllint.yaml).
run = ["yamllint", "."]
timeout-seconds = 600

[[tools]]
id = "editorconfig"
group = "lint"
# Every text file ends with a newline and has no trailing whitespace (.editorconfig, .editorconfig-checker.json).
run = ["ec"]
timeout-seconds = 600

[[tools]]
id = "merge-conflict"
group = "lint"
# No file holds a leftover conflict marker, tracked or not: `git grep --untracked` reads the files an add would stage as well as the
# tracked ones, so a new file with a marker cannot pass and then be staged unchanged. Exit 1 is no match; any other exit is a failure.
run = ["bash", "-c", "git grep -n -I --untracked -E '^(<{7}|>{7}|[|]{7})( |$)|^={7}$' -- . ':(exclude,glob)**/snapshots/**' ':(exclude,glob)**/resources/**' ':(exclude,glob)crates/ryo/languages/*/tests/fixtures/suite/**' ':(exclude,glob)crates/ryo/languages/*/tests/fixtures/corpus/**'; [ $? -eq 1 ]"]
timeout-seconds = 300

[[tools]]
id = "typos"
group = "lint"
# Spelling (_typos.toml).
run = ["typos"]
fix = ["typos", "--write-changes"]
timeout-seconds = 600

[[tools]]
id = "shellcheck"
group = "lint"
# Every tracked shell script. Exit 1 is a finding; shellcheck writes no SARIF, so the run passes only when it finds none.
# shellcheck writes its messages as UTF-8 and fails under another locale.
run = ["bash", "-c", "git ls-files -z -- '*.sh' | LC_ALL=C.UTF-8 xargs -0 -r shellcheck"]
timeout-seconds = 600

[[tools]]
id = "actionlint"
group = "lint"
# GitHub's own schema and expressions in the workflows.
run = ["actionlint"]
timeout-seconds = 600
inputs = [".github"]

[[tools]]
id = "commitizen"
group = "lint"
# The branch's commit messages are conventional commits (cz.toml); a branch with no commit ahead of origin/main has none to check.
# The commit being made is checked at the next commit, or in CI.
run = ["bash", "-c", "set -e; [ -z \"$(git rev-list origin/main..HEAD)\" ] || cz check --rev-range origin/main..HEAD; [ -z \"${GITHUB_EVENT_PATH:-}\" ] || ! jq -e .pull_request \"$GITHUB_EVENT_PATH\" > /dev/null || cz check --message \"$(jq -r .pull_request.title \"$GITHUB_EVENT_PATH\")\""]
timeout-seconds = 300

[[tools]]
id = "ci-tests"
group = "check"
# The CI code's own tests, which read the workflows and the products' manifests.
run = ["pytest", "--quiet", "-p", "no:cacheprovider", "--import-mode=importlib", "-o", "pythonpath=.", "-o", "python_files=*_test.py", "-o", "python_classes=", "-o", "norecursedirs=.* __pycache__", "ci"]
timeout-seconds = 1800
inputs = ["ci", "tastemaker.toml", ".github", "crates/*/asymptote.toml", "crates/*/Cargo.toml", "crates/*/distribution/registries/npm/dist-workspace.toml", "tools/install.py"]
'''

[given]
file = 'asymptote.toml'

