description = "The proof of one value's behaviour, beside its value.rs; a value filed here always has behaviour, so always has its test."
why = "A value with behaviour (a hand-written `Display`, a checked constructor, a method) is proven beside it, as every logic file is; a plain-data value has nothing to prove and no test."
content = '''
//! Proves one value's behaviour.
'''

[given]
file = 'src/greeting/types/{value}/value_test.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/greeting/types/greeting/value_test.rs' = '''
//! Proves the `Greeting` value's behaviour.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/greeting/types/greeting/value_test.rs' = '''
//! Proves the `Greeting` value's behaviour.

use super::value::Greeting;

#[test]
fn display_succeeds() {
    assert_eq!(Greeting("hello".into()).to_string(), "hello");
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/greeting/types/greeting/value_test.rs'
then.findings = [
  { rule = 'value-test#count', path = 'tastemaker.toml' },
]
