description = "A product's cargo-nextest configuration: unit and integration tests by default."
why = "Bench and cucumber runners use cargo test; distribution installation tests require explicit release selection."
content = '''
# Bench and cucumber BDD targets do not support libtest's listing protocol.
# Run them with `cargo test --all-features --benches --test '*bdd'`.
[profile.default]
default-filter = "not kind(bench) and not binary(/bdd$|^distribution$/)"
'''

[given]
file = '.config/nextest.toml'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'.config/nextest.toml' = '''
# Bench and cucumber BDD targets do not support libtest's listing protocol.
# Run them with `cargo test --all-features --benches --test '*bdd'`.
[profile.default]
default-filter = "not kind(bench) and not binary(/bdd$|^distribution$/)"
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'.config/nextest.toml' = '''
# Bench and cucumber BDD targets do not support libtest's listing protocol.
# Run them with `cargo test --all-features --benches --test '*bdd'`.
[profile.default]
default-filter = "not kind(bench) and not binary(/bdd$|^distribution$/)"

[profile.ci]
fail-fast = false
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'nextest-config#count', path = 'tastemaker.toml' },
]

[[scenarios]]
id = 'runs-benches'
scenario = 'The default profile runs the bench targets.'
given.files.'.config/nextest.toml' = '''
# Bench and cucumber BDD targets do not support libtest's listing protocol.
# Run them with `cargo test --all-features --benches --test '*bdd'`.
[profile.default]
retries = 0
'''
then.findings = [
  { rule = 'nextest-config#template', path = '.config/nextest.toml' },
]
