[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template, such as its wire shapes.'
given.files.'src/names/adapters/memory/schemas.rs' = '''
//! The shape of the data this adapter does not control: each wire shape is a `<Name>Schema`, its checked conversion into the core's type is an `impl TryFrom<<Name>Schema>`, and each refusal of a conversion is a `<Name>SchemaError`.

#[cfg(test)]
#[path = "schemas_test.rs"]
mod tests;

/// A name as the data stores it.
pub struct NameSchema {
    pub text: String,
}

/// Why a stored name is refused.
pub enum NameSchemaError {
    Empty,
}

impl TryFrom<NameSchema> for String {
    type Error = NameSchemaError;

    fn try_from(schema: NameSchema) -> Result<Self, Self::Error> {
        if schema.text.is_empty() {
            return Err(NameSchemaError::Empty);
        }
        Ok(schema.text)
    }
}
'''

