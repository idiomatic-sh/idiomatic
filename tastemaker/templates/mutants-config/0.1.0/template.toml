description = "A product's cargo-mutants configuration."
why = "Configures cargo-mutants for the product, so mutation testing proves its tests bite with the same settings everywhere."
content = '''
gitignore = true
all_features = true
'''

[given]
file = '.cargo/mutants.toml'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'.cargo/mutants.toml' = '''
gitignore = true
all_features = true
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'.cargo/mutants.toml' = '''
gitignore = true
all_features = true

# more
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'mutants-config#count', path = 'tastemaker.toml' },
]

[[scenarios]]
id = 'no-gitignore'
scenario = 'Mutants does not honor .gitignore.'
given.files.'.cargo/mutants.toml' = '''
all_features = true
'''
then.findings = [
  { rule = 'mutants-config#template', path = '.cargo/mutants.toml' },
]
