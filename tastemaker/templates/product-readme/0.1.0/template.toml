description = "A product's README, starting with: the product, what it is for in one line, how to install it for each language, in a table, and how to use it."
why = "Gives every product the same README: its purpose, how to install it for each language, in a table, and how to use it."
content = '''
# {{ product | capitalize }}

What {{ product }} is for, in one line.

## Install

| Language | Command |
| --- | --- |
| rust | `cargo install --locked {{ product }}` |

## Usage
'''

[params]
product = { type = "identifier", description = "The product: its CLI's package and binary name." }

[given]
file = 'demo/README.md'
params = { product = 'demo' }

[[scenarios]]
id = 'product-one-line-purpose-install-console-example'
scenario = 'The product, a one-line purpose, its install and a console example pass.'
given.files.'demo/README.md' = '''
# Demo

Greets whoever runs it.

## Install

| Language | Command |
| --- | --- |
| rust | `cargo install --locked demo` |

## Usage

```console
$ demo greeting show
Hello!
```
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'product-readme#count', path = 'tastemaker.toml' },
]

[[scenarios]]
id = 'extra-section'
scenario = 'More sections after the template pass.'
given.files.'demo/README.md' = '''
