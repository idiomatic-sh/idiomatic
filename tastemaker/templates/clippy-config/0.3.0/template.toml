description = "The repository's clippy configuration: the in-tests allowances. Our own checks are Tastemaker rules, never clippy configuration."
why = "Bans, once for the repository, the methods, types and macros no product may use, such as reading the environment, so each ban is a lint rather than a convention."
content = '''
# Tests may panic freely: an assertion failing is the mechanism, and threading
# Result through every test to avoid `unwrap` costs readability for nothing.
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true
'''

[given]
file = 'clippy.toml'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'clippy.toml' = '''
# Tests may panic freely: an assertion failing is the mechanism, and threading
# Result through every test to avoid `unwrap` costs readability for nothing.
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true
'''

[[scenarios]]
id = 'missing-allowance'
scenario = 'An in-tests allowance is removed.'
given.files.'clippy.toml' = '''
# Tests may panic freely: an assertion failing is the mechanism, and threading
# Result through every test to avoid `unwrap` costs readability for nothing.
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
'''
then.findings = [
  { rule = 'clippy-config#template', path = 'clippy.toml' },
]
