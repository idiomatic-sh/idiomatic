description = "Proves one item of a collection, beside its code in the one test shape: a `CASES` table of rows and a runner for each case word the table has rows of."
why = "Proves one item beside its code, each item of a collection on its own and against the collection's shared cases."
content = '''
//! The item's cases, and the collection's shared cases it runs.

use crate::cases::{Case, Word, run};

type Input = ();
type Value = ();
type Failure = ();

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[];

/// Calls the part on one input; the author states it.
fn subject(_input: Input) -> Result<Value, Failure> {
    Err(())
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}
'''

