description = "Proves what one part's schemas accept and refuse, beside its schemas.rs in the one test shape: a `CASES` table of rows and a runner for each case word the table has rows of."
why = "A schema checks data we do not control, so each input it accepts (a `succeeds` row) and each it refuses (a `refuses` row) is a case. The runners are the author's, one for each case word the table has rows of (`test-runners-match-rows`), so a case is a row and nothing else is a test."
content = '''
//! What the schemas of this {{ kind }} accept and refuse, one row of `CASES` for each input.

use crate::cases::{Case, Word, run};

type Input = ();
type Value = ();
type Failure = ();

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[];

/// Converts one wire input through the schemas; the author states it.
fn subject(_input: Input) -> Result<Value, Failure> {
    Err(())
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}
'''

[params]
kind = { type = "string", description = "What the part is: port, adapter, command or entry." }

