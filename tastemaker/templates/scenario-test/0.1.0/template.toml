description = "A scenario test of one group of cases: it builds a real owner or program from the group's fixtures, runs it, and asserts on what it observed."
why = "A group of cases under `service_test/<group>/` proves a behaviour by running the real thing, not by a table of inputs, so it is held to its own shape rather than `unit-test`'s `CASES` and `subject`: the spec that places it applies `scenario-test`, so the file holds `use` lines and at least one `#[test]` function, takes every helper from the group's fixtures, and exports nothing."
content = '''
//! A scenario of the `{{ part }}` group: what the real owner does, observed.
'''

[params]
part = { type = "identifier", from = "directory-name", description = "The group's directory name." }

[[scenarios]]
id = "scenario-test"
scenario = "A group's scenario test with its tests has no finding."
given.file = "publication/test.rs"
given.files.'publication/test.rs' = '''
use super::fixtures::owner;

#[test]
fn publishes_each_row_once() {
    assert_eq!(owner().rows(), 2);
}
'''

[[scenarios]]
id = "scenario-test-missing"
scenario = "A scenario test the entry places that is missing is reported."
given.file = "publication/test.rs"
then.findings = [{ rule = "#count", path = "tastemaker.toml" }]
