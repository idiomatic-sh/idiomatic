description = "One domain concept's rules: pure functions over several of the domain's values, with no IO and no ports."
why = "Gives each rule across a domain's values (which entries are outdated, how findings merge) one place, named for its concept, that use cases and adapters both call, importing only the domain's own types and errors, so a business rule is never an adapter's private helper, never reaches the outside world, and never shares one file with every other rule of the hex."
content = '''
//! The {{ domain }} domain's `{{ concept }}` rules: pure functions over its values, with no IO and no ports.
'''

[params]
domain = { type = "identifier", from = "directory-name", description = "The domain, its directory's name." }
concept = { type = "identifier", description = "The concept, captured from its path." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'src/greeting/domain/short/domain.rs'
given.params = { domain = 'greeting', concept = 'short' }
given.files.'src/greeting/domain/short/domain.rs' = '''
//! The greeting domain's `short` rules: pure functions over its values, with no IO and no ports.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'src/greeting/domain/short/domain.rs'
given.params = { domain = 'greeting', concept = 'short' }
given.files.'src/greeting/domain/short/domain.rs' = '''
//! The greeting domain's `short` rules: pure functions over its values, with no IO and no ports.

use super::super::super::types::Greeting;

/// The greetings shorter than `limit`, in their order.
pub fn short(greetings: &[Greeting], limit: usize) -> Vec<&Greeting> {
    greetings.iter().filter(|greeting| greeting.len() < limit).collect()
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/greeting/domain/short/domain.rs'
given.params = { domain = 'greeting', concept = 'short' }
then.findings = [
  { rule = 'domain#count', path = 'tastemaker.toml' },
]
