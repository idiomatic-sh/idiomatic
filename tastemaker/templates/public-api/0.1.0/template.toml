description = "The recorded public API of a crate: the output of `cargo public-api` that the semver gate compares a change with."
why = "A crate whose surface is the product's contract (an SDK) records that surface in a file the tool writes, so a change to it is a visible diff and the semver check has a baseline. The file is generated, never written by hand; the template only asks that it exist and begin with the crate's root module."
content = '''
pub mod {{ library }}
'''

[params]
library = { type = "identifier", description = "The crate's library name, the root module the record opens with." }

[given]
file = 'api.txt'
params = { library = 'demo' }

[[scenarios]]
id = 'recorded-file-passes'
scenario = 'The recorded file passes.'
given.files.'api.txt' = '''
pub mod demo
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A record may carry more than its first line.'
given.files.'api.txt' = '''
pub mod demo
pub fn demo::run()
'''

[[scenarios]]
id = 'record-missing'
scenario = 'The record is missing.'
then.findings = [
  { rule = 'public-api#count', path = 'tastemaker.toml' },
]
