description = "An adapter's module file: its adapter, optional private serialization writer, connection and settings when their files exist, its test under #[cfg(test)], and whichever of its types, errors and schemas exist."
why = "Declares the adapter's files as its modules, so the adapter, its test, its own types and errors, its schemas and its collections compile together, and only the factory can expose its named connection handle for edge construction; the other implementation modules stay private."
content = '''
//! The {{ port }} port, implemented with {{ implementation }}.

pub(crate) mod adapter;
{%- if present["writer"] | default(false) %}
mod writer;
{%- endif %}
{%- if present["connection"] | default(false) %}
pub(crate) mod connection;
{%- endif %}
{%- if present["settings"] | default(false) %}
pub(crate) mod settings;
{%- endif %}
{%- if present["types"] | default(false) %}
pub(crate) mod types;
{%- endif %}
{%- if present["errors"] | default(false) %}
pub(crate) mod errors;
{%- endif %}
{%- if present["schemas"] | default(false) %}
mod schemas;
{%- endif %}

#[cfg(test)]
mod adapter_test;
'''

[params]
port = { type = "identifier", from = "directory-name", description = "The outbound port, the directory the file sits in." }
implementation = { type = "identifier", description = "The adapter's implementation, captured from its path." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'adapters/memory.rs'
given.params = { port = 'names', implementation = 'memory' }
given.files.'adapters/memory.rs' = '''
//! The names port, implemented with memory.

pub(crate) mod adapter;

#[cfg(test)]
mod adapter_test;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'adapters/memory.rs'
given.params = { port = 'names', implementation = 'memory' }
given.files.'adapters/memory.rs' = '''
//! The names port, implemented with memory.

pub(crate) mod adapter;

#[cfg(test)]
mod adapter_test;

mod schemas;

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'adapters/memory.rs'
given.params = { port = 'names', implementation = 'memory' }
then.findings = [
  { rule = 'adapter-module#count', path = 'tastemaker.toml' },
]

[[scenarios]]
id = 'test-not-cfg-test'
scenario = 'The adapter test is compiled outside tests.'
given.file = 'adapters/memory.rs'
given.params = { port = 'names', implementation = 'memory' }
given.files.'adapters/memory.rs' = '''
//! The names port, implemented with memory.

pub(crate) mod adapter;

mod adapter_test;
'''
then.findings = [
  { rule = 'adapter-module#template', path = 'adapters/memory.rs' },
]

[[scenarios]]
id = 'no-adapter'
scenario = 'The adapter module does not declare its adapter.'
given.file = 'adapters/memory.rs'
given.params = { port = 'names', implementation = 'memory' }
given.files.'adapters/memory.rs' = '''
//! The names port, implemented with memory.

#[cfg(test)]
mod adapter_test;
'''
then.findings = [
  { rule = 'adapter-module#template', path = 'adapters/memory.rs' },
]

[[scenarios]]
id = 'private-writer-module'
scenario = 'An explicitly placed writer is declared privately by its adapter module.'
given.file = 'adapters/memory.rs'
given.params = { port = 'names', implementation = 'memory' }
given.files.'adapters/memory.rs' = '''
pub(crate) mod adapter;
mod writer;
#[cfg(test)]
mod adapter_test;
'''
given.files.'adapters/memory/writer.rs' = 'pub(super) fn write() {}'
given.files.'tastemaker.toml' = '''
workspace = { name = "writer-module", dependencies = [{ package = "idiomatic.arch", path = "../../.." }] }
templates = [
 { template = "idiomatic.arch/adapter-module", file = "adapters/memory.rs", params = { port = "names", implementation = "memory" } },
 { template = "idiomatic.arch/adapter-writer", alias = "writer", file = "adapters/memory/writer.rs" },
]
'''
then.only = ['idiomatic.arch/adapter-module#template', 'idiomatic.arch/adapter-module#count']

[[scenarios]]
id = 'writer-module-missing'
scenario = 'A placed writer must be declared by its adapter module.'
given.file = 'adapters/memory.rs'
given.params = { port = 'names', implementation = 'memory' }
given.files.'adapters/memory.rs' = '''
pub(crate) mod adapter;
#[cfg(test)]
mod adapter_test;
'''
given.files.'adapters/memory/writer.rs' = 'pub(super) fn write() {}'
given.files.'tastemaker.toml' = '''
workspace = { name = "writer-module", dependencies = [{ package = "idiomatic.arch", path = "../../.." }] }
templates = [
 { template = "idiomatic.arch/adapter-module", file = "adapters/memory.rs", params = { port = "names", implementation = "memory" } },
 { template = "idiomatic.arch/adapter-writer", alias = "writer", file = "adapters/memory/writer.rs" },
]
'''
then.only = ['idiomatic.arch/adapter-module#template', 'idiomatic.arch/adapter-module#count']
then.findings = [{ rule = 'adapter-module#template', path = 'adapters/memory.rs' }]
