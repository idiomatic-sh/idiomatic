description = "An optional adapter-owned external resource handle, constructed by the edge before factory binding."
why = "Use only when a standard or library resource handle cannot directly express the shared session. Fill in the real resource representation and opening operation; the edge calls it in connections.rs. Operational state and private session helpers belong here, not in the port's plain types. The factory may export this module's named Connection handle for construction and injection, but no adapter implementation. Connection lifetime, isolation and failed publication remain adapter contract obligations; syntax cannot prove them. No backend or partition scheme is prescribed."
content = '''
//! The external resource this adapter receives from the edge.
// Define the named Connection handle and its resource-opening operation here.
// Keep session state private; bind the handle and any typed partition in the port factory.
// Prove isolation, lifetime and failed publication in the existing adapter contract tests.
'''

[given]
file = 'connection.rs'

[[scenarios]]
id = 'connection-file-present'
scenario = 'An adapter keeps its connection handle in connection.rs.'
given.files.'connection.rs' = '''
//! The external resource this adapter receives from the edge.
// Define the named Connection handle and its resource-opening operation here.
// Keep session state private; bind the handle and any typed partition in the port factory.
// Prove isolation, lifetime and failed publication in the existing adapter contract tests.
'''

[[scenarios]]
id = 'connection-file-missing'
scenario = 'An adapter that is placed with a connection and has no connection.rs is reported.'
then.findings = [
  { rule = 'adapter-connection#count', path = 'tastemaker.toml' },
]
