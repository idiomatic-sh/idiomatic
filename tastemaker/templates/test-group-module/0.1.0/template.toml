description = "The directory module of a cohesive use-case proof concept."
why = "The directory names the concept; mod.rs declares its generic test role. The companion test-directory-layout and orphan-rust-files rules require actual normal Cargo/module reachability, rather than accepting an existence-only proof."
content = '''
//! One cohesive public-contract proof concept.
#[cfg(test)]
mod test;
'''

[[scenarios]]
id = "directory-module"
scenario = "A directory module declares its generic test role."
given.file = "axis/mod.rs"
given.files.'axis/mod.rs' = "#[cfg(test)] mod test;"

[[scenarios]]
id = "missing-directory-module"
scenario = "A placed group module cannot disappear."
given.file = "axis/mod.rs"
then.findings = [{ rule = "#count", path = "tastemaker.toml" }]
