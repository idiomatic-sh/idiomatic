[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template: a plain type.'
given.file = 'types.rs'
given.params = { kind = 'use-case', part = 'greet' }
given.files.'src/greeting/types.rs' = '''
//! The greeting domain's values.

// More.
'''
given.files.'types.rs' = '''
//! The types of the `greet` use case: plain data, public fields and derives, with no constructor and no inherent impl.

/// What `greet` is asked.
#[derive(Debug)]
pub struct Request(pub String);

/// What `greet` is asked.
#[derive(Debug)]
pub struct GreetRequest {}

/// What `greet` answers.
#[derive(Debug)]
pub struct GreetReport {}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'types.rs'
given.params = { kind = 'use-case', part = 'greet' }
then.findings = [
  { rule = 'types#count', path = 'tastemaker.toml' },
]

[[scenarios]]
id = 'entry-misnamed'
scenario = "An entry's report is named <Entry>Report."
given.file = 'types.rs'
given.params = { kind = 'entry', part = 'greet' }
given.files.'types.rs' = '''
//! The types of the `greet` entry: plain data, public fields and derives, with no constructor and no inherent impl.

/// What `greet` answers.
#[derive(Debug)]
pub struct Answer {}
'''
then.findings = [
  { rule = 'types#template', path = 'types.rs' },
]
