description = "A part's own types: plain data with public fields and derives, no constructor and no inherent impl."
why = "A definition lives with the part whose code constructs it, as plain data: a use case's request and answers, a concept's output, what a port speaks, what an adapter works in, and every other part imports them from here, so no types file sits at a crate's top. A command or an entry has none: its arguments are in command.rs or entry.rs, the shape of what it is given in schemas.rs, and the values it passes and returns are the core's types. A port's types derive `Clone`, `Debug` and `PartialEq` and hold no handle, file, lock or `dyn`."
content = '''
{%- set noun = {"use-case": "use case", "concept": "concept", "port": "port", "adapter": "adapter", "item": "item", "entry": "entry"}[kind] -%}
//! The types of the `{{ part }}` {{ noun }}: plain data, public fields and derives{% if kind == "port" %} (`Clone`, `Debug`, `PartialEq`){% endif %}, with no constructor and no inherent impl{% if kind == "port" %}, and no handle, file, lock or `dyn`: a handle is a trait in interface.rs{% endif %}.
{%- if kind == "entry" %}

/// What `{{ part }}` answers.
#[derive(Debug)]
pub struct {{ part | pascal }}Report {}
{%- endif %}
'''

[params]
kind = { type = "string", description = "What the part is: use-case, concept, port, adapter or item." }
part = { type = "identifier", from = "directory-name", description = "The part's directory name: the stem of every name in it." }

[[scenarios]]
id = 'example-use-case'
scenario = 'The rendered template passes for a use case.'
given.file = 'types.rs'
given.params = { kind = 'use-case', part = 'greet' }
given.files.'types.rs' = '''
//! The types of the `greet` use case: plain data, public fields and derives, with no constructor and no inherent impl.

/// What `greet` is asked.
#[derive(Debug)]
pub struct GreetRequest {}

/// What `greet` answers.
#[derive(Debug)]
pub struct GreetReport {}
'''

