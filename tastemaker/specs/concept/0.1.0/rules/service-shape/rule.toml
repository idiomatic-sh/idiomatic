[[scenarios]]
id = 'nested-struct'
scenario = 'A struct inside a function.'
given.files.'src/domain/locality/service.rs' = '''
//! The `locality` service.

/// The locality of a path.
pub fn of(path: &str) -> usize {
    struct Counter(usize);
    Counter(path.len()).0
}
'''
then.findings = [
  { path = 'src/domain/locality/service.rs', line = 5 },
]
