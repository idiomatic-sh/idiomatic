description = "A `service.rs` holds free functions only: no `struct`, `enum`, `union`, `trait` or `impl`."
why = "A concept's service is its verbs: `service.rs` holds free functions named by what they do (`locality::of`, `validate::plan`) over the domain's types, and the types and errors they need live in the concept's own `types.rs` and `errors.rs`. A struct, enum, union, trait or impl in the service is a type with behaviour, which is the concept's types file or a part of its own. That the functions are named by verb is review; this rule holds the shape. Read as written: any `struct`, `enum`, `union`, `trait` or `impl` item in the file, at any depth, so a type declared inside a function is found too; an item generated by a macro is not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let nodes = select * from tree-nodes where glob_any(kind, "{struct,enum,union,trait,impl}");
let struct-nodes = select * from nodes where kind = "struct";
let struct-rows = project(from=struct-nodes, columns=["file", "span"]);
let struct-findings = extend(from=struct-rows, values={"name": "struct", "problem": "is declared in a file that holds free functions only"});
let enum-nodes = select * from nodes where kind = "enum";
let enum-rows = project(from=enum-nodes, columns=["file", "span"]);
let enum-findings = extend(from=enum-rows, values={"name": "enum", "problem": "is declared in a file that holds free functions only"});
let union-nodes = select * from nodes where kind = "union";
let union-rows = project(from=union-nodes, columns=["file", "span"]);
let union-findings = extend(from=union-rows, values={"name": "union", "problem": "is declared in a file that holds free functions only"});
let trait-nodes = select * from nodes where kind = "trait";
let trait-rows = project(from=trait-nodes, columns=["file", "span"]);
let trait-findings = extend(from=trait-rows, values={"name": "trait", "problem": "is declared in a file that holds free functions only"});
let impl-nodes = select * from nodes where kind = "impl";
let impl-rows = project(from=impl-nodes, columns=["file", "span"]);
let impl-findings = extend(from=impl-rows, values={"name": "impl", "problem": "is declared in a file that holds free functions only"});
let all-1 = union(left=struct-findings, right=enum-findings);
let all-2 = union(left=all-1, right=union-findings);
let all-3 = union(left=all-2, right=trait-findings);
let all-4 = union(left=all-3, right=impl-findings);
emit all-4 subject "file" key("span", "name");
'''

[diagnostic]
primary = "span"
message = "`{name}` {problem}"
help = "Keep only free functions in `service.rs`: move a struct, enum or union to the concept's `types.rs`, a trait impl to the type's own `types.rs`, and a trait to the part that owns the promise. An ignore is not legitimate here: a service is functions."

[given]
include = ['**/service.rs']

[[scenarios]]
id = 'free-functions-only'
scenario = 'Free functions only: nothing is reported.'
given.files.'src/domain/locality/service.rs' = '''
//! The `locality` service: pure functions over the domain's types, with no IO and no ports.

/// The locality of a path.
pub fn of(path: &str) -> usize {
    path.len()
}

/// The most it counts.
const LIMIT: usize = 8;

/// A second verb.
pub fn limit() -> usize {
    LIMIT
}
'''

[[scenarios]]
id = 'with-struct'
scenario = 'A struct: it is reported.'
given.files.'src/domain/locality/service.rs' = '''
//! The `locality` service: pure functions over the domain's types, with no IO and no ports.

/// The locality of a path.
pub fn of(path: &str) -> usize {
    path.len()
}

/// A holder.
pub struct Locality;
'''
then.findings = [
  { path = 'src/domain/locality/service.rs', line = 9 },
]

[[scenarios]]
id = 'with-enum'
