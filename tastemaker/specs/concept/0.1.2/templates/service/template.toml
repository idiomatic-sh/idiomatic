description = "One domain concept's service: free functions named by verb over the domain's types, with no IO, no ports and no type of their own."
why = "Gives each rule across a domain's types one place, named for its concept, that use cases and adapters both call, importing only the domain's own types and errors, so a business rule is never an adapter's private helper, never reaches the outside world, and never shares one file with every other rule. It holds free functions only, each named by the verb it performs (`locality::of`, `validate::plan`), because a struct, an enum, a trait or an impl in a service is a type that belongs in the concept's types.rs."
content = '''
//! The `{{ part }}` service: free functions named by verb over the domain's types, with no IO and no ports.
'''

[params]
part = { type = "identifier", from = "directory-name", description = "The part's directory name: the stem of every name in it." }

[given]
file = 'service.rs'
params = { part = 'short' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'service.rs' = '''
//! The `short` service: free functions named by verb over the domain's types, with no IO and no ports.
'''

[[scenarios]]
id = 'extra-content'
scenario = "A file may carry more than its template: the service's functions."
given.files.'service.rs' = '''
//! The `short` service: free functions named by verb over the domain's types, with no IO and no ports.

use super::types::Plan;

/// Orders `plan` by its cost.
pub fn order(plan: &Plan) -> usize {
    plan.steps.len()
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'service#count', path = '.' },
]
