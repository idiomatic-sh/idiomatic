use crate::outbound::facts::interface::{FactLookup, FactSource, FactsWorker};

pub(crate) struct OnDemand<'a> {
    sources: Vec<&'a mut dyn FactSource>,
    facts: &'a mut dyn FactsWorker,
}

impl<'a> OnDemand<'a> {
    pub(crate) fn new(sources: Vec<&'a mut dyn FactSource>, facts: &'a mut dyn FactsWorker) -> Self {
        Self { sources, facts }
    }
}

impl FactLookup for OnDemand<'_> {
    fn ensure(&mut self, relations: &[u32]) {
        for source in &mut self.sources {
            drop(source.serves());
        }
        drop(relations);
        self.facts.release();
    }
}
