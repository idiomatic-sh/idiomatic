description = "An adapter is a leaf: it never reaches another adapter, names another adapter's type, holds a port trait anywhere but the header of its own impl (no other port, and not its own port either: no decorator), calls a factory, or is handed the port trait it implements."
why = "An adapter is built by the edge and used through its port; nothing else holds another implementation. Five arms, each a way for one adapter to depend on another implementation. (a) Any import or written path into an adapter directory that is not its own, `*::adapters::<y>::*` with y other than its own directory, of any port in any crate: read from the source dependencies the language provider resolves inside the crate and from the written path across crates. (b) Naming an `*Adapter` type other than the struct the adapter's own directory declares. (c) Naming a `*Port` trait other than the one the adapter implements, as a field, a parameter, a generic bound or a `dyn`: that is the decorator through a port, one adapter wrapping another port's implementation it was given. (d) Naming a `factory` module: only an edge builds an adapter. (e) The decorator through any trait of the port: a type that implements a trait T of a port's `interface.rs` and receives T from outside, through a generic bound on T on its `impl` (`impl<F: T> T for A<F>`, or `where F: T`), or through a parameter of an associated function of its inherent `impl` that returns `Self` whose type names T (`impl T`, `&dyn T`, `Box<dyn T>`, or a generic bounded by T). T is the trait the impl header names, resolved through the file's import or the written path to a port's `outbound/<port>/interface.rs`, never by its name: a trait of another crate that shares a port trait's name is not T. A decorator must be handed its inner implementation, and only the edge builds one (arm d), so a bound or a constructor parameter is the only way it can get one. Holding a sibling trait of the same port is not this (a lookup built from its sources), and neither is a value that holds `dyn T` it assembled itself in a method the port dictates (the `Joined` a `finish` builds from its own workers). What an adapter needs from another implementation is composed at the edge, which builds both and passes the result to the use case. An optional connection.rs is only the external resource: it never implements a Port, so its trait header is not exempt. Tests (`*_test.rs`) are not read: the spec excludes them. Not seen: a path generated by a macro, a type reached only through a re-export, a type alias in another crate, and a port trait imported under another name (`use …::interface::Facts as Inner`). The `imports` built-in cannot say this: it allows or forbids by path prefix, and the forbidden prefix here depends on the directory of the file that writes it."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let dep-rows = capture(from="source-dependency", path="source", pattern="{*hex}/adapters/{x}/{*rest}", captures=["hex", "x", "rest"]);
let dep-targets = capture(from=dep-rows, path="target", pattern="{*other}/adapters/{y}/{*part}", captures=["other", "y", "part"]);
let reached = project(from=dep-targets, columns=["source", "span", "target", "hex", "x", "other", "y"]);
let own-deps = select l."source" as "source", l."span" as "span", l."target" as "target" from reached as l join reached as r on l."source" = r."source" and l."span" = r."span" and l."target" = r."target" and l."hex" = r."other" and l."x" = r."y";
let foreign-deps = antijoin(left=reached, right=own-deps, left-on=["source", "span", "target"], right-on=["source", "span", "target"]);
let foreign-rows = select l."source" as "file", l."span" as "span" from foreign-deps as l join foreign-deps as r on l."source" = r."source" and l."span" = r."span" and l."target" = r."target";
let import-rows = project(from="static-import", columns=["file", "span", "target"]);
let reference-rows = project(from="reference", columns=["file", "span", "target"]);
let mentions = union(left=import-rows, right=reference-rows);
let in-adapter = capture(from=mentions, path="file", pattern="{*hex}/adapters/{x}/{*rest}", captures=["hex", "x", "rest"]);
let adapter-paths = select * from in-adapter where glob_any(target, "{*::adapters::*,*::adapters}");
let written-local = select * from adapter-paths where glob_any(target, "{crate::*,::crate::*,super::*,self::*,std::*,core::*,alloc::*}");
let crossing = antijoin(left=adapter-paths, right=written-local, left-on=["file", "span", "target"], right-on=["file", "span", "target"]);
let crossing-rows = project(from=crossing, columns=["file", "span"]);
let arm-a-rows = union(left=foreign-rows, right=crossing-rows);
let arm-a = extend(from=arm-a-rows, values={"arm": "reaches into another adapter directory (arm a)"});
let name-refs = select * from tree-nodes where kind = "name-ref";
let ref-edges = select l."file" as "file", l."span" as "span", r."child" as "token" from name-refs as l join "syntax-child" as r on l."id" = r."parent";
let ref-texts = select l."file" as "file", l."span" as "span", r."text" as "text" from ref-edges as l join tree-tokens as r on l."token" = r."id";
let structs = select * from tree-nodes where kind = "struct";
let name-nodes = select * from tree-nodes where kind = "name";
let struct-kids = select l."id" as "id", l."file" as "file", r."child" as "child" from structs as l join "syntax-child" as r on l."id" = r."parent";
let struct-name-nodes = select l."id" as "id", l."file" as "file", r."id" as "name-node" from struct-kids as l join name-nodes as r on l."child" = r."id";
let struct-name-tokens = select l."file" as "file", r."child" as "token" from struct-name-nodes as l join "syntax-child" as r on l."name-node" = r."parent";
let struct-names = select l."file" as "file", r."text" as "name" from struct-name-tokens as l join tree-tokens as r on l."token" = r."id";
let adapter-structs = select * from struct-names where glob_any(name, "*Adapter");
let own-struct-rows = capture(from=adapter-structs, path="file", pattern="{*hex}/adapters/{x}/{*rest}", captures=["hex", "x", "rest"]);
let own-structs = project(from=own-struct-rows, columns=["hex", "x", "name"]);
let adapter-refs = select * from ref-texts where glob_any(text, "*Adapter");
let adapter-ref-rows = capture(from=adapter-refs, path="file", pattern="{*hex}/adapters/{x}/{*rest}", captures=["hex", "x", "rest"]);
let foreign-adapters = antijoin(left=adapter-ref-rows, right=own-structs, left-on=["hex", "x", "text"], right-on=["hex", "x", "name"]);
let foreign-adapter-rows = project(from=foreign-adapters, columns=["file", "span"]);
let arm-b = extend(from=foreign-adapter-rows, values={"arm": "names an adapter type that is not its own (arm b)"});
let a-paths = select * from tree-nodes where kind = "path";
let a-segments = select * from tree-nodes where kind = "path-segment";
let a-name-refs = select * from tree-nodes where kind = "name-ref";
let a-path-segment-edges = select l."id" as "pathnode", r."child" as "child" from a-paths as l join "syntax-child" as r on l."id" = r."parent";
let a-path-segments = select l."pathnode" as "pathnode", r."id" as "segment" from a-path-segment-edges as l join a-segments as r on l."child" = r."id";
let a-segment-ref-edges = select l."pathnode" as "pathnode", r."child" as "child" from a-path-segments as l join "syntax-child" as r on l."segment" = r."parent";
let a-segment-refs = select l."pathnode" as "pathnode", r."id" as "nameref" from a-segment-ref-edges as l join a-name-refs as r on l."child" = r."id";
let a-impls = select * from tree-nodes where kind = "impl";
let a-impl-children = select r."child" as "child", l."id" as "id", r."ordinal" as "ordinal", l."file" as "file", l."span" as "span" from a-impls as l join "syntax-child" as r on l."id" = r."parent";
let a-path-types = select * from tree-nodes where kind = "path-type";
let a-impl-types = select l."child" as "type", l."id" as "id", l."ordinal" as "ordinal", l."file" as "file", l."span" as "span" from a-impl-children as l join a-path-types as r on l."child" = r."id";
let a-for-tokens = select * from tree-tokens where kind = "for-kw";
let a-impl-for = select l."id" as "id", l."ordinal" as "for" from a-impl-children as l join a-for-tokens as r on l."child" = r."id";
let a-impl-types-for = select r."for" as "for", l."id" as "id", l."ordinal" as "ordinal", l."type" as "type", l."file" as "file", l."span" as "span" from a-impl-types as l join a-impl-for as r on l."id" = r."id";
let a-trait-types = select * from a-impl-types-for where ordinal < for;
let a-trait-path-edges = select r."child" as "child", l."id" as "impl", l."file" as "file", l."span" as "span" from a-trait-types as l join "syntax-child" as r on l."type" = r."parent";
let a-trait-paths = select l."impl" as "impl", l."file" as "file", l."span" as "span", r."id" as "pathnode" from a-trait-path-edges as l join a-paths as r on l."child" = r."id";
let hdr-segs = select l."pathnode" as "pathnode", r."nameref" as "nameref" from a-trait-paths as l join a-segment-refs as r on l."pathnode" = r."pathnode";
let hdr-spans = select r."file" as "file", r."span" as "span" from hdr-segs as l join a-name-refs as r on l."nameref" = r."id";
let uses = select * from tree-nodes where kind = "use";
let use-descs = axis(from=uses, relation="syntax-child", direction=descendant, domain=a-name-refs);
let use-spans = select r."file" as "file", r."span" as "span" from use-descs as l join a-name-refs as r on l."related" = r."id";
let resource-headers = select * from hdr-spans where glob_any(file, "**/adapters/*/connection.rs");
let adapter-headers = antijoin(left=hdr-spans, right=resource-headers, left-on=["file", "span"], right-on=["file", "span"]);
let quiet-spans = union(left=adapter-headers, right=use-spans);
let port-refs = select * from ref-texts where glob_any(text, "*Port");
let loose-port-refs = antijoin(left=port-refs, right=quiet-spans, left-on=["file", "span"], right-on=["file", "span"]);
let loose-in-adapter = capture(from=loose-port-refs, path="file", pattern="{*hex}/adapters/{x}/{*rest}", captures=["hex", "x", "rest"]);
let foreign-port-rows = project(from=loose-in-adapter, columns=["file", "span"]);
let arm-c = extend(from=foreign-port-rows, values={"arm": "names a port trait outside the header of its own impl: it holds no port, not even its own, as a field, a param, a bound or a dyn (arm c)"});
let factory-refs = select * from ref-texts where text = "factory";
let factory-rows = capture(from=factory-refs, path="file", pattern="{*hex}/adapters/{x}/{*rest}", captures=["hex", "x", "rest"]);
let factory-spans = project(from=factory-rows, columns=["file", "span"]);
let arm-d = extend(from=factory-spans, values={"arm": "calls a port's factory (arm d)"});
let e-deps = project(from="source-dependency", columns=["source", "span", "target", "written"]);
let e-port-deps = select * from e-deps where glob_any(target, "**/outbound/*/interface.rs");
let e-imports = project(from="static-import", columns=["file", "span", "binding"]);
let e-imported = select l."file" as "file", l."binding" as "name" from e-imports as l join e-port-deps as r on l."file" = r."source" and l."span" = r."span";
let e-hdr-refs = select l."impl" as "impl", l."file" as "file", l."pathnode" as "pathnode", r."nameref" as "nameref" from a-trait-paths as l join a-segment-refs as r on l."pathnode" = r."pathnode";
let e-hdr-tokens = select l."impl" as "impl", l."file" as "file", l."pathnode" as "pathnode", r."child" as "token" from e-hdr-refs as l join "syntax-child" as r on l."nameref" = r."parent";
let e-hdr-names = select l."impl" as "impl", l."file" as "file", l."pathnode" as "pathnode", r."text" as "name" from e-hdr-tokens as l join tree-tokens as r on l."token" = r."id";
let e-by-import = select l."impl" as "impl", l."file" as "file", l."name" as "name" from e-hdr-names as l join e-imported as r on l."file" = r."file" and l."name" = r."name";
let e-hdr-spans = select l."impl" as "impl", l."file" as "file", l."name" as "name", r."span" as "pathspan" from e-hdr-names as l join tree-nodes as r on l."pathnode" = r."id";
let e-by-path = select l."impl" as "impl", l."file" as "file", l."name" as "name" from e-hdr-spans as l join e-port-deps as r on l."file" = r."source" and l."pathspan" = r."span";
let e-port-impls = union(left=e-by-import, right=e-by-path);
let e-impl-kids = select l."impl" as "impl", l."file" as "file", l."name" as "name", r."child" as "child" from e-port-impls as l join "syntax-child" as r on l."impl" = r."parent";
let e-generic-nodes = select * from tree-nodes where glob_any(kind, "{generic-param-list,where-clause}");
let e-generics = select l."name" as "name", l."child" as "id" from e-impl-kids as l join e-generic-nodes as r on l."child" = r."id";
let e-generic-refs = axis(from=e-generics, relation="syntax-child", direction=descendant, domain=a-name-refs);
let e-generic-tokens = select l."name" as "name", r."child" as "token" from e-generic-refs as l join "syntax-child" as r on l."related" = r."parent";
let e-generic-texts = select r."file" as "file", r."span" as "span", l."name" as "name", r."text" as "text" from e-generic-tokens as l join tree-tokens as r on l."token" = r."id";
let e-bound-hits = select * from e-generic-texts where text = name;
let e-bound-rows = project(from=e-bound-hits, columns=["file", "span"]);
let e-self-types = select * from a-impl-types-for where ordinal > for;
let e-self-kids = select l."id" as "impl", r."child" as "child" from e-self-types as l join "syntax-child" as r on l."type" = r."parent";
let e-self-paths = select l."impl" as "impl", r."id" as "pathnode" from e-self-kids as l join a-paths as r on l."child" = r."id";
let e-self-refs = select l."impl" as "impl", r."nameref" as "nameref" from e-self-paths as l join a-segment-refs as r on l."pathnode" = r."pathnode";
let e-self-tokens = select l."impl" as "impl", r."child" as "token" from e-self-refs as l join "syntax-child" as r on l."nameref" = r."parent";
let e-self-names = select l."impl" as "impl", r."text" as "self" from e-self-tokens as l join tree-tokens as r on l."token" = r."id";
let e-decorated = select l."file" as "file", l."name" as "name", r."self" as "self" from e-port-impls as l join e-self-names as r on l."impl" = r."impl";
let e-inherent = antijoin(left=a-impls, right=a-impl-for, left-on=["id"], right-on=["id"]);
let e-inh-kids = select l."id" as "impl", l."file" as "file", r."child" as "child" from e-inherent as l join "syntax-child" as r on l."id" = r."parent";
let e-inh-types = select l."impl" as "impl", l."file" as "file", l."child" as "type" from e-inh-kids as l join a-path-types as r on l."child" = r."id";
let e-inh-type-kids = select l."impl" as "impl", l."file" as "file", r."child" as "child" from e-inh-types as l join "syntax-child" as r on l."type" = r."parent";
let e-inh-paths = select l."impl" as "impl", l."file" as "file", r."id" as "pathnode" from e-inh-type-kids as l join a-paths as r on l."child" = r."id";
let e-inh-refs = select l."impl" as "impl", l."file" as "file", r."nameref" as "nameref" from e-inh-paths as l join a-segment-refs as r on l."pathnode" = r."pathnode";
let e-inh-tokens = select l."impl" as "impl", l."file" as "file", r."child" as "token" from e-inh-refs as l join "syntax-child" as r on l."nameref" = r."parent";
let e-inh-names = select l."impl" as "impl", l."file" as "file", r."text" as "self" from e-inh-tokens as l join tree-tokens as r on l."token" = r."id";
let e-wrappers = select l."impl" as "id", r."name" as "name" from e-inh-names as l join e-decorated as r on l."file" = r."file" and l."self" = r."self";
let e-lists = select * from tree-nodes where kind = "assoc-item-list";
let e-fns = select * from tree-nodes where kind = "fn";
let e-rets = select * from tree-nodes where kind = "ret-type";
let e-param-lists = select * from tree-nodes where kind = "param-list";
let e-params = select * from tree-nodes where kind = "param";
let e-type-params = select * from tree-nodes where kind = "type-param";
let e-where-preds = select * from tree-nodes where kind = "where-pred";
let e-bound-lists = select * from tree-nodes where kind = "type-bound-list";
let e-self-words = select * from tree-tokens where text = "Self";
let e-wrap-kids = select l."id" as "impl", l."name" as "name", r."child" as "child" from e-wrappers as l join "syntax-child" as r on l."id" = r."parent";
let e-wrap-lists = select l."impl" as "impl", l."name" as "name", l."child" as "list" from e-wrap-kids as l join e-lists as r on l."child" = r."id";
let e-list-kids = select l."impl" as "impl", l."name" as "name", r."child" as "child" from e-wrap-lists as l join "syntax-child" as r on l."list" = r."parent";
let e-wrap-fns = select l."impl" as "impl", l."name" as "name", l."child" as "fn" from e-list-kids as l join e-fns as r on l."child" = r."id";
let e-fn-kids = select l."impl" as "impl", l."name" as "name", l."fn" as "fn", r."child" as "child" from e-wrap-fns as l join "syntax-child" as r on l."fn" = r."parent";
let e-fn-rets = select l."fn" as "id" from e-fn-kids as l join e-rets as r on l."child" = r."id";
let e-ret-kids = select l."id" as "fn", r."child" as "id" from e-fn-rets as l join "syntax-child" as r on l."id" = r."parent";
let e-ret-selfs = axis(from=e-ret-kids, relation="syntax-child", direction=descendant, domain=e-self-words);
let e-ctor-ids = project(from=e-ret-selfs, columns=["fn"]);
let e-ctors = select l."impl" as "impl", l."name" as "name", l."fn" as "fn" from e-wrap-fns as l join e-ctor-ids as r on l."fn" = r."fn";
let e-ctor-kids = select l."impl" as "impl", l."name" as "name", r."child" as "child" from e-ctors as l join "syntax-child" as r on l."fn" = r."parent";
let e-ctor-lists = select l."impl" as "impl", l."name" as "name", l."child" as "list" from e-ctor-kids as l join e-param-lists as r on l."child" = r."id";
let e-list-params = select l."impl" as "impl", l."name" as "name", r."child" as "child" from e-ctor-lists as l join "syntax-child" as r on l."list" = r."parent";
let e-ctor-params = select l."impl" as "impl", l."name" as "name", l."child" as "id" from e-list-params as l join e-params as r on l."child" = r."id";
let e-param-refs = axis(from=e-ctor-params, relation="syntax-child", direction=descendant, domain=a-name-refs);
let e-param-tokens = select l."impl" as "impl", l."name" as "name", l."id" as "param", r."child" as "token" from e-param-refs as l join "syntax-child" as r on l."related" = r."parent";
let e-param-texts = select l."impl" as "impl", l."name" as "name", l."param" as "param", r."text" as "text" from e-param-tokens as l join tree-tokens as r on l."token" = r."id";
let e-param-direct = select * from e-param-texts where text = name;
let e-wrap-tparams = axis(from=e-wrappers, relation="syntax-child", direction=descendant, domain=e-type-params);
let e-tparam-kids = select l."id" as "impl", l."name" as "name", l."related" as "tparam", r."child" as "child" from e-wrap-tparams as l join "syntax-child" as r on l."related" = r."parent";
let e-tparam-bounds = select l."impl" as "impl", l."name" as "name", l."tparam" as "tparam", l."child" as "id" from e-tparam-kids as l join e-bound-lists as r on l."child" = r."id";
let e-tparam-bound-refs = axis(from=e-tparam-bounds, relation="syntax-child", direction=descendant, domain=a-name-refs);
let e-tparam-bound-tokens = select l."impl" as "impl", l."name" as "name", l."tparam" as "tparam", r."child" as "token" from e-tparam-bound-refs as l join "syntax-child" as r on l."related" = r."parent";
let e-tparam-bound-texts = select l."impl" as "impl", l."name" as "name", l."tparam" as "tparam", r."text" as "text" from e-tparam-bound-tokens as l join tree-tokens as r on l."token" = r."id";
let e-tparam-bounded = select * from e-tparam-bound-texts where text = name;
let e-tparam-names = select l."impl" as "impl", l."name" as "name", l."tparam" as "tparam", r."child" as "child" from e-tparam-bounded as l join "syntax-child" as r on l."tparam" = r."parent";
let e-tparam-name-nodes = select l."impl" as "impl", l."name" as "name", l."child" as "namenode" from e-tparam-names as l join name-nodes as r on l."child" = r."id";
let e-tparam-name-tokens = select l."impl" as "impl", l."name" as "name", r."child" as "token" from e-tparam-name-nodes as l join "syntax-child" as r on l."namenode" = r."parent";
let e-tparam-generics = select l."impl" as "impl", l."name" as "name", r."text" as "generic" from e-tparam-name-tokens as l join tree-tokens as r on l."token" = r."id";
let e-wrap-preds = axis(from=e-wrappers, relation="syntax-child", direction=descendant, domain=e-where-preds);
let e-pred-kids = select l."id" as "impl", l."name" as "name", l."related" as "pred", r."child" as "child" from e-wrap-preds as l join "syntax-child" as r on l."related" = r."parent";
let e-pred-bounds = select l."impl" as "impl", l."name" as "name", l."pred" as "pred", l."child" as "id" from e-pred-kids as l join e-bound-lists as r on l."child" = r."id";
let e-pred-bound-refs = axis(from=e-pred-bounds, relation="syntax-child", direction=descendant, domain=a-name-refs);
let e-pred-bound-tokens = select l."impl" as "impl", l."name" as "name", l."pred" as "pred", r."child" as "token" from e-pred-bound-refs as l join "syntax-child" as r on l."related" = r."parent";
let e-pred-bound-texts = select l."impl" as "impl", l."name" as "name", l."pred" as "pred", r."text" as "text" from e-pred-bound-tokens as l join tree-tokens as r on l."token" = r."id";
let e-pred-bounded = select * from e-pred-bound-texts where text = name;
let e-pred-types = select l."impl" as "impl", l."name" as "name", r."child" as "type" from e-pred-bounded as l join "syntax-child" as r on l."pred" = r."parent";
let e-pred-path-types = select l."impl" as "impl", l."name" as "name", l."type" as "type" from e-pred-types as l join a-path-types as r on l."type" = r."id";
let e-pred-type-kids = select l."impl" as "impl", l."name" as "name", r."child" as "child" from e-pred-path-types as l join "syntax-child" as r on l."type" = r."parent";
let e-pred-paths = select l."impl" as "impl", l."name" as "name", r."id" as "pathnode" from e-pred-type-kids as l join a-paths as r on l."child" = r."id";
let e-pred-refs = select l."impl" as "impl", l."name" as "name", r."nameref" as "nameref" from e-pred-paths as l join a-segment-refs as r on l."pathnode" = r."pathnode";
let e-pred-tokens = select l."impl" as "impl", l."name" as "name", r."child" as "token" from e-pred-refs as l join "syntax-child" as r on l."nameref" = r."parent";
let e-pred-generics = select l."impl" as "impl", l."name" as "name", r."text" as "generic" from e-pred-tokens as l join tree-tokens as r on l."token" = r."id";
let e-generics-bounded = union(left=e-tparam-generics, right=e-pred-generics);
let e-param-generic = select l."impl" as "impl", l."name" as "name", l."param" as "param", l."text" as "text" from e-param-texts as l join e-generics-bounded as r on l."impl" = r."impl" and l."name" = r."name" and l."text" = r."generic";
let e-param-hits = union(left=e-param-direct, right=e-param-generic);
let e-param-ids = project(from=e-param-hits, columns=["param"]);
let e-param-rows = select r."file" as "file", r."span" as "span" from e-param-ids as l join tree-nodes as r on l."param" = r."id";
let e-findings = union(left=e-bound-rows, right=e-param-rows);
let arm-e-rows = capture(from=e-findings, path="file", pattern="{*hex}/adapters/{x}/{*rest}", captures=["hex", "x", "rest"]);
let arm-e-spans = project(from=arm-e-rows, columns=["file", "span"]);
let arm-e = extend(from=arm-e-spans, values={"arm": "implements a port trait it is handed from outside, through a bound or a constructor parameter: a decorator (arm e)"});
let ab = union(left=arm-a, right=arm-b);
let abc = union(left=ab, right=arm-c);
let abcd = union(left=abc, right=arm-d);
let findings = union(left=abcd, right=arm-e);
emit findings subject "file" key("span", "arm");
'''

