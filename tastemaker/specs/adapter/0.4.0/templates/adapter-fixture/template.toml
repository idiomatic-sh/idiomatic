description = "One file of an adapter's `fixtures/` directory: a sample, an oracle or an expectation the adapter's test reads, at any depth beneath `fixtures/`, of which the template asks nothing."
why = "An adapter's test may be held to material that is not the port's contract: real samples of the format it reads, the output of a reference implementation it is compared with, the files a walk is run over. That material lives beside the adapter in its `fixtures/` directory, so it is test support and nothing the adapter's code or another part reads (`no-runtime-fixtures`). The template asks only that the file exist; what it holds is the adapter's."
content = '''
//! A file of the {{ part }} {{ port }} adapter's test support.
'''

[params]
port = { type = "identifier", from = "directory-name", description = "The outbound port the adapter implements, captured from the path of its part." }
part = { type = "identifier", from = "directory-name", description = "The adapter's directory name: the implementation." }
fixture = { type = "string", description = "The file's path beneath `fixtures/` with its extension, captured from its path: `walk.rs`, or a file in a directory of its own." }

[[scenarios]]
id = 'fixtures-file-needs-only-doc-comment'
scenario = 'A fixtures file needs only its doc comment.'
given.file = 'src/names/adapters/memory/fixtures/walk.rs'
given.params = { port = 'names', part = 'memory', fixture = 'walk.rs' }
given.files.'src/names/adapters/memory/fixtures/walk.rs' = '''
//! A file of the memory names adapter's test support.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/names/adapters/memory/fixtures/walk.rs'
given.params = { port = 'names', part = 'memory', fixture = 'walk.rs' }
then.findings = [
  { rule = 'adapter-fixture#count', path = '.' },
]

[[scenarios]]
id = 'nested-file'
scenario = 'A fixtures file in a directory of fixtures needs only its doc comment.'
given.file = 'src/names/adapters/memory/fixtures/rows/detail.rs'
given.params = { port = 'names', part = 'memory', fixture = 'rows/detail.rs' }
given.files.'src/names/adapters/memory/fixtures/rows/detail.rs' = '''
//! A file of the memory names adapter's test support.
'''
