description = "The module of one external document an adapter reads or writes: it declares the document's `schemas` and nothing else."
why = "An adapter that handles several external documents keeps each document's wire shape and its checked conversion in a `schemas.rs` of its own, in a directory named for the document, so no single schemas file grows past what one reader can hold. This file is the document's module: it declares `schemas` and holds no code, so the document's directory is reached through one line."
content = '''
//! The {{ document }} document of the {{ part }} {{ port }} adapter.
pub(super) mod schemas;
'''

[params]
port = { type = "identifier", from = "directory-name", description = "The outbound port the adapter implements, captured from the path of its part." }
part = { type = "identifier", from = "directory-name", description = "The adapter's directory name: the implementation." }
document = { type = "identifier", description = "The document's name, captured from the file's name." }

[[scenarios]]
id = 'declares-its-schemas'
scenario = 'A document module declares its schemas.'
given.file = 'src/names/adapters/memory/cases.rs'
given.params = { port = 'names', part = 'memory', document = 'cases' }
given.files.'src/names/adapters/memory/cases.rs' = '''
//! The cases document of the memory names adapter.
pub(super) mod schemas;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/names/adapters/memory/cases.rs'
given.params = { port = 'names', part = 'memory', document = 'cases' }
then.findings = [
  { rule = 'document-module#count', path = '.' },
]
