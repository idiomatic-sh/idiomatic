description = "An adapter: one implementation of one outbound port of the core, which it imports from the core crate."
why = "Holds one implementation of the core's port behind the port's name, so the core's use cases depend on the promise and the edge alone picks the implementation. The port is the core's, imported from the crate the entry names in `core`: the adapter holds nothing of the core's logic and no interface of its own. Its struct is `<Port><Part>Adapter` and it implements `<Port>Port`, so the port and the kind can be read from the name. A store adapter is built from its settings (the directory and the build, which its factory takes and no port method does), reads empty when its file is absent, was written by another build or does not decode (never migrated), and writes each `keep_…` once, when the run succeeds, to a temporary file renamed over the store."
content = '''
//! The {{ port }} port, implemented with {{ part }}.

use crate::outbound::{{ port }}::interface::{{ port | pascal }}Port;
{%- if present.settings | default(false) %}
use super::settings::{{ port | pascal }}{{ part | pascal }}Settings;

/// The {{ part }} {{ port }} adapter, configured by its settings.
#[derive(Debug)]
pub(crate) struct {{ port | pascal }}{{ part | pascal }}Adapter {
    settings: {{ port | pascal }}{{ part | pascal }}Settings,
}

impl {{ port | pascal }}{{ part | pascal }}Adapter {
    /// The adapter over `settings`, which its composition chooses.
    pub(crate) fn new(settings: {{ port | pascal }}{{ part | pascal }}Settings) -> Self {
        Self { settings }
    }
}
{%- else %}

/// The {{ part }} {{ port }} adapter.
#[derive(Debug)]
pub(crate) struct {{ port | pascal }}{{ part | pascal }}Adapter;
{%- endif %}

impl {{ port | pascal }}Port for {{ port | pascal }}{{ part | pascal }}Adapter {}
'''

[params]
port = { type = "identifier", from = "directory-name", description = "The outbound port the adapter implements, captured from the path of its part; the directory's own name where the part has no port." }
part = { type = "identifier", from = "directory-name", description = "The adapter's directory name: the implementation." }

