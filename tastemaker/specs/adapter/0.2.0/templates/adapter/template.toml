[[scenarios]]
id = 'store-adapter'
scenario = 'A store adapter: built from its settings, empty when its file is absent, of another build or undecodable, and kept once on success through a temporary file and a rename.'
given.file = 'src/outbound/check_store/adapters/postcard/adapter.rs'
given.params = { port = 'check_store', part = 'postcard' }
given.files.'src/outbound/check_store/adapters/postcard/settings.rs' = '''
//! What the postcard check_store adapter is configured with.

/// The postcard check_store adapter's settings: the values and parts its
/// composition chooses.
#[derive(Debug)]
pub(crate) struct CheckStorePostcardSettings {
    /// The directory the store's file is kept in.
    pub(crate) directory: std::path::PathBuf,
    /// The build that reads and writes it: a file of another build reads empty.
    pub(crate) build: Box<str>,
}
'''
given.files.'src/outbound/check_store/adapters/postcard/adapter.rs' = '''
//! The check_store port, implemented with postcard.

use crate::outbound::check_store::interface::CheckStorePort;
use super::settings::CheckStorePostcardSettings;

/// The postcard check_store adapter, configured by its settings.
#[derive(Debug)]
pub(crate) struct CheckStorePostcardAdapter {
    settings: CheckStorePostcardSettings,
}

impl CheckStorePostcardAdapter {
    /// The adapter over `settings`, which its composition chooses.
    pub(crate) fn new(settings: CheckStorePostcardSettings) -> Self {
        Self { settings }
    }
}

impl CheckStorePort for CheckStorePostcardAdapter {
    fn findings(&self) -> Vec<crate::domain::findings::types::Finding> {
        let file = self.settings.directory.join("check.postcard");
        std::fs::read(&file)
            .ok()
            .and_then(|bytes| super::schemas::read(&bytes, &self.settings.build))
            .unwrap_or_default()
    }

    fn keep_findings(&self, findings: &[crate::domain::findings::types::Finding]) -> std::io::Result<()> {
        let file = self.settings.directory.join("check.postcard");
        let written = self.settings.directory.join("check.postcard.tmp");
        std::fs::create_dir_all(&self.settings.directory)?;
        std::fs::write(&written, super::schemas::write(findings, &self.settings.build))?;
        std::fs::rename(&written, &file)
    }
}
'''

