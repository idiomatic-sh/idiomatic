description = "No file of an adapter (its tests aside) depends on another hex's adapters, or names more than one port of the core: an adapter implements the one port of its hex and nothing else."
why = "Adapters are tightly scoped, and a boundary between cores is an outbound port plus an adapter. An adapter reaches its own hex's types, errors, domain concepts and settings, the core's port vocabulary (its types and errors) and the one port it implements, its library and `std`; the core's use cases and domain concepts stay out of reach, and anything that calls two ports orchestrates, which only a use case does. Within the crate a dependency is read from the source dependencies the language provider resolves, however the path is written. Across crates it is read from the written path of an import or of a use in an expression or a type: a path into another crate naming `<..>::use_cases::..` or `<..>::domain::..`; an adapter that names two different `<..>::outbound::<port>::interface::<Name>Port` ports breaks the second rule. A library module that happens to be called `interface` holds no `<Name>Port` and is not mistaken for one, and the interface of a collection of the adapter's own is no port of the core. The rule finds an adapter by its path, `<hex>/adapters/<adapter>/..`, so a file outside an `adapters` directory is not read, and it groups the ports named by hex, so the adapters of one hex that name different ports are each a finding. A path generated by a macro is not seen. The `imports` built-in cannot say this: a library is any crate, so an allow-list cannot name them."

query = '''
let all-adapter-deps = capture(from="source-dependency", path="source", pattern="{*hex}/adapters/{*rest}", captures=["hex", "rest"]);
let adapter-test-deps = select * from all-adapter-deps where glob_any(source, "{**/*_test.rs}");
let adapter-deps = antijoin(left=all-adapter-deps, right=adapter-test-deps, left-on=["source", "span", "target"], right-on=["source", "span", "target"]);
let adapters-list-deps = capture(from=adapter-deps, path="target", pattern="{*other}/adapters.rs", captures=["other"]);
let adapters-deps = capture(from=adapter-deps, path="target", pattern="{*other}/adapters/{*part}", captures=["other", "part"]);
let adapters-list-rows = project(from=adapters-list-deps, columns=["source", "span", "target", "hex", "other"]);
let adapters-rows = project(from=adapters-deps, columns=["source", "span", "target", "hex", "other"]);
let reached = union(left=adapters-list-rows, right=adapters-rows);
let own = select l."source" as "source", l."span" as "span", l."target" as "target" from reached as l join reached as r on l."source" = r."source" and l."span" = r."span" and l."target" = r."target" and l."hex" = r."other";
let foreign = antijoin(left=reached, right=own, left-on=["source", "span", "target"], right-on=["source", "span", "target"]);
let local-findings = project(from=foreign, columns=["source", "span"]);
let import-rows = project(from="static-import", columns=["file", "span", "target"]);
let reference-rows = project(from="reference", columns=["file", "span", "target"]);
let mentions = union(left=import-rows, right=reference-rows);
let all-imports = capture(from=mentions, path="file", pattern="{*hex}/adapters/{*rest}", captures=["hex", "rest"]);
let test-imports = select * from all-imports where glob_any(file, "{**/*_test.rs}");
let imports = antijoin(left=all-imports, right=test-imports, left-on=["file", "span", "target"], right-on=["file", "span", "target"]);
let port-imports = select * from imports where glob_any(target, "{*::outbound::*::interface::*Port}");
let port-counts = group-count(from=port-imports, keys=["hex"], count="ports", distinct="target");
let crowded = select * from port-counts where ports > 1;
let crowded-imports = select l."file" as "source", l."span" as "span" from port-imports as l join crowded as r on l."hex" = r."hex";
let findings = union(left=local-findings, right=crowded-imports);
emit findings subject "source" key("span");
'''

[diagnostic]
primary = "span"
message = "this path reaches another hex's adapters or a second port of the core, from an adapter"
help = "An adapter implements the one port of its hex and reaches only its own hex's types, errors, domain concepts and settings, the core's values and errors, its library and `std`. Calling a second port or the core's logic is orchestration: it belongs in a use case of the core, which takes the port as a dependency; keep the adapter to the one thing it implements. An ignore is not legitimate here."

