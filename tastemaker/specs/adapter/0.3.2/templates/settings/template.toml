description = "An adapter's settings: the values and injected parts its composition configures it with."
why = "Gathers what an adapter's composition configures it with in one type, so an adapter is built from explicit settings rather than reading its environment. The struct is named for the port and the adapter, `<Port><Part>Settings`, like the adapter it configures. A store adapter's settings are the directory its file is kept in and the build that reads and writes it; its factory takes them and no port method does."
content = '''
//! What the {{ part }} {{ port }} adapter is configured with.

/// The {{ part }} {{ port }} adapter's settings: the values and parts its
/// composition chooses.
#[derive(Debug)]
struct {{ port | pascal }}{{ part | pascal }}Settings {}
'''

[params]
port = { type = "identifier", from = "directory-name", description = "The outbound port the adapter implements, captured from the path of its part; the directory's own name where the part has no port." }
part = { type = "identifier", from = "directory-name", description = "The adapter's directory name: the implementation." }

[[scenarios]]
id = 'example-adapter'
scenario = 'The rendered template passes.'
given.file = 'src/names/adapters/memory/settings.rs'
given.params = { port = 'names', part = 'memory' }
given.files.'src/names/adapters/memory/settings.rs' = '''
//! What the memory names adapter is configured with.

/// The memory names adapter's settings: the values and parts its
/// composition chooses.
#[derive(Debug)]
pub struct NamesMemorySettings {
    root: std::path::PathBuf,
}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'src/names/adapters/memory/settings.rs'
given.params = { port = 'names', part = 'memory' }
given.files.'src/names/adapters/memory/settings.rs' = '''
//! What the memory names adapter is configured with.

/// The memory names adapter's settings: the values and parts its
/// composition chooses.
#[derive(Debug)]
pub struct NamesMemorySettings {
    root: std::path::PathBuf,
}

impl NamesMemorySettings {
    /// Settings over `root`.
    pub(crate) fn new(root: std::path::PathBuf) -> Self {
        Self { root }
    }
}
'''

[[scenarios]]
id = 'crate-settings'
scenario = 'The crate keeps the settings to itself.'
given.file = 'src/names/adapters/memory/settings.rs'
given.params = { port = 'names', part = 'memory' }
given.files.'src/names/adapters/memory/settings.rs' = '''
//! What the memory names adapter is configured with.

/// The memory names adapter's settings: the values and parts its
/// composition chooses.
#[derive(Debug)]
pub(crate) struct NamesMemorySettings {
    root: std::path::PathBuf,
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/names/adapters/memory/settings.rs'
given.params = { port = 'names', part = 'memory' }
then.findings = [
  { rule = 'settings#count', path = '.' },
]

