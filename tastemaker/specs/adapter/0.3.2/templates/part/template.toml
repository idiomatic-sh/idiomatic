description = "The module file of a nested part of the adapter, holding the part's items."
why = "An adapter too long for one file keeps a cohesive part in a directory of its own (`decode/`, `encode/`), whose `mod.rs` holds the part's items. The part is still the adapter: it sits beneath `adapters/`, so the clients and the outside world stay allowed there and nowhere else, and its `adapter.rs`, `types.rs`, `errors.rs` and `constants.rs` are placed by their own role templates."
content = '''
//! A part of the `{{ part }}` adapter.
'''

[params]
part = { type = "identifier", from = "directory-name", description = "The directory of the file: the nested part it belongs to." }

[[scenarios]]
id = "nested-part-file"
scenario = "A file of a nested part with any items has no finding."
given.file = "lowering/mod.rs"
given.files.'lowering/mod.rs' = '''
//! Lowering of the concept's values.

pub(crate) struct Lowered;
'''

[[scenarios]]
id = "nested-part-file-missing"
scenario = "A part file the entry places that is missing is reported."
given.file = "lowering/mod.rs"
then.findings = [{ rule = "#count", path = "." }]
