given.files.'src/journal/adapters/memory/schemas.rs' = '''
//! The shape of the data this adapter does not control: each wire shape is a `<Name>Schema`, its checked conversion into the core's type is an `impl TryFrom<<Name>Schema>`, and each refusal of a conversion is a `<Name>SchemaError`.

#[cfg(test)]
#[path = "schemas_test.rs"]
mod tests;

/// One stored greeting as the file writes it.
pub(super) struct StoredSchema {
    pub(super) text: String,
}

/// Why a stored greeting was refused.
pub(super) enum StoredSchemaError {
    Empty,
}

impl TryFrom<StoredSchema> for Greeting {
    type Error = StoredSchemaError;

    fn try_from(schema: StoredSchema) -> Result<Self, Self::Error> {
        if schema.text.is_empty() {
            return Err(StoredSchemaError::Empty);
        }
        Ok(Greeting(schema.text))
    }
}
'''
given.files.'src/journal/adapters/memory/schemas_test.rs' = '''
//! What the schemas of this adapter accept and refuse, one row of `CASES` for each input.

use super::schemas::{StoredSchema, StoredSchemaError};
use crate::cases::{Case, Expect, Word, run};
use crate::outbound::names::types::Greeting;

type Input = &'static str;
type Value = Greeting;
type Failure = StoredSchemaError;

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: "accepts a stored greeting",
        word: Word::Succeeds,
        input: || "hello, Ada",
        expect: Expect::Value(Greeting("hello, Ada".to_owned())),
    },
    Case {
        name: "refuses an empty greeting",
        word: Word::Refuses,
        input: || "",
        expect: Expect::Error(StoredSchemaError::Empty),
    },
];

/// Converts one wire input through the schemas; the author states it.
fn subject(text: Input) -> Result<Value, Failure> {
    Greeting::try_from(StoredSchema { text: text.to_owned() })
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}

#[test]
fn refuses() {
    run(CASES, Word::Refuses, subject);
}
'''
