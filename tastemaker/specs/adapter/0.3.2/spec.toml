  { rule = "adapter-owns-no-adapter", include = ["*.rs"], exclude = ["*_test.rs", "fixtures.rs"], description = "An adapter never reaches another adapter: no path into another adapter directory, no other adapter type, no port trait but the one it implements, no factory." },
  { rule = "no-wildcard-into-domain-enum", include = ["adapter.rs", "schemas.rs", "writer.rs"], description = "A match in an adapter has no `_ =>` arm: a variant added to a domain enum is a compile error in every adapter that maps it." },
  { rule = "stateless-adapters", include = ["adapter.rs", "types.rs", "errors.rs", "settings.rs", "connection.rs", "writer.rs"], description = "An adapter has no process-global state: static and thread-local declarations are refused; injected connections and instance-owned cells are allowed." },
  { rule = "hollow-settings", include = ["settings.rs"], description = "An adapter's settings hold real values, never an empty struct." },
  { rule = "schemas-members", include = ["*.rs"], description = "An adapter that parses or writes an external format and whose port carries data has a schemas.rs and its test; one whose port carries none has neither; an adapter with no external format owes none." },
  { rule = "idiomatic.arch/no-inherent-impls@0.1.0", include = ["types.rs"], description = "A part's types.rs is its data and its trait impls: no `impl Type { }` block." },
  { rule = "idiomatic.arch/hollow-types@0.1.0", include = ["types.rs"], description = "A part's types.rs declares at least one type." },
  { rule = "idiomatic.arch/public-fields@0.3.0", include = ["types.rs"], description = "Every field of a struct in a types.rs is public: a type is its data." },
  { rule = "idiomatic.arch/no-domain-aliases@0.1.0", include = ["types.rs", "errors.rs"], description = "A part's types and errors are nominal types, never type aliases." },
  { rule = "idiomatic.arch/error-name@0.1.0", include = ["errors.rs"], description = "A part's errors.rs, and the errors.rs of a collection below it, declares exactly one enum named <Name>Error and no other type." },
  { rule = "idiomatic.arch/unit-cases@0.1.0", include = ["*.rs"], description = "A part's test has a `succeeds` row, and a `refuses` row where its errors.rs has a variant of its own." },
  { rule = "idiomatic.arch/proof-beside@0.1.0", include = ["*.rs"], description = "A schemas test exists exactly beside the schemas it proves: schemas_test.rs beside schemas.rs." },
  { rule = "idiomatic.arch/schema-name@0.1.0", include = ["schemas.rs"], description = "A schemas.rs names its wire shapes <Name>Schema and their refusals <Name>SchemaError, converts with TryFrom (or From, where the conversion cannot fail) and does nothing else." },
  { rule = "idiomatic.arch/schema-visibility@0.1.0", include = ["schemas.rs"], description = "Nothing in a part's schemas is visible beyond the module that owns them." },
  { rule = "idiomatic.arch/hollow-artifacts@0.1.0", include = ["*.rs"], description = "No file of a part is only comments and imports, and no type in it is an empty placeholder." },
  { rule = "idiomatic.arch/validation-at-edges@0.1.0", include = ["*.rs"], exclude = ["schemas.rs", "*_test.rs"], description = "A `TryFrom`, an `impl FromStr` or a fallible constructor is written only in a schemas.rs." },
  { rule = "idiomatic.arch/no-runtime-fixtures@0.2.0", include = ["*.rs"], exclude = ["*_test.rs", "fixtures.rs"], description = "Nothing in a part but its tests and its fixtures reads a `fixtures` module." },
  { rule = "idiomatic.arch/factory-calls@0.1.0", include = ["*.rs"], exclude = ["composition.rs", "fixtures.rs", "*_test.rs"], description = "Only an edge's composition (and the part's fixtures and tests) names a `factory` module: only an edge builds an adapter." },
  { rule = "idiomatic.arch/test-shape@0.1.0", include = ["*_test.rs"], description = "Every test of a part is a runner named for a case word over a `CASES` table." },
  { rule = "idiomatic.arch/test-runners-match-rows@0.1.0", include = ["*_test.rs"], description = "A test file has a runner `run(CASES, Word::<word>, subject)` exactly for each case word its `CASES` table has rows of." },
  { rule = "idiomatic.arch/case-expectation@0.1.0", include = ["*_test.rs"], description = "A row of a part's table expects a value or an error variant, never any success." },
]

