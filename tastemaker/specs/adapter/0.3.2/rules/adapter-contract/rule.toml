description = "An adapter's `adapter_test.rs` runs the contract rows the core exports for its port, `crate::outbound::<port>::fixtures::contract::CASES` (or calls the exported `check` or `check_with` runner)."
why = "Every adapter proves the port's promised behavior by running the rows the core exports under its `fixtures` feature, so no test is named `passes_the_interface_test` and each row of the contract fails by its name; the adapter-test template's declarations cannot show the use of the rows they exist for. The evidence is a written path: a reference to `...::outbound::<port>::fixtures::contract::CASES`, or to the name a file imports that as (`use...::CASES as CONTRACT`), or a call of `...::contract::check` or `check_with` (a port may export a runner beside its rows), written out or by an imported name. A reference alone does not execute rows: the rows must be the first argument of a call of run, or the exported check must be called; and a `check` reached through a re-export is not seen. Which port's rows they are stays the template's and the reviewer's: a rule cannot compare the port segment of a written `::` path with the directory of the adapter's port, because a query cannot split a written path."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let files = select * from tree-nodes where kind = "source-file";
let required = project(from=files, columns=["file", "span"]);
let path-calls = select l."file" as "file", l."span" as "span", l."target" as "target" from "static-call" as l join "reference" as r on l."file" = r."file" and l."span" = r."span" and l."target" = r."target";
let qualified-calls = select * from path-calls where glob_any(target, "{contract::check,contract::check_with,*::outbound::*::fixtures::contract::check,*::outbound::*::fixtures::contract::check_with}");
let qualified = project(from=qualified-calls, columns=["file"]);
let check-imports = select * from "static-import" where glob_any(target, "{contract::check,contract::check_with,*::outbound::*::fixtures::contract::check,*::outbound::*::fixtures::contract::check_with}");
let imported-calls = select l."file" as "file" from path-calls as l join check-imports as r on l."file" = r."file" and l."target" = r."binding";
let references = project(from="reference", columns=["file", "span", "target"]);
let qualified-rows = select * from references where glob_any(target, "{contract::CASES,*::outbound::*::fixtures::contract::CASES}");
let qualified-row-paths = project(from=qualified-rows, columns=["file", "span"]);
let row-imports = select * from "static-import" where glob_any(target, "*::outbound::*::fixtures::contract::CASES");
let imported-rows = select l."file" as "file", l."span" as "span" from references as l join row-imports as r on l."file" = r."file" and l."target" = r."binding";
let row-uses = union(left=qualified-row-paths, right=imported-rows);
let call-expressions = select * from tree-nodes where kind = "call-expr";
let direct-parts = select l."id" as "call", r."child" as "child" from call-expressions as l join "syntax-child" as r on l."id" = r."parent";
let argument-lists = select * from tree-nodes where kind = "arg-list";
let call-arguments = select l."call" as "call", r."id" as "args" from direct-parts as l join argument-lists as r on l."child" = r."id";
let argument-edges = select l."call" as "call", r."child" as "child", r."ordinal" as "ordinal" from call-arguments as l join "syntax-child" as r on l."args" = r."parent";
let argument-nodes = select l."call" as "call", l."ordinal" as "ordinal", r."id" as "id", r."file" as "file", r."span" as "span" from argument-edges as l join tree-nodes as r on l."child" = r."id";
let argument-pairs = select l."id" as "id", l."ordinal" as "later", r."ordinal" as "earlier" from argument-nodes as l join argument-nodes as r on l."call" = r."call";
let later-arguments = select * from argument-pairs where later > earlier;
let first-arguments = antijoin(left=argument-nodes, right=later-arguments, left-on=["id"], right-on=["id"]);
let row-calls = select l."call" as "call", l."file" as "file" from first-arguments as l join row-uses as r on l."file" = r."file" and l."span" = r."span";
let callee-nodes = select l."call" as "call", r."file" as "file", r."span" as "span", r."kind" as "kind" from direct-parts as l join tree-nodes as r on l."child" = r."id" where kind = "path-expr";
let runners = select * from path-calls where glob_any(target, "{run,*::cases::run}");
let runner-calls = select l."call" as "call" from callee-nodes as l join runners as r on l."file" = r."file" and l."span" = r."span";
let executed-rows = select l."file" as "file" from row-calls as l join runner-calls as r on l."call" = r."call";
let calling-1 = union(left=qualified, right=imported-calls);
let calling = union(left=calling-1, right=executed-rows);
let silent = antijoin(left=required, right=calling, left-on=["file"], right-on=["file"]);
emit silent subject "file" key("file");
'''

[diagnostic]
primary = "span"
message = "this adapter test never runs the core's contract rows"
help = "Run the core's rows from this adapter_test.rs: import `crate::outbound::<port>::fixtures::contract::CASES` (as `CONTRACT`, as the adapter-test template does) and run them through the adapter in each runner with the core's own runner, `crate::cases::run` (`Case` and `Word` are each crate's own, so this crate's `run` cannot take them), or call the contract's exported `check`; the crate enables the core's `fixtures` feature from `[dev-dependencies]`. `tm scaffold` writes the test. An ignore is not legitimate here: every port has a contract to run."

[given]
files.'adapter_test.rs' = '''
//! The memory adapter of the names port.

use crate::cases::{Case, Word, run};

const CASES: &[Case<(), (), ()>] = &[];

fn subject(input: ()) -> Result<(), ()> {
    todo!()
}
'''

[[scenarios]]
id = 'a-reference-does-not-run-the-contract'
scenario = 'An adapter test that only refers to the contract without running it is reported.'
given.files.'adapter_test.rs' = 'use crate::outbound::store::fixtures::contract::CASES as CONTRACT; fn succeeds() { let _ = CONTRACT; }'
then.findings = [
  { path = 'adapter_test.rs', line = 1 },
]

[[scenarios]]
id = 'the-core-runner-executes-imported-rows'
scenario = "An adapter test that runs the contract through the core's runner is not reported."
given.files.'adapter_test.rs' = 'use crate::outbound::store::fixtures::contract::CASES as CONTRACT; fn succeeds() { crate::cases::run(CONTRACT, Word::Succeeds, subject); }'

[[scenarios]]
id = 'closure-reference-does-not-execute-contract-table'
scenario = 'An adapter test whose closure only refers to the contract table, without executing it, is reported.'
given.files.'adapter_test.rs' = 'use crate::outbound::store::fixtures::contract::CASES as CONTRACT; fn succeeds() { run(LOCAL_CASES, Word::Succeeds, |input| { let _ = CONTRACT; subject(input) }); }'
then.findings = [
  { path = 'adapter_test.rs', line = 1 },
]

