description = "An `adapter.rs` holds one `struct` that implements `<Name>Port`, named `<Name>Adapter`; any other struct in it implements the trait of a handle the port returns."
why = "An adapter is one struct named for its port, its implementation and its role, implementing the trait of its port: `NamesMemoryAdapter` for the `memory` adapter of the `names` port, with `impl NamesPort for NamesMemoryAdapter`, so a reader finds what implements a port by its name and what a factory builds by its last word. RyoQL cannot compare a PascalCase name with a snake_case directory, so the stem of the name is pinned by the part spec's templates, which write the declaration named from the directory; this rule gives that declaration its role and its suffix. Read as written: in each `adapter.rs` the entry selects, the `struct` items at the top level of the file, and an `impl` whose trait path ends in a name ending `Port` and whose self type is the struct's name (generic parameters are not part of the name); an impl generated by a macro is not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let top-items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from top-edges as l join tree-nodes as r on l."child" = r."id";
let structs = select * from top-items where kind = "struct";
let s-name-nodes-all = select * from tree-nodes where kind = "name";
let s-kids = select l."id" as "id", r."child" as "child" from structs as l join "syntax-child" as r on l."id" = r."parent";
let s-name-nodes = select l."id" as "id", r."id" as "name-node" from s-kids as l join s-name-nodes-all as r on l."child" = r."id";
let s-name-tokens = select l."id" as "id", r."child" as "token" from s-name-nodes as l join "syntax-child" as r on l."name-node" = r."parent";
let s-name-texts = select l."id" as "id", r."text" as "name" from s-name-tokens as l join tree-tokens as r on l."token" = r."id";
let struct-rows = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."name" as "name" from structs as l join s-name-texts as r on l."id" = r."id";
let a-token-edges = select l."parent" as "parent", r."id" as "token", r."kind" as "kind", r."text" as "text" from "syntax-child" as l join tree-tokens as r on l."child" = r."id";
let a-paths = select * from tree-nodes where kind = "path";
let a-segments = select * from tree-nodes where kind = "path-segment";
let a-name-refs = select * from tree-nodes where kind = "name-ref";
let a-path-segment-edges = select l."id" as "pathnode", r."child" as "child" from a-paths as l join "syntax-child" as r on l."id" = r."parent";
let a-path-segments = select l."pathnode" as "pathnode", r."id" as "segment" from a-path-segment-edges as l join a-segments as r on l."child" = r."id";
let a-segment-ref-edges = select l."pathnode" as "pathnode", r."child" as "child" from a-path-segments as l join "syntax-child" as r on l."segment" = r."parent";
let a-segment-refs = select l."pathnode" as "pathnode", r."id" as "nameref" from a-segment-ref-edges as l join a-name-refs as r on l."child" = r."id";
let a-path-names = select l."pathnode" as "pathnode", r."text" as "name" from a-segment-refs as l join a-token-edges as r on l."nameref" = r."parent";
let a-impls = select * from tree-nodes where kind = "impl";
let a-impl-children = select r."child" as "child", l."id" as "id", r."ordinal" as "ordinal", l."file" as "file", l."span" as "span" from a-impls as l join "syntax-child" as r on l."id" = r."parent";
let a-path-types = select * from tree-nodes where kind = "path-type";
let a-impl-types = select l."child" as "type", l."id" as "id", l."ordinal" as "ordinal", l."file" as "file", l."span" as "span" from a-impl-children as l join a-path-types as r on l."child" = r."id";
let a-for-tokens = select * from tree-tokens where kind = "for-kw";
let a-impl-for = select l."id" as "id", l."ordinal" as "for" from a-impl-children as l join a-for-tokens as r on l."child" = r."id";
let a-impl-types-for = select r."for" as "for", l."id" as "id", l."ordinal" as "ordinal", l."type" as "type", l."file" as "file", l."span" as "span" from a-impl-types as l join a-impl-for as r on l."id" = r."id";
let a-trait-types = select * from a-impl-types-for where ordinal < for;
let a-self-types = select * from a-impl-types-for where ordinal > for;
let a-trait-path-edges = select r."child" as "child", l."id" as "impl", l."file" as "file", l."span" as "span" from a-trait-types as l join "syntax-child" as r on l."type" = r."parent";
let a-trait-paths = select l."impl" as "impl", l."file" as "file", l."span" as "span", r."id" as "pathnode" from a-trait-path-edges as l join a-paths as r on l."child" = r."id";
let a-impl-trait = select l."impl" as "impl", l."file" as "file", l."span" as "span", r."name" as "trait" from a-trait-paths as l join a-path-names as r on l."pathnode" = r."pathnode";
let a-self-path-edges = select r."child" as "child", l."id" as "impl" from a-self-types as l join "syntax-child" as r on l."type" = r."parent";
let a-self-paths = select l."impl" as "impl", r."id" as "pathnode" from a-self-path-edges as l join a-paths as r on l."child" = r."id";
let a-impl-self = select l."impl" as "impl", r."name" as "self" from a-self-paths as l join a-path-names as r on l."pathnode" = r."pathnode";
let port-impls = select * from a-impl-trait where glob_any(trait, "*Port");
let port-impl-selves = select l."file" as "file", r."self" as "name" from port-impls as l join a-impl-self as r on l."impl" = r."impl";
let implemented = select l."id" as "id" from struct-rows as l join port-impl-selves as r on l."file" = r."file" and l."name" = r."name";
let port-structs = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."name" as "name" from struct-rows as l join implemented as r on l."id" = r."id";
let port-struct-paths = project(from=port-structs, columns=["file"]);
let absent = antijoin(left=source-files, right=port-struct-paths, left-on=["file"], right-on=["file"]);
let absent-rows = project(from=absent, columns=["file", "span"]);
let absent-findings = extend(from=absent-rows, values={"name": "adapter.rs", "problem": "declares no `struct` that implements `<Name>Port`: the file holds the adapter of its port"});
let counts = group-count(from=port-structs, keys=["file"], count="n", distinct="id");
let plural = select * from counts where n > 1;
let plural-rows = select l."file" as "file", l."span" as "span", l."name" as "name" from port-structs as l join plural as r on l."file" = r."file";
let plural-findings = extend(from=plural-rows, values={"problem": "is one of several structs of this file that implement a port: the file holds one adapter"});
let well-named = select * from port-structs where glob_any(name, "*Adapter");
let misnamed = antijoin(left=port-structs, right=well-named, left-on=["id"], right-on=["id"]);
let misnamed-rows = project(from=misnamed, columns=["file", "span", "name"]);
let misnamed-findings = extend(from=misnamed-rows, values={"problem": "implements a port but is not named `<Name>Adapter`"});
let any-impl-selves = select l."file" as "file", r."self" as "name" from a-impl-trait as l join a-impl-self as r on l."impl" = r."impl";
let with-impl = select l."id" as "id" from struct-rows as l join any-impl-selves as r on l."file" = r."file" and l."name" = r."name";
let without-impl = antijoin(left=struct-rows, right=with-impl, left-on=["id"], right-on=["id"]);
let without-impl-rows = project(from=without-impl, columns=["file", "span", "name"]);
let without-impl-findings = extend(from=without-impl-rows, values={"problem": "implements no trait: beside the adapter, a struct is a handle the port returns (it implements the handle's trait); plain data lives in the port's types.rs"});
let all-1 = union(left=absent-findings, right=plural-findings);
let all-2 = union(left=all-1, right=misnamed-findings);
let all-3 = union(left=all-2, right=without-impl-findings);
emit all-3 subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "`{name}` {problem}"
help = "Keep exactly one `struct <Port><Dir>Adapter` in `adapter.rs` (the port, the adapter's directory in PascalCase, then `Adapter`) and implement the trait of its port with `impl <Port>Port for <Port><Dir>Adapter`: rename a struct that ends otherwise, rename a trait still ending `Interface`, and move a second struct to the adapter's `types.rs`. An ignore is not legitimate here: an adapter is one struct that implements one port."

[given]
include = ['**/adapter.rs']

[[scenarios]]
id = 'one-struct-named-port-itself-implementing-port'
scenario = 'The one struct named for its port and itself, implementing the port.'
given.files.'src/names/adapters/memory/adapter.rs' = '''
//! The `names` port, implemented in memory.

use crate::outbound::names::interface::NamesPort;

/// The `memory` names adapter.
pub(crate) struct NamesMemoryAdapter;

impl NamesPort for NamesMemoryAdapter {}
'''

[[scenarios]]
id = 'qualified-trait'
scenario = 'The port named by a path.'
given.files.'src/names/adapters/memory/adapter.rs' = '''
