/// The `memory` names adapter.
pub(crate) struct NamesMemoryAdapter;

impl greeting_core::outbound::names::interface::NamesPort for NamesMemoryAdapter {}
'''

[[scenarios]]
id = 'generic-adapter'
scenario = 'A generic adapter implements the port.'
given.files.'src/names/adapters/memory/adapter.rs' = '''
