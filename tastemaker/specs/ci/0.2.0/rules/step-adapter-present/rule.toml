description = "Every step of a CI job has an adapter: a `ci/<job>/<step>/interface.py` has at least one `ci/<job>/<step>/adapters/<adapter>/adapter.py` beside it."
why = "A port no adapter implements is a step the job cannot run. The spec's adapter count holds per step only among the steps that have an adapter file, so a step with none is caught here. Read from the files' paths alone, so it holds before and after the spec places them."

query = '''
let interfaces = capture(from="filesystem.file", path="path", pattern="ci/{job}/{step}/interface.py", captures=["job", "step"]);
let adapters = capture(from="filesystem.file", path="path", pattern="ci/{job}/{step}/adapters/{adapter}/adapter.py", captures=["job", "step", "adapter"]);
let bare = antijoin(left=interfaces, right=adapters, left-on=["job", "step"], right-on=["job", "step"]);
emit bare subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "the `{step}` step of the `{job}` job has no adapter"
help = "Add the step's adapter: `tm scaffold idiomatic.arch/ci --at ci/{job}/{step}/adapters/<tool>` writes `adapter.py` and `adapter_test.py`, then implement the port in it and choose it in `ci/{job}/composition.py`. A step nothing implements is deleted instead, with its directory. An ignore is never the fix."

[given]
include = ['ci/**']
files.'ci/demo/run/adapters/local/adapter.py' = '''
"""The `run` step done locally."""
'''
files.'ci/demo/run/interface.py' = '''
"""The `run` step's port."""
'''

[[scenarios]]
id = 'every-step-adapter'
scenario = 'Every step has an adapter.'

[[scenarios]]
id = 'bare-step'
scenario = 'A step has a port and no adapter.'
given.files.'ci/demo/notify/interface.py' = '''
"""The `notify` step's port."""
'''
then.findings = [
  { path = 'ci/demo/notify/interface.py' },
]
