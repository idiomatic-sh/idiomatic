description = "The job's composition: `Parts`, the ports it is built from; `build`, which picks the real adapters; and `compose`, which wires supplied ones into the use case."
why = "Keeps the choice of adapters in one place at the edge, so the use case never names a tool and a test supplies fakes through the same `compose` the real job uses."
content = '''
"""The `{{ job }}` job's composition: the one place its adapters are chosen."""

from __future__ import annotations

import dataclasses

from ci.{{ job }}.use_case import UseCase


@dataclasses.dataclass(frozen=True)
class Parts:
    """The ports the job is composed from: an adapter, or one per tool, for each step."""


def build() -> UseCase:
    """The job with its real adapters."""
    return compose(Parts())


def compose(parts: Parts) -> UseCase:
    """The job wired from supplied parts: the seam its intent test fakes every port through."""
    return UseCase()
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'ci/{job}/composition.py'
given.count = { min = 1 }
given.files.'ci/demo/composition.py' = '''
