description = "The contract every adapter of the step meets: `conforms`, which each adapter's test calls, and the proof that it refuses a class that is not the port's."
why = "States the port's contract once, so no adapter can drift from it and the contract itself is tested."
content = '''
"""The contract every `{{ step }}` adapter meets: each adapter's test calls `conforms`."""

from __future__ import annotations

import inspect

from ci.{{ job }}.{{ step }}.interface import {{ step | pascal }}


def conforms(adapter: type) -> None:
    """`adapter` implements the port: it subclasses it and defines each of the port's
    methods with the port's own signature."""
    assert {{ step | pascal }} in adapter.__mro__, f"{adapter.__name__} does not implement {{ step | pascal }}"
    for name, method in inspect.getmembers({{ step | pascal }}, inspect.isfunction):
        if not name.startswith("_"):
            assert inspect.signature(getattr(adapter, name)) == inspect.signature(method), f"{adapter.__name__}.{name}"


def test_a_class_that_is_not_the_ports_does_not_conform() -> None:
    """The contract refuses a class that does not implement the port."""

    class Elsewhere:
        pass

    try:
        conforms(Elsewhere)
    except AssertionError:
        return
    raise AssertionError("conforms accepted a class that does not implement the port")
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'ci/{job}/{step}/interface_test.py'
