description = "The job's use case: the `Request` one run is asked for, the `Refused` error for a request it cannot run, and `UseCase`, whose `run` orders the steps over their ports and nothing else."
why = "Keeps what the job does apart from how each step is done, so the order of the steps is proven over fakes and a tool is replaced by an adapter alone."
content = '''
"""The `{{ job }}` job's use case: the order of its steps over their ports, and nothing else."""

from __future__ import annotations

import dataclasses


class Refused(Exception):
    """A request the job cannot run, said before any step runs."""


@dataclasses.dataclass(frozen=True)
class Request:
    """What one run of the job is asked to do."""


class UseCase:
    """The job, over the ports its composition supplies."""

    def run(self, request: Request) -> int:
        """Runs the job's steps for `request`: 0 when every step passes, 1 when one fails."""
        return 0
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'ci/{job}/use_case.py'
given.count = { min = 1 }
given.files.'ci/demo/use_case.py' = '''
