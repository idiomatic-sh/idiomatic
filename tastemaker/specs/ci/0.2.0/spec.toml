"""The `demo` job's command: parses its command line, composes the job and runs it.

It runs the same on a laptop and in CI: `uv run ci/demo/command.py --help`.
"""

from __future__ import annotations

import argparse
import sys
from pathlib import Path

if not __package__:
    # Run as a script: the repository root is the import root, as it is for
    # `python -m ci.demo.command` and for pytest.
    sys.path.insert(0, str(Path(__file__).resolve().parents[2]))

from ci.demo import composition  # noqa: E402
from ci.demo.use_case import Refused, Request, UseCase  # noqa: E402


def parse(argv: list[str]) -> Request:
    """The request the command line asks for."""
    parser = argparse.ArgumentParser(prog="ci/demo/command.py", description=__doc__.splitlines()[0])
    parser.parse_args(argv)
    return Request()


def run(argv: list[str], job: UseCase) -> int:
    """Runs `job` as the command line asks: 0 when it passes, 1 when a step fails, 2 when
    the request is refused."""
    try:
        return job.run(parse(argv))
    except Refused as refused:
        print(f"demo: {refused}", file=sys.stderr)
        return 2


def main() -> int:
    """The entry: the job with its real adapters."""
    return run(sys.argv[1:], composition.build())


if __name__ == "__main__":
    sys.exit(main())
