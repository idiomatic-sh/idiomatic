import dataclasses


class Refused(Exception):
    """A request the job cannot run, said before any step runs."""


@dataclasses.dataclass(frozen=True)
class Request:
    """What one run of the job is asked to do."""


class UseCase:
    """The job, over the ports its composition supplies."""

    def run(self, request: Request) -> int:
        """Runs the job's steps for `request`: 0 when every step passes, 1 when one fails."""
        return 0
