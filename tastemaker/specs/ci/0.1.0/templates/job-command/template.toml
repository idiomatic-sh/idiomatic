description = "The job's inbound edge: it parses the command line into the use case's request, builds the job through its composition, runs it, and turns a refusal into exit status 2."
why = "Keeps the job's entry the same thin edge every job has, so the job runs one way on a laptop and in any CI, and its intent test can run the very same entry with every port faked."
content = '''
# /// script
# requires-python = ">=3.12"
# dependencies = []
# ///
"""The `{{ job }}` job's command: parses its command line, composes the job and runs it.

It runs the same on a laptop and in CI: `uv run ci/{{ job }}/command.py --help`.
"""

from __future__ import annotations

import argparse
import sys
from pathlib import Path

if not __package__:
    # Run as a script: the repository root is the import root, as it is for
    # `python -m ci.{{ job }}.command` and for pytest.
    sys.path.insert(0, str(Path(__file__).resolve().parents[2]))

from ci.{{ job }} import composition  # noqa: E402
from ci.{{ job }}.use_case import Refused, Request, UseCase  # noqa: E402


def parse(argv: list[str]) -> Request:
    """The request the command line asks for."""
    parser = argparse.ArgumentParser(prog="ci/{{ job }}/command.py", description=__doc__.splitlines()[0])
    parser.parse_args(argv)
    return Request()


def run(argv: list[str], job: UseCase) -> int:
    """Runs `job` as the command line asks: 0 when it passes, 1 when a step fails, 2 when
    the request is refused."""
    try:
        return job.run(parse(argv))
    except Refused as refused:
        print(f"{{ job }}: {refused}", file=sys.stderr)
        return 2


def main() -> int:
    """The entry: the job with its real adapters."""
    return run(sys.argv[1:], composition.build())


if __name__ == "__main__":
    sys.exit(main())
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'ci/{job}/command.py'
given.count = { min = 1 }
given.files.'ci/demo/command.py' = '''
