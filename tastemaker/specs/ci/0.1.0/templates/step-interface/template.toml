description = "A step's port: the one class every adapter of the step subclasses, declaring what the step does in the job's own vocabulary."
why = "Lets the use case run a step without knowing the tool behind it, and makes each adapter say explicitly which port it implements."
content = '''
"""The `{{ step }}` step's port: what every adapter of the step does."""

from __future__ import annotations

import typing


class {{ step | pascal }}(typing.Protocol):
    """The `{{ step }}` step, done one way per adapter."""
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'ci/{job}/{step}/interface.py'
given.count = { min = 1 }
given.files.'ci/demo/run/interface.py' = '''
"""The `run` step's port: what every adapter of the step does."""

from __future__ import annotations

import typing


class Run(typing.Protocol):
    """The `run` step, done one way per adapter."""
'''

[[scenarios]]
id = 'one-too-many'
scenario = "A second one where the entry's count allows one per group."
given.file = 'ci/{job}/{step}/interface.py'
given.count = { min = 1, max = 1 }
given.files.'ci/demo/run/interface.py' = '''
"""The `run` step's port: what every adapter of the step does."""

from __future__ import annotations

import typing


class Run(typing.Protocol):
    """The `run` step, done one way per adapter."""
'''
given.files.'ci/demo/walk/interface.py' = '''
"""The `walk` step's port: what every adapter of the step does."""

from __future__ import annotations

import typing


class Walk(typing.Protocol):
    """The `walk` step, done one way per adapter."""
'''
then.findings = [
  { rule = 'step-interface#count', path = 'ci/demo' },
]
