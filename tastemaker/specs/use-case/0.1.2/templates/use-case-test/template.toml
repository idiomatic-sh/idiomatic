[[scenarios]]
id = 'implementing-parse'
scenario = "A language's parse use case runs the contract's flow over its samples."
given.file = 'use_case_test.rs'
given.params = { part = 'parse', implements = [{ use_case = 'parse', crate = 'ryo', interface = 'languages::Parse' }] }
given.files.'use_case_test.rs' = '''
//! The `parse` use case: the contract of the trait it implements, run through it, then its own cases.

use crate::cases::{Case, Word, run};
use super::use_case::ParseUseCaseImpl;
use std::sync::Arc;

use ryo::languages;

type Input = ();
type Value = ();
type Failure = ();

/// The rows of what is specific to this use case: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[];

/// Calls the use case on one input; the author states it.
fn subject(input: Input) -> Result<Value, Failure> {
    todo!("call the use case on one input")
}

/// The files the flow of the contract reads: a few the language reads, one of which the library can only half read. The author states them.
const SAMPLES: &[languages::Sample] = &[];

#[test]
fn succeeds() {
    let syntax: Arc<dyn crate::outbound::syntax::interface::SyntaxPort + Send + Sync> = todo!("the syntax adapter of the language, from its port's factory");
    let language = ParseUseCaseImpl::new(syntax);
    ryo::languages::contract::parse(&language);
    languages::contract::flow(&language, SAMPLES);
}
'''
