description = "The steps of one use case's feature: cucumber expressions over the world, declared by the runner."
why = "Holds the step definitions of one feature in its own module (one steps file per feature), so a reader finds the steps of `src/inbound/use_cases/<use_case>/acceptance.feature` in `src/inbound/use_cases/<use_case>/acceptance.rs`, and the runner `tests/bdd.rs` declares each once with `#[path]` and owns the world they share."
content = '''
//! The steps of the `{{ feature }}` feature: each a cucumber expression over the world, one to six lines, asserting the part's own results.
'''

[params]
feature = { type = "identifier", from = "directory-name", description = "The owning use case." }

[given]
file = 'acceptance.rs'
params = { feature = 'greet' }

[[scenarios]]
id = 'steps-module-for-a-use-case'
scenario = 'The steps of a use case sit in its acceptance.rs and say which feature they serve.'
given.files.'acceptance.rs' = '''
//! The steps of the `greet` feature: each a cucumber expression over the world, one to six lines, asserting the part's own results.
'''

[[scenarios]]
id = 'steps-module-missing'
scenario = 'A use case without its acceptance.rs is reported.'
then.findings = [
  { rule = 'acceptance-steps#count', path = '.' },
]
