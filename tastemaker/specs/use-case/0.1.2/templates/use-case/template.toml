description = "One use case's body: the struct `<Part>UseCaseImpl` holding only the ports it calls, each an `Arc<dyn <Name>Port>` field the edge injects, built by `new` and implementing its own `<Part>UseCase`."
why = "Holds one use case's business logic, and exactly the ports it needs, in a file named for it, so a reader finds a use case by its name, an edge builds nothing its verb does not call, and a test fakes only the ports the use case touches. Ports are dynamic and data is static: the edge injects each port through `new` as an `Arc<dyn <Name>Port>`, so the use case is one concrete type whatever its adapters are. Each use case owns its orchestration, and alike loops in two use cases are accepted. The struct is named for the part with the `UseCaseImpl` suffix, as its trait is named for it with `UseCase`. Its visibility, and its constructor's, are the crate's: `pub` where another crate's edge builds it, `pub(crate)` behind an SDK's entries, where a public struct would name the crate's internal ports; the template writes both private, which any visibility meets."
content = '''
{% if ('use_case = "' ~ part ~ '"') in implements -%}
//! The `{{ part }}` use case: it implements the contract another crate declares, with nothing of its own beside it.
{% for entry in (implements | split("{") | list)[1:] %}
{%- if ('use_case = "' ~ part ~ '"') in entry %}
{%- set crate = ((entry | split('crate = "') | list)[1] | split('"') | list)[0] %}
{%- set interface = ((entry | split('interface = "') | list)[1] | split('"') | list)[0] %}

/// `{{ part }}`, implementing `{{ crate }}::{{ interface }}`.
pub struct {{ part | pascal }}UseCaseImpl;

impl {{ part | pascal }}UseCaseImpl {
    /// `{{ part }}` over the ports it calls, which the edge injects.
    #[must_use]
    pub fn new() -> Self {
        Self
    }
}

impl {{ crate }}::{{ interface }} for {{ part | pascal }}UseCaseImpl {}
{%- endif %}
{%- endfor %}
{%- elif present["use-case-contract"] | default(false) -%}
//! The `{{ part }}` use case: the struct that implements the contract.

use super::interface::{{ part | pascal }}UseCase;

/// `{{ part }}`, implementing its contract.
pub struct {{ part | pascal }}UseCaseImpl;

impl {{ part | pascal }}UseCase for {{ part | pascal }}UseCaseImpl {}
{%- else -%}
//! The `{{ part }}` use case: the struct holding only the ports it calls.

use super::interface::{{ part | pascal }}UseCase;

/// `{{ part }}`, over only the ports it calls, each an `Arc<dyn <Name>Port>` field the edge injects.
struct {{ part | pascal }}UseCaseImpl;

impl {{ part | pascal }}UseCaseImpl {
    /// `{{ part }}` over the ports it calls, which the edge injects.
    fn new() -> Self {
        Self
    }
}

impl {{ part | pascal }}UseCase for {{ part | pascal }}UseCaseImpl {
    fn {{ part }}(&self) {}
}
{%- endif %}
'''

[params]
part = { type = "identifier", from = "directory-name", description = "The part's directory name: the stem of every name in it." }
implements = { type = "list<table>", description = "The nu-hex `implements` list; a use case it names implements the other crate's trait it gives instead of its own." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'use_case.rs'
given.params = { implements = [], part = 'greet' }
given.files.'use_case.rs' = '''
//! The `greet` use case: the struct holding only the ports it calls.

use super::interface::GreetUseCase;

/// `greet`, over only the ports it calls, each an `Arc<dyn <Name>Port>` field the edge injects.
struct GreetUseCaseImpl;

impl GreetUseCaseImpl {
    /// `greet` over the ports it calls, which the edge injects.
    fn new() -> Self {
        Self
    }
}

impl GreetUseCase for GreetUseCaseImpl {
    fn greet(&self) {}
}
'''

