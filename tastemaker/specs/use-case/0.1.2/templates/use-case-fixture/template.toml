/// What a row of the contract expects when it is refused.
type Failure = ();

/// The contract's rows: a name, one case word, an input and the expected value or error variant. Every implementation runs them.
pub const CASES: &[Case<Input, Value, Failure>] = &[];

/// Runs the contract's rows against one implementation, in the crate that implements the trait.
pub fn check(subject: &impl NamesUseCase) {
    let _ = subject;
    todo!("run the contract's rows against the implementation")
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'fixtures/contract.rs'
given.params = { part = 'names', fixture = 'contract' }
then.findings = [
  { rule = 'use-case-fixture#count', path = '.' },
]

[[scenarios]]
id = 'support-file'
scenario = 'A support file of the contract needs only its doc comment.'
given.file = 'fixtures/rows.rs'
given.params = { part = 'names', fixture = 'rows' }
given.files.'fixtures/rows.rs' = '''
//! A file of the `names` contract's test support.
'''

[[scenarios]]
id = 'support-file-missing'
scenario = 'A support file is missing.'
given.file = 'fixtures/rows.rs'
given.params = { part = 'names', fixture = 'rows' }
then.findings = [
