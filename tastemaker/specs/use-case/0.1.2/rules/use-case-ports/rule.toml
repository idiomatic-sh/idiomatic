description = "A use case's struct holds each port as an `Arc<dyn <Name>Port>` field: a field whose type mentions one of the struct's own generic parameters is a generic port, and a finding."
why = "Ports are dynamic and data is static, so a use case is one concrete type whatever its adapters are, an edge injects them as `Arc<dyn <Name>Port>` and a test injects a fake without a type parameter to name. A struct that is generic over its ports is the other design, `Greet<Names>` with a `Names: NamesPort` bound, whose every caller must name the adapters in its types. Read as written: in the `use_case.rs` the entry selects, a `struct` with a generic parameter and a field (named or positional) whose type contains a path naming that parameter, bare (`names: N`) or inside another type (`Arc<N>`, `Box<N>`). Not seen: a generic parameter that no field mentions, an `impl Trait` field and a struct generated by a macro."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let structs = select * from tree-nodes where kind = "struct";
let struct-children = select l."id" as "id", r."child" as "node" from structs as l join "syntax-child" as r on l."id" = r."parent";
let generic-lists = select * from tree-nodes where kind = "generic-param-list";
let struct-generics = select l."id" as "id", l."node" as "list" from struct-children as l join generic-lists as r on l."node" = r."id";
let list-children = select l."id" as "id", r."child" as "node" from struct-generics as l join "syntax-child" as r on l."list" = r."parent";
let type-params = select * from tree-nodes where kind = "type-param";
let struct-params = select l."id" as "id", l."node" as "param" from list-children as l join type-params as r on l."node" = r."id";
let param-children = select l."id" as "id", r."child" as "node" from struct-params as l join "syntax-child" as r on l."param" = r."parent";
let names = select * from tree-nodes where kind = "name";
let param-names = select l."id" as "id", l."node" as "name-node" from param-children as l join names as r on l."node" = r."id";
let param-name-tokens = select l."id" as "id", r."child" as "token" from param-names as l join "syntax-child" as r on l."name-node" = r."parent";
let generic-names = select l."id" as "id", r."text" as "name" from param-name-tokens as l join tree-tokens as r on l."token" = r."id";
let field-lists = select * from tree-nodes where glob_any(kind, "{record-field-list,tuple-field-list}");
let struct-lists = select l."id" as "id", l."node" as "list" from struct-children as l join field-lists as r on l."node" = r."id";
let list-fields = select l."id" as "id", r."child" as "node" from struct-lists as l join "syntax-child" as r on l."list" = r."parent";
let field-nodes = select * from tree-nodes where glob_any(kind, "{record-field,tuple-field}");
let fields = select l."id" as "id", l."node" as "field", r."file" as "file", r."span" as "span" from list-fields as l join field-nodes as r on l."node" = r."id";
let field-ids = select l."field" as "id" from fields as l join fields as r on l."field" = r."field";
let path-types = select * from tree-nodes where kind = "path-type";
let type-children = select r."child" as "node", l."id" as "type" from path-types as l join "syntax-child" as r on l."id" = r."parent";
let paths = select * from tree-nodes where kind = "path";
let type-paths = select l."node" as "node", l."type" as "type" from type-children as l join paths as r on l."node" = r."id";
let type-path-children = select r."child" as "node", l."type" as "type" from type-paths as l join "syntax-child" as r on l."node" = r."parent";
let segments = select * from tree-nodes where kind = "path-segment";
let type-segments = select l."node" as "segment", l."type" as "type" from type-path-children as l join segments as r on l."node" = r."id";
let segment-children = select r."child" as "node", l."segment" as "segment", l."type" as "type" from type-segments as l join "syntax-child" as r on l."segment" = r."parent";
let name-refs = select * from tree-nodes where kind = "name-ref";
let segment-refs = select l."node" as "node", l."segment" as "segment", l."type" as "type" from segment-children as l join name-refs as r on l."node" = r."id";
let ref-tokens = select l."segment" as "segment", r."child" as "token", l."type" as "type" from segment-refs as l join "syntax-child" as r on l."node" = r."parent";
let type-names = select r."text" as "name", l."segment" as "segment", l."type" as "type" from ref-tokens as l join tree-tokens as r on l."token" = r."id";
let named-types = select l."type" as "id", l."name" as "name" from type-names as l join type-names as r on l."type" = r."type" and l."segment" = r."segment";
let nested = axis(from=named-types, relation="syntax-child", direction=nearest-ancestor, domain=field-ids);
let owned = select l."name" as "name", r."id" as "id", r."file" as "file", r."span" as "span" from nested as l join fields as r on l."related" = r."field";
let generic-fields = select l."name" as "name", l."file" as "file", l."span" as "span" from owned as l join generic-names as r on l."id" = r."id" and l."name" = r."name";
emit generic-fields subject "file" key("span", "name");
'''

[diagnostic]
primary = "span"
message = "this field holds a port as the generic parameter `{name}`"
help = "Hold the port as an `Arc<dyn <Name>Port>` field the edge injects, and remove the generic parameter from the struct and its impls: ports are dynamic, data is static. An ignore is never the fix: a use case generic over its ports is the other design."

[given]
include = ['src/inbound/use_cases/greet/use_case.rs']

[[scenarios]]
id = 'dyn-ports'
scenario = 'The ports as dynamic fields.'
given.files.'src/inbound/use_cases/greet/use_case.rs' = '''
//! The `greet` use case: the struct holding only the ports it calls.

use std::sync::Arc;

/// `greet`, over the port it calls.
pub struct GreetUseCaseImpl {
    names: Arc<dyn NamesPort>,
}

impl GreetUseCase for GreetUseCaseImpl {
    fn greet(&self, name: &str) -> String {
        self.names.load(name)
    }
}
'''

[[scenarios]]
id = 'no-ports'
scenario = 'A use case that calls no port.'
given.files.'src/inbound/use_cases/greet/use_case.rs' = '''
//! The `greet` use case: the struct holding only the ports it calls.

use std::sync::Arc;

/// `greet`, calling no port.
pub struct GreetUseCaseImpl;
'''

[[scenarios]]
id = 'plain-fields'
scenario = 'Ordinary fields beside a dynamic port.'
given.files.'src/inbound/use_cases/greet/use_case.rs' = '''
//! The `greet` use case: the struct holding only the ports it calls.

use std::sync::Arc;

/// `greet`.
pub struct GreetUseCaseImpl {
    names: Arc<dyn NamesPort>,
    greeting: String,
    attempts: u32,
}
'''

[[scenarios]]
id = 'unused-generic'
scenario = 'A generic parameter no field mentions.'
given.files.'src/inbound/use_cases/greet/use_case.rs' = '''
//! The `greet` use case: the struct holding only the ports it calls.

use std::sync::Arc;

/// `greet`.
pub struct GreetUseCaseImpl<N> {
    label: String,
    marker: std::marker::PhantomData<fn()>,
}
'''

[[scenarios]]
id = 'generic-port'
scenario = 'A port held as a bare generic parameter.'
given.files.'src/inbound/use_cases/greet/use_case.rs' = '''
//! The `greet` use case: the struct holding only the ports it calls.

use std::sync::Arc;

/// `greet`.
pub struct GreetUseCaseImpl<N: NamesPort> {
    names: N,
}
'''
then.findings = [
  { path = 'src/inbound/use_cases/greet/use_case.rs', line = 7 },
]

