'''

[[scenarios]]
id = 'other-kind-of-fixture-without-contract'
scenario = 'A file of fixtures that is not a Rust file stays refused without a contract.'
given.files.'src/inbound/use_cases/greet/fixtures/rows.rs' = '''
//! x
'''
given.files.'src/inbound/use_cases/greet/fixtures/rows.json' = '[]'
then.findings = [
  { path = 'src/inbound/use_cases/greet/fixtures/rows.json' },
]

[[scenarios]]
id = 'constants-without-contract'
scenario = 'A use case with constants and no contract is not reported: any use case names its bounds in constants.rs.'
given.files.'src/inbound/use_cases/greet/constants.rs' = '''
//! The names of the `greet` use case.

/// The greeting a call starts with.
pub const GREETING: &str = "hello";
'''

[[scenarios]]
id = 'nested-fixture-without-contract'
scenario = 'A use case with a test support file in a directory of fixtures and no contract.'
given.files.'src/inbound/use_cases/greet/fixtures/rows/detail.rs' = '''
//! A file of the rows, in a directory of its own.
'''
then.findings = [
  { path = 'src/inbound/use_cases/greet/fixtures/rows/detail.rs' },
]
