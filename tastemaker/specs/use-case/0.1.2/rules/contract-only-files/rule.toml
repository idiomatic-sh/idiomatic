[[scenarios]]
id = 'concept-fixtures-without-contract'
scenario = 'A use case with no contract splits its test support into one Rust file for each concept, directly in fixtures/.'
given.files.'src/inbound/use_cases/greet/fixtures/rows.rs' = '''
//! x
'''
given.files.'src/inbound/use_cases/greet/fixtures/scenario.rs' = '''
