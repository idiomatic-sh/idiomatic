description = "A use case's `use_case.rs` declares only its struct, `<Name>UseCaseImpl`, the `<Name>Ports` bundle of the ports it is built with, and their impls: any other function, type, constant, static, trait, macro or inline module in the file is a finding, and so is a function of an impl that takes no `self`, but the constructor `new`."
why = "A use case only orchestrates its ports; rules live in the domain. A free function, a private type or a second struct beside the use case's struct is the place where a comparison or a rule hides inside the use case, out of the domain's reach and its tests (asymptote's `diff` use case held an 80-line comparison in `fn diff` and an `enum Evidence` beside it). The use case's own private helpers belong in `service.rs` beside it (`local-helpers`), its plain data in `types.rs`, and a rule in a domain concept. The `<Name>Ports` struct, the ports the use case is constructed from (`DownPorts`), is the use case's own wiring and stays beside it. Read as written: the top-level items of the file, a `struct` by its name. Its `impl` blocks of any trait pass, and so do `use` declarations and a `mod` declaration without a body. Not seen: items a macro generates."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let top-items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from top-edges as l join tree-nodes as r on l."child" = r."id";
let other-kinds = select * from top-items where glob_any(kind, "{fn,enum,union,type-alias,const,static,trait,trait-alias,macro-rules}");
let other-rows = project(from=other-kinds, columns=["file", "span"]);
let structs = select * from top-items where kind = "struct";
let struct-kids = select l."id" as "id", r."child" as "child" from structs as l join "syntax-child" as r on l."id" = r."parent";
let name-nodes = select * from tree-nodes where kind = "name";
let struct-names = select l."id" as "id", r."id" as "name-node" from struct-kids as l join name-nodes as r on l."child" = r."id";
let name-tokens = select l."id" as "id", r."child" as "token" from struct-names as l join "syntax-child" as r on l."name-node" = r."parent";
let named = select l."id" as "id", r."text" as "name" from name-tokens as l join tree-tokens as r on l."token" = r."id";
let own = select * from named where glob_any(name, "{*UseCaseImpl,*Ports}");
let foreign = antijoin(left=structs, right=own, left-on=["id"], right-on=["id"]);
let foreign-rows = project(from=foreign, columns=["file", "span"]);
let modules = select * from top-items where kind = "module";
let module-kids = select l."id" as "id", r."child" as "child" from modules as l join "syntax-child" as r on l."id" = r."parent";
let bodies = select * from tree-nodes where kind = "item-list";
let inline = select l."id" as "id" from module-kids as l join bodies as r on l."child" = r."id";
let inline-modules = select l."file" as "file", l."span" as "span" from modules as l join inline as r on l."id" = r."id";
let impls = select * from top-items where kind = "impl";
let impl-kids = select r."child" as "child" from impls as l join "syntax-child" as r on l."id" = r."parent";
let assoc-lists = select * from tree-nodes where kind = "assoc-item-list";
let impl-lists = select r."id" as "id" from impl-kids as l join assoc-lists as r on l."child" = r."id";
let list-kids = select r."child" as "child" from impl-lists as l join "syntax-child" as r on l."id" = r."parent";
let fn-nodes = select * from tree-nodes where kind = "fn";
let assoc-fns = select r."id" as "id", r."file" as "file", r."span" as "span" from list-kids as l join fn-nodes as r on l."child" = r."id";
let fn-kids = select l."id" as "id", r."child" as "child" from assoc-fns as l join "syntax-child" as r on l."id" = r."parent";
let param-lists = select * from tree-nodes where kind = "param-list";
let fn-params = select l."id" as "id", r."id" as "params" from fn-kids as l join param-lists as r on l."child" = r."id";
let param-kids = select l."id" as "id", r."child" as "child" from fn-params as l join "syntax-child" as r on l."params" = r."parent";
let self-params = select * from tree-nodes where kind = "self-param";
let with-self = select l."id" as "id" from param-kids as l join self-params as r on l."child" = r."id";
let fn-names = select l."id" as "id", r."id" as "name-node" from fn-kids as l join name-nodes as r on l."child" = r."id";
let fn-name-tokens = select l."id" as "id", r."child" as "token" from fn-names as l join "syntax-child" as r on l."name-node" = r."parent";
let fn-named = select l."id" as "id", r."text" as "name" from fn-name-tokens as l join tree-tokens as r on l."token" = r."id";
let constructors = select * from fn-named where name = "new";
let kept-0 = antijoin(left=assoc-fns, right=with-self, left-on=["id"], right-on=["id"]);
let selfless = antijoin(left=kept-0, right=constructors, left-on=["id"], right-on=["id"]);
let selfless-rows = project(from=selfless, columns=["file", "span"]);
let found-0 = union(left=other-rows, right=foreign-rows);
let found-1 = union(left=found-0, right=inline-modules);
let found = union(left=found-1, right=selfless-rows);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this item is not the use case's struct or one of its impls"
help = "Move a private helper function, and an impl's function that takes no `self` (but `new`), to `service.rs` beside the use case, plain data to its `types.rs`, and a rule or a comparison to a domain concept the use case calls; `use_case.rs` holds the struct `<Name>UseCaseImpl`, its `<Name>Ports` bundle and their impls only."

[given]
include = ['src/inbound/use_cases/greet/use_case.rs']

[[scenarios]]
id = 'struct-and-impls'
scenario = 'The struct, its inherent impl and its trait impl: it passes.'
given.files.'src/inbound/use_cases/greet/use_case.rs' = '''
//! The `greet` use case.

use std::sync::Arc;

use super::interface::GreetUseCase;

/// `greet`, over the port it calls.
pub struct GreetUseCaseImpl {
    names: Arc<dyn NamesPort>,
}

impl GreetUseCaseImpl {
    /// `greet` over its port.
    pub fn new(names: Arc<dyn NamesPort>) -> Self {
        Self { names }
    }

    fn named(&self, name: &str) -> String {
        self.names.load(name)
    }
}

impl GreetUseCase for GreetUseCaseImpl {
    fn greet(&self, name: &str) -> String {
        self.named(name)
    }
}
'''

