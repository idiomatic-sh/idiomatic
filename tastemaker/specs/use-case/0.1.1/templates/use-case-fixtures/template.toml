description = "One use case's fixtures module file: the scenario its tests share, and, for a use case other crates implement, the declaration of its contract."
why = "A use case keeps its test support in `fixtures.rs`: the scenario its tests share, built over the fakes of its ports. A use case that other crates implement (it has a `fixtures/contract.rs`) also declares that contract here, so the contract is reached from one place. The use case's module file declares this module under the gate of test support, `#[cfg(any(test, feature = \"fixtures\"))]`, so the gate is stated once (`module-declares`)."
content = '''
//! The test support of the `{{ part }}` use case: {% if present["use-case-contract"] | default(false) %}the contract every implementation of its trait runs{% else %}the scenario its tests share{% endif %}.
{% if present["use-case-contract"] | default(false) %}
pub mod contract;
{%- endif %}
'''

[params]
part = { type = "identifier", from = "directory-name", description = "The use case's directory name." }

[given]
file = 'fixtures.rs'
params = { part = 'names' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'fixtures.rs' = '''
//! The test support of the `names` use case: the contract every implementation of its trait runs.

pub mod contract;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'use-case-fixtures#count', path = '.' },
]
