description = "A use case that implements a trait another crate declares has no `interface.rs`, `types.rs` or `errors.rs` beside its body."
why = "A listed use case takes its trait, its types and its errors from the crate that declares the trait, so a file of its own beside the body would be a second definition of the same promise. Which use case implements another crate's trait is read from its body: a `use_case.rs` with no `super` path. Not seen: a body that reaches `super` for another reason."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = project(from=listed-files, columns=["file"]);
let bodies = capture(from=files, path="file", pattern="{*dir}/use_case.rs", captures=["dir"]);
let supers = select * from tree-tokens where text = "super";
let super-parents = select r."parent" as "id" from supers as l join "syntax-child" as r on l."id" = r."child";
let segments = select * from tree-nodes where glob_any(kind, "{path-segment,name-ref}");
let local = select r."file" as "file" from super-parents as l join segments as r on l."id" = r."id";
let local-paths = project(from=local, columns=["file"]);
let implemented = antijoin(left=bodies, right=local-paths, left-on=["file"], right-on=["file"]);
let own = capture(from=files, path="file", pattern="{*dir}/{name}.rs", captures=["dir", "name"]);
let owned = select * from own where glob_any(name, "{interface,types,errors}");
let extra = select l."file" as "file", l."name" as "name" from owned as l join implemented as r on l."dir" = r."dir";
emit extra subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "`{file}` stands beside a use case that implements another crate's trait"
help = "Delete it: the declaring crate owns the trait, its types and its errors. An ignore is never the fix."

[given]
include = ['app/src/inbound/use_cases/parse/*.rs']
files.'app/src/inbound/use_cases/parse/use_case.rs' = '''
struct ParseUseCaseImpl;

impl ryo_language::ParseUseCase for ParseUseCaseImpl {}
'''

[[scenarios]]
id = 'body-alone'
scenario = 'The body alone: nothing is reported.'

[[scenarios]]
id = 'with-interface'
scenario = 'An interface beside the implementing body.'
given.files.'app/src/inbound/use_cases/parse/interface.rs' = '''
pub trait ParseUseCase {}
'''
then.findings = [
  { path = 'app/src/inbound/use_cases/parse/interface.rs' },
]

[[scenarios]]
id = 'normal-use-case-keeps-interface'
scenario = 'A normal use case keeps its interface.'
given.files.'app/src/inbound/use_cases/parse/interface.rs' = '''
pub trait ParseUseCase {}
'''
given.files.'app/src/inbound/use_cases/parse/use_case.rs' = '''
use super::interface::ParseUseCase;

struct ParseUseCaseImpl;

impl ParseUseCase for ParseUseCaseImpl {}
'''
