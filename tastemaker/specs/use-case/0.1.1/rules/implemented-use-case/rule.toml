description = "Selects each use case body that names no trait of its own interface, so a condition it answers holds when the use case implements a trait another crate declares."
why = "Lets the use-case spec place `interface.rs` exactly for a use case that has its own trait. A normal use case body reads its trait through `use super::interface::...`, so a `use_case.rs` with no `super` path is one that implements another crate's trait. It answers the `implemented` condition and is never placed as a check, so its rows are never findings; its level only lets its fixtures show them."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = project(from=listed-files, columns=["file"]);
let bodies = select * from files where glob_any(file, "{use_case.rs,**/use_case.rs}");
let supers = select * from tree-tokens where text = "super";
let super-parents = select r."parent" as "id" from supers as l join "syntax-child" as r on l."id" = r."child";
let segments = select * from tree-nodes where glob_any(kind, "{path-segment,name-ref}");
let local = select r."file" as "file" from super-parents as l join segments as r on l."id" = r."id";
let local-paths = project(from=local, columns=["file"]);
let implemented = antijoin(left=bodies, right=local-paths, left-on=["file"], right-on=["file"]);
emit implemented subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "`{file}` implements a trait another crate declares"
help = "Nothing to fix: this rule only answers a condition, and its rows are never reported as findings."

[given]
include = ['app/src/inbound/use_cases/parse/use_case.rs']

[[scenarios]]
id = 'body-no-super-path-answers-yes'
scenario = 'A body with no `super` path answers yes.'
given.files.'app/src/inbound/use_cases/parse/use_case.rs' = '''
struct ParseUseCaseImpl;

impl ryo_language::ParseUseCase for ParseUseCaseImpl {}
'''
then.findings = [
  { path = 'app/src/inbound/use_cases/parse/use_case.rs' },
]

[[scenarios]]
id = 'body-reads-trait-through-super-answers-no'
scenario = 'A body that reads its trait through `super` answers no.'
given.files.'app/src/inbound/use_cases/parse/use_case.rs' = '''
use super::interface::ParseUseCase;

struct ParseUseCaseImpl;

impl ParseUseCase for ParseUseCaseImpl {}
'''
