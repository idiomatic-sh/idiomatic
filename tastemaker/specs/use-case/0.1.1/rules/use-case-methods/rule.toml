'''

[[scenarios]]
id = 'other-method'
scenario = 'A trait whose method is named for another use case.'
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What the `greet` use case promises, in its own vocabulary.

/// What `greet` offers its callers.
pub trait GreetUseCase {
    /// Runs `farewell`.
    fn farewell(&self, name: &str) -> String;
}
'''
then.findings = [
  { path = 'src/inbound/use_cases/greet/interface.rs', line = 4 },
  { path = 'src/inbound/use_cases/greet/interface.rs', line = 6 },
]

[[scenarios]]
