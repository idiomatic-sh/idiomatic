description = "A use case's trait declares exactly its one method, except that a use case that is an SDK-facing contract (a `fixtures/contract.rs` beside it) declares several: the trait in the `interface.rs` of a use-case part declares a function named like the part's directory, taking `&self`, and no other."
why = "Each use case is its own part, so a reader finds its trait, struct and test by its name and a caller depends on exactly the one use case it calls. A method named otherwise means the directory and the trait disagree; a second method is a second use case hiding in one trait, which gets a part directory of its own; a use case is built once from its ports and called through a shared reference, so its method takes `&self`. A use case that is an SDK-facing contract (a `fixtures/contract.rs` that other crates run) declares the several methods the SDK calls (`recognizes`, `read_tree`, `complete` of `ParseUseCase`), and is not read here; a use case without that contract file still declares one. Only a part placed with kind `use-case` is read: a port's trait declares as many methods as the outside offers. That the trait is named `<Part>UseCase` is `kind-suffix`'s and that it is the file's only trait is `interface-shape`'s. Traits and functions in inline modules or generated by macros are not seen."
params = { kind = { type = "string", description = "The kind the part was placed with; only a part of kind use-case is read." } }

query = '''
param kind: string;
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-trait-edges = select r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let trait-kinds = select * from tree-nodes where kind = "trait";
let top-traits = select r."id" as "id", r."file" as "file", r."span" as "span" from top-trait-edges as l join trait-kinds as r on l."child" = r."id";
let interface-files = capture(from=listed-files, path="file", pattern="{*dir}/{part}/interface.rs", captures=["dir", "part"]);
let contract-files = capture(from=listed-files, path="file", pattern="{*dir}/{part}/fixtures/contract.rs", captures=["dir", "part"]);
let contract-keys = project(from=contract-files, columns=["dir", "part"]);
let tagged = extend(from=interface-files, values={"kind": $kind});
let kind-files = select * from tagged where kind = "use-case";
let use-case-files = antijoin(left=kind-files, right=contract-keys, left-on=["dir", "part"], right-on=["dir", "part"]);
let traits = select l."id" as "id", l."file" as "file", l."span" as "span", r."part" as "part" from top-traits as l join use-case-files as r on l."file" = r."file";
let trait-list-edges = select l."file" as "file", l."span" as "span", l."part" as "part", r."child" as "child" from traits as l join "syntax-child" as r on l."id" = r."parent";
let item-lists = select * from tree-nodes where kind = "assoc-item-list";
let trait-lists = select r."id" as "list", l."file" as "file", l."part" as "part" from trait-list-edges as l join item-lists as r on l."child" = r."id";
let trait-fn-edges = select l."file" as "file", l."part" as "part", r."child" as "child" from trait-lists as l join "syntax-child" as r on l."list" = r."parent";
let fn-nodes = select * from tree-nodes where kind = "fn";
let trait-fns = select r."id" as "fn", l."file" as "file", r."span" as "span", l."part" as "part" from trait-fn-edges as l join fn-nodes as r on l."child" = r."id";
let fn-name-edges = select l."fn" as "fn", l."file" as "file", l."span" as "span", l."part" as "part", r."child" as "child" from trait-fns as l join "syntax-child" as r on l."fn" = r."parent";
let names = select * from tree-nodes where kind = "name";
let fn-name-nodes = select l."fn" as "fn", l."file" as "file", l."span" as "span", l."part" as "part", r."id" as "name" from fn-name-edges as l join names as r on l."child" = r."id";
let fn-name-token-edges = select l."fn" as "fn", l."file" as "file", l."span" as "span", l."part" as "part", r."child" as "token" from fn-name-nodes as l join "syntax-child" as r on l."name" = r."parent";
let methods = select l."fn" as "fn", r."text" as "method", l."file" as "file", l."span" as "span", l."part" as "part" from fn-name-token-edges as l join tree-tokens as r on l."token" = r."id";
let extra-rows = select * from methods where method != part;
let extra-projected = project(from=extra-rows, columns=["method", "file", "span", "part"]);
let extra = extend(from=extra-projected, values={"problem": "declares a method other than its own:"});
let own = select * from methods where method = part;
let trait-rows = select l."part" as "method", l."file" as "file", l."span" as "span", l."part" as "part" from traits as l join traits as r on l."id" = r."id";
let missing-rows = antijoin(left=trait-rows, right=own, left-on=["file"], right-on=["file"]);
let missing = extend(from=missing-rows, values={"problem": "declares no method named for it:"});
let receiver-edges = select l."fn" as "fn", r."child" as "child" from own as l join "syntax-child" as r on l."fn" = r."parent";
let param-lists = select * from tree-nodes where kind = "param-list";
let own-param-lists = select l."fn" as "fn", r."id" as "list" from receiver-edges as l join param-lists as r on l."child" = r."id";
let self-edges = select l."fn" as "fn", r."child" as "child" from own-param-lists as l join "syntax-child" as r on l."list" = r."parent";
let self-params = select * from tree-nodes where kind = "self-param";
let own-self-params = select l."fn" as "fn", r."id" as "receiver" from self-edges as l join self-params as r on l."child" = r."id";
let receiver-token-edges = select l."fn" as "fn", r."child" as "token" from own-self-params as l join "syntax-child" as r on l."receiver" = r."parent";
let ampersands = select * from tree-tokens where kind = "amp";
let by-reference = select l."fn" as "fn" from receiver-token-edges as l join ampersands as r on l."token" = r."id";
let mut-words = select * from tree-tokens where kind = "mut-kw";
let by-mutable = select l."fn" as "fn" from receiver-token-edges as l join mut-words as r on l."token" = r."id";
let shared-receivers = antijoin(left=by-reference, right=by-mutable, left-on=["fn"], right-on=["fn"]);
let unshared-rows = antijoin(left=own, right=shared-receivers, left-on=["fn"], right-on=["fn"]);
let unshared-projected = project(from=unshared-rows, columns=["method", "file", "span", "part"]);
let unshared = extend(from=unshared-projected, values={"problem": "declares a method that does not take `&self`:"});
let findings-a = union(left=extra, right=missing);
let findings = union(left=findings-a, right=unshared);
emit findings subject "file" key("span", "method");
'''

[diagnostic]
primary = "span"
message = "the trait of use case `{part}` {problem} `{method}`"
help = "Declare exactly one method in `interface.rs`, named for the use case and taking a shared reference: `fn {part}(&self,..)`. Move a second operation into a use case of its own, with its own part directory, trait, struct and test. An ignore is never the fix: the directory and the trait must agree."

[given]
include = ['src/inbound/use_cases/greet/interface.rs']
params = { kind = 'use-case' }

[[scenarios]]
id = 'trait-declares-one-method-named-use-case'
scenario = 'The trait declares the one method named for the use case, taking `&self`.'
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What the `greet` use case promises, in its own vocabulary.

/// What `greet` offers its callers.
pub trait GreetUseCase {
    /// Runs `greet`.
    fn greet(&self, name: &str) -> String;
}
'''

[[scenarios]]
id = 'lifetime-receiver'
scenario = 'The receiver may carry a lifetime.'
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What the `greet` use case promises, in its own vocabulary.

/// What `greet` offers its callers.
pub trait GreetUseCase {
    /// Runs `greet`.
    fn greet<'a>(&'a self, name: &'a str) -> &'a str;
}
'''

[[scenarios]]
id = 'no-trait'
scenario = "A file declaring no trait is interface-shape's."
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What the `greet` use case promises, in its own vocabulary.

/// The name a greeting is for.
pub type Name = String;
'''

[[scenarios]]
id = 'port-kind'
scenario = "A port's trait declares as many methods as the outside offers."
given.include = ['src/outbound/names/interface.rs']
given.params = { kind = 'port' }
given.files.'src/outbound/names/interface.rs' = '''
//! What the `names` port asks of the outside.

/// What every `names` adapter implements.
pub trait NamesPort {
    /// Loads the names.
    fn load(&self) -> Vec<String>;
    /// Saves the names.
    fn save(&self, names: &[String]);
}
'''

[[scenarios]]
id = 'two-use-cases'
scenario = 'Two use cases in one run are read apart, each against its own directory.'
given.include = ['src/inbound/use_cases/*/interface.rs']
given.files.'src/inbound/use_cases/farewell/interface.rs' = '''
