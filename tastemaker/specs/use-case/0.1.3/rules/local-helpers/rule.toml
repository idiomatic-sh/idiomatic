description = "Local use-case helpers are free functions visible at most to their own use case."
why = "Extracting private coordination does not require a new domain concept or injectable application service. A helper shares the use case dependencies and behavioral proof. Only SDK-facing contract helpers have a public implementation contract; its existing fixtures/contract.rs identifies that case."
query = '''

let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let declarations = select * from tree-nodes where glob_any(kind, "{struct,enum,union,type-alias,fn,const,static,trait,trait-alias}");
let declaration-parents = select l."id" as "id", l."kind" as "kind", r."parent" as "parent", l."file" as "file", l."span" as "span" from declarations as l join "syntax-child" as r on l."id" = r."child";
let modules = select * from tree-nodes where glob_any(kind, "{source-file,item-list}");
let module-declarations = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from declaration-parents as l join modules as r on l."parent" = r."id";
let declaration-children = select r."child" as "child", l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from module-declarations as l join "syntax-child" as r on l."id" = r."parent";
let visibilities = select * from tree-nodes where kind = "visibility";
let visible = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."child" as "visibility" from declaration-children as l join visibilities as r on l."child" = r."id";
let restrictions = select * from tree-nodes where kind = "visibility-inner";
let restriction-parents = select l."child" as "restriction", l."parent" as "visibility" from "syntax-child" as l join restrictions as r on l."child" = r."id";
let restriction-children = select r."child" as "node", l."visibility" as "visibility" from restriction-parents as l join "syntax-child" as r on l."restriction" = r."parent";
let paths = select * from tree-nodes where kind = "path";
let qualified-paths = select l."parent" as "id" from "syntax-child" as l join paths as r on l."child" = r."id";
let single-paths = antijoin(left=paths, right=qualified-paths, left-on=["id"], right-on=["id"]);
let restriction-paths = select l."node" as "node", l."visibility" as "visibility" from restriction-children as l join single-paths as r on l."node" = r."id";
let path-segments = select r."child" as "node", l."visibility" as "visibility" from restriction-paths as l join "syntax-child" as r on l."node" = r."parent";
let segment-names = select r."child" as "node", l."visibility" as "visibility" from path-segments as l join "syntax-child" as r on l."node" = r."parent";
let name-tokens = select r."child" as "token", l."visibility" as "visibility" from segment-names as l join "syntax-child" as r on l."node" = r."parent";
let local-keywords = select * from tree-tokens where glob_any(kind, "{self-kw,super-kw}");
let local-visibilities = select l."visibility" as "visibility" from name-tokens as l join local-keywords as r on l."token" = r."id";
let escaping = antijoin(left=visible, right=local-visibilities, left-on=["visibility"], right-on=["visibility"]);
let escaped-rows = project(from=escaping, columns=["file", "span"]);
let objects = select * from tree-nodes where glob_any(kind, "{struct,enum,union,trait,impl}");
let object-rows = project(from=objects, columns=["file", "span"]);
let candidates = union(left=escaped-rows, right=object-rows);
let helpers = capture(from=candidates, path="file", pattern="{*dir}/service.rs", captures=["dir"]);
let contracts = capture(from="filesystem.file", path="path", pattern="{*dir}/fixtures/contract.rs", captures=["dir"]);
let local-only = antijoin(left=helpers, right=contracts, left-on=["dir"], right-on=["dir"]);
emit local-only subject "file" key("span");
'''
[diagnostic]
primary = "span"
message = "a private use-case helper escapes its use case or declares a service object"
help = "Use private or pub(super) free functions; keep injected dependencies on the use case. Extract a cohesive application operation only when it earns its own responsibility."
[given]
include = ['src/inbound/use_cases/run/service.rs']
files.'src/inbound/use_cases/run/service.rs' = 'pub fn prepare(value: u32) -> u32 { value + 1 }'

[[scenarios]]
id = 'private-functions'
scenario = 'Private functions in a service are local helpers and are not reported.'
given.files.'src/inbound/use_cases/run/service.rs' = 'pub(super) fn prepare(value: u32) -> u32 { value + 1 }'

[[scenarios]]
id = 'public-function'
scenario = 'A public function in a service is reported.'
then.findings = [
  { path = 'src/inbound/use_cases/run/service.rs', line = 1 },
]

[[scenarios]]
id = 'independent-object'
scenario = 'An independent object in a service is reported.'
given.files.'src/inbound/use_cases/run/service.rs' = 'struct Service { value: u32 }'
then.findings = [
  { path = 'src/inbound/use_cases/run/service.rs', line = 1 },
]

[[scenarios]]
id = 'contract-helpers'
scenario = "Helpers beside a contract use case's test support are not reported."
given.include = ['src/inbound/use_cases/run/**']
given.files.'src/inbound/use_cases/run/fixtures/contract.rs' = 'pub const CASES: &[u32] = &[1];'
