description = "A concrete cohesive application operation; fill in its injected contracts and explicitly owned state."
why = "The operation owns its related structures and states invocation, worker or session lifetimes explicitly. It need not be shared or reusable. Ports are supplied at construction; domain functions are called directly. Use cases may call application, domain and outbound directly and own workflow/publication."
content = '''
//! The `{{ part }}` application operation.
{% if scaffold | default(false) %}
// Add the cohesive operation, its injected outbound contracts and related structures.
// State which state is invocation-local, worker-owned or retained for a bounded session.
// Do not construct adapters, call sibling services, or publish a completed pipeline here.
{% endif %}
'''
[params]
part = { type = "identifier", from = "directory-name", description = "The operation name." }

[given]
file = 'service.rs'
params = { part = 'short' }

[[scenarios]]
id = 'service-file-names-its-operation'
scenario = 'The service file of an operation says which operation it holds.'
given.files.'service.rs' = '''
//! The `short` application operation.
'''

[[scenarios]]
id = 'service-file-missing'
scenario = 'An operation without a service file is reported.'
then.findings = [
  { rule = 'service#count', path = '.' },
]
