description = "An optional cohesive application operation over injected outbound contracts and pure domain functions."
why = "Use cases assemble the workflow and own final publication. A concrete application service owns one reusable operation, receives its ports at construction, and calls domain functions directly. It neither constructs adapters nor calls another application service or use case. Supporting types are added only when needed; no interface, factory, generic runtime or storage backend is required. Simple use cases need no application service. Behavioral cases prove that substituted ports affect results and required failures prevent publication; syntax alone cannot prove those semantics."
templates = [
  { template = "service", file = "service.rs", description = "One concrete operation holding injected ports and explicitly owned invocation state." },
  { template = "service-test", file = "service_test.rs", description = "Behavioral cases using injected fakes, including substitution and failures where applicable." },
  { template = "idiomatic.arch/types@0.1.0", file = "types.rs", count = { min = 0 }, params = { kind = "concept" }, description = "Only data owned by this operation, not copies of existing domain values." },
  { template = "idiomatic.arch/errors@0.1.0", file = "errors.rs", count = { min = 0 }, params = { kind = "concept" }, description = "Failures owned by this operation." },
  { template = "idiomatic.arch/constants@0.1.0", file = "constants.rs", count = { min = 0 }, description = "Constants of this operation." },
  { template = "fixtures", file = "fixtures.rs", count = { min = 0 }, description = "Behavioral test support under the fixtures gate." },
]
rules = [
  { rule = "idiomatic.arch/no-vacuous-tests@0.1.0", include = ["*_test.rs"], description = "Proofs execute a real subject over nonempty cases." },
  { rule = "idiomatic.arch/no-inherent-impls@0.1.0", include = ["types.rs"], description = "A part's types.rs is its data and its trait impls: no `impl Type { }` block." },
  { rule = "idiomatic.arch/hollow-types@0.1.0", include = ["types.rs"], description = "A part's types.rs declares at least one type." },
  { rule = "idiomatic.arch/public-fields@0.1.0", include = ["types.rs"], description = "Every field of a struct in a types.rs is public: a type is its data." },
  { rule = "idiomatic.arch/no-domain-aliases@0.1.0", include = ["types.rs", "errors.rs"], description = "A part's types and errors are nominal types, never type aliases." },
  { rule = "idiomatic.arch/error-name@0.1.0", include = ["errors.rs"], description = "A part's errors.rs, and the errors.rs of a collection below it, declares exactly one enum named <Name>Error and no other type." },
  { rule = "idiomatic.arch/unit-cases@0.1.0", include = ["*.rs"], description = "A part's test has a `succeeds` row, and a `refuses` row where its errors.rs has a variant of its own." },
  { rule = "idiomatic.arch/proof-beside@0.1.0", include = ["*.rs"], description = "A schemas test exists exactly beside the schemas it proves: schemas_test.rs beside schemas.rs." },
  { rule = "idiomatic.arch/hollow-artifacts@0.1.0", include = ["*.rs"], description = "No file of a part is only comments and imports, and no type in it is an empty placeholder." },
  { rule = "idiomatic.arch/validation-at-edges@0.1.0", include = ["*.rs"], exclude = ["schemas.rs", "*_test.rs"], description = "A `TryFrom`, an `impl FromStr` or a fallible constructor is written only in a schemas.rs." },
  { rule = "idiomatic.arch/no-runtime-fixtures@0.1.0", include = ["*.rs"], exclude = ["*_test.rs", "fixtures.rs"], description = "Nothing in a part but its tests and its fixtures reads a `fixtures` module." },
  { rule = "idiomatic.arch/factory-calls@0.1.0", include = ["*.rs"], exclude = ["composition.rs", "fixtures.rs", "*_test.rs"], description = "Only an edge's composition (and the part's fixtures and tests) names a `factory` module: only an edge builds an adapter." },
  { rule = "idiomatic.arch/test-shape@0.1.0", include = ["*_test.rs"], description = "Every test of a part is a runner named for a case word over a `CASES` table." },
  { rule = "idiomatic.arch/test-runners-match-rows@0.1.0", include = ["*_test.rs"], description = "A test file has a runner `run(CASES, Word::<word>, subject)` exactly for each case word its `CASES` table has rows of." },
  { rule = "idiomatic.arch/case-expectation@0.1.0", include = ["*_test.rs"], description = "A row of a part's table expects a value or an error variant, never any success." },
]

[given]
at = 'src/short'
files.'src/short/service.rs' = '''
//! The `short` application operation.

/// The operation, holding the ports it is given.
pub struct ShortService {
    /// The store it reads.
    pub store: u8,
}
'''

[[scenarios]]
id = 'service-and-test-of-an-operation'
scenario = 'An application operation with its service and its test has no finding.'
given.files.'src/short/service_test.rs' = '''
//! Behavioral proof of `short` through its injected ports.

use crate::cases::{Case, Expect, Word, run};

const CASES: &[Case<u8, u8, Failure>] = &[
    Case { name: "one stays one", word: Word::Succeeds, input: one, expect: Expect::Value(1) },
];

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}
'''

[[scenarios]]
id = 'service-without-test'
scenario = 'An application operation without its behavioral test is reported.'
then.findings = [
  { rule = 'application-service/service-test#count', path = 'src/short' },
]
