description = "Test support for an application operation."
why = "Tests share meaningful inputs and port fakes here; production code never reads fixtures."
content = "//! Test support for `{{ part }}`.\n"
[params]
part = { type = "identifier", from = "directory-name", description = "The operation name." }

[given]
file = 'fixtures.rs'
params = { part = 'short' }

[[scenarios]]
id = 'fixtures-file-names-its-operation'
scenario = 'The test support file of an operation says which operation it supports.'
given.files.'fixtures.rs' = '''
//! Test support for `short`.
'''

[[scenarios]]
id = 'fixtures-file-missing'
scenario = 'A fixtures file the operation places and the project lacks is reported.'
then.findings = [
  { rule = 'fixtures#count', path = '.' },
]
