description = "One concept of the SDK's own domain: its module, declaring its types and, when it has them, its errors."
why = "A concept of the SDK's domain is a module like a concept of a core's, so its values are found by the file's name: `types.rs` for its values and `errors.rs` for its failures, each declared by the concept's module. The template is open: it asks that the file exist and declare what the concept holds."
content = '''
//! The SDK's `{{ concept }}` concept.
{%- if present["domain-errors"] | default(false) %}

pub(crate) mod errors;
{%- endif %}
{%- if present["domain-types"] | default(false) %}

pub(crate) mod types;
{%- endif %}
'''

[params]
concept = { type = "identifier", description = "The concept, captured from its path." }

[given]
file = 'sdk/src/domain/relation.rs'
params = { concept = 'relation' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'sdk/src/domain/relation.rs' = '''
//! The SDK's `relation` concept.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'sdk/src/domain/relation.rs' = '''
//! The SDK's `relation` concept.

pub(crate) mod types;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'domain-concept#count', path = '.' },
]
