description = "A product's SDK crate, applied beside its `crate` entry: the resources and verbs a user of the product calls, mirroring the command line. It places `src/resources.rs`, which lists the resources, `src/resources/<resource>.rs`, which declares the verbs of the resource and exposes the types and traits they use, and the `entry` spec's parts at `src/resources/<resource>/<verb>/`, so the product's `tastemaker.toml` names only the crate and this spec. There is no extension_points.rs and no vocabulary.rs: a type is defined once in the core and exposed by each resource that uses it, and a port a resource module re-exports is an extension point (`extension-point-ports`)."
why = "Keeps a product's SDK an edge like its command line: one public function per resource and entry, each opening its own stores, checking its request in its schemas, composing its own service and calling it once, so a user states only what they choose and names no internal crate. The function is placed by the `entry` spec, apart from the command line's command; this spec holds what lists the functions and what they share, so every function is reachable from one root and nothing composes at the crate's top."
specs = [
  { spec = "idiomatic.arch/entry@0.1.0", include = ["src/resources/{resource}/{entry}"], exclude = ["src/resources/*/macros"], count = { min = 0 }, description = "The SDK's functions, one part each." },
]
templates = [
  { template = "entries", file = "src/resources.rs", description = "The list of the SDK's resources, one public module each." },
  { template = "resource", file = "src/resources/{resource}.rs", params = { reexports = { param = "reexports" } }, description = "One resource of the SDK, declaring a module per verb and exposing the types and traits its verbs use." },
  # A resource that re-exports traits for implementations to run has their contract beside it, compiled only under the `fixtures` feature.
  { template = "contract", file = "src/resources/{resource}/contract.rs", count = { min = 0 }, description = "One resource's contract, when it has one: what an implementation of the resource's re-exported traits runs." },
  # A resource that has a type of its own, or macros for the programs that use it, keeps them in these files and its module declares them; they are not entries.
  { template = "resource-types", file = "src/resources/{resource}/types.rs", count = { min = 0 }, description = "One resource's own types, when it has any: the module declares them `mod types;`." },
  { template = "resource-macros", file = "src/resources/{resource}/macros.rs", count = { min = 0 }, description = "One resource's macros module, when it exports macros: the module declares it `mod macros;`." },
  { template = "resource-macro", file = "src/resources/{resource}/macros/{macro}.rs", count = { min = 0 }, description = "One concern of a resource's macros, a file below its `macros/` directory." },
  { template = "entry-module", file = "src/resources/{resource}/{entry}.rs", description = "One function's module file, declaring the members every function has; the function's directory is a part." },
  # A value more than one function shares sits below them, in the SDK's own domain, one concept to a module: a function imports it from `crate::domain`, never from a sibling function or from its resource, and its resource module exposes it.
  { template = "domain", file = "src/domain.rs", count = { min = 0 }, description = "The SDK's own domain, when it has one: one module per concept whose values more than one function shares." },
  { template = "domain-concept", file = "src/domain/{concept}.rs", count = { min = 0 }, description = "One concept of the SDK's own domain: its module, declaring its types and its errors." },
  { template = "domain-types", file = "src/domain/{concept}/types.rs", count = { min = 0 }, description = "The values of one concept of the SDK's own domain: the SDK's one edge copy of each." },
  { template = "domain-errors", file = "src/domain/{concept}/errors.rs", count = { min = 0 }, description = "The failures of one concept of the SDK's own domain, when more than one function hands them back." },
]
rules = [
  { rule = "no-root-composition", include = ["src/composition.rs"], description = "The SDK has no crate-wide composition: each function composes its own service." },
  # Validation exists only where the shape of the data is not ours: a function's schemas.rs, which the `entry` spec checks.
  { rule = "idiomatic.arch/validation-at-edges@0.1.0", include = ["src/**"], exclude = ["src/resources/*/*/**", "**/*_test.rs"], description = "A `TryFrom`, an `impl FromStr` or a fallible constructor appears in no file of the SDK's own: it belongs to a function's schemas.rs, which the `entry` spec checks." },
  # Only a function's composition.rs (the `entry` spec's, with its tests and benches) calls a factory; no fixture runs in production.
  { rule = "idiomatic.arch/factory-calls@0.1.0", include = ["src/**"], exclude = ["src/resources/*/*/**", "**/*_test.rs"], description = "No file of the SDK's own (the resources' module files) names a `factory` module: only a function's composition calls a hex's factory." },
  { rule = "idiomatic.arch/no-runtime-fixtures@0.1.0", include = ["src/**"], exclude = ["src/resources/*/*/**", "**/*_test.rs", "src/resources/*/contract.rs"], description = "No file of the SDK's own outside its tests names a `fixtures` module." },
  # The SDK's one re-export allowance is its resource modules, which expose the types and traits their verbs use; its root is its surface.
  { rule = "idiomatic.arch/no-reexports@0.4.0", include = ["src/**"], exclude = ["src/resources/*/*/**", "src/lib.rs", "src/resources.rs", "src/resources/*.rs", "src/resources/*/contract.rs", "src/resources/*/macros/*.rs"], description = "Outside its root, its resource modules, the contracts of its resources and the macros its resource modules call, nothing in the SDK re-exports another module's items: a resource's macro writes its `pub use` in the resource module that calls it, and names itself to that module with a `use`." },
  { rule = "idiomatic.arch/hollow-artifacts@0.1.0", include = ["src/**"], exclude = ["src/resources/*/*/**"], description = "No file of the SDK's own is only comments and imports, and no type in it is an empty placeholder." },
  { rule = "idiomatic.arch/list-matches-source@0.1.0", include = ["src/resources/*.rs"], params = { reexports = { param = "reexports" } }, description = "The `reexports` list and the resource modules' `pub use` lines of other crates' items are the same items." },
  { rule = "verb-resolves", include = ["src/resources/**"], description = "Every verb of a resource is a function a user can call at `<resource>::<verb>`." },
]

[params]
reexports = { type = "list<table>", description = "The items an SDK resource module re-exports from the crates it exposes, each `{ resource, path, as }`: the resource whose module writes `pub use <path> as <as>;` (the `as` clause only when it differs from the path's last segment). Required, so each product states it; `[]` when no resource re-exports." }

