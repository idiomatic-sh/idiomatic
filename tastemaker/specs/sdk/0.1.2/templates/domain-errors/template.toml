description = "The failures of one concept of the SDK's own domain, when more than one function hands them back, with nothing else asked."
why = "A failure more than one function of the SDK hands its caller (why a query is not correct, which validating it answers and a lint's rule carries) is declared once, in its concept's `errors.rs`, beside the values it names. The template is open: it asks that the file exist and states its role, and the errors are its author's."
content = '''
//! The errors of the `{{ concept }}` concept.
'''

[params]
concept = { type = "identifier", description = "The concept, captured from its path." }

[given]
file = 'sdk/src/domain/query/errors.rs'
params = { concept = 'query' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'sdk/src/domain/query/errors.rs' = '''
//! The errors of the `query` concept.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'sdk/src/domain/query/errors.rs' = '''
//! The errors of the `query` concept.

/// Why a query is not correct.
pub enum ValidateError {
    /// The text is not RyoQL.
    Syntax,
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'domain-errors#count', path = '.' },
]
