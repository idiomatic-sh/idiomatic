// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'sdk/src/resources/greeting/show.rs'
given.params = { resource = 'greeting', entry = 'show' }
then.findings = [
  { rule = 'entry-module#count', path = '.' },
]

