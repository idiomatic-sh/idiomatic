description = "A resource's module: one module per function a user calls on it."
why = "Declares a resource's functions, so `<resource>::<entry>` resolves the same way for every resource of the SDK. The functions are the entry parts the product places beneath the resource, so a function that exists is declared, and none that does not."
content = '''
//! `{{ resource }}`: one module per entry.
{% for part in instances.entry | default([]) %}
{%- if part.resource == resource %}
pub mod {{ part.name }};
{%- endif %}
{%- endfor %}
{%- if present["resource-types"] | default(false) %}

mod types;
{%- endif %}
{%- if present["resource-macros"] | default(false) %}

mod macros;
{%- endif %}
{%- if present.contract | default(false) %}

#[cfg(feature = "fixtures")]
pub mod contract;
{%- endif %}
{%- for item in reexports | default([]) %}
{%- if item.resource == resource %}

pub use {{ item.path }}{% if item.as != item.path.split("::")[-1] %} as {{ item["as"] }}{% endif %};
{%- endif %}
{%- endfor %}
'''
match = "declarations"

[params]
resource = { type = "identifier", description = "The resource, captured from its path." }
reexports = { type = "list<table>", description = "The re-exports of every resource, each `{ resource, path, as }`; this resource writes those whose `resource` is its own." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'sdk/src/resources/greeting.rs'
given.params = { resource = 'greeting', reexports = [] }
given.files.'sdk/src/resources/greeting.rs' = '''
//! `greeting`: one module per entry.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may not carry more than its template.'
given.file = 'sdk/src/resources/greeting.rs'
given.params = { resource = 'greeting', reexports = [] }
given.files.'sdk/src/resources/greeting.rs' = '''
//! `greeting`: one module per entry.

pub mod show;

// More.
'''
then.findings = [
  { rule = 'resource#template', path = 'sdk/src/resources/greeting.rs' },
]

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'sdk/src/resources/greeting.rs'
given.params = { resource = 'greeting', reexports = [] }
then.findings = [
  { rule = 'resource#count', path = '.' },
]

[[scenarios]]
id = 'resource-re-exports-what-product-s-reexports'
scenario = "A resource re-exports what the product's reexports list gives it."
given.file = 'sdk/src/resources/greeting.rs'
given.params = { resource = 'greeting', reexports = [{ resource = 'greeting', path = 'demo_core::greeting::GreetUseCase', as = 'Greet' }, { resource = 'greeting', path = 'demo_core::greeting::GreetRequest', as = 'GreetRequest' }, { resource = 'other', path = 'demo_core::other::Other', as = 'Other' }] }
given.files.'sdk/src/resources/greeting.rs' = '''
//! `greeting`: one module per entry.

pub use demo_core::greeting::GreetRequest;
pub use demo_core::greeting::GreetUseCase as Greet;
'''
