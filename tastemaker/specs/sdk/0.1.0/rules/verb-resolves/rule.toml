description = "Every verb of a resource is a callable function at `<resource>::<verb>`: the resource module re-exports a function named for the verb, and the verb's `entry.rs` defines it."
why = "The SDK is called as `ryo::query::validate(..)`, one name per verb. A verb whose directory exists but whose function the resource module does not re-export is a path that resolves to a module (`query::validate` is the module, not the call), and the user finds out when it does not compile; a verb whose `entry.rs` defines nothing of its name is a promise the module cannot keep. Found from the files `<sdk>/src/resources/<resource>/<verb>/entry.rs`: the resource module `<sdk>/src/resources/<resource>.rs` must hold a `use` that binds the name `<verb>`, and `entry.rs` must declare a function of that name. Not seen: that the bound name is the verb's own function (a `use other::thing as run` also binds `run`)."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let files = project(from=listed-files, columns=["file"]);
let verbs = capture(from=files, path="file", pattern="{*root}/src/resources/{resource}/{verb}/entry.rs", captures=["root", "resource", "verb"]);
let imports = select * from "static-import" where binding != "";
let resource-imports = capture(from=imports, path="file", pattern="{*root}/src/resources/{resource}.rs", captures=["root", "resource"]);
let functions = select * from "function" where name != "";
let verb-functions = capture(from=functions, path="file", pattern="{*root}/src/resources/{resource}/{verb}/entry.rs", captures=["root", "resource", "verb"]);
let declared = select l."file" as "file" from verbs as l join resource-imports as r on l."root" = r."root" and l."resource" = r."resource" and l."verb" = r."binding";
let defined = select l."file" as "file" from verbs as l join verb-functions as r on l."file" = r."file" and l."verb" = r."name";
let unresolved = antijoin(left=verbs, right=declared, left-on=["file"], right-on=["file"]);
let undefined = antijoin(left=verbs, right=defined, left-on=["file"], right-on=["file"]);
let unresolved-paths = project(from=unresolved, columns=["file"]);
let undefined-paths = project(from=undefined, columns=["file"]);
let found = union(left=unresolved-paths, right=undefined-paths);
emit found subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "this verb is not a callable function at `<resource>::<verb>`"
help = "Define `pub fn <verb>` in this `entry.rs` and write `pub use <verb>::entry::<verb>;` in the resource module beside it, so `<resource>::<verb>(..)` is the call."

[given]
include = ['**/*.rs']
files.'demo/src/resources/query.rs' = '''
//! `query`.

pub(crate) mod run;

pub use run::entry::run;
'''
files.'demo/src/resources/query/run/entry.rs' = '''
//! The verb.

pub fn run() {}
'''

[[scenarios]]
id = 'verb-function-re-exported'
scenario = 'A verb with its function re-exported.'

[[scenarios]]
id = 'not-reexported'
scenario = 'A verb whose function the resource module does not re-export.'
given.files.'demo/src/resources/query.rs' = '''
//! `query`.

pub mod run;
'''
then.findings = [
  { path = 'demo/src/resources/query/run/entry.rs' },
]

[[scenarios]]
id = 'no-function'
scenario = 'A verb whose entry defines no function of its name.'
given.files.'demo/src/resources/query/run/entry.rs' = '''
//! The verb.

pub fn walk() {}
'''
then.findings = [
  { path = 'demo/src/resources/query/run/entry.rs' },
]
