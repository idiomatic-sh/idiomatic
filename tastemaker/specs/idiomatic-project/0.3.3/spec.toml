description = "The rules every product of the monorepo is held to whatever language it is written in: the length of a file, the names of directories, the product's Cargo workspace, and the formats of its data."
why = "A product reads these as one policy, not as a list it copies from another product: the set is placed once, so a rule added here reaches every product that places the spec and two products cannot drift apart. It has no template, so it owns nothing and its rules reach every file beneath its place, the files of the parts placed inside it too."
closed = false
rules = [
  { rule = "idiomatic.arch/dependency-feature-sprawl@0.1.0", include = ["**/Cargo.toml"], exclude = ["**/tests/fixtures/**"], params = { max-features = 4 }, description = "A dependency enables at most four features and never a `*` version." },
  { rule = "idiomatic.arch/crate-dependency-cycles@0.1.0", include = ["**/Cargo.toml"], exclude = ["**/tests/fixtures/**"], params = { kinds = ["normal", "dev", "build"] }, description = "No local package is on a cycle of path dependencies, dev-dependencies included: a test through the cycle links a second copy." },
  { rule = "idiomatic.arch/crate-dependency-depth@0.1.0", include = ["**/Cargo.toml"], exclude = ["**/tests/fixtures/**"], params = { max-reach = 14, kinds = ["normal", "build"], optional = false }, description = "A package reaches at most fourteen local packages through its dependencies that a build naming no feature links. The command line links its languages by feature, one optional dependency for each, and those are not counted; its other dependencies are." },
  { rule = "idiomatic.arch/file-length@0.3.0", include = ["**"], exclude = ["**/Cargo.lock", "**/tastemaker.lock", "**/.asymptote/**", "**/tests/fixtures/**", "**/api.txt", "**/benchmarks/linters/*/**/*.json", "**/benchmarks/linters/*/**/*.jsonl", "**/benchmarks/linters/*/**/*.toml", "**/benchmarks/linters/*/**/*.ryoql", "**/benchmarks/linters/*/**/*.txt", "**/benchmarks/linters/*/**/*.md", "**/benchmarks/linters/*/profiles/*/evidence/oracle.json", "**/benchmarks/linters/*/results/*/oracle.json", "**/benchmarks/linters/*/results/*/*/oracle.json", "**/benchmarks/linters/*/results/*/tool-contract-proof/*/source-manifest.json"], params = { max-lines = 400 }, description = "Authored source has a line budget; captured benchmark data of a linter (its json, toml, ryoql, text and markdown beneath benchmarks/linters) is hash-bound by the preparation manifest and owned by evidence roles, so the budget holds for source." },
  { rule = "idiomatic.arch/catch-all-names@0.1.0", include = ["**"], description = "No directory or file of the product is a catch-all named `common`, `utils`, `shared` or `helpers`." },
  { rule = "idiomatic.arch/no-registry-renames@0.1.0", include = ["Cargo.toml"], description = "The workspace names every registry dependency by its package, so a crate that inherits a dependency names the crate it compiles against." },
  { rule = "idiomatic.arch/workspace-membership@0.1.0", include = ["**"], description = "Every member of the product's Cargo workspace lies inside the product." },
  { rule = "idiomatic.arch/workspace-completeness@0.1.0", include = ["**"], description = "Every crate the product places is a member of its Cargo workspace." },
  { rule = "no-tsv", include = ["**"], description = "No file of the product is a tab-separated table: expected data is typed Rust, recorded data is TOML." },
  { rule = "idiomatic.arch/no-machine-paths-shipped@0.1.0", include = ["**"], exclude = ["**/tests/**", "**/benches/**", "**/*_test.rs", "**/fixtures/**", "**/fixtures.rs", "**/.asymptote/**", "**/tastemaker.lock", "**/Cargo.lock"], description = "No file the product ships names a path of one machine: none under /workspaces, /tmp, /home or /Users." },
  { rule = "idiomatic.arch/readme-blocks-executed@0.2.0", include = ["README.md", "cli/tests/readme.rs"], description = "The product README's `console` blocks are run by its README test." },
  { rule = "idiomatic.arch/manifest-placements@0.1.0", include = ["**/tastemaker.toml"], exclude = ["**/tests/fixtures/**", "examples/**"], params = { config-roles = ["idiomatic.arch/asymptote-workspace", "idiomatic.arch/asymptote-config", "idiomatic.arch/asymptote-lock", "idiomatic.arch/tastemaker-lock", "idiomatic.arch/cargo-config", "idiomatic.arch/cargo-workspace", "idiomatic.arch/cargo-lock", "idiomatic.arch/clippy-config", "idiomatic.arch/deny-config", "idiomatic.arch/mutants-config", "idiomatic.arch/nextest-config", "idiomatic.arch/product-readme", "idiomatic.arch/public-api", "idiomatic.arch/build-script", "idiomatic.arch/compile-fail", "idiomatic.arch/ui-case", "idiomatic.arch/ui-stderr", "idiomatic.arch/ui-pass", "idiomatic.arch/doc-page", "idiomatic.arch/allocation-test", "idiomatic.arch/lint-allocation-test", "idiomatic.arch/lint-call-count-test", "idiomatic.ryo/provider-allowances"], manifest-roles = ["idiomatic.ryo/language-tastemaker", "idiomatic.ryo/provider-allowances"], open-manifest-roles = ["idiomatic.ryo/language-tastemaker"], source-extensions = ["rs", "py", "ts", "js", "go"] }, description = "A manifest places files by role patterns: no one-file placement but a config role, and only the workspace manifest, or a manifest a role places, holds entries or opens its directory. The manifests a test reads as input and Tastemaker's examples are not the product's." },
  { rule = "idiomatic.arch/manifest-excludes@0.1.0", include = ["**/tastemaker.toml"], exclude = ["**/tests/fixtures/**", "examples/**"], params = { role-globs = [{ glob = "**/*_test.rs" }, { glob = "**/*_test/**" }, { glob = "**/test.rs" }, { glob = "**/tests.rs" }, { glob = "**/tests/**" }, { glob = "**/tests/bdd.rs" }, { glob = "**/tests/allocation.rs" }, { glob = "**/acceptance.rs" }, { glob = "**/fixtures/**" }, { glob = "**/fixtures.rs" }, { glob = "**/factory.rs" }, { glob = "**/composition.rs" }, { glob = "**/benches/**" }], edge-composition-roles = [{ glob = "cli/Cargo.toml" }, { glob = "cli/build.rs" }, { glob = "cli/src/**" }, { glob = "**/benchmarks/provider/**" }], generated-roles = [{ glob = "**/src/languages.rs" }, { glob = "**/src/tastemaker.toml" }], input-roots = [{ glob = "**/tests/fixtures/**" }], allowlist-keys = [{ definition = "idiomatic.arch/idiomatic-rust", key = "allowed-paths" }, { definition = "idiomatic.arch/idiomatic-rust", key = "heap-accounting-owners" }, { definition = "idiomatic.arch/idiomatic-rust", key = "test-contracts" }, { definition = "idiomatic.ryo/derived-view-acquisition", key = "allowed" }, { definition = "idiomatic.arch/collection-members", key = "except" }], key-roles = [{ key = "heap-accounting-owners", glob = "**/accounting/**" }], rule-roles = [], public-roots = ["ryo::", "ryo_sdk::"] }, description = "A manifest excludes and allows files only by role: tests, fixtures, adapters, edges, generated files and test inputs, a heap-accounting owner by its `accounting` concept, and a test contract only on the product's public API." },
  { rule = "idiomatic.arch/no-tracker-text-shipped@0.1.0", include = ["**"], exclude = ["**/tests/fixtures/**", "**/.asymptote/**", "**/benchmarks/linters/*/results/*/tool-contract-proof/*/stage-manifest.json"], params = { patterns = ["*ryo-[a-z0-9][a-z0-9][a-z0-9].[0-9]*", "*ryo-[a-z0-9][a-z0-9][a-z0-9][a-z0-9].[0-9]*", "*ryo-[0-9][a-z0-9][a-z0-9][!a-z0-9]*", "*ryo-[a-z][0-9][a-z0-9][!a-z0-9]*", "*ryo-[a-z][a-z][0-9][!a-z0-9]*", "*ryo-[0-9][a-z0-9][a-z0-9][a-z0-9][!a-z0-9]*", "*ryo-[a-z][0-9][a-z0-9][a-z0-9][!a-z0-9]*", "*ryo-[a-z][a-z][0-9][a-z0-9][!a-z0-9]*", "*ryo-[a-z][a-z][a-z][0-9][!a-z0-9]*", "*ryo-[0-9][a-z0-9][a-z0-9]", "*ryo-[a-z][0-9][a-z0-9]", "*ryo-[a-z][a-z][0-9]", "*ryo-[0-9][a-z0-9][a-z0-9][a-z0-9]", "*ryo-[a-z][0-9][a-z0-9][a-z0-9]", "*ryo-[a-z][a-z][0-9][a-z0-9]", "*ryo-[a-z][a-z][a-z][0-9]", "*(ryo-[a-z][a-z][a-z][!a-z0-9-]*", "*(ryo-[a-z][a-z][a-z][a-z][!a-z0-9-]*", "*[Bb]ead[ _:-]ryo-[a-z]*", "*[Bb]eads[ _:-]ryo-[a-z]*", "*[Bb]ead: ryo-[a-z]*", "*(owner 20*", "*owner 20[0-9][0-9]-*", "*[Tt]he owner's figure*", "*[Tt]he owner's number*", "*[Tt]he owner's call*", "*[Tt]he owner's choice*", "*[Tt]he owner's ruling*", "*[Tt]he owner's word*", "*[Tt]he owner's request*", "*[Tt]he owner's budget*", "*[Tt]he owner's target*", "*[Tt]he owner's bar*", "*[Oo]wner's decision*", "*[Tt]he spike", "*[Tt]he spike[!a-z]*", "*[Tt]he devcontainer*", "*[Aa]n agent*"] }, description = "No shipped text names the work that made it: no issue id of the tracker (`ryo-` and a short id with a digit or a child number, or any short id in parentheses or after \"bead\") no dated attribution (`(owner 2026-10-27)`) and no process phrase (\"the owner's figure\", \"owner's decision\", \"the spike\", \"the devcontainer\", \"an agent\")." },
