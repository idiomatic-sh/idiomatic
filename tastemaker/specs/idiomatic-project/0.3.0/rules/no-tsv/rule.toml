description = "No file of the product is a tab-separated table: expected data is typed Rust, recorded data is TOML."
why = "A table of tab-separated text is a second format whose cells are untyped, whose columns are read by position and whose escaping is ours to keep. Hand-written expected data is a typed Rust value the compiler checks; data a tool records is TOML, which every tool reads. A `.tsv` file is a finding wherever it stands."

query = '''
let files = capture(from="filesystem.file", path="path", pattern="{*dir}/{name}.tsv", captures=["dir", "name"]);
let root-files = capture(from="filesystem.file", path="path", pattern="{name}.tsv", captures=["name"]);
let nested = project(from=files, columns=["path"]);
let top = project(from=root-files, columns=["path"]);
let found = union(left=nested, right=top);
emit found subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "`{path}` is a tab-separated table"
help = "Write hand-made expected data as a typed Rust value in the test that reads it (a `const` of the real types), and data a tool records as TOML; then delete the `.tsv` file."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
pub fn run() {}
'''

[[scenarios]]
id = 'tsv-file-directory'
scenario = 'A .tsv file in a directory.'
given.files.'tests/fixtures/rows.tsv' = '''
a	b
'''
then.findings = [
  { path = 'tests/fixtures/rows.tsv' },
]

[[scenarios]]
id = 'tsv-file-root'
scenario = 'A .tsv file at the root.'
given.files.'data.tsv' = '''
a	b
'''
then.findings = [
  { path = 'data.tsv' },
]

[[scenarios]]
id = 'toml-data-fine'
scenario = 'TOML data is fine.'
given.files.'tests/fixtures/rows.toml' = '''
a = 1
'''
