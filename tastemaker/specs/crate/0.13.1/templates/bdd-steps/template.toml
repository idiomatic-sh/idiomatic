description = "The steps of one use case's feature: cucumber expressions over the world, declared by the runner."
why = "Holds the step definitions of one feature in its own module (one steps file per feature), so a reader finds the steps of `tests/<use_case>.feature` in `tests/bdd/<use_case>.rs`, and the runner `tests/bdd.rs` declares each once with `#[path]` and owns the world they share."
content = '''
//! The steps of the `{{ feature }}` feature: each a cucumber expression over the world, one to six lines, asserting the part's own results.
'''

[params]
feature = { type = "identifier", description = "The use case the steps belong to, captured from its file name." }

[given]
file = 'app/src/inbound/use_cases/greet/acceptance.rs'
params = { feature = 'greet' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'app/src/inbound/use_cases/greet/acceptance.rs' = '''
//! The steps of the `greet` feature: each a cucumber expression over the world, one to six lines, asserting the part's own results.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'app/src/inbound/use_cases/greet/acceptance.rs' = '''
//! The steps of the `greet` feature: each a cucumber expression over the world, one to six lines, asserting the part's own results.

use cucumber::given;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'bdd-steps#count', path = '.' },
]
