description = "An error type is a `thiserror` derive: no hand-written `impl Error for T`, and no hand-written `impl Display for T` where `T` is an error (a type with a hand-written `Error` impl, or a `thiserror` derive, in the same file)."
why = "`thiserror` keeps each message beside its variant and each cause typed and reachable through `source()`; a hand-written impl is where messages drift from variants and causes get flattened into text. Matched by name: a trait whose last path segment is `Error` or `Display`, and an implementing type named by its last path segment in the same file."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let impls = select * from tree-nodes where kind = "impl";
let for-keywords = select * from tree-tokens where kind = "for-kw";
let for-edges = select l."ordinal" as "keyword", l."parent" as "parent" from "syntax-child" as l join for-keywords as r on l."child" = r."id";
let trait-impls = select l."id" as "impl", r."keyword" as "keyword", l."file" as "file", l."span" as "span" from impls as l join for-edges as r on l."id" = r."parent";
let impl-type-edges = select r."child" as "child", l."impl" as "impl", l."keyword" as "keyword", r."ordinal" as "ordinal", l."file" as "file", l."span" as "span" from trait-impls as l join "syntax-child" as r on l."impl" = r."parent";
let identifiers = select * from tree-tokens where kind = "ident";
let name-ref-texts = select l."parent" as "parent", r."text" as "text" from "syntax-child" as l join identifiers as r on l."child" = r."id";
let name-refs = select * from tree-nodes where kind = "name-ref";
let name-ref-words = select l."parent" as "name-ref", l."text" as "text" from name-ref-texts as l join name-refs as r on l."parent" = r."id";
let segment-edges = select l."parent" as "parent", r."text" as "text" from "syntax-child" as l join name-ref-words as r on l."child" = r."name-ref";
let segments = select * from tree-nodes where kind = "path-segment";
let segment-words = select l."parent" as "segment", l."text" as "text" from segment-edges as l join segments as r on l."parent" = r."id";
let path-edges = select l."parent" as "parent", r."text" as "text" from "syntax-child" as l join segment-words as r on l."child" = r."segment";
let paths = select * from tree-nodes where kind = "path";
let path-words = select l."parent" as "path-node", l."text" as "text" from path-edges as l join paths as r on l."parent" = r."id";
let type-edges = select l."parent" as "parent", r."text" as "text" from "syntax-child" as l join path-words as r on l."child" = r."path-node";
let path-types = select * from tree-nodes where kind = "path-type";
let type-words = select l."parent" as "path-type", l."text" as "text" from type-edges as l join path-types as r on l."parent" = r."id";
let impl-types = select l."impl" as "impl", l."keyword" as "keyword", l."ordinal" as "ordinal", l."file" as "file", l."span" as "span", r."text" as "text" from impl-type-edges as l join type-words as r on l."child" = r."path-type";
let impl-traits = select * from impl-types where ordinal < keyword;
let error-contracts = select * from impl-traits where text = "Error";
let error-impl-findings = project(from=error-contracts, columns=["file", "span"]);
let error-impl-messages = extend(from=error-impl-findings, values={"finding": "hand-written `std::error::Error` impl; derive `thiserror::Error` in errors.rs"});
let impl-selves = select * from impl-types where ordinal > keyword;
let implemented = select l."text" as "contract", r."text" as "name", l."file" as "file", l."span" as "span" from impl-traits as l join impl-selves as r on l."impl" = r."impl";
let display-impls = select * from implemented where contract = "Display";
let error-impls = select * from implemented where contract = "Error";
let impl-errors = project(from=error-impls, columns=["file", "name"]);
let thiserror-tokens = select * from identifiers where text = "thiserror";
let thiserror-parents = select l."parent" as "parent" from "syntax-child" as l join thiserror-tokens as r on l."child" = r."id";
let thiserror-grandparents = select l."parent" as "parent" from "syntax-child" as l join thiserror-parents as r on l."child" = r."parent";
let thiserror-great-grandparents = select l."parent" as "parent" from "syntax-child" as l join thiserror-grandparents as r on l."child" = r."parent";
let thiserror-great-great-grandparents = select l."parent" as "parent" from "syntax-child" as l join thiserror-great-grandparents as r on l."child" = r."parent";
let thiserror-near-ancestors = union(left=thiserror-great-grandparents, right=thiserror-great-great-grandparents);
let attributes = select * from tree-nodes where kind = "attr";
let thiserror-attributes = select l."parent" as "attribute" from thiserror-near-ancestors as l join attributes as r on l."parent" = r."id";
let thiserror-items = select l."parent" as "item", l."file" as "file" from "syntax-child" as l join thiserror-attributes as r on l."child" = r."attribute";
let names = select * from tree-nodes where kind = "name";
let name-texts = select l."parent" as "name-node", l."text" as "text" from name-ref-texts as l join names as r on l."parent" = r."id";
let item-names = select l."parent" as "item", r."text" as "name" from "syntax-child" as l join name-texts as r on l."child" = r."name-node";
let derived-errors = select r."name" as "name", l."file" as "file" from thiserror-items as l join item-names as r on l."item" = r."item";
let error-types = union(left=impl-errors, right=derived-errors);
let error-displays = select l."file" as "file", l."span" as "span" from display-impls as l join error-types as r on l."file" = r."file" and l."name" = r."name";
let error-display-messages = extend(from=error-displays, values={"finding": "hand-written `Display` for an error type; give each variant an `#[error('..')]` message"});
let findings = union(left=error-impl-messages, right=error-display-messages);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "{finding}"
help = "Derive `thiserror::Error` on the type in the domain's errors.rs, give each variant an `#[error(\"..\")]` message, delete the hand-written impl, and keep each cause typed with `#[source]`, `#[from]` or `#[error(transparent)]`, never as its text."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"

[features]
fixtures = []
'''
files.'src/greeting.rs' = '''
mod errors;
mod types;
'''
files.'src/lib.rs' = '''
mod greeting;
'''
files.'src/greeting/types.rs' = '''
pub struct Greeting(pub String);
'''

[[scenarios]]
id = 'thiserror-derive'
scenario = 'A thiserror derive, and Display on a plain value.'
given.files.'src/greeting/errors.rs' = '''
#[derive(Debug, thiserror::Error)]
pub enum GreetingError {
    #[error("could not read {path}")]
    Read {
        path: String,
        #[source]
        source: std::io::Error,
    },
}
'''
given.files.'src/greeting/types.rs' = '''
pub struct Greeting(pub String);

impl std::fmt::Display for Greeting {
    fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        formatter.write_str(&self.0)
    }
}
'''

[[scenarios]]
id = 'hand-written-error'
scenario = 'An error written by hand, Display and Error.'
given.files.'src/greeting/errors.rs' = '''
use std::fmt;

#[derive(Debug)]
pub enum GreetingError {
    Empty,
}

impl fmt::Display for GreetingError {
    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
        formatter.write_str("no name")
    }
}

impl std::error::Error for GreetingError {}
'''
then.findings = [
  { path = 'src/greeting/errors.rs', line = 8 },
  { path = 'src/greeting/errors.rs', line = 14 },
]

[[scenarios]]
id = 'hand-written-display-on-derive'
scenario = 'A hand-written Display for a thiserror derive.'
given.files.'src/greeting/errors.rs' = '''
use std::fmt::{self, Display};

#[derive(Debug, thiserror::Error)]
pub struct LimitError {
    pub limit: u32,
}

impl Display for LimitError {
    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
        write!(formatter, "over the limit {}", self.limit)
    }
}
'''
then.findings = [
  { path = 'src/greeting/errors.rs', line = 8 },
]

[[scenarios]]
id = 'display-on-a-value'
scenario = 'Display for a value that is not an error.'
given.files.'src/greeting/errors.rs' = '''
#[derive(Debug, thiserror::Error)]
pub enum GreetingError {
    #[error("no name")]
    Empty,
}
'''
given.files.'src/greeting/types.rs' = '''
use std::fmt;

pub struct Limit(pub u32);

impl fmt::Display for Limit {
    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
        write!(formatter, "{}", self.0)
    }
}
'''

[[scenarios]]
id = 'hand-written-error-only'
scenario = 'A hand-written Error impl alone, its type written in parentheses.'
given.files.'src/greeting/errors.rs' = '''
#[derive(Debug)]
pub struct GreetingError;

impl std::error::Error for (GreetingError) {}
'''
given.files.'src/greeting/types.rs' = '''
use super::errors::GreetingError;

impl std::fmt::Display for GreetingError {
    fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        formatter.write_str("no name")
    }
}
'''
then.findings = [
  { path = 'src/greeting/errors.rs', line = 4 },
]

[[scenarios]]
id = 'display-on-conditional-derive'
scenario = 'A hand-written Display for a type derived through cfg_attr.'
given.files.'src/greeting/errors.rs' = '''
use std::fmt;

#[derive(Debug)]
#[cfg_attr(all(), derive(thiserror::Error))]
pub struct LimitError;

impl fmt::Display for LimitError {
    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
        formatter.write_str("over the limit")
    }
}
'''
then.findings = [
  { path = 'src/greeting/errors.rs', line = 7 },
]
