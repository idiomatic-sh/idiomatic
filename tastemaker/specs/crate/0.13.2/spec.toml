given.files.'cli/benches/performance/measure.rs' = '''
//! The harness of the workloads: each is run for its rounds, its CPU time taken per round, and the run prints one Bencher
//! Metric Format document on stdout (everything meant for a person goes to stderr), which Asymptote judges against its
//! ratchet.

/// How many rounds each workload is taken over: its `value` is the median of these.
const ROUNDS: usize = 3;

/// The measure every workload reports.
const MEASURE: &str = "cpu-ms";

/// A workload's id (`workspace/check`) and the CPU time of each of its rounds, in milliseconds.
pub(crate) struct Measured {
    pub(crate) id: String,
    pub(crate) rounds: Vec<f64>,
}

/// Runs `run` on the input `setup` makes, once per round, taking the CPU time of each run. A setup or a run that fails
/// panics, which fails the bench.
pub(crate) fn rounds<I>(
    id: &str,
    mut setup: impl FnMut() -> I,
    mut run: impl FnMut(I),
) -> Measured {
    let rounds = (0..ROUNDS)
        .map(|_| {
            let input = setup();
            let started = cpu_time();
            run(input);
            cpu_time().saturating_sub(started).as_secs_f64() * 1000.0
        })
        .collect();
    Measured {
        id: id.to_owned(),
        rounds,
    }
}

/// This process's CPU time, read through `cpu_time::ProcessTime`.
pub(crate) fn cpu_time() -> std::time::Duration {
    let now = cpu_time::ProcessTime::try_now();
    assert!(
        now.is_ok(),
        "the CPU clock cannot be read: {:?}",
        now.as_ref().err()
    );
    now.map_or(std::time::Duration::ZERO, |now| now.as_duration())
}

/// Prints the workloads as one Bencher Metric Format document on stdout: the median of the rounds is the `value`, the
/// fastest and the slowest are its `lower_value` and `upper_value`.
///
/// # Panics
///
/// When a workload ran no rounds.
pub(crate) fn print(measured: &[Measured]) {
    let mut document = serde_json::Map::new();
    for each in measured {
        let mut sorted = each.rounds.clone();
        sorted.sort_by(f64::total_cmp);
        let (Some(lower), Some(median), Some(upper)) =
            (sorted.first(), sorted.get(sorted.len() / 2), sorted.last())
        else {
            panic!("{}: the workload ran no rounds", each.id);
        };
        let _ = std::io::Write::write_fmt(
            &mut std::io::stderr(),
            format_args!(
                "{}: median CPU {median:.3} ms of {} rounds\n",
                each.id,
                sorted.len()
            ),
        );
        document.insert(
            each.id.clone(),
            serde_json::json!({ MEASURE: { "value": micro(*median), "lower_value": micro(*lower), "upper_value": micro(*upper) } }),
        );
    }
    println!("{}", serde_json::Value::Object(document));
}

/// `milliseconds` to the microsecond, the clock's useful resolution, so the document carries no float noise.
fn micro(milliseconds: f64) -> f64 {
    (milliseconds * 1000.0).round() / 1000.0
}
'''
given.files.'cli/src/cases.rs' = '''
//! The crate's test support: the rows every `*_test.rs` states its cases in, and the one `run` that checks them.

use std::fmt::Debug;

/// The case word of a row: the four a part's cases are named with.
#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub enum Word {
    /// The operation completes and answers the expected value.
    Succeeds,
    /// The input is refused with the expected error variant.
    Refuses,
    /// A dependency fails and its failure becomes the expected error variant.
    Fails,
    /// A weaker implementation is supplied and the expected error variant rejects it.
    Rejects,
}

/// What a row expects: a value or a full error.
#[derive(Debug)]
pub enum Expect<V, E> {
    /// The value the subject answers, compared by equality.
    Value(V),
    /// The error the subject fails with, compared in full by equality.
    Error(E),
}

/// What a case shows, in the product's nouns.
#[derive(Clone, Copy, Debug)]
pub struct CaseName(pub &'static str);

/// One row of a part's cases.
#[derive(Debug)]
pub struct Case<I, V, E> {
    /// What the case shows.
    pub name: CaseName,
    /// The row's one case word.
    pub word: Word,
    /// Builds the row's input from the fixtures or a constructor.
    pub input: fn() -> I,
    /// The expected value or error.
    pub expect: Expect<V, E>,
}

/// Runs every row of `cases` whose word is `word` through `subject` and asserts its expectation.
///
/// A `Succeeds` row expects a `Value` and every other word expects an `Error`; a row that names
/// the other kind is a failure of the table, reported with the row's name. An `Error` is compared by value, in full. A word no row has
/// is a failure too: a runner with nothing to run proves nothing.
///
/// Every row runs: a row that fails (or whose subject panics) does not hide the rows after it, and the one panic names every failed row.
///
/// # Panics
///
/// When a row's expectation is not met, or its kind does not match its word.
pub fn run<I, V: PartialEq + Debug, E: PartialEq + Debug>(
    cases: &[Case<I, V, E>],
    word: Word,
    subject: impl Fn(I) -> Result<V, E>,
) {
    assert!(
        cases.iter().any(|case| case.word == word),
        "no row has the case word {word:?}: a runner with nothing to run proves nothing"
    );
    let mut failed: Vec<String> = Vec::new();
    for case in cases.iter().filter(|case| case.word == word) {
        let kind_matches = matches!(
            (case.word, &case.expect),
            (Word::Succeeds, Expect::Value(_))
                | (Word::Refuses | Word::Fails | Word::Rejects, Expect::Error(_))
        );
        if !kind_matches {
            failed.push(format!(
                "{}: a {:?} row expects the wrong kind\n",
                case.name.0, case.word
            ));
            continue;
        }
        let answer = match std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {
            subject((case.input)())
        })) {
            Ok(answer) => answer,
            Err(_) => {
                failed.push(format!("{}: the subject panicked\n", case.name.0));
                continue;
            }
        };
        let met = match (&case.expect, &answer) {
            (Expect::Value(expected), Ok(actual)) => expected == actual,
            (Expect::Error(expected), Err(actual)) => expected == actual,
            _ => false,
        };
        if !met {
            failed.push(format!(
                "{}: expected {:?}, answered {:?}\n",
                case.name.0, case.expect, answer
            ));
        }
    }
    assert!(
        failed.is_empty(),
        "{} row(s) of {word:?} failed:\n{}",
        failed.len(),
        failed.concat()
    );
}
'''
