///
/// # Panics
///
/// When a row's expectation is not met, or its kind does not match its word.
pub fn run<I, V: PartialEq + Debug, E: PartialEq + Debug>(
    cases: &[Case<I, V, E>],
    word: Word,
    subject: impl Fn(I) -> Result<V, E>,
) {
