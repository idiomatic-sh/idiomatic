description = "A crate: its package files, named for its product and folder, its library root, its README and its bench (split by workload when it grows, S2), and the test support its unit tests share. Its tests are of three kinds: the unit test beside its primitive (`*_test.rs`, one `CASES` table run by the four case words), the contract a port exports for its implementations to run (`fixtures/contract.rs`), and the crate's behaviour through its surface, one colocated `acceptance.feature` and `acceptance.rs` per use case, run by `tests/bdd.rs`, using production storage adapters for lifecycle acceptance. It places no composition root, which only an edge holds (a command, an SDK function, a macro crate, a language provider)."
why = "Makes every crate the same shape, so any crate can be read, tested and benched the same way: one small alphabet of primitives (interface, use_case, service, item, adapter, schemas, composition, command and entry, factory, settings, fixture, types, errors, the test beside each logic file, the feature file and its runner, the module file beside each directory), the same five at every level (a body, its test, its types, its errors, an interface where something else implements it), every template writing exactly one primitive, and a file that is none a finding under the closed placement."
params = { package = { type = "identifier", description = "The crate's Cargo package name, or absent for the name its place gives: <product>, <product>-<folder> or <product>-<folder>-<crate>." }, library = { type = "identifier", description = "The crate's library name (`[lib] name`), or absent for the one Cargo derives from the package." }, binary = { type = "identifier", description = "The crate's binary name (`[[bin]] name`, at src/main.rs), or absent for a crate with no binary of a different name." }, distribution = { type = "identifier", description = "Whether this crate owns its product's distribution test and bench: shipped or absent. Only the CLI of a shipped product uses shipped." }, product = { type = "identifier", from = "workspace-name", description = "The product the crate belongs to: the workspace's name." }, folder = { type = "identifier", from = "workspace-name", description = "The folder under the product's crates/ that groups the crate, captured from its path; the workspace's name for a crate in no folder." }, crate = { type = "identifier", from = "directory-name", description = "The crate, its directory's name." } }
# A crate has a runner when it holds a feature file (`src/inbound/use_cases/<use_case>/acceptance.feature`), and keeps the test support when it is a core, an SDK or a command line.
conditions = { features = { description = "The crate holds a feature file: `src/inbound/use_cases/<use_case>/acceptance.feature`.", rule = { rule = "present", include = ["src/inbound/use_cases/*.rs", "src/inbound/contracts/*.rs"] } }, cases = { description = "The crate keeps tests of the one shape: a core (`src/inbound.rs`), a crate with a domain and no use case (`src/domain.rs`), an engine library crate with an application and no use case (`src/application.rs`), an SDK (`src/resources.rs`), a command line (`src/main.rs`).", rule = { rule = "tested-by-cases", include = ["src/inbound.rs", "src/domain.rs", "src/application.rs", "src/resources.rs", "src/main.rs", "src/*/adapters.rs", "src/*/interface.rs"] } } }
templates = [
  { template = "cargo-package", file = "Cargo.toml", description = "The crate's manifest: a package named for its product and folder, the workspace's package fields and lints, the `fixtures` feature, and the test and bench targets." },
  { template = "crate-readme", file = "README.md", description = "The crate's README, held to exactly five parts: its name, what it is for, one line on how a program uses it, one runnable example, and a line for each of its domains." },
  { template = "crate-root", file = "src/lib.rs", description = "The library root: the README as the crate's documentation, and the modules its specs place." },
  # The crate's behaviour: one feature per use case, its steps in a module of its own, one runner; a crate with no use case has none.
  { template = "bdd-runner", file = "tests/bdd.rs", count = { when = { condition = "features" }, then = 1, else = 0 }, description = "The cucumber runner of the crate's features, present exactly when the crate has one: it declares each feature's steps and fails on a skipped or failed step." },
  # The test support the unit tests of the one shape call.
  { template = "cases", file = "src/cases.rs", count = { when = { condition = "cases" }, then = 1, else = 0 }, description = "The test support of a core, an SDK, a command line: the `Case` rows, the four case words, the expectation and the `run` every unit test calls." },
  # Another workspace's files, which the crate's tests run their code over.
  { alias = "test-root", template = "integration-test", file = "tests/test.rs", count = { min = 0 }, description = "The root of the crate's grouped integration tests, which declares its groups." },
  { alias = "test-group-module", template = "idiomatic.arch/test-group-module@0.2.0", file = "tests/{group}.rs", exclude = ["mod.rs", "**/mod.rs", "tests/fixtures/**"], count = { min = 0 }, description = "The module file of one group of the crate's integration tests." },
  { alias = "nested-test-group-module", template = "idiomatic.arch/test-group-module@0.2.0", file = "tests/{*outer}/{group}.rs", exclude = ["mod.rs", "**/mod.rs", "tests/fixtures/**"], count = { min = 0 }, description = "The module file of one group of the crate's integration tests, at any depth below the first." },
  { alias = "test-group-test", template = "integration-test", file = "tests/{*group}/test.rs", exclude = ["tests/fixtures/**"], count = { min = 0 }, description = "One group of the crate's integration tests." },
  { alias = "test-group-fixtures", template = "integration-test", file = "tests/{*group}/fixtures.rs", exclude = ["tests/fixtures/**"], count = { min = 0 }, description = "The test support of one group of the crate's integration tests." },
  { alias = "test-group-fixture-files", template = "integration-test", file = "tests/{*group}/fixtures/{*fixture}", exclude = ["tests/fixtures/**"], count = { min = 0 }, description = "A file of one group's test support beneath its `fixtures/`." },
  { alias = "cases-test", template = "idiomatic.arch/unit-test@0.1.0", file = "src/cases_test.rs", count = { min = 0 }, params = { kind = "concept", part = "cases" }, description = "The proof of the crate's `src/cases.rs`: the case runner runs every row of a word." },
  { alias = "license", template = "idiomatic.arch/unchecked@0.1.0", file = "LICENSE*", count = { min = 0 }, description = "The license text the crate ships, or a link to the repository's. The pattern writes out no file name, so a spec that places the crate's license with a template of its own (a command line's MIT text) places it, and so does a product's own entry." },
  { template = "fixture-tree", file = "tests/fixtures/{*path}", exclude = ["tests/fixtures/suite/**", "tests/fixtures/standard/**", "tests/fixtures/corpus/**", "tests/fixtures/relations/**"], count = { min = 0 }, description = "One file of a fixture tree: another workspace's file, of any kind, that the crate's tests read as input. A pinned suite, standard and corpus, and the inputs and rows of the relations, are not: the language spec places them." },
  { template = "crate-bench", file = "benches/performance.rs", count = { min = 0 }, description = "The bench target, present exactly when the crate has a workload to measure: a `harness = false` target that declares each workload once they are split out; what a product measures is printed as Bencher Metric Format by its command line's `commands` bench, and no budget is kept beside it. A crate with no workload has neither the file nor the manifest's bench target." },
  { template = "bench-workload", file = "benches/performance/{workload}/bench.rs", count = { min = 0 }, description = "One workload's benches, split out of the bench target when it grows too long." },
]
rules = [
  { rule = "idiomatic.arch/orphan-rust-files@0.1.0", include = ["**"], exclude = ["**/tests/fixtures/**", "**/tests/ui/**"], description = "Every Rust file of the crate is a module its crate roots reach: a file no `mod` line declares is never compiled, linted or tested." },
  { rule = "idiomatic.arch/bdd-members@0.1.0", include = ["src/inbound/use_cases/*.rs", "src/inbound/contracts/*.rs", "src/inbound/use_cases/*/acceptance.*", "src/inbound/contracts/*/acceptance.*", "tests/bdd.rs"], description = "Acceptance pairs visible in this scope have an owner and harness registration." },
  # The rules every product placed alike over its crates.
  { rule = "idiomatic.arch/extension-point-ports@0.1.0", include = ["**"], params = { exposed = [] }, description = "Every port of the crate has at least one adapter, and its trait ends in `Port`, unless an SDK resource re-exports it." },
  { rule = "idiomatic.arch/collection-members@0.2.0", include = ["src/**/collections.rs", "src/**/collections/**"], params = { item-trait = [] }, description = "A collection is whole: its list, its module file, its interface and its items." },
  { rule = "idiomatic.arch/use-case-module-beside@0.1.0", include = ["src/inbound/use_cases/**"], description = "Each use case directory has its module file beside it." },
  { rule = "idiomatic.arch/item-contract@0.1.0", include = ["src/**/collections/**"], description = "Each item's test runs its collection's shared cases when the collection has a fixtures/contract.rs." },
  { rule = "idiomatic.arch/thin-command@0.2.0", include = ["src/resources/*/*/command.rs", "src/resources/*/*/entry.rs", "**/interface.rs"], description = "Every command and SDK entry only parses, calls one service and presents the result." },
  { rule = "idiomatic.arch/no-vacuous-tests@0.1.0", include = ["src/cases.rs"], description = "The shared case runner rejects empty selections and compares expected error content." },
  { rule = "captured-workload", include = ["Cargo.toml", "src/**/adapters/recorded/adapter.rs", "benches/performance/captured/bench.rs"], description = "A crate that records a port replays the recordings in its captured workload." },
  { rule = "bdd-runner", alias = "runner-shape", include = ["tests/bdd.rs", "src/inbound/use_cases/*/acceptance.rs", "src/inbound/contracts/*/acceptance.rs"], params = { world = "Behavior" }, description = "The BDD runner keeps the shape its template gives it and drives the `Behavior` world, and each steps file takes the world first." },
  { rule = "thiserror-in-errors", include = ["**"], exclude = ["**/errors.rs", "**/schemas.rs"], description = "Outside a part's errors.rs nothing in the crate names `thiserror`; the refusal of a conversion, `<Name>SchemaError`, is derived in the schemas.rs it belongs to." },
  { rule = "error-shape", include = ["**"], description = "Every error type of the crate is a `thiserror` derive, never a hand-written `Error` or `Display` impl." },
  # A part's fakes reach other crates' tests only.
  { rule = "fixtures-feature", include = ["Cargo.toml"], description = "The crate's `fixtures` feature is switched on only from `[dev-dependencies]`, so its fakes never ship." },
  { rule = "idiomatic.arch/test-group-namespace@0.1.0", include = [{ placed-by = "test-group-module" }, { placed-by = "nested-test-group-module" }], params = { case-table = "refused" }, description = "A test group's module file declares the group's modules only: its test, its fixtures and its nested groups." },
]

