description = "A crate's Cargo manifest: its package name, workspace-inherited package fields and lints, the dependencies its placed files compile with (a command line's `anstream`, `clap`, `serde` and `serde_json`), its `fixtures` feature, its bench target, and, when it has a BDD runner, the `bdd` test target with the dev-dependencies it runs on (`cargo_metadata`, `cucumber`, `tokio`)."
why = "Gives each crate the one package shape the workspace expects: its name from its place, the workspace's shared fields and lints, and the test and bench targets its spec places."
params = { package = { type = "identifier", description = "The crate's Cargo package name, or absent for the name its place gives: <product>, <product>-<folder> or <product>-<folder>-<crate>." }, library = { type = "identifier", description = "The crate's library name (`[lib] name`), or absent for the one Cargo derives from the package." }, binary = { type = "identifier", description = "The crate's binary name (`[[bin]] name`, at src/main.rs), or absent for a crate with no binary of a different name." }, distribution = { type = "identifier", description = "Whether this crate owns its product's distribution test and bench: shipped or absent. Only the CLI of a shipped product uses shipped." }, product = { type = "identifier", description = "The product the crate belongs to." }, folder = { type = "identifier", description = "The folder under the product's crates/ that groups the crate; the product's own crate passes the product." }, crate = { type = "identifier", from = "directory-name", description = "The crate, its directory's name." } }
content = '''
{%- set name = package if package != "absent" else product ~ ("-" ~ folder if folder != product else "") ~ ("-" ~ crate if crate != folder else "") -%}
[package]
name = "{{ name }}"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
{% if scaffold | default(false) %}
publish = false
{% endif %}
autobenches = false
{%- if library != "absent" and not present["hostile-scope"] | default(false) %}

[lib]
name = "{{ library }}"
{%- endif %}
{%- if binary != "absent" %}

[[bin]]
name = "{{ binary }}"
path = "src/main.rs"
{%- endif %}
{%- if present["hostile-scope"] | default(false) %}

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
{%- elif present["language-conformance-test"] | default(false) %}

[dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk" }
{%- elif present["cli-main"] | default(false) %}

[dependencies]
anstream.workspace = true
clap.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
{%- endif %}

[dev-dependencies]
{%- if present["language-conformance-test"] | default(false) %}
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../crates/sdk", features = ["fixtures"] }
dhat.workspace = true
# The crate itself, with its fixtures: its tests need them, and no test is run with a flag.
{{ name }} = { path = ".", features = ["fixtures"] }
{%- endif %}
{%- if present["bdd-runner"] | default(false) %}
cargo_metadata.workspace = true
cucumber.workspace = true
{%- endif %}
{%- if present["bdd-runner"] | default(false) %}
tokio.workspace = true
{%- endif %}
{%- if present["hostile-scope"] | default(false) %}
trybuild.workspace = true
{%- endif %}
{%- if present["cli-main"] | default(false) %}
trycmd.workspace = true
tempfile.workspace = true
snapbox.workspace = true
{%- endif %}
{%- if distribution == "shipped" %}
ignore.workspace = true
sha2.workspace = true
sysinfo.workspace = true
toml.workspace = true
{%- endif %}
{%- if present["bdd-runner"] | default(false) %}

[[test]]
name = "bdd"
harness = false
{%- endif %}

{%- if present["language-conformance-test"] | default(false) %}

[[test]]
name = "allocation"
harness = false

[[test]]
name = "conformance"
harness = false
{%- endif %}

{%- if present["crate-bench"] | default(false) %}

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false
{%- endif %}
{%- if present["performance-main"] | default(false) %}

[[bench]]
name = "commands"
path = "benches/performance/main.rs"
harness = false
{%- endif %}

{%- if distribution == "shipped" %}

[[test]]
name = "distribution"
path = "../distribution/smoke_test.rs"
required-features = ["distribution"]
# Runs only when named (`--test distribution`), never in `cargo test` or `--all-features`.
test = false

# The targets' performance: the bench prints Bencher Metric Format, never a test.
[[bench]]
name = "distribution"
path = "../distribution/benches/bench.rs"
harness = false
required-features = ["distribution"]
test = false
{%- endif %}

[features]
{%- if present["language-conformance-test"] | default(false) %}
fixtures = ["ryo/fixtures"]
{%- else %}
fixtures = []
{%- endif %}
{%- if distribution == "shipped" %}
distribution = []
{%- endif %}

[lints]
workspace = true
{%- if distribution == "shipped" %}

# cargo-binstall's prebuilt binary: the GitHub Release of the package's own tag, `<package>-v<version>`, holds one archive
# per target, `<package>-<target>.tar.gz` (`.zip` on Windows), with the bare command inside.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
{%- endif %}
'''

