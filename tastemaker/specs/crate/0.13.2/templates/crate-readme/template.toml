description = "A crate's README, the whole document: its package name, what the crate is for in one line, for an SDK crate under Usage one line on how a program uses it and one runnable Rust example, and each of its domains in one line."
why = "Gives every crate the same README a reader can trust: its purpose and each domain in one line. Only an SDK crate is called by a program, so only its README shows Usage, with an example that is compiled and run as a doctest; every other crate is internal and a placeholder example there says nothing to its reader."
match = "declarations"
content = '''
{%- set package = package if package != "absent" else product ~ ("-" ~ folder if folder != product else "") ~ ("-" ~ crate if crate != folder else "") -%}
{%- set library = library if library != "absent" else package | snake -%}
# {{ package }}

What {{ package }} is for, in one line.
{%- if present.entries | default(false) %}

## Usage

How a program uses {{ package }}, in one line.

```rust
use {{ library }} as _;
```
{%- endif %}
{%- set concepts = instances.concept | default([]) %}
{%- if concepts %}

## Domains
{%- for concept in concepts %}

### {{ concept.name }}

What {{ concept.name }} does, in one line.
{%- endfor %}
{%- endif %}
'''

[params]
product = { type = "identifier", description = "The product the crate belongs to." }
folder = { type = "identifier", description = "The folder under the product's crates/ that groups the crate; the product's own crate passes the product." }
crate = { type = "identifier", from = "directory-name", description = "The crate, its directory's name." }
package = { type = "identifier", description = "The crate's Cargo package name, or absent for the name its place gives." }
library = { type = "identifier", description = "The crate's library name, or absent for the package name in snake case." }

[[scenarios]]
id = 'package-name-and-one-line-purpose'
scenario = 'The package name and a one-line purpose pass; an internal crate has no Usage.'
given.file = 'app/README.md'
given.params = { package = 'absent', library = 'absent', product = 'demo', folder = 'demo', crate = 'app' }
given.files.'app/README.md' = '''
# demo-app

Greets whoever asks, in one sentence.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'app/README.md'
given.params = { package = 'absent', library = 'absent', product = 'demo', folder = 'demo', crate = 'app' }
then.findings = [
  { rule = 'crate-readme#count', path = '.' },
]

[[scenarios]]
id = 'wrong-title'
scenario = 'The title is not the package name.'
given.file = 'app/README.md'
given.params = { package = 'absent', library = 'absent', product = 'demo', folder = 'demo', crate = 'app' }
given.files.'app/README.md' = '''
# app

Greets whoever asks, in one sentence.
'''
then.findings = [
  { rule = 'crate-readme#template', path = 'app/README.md' },
  { rule = 'crate-readme#template', path = 'app/README.md' },
  { rule = 'crate-readme#template', path = 'app/README.md' },
  { rule = 'crate-readme#template', path = 'app/README.md' },
]

[[scenarios]]
id = 'usage-on-internal-crate'
scenario = 'An internal crate shows a Usage section, which only an SDK crate has.'
given.file = 'app/README.md'
given.params = { package = 'absent', library = 'absent', product = 'demo', folder = 'demo', crate = 'app' }
given.files.'app/README.md' = '''
# demo-app

Greets whoever asks, in one sentence.

## Usage

How a program uses demo-app, in one line.

```rust
let greeting = demo_app::greet("world");
assert_eq!(greeting, "hello, world");
```
'''
then.findings = [
  { rule = 'crate-readme#template', path = 'app/README.md' },
  { rule = 'crate-readme#template', path = 'app/README.md' },
  { rule = 'crate-readme#template', path = 'app/README.md' },
]

[[scenarios]]
id = 'extra-section'
scenario = 'A section the template does not have.'
given.file = 'app/README.md'
given.params = { package = 'absent', library = 'absent', product = 'demo', folder = 'demo', crate = 'app' }
given.files.'app/README.md' = '''
# demo-app

Greets whoever asks, in one sentence.

## Design notes

The greeting is fixed.
'''
then.findings = [
  { rule = 'crate-readme#template', path = 'app/README.md' },
  { rule = 'crate-readme#template', path = 'app/README.md' },
]

[[scenarios]]
id = 'empty-description'
scenario = 'No purpose under the title.'
given.file = 'app/README.md'
given.params = { package = 'absent', library = 'absent', product = 'demo', folder = 'demo', crate = 'app' }
given.files.'app/README.md' = '''
# demo-app
'''
then.findings = [
  { rule = 'crate-readme#template', path = 'app/README.md' },
]

[[scenarios]]
id = 'multi-line-description'
scenario = 'The purpose runs over more than one line.'
given.file = 'app/README.md'
given.params = { package = 'absent', library = 'absent', product = 'demo', folder = 'demo', crate = 'app' }
given.files.'app/README.md' = '''
# demo-app

Greets whoever asks,
wrapped over two lines.
'''
then.findings = [
  { rule = 'crate-readme#template', path = 'app/README.md' },
  { rule = 'crate-readme#template', path = 'app/README.md' },
]

[[scenarios]]
id = 'named-library'
scenario = 'A crate with its own package name is titled by it.'
given.file = 'app/README.md'
given.params = { package = 'idiomatic-sh-ryo-core', library = 'ryo_core', product = 'demo', folder = 'demo', crate = 'app' }
given.files.'app/README.md' = '''
# idiomatic-sh-ryo-core

Greets whoever asks, in one sentence.
'''
