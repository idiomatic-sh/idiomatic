description = "A crate's bench target: a `harness = false` target that declares each workload's bench. A product's measured workloads are printed as Bencher Metric Format by its command line's `commands` bench, never held to a budget here."
why = "Is the crate's bench target: it declares each workload's bench, so a workload is named where it is measured and no budget is kept beside it."
content = '''
{%- if present["language-conformance-test"] | default(false) -%}
//! {{ crate }}'s workloads: the growth of its reading, and a generated file read with every relation asked, through the linked language.

#![expect(
    clippy::expect_used,
    reason = "a bench that cannot read its own input has nothing to measure: the panic is the failure"
)]

use ryo::languages::{self, contract};
use std::fmt::Write as _;

/// How many lines the generated file the growth check starts from has.
const SIZE: usize = 2_500;

/// The growth of the time for four times the input beyond which the reading is not linear enough: four is linear, sixteen quadratic.
const GROWTH_LIMIT: u32 = 5;

/// How many times the growth check reads each input: it compares the fastest read of each size.
const ROUNDS: usize = 5;

/// The argument `cargo bench` passes to a bench and `cargo test` does not: the growth check times the reading, so only the timing run makes it.
const BENCH_FLAG: &str = "--bench";

fn main() {
    if std::env::args().any(|argument| argument == BENCH_FLAG) {
        complexity();
    }
    divan::Divan::default()
        .max_time(std::time::Duration::from_secs(10))
        .config_with_args()
        .main();
}

/// A file of `lines` lines, in the shape the language reads: the author writes it as the language's own text.
fn generated(lines: usize) -> String {
    let mut text = String::new();
    for each in 0..lines {
        let _ = writeln!(text, "line {each}");
    }
    text
}

/// Reads `text` through the linked language, every relation of the catalog asked for, into the worker's table and rows.
fn read(
    text: &str,
    table: &mut languages::Elements,
    symbols: &mut languages::Symbols,
    out: &mut contract::Collect,
) {
    let linked = ryo_{{ crate }}::linked();
    let engine = linked.parse_engine();
    out.clear();
    contract::read(
        engine.as_ref(),
        languages::ParseRequest {
            path: languages::SourcePath("generated.{{ crate }}"),
            file: languages::FileId(0),
            bytes: languages::ByteSlice(text.as_bytes()),
            notes: languages::NoteRequest::Unwanted,
            fields: languages::FieldRequest::Unwanted,
        },
        table,
        symbols,
        languages::all(),
        out,
    )
    .expect("the generated file is read");
}

/// How long reading `text` takes at the fastest of `ROUNDS` reads: the fastest is the read the rest of the machine slowed
/// least, so one disturbed read never decides the growth check.
fn timed(text: &str) -> std::time::Duration {
    let (mut table, mut symbols, mut out) = (
        languages::Elements::default(),
        languages::Symbols::default(),
        contract::Collect::default(),
    );
    (0..ROUNDS)
        .map(|_| {
            let started = std::time::Instant::now();
            read(text, &mut table, &mut symbols, &mut out);
            started.elapsed()
        })
        .min()
        .unwrap_or_default()
}

/// Reads files of `SIZE` and of four times `SIZE` lines and fails when the larger takes more than `GROWTH_LIMIT` times the smaller.
fn complexity() {
    let small = timed(&generated(SIZE));
    let large = timed(&generated(4 * SIZE));
    assert!(
        large < small * GROWTH_LIMIT,
        "reading four times the file took {large:?} against {small:?}: the reading grows faster than linearly"
    );
}

/// Reads a generated file of `lines` lines, every relation of the catalog asked for: N and 4N.
#[divan::bench(args = [SIZE, 4 * SIZE])]
fn generated_every_relation(bencher: divan::Bencher<'_, '_>, lines: usize) {
    let text = generated(lines);
    let (mut table, mut symbols, mut out) = (
        languages::Elements::default(),
        languages::Symbols::default(),
        contract::Collect::default(),
    );
    bencher.bench_local(|| read(&text, &mut table, &mut symbols, &mut out));
}
{%- else -%}
//! {{ crate }}'s workloads.
{%- for workload in captures.workload | default([]) %}

#[path = "performance/{{ workload }}/bench.rs"]
mod {{ workload }};
{%- endfor %}

fn main() {}
{%- endif %}
'''

