description = "A crate's library root: its README as its documentation, the composition root a macro or a language crate holds, a command line's `commands`, `edge`, `outcome`, `output` and linked `languages`, an SDK's `entries` and `vocabulary`, a core's `inbound`, `outbound`, `domain`, `collections` and gated `fixtures`, and the gated `cases` test support of a crate of the one test shape."
why = "Makes the crate's README its documentation and declares what its specs place, so the library root only declares and never holds logic, and a scaffolded crate compiles."
params = { crate = { type = "identifier", from = "directory-name", description = "The crate, its directory's name." } }
content = '''
#![cfg_attr(doc, doc = include_str!("../README.md"))]
#![cfg_attr(not(doc), doc = env!("CARGO_PKG_DESCRIPTION"))]
{%- if present["language-fixtures"] | default(false) %}
#![cfg_attr(
    all(feature = "fixtures", not(test)),
    allow(
        dead_code,
        reason = "the ports' own fixtures are used by the tests of the crate; outside tests the feature surface is `fixtures` at the root"
    )
)]
{%- endif %}
{%- if present["hostile-scope"] | default(false) %}
{%- if present.composition | default(false) %}

#[deny(clippy::panic, clippy::unwrap_used, clippy::expect_used, clippy::indexing_slicing)]
mod composition;
{%- endif %}
#[deny(clippy::panic, clippy::unwrap_used, clippy::expect_used, clippy::indexing_slicing)]
mod macros;
{%- elif present.composition | default(false) %}

mod composition;
{%- endif %}
{%- if present.commands | default(false) %}

pub mod edge;
pub mod resources;
{%- if present.languages | default(false) %}
mod languages;
{%- endif %}
pub mod outcome;
pub mod output;
pub mod timings;
{%- endif %}
{%- if present.entries | default(false) %}
{#- An SDK names its resources at its root (`ryo::query`), so the module is declared without a visibility: one that re-exports each resource keeps it private, and the template accepts either. #}

mod resources;
{%- endif %}
{#- A core (the `nu-hex` spec): its inbound surface, ports and domain concepts, whatever its role. The template declares each module without a visibility, so one root serves a feature crate (public inbound and outbound, private domain), a language provider (crate-private inbound and outbound) and a kernel crate (public domain); a template that names a visibility is compared exactly, one that names none accepts any. Every part keeps its own types, errors, collections and test support (a port's `fixtures/`), so the root declares none of them. #}
{%- if present.inbound | default(false) %}

mod inbound;
{%- if present.outbound | default(false) %}
mod outbound;
{%- endif %}
{%- endif %}
{%- if present["domain-concepts"] | default(false) %}

mod domain;
{%- endif %}
{#- The test support a crate of the one test shape keeps (the `cases` entry): compiled for its tests and, through the `fixtures` feature, for the crates that run its exported rows. #}
{%- if present.cases | default(false) %}

#[cfg(any(test, feature = "fixtures"))]
pub mod cases;
{%- endif %}
{%- if present["language-fixtures"] | default(false) %}

/// The {{ crate }} language, composed over its syntax port: what an edge links to read it.
#[must_use]
pub fn linked() -> ryo::languages::Language {
    use std::sync::Arc;

    use crate::inbound::contracts::parse::contract::ParseContract;
    use crate::inbound::contracts::project::contract::ProjectContract;
    use crate::outbound::syntax::factory::{{ crate }};

    ryo::link!(
        stringify!({{ crate }}),
        parse: Arc::new(ParseContract::new(Arc::new({{ crate }}()))),
        project: Arc::new(ProjectContract::new()),
    )
}

#[cfg(any(test, feature = "fixtures"))]
pub mod fixtures;
{%- endif %}
'''

[given]
file = 'app/src/lib.rs'
params = { crate = 'app' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'app/src/lib.rs' = '''
#![cfg_attr(doc, doc = include_str!("../README.md"))]
#![cfg_attr(not(doc), doc = env!("CARGO_PKG_DESCRIPTION"))]
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'app/src/lib.rs' = '''
#![cfg_attr(doc, doc = include_str!("../README.md"))]
#![cfg_attr(not(doc), doc = env!("CARGO_PKG_DESCRIPTION"))]

pub mod greeting;

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'crate-root#count', path = '.' },
]

[[scenarios]]
id = 'readme-not-included'
scenario = 'The library root does not take its documentation from the README.'
given.files.'app/src/lib.rs' = '''
//! app: what it is for.
'''
then.findings = [
  { rule = 'crate-root#template', path = 'app/src/lib.rs' },
]
