'''

[[scenarios]]
id = 'recorded-adapter-only-synthetic-workload'
scenario = 'A recorded adapter and only a synthetic workload.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
