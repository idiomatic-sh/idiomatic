description = "A crate with a recorded adapter (`adapters/recorded/adapter.rs` in any of its hexes) has `benches/performance/captured/bench.rs`, the workload that replays what it recorded."
why = "A port is recorded so that its crate can be tuned alone on real data: the recorded adapter writes what a real run gave the port and what it answered, and the crate's `captured` workload replays those requests into the adapter under tuning and checks each answer against the recorded one. A recording no workload replays measures nothing. A crate is a directory holding a `Cargo.toml`, and a recorded adapter belongs to the nearest crate whose manifest sits above one of its `src/` directories, so a nested crate owns its own files; the workload is the crate spec's bench workload named `captured`."

query = '''
let files = project(from="filesystem.file", columns=["path"]);
let nested-recorded-rows = capture(from=files, path="path", pattern="{*crate}/src/{*hex}/adapters/recorded/adapter.rs", captures=["crate", "hex"]);
let nested-recorded = project(from=nested-recorded-rows, columns=["path", "crate"]);
let root-recorded-rows = select * from files where glob_any(path, "src/**/adapters/recorded/adapter.rs");
let root-recorded-crates = extend(from=root-recorded-rows, values={"crate": ""});
let root-recorded = project(from=root-recorded-crates, columns=["path", "crate"]);
let candidates = union(left=nested-recorded, right=root-recorded);
let manifests = project(from="filesystem.file", columns=["path"]);
let nested-manifests = capture(from=manifests, path="path", pattern="{*crate}/Cargo.toml", captures=["crate"]);
let nested-crates = project(from=nested-manifests, columns=["crate"]);
let root-manifests = select * from manifests where glob_any(path, "Cargo.toml");
let root-manifest-crates = extend(from=root-manifests, values={"crate": ""});
let root-crates = project(from=root-manifest-crates, columns=["crate"]);
let crates = union(left=nested-crates, right=root-crates);
let owned = select l."crate" as "crate", l."path" as "path" from candidates as l join crates as r on l."crate" = r."crate";
let candidate-pairs = select r."crate" as "inner", l."crate" as "outer", l."path" as "path" from owned as l join owned as r on l."path" = r."path";
let deeper-pairs = select * from candidate-pairs where outer < inner;
let shadowed = project(from=deeper-pairs, columns=["path", "outer"]);
let recorded = antijoin(left=owned, right=shadowed, left-on=["path", "crate"], right-on=["path", "outer"]);
let nested-workload-rows = capture(from=files, path="path", pattern="{*crate}/benches/performance/captured/bench.rs", captures=["crate"]);
let nested-workloads = project(from=nested-workload-rows, columns=["crate"]);
let root-workload-rows = select * from files where glob_any(path, "benches/performance/captured/bench.rs");
let root-workload-crates = extend(from=root-workload-rows, values={"crate": ""});
let root-workloads = project(from=root-workload-crates, columns=["crate"]);
let workloads = union(left=nested-workloads, right=root-workloads);
let unreplayed = antijoin(left=recorded, right=workloads, left-on=["crate"], right-on=["crate"]);
emit unreplayed subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "`{path}` records a port, and its crate has no `benches/performance/captured/bench.rs` to replay it"
help = "Add the `captured` workload (`tm scaffold` writes the file): it replays the recorded requests of each target run into the real adapter, with the crate's other ports served by their replay fakes, and checks every answer against the recorded one."

[given]
include = ['**']

[[scenarios]]
id = 'recorded-adapter-crate-s-captured-workload'
scenario = "A recorded adapter and the crate's captured workload."
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'benches/performance/captured/bench.rs' = '''
//! Replays the recorded placement calls.
'''
given.files.'src/lib.rs' = '''
pub mod placement;
'''
given.files.'src/placement/adapters/native/adapter.rs' = '''
//! The placement matcher.
'''
given.files.'src/placement/adapters/recorded/adapter.rs' = '''
//! Records each placement request and its answer.
'''

[[scenarios]]
id = 'crate-records-nothing-needs-no-captured-workload'
