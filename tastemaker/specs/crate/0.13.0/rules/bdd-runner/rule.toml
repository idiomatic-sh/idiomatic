let lack-features-metadatacommand = antijoin(left=fn-features, right=have-features-metadatacommand, left-on=["id"], right-on=["function"]);
let lack-features-metadatacommand-rows = project(from=lack-features-metadatacommand, columns=["file", "span"]);
let lack-features-metadatacommand-findings = extend(from=lack-features-metadatacommand-rows, values={"what": "`features` never locates the workspace with cargo metadata (no `MetadataCommand`)"});
