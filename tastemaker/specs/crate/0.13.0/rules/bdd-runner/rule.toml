message = "BDD runner {what}"
help = "Rewrite tests/bdd.rs to the bdd-runner template's shell (`tm scaffold` writes it): its functions `features`, `check`, `run` and `main` as the template gives them, checking that every scenario and outline carries exactly one of @succeeds, @refuses, @fails and @rejects and that the features state a success and a refusal, then running each feature failing on a skipped step and asserting no failure and a passed step. Write the steps in `src/inbound/use_cases/<use_case>/acceptance.rs` as #[given(\"..\")] or #[given(expr = \"..\")] taking `world: &mut <World>` first, and assert the part's own results. A file's one attribute is an `#![expect(..)]` with a reason."

