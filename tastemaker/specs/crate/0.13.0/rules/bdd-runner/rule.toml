description = "The BDD runner holds the shell its template gives it, function by function: it finds the feature files next to it, checks with cucumber's own Gherkin parser that every scenario and outline carries exactly one case word and that the features state a success and a refusal, runs each feature with cucumber's default command line failing on a skipped step, and asserts the execution did not fail and that a step passed; its steps, in `src/inbound/use_cases/<use_case>/acceptance.rs`, match cucumber expressions or plain strings and take the world as `world`, and no `Observation` residue remains; its only file-level attribute is one #![expect(..)] with a reason."
why = "The bdd-runner template places the file; this rule fixes its shell while authors write the steps, so a runner cannot skip steps, pass with none, run another feature, accept a scenario that names no case word or two, or run features that prove no success or no refusal. The shell is four functions (`features`, `check`, `run`, `main`) and each must say, token by token, what the template gives it: Cargo metadata and the runner's own source path locate the directory once, for both the check and the run; cucumber owns parsing and execution, Rust owns the case-word count and the runtime options. A token is seen as written, also inside a macro's arguments; an equivalent rewrite with other tokens is a finding."

query = '''
param world: string;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = select * from tree-nodes where kind = "source-file";
let identifiers = select * from tree-tokens where kind = "ident";
let kind-fn-nodes = select * from tree-nodes where kind = "fn";
let kind-attr-nodes = select * from tree-nodes where kind = "attr";
let kind-path-nodes = select * from tree-nodes where kind = "path";
let kind-path-segment-nodes = select * from tree-nodes where kind = "path-segment";
let kind-name-ref-nodes = select * from tree-nodes where kind = "name-ref";
let kind-ident-tokens = select * from tree-tokens where kind = "ident";
let kind-token-tree-meta-nodes = select * from tree-nodes where kind = "token-tree-meta";
let kind-name-nodes = select * from tree-nodes where kind = "name";
let kind-ident-pat-nodes = select * from tree-nodes where kind = "ident-pat";
let kind-param-nodes = select * from tree-nodes where kind = "param";
let kind-struct-nodes = select * from tree-nodes where kind = "struct";
let runner-files = select * from files where glob_any(file, "{tests/bdd.rs,**/tests/bdd.rs}");
let runner-rows = select l."file" as "file", l."span" as "span" from runner-files as l join runner-files as r on l."id" = r."id";
let runner-children = select l."file" as "file", r."child" as "child" from runner-files as l join "syntax-child" as r on l."id" = r."parent";
let top-functions = select l."file" as "file", l."child" as "id", r."span" as "span" from runner-children as l join kind-fn-nodes as r on l."child" = r."id";
let function-parts = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from top-functions as l join "syntax-child" as r on l."id" = r."parent";
let function-names = select l."id" as "id", l."file" as "file", l."span" as "span", l."child" as "name" from function-parts as l join kind-name-nodes as r on l."child" = r."id";
let function-name-tokens = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "token" from function-names as l join "syntax-child" as r on l."name" = r."parent";
let named-functions = select l."id" as "id", l."file" as "file", l."span" as "span", l."token" as "token", r."text" as "name" from function-name-tokens as l join kind-ident-tokens as r on l."token" = r."id";
let name-token-ids = project(from=named-functions, columns=["token"]);
let runner-tokens = select l."id" as "id", l."kind" as "kind", l."text" as "text", l."file" as "file" from tree-tokens as l join runner-files as r on l."file" = r."file";
let token-owners = axis(from=runner-tokens, relation="syntax-child", direction=nearest-ancestor, domain=named-functions);
let owned-tokens = select l."id" as "token", l."related" as "function", l."file" as "file", l."text" as "text" from token-owners as l join named-functions as r on l."related" = r."id";
let body-tokens = antijoin(left=owned-tokens, right=name-token-ids, left-on=["token"], right-on=["token"]);
let function-tokens = select l."function" as "function", r."name" as "name", l."token" as "token", l."file" as "file", l."text" as "text" from body-tokens as l join named-functions as r on l."function" = r."id";
let fn-features = select * from named-functions where name = "features";
let tokens-features = select * from function-tokens where name = "features";
let fn-check = select * from named-functions where name = "check";
let tokens-check = select * from function-tokens where name = "check";
let fn-run = select * from named-functions where name = "run";
let tokens-run = select * from function-tokens where name = "run";
let fn-main = select * from named-functions where name = "main";
let tokens-main = select * from function-tokens where name = "main";
let have-fn-features = project(from=fn-features, columns=["file"]);
let no-fn-features = antijoin(left=runner-rows, right=have-fn-features, left-on=["file"], right-on=["file"]);
let no-fn-features-findings = extend(from=no-fn-features, values={"what": "declares no function `features`"});
let have-fn-check = project(from=fn-check, columns=["file"]);
let no-fn-check = antijoin(left=runner-rows, right=have-fn-check, left-on=["file"], right-on=["file"]);
let no-fn-check-findings = extend(from=no-fn-check, values={"what": "declares no function `check`"});
