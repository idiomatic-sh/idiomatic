description = "A core's use cases form one connected group: every use case reaches every other through the outbound ports, domain concepts and application services they name, directly or through other use cases."
why = "A core whose use cases fall into groups that share nothing is two cores in one crate: each group has its own vocabulary and its own outside world, and only a file growing past the length limit used to show it. A use case names a part when a file of its directory (`inbound/use_cases/<use case>/`) holds a written path the provider resolves to a file of `outbound/<port>/`, `domain/<concept>/` or `application/<service>/` of the same crate, or to that part's module file (`source-dependency`). Two use cases naming one part are joined; the groups are what joining reaches transitively. The finding is reported once for each core, at its `inbound/use_cases.rs`. A use case that calls no port but names a domain concept another use case names is in that use case's group, so a core whose read-only use cases describe the concepts its other use cases work on stays one group. Not seen: a dependency through a macro invocation's tokens or a glob import the provider cannot resolve to a file; the files of tests, fixtures, acceptance steps and benches, which are left out of the edges."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let dependencies = project(from="source-dependency", columns=["source", "target"]);
let kept = select * from dependencies where not glob_any(source, "{**/*_test.rs,**/tests/**,**/fixtures/**,**/fixtures.rs,**/benches/**,**/acceptance.rs}");
let from-use-case = capture(from=kept, path="source", pattern="{*root}/inbound/use_cases/{uc}/{*rest}", captures=["root", "uc", "rest"]);
let to-port = capture(from=from-use-case, path="target", pattern="{*troot}/outbound/{part}/{*trest}", captures=["troot", "part", "trest"]);
let to-port-module = capture(from=from-use-case, path="target", pattern="{*troot}/outbound/{part}.rs", captures=["troot", "part"]);
let to-concept = capture(from=from-use-case, path="target", pattern="{*troot}/domain/{part}/{*trest}", captures=["troot", "part", "trest"]);
let to-concept-module = capture(from=from-use-case, path="target", pattern="{*troot}/domain/{part}.rs", captures=["troot", "part"]);
let to-service = capture(from=from-use-case, path="target", pattern="{*troot}/application/{part}/{*trest}", captures=["troot", "part", "trest"]);
let to-service-module = capture(from=from-use-case, path="target", pattern="{*troot}/application/{part}.rs", captures=["troot", "part"]);
let port-rows-a = project(from=to-port, columns=["root", "uc", "troot", "part"]);
let port-rows-b = project(from=to-port-module, columns=["root", "uc", "troot", "part"]);
let port-rows = union(left=port-rows-a, right=port-rows-b);
let concept-rows-a = project(from=to-concept, columns=["root", "uc", "troot", "part"]);
let concept-rows-b = project(from=to-concept-module, columns=["root", "uc", "troot", "part"]);
let concept-rows = union(left=concept-rows-a, right=concept-rows-b);
let service-rows-a = project(from=to-service, columns=["root", "uc", "troot", "part"]);
let service-rows-b = project(from=to-service-module, columns=["root", "uc", "troot", "part"]);
let service-rows = union(left=service-rows-a, right=service-rows-b);
let port-named = extend(from=port-rows, values={"layer": "outbound"});
let concept-named = extend(from=concept-rows, values={"layer": "domain"});
let service-named = extend(from=service-rows, values={"layer": "application"});
let named-0 = union(left=port-named, right=concept-named);
let named-all = union(left=named-0, right=service-named);
let named = select * from named-all where root = troot;
let shared = select l."root" as "root", l."uc" as "left", r."uc" as "right" from named as l join named as r on l."root" = r."root" and l."layer" = r."layer" and l."part" = r."part";
let files = select * from tree-nodes where kind = "source-file";
let file-paths = project(from=files, columns=["id", "file", "span"]);
let modules = capture(from=file-paths, path="file", pattern="{*mroot}/inbound/use_cases/{module-use-case}.rs", captures=["mroot", "module-use-case"]);
let left-nodes = select l."root" as "root", l."right" as "right", r."id" as "from", r."mroot" as "mroot" from shared as l join modules as r on l."left" = r."module-use-case";
let left-here = select * from left-nodes where root = mroot;
let both-nodes = select l."root" as "root", l."from" as "from", r."id" as "to", r."mroot" as "mroot" from left-here as l join modules as r on l."right" = r."module-use-case";
let both-here = select * from both-nodes where root = mroot;
let edges = project(from=both-here, columns=["from", "to"]);
let reach = closure(edges=edges, source="from", destination="to");
let every-pair = select l."id" as "from", r."id" as "to", l."mroot" as "root" from modules as l join modules as r on l."mroot" = r."mroot";
let apart-pairs = select * from every-pair where from != to;
let unreached = antijoin(left=apart-pairs, right=reach, left-on=["from", "to"], right-on=["from", "to"]);
let apart-roots = project(from=unreached, columns=["root"]);
let lists = capture(from=file-paths, path="file", pattern="{*lroot}/inbound/use_cases.rs", captures=["lroot"]);
let split = select r."file" as "file", r."span" as "span" from apart-roots as l join lists as r on l."root" = r."lroot";
emit split subject "file" key("file");
'''

[diagnostic]
primary = "span"
message = "the use cases of this core fall into groups that share no port, domain concept or application service: the core is more than one hex"
help = "Split the core: move each group of use cases, with the ports, concepts and services only it names, into a core of its own, or, when the groups do belong together, name the concept they share in both."

[given]
include = ['**/*.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
pub mod inbound;
pub mod outbound;
'''
files.'src/inbound.rs' = '''
pub mod use_cases;
'''
files.'src/inbound/use_cases.rs' = '''
pub mod count;
pub mod greet;
'''
files.'src/inbound/use_cases/greet.rs' = '''
pub mod use_case;
'''
files.'src/inbound/use_cases/greet/use_case.rs' = '''
use crate::outbound::names::interface::NamesPort;

pub struct GreetUseCaseImpl {
    pub names: Box<dyn NamesPort>,
}
'''
files.'src/inbound/use_cases/count.rs' = '''
pub mod use_case;
'''
files.'src/outbound.rs' = '''
pub mod clock;
pub mod names;
'''
files.'src/outbound/names.rs' = '''
pub mod interface;
'''
files.'src/outbound/names/interface.rs' = '''
pub trait NamesPort {}
'''
files.'src/outbound/clock.rs' = '''
pub mod interface;
'''
files.'src/outbound/clock/interface.rs' = '''
pub trait ClockPort {}
'''

[[scenarios]]
id = 'two-groups'
scenario = 'Two use cases of one core name different ports and nothing else: the core is two hexes.'
given.files.'src/inbound/use_cases/count/use_case.rs' = '''
use crate::outbound::clock::interface::ClockPort;

pub struct CountUseCaseImpl {
    pub clock: Box<dyn ClockPort>,
}
'''
then.findings = [
  { path = 'src/inbound/use_cases.rs', line = 1 },
]

[[scenarios]]
id = 'one-group'
scenario = 'Two use cases of one core share a port: one connected group passes.'
given.files.'src/inbound/use_cases/count/use_case.rs' = '''
use crate::outbound::clock::interface::ClockPort;
use crate::outbound::names::interface::NamesPort;

pub struct CountUseCaseImpl {
    pub clock: Box<dyn ClockPort>,
    pub names: Box<dyn NamesPort>,
}
'''
