description = "A string literal (text, byte or C string) outside the paths that may hold text: inside the engine, names, kinds, columns and ids are enums and numbers, never text."
why = "Text inside the engine is the shape that costs the most: a name compared as a string is a typo no compiler sees, a column looked up by text is a lookup that fails at run time, and a string key is a hash of bytes where an enum is one integer. Text belongs only where it enters (RyoQL source, file paths from disk) or leaves (messages, CLI and SDK output). Every literal in a file outside `allowed-paths` is reported, except a literal inside an attribute (`#[error(\"..\")]`, `#[path = \"..\"]`, `#[cfg(feature = \"..\")]`), found by walking from the literal's token up to an `attr` node. A format macro written inside another macro's tokens (`vec![format!(\"..\")]`) is not parsed as a call: its template is recognised from the tokens, a token tree whose previous sibling is a `!` whose previous sibling is the macro's name. The format string of a format-family macro (`format`, `format_args`, `write`, `writeln`, `print`, `println`, `eprint`, `eprintln`, `panic`, `unreachable`, `todo`, `unimplemented`, `assert*`, `debug_assert*`, `info`, `warn`, `error`, `debug`, `trace`, and the span macros `span`, `info_span`, `debug_span`, `trace_span`, `warn_span`, `error_span`, whose first literal is the span's name in the trace that leaves the engine) is the output text that leaves the engine and is exempt: the first string literal directly in the macro call's token tree; a second literal or a literal in a normal call is reported. A byte string (`b\"..\"`, `br\"..\"`) and a C string (`c\"..\"`) are text like any other and are reported the same way. Not seen: a literal nested in a token subtree of a macro."

query = '''
param allowed-paths: set<string>;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let attrs = select * from tree-nodes where kind = "attr";
let tokens = select * from tree-tokens where glob_any(kind, "{string,byte-string,c-string}");
let literals = project(from=tokens, columns=["file", "span", "id"]);
let parents = select l."id" as "token", r."parent" as "id" from literals as l join "syntax-child" as r on l."id" = r."child";
let inside = axis(from=parents, relation="syntax-child", direction=ancestor, domain=attrs);
let inside-tokens = project(from=inside, columns=["token"]);
let bare = antijoin(left=literals, right=inside-tokens, left-on=["id"], right-on=["token"]);
let macro-names = select * from tree-tokens where kind = "ident";
let format-idents = select * from macro-names where glob_any(text, "{format,format_args,write,writeln,print,println,eprint,eprintln,panic,unreachable,todo,unimplemented,assert,assert_eq,assert_ne,debug_assert,debug_assert_eq,debug_assert_ne,info,warn,error,debug,trace,span,info_span,debug_span,trace_span,warn_span,error_span}");
let ident-parents = select l."id" as "token", r."parent" as "id" from format-idents as l join "syntax-child" as r on l."id" = r."child";
let macro-calls = select * from tree-nodes where kind = "macro-call";
let token-trees = select * from tree-nodes where kind = "token-tree";
let in-tokens = select l."token" as "token", l."id" as "id" from ident-parents as l join token-trees as r on l."id" = r."id";
let named-parents = antijoin(left=ident-parents, right=in-tokens, left-on=["token"], right-on=["token"]);
let format-calls = axis(from=named-parents, relation="syntax-child", direction=nearest-ancestor, domain=macro-calls);
let call-edges = select r."child" as "tree" from format-calls as l join "syntax-child" as r on l."related" = r."parent";
let parsed-format-trees = select l."tree" as "tree" from call-edges as l join token-trees as r on l."tree" = r."id";
let bangs = select * from tree-tokens where kind = "bang";
let tree-ids = project(from=token-trees, columns=["id"]);
let banged = axis(from=tree-ids, relation="syntax-child", direction=previous-sibling, domain=bangs);
let bang-ids = select l."related" as "id" from banged as l join bangs as r on l."related" = r."id";
let named-bangs = axis(from=bang-ids, relation="syntax-child", direction=previous-sibling, domain=format-idents);
let format-bangs = select l."id" as "bang" from named-bangs as l join format-idents as r on l."related" = r."id";
let nested-format-trees = select l."id" as "tree" from banged as l join format-bangs as r on l."related" = r."bang";
let format-trees = union(left=parsed-format-trees, right=nested-format-trees);
let in-tree = select l."id" as "token", r."parent" as "tree", r."ordinal" as "ordinal" from literals as l join "syntax-child" as r on l."id" = r."child";
let in-format = select l."token" as "token", l."tree" as "tree", l."ordinal" as "ordinal" from in-tree as l join format-trees as r on l."tree" = r."tree";
let pairs = select l."token" as "token", l."tree" as "tree", l."ordinal" as "ordinal", r."ordinal" as "before" from in-format as l join in-format as r on l."tree" = r."tree";
let later = select * from pairs where before < ordinal;
let later-tokens = project(from=later, columns=["token"]);
let template = antijoin(left=in-format, right=later-tokens, left-on=["token"], right-on=["token"]);
let allowed = select * from bare where glob_any(file, $allowed-paths);
let outside = antijoin(left=bare, right=allowed, left-on=["id"], right-on=["id"]);
let reported = antijoin(left=outside, right=template, left-on=["id"], right-on=["token"]);
emit reported subject "file" key("span");
'''

[params.allowed-paths]
type = "set<string>"
description = "Globs of the files that may hold text: the files that map an enum to its outside text, the error messages, the edges and the tests."

[diagnostic]
primary = "span"
message = "this string literal is text inside the engine"
help = "Use the enum or typed value; text belongs only where it enters or leaves."

[given]
include = ['**/*.rs']
params = { allowed-paths = ['**/constants.rs', '**/*_test.rs'] }

[[scenarios]]
id = 'bare-literal'
scenario = 'A bare literal in a domain item.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
//! A domain item that compares a kind as text.

pub fn is_function(kind: &str) -> bool {
    kind == "function"
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'literal-in-names'
scenario = 'A literal in a names file.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/constants.rs' = '''
//! The outside text of the enum.

pub enum Kind {
    Function,
}

pub fn name(kind: Kind) -> &'static str {
    match kind {
        Kind::Function => "function",
    }
}
'''
given.files.'src/lib.rs' = '''
//! The crate.

pub mod names;
'''

