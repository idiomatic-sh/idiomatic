[[scenarios]]
id = 'format-template'
scenario = 'The format string of a format-family macro.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
//! Formats.

pub fn describe(n: u32, f: &mut String) -> String {
    use std::fmt::Write;
    write!(f, "wrote {n}").ok();
    println!("done {}", n);
    panic_if(n);
    format!("value {n}")
}

fn panic_if(n: u32) {
    assert!(n < 9, "too big {n}");
}
'''

