description = "No `thread_local!` outside an adapter: a value that lives once per thread is process-global state, and only an adapter's job is to hold it."
why = "A `thread_local!` is hidden state: a function that reads it answers differently on another thread or after another call, and a test cannot set it up by passing a value. The code that decides how a program meets the machine is the adapter, so a per-thread cache or buffer lives behind a port in an adapter file, and everything else is given what it works on. Read syntactically: a macro call whose path is `thread_local` or ends in it (`std::thread_local!`), in any item or body of the files the entry selects; the entry leaves out the adapters, tests, benches and fixtures. Not seen: a macro that expands to a `thread_local!`, and the macro's name written through a `use` alias."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let idents = select * from tree-tokens where kind = "ident";
let names = select * from idents where glob_any(text, "thread_local");
let name-parents = select r."parent" as "id", l."file" as "file", l."span" as "span" from names as l join "syntax-child" as r on l."id" = r."child";
let name-refs = select * from tree-nodes where kind = "name-ref";
let refs = select l."id" as "id", l."file" as "file", l."span" as "span" from name-parents as l join name-refs as r on l."id" = r."id";
let macro-calls = select * from tree-nodes where kind = "macro-call";
let in-calls = axis(from=refs, relation="syntax-child", direction=ancestor, domain=macro-calls);
let found = select l."id" as "id", l."file" as "file", l."span" as "span" from refs as l join in-calls as r on l."id" = r."id";
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`thread_local!` outside an adapter"
help = "Move the per-thread value into an adapter behind a port, or pass it as a value to what needs it."

[given]
include = ['**/*.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'module-level'
scenario = 'A thread_local! beside the domain.'
given.files.'src/lib.rs' = '''
use std::cell::RefCell;

thread_local! {
    static COUNT: RefCell<u8> = const { RefCell::new(0) };
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 3 },
]

[[scenarios]]
id = 'qualified-in-a-body'
scenario = 'Std::thread_local! in a function.'
given.files.'src/lib.rs' = '''
pub fn count() {
    std::thread_local!(static X: u8 = 0);
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 2 },
]

[[scenarios]]
id = 'in-an-adapter'
scenario = 'An adapter holds its per-thread value.'
given.exclude = ['**/adapters/**']
given.files.'src/lib.rs' = '''
pub mod outbound;
'''
given.files.'src/outbound/cache/adapters/local/adapter.rs' = '''
use std::cell::RefCell;

thread_local! {
    static COUNT: RefCell<u8> = const { RefCell::new(0) };
}
'''

[[scenarios]]
id = 'the-name-as-text'
scenario = 'The name in a string and a comment.'
given.files.'src/lib.rs' = '''
pub fn describe() -> &'static str {
    "thread_local is not used here"
}

/// Says why there is no thread_local! in this crate.
pub fn why() {}
'''
