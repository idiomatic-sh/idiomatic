[[scenarios]]
id = 'closure-handed-to-a-library'
scenario = 'A closure handed straight to a library takes the parameter the library fixes.'
given.include = ['**/*.rs']
given.params = { libraries = ['minijinja::*'], allowed-paths = ['**/constants.rs', '**/errors.rs'] }
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
//! Cell.

use minijinja::Environment;

pub struct Name(pub String);

pub fn filters(environment: &mut Environment<'_>) {
    environment.add_filter("wrap", |x: &str| {
        let _ = Name(x.to_owned());
    });
}
'''
