description = "No Rust source file lies on a cycle of semantic written-path dependencies between two or more source files."
why = "Files that name each other's modules in a ring cannot be read, tested or moved one at a time: a change to any of them reaches all of them. Edges are the provider's source dependencies (a written path in one file naming a module another file owns), after excluding only occurrences whose exact file and span identify a path inside a visibility restriction. A visibility path names the scope that restricts access, not data or work consumed by the file. Other occurrences of the same path, including imports, types and calls, remain dependencies. These semantic edges are mapped onto each file's syntax root so the engine's cycle search runs over entities. A file on a cycle is reported once, at its root. Not seen: a cycle through a macro invocation's tokens or through a glob import the provider cannot resolve to a file; a file naming its own modules is no edge."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let paths = select * from tree-nodes where kind = "path";
let visibilities = select * from tree-nodes where kind = "visibility";
let visibility-children = axis(from=visibilities, relation="syntax-child", direction=descendant, domain=paths);
let restrictions = select r.file as source, r.span as span from visibility-children as l join paths as r on l.related = r.id;
let written-dependencies = select source, target, span from "source-dependency";
let semantic-dependencies = antijoin(left=written-dependencies, right=restrictions, left-on=["source", "span"], right-on=["source", "span"]);
let dependencies = project(from=semantic-dependencies, columns=["source", "target"]);
let foreign = select * from dependencies where source != target;
let files = select * from tree-nodes where kind = "source-file";
let from-files = select r."id" as "from", l."target" as "target" from foreign as l join files as r on l."source" = r."file";
let edges = select l."from" as "from", r."id" as "to" from from-files as l join files as r on l."target" = r."file";
let cycles = cycles(edges=edges, source="from", destination="to");
let cyclic-files = select r."file" as "file", r."span" as "span" from cycles as l join files as r on l."from" = r."id";
emit cyclic-files subject "file" key("file");
'''

[diagnostic]
primary = "span"
message = "`{file}` lies on a cycle of module dependencies"
help = "Break the ring: move what the files share into a module both depend on, or invert one dependency."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
mod first;
mod second;
'''

files.'src/second.rs' = 'pub struct Second;'

[[scenarios]]
id = 'two-files-name-each-other-s-modules'
scenario = "Two files name each other's modules."
given.files.'src/first.rs' = '''
use crate::second::Second;

pub struct First(pub Option<Box<Second>>);
'''
given.files.'src/second.rs' = '''
use crate::first::First;

pub struct Second(pub Option<Box<First>>);
'''
then.findings = [
  { path = 'src/first.rs', line = 1 },
  { path = 'src/second.rs', line = 1 },
]

[[scenarios]]
id = 'dependencies-run-one-way'
scenario = 'Dependencies run one way.'
given.files.'src/first.rs' = '''
use crate::second::Second;

pub struct First(pub Second);
'''
given.files.'src/second.rs' = '''
pub struct Second;
'''

[[scenarios]]
id = "explicit-owner-visibility-is-not-a-consumer-dependency"
scenario = "A parent may own a child type whose explicit visibility names that parent without creating semantic dependency in the child."
given.files.'src/first.rs' = 'pub mod child; pub struct First(pub child::Child);'
given.files.'src/first/child.rs' = 'pub(in crate::first) struct Child;'

[[scenarios]]
id = "ancestor-visibility-keeps-private-storage-acyclic"
scenario = "An ancestor-qualified access restriction does not make immutable child storage depend on its owner's workflow."
given.files.'src/first.rs' = 'pub mod child; pub struct First(pub child::Child);'
given.files.'src/first/child.rs' = 'pub(in super) struct Child;'

[[scenarios]]
id = "super-visibility-keeps-private-storage-acyclic"
scenario = "The short super restriction also names access scope rather than a consumed type."
given.files.'src/first.rs' = 'pub mod child; pub struct First(pub child::Child);'
given.files.'src/first/child.rs' = 'pub(super) struct Child;'

[[scenarios]]
id = "self-visibility-is-not-a-consumer-dependency"
scenario = "Explicit self scope is harmless while real semantic dependencies still point in one direction."
given.files.'src/first.rs' = 'pub mod child; pub struct First;'
given.files.'src/first/child.rs' = 'pub(in self) struct Child(pub crate::first::First);'

[[scenarios]]
id = "same-owner-path-in-field-still-closes-the-cycle"
scenario = "Only the visibility occurrence is excluded; the same owner path in an actual field type still creates a cycle."
given.files.'src/first.rs' = 'pub mod child; pub struct First(pub child::Child);'
given.files.'src/first/child.rs' = 'pub(in crate::first) struct Child(pub Option<Box<crate::first::First>>);'
then.findings = [{ path = "src/first.rs", line = 1 }, { path = "src/first/child.rs", line = 1 }]

[[scenarios]]
id = "same-owner-path-in-call-still-closes-the-cycle"
scenario = "A visibility restriction cannot hide a real call back to the parent workflow."
given.files.'src/first.rs' = 'pub mod child; pub fn run() { child::run(); }'
given.files.'src/first/child.rs' = 'pub(in crate::first) fn run() { crate::first::run(); }'
then.findings = [{ path = "src/first.rs", line = 1 }, { path = "src/first/child.rs", line = 1 }]

[[scenarios]]
id = "aliased-import-still-closes-the-cycle"
scenario = "An aliased real import remains a dependency even alongside an identical visibility scope."
given.files.'src/first.rs' = 'pub mod child; pub struct First(pub child::Child);'
given.files.'src/first/child.rs' = 'use crate::first::First as Parent; pub(in crate::first) struct Child(pub Option<Box<Parent>>);'
then.findings = [{ path = "src/first.rs", line = 1 }, { path = "src/first/child.rs", line = 1 }]

[[scenarios]]
id = "new-module-real-import-is-not-exempt"
scenario = "A newly declared module receives no file-level exemption for restricting access to its parent."
given.files.'src/first.rs' = 'pub mod future; pub struct First(pub future::Child);'
given.files.'src/first/future.rs' = 'use super::First; pub(in super) struct Child(pub Option<Box<First>>);'
then.findings = [{ path = "src/first.rs", line = 1 }, { path = "src/first/future.rs", line = 1 }]
