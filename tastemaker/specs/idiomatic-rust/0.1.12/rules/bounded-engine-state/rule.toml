given.files.'src/outbound/lint_store/adapters/memory/types.rs' = '''
use std::sync::Mutex;

#[derive(Default)]
pub struct KeptStores(Mutex<Vec<u8>>);

impl KeptStores {
    pub fn keep(&self, store: u8) {
        let mut kept = self.0.lock().unwrap_or_else(std::sync::PoisonError::into_inner);
        if kept.len() == super::constants::KEPT_STORES {
            kept.remove(0);
        }
        kept.push(store);
    }

    pub fn len(&self) -> usize {
        self.0.lock().unwrap_or_else(std::sync::PoisonError::into_inner).len()
    }
}
'''
