description = "Retained interior-mutable state in a use case, adapter or application operation requires an owning named cache, bound constant and colocated test reference. This is structural evidence, not proof that a cap is enforced."
why = "Operations can live across invocations, workers or sessions. Retained state needs an explicit owner and lifetime; an invocation-local lock is not retained state. Roots are use-case implementations, adapters and every struct in application/<operation>/service.rs, including FileAnalysis and CrossFile rather than only names ending in Service. Follow their own types.rs transitively. Named cache/constant/test references provide structural evidence only: executed cap, error and concurrency tests remain required, and naming alone does not prove memory safety, a numerical bound or speed. Atomic counters and owned set-once cells retain their existing exemptions; opaque foreign state in a set-once cell remains reported."

query = '''
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let idents = select * from tree-tokens where kind = "ident";
let structs = select d."id" as "id", d."name" as "name", d."file" as "file", d."span" as "span" from "defines" as d where d."kind" = "struct";
let placed = capture(from=structs, path="file", pattern="{*dir}/{base}.rs", captures=["dir", "base"]);
let use-cases = select u."id" as "id", u."name" as "name", u."file" as "file", u."span" as "span", u."dir" as "dir", u."base" as "base" from placed as u where u."base" = "use_case" and ends_with(u."name", "UseCaseImpl");
let adapters = select a."id" as "id", a."name" as "name", a."file" as "file", a."span" as "span", a."dir" as "dir", a."base" as "base" from placed as a where a."base" = "adapter" and ends_with(a."name", "Adapter");
let service-placed = capture(from=placed, path="file", pattern="{*root}/application/{operation}/service.rs", captures=["root", "operation"]);
let services = select s."id" as "id", s."name" as "name", s."file" as "file", s."span" as "span", s."dir" as "dir", s."base" as "base" from service-placed as s;
let edge-engines = union(left=use-cases, right=adapters);
let engines = union(left=edge-engines, right=services);
let kept-types = select * from placed where base = "types";
let engine-nodes = select e."id" as "id", e."name" as "name", e."dir" as "dir" from engines as e;
let type-nodes = select k."id" as "id", k."name" as "name", k."dir" as "dir" from kept-types as k;
let nodes = union(left=engine-nodes, right=type-nodes);
let node-tokens = axis(from=nodes, relation="syntax-child", direction=descendant, domain=idents);
let written = select l."id" as "owner", l."dir" as "dir", r."text" as "text" from node-tokens as l join idents as r on l."related" = r."id";
let names = select k."id" as "kept", k."name" as "name", k."dir" as "dir" from kept-types as k;
let edges = select w."owner" as "owner", n."kept" as "kept" from written as w join names as n on w."dir" = n."dir" and w."text" = n."name";
let reach = closure(edges=edges, source="owner", destination="kept");
let reached = select r."kept" as "kept" from reach as r join engine-nodes as e on r."owner" = e."id";
let held = select n."kept" as "id", n."name" as "name", n."dir" as "dir" from reached as r join names as n on r."kept" = n."kept";
let holders = union(left=engine-nodes, right=held);
let locks = select * from idents where glob_any(text, "{Mutex,RwLock,RefCell,Cell}");
let inside = axis(from=holders, relation="syntax-child", direction=descendant, domain=locks);
let cell-names = select * from idents where glob_any(text, "{OnceLock,OnceCell,LazyLock,LazyCell}");
let cells-inside = axis(from=holders, relation="syntax-child", direction=descendant, domain=cell-names);
let cell-at = select r."id" as "id", l."id" as "holder", l."dir" as "dir", r."file" as "file", r."span" as "span" from cells-inside as l join cell-names as r on l."related" = r."id";
let segments = select * from "syntax-tree" as s where s."kind" = "path-segment";
let cell-segments = axis(from=cell-at, relation="syntax-child", direction=ancestor, domain=segments);
let segment-of = select c."related" as "id", a."holder" as "holder", a."dir" as "dir", a."file" as "file", a."span" as "span" from cell-segments as c join cell-at as a on c."id" = a."id";
let cell-contents = axis(from=segment-of, relation="syntax-child", direction=descendant, domain=idents);
let content-tokens = select c."id" as "id", r."text" as "text" from cell-contents as c join idents as r on c."related" = r."id";
let content-names = select s."holder" as "holder", s."dir" as "dir", s."file" as "file", s."span" as "span", c."text" as "text" from content-tokens as c join segment-of as s on c."id" = s."id";
let deps = select d."binding" as "text" from "package-dependency" as d;
let import-nodes = select s."occurrence" as "id", s."binding" as "binding", s."file" as "file" from "static-import" as s;
let import-tokens = axis(from=import-nodes, relation="syntax-child", direction=descendant, domain=idents);
let import-words = select l."binding" as "binding", l."file" as "file", r."text" as "text" from import-tokens as l join idents as r on l."related" = r."id";
let imported = select w."binding" as "text", w."file" as "file" from import-words as w join deps as d on w."text" = d."text";
let by-path = select c."file" as "file", c."span" as "span" from content-names as c join deps as d on c."text" = d."text";
let by-import = select c."file" as "file", c."span" as "span" from content-names as c join imported as i on c."text" = i."text" and c."file" = i."file";
let foreign = union(left=by-path, right=by-import);
let foreign-cells = project(from=foreign, columns=["file", "span"]);
let mutable = select l."id" as "holder", l."name" as "name", l."dir" as "dir", r."file" as "file", r."span" as "span" from inside as l join locks as r on l."related" = r."id";
let constants = select d."name" as "name", d."file" as "file" from "defines" as d where d."kind" = "constant";
let bounds = capture(from=constants, path="file", pattern="{*dir}/constants.rs", captures=["dir"]);
let bounded = select m."holder" as "holder", m."name" as "name", c."name" as "bound", m."dir" as "dir" from mutable as m join bounds as c on m."dir" = c."dir" where snake(m."name") = snake(c."name");
let test-tokens = capture(from=idents, path="file", pattern="{*dir}/{base}_test.rs", captures=["dir", "base"]);
let naming-bound = select b."holder" as "holder", b."dir" as "dir", b."name" as "name" from bounded as b join test-tokens as t on b."dir" = t."dir" and b."bound" = t."text";
let covered = select n."holder" as "holder" from naming-bound as n join test-tokens as t on n."dir" = t."dir" and n."name" = t."text";
let unbounded = antijoin(left=mutable, right=covered, left-on=["holder"], right-on=["holder"]);
let found-locks = project(from=unbounded, columns=["file", "span"]);
let found = union(left=found-locks, right=foreign-cells);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this operation retains interior-mutable state without an owning named cache, bound and colocated test reference"
help = "Keep per-call state in a local of the call. State kept across calls goes in a type named for what it keeps, in the hex's `types.rs`, bounded by a constant of the same name in its `constants.rs` (`CompiledPlans` and `COMPILED_PLANS`), and a colocated test names the cache and the constant. These names are structural evidence only; execute cap, error and concurrency tests to prove the bound."

[given]
include = ['**/src/inbound/use_cases/*/*.rs', '**/src/outbound/*/adapters/*/*.rs', '**/src/application/*/*.rs']
files.'Cargo.toml' = '''
