[[scenarios]]
id = 'a-bounded-named-cache'
scenario = 'A use case that holds a named cache, which drops a plan before it would hold more than the constant of its name, and a test of the hex that keeps more than the bound and finds the cache at it, is not reported.'
given.files.'src/inbound/use_cases/lint/fixtures/contract.rs' = '''
pub const CASES: &[u8] = &[];
'''
given.files.'src/inbound/use_cases/lint/use_case.rs' = '''
pub struct LintUseCaseImpl {
    compiled: super::types::CompiledPlans,
    workers: u8,
}
'''
given.files.'src/inbound/use_cases/lint/types.rs' = '''
use std::collections::VecDeque;
use std::sync::{Arc, Mutex};

#[derive(Default)]
pub struct CompiledPlans(Arc<Mutex<VecDeque<(u64, u64)>>>);

impl CompiledPlans {
    pub fn keep(&self, digest: u64, plan: u64) {
        let mut plans = self.0.lock().unwrap_or_else(std::sync::PoisonError::into_inner);
        plans.retain(|(kept, _)| *kept != digest);
        if plans.len() == super::constants::COMPILED_PLANS {
            plans.pop_front();
        }
        plans.push_back((digest, plan));
    }

    pub fn len(&self) -> usize {
        self.0.lock().unwrap_or_else(std::sync::PoisonError::into_inner).len()
    }
}
'''
given.files.'src/inbound/use_cases/lint/constants.rs' = '''
pub const COMPILED_PLANS: usize = 4096;
'''
given.files.'src/inbound/use_cases/lint/use_case_test.rs' = '''
#[test]
fn keeping_more_plans_than_the_bound_holds_the_bound() {
    let plans = super::types::CompiledPlans::default();
    let over = u64::try_from(super::constants::COMPILED_PLANS).unwrap_or(u64::MAX) + 1;
    for digest in 0..over {
        plans.keep(digest, digest);
    }
    assert_eq!(plans.len(), super::constants::COMPILED_PLANS);
}
'''

