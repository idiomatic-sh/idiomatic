description = "No field of a domain type is a `dyn Fn`, `dyn FnMut`, `dyn FnOnce` or `fn(..)` pointer: behaviour is a port or a function of a service, and a domain value is data."
why = "A domain type is what the program knows, and it is compared, copied, printed and sent between threads. A closure or a function pointer in a field is none of those: it cannot be compared or printed, it hides a dependency inside a value, and a caller cannot see what the value will do. What varies is named as a port (a trait the core declares and an adapter implements) or a variant of an enum that a service matches on. Found from the fields of structs, tuple structs and enum variants (the record fields and tuple fields of the files the entry selects): a field whose type holds a `dyn` type bounded by `Fn`, `FnMut` or `FnOnce`, or a function-pointer type (`fn(..)`), at any depth of a generic. The entry selects the domain's files and leaves out tests and fixtures. Not seen: a type behind an alias, and a field written inside a macro invocation's tokens."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let idents = select * from tree-tokens where kind = "ident";
let closure-names = select * from idents where glob_any(text, "{Fn,FnMut,FnOnce}");
let name-parents = select r."parent" as "id" from closure-names as l join "syntax-child" as r on l."id" = r."child";
let name-refs = select * from tree-nodes where kind = "name-ref";
let closure-refs = select l."id" as "id" from name-parents as l join name-refs as r on l."id" = r."id";
let dyns = select * from tree-nodes where kind = "dyn-trait-type";
let ref-dyns = axis(from=closure-refs, relation="syntax-child", direction=ancestor, domain=dyns);
let callable-dyns = select r."id" as "id", r."file" as "file", r."span" as "span" from ref-dyns as l join dyns as r on l."related" = r."id";
let fn-pointers = select * from tree-nodes where kind = "fn-ptr-type";
let pointers = project(from=fn-pointers, columns=["id", "file", "span"]);
let callables = union(left=callable-dyns, right=pointers);
let fields = select * from tree-nodes where glob_any(kind, "{record-field,tuple-field}");
let in-fields = axis(from=callables, relation="syntax-child", direction=ancestor, domain=fields);
emit in-fields subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this field of a domain type holds a function"
help = "Name what varies as a port the core declares, or as an enum a service matches on; a domain type holds data only."

[given]
include = ['**/src/domain/**/*.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'boxed-closure-field'
scenario = 'A boxed Fn in a struct field.'
given.files.'src/domain/rule/types.rs' = '''
pub struct Rule {
    pub check: Box<dyn Fn(u8) -> bool + Send>,
}
'''
then.findings = [
  { path = 'src/domain/rule/types.rs', line = 2 },
]

[[scenarios]]
id = 'fn-pointer-field'
scenario = 'A fn pointer in a struct field.'
given.files.'src/domain/rule/types.rs' = '''
pub struct Rule {
    pub check: fn(u8) -> u8,
}
'''
then.findings = [
  { path = 'src/domain/rule/types.rs', line = 2 },
]

[[scenarios]]
id = 'variant-field'
scenario = 'A dyn FnMut in an enum variant.'
given.files.'src/domain/rule/types.rs' = '''
use std::sync::Arc;

pub enum Step {
    Run(Arc<dyn FnMut()>),
    Skip,
}
'''
then.findings = [
  { path = 'src/domain/rule/types.rs', line = 4 },
]

[[scenarios]]
id = 'fn-pointer-in-a-generic'
scenario = 'A fn pointer nested in a generic.'
given.files.'src/domain/rule/types.rs' = '''
pub struct Table {
    pub rows: Vec<fn(u8) -> u8>,
}
'''
then.findings = [
  { path = 'src/domain/rule/types.rs', line = 2 },
]

[[scenarios]]
id = 'data-fields'
scenario = 'Data, a port object and a function parameter.'
given.files.'src/domain/rule/types.rs' = '''
pub struct Rule {
    pub name: u8,
    pub port: std::sync::Arc<dyn Checker>,
}

pub trait Checker {
    fn check(&self, value: u8) -> u8;
}

pub fn apply(rule: &Rule, run: &dyn Fn(u8) -> u8) -> u8 {
    run(rule.name)
}
'''
