description = "No struct, enum, union or trait is named like an item of the standard prelude listed in `names`."
why = "A type named `Result` or `Option` shadows the prelude's in every module that imports it, so `Result<T, E>` there means something a reader does not expect (clippy has no lint for it). The names are the entry's `names`; the declarations are the provider's `defines` rows of the struct, enum, union and trait kinds. Not seen: a type alias, a const or a static, which the relation does not list, and a method or variable of a prelude name, which shadows nothing a reader looks up by type."

query = '''
param names: set<string>;
let types = select * from "defines" where glob_any(kind, "{struct,enum,union,trait}");
let shadowing = select * from types where name in $names;
emit shadowing subject "file" key("span");
'''

[params.names]
type = "set<string>"
description = "The prelude item names a type must not take (such as the Rust 2021 prelude's types, traits and variants)."

[diagnostic]
primary = "span"
message = "{kind} `{name}` shadows the prelude's `{name}`"
help = "Give it a name of its own, such as the domain word it stands for."

[given]
include = ['**']
params = { names = ['Option', 'Result', 'Some', 'None', 'Ok', 'Err', 'Vec', 'String', 'Box', 'Clone', 'Default', 'Iterator'] }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
mod code;
'''

[[scenarios]]
id = 'own-names'
scenario = 'Types with names of their own.'
given.files.'src/lib.rs' = '''
pub struct Outcome;
pub enum Mode {
    None,
    Some,
}
pub fn clone() -> Outcome {
    let Vec = 1;
    let _ = Vec;
    Outcome
}
'''

[[scenarios]]
id = 'struct-named-result'
scenario = 'A struct named Result.'
given.files.'src/code.rs' = '''
pub struct Result;
'''
then.findings = [
  { path = 'src/code.rs', line = 1 },
]

[[scenarios]]
id = 'trait-named-iterator'
scenario = 'A trait named Iterator.'
given.files.'src/code.rs' = '''
pub trait Iterator {}
'''
then.findings = [
  { path = 'src/code.rs', line = 1 },
]
