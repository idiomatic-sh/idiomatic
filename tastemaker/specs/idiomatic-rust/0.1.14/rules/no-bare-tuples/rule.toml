name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
//! Cell.

use minijinja::Environment;

pub struct Pair(pub (u8, u8));

pub fn filters(environment: &mut Environment<'_>) {
    environment.add_filter("wrap", |x: (u8, u8)| {
        let _ = Pair(x);
    });
}
'''
