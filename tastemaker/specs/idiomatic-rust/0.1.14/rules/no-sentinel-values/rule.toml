description = "A field of a configuration value (`request`, `settings`, `config`, `options`, `session`, `args`) is not compared to `0` or `\"\"` with `==` or `!=`: a value that can be absent is an `Option` or an enum that says so."
why = "`if settings.workers == 0 { default }` makes zero mean \"not set\": a caller who means zero cannot say it, and the next reader must know the convention. Absence is a type: an `Option<Workers>` or a two-variant enum, resolved to the default once, where the value enters. Found from the `==` and `!=` expressions in the files the entry includes that compare a field of a configuration value (a field access whose chain names `request`, `settings`, `config`, `options`, `session` or `args`, as `request.workers`) to the literal `0` (with or without a suffix) or to `\"\"`. Not seen: a field of another value (`self.children == 0` is a count), a comparison to a constant, a method call (`len() == 0`), a pattern in a `match`, and a variable compared to zero."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let bins = select * from tree-nodes where kind = "bin-expr";
let ops = select * from tree-tokens where glob_any(kind, "{eq2,neq}");
let fields = select * from tree-nodes where kind = "field-expr";
let literals = select * from tree-nodes where kind = "literal";
let zeros = select * from tree-tokens where glob_any(text, "{0,0_*,0u*,0i*}");
let empties = select * from tree-tokens where kind = "string" and glob_any(text, "??");
let bin-kids = select l."id" as "bin", r."child" as "child" from bins as l join "syntax-child" as r on l."id" = r."parent";
let with-op = select l."bin" as "bin" from bin-kids as l join ops as r on l."child" = r."id";
let name-refs = select * from tree-nodes where kind = "name-ref";
let bin-fields = select l."bin" as "bin", r."id" as "id" from bin-kids as l join fields as r on l."child" = r."id";
let field-names = axis(from=bin-fields, relation="syntax-child", direction=descendant, domain=name-refs);
let name-kids = select l."bin" as "bin", r."child" as "child" from field-names as l join "syntax-child" as r on l."related" = r."parent";
let configs = select * from tree-tokens where glob_any(text, "{request,settings,config,options,session,args}");
let with-field = select l."bin" as "bin" from name-kids as l join configs as r on l."child" = r."id";
let bin-literals = select l."bin" as "bin", r."id" as "literal" from bin-kids as l join literals as r on l."child" = r."id";
let literal-kids = select l."bin" as "bin", r."child" as "child" from bin-literals as l join "syntax-child" as r on l."literal" = r."parent";
let zero-bins = select l."bin" as "bin" from literal-kids as l join zeros as r on l."child" = r."id";
let empty-bins = select l."bin" as "bin" from literal-kids as l join empties as r on l."child" = r."id";
let sentinel-bins = union(left=zero-bins, right=empty-bins);
let compared = select l."bin" as "bin" from with-op as l join with-field as r on l."bin" = r."bin";
let sentinels = select l."bin" as "bin" from compared as l join sentinel-bins as r on l."bin" = r."bin";
let found = select r."file" as "file", r."span" as "span" from sentinels as l join bins as r on l."bin" = r."id";
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this field is compared to `0` or `\"\"` to mean `not set`"
help = "Make the value an `Option` (or an enum with a `Default` variant) and resolve it to the default where it enters, so zero and the empty text mean themselves."

[given]
include = ['**/*.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'zero-means-default'
scenario = 'A number compared to zero.'
given.files.'src/lib.rs' = '''
//! Workers.

pub fn workers(settings: &Settings) -> usize {
    if settings.workers == 0 {
        4
    } else {
        settings.workers
    }
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'empty-means-default'
scenario = 'A text compared to the empty string.'
given.files.'src/lib.rs' = '''
//! Names.

pub fn named(request: &Request) -> bool {
    request.name != ""
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'absence-is-a-type'
scenario = 'An option, a length and a variable.'
given.files.'src/lib.rs' = '''
//! Absence.

pub fn workers(settings: &Settings, items: &[u8], count: usize) -> bool {
    settings.workers.is_none() || items.len() == 0 || count == 0
}
'''

[[scenarios]]
id = 'a-count-is-not-config'
scenario = 'A field of another value.'
given.files.'src/lib.rs' = '''
//! Counts.

pub fn empty(this: &Node) -> bool {
    this.children == 0
}
'''
