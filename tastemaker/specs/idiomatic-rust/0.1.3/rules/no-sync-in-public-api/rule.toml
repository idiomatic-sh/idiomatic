description = "A public function's parameters and return type name no `Arc`, `Mutex` or `RwLock`, at any depth of a generic."
why = "How a value is shared across threads is the owner's decision, and a signature that says `Arc<Mutex<State>>` makes it every caller's: they must hold an `Arc`, lock a `Mutex`, and can no longer be changed to another way of sharing without breaking each of them. The public surface speaks in the values and ports the domain names; the owner of a value wraps it where it is built. Found from the parameter list and the return type of every function declared `pub` (not `pub(crate)`) and of every function of a `pub` trait: a type whose last path segment is `Arc`, `Mutex` or `RwLock`, directly or as an argument of a generic. Not seen: an `Arc<dyn Port>`, which is how a use case holds the ports it is given and so what its constructor takes, a type behind an alias, a field of a public struct, and a function of an impl on a private type."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let segments = select * from tree-nodes where kind = "path-segment";
let name-refs = select * from tree-nodes where kind = "name-ref";
let idents = select * from tree-tokens where kind = "ident";
let paths = select * from tree-nodes where kind = "path";
let path-types = select * from tree-nodes where kind = "path-type";
let visibilities = select * from tree-nodes where kind = "visibility";
let inners = select * from tree-nodes where kind = "visibility-inner";
let sig-kinds = select * from tree-nodes where glob_any(kind, "{param-list,ret-type}");
let fns = select * from tree-nodes where kind = "fn";
let traits = select * from tree-nodes where kind = "trait";
let fn-kids = select l."id" as "fn", r."child" as "child" from fns as l join "syntax-child" as r on l."id" = r."parent";
let fn-vis = select l."fn" as "fn", r."id" as "vis" from fn-kids as l join visibilities as r on l."child" = r."id";
let trait-kids = select l."id" as "trait", r."child" as "child" from traits as l join "syntax-child" as r on l."id" = r."parent";
let trait-vis = select l."trait" as "trait", r."id" as "vis" from trait-kids as l join visibilities as r on l."child" = r."id";
let vis-kids = select l."id" as "vis", r."child" as "child" from visibilities as l join "syntax-child" as r on l."id" = r."parent";
let restricted = select l."vis" as "vis" from vis-kids as l join inners as r on l."child" = r."id";
let pub-fn-vis = antijoin(left=fn-vis, right=restricted, left-on=["vis"], right-on=["vis"]);
let pub-trait-vis = antijoin(left=trait-vis, right=restricted, left-on=["vis"], right-on=["vis"]);
let pub-traits = select l."id" as "id", l."file" as "file", l."span" as "span", l."kind" as "kind" from traits as l join pub-trait-vis as r on l."id" = r."trait";
let trait-fns = axis(from=pub-traits, relation="syntax-child", direction=descendant, domain=fns);
let trait-fn-ids = select l."related" as "fn" from trait-fns as l join trait-fns as r on l."related" = r."related";
let own-fn-ids = select l."fn" as "fn" from pub-fn-vis as l join pub-fn-vis as r on l."fn" = r."fn";
let public-fn-ids = union(left=own-fn-ids, right=trait-fn-ids);
let public-fn-kids = select l."fn" as "fn", r."child" as "child" from public-fn-ids as l join "syntax-child" as r on l."fn" = r."parent";
let sigs = select r."id" as "id", r."file" as "file", r."span" as "span", r."kind" as "kind" from public-fn-kids as l join sig-kinds as r on l."child" = r."id";
let inner = axis(from=sigs, relation="syntax-child", direction=descendant, domain=path-types);
let types = select r."id" as "type", r."file" as "file", r."span" as "span", r."id" as "node" from inner as l join path-types as r on l."related" = r."id";
let p0-c = select l."type" as "type", l."file" as "file", l."span" as "span", r."child" as "node" from types as l join "syntax-child" as r on l."node" = r."parent";
let p0 = select l."type" as "type", l."file" as "file", l."span" as "span", r."id" as "node" from p0-c as l join paths as r on l."node" = r."id";
let p1-c = select l."type" as "type", l."file" as "file", l."span" as "span", r."child" as "node" from p0 as l join "syntax-child" as r on l."node" = r."parent";
let p1 = select l."type" as "type", l."file" as "file", l."span" as "span", r."id" as "node" from p1-c as l join segments as r on l."node" = r."id";
let p2-c = select l."type" as "type", l."file" as "file", l."span" as "span", r."child" as "node" from p1 as l join "syntax-child" as r on l."node" = r."parent";
let p2 = select l."type" as "type", l."file" as "file", l."span" as "span", r."id" as "node" from p2-c as l join name-refs as r on l."node" = r."id";
let ident-edges = select l."type" as "type", l."file" as "file", l."span" as "span", r."child" as "node" from p2 as l join "syntax-child" as r on l."node" = r."parent";
let arc-names = select * from idents where glob_any(text, "Arc");
let lock-names = select * from idents where glob_any(text, "{Mutex,RwLock}");
let dyns = select * from tree-nodes where kind = "dyn-trait-type";
let arcs = select l."type" as "id", l."file" as "file", l."span" as "span" from ident-edges as l join arc-names as r on l."node" = r."id";
let locks = select l."type" as "id", l."file" as "file", l."span" as "span" from ident-edges as l join lock-names as r on l."node" = r."id";
let arc-ports = axis(from=arcs, relation="syntax-child", direction=descendant, domain=dyns);
let arc-port-ids = project(from=arc-ports, columns=["id"]);
let shared-values = antijoin(left=arcs, right=arc-port-ids, left-on=["id"], right-on=["id"]);
let found = union(left=shared-values, right=locks);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this public signature names `Arc`, `Mutex` or `RwLock`"
help = "Take or return the value or the port the domain names; wrap it in an `Arc` or a lock where it is built, not in what a caller must write."

[given]
include = ['**/*.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'arc-parameter'
scenario = 'A shared parameter: it is reported.'
given.files.'src/lib.rs' = '''
//! A runner.

use std::sync::{Arc, Mutex};

pub fn run(shared: Arc<Mutex<u8>>) {
    drop(shared);
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 5 },
  { path = 'src/lib.rs', line = 5 },
]

[[scenarios]]
id = 'lock-returned'
scenario = 'A lock returned: it is reported.'
given.files.'src/lib.rs' = '''
