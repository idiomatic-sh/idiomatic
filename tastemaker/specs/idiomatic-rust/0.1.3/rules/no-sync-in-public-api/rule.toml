[[scenarios]]
id = 'not-public'
scenario = 'A private and a crate-visible function.'
given.files.'src/lib.rs' = '''
//! Private.

use std::sync::Arc;

fn run(shared: Arc<u8>) {
    drop(shared);
}

pub(crate) fn walk(shared: Arc<u8>) {
    drop(shared);
}

trait Hidden {
    fn get(&self) -> Arc<u8>;
}
'''

[[scenarios]]
id = 'body-only'
scenario = 'A lock used only in a body.'
given.files.'src/lib.rs' = '''
//! A body.

use std::sync::Arc;

pub fn run() -> u8 {
    let shared = Arc::new(1_u8);
    *shared
}
'''

[[scenarios]]
id = 'arc-of-a-port'
scenario = 'A port held in an Arc, as a use case is given it.'
given.files.'src/lib.rs' = '''
//! A use case.

use std::sync::Arc;

pub trait Port {}

pub struct Lint;

impl Lint {
    pub fn new(port: Arc<dyn Port>) -> Self {
        drop(port);
        Self
    }
}
'''
