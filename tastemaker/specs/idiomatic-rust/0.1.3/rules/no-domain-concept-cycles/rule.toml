description = "No domain concept lies on a cycle of imports between domain concepts: concept A may not reach concept B through its files when B reaches A through its own."
why = "Concepts that name each other in a ring cannot be read, tested or moved one at a time: a change to any of them reaches all of them, and the DTO or port that would break the ring is missing. The rule starts at zero at `error` with no baseline. A concept is a directory `domain/<concept>` with its module file `domain/<concept>.rs`; an edge runs from the concept of a source file to the concept of the file whose module it names (a written path the provider resolves to a file: `source-dependency`), between two different concepts of one crate. Many files of one concept naming each other is no edge. The finding is reported once for each concept on a cycle, at its module file. `module-cycles` (info) keeps reporting rings between files of any directory. Not seen: a dependency through a macro invocation's tokens or a glob import the provider cannot resolve to a file; the files of tests, fixtures and benches, which are left out of the edges."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let dependencies = project(from="source-dependency", columns=["source", "target"]);
let foreign = select * from dependencies where source != target;
let kept-sources = select * from foreign where not glob_any(source, "{**/*_test.rs,**/tests/**,**/fixtures/**,**/fixtures.rs,**/benches/**}");
let kept = select * from kept-sources where not glob_any(target, "{**/*_test.rs,**/tests/**,**/fixtures/**,**/fixtures.rs,**/benches/**}");
let from-tagged = capture(from=kept, path="source", pattern="{*sroot}/domain/{sconcept}/{*srest}", captures=["sroot", "sconcept", "srest"]);
let to-directory = capture(from=from-tagged, path="target", pattern="{*troot}/domain/{tconcept}/{*trest}", captures=["troot", "tconcept", "trest"]);
let to-module = capture(from=from-tagged, path="target", pattern="{*troot}/domain/{tconcept}.rs", captures=["troot", "tconcept"]);
let directory-edges = project(from=to-directory, columns=["sroot", "sconcept", "troot", "tconcept"]);
let module-edges = project(from=to-module, columns=["sroot", "sconcept", "troot", "tconcept"]);
let concept-edges = union(left=directory-edges, right=module-edges);
let between = select * from concept-edges where sconcept != tconcept;
let same-crate = select * from between where sroot = troot;
let files = select * from tree-nodes where kind = "source-file";
let file-paths = project(from=files, columns=["id", "file"]);
let reps = capture(from=file-paths, path="file", pattern="{*rroot}/domain/{rconcept}.rs", captures=["rroot", "rconcept"]);
let from-reps = select l."sroot" as "sroot", l."troot" as "troot", l."tconcept" as "tconcept", r."id" as "from", r."rroot" as "frroot" from same-crate as l join reps as r on l."sconcept" = r."rconcept";
let from-here = select * from from-reps where sroot = frroot;
let to-reps = select l."from" as "from", l."troot" as "troot", r."id" as "to", r."rroot" as "trroot" from from-here as l join reps as r on l."tconcept" = r."rconcept";
let to-here = select * from to-reps where troot = trroot;
let edges = project(from=to-here, columns=["from", "to"]);
let cyclic = cycles(edges=edges, source="from", destination="to");
let cyclic-files = select r."file" as "file", r."span" as "span" from cyclic as l join files as r on l."from" = r."id";
emit cyclic-files subject "file" key("file");
'''

[diagnostic]
primary = "span"
message = "the domain concept of `{file}` lies on a cycle of imports between domain concepts"
help = "Break the ring now, with no baseline: move what the concepts share into a concept both depend on, hand one of them the value as a parameter, or give the data crossing the boundary a plain type of its own."

[given]
include = ['**/*.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/domain.rs' = '''
mod alpha;
mod beta;
'''
files.'src/domain/alpha.rs' = '''
mod types;
'''
files.'src/domain/alpha/types.rs' = '''
use crate::domain::beta::types::Beta;

pub struct Alpha {
    pub beta: Option<Box<Beta>>,
}
'''
files.'src/domain/beta.rs' = '''
mod types;
'''
files.'src/domain/beta/types.rs' = '''
use crate::domain::alpha::types::Alpha;

pub struct Beta {
    pub alpha: Option<Box<Alpha>>,
}
'''
files.'src/lib.rs' = '''
mod domain;
'''

[[scenarios]]
id = 'two-cycle'
scenario = 'Two concepts name each other.'
then.findings = [
  { path = 'src/domain/alpha.rs', line = 1 },
  { path = 'src/domain/beta.rs', line = 1 },
]

[[scenarios]]
id = 'three-cycle'
scenario = 'Three concepts name each other in a ring.'
given.files.'src/domain.rs' = '''
mod alpha;
mod beta;
mod gamma;
'''
given.files.'src/domain/beta/types.rs' = '''
use crate::domain::gamma::types::Gamma;

pub struct Beta {
    pub gamma: Option<Box<Gamma>>,
}
'''
given.files.'src/domain/gamma.rs' = '''
mod types;
'''
given.files.'src/domain/gamma/types.rs' = '''
use crate::domain::alpha::types::Alpha;

pub struct Gamma {
    pub alpha: Option<Box<Alpha>>,
}
'''
then.findings = [
  { path = 'src/domain/alpha.rs', line = 1 },
  { path = 'src/domain/beta.rs', line = 1 },
  { path = 'src/domain/gamma.rs', line = 1 },
]

[[scenarios]]
id = 'acyclic-chain'
scenario = 'Concepts name each other one way.'
given.files.'src/domain.rs' = '''
mod alpha;
mod beta;
mod gamma;
'''
given.files.'src/domain/beta/types.rs' = '''
use crate::domain::gamma::types::Gamma;

pub struct Beta {
    pub gamma: Option<Box<Gamma>>,
}
'''
given.files.'src/domain/gamma.rs' = '''
mod types;
'''
given.files.'src/domain/gamma/types.rs' = '''

pub struct Gamma {
}
'''

[[scenarios]]
id = 'files-of-one-concept'
scenario = 'The files of one concept name each other.'
given.files.'src/domain/alpha.rs' = '''
mod service;
mod types;
'''
given.files.'src/domain/alpha/service.rs' = '''
use crate::domain::alpha::types::Alpha;

pub fn make() -> Option<Alpha> {
    None
}
pub mod make;
'''
given.files.'src/domain/alpha/service/make.rs' = '''
//! Stub.

pub fn stub() {}
'''
given.files.'src/domain/alpha/types.rs' = '''
use crate::domain::alpha::service::make;

pub struct Alpha(pub Option<Box<Alpha>>);

pub fn again() {
    let _ = make();
}
'''

[[scenarios]]
id = 'test-closes-a-ring'
scenario = 'A test of one concept names the concept that names it.'
given.files.'src/domain/alpha.rs' = '''
mod types;

#[cfg(test)]
mod types_test;
'''
given.files.'src/domain/alpha/types.rs' = '''

pub struct Alpha {
}
'''
given.files.'src/domain/alpha/types_test.rs' = '''
use crate::domain::beta::types::Beta;

#[test]
fn names_beta() {
    let _ = std::mem::size_of::<Beta>();
}
'''
