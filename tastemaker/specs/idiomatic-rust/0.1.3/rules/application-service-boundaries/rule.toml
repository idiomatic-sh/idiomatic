description = "An application operation does not depend on a sibling operation of the same crate; use cases compose operations."
why = "Each service owns cohesive work and its related structures, rather than becoming an interdependent service graph. This reads resolved source-dependency edges, covering crate, super and fully qualified paths to a sibling service directory or module file. Own service types/errors, domain functions and outbound contracts remain allowed. A use case may call application, domain and outbound directly. Test/fixture/acceptance/bench sources and targets are excluded. Macro token dependencies and unresolved glob paths are not observed; source structure alone does not prove semantic cohesion or a performance improvement."
query = '''
let nodes = select s."file" as "file", s."span" as "span" from "syntax-tree" as s where s."kind" = "source-file" and s."text" = "";
let dependencies = project(from="source-dependency", columns=["source", "target"]);
let source-kept = select * from dependencies where not glob_any(source, "{**/*_test.rs,**/tests/**,**/fixtures/**,**/fixtures.rs,**/acceptance.rs,**/benches/**}");
let kept = select * from source-kept where not glob_any(target, "{**/*_test.rs,**/tests/**,**/fixtures/**,**/fixtures.rs,**/acceptance.rs,**/benches/**}");
let from-directory = capture(from=kept, path="source", pattern="{*root}/application/{owner}/{*rest}", captures=["root", "owner", "rest"]);
let from-module = capture(from=kept, path="source", pattern="{*root}/application/{owner}.rs", captures=["root", "owner"]);
let directory-origins = project(from=from-directory, columns=["source", "target", "root", "owner"]);
let module-origins = project(from=from-module, columns=["source", "target", "root", "owner"]);
let origins = union(left=directory-origins, right=module-origins);
let rooted = select * from origins where glob_any(root, "{src,**/src}");
let to-directory = capture(from=rooted, path="target", pattern="{*target_root}/application/{other}/{*target_rest}", captures=["target_root", "other", "target_rest"]);
let to-module = capture(from=rooted, path="target", pattern="{*target_root}/application/{other}.rs", captures=["target_root", "other"]);
let directory-targets = project(from=to-directory, columns=["source", "root", "owner", "target_root", "other"]);
let module-targets = project(from=to-module, columns=["source", "root", "owner", "target_root", "other"]);
let targets = union(left=directory-targets, right=module-targets);
let forbidden = select * from targets where root = target_root and owner != other;
let paths = project(from=forbidden, columns=["source"]);
let found = select n."file" as "file", n."span" as "span" from paths as p join nodes as n on p."source" = n."file";
emit found subject "file" key("span");
'''
[diagnostic]
primary = 'span'
message = 'this application operation depends on a sibling application operation'
help = 'Compose operations from a use case. Keep this operation dependent on its own related parts, domain functions and outbound contracts.'
[given]
include = ['**/*.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = 'pub mod application; pub mod domain; pub mod outbound; pub mod inbound;'
files.'src/application.rs' = 'pub mod alpha; pub mod beta;'
files.'src/application/alpha.rs' = 'pub mod service; pub mod types;'
files.'src/application/beta.rs' = 'pub mod service; pub mod types;'
files.'src/application/alpha/service.rs' = 'pub fn run() -> u8 { crate::domain::value::read() }'
files.'src/application/alpha/types.rs' = 'pub struct Owned(pub u8);'
files.'src/application/beta/service.rs' = 'pub fn run() -> u8 { 1 }'
files.'src/application/beta/types.rs' = 'pub struct Other(pub u8);'
files.'src/domain.rs' = 'pub mod value;'
files.'src/domain/value.rs' = 'pub fn read() -> u8 { 1 }'
files.'src/outbound.rs' = 'pub mod store;'
files.'src/outbound/store.rs' = 'pub mod interface;'
files.'src/outbound/store/interface.rs' = 'pub trait Store { fn read(&self) -> u8; }'
files.'src/inbound.rs' = 'pub mod use_cases;'
files.'src/inbound/use_cases.rs' = 'pub mod lint;'
files.'src/inbound/use_cases/lint.rs' = 'pub mod use_case;'
files.'src/inbound/use_cases/lint/use_case.rs' = 'pub fn run() -> u8 { crate::domain::value::read() }'

[[scenarios]]
id = 'crate-path-to-sibling-service'
scenario = 'A resolved crate path to another operation is reported.'
given.files.'src/application/alpha/service.rs' = 'use crate::application::beta::service; pub fn run() -> u8 { service::run() }'
then.findings = [{ path = 'src/application/alpha/service.rs', line = 1 }]

[[scenarios]]
id = 'fully-qualified-path-to-sibling-service'
scenario = 'A fully qualified call cannot bypass the boundary.'
given.files.'src/application/alpha/service.rs' = 'pub fn run() -> u8 { crate::application::beta::service::run() }'
then.findings = [{ path = 'src/application/alpha/service.rs', line = 1 }]

[[scenarios]]
id = 'super-path-to-sibling-service'
scenario = 'A relative module path names the same forbidden dependency.'
given.files.'src/application/alpha/service.rs' = 'pub fn run() -> u8 { super::super::beta::service::run() }'
then.findings = [{ path = 'src/application/alpha/service.rs', line = 1 }]

[[scenarios]]
id = 'sibling-module-file-is-also-owned'
scenario = 'A sibling module file is another operation, including its types.'
given.files.'src/application/beta.rs' = 'pub mod service; pub mod types; pub struct Marker;'
given.files.'src/application/alpha/service.rs' = 'use crate::application::beta::Marker; pub fn run(_: Marker) -> u8 { 1 }'
then.findings = [{ path = 'src/application/alpha/service.rs', line = 1 }]

[[scenarios]]
id = 'own-types-domain-and-outbound-contract'
scenario = 'One operation may use its own data, domain functions and outbound contracts.'
given.files.'src/application/alpha/service.rs' = 'use super::types::Owned; use crate::outbound::store::interface::Store; pub fn run(value: Owned, store: &dyn Store) -> u8 { value.0 + store.read() + crate::domain::value::read() }'

[[scenarios]]
id = 'use-case-orchestrates-directly'
scenario = 'Use cases may call services, domain and outbound directly.'
given.files.'src/inbound/use_cases/lint/use_case.rs' = 'use crate::outbound::store::interface::Store; pub fn run(store: &dyn Store) -> u8 { crate::application::alpha::service::run() + crate::application::beta::service::run() + crate::domain::value::read() + store.read() }'

[[scenarios]]
id = 'test-and-fixture-dependencies-are-not-runtime-edges'
scenario = 'Test and fixture helpers may compose the operations they prove.'
given.files.'src/application/alpha/service_test.rs' = 'pub fn probe() -> u8 { crate::application::beta::service::run() }'
given.files.'src/application/alpha/fixtures.rs' = 'pub fn probe() -> u8 { crate::application::beta::service::run() }'
