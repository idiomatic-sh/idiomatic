description = "A program writes to stdout and stderr only through its presentation layer, the command line's `output` module (and its `timings` report): no other file names `stdout` or `stderr` of `std::io` or `anstream`, called, passed as a writer or imported."
why = "Where a program's output goes, how it is styled, quieted, paged and turned into an outcome is decided in one place, the command line's `output` module, so every command answers the same way and a test can read what was said. A write to `std::io::stderr()` from anywhere else (a panic hook, a command, a core) bypasses `--quiet`, the format and the colour switch, and ends up untested; it goes through `output` instead. The timings report (`timings.rs`, `timings/`) is the second presenter: a diagnostic written on stderr by design. clippy's `print_stdout` and `print_stderr` and the `print-in-library` rule hold the print macros; this rule holds the handles they do not see. Where a program owns its streams outright (`main.rs`, build scripts, tests, benches, fixtures) is the entry's `exclude`. Read from the paths written: a call, a path passed as a value and an import whose path ends in `stdout` or `stderr` under `std::io`, `io` or `anstream`. Not seen: a handle reached through a renamed import or another crate's wrapper, a handle called by its bare imported name inside a macro's arguments (its import is still reported), and a method of that name on a child process (`child.stdout()`), which is no path."

query = '''
let calls = project(from="static-call", columns=["file", "span", "target"]);
let references = project(from="reference", columns=["file", "span", "target"]);
let imports = project(from="static-import", columns=["file", "span", "target"]);
let written-0 = union(left=calls, right=references);
let written = union(left=written-0, right=imports);
let streams = select * from written where glob_any(target, "{std::io::stdout,std::io::stderr,::std::io::stdout,::std::io::stderr,io::stdout,io::stderr,anstream::stdout,anstream::stderr,::anstream::stdout,::anstream::stderr}");
let bare-imported = select l."file" as "file" from imports as l where glob_any(l."target", "{std::io::stdout,std::io::stderr,io::stdout,io::stderr,anstream::stdout,anstream::stderr}");
let bare-written = select * from calls where glob_any(target, "{stdout,stderr}");
let bare = select l."file" as "file", l."span" as "span", l."target" as "target" from bare-written as l join bare-imported as r on l."file" = r."file";
let found = union(left=streams, right=bare);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{target}` writes to a standard stream outside the presentation layer"
help = "Say it through the command line's `output` module (add the function there, beside `fail` and `present`), and call that from here."

[given]
include = ['src/**']
exclude = ['src/output.rs', 'src/output/**', 'src/timings.rs', 'src/timings/**', '**/*_test.rs', '**/tests/**', '**/benches/**', '**/fixtures/**', '**/fixtures.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
pub mod output;
pub mod resources;
'''

[[scenarios]]
id = 'streams-only-in-output'
scenario = 'The output module writes to stdout and stderr; a command calls it.'
given.files.'src/output.rs' = '''
use std::io::Write as _;

pub fn say(text: &str) {
    let _ = writeln!(std::io::stdout(), "{text}");
}

pub fn panicked() {
    let _ = writeln!(anstream::stderr().lock(), "error: internal error");
}
'''
given.files.'src/resources.rs' = '''
pub fn run() {
    crate::output::say("done");
    std::panic::set_hook(Box::new(|_| crate::output::panicked()));
}
'''

[[scenarios]]
id = 'streams-outside-output'
scenario = 'A command writes to stderr and stdout itself, through every written form: it is reported at each.'
given.files.'src/output.rs' = '''
use std::io::Write as _;

pub fn say(text: &str) {
    let _ = writeln!(std::io::stdout(), "{text}");
}

pub fn panicked() {
    let _ = writeln!(anstream::stderr().lock(), "error: internal error");
}
'''
given.files.'src/resources.rs' = '''
use std::io::Write as _;
use std::io::stdout;

pub fn run() {
    let _ = writeln!(std::io::stderr(), "error: internal error");
    let mut out = stdout();
    let _ = writeln!(out, "done");
    let _ = writeln!(anstream::stdout().lock(), "done");
    install(std::io::stderr);
}

fn install<W>(_writer: fn() -> W) {}
'''
then.findings = [
  { path = 'src/resources.rs', line = 2 },
  { path = 'src/resources.rs', line = 5 },
  { path = 'src/resources.rs', line = 6 },
  { path = 'src/resources.rs', line = 8 },
  { path = 'src/resources.rs', line = 9 },
]

[[scenarios]]
id = 'child-process-streams-pass'
scenario = 'A method named `stdout` on a child process is not a standard stream.'
given.files.'src/lib.rs' = '''
pub mod run;
'''
given.files.'src/run.rs' = '''
pub fn drain(child: &mut std::process::Child) -> bool {
    child.stdout.take().is_some() && child.stderr.take().is_some()
}
'''
