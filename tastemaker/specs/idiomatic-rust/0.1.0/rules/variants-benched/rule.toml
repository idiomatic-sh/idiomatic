description = "A hex whose `factory.rs` builds two or more adapters, a `recorded` one aside, has `benches/performance/<hex>/bench.rs` in its crate, and that workload names every one of those factory functions."
why = "Adapters are the variants of a port: when a hex has several, its crate's workload for that hex runs every one on the same inputs, back to back in one compiled bench, so the faster one is chosen by measurement and the slower deleted. A factory function is how an edge names an adapter, so a workload naming each one runs each one. `recorded` is the capture decorator over another adapter, not a variant. A function name counts as named when an identifier of the bench file spells it. A crate is a directory holding a `Cargo.toml`, and a factory belongs to the nearest one above it, so a nested crate owns its own hexes. A workload that exists but names a factory function nowhere is reported at the workload, for each function it misses."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let functions = select * from tree-nodes where kind = "fn";
let function-parents = select r."parent" as "parent", l."id" as "function", l."file" as "file" from functions as l join "syntax-child" as r on l."id" = r."child";
let source-files = select * from tree-nodes where kind = "source-file";
let top-functions = select l."function" as "function", l."file" as "file" from function-parents as l join source-files as r on l."parent" = r."id";
let function-children = select r."child" as "child", l."function" as "function", l."file" as "file" from top-functions as l join "syntax-child" as r on l."function" = r."parent";
let names = select * from tree-nodes where kind = "name";
let function-name-nodes = select l."file" as "file", r."id" as "namenode" from function-children as l join names as r on l."child" = r."id";
let function-name-edges = select r."child" as "child", l."file" as "file" from function-name-nodes as l join "syntax-child" as r on l."namenode" = r."parent";
let named-functions = select r."text" as "name", l."file" as "file" from function-name-edges as l join tree-tokens as r on l."child" = r."id";
let deep-rows = capture(from=named-functions, path="file", pattern="{*crate}/src/{*parent}/{hex}/factory.rs", captures=["crate", "parent", "hex"]);
let deep = project(from=deep-rows, columns=["file", "name", "crate", "hex"]);
let flat-rows = capture(from=named-functions, path="file", pattern="{*crate}/src/{hex}/factory.rs", captures=["crate", "hex"]);
let flat = project(from=flat-rows, columns=["file", "name", "crate", "hex"]);
let root-deep-rows = capture(from=named-functions, path="file", pattern="src/{*parent}/{hex}/factory.rs", captures=["parent", "hex"]);
let root-deep-crates = extend(from=root-deep-rows, values={"crate": ""});
let root-deep = project(from=root-deep-crates, columns=["file", "name", "crate", "hex"]);
let root-flat-rows = capture(from=named-functions, path="file", pattern="src/{hex}/factory.rs", captures=["hex"]);
let root-flat-crates = extend(from=root-flat-rows, values={"crate": ""});
let root-flat = project(from=root-flat-crates, columns=["file", "name", "crate", "hex"]);
let nested = union(left=deep, right=flat);
let rooted = union(left=root-deep, right=root-flat);
let candidates = union(left=nested, right=rooted);
let manifests = project(from=listed-files, columns=["file"]);
let nested-manifests = capture(from=manifests, path="file", pattern="{*crate}/Cargo.toml", captures=["crate"]);
let nested-crates = project(from=nested-manifests, columns=["crate"]);
let root-manifests = select * from manifests where glob_any(file, "Cargo.toml");
let root-manifest-crates = extend(from=root-manifests, values={"crate": ""});
let root-crates = project(from=root-manifest-crates, columns=["crate"]);
let crates = union(left=nested-crates, right=root-crates);
let owned = select l."crate" as "crate", l."hex" as "hex", l."name" as "name", l."file" as "file" from candidates as l join crates as r on l."crate" = r."crate";
let candidate-pairs = select r."crate" as "inner", l."crate" as "outer", l."file" as "file" from owned as l join owned as r on l."file" = r."file";
let deeper-pairs = select * from candidate-pairs where outer < inner;
let shadowed = project(from=deeper-pairs, columns=["file", "outer"]);
let factories = antijoin(left=owned, right=shadowed, left-on=["file", "crate"], right-on=["file", "outer"]);
let decorators = select * from factories where name = "recorded";
let variants = antijoin(left=factories, right=decorators, left-on=["file", "name"], right-on=["file", "name"]);
let variant-counts = group-count(from=variants, keys=["file", "crate", "hex"], count="variants", distinct="name");
let several = select * from variant-counts where variants >= 2;
let identifiers = select * from tree-tokens where kind = "ident";
let nested-bench-rows = capture(from=identifiers, path="file", pattern="{*crate}/benches/performance/{workload}/bench.rs", captures=["crate", "workload"]);
let nested-bench = project(from=nested-bench-rows, columns=["file", "text", "crate", "workload"]);
let root-bench-rows = capture(from=identifiers, path="file", pattern="benches/performance/{workload}/bench.rs", captures=["workload"]);
let root-bench-crates = extend(from=root-bench-rows, values={"crate": ""});
let root-bench = project(from=root-bench-crates, columns=["file", "text", "crate", "workload"]);
let bench-identifiers = union(left=nested-bench, right=root-bench);
let files = project(from=listed-files, columns=["file"]);
let nested-bench-files = capture(from=files, path="file", pattern="{*crate}/benches/performance/{workload}/bench.rs", captures=["crate", "workload"]);
let nested-benches = project(from=nested-bench-files, columns=["file", "crate", "workload"]);
let root-bench-files = capture(from=files, path="file", pattern="benches/performance/{workload}/bench.rs", captures=["workload"]);
let root-bench-file-crates = extend(from=root-bench-files, values={"crate": ""});
let root-benches = project(from=root-bench-file-crates, columns=["file", "crate", "workload"]);
let benches = union(left=nested-benches, right=root-benches);
let unbenched-hexes = antijoin(left=several, right=benches, left-on=["crate", "hex"], right-on=["crate", "workload"]);
let unbenched-rows = project(from=unbenched-hexes, columns=["file", "hex"]);
let unbenched-labelled = extend(from=unbenched-rows, values={"problem": "builds several adapters, and its crate has no benches/performance/<hex>/bench.rs running them back to back"});
let unbenched-named = extend(from=unbenched-labelled, values={"name": ""});
let unbenched = project(from=unbenched-named, columns=["file", "hex", "problem", "name"]);
let benched-hexes = select l."crate" as "crate", l."hex" as "hex", r."file" as "bench" from several as l join benches as r on l."crate" = r."crate" and l."hex" = r."workload";
let benched-variants = select l."crate" as "crate", l."hex" as "hex", l."name" as "name", r."bench" as "file" from variants as l join benched-hexes as r on l."crate" = r."crate" and l."hex" = r."hex";
let unnamed-variants = antijoin(left=benched-variants, right=bench-identifiers, left-on=["crate", "hex", "name"], right-on=["crate", "workload", "text"]);
let unnamed-labelled = extend(from=unnamed-variants, values={"problem": "has a workload that never runs the adapter of its factory function "});
let unnamed = project(from=unnamed-labelled, columns=["file", "hex", "problem", "name"]);
let findings = union(left=unbenched, right=unnamed);
emit findings subject "file" key("file", "hex", "name");
'''

[diagnostic]
primary = "file"
message = "the `{hex}` hex {problem}{name}"
help = "Write benches/performance/<hex>/bench.rs with `#[divan::bench(args = Variant::ALL)]`, where each `Variant` builds its adapter through the hex's factory function, over the hex's fixture cases and the crate's captures; keep the winner in the command's composition and delete the others in the same change."

[given]
include = ['**']

[[scenarios]]
id = 'hex-two-adapters-workload-naming-both-factory'
scenario = 'A hex with two adapters and a workload naming both factory functions.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'benches/performance/storage/bench.rs' = '''
#[derive(Clone, Copy, Debug)]
enum Variant {
    Memory,
    Disk,
}

fn build(variant: Variant) -> Box<dyn demo::storage::interface::StorageInterface> {
    match variant {
        Variant::Memory => Box::new(demo::storage::factory::memory()),
        Variant::Disk => Box::new(demo::storage::factory::disk()),
    }
}
'''
given.files.'src/lib.rs' = '''
pub mod storage;
'''
given.files.'src/storage/factory.rs' = '''
use super::adapters::{disk::StorageDiskAdapter, memory::StorageMemoryAdapter};
use super::interface::StorageInterface;

pub fn memory() -> impl StorageInterface {
    StorageMemoryAdapter::new()
}

pub fn disk() -> impl StorageInterface {
    StorageDiskAdapter::new()
}
'''

