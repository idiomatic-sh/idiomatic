description = "A hex's adapters module: one module per captured implementation."
why = "Lists each implementation of the hex's port as a module, so every adapter directory is compiled and none hides outside the hex."
content = '''
//! The {{ port }} port's implementations, one module each.
{% for implementation in captures.implementation | default([]) %}
pub(super) mod {{ implementation }};
{%- endfor %}
'''

[params]
port = { type = "identifier", from = "directory-name", description = "The outbound port, the directory the file sits in." }

[given]
file = 'adapters.rs'
params = { port = 'names' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'adapters.rs' = '''
//! The names port's implementations, one module each.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'adapters.rs' = '''
//! The names port's implementations, one module each.


// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'adapters#count', path = '.' },
]
