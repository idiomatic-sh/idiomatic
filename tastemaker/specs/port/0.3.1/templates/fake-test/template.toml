description = "The proof of a port's fake, beside the fake: the fake runs the port's contract."
why = "A fake is a second implementation of the port, so it passes the same contract every adapter does: `fixtures/fake_test.rs` calls the contract's `check` with the fake, so a fake that answers differently from an adapter is found by its own test, not by a use case that trusted it. It stands beside `fixtures/fake.rs`, which declares it as its test module (`module-declares`)."
content = '''
//! The `{{ part }}` port's fake runs the port's contract.

use super::super::contract::check;
use super::{{ part | pascal }}Fake;

#[test]
fn succeeds() {
    check(&{{ part | pascal }}Fake);
}
'''

[params]
part = { type = "identifier", from = "directory-name", description = "The port's directory name: the stem of every name in it." }

[given]
file = 'fixtures/fake_test.rs'
params = { part = 'names' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'fixtures/fake_test.rs' = '''
//! The `names` port's fake runs the port's contract.

use super::super::contract::check;
use super::NamesFake;

#[test]
fn succeeds() {
    check(&NamesFake);
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'fake-test#count', path = '.' },
]
