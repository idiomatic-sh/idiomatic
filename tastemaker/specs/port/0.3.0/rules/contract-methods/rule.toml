description = "A port's contract, `fixtures/contract.rs`, calls every method the port trait in `interface.rs` declares."
why = "The contract is what holds every adapter and every fake to the port, so a method it never calls is a promise no implementation is held to. A method counts through a method-call expression or a named invocation followed by parenthesized arguments inside a macro token tree. A same-named field, local or constant is not a call. Calls hidden in another file are not inferred; runtime substitution proofs establish that the supplied adapter is the implementation exercised. The contract is read beside its own `interface.rs` only: another port's contract never counts. A part without `fixtures/contract.rs` has no contract to complete; the port spec requires one of every port."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select l."child" as "child" from "syntax-child" as l join source-files as r on l."parent" = r."id";
let top-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from tree-nodes as l join top-edges as r on l."id" = r."child";
let all-traits = select * from top-nodes where kind = "trait";
let traits = capture(from=all-traits, path="file", pattern="{*hex}/interface.rs", captures=["hex"]);
let trait-list-edges = select r."child" as "child", l."id" as "trait", l."hex" as "hex" from traits as l join "syntax-child" as r on l."id" = r."parent";
let item-lists = select * from tree-nodes where kind = "assoc-item-list";
let trait-lists = select r."id" as "list", l."hex" as "hex" from trait-list-edges as l join item-lists as r on l."child" = r."id";
let trait-fn-edges = select r."child" as "child", l."hex" as "hex" from trait-lists as l join "syntax-child" as r on l."list" = r."parent";
let fn-nodes = select * from tree-nodes where kind = "fn";
let trait-fns = select r."id" as "fn", l."hex" as "hex" from trait-fn-edges as l join fn-nodes as r on l."child" = r."id";
let fn-name-edges = select r."child" as "child", l."hex" as "hex" from trait-fns as l join "syntax-child" as r on l."fn" = r."parent";
let names = select * from tree-nodes where kind = "name";
let fn-name-nodes = select r."id" as "name", l."hex" as "hex" from fn-name-edges as l join names as r on l."child" = r."id";
let fn-name-token-edges = select r."child" as "token", l."hex" as "hex" from fn-name-nodes as l join "syntax-child" as r on l."name" = r."parent";
let methods = select r."text" as "method", l."hex" as "hex" from fn-name-token-edges as l join tree-tokens as r on l."token" = r."id";
let contracts = capture(from=listed-files, path="file", pattern="{*hex}/fixtures/contract.rs", captures=["hex"]);
let required = select l."method" as "method", l."hex" as "hex", r."file" as "file" from methods as l join contracts as r on l."hex" = r."hex";
let contract-nodes = capture(from=tree-nodes, path="file", pattern="{*hex}/fixtures/contract.rs", captures=["hex"]);
let method-calls = select * from contract-nodes where kind = "method-call-expr";
let method-name-edges = select l."hex" as "hex", r."child" as "child" from method-calls as l join "syntax-child" as r on l."id" = r."parent";
let name-refs = select * from tree-nodes where kind = "name-ref";
let method-names = select l."hex" as "hex", r."id" as "name" from method-name-edges as l join name-refs as r on l."child" = r."id";
let method-token-edges = select l."hex" as "hex", r."child" as "token" from method-names as l join "syntax-child" as r on l."name" = r."parent";
let ordinary-called = select l."hex" as "hex", r."text" as "method" from method-token-edges as l join tree-tokens as r on l."token" = r."id";
let token-trees = select * from contract-nodes where kind = "token-tree";
let token-children = select l."hex" as "hex", l."id" as "tree", r."child" as "child", r."ordinal" as "ordinal" from token-trees as l join "syntax-child" as r on l."id" = r."parent";
let significant-tokens = select * from tree-tokens where not glob_any(kind, "{whitespace,comment}");
let token-parts = select l."hex" as "hex", l."tree" as "tree", l."ordinal" as "ordinal", r."text" as "text" from token-children as l join significant-tokens as r on l."child" = r."id";
let groups = select l."hex" as "hex", l."tree" as "tree", l."ordinal" as "ordinal", r."id" as "group" from token-children as l join token-trees as r on l."child" = r."id";
let group-start-edges = select l."group" as "group", r."child" as "child" from groups as l join "syntax-child" as r on l."group" = r."parent";
let parens = select * from tree-tokens where text = "(";
let call-groups = select l."group" as "group" from group-start-edges as l join parens as r on l."child" = r."id";
let arguments = select l."hex" as "hex", l."tree" as "tree", l."ordinal" as "after" from groups as l join call-groups as r on l."group" = r."group";
let named-tokens = select l."hex" as "hex", l."tree" as "tree", l."ordinal" as "before", l."text" as "method" from token-parts as l join required as r on l."hex" = r."hex" and l."text" = r."method";
let possible = select l."hex" as "hex", l."tree" as "tree", l."before" as "before", l."method" as "method", r."after" as "after" from named-tokens as l join arguments as r on l."tree" = r."tree" where before < after;
let between-tokens = select l."tree" as "tree", l."before" as "before", l."after" as "after", r."ordinal" as "between" from possible as l join token-parts as r on l."tree" = r."tree";
let intervening = select * from between-tokens where before < between and between < after;
let adjacent = antijoin(left=possible, right=intervening, left-on=["tree", "before", "after"], right-on=["tree", "before", "after"]);
let macro-called = project(from=adjacent, columns=["hex", "method"]);
let qualified-calls = capture(from="static-call", path="target", pattern="{*qualifier}::{method}", captures=["qualifier", "method"]);
let qualified-in-contract = capture(from=qualified-calls, path="file", pattern="{*hex}/fixtures/contract.rs", captures=["hex"]);
let qualified-called = project(from=qualified-in-contract, columns=["hex", "method"]);
let parsed-called = union(left=ordinary-called, right=qualified-called);
let called = union(left=parsed-called, right=macro-called);
let missing = antijoin(left=required, right=called, left-on=["hex", "method"], right-on=["hex", "method"]);
emit missing subject "file" key("file", "method");
'''

[diagnostic]
primary = "file"
message = "the contract never calls the port's `{method}`"
help = "Call `{method}` in this fixtures/contract.rs's `check`, asserting what the port promises of it, so every adapter and every fake is held to it. An ignore is never the fix: a method the contract cannot call is a method no implementation is held to."

[[scenarios]]
id = 'a-method-name-is-not-an-execution'
scenario = 'A method name in the contract file, without a call, is not an execution of the contract and is reported.'
given.files.'src/outbound/read/fixtures/contract.rs' = 'pub fn check(adapter: &impl ReadPort) { let read = 3; let _ = (read, adapter); }'
given.files.'src/outbound/read/interface.rs' = 'pub trait ReadPort { fn read(&self); }'
then.findings = [
  { path = 'src/outbound/read/fixtures/contract.rs' },
]

[[scenarios]]
id = 'a-method-call-in-an-assertion'
scenario = 'A method call inside an assertion executes the contract and is not reported.'
given.files.'src/outbound/read/fixtures/contract.rs' = 'pub fn check(adapter: &impl ReadPort) { assert_eq!(adapter.read (), 3); }'
given.files.'src/outbound/read/interface.rs' = 'pub trait ReadPort { fn read(&self) -> u8; }'

[[scenarios]]
id = 'an-explicit-trait-invocation'
scenario = 'An explicit trait invocation executes the contract and is not reported.'
given.files.'src/outbound/read/fixtures/contract.rs' = 'pub fn check(adapter: &impl ReadPort) { let result = ReadPort::read(adapter); assert_eq!(result, 3); }'
given.files.'src/outbound/read/interface.rs' = 'pub trait ReadPort { fn read(&self) -> u8; }'

[[scenarios]]
id = 'every-method'
scenario = 'A contract calling every method, one by method call and one by path.'
given.include = ['src/outbound/greeting/interface.rs', 'src/outbound/greeting/fixtures/contract.rs']
given.files.'src/outbound/greeting/fixtures/contract.rs' = '''
//! What every `greeting` adapter must pass.

use super::super::interface::GreetingPort;
use crate::cases::{Case, Expect, Word, run};

/// What a row of the contract is given.
type Input = ();
/// What a row of the contract expects when it succeeds.
type Value = &'static str;
/// What a row of the contract expects when it is refused.
type Failure = ();

/// The contract's rows: a name, one case word, an input and the expected value or error variant. Every implementation runs them.
pub const CASES: &[Case<Input, Value, Failure>] = &[Case {
    name: "shows a greeting",
    word: Word::Succeeds,
    input: || (),
    expect: Expect::Value("hello"),
}];

/// Runs the contract's rows against one implementation.
pub fn check(adapter: &impl GreetingPort) {
    run(CASES, Word::Succeeds, |()| Ok(adapter.show()));
    assert_eq!(GreetingPort::shout(adapter), adapter.show().to_uppercase());
}
'''
given.files.'src/outbound/greeting/interface.rs' = '''
//! What the `greeting` port asks of the outside, in the core's own vocabulary: plain data in and out,
//! and the handles (traits this file declares) it hands back. It never takes an adapter's
//! configuration (a directory, a budget, a client): the port's factory takes that.

/// What every `greeting` adapter implements.
pub trait GreetingPort {
    /// Shows the greeting.
    fn show(&self) -> &'static str;

    /// Shows the greeting loudly.
    fn shout(&self) -> String {
        self.show().to_uppercase()
    }
}
'''

