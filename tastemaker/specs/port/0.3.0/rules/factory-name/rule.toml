description = "A hex's `factory.rs` declares no `trait` (a `struct` only as plain parameter data an edge fills, such as the parts of one language), and every `pub fn` in it returns `impl <Port>Port`."
why = "A factory builds adapters and returns each as the trait of its port: `pub fn memory() -> impl NamesPort`, so an edge that composes holds a port and never an adapter's concrete type, and the factory declares no type of its own. The function's name is the adapter's directory, which the factory template writes. Read as written: in each `factory.rs` the entry selects, the top-level `pub fn` items must return an `impl` type whose trait path ends in a name ending `Port`; a `struct` or `trait` at the top level is a finding; a function without `pub`, a function inside a module and an item generated by a macro are not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let top-items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from top-edges as l join tree-nodes as r on l."child" = r."id";
let fns = select * from top-items where kind = "fn";
let forbidden-trait = select * from top-items where kind = "trait";
let forbidden-trait-rows = project(from=forbidden-trait, columns=["file", "span"]);
let trait-findings = extend(from=forbidden-trait-rows, values={"name": "trait", "problem": "is declared in a factory, which builds adapters and declares no trait"});
let f-name-nodes-all = select * from tree-nodes where kind = "name";
let f-kids = select l."id" as "id", r."child" as "child" from fns as l join "syntax-child" as r on l."id" = r."parent";
let f-name-nodes = select l."id" as "id", r."id" as "name-node" from f-kids as l join f-name-nodes-all as r on l."child" = r."id";
let f-name-tokens = select l."id" as "id", r."child" as "token" from f-name-nodes as l join "syntax-child" as r on l."name-node" = r."parent";
let f-name-texts = select l."id" as "id", r."text" as "name" from f-name-tokens as l join tree-tokens as r on l."token" = r."id";
let fn-rows = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."name" as "name" from fns as l join f-name-texts as r on l."id" = r."id";
let v-vis-nodes = select * from tree-nodes where kind = "visibility";
let v-pub-kw = select * from tree-tokens where kind = "pub-kw";
let v-pub-vis = select l."parent" as "vis" from "syntax-child" as l join v-pub-kw as r on l."child" = r."id";
let v-vis-kids = select l."id" as "id", r."child" as "child" from fns as l join "syntax-child" as r on l."id" = r."parent";
let v-item-vis = select l."id" as "id", r."id" as "vis" from v-vis-kids as l join v-vis-nodes as r on l."child" = r."id";
let pub-ids = select l."id" as "id" from v-item-vis as l join v-pub-vis as r on l."vis" = r."vis";
let pub-fns = select l."id" as "id", l."file" as "file", l."span" as "span", l."name" as "name" from fn-rows as l join pub-ids as r on l."id" = r."id";
let fn-kids = select l."id" as "id", r."child" as "child" from pub-fns as l join "syntax-child" as r on l."id" = r."parent";
let ret-nodes = select * from tree-nodes where kind = "ret-type";
let rets = select l."id" as "id", r."id" as "ret" from fn-kids as l join ret-nodes as r on l."child" = r."id";
let ret-kids = select l."id" as "id", r."child" as "child" from rets as l join "syntax-child" as r on l."ret" = r."parent";
let impl-type-nodes = select * from tree-nodes where kind = "impl-trait-type";
let impl-types = select l."id" as "id", r."id" as "ity" from ret-kids as l join impl-type-nodes as r on l."child" = r."id";
let ity-kids = select l."id" as "id", r."child" as "child" from impl-types as l join "syntax-child" as r on l."ity" = r."parent";
let bound-list-nodes = select * from tree-nodes where kind = "type-bound-list";
let bound-lists = select l."id" as "id", r."id" as "blist" from ity-kids as l join bound-list-nodes as r on l."child" = r."id";
let blist-kids = select l."id" as "id", r."child" as "child" from bound-lists as l join "syntax-child" as r on l."blist" = r."parent";
let bound-nodes = select * from tree-nodes where kind = "type-bound";
let bounds = select l."id" as "id", r."id" as "bound" from blist-kids as l join bound-nodes as r on l."child" = r."id";
let bound-kids = select l."id" as "id", r."child" as "child" from bounds as l join "syntax-child" as r on l."bound" = r."parent";
let bound-type-nodes = select * from tree-nodes where kind = "path-type";
let bound-types = select l."id" as "id", r."id" as "type" from bound-kids as l join bound-type-nodes as r on l."child" = r."id";
let type-kids = select l."id" as "id", r."child" as "child" from bound-types as l join "syntax-child" as r on l."type" = r."parent";
let x-token-edges = select l."parent" as "parent", r."id" as "token", r."kind" as "kind", r."text" as "text" from "syntax-child" as l join tree-tokens as r on l."child" = r."id";
let x-paths = select * from tree-nodes where kind = "path";
let x-segments = select * from tree-nodes where kind = "path-segment";
let x-name-refs = select * from tree-nodes where kind = "name-ref";
let x-path-segment-edges = select l."id" as "pathnode", r."child" as "child" from x-paths as l join "syntax-child" as r on l."id" = r."parent";
let x-path-segments = select l."pathnode" as "pathnode", r."id" as "segment" from x-path-segment-edges as l join x-segments as r on l."child" = r."id";
let x-segment-ref-edges = select l."pathnode" as "pathnode", r."child" as "child" from x-path-segments as l join "syntax-child" as r on l."segment" = r."parent";
let x-segment-refs = select l."pathnode" as "pathnode", r."id" as "nameref" from x-segment-ref-edges as l join x-name-refs as r on l."child" = r."id";
let x-path-names = select l."pathnode" as "pathnode", r."text" as "name" from x-segment-refs as l join x-token-edges as r on l."nameref" = r."parent";
let bound-paths = select l."id" as "id", r."id" as "pathnode" from type-kids as l join x-paths as r on l."child" = r."id";
let bound-names = select l."id" as "id", r."name" as "name" from bound-paths as l join x-path-names as r on l."pathnode" = r."pathnode";
let port-bounds = select * from bound-names where glob_any(name, "*Port");
let port-ids = project(from=port-bounds, columns=["id"]);
let misreturning = antijoin(left=pub-fns, right=port-ids, left-on=["id"], right-on=["id"]);
let misreturning-rows = project(from=misreturning, columns=["file", "span", "name"]);
let misreturning-findings = extend(from=misreturning-rows, values={"problem": "does not return `impl <Name>Port`: a factory function builds an adapter and returns it as the trait of its port"});
let all-2 = union(left=trait-findings, right=misreturning-findings);
emit all-2 subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "`{name}` {problem}"
help = "Make each `pub fn` of `factory.rs` return `impl <Port>Port` (the trait of the port the adapter implements, not the adapter's own type, a `Box<dyn...>` or a trait still named `Interface`), and move any struct or trait to the adapter that owns it. An ignore is not legitimate here: a factory only builds."

[given]
include = ['src/*/factory.rs']

[[scenarios]]
id = 'every-pub-function-returns-impl-port'
scenario = 'Every pub function returns impl of a port.'
given.files.'src/names/factory.rs' = '''
//! Builds the names adapters, one function each.

/// The memory names adapter.
#[must_use]
pub fn memory() -> impl greeting_core::outbound::names::interface::NamesPort {
    super::adapters::memory::adapter::NamesMemoryAdapter
}

/// The file-backed names adapter.
#[must_use]
pub fn file(path: &str) -> impl NamesPort {
    super::adapters::file::adapter::NamesFileAdapter::new(path)
}
'''

[[scenarios]]
id = 'private-helper'
scenario = 'A private function needs no port return.'
given.files.'src/names/factory.rs' = '''
//! Builds the names adapters, one function each.

/// The memory names adapter.
#[must_use]
pub fn memory() -> impl greeting_core::outbound::names::interface::NamesPort {
    super::adapters::memory::adapter::NamesMemoryAdapter
}

fn trimmed(text: &str) -> usize {
    text.len()
}
'''

[[scenarios]]
id = 'concrete-return'
scenario = "A function returning the adapter's own type."
given.files.'src/names/factory.rs' = '''
//! Builds the names adapters, one function each.

/// The memory names adapter.
#[must_use]
pub fn memory() -> super::adapters::memory::adapter::NamesMemoryAdapter {
    super::adapters::memory::adapter::NamesMemoryAdapter
}
'''
then.findings = [
  { path = 'src/names/factory.rs', line = 4 },
]

[[scenarios]]
id = 'boxed-return'
scenario = 'A function returning a boxed trait object.'
given.files.'src/names/factory.rs' = '''
//! Builds the names adapters, one function each.

/// The memory names adapter.
#[must_use]
pub fn memory() -> Box<dyn greeting_core::outbound::names::interface::NamesPort> {
    super::adapters::memory::adapter::NamesMemoryAdapter
}
'''
then.findings = [
  { path = 'src/names/factory.rs', line = 4 },
]

[[scenarios]]
id = 'retired-trait-return'
scenario = 'A function returning impl of a trait still named Interface.'
given.files.'src/names/factory.rs' = '''
//! Builds the names adapters, one function each.

/// The memory names adapter.
#[must_use]
pub fn memory() -> impl greeting_core::outbound::names::interface::NamesInterface {
    super::adapters::memory::adapter::NamesMemoryAdapter
}
'''
then.findings = [
  { path = 'src/names/factory.rs', line = 4 },
]

[[scenarios]]
id = 'no-return'
scenario = 'A function returning nothing.'
given.files.'src/names/factory.rs' = '''
//! Builds the names adapters, one function each.

/// Does nothing.
pub fn memory() {}
'''
then.findings = [
  { path = 'src/names/factory.rs', line = 4 },
]

[[scenarios]]
id = 'declares-parameter-struct'
scenario = 'A struct that only carries the parameters an edge fills is no hidden logic.'
given.files.'src/names/factory.rs' = '''
//! Builds the names adapters, one function each.

/// The memory names adapter.
#[must_use]
pub fn memory() -> impl greeting_core::outbound::names::interface::NamesPort {
    super::adapters::memory::adapter::NamesMemoryAdapter
}

/// A holder.
pub struct Memory;
'''

[[scenarios]]
id = 'declares-trait'
scenario = 'A trait in the factory.'
given.files.'src/names/factory.rs' = '''
//! Builds the names adapters, one function each.

/// The memory names adapter.
#[must_use]
pub fn memory() -> impl greeting_core::outbound::names::interface::NamesPort {
    super::adapters::memory::adapter::NamesMemoryAdapter
}

/// A role.
pub trait Memory {}
'''
then.findings = [
  { path = 'src/names/factory.rs', line = 10 },
]
