description = "One outbound port of a core: the trait the core's use cases call, its contract every implementation runs, and its plain types, errors and schemas."
why = "A port is a call across a boundary named in the core's own vocabulary: one trait, `<Name>Port`, and the contract rows the core's fake and every adapter run. Its types are plain data, its errors one enum, and it carries schemas only where its data has a shape we do not control. A name is the directory's stem and a file the snake_case of it. A persistent adapter receives its externally supplied resource or filesystem identity and, where the store is partitioned, typed partition binding through its factory; an existing directory binding needs no invented connection wrapper; methods take entities or IDs rather than asking callers to reopen or choose a storage partition. A store port speaks the core's own rows, never a whole-state image: its settings (the directory and the build) go to the factory, its reads are empty when the store is absent, of another build or undecodable, and each `keep_…` writes once, when the run succeeds, to a temporary file renamed over the store. A store port may exchange its product's flat tables together (`load() -> Tables`, `replace(Tables)`) when every run replaces them all, through that temporary file and rename; a nested whole-state value, or a write that replaces some of the tables and keeps the rest, is not that. Pure algorithm ports need neither a connection nor a partition. Contract cases prove partition isolation, stale-handle refusal and publication behavior where relevant; syntax rules do not establish those semantics. The nu-hex places each port."
