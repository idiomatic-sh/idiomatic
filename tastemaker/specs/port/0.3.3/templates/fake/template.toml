description = "The fake of one outbound port, in the port's own fixtures directory: what the core's tests stand in for the port with."
why = "A fake lives beside the port it stands in for, in `outbound/<port>/fixtures/fake.rs`, so the port's contract and its fake are colocated and the crate keeps no fixtures module of its own. The file imports the port's trait and declares `<Port>Fake`, the struct that implements it, and the shared rule `core-fakes` holds it to implementing that trait and no other. It is compiled for the crate's own tests and, through the `fixtures` feature, for other crates' tests; the port's module file declares it under that gate (`module-declares`)."
content = '''
//! The fake of the `{{ part }}` port: what the core's tests stand in for it with.

{% if part in (exposed | default([])) -%}
use super::super::interface::{{ part | pascal }};

/// What the core's tests stand in for `{{ part }}` with.
pub struct {{ part | pascal }}Fake;

impl {{ part | pascal }} for {{ part | pascal }}Fake {}
{%- else -%}
use super::super::interface::{{ part | pascal }}Port;

/// What the core's tests stand in for `{{ part }}` with.
pub struct {{ part | pascal }}Fake;

impl {{ part | pascal }}Port for {{ part | pascal }}Fake {}
{%- endif %}

#[cfg(test)]
#[path = "fake_test.rs"]
mod tests;
'''

[params]
exposed = { type = "list<string>", description = "The ports the product's SDK exposes: the fake of a listed port implements its plain noun." }
part = { type = "identifier", from = "directory-name", description = "The port's directory name: the stem of every name in it." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'fixtures/fake.rs'
given.params = { part = 'names', exposed = [] }
given.files.'fixtures/fake.rs' = '''
//! The fake of the `names` port: what the core's tests stand in for it with.

use super::super::interface::NamesPort;

/// What the core's tests stand in for `names` with.
pub struct NamesFake;

impl NamesPort for NamesFake {}

#[cfg(test)]
#[path = "fake_test.rs"]
mod tests;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'fixtures/fake.rs'
given.params = { part = 'names', exposed = [] }
given.files.'fixtures/fake.rs' = '''
//! The fake of the `names` port: what the core's tests stand in for it with.

use super::super::interface::NamesPort;

/// A fake.
pub struct NamesFake;

impl NamesPort for NamesFake {
    fn stored(&self, name: &str) -> Option<&'static str> {
        let _ = name;
        None
    }
}

#[cfg(test)]
#[path = "fake_test.rs"]
mod tests;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'fixtures/fake.rs'
given.params = { part = 'names', exposed = [] }
then.findings = [
  { rule = 'fake#count', path = '.' },
]

[[scenarios]]
id = 'fake-struct-named-port'
scenario = 'The fake struct is not named for the port.'
given.file = 'fixtures/fake.rs'
given.params = { part = 'names', exposed = [] }
given.files.'fixtures/fake.rs' = '''
//! The fake of the `names` port: what the core's tests stand in for it with.

use super::super::interface::NamesPort;

/// What the core's tests stand in for `names` with.
pub struct StoredNames;

impl NamesPort for StoredNames {}

#[cfg(test)]
#[path = "fake_test.rs"]
mod tests;
'''
then.findings = [
  { rule = 'fake#template', path = 'fixtures/fake.rs' },
  { rule = 'fake#template', path = 'fixtures/fake.rs' },
]

[[scenarios]]
id = 'exposed-port'
scenario = 'The fake of a port the SDK exposes implements its plain noun.'
given.file = 'fixtures/fake.rs'
given.params = { part = 'language', exposed = ['language'] }
given.files.'fixtures/fake.rs' = '''
//! The fake of the `language` port: what the core's tests stand in for it with.

use super::super::interface::Language;

/// What the core's tests stand in for `language` with.
pub struct LanguageFake;

impl Language for LanguageFake {}

#[cfg(test)]
#[path = "fake_test.rs"]
mod tests;
'''

[[scenarios]]
id = 'exposed-port-suffixed'
scenario = 'The fake of a port the SDK exposes keeps the Port suffix.'
given.file = 'fixtures/fake.rs'
given.params = { part = 'language', exposed = ['language'] }
given.files.'fixtures/fake.rs' = '''
//! The fake of the `language` port: what the core's tests stand in for it with.

use super::super::interface::LanguagePort;

/// What the core's tests stand in for `language` with.
pub struct LanguageFake;

impl LanguagePort for LanguageFake {}

#[cfg(test)]
#[path = "fake_test.rs"]
mod tests;
'''
then.findings = [
  { rule = 'fake#template', path = 'fixtures/fake.rs' },
]
