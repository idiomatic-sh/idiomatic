    Case {
        name: "accepts a phrase that opens politely",
        word: Word::Succeeds,
        input: || "good day, Ada",
        expect: Expect::Value(true),
    },
    Case {
        name: "recognizes a phrase that does not",
        word: Word::Succeeds,
        input: || "hey Ada",
        expect: Expect::Value(false),
    },
];

/// Calls the part on one input; the author states it.
fn subject(phrase: Input) -> Result<Value, Failure> {
    Ok(is_polite(phrase))
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}
