description = "The error the items of a collection produce, named for the collection."
why = "An error lives with the part that produces it, so what every item can fail with is stated once at the collection, as `<Collection>Error` after the collection's directory. It is `pub`: the items, in sibling modules, return it. The collection's module file declares it and its test (`module-declares`)."
content = '''
//! The failures of the items of the `{{ collection }}` collection.

/// Why an item of the `{{ collection }}` collection failed.
#[derive(Debug, thiserror::Error)]
pub enum {{ collection | pascal }}Error {}
'''

[params]
collection = { type = "identifier", description = "The collection, captured from its path." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'src/collections/passes/errors.rs'
given.params = { collection = 'passes' }
given.files.'src/collections/passes/errors.rs' = '''
//! The failures of the items of the `passes` collection.

/// Why an item of the `passes` collection failed.
#[derive(Debug, thiserror::Error)]
pub enum PassesError {}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'src/collections/passes/errors.rs'
given.params = { collection = 'passes' }
given.files.'src/collections/passes/errors.rs' = '''
//! The failures of the items of the `passes` collection.

/// Why an item of the `passes` collection failed.
#[derive(Debug, thiserror::Error)]
pub enum PassesError {
    #[error("the item failed")]
    Failed,
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/collections/passes/errors.rs'
given.params = { collection = 'passes' }
then.findings = [
  { rule = 'collection-errors#count', path = '.' },
]

# The name is not given as a param: the collection is captured from the path.
[[scenarios]]
id = 'named-by-its-directory'
scenario = "Each collection's error is named for the collection's own directory."
given.file = 'src/collections/{collection}/errors.rs'
given.count = { min = 1 }
given.files.'src/collections/line_endings/errors.rs' = '''
//! The failures of the items of the `line_endings` collection.

/// Why an item of the `line_endings` collection failed.
#[derive(Debug, thiserror::Error)]
pub enum LineEndingsError {}
'''
given.files.'src/collections/shapes/errors.rs' = '''
//! The failures of the items of the `shapes` collection.

/// Why an item of the `shapes` collection failed.
#[derive(Debug, thiserror::Error)]
pub enum ShapesError {}
'''

[[scenarios]]
id = 'named-by-another-directory'
scenario = "An error named for another collection's directory."
given.file = 'src/collections/{collection}/errors.rs'
given.count = { min = 1 }
given.files.'src/collections/line_endings/errors.rs' = '''
//! The failures of the items of the `line_endings` collection.

/// Why an item of the `line_endings` collection failed.
#[derive(Debug, thiserror::Error)]
pub enum ShapesError {}
'''
given.files.'src/collections/shapes/errors.rs' = '''
//! The failures of the items of the `shapes` collection.

/// Why an item of the `shapes` collection failed.
#[derive(Debug, thiserror::Error)]
pub enum ShapesError {}
'''
then.findings = [
  { rule = 'collection-errors#template', path = 'src/collections/line_endings/errors.rs' },
]
