description = "One collection's shared types: plain data, public fields and derives, with no constructor and no inherent impl."
why = "A definition several items share lives at the collection, beside its interface; the collection's module file declares it and its test (`module-declares`)."
content = '''
//! The types the items of the collection next to it share: plain data, public fields and derives.
'''

[given]
file = 'src/collections/passes/types.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/collections/passes/types.rs' = '''
//! The types the items of the collection next to it share: plain data, public fields and derives.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/collections/passes/types.rs' = '''
//! The types the items of the collection next to it share: plain data, public fields and derives.

/// A pass.
#[derive(Clone, Debug, PartialEq, Eq)]
pub struct Pass {
    pub name: String,
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'collection-types#count', path = '.' },
]
