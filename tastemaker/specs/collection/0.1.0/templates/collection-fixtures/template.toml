description = "A collection's fixtures module file: the shared cases every item runs, when the collection has any."
why = "Declares the one file of a collection's `fixtures/` directory: the contract every item runs. The collection's module file declares this module under the gate of test support, `#[cfg(any(test, feature = \"fixtures\"))]`, so an item's test (`item-contract`) and any other crate's tests reach the shared cases (`module-declares`)."
content = '''
//! The test support of the `{{ collection }}` collection: the cases every item shares.

pub(crate) mod contract;
'''

[params]
collection = { type = "identifier", description = "The collection, captured from its path." }

[given]
file = 'fixtures.rs'
params = { collection = 'shapes' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'fixtures.rs' = '''
//! The test support of the `shapes` collection: the cases every item shares.

pub(crate) mod contract;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'fixtures.rs' = '''
//! The test support of the `shapes` collection: the cases every item shares.

pub(crate) mod contract;

/// How many shared rows there are.
pub const ROWS: usize = 2;
'''

[[scenarios]]
id = 'no-contract'
scenario = 'The module file does not declare the contract.'
given.files.'fixtures.rs' = '''
//! The test support of the `shapes` collection: the cases every item shares.
'''
then.findings = [
  { rule = 'collection-fixtures#template', path = 'fixtures.rs' },
]

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'collection-fixtures#count', path = '.' },
]
