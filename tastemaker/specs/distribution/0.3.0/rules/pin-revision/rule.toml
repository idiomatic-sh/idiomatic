description = "A target's `pin.toml` names its `repository`, its `revision` and its `directory`: a pin with a tag and no revision is refused, and optional dependencies must be an array."
why = "A tag can be moved to another commit, so a target pinned by tag alone could change under a release; the revision is the commit itself. Without the directory a run does not know where in the project the command runs."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let files = project(from=listed-files, columns=["file"]);
let typed = select * from "entry" where kind = "string";
let repository-entries = select * from typed where key = "repository";
let with-repository = project(from=repository-entries, columns=["file"]);
let without-repository = difference(left=files, right=with-repository);
let repository = extend(from=without-repository, values={"name": "repository"});
let revision-entries = select * from typed where key = "revision";
let with-revision = project(from=revision-entries, columns=["file"]);
let without-revision = difference(left=files, right=with-revision);
let revision = extend(from=without-revision, values={"name": "revision"});
let directory-entries = select * from typed where key = "directory";
let with-directory = project(from=directory-entries, columns=["file"]);
let without-directory = difference(left=files, right=with-directory);
let directory = extend(from=without-directory, values={"name": "directory"});
let through-revision = union(left=repository, right=revision);
let through-directory = union(left=through-revision, right=directory);
let dependency-entries = select * from "entry" where key = "dependencies";
let non-array-dependencies = select * from dependency-entries where kind != "sequence";
let malformed-dependencies = select * from non-array-dependencies where kind != "sequence-of-mappings";
let dependency-paths = project(from=malformed-dependencies, columns=["file"]);
let dependencies = extend(from=dependency-paths, values={"name": "dependencies"});
let findings = union(left=through-directory, right=dependencies);
emit findings subject "file" key("file", "name");
'''

[diagnostic]
primary = "file"
message = "`{file}` names no `{name}`"
help = "Name the project's `repository`, the full commit id as `revision` (a `tag` may stand beside it, never in its place) and the `directory` in the project the command runs in, `.` for its root."

[given]
include = ['pin.toml']

[[scenarios]]
id = 'revision-and-tag'
scenario = 'A pin by revision, with its tag.'
given.files.'pin.toml' = '''
repository = "https://github.com/honojs/hono"
tag = "v4.6.9"
revision = "7c050b2840bd94baa2a71d8ed0786c7d07bcc1b9"
directory = "."
'''

[[scenarios]]
id = 'tag-alone'
scenario = 'A pin with a tag and no revision.'
given.files.'pin.toml' = '''
repository = "https://github.com/honojs/hono"
tag = "v4.6.9"
directory = "."
'''
then.findings = [
  { path = 'pin.toml' },
]

[[scenarios]]
id = 'no-directory'
scenario = 'A pin without its directory.'
given.files.'pin.toml' = '''
repository = "https://github.com/honojs/hono"
tag = "v4.6.9"
revision = "7c050b2840bd94baa2a71d8ed0786c7d07bcc1b9"
'''
then.findings = [
  { path = 'pin.toml' },
]

[[scenarios]]
id = 'dependencies-as-text'
scenario = 'Dependencies-as-text: it is reported.'
given.files.'pin.toml' = '''
repository = "https://example.com/project"
revision = "0123456789012345678901234567890123456789"
directory = "."
dependencies = "wrong"
'''
then.findings = [
  { path = 'pin.toml' },
]

[[scenarios]]
id = 'dependencies'
scenario = 'Dependencies: nothing is reported.'
given.files.'pin.toml' = '''
repository = "https://example.com/project"
revision = "0123456789012345678901234567890123456789"
directory = "."
dependencies = [{source="policy",destination=".policy"}]
'''
