#[cfg(unix)]
fn assert_signal_forwarding(installation: &Installation, platform_name: &str, directory: &Path) -> std::io::Result<()> {
    // A controlled child makes signal delivery observable without relying on how long
    // a real query runs. Only this temporary install's executable is replaced.
        let installed_binary = installation.package.parent().and_then(Path::parent)
            .ok_or_else(|| std::io::Error::other("installed package has no modules directory"))?
            .join(platform_name).join("bin/{{ command }}");
        std::fs::write(&installed_binary, r"#!/usr/bin/env node
const fs = require('node:fs');
for (const signal of ['SIGINT', 'SIGTERM', 'SIGHUP']) process.on(signal, () => process.exit(73));
fs.writeFileSync(process.env.DISTRIBUTION_READY, String(process.pid));
setInterval(() => {}, 1000);
")?;
        for signal in ["SIGINT", "SIGTERM", "SIGHUP"] {
            let ready = directory.join(signal);
            let mut launcher = Command::new(&installation.command)
                .env("DISTRIBUTION_READY", &ready).spawn()?;
            for _ in 0..500 {
                if ready.exists() { break; }
                std::thread::sleep(std::time::Duration::from_millis(10));
            }
            if !ready.exists() {
                let _ = launcher.kill();
                let _ = launcher.wait();
                return Err(std::io::Error::other("the signal probe did not start"));
            }
            let native_pid = std::fs::read_to_string(&ready)?;
            run(Command::new("kill").args(["-s", signal, &launcher.id().to_string()]))?;
            let mut status = None;
            for _ in 0..500 {
                status = launcher.try_wait()?;
                if status.is_some() { break; }
                std::thread::sleep(std::time::Duration::from_millis(10));
            }
            // Also clean up the controlled child when a broken launcher orphaned it.
            let _ = Command::new("kill").args(["-KILL", native_pid.trim()]).output();
            if status.is_none() {
                let _ = launcher.kill();
                let _ = launcher.wait();
            }
            if status.and_then(|status| status.code()) != Some(73) {
                return Err(std::io::Error::other(format!("{signal} did not reach the child")));
            }
        }
    Ok(())
}
