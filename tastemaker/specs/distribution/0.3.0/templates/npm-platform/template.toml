description = "One target's npm package, `@<organization>/<product>-<target>`, named by its Rust target triple as cargo-dist names the archive: its `os`, `cpu` and `libc` let npm install it only on a matching machine, and packing puts that target's binary from the cargo-dist archive in `bin/` and stamps the crate's version."
why = "npm picks the binary by the package's own `os`, `cpu` and `libc`, so each machine downloads only its binary and no script chooses one."
params = { organization = { type = "identifier", description = "The organization every package is published under, written as a Python identifier (`idiomatic_sh`): the npm scope and the PyPI distribution's name use its hyphenated form (`idiomatic-sh`), the Python module this form." }, product = { type = "identifier", description = "The product: its command, and the binary's name." }, target = { type = "identifier", description = "The Rust target triple the package carries the binary for, captured from its directory under `platforms/`." } }
content = '''
{%- set arch = target | split("-") | first -%}
{%- set cpus = {"x86_64": "x64", "aarch64": "arm64", "armv7": "arm", "arm": "arm", "i686": "ia32", "riscv64gc": "riscv64", "powerpc64le": "ppc64", "s390x": "s390x"} -%}
{
  "name": "@{{ organization | kebab }}/{{ product }}-{{ target }}",
  "description": "The {{ product }} binary for {{ target }}, run by @{{ organization | kebab }}/{{ product }}.",
  "os": [
    "{% if "-windows-" in target %}win32{% elif "-apple-darwin" in target %}darwin{% elif "-linux-" in target %}linux{% elif "-freebsd" in target %}freebsd{% else %}unsupported target {{ target }}{% endif %}"
  ],
  "cpu": [
    "{{ cpus[arch] | default("unsupported target " ~ target) }}"
  ],
{%- if "-linux-gnu" in target %}
  "libc": [
    "glibc"
  ],
{%- elif "-linux-musl" in target %}
  "libc": [
    "musl"
  ],
{%- endif %}
  "files": [
    "bin"
  ],
  "preferUnplugged": true
}
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'registries/npm/platforms/{target}/package.json'
given.count = { min = 1 }
given.params = { organization = 'idiomatic_sh', product = 'tastemaker' }
given.files.'registries/npm/platforms/x86_64-unknown-linux-gnu/package.json' = '''
{
  "name": "@idiomatic-sh/tastemaker-x86_64-unknown-linux-gnu",
  "description": "The tastemaker binary for x86_64-unknown-linux-gnu, run by @idiomatic-sh/tastemaker.",
  "os": [
    "linux"
  ],
  "cpu": [
    "x64"
  ],
  "libc": [
    "glibc"
  ],
  "files": [
    "bin"
  ],
  "preferUnplugged": true
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'registries/npm/platforms/{target}/package.json'
given.count = { min = 1 }
given.params = { organization = 'idiomatic_sh', product = 'tastemaker' }
then.findings = [
  { rule = 'npm-platform#count', path = '.' },
]
