description = "The targets' findings check, a module of the distribution test target the budgets bench runs its targets through: refuses a target that states only some of what a run needs, clones each target once at its pinned revision into a cache, and holds what a run prints and the exit code it ends with to the target's `findings.toml`, keeping a mismatched run's findings outside the repository. It lists the registries the test root declares, each with its package's install and its build's languages, and `every_registry_is_declared` fails on a registry directory not listed. It times nothing and reads no budget, and no smoke test calls it: its own test proves a mismatch fails however fast the run."
why = "One check for every registry, which the bench runs every target through, means a new registry proves its package on real projects, and a run that finds something else fails the bench, in about one cold run per target: the findings are held where the targets are run, and never run again by a smoke test."
params = { command = { type = "identifier", description = "The command the product installs: the binary's name, which the launcher, the entry point and the smoke tests run, and the name of the binary in every archive. It is the product's name where the product installs a command of that name." }, product = { type = "identifier", description = "The product: its command, and the name in every archive and package." }, configuration = { type = "string", description = "The name of the product's own configuration file (`tastemaker.toml`), under which a run places a target's `configuration.toml` in the project." }, check = { type = "text", description = "The arguments that make the command check the working directory and print its findings on standard output (`workspace check --format json`)." } }
