description = "The Python distribution `<organization>-<product>` (hyphenated: `idiomatic-sh-<product>`), built by maturin 1.15 as a binary wheel per target (`bindings = \"bin\"`, as ruff and uv ship), so the wheel carries the executable and nothing downloads at install; its version is the crate's (`dynamic`), it builds with the `dist` profile, linking the languages of PyPI's ecosystem alone when the product links any, and its Python package is the flat module `<organization>_<product>`."
why = "The wheel is the standard way a Rust command line reaches pip, and a pinned backend with Cargo's version leaves nothing to keep in step by hand."
params = { organization = { type = "identifier", description = "The organization every package is published under, written as a Python identifier (`idiomatic_sh`): the npm scope and the PyPI distribution's name use its hyphenated form (`idiomatic-sh`), the Python module this form." }, languages = { type = "identifier", description = "`linked`: each registry's build links the languages of its ecosystem alone, named in its build, and its smoke test holds the installed command to them. `none`: the product analyses no language, so every registry builds the crate as it is." }, product = { type = "identifier", description = "The product: its command, and its Python package's name." } }
match = "declarations"
content = '''
[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "{{ organization | kebab }}-{{ product }}"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]

[tool.maturin]
bindings = "bin"
manifest-path = "../../../cli/Cargo.toml"
module-name = "{{ organization }}_{{ product }}"
python-source = "python"
profile = "dist"
{%- if languages == "linked" %}
# The languages PyPI's build links: a language is added here, in this one place.
no-default-features = true
features = ["css", "go", "html", "javascript", "json", "markdown", "python", "rust", "toml", "typescript"]
{%- endif %}
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'registries/pypi/pyproject.toml'
given.params = { organization = 'idiomatic_sh', product = 'tastemaker', languages = 'linked' }
given.files.'registries/pypi/pyproject.toml' = '''
[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "idiomatic-sh-tastemaker"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]

[tool.maturin]
bindings = "bin"
manifest-path = "../../../cli/Cargo.toml"
module-name = "idiomatic_sh_tastemaker"
python-source = "python"
profile = "dist"
# The languages PyPI's build links: a language is added here, in this one place.
no-default-features = true
features = ["css", "go", "html", "javascript", "json", "markdown", "python", "rust", "toml", "typescript"]
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'registries/pypi/pyproject.toml'
given.params = { organization = 'idiomatic_sh', product = 'tastemaker', languages = 'linked' }
then.findings = [
  { rule = 'pypi-project#count', path = '.' },
]

[[scenarios]]
id = 'extension-module'
scenario = 'The wheel is an extension module, not the binary.'
given.file = 'registries/pypi/pyproject.toml'
given.params = { organization = 'idiomatic_sh', product = 'tastemaker', languages = 'linked' }
given.files.'registries/pypi/pyproject.toml' = '''
[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "idiomatic-sh-tastemaker"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "../../../cli/Cargo.toml"
module-name = "idiomatic_sh_tastemaker"
python-source = "python"
profile = "dist"
# The languages PyPI's build links: a language is added here, in this one place.
no-default-features = true
features = ["css", "go", "html", "javascript", "json", "markdown", "python", "rust", "toml", "typescript"]
'''
then.findings = [
  { rule = 'pypi-project#template', path = 'registries/pypi/pyproject.toml' },
  { rule = 'pypi-project#template', path = 'registries/pypi/pyproject.toml' },
]

[[scenarios]]
id = 'static-version'
scenario = 'The version is written here instead of taken from Cargo.'
given.file = 'registries/pypi/pyproject.toml'
given.params = { organization = 'idiomatic_sh', product = 'tastemaker', languages = 'linked' }
given.files.'registries/pypi/pyproject.toml' = '''
