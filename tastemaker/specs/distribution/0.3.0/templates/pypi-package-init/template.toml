description = "The Python package `<organization>_<product>`, one flat module per product and no namespace package shared between wheels: `find_<product>_bin()` returns the executable installed beside the package Python imported, for Python code that runs it (ruff's `find_ruff_bin`)."
why = "Python code that runs the command needs its path without guessing where the installer put scripts."
params = { command = { type = "identifier", description = "The command the product installs: the binary's name, which the launcher, the entry point and the smoke tests run, and the name of the binary in every archive. It is the product's name where the product installs a command of that name." }, organization = { type = "identifier", description = "The organization every package is published under, written as a Python identifier (`idiomatic_sh`): the npm scope and the PyPI distribution's name use its hyphenated form (`idiomatic-sh`), the Python module this form." }, product = { type = "identifier", description = "The product: its command, and its Python package's name." } }
content = '''
"""The {{ product }} command line, installed as a native executable by this wheel."""

import os
import sysconfig


def find_{{ product | snake }}_bin() -> str:
    """Return the path of the {{ product }} executable installed beside this package."""
    executable = "{{ command }}" + (sysconfig.get_config_var("EXE") or "")
    library = os.path.dirname(os.path.dirname(os.path.realpath(__file__)))
    # The scheme whose library holds this package installed its scripts; a --target install keeps them beside it.
    beside = [
        sysconfig.get_path("scripts", scheme)
        for scheme in sysconfig.get_scheme_names()
        if library in {os.path.realpath(sysconfig.get_path(kind, scheme)) for kind in ("purelib", "platlib")}
    ]
    candidates = [
        *beside,
        os.path.join(library, "bin"),
        os.path.join(library, "Scripts"),
        sysconfig.get_path("scripts", sysconfig.get_default_scheme()),
        sysconfig.get_path("scripts", sysconfig.get_preferred_scheme("user")),
    ]
    for scripts in candidates:
        path = os.path.join(scripts, executable)
        if os.path.isfile(path):
            return path
    raise FileNotFoundError(executable)
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'registries/pypi/python/idiomatic_sh_tastemaker/__init__.py'
