description = "A target's configuration: the product's configuration for the project, which a run places in the project's directory under the product's own file name, so it says what is checked there."
why = "The project does not carry the product's configuration, so the target does, beside the findings that configuration gives."
params = { product = { type = "identifier", description = "The product: its command, and the name in every archive and package." } }
content = '''
{% if scaffold | default(false) %}
# What {{ product }} checks this target with: a run places this file in the project's directory, under {{ product }}'s own name for it.
{% endif %}
'''

[given]
file = 'configuration.toml'
params = { product = 'tastemaker' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'configuration.toml' = '''
version = 2
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'target-configuration#count', path = '.' },
]
