description = "The distribution bench's checks of its own instrument, run before it measures: the sampled tree follows its processes, the sampler sees child memory spikes at a bounded cost, and a measured CPU burner or memory hog reads as one where an ordinary command does not."
why = "A bench whose instrument is wrong reports wrong numbers; the checks time things, so they are the bench's and never a test."
match = "text"
content = '''
//! The instrument's own checks, run before it measures anything: the sampled process tree
//! follows overlapping, reparented and recycled processes, the sampler sees child memory
//! spikes at a bounded cost, and a measured CPU burner or memory hog reads as one where an
//! ordinary command does not. They time things, so they are the bench's and never a test.

use super::measure::milliseconds;
#[cfg(unix)]
use super::measure::{ROUNDS, measure};
use super::resources;
use std::io::Write as _;
use std::path::Path;
use std::process::{Command, Stdio};
use std::time::{Duration, Instant};
use sysinfo::Pid;

/// `holds`, or an error saying what does not.
fn ensure(holds: bool, what: impl FnOnce() -> String) -> std::io::Result<()> {
    if holds {
        Ok(())
    } else {
        Err(std::io::Error::other(what()))
    }
}

/// The sampled tree keeps the children of its root as they overlap, keeps them once the root has
/// gone and they are reparented, and lets a recycled PID with a new start time join no tree.
fn tree_tracks_overlapping_children_reparenting_and_recycled_pids() -> std::io::Result<()> {
    let root = Pid::from_u32(1);
    let child = Pid::from_u32(2);
    let sibling = Pid::from_u32(3);
    let mut tree = resources::Tree::default();
    let sampled = [
        tree.sample(
            root,
            &[
                (root, 10, None, 100),
                (child, 11, Some(root), 200),
                (sibling, 12, Some(root), 300),
            ],
        ),
        tree.sample(root, &[(child, 11, None, 200), (sibling, 12, None, 300)]),
        tree.sample(
            root,
            &[
                (root, 20, None, 999),
                (child, 21, None, 999),
                (sibling, 12, None, 300),
            ],
        ),
    ];
    ensure(sampled == [600, 500, 300], || {
        format!("the tree sampled {sampled:?}, not [600, 500, 300]")
    })
}

/// A Python program that starts two children at once, each holding 32 MiB for 120 ms.
const CHILDREN: &str = "
import subprocess,sys,time
code='import time; data=bytearray(32*1024*1024); time.sleep(.12)'
children=[subprocess.Popen([sys.executable,'-c',code]) for _ in range(2)]
for child in children: child.wait()
";

/// Runs [`CHILDREN`], its PID written to `pidfile`, sampled when `sampled`: its wall time and what
/// the sampler saw (nothing when unsampled).
fn children(pidfile: &Path, sampled: bool) -> std::io::Result<(Duration, resources::Sampled)> {
    let started = Instant::now();
    let child = Command::new("python3")
        .args(["-c", CHILDREN])
        .stdout(Stdio::piped())
        .stderr(Stdio::piped())
        .spawn()?;
    std::fs::write(pidfile, child.id().to_string())?;
    let (output, report) = if sampled {
        resources::observe(child, pidfile)?
    } else {
        (child.wait_with_output()?, resources::Sampled::default())
    };
    ensure(output.status.success(), || {
        format!("the children ended with {}", output.status)
    })?;
    Ok((started.elapsed(), report))
}

/// The sampler counts both children's memory, observes them more than twice, and costs at most 30%
/// of their wall in CPU and 10% (plus 5 ms) of it in wall, each judged by its median of three.
fn child_memory_spikes_are_measured_and_sampler_overhead_is_bounded() -> std::io::Result<()> {
    let scratch = tempfile::tempdir()?;
    let pidfile = scratch.path().join("pid");
    let mut plain = Vec::new();
    let mut sampled = Vec::new();
    let mut overhead = Vec::new();
    for _ in 0..3_u32 {
        plain.push(children(&pidfile, false)?.0);
        let (wall, report) = children(&pidfile, true)?;
        writeln!(
            std::io::stderr().lock(),
            "sampled-wall={} peak={} samples={} sampler-cpu={} longest-gap={}",
            milliseconds(wall),
            report.peak,
            report.samples,
            milliseconds(report.cpu),
            milliseconds(report.longest_gap)
        )?;
        ensure(report.peak > 64 * 1024 * 1024, || {
            format!("both independent child allocations must be counted: {report:?}")
        })?;
        ensure(report.samples > 2, || {
            format!("too few samples: {report:?}")
        })?;
        overhead.push((
            report.cpu.as_secs_f64() / wall.as_secs_f64(),
            format!("{report:?}"),
        ));
        sampled.push(wall);
    }
    // The sampler's CPU is judged by its median over the repetitions, as every measure here is: one of three moves with the load; it read 12 to 22% of the wall of the children on this machine, so the bound is 30%.
    overhead.sort_by(|left, right| left.0.total_cmp(&right.0));
    ensure(
        overhead.get(1).is_some_and(|(ratio, _)| *ratio < 0.3_f64),
        || format!("sampler CPU overhead: {overhead:?}"),
    )?;
    plain.sort();
    sampled.sort();
    ensure(
        sampled
            .get(1)
            .zip(plain.get(1))
            .is_some_and(|(with, without)| {
                *with < without.mul_f64(1.10) + Duration::from_millis(5)
            }),
        || format!("plain={plain:?} sampled={sampled:?}"),
    )
}

/// Three commands that print the same findings read as what they are: a CPU burner as CPU, a
/// memory hog as memory, and an ordinary command as neither.
#[cfg(unix)]
fn measured_commands_with_equal_output_read_real_cpu_and_memory() -> std::io::Result<()> {
    use std::os::unix::fs::PermissionsExt as _;
    let scratch = tempfile::tempdir()?;
    let command = scratch.path().join("command");
    let expected = scratch.path().join("expected.toml");
    // The summary of `[]`, what every command below prints: the sha256 of `[]`, no finding.
    std::fs::write(
        &expected,
        "digest = \"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945\"\nexit_code = 0\n",
    )?;
    // What the burner must show as cold CPU, and the hog as peak memory, where the ordinary command shows less.
    let (burned, held) = (100_u128, 32_u128 * 1024 * 1024);
    for (kind, code) in [
        ("ordinary", "pass"),
        (
            "cpu",
            "until=time.process_time()+.25\nwhile time.process_time()<until: pass",
        ),
        ("memory", "held=bytearray(64*1024*1024)\ntime.sleep(.15)"),
    ] {
        std::fs::write(
            &command,
            format!("#!/usr/bin/env python3\nimport time\n{code}\nprint('[]')\n"),
        )?;
        std::fs::set_permissions(&command, std::fs::Permissions::from_mode(0o700))?;
        for _ in 0..ROUNDS {
            let (_, cpu, peak) = measure(&command, scratch.path(), scratch.path(), &expected)?;
            let peak = u128::from(peak);
            let reads = match kind {
                "cpu" => cpu >= burned && peak < held,
                "memory" => cpu < burned && peak >= held,
                _ => cpu < burned && peak < held,
            };
            ensure(reads, || format!("{kind}: cpu {cpu} ms, peak {peak} bytes"))?;
        }
    }
    Ok(())
}

/// Off POSIX the probes cannot run, so the instrument refuses to measure.
#[cfg(not(unix))]
fn measured_commands_with_equal_output_read_real_cpu_and_memory() -> std::io::Result<()> {
    Err(std::io::Error::new(
        std::io::ErrorKind::Unsupported,
        "the distribution instrument requires POSIX shell CPU and memory probes",
    ))
}

/// Runs every check, stopping at the first the instrument fails.
pub(super) fn check() -> std::io::Result<()> {
    tree_tracks_overlapping_children_reparenting_and_recycled_pids()?;
    child_memory_spikes_are_measured_and_sampler_overhead_is_bounded()?;
    measured_commands_with_equal_output_read_real_cpu_and_memory()?;
    Ok(())
}
