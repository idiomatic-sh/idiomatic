description = "One target's npm package's README, the page npm shows for `@<organization>/<product>-<target>`: it says the package is the product's binary for that target and that a user installs `@<organization>/<product>` instead."
why = "A platform package is found by search and listed beside the product's own package, so its page sends a user to the one package they install, which picks the binary for their machine."
params = { organization = { type = "identifier", description = "The organization every package is published under, written as a Python identifier (`idiomatic_sh`): the npm scope and the PyPI distribution's name use its hyphenated form (`idiomatic-sh`), the Python module this form." }, product = { type = "identifier", description = "The product: its command, and the binary's name." }, target = { type = "identifier", description = "The Rust target triple the package carries the binary for, captured from its directory under `platforms/`." } }
content = '''
# @{{ organization | kebab }}/{{ product }}-{{ target }}

The {{ product }} binary for {{ target }}. Install [@{{ organization | kebab }}/{{ product }}](https://www.npmjs.com/package/@{{ organization | kebab }}/{{ product }}) instead: it installs this package on a matching machine and runs its binary.
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'registries/npm/platforms/{target}/README.md'
given.count = { min = 1 }
given.params = { organization = 'idiomatic_sh', product = 'tastemaker' }
given.files.'registries/npm/platforms/x86_64-unknown-linux-gnu/README.md' = '''
# @idiomatic-sh/tastemaker-x86_64-unknown-linux-gnu

The tastemaker binary for x86_64-unknown-linux-gnu. Install [@idiomatic-sh/tastemaker](https://www.npmjs.com/package/@idiomatic-sh/tastemaker) instead: it installs this package on a matching machine and runs its binary.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'registries/npm/platforms/{target}/README.md'
given.count = { min = 1 }
given.params = { organization = 'idiomatic_sh', product = 'tastemaker' }
then.findings = [
  { rule = 'npm-platform-readme#count', path = '.' },
]
