description = "PyPI's smoke test, a module of the distribution test target: builds the wheel with `pip wheel` through the backend `pyproject.toml` declares, installs it into a fresh virtual environment without the index, and runs both `<product> --version` and `python -m <organization>_<product> --version`, so a broken wheel or module fails before any release. It also holds the wheel to exactly its own files and runs `uv publish --dry-run` over it (the dry-run publish path, which uploads nothing), holds the installed command to the languages the build names, and gives the budgets bench the install it measures through and the languages its targets' findings are checked with. It runs no target."
why = "A wheel is proven by installing what would be published, with pip itself, before anything reaches the index."
params = { command = { type = "identifier", description = "The command the product installs: the binary's name, which the launcher, the entry point and the smoke tests run, and the name of the binary in every archive. It is the product's name where the product installs a command of that name." }, organization = { type = "identifier", description = "The organization every package is published under, written as a Python identifier (`idiomatic_sh`): the npm scope and the PyPI distribution's name use its hyphenated form (`idiomatic-sh`), the Python module this form." }, languages = { type = "identifier", description = "`linked`: each registry's build links the languages of its ecosystem alone, named in its build, and its smoke test holds the installed command to them. `none`: the product analyses no language, so every registry builds the crate as it is." }, product = { type = "identifier", description = "The product: its command, and its Python package's name." } }
content = '''
//! `PyPI`: the wheel `{{ organization | kebab }}-{{ product }}`, built by the backend `pyproject.toml`
//! names (maturin), which is this registry's build, installed into a fresh virtual
//! environment without the index, run as `{{ command }}` and as
//! `python -m {{ organization }}_{{ product }}`.

use super::{has_version, output, registry_directory, run, strings};
use std::path::{Path, PathBuf};
use std::process::Command;

/// The host's Python 3.
const PYTHON: &str = if cfg!(windows) { "python" } else { "python3" };

/// The wheel's one Python module.
const MODULE: &str = "{{ organization }}_{{ product }}";
{%- if languages == "linked" %}

/// The languages `PyPI`'s build links, which `pyproject.toml` names as its `features`.
const LANGUAGES: &[&str] = &["python", "toml", "markdown"];
{%- endif %}

/// What an installation leaves in its scratch directory.
struct Installation {
    /// The wheel the build made.
    wheel: PathBuf,
    /// The environment's Python.
    python: PathBuf,
    /// The installed command.
    command: PathBuf,
}

/// The file holding this registry's build: the wheel and the languages it links.
fn build_file() -> PathBuf {
    registry_directory("pypi").join("pyproject.toml")
}

/// Builds the wheel under `directory` and installs it into a fresh virtual environment
/// there, without the index.
fn install(directory: &Path) -> std::io::Result<Installation> {
{% if scaffold|default(false) %}
    // Maturin writes the wheel into the shared target directory (`target/wheels`, one
    // file name per version) before the build backend copies it out, so two builds at
    // once write one file and either copy can read a torn zip. A lock file in that
    // target directory serializes the build and the copy across threads and across test
    // processes (nextest runs each test in its own), as the npm build's lock does.
    let lock = std::fs::File::create(Path::new(env!("CARGO_TARGET_TMPDIR")).join("pypi-smoke-test.lock"))?;
    lock.lock()?;
{% endif %}
    let wheels = directory.join("wheels");
    run(Command::new("uv")
        .args(["build", "--wheel", "--out-dir"])
        .arg(&wheels)
        .arg(registry_directory("pypi")))?;
    let wheels = std::fs::read_dir(&wheels)?
        .map(|entry| entry.map(|entry| entry.path()))
        .collect::<std::io::Result<Vec<_>>>()?
        .into_iter()
        .filter(|path| path.extension().is_some_and(|extension| extension == "whl"))
        .collect::<Vec<_>>();
    let [wheel] = wheels.as_slice() else {
        return Err(std::io::Error::other(format!("the build made {} wheels, expected one", wheels.len())));
    };
    let wheel = wheel.clone();

    let environment = directory.join("environment");
    run(Command::new("uv").args(["venv", "--python", PYTHON]).arg(&environment))?;
    let scripts = environment.join(if cfg!(windows) { "Scripts" } else { "bin" });
    let python = scripts.join("python");
    run(Command::new("uv")
        .args(["pip", "install", "--no-index", "--no-deps", "--python"])
        .arg(&python)
        .arg(&wheel))?;
    Ok(Installation {
        wheel,
        python,
        command: scripts.join("{{ command }}"),
    })
}

/// The languages `PyPI`'s build links: the `features` of `pyproject.toml`.
pub(super) fn languages() -> std::io::Result<Vec<String>> {
    strings(&build_file(), &["tool", "maturin", "features"])
}

/// Builds and installs the wheel under `directory` and returns the installed command.
pub(super) fn command(directory: &Path) -> std::io::Result<PathBuf> {
    install(directory).map(|installation| installation.command)
}

/// The wheel holds exactly its own files and passes the dry-run publish; it installs into
/// a fresh environment and both of its entry points report the crate's version; a second,
/// `--target` install finds the executable beside the package Python imports.
#[test]
fn installs_and_runs() {
    let directory = tempfile::tempdir().unwrap();
    let installation = install(directory.path()).unwrap();

    // No test, target or build file ships: the wheel holds the executable, the Python
    // module's two files, and the metadata and bill of materials the backend writes.
    let mut shipped = output(Command::new(PYTHON)
        .args([
            "-c",
            "import sys, zipfile; print('\\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))",
        ])
        .arg(&installation.wheel))
    .unwrap()
    .lines()
    .map(str::to_owned)
    .collect::<Vec<_>>();
    shipped.sort();
    let stem = format!("{MODULE}-{}", env!("CARGO_PKG_VERSION"));
    let executable = format!("{{ command }}{}", std::env::consts::EXE_SUFFIX);
    assert_eq!(
        shipped,
        [
            format!("{stem}.data/scripts/{executable}"),
            format!("{stem}.dist-info/METADATA"),
            format!("{stem}.dist-info/RECORD"),
            format!("{stem}.dist-info/WHEEL"),
            format!("{stem}.dist-info/licenses/LICENSE"),
            format!("{stem}.dist-info/sboms/{{ organization | kebab }}-{{ product }}.cyclonedx.json"),
            format!("{MODULE}/__init__.py"),
            format!("{MODULE}/__main__.py"),
        ]
    );
    // The dry-run publish: uv reads the wheel as it would upload it and uploads nothing.
    run(Command::new("uv")
        .args(["publish", "--dry-run"])
        .arg(&installation.wheel))
    .unwrap();

    assert!(has_version(&output(Command::new(&installation.command).arg("--version")).unwrap()));
    assert!(has_version(&output(Command::new(&installation.python).args(["-m", MODULE, "--version"])).unwrap()));
    // Installed again with --target, the package Python imports from there runs the executable beside it, not the
    // environment's own.
    let target = directory.path().join("target");
    run(Command::new("uv")
        .args(["pip", "install", "--no-index", "--no-deps", "--python"])
        .arg(&installation.python)
        .arg("--target")
        .arg(&target)
        .arg(&installation.wheel))
    .unwrap();
    let found = output(Command::new(&installation.python)
        .env("PYTHONPATH", &target)
        .args(["-c", &format!("import {MODULE}; print({MODULE}.find_{{ product | snake }}_bin())")]))
    .unwrap();
    assert!(Path::new(found.trim()).starts_with(&target), "{found}");
}
{%- if languages == "linked" %}

/// The build names exactly this registry's languages, and the installed command links
/// exactly those.
#[test]
fn links_its_languages() {
    let mut stated = LANGUAGES.to_vec();
    stated.sort_unstable();
    let mut named = languages().unwrap();
    named.sort();
    assert_eq!(named, stated);
    let directory = tempfile::tempdir().unwrap();
    let installation = install(directory.path()).unwrap();
    let mut linked = super::linked(&installation.command).unwrap();
    linked.sort();
    assert_eq!(linked, stated);
}
{%- endif %}
