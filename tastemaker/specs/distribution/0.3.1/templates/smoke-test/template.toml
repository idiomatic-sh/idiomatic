description = "The distribution test target's root, which the command line crate's manifest declares as its `distribution` test: one `mod` per registry, each in that registry's directory, so rustc requires every registry's smoke test; and the helpers the smoke tests share, among them `cargo install` in a given profile. It names no registry's module: the list of registries, with each one's install and its build's languages, and `every_registry_is_declared`, which fails on a registry directory not listed, are the targets' check's (`target_test.rs`), so the smoke tests' `super::` helpers and the root never name each other. It runs no target: the targets' findings are the bench's, which holds every round of every target to them."
why = "Makes the list of registries executable: a registry without its smoke test does not compile, and a registry's directory without its test fails. A smoke test proves the install in a minute; running real projects in it would spend every test run on what the bench already holds."
params = { command = { type = "identifier", description = "The command the product installs: the binary's name, which the launcher, the entry point and the smoke tests run, and the name of the binary in every archive. It is the product's name where the product installs a command of that name." }, product = { type = "identifier", description = "The product: its command, and the name in its archives." }, languages = { type = "identifier", description = "`linked`: each registry's build links the languages of its ecosystem alone, named in its build, and its smoke test holds the installed command to them. `none`: the product analyses no language, so every registry builds the crate as it is." } }
content = '''
//! {{ product }}'s distribution: one build per registry it ships to, each in its registry's
//! directory under `registries` beside the smoke test that builds that registry's artifact
//! from the command line crate, installs it in a scratch directory and runs
//! `{{ command }} --version`. It runs no target: each target, its findings and its performance are the performance
//! job's (`benches/bench.rs`). Nothing is published.

#[path = "registries/cargo/smoke_test.rs"]
mod cargo;
{%- if present["npm-smoke-test"] | default(false) %}
#[path = "registries/npm/smoke_test.rs"]
mod npm;
{%- endif %}
{%- if present["pypi-smoke-test"] | default(false) %}
#[path = "registries/pypi/smoke_test.rs"]
mod pypi;
{%- endif %}
pub(crate) mod target_test;

use std::path::{Path, PathBuf};
use std::process::Command;

/// What `{{ command }} --version` prints: the crate's own version.
const VERSION: &str = concat!("{{ command }} ", env!("CARGO_PKG_VERSION"), "\n");

/// Holds the installed product's version, which a product that links providers follows
/// with them in parentheses.
fn has_version(printed: &str) -> bool {
    let version = VERSION.trim_end();
    printed.strip_suffix('\n').is_some_and(|line| {
        line == version
            || line.strip_prefix(version).is_some_and(|rest| rest.starts_with(" (") && rest.ends_with(')'))
    })
}

{%- if languages == "linked" %}
/// Reads the languages the installed command links: the providers its `--version` lists in
/// parentheses, else those of its provider catalog.
fn linked(command: &Path) -> std::io::Result<Vec<String>> {
    let printed = output(Command::new(command).arg("--version"))?;
    if let Some((_, languages)) = printed.strip_suffix(")\n").and_then(|text| text.split_once(" (")) {
        if languages.is_empty() { return Ok(Vec::new()); }
        return languages.split(", ").map(|language| {
            language.split_once(' ').map(|(name, _)| name.to_owned())
                .ok_or_else(|| std::io::Error::other("the version has an invalid provider"))
        }).collect();
    }
    let printed = output(Command::new(command).args(["relation", "describe", "comment", "--json"]))?;
    let catalog: serde_json::Value = serde_json::from_str(&printed).map_err(std::io::Error::other)?;
    catalog.get("languages").and_then(serde_json::Value::as_array)
        .ok_or_else(|| std::io::Error::other("the catalog has no languages"))?
        .iter().map(|entry| {
            entry.as_str().and_then(|text| text.split_once(": "))
                .map(|(name, _)| name.to_owned())
                .ok_or_else(|| std::io::Error::other("the catalog has an invalid language"))
        }).collect()
}
{%- endif %}

/// The product's `distribution` directory, which holds this file, the targets' runner and
/// one directory per registry, beside the command line crate whose `distribution` test
/// target this file is.
fn distribution_directory() -> PathBuf {
    Path::new(env!("CARGO_MANIFEST_DIR")).join("../distribution")
}

/// The directory of `registry`'s build, package files, targets and smoke test.
fn registry_directory(registry: &str) -> PathBuf {
    distribution_directory().join("registries").join(registry)
}

/// Runs `command` to completion for its effect, or answers an error carrying both of its
/// outputs when it fails.
pub(crate) fn run(command: &mut Command) -> std::io::Result<()> {
    let ran = command.output()?;
    if ran.status.success() {
        Ok(())
    } else {
        Err(failure(command, &ran))
    }
}

/// Runs `command` to completion and answers its standard output, or an error carrying both
/// of its outputs when it fails.
pub(crate) fn output(command: &mut Command) -> std::io::Result<String> {
    let ran = command.output()?;
    if !ran.status.success() {
        return Err(failure(command, &ran));
    }
    String::from_utf8(ran.stdout).map_err(std::io::Error::other)
}

/// The error of `command`, which ended with `ran`: its status and both of its outputs.
fn failure(command: &Command, ran: &std::process::Output) -> std::io::Error {
    std::io::Error::other(format!(
        "{command:?} failed with {}:\n{}{}",
        ran.status,
        String::from_utf8_lossy(&ran.stdout),
        String::from_utf8_lossy(&ran.stderr)
    ))
}

/// Installs the command line crate under `root` with `cargo install`, in the workspace's
/// `profile`, linking `languages` alone when it names any and the crate's defaults
/// otherwise, and returns the installed command.
fn cargo_install(root: &Path, profile: &str, languages: &[String]) -> std::io::Result<PathBuf> {
    let mut install = Command::new("cargo");
    install
        .args(["install", "--locked", "--profile", profile, "--path"])
        .arg(env!("CARGO_MANIFEST_DIR"))
        .arg("--root")
        .arg(root);
    if !languages.is_empty() {
        install
            .arg("--no-default-features")
            .arg("--features")
            .arg(languages.join(","));
    }
    run(&mut install)?;
    let binary = format!("{{ command }}{}", std::env::consts::EXE_SUFFIX);
    Ok(root.join("bin").join(binary))
}
{%- if present["npm-smoke-test"] | default(false) %}

/// The host's target triple, as rustc names it.
fn host() -> std::io::Result<String> {
    output(Command::new("rustc").arg("-vV"))?
        .lines()
        .find_map(|line| line.strip_prefix("host: "))
        .map(str::to_owned)
        .ok_or_else(|| std::io::Error::other("`rustc -vV` names no host"))
}
{%- endif %}
{%- if present["npm-smoke-test"] | default(false) or present["pypi-smoke-test"] | default(false) %}

/// The strings of the array at `keys`, a path of table keys, in the TOML file `file`: none
/// when the file has no such array.
fn strings(file: &Path, keys: &[&str]) -> std::io::Result<Vec<String>> {
    let document = toml::Value::Table(
        std::fs::read_to_string(file)?
            .parse()
            .map_err(std::io::Error::other)?,
    );
    Ok(keys
        .iter()
        .try_fold(&document, |value, key| value.get(*key))
        .and_then(toml::Value::as_array)
        .map(|elements| {
            elements
                .iter()
                .filter_map(toml::Value::as_str)
                .map(str::to_owned)
                .collect()
        })
        .unwrap_or_default())
}
{%- endif %}
