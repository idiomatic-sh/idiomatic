description = "The npm package users install, `@<organization>/<product>`: its command runs `launcher.js`, and it carries no binary and no install script. Packing stamps the crate's version, license and repository and one `optionalDependencies` entry per platform package (Cargo is the one version authority), so npm installs only the platform package matching the machine and nothing downloads at install."
why = "Users install one name on every machine, and the version in it can never differ from the crate's because it is stamped, not written."
params = { command = { type = "identifier", description = "The command the product installs: the binary's name, which the launcher, the entry point and the smoke tests run, and the name of the binary in every archive. It is the product's name where the product installs a command of that name." }, organization = { type = "identifier", description = "The organization every package is published under, written as a Python identifier (`idiomatic_sh`): the npm scope and the PyPI distribution's name use its hyphenated form (`idiomatic-sh`), the Python module this form." }, product = { type = "identifier", description = "The product: its command, and the package's name." } }
content = '''
{
  "name": "@{{ organization | kebab }}/{{ product }}",
  "description": "The {{ product }} command line: runs the native binary from the platform package npm installs for this machine.",
  "bin": {
    "{{ command }}": "launcher.js"
  },
  "files": [
    "launcher.js"
  ],
  "engines": {
    "node": ">=18"
  }
}
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'registries/npm/package.json'
given.params = { organization = 'idiomatic_sh', command = 'tastemaker', product = 'tastemaker' }
given.files.'registries/npm/package.json' = '''
{
  "name": "@idiomatic-sh/tastemaker",
  "description": "The tastemaker command line: runs the native binary from the platform package npm installs for this machine.",
  "bin": {
    "tastemaker": "launcher.js"
  },
  "files": [
    "launcher.js"
  ],
  "engines": {
    "node": ">=18"
  }
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'registries/npm/package.json'
given.params = { organization = 'idiomatic_sh', command = 'tastemaker', product = 'tastemaker' }
then.findings = [
  { rule = 'npm-package#count', path = '.' },
]
