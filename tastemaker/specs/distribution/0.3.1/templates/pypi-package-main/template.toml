description = "`python -m <organization>_<product>`: runs the executable the wheel installed with the same arguments and exit status, for environments where the scripts directory is not on PATH."
why = "The command stays reachable through the interpreter when the environment's scripts directory is not on PATH."
params = { organization = { type = "identifier", description = "The organization every package is published under, written as a Python identifier (`idiomatic_sh`): the npm scope and the PyPI distribution's name use its hyphenated form (`idiomatic-sh`), the Python module this form." }, product = { type = "identifier", description = "The product: its command, and its Python package's name." } }
content = '''
"""`python -m {{ organization }}_{{ product }}`: runs the {{ product }} executable with the same arguments."""

import os
import subprocess
import sys

from {{ organization }}_{{ product }} import find_{{ product | snake }}_bin


def main() -> None:
    """Replace this process with {{ product }}, or run it and pass its exit status on Windows."""
    executable = find_{{ product | snake }}_bin()
    if sys.platform == "win32":
        sys.exit(subprocess.call([executable, *sys.argv[1:]]))
    os.execv(executable, [executable, *sys.argv[1:]])


if __name__ == "__main__":
    main()
'''

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'registries/pypi/python/idiomatic_sh_tastemaker/__main__.py'
