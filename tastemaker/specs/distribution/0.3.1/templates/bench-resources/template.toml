description = "The distribution bench's memory sampler: samples the measured command's process tree every 5 ms, outside the measured command and its CPU time, following overlapping, reparented and recycled processes."
why = "A run's peak memory includes the children it spawns, which kernel maximum RSS alone misses."
match = "text"
content = '''
//! The sampled process-tree RSS: 5ms observations, never an exact peak or cgroup metric.
//! Shared pages can be counted twice; short-lived children/spikes can be missed.

use std::collections::BTreeMap;
use std::path::Path;
use std::process::{Child, Output};
use std::time::{Duration, Instant};
use sysinfo::{Pid, ProcessRefreshKind, ProcessesToUpdate, System};

/// How long the sampler sleeps between two observations of the process tree.
pub(super) const INTERVAL: Duration = Duration::from_millis(5);

/// What the sampler saw of one measured run's process tree, and what sampling it cost.
#[derive(Default, Debug)]
pub(super) struct Sampled {
    /// The largest resident memory of the whole tree at one observation, in bytes.
    pub peak: u64,
    /// The observations that found the tree alive.
    pub samples: usize,
    /// The sampler's own CPU time, spent outside the measured command.
    pub cpu: Duration,
    /// The longest wait between two observations, which bounds the spikes it can miss.
    pub longest_gap: Duration,
}

/// PID plus process start time prevents a recycled PID inheriting tree membership.
#[derive(Default)]
pub(super) struct Tree {
    /// The processes of the tree, each by its PID and its start time.
    members: BTreeMap<Pid, u64>,
    /// The tree's root, by its PID and its start time, once it has been seen.
    root: Option<(Pid, u64)>,
}

impl Tree {
    /// Follows the tree of `root` through one observation of `processes` (each its PID, start time,
    /// parent and resident bytes), and answers the resident bytes of the tree's live members.
    pub(super) fn sample(&mut self, root: Pid, processes: &[(Pid, u64, Option<Pid>, u64)]) -> u64 {
        if self.root.is_none() {
            self.root = processes
                .iter()
                .find(|(pid, ..)| *pid == root)
                .map(|(pid, start, ..)| (*pid, *start));
        }
        self.members.retain(|pid, start| {
            processes
                .iter()
                .any(|(live, created, ..)| pid == live && start == created)
        });
        if let Some((pid, start)) = self.root
            && processes
                .iter()
                .any(|(live, created, ..)| *live == pid && *created == start)
        {
            self.members.extend([(pid, start)]);
        }
        loop {
            let before = self.members.len();
            let joined: Vec<(Pid, u64)> = processes
                .iter()
                .filter(|(_, _, parent, _)| {
                    parent.is_some_and(|parent| self.members.contains_key(&parent))
                })
                .map(|(pid, start, ..)| (*pid, *start))
                .collect();
            self.members.extend(joined);
            if self.members.len() == before {
                break;
            }
        }
        processes
            .iter()
            .filter(|(pid, start, ..)| self.members.get(pid) == Some(start))
            .map(|(.., bytes)| bytes)
            .sum()
    }
}

/// The sampler lives in the bench process, outside hyperfine's measured command tree.
pub(super) fn observe(mut child: Child, pidfile: &Path) -> std::io::Result<(Output, Sampled)> {
    let mut system = System::new();
    let mut tree = Tree::default();
    let mut measured = Sampled::default();
    let mut previous = None;
    let mut root = None;
    loop {
        if root.is_none() {
            root = std::fs::read_to_string(pidfile)
                .ok()
                .and_then(|text| text.trim().parse::<u32>().ok())
                .map(Pid::from_u32);
        }
        if let Some(root) = root {
            let cpu = cpu_time::ThreadTime::now();
            let now = Instant::now();
            if let Some(previous) = previous {
                measured.longest_gap = measured.longest_gap.max(now.duration_since(previous));
            }
            previous = Some(now);
            // sysinfo answers how many processes it refreshed; the tree is read from the processes themselves.
            let _refreshed = system.refresh_processes_specifics(
                ProcessesToUpdate::All,
                true,
                ProcessRefreshKind::nothing().with_memory().without_tasks(),
            );
            let processes = system
                .processes()
                .iter()
                .map(|(pid, process)| {
                    (
                        *pid,
                        process.start_time(),
                        process.parent(),
                        process.memory(),
                    )
                })
                .collect::<Vec<_>>();
            let bytes = tree.sample(root, &processes);
            measured.peak = measured.peak.max(bytes);
            measured.samples += usize::from(bytes > 0);
            measured.cpu += cpu.elapsed();
        }
        if child.try_wait()?.is_some() {
            break;
        }
        std::thread::sleep(INTERVAL);
    }
    Ok((child.wait_with_output()?, measured))
}
'''

[given]
file = 'resources.rs'

