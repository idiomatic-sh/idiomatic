description = "What the command prints over a target, as a summary: `findings.toml` at the pinned revision, and `edit-findings.toml` after the target's one-file edit is applied; each states the sha256 `digest` of the whole findings document (only boolean tools[].reused cache provenance normalized to false) in canonical form, the `exit_code` the run must end with (the product's own exit rule: Tastemaker 1 only when an error-level finding is expected, asymptote 1 when a new finding is, Ryo 0 for a query that ran) and the count per rule under `[rules]`, a table left out when no rule found anything."
why = "Time alone can be won by finding less, so each run is held to the findings expected of it."
content = '''
{% if scaffold | default(false) %}
# The findings the command prints over this target: the sha256 of the whole
# findings document in canonical form, the exit status the run must end with
# and their count per rule.
# The runner writes this file from a run (proof/summary_test.rs) and holds every run to
# `digest` and `exit_code` exactly; on a mismatch it names the per-rule changes.
#   digest = "<sha256 hex>"
#   exit_code = <n>
#   [rules]
#   "<rule>" = <n>
{% endif %}
'''

[given]
file = 'findings.toml'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'findings.toml' = '''
# The findings the command prints over this target: the sha256 of the whole
# findings document in canonical form, the exit status the run must end with
# and their count per rule.
digest = "9d0f2143c61cfbb6c0cf0425ce8b447811a32d48ec37333ba8b3700218631b36"
exit_code = 0
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'target-findings#count', path = '.' },
]
