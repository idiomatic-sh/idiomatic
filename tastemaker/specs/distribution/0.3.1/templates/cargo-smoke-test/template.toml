        assert!(
            !output.status.success() && said.contains("`package.publish`"),
            "{said}"
        );
        writeln!(
            std::io::stdout(),
            "cargo: the dry-run publish is not yet possible: the manifest says `publish = false`"
        )
        .unwrap();
