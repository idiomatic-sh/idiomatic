description = "One use case's module file: its interface and its implementation, public, and its test under #[cfg(test)]."
why = "Declares one scoped use case's interface, the struct implementing it and its test, so an edge names exactly the use case it builds, every use case of a core compiles the same way, and none runs untested. It declares the members every use case has; the module file lies outside the part and a template sees only its own instance, so the part's optional types and errors with their tests are held by the shared rule `module-declares`."
content = '''
//! The `{{ domain }}` domain's `{{ use_case }}` use case.
{% if (scaffold | default(false)) or present["interface"] | default(false) %}
pub mod interface;
{%- endif %}
pub mod use_case;
{%- if present["types"] | default(false) %}
pub mod types;
{%- endif %}
{%- if present["errors"] | default(false) %}
pub mod errors;
{%- endif %}
{%- if present["use-case-fixtures"] | default(false) %}

#[cfg(any(test, feature = "fixtures"))]
pub mod fixtures;
{%- endif %}

#[cfg(test)]
mod use_case_test;
'''

[params]
domain = { type = "identifier", from = "directory-name", description = "The core, its crate directory's name." }
use-case = { type = "identifier", description = "The use case, captured from its path." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'src/inbound/use_cases/greet.rs'
given.params = { domain = 'greeting', use-case = 'greet' }
given.files.'src/inbound/use_cases/greet.rs' = '''
//! The `greeting` domain's `greet` use case.

pub mod interface;
pub mod use_case;

#[cfg(test)]
mod use_case_test;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'src/inbound/use_cases/greet.rs'
given.params = { domain = 'greeting', use-case = 'greet' }
given.files.'src/inbound/use_cases/greet.rs' = '''
//! The `greeting` domain's `greet` use case.

pub mod interface;
pub mod use_case;

#[cfg(test)]
mod use_case_test;

pub mod errors;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/inbound/use_cases/greet.rs'
given.params = { domain = 'greeting', use-case = 'greet' }
then.findings = [
  { rule = 'use-case-module#count', path = '.' },
]

[[scenarios]]
id = 'test-not-cfg-test'
scenario = "The use case's test is compiled outside tests."
given.file = 'src/inbound/use_cases/greet.rs'
given.params = { domain = 'greeting', use-case = 'greet' }
given.files.'src/inbound/use_cases/greet.rs' = '''
//! The `greeting` domain's `greet` use case.

pub mod interface;
pub mod use_case;

mod use_case_test;
'''
then.findings = [
  { rule = 'use-case-module#template', path = 'src/inbound/use_cases/greet.rs' },
]
