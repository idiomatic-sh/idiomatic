description = "The core's use cases: one public module per use case part the product places, and nothing else."
why = "Declares each use case part so an edge reaches its interface and its struct, while the use cases themselves, their interfaces and their logic, live in their own directories as parts of kind `use-case`. The list is rendered from the parts the product's tastemaker.toml places, so a use case that is placed and not declared here is a finding."
content = '''
{% if not (scaffold | default(false)) or use_case is defined %}
//! The `{{ domain }}` domain's use cases, one module each.
{% if (scaffold | default(false)) and use_case is defined %}
pub mod {{ use_case }};
{% else %}
{% for part in instances["use-case"] | default([]) %}
pub mod {{ part.name }};
{%- endfor %}

{% endif %}
{% endif %}
'''

[params]
domain = { type = "identifier", from = "directory-name", description = "The domain, its directory's name." }

[given]
file = 'src/inbound/use_cases.rs'
params = { domain = 'greeting' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/inbound/use_cases.rs' = '''
//! The `greeting` domain's use cases, one module each.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/inbound/use_cases.rs' = '''
//! The `greeting` domain's use cases, one module each.

pub mod greet;
pub mod part;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'use-cases#count', path = '.' },
]
