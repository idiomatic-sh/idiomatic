description = "The core's inbound module: the use cases an edge calls, declared as one public module."
why = "Gathers everything an edge may call under one directory, `inbound/`, so the core's services, types and outbound ports are never an entry point and the whole surface is one declaration."
content = '''
//! The `{{ domain }}` domain's inbound surface: the use cases an edge calls, or, for a language provider, the contracts it fulfils.
{%- if present["use-cases"] | default(true) %}

pub mod use_cases;
{%- endif %}
{%- if present["contracts"] | default(false) %}

pub(crate) mod contracts;
{%- endif %}
'''

[params]
domain = { type = "identifier", from = "directory-name", description = "The core, its crate directory's name." }

[given]
file = 'src/inbound.rs'
params = { domain = 'greeting' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/inbound.rs' = '''
//! The `greeting` domain's inbound surface: the use cases an edge calls.

pub mod use_cases;
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/inbound.rs' = '''
//! The `greeting` domain's inbound surface: the use cases an edge calls.

pub mod use_cases;

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'inbound#count', path = '.' },
]

[[scenarios]]
id = 'no-use-cases'
scenario = 'The module file does not declare the use cases.'
given.files.'src/inbound.rs' = '''
//! The `greeting` domain's inbound surface: the use cases an edge calls.
'''
then.findings = [
  { rule = 'inbound#template', path = 'src/inbound.rs' },
]
