description = "The core's outbound module: one public module per outbound port part the product places, and nothing else."
why = "Declares each port the core calls across a boundary, so every port is found in one place and the adapters implement exactly these. The list is rendered from the parts of kind `port` the product's tastemaker.toml places, so a port that is placed and not declared here is a finding."
content = '''
//! The `{{ domain }}` domain's outbound ports: what it needs from outside, one module each.
{%- set vis = "pub(crate) " if present["language-conformance-test"] | default(false) else "" %}
{% for part in instances.port | default([]) %}
{{ vis }}mod {{ part.name }};
{%- endfor %}
'''

[params]
domain = { type = "identifier", from = "directory-name", description = "The core, its crate directory's name." }

[given]
file = 'src/outbound.rs'
params = { domain = 'greeting' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'src/outbound.rs' = '''
//! The `greeting` domain's outbound ports: what it needs from outside, one module each.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'src/outbound.rs' = '''
//! The `greeting` domain's outbound ports: what it needs from outside, one module each.

pub mod names;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'outbound#count', path = '.' },
]
