description = "Domain owns core concepts, invariants, algorithms and data models, independent of I/O and workflow. Application owns cohesive operations over domain and outbound, including shared state and its lifetime. Outbound owns injected contracts and adapters for external facts, storage and effects. Inbound/use cases provide slim, readable orchestration. Separation of responsibilities does not require copied data or repeated computations. Within one crate, imports: inbound → application/domain/outbound; application → domain/outbound; domain and outbound → no other architectural layers. Own-layer, standard-library and external dependencies are allowed. Edges construct outbound store adapters from path configuration and inject their interfaces. Application owns their use and lifetime; domain never opens storage."
