//! What the greeting domain's `greet` promises, against the fakes of the ports it calls, from its fixtures.

use std::sync::Arc;

use super::errors::GreetError;
use super::interface::GreetUseCase;
use super::use_case::GreetUseCaseImpl;
use crate::cases::{Case, Expect, Word, run};
use crate::outbound::names::fixtures::fake::NamesFake;
use crate::outbound::names::errors::NamesError;
use crate::outbound::names::types::Greeting;

type Input = (GreetUseCaseImpl, &'static str);
type Value = Greeting;
type Failure = GreetError;

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: "greets the person named",
        word: Word::Succeeds,
        input: || (GreetUseCaseImpl::new(Arc::new(NamesFake)), "Ada"),
        expect: Expect::Value(Greeting("hello, Ada")),
    },
    Case {
        name: "refuses an empty name",
        word: Word::Refuses,
        input: || (GreetUseCaseImpl::new(Arc::new(NamesFake)), ""),
        expect: Expect::Error(GreetError::Empty),
    },
    Case {
        name: "fails when the names port refuses the name",
        word: Word::Fails,
        input: || (GreetUseCaseImpl::new(Arc::new(NamesFake)), "nobody"),
        expect: Expect::Error(GreetError::Names(NamesError::Missing)),
    },
];

