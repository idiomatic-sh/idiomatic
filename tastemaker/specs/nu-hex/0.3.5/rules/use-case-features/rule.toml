description = "Each use case module `src/inbound/use_cases/<use_case>.rs` has its feature `src/inbound/use_cases/<use_case>/acceptance.feature`."
why = "A core's behaviour is one feature per use case, and a core knows its use cases are required, so a use case with no feature describes nothing a test runs. The crate spec's `bdd-members` pairs the features that exist with their steps and their use case; this is the reverse, which only a core can say, since a crate with no use case has no feature. Read as the file names say: a use case and a feature are paired when they share the `<use_case>` name under the same crate."

query = '''
let features = capture(from="filesystem.file", path="path", pattern="{*root}/src/inbound/use_cases/{use_case}/acceptance.feature", captures=["root", "use_case"]);
let use-cases = capture(from="filesystem.file", path="path", pattern="{*root}/src/inbound/use_cases/{use_case}.rs", captures=["root", "use_case"]);
let feature-keys = project(from=features, columns=["root", "use_case"]);
let unfeatured = antijoin(left=use-cases, right=feature-keys, left-on=["root", "use_case"], right-on=["root", "use_case"]);
let unfeatured-rows = project(from=unfeatured, columns=["path", "use_case"]);
emit unfeatured-rows subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "use case `{use_case}` has no feature `src/inbound/use_cases/{use_case}/acceptance.feature`"
help = "Write the use case's feature with `tm scaffold bdd-feature --at src/inbound/use_cases/<use_case>/acceptance.feature` and its steps beside the other steps files; a use case is required to say what it promises in Gherkin."

[given]
include = ['app/src/inbound/use_cases/*/acceptance.feature', 'app/src/inbound/use_cases/*.rs']
files.'app/src/inbound/use_cases/greet.rs' = '''
//! The greet use case.
'''

[[scenarios]]
id = 'use-case-feature'
scenario = 'A use case with its feature.'
given.files.'app/src/inbound/use_cases/greet/acceptance.feature' = '''
Feature: Greeting
'''

[[scenarios]]
id = 'no-feature'
scenario = 'A use case with no feature.'
then.findings = [
  { path = 'app/src/inbound/use_cases/greet.rs' },
]
