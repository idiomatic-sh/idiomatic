description = "The command tree's root: parses the command line and runs the command it names, with `--version` on every command, the support line under the top-level help, `--no-color`, and the panic report."
why = "Is the single dispatch from the command line to each command, so the command line has one shape and every command is reachable; and it is where the Command Line Interface Guidelines (clig.dev) settings every command shares are set once: `--version` and `-V` on every command, where to report a problem, `--no-color`, a panic reported as an internal error rather than Rust's text, and `command()`, the tree the generated contract test walks. The resources are the ones the product's command parts sit under, so a resource with a command is declared and dispatched, and none without. The commands are typed flat (`<command>`) or under their resource (`<resource> <command>`): a product with one resource generates the flat form, and either form is met, because the file declares what both have and the generated contract test holds the tree to one of the two. The binary's name is the package's, held by that test. The root also reads the command line's `--format`, `--json`, `-q` and, when `writes` names a command, `-n/--dry-run`, global, and builds the `Edge` once from them and from the directory and build `main` hands to `run`, so every resource's `run(command, &edge)` and every command's `run(arguments, edge)` get the one edge; a command line none of whose commands writes takes no `-n/--dry-run` and builds no `writing`, as its `edge` has none."
content = '''
//! The command tree: the commands of the product's resources, and what the command line
//! itself answers: help, the version, usage errors, `--no-color` and a panic.
{# The resources are told by the command parts the product places: one `pub mod` for each resource that holds a command. #}
{%- set resources = instances.command | default([]) | map(attribute="resource") | unique | list %}
{%- for resource in resources %}
pub mod {{ resource }};
{%- endfor %}

/// The command line: its commands are typed `<command>` when the tree is flat, `<resource> <command>` when it is nested.
#[derive(clap::Parser)]
#[command(propagate_version = true, after_help = SUPPORT, arg = no_color())]
struct Cli {
    #[command(flatten)]
    timings: crate::timings::TimingsArgs,
    #[command(flatten)]
    output: crate::output::FormatSwitch,
{%- if writes != "[]" %}
    #[command(flatten)]
    dry_run: crate::output::dry_run::DryRunSwitch,
{%- endif %}
    #[command(subcommand)]
{%- if resources | length == 1 %}
    command: {{ resources[0] }}::{{ resources[0] | pascal }}Command,
{%- else %}
    resource: Resource,
{%- endif %}
}
{%- if resources | length != 1 %}

/// The resources.
#[derive(clap::Subcommand)]
enum Resource {
{%- for resource in resources %}
    #[command(subcommand)]
    {{ resource | pascal }}({{ resource }}::{{ resource | pascal }}Command),
{%- endfor %}
}
{%- endif %}

/// The command tree, which the generated command-line contract test walks.
#[must_use]
pub fn command() -> clap::Command {
{%- if writes != "[]" %}
    // The format and `-n/--dry-run` are the command line's, taken anywhere on it.
    ["format", "json", "quiet", "dry_run"].into_iter().fold(
{%- else %}
    // The format is the command line's, taken anywhere on it.
    ["format", "json", "quiet"].into_iter().fold(
{%- endif %}
        <Cli as clap::CommandFactory>::command().version(env!("cargo-pkg-version")),
        |tree, id| tree.mut_arg(id, |argument| argument.global(true)),
    )
}

/// Parses the command line and runs the command it names, from `start` with `build`, which
/// `main` read; a panic is reported as an internal error and ends as one.
#[must_use]
pub fn run(start: &str, build: &str) -> std::process::ExitCode {
    report_panics();
    let outcome = std::panic::catch_unwind(|| run_from(std::env::args_os().collect(), start, build))
        .unwrap_or(crate::outcome::Outcome::Error);
    crate::output::progress::settle();
    std::process::ExitCode::from(outcome)
}

/// Runs the command line `arguments`, the program's name first.
fn run_from(
    arguments: Vec<std::ffi::OsString>,
    start: &str,
    build: &str,
) -> crate::outcome::Outcome {
    let started = std::time::Instant::now();
    color(&arguments);
    crate::output::quiet(&arguments);
    let matches = match command().try_get_matches_from(arguments) {
        Ok(matches) => matches,
        Err(error) => return usage(&error),
    };
    let arguments = match <Cli as clap::FromArgMatches>::from_arg_matches(&matches) {
        Ok(arguments) => arguments,
        Err(error) => return usage(&error),
    };
    let _timings = match crate::timings::install(arguments.timings.timings, started) {
        Ok(guard) => guard,
        Err(error) => return crate::output::fail(&error, crate::outcome::Outcome::Error),
    };
    let here = tastemaker_core::domain::files::types::MachinePath(start.into());
    let edge = crate::edge::Edge {
        start: here.clone(),
        here,
        store: tastemaker_core::domain::files::types::DirectoryName(
            concat!(".", env!("cargo-pkg-name"), "_cache").into(),
        ),
        build: tastemaker_core::domain::settings::types::Build(build.into()),
        format: arguments.output.format(),
{%- if writes != "[]" %}
        writing: if arguments.dry_run.dry_run() {
            tastemaker_core::domain::writing::types::Writing::DryRun
        } else {
            tastemaker_core::domain::writing::types::Writing::Write
        },
{%- endif %}
    };
{%- if resources | length == 1 %}
    {{ resources[0] }}::run(arguments.command, &edge)
{%- else %}
    match arguments.resource {
{%- for resource in resources %}
        Resource::{{ resource | pascal }}(command) => {{ resource }}::run(command, &edge),
{%- endfor %}
    }
{%- endif %}
}

/// Where to report a problem, printed under the top-level help.
const SUPPORT: &str = concat!("Report a problem: ", env!("cargo-pkg-repository"), "/issues");

/// `--no-color`, which every command takes: no styles, wherever the output goes.
#[must_use]
fn no_color() -> clap::Arg {
    clap::Arg::new("no-color")
        .long("no-color")
        .global(true)
        .action(clap::ArgAction::SetTrue)
        .help("Print no styles, wherever the output goes, as `NO_COLOR` does")
}

/// Drops every style before anything is written when `arguments` hold `--no-color`
/// before any `--`: clap prints help and usage errors before the switch is parsed.
fn color(arguments: &[std::ffi::OsString]) {
    if arguments
        .iter()
        .take_while(|argument| *argument != "--")
        .any(|argument| argument == "--no-color")
    {
        anstream::ColorChoice::Never.write_global();
    }
}

/// Replaces Rust's panic message with what happened, where, and where to report it, on
/// stderr; the command then ends as [`crate::outcome::Outcome::Error`], never with Rust's 101.
fn report_panics() {
    std::panic::set_hook(Box::new(crate::output::panicked));
}

/// Prints clap's own answer, help, the version or a usage error, on the stream clap
/// chooses, and ends as clap does: help and the version as [`crate::outcome::Outcome::Success`], a usage
/// error as [`crate::outcome::Outcome::Error`]. A reader that closed the pipe does not make help fail.
fn usage(error: &clap::Error) -> crate::outcome::Outcome {
    let outcome = if error.use_stderr() {
        crate::outcome::Outcome::Error
    } else {
        crate::outcome::Outcome::Success
    };
    match error.print() {
        Err(failed) if failed.kind() != std::io::ErrorKind::BrokenPipe => crate::outcome::Outcome::Error,
        _ => outcome,
    }
}
