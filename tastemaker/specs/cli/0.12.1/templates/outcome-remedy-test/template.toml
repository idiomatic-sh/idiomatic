description = "The proof of a command line's remedies, beside `src/outcome/remedy.rs`: the next step each error gives."
why = "Every placed logic file has its test beside it: a product writes a `Remedy` per error type, and the next step it prints is a promise to the user, proven where it is written."
content = '''
//! Proves what the user does next about each error a command can end with.
'''

[given]
file = 'cli/src/outcome/remedy_test.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'cli/src/outcome/remedy_test.rs' = '''
//! Proves what the user does next about each error a command can end with.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'outcome-remedy-test#count', path = '.' },
]
