description = "A resource's module: its commands, and the dispatch to them."
why = "Declares a resource's commands and dispatches to them, so a command resolves the same way for every resource, typed flat or under its resource. The commands are the command parts the product places beneath the resource, so a command that exists is declared and dispatched, and none that does not."
content = '''
//! `{{ resource }}`: one module per command.
{% for part in instances.command | default([]) %}
{%- if part.resource == resource %}
pub mod {{ part.name }};
{%- endif %}
{%- endfor %}

/// The `{{ resource }}` commands.
#[derive(clap::Subcommand)]
pub enum {{ resource | pascal }}Command {
{%- for part in instances.command | default([]) %}
{%- if part.resource == resource %}
    {{ part.name | pascal }}({{ part.name }}::command::{{ part.name | pascal }}Arguments),
{%- endif %}
{%- endfor %}
}

/// Runs one `{{ resource }}` command with the edge the command tree built.
pub fn run(command: {{ resource | pascal }}Command, edge: &crate::edge::Edge) -> crate::outcome::Outcome {
    match command {
{%- for part in instances.command | default([]) %}
{%- if part.resource == resource %}
        {{ resource | pascal }}Command::{{ part.name | pascal }}(arguments) => {{ part.name }}::command::run(arguments, edge),
{%- endif %}
{%- endfor %}
    }
}
'''

[params]
resource = { type = "identifier", description = "The resource, captured from its path." }

[given]
file = 'cli/src/resources/greeting.rs'
params = { resource = 'greeting' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
