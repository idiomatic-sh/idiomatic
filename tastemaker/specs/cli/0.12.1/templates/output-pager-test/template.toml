description = "The proof of a command line's pager, beside `src/output/pager.rs`: which pager a long terminal answer goes through, and when none is started."
why = "Every placed logic file has its test beside it: the choice of pager and the fallback to stdout are logic, proven where they are written."
content = '''
//! Proves which pager a long terminal answer goes through, and when it goes straight to stdout.
'''

[given]
file = 'cli/src/output/pager_test.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'cli/src/output/pager_test.rs' = '''
//! Proves which pager a long terminal answer goes through, and when it goes straight to stdout.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'output-pager-test#count', path = '.' },
]
