description = "A command line's linked language providers: the one file holding each provider's link, one line per Cargo feature."
why = "A build links the language providers its features select, and each is found by discovery, never named in code. The links sit in one edge file, the same in every command line, so which languages a build reads is one place to look and no other file of the product names a provider. A command line that links none has no such file."
content = '''
//! The language providers this build links, one per enabled feature: each is linked for its
//! registration, which discovery finds, and is named nowhere else.
'''

[given]
file = 'cli/src/languages.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'cli/src/languages.rs' = '''
//! The language providers this build links, one per enabled feature: each is linked for its
//! registration, which discovery finds, and is named nowhere else.
'''

[[scenarios]]
id = 'extra-content'
scenario = "A file may carry more than its template, such as each provider's link."
given.files.'cli/src/languages.rs' = '''
//! The language providers this build links, one per enabled feature: each is linked for its
//! registration, which discovery finds, and is named nowhere else.

#[cfg(feature = "markdown")]
use demo_language_markdown as _;
#[cfg(feature = "toml")]
use demo_language_toml as _;
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'languages#count', path = '.' },
]
