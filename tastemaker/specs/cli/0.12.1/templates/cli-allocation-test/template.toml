description = "The command line's allocation test: a test of its own, with no harness, that installs `dhat` as the global allocator and counts the big blocks of a run, so that what is big is owned by the workers and never allocated again for the files."
why = "Only a count proves a run allocates no big block per file, and only a process of its own can count: a global allocator counts every thread, so the test has `harness = false` and no other test beside it, and its `main` is the whole test. The file is the `#[global_allocator]` static and the `main` that runs the profile; it may carry more (the helpers and assertions of the count). The command line crate has one, at `tests/blocks.rs`, like the core's `lint-allocation-test`; `tests/blocks.rs` and `benches/lint.rs` of the command line crate are placed by the `cli` spec. The crate's manifest declares it `[[test]] harness = false`."
content = '''
//! The big blocks of a run, counted from the allocation profile `dhat` writes. It runs alone in its process.

#[global_allocator]
static ALLOCATOR: dhat::Alloc = dhat::Alloc;

fn main() {}
'''

[given]
file = 'tests/blocks.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'tests/blocks.rs' = '''
//! The big blocks of a run, counted from the allocation profile `dhat` writes. It runs alone in its process.

#[global_allocator]
static ALLOCATOR: dhat::Alloc = dhat::Alloc;

fn main() {}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'tests/blocks.rs' = '''
//! The big blocks of a run over ruff, counted from the allocation profile `dhat` writes. It runs alone in its process.

use std::sync::Arc;

#[global_allocator]
static ALLOCATOR: dhat::Alloc = dhat::Alloc;

/// A megabyte.
const BIG: f64 = 1_048_576.0;

fn main() {
    let profile = std::env::temp_dir().join("blocks.json");
    let _profiler = dhat::Profiler::builder().file_name(&profile).build();
    assert!(BIG > 0.0, "a megabyte is more than nothing");
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'cli-allocation-test#count', path = '.' },
]
