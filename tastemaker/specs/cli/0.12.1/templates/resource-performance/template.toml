description = "A resource's bench module: one module per command."
why = "Declares the benches of one resource's commands, so each resource's benches sit under one module."
content = '''
//! `{{ resource }}`: one bench module per command.
{% for command in captures.command | default([]) %}
mod {{ command }};
{%- endfor %}
'''

[params]
resource = { type = "identifier", description = "The resource, captured from its path." }

[given]
file = 'cli/benches/performance/greeting.rs'
params = { resource = 'greeting' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'cli/benches/performance/greeting.rs' = '''
//! `greeting`: one bench module per command.
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'cli/benches/performance/greeting.rs' = '''
//! `greeting`: one bench module per command.


// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'resource-performance#count', path = '.' },
]
