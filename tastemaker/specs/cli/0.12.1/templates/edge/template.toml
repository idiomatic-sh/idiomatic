description = "The edge every command takes: where the search for the project starts, where the command line was started, where the store is kept, the build that runs, the format the answer is printed in, and, when a command writes, whether it writes; built once by the command tree and handed to every command's `run`."
why = "Keeps every command reading the world the same way: the process's directory, the build stamp and the command line's `--format`, `--json`, `-q` and `-n/--dry-run` switches are read once, in `main` and the command tree's root, and handed down as one value, so a command never reads the current directory or its own format (`io-at-boundary` refuses `std::env::current_dir` beneath the root) and every product's commands take the same `run(arguments, edge: &Edge) -> Outcome`. The content is Tastemaker's edge; each field's type is the product's own (a field is a part of its struct, which the comparison does not read), so a product writes its own path, store, build and writing types in the same six fields. A command line none of whose commands writes (the `cli` spec's `writes` is empty) takes no `-n/--dry-run`, so its edge has no `writing` field: five fields."
content = '''
//! The edge every command takes: what the command line read of where it runs, built once before the command runs and
//! handed to it, so no command reads the process's directory, its build or its own format{% if writes != "[]" %} and dry-run{% endif %} switches.

/// What every command reads of where it runs: where the search for the project starts, where the command line was
{%- if writes != "[]" %}
/// started, where the store is kept, the build that runs, the format the answer is printed in, and whether the command
/// writes.
{%- else %}
/// started, where the store is kept, the build that runs and the format the answer is printed in.
{%- endif %}
#[derive(Clone, Debug, PartialEq, Eq)]
pub struct Edge {
    /// Where the project is looked for: this directory, then its ancestors.
    pub start: tastemaker_core::domain::files::types::MachinePath,
    /// The directory the command line was started in, before any `--root` replaced `start`.
    pub here: tastemaker_core::domain::files::types::MachinePath,
    /// The directory beneath a project's root where the store is kept.
    pub store: tastemaker_core::domain::files::types::DirectoryName,
    /// The build that runs.
    pub build: tastemaker_core::domain::settings::types::Build,
    /// The format the answer is printed in: `--format`, `--json` or `-q`, taken anywhere on the line.
    pub format: crate::output::Format,
{%- if writes != "[]" %}
    /// Whether a command writes, or `-n/--dry-run` only says what it would write.
    pub writing: tastemaker_core::domain::writing::types::Writing,
{%- endif %}
}
'''

[params]
writes = { type = "list<string>", description = "The commands that write, as the `cli` spec's `writes` names them: when it names any, the edge carries `writing`, whether the command writes or `-n/--dry-run` only says what it would write; when it is empty, the command line takes no `-n/--dry-run` and the edge has no `writing` field." }

[given]
file = 'cli/src/edge.rs'
params = { writes = ['greeting write'] }

