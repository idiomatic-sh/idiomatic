description = "The proof of a command line's progress line, beside `src/output/progress.rs`: when it is drawn and when `settle` takes it down."
why = "Every placed logic file has its test beside it: the progress layer decides when a line is drawn and cleared, proven where it is written."
content = '''
//! Proves when the progress line is drawn on stderr, and that `settle` takes it down.
'''

[given]
file = 'cli/src/output/progress_test.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'cli/src/output/progress_test.rs' = '''
//! Proves when the progress line is drawn on stderr, and that `settle` takes it down.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'output-progress-test#count', path = '.' },
]
