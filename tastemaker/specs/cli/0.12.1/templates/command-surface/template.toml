description = "A command line's surface snapshot: every command, flag, short and value name, one line each, written by the command-tree contract test."
why = "Makes every change to what a user types a visible change to one checked-in file: `command-tree-contract` renders the surface from the clap tree and compares it with this file through snapbox, and `SNAPSHOTS=overwrite` rewrites it. The content is the test's to write, so the template places the file and renders nothing."
content = ''

[given]
file = 'cli/tests/command_tree/surface.txt'

[[scenarios]]
id = 'command-line-surface-snapshot-passes'
scenario = 'A command line with its surface snapshot passes.'
given.files.'cli/tests/command_tree/surface.txt' = '''
demo
  --format <FORMAT>
'''

[[scenarios]]
id = 'snapshot-missing'
scenario = 'The snapshot is missing.'
given.files.'cli/src/lib.rs' = '''
//! A command line with no surface snapshot.
'''
then.findings = [
  { rule = 'command-surface#count', path = '.' },
]
