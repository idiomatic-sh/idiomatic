description = "A command line's main: the command tree, on the allocator ruff and uv ship (jemalloc where it builds, mimalloc on Windows)."
why = "Starts the command line on jemalloc (mimalloc on Windows), as ruff and uv do: a run frees and allocates again across many worker threads, and the system allocator keeps what a thread freed in that thread's arena, so runs were slower. It then reads the process's directory, the one place that does, and hands it with the build to the command tree, which builds the `Edge` from them, so the binary's entry point holds no other logic. The crate depends on `tikv-jemallocator` and `mimalloc` under the same target conditions."
content = '''
//! The {{ product }} command line.

/// The allocator on Windows: mimalloc, as ruff and uv ship it.
#[cfg(target_os = "windows")]
#[global_allocator]
static GLOBAL: mimalloc::MiMalloc = mimalloc::MiMalloc;

/// The allocator wherever jemalloc builds: jemalloc, as ruff and uv ship it.
#[cfg(all(
    not(target_os = "windows"),
    not(target_os = "openbsd"),
    not(target_os = "aix"),
    not(target_os = "android"),
    any(
        target_arch = "x86_64",
        target_arch = "aarch64",
        target_arch = "powerpc64",
        target_arch = "riscv64"
    )
))]
#[global_allocator]
static GLOBAL: tikv_jemallocator::Jemalloc = tikv_jemallocator::Jemalloc;

fn main() -> std::process::ExitCode {
    let start = std::env::current_dir()
        .map(|directory| directory.display().to_string())
        .unwrap_or_default();
    {{ product | snake }}::resources::run(&start, env!("cargo-pkg-version"))
}
'''

[params]
product = { type = "identifier", description = "The product: the command line's package, and so its library, is named after it (the `crate` spec's `cli-crate` entry)." }

[given]
file = 'cli/src/main.rs'
params = { product = 'cli' }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
