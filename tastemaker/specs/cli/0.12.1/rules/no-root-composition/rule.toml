description = "A command line crate has no `src/composition.rs`: each command's `composition.rs` is its whole wiring."
why = "Composition is owned at the edge, one per command: each command's `composition.rs` is its whole wiring, and there is no `cli/src/composition.rs`. A crate-wide composition root would be a second place a command's implementations are chosen, and the Services every command shared. The crate spec places no `src/composition.rs`, so the file is also a closed finding; this rule says what to do with it in a command line crate."

query = '''
let files = project(from="filesystem.file", columns=["path"]);
emit files subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "the command line crate has a crate-wide composition root"
help = "Move each command's wiring into its own `src/resources/<resource>/<command>/composition.rs`, then delete `src/composition.rs` and its `mod composition;`. An ignore is never the fix."

[given]
include = ['cli/src/composition.rs']

[[scenarios]]
id = 'crate-wide-composition-root'
scenario = 'A crate-wide composition root.'
given.files.'cli/src/composition.rs' = '''
//! The composition root.

/// Every service.
pub fn services() {}
'''
then.findings = [
  { path = 'cli/src/composition.rs' },
]

[[scenarios]]
id = 'per-command'
scenario = 'Only per-command compositions.'
given.files.'cli/src/resources/greeting/show/composition.rs' = '''
//! The wiring of `greeting show`.

/// The service.
pub fn build() {}
'''
