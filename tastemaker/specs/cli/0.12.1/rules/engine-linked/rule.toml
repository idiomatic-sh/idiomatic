description = "Selects the command line's manifest when it depends directly on ryo's core engine crate, so a condition it answers holds when the command line runs rules."
why = "Lets the cli spec tell whether the product owns a rule engine: a command line that depends on the engine crate (`idiomatic-sh-ryo-core`, under its own name or renamed) runs rules itself, so the per-rule allocation test and bench exist exactly then. One that only uses the SDK crate (`ryo`) composes the engine through it, owns no rule to measure, and would hold hollow files. It answers the `links-engine` condition and is never placed as a check, so its rows are never findings; its level only lets its fixtures show them."

query = '''
let entries = project(from="entry", columns=["file", "owner", "key", "decoded"]);
let named = select * from entries where key = "idiomatic-sh-ryo-core";
let packages = select * from entries where key = "package";
let renamed = select * from packages where decoded = "idiomatic-sh-ryo-core";
let by-key = project(from=named, columns=["file"]);
let by-package = project(from=renamed, columns=["file"]);
let rows = union(left=by-key, right=by-package);
emit rows subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "`{file}` depends on the core engine crate"
help = "Nothing to fix: this rule only answers a condition, and its rows are never reported as findings."

[given]
include = ['Cargo.toml']

[[scenarios]]
id = 'manifest-naming-engine-crate-dependency-answers-yes'
scenario = 'A manifest naming the engine crate as a dependency answers yes.'
given.files.'Cargo.toml' = '''
[package]
name = "ryo"
version = "0.1.0"

[dependencies]
idiomatic-sh-ryo-core = { path = "../crates/core" }
'''
then.findings = [
  { path = 'Cargo.toml' },
]

[[scenarios]]
id = 'manifest-renaming-engine-crate-dependency-answers-yes'
scenario = 'A manifest renaming the engine crate as a dependency answers yes.'
given.files.'Cargo.toml' = '''
[package]
name = "ryo"
version = "0.1.0"

[dependencies]
ryo_core = { package = "idiomatic-sh-ryo-core", path = "../crates/core" }
'''
then.findings = [
  { path = 'Cargo.toml' },
]

[[scenarios]]
id = 'manifest-depending-only-sdk-answers-no'
scenario = 'A manifest depending only on the SDK answers no.'
given.files.'Cargo.toml' = '''
[package]
name = "tastemaker"
version = "0.1.0"

[dependencies]
ryo = { package = "idiomatic-sh-ryo-sdk", path = "../../ryo/crates/sdk" }
'''
