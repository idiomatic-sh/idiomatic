description = "A command's module file: the command, its connections, its composition, its schemas, and its test under #[cfg(test)]."
why = "Declares a command and the files every command has beside it, each one primitive: the connections that open its stores, the composition that wires its service, the schemas that check its arguments, and its test, so each command directory compiles as one unit. A command's optional files (its composition test, its fixtures) are declared by `module-declares`, which reads the directory: a template sees only its own instance, not the part's optional files."
content = '''
//! `{{ resource }} {{ command }}`.

pub mod command;
pub(crate) mod composition;
{%- if present["connections"] | default(false) %}
pub(crate) mod connections;
{%- endif %}
pub(crate) mod schemas;

#[cfg(test)]
mod command_test;
{%- if present["composition-test"] | default(false) %}

#[cfg(test)]
mod composition_test;
{%- endif %}
{%- if present["edge-fixtures"] | default(false) %}

#[cfg(any(test, feature = "fixtures"))]
pub(crate) mod fixtures;
{%- endif %}
'''

[params]
resource = { type = "identifier", description = "The resource, captured from its path." }
command = { type = "identifier", description = "The command, captured from its path." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'cli/src/resources/greeting/show.rs'
given.params = { resource = 'greeting', command = 'show' }
given.files.'cli/src/resources/greeting/show.rs' = '''
//! `greeting show`.

pub mod command;
pub(crate) mod composition;
pub(crate) mod connections;
pub(crate) mod schemas;

#[cfg(test)]
mod command_test;
'''

[[scenarios]]
