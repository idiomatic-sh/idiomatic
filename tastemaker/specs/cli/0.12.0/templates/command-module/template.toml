'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'cli/src/resources/greeting/show.rs'
given.params = { resource = 'greeting', command = 'show' }
then.findings = [
  { rule = 'command-module#count', path = '.' },
]

