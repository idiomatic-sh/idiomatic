    let matches = command.get_matches_from(std::iter::once("bench").chain(line.iter().copied()));
    A::from_arg_matches(&matches).unwrap_or_else(|error| panic!("the arguments parse: {error}"))
}

/// More.
pub(crate) fn more() {}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'performance-fixtures#count', path = '.' },
]

[[scenarios]]
id = 'no-arguments'
scenario = 'The fixtures parse no arguments.'
given.files.'cli/benches/performance/fixtures.rs' = '''
//! The inputs every workload runs over.
'''
then.findings = [
  { rule = 'performance-fixtures#template', path = 'cli/benches/performance/fixtures.rs' },
]
