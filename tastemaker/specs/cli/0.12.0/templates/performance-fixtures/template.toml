description = "The inputs the command benches run over: the product's fixture workspace and the parse of a command's arguments."
why = "Keeps what every workload runs over in one file, so a workload is only its measured run and a fixture is built once the same way."
content = '''
//! The inputs every workload runs over.

/// The command's arguments, parsed from `line` as the command line would.
pub(crate) fn arguments<A: clap::Args + clap::FromArgMatches>(line: &[&str]) -> A {
    let command = A::augment_args(clap::Command::new("bench"));
    let matches = command.get_matches_from(std::iter::once("bench").chain(line.iter().copied()));
    A::from_arg_matches(&matches).unwrap_or_else(|error| panic!("the arguments parse: {error}"))
}
'''

[given]
file = 'cli/benches/performance/fixtures.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'cli/benches/performance/fixtures.rs' = '''
