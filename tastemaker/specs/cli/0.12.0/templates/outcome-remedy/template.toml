description = "A command line's remedies: `Next` and `Remedy`, what the user does next about each error a command can end with, matched with no wildcard."
why = "Makes every error say what to do next. `crate::output::fail` takes no error without a `Remedy`, so the compiler asks for one per error type; the module's `#![deny(clippy::wildcard_enum_match_arm)]`, which the template contract compares, makes each impl here name every variant, so a new variant does not compile until it is given its next step. A product writes its error types' impls here."
content = '''
//! What the user does next about each error a command can end with (clig.dev, Errors),
//! printed as `help:` under it by `crate::output::fail`. Each product implements
//! [`Remedy`] here for every error type its commands fail with, and every match names
//! every variant: a wildcard is refused, so a new variant does not compile until it is
//! given its next step.
#![deny(clippy::wildcard_enum_match_arm)]

#[cfg(test)]
#[path = "remedy_test.rs"]
mod tests;

/// What the user does next about an error, printed as `help:` under it.
#[derive(Clone, Debug, PartialEq, Eq)]
pub enum Next {
    /// A command line that moves the user on.
    Run(String),
    /// What to change, said as an instruction.
    Fix(String),
    /// Nothing the user did: a bug, to report at the repository's issues.
    Report,
}

impl std::fmt::Display for Next {
    fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        match self {
            Self::Run(command) => write!(formatter, "run `{command}`"),
            Self::Fix(change) => formatter.write_str(change),
            Self::Report => write!(
                formatter,
                "this is a bug in {} {}; please report it, with the command line you ran: {}/issues/new",
                env!("cargo-pkg-name"),
                env!("cargo-pkg-version"),
                env!("cargo-pkg-repository"),
            ),
        }
    }
}

/// An error that says what to do about it.
pub trait Remedy {
    /// What the user does next.
    fn next(&self) -> Next;
}

/// `--timings` could not install its subscriber: another was installed first, which no
/// command line the user writes can cause.
impl Remedy for tracing::subscriber::SetGlobalDefaultError {
    fn next(&self) -> Next {
        Next::Report
    }
}
'''

[given]
file = 'cli/src/outcome/remedy.rs'

