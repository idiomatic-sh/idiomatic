description = "A command's bench: its workload, run for its rounds through the product's command line."
why = "Measures one command's workload through the binary's own command line and hands its CPU times to the entry, which prints them, so a command that slows down is seen by the performance tool's lock."
content = '''
//! `{{ resource }} {{ command }}`'s workload.

pub(crate) fn workload() -> crate::measure::Measured {
    crate::measure::rounds(
        "{{ resource }}/{{ command }}",
        || (),
        |()| {
            let line = <{{ product | snake }}::resources::{{ resource }}::{{ command }}::command::{{ command | pascal }}Arguments as clap::Args>::augment_args(
                clap::Command::new("{{ command }}"),
            );
            let arguments = <{{ product | snake }}::resources::{{ resource }}::{{ command }}::command::{{ command | pascal }}Arguments as clap::FromArgMatches>::from_arg_matches(
                &line.get_matches_from(["{{ command }}"]),
            );
            assert!(arguments.is_ok(), "`{{ resource }} {{ command }}` parses with no arguments");
            let Ok(arguments) = arguments else { return };
            let outcome = {{ product | snake }}::resources::{{ resource }}::{{ command }}::command::run(arguments);
            assert_eq!(
                outcome,
                {{ product | snake }}::outcome::Outcome::Success,
                "`{{ resource }} {{ command }}` did not succeed"
            );
        },
    )
}
'''

[params]
product = { type = "identifier", description = "The product: the command line's package, and so the library its bench calls, is named after it." }
resource = { type = "identifier", description = "The resource, captured from its path." }
command = { type = "identifier", description = "The command, captured from its path." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'cli/benches/performance/greeting/show/bench.rs'
given.params = { product = 'cli', resource = 'greeting', command = 'show' }
given.files.'cli/benches/performance/greeting/show/bench.rs' = '''
//! `greeting show`'s workload.

pub(crate) fn workload() -> crate::measure::Measured {
    crate::measure::rounds(
        "greeting/show",
        || (),
        |()| {
            let outcome = cli::resources::greeting::show::command::run(
                cli::resources::greeting::show::command::ShowArguments {},
            );
            assert_eq!(
                outcome,
                cli::outcome::Outcome::Success,
                "`greeting show` did not succeed"
            );
        },
    )
}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.file = 'cli/benches/performance/greeting/show/bench.rs'
given.params = { product = 'cli', resource = 'greeting', command = 'show' }
given.files.'cli/benches/performance/greeting/show/bench.rs' = '''
//! `greeting show`'s workload.

pub(crate) fn workload() -> crate::measure::Measured {
    crate::measure::rounds(
        "greeting/show",
        || (),
        |()| {
            let outcome = cli::resources::greeting::show::command::run(
                cli::resources::greeting::show::command::ShowArguments {},
            );
            assert_eq!(
                outcome,
                cli::outcome::Outcome::Success,
                "`greeting show` did not succeed"
            );
        },
    )
}

// More.
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'cli/benches/performance/greeting/show/bench.rs'
given.params = { product = 'cli', resource = 'greeting', command = 'show' }
then.findings = [
  { rule = 'command-bench#count', path = '.' },
]

[[scenarios]]
id = 'not-a-workload'
scenario = 'The command bench does not answer its workload.'
given.file = 'cli/benches/performance/greeting/show/bench.rs'
given.params = { product = 'cli', resource = 'greeting', command = 'show' }
given.files.'cli/benches/performance/greeting/show/bench.rs' = '''
//! `greeting show`'s workload.

fn show() {}
'''
then.findings = [
  { rule = 'command-bench#template', path = 'cli/benches/performance/greeting/show/bench.rs' },
]
