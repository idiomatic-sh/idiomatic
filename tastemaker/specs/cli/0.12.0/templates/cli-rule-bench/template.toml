description = "The command line's per-rule bench: a bench with no harness whose `main` spawns a process of its own for each rule and reports its wall, CPU and peak memory."
why = "A rule's peak memory and cold wall time are only its own in a process of its own, so the bench has `harness = false` and its `main` runs the measuring processes (it re-runs the bench binary with a flag for each rule). The file is the `main`; it may carry more (the sets, the rows, the ratchet). The command line crate has one, at `benches/lint.rs`, beside the command benches of `benches/performance/`. The crate's manifest declares it `[[bench]] harness = false`."
content = '''
//! Each rule of the command line, measured in a process of its own.

fn main() {}
'''

[given]
file = 'benches/lint.rs'

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.files.'benches/lint.rs' = '''
//! Each rule of the command line, measured in a process of its own.

fn main() {}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template.'
given.files.'benches/lint.rs' = '''
//! Each rule over ruff, in a process of its own.

use std::process::Command;

/// The rules measured.
const SPIKED: [&str; 2] = ["deep-nesting", "file-length"];

fn main() {
    let arguments: Vec<String> = std::env::args().collect();
    for set in SPIKED {
        let _ = Command::new(std::env::current_exe().expect("this bench"))
            .args(["--measure", set])
            .output();
    }
    println!("{}", arguments.len());
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
then.findings = [
  { rule = 'cli-rule-bench#count', path = '.' },
]
