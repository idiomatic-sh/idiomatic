  { template = "item", file = "item.rs", params = { item-trait = { param = "item-trait" } }, description = "The item's `use` of its collection's own `<Collection>Item` when the collection names no trait of another crate; where it names a `ReadItem` (a language provider), `use ryo::languages;`, the struct `pub(crate) struct <Part>Item;` and, scaffolded beside them, the `reads!` call. Otherwise the struct, its name, its visibility and the impl are the author's, and the rule `item-implements-trait` holds that it implements a trait." },
  { template = "idiomatic.arch/unit-test@0.1.0", file = "item_test.rs", params = { kind = "item" }, description = "The proof of the item: its own cases, and the collection's shared cases when it has any." },
