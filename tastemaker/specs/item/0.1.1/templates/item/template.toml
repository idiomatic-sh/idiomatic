given.files.'item.rs' = '''
//! The `circle` item of the `shapes` collection: one implementation of the collection's shape.

use ryo::languages;

pub(crate) struct CircleItem;

ryo::reads! {
    CircleItem => languages::Circle |tree, at, _symbols| {
        kinds: every,
        row { }
    }
}
'''

[[scenarios]]
id = 'reads-call'
scenario = 'A language item is its struct and the reads call that names its relation.'
given.file = 'item.rs'
given.params = { part = 'comment', collection = 'relations', item-trait = ['relations=ryo::languages::ReadItem'] }
given.files.'item.rs' = '''
//! The `comment` relation of the language: every comment, with its text after the `#`.

use ryo::languages;

pub(crate) struct CommentItem;

ryo::reads! {
    CommentItem => languages::Comment |_tree, _at, _symbols| {
        kinds: every,
        partial stringify!(unwritten) => languages::Missing::Any;
    }
}
'''

[[scenarios]]
id = 'missing-struct'
scenario = 'A language item without its struct.'
given.file = 'item.rs'
given.params = { part = 'comment', collection = 'relations', item-trait = ['relations=ryo::languages::ReadItem'] }
given.files.'item.rs' = '''
//! The `comment` item of the `relations` collection: one implementation of the collection's shape.

use ryo::languages;
'''
then.findings = [
  { rule = 'item#template', path = 'item.rs' },
]
