description = "One item of a collection: the `use` of its collection's own `<Collection>Item`, when the collection names no trait of another crate."
why = "Holds one implementation of a collection's shape in a directory of its own, so the item is found by its directory's name and its code sits beside its proof. The shape is stated once, as the trait `<Collection>Item` in the collection's interface.rs, and every item implements it; where the collection names the trait of another crate (`item_trait`: `<collection>=<trait path>` pairs), the item implements that one, which the rule `item-implements-trait` holds. The template asks no more than the `use`, because a kernel crate names its item after its relation, a feature crate `<Name>Item` and a language provider writes a `reads!` call, and a spec has no param or variant to say which; the pair's trait tells a provider (`ReadItem`), whose item is asked for `use ryo::languages;` and `pub(crate) struct <Part>Item;`, the `reads!` call being scaffolded beside them and held by `item-implements-trait`."
content = '''
//! The `{{ part }}` item of the `{{ collection }}` collection: one implementation of the collection's shape.

{% set ns = namespace(trait="absent") -%}
{% for pair in (item_trait | default("[]") | split('"') | list) -%}
{% if (pair | split("=") | list)[0] == collection and (pair | split("=") | list | length) == 2 -%}
{% set ns.trait = (pair | split("=") | list)[1] -%}
{% endif -%}
{% endfor -%}
{% if ns.trait == "absent" -%}
use super::super::interface::{{ collection | pascal }}Item;
{%- elif (ns.trait | split("::") | list | last) == "ReadItem" -%}
use ryo::languages;

pub(crate) struct {{ part | pascal }}Item;

ryo::reads! {
    {{ part | pascal }}Item => languages::{{ part | pascal }} |_tree, _at, _symbols| {
        kinds: every,
        partial stringify!(unwritten) => languages::Missing::Any;
    }
}
{%- endif %}
'''

[params]
part = { type = "identifier", from = "directory-name", description = "The part's directory name: the stem of every name in it." }
collection = { type = "identifier", from = "directory-name", description = "The collection the item belongs to, taken from the placing entry's `{collection}` capture; the other kinds do not read it." }
item-trait = { type = "list<string>", description = "The `<collection>=<trait path>` pairs of the crate's collections (`relations=ryo::languages::ReadItem`): the pair of the item's own `collection`, when there is one, names the trait of another crate the item imports and implements; a collection with no pair declares its own `<Collection>Item` in interface.rs." }

[[scenarios]]
id = 'rendered-template-passes'
scenario = 'The rendered template passes.'
given.file = 'item.rs'
given.params = { part = 'circle', collection = 'shapes', item-trait = [] }
given.files.'item.rs' = '''
//! The `circle` item of the `shapes` collection: one implementation of the collection's shape.

use super::super::interface::ShapesItem;

/// `circle`, one item of the `shapes` collection.
struct CircleItem;

impl ShapesItem for CircleItem {}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template: fields and a method.'
given.file = 'item.rs'
given.params = { part = 'circle', collection = 'shapes', item-trait = [] }
given.files.'item.rs' = '''
//! The `circle` item of the `shapes` collection: one implementation of the collection's shape.

use super::super::interface::ShapesItem;

/// `circle`, one item of the `shapes` collection.
pub(crate) struct CircleItem {
    radius: u32,
}

impl ShapesItem for CircleItem {}

impl CircleItem {
    /// The circle's radius.
    pub(crate) fn radius(&self) -> u32 {
        self.radius
    }
}
'''

[[scenarios]]
id = 'multi-word'
scenario = 'The stem of a multi-word name is its PascalCase for an item.'
given.file = 'item.rs'
given.params = { part = 'unit_circle', collection = 'unit_shapes', item-trait = [] }
given.files.'item.rs' = '''
//! The `unit_circle` item of the `unit_shapes` collection: one implementation of the collection's shape.

use super::super::interface::UnitShapesItem;

/// `unit_circle`, one item of the `unit_shapes` collection.
struct UnitCircleItem;

impl UnitShapesItem for UnitCircleItem {}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'item.rs'
given.params = { part = 'circle', collection = 'shapes', item-trait = [] }
then.findings = [
  { rule = 'item#count', path = '.' },
]

[[scenarios]]
id = 'named-trait'
scenario = 'The item implements the trait its collection names in item-trait.'
given.file = 'item.rs'
given.params = { part = 'circle', collection = 'shapes', item-trait = ['shapes=ryo::languages::ReadItem'] }
given.files.'item.rs' = '''
//! The `circle` item of the `shapes` collection: one implementation of the collection's shape.

use ryo::languages;

pub(crate) struct CircleItem;

ryo::reads! {
    CircleItem => languages::Circle |tree, at, _symbols| {
        kinds: every,
        row { }
    }
}
'''

