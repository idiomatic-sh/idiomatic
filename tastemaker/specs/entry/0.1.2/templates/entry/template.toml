description = "A function a user of the product calls, named for its part: checks its request through its schemas, connects and composes its service, and calls it once."
why = "Keeps the SDK's surface thin and in the user's terms: the function takes and answers the product's own types, checks what it is given through its own schemas.rs (the SDK is an edge, where the shape of the data is not ours), connects and composes its service with its own connections.rs and composition.rs and calls it once, so a user never composes the product and its logic lives in the crates the function calls. It is named for its directory, `pub fn <part>`, so a user finds a function by the name of its part."
content = '''
//! `{{ resource }} {{ part }}`: connects, composes, calls the service once.

/// `{{ resource }} {{ part }}`, against the service its composition builds.
pub fn {{ part }}(request: {{ part | pascal }}Request) -> Result<{{ part | pascal }}Report, {{ part | pascal }}Error> {
    super::composition::compose({% if present["connections"] | default(false) %}super::connections::connect(), {% endif %}super::composition::{{ resource | pascal }}{{ part | pascal }}Parts).{{ part }}(request)
}
'''

[params]
resource = { type = "identifier", from = "directory-name", description = "The resource, captured from the path of the entry's part; the directory's own name where the part has no resource." }
part = { type = "identifier", from = "directory-name", description = "The entry's directory name: the function's name." }

[[scenarios]]
id = 'example-entry'
scenario = 'The rendered template passes.'
given.file = 'src/resources/greeting/show/entry.rs'
given.params = { resource = 'greeting', part = 'show' }
given.files.'src/resources/greeting/show/entry.rs' = '''
//! `greeting show`: connects, composes, calls the service once.

/// `greeting show`, against the service its composition builds.
pub fn show(request: ShowRequest) -> Result<ShowReport, ShowError> {
    super::composition::compose(super::connections::connect(), super::composition::GreetingShowParts);
}
'''

[[scenarios]]
id = 'extra-content'
scenario = 'A file may carry more than its template, such as what the function takes and answers.'
given.file = 'src/resources/greeting/show/entry.rs'
given.params = { resource = 'greeting', part = 'show' }
given.files.'src/resources/greeting/show/entry.rs' = '''
//! `greeting show`: connects, composes, calls the service once.

/// `greeting show`, against the service its composition builds.
pub fn show(name: &str) -> String {
    super::composition::compose(super::connections::connect(), super::composition::GreetingShowParts);
    name.to_owned()
}
'''

[[scenarios]]
id = 'file-missing'
scenario = 'The file is missing.'
given.file = 'src/resources/greeting/show/entry.rs'
given.params = { resource = 'greeting', part = 'show' }
then.findings = [
  { rule = 'entry#count', path = '.' },
]

[[scenarios]]
id = 'function-named-part'
scenario = 'The function is not named for its part.'
given.file = 'src/resources/greeting/show/entry.rs'
given.params = { resource = 'greeting', part = 'show' }
given.files.'src/resources/greeting/show/entry.rs' = '''
