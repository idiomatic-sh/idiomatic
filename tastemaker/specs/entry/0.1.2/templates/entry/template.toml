pub fn display(request: DisplayRequest) -> Result<DisplayReport, DisplayError> {
    super::composition::compose(super::connections::connect(), super::composition::GreetingShowParts);
}
'''
then.findings = [
  { rule = 'entry#template', path = 'src/resources/greeting/show/entry.rs' },
]

