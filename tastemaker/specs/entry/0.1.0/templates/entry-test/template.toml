description = "A function's test: what the function promises its caller, as rows of cases."
why = "Proves what a user of the product gets, one row of `CASES` for each case: the input the user gives, one case word, and the answer it returns or the error variant it ends with. The runners are the author's, one for each case word the table has rows of (`test-runners-match-rows`), so a case is a row and nothing else is a test (`test-shape`), a row states its expectation (`case-expectation`), and a function with no row to prove has not been written (`unit-cases`). The scaffold's subject is `todo!` until the case states the call, so a function cannot pass by saying nothing."
content = '''
//! What `{{ resource }} {{ part }}` promises its caller, one row of `CASES` for each case it has.

use crate::cases::{Case, Word, run};

/// What a row gives the function: the input the user gives.
type Input = ();
/// What the function answers when it succeeds.
type Value = ();
/// Why the function ends in error.
type Failure = ();

/// The rows of this function's cases: a name, one case word, the input the user gives, and the answer it returns or the error variant it ends with.
const CASES: &[Case<Input, Value, Failure>] = &[];

/// Calls `{{ resource }} {{ part }}` on one input; the author states it.
fn subject(_input: Input) -> Result<Value, Failure> {
    todo!("call `{{ resource }} {{ part }}` on one input and return its answer or its error")
}
'''

[params]
resource = { type = "identifier", from = "directory-name", description = "The resource, captured from the path of the entry's part; the directory's own name where the part has no resource." }
part = { type = "identifier", from = "directory-name", description = "The entry's directory name: the function's name." }

