description = "One entry of an SDK: the public function a user calls, its test, its composition and connections and its schemas."
why = "An SDK entry is an edge like a command, but it is a public function that returns a value or an error variant instead of printing: it checks its request through its schemas, opens its connections, composes its service once and calls it. It is a separate spec from the command. The sdk spec places each entry."
conditions = { opens-client = { description = "The verb opens a client: its composition names its connections.", rule = { rule = "uses-connections", include = ["composition.rs"] } } }
templates = [
  { template = "entry", file = "entry.rs", imports = { default = "deny", allow = ["std::*", "core::*", "alloc::*", "composition", "connections", "schemas", "crate::vocabulary", "*::interface", "*::types", "*::errors"] }, description = "The public function a user calls, named for its part: it checks its request through its schemas, connects, composes and calls the service once, importing nothing else of the product." },
  { template = "entry-test", file = "entry_test.rs", description = "The proof of one function, through the function itself, as rows of cases: the input a user gives and the answer it returns or the error variant it ends with." },
  { template = "idiomatic.arch/types@0.1.0", file = "types.rs", count = { min = 0 }, params = { kind = "entry" }, description = "The types the SDK owns for this entry when it has any: its request, its report and what they hold; the core's types stay the core's." },
  { template = "idiomatic.arch/errors@0.1.0", file = "errors.rs", count = { min = 0 }, params = { kind = "entry" }, description = "The error the entry returns, when it has one of its own." },
  { template = "idiomatic.arch/composition@0.2.0", file = "composition.rs", description = "The edge's wiring: it takes the clients its connections opened and the parts its caller supplies, chooses its adapters, builds the resources they share and only constructs." },
  { template = "idiomatic.arch/connections@0.1.0", file = "connections.rs", count = { when = { condition = "opens-client" }, then = 1, else = 0 }, description = "The edge's connections: the stores it opens and the clients it returns, the only I/O of the edge." },
  { template = "idiomatic.arch/schemas@0.1.0", file = "schemas.rs", params = { kind = "entry" }, description = "The shape of the data the part does not control and its checked conversion into the core's types and back: the only file with a validation." },
  { template = "idiomatic.arch/schemas-test@0.1.0", file = "schemas_test.rs", params = { kind = "entry" }, description = "The accepted and the refused inputs of the part's schemas." },
  { template = "idiomatic.arch/composition-test@0.1.0", file = "composition_test.rs", count = { min = 0 }, description = "The real compose path run over fake connections, as rows of cases: consequential substitution, shared-instance and error-order proofs." },
  { template = "idiomatic.arch/edge-fixtures@0.1.0", file = "fixtures.rs", count = { min = 0 }, description = "The edge's test data, compiled only for tests and under the `fixtures` feature." },
  { template = "idiomatic.arch/schemas@0.1.0", file = "schemas/{concept}.rs", count = { min = 0 }, params = { kind = "entry" }, description = "The directory form of schemas.rs, one file for each concept the schemas hold, which schemas.rs declares: placed only with two or more files (directory-form), never to pass the length limit." },
  { template = "entry-test", file = "entry_test/{scenario}.rs", count = { min = 0 }, description = "The directory form of entry_test.rs, one file for each scenario the proof holds, which entry_test.rs declares: placed only with two or more files (directory-form), never to pass the length limit." },
  { template = "idiomatic.arch/edge-fixtures@0.1.0", file = "fixtures/{concept}.rs", count = { min = 0 }, description = "The directory form of fixtures.rs, one file for each concept the test data holds, which fixtures.rs declares: placed only with two or more files (directory-form), never to pass the length limit." },
]
rules = [
  { rule = "idiomatic.arch/directory-form@0.1.0", include = ["schemas/*.rs", "fixtures/*.rs", "entry_test/*.rs"], params = { least = 2 }, description = "A directory form of a single-file role holds two or more files: it splits along concept or scenario, never by size, and a directory of one is the single file moved down a level." },
  { rule = "idiomatic.arch/orphan-rust-files@0.1.0", include = ["**"], exclude = ["**/tests/fixtures/**", "**/tests/ui/**"], description = "Every Rust file of the function is a module the crate reaches: a file its module file does not declare is never compiled." },
  { rule = "entry-names", include = ["entry.rs"], description = "An entry's function takes its request (none when the verb has no input) and returns Result<<Verb>Report, <Verb>Error>: a parameter, an answer ending Report and an error ending Error." },
  { rule = "idiomatic.arch/composition-wiring@0.1.0", include = ["composition.rs"], description = "Production builders supply replaceable dependencies; compose and its helpers wire only the supplied choices." },
  { rule = "idiomatic.arch/hollow-services@0.1.0", include = ["composition.rs"], description = "An edge's composition holds `Services` only with a service in it." },
  { rule = "idiomatic.arch/unit-cases@0.1.0", include = ["*_test.rs", "entry_test/*.rs"], description = "A part's test has a `succeeds` row, and a `refuses` row where its errors.rs has a variant of its own." },
  { rule = "idiomatic.arch/schema-name@0.1.0", include = ["schemas.rs", "schemas/*.rs"], description = "A schemas.rs names its wire shapes <Name>Schema and their refusals <Name>SchemaError, converts with TryFrom and does nothing else." },
  { rule = "idiomatic.arch/schema-visibility@0.1.0", include = ["schemas.rs", "schemas/*.rs"], description = "Nothing in a part's schemas is visible beyond the module that owns them." },
  { rule = "idiomatic.arch/hollow-artifacts@0.1.0", include = ["*.rs"], description = "No file of a part is only comments and imports, and no type in it is an empty placeholder." },
  { rule = "idiomatic.arch/validation-at-edges@0.1.0", include = ["*.rs"], exclude = ["schemas.rs", "schemas/*.rs", "*_test.rs", "entry_test/*.rs"], description = "A `TryFrom`, an `impl FromStr` or a fallible constructor is written only in a schemas.rs." },
  { rule = "idiomatic.arch/no-runtime-fixtures@0.1.0", include = ["*.rs"], exclude = ["*_test.rs", "entry_test/*.rs", "fixtures.rs", "fixtures/*.rs"], description = "Nothing in a part but its tests and its fixtures reads a `fixtures` module." },
  { rule = "idiomatic.arch/factory-calls@0.1.0", include = ["*.rs"], exclude = ["composition.rs", "fixtures.rs", "fixtures/*.rs", "*_test.rs", "entry_test/*.rs"], description = "Only an edge's composition (and the part's fixtures and tests) names a `factory` module: only an edge builds an adapter." },
  { rule = "idiomatic.arch/test-shape@0.1.0", include = ["*_test.rs", "entry_test/*.rs"], description = "Every test of a part is a runner named for a case word over a `CASES` table." },
  { rule = "idiomatic.arch/test-runners-match-rows@0.1.0", include = ["*_test.rs", "entry_test/*.rs"], description = "A test file has a runner `run(CASES, Word::<word>, subject)` exactly for each case word its `CASES` table has rows of." },
  { rule = "idiomatic.arch/case-expectation@0.1.0", include = ["*_test.rs", "entry_test/*.rs"], description = "A row of a part's table expects a value or an error variant, never any success." },
]

