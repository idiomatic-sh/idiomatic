given.files.'src/resources/greeting/show/composition.rs' = '''
//! The wiring of `greeting show`: the edge takes the clients its connections opened and the parts its
//! caller supplies, chooses each implementation, passes each client to each factory that needs it, and
//! builds the service it calls. It only constructs: opening a store is the connections' I/O. Nothing here
//! implements a port.

use super::connections::GreetingShowConnections;

/// The dependencies the caller supplies.
pub(crate) struct GreetingShowParts {
    pub greeting: &'static str,
}

/// Wires the service from the clients and the supplied dependencies; it only constructs.
pub(crate) fn compose(connections: GreetingShowConnections, parts: GreetingShowParts) {
    let GreetingShowConnections { store } = connections;
    let GreetingShowParts { greeting } = parts;
    let _ = (store, greeting);
}
'''
given.files.'src/resources/greeting/show/connections.rs' = '''
//! The connections of `greeting show`: it opens the stores the edge reads and writes and returns their
//! clients. This is the only I/O of the edge; the composition takes the clients it returns and only constructs.

/// The clients of the stores `greeting show` reaches, opened once.
pub(crate) struct GreetingShowConnections {
    pub(crate) store: std::path::PathBuf,
}

/// Opens the stores and returns their clients.
pub(crate) fn connect() -> GreetingShowConnections {
    GreetingShowConnections {
        store: std::path::PathBuf::from("greetings.toml"),
    }
}
'''
given.files.'src/resources/greeting/show/entry.rs' = '''
//! `greeting show`: connects, composes, calls the service once.

/// `greeting show`, against the service its composition builds.
pub fn show(request: ShowRequest) -> Result<ShowReport, ShowError> {
    super::composition::compose(super::connections::connect(), super::composition::GreetingShowParts { greeting: "hello" });
}

/// How the answer is printed.
#[derive(Debug, PartialEq)]
pub enum Format {
    Text,
    Json,
}
'''
given.files.'src/resources/greeting/show/entry_test.rs' = '''
//! What `greeting show` promises its caller, one row of `CASES` for each case it has.

use super::entry::show;
use crate::cases::{Case, Expect, Word, run};

/// What a row gives the function: the input the user gives.
type Input = ();
/// What the function answers when it succeeds.
type Value = ();
/// Why the function ends in error.
type Failure = std::convert::Infallible;

/// The rows of this function's cases: a name, one case word, the input the user gives, and the answer it returns or the error variant it ends with.
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: "shows the greeting",
        word: Word::Succeeds,
        input: || (),
        expect: Expect::Value(()),
    },
];

/// Calls `greeting show` the way a user does; the author states it.
fn subject(input: Input) -> Result<Value, Failure> {
    show();
    Ok(input)
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}
'''
given.files.'src/resources/greeting/show/schemas.rs' = '''
//! The shape of the data this entry does not control: each wire shape is a `<Name>Schema`, its checked conversion into the core's type is an `impl TryFrom<<Name>Schema>`, and each refusal of a conversion is a `<Name>SchemaError`.

use super::entry::Format;

#[cfg(test)]
#[path = "schemas_test.rs"]
mod tests;

/// The format as the caller spells it.
pub(super) struct FormatSchema {
    pub(super) text: String,
}

/// Why a format was refused.
pub(super) enum FormatSchemaError {
    Unknown,
}

impl TryFrom<FormatSchema> for Format {
    type Error = FormatSchemaError;

    fn try_from(schema: FormatSchema) -> Result<Self, Self::Error> {
        match schema.text.as_str() {
            "text" => Ok(Format::Text),
            "json" => Ok(Format::Json),
            _ => Err(FormatSchemaError::Unknown),
        }
    }
}
'''
given.files.'src/resources/greeting/show/schemas_test.rs' = '''
//! What the schemas of this entry accept and refuse, one row of `CASES` for each input.

use super::schemas::{FormatSchema, FormatSchemaError};
use super::entry::Format;
use crate::cases::{Case, Expect, Word, run};

type Input = &'static str;
type Value = Format;
type Failure = FormatSchemaError;

/// The rows of this part's cases: a name, one case word, an input from the fixtures or a constructor, and the expected value or error variant.
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: "accepts the text format",
        word: Word::Succeeds,
        input: || "text",
        expect: Expect::Value(Format::Text),
    },
    Case {
        name: "refuses a format nobody knows",
        word: Word::Refuses,
        input: || "xml",
        expect: Expect::Error(FormatSchemaError::Unknown),
    },
];

/// Converts one wire input through the schemas; the author states it.
fn subject(text: Input) -> Result<Value, Failure> {
    Format::try_from(FormatSchema { text: text.to_owned() })
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}

#[test]
fn refuses() {
    run(CASES, Word::Refuses, subject);
}
'''

