given.params = { command = 'tm', configuration = 'tastemaker.toml', validate = 'validate' }
given.files.'main.rs' = '''
//! tastemaker's memory bench: the command line crate installed as Cargo installs it, then five rounds over
//! the Ruff target beside this file (`ruff/`), each run on four CPUs: the peak memory of a cold `check`,
//! and the larger peak memory of `validate` over the target's definitions, cold and warm: the
//! deterministic measures a pull request is judged by, and no wall time, which a shared runner moves
//! from run to run. It prints one Bencher Metric Format document on stdout (benchmark = `ruff`, measures
//! `cold-peak-kib` and `validate-peak-kib`: `value` the
//! median of the rounds, `lower_value` the lowest, `upper_value` the highest) and every line meant
//! for a person on stderr; asymptote's `memory` tool judges the document against its lock, and the
//! bench asserts no budget. It first runs its proofs (the target's preparation and summary) and
//! then its instrument's checks; without `--bench`, as `cargo test` runs it, it runs the proofs
//! alone. It fails when a proof or the instrument fails, or a run cannot start or prints other
//! findings, or ends with another exit code, than `ruff/findings.toml` states.

mod executable;
mod install;
mod instrument;
mod measure;
mod project;
mod proof;
mod resources;

use std::io::Write as _;
use std::path::Path;
use std::process::ExitCode;

/// The target the bench measures, the directory beside this file: its pin, configuration,
/// findings and policy.
const TARGET: &str = "ruff";

/// What the bench takes of each round: the peak of the cold check, and the larger peak of
/// `validate` over the target's definitions cold and warm.
#[derive(Default)]
struct Memory {
    /// The cold check's peak memory in kibibytes, one per round.
    check_peak: Vec<u128>,
    /// The larger peak memory of the two validations in kibibytes, one per round.
    validate_peak: Vec<u128>,
}

/// One round over a fresh checkout of `snapshot`, kept in `taken`: the cold check, whose peak is
/// kept, then `validate` over a second fresh checkout, cold and again warm.
fn round(
    command: &Path,
    target: &Path,
    snapshot: &Path,
    taken: &mut Memory,
) -> std::io::Result<()> {
    let kibibytes = |bytes: u64| u128::from(bytes) / 1024;
    let scratch = tempfile::tempdir()?;
    let (_, project) = project::checkout(command, target, snapshot, scratch.path())?;
    let (_, _, check_peak) = measure::measure(
        command,
        &project,
        scratch.path(),
        &target.join("findings.toml"),
    )?;
    taken.check_peak.push(kibibytes(check_peak));
    let proving = tempfile::tempdir()?;
    let (_, project) = project::checkout(command, target, snapshot, proving.path())?;
    let (_, _, cold_peak) = measure::validate(command, &project, proving.path())?;
    let (_, _, warm_peak) = measure::validate(command, &project, proving.path())?;
    taken
        .validate_peak
        .push(kibibytes(cold_peak.max(warm_peak)));
    Ok(())
}

/// The median of the rounds of a cost: the middle one, or the mean of the two in the middle; 0 for
/// no rounds.
fn median(rounds: &[u128]) -> u128 {
    let mut sorted = rounds.to_vec();
    sorted.sort_unstable();
    let middle = sorted.len() / 2;
    let upper = sorted.get(middle).copied().unwrap_or_default();
    if sorted.len().is_multiple_of(2)
        && let Some(lower) = middle.checked_sub(1).and_then(|index| sorted.get(index))
    {
        lower.midpoint(upper)
    } else {
        upper
    }
}

/// The measures as one Bencher Metric Format document, under the target's name.
fn document(taken: &Memory) -> serde_json::Value {
    let measure = |rounds: &[u128]| {
        let number = |value: u128| u64::try_from(value).unwrap_or(u64::MAX);
        serde_json::json!({
            "value": number(median(rounds)),
            "lower_value": number(rounds.iter().min().copied().unwrap_or_default()),
            "upper_value": number(rounds.iter().max().copied().unwrap_or_default()),
        })
    };
    serde_json::json!({
        TARGET: {
            "cold-peak-kib": measure(&taken.check_peak),
            "validate-peak-kib": measure(&taken.validate_peak),
        }
    })
}

/// The instrument's checks, then the install, the rounds and the document.
fn bench() -> std::io::Result<serde_json::Value> {
    instrument::check().map_err(|error| {
        std::io::Error::other(format!("the instrument fails its check: {error}"))
    })?;
    measure::allocation()?;
    let target = Path::new(env!("CARGO_MANIFEST_DIR"))
        .join("benches/memory")
        .join(TARGET);
    let snapshot = project::preparation::snapshot(&target)?;
    let installed = tempfile::tempdir()?;
    let command = install::cargo_install(installed.path())?;
    let mut taken = Memory::default();
    for _ in 0..measure::ROUNDS {
        round(&command, &target, &snapshot, &mut taken)?;
    }
    writeln!(
        std::io::stderr().lock(),
        "{TARGET}: rounds={} workers={}",
        measure::ROUNDS,
        measure::WORKERS
    )?;
    Ok(document(&taken))
}

/// Runs the proofs, and under `cargo bench` (`--bench`) measures and prints the document: success
/// unless a proof or the instrument fails, or a run cannot run or prints other findings.
fn main() -> ExitCode {
    let measured = proof::check().and_then(|()| {
        if std::env::args().any(|each| each == "--bench") {
            bench().and_then(|document| writeln!(std::io::stdout().lock(), "{document}"))
        } else {
            Ok(())
        }
    });
    match measured {
        Ok(()) => ExitCode::SUCCESS,
        Err(error) => {
            // A closed standard error leaves nothing to report to: the exit code still says the bench failed.
            drop(writeln!(std::io::stderr().lock(), "{error}"));
            ExitCode::FAILURE
        }
    }
}
'''
given.files.'measure.rs' = '''
//! One measured run: wall and child-inclusive CPU from hyperfine, peak memory from hyperfine
//! and the sampled process tree, under an address-space cap on a fixed CPU allocation.

use super::install::output;
use super::project;
use super::resources;
use std::io::Write as _;
use std::path::Path;
use std::process::Command;

/// How many rounds the bench takes: each measure's `value` is the median of these.
pub(super) const ROUNDS: usize = 5;

/// The logical CPUs a run is given, 0 through this many less one: the same allocation on every run, so a number is
/// the engine's and not the machine's.
pub(super) const WORKERS: usize = 4;

/// The address space one run may take, in kibibytes (16 GiB): a runaway run fails instead
/// of taking the machine with it.
const CAP: u64 = 16 * 1024 * 1024;

/// `duration` in milliseconds, to the microsecond, for a line meant for a person.
pub(super) fn milliseconds(duration: std::time::Duration) -> String {
    format!("{:.3}ms", duration.as_secs_f64() * 1000.0_f64)
}

/// `path` as one word of a shell command.
fn quoted(path: &Path) -> String {
    format!("'{}'", path.display().to_string().replace('\'', "'\\''"))
}

/// The same numbered logical CPUs on every run; unavailable allocations are refused.
pub(super) fn allocation() -> std::io::Result<()> {
    let workers = WORKERS;
    let requested = if workers == 1 {
        "0".to_owned()
    } else {
        format!("0-{}", workers - 1)
    };
    let actual = output(Command::new("taskset").args([
        "--cpu-list",
        &requested,
        "sh",
        "-c",
        "taskset --pid --cpu-list $$",
    ]))?;
    if actual.rsplit(':').next().map(str::trim) != Some(requested.as_str()) {
        return Err(std::io::Error::other(format!(
            "requested CPUs {requested}, actual {actual}"
        )));
    }
    Ok(())
}

/// What one measured run reported, before its output is held to anything.
struct Timed {
    /// The run's wall seconds.
    seconds: f64,
    /// The run's user and system CPU seconds, its children's included.
    cpu: f64,
    /// The run's peak memory in bytes: the larger of the kernel's and the sampled tree's.
    peak: u64,
    /// The exit code the run ended with.
    ended: Option<i32>,
    /// The file the run's standard output went to.
    printed: std::path::PathBuf,
}

/// Runs `command arguments` in `project` under hyperfine, on the fixed CPUs and under the address-space cap, and observes the sampled
/// process-tree RSS.
fn timed(
    command: &Path,
    project: &Path,
    scratch: &Path,
    arguments: &str,
) -> std::io::Result<Timed> {
    let workers = WORKERS;
    let printed = scratch.join("printed");
    let report = scratch.join("hyperfine.json");
    let pidfile = scratch.join("measured.pid");
    if pidfile.exists() {
        std::fs::remove_file(&pidfile)?;
    }
    let line = format!(
        "cd {} && ulimit -v {CAP} && echo $$ >{} && exec taskset --cpu-list 0-{} {} {} >{} 2>/dev/null",
        quoted(project),
        quoted(&pidfile),
        workers - 1,
        quoted(command),
        arguments,
        quoted(&printed)
    );
    let child = Command::new("hyperfine")
        .args(["--runs", "1", "--style", "none"])
        .arg("--ignore-failure")
        .arg("--export-json")
        .arg(&report)
        .arg(line)
        .current_dir(env!("CARGO_MANIFEST_DIR"))
        .stdout(std::process::Stdio::piped())
        .stderr(std::process::Stdio::piped())
        .spawn()?;
    let (output, sampled) = resources::observe(child, &pidfile)?;
    if !output.status.success() {
        return Err(std::io::Error::other(
            String::from_utf8_lossy(&output.stderr).into_owned(),
        ));
    }
    let report: serde_json::Value =
        serde_json::from_str(&std::fs::read_to_string(&report)?).map_err(std::io::Error::other)?;
    let missing = |what: &str| std::io::Error::other(format!("hyperfine reports no {what}"));
    let result = report
        .get("results")
        .and_then(|results| results.get(0))
        .ok_or_else(|| missing("result"))?;
    // The first entry of the result's list `key`: the one run hyperfine was asked for.
    let first = |key: &str| result.get(key)?.get(0);
    let seconds = first("times")
        .and_then(serde_json::Value::as_f64)
        .ok_or_else(|| missing("time"))?;
    let peak = first("memory_usage_byte")
        .and_then(serde_json::Value::as_u64)
        .ok_or_else(|| missing("memory"))?;
    let ended = first("exit_codes")
        .and_then(serde_json::Value::as_i64)
        .and_then(|code| i32::try_from(code).ok());
    let user = result
        .get("user")
        .and_then(serde_json::Value::as_f64)
        .ok_or_else(|| missing("user CPU"))?;
    let system = result
        .get("system")
        .and_then(serde_json::Value::as_f64)
        .ok_or_else(|| missing("system CPU"))?;
    writeln!(
        std::io::stderr().lock(),
        "{arguments}: workers={workers} cpus=0-{} wall={seconds:.6}s user={user:.6}s system={system:.6}s kernel-max-rss={peak} sampled-tree-rss={} interval=5ms samples={} sampler-cpu={} longest-gap={}",
        workers - 1,
        sampled.peak,
        sampled.samples,
        milliseconds(sampled.cpu),
        milliseconds(sampled.longest_gap)
    )?;
    Ok(Timed {
        seconds,
        cpu: user + system,
        peak: peak.max(sampled.peak),
        ended,
        printed,
    })
}

/// A run's numbers as the bench keeps them: wall and CPU milliseconds, and the peak in bytes.
fn numbers(run: &Timed) -> std::io::Result<(u128, u128, u64)> {
    let duration =
        |value| std::time::Duration::try_from_secs_f64(value).map_err(std::io::Error::other);
    Ok((
        duration(run.seconds)?.as_millis(),
        duration(run.cpu)?.as_millis(),
        run.peak,
    ))
}

/// Times the full command, holds its output to `expected`, and observes sampled
/// process-tree RSS: its wall and CPU milliseconds and its peak bytes.
pub(super) fn measure(
    command: &Path,
    project: &Path,
    scratch: &Path,
    expected: &Path,
) -> std::io::Result<(u128, u128, u64)> {
    let run = timed(command, project, scratch, project::CHECK)?;
    // The command ends with the exit code its expected findings state.
    let findings = project::hold(&std::fs::read(&run.printed)?, run.ended, expected)?;
    writeln!(std::io::stderr().lock(), "findings={findings}")?;
    numbers(&run)
}

/// Times `validate` over the project's definitions, which must hold: its wall and CPU milliseconds and its peak bytes.
pub(super) fn validate(
    command: &Path,
    project: &Path,
    scratch: &Path,
) -> std::io::Result<(u128, u128, u64)> {
    let run = timed(command, project, scratch, "validate")?;
    if run.ended != Some(0) {
        return Err(std::io::Error::other(format!(
            "`validate` ended with exit code {:?}: {}",
            run.ended,
            String::from_utf8_lossy(&std::fs::read(&run.printed)?)
        )));
    }
    numbers(&run)
}
