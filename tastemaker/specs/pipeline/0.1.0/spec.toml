closed = false
description = "Structural test wiring beside a pipeline use case; executable product tests prove lifecycle behavior."
why = "The language plugs in facts. A primitive implements its semantics through validated inputs, a capability-restricted context and an output contract; the engine owns planning, scheduling, sharing, invalidation and resource lifetime. This overlay checks the shape of test runners and their expectations. Product tests must execute cold and unchanged runs, one-entity edits, failed publication, bounded retention and complete serial/parallel outcomes. A real store test must measure retained files and bytes after repeated unchanged and changed runs, and a deliberately accumulating writer must fail the same bound. The accompanying use-case spec owns its evidence file. Tastemaker does not infer these behavioral guarantees from a case name or source text."
rules = [
  { rule = "idiomatic.arch/test-shape@0.1.0", include = ["use_case_test.rs"], description = "Lifecycle evidence uses the existing case runners." },
  { rule = "idiomatic.arch/case-expectation@0.1.0", include = ["use_case_test.rs"], description = "Cases expect specific values or error variants, rather than merely successful execution." },
]
[given]
at = 'src/run'

[[scenarios]]
id = 'existing-lifecycle-case'
scenario = 'A use case test whose lifecycle evidence is well formed has no finding.'
given.files.'src/run/use_case_test.rs' = '''
use crate::cases::{Case, CaseName, Expect, Word, run};
type Input = u32;
type Value = u32;
type Failure = ();
const CASES: &[Case<Input, Value, Failure>] = &[
    Case { name: CaseName("unchanged_reuses_complete_result"), word: Word::Succeeds,
        input: || 7, expect: Expect::Value(7) },
];
fn subject(input: Input) -> Result<Value, Failure> { Ok(input) }
#[test]
fn succeeds() { run(CASES, Word::Succeeds, subject); }
'''

[[scenarios]]
id = 'malformed-lifecycle-evidence'
scenario = 'A use case test whose lifecycle evidence is malformed is reported by the test-shape rule.'
given.files.'src/run/use_case_test.rs' = '#[test] fn arbitrary() {}'
then.findings = [
  { rule = 'idiomatic.arch/test-shape', path = 'src/run/use_case_test.rs', line = 1 },
]
