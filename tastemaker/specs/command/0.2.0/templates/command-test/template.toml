description = "A command's test: what the command promises its caller, as rows of cases."
why = "Proves what a caller of the command gets, one row of `CASES` for each case: the command line it is given (an argv, from the fixtures or a constructor), one case word, and the printed answer or the outcome it ends with. The runners are the author's, one for each case word the table has rows of (`test-runners-match-rows`), so a case is a row and nothing else is a test (`test-shape`), a row states its expectation (`case-expectation`), and a command with no row to prove has not been written (`unit-cases`). An outcome-only success proves nothing, so the scaffold's subject is `todo!` until the case states a command line and the answer it prints; the input a command refuses is `command-refuses`'s."
content = '''
//! What `{{ resource }} {{ part }}` promises its caller, one row of `CASES` for each case it has.

use crate::cases::{Case, Word, run};

/// What a row gives the command: the command line, one argument at a time.
type Input = Vec<&'static str>;
/// What the command prints when it succeeds.
type Value = String;
/// How the command ends when it does not succeed.
type Failure = crate::outcome::Outcome;

/// The rows of this command's cases: a name, one case word, the command line it is given, and the answer it prints or the outcome it ends with.
const CASES: &[Case<Input, Value, Failure>] = &[];

/// Runs `{{ resource }} {{ part }}` on one command line; the author states it.
fn subject(line: Input) -> Result<Value, Failure> {
    todo!("parse `line` into the arguments of `{{ resource }} {{ part }}`, run it, and return what it printed or the outcome it ended with")
}
'''

[params]
resource = { type = "identifier", from = "directory-name", description = "The resource, captured from the path of the command's part; the directory's own name where the part has no resource." }
part = { type = "identifier", from = "directory-name", description = "The command's directory name." }

