description = "A command: takes its arguments and the command line's edge (`run(arguments, edge: &crate::edge::Edge)`), checks the arguments through its schemas, connects and composes its service, calls it once, and prints the answer through `crate::output` in the edge's format."
why = "Keeps a command thin: it parses, checks what it was given through its own schemas.rs, connects and composes its service with its own connections.rs and composition.rs, calls it once and presents the result, so business logic lives in the crates a command calls. Its entry point is `run` and its arguments are `<Part>Arguments`, so every command reads alike."
content = '''
//! `{{ resource }} {{ part }}`: parses, checks, composes, calls the service, presents.

/// The arguments of `{{ resource }} {{ part }}`: its own flags; the format is the command line's, on the edge.
#[derive(clap::Args)]
pub struct {{ part | pascal }}Arguments;

/// Runs `{{ resource }} {{ part }}`: checks its arguments through its schemas, connects and composes its
/// service, calls it once, and prints the answer in the format `--format` chose, which the edge holds.
pub fn run(arguments: {{ part | pascal }}Arguments, edge: &crate::edge::Edge) -> crate::outcome::Outcome {
    let format = edge.format;
    let request = match arguments.try_into() {
        Ok(request) => request,
        Err(error) => return crate::output::fail(&error, crate::outcome::Outcome::Failure),
    };
    let service = super::composition::compose({% if present["connections"] | default(false) %}super::connections::connect(), {% endif %}super::composition::{{ resource | pascal }}{{ part | pascal }}Parts);
    match service.{{ part }}(request) {
        Ok(answer) => crate::output::present(format, &answer, crate::outcome::Outcome::Success),
        Err(error) => crate::output::fail(&error, crate::outcome::Outcome::Error),
    }
}
'''

[params]
resource = { type = "identifier", from = "directory-name", description = "The resource, captured from the path of the command's part; the directory's own name where the part has no resource." }
part = { type = "identifier", from = "directory-name", description = "The command's directory name." }

[[scenarios]]
id = 'example-command'
scenario = 'The rendered template passes.'
given.file = 'src/resources/greeting/show/command.rs'
given.params = { resource = 'greeting', part = 'show' }
given.files.'src/resources/greeting/show/command.rs' = '''
