description = "One command of a command line: its arguments and thin run, its test, its composition and connections and its schemas."
why = "A command is an edge: it checks what it is given through its schemas, opens its connections, composes its service once and calls it, and presents the result (thin-command). The edge's files are the same few things a command line and an SDK share, but a command prints and ends with an outcome while an SDK entry returns, so the two are separate specs with their own body and test. The cli spec places each command."
conditions = { opens-client = { description = "The verb opens a client: its composition names its connections.", rule = { rule = "uses-connections", include = ["composition.rs"] } } }
templates = [
  { template = "command", file = "command.rs", imports = { default = "deny", allow = ["clap::*", "std::*", "composition", "connections", "schemas", "crate::outcome", "crate::output", "crate::edge", "*::interface", "*::types", "*::errors"] }, description = "The command itself: its arguments and a thin `run` that checks them through its schemas, connects, composes and calls the one service, and prints through `crate::output`, importing nothing else of the product." },
  { template = "command-test", file = "command_test.rs", description = "The proof of what the command promises its caller, as rows of cases: the command line given and the answer printed or the outcome it ends with, the input it refuses included." },
  { template = "idiomatic.arch/composition@0.2.0", file = "composition.rs", description = "The edge's wiring: it takes the clients its connections opened and the parts its caller supplies, chooses its adapters, builds the resources they share and only constructs." },
  { template = "idiomatic.arch/connections@0.1.0", file = "connections.rs", count = { when = { condition = "opens-client" }, then = 1, else = 0 }, description = "The edge's connections: the stores it opens and the clients it returns, the only I/O of the edge." },
  { template = "idiomatic.arch/schemas@0.1.0", file = "schemas.rs", params = { kind = "command" }, description = "The shape of the data the part does not control and its checked conversion into the core's types and back: the only file with a validation." },
  { template = "idiomatic.arch/schemas-test@0.1.0", file = "schemas_test.rs", params = { kind = "command" }, description = "The accepted and the refused inputs of the part's schemas." },
  { template = "idiomatic.arch/composition-test@0.1.0", file = "composition_test.rs", count = { min = 0 }, description = "The real compose path run over fake connections, as rows of cases: consequential substitution, shared-instance and error-order proofs." },
  { template = "idiomatic.arch/edge-fixtures@0.1.0", file = "fixtures.rs", count = { min = 0 }, description = "The edge's test data, compiled only for tests and under the `fixtures` feature." },
]
rules = [
  { rule = "idiomatic.arch/orphan-rust-files@0.1.0", include = ["**"], exclude = ["**/tests/fixtures/**", "**/tests/ui/**"], description = "Every Rust file of the command is a module the crate reaches: a file its module file does not declare is never compiled." },
  { rule = "idiomatic.arch/composition-wiring@0.1.0", include = ["composition.rs"], description = "Production builders supply replaceable dependencies; compose and its helpers wire only the supplied choices." },
  { rule = "idiomatic.arch/hollow-services@0.1.0", include = ["composition.rs"], description = "An edge's composition holds `Services` only with a service in it." },
  { rule = "idiomatic.arch/unit-cases@0.1.0", include = ["*_test.rs"], description = "A part's test has a `succeeds` row, and a `refuses` row where its errors.rs has a variant of its own." },
  { rule = "idiomatic.arch/schema-name@0.1.0", include = ["schemas.rs"], description = "A schemas.rs names its wire shapes <Name>Schema and their refusals <Name>SchemaError, converts with TryFrom and does nothing else." },
  { rule = "idiomatic.arch/schema-visibility@0.1.0", include = ["schemas.rs"], description = "Nothing in a part's schemas is visible beyond the module that owns them." },
  { rule = "idiomatic.arch/hollow-artifacts@0.1.0", include = ["*.rs"], description = "No file of a part is only comments and imports, and no type in it is an empty placeholder." },
  { rule = "idiomatic.arch/validation-at-edges@0.1.0", include = ["*.rs"], exclude = ["schemas.rs", "*_test.rs"], description = "A `TryFrom`, an `impl FromStr` or a fallible constructor is written only in a schemas.rs." },
  { rule = "idiomatic.arch/no-runtime-fixtures@0.2.0", include = ["*.rs"], exclude = ["*_test.rs", "fixtures.rs"], description = "Nothing in a part but its tests and its fixtures reads a `fixtures` module." },
  { rule = "idiomatic.arch/factory-calls@0.1.0", include = ["*.rs"], exclude = ["composition.rs", "fixtures.rs", "*_test.rs"], description = "Only an edge's composition (and the part's fixtures and tests) names a `factory` module: only an edge builds an adapter." },
  { rule = "idiomatic.arch/test-shape@0.2.0", include = ["*_test.rs"], params = { reads = "every-test" }, description = "Every test of a part is a runner named for a case word over a `CASES` table." },
  { rule = "idiomatic.arch/test-runners-match-rows@0.1.0", include = ["*_test.rs"], description = "A test file has a runner `run(CASES, Word::<word>, subject)` exactly for each case word its `CASES` table has rows of." },
  { rule = "idiomatic.arch/case-expectation@0.1.0", include = ["*_test.rs"], description = "A row of a part's table expects a value or an error variant, never any success." },
  { rule = "command-refuses", include = ["command.rs", "command_test.rs"], description = "A command that takes free input has a `refuses` row in its test table proving the input it refuses." },
]

