//! The shape of the data this command does not control: each wire shape is a `<Name>Schema`, its checked conversion into the core's type is an `impl TryFrom<<Name>Schema>`, and each refusal of a conversion is a `<Name>SchemaError`.

use super::command::Format;

#[cfg(test)]
#[path = "schemas_test.rs"]
mod tests;

/// The format as the command line spells it.
pub(super) struct FormatSchema {
    pub(super) text: String,
}

/// Why a format was refused.
pub(super) enum FormatSchemaError {
    Unknown,
}

impl TryFrom<FormatSchema> for Format {
    type Error = FormatSchemaError;

    fn try_from(schema: FormatSchema) -> Result<Self, Self::Error> {
        match schema.text.as_str() {
            "text" => Ok(Format::Text),
            "json" => Ok(Format::Json),
            _ => Err(FormatSchemaError::Unknown),
        }
    }
}
