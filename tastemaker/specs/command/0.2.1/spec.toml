//! `greeting show`: parses, checks, composes, calls the service, presents.

/// The arguments of `greeting show`.
#[derive(clap::Args)]
pub struct ShowArguments {
    #[command(flatten)]
    output: crate::output::FormatSwitch,
}

/// Runs `greeting show`: checks its arguments through its schemas, connects and composes its
/// service, calls it once, and prints the answer in the format `--format` chose.
pub fn run(arguments: ShowArguments, edge: &crate::resources::Resources) -> crate::outcome::Outcome {
    let format = arguments.output.format();
    let request = match arguments.try_into() {
        Ok(request) => request,
        Err(error) => return crate::output::fail(&error, crate::outcome::Outcome::Failure),
    };
    let service = super::composition::compose(super::connections::connect(), super::composition::GreetingShowParts { greeting: "hello" });
    match service.show(request) {
        Ok(answer) => crate::output::present(format, &answer, crate::outcome::Outcome::Success),
        Err(error) => crate::output::fail(&error, crate::outcome::Outcome::Error),
    }
}

/// How the answer is printed.
#[derive(Debug, PartialEq)]
pub enum Format {
    Text,
    Json,
}
