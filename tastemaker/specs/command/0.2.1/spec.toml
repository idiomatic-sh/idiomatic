given.files.'src/resources/greeting/show/command.rs' = '''
//! `greeting show`: parses, checks, composes, calls the service, presents.

use serde_json::json;

/// The arguments of `greeting show`.
#[derive(clap::Args)]
pub struct ShowArguments {
    #[command(flatten)]
    output: crate::output::FormatSwitch,
}

/// Runs `greeting show`: checks its arguments through its schemas, connects and composes its
/// service, calls it once, and prints the answer in the format `--format` chose.
pub fn run(arguments: ShowArguments) -> crate::outcome::Outcome {
    let format = arguments.output.format();
    let request = match arguments.try_into() {
        Ok(request) => request,
        Err(error) => return crate::output::fail(&error, crate::outcome::Outcome::Failure),
    };
    let service = super::composition::compose(super::connections::connect(), super::composition::GreetingShowParts { greeting: "hello" });
    match service.show(request) {
        Ok(answer) => crate::output::present(format, &answer, crate::outcome::Outcome::Success),
        Err(error) => crate::output::fail(&error, crate::outcome::Outcome::Error),
    }
}
'''
given.files.'src/resources/greeting/show/command_test.rs' = '''
//! What `greeting show` promises its caller, one row of `CASES` for each case it has.

use crate::cases::{Case, Expect, Word, run};

/// What a row gives the command: the command line, one argument at a time.
type Input = Vec<&'static str>;
/// What the command prints when it succeeds.
type Value = &'static str;
/// How the command ends when it does not succeed.
type Failure = crate::outcome::Outcome;

/// The rows of this command's cases: a name, one case word, the command line it is given, and the answer it prints or the outcome it ends with.
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: "shows the greeting",
        word: Word::Succeeds,
        input: || vec!["greeting", "show"],
        expect: Expect::Value("hello, Ada\n"),
    },
    Case {
        name: "refuses a format nobody knows",
        word: Word::Refuses,
        input: || vec!["greeting", "show", "--format", "xml"],
        expect: Expect::Error(crate::outcome::Outcome::Failure),
    },
];

/// Runs `greeting show` on one command line; the author states it.
fn subject(line: Input) -> Result<Value, Failure> {
    crate::resources::greeting::show::command::run_line(&line)
}

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}

#[test]
fn refuses() {
    run(CASES, Word::Refuses, subject);
}
'''
given.files.'src/resources/greeting/show/composition.rs' = '''
//! The wiring of `greeting show`: the edge takes the clients its connections opened and the parts its
//! caller supplies, chooses each implementation, passes each client to each factory that needs it, and
//! builds the service it calls. It only constructs: opening a store is the connections' I/O. Nothing here
//! implements a port.

use super::connections::GreetingShowConnections;

/// The dependencies the caller supplies.
pub(crate) struct GreetingShowParts {
    pub greeting: &'static str,
}

/// Wires the service from the clients and the supplied dependencies; it only constructs.
pub(crate) fn compose(connections: GreetingShowConnections, parts: GreetingShowParts) {
    let GreetingShowConnections { store } = connections;
    let GreetingShowParts { greeting } = parts;
    let _ = (store, greeting);
}
'''
given.files.'src/resources/greeting/show/connections.rs' = '''
//! The connections of `greeting show`: it opens the stores the edge reads and writes and returns their
//! clients. This is the only I/O of the edge; the composition takes the clients it returns and only constructs.

/// The clients of the stores `greeting show` reaches, opened once.
pub(crate) struct GreetingShowConnections {
    pub(crate) store: std::path::PathBuf,
}

/// Opens the stores and returns their clients.
pub(crate) fn connect() -> GreetingShowConnections {
    GreetingShowConnections {
        store: std::path::PathBuf::from("greetings.toml"),
    }
}
'''
