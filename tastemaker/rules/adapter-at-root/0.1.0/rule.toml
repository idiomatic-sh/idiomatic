description = "A concrete adapter is named - imported or written as a path - only where it is composed."
why = "An adapter is a replaceable implementation of a port: code that names one depends on that one choice. The places an adapter may be named (its own directory, a binary's main, a composition module, tests and benches) are the entry's `exclude`. An adapter is recognised by the `adapters` module its path runs through. Not seen: a path inside an attribute or a macro invocation, and an adapter reached through a re-export without an `adapters` segment."

query = '''
let imports = project(from="static-import", columns=["occurrence", "file", "span", "target"]);
let references = project(from="reference", columns=["occurrence", "file", "span", "target"]);
let mentions = union(left=imports, right=references);
let adapters = select * from mentions where glob_any(target, "{*::adapters::*,adapters::*}");
emit adapters subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "adapter `{target}` is named outside its own directory and a composition root"
help = "Depend on the port, its `*Port` trait (a hex crate's `*Interface`), instead: take it here as a parameter or generic, and name the concrete adapter only where it is composed (a command's `composition.rs`, `main.rs`, a test or a bench). Ignore only in a file that really composes adapters: `// ignore: idiomatic.arch/adapter-at-root - <what this file composes>` on its own line above the import."

[given]
include = ['**']
exclude = ['**/composition.rs', '**/main.rs', '**/adapters/**', '**/fixtures/**', '**/tests/**', '**/benches/**', '**/*_test.rs']
files.'src/lib.rs' = '''
pub mod port;
'''

