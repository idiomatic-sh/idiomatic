description = "A part's `schemas_test.rs` exists exactly beside its `schemas.rs`: a schemas file always validates, so it always has accepted and refused inputs to prove, and a schemas test with no schemas file beside it proves nothing."
why = "A schemas file always validates, so it always has accepted and refused inputs to prove; a test with nothing beside it to prove, or a schemas file with no test, is a finding. The types and errors tests are retired: a trait impl in types.rs and a function body in errors.rs are proven by the part's own test."

query = '''
let files = project(from="filesystem.file", columns=["path"]);
let present = capture(from=files, path="path", pattern="{*dir}/{stem}.rs", captures=["dir", "stem"]);
let dirs = project(from=present, columns=["dir"]);
let schema-dirs = extend(from=dirs, values={"k": "part"});
let schemas-code = select * from present where stem = "schemas";
let schemas-tests = select * from present where stem = "schemas_test";
let schemas-in = select l."path" as "path", l."dir" as "dir", r."k" as "k" from schemas-code as l join schema-dirs as r on l."dir" = r."dir";
let schemas-behaving = project(from=schemas-in, columns=["path", "dir", "k"]);
let schemas-untested = antijoin(left=schemas-behaving, right=schemas-tests, left-on=["dir"], right-on=["dir"]);
let schemas-untested-findings = extend(from=schemas-untested, values={"stem": "schemas", "problem": "has", "tail": " and no `schemas_test.rs` beside it (scaffold entry `schemas-test`)"});
let schemas-tests-in = select l."path" as "path", l."dir" as "dir", r."k" as "k" from schemas-tests as l join schema-dirs as r on l."dir" = r."dir";
let schemas-unproven = antijoin(left=schemas-tests-in, right=schemas-behaving, left-on=["dir"], right-on=["dir"]);
let schemas-unproven-findings = extend(from=schemas-unproven, values={"stem": "schemas_test", "problem": "holds", "tail": ", but there is no `schemas.rs` beside it for it to prove: delete the test"});
let found = union(left=schemas-untested-findings, right=schemas-unproven-findings);
emit found subject "path" key("dir", "stem", "problem");
'''

[diagnostic]
primary = "path"
message = "`{dir}`: this part {problem} `{stem}.rs`{tail}"
help = "Write the missing test with `tm scaffold <entry> --at <directory>/<file>` (`schemas-test`), or delete a test that has nothing to prove. An ignore is not legitimate here: if the file belongs, the behaviour it proves must exist."

[given]
include = ['src/outbound/names/*.rs']

[[scenarios]]
id = 'port-with-optional-files'
scenario = 'Port with optional files.'
given.files.'src/outbound/names/errors.rs' = '''
//! The `names` failures.

/// Why it failed.
#[derive(Debug, thiserror::Error)]
pub enum NamesError {
    /// Empty.
    #[error("empty")]
    Empty,
}

impl std::fmt::Display for NamesError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "failed")
    }
}
'''
given.files.'src/outbound/names/fixtures.rs' = '''
pub mod contract;
'''
given.files.'src/outbound/names/fixtures/contract.rs' = '''
//! Proves the interface.
'''
given.files.'src/outbound/names/interface.rs' = '''
//! What the `names` port asks of the outside.

/// What every `names` adapter implements.
pub trait NamesPort {}
'''
given.files.'src/outbound/names/schemas.rs' = '''
//! The shape of the data this edge does not control.

#[cfg(test)]
#[path = "schemas_test.rs"]
mod tests;
'''
given.files.'src/outbound/names/schemas_test.rs' = '''
//! Proves the schemas.
'''
given.files.'src/outbound/names/types.rs' = '''
//! The `names` types.

/// A name.
pub struct Name {
    /// Its text.
    pub text: String,
}

impl Default for Name {
    fn default() -> Self {
        Self { text: String::new() }
    }
}
'''

[[scenarios]]
id = 'schemas-test-without-schemas'
scenario = 'Schemas test without schemas.'
given.include = ['src/names/adapters/memory/*.rs']
given.files.'src/names/adapters/memory/adapter.rs' = '''
//! The `names` port, implemented as `memory`.

/// The `memory` names adapter.
pub struct NamesMemoryAdapter;
'''
given.files.'src/names/adapters/memory/adapter_test.rs' = '''
//! Proves the adapter.
'''
given.files.'src/names/adapters/memory/schemas_test.rs' = '''
//! Proves the schemas.
'''
then.findings = [
  { path = 'src/names/adapters/memory/schemas_test.rs' },
]

[[scenarios]]
id = 'schemas-without-test'
scenario = 'Schemas without test: it is reported.'
given.files.'src/outbound/names/fixtures.rs' = '''
pub mod contract;
'''
given.files.'src/outbound/names/fixtures/contract.rs' = '''
//! Proves the interface.
'''
given.files.'src/outbound/names/interface.rs' = '''
//! What the `names` port asks of the outside.

/// What every `names` adapter implements.
pub trait NamesPort {}
'''
given.files.'src/outbound/names/schemas.rs' = '''
//! The shape of the data this edge does not control.

#[cfg(test)]
#[path = "schemas_test.rs"]
mod tests;
'''
then.findings = [
  { path = 'src/outbound/names/schemas.rs' },
]

