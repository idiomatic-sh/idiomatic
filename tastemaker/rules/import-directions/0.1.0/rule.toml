description = "A directory names only what its place in the crate's import directions allows: `forbidden` lists the targets it may not name, and an application service, use case, port or adapter names no sibling of its kind (a use case no other use case, a port no other port, an adapter no other adapter and no other port)."
why = "Imports run one way inside a crate, and a part never reaches its sibling. The explicit local four-layer matrix is placed by nu-hex itself without blanket test or benchmark exemptions; this separate rule preserves the stricter sibling and edge restrictions, and the idiomatic-rust spec adds edge directions: domain imports only domain and the kernel crates' public types, never its own crate's inbound or outbound; an application service imports pure domain functions and outbound contracts, never sibling services or use cases; a use case (`inbound/use_cases/<use case>`) composes application services and imports domain, its own crate's outbound port interface, types and errors, and the kernel, never another use case; a port's `interface.rs`, `types.rs` and `errors.rs` import their own outbound vocabulary and external APIs, never another local layer or another port; an adapter (`outbound/<port>/adapters/<adapter>`) imports its own outbound port, its schemas and external client APIs, and when it translates one crate's use case for another it imports that other crate's use-case interface, types and errors, never another adapter and never another port; an edge (a command, an SDK entry or a composition) imports use-case interface, types and errors and port types and factory, never an adapter or a domain service, and `use_case.rs` is named only in `composition.rs`. The entry's `forbidden` param holds the targets one directory may not name (path globs as written in code, `*::inbound::*`); the identity of a use case, a port and an adapter is read from the file's own path, so a file naming `crate::outbound::<other port>` or `crate::inbound::use_cases::<other use case>` is a finding while its own port and use case are not: the files of one use case name each other with `super::`. Found from the paths the files write in imports and in code: the provider's `static-import` and `reference` relations. Resolved source dependencies also check relative imports and aliases between local parts. Paths inside macro expansions and dynamically chosen effects are not proven; behavioral tests and review remain necessary. The entry leaves out tests, fixtures and benches."

query = '''
param forbidden: set<string>;
let imports = project(from="static-import", columns=["file", "span", "target"]);
let references = project(from="reference", columns=["file", "span", "target"]);
let mentions = union(left=imports, right=references);
let forbidden-rows = select * from mentions where glob_any(target, $forbidden);
let forbidden-keys = project(from=forbidden-rows, columns=["file", "span"]);
let forbidden-found = extend(from=forbidden-keys, values={"problem": "points against the import directions of the directory it is written in"});
let uc-src = capture(from="source-dependency", path="source", pattern="{*root}/inbound/use_cases/{uc}/{*rest}", captures=["root", "uc", "rest"]);
let uc-t0 = capture(from=uc-src, path="target", pattern="{*troot}/inbound/use_cases/{tuc}/{*trest}", captures=["troot", "tuc", "trest"]);
let uc-c0-0 = select * from uc-t0 where root = troot;
let uc-c0-1 = select * from uc-c0-0 where uc != tuc;
let uc-r0 = project(from=uc-c0-1, columns=["source", "span", "target"]);
let uc-t1 = capture(from=uc-src, path="target", pattern="{*troot}/inbound/use_cases/{tuc}.rs", captures=["troot", "tuc"]);
let uc-c1-0 = select * from uc-t1 where root = troot;
let uc-c1-1 = select * from uc-c1-0 where uc != tuc;
let uc-r1 = project(from=uc-c1-1, columns=["source", "span", "target"]);
let uc-u0 = union(left=uc-r0, right=uc-r1);
let uc-named = select l."source" as "file", l."span" as "span" from uc-u0 as l;
let uc-found = extend(from=uc-named, values={"problem": "belongs to another use case: a use case names no other use case"});
let pt-src = capture(from="source-dependency", path="source", pattern="{*root}/outbound/{pt}/{leaf}", captures=["root", "pt", "leaf"]);
let pt-t0 = capture(from=pt-src, path="target", pattern="{*troot}/outbound/{tpt}/{*trest}", captures=["troot", "tpt", "trest"]);
let pt-c0-0 = select * from pt-t0 where root = troot;
let pt-c0-1 = select * from pt-c0-0 where pt != tpt;
let pt-r0 = project(from=pt-c0-1, columns=["source", "span", "target"]);
let pt-t1 = capture(from=pt-src, path="target", pattern="{*troot}/outbound/{tpt}.rs", captures=["troot", "tpt"]);
let pt-c1-0 = select * from pt-t1 where root = troot;
let pt-c1-1 = select * from pt-c1-0 where pt != tpt;
let pt-r1 = project(from=pt-c1-1, columns=["source", "span", "target"]);
let pt-u0 = union(left=pt-r0, right=pt-r1);
let pt-named = select l."source" as "file", l."span" as "span" from pt-u0 as l;
let pt-found = extend(from=pt-named, values={"problem": "belongs to another port: a port names no other port"});
let ap-src = capture(from="source-dependency", path="source", pattern="{*root}/outbound/{ap}/adapters/{adapter}/{*rest}", captures=["root", "ap", "adapter", "rest"]);
let ap-t0 = capture(from=ap-src, path="target", pattern="{*troot}/outbound/{tap}/{*trest}", captures=["troot", "tap", "trest"]);
let ap-c0-0 = select * from ap-t0 where root = troot;
let ap-c0-1 = select * from ap-c0-0 where ap != tap;
let ap-r0 = project(from=ap-c0-1, columns=["source", "span", "target"]);
let ap-t1 = capture(from=ap-src, path="target", pattern="{*troot}/outbound/{tap}.rs", captures=["troot", "tap"]);
let ap-c1-0 = select * from ap-t1 where root = troot;
let ap-c1-1 = select * from ap-c1-0 where ap != tap;
let ap-r1 = project(from=ap-c1-1, columns=["source", "span", "target"]);
let ap-u0 = union(left=ap-r0, right=ap-r1);
let ap-named = select l."source" as "file", l."span" as "span" from ap-u0 as l;
let ap-found = extend(from=ap-named, values={"problem": "belongs to another port: an adapter names its own port and no other"});
let ad-src = capture(from="source-dependency", path="source", pattern="{*root}/outbound/{adport}/adapters/{ad}/{*rest}", captures=["root", "adport", "ad", "rest"]);
let ad-t0 = capture(from=ad-src, path="target", pattern="{*troot}/outbound/{tadport}/adapters/{tad}/{*trest}", captures=["troot", "tadport", "tad", "trest"]);
let ad-c0-0 = select * from ad-t0 where root = troot;
let ad-c0-1 = select * from ad-c0-0 where ad != tad;
let ad-r0 = project(from=ad-c0-1, columns=["source", "span", "target"]);
let ad-named = select l."source" as "file", l."span" as "span" from ad-r0 as l;
let ad-found = extend(from=ad-named, values={"problem": "belongs to another adapter: an adapter names no other adapter"});
let found-0 = union(left=forbidden-found, right=uc-found);
let found-1 = union(left=found-0, right=pt-found);
let found-2 = union(left=found-1, right=ap-found);
let found-3 = union(left=found-2, right=ad-found);
let app-src = capture(from="source-dependency", path="source", pattern="{*root}/application/{app}/{*rest}", captures=["root", "app", "rest"]);
let app-target = capture(from=app-src, path="target", pattern="{*troot}/application/{other}/{*trest}", captures=["troot", "other", "trest"]);
let app-same-root = select * from app-target where root = troot;
let app-other = select * from app-same-root where app != other;
let app-mod-target = capture(from=app-src, path="target", pattern="{*troot}/application/{other}.rs", captures=["troot", "other"]);
let app-mod-root = select * from app-mod-target where root = troot;
let app-mod-other = select * from app-mod-root where app != other;
let app-files = project(from=app-other, columns=["source", "span"]);
let app-mods = project(from=app-mod-other, columns=["source", "span"]);
let app-all = union(left=app-files, right=app-mods);
let app-named = select l."source" as "file", l."span" as "span" from app-all as l;
let app-found = extend(from=app-named, values={"problem": "belongs to a sibling application service: the use case composes their operations"});
let domain-source = select * from "source-dependency" where glob_any(source, "**/domain/**");
let domain-bad = select * from domain-source where glob_any(target, "{**/application,**/application/**,**/application.rs,**/inbound,**/inbound/**,**/inbound.rs,**/outbound,**/outbound/**,**/outbound.rs}");
let app-source = select * from "source-dependency" where glob_any(source, "**/application/**");
let app-bad = select * from app-source where glob_any(target, "{**/inbound,**/inbound/**,**/inbound.rs,**/outbound/*/adapters,**/outbound/*/adapters/**,**/outbound/*/adapters.rs,**/outbound/*/factory.rs}");
let use-source = select * from "source-dependency" where glob_any(source, "**/inbound/use_cases/**");
let use-bad = select * from use-source where glob_any(target, "{**/outbound/*/adapters,**/outbound/*/adapters/**,**/outbound/*/adapters.rs,**/outbound/*/factory.rs}");
let outbound-source = capture(from="source-dependency", path="source", pattern="{*root}/outbound/{*rest}", captures=["root", "rest"]);
let outbound-target = capture(from=outbound-source, path="target", pattern="{*troot}/application/{*trest}", captures=["troot", "trest"]);
let outbound-bad = select * from outbound-target where root = troot;
let domain-rows = project(from=domain-bad, columns=["source", "span"]);
let app-rows = project(from=app-bad, columns=["source", "span"]);
let use-rows = project(from=use-bad, columns=["source", "span"]);
let outbound-rows = project(from=outbound-bad, columns=["source", "span"]);
let direction-a = union(left=domain-rows, right=app-rows);
let direction-b = union(left=use-rows, right=outbound-rows);
let direction-all = union(left=direction-a, right=direction-b);
let direction-named = select l."source" as "file", l."span" as "span" from direction-all as l;
let direction-found = extend(from=direction-named, values={"problem": "resolves against the core dependency directions"});
let found-4 = union(left=found-3, right=app-found);
let found-5 = union(left=found-4, right=direction-found);
emit found-5 subject "file" key("span");
'''

[params.forbidden]
type = "set<string>"
description = "The targets this directory may not name, each a path glob as written in code: `*::inbound::*` for any inbound module of any crate, `crate::outbound::*::adapters::*` for an adapter of the crate."

[diagnostic]
primary = "span"
message = "this import {problem}"
help = "Follow the direction of imports: domain imports domain and the kernel; application services import domain and outbound contracts, never sibling services or use cases; a use case composes application services and imports domain and its own crate's port interfaces, types and errors; a port imports its own outbound vocabulary and external APIs; an adapter imports its own outbound port, and a translation adapter another crate's use-case interface; an edge imports use-case interfaces and port factories and wires adapters and `use_case.rs` only in `composition.rs`. Name the files of your own part with `super::`, and pass what you need from another part as a parameter or a port instead of importing it."

[given]
include = ['src/**']
params = { forbidden = ['*::inbound', '*::inbound::*', '*::outbound', '*::outbound::*', '*::use_case', '*::use_case::*Impl'] }
