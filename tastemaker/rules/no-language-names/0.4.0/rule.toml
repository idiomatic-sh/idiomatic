description = "No comment and no string literal of an engine crate names a language, and no string literal of its core is the bare file extension of a language, each name read as a whole word; and no comment or string of it holds a language name as it is written (`written`)."
why = "The engine owns the concepts and every language fulfils them; a comment or a string that says `python` ties the engine to a language it must not know, and each language added makes the leak wider. A language decides which files it reads, so a core that dispatches on a file extension (`\".rs\"`, `\".toml\"`) has rebuilt a language's recognition beside it. The denied words are the languages the entry names in `languages`, and the directory names under `languages/`; a name the lower-case words cannot hold is given case-aware in `written`, matched against the comment or the string as written: `Go` capitalized, where the lower-case `go` is the English verb, a whole string `go` (a language given as a default), and `JavaScript`, which the words split in two, so a language added is denied by its being added, and a product that holds no `languages/` (the Tastemaker and Asymptote cores) still denies every language it is given. A text is read as words: runs of letters and digits, split where a lower case letter meets an upper case one, in lower case, so `PythonProvider` is `python` and `provider`. A language is a directory `languages/<name>/` that no `src/` holds: a module of a crate's sources named `languages` (an SDK's resource) is the engine's own, so its subdirectories name no language and its files are read. An extension is a string that is a `.` and two to four letters or digits, the first a letter, in a crate's `src/domain`, `src/application` or `src/inbound` (an adapter under `src/outbound` speaks the formats it adapts), and it is reported when its word, whole, is a language's name (`.toml`, `.json`) or the extension of a source file a language reads: `.rs`, `.py`, `.ts`, `.tsx`, `.js` and `.go`; `.git` names no language. A name is matched as a whole word and never inside a path or a file name: `tools/install.py` and `.git` hold no language name, and a file name is not read for the language it is written in. Only files outside a language's directory are read, and the comments and the language names only under `crates/`. An ignore directive (`// ignore: <rule> - <reason>`) is not read: it names a rule by its id, and an id may hold a language's name (`idiomatic.arch/idiomatic-rust/…`)."

query = '''
param languages: set<string>;
param written: set<string>;
let listed-files = select l."path" as "file" from "filesystem.file" as l;
let files = project(from=listed-files, columns=["file"]);
let inner-languages = capture(from=files, path="file", pattern="{*above}/languages/{name}/{*below}", captures=["above", "name", "below"]);
let top-languages = capture(from=files, path="file", pattern="languages/{name}/{*below}", captures=["name", "below"]);
let sourced-languages = select * from inner-languages where glob_any(above, "{src,src/**,**/src,**/src/**}");
let product-languages = antijoin(left=inner-languages, right=sourced-languages, left-on=["file"], right-on=["file"]);
let inner-language-names = project(from=product-languages, columns=["name"]);
let top-language-names = project(from=top-languages, columns=["name"]);
let language-names = union(left=inner-language-names, right=top-language-names);
let engine-comments = select * from "comment" where glob_any(file, "crates/**");
let languages-comments = select * from "comment" where glob_any(file, "**/languages/**");
let sourced-comments = select * from "comment" where glob_any(file, "{src/**/languages/**,**/src/**/languages/**}");
let language-comments = antijoin(left=languages-comments, right=sourced-comments, left-on=["id"], right-on=["id"]);
let comments = antijoin(left=engine-comments, right=language-comments, left-on=["id"], right-on=["id"]);
let engine-literals = select * from "string-literal" where glob_any(file, "crates/**");
let languages-literals = select * from "string-literal" where glob_any(file, "**/languages/**");
let sourced-literals = select * from "string-literal" where glob_any(file, "{src/**/languages/**,**/src/**/languages/**}");
let language-literals = antijoin(left=languages-literals, right=sourced-literals, left-on=["occurrence"], right-on=["occurrence"]);
let literals = antijoin(left=engine-literals, right=language-literals, left-on=["occurrence"], right-on=["occurrence"]);
let directives = select * from comments where starts_with(text, "ignore:") or starts_with(text, " ignore:");
let prose-comments = antijoin(left=comments, right=directives, left-on=["id"], right-on=["id"]);
let comment-words = words(from=prose-comments, text="text", word="name");
let path-comment-names = select l."file" as "file", l."span" as "span" from comment-words as l join language-names as r on l."name" = r."name";
let given-comment-words = select * from comment-words where glob_any(name, $languages);
let given-comment-names = select l."file" as "file", l."span" as "span" from given-comment-words as l;
let lower-comment-names = union(left=path-comment-names, right=given-comment-names);
let written-comments = select * from prose-comments where glob_any(text, $written);
let written-comment-names = select l."file" as "file", l."span" as "span" from written-comments as l;
let comment-names = union(left=lower-comment-names, right=written-comment-names);
let literal-words = words(from=literals, text="value", word="name");
let path-literal-names = select l."file" as "file", l."span" as "span" from literal-words as l join language-names as r on l."name" = r."name";
let given-literal-words = select * from literal-words where glob_any(name, $languages);
let given-literal-names = select l."file" as "file", l."span" as "span" from given-literal-words as l;
let lower-literal-names = union(left=path-literal-names, right=given-literal-names);
let written-literals = select * from literals where glob_any(value, $written);
let written-literal-names = select l."file" as "file", l."span" as "span" from written-literals as l;
let literal-names = union(left=lower-literal-names, right=written-literal-names);
let core-literals = select * from literals where glob_any(file, "{**/src/domain/**,**/src/application/**,**/src/inbound/**}");
let extended = capture(from=core-literals, path="value", pattern=".{ext}", captures=["ext"]);
let path-extensions = select l."file" as "file", l."span" as "span" from extended as l join language-names as r on l."ext" = r."name";
let given-extension-rows = select * from extended where glob_any(ext, $languages) or glob_any(ext, "{rs,py,ts,tsx,js,go}");
let given-extensions = select l."file" as "file", l."span" as "span" from given-extension-rows as l;
let extension-literals = union(left=path-extensions, right=given-extensions);
let names = union(left=comment-names, right=literal-names);
let leaks = union(left=names, right=extension-literals);
emit leaks subject "file" key("file", "span");
'''

[params.languages]
type = "set<string>"
description = "The names of the languages the product's engine must not name, in lower case: `go`, `python`. A directory under `languages/` is denied as well."

[params.written]
type = "set<string>"
description = "Case-aware globs of the written forms of language names that the lower-case words of `languages` cannot hold, each matched against a whole comment or string as written: a name whose lower case is an English word, matched only capitalized (`*[!A-Za-z0-9]Go[!A-Za-z0-9]*`), a whole string that is one (`go`, a language given as a default), and a name written in two capitals that the words split (`*JavaScript*`)."

[diagnostic]
primary = "span"
message = "this text names a language, is a file extension, or assumes one language's files"
help = "Say the concept the engine owns instead (a relation, a kind, a construct), not the language that has it; a comment on how a language does something belongs in that language's folder under `languages/`. For an extension, ask the engine: the language that reads a file says so, and a file none reads is reported as unread. For a file, a manifest or a module path of one language, take it from the user (a value they pass) or show it in every language, never one as the default."

[given]
include = ['**']
params.languages = ['python', 'rust']
params.written = ['go', 'Go', 'Go[!A-Za-z0-9]*', '*[!A-Za-z0-9]Go', '*[!A-Za-z0-9]Go[!A-Za-z0-9]*', '*JavaScript*']

[[scenarios]]
id = 'clean-engine'
scenario = 'Comments and strings that say what the engine owns.'
given.files.'crates/engine/src/lib.rs' = '''
// Walk for each file, in order, and match what is left.
pub const NAME: &str = "a def in a longer text";
'''
given.files.'languages/python/src/lib.rs' = '''
// python reads itself.
'''

[[scenarios]]
id = 'comment-names-a-language'
scenario = 'A comment that names a language.'
given.files.'crates/engine/src/lib.rs' = '''
// Reads Python files.
pub const NAME: &str = "relation";
'''
given.files.'languages/python/src/lib.rs' = '''
// python reads itself.
'''
then.findings = [
  { path = 'crates/engine/src/lib.rs', line = 1 },
]

[[scenarios]]
id = 'language-names-itself'
scenario = 'A language may name itself.'
given.files.'crates/engine/src/lib.rs' = '''
// engine
'''
given.files.'languages/python/src/lib.rs' = '''
// Python reads def.
pub const NAME: &str = "def python";
'''

[[scenarios]]
id = 'module-named-languages'
scenario = 'A module of the engine named `languages` names no language and is checked.'
given.files.'crates/engine/src/lib.rs' = '''
// The engine reads every file.
pub const READ: &str = "read";
'''
given.files.'crates/engine/src/resources/languages/macros/link.rs' = '''
// A provider that expands macros calls it.
pub const NAME: &str = "a name";
'''
given.files.'languages/python/src/lib.rs' = '''
// python reads itself.
pub const NAME: &str = "python";
'''

[[scenarios]]
id = 'module-in-languages-names-one'
scenario = 'A comment in a module of the engine named `languages` that names a language.'
given.files.'crates/engine/src/resources/languages/link.rs' = '''
// Links a python provider.
pub const NAME: &str = "a name";
'''
given.files.'languages/python/src/lib.rs' = '''
// python reads itself.
pub const NAME: &str = "python";
'''
then.findings = [
  { path = 'crates/engine/src/resources/languages/link.rs', line = 1 },
]

[[scenarios]]
id = 'core-names-an-extension'
scenario = 'A core constant that is the bare extension of a source file is reported; one of an adapter is not read.'
given.files.'crates/core/src/domain/x/constants.rs' = '''
/// The files the comparison reads.
pub const EXTENSIONS: [&str; 1] = [".rs"];
'''
given.files.'crates/core/src/outbound/x/adapters/y/constants.rs' = '''
pub const SUFFIX: &str = ".json";
'''
then.findings = [
  { path = 'crates/core/src/domain/x/constants.rs', line = 2 },
]

[[scenarios]]
id = 'core-names-a-language-extension'
scenario = 'A core constant that is the bare extension of a language directory, `.toml` beside `languages/toml/`, is reported.'
given.files.'crates/core/src/domain/x/constants.rs' = '''
pub const MANIFEST: &str = ".toml";
'''
given.files.'languages/toml/src/lib.rs' = '''
// toml reads itself.
'''
then.findings = [
  { path = 'crates/core/src/domain/x/constants.rs', line = 1 },
]

[[scenarios]]
id = 'clean-core'
scenario = 'A core that names the relations it reads and no extension.'
given.files.'crates/core/src/domain/x/constants.rs' = '''
/// The declarations a file makes: `defines`.
pub const RELATION: &str = "defines";
pub const SPAN_SEPARATOR: &str = "..";
pub const RENDERED: &str = ".tastemaker-rendered";
'''

[[scenarios]]
id = 'string-holds-a-language-name-as-a-word'
scenario = 'A string whose words hold a language name, `python_rules`, is reported.'
given.files.'crates/core/src/domain/x/constants.rs' = '''
pub const TABLE: &str = "python_rules";
'''
then.findings = [
  { path = 'crates/core/src/domain/x/constants.rs', line = 1 },
]

[[scenarios]]
id = 'file-names-hold-no-language-name'
scenario = 'The version-control directory `.git` and a file named `install.py` hold no language name as a whole word, in a core or at an edge.'
given.files.'crates/core/src/domain/x/constants.rs' = '''
pub const GIT: &str = ".git";
pub const INSTALLER: &str = "install.py";
'''
given.files.'cli/src/remedy.rs' = '''
pub const NEXT: &str = "run `uv run --script tools/install.py`, which installs every tool";
'''

[[scenarios]]
id = 'strings-of-the-tool-itself'
scenario = "Strings that name the files and formats of the tool itself, and words that only look like an extension, assume no language."
given.files.'cli/src/help.rs' = '''
pub const EXAMPLE: &str = "tm explain docs/notes.md";
pub const FILE: &str = "tastemaker.toml";
pub const WORD: &str = "the results of a json report";
pub const TESTS: &str = "help_test.rs";
'''

[[scenarios]]
id = 'given-language-without-languages-directory'
scenario = 'A core in a product with no `languages/` directory names a language it is given: a finding all the same.'
given.files.'crates/core/src/domain/comments/types.rs' = '''
/// It documents the code it is written with, as Go writes a comment above a declaration.
pub enum Documentation {}
'''
then.findings = [
  { path = 'crates/core/src/domain/comments/types.rs', line = 1 },
]

[[scenarios]]
id = 'ignore-directive-names-a-rule'
scenario = 'An ignore directive names a rule whose id holds a language name: it is not read for a language name (it ignores a rule the scene does not apply, which is said on its own).'
given.files.'crates/core/src/cases.rs' = '''
// ignore: idiomatic.arch/idiomatic-rust/no-bare-bool - the selector of a row is one boolean
pub fn selects() {}
'''
then.findings = [
  { rule = 'tastemaker#ignore', path = 'crates/core/src/cases.rs', line = 1 },
]

[[scenarios]]
id = 'go-written-and-given-as-default'
scenario = 'A core comment names Go capitalized and a core string gives `go` as a default language: each is a finding, though `go` is not among the lower-case languages.'
given.files.'crates/core/src/domain/modules/types.rs' = '''
/// The modules a project declares, as a Go module lists them.
pub struct Modules;

pub const DEFAULT_LANGUAGE: &str = "go";
'''
then.findings = [
  { path = 'crates/core/src/domain/modules/types.rs', line = 1 },
  { path = 'crates/core/src/domain/modules/types.rs', line = 4 },
]

[[scenarios]]
id = 'english-go-passes'
scenario = 'The verb `go` in lower case, as the normalizing code of Asymptote writes it, names no language.'
given.files.'crates/core/src/domain/violations/service.rs' = '''
/// `raw` in normalized form: backslashes become `/`, `.` segments go and `..` is resolved lexically.
pub fn normalized(raw: &str) -> String {
    raw.replace('\\', "/")
}
'''
