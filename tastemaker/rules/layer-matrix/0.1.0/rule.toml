description = "Within one crate, inbound may depend on application, domain and outbound; application on domain and outbound; domain and outbound on no other layer."
why = "Each layer owns its vocabulary. Inbound coordinates application operations and translates values at its boundary. Application coordinates domain behavior and outbound contracts. Domain and outbound remain independent of every other layer, including each other. Same-layer modules, the standard library and external crates are allowed by this matrix; separate rules may impose stricter boundaries, including the existing application sibling-service ban. The rule compares resolved source-dependency paths with the same crate source root, including src/{layer}.rs and src/{layer}/**. Aliases and relative or qualified references are checked when the Rust frontend resolves them. Runtime benchmark code and test files under those layers are included, without blanket exemptions. Macro expansion dependencies, unresolved paths and nonstandard source layouts are not inferred from text. No exception is encoded."

query = '''
let source-directories = capture(from="source-dependency", path="source", pattern="{*source-root}/{from-layer}/{*source-rest}", captures=["source-root", "from-layer", "source-rest"]);
let source-modules = capture(from="source-dependency", path="source", pattern="{*source-root}/{from-layer}.rs", captures=["source-root", "from-layer"]);
let directory-sources = select source, target, span, source-root, from-layer from source-directories;
let module-sources = select source, target, span, source-root, from-layer from source-modules;
let source-rows = union(left=directory-sources, right=module-sources);
let source-layers = select * from source-rows where from-layer = "inbound" or from-layer = "application" or from-layer = "domain" or from-layer = "outbound";
let sources = select * from source-layers where glob_any(source-root, "{src,**/src}");
let target-directories = capture(from=sources, path="target", pattern="{*target-root}/{to-layer}/{*target-rest}", captures=["target-root", "to-layer", "target-rest"]);
let target-modules = capture(from=sources, path="target", pattern="{*target-root}/{to-layer}.rs", captures=["target-root", "to-layer"]);
let directory-targets = select source, span, source-root, from-layer, target-root, to-layer from target-directories;
let module-targets = select source, span, source-root, from-layer, target-root, to-layer from target-modules;
let target-rows = union(left=directory-targets, right=module-targets);
let local-rows = select * from target-rows where source-root = target-root;
let layers = select * from local-rows where to-layer = "inbound" or to-layer = "application" or to-layer = "domain" or to-layer = "outbound";
let cross-layer = select * from layers where from-layer != to-layer;
let refused = select source as file, span, from-layer, to-layer from cross-layer where from-layer = "domain" or from-layer = "outbound" or (from-layer = "application" and to-layer = "inbound");
emit refused subject file key(span);
'''

[diagnostic]
primary = "span"
message = "the {from-layer} layer depends on the {to-layer} layer"
help = "Keep this layer's values and behavior in its own modules. Translate at inbound or application boundaries and pass outbound-owned values to outbound contracts. Domain and outbound do not import each other. External crates and same-layer modules remain allowed; application sibling services remain subject to their separate stricter rule."

[given]
include = ["src/**"]
files.'Cargo.toml' = '''
[package]
name = "matrix_fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = 'pub mod inbound; pub mod application; pub mod domain; pub mod outbound;'
files.'src/inbound.rs' = 'pub mod service; pub mod types;'
files.'src/application.rs' = 'pub mod service; pub mod types;'
files.'src/domain.rs' = 'pub mod service; pub mod types;'
files.'src/outbound.rs' = 'pub mod service; pub mod types;'
files.'src/inbound/service.rs' = 'pub fn run() {}'
files.'src/application/service.rs' = 'pub fn run() {}'
files.'src/domain/service.rs' = 'pub fn run() {}'
files.'src/outbound/service.rs' = 'pub fn run() {}'
files.'src/inbound/types.rs' = 'pub struct Token;'
files.'src/application/types.rs' = 'pub struct Token;'
files.'src/domain/types.rs' = 'pub struct Token;'
files.'src/outbound/types.rs' = 'pub struct Token;'

[[scenarios]]
id = "inbound-to-inbound"
scenario = "inbound to inbound is allowed by the explicit matrix."
given.files.'src/inbound/service.rs' = 'use crate::inbound::types::Token;'

[[scenarios]]
id = "inbound-to-application"
scenario = "inbound to application is allowed by the explicit matrix."
given.files.'src/inbound/service.rs' = 'use crate::application::types::Token;'

[[scenarios]]
id = "inbound-to-domain"
scenario = "inbound to domain is allowed by the explicit matrix."
given.files.'src/inbound/service.rs' = 'use crate::domain::types::Token;'

[[scenarios]]
id = "inbound-to-outbound"
scenario = "inbound to outbound is allowed by the explicit matrix."
given.files.'src/inbound/service.rs' = 'use crate::outbound::types::Token;'

[[scenarios]]
id = "application-to-inbound"
scenario = "application to inbound is forbidden by the explicit matrix."
given.files.'src/application/service.rs' = 'use crate::inbound::types::Token;'
then.findings = [{ path = "src/application/service.rs", line = 1 }]

[[scenarios]]
id = "application-to-application"
scenario = "application to application is allowed by the explicit matrix."
given.files.'src/application/service.rs' = 'use crate::application::types::Token;'

[[scenarios]]
id = "application-to-domain"
scenario = "application to domain is allowed by the explicit matrix."
given.files.'src/application/service.rs' = 'use crate::domain::types::Token;'

[[scenarios]]
id = "application-to-outbound"
scenario = "application to outbound is allowed by the explicit matrix."
