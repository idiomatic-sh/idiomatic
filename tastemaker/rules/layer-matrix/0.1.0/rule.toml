[[scenarios]]
id = "module-file-source-and-target"
scenario = "A layer's module file is checked, including a target layer's module file."
given.files.'src/outbound.rs' = '''
pub mod service; pub mod types;
use crate::domain;
'''
then.findings = [{ path = "src/outbound.rs", line = 2 }]

[[scenarios]]
id = "relative-path"
scenario = "A relative path resolves to the same forbidden layer."
given.files.'src/outbound/service.rs' = 'use super::super::domain::types::Token;'
then.findings = [{ path = "src/outbound/service.rs", line = 1 }]

[[scenarios]]
id = "renamed-import"
scenario = "Renaming a forbidden import does not change its layer."
given.files.'src/outbound/service.rs' = 'use crate::domain::types::Token as Renamed;'
then.findings = [{ path = "src/outbound/service.rs", line = 1 }]

[[scenarios]]
id = "qualified-code-reference"
scenario = "Qualified references in code are checked without a use declaration."
given.files.'src/outbound/service.rs' = 'pub fn run() { let _value = crate::domain::types::Token; }'
then.findings = [{ path = "src/outbound/service.rs", line = 1 }]

[[scenarios]]
id = "standard-library"
scenario = "A layer may use the standard library."
given.files.'src/domain/service.rs' = 'use std::collections::BTreeMap;'

[[scenarios]]
id = "external-crate-layer-is-not-local"
scenario = "A renamed external crate's public domain module is not this crate's domain layer."
given.files.'Cargo.toml' = '''
[package]
name = "matrix_fixture"
version = "0.1.0"
edition = "2024"
[dependencies]
renamed = { package = "another_crate", path = "external" }
'''
given.files.'external/Cargo.toml' = '''
[package]
name = "another_crate"
version = "0.1.0"
edition = "2024"
'''
given.files.'external/src/lib.rs' = 'pub mod domain;'
given.files.'external/src/domain.rs' = 'pub mod types;'
given.files.'external/src/domain/types.rs' = 'pub struct Token;'
given.files.'src/outbound/service.rs' = 'use renamed::domain::types::Token;'

[[scenarios]]
id = "test-file-is-not-exempt"
scenario = "A source test under a layer does not bypass the matrix."
given.files.'src/outbound.rs' = 'pub mod service; pub mod types; #[cfg(test)] mod service_test;'
given.files.'src/outbound/service_test.rs' = 'use crate::domain::types::Token;'
then.findings = [{ path = "src/outbound/service_test.rs", line = 1 }]

[[scenarios]]
id = "benchmark-runtime-is-not-exempt"
scenario = "Runtime code of a benchmark crate is subject to the same matrix."
given.include = ["**/src/**"]
given.files.'Cargo.toml' = '''
[package]
name = "matrix_fixture"
version = "0.1.0"
edition = "2024"
[workspace]
members = ["crates/benchmark"]
resolver = "3"
'''
given.files.'crates/benchmark/Cargo.toml' = '''
[package]
name = "benchmark"
version = "0.1.0"
edition = "2024"
'''
given.files.'crates/benchmark/src/lib.rs' = 'pub mod outbound; pub mod domain;'
given.files.'crates/benchmark/src/domain.rs' = 'pub struct Token;'
given.files.'crates/benchmark/src/outbound.rs' = 'pub mod service;'
given.files.'crates/benchmark/src/outbound/service.rs' = 'use crate::domain::Token;'
then.findings = [{ path = "crates/benchmark/src/outbound/service.rs", line = 1 }]
