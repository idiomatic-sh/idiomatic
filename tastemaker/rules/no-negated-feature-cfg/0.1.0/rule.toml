description = "No code is compiled only when a feature is off: `cfg(not(feature = …))`, a `not` over a `feature` anywhere in a `cfg` attribute or a `cfg!` call, is a finding."
why = "Cargo features are additive: one build unifies the features every dependent asks for, so a feature turned on for one crate is on for all of them. Code compiled only when a feature is off is a second path the unified build can silently drop, and it is how a build flag that selects between two implementations (an evaluator, a progress counter) creeps in: one arm under `feature = …`, the other under `not(feature = …)`. Clippy has no lint for it. Read syntactically: in an attribute, a `not(…)` of `cfg` or `cfg_attr` whose predicate holds a `feature` atom at any depth (`not(feature = \"x\")`, `not(any(feature = \"x\", test))`); in a `cfg!` call, a `not` followed by a group that holds `feature`. A `cfg(any(test, feature = \"fixtures\"))` seal and a `cfg(not(test))` are not findings: neither turns code off when a feature is on."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let not-tokens = select * from tree-tokens where kind = "ident" and text = "not";
let feature-tokens = select * from tree-tokens where kind = "ident" and text = "feature";
let composites = select * from tree-nodes where kind = "cfg-composite";
let composite-heads = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "head" from composites as l join "syntax-child" as r on l."id" = r."parent";
let negations = select l."id" as "id", l."file" as "file", l."span" as "span" from composite-heads as l join not-tokens as r on l."head" = r."id";
let atoms = select * from tree-nodes where kind = "cfg-atom";
let atom-heads = select l."id" as "id", r."child" as "head" from atoms as l join "syntax-child" as r on l."id" = r."parent";
let feature-atoms = select l."id" as "id" from atom-heads as l join feature-tokens as r on l."head" = r."id";
let negated-atoms = axis(from=negations, relation="syntax-child", direction=descendant, domain=feature-atoms);
let attribute-ids = project(from=negated-atoms, columns=["id"]);
let attribute-rows = select r."file" as "file", r."span" as "span" from attribute-ids as l join negations as r on l."id" = r."id";
let macro-calls = select * from tree-nodes where kind = "macro-call";
let paths = select * from tree-nodes where kind = "path";
let segments = select * from tree-nodes where kind = "path-segment";
let name-refs = select * from tree-nodes where kind = "name-ref";
let token-trees = select * from tree-nodes where kind = "token-tree";
let call-children = select l."id" as "call", r."child" as "child" from macro-calls as l join "syntax-child" as r on l."id" = r."parent";
let call-paths = select l."call" as "call", r."id" as "path" from call-children as l join paths as r on l."child" = r."id";
let path-children = select l."call" as "call", r."child" as "child" from call-paths as l join "syntax-child" as r on l."path" = r."parent";
let path-segments = select l."call" as "call", r."id" as "segment" from path-children as l join segments as r on l."child" = r."id";
let segment-children = select l."call" as "call", r."child" as "child" from path-segments as l join "syntax-child" as r on l."segment" = r."parent";
let segment-refs = select l."call" as "call", r."id" as "nameref" from segment-children as l join name-refs as r on l."child" = r."id";
let ref-children = select l."call" as "call", r."child" as "child" from segment-refs as l join "syntax-child" as r on l."nameref" = r."parent";
let cfg-tokens = select * from tree-tokens where kind = "ident" and text = "cfg";
let cfg-calls = select l."call" as "id" from ref-children as l join cfg-tokens as r on l."child" = r."id";
let cfg-call-children = select l."id" as "call", r."child" as "id" from cfg-calls as l join "syntax-child" as r on l."id" = r."parent";
let cfg-arguments = select l."id" as "id" from cfg-call-children as l join token-trees as r on l."id" = r."id";
let macro-nots = axis(from=cfg-arguments, relation="syntax-child", direction=descendant, domain=not-tokens);
let macro-not-ids = select r."id" as "id" from macro-nots as l join not-tokens as r on l."related" = r."id";
let solid = select * from "syntax-tree" where kind != "whitespace";
let after-not = axis(from=macro-not-ids, relation="syntax-child", direction=next-sibling, domain=solid);
let not-groups = select l."id" as "id", r."id" as "group" from after-not as l join token-trees as r on l."related" = r."id";
let group-ids = select l."group" as "id" from not-groups as l;
let group-features = axis(from=group-ids, relation="syntax-child", direction=descendant, domain=feature-tokens);
let negated-groups = select l."id" as "id" from not-groups as l join group-features as r on l."group" = r."id";
let macro-rows = select r."file" as "file", r."span" as "span" from negated-groups as l join not-tokens as r on l."id" = r."id";
let found = union(left=attribute-rows, right=macro-rows);
emit found subject "file" key("span");
'''

