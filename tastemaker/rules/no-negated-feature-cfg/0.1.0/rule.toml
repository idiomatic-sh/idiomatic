/// Give one language only the notes it wrote, with the same host scope and engine observations.
fn project_request(input: &ProjectToRead<'_>, number: LanguageNumber) -> ProjectRequest {
    ProjectRequest {
        root: input.root.clone(),
        repository: input.repository,
        search_scope: input.search_scope.clone(),
        given_inventory: input.given_inventory.clone(),
        observed_entries: input.observed_entries.clone(),
        manifests: input.manifests.to_vec(),
        files: input
            .files
            .iter()
            .map(|each| ryo_values::domain::files::service::input_path(each).clone())
            .collect(),
        notes: input
            .notes
            .0
            .iter()
            .map(|each| match each {
                Some(FileNotes {
                    language: written_by,
                    notes,
                }) if written_by.0 == number.0 => Bytes(notes.0.clone()),
                Some(_) | None => Bytes::default(),
            })
            .collect(),
        wanted: input.wanted.to_vec(),
    }
}

/// The `use_case` language adapter.
#[derive(Debug)]
pub(crate) struct LanguageUseCaseAdapter {
    /// The languages linked, in the order they are listed and numbered in.
    languages: Vec<LanguageConnection>,
}

impl LanguageUseCaseAdapter {
    /// The adapter before any language is linked.
    pub(crate) fn new() -> Self {
        Self {
            languages: Vec::new(),
        }
    }

    /// The adapter with one more language linked, after those already linked: the order it lists and numbers them in.
    pub(crate) fn with(mut self, language: LanguageConnection) -> Self {
        self.languages.push(language);
        self
    }
}

fn parse_request(file: FileToRead<'_>) -> ParseRequest<'_> {
    ParseRequest {
        path: SourcePath(&file.path.0),
        file: file.file,
        bytes: ByteSlice(&file.bytes.0),
        fields: match file.roles {
            RoleWriting::Wanted => {
                ryo_language::inbound::use_cases::parse::types::FieldRequest::Wanted
            }
            RoleWriting::Unwanted => {
                ryo_language::inbound::use_cases::parse::types::FieldRequest::Unwanted
            }
        },
        notes: match file.notes {
            NoteWriting::Wanted => {
                ryo_language::inbound::use_cases::parse::types::NoteRequest::Wanted
            }
            NoteWriting::Unwanted => {
                ryo_language::inbound::use_cases::parse::types::NoteRequest::Unwanted
            }
        },
    }
}

impl LanguagePort for LanguageUseCaseAdapter {
    #[cfg(feature = "fused-evaluation")]
    fn sole_engine(
        &self,
    ) -> Option<std::sync::Arc<dyn ryo_language::inbound::use_cases::parse::types::ParseEngine>> {
        match self.languages.as_slice() {
            [one] => Some(std::sync::Arc::clone(&one.parse)),
            _ => None,
        }
    }

    fn relations(&self) -> Result<RelationList, LanguageError> {
        Ok(RelationList(all().to_vec()))
    }

    fn linked(&self) -> LinkedNames {
        LinkedNames(
            self.languages
                .iter()
                .map(|linked| LinkedName(format!("{} {}", linked.name.0, linked.build.0).into()))
                .collect(),
        )
    }

    fn unknown_reasons(&self) -> UnknownReasons {
        let mut reasons: Vec<UnknownName> = Vec::new();
        for each in self
            .languages
            .iter()
            .flat_map(|linked| linked.parse.unknown_reasons())
        {
            if !reasons.contains(each) {
                reasons.push(*each);
            }
        }
        UnknownReasons(reasons)
    }

    fn kind_vocabularies(&self) -> KindVocabularies {
        KindVocabularies(
            self.languages
                .iter()
                .map(|linked| KindVocabulary {
                    language: linked.name.clone(),
                    kinds: linked
                        .parse
                        .kind_names()
                        .0
                        .into_iter()
                        .map(|name| KindWord(Box::from(name.0)))
                        .collect(),
                })
                .collect(),
        )
    }

    fn supports(&self, relation: Relation) -> Answers {
        Answers(
            self.languages
                .iter()
                .map(|linked| RelationAnswer {
                    language: linked.name.clone(),
                    absence: linked
                        .parse
                        .absence_of(relation)
                        .or_else(|| linked.project.absence_of(relation))
                        .map_or(Absence::Reads, Absence::Because),
                    unknowns: linked.parse.unknown_reasons(),
                })
                .collect(),
        )
    }

    fn reads_manifest(&self, path: &FilePath) -> ManifestReading {
        let name = path.0.rsplit('/').next().unwrap_or(&path.0);
        let reads = self.languages.iter().any(|linked| {
            linked
                .project
                .manifest_names()
                .iter()
                .any(|manifest| manifest.0 == name)
        });
        if reads {
            ManifestReading::Read
        } else {
            ManifestReading::NotRead
        }
    }

    fn parse(
        &self,
        file: FileToRead<'_>,
        table: &mut Elements,
        symbols: &mut Symbols,
        out: &mut dyn RowWriter,
    ) -> FileReading {
        let request = parse_request(file);
        // Branch-only (spike ryo-5cnx): the parse step writes no row; the fused evaluator asks for each relation it reads.
        #[cfg(feature = "fused-evaluation")]
        let _: &mut dyn RowWriter = out;
        if let SourceSelection::Named(selected) = file.source_language {
            let mut matches = self
                .languages
                .iter()
                .enumerate()
                .filter(|(_, language)| language.name == *selected);
            let Some((number, language)) = matches.next() else {
                return FileReading::Failed(ReadFailure(
                    format!("explicit source provider `{}` is not linked", selected.0).into(),
                ));
            };
            if matches.next().is_some() {
                return FileReading::Failed(ReadFailure(
                    format!("explicit source provider `{}` is ambiguous", selected.0).into(),
                ));
            }
            if language
                .project
                .primary_role(ryo_language::domain::files::types::SourcePath(&file.path.0))
                == ryo_language::domain::files::types::PrimaryFileRole::Configuration
            {
                return FileReading::Manifest;
            }
            // Branch-only (spike ryo-5cnx): the parse step builds the tree as `build` does, the fused evaluator walking on demand.
            #[cfg(feature = "fused-evaluation")]
            let read = ryo_language::inbound::use_cases::parse::service::build(
                &*language.parse,
                request,
                table,
                symbols,
            );
            #[cfg(not(feature = "fused-evaluation"))]
            let read = language.parse.read_file_explicit(
                request,
                table,
                symbols,
                file.wanted,
                out,
            );
            return match read {
                Ok(()) => FileReading::Read(LanguageNumber(number)),
                Err(error) => FileReading::Failed(ReadFailure(
                    format!("explicit source provider `{}`: {error}", selected.0).into(),
                )),
            };
        }
        let mut failure: Option<ReadFailure> = None;
        for (number, language) in self.languages.iter().enumerate() {
            if language.parse.recognition(&request)
                == ryo_language::inbound::use_cases::parse::types::Recognition::Declines
            {
                continue;
            }
            #[cfg(feature = "fused-evaluation")]
            let read = ryo_language::inbound::use_cases::parse::service::build(
                &*language.parse,
                request,
                table,
                symbols,
            );
            #[cfg(not(feature = "fused-evaluation"))]
            let read = language
                .parse
                .read_file(request, table, symbols, file.wanted, out);
            match read {
                Ok(()) => return FileReading::Read(LanguageNumber(number)),
                Err(ParseError::Unsupported) => {}
                Err(other) => failure = Some(ReadFailure(other.to_string().into())),
            }
        }
        failure.map_or_else(
            || {
                if self.languages.iter().any(|language| {
                    language
                        .project
                        .primary_role(ryo_language::domain::files::types::SourcePath(&file.path.0))
                        == ryo_language::domain::files::types::PrimaryFileRole::Configuration
                }) {
                    FileReading::Manifest
                } else {
                    FileReading::Unsupported
                }
            },
            FileReading::Failed,
        )
    }

    fn begin_semantics(
        &self,
        language: LanguageNumber,
        file: FileToRead<'_>,
        tree: &mut Elements,
    ) -> SemanticSlot {
        // What the language's read kept for the session (its parsed tree) is handed to it, so the file is not parsed again.
        let mut slot = ryo_language::domain::elements::service::take_semantics(tree);
        if let Some(handle) = self.languages.get(language.0) {
            handle
                .parse
                .begin_semantics(&parse_request(file), tree, &mut slot);
        }
        match slot {
            SemanticSlot::Begun(session) => SemanticSlot::Begun(session),
            SemanticSlot::Empty | SemanticSlot::Retained(_) => SemanticSlot::Empty,
        }
    }

    fn project_entries(
        &self,
        input: &ProjectToRead<'_>,
    ) -> ryo_language::domain::files::types::ProjectEntries {
        let mut appended = ryo_language::domain::files::types::ProjectEntries::default();
        for (number, language) in self.languages.iter().enumerate() {
            language.project.project_entries(
                &project_request(input, LanguageNumber(number)),
                &mut appended,
            );
        }
        let mut entries = appended.0;
        entries.sort();
        entries.dedup();
        entries.into()
    }

    fn project(
        &self,
        input: &ProjectToRead<'_>,
        symbols: &mut Symbols,
        out: &mut dyn RowWriter,
    ) -> Result<ProjectAnswer, LanguageError> {
        let mut refused = Vec::new();
        let mut unlisted = Vec::new();
        let mut consulted = Vec::new();
        for (number, language) in self.languages.iter().enumerate() {
            let request = project_request(input, LanguageNumber(number));
            let bytes = language
                .project
                .project(&request, symbols, out)
                .map_err(|error| LanguageError::Manifest {
                    reason: error.to_string(),
                })?;
            if bytes.observed_entries.as_slice()
                != ryo_language::domain::project_context::service::entries(
                    &request.observed_entries,
                )
            {
                return Err(LanguageError::Manifest {
                    reason: OBSERVATION_RECEIPT_DIFFERS.to_owned(),
                });
            }
            consulted.extend(bytes.consulted);
            // The numbers after the files the run lists are one language's to give: two would number different manifests alike. Two
            // languages that read the same manifests name the same ones in the same order, which is one numbering.
            if !bytes.unlisted.is_empty() {
                let named: Vec<FilePath> = bytes.unlisted;
                if !unlisted.is_empty() && unlisted != named {
                    return Err(LanguageError::Manifest {
                        reason: TWO_LANGUAGES_UNLISTED.to_owned(),
                    });
                }
                unlisted = named;
            }
            refused.extend(bytes.refused.into_iter().map(|each| RefusedManifest {
                language: language.name.clone(),
                path: each.path,
                reason: each.reason,
            }));
        }
        // A manifest the rows are about that the run does not list was read from the disk: it is consulted too.
        consulted.extend(unlisted.iter().cloned());
        consulted.sort_unstable();
        consulted.dedup();
        Ok(ProjectAnswer {
            refused,
            unlisted,
            consulted,
            observed_entries: ryo_language::domain::project_context::service::receipt(
                input.observed_entries,
            ),
        })
    }
}
