given.files.'src/outbound/names/adapters/memory/schemas_test.rs' = '''
//! Proves the schemas.

use super::{NameSchema, NameSchemaError};

#[test]
fn refuses_an_empty_name() {
    assert!(matches!(String::try_from(NameSchema { text: String::new() }), Err(NameSchemaError::Empty)));
}
