description = "No test is ignored: no `#[ignore]` attribute, with a reason or without, and none a `#[cfg_attr]` applies."
why = "An ignored test never runs on a normal test run, so what it proves goes unproven. A slow test gets a smaller fixture, and a program a test runs as a child is selected by an argument to the test binary, not hidden as an ignored test. The attribute is read as written: `ignore` as the whole path of an attribute's meta, at any depth of `cfg_attr`, and `#[ignore` in a `macro_rules!` body, where it is tokens, so every test the macro writes is ignored."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let paths = select * from tree-nodes where kind = "path";
let path-parents = select l."id" as "id", r."parent" as "parent", l."file" as "file", l."span" as "span" from paths as l join "syntax-child" as r on l."id" = r."child";
let metas = select * from tree-nodes where glob_any(kind, "*-meta");
let meta-paths = select l."id" as "id", l."file" as "file", l."span" as "span" from path-parents as l join metas as r on l."parent" = r."id";
let path-children = select r."child" as "child", l."id" as "id" from meta-paths as l join "syntax-child" as r on l."id" = r."parent";
let qualified = select l."id" as "id" from path-children as l join paths as r on l."child" = r."id";
let single-segment = antijoin(left=meta-paths, right=qualified, left-on=["id"], right-on=["id"]);
let segments = select * from tree-nodes where kind = "path-segment";
let segment-children = select l."id" as "id", l."child" as "segment" from path-children as l join segments as r on l."child" = r."id";
let name-refs = select l."id" as "id", r."child" as "name" from segment-children as l join "syntax-child" as r on l."segment" = r."parent";
let name-tokens = select l."id" as "id", r."child" as "token" from name-refs as l join "syntax-child" as r on l."name" = r."parent";
let ignore-tokens = select * from tree-tokens where text = "ignore";
let ignore-paths = select l."id" as "id" from name-tokens as l join ignore-tokens as r on l."token" = r."id";
let ignored = select l."file" as "file", l."span" as "span" from single-segment as l join ignore-paths as r on l."id" = r."id";
let macro-rules = select * from tree-nodes where kind = "macro-rules";
let macro-ignore-hits = axis(from=macro-rules, relation="syntax-child", direction=descendant, domain=ignore-tokens);
let macro-ignore-ids = select r."id" as "id" from macro-ignore-hits as l join ignore-tokens as r on l."related" = r."id";
let ignore-before = axis(from=macro-ignore-ids, relation="syntax-child", direction=previous-sibling, domain=tree-tokens);
let ignore-before-kinds = select l."id" as "id", r."kind" as "kind" from ignore-before as l join tree-tokens as r on l."related" = r."id";
let bracket-first = select * from ignore-before-kinds where kind = "l-brack";
let bracket-first-ids = project(from=bracket-first, columns=["id"]);
let ignore-trees = axis(from=bracket-first-ids, relation="syntax-child", direction=parent, domain=tree-nodes);
let tree-ids = select l."related" as "id", l."id" as "ignore" from ignore-trees as l;
let tree-before = axis(from=tree-ids, relation="syntax-child", direction=previous-sibling, domain=tree-tokens);
let tree-before-kinds = select l."ignore" as "ignore", r."kind" as "kind" from tree-before as l join tree-tokens as r on l."related" = r."id";
let pounded = select * from tree-before-kinds where kind = "pound";
let macro-ignored = select r."file" as "file", r."span" as "span" from pounded as l join ignore-tokens as r on l."ignore" = r."id";
let every-ignored = union(left=ignored, right=macro-ignored);
emit every-ignored subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "an ignored test never runs on a normal test run"
help = "Remove `#[ignore]` and make the test run on every `cargo test`: give a slow test a smaller fixture, and select a program a test runs as a child by an argument to the test binary. An ignored test proves nothing, so an ignore is never the fix."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'bare-ignore'
scenario = 'A bare #[ignore]: it is reported.'
given.files.'src/lib.rs' = '''
#[cfg(test)]
mod tests {
    #[test]
    #[ignore]
    fn ignored() {}
    #[test]
    fn runs() {}
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'ignored-with-a-reason'
scenario = '#[ignore] with a reason.'
given.files.'src/lib.rs' = '''
#[cfg(test)]
mod tests {
    #[test]
    #[ignore = "minutes of builds"]
    fn ignored_with_a_reason() {}
    #[test]
    fn runs() {}
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'ignored-in-a-macro-body'
scenario = 'A #[ignore] a macro_rules! body writes on every test it generates.'
given.files.'src/lib.rs' = '''
macro_rules! property_test {
    ($name:ident) => {
        #[test]
        #[ignore]
        fn $name() {}
    };
}

#[cfg(test)]
mod tests {
    property_test!(holds);
    #[test]
    fn runs() {
        let ignore = [1];
        assert_eq!(ignore, [1]);
    }
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'ignored-when-tested'
scenario = '#[ignore] applied by cfg_attr.'
given.files.'src/lib.rs' = '''
#[cfg(test)]
mod tests {
    #[test]
    #[cfg_attr(test, ignore)]
    fn ignored_when_tested() {}
    #[test]
    fn runs() {}
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'allow-attempt'
scenario = 'An allow of the old lint does not exempt an ignored test.'
given.files.'src/lib.rs' = '''
#[cfg(test)]
#[allow(no_ignored_tests)]
mod allowed {
    #[test]
    #[ignore]
    fn ignored() {}
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 5 },
]

[[scenarios]]
id = 'tests-run-function-named-ignore-ignore-doc'
scenario = 'Tests that run, a function named ignore, and ignore in a doc block and a lint name.'
given.files.'src/lib.rs' = '''
/// ```ignore
/// example();
/// ```
pub fn ignore(value: u8) -> u8 {
    value
}

#[allow(clippy::let_underscore_untyped)]
#[cfg(test)]
mod tests {
    #[test]
    fn runs() {
        let _ = super::ignore(1);
    }
}
'''
