description = "No function is declared inside more than `max-depth` enclosing functions."
why = "A function nested in a function nested in a function is read only by unwinding every level around it, and none of the inner ones can be tested alone. The chain is the provider's lexical scope containment between functions (`fn` items in `fn` bodies, closures excluded), walked to every ancestor. Not seen: closures, and functions inside a macro invocation's tokens."

query = '''
param max-depth: integer;
let functions = project(from="function", columns=["id", "name", "file", "span"]);
let enclosing = axis(from=functions, relation="scope", direction=ancestor, domain=functions);
let depths = group-count(from=enclosing, keys=["id", "name", "file", "span"], count="depth", distinct="related");
let deep = select * from depths where depth > $max-depth;
emit deep subject "file" key("span");
'''

[params.max-depth]
type = "integer"
description = "The most functions one function may be nested in."

[diagnostic]
primary = "span"
message = "`{name}` is nested in {depth} functions"
help = "Move the inner function out to module level, passing it what it captured from the outer ones."

[given]
include = ['**']
params = { max-depth = 1 }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'three-deep'
scenario = 'A function inside two functions over a limit of one.'
given.files.'src/lib.rs' = '''
pub fn outer() {
    fn middle() {
        fn inner() {}
        inner();
    }
    middle();
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 3 },
]

[[scenarios]]
id = 'two-deep'
scenario = 'A function inside one function.'
given.files.'src/lib.rs' = '''
pub fn outer() {
    fn inner() {}
    inner();
}
'''
