description = "Every `.rs` file in scope is a module some crate root declares, directly or through its modules, and parses."
why = "A Rust file no crate root reaches is never compiled, linted or tested: dead code that still reads as live, or a module whose `mod` line was lost. The files are every path ending in `.rs` the analysis sees, at the root or in a directory; a file is reached when the provider analyzed it as a source some crate root declares (Cargo's targets, then `mod` declarations, `#[path]` included). A file that does not parse is reported too, since it is not analyzed either. Not seen: a file brought in only by `include!`, which is reported although it is compiled; fixture trees an entry leaves out."

query = '''
let nested = capture(from="filesystem.file", path="path", pattern="{*directory}/{stem}.rs", captures=["directory", "stem"]);
let nested-paths = project(from=nested, columns=["path"]);
let top = capture(from="filesystem.file", path="path", pattern="{stem}.rs", captures=["stem"]);
let top-paths = project(from=top, columns=["path"]);
let sources = union(left=nested-paths, right=top-paths);
let orphans = antijoin(left=sources, right="analyzed-source", left-on=["path"], right-on=["path"]);
emit orphans subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "`{path}` is not a module any crate root reaches, or does not parse"
help = "Declare it with `mod` in its parent module, or delete it if nothing needs it."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'lost-module'
scenario = 'A file no module declares.'
given.files.'src/forgotten.rs' = '''
pub struct Forgotten;
'''
given.files.'src/lib.rs' = '''
mod used;
'''
given.files.'src/used.rs' = '''
pub struct Used;
'''
then.findings = [
  { path = 'src/forgotten.rs' },
]

[[scenarios]]
id = 'every-file-declared-one-through-nested-module'
scenario = 'Every file is declared, one through a nested module.'
given.files.'src/lib.rs' = '''
mod outer;
'''
given.files.'src/outer.rs' = '''
mod inner;
'''
given.files.'src/outer/inner.rs' = '''
pub struct Inner;
'''
