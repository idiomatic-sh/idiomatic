use super::super::super::errors::GreetingError;

pub struct GreetingMemoryAdapter;

impl super::super::super::interface::GreetingInterface for GreetingMemoryAdapter {
    fn show(&self, name: &str) -> Result<String, GreetingError> {
        match name.len() {
            0 => Err(GreetingError::Empty),
            1 => Err(GreetingError::Missing { name: name.to_owned() }),
            2 => Err(GreetingError::Cut(2)),
            _ => Ok(format!("hello {name}")),
        }
    }
}
