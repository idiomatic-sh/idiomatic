description = "Every variant of an `enum` named `*Error` in an `errors.rs` (a hex's), other than an `#[error(transparent)]` one, is matched by a test of its crate: its name, qualified by the enum's (`FooError::Bar`), in a pattern of a `*_test.rs` under the same `src/`, or as the error of a row of a `CASES` table there, `Expect::Error(FooError::Bar)`."
why = "An error variant is a promise that the domain fails that way: a variant no test drives is either untested behaviour or dead code. A variant a dependency's failure produces is proven where the failure is handled: a `fails` row of the part that wraps it, driven by a failing fake, may stand in another directory of the same crate. A row is the argument of an `Expect::Error(..)` or `Expect::error(..)` call, so the refuses, fails and rejects rows of a part's test reach the variants they name; a pattern is a `match`, `if let`, `let.. else` or `matches!` pattern; inside a macro's arguments, which are tokens until expansion, the enum's name followed later in the same token group by the variant's counts, so `assert_eq!(result, Err(FooError::Bar))` does too. A variant written unqualified (after `use FooError::*`), through `Self::` or an alias of the enum is not seen, and a transparent variant only forwards another error, which that error's own crate proves."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let enums = select * from tree-nodes where kind = "enum";
let error-files = capture(from=enums, path="file", pattern="{*dir}/errors.rs", captures=["dir"]);
let nested-enums = capture(from=error-files, path="file", pattern="{*crate}/src/{*rest}", captures=["crate", "rest"]);
let root-enums-captured = capture(from=error-files, path="file", pattern="src/{*rest}", captures=["rest"]);
let root-enums = extend(from=root-enums-captured, values={"crate": "."});
let crate-enums = union(left=nested-enums, right=root-enums);
let enum-name-edges = select r."child" as "child", l."crate" as "crate", l."id" as "id" from crate-enums as l join "syntax-child" as r on l."id" = r."parent";
let names = select * from tree-nodes where kind = "name";
let enum-name-nodes = select l."crate" as "crate", l."id" as "id", r."id" as "name" from enum-name-edges as l join names as r on l."child" = r."id";
let enum-name-tokens = select l."crate" as "crate", l."id" as "id", r."child" as "token" from enum-name-nodes as l join "syntax-child" as r on l."name" = r."parent";
let named-enums = select r."text" as "enum", l."crate" as "crate", l."id" as "id" from enum-name-tokens as l join tree-tokens as r on l."token" = r."id";
let error-enums = select * from named-enums where glob_any(enum, "*Error");
let enum-list-edges = select r."child" as "child", l."enum" as "enum", l."crate" as "crate" from error-enums as l join "syntax-child" as r on l."id" = r."parent";
let variant-lists = select * from tree-nodes where kind = "variant-list";
let enum-lists = select l."enum" as "enum", l."crate" as "crate", r."id" as "list" from enum-list-edges as l join variant-lists as r on l."child" = r."id";
let list-variant-edges = select r."child" as "child", l."enum" as "enum", l."crate" as "crate" from enum-lists as l join "syntax-child" as r on l."list" = r."parent";
let variant-nodes = select * from tree-nodes where kind = "variant";
let enum-variants = select l."enum" as "enum", l."crate" as "crate", r."id" as "id", r."file" as "file", r."span" as "span" from list-variant-edges as l join variant-nodes as r on l."child" = r."id";
let variant-name-edges = select r."child" as "child", l."enum" as "enum", l."crate" as "crate", l."id" as "id", l."file" as "file", l."span" as "span" from enum-variants as l join "syntax-child" as r on l."id" = r."parent";
let variant-name-nodes = select l."enum" as "enum", l."crate" as "crate", l."id" as "id", r."id" as "name", l."file" as "file", l."span" as "span" from variant-name-edges as l join names as r on l."child" = r."id";
let variant-name-tokens = select l."enum" as "enum", l."crate" as "crate", l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "token" from variant-name-nodes as l join "syntax-child" as r on l."name" = r."parent";
let variants = select l."enum" as "enum", l."crate" as "crate", l."id" as "id", l."file" as "file", l."span" as "span", r."text" as "variant" from variant-name-tokens as l join tree-tokens as r on l."token" = r."id";
let variant-attribute-edges = select r."child" as "child", l."id" as "variant" from variants as l join "syntax-child" as r on l."id" = r."parent";
let attributes = select * from tree-nodes where kind = "attr";
let variant-attributes = select r."id" as "attribute", l."variant" as "variant" from variant-attribute-edges as l join attributes as r on l."child" = r."id";
let attribute-meta-edges = select r."child" as "child", l."variant" as "variant" from variant-attributes as l join "syntax-child" as r on l."attribute" = r."parent";
let metas = select * from tree-nodes where kind = "token-tree-meta";
let attribute-metas = select r."id" as "meta", l."variant" as "variant" from attribute-meta-edges as l join metas as r on l."child" = r."id";
let meta-child-edges = select r."child" as "child", l."meta" as "meta", l."variant" as "variant" from attribute-metas as l join "syntax-child" as r on l."meta" = r."parent";
let paths = select * from tree-nodes where kind = "path";
let path-segment-edges = select r."child" as "child", l."id" as "id", l."file" as "file" from paths as l join "syntax-child" as r on l."id" = r."parent";
let segments = select * from tree-nodes where kind = "path-segment";
let path-segments = select l."id" as "id", l."file" as "file", r."id" as "segment" from path-segment-edges as l join segments as r on l."child" = r."id";
let segment-ref-edges = select r."child" as "child", l."id" as "id", l."file" as "file" from path-segments as l join "syntax-child" as r on l."segment" = r."parent";
let name-refs = select * from tree-nodes where kind = "name-ref";
let segment-refs = select l."id" as "id", l."file" as "file", r."id" as "ref" from segment-ref-edges as l join name-refs as r on l."child" = r."id";
let segment-ref-tokens = select l."id" as "id", l."file" as "file", r."child" as "token" from segment-refs as l join "syntax-child" as r on l."ref" = r."parent";
let last-names = select l."id" as "id", r."text" as "name", l."file" as "file" from segment-ref-tokens as l join tree-tokens as r on l."token" = r."id";
let meta-names = select l."meta" as "meta", r."name" as "name", l."variant" as "variant" from meta-child-edges as l join last-names as r on l."child" = r."id";
let error-metas = select * from meta-names where name = "error";
let error-meta-edges = select r."child" as "child", l."variant" as "variant" from error-metas as l join "syntax-child" as r on l."meta" = r."parent";
let attribute-trees = select * from tree-nodes where kind = "token-tree";
let error-trees = select r."id" as "tree", l."variant" as "variant" from error-meta-edges as l join attribute-trees as r on l."child" = r."id";
let error-tree-edges = select r."child" as "child", l."tree" as "tree", l."variant" as "variant" from error-trees as l join "syntax-child" as r on l."tree" = r."parent";
let error-tree-tokens = select r."kind" as "kind", r."text" as "text", r."id" as "token", l."tree" as "tree", l."variant" as "variant" from error-tree-edges as l join tree-tokens as r on l."child" = r."id";
let error-tree-no-whitespace = select * from error-tree-tokens where kind != "whitespace";
let error-tree-no-comment = select * from error-tree-no-whitespace where kind != "comment";
let error-tree-no-l-paren = select * from error-tree-no-comment where kind != "l-paren";
let error-tree-words = select * from error-tree-no-l-paren where kind != "r-paren";
let transparent-words = select * from error-tree-words where text = "transparent";
let error-tree-word-ids = project(from=error-tree-words, columns=["variant", "tree", "token"]);
let error-tree-nested-edges = select r."id" as "token", l."tree" as "tree", l."variant" as "variant" from error-tree-edges as l join attribute-trees as r on l."child" = r."id";
let error-tree-parts = union(left=error-tree-word-ids, right=error-tree-nested-edges);
let error-tree-sizes = group-count(from=error-tree-parts, keys=["variant", "tree"], count="words", distinct="token");
let single-word-trees = select * from error-tree-sizes where words = 1;
let transparent-trees = select l."variant" as "variant" from transparent-words as l join single-word-trees as r on l."variant" = r."variant" and l."tree" = r."tree";
let transparent = project(from=transparent-trees, columns=["variant"]);
let owed = antijoin(left=variants, right=transparent, left-on=["id"], right-on=["variant"]);
let patterns = select * from tree-nodes where glob_any(kind, "{path-pat,tuple-struct-pat,record-pat}");
let pattern-path-edges = select r."child" as "child" from patterns as l join "syntax-child" as r on l."id" = r."parent";
let pattern-paths = select r."id" as "id", r."file" as "file", r."name" as "variant" from pattern-path-edges as l join last-names as r on l."child" = r."id";
let qualifier-edges = select r."child" as "child", l."file" as "file", l."variant" as "variant" from pattern-paths as l join "syntax-child" as r on l."id" = r."parent";
let pattern-mentions = select r."name" as "enum", l."file" as "file", l."variant" as "variant" from qualifier-edges as l join last-names as r on l."child" = r."id";
let token-trees = select * from tree-nodes where kind = "token-tree";
let tree-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "tree" from token-trees as l join "syntax-child" as r on l."id" = r."parent";
let idents = select * from tree-tokens where kind = "ident";
let tree-idents = select l."ordinal" as "ordinal", r."file" as "file", r."text" as "text", l."tree" as "tree" from tree-edges as l join idents as r on l."child" = r."id";
let owed-enums = project(from=owed, columns=["enum"]);
let tree-enums = select l."ordinal" as "before", l."text" as "enum", l."file" as "file", l."tree" as "tree" from tree-idents as l join owed-enums as r on l."text" = r."enum";
let owed-names = project(from=owed, columns=["crate", "enum", "variant"]);
let tree-variant-names = select l."before" as "before", l."enum" as "enum", l."file" as "file", l."tree" as "tree", r."variant" as "variant" from tree-enums as l join owed-names as r on l."enum" = r."enum";
let tree-pairs = select r."ordinal" as "after", l."before" as "before", l."enum" as "enum", l."file" as "file", l."variant" as "variant" from tree-variant-names as l join tree-idents as r on l."tree" = r."tree" and l."variant" = r."text";
let tree-ordered = select * from tree-pairs where before < after;
let tree-mentions = project(from=tree-ordered, columns=["file", "enum", "variant"]);
let path-exprs = select * from tree-nodes where glob_any(kind, "{path-expr,record-expr}");
let expr-path-edges = select l."id" as "id", l."file" as "file", r."child" as "child" from path-exprs as l join "syntax-child" as r on l."id" = r."parent";
let expr-last = select l."id" as "id", l."file" as "file", r."name" as "variant", l."child" as "pathnode" from expr-path-edges as l join last-names as r on l."child" = r."id";
let expr-qualifier-edges = select l."id" as "id", l."file" as "file", l."variant" as "variant", r."child" as "child" from expr-last as l join "syntax-child" as r on l."pathnode" = r."parent";
let expr-mentions = select l."id" as "id", l."file" as "file", l."variant" as "variant", r."name" as "enum" from expr-qualifier-edges as l join last-names as r on l."child" = r."id";
let expect-qualified = select * from expr-mentions where enum = "Expect";
let expect-callees = select * from expect-qualified where glob_any(variant, "{Error,error}");
let callee-edges = select l."id" as "callee", r."parent" as "call" from expect-callees as l join "syntax-child" as r on l."id" = r."child";
let call-exprs = select * from tree-nodes where kind = "call-expr";
let row-calls = select l."call" as "id" from callee-edges as l join call-exprs as r on l."call" = r."id";
let row-mentions-in = axis(from=expr-mentions, relation="syntax-child", direction=ancestor, domain=row-calls);
let row-mentions = project(from=row-mentions-in, columns=["file", "enum", "variant"]);
let refusal-callees = select * from expect-qualified where variant = "Refusal";
let refusal-edges = select r."parent" as "call" from refusal-callees as l join "syntax-child" as r on l."id" = r."child";
let refusal-calls = select l."call" as "id" from refusal-edges as l join call-exprs as r on l."call" = r."id";
let binaries = select * from tree-nodes where kind = "bin-expr";
let binary-edges = select l."id" as "id", r."child" as "child" from binaries as l join "syntax-child" as r on l."id" = r."parent";
let equals-tokens = select * from tree-tokens where text = "==";
let equalities = select l."id" as "id" from binary-edges as l join equals-tokens as r on l."child" = r."id";
let equality-parents = select l."id" as "id", r."parent" as "parent" from equalities as l join "syntax-child" as r on l."id" = r."child";
let result-contexts = select * from tree-nodes where glob_any(kind, "{if-expr,closure-expr,stmt-list}");
let result-equalities = select l."id" as "id" from equality-parents as l join result-contexts as r on l."parent" = r."id";
let selector-equalities = axis(from=result-equalities, relation="syntax-child", direction=ancestor, domain=refusal-calls);
let selector-comparisons = project(from=selector-equalities, columns=["id"]);
let compared-in = axis(from=expr-mentions, relation="syntax-child", direction=ancestor, domain=selector-comparisons);
let compared-mentions = project(from=compared-in, columns=["file", "enum", "variant"]);
let existing-written = union(left=pattern-mentions, right=tree-mentions);
let written-mentions = union(left=existing-written, right=compared-mentions);
let mentions = union(left=written-mentions, right=row-mentions);
let test-mentions = select * from mentions where glob_any(file, "**/*_test.rs");
let nested-mentions = capture(from=test-mentions, path="file", pattern="{*crate}/src/{*rest}", captures=["crate", "rest"]);
let root-mentions-captured = capture(from=test-mentions, path="file", pattern="src/{*rest}", captures=["rest"]);
let root-mentions = extend(from=root-mentions-captured, values={"crate": "."});
let crate-mentions = union(left=nested-mentions, right=root-mentions);
let reached = project(from=crate-mentions, columns=["crate", "enum", "variant"]);
let unreached = antijoin(left=owed, right=reached, left-on=["crate", "enum", "variant"], right-on=["crate", "enum", "variant"]);
emit unreached subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{enum}::{variant}` is matched by no test of its crate"
help = "Add a test of this crate that produces this variant and matches it (`matches!(result, Err({enum}::{variant}..))`): drive the input that causes it, or make the dependency fail (`fails_when_<dependency>_fails` with a failing fake from fixtures.rs). A variant nothing can produce is dead code: remove it. Ignore only a variant no test can produce (a failure no fake can cause): `// ignore: idiomatic.arch/error-variants-reached - <why no test can produce it>` on its own line above the variant."

[[scenarios]]
id = 'comparator-backed-error-expectation'
scenario = 'A refusal expectation backed by a comparator reaches the error variant and is not reported.'
given.files.'src/read/errors.rs' = 'pub enum ReadError { Missing }'
given.files.'src/read/service_test.rs' = 'const CASES: &[Case] = &[Case { expect: Expect::error(ReadError::Missing) }];'

[[scenarios]]
id = 'exact-context-equality-in-refusal'
scenario = 'A refusal compared by exact context equality reaches its variant and is not reported.'
given.files.'src/read/errors.rs' = 'pub enum ReadError { Missing { path: String } }'
given.files.'src/read/service_test.rs' = 'const CASES: &[Case] = &[Case { expect: Expect::Refusal(|actual| actual == &ReadError::Missing { path: "a.rs".into() }) }];'

[[scenarios]]
id = 'unused-error-in-refusal-is-not-a-comparison'
scenario = 'An error that a refusal only mentions, without comparing it, is reported.'
given.files.'src/read/errors.rs' = 'pub enum ReadError { Missing }'
given.files.'src/read/service_test.rs' = 'const CASES: &[Case] = &[Case { expect: Expect::Refusal(|actual| { let _ = ReadError::Missing; actual.code() == 1 }) }];'
then.findings = [
  { path = 'src/read/errors.rs', line = 1 },
]

[[scenarios]]
id = 'discarded-comparison-is-not-a-selector-result'
scenario = 'A comparison whose result is discarded selects no outcome and is reported.'
given.files.'src/read/errors.rs' = 'pub enum ReadError { Missing }'
given.files.'src/read/service_test.rs' = 'const CASES: &[Case] = &[Case { expect: Expect::Refusal(|actual| { actual == &ReadError::Missing; true }) }];'
then.findings = [
  { path = 'src/read/errors.rs', line = 1 },
]

[[scenarios]]
id = 'exact-context-selects-named-outcome'
scenario = 'An exact context that selects a named outcome reaches the variant and is not reported.'
given.files.'src/read/errors.rs' = 'pub enum ReadError { Missing }'
given.files.'src/read/service_test.rs' = 'const CASES: &[Case] = &[Case { expect: Expect::Refusal(|actual| { if actual == &ReadError::Missing { Selection::Matches } else { Selection::Differs } }) }];'

[[scenarios]]
id = 'every-non-transparent-variant-matched-match-if'
scenario = 'Every non-transparent variant matched in match, if let and matches! patterns.'
