description = "A lookup in an internal table by its own index never defaults: no `.get(index.0)` answered by `unwrap_or` or `unwrap_or_default`."
why = "An internal table is made together with the indices into it (a position, a rule's place, a scope's number): a lookup that misses is a bug. Answered with a default, the bug becomes a quiet wrong answer: a foreign position finds no ancestors, a rule with no id is blank, and a rule that should report passes. Read in production code: a `.get(..)` whose argument reads a typed index's number (`place.0`, `usize::try_from(id.0)`) and is no range, then optionally `.copied()` or `.cloned()`, answered by `.unwrap_or(..)` or `.unwrap_or_default()`. A lookup by a key that may be absent by design (a map read by a borrowed key, `.get(&key)`, a slice cut by a range) is not reported; a map read by a newtype's text (`.get(name.0)`) reads as an index and is reported, which is right where a guard already proved the key is there."

query = '''
let tree = select l."id" as "id", l."kind" as "kind", l."text" as "text", l."file" as "file", l."span" as "span" from "syntax-tree" as l;
let name-edges = select * from "syntax-child" where field = "name-ref";
let ref-tokens = select l."parent" as "owner", r."child" as "token" from name-edges as l join "syntax-child" as r on l."child" = r."parent";
let named = select l."owner" as "owner", r."text" as "name" from ref-tokens as l join tree as r on l."token" = r."id";
let calls = select * from tree where kind = "method-call-expr";
let call-names = select l."owner" as "id", l."name" as "name" from named as l join calls as r on l."owner" = r."id";
let receivers = select * from "syntax-child" where field = "receiver";
let defaults = select * from call-names where name = "unwrap_or" or name = "unwrap_or_default";
let passes = select * from call-names where name = "copied" or name = "cloned";
let gets = select * from call-names where name = "get";
let default-receivers = select l."id" as "default", r."child" as "inner" from defaults as l join receivers as r on l."id" = r."parent";
let passing = select l."default" as "default", l."inner" as "inner" from default-receivers as l join passes as r on l."inner" = r."id";
let through = select l."default" as "default", r."child" as "inner" from passing as l join receivers as r on l."inner" = r."parent";
let direct = select l."default" as "default", l."inner" as "inner" from default-receivers as l join gets as r on l."inner" = r."id";
let passed = select l."default" as "default", l."inner" as "inner" from through as l join gets as r on l."inner" = r."id";
let looked = union(left=direct, right=passed);
let arg-lists = select * from "syntax-child" where field = "arg-list";
let lists = select l."default" as "default", r."child" as "list" from looked as l join arg-lists as r on l."inner" = r."parent";
let args = select l."default" as "default", r."child" as "arg" from lists as l join "syntax-child" as r on l."list" = r."parent";
let ranges = select l."default" as "default" from args as l join tree as r on l."arg" = r."id" where r."kind" = "range-expr" or r."kind" = "ref-expr";
let arg-nodes = select l."arg" as "id", l."default" as "default" from args as l;
let arg-below = axis(from=arg-nodes, relation="syntax-child", direction=descendant, domain=tree);
let numbers = select l."default" as "default", r."id" as "token" from arg-below as l join tree as r on l."related" = r."id" where r."kind" = "int-number" and r."text" = "0";
let number-parents = select l."default" as "default", r."parent" as "parent" from numbers as l join "syntax-child" as r on l."token" = r."child";
let indexed = select l."default" as "default" from number-parents as l join tree as r on l."parent" = r."id" where r."kind" = "name-ref";
let kept = antijoin(left=indexed, right=ranges, left-on=["default"], right-on=["default"]);
let placed = select r."file" as "file", r."span" as "span" from kept as l join tree as r on l."default" = r."id";
let found = project(from=placed, columns=["file", "span"]);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "a lookup in an internal table by its own index answers a default when it misses: the bug becomes a wrong answer"
help = "Fail loudly: index the table under `#[expect(clippy::indexing_slicing, reason = \"…made together with its indices\")]`, or answer the miss as an error (`.ok_or(Error::Internal { what })?`). A default is the meaning only for a key that may be absent by design; such a lookup is by a key, not by a table's own index."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'positions-and-ids-defaulted'
scenario = 'Ryo`s nearest-ancestor walk answering its own id for a missing slot, and its rule ids answering a blank id past the table, as at 5149cd075d, are reported.'
given.files.'src/walk.rs' = '''
pub(crate) fn nearest(ancestors: &[Position], domain_id: Position) -> Position {
    ancestors
        .get(usize::try_from(domain_id.0).unwrap_or(usize::MAX))
        .copied()
        .unwrap_or(domain_id)
}
pub(crate) fn id_at(ids: &[RuleId], place: RuleIndex) -> RuleId {
    ids.get(place.0).cloned().unwrap_or_default()
}
'''
then.findings = [
  { path = 'src/walk.rs', line = 2 },
  { path = 'src/walk.rs', line = 8 },
]

[[scenarios]]
id = 'keys-ranges-and-loud-lookups'
scenario = 'A count map read by a name, a slice cut by a range, a lookup that fails loudly and a conversion`s fallback are not reported.'
given.files.'src/walk.rs' = '''
pub(crate) fn counts(seen: &BTreeMap<&str, u32>, name: &str, text: &str, at: Span, ids: &[RuleId], place: RuleIndex) -> u32 {
    let line = text.get(at.0..at.1).unwrap_or_default();
    let id = ids.get(place.0).cloned().expect("ids are made with the rules");
    let wide = usize::try_from(place.0).unwrap_or(usize::MAX);
    let parsed = seen.get(&Content(name.0)).copied().unwrap_or_default();
    seen.get(name).copied().unwrap_or(0) + parsed + line.len() as u32 + wide as u32 + id.0
}
'''
