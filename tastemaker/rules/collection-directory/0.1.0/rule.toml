'''
then.findings = [
  { path = 'src/relations.rs' },
]

[[scenarios]]
id = 'four-items-implement-a-local-trait'
scenario = 'Four items in one file implement one trait of their own crate: a collection.'
given.files.'src/lib.rs' = '''
//! Items.

pub mod interface;
pub mod items;
'''
given.files.'src/interface.rs' = '''
//! The item trait.

/// An item.
pub trait RelationsItem {}
'''
given.files.'src/items.rs' = '''
//! Items.

use crate::interface::RelationsItem;

/// One.
pub struct Item0;

impl RelationsItem for Item0 {}

/// One.
pub struct Item1;

impl RelationsItem for Item1 {}

/// One.
pub struct Item2;

impl RelationsItem for Item2 {}

/// One.
pub struct Item3;

impl RelationsItem for Item3 {}
'''
then.findings = [
  { path = 'src/items.rs' },
]

[[scenarios]]
id = 'three-items-at-the-default'
scenario = 'Three items share a custom derive: at the default of three, nothing is reported.'
given.files.'src/relations.rs' = '''
