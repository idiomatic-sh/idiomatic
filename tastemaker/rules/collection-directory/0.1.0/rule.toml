description = "One file declares no more than `max-items` items that share a non-standard derive, a non-standard attribute or the implementation of one trait of their own crate by types the file declares: such items are a collection, one directory each."
why = "A family of items that share a crate's own marker (four `#[relation(..)]` types, four `#[derive(RyoRelation)]` structs, four implementations of the crate's `RelationsItem` trait) is a domain collection: each item is articulated as `<collection>/<item>/`, and a file holding many of them buries every one under its siblings and makes the next one an edit to a shared file instead of a directory of its own. Counted per file and per shared marker: a derive that is not one of the standard derives (`Clone`, `Copy`, `Debug`, `Default`, `PartialEq`, `Eq`, `PartialOrd`, `Ord`, `Hash`, serde's `Serialize` and `Deserialize`, thiserror's `Error`), an attribute that is not a language, lint, documentation, test-harness or serde attribute, or a trait declared in the item's own package implemented for a type the same file declares (an `impl` of the trait for types declared elsewhere, such as a table of remedies for other modules' errors, declares no item). Items that share only standard derives are plain data, not a collection. Read from `decorates`, `defines`, `file-package` and the syntax tree of each `impl`; a derive's names are the identifiers inside its attribute. Not seen: items written by a macro, and a trait named through an alias. A heuristic, so a warning."

query = '''
param max-items: integer;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let items = select * from tree-nodes where glob_any(kind, "{struct,enum,union,fn,trait,const,static,type-alias}");
let decorations = select l."occurrence" as "occurrence", l."declaration" as "declaration", l."target" as "target", l."file" as "file" from "decorates" as l join items as r on l."declaration" = r."id";
let derives = select l."occurrence" as "id", l."declaration" as "declaration", l."file" as "file" from decorations as l where l."target" = "derive";
let idents = select * from tree-tokens where kind = "ident";
let derive-idents = axis(from=derives, relation="syntax-child", direction=descendant, domain=idents);
let derive-names = select l."declaration" as "declaration", l."file" as "file", r."text" as "marker" from derive-idents as l join idents as r on l."related" = r."id";
let custom-derives = select * from derive-names where not glob_any(marker, "{derive,Clone,Copy,Debug,Default,PartialEq,Eq,PartialOrd,Ord,Hash,serde,Serialize,Deserialize,thiserror,Error,std,core}");
let derive-markers = extend(from=custom-derives, values={"shared": "derive"});
let custom-attributes = select l."declaration" as "declaration", l."file" as "file", l."target" as "marker" from decorations as l where not glob_any(l."target", "{derive,doc,cfg,cfg_attr,allow,expect,warn,deny,forbid,must_use,non_exhaustive,repr,inline,cold,serde,error,from,source,test,track_caller,deprecated,diagnostic::*,rustfmt::*,clippy::*,macro_export,path,ignore,should_panic,automatically_derived,no_mangle,divan::*,tokio::*,given,when,then,step,proc_macro,proc_macro_derive,proc_macro_attribute}");
let attribute-markers = extend(from=custom-attributes, values={"shared": "attribute"});
let impl-nodes = select * from tree-nodes where kind = "impl";
let path-types = select * from tree-nodes where kind = "path-type";
let impl-kids = select l."id" as "impl", l."file" as "file", r."child" as "child", r."ordinal" as "ordinal" from impl-nodes as l join "syntax-child" as r on l."id" = r."parent";
let impl-types = select l."impl" as "impl", l."file" as "file", l."child" as "id", l."ordinal" as "ordinal" from impl-kids as l join path-types as r on l."child" = r."id";
let type-pairs = select l."impl" as "impl", l."file" as "file", l."id" as "trait-type", l."ordinal" as "first", r."id" as "self-type", r."ordinal" as "second" from impl-types as l join impl-types as r on l."impl" = r."impl";
let ordered = select * from type-pairs where first < second;
let trait-sides = select l."trait-type" as "id", l."impl" as "impl", l."file" as "file" from ordered as l;
let self-sides = select l."self-type" as "id", l."impl" as "impl", l."file" as "file" from ordered as l;
let trait-idents = axis(from=trait-sides, relation="syntax-child", direction=descendant, domain=idents);
let trait-names = select l."impl" as "impl", l."file" as "file", r."text" as "marker" from trait-idents as l join idents as r on l."related" = r."id";
let self-idents = axis(from=self-sides, relation="syntax-child", direction=descendant, domain=idents);
let self-names = select l."impl" as "impl", l."file" as "file", r."text" as "name" from self-idents as l join idents as r on l."related" = r."id";
let declared = select * from "defines" where glob_any(kind, "{struct,enum}");
let declared-here = select l."impl" as "impl" from self-names as l join declared as r on l."file" = r."file" and l."name" = r."name";
let own-impls = project(from=declared-here, columns=["impl"]);
let traits = select * from "defines" where kind = "trait";
let trait-packages = select l."name" as "name", r."package" as "package" from traits as l join "file-package" as r on l."file" = r."path";
let impl-packages = select l."impl" as "impl", l."file" as "file", l."marker" as "marker", r."package" as "package" from trait-names as l join "file-package" as r on l."file" = r."path";
let local-trait-impls = select l."impl" as "declaration", l."file" as "file", l."marker" as "marker" from impl-packages as l join trait-packages as r on l."marker" = r."name" and l."package" = r."package";
let local-impls = select l."declaration" as "declaration", l."file" as "file", l."marker" as "marker" from local-trait-impls as l join own-impls as r on l."declaration" = r."impl";
let trait-markers = extend(from=local-impls, values={"shared": "trait"});
let markers-0 = union(left=derive-markers, right=attribute-markers);
let markers = union(left=markers-0, right=trait-markers);
let counted = group-count(from=markers, keys=["file", "marker", "shared"], count="items", distinct="declaration");
let over = select * from counted where items > $max-items;
emit over subject "file" key("file", "marker", "shared");
'''

[params.max-items]
type = "integer"
description = "The most items one file may declare that share one non-standard marker (such as 3)."

[diagnostic]
primary = "file"
message = "`{file}` declares {items} items that share the {shared} `{marker}`: they are a collection"
help = "Give each item a directory of its own, `<collection>/<item>/`, beside the collection's interface: the file holds one item, not the collection. If the items are not a domain collection (test data, one closed enum's helpers), write `// ignore: idiomatic.arch/collection-directory - <why they are not a collection>` at the top of the file."

[given]
include = ['src/**']
params = { max-items = 3 }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
//! The fixture.

pub mod relations;
'''

[[scenarios]]
id = 'four-items-share-a-custom-derive'
scenario = 'Four items in one file derive the same custom derive: a collection.'
given.files.'src/relations.rs' = '''
//! Relations.

/// One.
#[derive(Debug, RyoRelation)]
pub struct Relation0;

/// One.
#[derive(Debug, RyoRelation)]
pub struct Relation1;

/// One.
#[derive(Debug, RyoRelation)]
pub struct Relation2;

/// One.
#[derive(Debug, RyoRelation)]
pub struct Relation3;
'''
then.findings = [
  { path = 'src/relations.rs' },
]

[[scenarios]]
id = 'four-items-share-a-custom-attribute'
scenario = 'Four items in one file carry the same non-standard attribute: a collection.'
given.files.'src/relations.rs' = '''
//! Features.

/// One.
#[provider_feature(name = "f0")]
pub struct Feature0;

/// One.
