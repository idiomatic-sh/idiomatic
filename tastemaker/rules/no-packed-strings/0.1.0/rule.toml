[[scenarios]]
id = 'listed-with-tabs'
scenario = "ryo's `operator list` JSON at 5149cd075d: each operator's name and summary joined with a tab into one string of a list field."
given.files.'src/lib.rs' = '''
/// One operator.
pub struct Operator {
    /// Its name.
    pub name: String,
    /// What it does.
    pub summary: String,
}

/// The listing as JSON writes it.
pub struct ListingSchema {
    /// The operators.
    pub operators: Vec<String>,
}

impl ListingSchema {
    /// The listing of these operators.
    #[must_use]
    pub fn of(operators: Vec<Operator>) -> Self {
        Self {
            operators: operators
                .into_iter()
                .map(|operator| format!("{}\t{}", operator.name, operator.summary))
                .collect(),
        }
    }
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 22 },
