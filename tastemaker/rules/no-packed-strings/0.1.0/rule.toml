[[scenarios]]
id = 'typed-fields-and-printed-text'
scenario = "Asymptote's `check` JSON with separate path, line and column, and its text printing `path:line:column` for a person."
given.files.'src/lib.rs' = '''
/// A finding as JSON writes it.
pub struct FindingSchema {
    /// The file.
    pub path: String,
    /// Its line, when it has one.
    pub line: Option<u32>,
    /// Its column, when it has one.
    pub column: Option<u32>,
}

/// Prints each finding's place for a person.
pub fn print(findings: &[FindingSchema], out: &mut impl std::io::Write) -> std::io::Result<()> {
    for found in findings {
        let place = match (found.line, found.column) {
            (Some(line), Some(column)) => format!("{}:{line}:{column}", found.path),
            (Some(line), None) => format!("{}:{line}", found.path),
            (None, _) => found.path.clone(),
        };
        writeln!(out, "{place}")?;
    }
    Ok(())
}

/// A message naming two things, a sentence and not a packed field.
pub struct Refusal {
    /// What was refused and why.
    pub message: String,
}

/// The refusal of a key.
#[must_use]
pub fn refuse(key: &str, value: &str) -> Refusal {
    Refusal { message: format!("{key}: {value}") }
}

/// What to do next, for a person.
pub enum Next {
    /// A fix to make.
    Fix(String),
}

/// Asymptote's remedy naming the nearest places, composed in a local and joined into a sentence.
#[must_use]
pub fn nearest(places: &[(String, u32)]) -> Next {
    Next::Fix({
        let named = places
            .iter()
            .map(|(path, line)| format!("{}:{}", path, line))
            .collect::<Vec<_>>();
        format!("name a place `asymptote check` printed; the nearest new: {}", named.join(", "))
    })
}
'''
