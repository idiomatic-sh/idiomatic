description = "No field holds values packed into one string: `format!` or `write!` with only placeholders and `:`, `,`, `;`, `#`, `=`, `|` or a tab between them builds no struct field and no newtype."
why = "Two values joined into one string (`path:line:column`, `identity#check`, `length:modified`, `name\\tsummary`) have to be split again by whoever reads them, a value holding the separator shifts every later one, and the types are lost: the line is text, the count is text. A struct with one field per value says what each is and needs no parsing. Read as written: a string literal in a `format!`, `write!`, `writeln!` or `format_args!` whose text is two or more placeholders with nothing between them but one of those separators (no space, so a sentence of a message is not one), whose nearest enclosing struct literal field, tuple struct call (a call whose last segment starts with a capital letter, `Some`, `Ok` and `Err` aside) or `let` is a field or a call: built into a local first, it is text being composed, not a field. Not seen: a packed string built by `push_str`, by `join`, or through a local: the text a person reads (`path:line:column` printed by a check, the places a message names) is not a field."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let templates = select * from tree-tokens where kind = "string" and (glob_any(text, "?\{*\}[:;#=|,]\{*\}?") or glob_any(text, "?\{*\}\\t\{*\}?")) and not glob_any(text, "* *");
let template-trees = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text", r."parent" as "tree" from templates as l join "syntax-child" as r on l."id" = r."child";
let template-calls = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text", r."parent" as "call" from template-trees as l join "syntax-child" as r on l."tree" = r."child";
let macro-calls = select * from tree-nodes where kind = "macro-call";
let macro-paths = select l."id" as "call", r."child" as "path" from macro-calls as l join "syntax-child" as r on l."id" = r."parent";
let path-segments = select l."call" as "call", r."child" as "segment" from macro-paths as l join "syntax-child" as r on l."path" = r."parent";
let segment-refs = select l."call" as "call", r."child" as "ref" from path-segments as l join "syntax-child" as r on l."segment" = r."parent";
let ref-tokens = select l."call" as "call", r."child" as "token" from segment-refs as l join "syntax-child" as r on l."ref" = r."parent";
let macro-names = select l."call" as "call", r."text" as "name" from ref-tokens as l join tree-tokens as r on l."token" = r."id" where r."kind" = "ident";
let formatting = select * from macro-names where glob_any(name, "{format,write,writeln,format_args}");
let packing = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text", l."call" as "call" from template-calls as l join formatting as r on l."call" = r."call";
let starts = select l."call" as "id" from packing as l;
let fields = select * from tree-nodes where kind = "record-expr-field";
let calls = select * from tree-nodes where kind = "call-expr";
let callees = select l."id" as "call", r."child" as "callee" from calls as l join "syntax-child" as r on l."id" = r."parent";
let callee-paths = select l."call" as "call", r."child" as "path" from callees as l join "syntax-child" as r on l."callee" = r."parent";
let callee-segments = select l."call" as "call", r."child" as "segment" from callee-paths as l join "syntax-child" as r on l."path" = r."parent";
let callee-refs = select l."call" as "call", r."child" as "ref" from callee-segments as l join "syntax-child" as r on l."segment" = r."parent";
let callee-tokens = select l."call" as "call", r."child" as "token" from callee-refs as l join "syntax-child" as r on l."ref" = r."parent";
let callee-names = select l."call" as "id", r."text" as "name" from callee-tokens as l join tree-tokens as r on l."token" = r."id" where r."kind" = "ident";
let constructors = select * from callee-names where glob_any(name, "[A-Z]*") and not glob_any(name, "{Some,Ok,Err}");
let lets = select * from tree-nodes where kind = "let-stmt";
let field-holders = project(from=fields, columns=["id"]);
let constructor-holders = project(from=constructors, columns=["id"]);
let let-holders = project(from=lets, columns=["id"]);
let holders = union(left=field-holders, right=constructor-holders);
let boundaries = union(left=holders, right=let-holders);
let nearest = axis(from=starts, relation="syntax-child", direction=nearest-ancestor, domain=boundaries);
let held = select l."id" as "call" from nearest as l join holders as r on l."related" = r."id";
let packed = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from packing as l join held as r on l."call" = r."call";
emit packed subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{text}` packs values into one string that a field holds"
help = "Give each value its own field: a struct (`Point { line, column }`, `Stamp { length, modified }`, `{ rule, check }`) or a list of typed rows, built where the values are and read without splitting. Join them into one string only where a person reads it, in the text the command prints."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'place-packed'
scenario = "Asymptote's `ratchet up` JSON at 5149cd075d: the place of a violation packed into `at` as `path:line:column`."
given.files.'src/lib.rs' = '''
/// A violation left in the lock.
pub struct LeftSchema {
    /// Where it is.
    pub at: String,
}

/// Where a violation is.
pub enum Place {
    /// The whole file.
    File,
    /// A line.
    Line(u32),
    /// A line and a column.
    At(u32, u32),
}

/// The left row of one violation.
#[must_use]
pub fn left(path: &str, place: &Place) -> LeftSchema {
    LeftSchema {
        at: match place {
            Place::File => path.to_owned(),
            Place::Line(line) => format!("{}:{}", path, line),
            Place::At(line, column) => {
                format!("{}:{}:{}", path, line, column)
            }
        },
    }
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 23 },
  { path = 'src/lib.rs', line = 25 },
]

