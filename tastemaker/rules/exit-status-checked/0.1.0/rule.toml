[[scenarios]]
id = 'exits-checked'
scenario = 'Exits checked through a binding, directly, through `?`, in the function of an adapter, and handed back to the caller (the replay and acceptance tests at 5149cd075d).'
given.files.'tests/code.rs' = '''
use std::path::Path;
use std::process::{Command, Output};
fn git(directory: &Path, arguments: &[&str]) {
    let output = Command::new("git")
        .args(arguments)
        .current_dir(directory)
        .output()
        .expect("git runs");
    assert!(output.status.success(), "git {arguments:?}: {output:?}");
}
fn copy_of(source: &Path, copy: &Path) {
    let status = Command::new("cp").arg("-a").arg(source).arg(copy).status().expect("cp runs");
    assert!(status.success(), "the source is copied");
}
fn init(root: &Path) -> Result<(), Box<dyn std::error::Error>> {
    assert!(Command::new("git").args(["init", "-q"]).arg(root).status()?.success());
    let made = Command::new("git").arg("status").current_dir(root).output()?;
    if !made.status.success() {
        return Err("git status fails".into());
    }
    let Ok(listed) = Command::new("ls").output() else {
        panic!("ls starts");
    };
    assert_eq!(listed.status.code(), Some(0));
    Ok(())
}
fn tm(arguments: &[&str], directory: &Path) -> Output {
    Command::new("tm").args(arguments).current_dir(directory).output().expect("tm starts")
}
fn run(command: &mut Command) -> std::io::Result<Output> {
    command.output()
}
fn initialized(project: &Path) -> bool {
    Command::new("git").args(["init", "-q"]).arg(project).status().is_ok_and(|status| status.success())
}
'''
