description = "A collection is whole: its list `collections.rs` beside `collections/`, its module file beside its directory, its `interface.rs` and an item, whose module file and directory come together, and a name that is none of its neighbours'."
why = "A collection is N implementations of one shape and is compiled only through its module files, which nothing else requires: `collections.rs` without a collection declares what does not exist, a collection without `collections.rs` or without its module file `collections/<collection>.rs` is never compiled, a collection without its `interface.rs` has no shape to hold its items to, one without an item has nothing to hold, and an item is its module file beside its directory. What the item's directory holds is the item part's: the part spec's counts hold its `item.rs` and `item_test.rs` where the product places an item part, and the closed placement refuses an item directory that nothing places. It is the same wherever a collection sits - the crate, a hex, a domain concept or an adapter - so one rule holds them all, and every pairing is keyed on the directory that holds `collections/` and on the collection, never on a constant: a crate with several collections, or several parts with collections of their own, is checked collection by collection. A collection is never named for a namespace or a member of the directory that holds it, and an item is never named for one of the collection's own files. It reads the item directories beside the module files, which are parts of their own, so the product's tastemaker.toml places it over the files that hold collections: a rule a spec places does not read the directories of the parts nested in the spec's instance. A finding is reported at the file concerned: for a collection with no list or no module file, at each file it has; with no interface or no item, at its module file; for an item, at its module file when its directory is missing and at the files of its directory otherwise."

query = '''
let list-captures = capture(from="filesystem.file", path="path", pattern="{*owner}/collections.rs", captures=["owner"]);
let lists = project(from=list-captures, columns=["path", "owner"]);
let module-captures = capture(from="filesystem.file", path="path", pattern="{*owner}/collections/{collection}.rs", captures=["owner", "collection"]);
let module-rows = project(from=module-captures, columns=["path", "owner", "collection"]);
let module-keys = project(from=module-rows, columns=["owner", "collection"]);
let inside-captures = capture(from="filesystem.file", path="path", pattern="{*owner}/collections/{collection}/{*more}", captures=["owner", "collection", "more"]);
let inside-rows = project(from=inside-captures, columns=["path", "owner", "collection"]);
let collection-files = union(left=module-rows, right=inside-rows);
let interface-captures = capture(from="filesystem.file", path="path", pattern="{*owner}/collections/{collection}/interface.rs", captures=["owner", "collection"]);
let interface-keys = project(from=interface-captures, columns=["owner", "collection"]);
let direct-captures = capture(from="filesystem.file", path="path", pattern="{*owner}/collections/{collection}/{name}", captures=["owner", "collection", "name"]);
let direct-rows = project(from=direct-captures, columns=["path", "owner", "collection"]);
let direct-rs-captures = capture(from="filesystem.file", path="path", pattern="{*owner}/collections/{collection}/{item}.rs", captures=["owner", "collection", "item"]);
let direct-rs-rows = project(from=direct-rs-captures, columns=["path", "owner", "collection", "item"]);
let direct-rs-paths = project(from=direct-rs-captures, columns=["path"]);
let own-files = select * from direct-rs-rows where glob_any(item, "{interface,fixtures,types,errors}");
let own-paths = project(from=own-files, columns=["path"]);
let item-modules = antijoin(left=direct-rs-rows, right=own-paths, left-on=["path"], right-on=["path"]);
let item-module-keys = project(from=item-modules, columns=["owner", "collection", "item"]);
let item-module-collections = project(from=item-modules, columns=["owner", "collection"]);
let item-dir-captures = capture(from="filesystem.file", path="path", pattern="{*owner}/collections/{collection}/{item}/{*more}", captures=["owner", "collection", "item", "more"]);
let item-dir-rows = project(from=item-dir-captures, columns=["path", "owner", "collection", "item"]);
let item-dir-keys = project(from=item-dir-captures, columns=["owner", "collection", "item"]);
let unlisted = antijoin(left=collection-files, right=lists, left-on=["owner"], right-on=["owner"]);
let empty-lists = antijoin(left=lists, right=collection-files, left-on=["owner"], right-on=["owner"]);
let orphans = antijoin(left=inside-rows, right=module-keys, left-on=["owner", "collection"], right-on=["owner", "collection"]);
let representatives = union(left=module-rows, right=orphans);
let no-interface = antijoin(left=representatives, right=interface-keys, left-on=["owner", "collection"], right-on=["owner", "collection"]);
let strays = antijoin(left=direct-rows, right=direct-rs-paths, left-on=["path"], right-on=["path"]);
let reserved-member-dirs = select * from item-dir-rows where glob_any(item, "{interface,types,errors}");
let value-roles = select path as path from "tastemaker.placed" where glob_any(template, "{value,value-module,value-test}");
let member-dirs = antijoin(left=reserved-member-dirs, right=value-roles, left-on=["path"], right-on=["path"]);
let fixtures-dirs = select * from item-dir-rows where glob_any(item, "fixtures");
let non-item-dirs = union(left=reserved-member-dirs, right=fixtures-dirs);
let plain-item-dirs = antijoin(left=item-dir-rows, right=non-item-dirs, left-on=["path"], right-on=["path"]);
let plain-dir-collections = project(from=plain-item-dirs, columns=["owner", "collection"]);
let item-collections = union(left=item-module-collections, right=plain-dir-collections);
let no-items = antijoin(left=representatives, right=item-collections, left-on=["owner", "collection"], right-on=["owner", "collection"]);
let dirless-items = antijoin(left=item-modules, right=item-dir-keys, left-on=["owner", "collection", "item"], right-on=["owner", "collection", "item"]);
let unmoduled-items = antijoin(left=plain-item-dirs, right=item-module-keys, left-on=["owner", "collection", "item"], right-on=["owner", "collection", "item"]);
let reserved-names = select * from collection-files where glob_any(collection, "{adapters,collections,domain,errors,factory,fixtures,inbound,interface,outbound,schemas,service,steps,types,use_cases}");
let unlisted-labelled = extend(from=unlisted, values={"item": "", "problem": "is in a `collections/` directory with no `collections.rs` beside it to declare the collections", "fix": "Write the list that declares one module per collection: `tm scaffold collections --at <owner>/collections.rs`, where `<owner>` is the directory this finding names, then declare each collection in it."});
let unlisted-found = project(from=unlisted-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let empty-lists-labelled = extend(from=empty-lists, values={"collection": "", "item": "", "problem": "has a `collections.rs` and no collection beside it: it declares the collections its directory holds", "fix": "Delete `<owner>/collections.rs`, or add a collection: `tm scaffold collection --at <owner>/collections/<collection>.rs` writes its module file, `collection-interface` its interface.rs and `item-module` an item's module file."});
let empty-lists-found = project(from=empty-lists-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let orphans-labelled = extend(from=orphans, values={"item": "", "problem": "has files and no module file `collections/<collection>.rs` beside its directory to declare them", "fix": "Write the collection's module file, which declares its interface and each of its items: `tm scaffold collection --at <owner>/collections/<collection>.rs`."});
let orphans-found = project(from=orphans-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let no-interface-labelled = extend(from=no-interface, values={"item": "", "problem": "has no `interface.rs`, the one trait every item implements", "fix": "Write the collection's interface: `tm scaffold collection-interface --at <owner>/collections/<collection>/interface.rs`, and declare it in the collection's module file."});
let no-interface-found = project(from=no-interface-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let strays-labelled = extend(from=strays, values={"item": "", "problem": "holds a file that is none of a collection's files", "fix": "A collection directory holds `interface.rs`, its optional `fixtures.rs` with `fixtures/contract.rs`, `types.rs` and `errors.rs`, an item module file `<item>.rs` beside each item directory `<item>/`, and nothing else: move this file to the part that owns it, or delete it."});
let strays-found = project(from=strays-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let member-dirs-labelled = extend(from=member-dirs, values={"problem": "has an item directory named for one of the collection's own files", "fix": "Rename the item directory and its module file `<item>.rs` to a name that is not `interface`, `types`, `errors` or `fixtures`: the collection's own interface.rs, types.rs and errors.rs sit in the same directory and would share the item's module name."});
let member-dirs-found = project(from=member-dirs-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let no-items-labelled = extend(from=no-items, values={"item": "", "problem": "has no item: no item module file `collections/<collection>/<item>.rs` and no item directory", "fix": "Add an item: `tm scaffold item-module --at <owner>/collections/<collection>/<item>.rs` writes its module file and `tm scaffold part --at <owner>/collections/<collection>/<item>` writes its directory; or delete the collection with its module file."});
let no-items-found = project(from=no-items-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let dirless-items-labelled = extend(from=dirless-items, values={"problem": "has an item module file and no item directory `<item>/` beside it", "fix": "Write the item's directory: `tm scaffold part --at <owner>/collections/<collection>/<item>` writes the item part's `item.rs` and `item_test.rs`, where `<item>` is this file's name without `.rs`; or delete the item's module file and its `mod` line."});
let dirless-items-found = project(from=dirless-items-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let unmoduled-items-labelled = extend(from=unmoduled-items, values={"problem": "has an item directory with no module file `<item>.rs` beside it to compile it", "fix": "Write the item's module file, which declares its code and its test: `tm scaffold item-module --at <owner>/collections/<collection>/<item>.rs`, and declare it in the collection's module file."});
let unmoduled-items-found = project(from=unmoduled-items-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let reserved-names-labelled = extend(from=reserved-names, values={"item": "", "problem": "is named for a namespace or a member of the directory that holds it", "fix": "Rename the collection's directory and its module file: a collection is never called `steps`, `use_cases`, `adapters`, `inbound`, `outbound`, `domain`, `fixtures`, `factory`, `schemas`, `service`, `interface`, `errors`, `types` or `collections`, so no name here hides another namespace's."});
let reserved-names-found = project(from=reserved-names-labelled, columns=["path", "owner", "collection", "item", "problem", "fix"]);
let findings-1 = union(left=unlisted-found, right=empty-lists-found);
let findings-2 = union(left=findings-1, right=orphans-found);
let findings-3 = union(left=findings-2, right=no-interface-found);
let findings-4 = union(left=findings-3, right=strays-found);
let findings-5 = union(left=findings-4, right=member-dirs-found);
let findings-6 = union(left=findings-5, right=no-items-found);
let findings-7 = union(left=findings-6, right=dirless-items-found);
let findings-8 = union(left=findings-7, right=unmoduled-items-found);
let findings-9 = union(left=findings-8, right=reserved-names-found);
emit findings-9 subject "path" key("collection", "item", "problem");
'''

[diagnostic]
primary = "path"
message = "`collections/{collection}` in `{owner}` {problem}"
help = "{fix} (`<owner>` and `<collection>` are the directory and the collection named above.) Exact placed value, value-module and value-test roles may live below a collection types namespace; unplaced files and other roles remain refused. An ignore is never the fix."

[given]
include = ['src/collections.rs', 'src/collections/**']

