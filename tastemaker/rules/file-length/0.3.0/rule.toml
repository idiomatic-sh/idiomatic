description = "A file of any kind has at most `max-lines` lines, counted over the whole file: blank lines, comments and a last line with no line break all count."
why = "A long file usually holds more than one concept, and is harder for people and agents to read and change. The limit is a target, not a law: a long file is a prompt to look for the pattern files of its kind split along, never a reason to cut one apart just to pass. A file that is legitimately long stays whole, with an ignore at its top that says why. The count is the whole file, whatever its kind, read from the engine's own line count, so no language's syntax decides what a line is."

query = '''
param max-lines: integer;
let long = select * from "filesystem.line-count" where lines > $max-lines;
let long-paths = project(from=long, columns=["path"]);
let long-adapters = select * from long-paths where glob_any(path, "{**/adapter.rs,**/adapter_test.rs,**/dtos.rs,**/adapters/*/types.rs,**/adapters/*/types_test.rs}");
let adapters = extend(from=long-adapters, values={"landing": "map the adapter's concepts first, then file each by its kind, never by port method: its own values in the adapter's `types.rs` with `types_test.rs`, its wire forms in its `dtos.rs`, a repeated concept in its `collections/`, a rule over the hex's values in the hex's `domain/<concept>/`, and a capability of its own in a hex of its own; do not default to the domain"});
let long-procedures = select * from long-paths where glob_any(path, "{**/command.rs,**/command_test.rs,**/use_case.rs,**/use_case_test.rs}");
let procedures = extend(from=long-procedures, values={"landing": "the command or use case does more than one thing: map its concepts first, then file each by its kind, a value in the hex's `types.rs`, a rule in its `domain/<concept>/`, a capability in a hex of its own, so it only calls them; orchestration stays in the use case, repeated where two use cases compose the same parts, never moved to shared steps"});
let landed-1 = union(left=adapters, right=procedures);
let long-hex-files = select * from long-paths where glob_any(path, "{**/types.rs,**/types_test.rs,**/interface.rs,**/interface_test.rs,**/errors.rs}");
let long-hex-roots = difference(left=long-hex-files, right=long-adapters);
let hex-roots = extend(from=long-hex-roots, values={"landing": "the domain holds more than one concept: map them first, then split it into more hexes, one per concept, each with its own types, interface and errors"});
let long-concepts = select * from long-paths where glob_any(path, "{**/domain/*/domain.rs,**/domain/*/domain_test.rs}");
let concepts = extend(from=long-concepts, values={"landing": "the concept's rules hold more than one concept: map them, then give each its own `domain/<concept>/` with its `domain.rs` and `domain_test.rs`, or move a rule over one value into the hex's `types.rs`"});
let long-domains = union(left=long-hex-roots, right=long-concepts);
let domains = union(left=hex-roots, right=concepts);
let landed-2 = union(left=landed-1, right=domains);
let long-fixtures = select * from long-paths where glob_any(path, "{**/fixtures.rs}");
let fixtures = extend(from=long-fixtures, values={"landing": "split the fixtures one per file: `fixtures.rs` declares each as a module, `fixtures/<fixture>.rs` or `fixtures/<fixture>/fixture.rs`, named for the method it feeds or the fake it holds"});
let landed-3 = union(left=landed-2, right=fixtures);
let long-tests = select * from long-paths where glob_any(path, "{**/tests/bdd.rs,**/tests/end_to_end.rs}");
let tests = extend(from=long-tests, values={"landing": "move each test next to the logic it tests, in the crate that owns that logic: a CLI command's tests go in that command's `command_test.rs`, a domain's in its `_test.rs` files"});
let landed-4 = union(left=landed-3, right=tests);
let long-wiring = select * from long-paths where glob_any(path, "{**/lib.rs,**/main.rs,**/composition.rs}");
let wiring = extend(from=long-wiring, values={"landing": "this file only declares and wires, so do not split it: move the logic in it into the hex that owns that logic"});
let landed-5 = union(left=landed-4, right=wiring);
let long-stages = select * from long-paths where glob_any(path, "{**/src/macros/*/parse.rs,**/src/macros/*/parse_test.rs,**/src/macros/*/check.rs,**/src/macros/*/check_test.rs,**/src/macros/*/expand.rs,**/src/macros/*/expand_test.rs}");
let stages = extend(from=long-stages, values={"landing": "split the macro stage by the construct it handles into `<stage>/<construct>/`, such as `expand/field/` and `expand/variant/`"});
let landed-6 = union(left=landed-5, right=stages);
let long-benches = select * from long-paths where glob_any(path, "{**/benches/performance.rs}");
let benches = extend(from=long-benches, values={"landing": "split the benchmarks by workload into `benches/performance/<workload>/bench.rs`"});
let landed-7 = union(left=landed-6, right=benches);
let long-patterned-1 = union(left=long-adapters, right=long-procedures);
let long-patterned-2 = union(left=long-patterned-1, right=long-domains);
let long-patterned-3 = union(left=long-patterned-2, right=long-fixtures);
let long-patterned-4 = union(left=long-patterned-3, right=long-tests);
let long-patterned-5 = union(left=long-patterned-4, right=long-wiring);
let long-patterned-6 = union(left=long-patterned-5, right=long-stages);
let long-with-pattern = union(left=long-patterned-6, right=long-benches);
let long-others = difference(left=long-paths, right=long-with-pattern);
let others = extend(from=long-others, values={"landing": "no split is named for this kind of file, so examine it for one: sections, concepts or repeated items that could each be a file of their own, and split along that"});
let landings = union(left=landed-7, right=others);
let long-slashed = select * from long-paths where glob_any(path, "{**/*.rs,**/*.js,**/*.mjs,**/*.cjs,**/*.jsx,**/*.ts,**/*.mts,**/*.cts,**/*.tsx,**/*.go,**/*.java,**/*.kt,**/*.kts,**/*.swift,**/*.c,**/*.h,**/*.cc,**/*.cpp,**/*.hpp,**/*.cs,**/*.scala,**/*.dart,**/*.zig,**/*.proto}");
let slashed = extend(from=long-slashed, values={"ignore": "If it is legitimately long, keep it whole and write `// ignore: idiomatic.arch/file-length - <why it is long and why splitting would not help>` at the top of the file, before any code."});
let long-hashed = select * from long-paths where glob_any(path, "{**/*.toml,**/*.sh,**/*.bash,**/*.zsh,**/*.yml,**/*.yaml,**/*.py,**/*.rb,**/*.pl,**/*.r,**/*.cfg,**/*.ini,**/*.conf,**/*.mk,**/Dockerfile,**/Makefile,**/Justfile,**/justfile,**/.gitignore,**/.gitattributes}");
let hashed = extend(from=long-hashed, values={"ignore": "If it is legitimately long, keep it whole and write `# ignore: idiomatic.arch/file-length - <why it is long and why splitting would not help>` at the top of the file, before any code."});
let commented = union(left=slashed, right=hashed);
let long-commented = union(left=long-slashed, right=long-hashed);
let long-uncommented = difference(left=long-paths, right=long-commented);
let uncommented = extend(from=long-uncommented, values={"ignore": "This kind of file (Markdown, Gherkin, JSON and other kinds without a line comment) cannot hold an ignore, so split or shorten it."});
let ignores = union(left=commented, right=uncommented);
let guided = select l."landing" as "landing", i."ignore" as "ignore", l."path" as "path" from landings as l join ignores as i on l."path" = i."path";
let findings = select g."landing" as "landing", g."ignore" as "ignore", r."lines" as "lines", g."path" as "path" from guided as g join long as r on g."path" = r."path";
emit findings subject "path" key("path");
'''

[params.max-lines]
type = "integer"
description = "The most lines a file may have, blank lines included (the shared rule block sets 400)."

[diagnostic]
primary = "path"
message = "`{path}` has {lines} lines, over the file-length limit"
help = "The limit is a target, not a law: never split a file just to pass it. Look first for the pattern this kind of file splits along: {landing}. {ignore}"

[given]
include = ['**']
params = { max-lines = 3 }

[[scenarios]]
id = 'at-limit'
scenario = 'A file of exactly max-lines lines, blank lines and comments among them, passes.'
