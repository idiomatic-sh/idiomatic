# The tastemaker.toml written for the fixture is not its subject, and is four lines long.
[[scenarios]]
id = 'ignored-at-top'
scenario = 'A legitimately long file is kept whole by an ignore at its top, in its own comment syntax.'
given.exclude = ['tastemaker.toml']
given.files.'settings.toml' = '''
# ignore: idiomatic.arch/file-length - one table per release, read top to bottom; split tables would be searched across files
[a]
b = 1
c = 2
'''
given.files.'src/lib.rs' = '''
// ignore: idiomatic.arch/file-length - one generated match over every variant; a split would scatter one table
pub fn a() {}
pub fn b() {}
pub fn c() {}
'''

