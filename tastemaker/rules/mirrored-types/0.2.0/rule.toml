description = "No two structs of one crate have the same named fields, when they have three or more."
why = "A struct whose fields mirror another's one for one is a copy of one concept: two names for the same data, a conversion that copies field by field between them, and two places to change when the concept does. A crate keeps one type per concept and passes it on. Read as written: the names of a struct's named fields, compared as a set, between the structs of one package; a struct of three or more named fields is compared. Not compared: a wire shape in `schemas.rs` (the shape the data has outside, which mirrors the core type by design), the items of a collection (`collections/`, one shape per item by design), test code (`tests/`, `*_test.rs`, `fixtures.rs`, `cases.rs`, `acceptance.rs`), a use case's wiring (`*UseCaseImpl`, `*Ports`, composed of the same parts by design), a struct that declares a lifetime parameter (the borrowed view of data another struct owns, such as a record read in place from encoded bytes beside the owned value it is converted to once), and structs of different crates (an SDK's edge type mirrors its core's on purpose)."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."kind" = "ident";
let structs = select * from tree-nodes where kind = "struct" and not glob_any(file, "{**/schemas.rs,**/*_test.rs,**/tests/**,**/fixtures.rs,**/cases.rs,**/acceptance.rs,**/collections/**}");
let struct-children = select l."id" as "struct", l."file" as "file", r."child" as "child" from structs as l join "syntax-child" as r on l."id" = r."parent";
let struct-name-nodes = select l."struct" as "struct", l."child" as "node" from struct-children as l join tree-nodes as r on l."child" = r."id" where r."kind" = "name";
let struct-name-tokens = select l."struct" as "struct", r."child" as "token" from struct-name-nodes as l join "syntax-child" as r on l."node" = r."parent";
let struct-names = select l."struct" as "struct", r."text" as "name", r."file" as "file", r."span" as "span" from struct-name-tokens as l join tree-tokens as r on l."token" = r."id";
let generic-lists = select l."struct" as "struct", l."child" as "list" from struct-children as l join tree-nodes as r on l."child" = r."id" where r."kind" = "generic-param-list";
let list-params = select l."struct" as "struct", r."child" as "param" from generic-lists as l join "syntax-child" as r on l."list" = r."parent";
let borrowing = select l."struct" as "struct" from list-params as l join tree-nodes as r on l."param" = r."id" where r."kind" = "lifetime-param";
let owned-or-borrowed = select * from struct-names where not glob_any(name, "{*UseCaseImpl,*Ports}");
let compared = antijoin(left=owned-or-borrowed, right=borrowing, left-on=["struct"], right-on=["struct"]);
let lists = select l."struct" as "struct", l."child" as "list" from struct-children as l join tree-nodes as r on l."child" = r."id" where r."kind" = "record-field-list";
let list-children = select l."struct" as "struct", r."child" as "field" from lists as l join "syntax-child" as r on l."list" = r."parent";
let fields = select l."struct" as "struct", l."field" as "field" from list-children as l join tree-nodes as r on l."field" = r."id" where r."kind" = "record-field";
let field-children = select l."struct" as "struct", r."child" as "node" from fields as l join "syntax-child" as r on l."field" = r."parent";
let field-name-nodes = select l."struct" as "struct", l."node" as "node" from field-children as l join tree-nodes as r on l."node" = r."id" where r."kind" = "name";
let field-name-tokens = select l."struct" as "struct", r."child" as "token" from field-name-nodes as l join "syntax-child" as r on l."node" = r."parent";
let field-names = select l."struct" as "struct", r."text" as "field" from field-name-tokens as l join tree-tokens as r on l."token" = r."id";
let shapes = group-digest(from=field-names, keys=["struct"], distinct="field", digest="fields", count="width");
let wide = select * from shapes where width >= 3;
let named = select l."struct" as "struct", l."fields" as "fields", r."name" as "name", r."file" as "file", r."span" as "span" from wide as l join compared as r on l."struct" = r."struct";
let packaged = select l."struct" as "struct", l."fields" as "fields", l."name" as "name", l."file" as "file", l."span" as "span", r."package" as "package" from named as l join "file-package" as r on l."file" = r."path";
let copies = group-count(from=packaged, keys=["package", "fields"], distinct="struct", count="copies");
let repeated = select * from copies where copies > 1;
let mirrored = select l."name" as "name", l."file" as "file", l."span" as "span" from packaged as l join repeated as r on l."package" = r."package" and l."fields" = r."fields";
emit mirrored subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{name}` has the same fields as another struct of this crate"
help = "Keep one type for the concept and pass it on: delete this copy and its field-by-field conversion, and use the other struct where this one was used (`tm check --format json` lists both). When the two are different concepts that happen to share field names, rename the fields to say what each holds. A wire shape belongs in the part's `schemas.rs`, where it may mirror the core type."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
pub mod domain;
pub mod outbound;
'''
files.'src/domain.rs' = '''
pub mod applications;
'''
files.'src/domain/applications.rs' = '''
pub mod types;
'''
files.'src/outbound.rs' = '''
pub mod analysis;
'''
files.'src/outbound/analysis.rs' = '''
pub mod types;
'''

[[scenarios]]
id = 'unknown-copied'
scenario = "Tastemaker's lint unknown and the analysis port's unknown: the same three fields in two places of one crate, copied field by field."
given.files.'src/domain/applications/types.rs' = '''
/// One thing a rule of the lint call could not decide.
pub struct LintUnknown {
    /// The rule of the call.
    pub rule: String,
    /// The file, relative to the repository.
    pub path: String,
    /// What is partial and why.
    pub message: String,
}
'''
given.files.'src/outbound/analysis/types.rs' = '''
/// Something a rule could not decide.
pub struct AnalysisUnknown {
    /// The rule.
    pub rule: String,
    /// The file.
    pub path: String,
    /// What is partial and why.
    pub message: String,
}

impl From<AnalysisUnknown> for crate::domain::applications::types::LintUnknown {
    fn from(unknown: AnalysisUnknown) -> Self {
        Self { rule: unknown.rule, path: unknown.path, message: unknown.message }
    }
}
'''
then.findings = [
  { path = 'src/domain/applications/types.rs', line = 2 },
  { path = 'src/outbound/analysis/types.rs', line = 2 },
]

