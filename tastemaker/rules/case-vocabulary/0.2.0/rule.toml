given.files.'src/greeting/errors_test.rs' = '''
use crate::greeting::types::{Greeting, GreetingError};

#[rstest::fixture]
fn refuses_and_fails_to_build() -> Greeting {
    Greeting::default()
}

#[test]
fn refuses_a_name_on_a_network_interface() {
    struct NetworkInterface;
    impl NetworkInterface {
        fn name(&self) -> &'static str {
            ""
        }
    }
    impl Default for NetworkInterface {
        fn default() -> Self {
            Self
        }
    }
    assert_eq!(Greeting::try_from(NetworkInterface::default().name()), Err(GreetingError::Empty));
}
'''
