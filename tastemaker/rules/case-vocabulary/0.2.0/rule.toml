id = 'port-words'
scenario = 'Rejects tests implementing a port or an item, a refuses test with a type merely named Port and one implementing a use case.'
given.files.'src/keys/types_test.rs' = '''
use crate::greet::interface::GreetUseCase;
use crate::keys::interface::KeysPort;
use crate::keys::types::{Keys, KeysError};

#[test]
fn refuses_a_name_on_a_serial_port() {
    struct SerialPort;
    impl SerialPort {
        fn name(&self) -> &'static str {
            ""
        }
    }
    impl Default for SerialPort {
        fn default() -> Self {
            Self
        }
    }
    assert_eq!(Keys::try_from(SerialPort::default().name()), Err(KeysError::Empty));
}

#[test]
fn refuses_with_a_fake_use_case() {
    struct Fake;
    impl GreetUseCase for Fake {
        fn greet(&self, name: &str) -> String {
            name.to_string()
        }
    }
    assert_eq!(Keys::try_from(Fake.greet("").as_str()), Err(KeysError::Empty));
}

#[test]
fn rejects_shuffled_keys() {
    struct Shuffled;
    impl KeysPort for Shuffled {
        fn keys(&self) -> Vec<u8> {
            vec![2, 1]
        }
    }
    assert!(crate::keys::interface_test::check(&Shuffled).is_err());
}

#[test]
fn rejects_a_negative_area() {
    struct Negative;
    impl crate::collections::shapes::interface::ShapesItem for Negative {
        fn area(&self) -> f64 {
            -1.0
        }
    }
    assert!(crate::collections::shapes::interface_test::check(&Negative).is_err());
}
'''

