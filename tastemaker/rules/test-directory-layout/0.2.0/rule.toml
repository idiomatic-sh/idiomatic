description = "Behavioral proof concepts use directory modules and generic role filenames, and are compiled through normal registration: a group's module file is `<group>.rs` beside its directory `<group>/`, its roles `test.rs` and `fixtures.rs`."
why = "A concept belongs in its directory. A group's module file is `<group>.rs` beside its directory `<group>/` (never `<group>/mod.rs`, which `mod_module_files` refuses), and its generic proof roles are `test.rs` and `fixtures.rs`; a `<name>.rs` with no directory of its name beside it is a concept-named file. This applies to every placed program-runtime-proof and every grouped inbound use-case proof; changing a placement alias cannot evade it. A #[path] declaration cannot make a concept-named file a valid role, and an unregistered proof is not evidence."

query = '''
let files = select l."path" as "file" from "filesystem.file" as l where glob_any(l."path", "**/*.rs");
let placed = select l."path" as "file" from "tastemaker.placed" as l where l."template" = "program-runtime-proof";
let groups = select * from files where glob_any(file, "**/src/inbound/use_cases/*/use_case_test/**/*.rs");
let proofs = union(left=placed, right=groups);
let roles = select * from proofs where glob_any(file, "**/{test,fixtures}.rs");
let stems = capture(from=proofs, path="file", pattern="{*dir}/{stem}.rs", captures=["dir", "stem"]);
let beneath = capture(from=files, path="file", pattern="{*dir}/{stem}/{*rest}", captures=["dir", "stem", "rest"]);
let directory-keys = project(from=beneath, columns=["dir", "stem"]);
let modules-rows = select l."file" as "file" from stems as l join directory-keys as r on l."dir" = r."dir" and l."stem" = r."stem";
let modules = project(from=modules-rows, columns=["file"]);
let generic = union(left=roles, right=modules);
let bad-names = antijoin(left=proofs, right=generic, left-on=["file"], right-on=["file"]);
let naming = extend(from=bad-names, values={"problem": "uses a concept name in its filename: a group is a directory `<group>/`, declared by `<group>.rs` beside it, holding `test.rs` and `fixtures.rs`"});
let reached = select l."path" as "file" from "analyzed-source" as l;
let orphans = antijoin(left=generic, right=reached, left-on=["file"], right-on=["file"]);
let registration = extend(from=orphans, values={"problem": "is not reached from a real Cargo target by Rust module declarations"});
let nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l;
let metadata = select l."id" as "id", l."file" as "file" from nodes as l join proofs as r on l."file" = r."file" where l."kind" = "key-value-meta";
let first = select l."file" as "file", r."child" as "id" from metadata as l join "syntax-child" as r on l."id" = r."parent";
let second = select l."file" as "file", r."child" as "id" from first as l join "syntax-child" as r on l."id" = r."parent";
let third = select l."file" as "file", r."child" as "id" from second as l join "syntax-child" as r on l."id" = r."parent";
let fourth = select l."file" as "file", r."child" as "id" from third as l join "syntax-child" as r on l."id" = r."parent";
let path-keys = select l."file" as "file" from fourth as l join nodes as r on l."id" = r."id" where r."text" = "path";
let bypasses = extend(from=path-keys, values={"problem": "uses #[path] instead of the normal concept directory module"});
let names-and-registration = union(left=naming, right=registration);
let findings = union(left=names-and-registration, right=bypasses);
emit findings subject "file" key("file", "problem");
'''

[diagnostic]
primary = "file"
message = "`{file}` {problem}"
help = "Declare the concept with `mod concept;` in a module file `concept.rs` beside the directory `concept/`, which holds its tests in `concept/test.rs` and its assembly support in `concept/fixtures.rs`. Register the actual Cargo test target and normal child modules; never use #[path] to bypass the layout."

[given]
include = ["**"]
files.'Cargo.toml' = '''
[package]
name = "proof-layout"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = "mod inbound;"
files.'src/inbound.rs' = "mod use_cases;"
files.'src/inbound/use_cases.rs' = "mod execute;"
files.'src/inbound/use_cases/execute.rs' = "#[cfg(test)] mod use_case_test;"
files.'src/inbound/use_cases/execute/use_case_test.rs' = "#[cfg(test)] mod axis;"
files.'src/inbound/use_cases/execute/use_case_test/axis.rs' = "#[cfg(test)] mod test;"
files.'src/inbound/use_cases/execute/use_case_test/axis/test.rs' = "#[test] fn exact_rows() { assert_eq!(1, 1); }"

[[scenarios]]
id = "registered-directory-proof"
scenario = "A real Cargo target reaches the generic test role through directory modules."

[[scenarios]]
id = "concept-filename-refused"
scenario = "A concept-named test cannot be admitted as a generic role."
given.files.'src/inbound/use_cases/execute/use_case_test/axis_test.rs' = "#[test] fn exact_rows() {}"
then.findings = [{ path = "src/inbound/use_cases/execute/use_case_test/axis_test.rs" }]

[[scenarios]]
id = "unregistered-proof-refused"
scenario = "A correctly named file must still be reached by a real target."
given.files.'src/inbound/use_cases/execute/use_case_test/axis.rs' = "// Missing mod test;"
then.findings = [{ path = "src/inbound/use_cases/execute/use_case_test/axis/test.rs" }]

[[scenarios]]
id = "path-bypass-refused"
scenario = "A path attribute cannot redirect a proof module to bypass directory registration."
given.files.'src/inbound/use_cases/execute/use_case_test/axis.rs' = '#[cfg(test)] #[path = "axis/test.rs"] mod test;'
then.findings = [{ path = "src/inbound/use_cases/execute/use_case_test/axis.rs" }]

[[scenarios]]
id = "module-file-without-its-directory-refused"
scenario = "A `<name>.rs` in a group with no directory `<name>/` beside it is a concept-named file, not a module file."
given.files.'src/inbound/use_cases/execute/use_case_test.rs' = "#[cfg(test)] mod axis; #[cfg(test)] mod rows;"
given.files.'src/inbound/use_cases/execute/use_case_test/rows.rs' = "#[test] fn exact_rows() {}"
then.findings = [
  { path = 'src/inbound/use_cases/execute/use_case_test/rows.rs' },
]
