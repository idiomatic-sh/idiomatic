pub fn program(input: &mut Input<'_>) -> usize {
    input.0.len()
}

pub fn select(input: &mut Input<'_>) -> usize {
    input.0.len()
}

pub fn window(input: &mut Input<'_>) -> usize {
    input.0.len()
}
'''
then.findings = [{ path = "src/adapter.rs", line = 13 }]

[[scenarios]]
id = "a-row-without-a-parser"
scenario = "A row naming a function the adapter does not have is reported at the row."
given.files.'src/constants.rs' = '''
