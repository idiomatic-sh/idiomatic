description = "An internal package dependency uses a declared package identity regardless of alias, source or dependency kind: the identity is the `package =` a dependency names, and its key when it names none."
why = "A registry or git copy of an engine package is still an engine dependency. package-dependency.package is the actual Cargo package identity, separate from its binding/alias and from its resolved local target. The inventory declares exact internal package names and the subset a capability may use. Every dependency kind and origin is checked, a local path dependency among them: `dom = { package = 'core', path = '../core' }` is the package `core`, and so is `core = { path = '../core' }`, whose key is its identity. The rail holds only where it is placed, so a workspace places it on every member manifest, the command line's included: a manifest without it can take any internal package under any binding. Third-party packages outside that declared inventory are governed by other manifest policies, not guessed from a name prefix. Local manifest identity is checked separately, so an allowed package spelling cannot bless an unrelated path. Incomplete dependency facts remain ordinary TM coverage failures. This rail does not prove version compatibility, semantic cohesion or runtime ownership."
query = '''
param internal-packages: set<string>;
param allowed-packages: set<string>;
let internal = select source, target, package from "package-dependency" where package in $internal-packages;
let allowed = select source, target, package from internal where package in $allowed-packages;
let own_manifest = select source, target, package from internal as l where l.source = l.target;
let permitted = union(left=allowed, right=own_manifest);
let denied = antijoin(left=internal, right=permitted, left-on=["source", "target", "package"], right-on=["source", "target", "package"]);
let documents = select file, span from "syntax-tree" where kind = "toml" and text = "";
let located = select l.source as file, r.span as span, l.package as package from denied as l join documents as r on l.source = r.file;
emit located subject "file" key("file", "package");
'''

[params.internal-packages]
type = "set<string>"
description = "Exact internal package identities declared by the crate inventory; not dependency binding aliases or name patterns."

[params.allowed-packages]
type = "set<string>"
description = "The exact internal package identities this component is permitted to depend on."

[diagnostic]
primary = "span"
message = "internal package `{package}` is not an allowed dependency of this capability"
help = "Depend on the declared semantic contract packages. A renamed binding, registry release, git source, workspace table or target condition does not change the package identity."

[given]
include = ['crates/operators/Cargo.toml']
params = { internal-packages = ['operators', 'core', 'derived', 'language', 'values'], allowed-packages = ['language', 'values'] }
files.'Cargo.toml' = '''
[workspace]
resolver = "3"
members = ["crates/*"]
'''
files.'crates/operators/Cargo.toml' = '''
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
renamed = { package = "values", version = "0.1" }
'''
files.'crates/operators/src/lib.rs' = ''

[[scenarios]]
id = 'allowed-published-semantic-package'
scenario = 'An allowed package identity remains allowed under a renamed registry binding.'

[[scenarios]]
id = "registry-engine-alias"
scenario = "The actual internal package identity rejects registry-engine-alias."
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
innocent = { package = "core", version = "0.1" }
"""
then.findings = [{ path = "crates/operators/Cargo.toml", line = 1 }]

[[scenarios]]
id = "git-engine-alias"
scenario = "The actual internal package identity rejects git-engine-alias."
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
innocent = { package = "core", git = "https://example.invalid/core" }
"""
then.findings = [{ path = "crates/operators/Cargo.toml", line = 1 }]

