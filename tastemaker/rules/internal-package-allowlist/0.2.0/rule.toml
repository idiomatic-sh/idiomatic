[[scenarios]]
id = 'external-package-with-engine-binding'
scenario = 'A binding that resembles an internal crate does not turn a third-party package into it.'
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
core = { package = "serde", version = "1" }
"""

[[scenarios]]
id = 'workspace-registry-engine'
scenario = 'Workspace inheritance retains the forbidden registry package identity.'
given.files.'Cargo.toml' = """
[workspace]
resolver = "3"
members = ["crates/*"]
[workspace.dependencies]
innocent = { package = "core", version = "0.1" }
"""
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
innocent = { workspace = true }
"""
then.findings = [{ path = 'crates/operators/Cargo.toml', line = 1 }]

[[scenarios]]
id = 'same-manifest-fixture-feature'
scenario = 'A self-manifest dev feature adds no dependency on another internal package.'
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[features]
fixtures = []
[dev-dependencies]
operators = { path = ".", features = ["fixtures"] }
"""

[[scenarios]]
id = 'renamed-path-engine'
scenario = "The 324 review's seed: a local path dependency renamed to an innocent binding (`dom = { package = ... }`) is still the internal package it names."
given.files.'crates/core/Cargo.toml' = """
[package]
name = "core"
version = "0.1.0"
edition = "2024"
"""
given.files.'crates/core/src/lib.rs' = ''
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
dom = { package = "core", path = "../core", version = "0.1.0" }
"""
then.findings = [{ path = "crates/operators/Cargo.toml", line = 1 }]

[[scenarios]]
id = 'key-names-the-engine'
scenario = 'A dependency that names no `package =` is the package its key names: a local path dependency keyed by an internal package is refused.'
given.files.'crates/core/Cargo.toml' = """
[package]
name = "core"
version = "0.1.0"
edition = "2024"
"""
given.files.'crates/core/src/lib.rs' = ''
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
core = { path = "../core" }
"""
then.findings = [{ path = "crates/operators/Cargo.toml", line = 1 }]
