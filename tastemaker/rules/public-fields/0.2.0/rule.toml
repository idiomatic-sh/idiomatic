description = "Every field of a `struct` declared in a `types.rs` is `pub`, unless its doc holds a `compile_fail` example that proves the privacy."
why = "A type is its data: the plain types of a part are read by the code beside them and by the parts that import them, so each field is public and no constructor or accessor stands between a caller and the data. A private or restricted field (`pub(crate)`, `pub(super)`) makes the type something other than plain data. A type whose privacy is the contract (a capability that only its crate may make, an opaque handle) says so in a `compile_fail` doctest of its doc, which rustdoc fails the build on when the field becomes reachable: that struct is not read. Enum variant fields are public by the language and are not read."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let fields = select * from tree-nodes where glob_any(kind, "{record-field,tuple-field}");
let visibilities = select * from tree-nodes where kind = "visibility";
let restrictions = select * from tree-nodes where kind = "visibility-inner";
let restricted = select l."parent" as "id" from "syntax-child" as l join restrictions as r on l."child" = r."id";
let public = antijoin(left=visibilities, right=restricted, left-on=["id"], right-on=["id"]);
let public-owners = select l."parent" as "id" from "syntax-child" as l join public as r on l."child" = r."id";
let not-public = antijoin(left=fields, right=public-owners, left-on=["id"], right-on=["id"]);
let listed = select l."id" as "id", l."file" as "file", l."span" as "span", r."parent" as "list" from not-public as l join "syntax-child" as r on l."id" = r."child";
let structs = select * from tree-nodes where kind = "struct";
let struct-lists = select l."id" as "struct", r."child" as "list" from structs as l join "syntax-child" as r on l."id" = r."parent";
let doc-proofs = select l."id" as "id", l."text" as "text" from "comment" as l where glob_any(l."text", "*compile_fail*");
let proof-parents = select r."parent" as "id" from doc-proofs as l join "syntax-child" as r on l."id" = r."child";
let proven = select l."id" as "struct" from structs as l join proof-parents as r on l."id" = r."id";
let private-lists = select l."file" as "file", l."span" as "span", r."struct" as "struct" from listed as l join struct-lists as r on l."list" = r."list";
let unproven = antijoin(left=private-lists, right=proven, left-on=["struct"], right-on=["struct"]);
let private-fields = project(from=unproven, columns=["file", "span"]);
emit private-fields subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this field of a plain type is not `pub`"
help = "Make the field `pub`: a part's type is plain data. Where a value needs a rule, put the rule in the part's service or in a schemas.rs conversion, not in a private field. Where the privacy is the type's contract, prove it in a `compile_fail` doctest of the struct's doc."

[given]
include = ['**/types.rs']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/greeting.rs' = '''
pub mod types;
'''
files.'src/lib.rs' = '''
pub mod greeting;
'''

[[scenarios]]
id = 'public-fields'
scenario = 'Public fields, a public tuple struct and an enum with variant fields.'
given.files.'src/greeting/types.rs' = '''
pub struct Request {
    pub input: String,
}

pub struct Pair(pub u8, pub u8);

pub enum Shape {
    Named { text: String },
    Plain(u8),
}
'''

[[scenarios]]
id = 'private-field'
scenario = 'A private field: it is reported.'
given.files.'src/greeting/types.rs' = '''
pub struct Request {
    input: String,
}
'''
then.findings = [
  { path = 'src/greeting/types.rs', line = 2 },
]

[[scenarios]]
id = 'restricted-field'
scenario = 'A restricted field: it is reported.'
given.files.'src/greeting/types.rs' = '''
pub struct Request {
    pub(crate) input: String,
}
'''
then.findings = [
  { path = 'src/greeting/types.rs', line = 2 },
]

[[scenarios]]
id = 'private-tuple-field'
scenario = 'A private field of a tuple struct.'
given.files.'src/greeting/types.rs' = '''
pub struct Pair(pub u8, u8);
'''
then.findings = [
  { path = 'src/greeting/types.rs', line = 1 },
]

[[scenarios]]
id = 'private-field-proved-by-compile-fail'
scenario = 'A capability whose private field a compile_fail doctest of its doc depends on: it is not reported, while the private field of a type without that proof still is.'
given.files.'src/greeting/types.rs' = '''
/// Authority to greet, made only in this crate.
///
/// ```compile_fail
/// let forged = fixture::greeting::types::Permit(());
/// ```
pub struct Permit(pub(super) ());

pub struct Request {
    input: String,
}
'''
then.findings = [
  { path = 'src/greeting/types.rs', line = 9 },
]
