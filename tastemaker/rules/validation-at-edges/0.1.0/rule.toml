[[scenarios]]
id = 'resource-open'
scenario = 'An adapter resource opener can fail without domain validation.'
given.include = ['**']
given.files.'src/outbound/cache/adapters/arrow/connection.rs' = '''
pub struct CacheConnection; impl CacheConnection { pub fn open() -> Result<Self, ()> { Ok(Self) } }
'''

[[scenarios]]
id = 'resource-validation'
scenario = 'Connection modules do not hide domain validation.'
given.include = ['**']
given.files.'src/outbound/cache/adapters/arrow/connection.rs' = '''
pub struct CacheConnection; impl TryFrom<String> for CacheConnection { type Error=(); fn try_from(_:String)->Result<Self,Self::Error>{Ok(Self)} }
'''
then.findings = [
  { path = 'src/outbound/cache/adapters/arrow/connection.rs', line = 1 },
]

[[scenarios]]
id = 'resource-other-type'
scenario = 'Other types in a connection module still validate at schemas.'
given.include = ['**']
given.files.'src/outbound/cache/adapters/arrow/connection.rs' = '''
pub struct Key; impl Key { pub fn new() -> Result<Self, ()> { Ok(Self) } }
'''
then.findings = [
  { path = 'src/outbound/cache/adapters/arrow/connection.rs', line = 1 },
]
