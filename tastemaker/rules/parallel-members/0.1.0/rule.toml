description = "Three or more child directories of one parent share their names with three or more child directories of another parent in the same product: one concept split by role across parents, reported at each shared child's module file with the other parent's copy."
why = "Colocation is by domain, not by primitive: a concept is one directory holding every role of it, so the same set of names under two parents (the same ten query operators under a planner, two evaluators and a conformance check) is one set of concepts split by role, and every change to one of them is made in each copy. A child directory counts when it holds a file and has its module file `<parent>/<name>.rs` beside it; what is not a Rust module tree is not read. Names in `roles` are the structural directories every tree repeats by design and never count: `adapters`, `methods`, `commands`, `macros`, `tests`, `benches`, `fixtures` and `src`, and the nu-hex layer directories every hex repeats, `domain`, `inbound`, `outbound`, `application`, `use_cases`, `contracts` and `collections`. Trees a spec places as mirrors of another tree are left out by the entry's `exclude`, not by the rule: the CLI's resource and verb directories (`**/src/commands/**` and `**/src/resources/**`, resource then verb, mirroring the service hexes the CLI layer calls), the test trees that mirror what they test (`**/tests/**`) and the bench trees that mirror the commands (`**/benches/**`, outside `src` because Cargo requires it). Parents that mirror each other because they are independent instances of one contract, such as the language providers implementing the same ports and the shared relation shapes they fill, lie under a directory named in `independent`: a pair whose two copies both do is not a finding."

query = '''
param roles: set<string>;
param independent: set<string>;
let modules = capture(from="filesystem.file", path="path", pattern="{*parent}/{name}.rs", captures=["parent", "name"]);
let directories = capture(from="filesystem.file", path="path", pattern="{*parent}/{name}/{file}", captures=["parent", "name", "file"]);
let directory-names = project(from=directories, columns=["parent", "name"]);
let nested-members = select l."name" as "name", l."parent" as "parent", l."path" as "path" from modules as l join directory-names as r on l."parent" = r."parent" and l."name" = r."name";
let root-modules = capture(from="filesystem.file", path="path", pattern="{name}.rs", captures=["name"]);
let root-directories = capture(from="filesystem.file", path="path", pattern="{name}/{file}", captures=["name", "file"]);
let root-directory-names = project(from=root-directories, columns=["name"]);
let root-names = select l."name" as "name", l."path" as "path" from root-modules as l join root-directory-names as r on l."name" = r."name";
let root-members = extend(from=root-names, values={"parent": ""});
let members = union(left=nested-members, right=root-members);
let named-members = select * from members where name not in $roles;
let pairs = select r."parent" as "counterpart", l."name" as "name", r."path" as "other", l."parent" as "parent", l."path" as "path" from named-members as l join named-members as r on l."name" = r."name";
let distinct-pairs = select * from pairs where parent != counterpart;
let inner-directories = capture(from=named-members, path="path", pattern="{*above}/{directory}/{*below}", captures=["above", "directory", "below"]);
let inner-independent = select * from inner-directories where directory in $independent;
let inner-dependent = antijoin(left=named-members, right=inner-independent, left-on=["path"], right-on=["path"]);
let first-directories = capture(from=inner-dependent, path="path", pattern="{directory}/{*below}", captures=["directory", "below"]);
let first-independent = select * from first-directories where directory in $independent;
let dependent = antijoin(left=inner-dependent, right=first-independent, left-on=["path"], right-on=["path"]);
let left-dependent = select l."counterpart" as "counterpart", l."name" as "name", l."other" as "other", l."parent" as "parent", l."path" as "path" from distinct-pairs as l join dependent as r on l."path" = r."path";
let right-dependent = select l."counterpart" as "counterpart", l."name" as "name", l."other" as "other", l."parent" as "parent", l."path" as "path" from distinct-pairs as l join dependent as r on l."other" = r."path";
let dependent-pairs = union(left=left-dependent, right=right-dependent);
let shared-names = group-count(from=dependent-pairs, keys=["parent", "counterpart"], count="shared", distinct="name");
let split-parents = select * from shared-names where shared >= 3;
let split-members = select l."name" as "name", l."other" as "other", l."path" as "path" from dependent-pairs as l join split-parents as r on l."parent" = r."parent" and l."counterpart" = r."counterpart";
emit split-members subject "path" key("path", "other");
'''

[params.roles]
type = "set<string>"
description = "Directory names that are structural roles every tree repeats by design, never a member (the idiomatic-rust spec sets adapters, methods, commands, macros, tests, benches, fixtures and src, and the nu-hex layer directories domain, inbound, outbound, application, use_cases, contracts and collections)."

[params.independent]
type = "set<string>"
description = "Names of directories that hold independent instances of one contract, which mirror each other by design, such as `languages` (the language providers) and `relations` (the shared relation shapes they fill); a pair whose two copies both lie under one of them is not a finding."

[diagnostic]
primary = "path"
message = "directory `{name}` is repeated at `{other}`, and the two parents share three or more child directory names: one concept split by role across parents"
help = "Colocate by domain: for each shared name, make one directory that holds every role of that concept (each parent's file for it side by side), move the copies' files into it, and delete the copies. If the two trees are independent implementations of one contract by design (such as language providers), name their common parent in the rule entry's `independent` param instead of moving them."

