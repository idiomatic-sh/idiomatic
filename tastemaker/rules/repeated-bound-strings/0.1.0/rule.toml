description = "A string literal bound to a variable (`let name = \"..\";`) with the same text in `min-files` or more files is reported at each binding."
why = "The same text bound under a name in many files is one constant written many times: a change to it is a change in each file, and a typo in one copy goes unseen. It belongs in one `const` its users import. Read from the assignments the Rust provider represents: a binding initialised directly by a string literal; the text compared is the decoded value. Not seen: a literal passed straight to a call or held in a struct field, and a file whose assignments the provider cannot all represent, which is reported as undecided."

query = '''
param min-files: integer;
let bound-strings = select l."file" as "file", l."span" as "span", r."value" as "text" from "assigns" as l join "string-literal" as r on l."file" = r."file" and l."span" = r."span";
let texts = select * from bound-strings where text != "";
let files-per-text = group-count(from=texts, keys=["text"], count="files", distinct="file");
let repeated = select * from files-per-text where files >= $min-files;
let repeated-bindings = select r."files" as "files", l."file" as "file", l."span" as "span", l."text" as "text" from texts as l join repeated as r on l."text" = r."text";
emit repeated-bindings subject "file" key("span");
'''

[params.min-files]
type = "integer"
description = "The fewest files binding the same text before each binding is reported."

[diagnostic]
primary = "span"
message = "`\"{text}\"` is bound in {files} files"
help = "Declare it once as a `const` and import it where it is used."

[given]
include = ['**']
params = { min-files = 2 }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/a.rs' = '''
pub fn a() -> usize {
    let key = "retry-limit";
    key.len()
}
'''
files.'src/lib.rs' = '''
mod a;
mod b;
'''

[[scenarios]]
id = 'two-files-bind-same-text'
scenario = 'Two files bind the same text.'
given.files.'src/b.rs' = '''
pub fn b() -> usize {
    let name = "retry-limit";
    name.len()
}
'''
then.findings = [
  { path = 'src/a.rs', line = 2 },
  { path = 'src/b.rs', line = 2 },
]

[[scenarios]]
id = 'two-files-bind-different-texts'
scenario = 'Two files bind different texts.'
given.files.'src/b.rs' = '''
pub fn b() -> usize {
    let name = "timeout";
    name.len()
}
'''
