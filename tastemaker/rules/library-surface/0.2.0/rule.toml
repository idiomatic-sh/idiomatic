given.include = ['src/**']
given.params = { library = ['ryo_store', 'ryo_store::*'], surface = [] }
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
//! A crate that reaches an internal library under an alias.

pub mod engine;
'''
given.files.'src/engine.rs' = '''
//! The engine's types.

extern crate ryo_store as st;
use st::application::file_dag::service::open_program_owner as _SeedG;
'''
then.findings = [
  { path = 'src/engine.rs', line = 3 },
]

