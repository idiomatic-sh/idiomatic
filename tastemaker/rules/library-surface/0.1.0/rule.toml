description = "A library is named only by the paths of its surface: a path of a crate `library` matches that `surface` does not list is a finding."
why = "A product built on another product's SDK promises to call a few functions of it and no more (tastemaker calls `ryo::query::validate` and `ryo::linter::lint`, with their requests, reports and errors). Confining the library to the adapters says where it is named, not what: a new path of the SDK named in the adapter would pass. The entry lists the library's crate in `library` and every path it may name in `surface`, so a path outside the surface is a finding wherever it is written. Found from the paths the files write in imports and in code: the provider's `static-import` and `reference` relations. Not seen: a path inside an attribute or a macro invocation, and a method called on a value (it writes no path)."

query = '''
param library: set<string>;
param surface: set<string>;
let imports = project(from="static-import", columns=["file", "span", "target"]);
let references = project(from="reference", columns=["file", "span", "target"]);
let mentions = union(left=imports, right=references);
let named = select * from mentions where glob_any(target, $library);
let outside = select * from named where not glob_any(target, $surface);
emit outside subject "file" key("span");
'''

[params.library]
type = "set<string>"
description = "The library's crate, as path globs written in code: `ryo`, `ryo::*`."

[params.surface]
type = "set<string>"
description = "The paths of the library the product may name, each a path glob as written in code, with its items: `ryo::linter::lint`, `ryo::linter::lint::*`."

[diagnostic]
primary = "span"
message = "`{target}` is not on the surface this product uses of its library"
help = "Reach the library through the paths its surface lists. A path the product needs that the surface lacks is a change of what it promises to use: add it to the entry's `surface` and say why in its description."

[[scenarios]]
id = 'off-the-surface'
scenario = 'A file names a path of the library its surface does not list.'
given.include = ['src/**']
given.params = { library = ['ryo', 'ryo::*'], surface = ['ryo::linter::lint', 'ryo::linter::lint::*', 'ryo::linter::LintRequest', 'ryo::linter::LintRequest::*'] }
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
//! A crate that reaches past the surface of its library.

use ryo::linter::LintRequest;
use ryo::operator::Operator;

pub fn run(_request: LintRequest, _operator: Operator) {}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'on-the-surface'
scenario = 'A file names only paths of the surface, and a crate named like the library as a prefix.'
given.include = ['src/**']
given.params = { library = ['ryo', 'ryo::*'], surface = ['ryo::linter::lint', 'ryo::linter::lint::*', 'ryo::linter::LintRequest', 'ryo::linter::LintRequest::*'] }
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
//! A crate that names only the surface of its library, and another crate whose name starts like it.

use ryo::linter::LintRequest;
use ryo_core::Engine;

pub fn run(request: LintRequest, _engine: Engine) {
    ryo::linter::lint(request);
}
'''
