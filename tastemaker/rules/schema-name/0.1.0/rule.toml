given.files.'src/names/adapters/memory/schemas.rs' = '''
//! The shape of the data the memory store returns, and its checked conversion into the core's types.

use greeting_core::outbound::names::types::Name;

#[cfg(test)]
#[path = "schemas_test.rs"]
mod tests;

/// One name as the store writes it.
pub(super) struct NameSchema {
    pub(super) text: String,
}

/// Why a stored name was refused.
pub(super) enum NameSchemaError {
    Empty,
}

impl TryFrom<NameSchema> for Name {
    type Error = NameSchemaError;

    fn try_from(schema: NameSchema) -> Result<Self, Self::Error> {
        if schema.text.is_empty() {
            return Err(NameSchemaError::Empty);
        }
        Ok(Name(schema.text))
    }
}
'''

