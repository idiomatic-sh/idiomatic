description = "No function encloses more than `max-nested` functions, counting every level of nesting."
why = "A function that declares many functions inside itself, at any depth, is a module in disguise: its helpers cannot be tested, reused or read apart from it. The count is the transitive closure of the provider's lexical scope containment between functions (`fn` items in `fn` bodies, closures excluded). Not seen: closures, and functions inside a macro invocation's tokens."

query = '''
param max-nested: integer;
let nesting = closure(edges="scope", source="parent", destination="child");
let counts = group-count(from=nesting, keys=["parent"], count="nested", distinct="child");
let crowded = select * from counts where nested > $max-nested;
let located = select r."name" as "name", l."nested" as "nested", r."file" as "file", r."span" as "span" from crowded as l join "function" as r on l."parent" = r."id";
emit located subject "file" key("span");
'''

[params.max-nested]
type = "integer"
description = "The most functions one function may enclose, at any depth."

[diagnostic]
primary = "span"
message = "`{name}` encloses {nested} functions"
help = "Move the nested functions out to a module of their own, next to the function that uses them."

[given]
include = ['**']
params = { max-nested = 2 }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'function-encloses-three-functions-two-depths-over'
scenario = 'A function encloses three functions at two depths over a limit of two.'
given.files.'src/lib.rs' = '''
pub fn outer() {
    fn first() {
        fn deeper() {}
        deeper();
    }
    fn second() {}
    first();
    second();
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 1 },
]

[[scenarios]]
id = 'function-encloses-two-functions'
scenario = 'A function encloses two functions.'
given.files.'src/lib.rs' = '''
pub fn outer() {
    fn first() {}
    fn second() {}
    first();
    second();
}
'''
