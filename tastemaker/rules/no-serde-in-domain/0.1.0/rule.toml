[[scenarios]]
id = "governed-external-adapter-roles"
scenario = "Only explicitly placed adapter roles gain boundary access; unplaced lookalikes and other roles remain rejected."
given.include = ["**"]
given.exclude = []
given.files.'edge/schemas.rs' = 'use serde::Deserialize;'
given.files.'edge/settings.rs' = 'use serde::Deserialize;'
given.files.'domain/schemas.rs' = 'use serde::Deserialize;'
given.files.'tastemaker.toml' = '''
workspace = { name = "fixture", dependencies = [{ package = "idiomatic.arch", path = "../../.." }] }
rules = [{ rule = "idiomatic.arch/no-serde-in-domain", include = ["**"] }]
specs = [{ spec = "idiomatic.arch/adapter", include = ["edge"], params = { core = "foreign_core", port = "names" } }]
'''
then.only = ['idiomatic.arch/no-serde-in-domain', 'idiomatic.arch/no-serde-in-domain#unknown']
then.findings = [
  { path = 'edge/settings.rs', line = 1 },
  { path = 'domain/schemas.rs', line = 1 },
]
