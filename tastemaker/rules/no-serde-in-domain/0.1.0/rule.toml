description = "Serde is used only at the edges that encode: an outbound adapter's private schemas, a command's schemas, the command line's own `output/schemas.rs`, and the types the SDK publishes. No other type derives `Serialize` or `Deserialize`, and no other file imports or calls serde."
why = "A serde derive on a domain, application, use-case or port type ties the core's types to a file format: the encoding decides their shape, every change to them is a format change, and the format's needs (an owned copy, a field kept only to be written) leak inward. Each edge that encodes keeps private structs of its own and converts the canonical types to and from them: an outbound adapter in `outbound/<port>/adapters/<format>/schemas.rs` (or a `schemas/` collection beside it), a command in `cli/src/resources/**/schemas.rs`, the command line's one `output` module in `cli/src/output/schemas.rs` (the shapes of its machine-readable answers), and the SDK in its published `crates/sdk/src/resources/**/types.rs` and `schemas.rs`. Read as written: a `derive` whose arguments name `Serialize` or `Deserialize`, an import of `serde` or of a `serde_` crate, and a call of a path in one, in any file but those."

query = '''
let derive-rows = select l."file" as "file", l."span" as "span", l."arguments" as "what" from "decorates" as l where l."target" = "derive";
let derives = select * from derive-rows where glob_any(what, "{*Serialize*,*Deserialize*}");
let imports = select l."file" as "file", l."span" as "span", l."target" as "what" from "static-import" as l where glob_any(l."target", "{serde,serde::*,serde_*}");
let calls = select l."file" as "file", l."span" as "span", l."target" as "what" from "static-call" as l where glob_any(l."target", "{serde::*,serde_*::*}");
let written = union(left=derives, right=imports);
let used = union(left=written, right=calls);
let inward = select * from used where not glob_any(file, "{**/outbound/*/adapters/*/schemas.rs,**/outbound/*/adapters/*/schemas/**,**/cli/src/resources/**/schemas.rs,**/cli/src/output/schemas.rs,**/crates/sdk/src/resources/**/types.rs,**/crates/sdk/src/resources/**/schemas.rs}");
let governed-roles = select l."path" as "file" from "tastemaker.placed" as l where l."package" = "idiomatic.arch" and l."spec" = "adapter" and glob_any(l."template", "{schemas}");
let outside = antijoin(left=inward, right=governed-roles, left-on=["file"], right-on=["file"]);
emit outside subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "serde is used outside an edge that encodes: `{what}`"
help = "Drop it here. Give the edge that encodes the value private structs of its own (`outbound/<port>/adapters/<format>/schemas.rs`, a command's `schemas.rs`, a command line's `output/schemas.rs`, or a type the SDK publishes under `crates/sdk/src/resources/`) and convert the canonical type to and from them there. An ignore is never the fix."

[given]
include = ['**']

[[scenarios]]
id = 'a-store-type-derives-serde'
scenario = 'A port type and a domain type that derive serde`s traits for the store, as Tastemaker`s image and file stamps did, are reported, and so is each name the import brings in.'
given.files.'src/outbound/store/types.rs' = '''
//! The types of the `store` port.

use serde::{Deserialize, Serialize};

/// What a project keeps between runs.
#[derive(Clone, Debug, Default, PartialEq, Eq, Serialize, Deserialize)]
pub struct Image {
    /// The build that wrote it.
    pub build: BuildName,
}
'''
given.files.'src/domain/files/types.rs' = '''
//! The types of the `files` concept.

/// A file's size and modification time.
#[derive(Clone, Copy, Debug, PartialEq, Eq, serde::Serialize, serde::Deserialize)]
pub struct Stamp {
    /// Its size.
    pub size: Size,
}
'''
then.findings = [
  { path = 'src/outbound/store/types.rs', line = 3 },
  { path = 'src/outbound/store/types.rs', line = 3 },
  { path = 'src/outbound/store/types.rs', line = 6 },
  { path = 'src/domain/files/types.rs', line = 4 },
]

[[scenarios]]
id = 'a-use-case-calls-serde-json'
