description = "No port method takes or returns an `Image`: a store port speaks the core's own types, one table at a time."
why = "An `Image` is the whole of what a store keeps in one value: every run's files, findings and plans nested together. A port that loads and saves it rewrites everything when one row changes, hands the use case data it must take apart, and ties the core to one encoding of the whole. A store port reads and writes the core's own rows (files, findings, definitions) and keeps them as flat tables in its adapter; it may hand its product's flat tables over together (`load() -> Tables`, `replace(Tables)`) when every run replaces them all through a temporary file renamed over the store. Read as written: a type named `Image`, or ending `Image`, in a parameter or the result of a function of a port's `interface.rs` under `outbound/`. Not seen: a whole-state type under another name, or a write that replaces some of the tables and keeps the rest."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let images = select * from tree-tokens where kind = "ident" and glob_any(text, "{Image,*Image}") and glob_any(file, "**/outbound/*/interface.rs");
let image-refs = select l."id" as "token", l."file" as "file", l."span" as "span", l."text" as "text", r."parent" as "id" from images as l join "syntax-child" as r on l."id" = r."child";
let signatures = select * from tree-nodes where glob_any(kind, "{param-list,ret-type}");
let signature-holders = project(from=signatures, columns=["id"]);
let in-signatures = axis(from=image-refs, relation="syntax-child", direction=ancestor, domain=signature-holders);
let crossing = project(from=in-signatures, columns=["token", "file", "span", "text"]);
emit crossing subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{text}` crosses a port whole"
help = "Speak the core's own rows: methods over the core's own types, one per table the use case reads or writes (`files() -> Vec<FileDigest>`, `keep_findings(&[Finding])`), or the product's flat tables together (`load() -> Tables`, `replace(Tables)`) when every run replaces them all. Keep the encoding of each table in the adapter. Load what a run needs; write once, on success."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
pub mod outbound;
'''
files.'src/outbound.rs' = '''
pub mod store;
'''
files.'src/outbound/store.rs' = '''
pub mod interface;
pub mod types;
'''

[[scenarios]]
id = 'cache-image'
scenario = "Asymptote's cache port at 5149cd075d: it loads and saves the whole `Image`."
given.files.'src/outbound/store/types.rs' = '''
/// The build the cache was written by.
pub struct Build(pub Box<str>);

/// Everything the cache keeps.
pub struct Image {
    /// The report of the last run.
    pub report: Vec<String>,
}
'''
given.files.'src/outbound/store/interface.rs' = '''
use super::types::{Build, Image};

/// What a run kept.
pub trait CachePort {
    /// What the last run of this build kept, or an empty image.
    fn load(&self, build: &Build) -> Image;

    /// Keeps what this run found.
    fn save(&self, build: &Build, image: &Image);
}
'''
then.findings = [
  { path = 'src/outbound/store/interface.rs', line = 6 },
  { path = 'src/outbound/store/interface.rs', line = 9 },
]

[[scenarios]]
id = 'rows-of-the-core'
scenario = 'A store port over the core types, one method per table, keeping once on success.'
given.files.'src/outbound/store/types.rs' = '''
/// A file of the repository and the digest of its contents.
pub struct FileDigest {
    /// The file.
    pub path: Box<str>,
    /// The digest of its contents.
    pub digest: [u8; 32],
}

/// A finding of a check.
pub struct Finding {
    /// The rule.
    pub rule: Box<str>,
    /// The file.
    pub path: Box<str>,
}
'''
given.files.'src/outbound/store/interface.rs' = '''
use super::types::{FileDigest, Finding};

/// What the last successful check kept.
pub trait CheckStorePort {
    /// The files the last check read, empty when nothing was kept.
    fn files(&self) -> Vec<FileDigest>;

    /// The findings the last check reported, empty when nothing was kept.
    fn findings(&self) -> Vec<Finding>;

    /// Keeps this check's files and findings, written once when the check succeeds.
    fn keep_check(&self, files: &[FileDigest], findings: &[Finding]);
}
'''

[[scenarios]]
id = 'flat-tables-replaced-whole'
scenario = "A store port that hands over the product's flat tables together: every run loads them and replaces them all, once, on success."
given.files.'src/outbound/store/types.rs' = '''
/// A file of the repository and the digest of its contents.
pub struct FileRow {
    /// The file.
    pub path: Box<str>,
    /// The digest of its contents.
    pub digest: [u8; 32],
}

/// A finding of a check.
pub struct FindingRow {
    /// The rule.
    pub rule: Box<str>,
    /// The file.
    pub path: Box<str>,
}

/// The product's flat tables, one list of rows per table.
pub struct Tables {
    /// The `files` table.
    pub files: Vec<FileRow>,
    /// The `findings` table.
    pub findings: Vec<FindingRow>,
}
'''
given.files.'src/outbound/store/interface.rs' = '''
use super::types::Tables;

/// What the last successful check kept.
pub trait CheckStorePort {
    /// The tables the last check kept, empty when nothing was kept.
    fn load(&self) -> Tables;

    /// Replaces every table with this check's, written once when the check succeeds.
    fn replace(&self, tables: Tables);
}
'''

[[scenarios]]
id = 'nested-image-replaced'
scenario = "A store port that loads and replaces a nested whole-state `StoreImage`, not the product's flat tables."
given.files.'src/outbound/store/types.rs' = '''
/// The plan of one tool.
pub struct Plan {
    /// The files the tool reads.
    pub inputs: Vec<Box<str>>,
}

/// Everything the store keeps, nested.
pub struct StoreImage {
    /// The report of the last run.
    pub report: Vec<String>,
    /// The plans of the last run, each holding its inputs.
    pub plans: Vec<Plan>,
}
'''
given.files.'src/outbound/store/interface.rs' = '''
use super::types::StoreImage;

/// What a run kept.
pub trait CheckStorePort {
    /// What the last run kept, or an empty image.
    fn load(&self) -> StoreImage;

    /// Replaces what the store kept with this run's image.
    fn replace(&self, image: StoreImage);
}
'''
then.findings = [
  { path = 'src/outbound/store/interface.rs', line = 6 },
  { path = 'src/outbound/store/interface.rs', line = 9 },
]
