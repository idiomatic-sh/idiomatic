description = "A case expects a value or an error variant, never just any success or any error: `is_ok`, `is_err` and an `Ok(_)` or `Err(_)` pattern in a `*_test.rs` are findings."
why = "A row's expectation names what the case shows: the value it returns or the error variant it refuses with, so a test that only checks that something succeeded or failed passes for a part that does nothing. Read as written: an identifier `is_ok` or `is_err`, also inside a macro's arguments, and a tuple-struct pattern `Ok(_)` or `Err(_)`, in the files the entry selects. A guard in an if condition is accepted when the same receiver is propagated with ? in a later statement of the same block; that guard selects side-effect assertions before the case runner checks the typed result. Not seen: a wildcard written inside a macro's arguments."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let tokens = select * from tree-tokens where kind = "ident";
let verdicts = select * from tokens where glob_any(text, "{is_ok,is_err}");
let ifs = select * from tree-nodes where kind = "if-expr";
let condition-edges = select * from "syntax-child" where field = "condition";
let conditions = select r."child" as "id" from ifs as l join condition-edges as r on l."id" = r."parent";
let condition-descendants = axis(from=conditions, relation="syntax-child", direction=descendant, domain=tree-nodes);
let condition-ids = project(from=condition-descendants, columns=["related"]);
let condition-roots = select id as related from conditions;
let condition-parts = union(left=condition-ids, right=condition-roots);
let calls = select * from tree-nodes where kind = "method-call-expr";
let guarded-calls = select l."id" as "id" from calls as l join condition-parts as r on l."id" = r."related";
let call-parts = axis(from=guarded-calls, relation="syntax-child", direction=descendant, domain=tree-nodes);
let call-words = select l."id" as "call", r."child" as "token" from call-parts as l join "syntax-child" as r on l."related" = r."parent";
let guarded-verdicts = select l."call" as "call", r."id" as "token", r."file" as "file", r."span" as "span", r."text" as "text" from call-words as l join verdicts as r on l."token" = r."id";
let receiver-edges = select * from "syntax-child" where field = "receiver";
let path-expressions = select * from tree-nodes where kind = "path-expr";
let call-receivers = select l."id" as "call", r."child" as "id" from guarded-calls as l join receiver-edges as r on l."id" = r."parent";
let receivers = select l."call" as "call", l."id" as "id" from call-receivers as l join path-expressions as r on l."id" = r."id";
let receiver-parts = axis(from=receivers, relation="syntax-child", direction=descendant, domain=tree-nodes);
let receiver-words = select l."call" as "call", r."child" as "token" from receiver-parts as l join "syntax-child" as r on l."related" = r."parent";
let receiver-names = select l."call" as "call", r."text" as "receiver" from receiver-words as l join tokens as r on l."token" = r."id";
let tries = select * from tree-nodes where kind = "try-expr";
let try-children = select l."id" as "try", r."child" as "id" from tries as l join "syntax-child" as r on l."id" = r."parent";
let try-paths = select l."try" as "try", l."id" as "id" from try-children as l join path-expressions as r on l."id" = r."id";
let try-parts = axis(from=try-paths, relation="syntax-child", direction=descendant, domain=tree-nodes);
let try-words = select l."try" as "try", r."child" as "token" from try-parts as l join "syntax-child" as r on l."related" = r."parent";
let propagated = select l."try" as "try", r."text" as "receiver" from try-words as l join tokens as r on l."token" = r."id";
let blocks = select * from tree-nodes where kind = "stmt-list";
let statements = select l."id" as "block", r."child" as "id", r."ordinal" as "position" from blocks as l join "syntax-child" as r on l."id" = r."parent";
let statement-parts = axis(from=statements, relation="syntax-child", direction=descendant, domain=tree-nodes);
let guarded-statements = select l."call" as "call", l."receiver" as "receiver", r."block" as "block", r."position" as "guard-position" from receiver-names as l join statement-parts as r on l."call" = r."related";
let propagated-statements = select l."receiver" as "receiver", r."block" as "block", r."position" as "try-position" from propagated as l join statement-parts as r on l."try" = r."related";
let guard-pairs = select l."call" as "call", l."guard-position" as "guard-position", r."try-position" as "try-position" from guarded-statements as l join propagated-statements as r on l."block" = r."block" and l."receiver" = r."receiver";
let later-propagations = select * from guard-pairs where try-position > guard-position;
let guarded-rows = select l."file" as "file", l."span" as "span", l."text" as "text" from guarded-verdicts as l join later-propagations as r on l."call" = r."call";
let all-verdict-rows = project(from=verdicts, columns=["file", "span", "text"]);
let verdict-rows = difference(left=all-verdict-rows, right=guarded-rows);
let verdict-findings = extend(from=verdict-rows, values={"problem": "asks only whether the result is Ok or Err"});
let patterns = select * from tree-nodes where kind = "tuple-struct-pat";
let pattern-edges = select l."id" as "pattern", l."file" as "file", l."span" as "span", r."child" as "node" from patterns as l join "syntax-child" as r on l."id" = r."parent";
let wildcards = select * from tree-nodes where kind = "wildcard-pat";
let wildcard-patterns = select l."pattern" as "pattern", l."file" as "file", l."span" as "span" from pattern-edges as l join wildcards as r on l."node" = r."id";
let pattern-paths-all = select * from tree-nodes where kind = "path";
let pattern-paths = select l."pattern" as "pattern", l."file" as "file", l."span" as "span", l."node" as "path-node" from pattern-edges as l join pattern-paths-all as r on l."node" = r."id";
let path-edges = select l."pattern" as "pattern", l."file" as "file", l."span" as "span", r."child" as "node" from pattern-paths as l join "syntax-child" as r on l."path-node" = r."parent";
let segments = select * from tree-nodes where kind = "path-segment";
let pattern-segments = select l."pattern" as "pattern", l."file" as "file", l."span" as "span", l."node" as "segment" from path-edges as l join segments as r on l."node" = r."id";
let segment-edges = select l."pattern" as "pattern", l."file" as "file", l."span" as "span", r."child" as "node" from pattern-segments as l join "syntax-child" as r on l."segment" = r."parent";
let name-refs = select * from tree-nodes where kind = "name-ref";
let segment-refs = select l."pattern" as "pattern", l."file" as "file", l."span" as "span", l."node" as "ref" from segment-edges as l join name-refs as r on l."node" = r."id";
let ref-edges = select l."pattern" as "pattern", l."file" as "file", l."span" as "span", r."child" as "token" from segment-refs as l join "syntax-child" as r on l."ref" = r."parent";
let ref-texts = select l."pattern" as "pattern", l."file" as "file", l."span" as "span", r."text" as "text" from ref-edges as l join tree-tokens as r on l."token" = r."id";
let result-patterns = select * from ref-texts where glob_any(text, "{Ok,Err}");
let result-ids = project(from=result-patterns, columns=["pattern"]);
let wildcard-ids = project(from=wildcard-patterns, columns=["pattern"]);
let result-wildcards = select l."pattern" as "pattern" from result-ids as l join wildcard-ids as r on l."pattern" = r."pattern";
let located = select r."file" as "file", r."span" as "span", r."text" as "text" from result-wildcards as l join result-patterns as r on l."pattern" = r."pattern";
let wildcard-findings = extend(from=located, values={"problem": "matches any Ok or Err without naming the value or the error variant"});
let findings = union(left=verdict-findings, right=wildcard-findings);
emit findings subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "this case {problem}"
help = "State the row: for a `succeeds` row the value the part returns (`Expect::Value(..)`), for any other word the error variant it refuses or fails with (`Expect::Error(FooError::Bar)` or `Expect::error(FooError::Bar)`, the full error value; `Expect::Refusal` can check meaningful context of opaque errors). `is_ok` and `Ok(_)` pass for a part that does nothing."

[given]
include = ['**/*_test.rs']

[[scenarios]]
id = 'named-rows'
scenario = 'Rows naming a value and an error variant.'
given.files.'src/greeting/domain/short/service_test.rs' = '''
//! Proves the short service.

use crate::cases::{Case, Expect, Word, run};

const CASES: &[Case<u8, u8, Failure>] = &[
    Case { name: "one stays one", word: Word::Succeeds, input: one, expect: Expect::Value(1) },
    Case { name: "zero is refused", word: Word::Refuses, input: zero, expect: Expect::Error(Failure::Empty) },
];

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}

#[test]
fn refuses() {
    run(CASES, Word::Refuses, subject);
}

#[test]
fn fails() {
    run(CASES, Word::Fails, subject);
}

#[test]
fn rejects() {
    run(CASES, Word::Rejects, subject);
}

fn checks_unchanged_state(result: Result<u8, Failure>, before: u8, after: u8, dry: bool) -> Result<u8, Failure> {
    if result.is_err() || dry {
        assert_eq!(before, after);
    }
    let report = result?;
    Ok(report)
}
'''

[[scenarios]]
id = 'value-pattern'
scenario = 'An Ok pattern that names its value.'
