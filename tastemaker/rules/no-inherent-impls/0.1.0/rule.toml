description = "A types.rs holds no inherent impl: no `impl Type { }` block, whatever it contains; a trait impl, `impl Trait for Type`, is allowed."
why = "A type is its data, one way in, and its derived traits, so a constructor is a struct literal, an accessor is a public field and an algorithm over a type is a domain concept's service taking the value. The one behaviour a types.rs may hold is a hand-written trait impl (`Display`, `Ord`), proven by the part's own test. Read as written: an `impl` item with no `for`, in the files the entry selects. Not seen: an impl generated by a macro, and a free function."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let impls = select * from tree-nodes where kind = "impl";
let for-keywords = select * from tree-tokens where kind = "for-kw";
let trait-impl-ids = select l."parent" as "id" from "syntax-child" as l join for-keywords as r on l."child" = r."id";
let inherent = antijoin(left=impls, right=trait-impl-ids, left-on=["id"], right-on=["id"]);
emit inherent subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this inherent impl block gives a type behaviour of its own"
help = "Delete the block: build the value with a struct literal, read a field directly, and put a rule over the type in a domain concept's `service.rs` taking the value. Behaviour a type keeps is a trait impl (`impl Display for Name`)."

[given]
include = ['**/types.rs']

[[scenarios]]
id = 'plain-structs-derives'
scenario = 'Plain structs with derives.'
given.files.'src/greeting/types.rs' = '''
//! The greeting domain's types.

/// Someone to greet.
#[derive(Clone, Debug, PartialEq, Eq)]
pub struct Name {
    pub text: String,
}
'''

[[scenarios]]
id = 'trait-impls'
scenario = 'Hand-written trait impls: nothing is reported.'
given.files.'src/greeting/types.rs' = '''
//! The greeting domain's types.

/// Someone to greet.
#[derive(Clone, Debug, PartialEq, Eq)]
pub struct Name {
    pub text: String,
}

impl std::fmt::Display for Name {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        f.write_str(&self.text)
    }
}

impl From<Name> for String {
    fn from(name: Name) -> Self {
        name.text
    }
}
'''

[[scenarios]]
id = 'constructor-inherent-impl'
scenario = 'A constructor in an inherent impl.'
given.files.'src/greeting/types.rs' = '''
//! The greeting domain's types.

/// Someone to greet.
#[derive(Clone, Debug, PartialEq, Eq)]
pub struct Name {
    pub text: String,
}

impl Name {
    pub fn new(text: String) -> Self {
        Self { text }
    }
}
'''
then.findings = [
  { path = 'src/greeting/types.rs', line = 9 },
]

