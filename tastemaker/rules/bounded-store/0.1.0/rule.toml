description = "A pipeline that keeps files across runs proves, in a lifecycle case of its use case's tests, that many runs in a row leave a bounded number of files."
why = "A store, a cache or a log that keeps files from run to run grows until a disk fills or a repository carries megabytes of history, and nothing in a single run shows it: the operation log that appends a snapshot beside every operation once it holds 64 files grows by about 42 KB of history a run. Whether a writer stays bounded is decided only by running it many times, so the proof is a lifecycle case of the pipeline's own `use_case_test.rs`, beside its cold, unchanged and edited runs (`many_runs_in_a_row_leave_a_bounded_number_of_files`), and this rule holds that the case is there. Read in the use case the `pipeline` spec places: its `use_case_test.rs` is reported when no string literal in it names a case with `bounded` in it. What the case asserts is the case's: the rule sees that it is there, not that it is right."

query = '''
let tests = select l."path" as "file" from "filesystem.file" as l where glob_any(l."path", "{use_case_test.rs,**/use_case_test.rs}");
let proving = select l."file" as "file" from "string-literal" as l where glob_any(l."value", "*bounded*") and glob_any(l."file", "{use_case_test.rs,**/use_case_test.rs}");
let proved = project(from=proving, columns=["file"]);
let missing = antijoin(left=tests, right=proved, left-on=["file"], right-on=["file"]);
emit missing subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "this pipeline keeps files across runs, and no lifecycle case shows many runs leave a bounded number"
help = "Add a lifecycle case that runs the use case many times in a row over the same project (`many_runs_in_a_row_leave_a_bounded_number_of_files`): runs that change nothing leave the count of files they found, and runs that change something stay under a fixed bound. Then make the writer pass it: replace what it keeps, or delete what a snapshot covers, in the same run."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'an-operation-log-with-no-bound'
scenario = 'Asymptote`s `up`, which appends to the operation log, at 5149cd075d: its cases prove an operation is recorded and read back, and none runs it many times, so its growth goes unseen.'
given.files.'src/inbound/use_cases/up/use_case_test.rs' = '''
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: CaseName("an_accepted_finding_is_recorded"),
        word: Word::Succeeds,
        input: || 1,
        expect: Expect::Value(true),
    },
];
'''
then.findings = [{ path = 'src/inbound/use_cases/up/use_case_test.rs' }]

[[scenarios]]
id = 'a-pipeline-proved-bounded'
scenario = 'A pipeline whose lifecycle cases run it forty times in a row and hold the files it leaves to a bound is not reported.'
given.files.'src/inbound/use_cases/lint/use_case_test.rs' = '''
const CASES: &[Case<Input, Value, Failure>] = &[
    Case {
        name: CaseName("many_runs_in_a_row_leave_a_bounded_number_of_files"),
        word: Word::Succeeds,
        input: || 40,
        expect: Expect::Value(true),
    },
];
'''
