description = "A composition opens nothing: no call named `open` or `connect` (or starting `open_` or `connect_`) in a `composition.rs`."
why = "A composition only constructs: it takes the clients its edge's connections opened and the parts its caller supplies, chooses the adapters and builds the service. Opening a store or connecting a client is I/O, and I/O at the edge belongs to `connections.rs`, which opens each store once and returns its client; a composition that opens one does I/O no test of the wiring can avoid and opens it again for every service it builds. Read as written: a call of a path whose last segment is `open`, `connect`, or starts `open_` or `connect_`, and a method call of such a name, in a `composition.rs`. Not seen: opening behind a name of another shape, which `io-at-boundary` sees when it reaches the filesystem directly."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let static-opens = select l."target" as "text", l."file" as "file", l."span" as "span" from "static-call" as l where glob_any(l."file", "**/composition.rs") and glob_any(l."target", "{open,connect,open_*,connect_*,*::open,*::connect,*::open_*,*::connect_*}");
let method-calls = select * from tree-nodes where kind = "method-call-expr" and glob_any(file, "**/composition.rs");
let method-refs = select l."id" as "call", r."child" as "ref" from method-calls as l join "syntax-child" as r on l."id" = r."parent";
let method-ref-nodes = select l."call" as "call", l."ref" as "ref" from method-refs as l join tree-nodes as r on l."ref" = r."id" where r."kind" = "name-ref";
let method-tokens = select l."call" as "call", r."child" as "token" from method-ref-nodes as l join "syntax-child" as r on l."ref" = r."parent";
let method-names = select r."text" as "text", r."file" as "file", r."span" as "span" from method-tokens as l join tree-tokens as r on l."token" = r."id" where r."kind" = "ident";
let method-opens = select * from method-names where glob_any(text, "{open,connect,open_*,connect_*}");
let opens = union(left=static-opens, right=method-opens);
emit opens subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "the composition calls `{text}`: opening is the connections' I/O"
help = "Move the opening into the edge's `connections.rs` (`open() -> Connections`, run once by the edge) and pass the opened client into the composition as a parameter; the composition chooses adapters and constructs, nothing else. When the port's factory needs only its settings (a directory and the build), give it the settings and let the adapter open on its first call."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
pub mod check;
pub mod inventory;
'''
files.'src/check.rs' = '''
pub mod composition;
'''
files.'src/inventory.rs' = '''
//! The source inventory's factory.

/// An opened inventory.
pub struct SourceConnection;

impl SourceConnection {
    /// Opens the inventory under a directory.
    pub fn open(directory: &std::path::Path) -> std::io::Result<Self> {
        std::fs::create_dir_all(directory).map(|()| Self)
    }
}

/// The check service.
pub struct CheckService {
    /// The inventory it reads.
    pub inventory: SourceConnection,
}
'''

[[scenarios]]
id = 'check-opens-inventory'
scenario = "Tastemaker's `check` composition at 5149cd075d: it opens the source inventory while it builds the service."
given.files.'src/check/composition.rs' = '''
//! The wiring of `check`.

/// Builds the check service over the cache directory.
pub fn build(cache: &std::path::Path) -> std::io::Result<crate::inventory::CheckService> {
    let source_connection = crate::inventory::SourceConnection::open(
        &cache.join("source-inventory"),
    )?;
    Ok(crate::inventory::CheckService { inventory: source_connection })
}
'''
then.findings = [
  { path = 'src/check/composition.rs', line = 5 },
]

[[scenarios]]
id = 'connections-open'
scenario = "The command template's shape: `connections.rs` opens, the composition takes the opened client and constructs."
given.files.'src/check.rs' = '''
pub mod composition;
pub mod connections;
'''
given.files.'src/check/connections.rs' = '''
//! The connections of `check`: it opens the stores the edge reads and writes.

/// The clients of the stores `check` reaches, opened once.
pub struct Connections {
    /// The source inventory.
    pub inventory: crate::inventory::SourceConnection,
}

/// Opens the stores and returns their clients.
pub fn open(cache: &std::path::Path) -> std::io::Result<Connections> {
    Ok(Connections { inventory: crate::inventory::SourceConnection::open(cache)? })
}
'''
given.files.'src/check/composition.rs' = '''
//! The wiring of `check`: it takes the clients its connections opened and constructs.

/// Builds the check service over the opened inventory.
#[must_use]
pub fn build(connections: super::connections::Connections) -> crate::inventory::CheckService {
    crate::inventory::CheckService { inventory: connections.inventory }
}
'''
