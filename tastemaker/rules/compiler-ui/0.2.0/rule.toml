let shape-arg-list-3 = select l."id" as "id" from kind-arg-list-nodes as l join arity-3 as r on l."id" = r."parent";
let pass-arguments-owns-0 = select l."id" as "id" from shape-arg-list-3 as l join empty-arguments-child-0 as r on l."id" = r."parent";
let kind-literal-nodes = select * from tree-nodes where kind = "literal";
let shape-literal-1 = select l."id" as "id" from kind-literal-nodes as l join arity-1 as r on l."id" = r."parent";
let pass-literals = select * from "string-literal" where value = "tests/ui/pass_*.rs";
let pass-tokens = select l."id" as "id", l."kind" as "kind" from tree-tokens as l join pass-literals as r on l."file" = r."file" and l."span" = r."span";
let pass-strings = select * from pass-tokens where kind = "string";
let pass-literal-token = project(from=pass-strings, columns=["id"]);
let pass-literal-child-0 = select l."parent" as "parent" from first-children as l join pass-literal-token as r on l."child" = r."id";
let pass-literal-owns-0 = select l."id" as "id" from shape-literal-1 as l join pass-literal-child-0 as r on l."id" = r."parent";
let pass-arguments-child-1 = select l."parent" as "parent" from position-1 as l join pass-literal-owns-0 as r on l."child" = r."id";
let pass-arguments-owns-1 = select l."id" as "id" from pass-arguments-owns-0 as l join pass-arguments-child-1 as r on l."id" = r."parent";
let pass-arguments-child-2 = select l."parent" as "parent" from position-2 as l join rparen as r on l."child" = r."id";
let pass-arguments-owns-2 = select l."id" as "id" from pass-arguments-owns-1 as l join pass-arguments-child-2 as r on l."id" = r."parent";
let pass-call-child-3 = select l."parent" as "parent" from position-3 as l join pass-arguments-owns-2 as r on l."child" = r."id";
let pass-call-owns-3 = select l."id" as "id" from pass-call-owns-2 as l join pass-call-child-3 as r on l."id" = r."parent";
let pass-statement-child-0 = select l."parent" as "parent" from first-children as l join pass-call-owns-3 as r on l."child" = r."id";
let pass-statement-owns-0 = select l."id" as "id" from shape-expr-stmt-2 as l join pass-statement-child-0 as r on l."id" = r."parent";
let pass-statement-child-1 = select l."parent" as "parent" from position-1 as l join semicolon as r on l."child" = r."id";
let pass-statement-owns-1 = select l."id" as "id" from pass-statement-owns-0 as l join pass-statement-child-1 as r on l."id" = r."parent";
let ui-statements-child-2 = select l."parent" as "parent" from position-2 as l join pass-statement-owns-1 as r on l."child" = r."id";
let ui-statements-owns-2 = select l."id" as "id" from ui-statements-owns-1 as l join ui-statements-child-2 as r on l."id" = r."parent";
let compile-fail-call-owns-0 = select l."id" as "id" from shape-method-call-expr-4 as l join pass-call-child-0 as r on l."id" = r."parent";
let compile-fail-call-owns-1 = select l."id" as "id" from compile-fail-call-owns-0 as l join pass-call-child-1 as r on l."id" = r."parent";
let compile-fail-text = select * from kind-ident-tokens where text = "compile_fail";
let compile-fail = project(from=compile-fail-text, columns=["id"]);
let compile-fail-ref-child-0 = select l."parent" as "parent" from first-children as l join compile-fail as r on l."child" = r."id";
let compile-fail-ref-owns-0 = select l."id" as "id" from shape-name-ref-1 as l join compile-fail-ref-child-0 as r on l."id" = r."parent";
let compile-fail-call-child-2 = select l."parent" as "parent" from position-2 as l join compile-fail-ref-owns-0 as r on l."child" = r."id";
let compile-fail-call-owns-2 = select l."id" as "id" from compile-fail-call-owns-1 as l join compile-fail-call-child-2 as r on l."id" = r."parent";
let compile-fail-arguments-owns-0 = select l."id" as "id" from shape-arg-list-3 as l join empty-arguments-child-0 as r on l."id" = r."parent";
let compile-fail-literals = select * from "string-literal" where value = "tests/ui/fail_*.rs";
let compile-fail-tokens = select l."id" as "id", l."kind" as "kind" from tree-tokens as l join compile-fail-literals as r on l."file" = r."file" and l."span" = r."span";
let compile-fail-strings = select * from compile-fail-tokens where kind = "string";
let compile-fail-literal-token = project(from=compile-fail-strings, columns=["id"]);
let compile-fail-literal-child-0 = select l."parent" as "parent" from first-children as l join compile-fail-literal-token as r on l."child" = r."id";
let compile-fail-literal-owns-0 = select l."id" as "id" from shape-literal-1 as l join compile-fail-literal-child-0 as r on l."id" = r."parent";
let compile-fail-arguments-child-1 = select l."parent" as "parent" from position-1 as l join compile-fail-literal-owns-0 as r on l."child" = r."id";
let compile-fail-arguments-owns-1 = select l."id" as "id" from compile-fail-arguments-owns-0 as l join compile-fail-arguments-child-1 as r on l."id" = r."parent";
let compile-fail-arguments-owns-2 = select l."id" as "id" from compile-fail-arguments-owns-1 as l join pass-arguments-child-2 as r on l."id" = r."parent";
let compile-fail-call-child-3 = select l."parent" as "parent" from position-3 as l join compile-fail-arguments-owns-2 as r on l."child" = r."id";
let compile-fail-call-owns-3 = select l."id" as "id" from compile-fail-call-owns-2 as l join compile-fail-call-child-3 as r on l."id" = r."parent";
let compile-fail-statement-child-0 = select l."parent" as "parent" from first-children as l join compile-fail-call-owns-3 as r on l."child" = r."id";
let compile-fail-statement-owns-0 = select l."id" as "id" from shape-expr-stmt-2 as l join compile-fail-statement-child-0 as r on l."id" = r."parent";
let compile-fail-statement-owns-1 = select l."id" as "id" from compile-fail-statement-owns-0 as l join pass-statement-child-1 as r on l."id" = r."parent";
let ui-statements-child-3 = select l."parent" as "parent" from position-3 as l join compile-fail-statement-owns-1 as r on l."child" = r."id";
let ui-statements-owns-3 = select l."id" as "id" from ui-statements-owns-2 as l join ui-statements-child-3 as r on l."id" = r."parent";
let kind-r-curly-tokens = select * from tree-tokens where kind = "r-curly";
let rbrace = project(from=kind-r-curly-tokens, columns=["id"]);
let ui-statements-child-4 = select l."parent" as "parent" from position-4 as l join rbrace as r on l."child" = r."id";
let ui-statements-owns-4 = select l."id" as "id" from ui-statements-owns-3 as l join ui-statements-child-4 as r on l."id" = r."parent";
let ui-body-child-0 = select l."parent" as "parent" from first-children as l join ui-statements-owns-4 as r on l."child" = r."id";
let ui-body-owns-0 = select l."id" as "id" from shape-block-expr-1 as l join ui-body-child-0 as r on l."id" = r."parent";
let ui-function-child-4 = select l."parent" as "parent" from position-4 as l join ui-body-owns-0 as r on l."child" = r."id";
let ui-function-owns-4 = select l."id" as "id" from ui-function-owns-3 as l join ui-function-child-4 as r on l."id" = r."parent";
let matched-main-roots = select l."file" as "file" from main-roots as l join ui-function-owns-4 as r on l."id" = r."id";
let main-counts = group-count(from=main-roots, keys=["file"], count="mains");
let single-main-files = select * from main-counts where mains = 1;
let unique-matched-files = select l."file" as "file" from matched-main-roots as l join single-main-files as r on l."file" = r."file";
let attributed-files = select r."child" as "child", l."id" as "id", l."file" as "file" from files as l join "syntax-child" as r on l."id" = r."parent";
let attributes = select * from tree-nodes where kind = "attr";
let file-attributes = select l."file" as "file" from attributed-files as l join attributes as r on l."child" = r."id";
let active-matched-files = antijoin(left=unique-matched-files, right=file-attributes, left-on=["file"], right-on=["file"]);
let diagnostics = antijoin(left=files, right=active-matched-files, left-on=["file"], right-on=["file"]);
emit diagnostics subject "file" key("file");
'''

[diagnostic]
primary = "span"
message = "Compile-fail runner must run tests/ui/pass_*.rs as pass cases and tests/ui/fail_*.rs as compile-fail cases"
help = "Make the compile-fail runner only construct `::trybuild::TestCases`, call `pass(\"tests/ui/pass_*.rs\")` and then `compile_fail(\"tests/ui/fail_*.rs\")` on it, and nothing else; `tm scaffold` writes the template's runner. Put each case in its own `tests/ui/pass_<case>.rs` or `tests/ui/fail_<case>.rs` file, never in the runner."

[given]
include = ['tests/compile_fail.rs']

[[scenarios]]
id = 'authored-ui'
scenario = 'Authored runner, pass then compile-fail.'
given.files.'tests/compile_fail.rs' = '''
#[test]
fn ui() {
    let cases = ::trybuild::TestCases::new();
    cases.pass("tests/ui/pass_*.rs");
    cases.compile_fail("tests/ui/fail_*.rs");
}
'''

[[scenarios]]
id = 'comments'
scenario = 'Comments: nothing is reported.'
given.files.'tests/compile_fail.rs' = '''
#[test]
fn ui() {
    let cases = ::trybuild::TestCases::new();
    /* compiled */ cases . pass("tests/ui/pass_*.rs");
    cases.compile_fail("tests/ui/fail_*.rs");
}
'''

[[scenarios]]
id = 'raw-globs'
scenario = 'Raw globs: nothing is reported.'
given.files.'tests/compile_fail.rs' = '''
#[test]
fn ui() {
    let cases = ::trybuild::TestCases::new();
    cases.pass(r#"tests/ui/pass_*.rs"#);
    cases.compile_fail(r"tests/ui/fail_*.rs");
}
'''

[[scenarios]]
id = 'missing-pass'
scenario = 'No pass call: it is reported.'
given.files.'tests/compile_fail.rs' = '''
#[test]
fn ui() {
    let cases = ::trybuild::TestCases::new();
    cases.compile_fail("tests/ui/fail_*.rs");
}
'''
then.findings = [
  { path = 'tests/compile_fail.rs', line = 1 },
]

