description = "The compile-fail runner runs the pass cases and the compile-fail cases under tests/ui, directly."
why = "Cargo owns test targets and trybuild owns compilation and diagnostics. The macro spec places each compile-fail case at tests/ui/fail_{case}.rs and the hostile-scope case at tests/ui/pass_hostile_scope.rs; this rule rejects a runner that is skipped, conditional, disconnected or pointed elsewhere."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = select * from tree-nodes where kind = "source-file";
let functions = select * from tree-nodes where kind = "fn";
let names = select * from tree-nodes where kind = "name";
let identifiers = select * from tree-tokens where kind = "ident";
let main-identifiers = select * from identifiers where text = "ui";
let main-name-edges = select l."parent" as "parent" from "syntax-child" as l join main-identifiers as r on l."child" = r."id";
let main-names = select l."id" as "id" from names as l join main-name-edges as r on l."id" = r."parent";
let main-function-edges = select l."parent" as "parent" from "syntax-child" as l join main-names as r on l."child" = r."id";
let named-functions = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from functions as l join main-function-edges as r on l."id" = r."parent";
let root-edges = select l."child" as "child" from "syntax-child" as l join files as r on l."parent" = r."id";
let main-roots = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from named-functions as l join root-edges as r on l."id" = r."child";
let kind-fn-nodes = select * from tree-nodes where kind = "fn";
let whitespace = select * from tree-tokens where kind = "whitespace";
let comments = select * from tree-tokens where kind = "comment";
let trivia = union(left=whitespace, right=comments);
let meaningful-edges = antijoin(left="syntax-child", right=trivia, left-on=["child"], right-on=["id"]);
let main-descendants = axis(from=main-roots, relation="syntax-child", direction=descendant, domain=tree-nodes);
let descendant-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from tree-nodes as l join main-descendants as r on l."id" = r."related";
let main-domain = union(left=main-roots, right=descendant-nodes);
let main-edges = select l."child" as "child", l."ordinal" as "ordinal", l."parent" as "parent" from meaningful-edges as l join main-domain as r on l."parent" = r."id";
let child-counts = group-count(from=main-edges, keys=["parent"], count="children");
let arity-5 = select * from child-counts where children = 5;
let shape-fn-5 = select l."id" as "id" from kind-fn-nodes as l join arity-5 as r on l."id" = r."parent";
let sibling-pairs = select r."ordinal" as "before", l."child" as "child", l."ordinal" as "ordinal", l."parent" as "parent" from main-edges as l join main-edges as r on l."parent" = r."parent";
let predecessors = select * from sibling-pairs where before < ordinal;
let child-ranks = group-count(from=predecessors, keys=["parent", "child"], count="rank");
let first-children = antijoin(left=main-edges, right=child-ranks, left-on=["parent", "child"], right-on=["parent", "child"]);
let kind-attr-nodes = select * from tree-nodes where kind = "attr";
let arity-4 = select * from child-counts where children = 4;
let shape-attr-4 = select l."id" as "id" from kind-attr-nodes as l join arity-4 as r on l."id" = r."parent";
let kind-pound-tokens = select * from tree-tokens where kind = "pound";
let pound = project(from=kind-pound-tokens, columns=["id"]);
let test-attribute-child-0 = select l."parent" as "parent" from first-children as l join pound as r on l."child" = r."id";
let test-attribute-owns-0 = select l."id" as "id" from shape-attr-4 as l join test-attribute-child-0 as r on l."id" = r."parent";
let position-1 = select * from child-ranks where rank = 1;
let kind-l-brack-tokens = select * from tree-tokens where kind = "l-brack";
let lbracket = project(from=kind-l-brack-tokens, columns=["id"]);
let test-attribute-child-1 = select l."parent" as "parent" from position-1 as l join lbracket as r on l."child" = r."id";
let test-attribute-owns-1 = select l."id" as "id" from test-attribute-owns-0 as l join test-attribute-child-1 as r on l."id" = r."parent";
let position-2 = select * from child-ranks where rank = 2;
let kind-path-meta-nodes = select * from tree-nodes where kind = "path-meta";
let arity-1 = select * from child-counts where children = 1;
let shape-path-meta-1 = select l."id" as "id" from kind-path-meta-nodes as l join arity-1 as r on l."id" = r."parent";
let kind-path-nodes = select * from tree-nodes where kind = "path";
let shape-path-1 = select l."id" as "id" from kind-path-nodes as l join arity-1 as r on l."id" = r."parent";
let kind-path-segment-nodes = select * from tree-nodes where kind = "path-segment";
let shape-path-segment-1 = select l."id" as "id" from kind-path-segment-nodes as l join arity-1 as r on l."id" = r."parent";
let kind-name-ref-nodes = select * from tree-nodes where kind = "name-ref";
let shape-name-ref-1 = select l."id" as "id" from kind-name-ref-nodes as l join arity-1 as r on l."id" = r."parent";
let kind-ident-tokens = select * from tree-tokens where kind = "ident";
let test-text = select * from kind-ident-tokens where text = "test";
let test = project(from=test-text, columns=["id"]);
let test-ref-child-0 = select l."parent" as "parent" from first-children as l join test as r on l."child" = r."id";
let test-ref-owns-0 = select l."id" as "id" from shape-name-ref-1 as l join test-ref-child-0 as r on l."id" = r."parent";
let test-segment-child-0 = select l."parent" as "parent" from first-children as l join test-ref-owns-0 as r on l."child" = r."id";
let test-segment-owns-0 = select l."id" as "id" from shape-path-segment-1 as l join test-segment-child-0 as r on l."id" = r."parent";
let test-path-child-0 = select l."parent" as "parent" from first-children as l join test-segment-owns-0 as r on l."child" = r."id";
let test-path-owns-0 = select l."id" as "id" from shape-path-1 as l join test-path-child-0 as r on l."id" = r."parent";
let test-metadata-child-0 = select l."parent" as "parent" from first-children as l join test-path-owns-0 as r on l."child" = r."id";
let test-metadata-owns-0 = select l."id" as "id" from shape-path-meta-1 as l join test-metadata-child-0 as r on l."id" = r."parent";
let test-attribute-child-2 = select l."parent" as "parent" from position-2 as l join test-metadata-owns-0 as r on l."child" = r."id";
let test-attribute-owns-2 = select l."id" as "id" from test-attribute-owns-1 as l join test-attribute-child-2 as r on l."id" = r."parent";
let position-3 = select * from child-ranks where rank = 3;
let kind-r-brack-tokens = select * from tree-tokens where kind = "r-brack";
let rbracket = project(from=kind-r-brack-tokens, columns=["id"]);
let test-attribute-child-3 = select l."parent" as "parent" from position-3 as l join rbracket as r on l."child" = r."id";
let test-attribute-owns-3 = select l."id" as "id" from test-attribute-owns-2 as l join test-attribute-child-3 as r on l."id" = r."parent";
let ui-function-child-0 = select l."parent" as "parent" from first-children as l join test-attribute-owns-3 as r on l."child" = r."id";
let ui-function-owns-0 = select l."id" as "id" from shape-fn-5 as l join ui-function-child-0 as r on l."id" = r."parent";
let kind-fn-kw-tokens = select * from tree-tokens where kind = "fn-kw";
let fn = project(from=kind-fn-kw-tokens, columns=["id"]);
let ui-function-child-1 = select l."parent" as "parent" from position-1 as l join fn as r on l."child" = r."id";
let ui-function-owns-1 = select l."id" as "id" from ui-function-owns-0 as l join ui-function-child-1 as r on l."id" = r."parent";
let kind-name-nodes = select * from tree-nodes where kind = "name";
let shape-name-1 = select l."id" as "id" from kind-name-nodes as l join arity-1 as r on l."id" = r."parent";
let ui-text = select * from kind-ident-tokens where text = "ui";
let ui = project(from=ui-text, columns=["id"]);
let ui-ref-child-0 = select l."parent" as "parent" from first-children as l join ui as r on l."child" = r."id";
let ui-name-owns-0 = select l."id" as "id" from shape-name-1 as l join ui-ref-child-0 as r on l."id" = r."parent";
let ui-function-child-2 = select l."parent" as "parent" from position-2 as l join ui-name-owns-0 as r on l."child" = r."id";
let ui-function-owns-2 = select l."id" as "id" from ui-function-owns-1 as l join ui-function-child-2 as r on l."id" = r."parent";
let kind-param-list-nodes = select * from tree-nodes where kind = "param-list";
let arity-2 = select * from child-counts where children = 2;
let shape-param-list-2 = select l."id" as "id" from kind-param-list-nodes as l join arity-2 as r on l."id" = r."parent";
let kind-l-paren-tokens = select * from tree-tokens where kind = "l-paren";
let lparen = project(from=kind-l-paren-tokens, columns=["id"]);
let empty-arguments-child-0 = select l."parent" as "parent" from first-children as l join lparen as r on l."child" = r."id";
let ui-parameters-owns-0 = select l."id" as "id" from shape-param-list-2 as l join empty-arguments-child-0 as r on l."id" = r."parent";
