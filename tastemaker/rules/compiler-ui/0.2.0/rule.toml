let cases-pattern-child-0 = select l."parent" as "parent" from first-children as l join cases-name-owns-0 as r on l."child" = r."id";
let cases-pattern-owns-0 = select l."id" as "id" from shape-ident-pat-1 as l join cases-pattern-child-0 as r on l."id" = r."parent";
let cases-binding-child-1 = select l."parent" as "parent" from position-1 as l join cases-pattern-owns-0 as r on l."child" = r."id";
