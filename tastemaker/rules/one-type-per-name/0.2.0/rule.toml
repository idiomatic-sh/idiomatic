[[scenarios]]
id = 'column-declared-in-a-macro'
scenario = "Ryo at c2da5dd666: `Column` is a struct in crates/language/src/domain/elements/types.rs and an enum written inside `macro_rules! catalog_types` in relations/types.rs; a macro body is tokens to the engine, read as `pub enum Name`. A metavariable name and a private type in a macro are not seen."
given.files.'crates/language/src/domain/elements/types.rs' = '''
/// The numbers of a column.
#[derive(Clone, Debug, PartialEq, Eq)]
pub(crate) struct Column<T> {
    /// The numbers.
    pub values: Vec<T>,
}
'''
given.files.'crates/language/src/domain/relations/types.rs' = '''
macro_rules! catalog_types {
    ($name:ident) => {
        /// A column of one of the relations.
        #[derive(Clone, Copy, Debug, PartialEq, Eq)]
        pub enum Column {
            /// A node.
            Node,
        }

        /// A type named by the caller.
        pub struct $name(u32);

        struct Hidden(u32);
    };
}
'''
then.findings = [
  { path = 'crates/language/src/domain/elements/types.rs', line = 3 },
  { path = 'crates/language/src/domain/relations/types.rs', line = 5 },
]

[[scenarios]]
id = 'one-copy-in-values-imported-by-both'
scenario = "The concept declared once in the values crate and imported by the language crate and the core; a private helper of the same name in two crates, a macro whose type names are metavariables, and per-verb edge types under two resources."
given.files.'crates/values/src/domain/descriptions/types.rs' = '''
/// The name of a relation.
#[derive(Clone, Debug, PartialEq, Eq)]
pub struct RelationName(pub Box<str>);

/// A step of this module's own walk.
struct Step(u32);

/// The first step.
#[must_use]
pub fn first() -> u32 {
    Step(0).0
}
'''
given.files.'crates/language/src/domain/relations/types.rs' = '''
use ryo_values::domain::descriptions::types::RelationName;

/// A step of this module's own walk.
struct Step(u32);

/// The name of the relation the language reads.
#[must_use]
pub fn read() -> Option<RelationName> {
    let _step = Step(1);
    None
}

macro_rules! typed {
    ($name:ident) => {
        /// A type the caller names.
        pub struct $name(u32);
    };
}
'''
given.files.'crates/core/src/domain/catalog/types.rs' = '''
use ryo_values::domain::descriptions::types::RelationName;

/// What the core answers of a relation.
