description = "No two visible structs or enums of one project share a name: the one copy of a concept lives in the project's values crate. Exempt: a name whose declarations each sit in a different language provider."
why = "One name means one concept. Two types of one project called the same (`RelationName` in the language crate and in the values crate, `RowColumn` in two domains, `Standing` for a violation and for a measure) are either one concept declared twice, with a conversion between the copies, or two concepts behind one word, where importing the wrong one compiles and a reader has to check the path to know which is meant. A concept declared twice moves into the project's values crate (ryo: crates/ryo/crates/values) and every crate imports that one; two concepts get a name each. Read as written, over every crate of the project the check covers: the name of every struct and enum declared with a visibility (`pub`, `pub(crate)`, `pub(super)`, `pub(in …)`), and the name after `struct` or `enum` in the body of a `macro_rules!` that is written `pub` (the engine reads a macro body as tokens, so the pairs `pub struct Name` and `pub enum Name` are seen there, a `pub(crate)` one or one named by a metavariable is not). Not compared: a private type (no other module can import it), a wire shape in `schemas.rs`, the items of a collection (`collections/`), the edges (`resources/`, whose commands and SDK entries name their types after their verb, `DescribeArguments` under each resource, and an SDK's types mirror its core's on purpose, which the SDK API gate holds), an SDK's `src/domain/` (the one edge copy of each concept the SDK shares between its resources: the SDK cannot re-export a core type), and test code. A name is also not reported when every declaration of it sits in a different language provider (a different `languages/<provider>/` crate: `Assignment` in the Go and the Python provider): providers never depend on each other and no abstraction spans languages, so each owns its words. Two declarations in one provider, or one in a provider and one anywhere else (`RelationName` in the Rust provider and in the values crate), are still reported."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let types = select * from tree-nodes where glob_any(kind, "{struct,enum}") and not glob_any(file, "{**/schemas.rs,**/*_test.rs,**/tests/**,**/benches/**,**/fixtures.rs,**/fixtures/**,**/cases.rs,**/acceptance.rs,**/collections/**,**/resources/**,**/sdk/src/domain/**}");
let type-children = select l."id" as "type", r."child" as "child" from types as l join "syntax-child" as r on l."id" = r."parent";
let visible = select l."type" as "type" from type-children as l join tree-nodes as r on l."child" = r."id" where r."kind" = "visibility";
let name-nodes = select l."type" as "type", l."child" as "node" from type-children as l join tree-nodes as r on l."child" = r."id" where r."kind" = "name";
let name-tokens = select l."type" as "type", r."child" as "token" from name-nodes as l join "syntax-child" as r on l."node" = r."parent";
let names = select l."type" as "type", r."text" as "name", r."file" as "file", r."span" as "span" from name-tokens as l join tree-tokens as r on l."token" = r."id";
let written = select l."type" as "type", l."name" as "name", l."file" as "file", l."span" as "span" from names as l join visible as r on l."type" = r."type";
let macro-rules = select * from tree-nodes where kind = "macro-rules" and not glob_any(file, "{**/schemas.rs,**/*_test.rs,**/tests/**,**/benches/**,**/fixtures.rs,**/fixtures/**,**/cases.rs,**/acceptance.rs,**/collections/**,**/resources/**,**/sdk/src/domain/**}");
let keywords = select * from tree-tokens where glob_any(text, "{struct,enum}");
let blanks = select * from tree-tokens where kind = "whitespace";
let macro-keywords = axis(from=macro-rules, relation="syntax-child", direction=descendant, domain=keywords);
let keyword-ids = select r."id" as "id" from macro-keywords as l join keywords as r on l."related" = r."id";
let after-keyword = axis(from=keyword-ids, relation="syntax-child", direction=next-sibling, domain=blanks);
let after-blank = select l."id" as "keyword", r."id" as "id" from after-keyword as l join blanks as r on l."related" = r."id";
let after-name = axis(from=after-blank, relation="syntax-child", direction=next-sibling, domain=tree-tokens);
let macro-names = select l."keyword" as "keyword", r."id" as "type", r."text" as "name", r."file" as "file", r."span" as "span" from after-name as l join tree-tokens as r on l."related" = r."id" where r."kind" = "ident";
let before-keyword = axis(from=keyword-ids, relation="syntax-child", direction=previous-sibling, domain=blanks);
let before-blank = select l."id" as "keyword", r."id" as "id" from before-keyword as l join blanks as r on l."related" = r."id";
let before-word = axis(from=before-blank, relation="syntax-child", direction=previous-sibling, domain=tree-tokens);
let pub-before = select l."keyword" as "keyword" from before-word as l join tree-tokens as r on l."related" = r."id" where r."text" = "pub";
let macro-written = select l."type" as "type", l."name" as "name", l."file" as "file", l."span" as "span" from macro-names as l join pub-before as r on l."keyword" = r."keyword";
let declared = union(left=written, right=macro-written);
let declarations = group-count(from=declared, keys=["name"], distinct="type", count="declared");
let repeated = select * from declarations where declared > 1;
let provided-here = capture(from=declared, path="file", pattern="languages/{provider}/{*rest}", captures=["provider"]);
let provided-below = capture(from=declared, path="file", pattern="{*root}/languages/{provider}/{*rest}", captures=["provider"]);
let unprovided-here = antijoin(left=declared, right=provided-here, left-on=["type"], right-on=["type"]);
let unprovided = antijoin(left=unprovided-here, right=provided-below, left-on=["type"], right-on=["type"]);
let per-provider-here = group-count(from=provided-here, keys=["name", "provider"], distinct="type", count="within");
let per-provider-below = group-count(from=provided-below, keys=["name", "provider"], distinct="type", count="within");
let twice-here = select * from per-provider-here where within > 1;
let twice-below = select * from per-provider-below where within > 1;
let twice-here-names = project(from=twice-here, columns=["name"]);
let twice-below-names = project(from=twice-below, columns=["name"]);
let twice-names = union(left=twice-here-names, right=twice-below-names);
let outside = select l."name" as "name" from unprovided as l join repeated as r on l."name" = r."name";
let outside-names = project(from=outside, columns=["name"]);
let flagged = union(left=twice-names, right=outside-names);
let shared = select l."name" as "name", l."file" as "file", l."span" as "span" from declared as l join flagged as r on l."name" = r."name";
emit shared subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{name}` is declared more than once in this project"
help = "When the declarations are one concept, keep one in the project's values crate, delete the others and their conversions, and import the one kept. When they are different concepts, rename each after what it holds (`ViolationStanding` and `MeasureStanding` say more than two `Standing`s). `tm check --format json` lists every declaration of the name."

[given]
include = ['**']

[[scenarios]]
id = 'two-standings'
scenario = "Asymptote's core at 5149cd075d: `Standing` declared for a measure and for a violation, two meanings behind one name."
given.files.'crates/core/src/domain/perf/types.rs' = '''
/// Whether a measure is within its budget.
#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub enum Standing {
    /// Within the budget.
    Within,
    /// Over it.
    Over,
}
'''
given.files.'crates/core/src/domain/violations/types.rs' = '''
/// Whether a violation is reported or suppressed in the source.
#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub enum Standing {
    /// Reported.
    Reported,
    /// Suppressed with a reason.
    Suppressed,
}
'''
then.findings = [
  { path = 'crates/core/src/domain/perf/types.rs', line = 3 },
  { path = 'crates/core/src/domain/violations/types.rs', line = 3 },
]

