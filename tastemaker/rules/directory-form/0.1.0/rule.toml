description = "A directory form of a single-file role (`schemas/<concept>.rs`, `fixtures/<concept>.rs`, `<name>_test/<scenario>.rs`) holds at least `least` files: a directory of fewer is the single file split along nothing."
why = "A single-file role (`schemas.rs`, `fixtures.rs`, `entry_test.rs`) stays one file until it holds more than one concept or scenario, and the file-length rule is what says so: a long file is a prompt to look for the pattern it splits along, never to cut it apart just to pass. The directory form is that split, one file for each concept or scenario, the role's own file left to declare them; a directory with one file in it is the role's file moved down a level, and the split has found no pattern. Read as written: the files of the include, grouped by the directory that holds them, the directory counted by its files; a directory with fewer than `least` is reported at each file it holds. Not seen: how long the files are (file-length reads that), and whether the split follows the concepts of the data."

query = '''
param least: integer;
let listed = select l."path" as "file" from "filesystem.file" as l;
let members = capture(from=listed, path="file", pattern="{*owner}/{role}/{name}.rs", captures=["owner", "role", "name"]);
let forms = select * from members where glob_any(role, "{schemas,fixtures,*_test}");
let counts = group-count(from=forms, keys=["owner", "role"], distinct="file", count="files");
let alone = select * from counts where files < $least;
let found = select l."file" as "file" from forms as l join alone as r on l."owner" = r."owner" and l."role" = r."role";
emit found subject "file" key("file");
'''

[diagnostic]
primary = "file"
message = "this directory holds fewer than the files a directory form needs"
help = "Keep the role in its single file: a directory form splits along concept or scenario into two or more files, never to pass the length limit, and a directory of one file is the single file moved down a level."

[params.least]
type = "integer"
description = "The fewest files a directory form holds."

[given]
include = ['src/**']
params = { least = 2 }

[[scenarios]]
id = 'two-concepts'
scenario = "The schemas of a part split into two concepts: its directory holds two files and is not reported."
given.files.'src/entry/schemas.rs' = '''
mod rule;
mod finding;
'''
given.files.'src/entry/schemas/rule.rs' = '''
//! The rule's wire shape.
'''
given.files.'src/entry/schemas/finding.rs' = '''
//! The finding's wire shape.
'''

[[scenarios]]
id = 'one-file-directory'
scenario = "A directory form of one file, the single file moved down a level: its file is reported, below the limit or above it."
given.files.'src/entry/fixtures.rs' = '''
mod scenario;
'''
given.files.'src/entry/fixtures/scenario.rs' = '''
//! The one scenario.
'''
then.findings = [
  { path = 'src/entry/fixtures/scenario.rs' },
]

[[scenarios]]
id = 'alone-beside-a-pair'
scenario = "Two directory forms of one part: the pair passes and the lone file is reported."
given.files.'src/entry/entry_test.rs' = '''
mod first;
'''
given.files.'src/entry/entry_test/first.rs' = '''
//! The first scenario.
'''
given.files.'src/entry/schemas/rule.rs' = '''
//! The rule's wire shape.
'''
given.files.'src/entry/schemas/finding.rs' = '''
//! The finding's wire shape.
'''
then.findings = [
  { path = 'src/entry/entry_test/first.rs' },
]
