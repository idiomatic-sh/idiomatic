'''
given.files.'src/save.rs' = '''
use std::fs;
use std::path::Path;

pub fn save(path: &Path) -> std::io::Result<()> {
    fs::write(path, "saved")
}
'''
then.findings = [
  { path = 'src/save.rs', line = 1 },
  { path = 'src/save.rs', line = 5 },
]

