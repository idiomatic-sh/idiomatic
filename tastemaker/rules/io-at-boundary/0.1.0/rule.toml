[[scenarios]]
id = 'ports-and-values'
scenario = 'A port asked about a path, exit codes, addresses and path arithmetic are no I/O.'
given.files.'src/lib.rs' = '''
use std::path::{Path, PathBuf};
use std::process::ExitCode;

pub trait FilesInterface {
    fn exists(&self, path: &Path) -> bool;
}

pub fn manifest(files: &dyn FilesInterface, root: &Path) -> Option<PathBuf> {
    let manifest = root.join("Cargo.toml");
    files.exists(&manifest).then_some(manifest)
}

pub fn outcome(passed: bool) -> ExitCode {
    if passed { ExitCode::SUCCESS } else { ExitCode::FAILURE }
}

pub fn address() -> Option<std::net::SocketAddr> {
    "127.0.0.1:8080".parse().ok()
}
'''

