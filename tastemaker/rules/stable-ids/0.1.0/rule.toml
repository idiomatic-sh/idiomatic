description = "No id is made from an enumeration's position: no string literal without spaces joins an id prefix constant, a dash or a path with the counter of an enumeration (`{RULE_PREFIX}{number}`, `rule-{n}`, `{position}`, `{ordinal}`)."
why = "An id is what a cache, a lock or a reader keys on from one run to the next. An id made from the place an item has in a list changes whenever an item before it is added or removed, so every later item is renumbered: its cached result is lost, its lock row looks new, and a second table is needed to map the number back to what it names. An id comes from what the item is (the definition's name and version, the entry's scope, the file's path) instead. Read from the string tokens as written (an id is text without spaces, so a message is left out): an id prefix constant followed by a bare counter (`{}`, `{number}`, `{index}`, `{n}`, `{i}`), a `{position}` or `{ordinal}` capture anywhere, and a dash followed by a counter at the end of the text. Not seen: a counter under another name (`{k}`), and an id built with `to_string` and `push_str`."

query = '''
let strings = select * from "syntax-tree" where kind = "string";
let spaceless = select * from strings where not glob_any(text, "* *");
let prefixed = select * from spaceless where glob_any(text, "?\{*PREFIX\}\{\}?") or glob_any(text, "?\{*PREFIX\}\{number\}?") or glob_any(text, "?\{*PREFIX\}\{index\}?") or glob_any(text, "?\{*PREFIX\}\{n\}?") or glob_any(text, "?\{*PREFIX\}\{i\}?");
let positioned = select * from spaceless where glob_any(text, "*\{position\}*") or glob_any(text, "*\{ordinal\}*");
let dashed = select * from spaceless where glob_any(text, "?*-\{number\}?") or glob_any(text, "?*-\{index\}?") or glob_any(text, "?*-\{n\}?") or glob_any(text, "?*-\{i\}?");
let some = union(left=prefixed, right=positioned);
let found = union(left=some, right=dashed);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{text}` makes an id from a position"
help = "Make the id from what the item is (its definition's name and version, its scope, its path), so adding or removing another item leaves it as it was."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'rule-ids-by-number'
scenario = 'Lint rule ids are numbered in the order the rules are planned (Tastemaker planning and built-ins at 5149cd075d).'
given.files.'src/lib.rs' = '''
pub const RULE_PREFIX: &str = "rule-";
pub const CONDITION_PREFIX: &str = "condition-";

pub fn ids(rules: &[&str]) -> Vec<String> {
    let mut ids = Vec::new();
    for (number, _rule) in rules.iter().enumerate() {
        ids.push(format!("{RULE_PREFIX}{number}"));
        ids.push(format!("{CONDITION_PREFIX}{number}"));
    }
    ids
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 7 },
  { path = 'src/lib.rs', line = 8 },
]

[[scenarios]]
id = 'rendered-files-by-position'
scenario = 'Rendered contract files are named by their place in the placed list (Tastemaker contract rendering at 5149cd075d).'
given.files.'src/lib.rs' = '''
pub const RENDERED: &str = ".rendered";

pub fn rendered(files: &[&str]) -> Vec<String> {
    files
        .iter()
        .enumerate()
        .map(|(position, file)| format!("{RENDERED}/{position}.{file}"))
        .collect()
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 7 },
]

[[scenarios]]
id = 'ids-from-definitions'
scenario = 'Rule ids come from the definition and the scope; a message counts without making an id.'
given.files.'src/lib.rs' = '''
pub const CONDITION_PREFIX: &str = "condition-";

pub fn id(scope: &str, name: &str) -> String {
    format!("{CONDITION_PREFIX}{scope}/{name}")
}

pub fn rule(package: &str, name: &str, version: &str) -> String {
    format!("{package}/{name}@{version}")
}

pub fn said(number: usize) -> String {
    format!("rule {number} of the plan")
}
'''
