description = "A setting is not handed unchanged from one function to the next through three layers: no function takes a parameter of a type the entry lists in `types` and passes it on as an argument to a function that passes it on again, three times in a row."
why = "A setting is decided once, at the edge, and injected where it is used. A parameter that three functions in a row only hand to the next is a value drilled down through layers that do not use it: each layer's signature carries it, each caller must have it, and moving it means touching them all. The settings are the types the entry lists in `types`, matched against the type as written in the parameter's annotation (`&Settings`, `Option<WorkerCount>`). A hand-over is a call that passes the parameter by its name alone (behind a `&`, a `&mut` or a `*`) and the callee is a function or method of the project whose name no other function or method of it has; the argument is followed to the callee's parameter of the same place (`self` is place zero of a method called as `x.method(..)`). A call is reported when the function it calls hands the setting on, and the function that receives it from that call hands it on again. Not seen: a setting passed in a struct or read from a field, a callee whose name is declared twice, a callee outside the project."

query = '''
param types: set<string>;
let settings = select p."id" as "param", p."owner" as "fn", p."name" as "name", p."ordinal" as "ordinal" from "parameter" as p join "annotates" as a on p."id" = a."owner" where glob_any(a."annotation", $types);
let sent = select c."position" as "position", c."passes" as "passes", c."call" as "call", s."owner" as "fn", s."target" as "callee", s."file" as "file", s."span" as "span" from "call-argument" as c join "static-call" as s on c."call" = s."occurrence" where c."passes" != "";
let plain = select s."position" as "position", s."passes" as "passes", s."call" as "call", s."fn" as "fn", s."callee" as "cname", s."file" as "file", s."span" as "span" from sent as s where not glob_any(s."callee", "*::*");
let qualified = select * from sent where glob_any(callee, "*::*");
let split = capture(from=qualified, path="callee", pattern="{*prefix}::{name}", captures=["prefix", "name"]);
let tails = select t."position" as "position", t."passes" as "passes", t."call" as "call", t."fn" as "fn", t."name" as "cname", t."file" as "file", t."span" as "span" from split as t where not glob_any(t."name", "*::*");
let called = union(left=plain, right=tails);
let forwards = select f."fn" as "fn", f."name" as "name", f."ordinal" as "ordinal", s."call" as "call", s."position" as "position", s."cname" as "cname", s."file" as "file", s."span" as "span" from settings as f join called as s on f."fn" = s."fn" and f."name" = s."passes";
let named = select d."id" as "fn", d."name" as "fname" from "defines" as d where d."kind" = "function" or d."kind" = "method";
let counted = group-count(from=named, keys=["fname"], count="n");
let unique = select * from counted where n = 1;
let known = select n."fn" as "fn", n."fname" as "fname" from named as n join unique as u on n."fname" = u."fname";
let into = select f."call" as "call", f."file" as "file", f."span" as "span", f."position" as "position", k."fn" as "target" from forwards as f join known as k on f."cname" = k."fname";
let onward = select f."fn" as "fn", f."ordinal" as "ordinal", f."call" as "call" from forwards as f join into as k on f."call" = k."call";
let hops = select i."call" as "call", i."file" as "file", i."span" as "span", g."call" as "next" from into as i join onward as g on i."target" = g."fn" and i."position" = g."ordinal";
let chain = select h."call" as "call", h."file" as "file", h."span" as "span" from hops as h join hops as g on h."next" = g."call";
let found = project(from=chain, columns=["file", "span"]);
emit found subject "file" key("span");
'''

[params.types]
type = "set<string>"
description = "The setting types, as globs over a parameter's type as written (such as `*Settings*`, `*Budget*`)."

[diagnostic]
primary = "span"
message = "this call hands a setting on unchanged, and the function it calls and the one after hand it on again"
help = "Decide the setting once at the edge and inject it where it is used: into the factory that builds the adapter or the struct that owns the work, not through each function between. An ignore is never the fix."

[given]
include = ['**/*.rs']
exclude = ['**/tests/**', '**/*_test.rs']
params = { types = ['*Setting*', '*Budget*', '*Workers*', '*Config*'] }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'three-layers-hand-a-setting-on'
scenario = 'A setting handed on by three functions in a row is reported at the first call.'
given.files.'src/lib.rs' = '''
pub struct Settings;

pub fn top(settings: &Settings, n: u8) {
    middle(settings, n);
}

fn middle(config: &Settings, n: u8) {
    lower(n, config);
}

fn lower(n: u8, setting: &Settings) {
    bottom(setting);
}

fn bottom(used: &Settings) {
    consume(used.clone());
}

fn consume(_x: Settings) {}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'methods-and-qualified-calls-are-followed'
scenario = 'A setting handed on through a method call, an associated function and a qualified path is reported at the first call.'
given.files.'src/lib.rs' = '''
pub struct Settings;

pub struct Runner;

impl Runner {
    pub fn top(&self, settings: &Settings, n: u8) {
        self.middle(settings, n);
    }

    fn middle(&self, config: &Settings, n: u8) {
        Self::lower(n, config);
    }

    fn lower(n: u8, setting: &Settings) {
        crate::bottom(&setting);
    }
}

fn bottom(used: &Settings) {
    consume(used.clone());
}

fn consume(_x: Settings) {}
'''
then.findings = [
  { path = 'src/lib.rs', line = 7 },
]

[[scenarios]]
id = 'two-layers'
scenario = 'A setting handed on by two functions, the last of which uses it, is not reported.'
given.files.'src/lib.rs' = '''
pub struct Settings;

pub fn top(settings: &Settings) {
    middle(settings);
}

fn middle(config: &Settings) {
    bottom(config);
}

fn bottom(used: &Settings) {
    consume(used.clone());
}

fn consume(_x: Settings) {}
'''

[[scenarios]]
id = 'a-layer-that-changes-the-setting'
scenario = 'A layer that passes something made from the setting, not the setting, ends the chain.'
given.files.'src/lib.rs' = '''
pub struct Settings;

pub fn top(settings: &Settings) {
    middle(settings);
}

fn middle(config: &Settings) {
    lower(config.clone());
}

fn lower(setting: Settings) {
    bottom(&setting);
}

fn bottom(used: &Settings) {
    let _ = used;
}
'''

[[scenarios]]
id = 'a-callee-declared-twice'
scenario = 'A callee whose name two functions declare is not followed.'
given.files.'src/lib.rs' = '''
pub struct Settings;

pub fn top(settings: &Settings) {
    middle(settings);
}

fn middle(config: &Settings) {
    lower(config);
}

fn lower(setting: &Settings) {
    bottom(setting);
}

fn bottom(used: &Settings) {
    let _ = used;
}

pub mod other {
    pub fn lower(setting: &super::Settings) {
        let _ = setting;
    }
}
'''

[[scenarios]]
id = 'not-a-setting'
scenario = 'A value of a type the entry does not list, handed on three times, is not reported.'
given.files.'src/lib.rs' = '''
pub struct Table;

pub fn top(table: &Table) {
    middle(table);
}

fn middle(table: &Table) {
    lower(table);
}

fn lower(table: &Table) {
    bottom(table);
}

fn bottom(table: &Table) {
    let _ = table;
}
'''
