[[scenarios]]
id = 'library-inside'
scenario = 'The library is used inside the crate: in function bodies, private fields, crate-visible items, a public field of a crate-visible struct, a trait implementation that is no contract and a contract method body.'
given.files.'src/lib.rs' = '''
//! A crate that implements its concern with a library and hands across only its own types.

use contract_sdk::Walk;
use parser_lib::Tree;
use parser_lib::nested as nest;

mod reading;

/// The crate's own answer.
pub struct Answer {
    /// The count.
    pub count: usize,
    tree: Tree,
}

pub(crate) struct Cached {
    pub tree: Tree,
}

pub(crate) type Inner = parser_lib::Node<u8>;

/// Reads one text.
pub fn read(text: &str) -> Answer {
    let tree: Tree = parser_lib::parse(text);
    let _out: nest::Out = nest::out();
    Answer { count: 0, tree }
}

pub(crate) fn walk_inside(tree: &parser_lib::Tree) -> Tree {
    tree.clone()
}

impl parser_lib::Visit for Answer {
    type Node = parser_lib::Node<u8>;
}

impl Walk for Answer {
    type Output = Answer;
    fn walk(&self) -> usize {
        let _node: parser_lib::Node<u8> = parser_lib::node();
        self.count
    }
}
'''
given.files.'src/reading.rs' = '''
//! A module added beside the root: its public items are crate-visible, and the library stays inside them.

use parser_lib as pl;

pub(crate) fn tokens(tree: &pl::Tree) -> Vec<pl::Token> {
    tree.tokens()
}

pub(crate) fn span(tree: &pl::Tree) -> tree_lib::Span {
    tree.span()
}
'''

[[scenarios]]
id = 'library-crosses'
scenario = 'Library types cross the boundary: a qualified parameter, an imported return type, a type reached through an import alias, a generic bound, a public field of a public struct, a public type alias, a public enum variant, a public trait method, a contract associated type, a contract reached by an import, a `pub use`, a public function of a newly added module whose crate is renamed, and a type of a domain library.'
given.files.'src/lib.rs' = '''
//! A crate that leaks its library across its boundary.

use contract_sdk::Project;
use parser_lib::Tree;
use parser_lib::nested as nest;

pub mod reading;

/// The crate's answer, which leaks the tree.
pub struct Answer {
    /// The tree.
    pub tree: Tree,
}

/// A name for the library's node.
pub type Node = parser_lib::Node<u8>;

/// A kind.
pub enum Kind {
    /// A leaf of the library.
    Leaf(parser_lib::Leaf),
}

/// Reads one tree.
pub fn read(tree: &parser_lib::Tree) -> Option<nest::Out> {
    let _ = tree;
    None
}

/// Visits a tree.
pub fn visit<V: parser_lib::Visit>(visitor: V) {
    let _ = visitor;
}

/// A port.
pub trait Port {
    /// Reads.
    fn read(&self) -> Tree;
}

impl contract_sdk::Walk for Answer {
    type Output = parser_lib::Tree;
}

impl Project for Answer {
    type Output = Tree;
}

pub use parser_lib::Exported;
'''
given.files.'src/reading.rs' = '''
//! A module added beside the root, reachable from it.

use parser_lib as pl;

/// The tokens of a tree.
pub fn tokens(text: &str) -> Vec<pl::Token> {
    let _ = text;
    Vec::new()
}

/// The span of a tree, a type of the library the domain reads in place.
pub fn span() -> tree_lib::Span {
    tree_lib::Span::default()
}
'''
