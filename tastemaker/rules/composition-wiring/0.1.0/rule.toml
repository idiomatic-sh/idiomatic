description = "Production dependency selection belongs to build; compose and its helpers wire supplied dependencies without returning to production builders."
why = "A caller replacing one dependency must run the production wiring with that substitution intact. Concrete factory, adapter and SDK-entry paths belong inside build or build_* function bodies, including their request-scoped constructor closures. compose and its helpers receive the constructed ports or constructor callbacks. They cannot name production builders, even as function values. This is a syntax boundary: factory/adapters/entries path segments and build/build_* names are checked, including use aliases at their import. Associated implementation bodies are checked by the compiler pass, which alone can distinguish the certified provider bootstrap from a same-named trait. Resolved aliases, inferred Default and macro expansion also require that compiler construction-boundary check; dependency consumption and shared identity require the composition's behavioral substitution proofs."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let functions = select * from tree-nodes where kind = "fn";
let names = select * from tree-nodes where kind = "name";
let name-edges = select l."id" as "id", r."child" as "token" from names as l join "syntax-child" as r on l."id" = r."parent";
let name-words = select l."id" as "id", r."text" as "text" from name-edges as l join tree-tokens as r on l."token" = r."id";
let function-children = select l."id" as "function", r."child" as "child" from functions as l join "syntax-child" as r on l."id" = r."parent";
let named-functions = select l."function" as "id", r."text" as "name" from function-children as l join name-words as r on l."child" = r."id";
let builders = select * from named-functions where glob_any(name, "{build,build_*}");
let builder-nodes = select l."id" as "id", l."file" as "file", l."span" as "span" from functions as l join builders as r on l."id" = r."id";
let other-functions = antijoin(left=functions, right=builders, left-on=["id"], right-on=["id"]);
let builder-descendants = axis(from=builder-nodes, relation="syntax-child", direction=descendant, domain=tree-nodes);
let other-descendants = axis(from=other-functions, relation="syntax-child", direction=descendant, domain=tree-nodes);
let builder-ids = project(from=builder-descendants, columns=["related"]);
let other-ids = project(from=other-descendants, columns=["related"]);
let references = select * from tree-nodes where kind = "name-ref";
let reference-edges = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "token" from references as l join "syntax-child" as r on l."id" = r."parent";
let words = select l."id" as "id", l."file" as "file", l."span" as "span", r."text" as "text" from reference-edges as l join tree-tokens as r on l."token" = r."id";
let paths = select * from tree-nodes where kind = "path";
let path-children = select l."id" as "file", r."child" as "child" from paths as l join "syntax-child" as r on l."id" = r."parent";
let qualified-paths = select l."file" as "id" from path-children as l join paths as r on l."child" = r."id";
let qualified-nodes = select l."id" as "id", l."file" as "file", l."span" as "span" from paths as l join qualified-paths as r on l."id" = r."id";
let qualified-descendants = axis(from=qualified-nodes, relation="syntax-child", direction=descendant, domain=tree-nodes);
let path-words = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from words as l join qualified-descendants as r on l."id" = r."related";
let concrete = select * from path-words where glob_any(text, "{factory,adapters,entries,use_case}");
let outside-builders = antijoin(left=concrete, right=builder-ids, left-on=["id"], right-on=["related"]);
let in-other-functions = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from concrete as l join other-ids as r on l."id" = r."related";
let concrete-findings = union(left=outside-builders, right=in-other-functions);
let segments = select * from tree-nodes where kind = "path-segment";
let segment-children = select r."child" as "child" from segments as l join "syntax-child" as r on l."id" = r."parent";
let segment-words = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from words as l join segment-children as r on l."id" = r."child";
let named-builder-references = select * from segment-words where glob_any(text, "{build,build_*}");
let method-calls = select * from tree-nodes where kind = "method-call-expr";
let expressions = select * from tree-nodes where kind = "path-expr";
let method-children = select r."child" as "child" from method-calls as l join "syntax-child" as r on l."id" = r."parent";
let receiver-expressions = select l."id" as "id", l."file" as "file", l."span" as "span" from expressions as l join method-children as r on l."id" = r."child";
let receiver-children = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from receiver-expressions as l join "syntax-child" as r on l."id" = r."parent";
let receiver-paths = select l."id" as "id", l."file" as "file", l."span" as "span", r."id" as "receiver" from receiver-children as l join paths as r on l."child" = r."id";
let simple-receivers = antijoin(left=receiver-paths, right=qualified-paths, left-on=["receiver"], right-on=["id"]);
let receivers = project(from=simple-receivers, columns=["id", "file", "span"]);
let receiver-descendants = axis(from=receivers, relation="syntax-child", direction=descendant, domain=tree-nodes);
let receiver-words = project(from=receiver-descendants, columns=["related"]);
let builder-references = antijoin(left=named-builder-references, right=receiver-words, left-on=["id"], right-on=["related"]);
let bypasses = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from builder-references as l join other-ids as r on l."id" = r."related";
let all-findings = union(left=concrete-findings, right=bypasses);
let implementations = select * from tree-nodes where kind = "impl";
let implementation-descendants = axis(from=implementations, relation="syntax-child", direction=descendant, domain=tree-nodes);
let implementation-ids = project(from=implementation-descendants, columns=["related"]);
let findings = antijoin(left=all-findings, right=implementation-ids, left-on=["id"], right-on=["related"]);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{text}` selects production dependencies outside a production builder"
help = "Construct defaults inside build/build_*, supply typed ports or request-scoped constructors through Parts, and let compose wire them. A helper called by compose must receive its dependencies too; calling a production builder or hiding the choice behind an alias does not preserve substitution."

[given]
include = ['src/commands/**/composition.rs']

[[scenarios]]
id = 'alias'
scenario = 'Alias: it is reported.'
given.files.'src/commands/check/run/composition.rs' = '''
use cache::factory::memory as chosen;
pub fn compose(_supplied: usize) -> usize { chosen() }
pub fn build() -> usize { compose(7) }
'''
then.findings = [
  { path = 'src/commands/check/run/composition.rs', line = 1 },
]

[[scenarios]]
id = 'builder-bypass'
scenario = 'Builder-bypass: it is reported.'
given.files.'src/commands/check/run/composition.rs' = '''
pub fn compose(_supplied: usize) -> usize { build_native() }
fn build_native() -> usize { cache::factory::memory() }
pub fn build() -> usize { compose(7) }
'''
then.findings = [
  { path = 'src/commands/check/run/composition.rs', line = 1 },
]

