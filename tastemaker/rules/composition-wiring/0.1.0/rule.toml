[[scenarios]]
id = 'production-callback'
scenario = 'Production-callback: nothing is reported.'
given.files.'src/commands/check/run/composition.rs' = '''
pub struct CheckRunParts<F> { pub cache: F }
pub fn compose<F: Fn(usize) -> usize>(parts: CheckRunParts<F>) -> usize { (parts.cache)(7) }
pub fn build() -> usize {
    use cache::factory::memory as chosen;
    compose(CheckRunParts { cache: |value| chosen(value) })
}
'''

