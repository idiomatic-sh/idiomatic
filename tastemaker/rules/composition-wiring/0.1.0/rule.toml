[[scenarios]]
id = 'supplied'
scenario = 'Supplied: nothing is reported.'
given.files.'src/commands/check/run/composition.rs' = '''
pub struct CheckRunParts<F> { pub factory: F, pub build: usize }
pub fn compose<F: Fn(usize) -> usize>(parts: CheckRunParts<F>) -> usize {
    let factory = parts.factory;
    factory(parts.build)
}
pub fn build() -> usize {
    compose(CheckRunParts { factory: |value| value + 1, build: 7 })
}

fn built_key(build: &'static str) -> usize {
    build.len() + build.as_bytes().len()
}
'''

