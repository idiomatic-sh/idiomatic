description = "Only an edge names a `factory` module: a path segment `factory` in a use or an expression is a finding in the files its entry reaches, which leave the edges out."
why = "Composition is the edge's concern, one per CLI command. A factory only constructs its adapter from its parameters; the edge chooses implementations, builds each shared resource once and passes it on. A use case, an adapter or another factory calling a factory hides a choice and a construction from the edge. The entry reaches every file but the edges: each command's `composition.rs`, SDK consumers, tests and benches. An edge connections.rs may name a direct `factory::<Name>Connection` resource handle or its constructor, to open it before composition binds an adapter. Factory functions and adapter implementation names remain forbidden there. This is a syntax/path check, not proof of resource behavior. A local binding called `factory` is read as the module; declaring it (`pub mod factory;`) is not a finding."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let name-refs = select * from tree-nodes where kind = "name-ref";
let ref-edges = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "token" from name-refs as l join "syntax-child" as r on l."id" = r."parent";
let ref-texts = select l."id" as "id", l."file" as "file", l."span" as "span", r."text" as "text" from ref-edges as l join tree-tokens as r on l."token" = r."id";
let factories = select * from ref-texts where text = "factory";
let segments = select * from tree-nodes where kind = "path-segment";
let paths = select * from tree-nodes where kind = "path";
let named-segment-edges = select l."parent" as "segment", r."id" as "name" from "syntax-child" as l join name-refs as r on l."child" = r."id";
let named-segments = select l."segment" as "segment", r."text" as "text" from named-segment-edges as l join ref-texts as r on l."name" = r."id";
let path-segments = select l."parent" as "path", r."id" as "segment" from "syntax-child" as l join segments as r on l."child" = r."id";
let path-names = select l."path" as "path", r."text" as "text" from path-segments as l join named-segments as r on l."segment" = r."segment";
let factory-segments = select l."id" as "id", l."file" as "file", l."span" as "span", r."segment" as "segment" from factories as l join named-segment-edges as r on l."id" = r."name";
let factory-paths = select l."file" as "file", l."span" as "span", r."path" as "path" from factory-segments as l join path-segments as r on l."segment" = r."segment";
let path-parents = select l."parent" as "outer", r."id" as "inner" from "syntax-child" as l join paths as r on l."child" = r."id";
let following-paths = select l."file" as "file", l."span" as "span", r."outer" as "path" from factory-paths as l join path-parents as r on l."path" = r."inner";
let following-names = select l."file" as "file", l."span" as "span", r."text" as "text" from following-paths as l join path-names as r on l."path" = r."path";
let resource-access = select * from following-names where glob_any(file, "**/connections.rs") and glob_any(text, "*Connection");
let forbidden = antijoin(left=factories, right=resource-access, left-on=["file", "span"], right-on=["file", "span"]);
let findings = project(from=forbidden, columns=["file", "span", "text"]);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "a factory is named outside an edge"
help = "Take the built port as a parameter here, and call the factory only at the edge that composes: the command's `composition.rs`, an SDK consumer, a test or a bench. A use case, an adapter or a factory never calls a factory, so an ignore is never the fix."

[given]
include = ['**']

[[scenarios]]
id = 'command-s-composition-calls-factory'
scenario = "A command's composition calls a factory."
given.exclude = ['src/commands/**/composition.rs', '**/*_test.rs', 'tests/**', 'benches/**']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/commands/check/run/composition.rs' = '''
pub fn build() -> impl Sized {
    crate::storage::factory::memory()
}
'''
given.files.'src/lib.rs' = '''
pub mod commands;
pub mod storage;
'''
given.files.'src/storage.rs' = '''
pub mod factory;
'''
given.files.'src/storage/factory.rs' = '''
pub fn memory() -> impl Sized {}
'''

[[scenarios]]
id = 'test-calls-factory'
scenario = 'A test calls a factory.'
given.exclude = ['src/commands/**/composition.rs', '**/*_test.rs', 'tests/**', 'benches/**']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/check/use_cases/run/use_case_test.rs' = '''
use crate::storage::factory;

#[test]
fn run_succeeds() {
    let _ = factory::memory();
}
'''
given.files.'src/lib.rs' = '''
pub mod commands;
pub mod storage;
'''
given.files.'src/storage.rs' = '''
pub mod factory;
'''
given.files.'src/storage/factory.rs' = '''
pub fn memory() -> impl Sized {}
'''

[[scenarios]]
id = 'use-case'
scenario = 'A use case calls a factory.'
given.exclude = ['src/commands/**/composition.rs', '**/*_test.rs', 'tests/**', 'benches/**']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/check/use_cases/run/use_case.rs' = '''
pub fn run() {
    let _ = crate::storage::factory::memory();
}
'''
given.files.'src/lib.rs' = '''
pub mod commands;
pub mod storage;
'''
given.files.'src/storage.rs' = '''
pub mod factory;
'''
given.files.'src/storage/factory.rs' = '''
pub fn memory() -> impl Sized {}
'''
then.findings = [
  { path = 'src/check/use_cases/run/use_case.rs', line = 2 },
]

