description = "Every item module a collection declares is named in its catalog: each `mod <item>;` of a `collection` file, other than the modules `except` lists, is an identifier written in a `catalog` file."
why = "A collection whose list is generated by a macro (a catalog that hands every item to the code that handles each one) is complete only when the macro lists every item. A module that compiles but that the catalog omits is an item nothing answers and no listing shows: for relations, one no language reads and `explain` never names. The other direction, a catalog naming a module that does not exist, does not compile, and a folder no `mod` declares is `orphan-rust-files`' finding. Read syntactically: the items are the modules the collection file declares, and an item is listed when its name is an identifier anywhere in a catalog file, macro bodies included."

query = '''
param collection: set<string>;
param catalog: set<string>;
param except: set<string>;
let items = select name, file, span from "defines" where kind = "namespace" and glob_any(file, $collection) and not glob_any(name, $except);
let words = select text as name from "syntax-tree" where kind = "ident" and glob_any(file, $catalog);
let unlisted = antijoin(left=items, right=words, left-on=["name"], right-on=["name"]);
emit unlisted subject "file" key("span");
'''

[params.collection]
type = "set<string>"
description = "The files that declare the collection's item modules, as path globs."

[params.catalog]
type = "set<string>"
description = "The files that hold the catalog the items must appear in, as path globs."

[params.except]
type = "set<string>"
description = "The modules of the collection file that are no item, as name globs: its `interface`."

[diagnostic]
primary = "span"
message = "the item `{name}` is declared but its catalog does not list it"
help = "Add the item to the catalog, in the group it belongs to, so every crate that handles each item answers it; or, if the module is no item of the collection, move it out of the collection's list."

[given]
include = ["src/**"]
params = { collection = ["src/collections/relations.rs"], catalog = ["src/catalog.rs"], except = ["interface"] }
files.'Cargo.toml' = '''
[package]
name = "catalog_fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
//! A collection and its catalog.

pub mod catalog;
pub mod collections;
'''
files.'src/collections.rs' = '''
//! The collections.

pub mod relations;
'''
files.'src/collections/relations.rs' = '''
//! The relations, one module each, and their interface.

pub mod function;
pub mod interface;
'''
files.'src/collections/relations/function.rs' = '''
//! The function relation.

pub const NAME: &str = "function";
'''
files.'src/collections/relations/interface.rs' = '''
//! What every relation answers.

pub trait RelationsItem {}
'''
files.'src/catalog.rs' = '''
//! The catalog: hands every relation to a callback macro.

#[macro_export]
macro_rules! each_relation {
    ($callback:path) => {
        $callback! { syntax { Function function FunctionRow FunctionColumn; } }
    };
}
'''

[[scenarios]]
id = "every-item-is-listed"
scenario = "The one item is listed in the catalog's macro, and the interface is no item."

[[scenarios]]
id = "an-item-the-catalog-omits"
scenario = "A module added to the collection that the catalog does not list is reported at its declaration."
given.files.'src/collections/relations.rs' = '''
//! The relations, one module each, and their interface.

pub mod comment;
pub mod function;
pub mod interface;
'''
given.files.'src/collections/relations/comment.rs' = '''
//! The comment relation.

pub const NAME: &str = "comment";
'''
then.findings = [{ path = "src/collections/relations.rs", line = 3 }]
