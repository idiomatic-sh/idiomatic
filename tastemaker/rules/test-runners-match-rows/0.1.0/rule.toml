description = "A runner `run(CASES, Word::<X>, subject)` is present exactly when the `CASES` table has a row of that case word: a row whose word has no runner, and a runner whose word has no row, are findings."
why = "A runner over no rows is an empty selection that passes whatever the part does, and a row no runner runs is a case that is never proved; so the runners of a test file are the words of its table, no more and no fewer, and a file that has no `refuses` row has no `refuses` runner. Read as written: the case word of a row is the `Word::<X>` value of a record field `word:` in the file; the case word of a runner is the `Word::<X>` argument of a call `run(CASES, ..)` inside a `#[test]` function, so a runner without the attribute runs nothing and does not count. A runner over another table, `run(CONTRACT, ..)`, is not a runner of this file's table and is not seen; a row or a runner written by a macro is not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let name-refs = select * from tree-nodes where kind = "name-ref";
let paths = select * from tree-nodes where kind = "path";
let segments = select * from tree-nodes where kind = "path-segment";
let path-exprs = select * from tree-nodes where kind = "path-expr";
let fields = select * from tree-nodes where kind = "record-expr-field";
let field-edges = select l."id" as "field", l."file" as "file", r."child" as "node" from fields as l join "syntax-child" as r on l."id" = r."parent";
let field-names = select l."field" as "field", l."file" as "file", l."node" as "ref" from field-edges as l join name-refs as r on l."node" = r."id";
let field-name-tokens = select l."field" as "field", l."file" as "file", r."child" as "token" from field-names as l join "syntax-child" as r on l."ref" = r."parent";
let field-name-texts = select l."field" as "field", l."file" as "file", r."text" as "text" from field-name-tokens as l join tree-tokens as r on l."token" = r."id";
let word-fields = select * from field-name-texts where text = "word";
let word-field-ids = project(from=word-fields, columns=["field"]);
let value-exprs = select l."field" as "field", l."file" as "file", r."span" as "span", r."id" as "expr" from field-edges as l join path-exprs as r on l."node" = r."id";
let word-values = select l."file" as "file", l."span" as "span", l."expr" as "expr" from value-exprs as l join word-field-ids as r on l."field" = r."field";
let row-path-edges = select l."file" as "file", l."span" as "span", r."child" as "node" from word-values as l join "syntax-child" as r on l."expr" = r."parent";
let row-paths = select l."file" as "file", l."span" as "span", l."node" as "word-path" from row-path-edges as l join paths as r on l."node" = r."id";
let row-segment-edges = select l."file" as "file", l."span" as "span", r."child" as "node" from row-paths as l join "syntax-child" as r on l."word-path" = r."parent";
let row-segments = select l."file" as "file", l."span" as "span", l."node" as "segment" from row-segment-edges as l join segments as r on l."node" = r."id";
let row-ref-edges = select l."file" as "file", l."span" as "span", r."child" as "node" from row-segments as l join "syntax-child" as r on l."segment" = r."parent";
let row-refs = select l."file" as "file", l."span" as "span", l."node" as "ref" from row-ref-edges as l join name-refs as r on l."node" = r."id";
let row-token-edges = select l."file" as "file", l."span" as "span", r."child" as "token" from row-refs as l join "syntax-child" as r on l."ref" = r."parent";
let row-words = select l."file" as "file", l."span" as "span", r."text" as "word" from row-token-edges as l join tree-tokens as r on l."token" = r."id";
let calls = select * from tree-nodes where kind = "call-expr";
let call-edges = select l."id" as "site", l."file" as "file", r."child" as "node" from calls as l join "syntax-child" as r on l."id" = r."parent";
let callee-exprs = select l."site" as "site", l."file" as "file", l."node" as "callee" from call-edges as l join path-exprs as r on l."node" = r."id";
let callee-path-edges = select l."site" as "site", l."file" as "file", r."child" as "node" from callee-exprs as l join "syntax-child" as r on l."callee" = r."parent";
let callee-paths = select l."site" as "site", l."file" as "file", l."node" as "callee-path" from callee-path-edges as l join paths as r on l."node" = r."id";
let callee-segment-edges = select l."site" as "site", l."file" as "file", r."child" as "node" from callee-paths as l join "syntax-child" as r on l."callee-path" = r."parent";
let callee-segments = select l."site" as "site", l."file" as "file", l."node" as "segment" from callee-segment-edges as l join segments as r on l."node" = r."id";
let callee-ref-edges = select l."site" as "site", l."file" as "file", r."child" as "node" from callee-segments as l join "syntax-child" as r on l."segment" = r."parent";
let callee-refs = select l."site" as "site", l."file" as "file", l."node" as "ref" from callee-ref-edges as l join name-refs as r on l."node" = r."id";
let callee-token-edges = select l."site" as "site", l."file" as "file", r."child" as "token" from callee-refs as l join "syntax-child" as r on l."ref" = r."parent";
let callee-texts = select l."site" as "site", l."file" as "file", r."text" as "text" from callee-token-edges as l join tree-tokens as r on l."token" = r."id";
let run-callees = select * from callee-texts where text = "run";
let run-sites = project(from=run-callees, columns=["site", "file"]);
let fns = select * from tree-nodes where kind = "fn";
let fn-edges = select l."id" as "fn", r."child" as "node" from fns as l join "syntax-child" as r on l."id" = r."parent";
let attrs = select * from tree-nodes where kind = "attr";
let fn-attrs = select l."fn" as "fn", l."node" as "attr" from fn-edges as l join attrs as r on l."node" = r."id";
let attr-edges = select l."fn" as "fn", r."child" as "node" from fn-attrs as l join "syntax-child" as r on l."attr" = r."parent";
let path-metas = select * from tree-nodes where kind = "path-meta";
let fn-metas = select l."fn" as "fn", l."node" as "meta" from attr-edges as l join path-metas as r on l."node" = r."id";
let meta-edges = select l."fn" as "fn", r."child" as "node" from fn-metas as l join "syntax-child" as r on l."meta" = r."parent";
let meta-paths = select l."fn" as "fn", l."node" as "attr-path" from meta-edges as l join paths as r on l."node" = r."id";
let attr-path-edges = select l."fn" as "fn", r."child" as "node" from meta-paths as l join "syntax-child" as r on l."attr-path" = r."parent";
let attr-segments = select l."fn" as "fn", l."node" as "segment" from attr-path-edges as l join segments as r on l."node" = r."id";
let attr-segment-edges = select l."fn" as "fn", r."child" as "node" from attr-segments as l join "syntax-child" as r on l."segment" = r."parent";
let attr-refs = select l."fn" as "fn", l."node" as "ref" from attr-segment-edges as l join name-refs as r on l."node" = r."id";
let attr-token-edges = select l."fn" as "fn", r."child" as "token" from attr-refs as l join "syntax-child" as r on l."ref" = r."parent";
let attr-texts = select l."fn" as "fn", r."text" as "text" from attr-token-edges as l join tree-tokens as r on l."token" = r."id";
let test-attrs = select * from attr-texts where text = "test";
let test-fns = select l."fn" as "id" from test-attrs as l join fns as r on l."fn" = r."id";
let test-calls = axis(from=test-fns, relation="syntax-child", direction=descendant, domain=calls);
let test-run-sites = select l."site" as "site", l."file" as "file" from run-sites as l join test-calls as r on l."site" = r."related";
let arg-lists = select * from tree-nodes where kind = "arg-list";
let arg-list-edges = select l."site" as "site", l."file" as "file", r."child" as "node" from test-run-sites as l join "syntax-child" as r on l."site" = r."parent";
let run-arg-lists = select l."site" as "site", l."file" as "file", l."node" as "list" from arg-list-edges as l join arg-lists as r on l."node" = r."id";
let arg-expr-edges = select l."site" as "site", l."file" as "file", r."child" as "node" from run-arg-lists as l join "syntax-child" as r on l."list" = r."parent";
let arg-exprs = select l."site" as "site", l."file" as "file", r."span" as "span", r."id" as "expr" from arg-expr-edges as l join path-exprs as r on l."node" = r."id";
let arg-path-edges = select l."site" as "site", l."file" as "file", l."span" as "span", r."child" as "node" from arg-exprs as l join "syntax-child" as r on l."expr" = r."parent";
let arg-paths = select l."site" as "site", l."file" as "file", l."span" as "span", l."node" as "arg-path" from arg-path-edges as l join paths as r on l."node" = r."id";
let arg-segment-edges = select l."site" as "site", l."file" as "file", l."span" as "span", r."child" as "node" from arg-paths as l join "syntax-child" as r on l."arg-path" = r."parent";
let arg-segments = select l."site" as "site", l."file" as "file", l."span" as "span", l."node" as "segment" from arg-segment-edges as l join segments as r on l."node" = r."id";
let arg-ref-edges = select l."site" as "site", l."file" as "file", l."span" as "span", r."child" as "node" from arg-segments as l join "syntax-child" as r on l."segment" = r."parent";
let arg-refs = select l."site" as "site", l."file" as "file", l."span" as "span", l."node" as "ref" from arg-ref-edges as l join name-refs as r on l."node" = r."id";
let arg-token-edges = select l."site" as "site", l."file" as "file", l."span" as "span", r."child" as "token" from arg-refs as l join "syntax-child" as r on l."ref" = r."parent";
let arg-texts = select l."site" as "site", l."file" as "file", l."span" as "span", r."text" as "text" from arg-token-edges as l join tree-tokens as r on l."token" = r."id";
let table-args = select * from arg-texts where text = "CASES";
let table-sites = project(from=table-args, columns=["site"]);
let word-args = select * from arg-texts where glob_any(text, "{Succeeds,Refuses,Fails,Rejects}");
let table-word-args = select l."file" as "file", l."span" as "span", l."text" as "word" from word-args as l join table-sites as r on l."site" = r."site";
let runner-keys = project(from=table-word-args, columns=["file", "word"]);
let row-keys = project(from=row-words, columns=["file", "word"]);
let rows-without-runner = antijoin(left=row-words, right=runner-keys, left-on=["file", "word"], right-on=["file", "word"]);
let runners-without-row = antijoin(left=table-word-args, right=row-keys, left-on=["file", "word"], right-on=["file", "word"]);
let row-findings = extend(from=rows-without-runner, values={"problem": "has a row in `CASES` and no runner `run(CASES, Word::<word>, subject)`"});
let runner-findings = extend(from=runners-without-row, values={"problem": "has a runner and no row in `CASES`"});
let findings = union(left=row-findings, right=runner-findings);
emit findings subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "the case word `{word}` {problem}"
help = "Make the runners the words of the table: add the `#[test]` runner `run(CASES, Word::<word>, subject)` for a case word the table has rows of, and remove the runner of a case word the table has no row of (or add the row it runs)."

[given]
include = ['**/*_test.rs']

[[scenarios]]
id = 'rows-and-runners-match'
scenario = 'A runner for each word the table has rows of.'
given.files.'src/greeting/domain/short/service_test.rs' = '''
//! Proves the short service.

use crate::cases::{Case, Expect, Word, run};

const CASES: &[Case<u8, u8, Failure>] = &[
    Case { name: "one stays one", word: Word::Succeeds, input: one, expect: Expect::Value(1) },
    Case { name: "zero is refused", word: Word::Refuses, input: zero, expect: Expect::Error(Failure::Empty) },
];

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}

#[test]
fn refuses() {
    run(CASES, Word::Refuses, subject);
}
'''

[[scenarios]]
id = 'one-word-one-runner'
scenario = 'A table of one word and its one runner.'
