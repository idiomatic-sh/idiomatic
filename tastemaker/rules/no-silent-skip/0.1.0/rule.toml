description = "No test says it passes over a case and goes on: a branch that prints and then continues or returns without an error is a skip."
why = "A test that writes \"`cargo` is not installed, so the fixed program is not built\" and moves to the next case passes while proving nothing, and the line it prints is read by no one in a green run. A case the test cannot run is a failure: the tool the case needs is required. Read in test code: an `if` branch or a `let … else` block whose statements print (`println!`, `eprintln!`, `print!`, `eprint!`, or a write to `stdout()` or `stderr()`) and that ends the case with `continue` or with a `return` that carries no `Err` and no panic. `#[ignore]` is `no-ignored-tests`'s, and a probe that asks only whether a tool started is `exit-status-checked`'s."

query = '''
let tree = select l."id" as "id", l."kind" as "kind", l."text" as "text", l."file" as "file", l."span" as "span" from "syntax-tree" as l;
let lists = select * from tree where kind = "stmt-list";
let list-blocks = select l."id" as "list", r."parent" as "block" from lists as l join "syntax-child" as r on l."id" = r."child";
let block-owners = select l."list" as "list", r."parent" as "owner" from list-blocks as l join "syntax-child" as r on l."block" = r."child";
let branch-kinds = select * from tree where kind = "if-expr" or kind = "let-else";
let branches = select l."list" as "list" from block-owners as l join branch-kinds as r on l."owner" = r."id";
let statements = select l."list" as "list", r."child" as "statement" from branches as l join "syntax-child" as r on l."list" = r."parent";
let wrapped = select l."list" as "list", r."child" as "statement" from statements as l join "syntax-child" as r on l."statement" = r."parent";
let reached = union(left=statements, right=wrapped);
let exits = select l."list" as "list", l."statement" as "exit", r."file" as "file", r."span" as "span" from reached as l join tree as r on l."statement" = r."id" where r."kind" = "continue-expr" or r."kind" = "return-expr";
let exit-nodes = select l."exit" as "id" from exits as l;
let exit-below = axis(from=exit-nodes, relation="syntax-child", direction=descendant, domain=tree);
let failing = select l."id" as "exit" from exit-below as l join tree as r on l."related" = r."id" where r."kind" = "ident" and glob_any(r."text", "{Err,panic,unreachable,todo,unimplemented}");
let quiet = antijoin(left=exits, right=failing, left-on=["exit"], right-on=["exit"]);
let statement-nodes = select l."statement" as "id", l."list" as "list" from statements as l;
let statement-below = axis(from=statement-nodes, relation="syntax-child", direction=descendant, domain=tree);
let printing = select l."list" as "list" from statement-below as l join tree as r on l."related" = r."id" where r."kind" = "ident" and glob_any(r."text", "{eprintln,println,eprint,print,stderr,stdout}");
let found = select l."file" as "file", l."span" as "span" from quiet as l join printing as r on l."list" = r."list";
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this case says it is passed over and goes on: a skip the green run hides"
help = "Fail the case instead: return the error, or assert, naming what is missing (`return Err(format!(\"`{program}` is not installed\"))`). A tool the case needs is installed by the repository's tool installer and required by the test, never probed and passed over."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'sample-passed-over-when-its-tool-is-missing'
scenario = 'A sample whose toolchain is not installed is said on stderr and passed over, as the samples replay test did at 861e39f970.'
given.files.'tests/samples.rs' = '''
use std::io::Write as _;
fn fixed_programs_build_and_pass(samples: &[Sample]) -> Vec<String> {
    let mut failures = Vec::new();
    for sample in samples {
        let case = format!("{}: every row fixed", sample.name);
        if let Some(missing) = sample
            .commands
            .iter()
            .filter_map(|command| command.first())
            .find(|program| !installed(program))
        {
            drop(writeln!(
                std::io::stderr(),
                "{case}: `{missing}` is not installed, so the fixed program is not built or tested here"
            ));
            continue;
        }
        failures.extend(run(sample));
    }
    failures
}
fn other(path: &std::path::Path) -> Result<(), String> {
    let Ok(text) = std::fs::read_to_string(path) else {
        eprintln!("no {}, nothing to compare", path.display());
        return Ok(());
    };
    compare(&text)
}
'''
then.findings = [
  { path = 'tests/samples.rs', line = 16 },
  { path = 'tests/samples.rs', line = 25 },
]

[[scenarios]]
id = 'failures-said-and-progress-printed'
scenario = 'A branch that prints and then returns the error, one that panics, a loop that prints its progress and goes on, and a branch that passes over a row with nothing to say are not reported.'
given.files.'tests/samples.rs' = '''
fn fixed(samples: &[Sample]) -> Result<(), String> {
    for sample in samples {
        eprintln!("checking {}", sample.name);
        let Some(first) = sample.commands.first() else {
            continue;
        };
        if !installed(first) {
            eprintln!("{} is not installed", first);
            return Err(format!("`{first}` is not installed"));
        }
        if sample.rows.is_empty() {
            println!("{} has no row", sample.name);
            panic!("{} has no row to fix", sample.name);
        }
    }
    Ok(())
}
'''
