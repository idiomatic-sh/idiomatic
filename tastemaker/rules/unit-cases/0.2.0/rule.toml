scenario = "A service that wraps a dependency's error, with a test that has the failure row, is not reported."
given.files.'src/read/errors.rs' = 'pub enum Failure { Read(#[from] ReadError) }'
given.files.'src/read/service.rs' = 'fn read(error: ReadError) -> Failure { Failure::Read(error) }'
given.files.'src/read/service_test.rs' = 'const CASES: &[Case] = &[Case { word: Word::Succeeds }, Case { word: Word::Fails }];'

