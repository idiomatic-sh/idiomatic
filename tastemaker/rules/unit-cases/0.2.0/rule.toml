[[scenarios]]
id = 'namespace-whose-groups-hold-the-rows'
scenario = 'A `service_test.rs` that only declares its groups is read with the tables of its groups: their `succeeds` and `refuses` rows are its rows, and it passes.'
given.include = ['**/*.rs']
given.files.'src/greeting/domain/short/errors.rs' = '''
//! The short concept's failures.

/// Why a short operation failed.
#[derive(Debug, thiserror::Error)]
pub enum ShortError {
    /// The input was empty.
    #[error("empty")]
    Empty,
}
'''
given.files.'src/greeting/domain/short/service_test.rs' = '''
//! The short service's cases, in groups.

#[cfg(test)]
mod order;
'''
given.files.'src/greeting/domain/short/service_test/order.rs' = '#[cfg(test)] pub(super) mod test;'
given.files.'src/greeting/domain/short/service_test/order/test.rs' = '''
use crate::cases::{Case, Expect, Word, run};

const CASES: &[Case<u8, u8, Failure>] = &[
    Case { name: "one stays one", word: Word::Succeeds, input: one, expect: Expect::Value(1) },
    Case { name: "zero is refused", word: Word::Refuses, input: zero, expect: Expect::Error(Failure::Empty) },
];

#[test]
fn succeeds() {
    run(CASES, Word::Succeeds, subject);
}
'''

