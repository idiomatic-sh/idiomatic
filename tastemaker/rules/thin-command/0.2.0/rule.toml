[[scenarios]]
id = 'command-branches-if'
scenario = 'A command branches with if.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/commands.rs' = '''
pub mod greeting;
'''
given.files.'src/commands/greeting.rs' = '''
pub mod if;
'''
given.files.'src/commands/greeting/if.rs' = '''
pub mod command;
'''
given.files.'src/commands/greeting/if/command.rs' = '''
