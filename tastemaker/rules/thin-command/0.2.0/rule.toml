description = "A command parses, calls one service and presents the result: no loop, `if`, `let.. else`, `match` beyond a `Result`'s outcome, at most one service call per function, and its `run` returns `Outcome`."
why = "A command is a route handler: logic in it is logic no service's tests see and no other entry point can reuse. Its `run` returns `Outcome { Success, Failure, Error }`, exit 0, 1 and 2, so every command ends the same three ways. Read syntactically: `run` returns `Outcome` when its return type is a path whose last segment is `Outcome` (`Outcome`, `crate::outcome::Outcome`); a service call is a method call named like a method of an in-scope `*Interface` trait, made on the result of a call (`services.greeting().show(..)`), on a `let` binding initialized by a call (`let service = services.greeting();`) or on a parameter typed with an `*Interface`, or a call through a path naming an `*Interface`; a `match` is on a `Result` when an arm is `Ok(..)` or `Err(..)`. Not seen: a service reached through UFCS under another name, a file that declares a trait, and code inside macro invocations."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let functions = select * from tree-nodes where kind = "fn";
let traits = select * from tree-nodes where kind = "trait";
let trait-files = project(from=traits, columns=["file"]);
let command-functions = antijoin(left=functions, right=trait-files, left-on=["file"], right-on=["file"]);
let command-descendants = axis(from=command-functions, relation="syntax-child", direction=descendant, domain=tree-nodes);
let command-nodes = select r."id" as "function", l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from tree-nodes as l join command-descendants as r on l."id" = r."related";
let loops = select * from command-nodes where glob_any(kind, "{loop-expr,while-expr,for-expr}");
let loop-findings = extend(from=loops, values={"what": "a command loops"});
let ifs = select * from command-nodes where kind = "if-expr";
let if-findings = extend(from=ifs, values={"what": "a command branches with `if`"});
let control-findings = union(left=loop-findings, right=if-findings);
let let-elses = select * from command-nodes where kind = "let-else";
let let-else-findings = extend(from=let-elses, values={"what": "a command branches with `let .. else`"});
let branch-findings = union(left=control-findings, right=let-else-findings);
let matches = select * from command-nodes where kind = "match-expr";
let match-lists = select r."child" as "child", l."id" as "id" from matches as l join "syntax-child" as r on l."id" = r."parent";
let arm-lists = select * from tree-nodes where kind = "match-arm-list";
let match-arm-lists = select l."id" as "id", r."id" as "list" from match-lists as l join arm-lists as r on l."child" = r."id";
let match-list-children = select r."child" as "child", l."id" as "id" from match-arm-lists as l join "syntax-child" as r on l."list" = r."parent";
let arm-nodes = select * from tree-nodes where kind = "match-arm";
let arms = select r."id" as "arm", l."id" as "id" from match-list-children as l join arm-nodes as r on l."child" = r."id";
let arm-children = select l."arm" as "arm", r."child" as "child", l."id" as "id" from arms as l join "syntax-child" as r on l."arm" = r."parent";
let patterns = select * from tree-nodes where glob_any(kind, "*-pat");
let arm-patterns = select l."id" as "id", l."child" as "pattern" from arm-children as l join patterns as r on l."child" = r."id";
let tuple-patterns = select * from patterns where kind = "tuple-struct-pat";
let tuple-paths = select r."child" as "child", l."id" as "id" from tuple-patterns as l join "syntax-child" as r on l."id" = r."parent";
let paths = select * from tree-nodes where kind = "path";
let path-children = select r."child" as "child", l."id" as "id" from paths as l join "syntax-child" as r on l."id" = r."parent";
let path-segments = select * from tree-nodes where kind = "path-segment";
let segment-children = select r."child" as "child", l."id" as "id" from path-segments as l join "syntax-child" as r on l."id" = r."parent";
let name-refs = select * from tree-nodes where kind = "name-ref";
let name-ref-texts = select l."id" as "id", r."child" as "token" from name-refs as l join "syntax-child" as r on l."id" = r."parent";
let name-ref-words = select l."id" as "id", r."text" as "text" from name-ref-texts as l join tree-tokens as r on l."token" = r."id";
let outcome-words = select * from name-ref-words where glob_any(text, "{Ok,Err}");
let outcome-segments = select l."id" as "id" from segment-children as l join outcome-words as r on l."child" = r."id";
let outcome-paths = select l."id" as "id" from path-children as l join outcome-segments as r on l."child" = r."id";
let outcome-variant-patterns = select l."id" as "id" from tuple-paths as l join outcome-paths as r on l."child" = r."id";
let result-arms = select l."id" as "id" from arm-patterns as l join outcome-variant-patterns as r on l."pattern" = r."id";
let result-matches = select l."id" as "id" from matches as l join result-arms as r on l."id" = r."id";
let guards = select * from tree-nodes where kind = "match-guard";
let guarded-arms = select l."id" as "id" from arm-children as l join guards as r on l."child" = r."id";
let ident-patterns = select * from patterns where kind = "ident-pat";
let pattern-edges = select l."child" as "child", r."kind" as "kind", l."parent" as "parent" from "syntax-child" as l join patterns as r on l."child" = r."id";
let bound-idents = select l."id" as "id" from ident-patterns as l join pattern-edges as r on l."id" = r."parent";
let plain-idents = antijoin(left=ident-patterns, right=bound-idents, left-on=["id"], right-on=["id"]);
let plain-ident-ids = project(from=plain-idents, columns=["id"]);
let wildcards = select * from patterns where glob_any(kind, "{wildcard-pat,rest-pat}");
let wildcard-ids = project(from=wildcards, columns=["id"]);
let plain-patterns = union(left=plain-ident-ids, right=wildcard-ids);
let unit-candidates = select * from patterns where kind = "tuple-pat";
let nonempty-tuples = select l."id" as "id" from unit-candidates as l join pattern-edges as r on l."id" = r."parent";
let unit-patterns = antijoin(left=unit-candidates, right=nonempty-tuples, left-on=["id"], right-on=["id"]);
let unit-pattern-ids = project(from=unit-patterns, columns=["id"]);
let outcome-fields = union(left=plain-patterns, right=unit-pattern-ids);
let tuple-fields = select r."child" as "child", l."id" as "id" from tuple-patterns as l join pattern-edges as r on l."id" = r."parent";
let inspecting-fields = antijoin(left=tuple-fields, right=outcome-fields, left-on=["child"], right-on=["id"]);
let outcome-tuples = antijoin(left=tuple-patterns, right=inspecting-fields, left-on=["id"], right-on=["id"]);
let outcome-tuple-ids = project(from=outcome-tuples, columns=["id"]);
let outcome-patterns = union(left=plain-patterns, right=outcome-tuple-ids);
let inspecting-arms = antijoin(left=arm-patterns, right=outcome-patterns, left-on=["pattern"], right-on=["id"]);
let inspecting-match-ids = project(from=inspecting-arms, columns=["id"]);
let branching-matches = union(left=guarded-arms, right=inspecting-match-ids);
let outcome-matches = antijoin(left=result-matches, right=branching-matches, left-on=["id"], right-on=["id"]);
let branching-match-nodes = antijoin(left=matches, right=outcome-matches, left-on=["id"], right-on=["id"]);
let match-findings = extend(from=branching-match-nodes, values={"what": "a command matches beyond a `Result`'s outcome"});
let logic-findings = union(left=branch-findings, right=match-findings);
let method-calls = select * from command-nodes where kind = "method-call-expr";
let method-call-children = select r."child" as "child", l."function" as "function", l."id" as "id" from method-calls as l join "syntax-child" as r on l."id" = r."parent";
let method-call-names = select l."function" as "function", l."id" as "id", r."text" as "text" from method-call-children as l join name-ref-words as r on l."child" = r."id";
let function-parents = select l."id" as "id", r."parent" as "parent" from functions as l join "syntax-child" as r on l."id" = r."child";
let item-lists = select * from tree-nodes where kind = "assoc-item-list";
let trait-lists = select l."id" as "id", r."parent" as "parent" from item-lists as l join "syntax-child" as r on l."id" = r."child";
let trait-item-lists = select l."id" as "id", r."id" as "owner" from trait-lists as l join traits as r on l."parent" = r."id";
let trait-functions = select l."id" as "id", r."owner" as "owner" from function-parents as l join trait-item-lists as r on l."parent" = r."id";
let trait-children = select r."child" as "child", l."id" as "id" from traits as l join "syntax-child" as r on l."id" = r."parent";
let names = select * from tree-nodes where kind = "name";
let name-tokens = select l."id" as "id", r."child" as "token" from names as l join "syntax-child" as r on l."id" = r."parent";
let name-words = select l."id" as "id", r."text" as "text" from name-tokens as l join tree-tokens as r on l."token" = r."id";
let trait-names = select l."id" as "id", r."text" as "text" from trait-children as l join name-words as r on l."child" = r."id";
let interfaces = select * from trait-names where glob_any(text, "*Interface");
let interface-functions = select l."id" as "id" from trait-functions as l join interfaces as r on l."owner" = r."id";
let interface-function-children = select r."child" as "child" from interface-functions as l join "syntax-child" as r on l."id" = r."parent";
let interface-method-names = select r."text" as "text" from interface-function-children as l join name-words as r on l."child" = r."id";
let named-service-method-calls = select l."function" as "function", l."id" as "id" from method-call-names as l join interface-method-names as r on l."text" = r."text";
let receiver-edges = select * from "syntax-child" where ordinal = 0;
let call-receivers = select l."function" as "function", l."id" as "id", r."child" as "receiver" from named-service-method-calls as l join receiver-edges as r on l."id" = r."parent";
let call-expressions = select * from tree-nodes where glob_any(kind, "{method-call-expr,call-expr}");
let called-receivers = select l."function" as "function", l."id" as "id" from call-receivers as l join call-expressions as r on l."receiver" = r."id";
let path-expressions = select * from tree-nodes where kind = "path-expr";
let receiver-path-expressions = select l."id" as "call", l."function" as "function", r."id" as "id" from call-receivers as l join path-expressions as r on l."receiver" = r."id";
let receiver-path-descendants = axis(from=receiver-path-expressions, relation="syntax-child", direction=descendant, domain=tree-nodes);
let receiver-words = select l."function" as "function", l."call" as "id", r."text" as "text" from receiver-path-descendants as l join name-ref-words as r on l."related" = r."id";
let parameters = select * from command-nodes where kind = "param";
let parameter-descendants = axis(from=parameters, relation="syntax-child", direction=descendant, domain=tree-nodes);
let parameter-words = select l."id" as "id", r."text" as "text" from parameter-descendants as l join name-ref-words as r on l."related" = r."id";
let interface-parameters = select * from parameter-words where glob_any(text, "*Interface");
let parameter-children = select r."child" as "child", l."id" as "id" from interface-parameters as l join "syntax-child" as r on l."id" = r."parent";
let parameter-bindings = select r."id" as "binding", l."id" as "id" from parameter-children as l join ident-patterns as r on l."child" = r."id";
let binding-children = select r."child" as "child", l."id" as "id" from parameter-bindings as l join "syntax-child" as r on l."binding" = r."parent";
let interface-parameter-names = select l."id" as "id", r."text" as "text" from binding-children as l join name-words as r on l."child" = r."id";
let interface-parameter-functions = select r."function" as "function", l."text" as "text" from interface-parameter-names as l join command-nodes as r on l."id" = r."id";
let let-statements = select * from command-nodes where kind = "let-stmt";
let let-children = select r."child" as "child", l."function" as "function", l."id" as "id" from let-statements as l join "syntax-child" as r on l."id" = r."parent";
let let-bindings = select r."id" as "binding", l."function" as "function", l."id" as "id" from let-children as l join plain-idents as r on l."child" = r."id";
let called-lets = select l."id" as "id" from let-children as l join call-expressions as r on l."child" = r."id";
let called-let-bindings = select l."binding" as "binding", l."function" as "function" from let-bindings as l join called-lets as r on l."id" = r."id";
let let-binding-children = select r."child" as "child", l."function" as "function" from called-let-bindings as l join "syntax-child" as r on l."binding" = r."parent";
let bound-call-names = select l."function" as "function", r."text" as "text" from let-binding-children as l join name-words as r on l."child" = r."id";
let service-holders = union(left=interface-parameter-functions, right=bound-call-names);
let parameter-receivers = select l."function" as "function", l."id" as "id" from receiver-words as l join service-holders as r on l."function" = r."function" and l."text" = r."text";
let service-method-calls = union(left=called-receivers, right=parameter-receivers);
let calls = select * from command-nodes where kind = "call-expr";
let call-children = select r."child" as "child", l."function" as "function", l."id" as "id" from calls as l join "syntax-child" as r on l."id" = r."parent";
let callees = select l."id" as "call", l."function" as "function", r."id" as "id" from call-children as l join path-expressions as r on l."child" = r."id";
let callee-descendants = axis(from=callees, relation="syntax-child", direction=descendant, domain=tree-nodes);
let callee-words = select l."function" as "function", l."call" as "id", r."text" as "text" from callee-descendants as l join name-ref-words as r on l."related" = r."id";
let interface-callee-words = select * from callee-words where glob_any(text, "*Interface");
let service-path-calls = project(from=interface-callee-words, columns=["id", "function"]);
let service-calls = union(left=service-method-calls, right=service-path-calls);
let service-call-counts = group-count(from=service-calls, keys=["function"], count="calls", distinct="id");
let chatty-functions = select * from service-call-counts where calls > 1;
let chatty-function-nodes = select l."id" as "function", l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from command-functions as l join chatty-functions as r on l."id" = r."function";
let chatty-findings = extend(from=chatty-function-nodes, values={"what": "a command makes more than one service call"});
let service-findings = union(left=logic-findings, right=chatty-findings);
let command-function-children = select r."child" as "child", l."id" as "id" from command-functions as l join "syntax-child" as r on l."id" = r."parent";
let run-names = select * from name-words where text = "run";
let run-functions = select l."id" as "id" from command-function-children as l join run-names as r on l."child" = r."id";
let return-types = select * from tree-nodes where kind = "ret-type";
let function-returns = select l."id" as "function", r."id" as "id" from command-function-children as l join return-types as r on l."child" = r."id";
let return-type-edges = select r."child" as "child", l."function" as "function" from function-returns as l join "syntax-child" as r on l."id" = r."parent";
let path-type-nodes = select * from tree-nodes where kind = "path-type";
let return-path-types = select l."function" as "function", r."id" as "id" from return-type-edges as l join path-type-nodes as r on l."child" = r."id";
let return-path-type-edges = select r."child" as "child", l."function" as "function" from return-path-types as l join "syntax-child" as r on l."id" = r."parent";
let return-paths = select l."function" as "function", r."id" as "id" from return-path-type-edges as l join paths as r on l."child" = r."id";
let return-path-segments = select r."child" as "child", l."function" as "function" from return-paths as l join path-children as r on l."id" = r."id";
let outcome-type-words = select * from name-ref-words where text = "Outcome";
let outcome-type-segments = select l."id" as "id" from segment-children as l join outcome-type-words as r on l."child" = r."id";
let outcome-returns = select l."function" as "id" from return-path-segments as l join outcome-type-segments as r on l."child" = r."id";
let runs-without-outcome = antijoin(left=run-functions, right=outcome-returns, left-on=["id"], right-on=["id"]);
let run-without-outcome-nodes = select l."id" as "function", l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from command-functions as l join runs-without-outcome as r on l."id" = r."id";
let command-runs = select * from run-without-outcome-nodes where glob_any(file, "{command.rs,**/command.rs}");
let return-findings = extend(from=command-runs, values={"what": "a command's `run` does not return `Outcome`"});
let findings = union(left=service-findings, right=return-findings);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "{what}"
help = "Move the branch, loop or extra call into the use case's `use_case.rs` (or a rule into the hex's `domain/<concept>/domain.rs`), behind the one use-case port the command calls; the command parses its arguments, calls that port once, presents the result and returns the `Outcome` (`Success`, `Failure` or `Error`) its presenter gives. An ignore is never the fix."

[given]
include = ['**/src/commands/**/command.rs', '**/interface.rs']

[[scenarios]]
id = 'unit-result'
scenario = 'An empty unit payload carries no state beyond the Result outcome.'
given.include = ['**/command.rs']
given.files.'src/command.rs' = '''
pub fn respond(result: Result<(), ()>) -> u8 {
    match result {
        Ok(()) => 0,
        Err(()) => 2,
    }
}
'''

[[scenarios]]
id = 'tuple-result'
scenario = 'A nonempty tuple payload still inspects a Result.'
given.include = ['**/command.rs']
given.files.'src/command.rs' = '''
pub fn respond(result: Result<(u8, u8), ()>) -> u8 {
    match result {
        Ok((first, second)) => first + second,
        Err(()) => 2,
    }
}
'''
then.findings = [
  { path = 'src/command.rs', line = 2 },
]

[[scenarios]]
id = 'match-inspects-result'
scenario = 'A match looks inside the Result it matches.'
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/commands.rs' = '''
pub mod greeting;
'''
given.files.'src/commands/greeting.rs' = '''
pub mod match_inspects_result;
'''
given.files.'src/commands/greeting/match_inspects_result.rs' = '''
pub mod command;
'''
given.files.'src/commands/greeting/match_inspects_result/command.rs' = '''
pub fn run(outcome: Result<u32, ()>) -> crate::outcome::Outcome {
    match outcome {
        Ok(0) => crate::outcome::Outcome::Failure,
        Ok(_) => crate::outcome::Outcome::Success,
        Err(_) => crate::outcome::Outcome::Error,
    }
}
'''
given.files.'src/composition.rs' = '''
pub struct Services {
    greeting: crate::greeting::Memory,
}

impl Services {
    pub fn greeting(&self) -> &dyn crate::greeting::interface::GreetingInterface {
        &self.greeting
    }
}
'''
given.files.'src/greeting.rs' = '''
pub mod interface;

pub struct ShowRequest {
    pub name: String,
}
pub struct Greeting(pub String);
pub struct GreetingError;
pub struct Memory;

impl interface::GreetingInterface for Memory {
    fn show(&self, request: ShowRequest) -> Result<Greeting, GreetingError> {
        // Outside command files, logic is the domain's own.
        for _ in 0..1 {}
        if request.name.is_empty() { Err(GreetingError) } else { Ok(Greeting(request.name)) }
    }
    fn count(&self) -> Result<Greeting, GreetingError> {
        Ok(Greeting(String::from("1")))
    }
}
'''
given.files.'src/greeting/interface.rs' = '''
use super::{Greeting, GreetingError, ShowRequest};

pub trait GreetingInterface {
    fn show(&self, request: ShowRequest) -> Result<Greeting, GreetingError>;
    fn count(&self) -> Result<Greeting, GreetingError>;
}
'''
given.files.'src/lib.rs' = '''
pub mod commands;
pub mod composition;
pub mod greeting;
pub mod outcome;
'''
given.files.'src/outcome.rs' = '''
pub enum Outcome {
    Success,
    Failure,
    Error,
}
'''
