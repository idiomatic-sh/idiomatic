use crate::greeting::interface::GreetingInterface as _;
use crate::greeting::{Greeting, GreetingError, ShowRequest};

pub fn show(names: &[String]) -> Result<Greeting, GreetingError> {
    let service = super::composition::build();
    if names.is_empty() {
        return service.count();
    }
    let mut last = service.count();
    for name in names {
        last = service.show(ShowRequest { name: name.clone() });
    }
    last
}
