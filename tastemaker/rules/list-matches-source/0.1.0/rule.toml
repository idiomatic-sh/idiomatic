description = "Each `{ resource, path, as }` of the `reexports` list is a `pub use <path> as <as>;` of `src/resources/<resource>.rs`, and each `pub use` there is in the list."
why = "The list states once what each resource of the SDK exposes from the crates it wraps, and the resource template writes its `pub use` lines from it. A line written by hand beside it, or a listed item whose line was dropped, makes the list and the API differ silently: the API listing and the template then disagree with no finding. Read syntactically: a `pub use` is one with a visibility, and a listed item is matched by its resource, its path as written and the name it is bound to (the last segment when there is no `as`)."
params = { reexports = { type = "list<table>", description = "The items the SDK's resource modules re-export from the crates it exposes, each `{ resource, path, as }`: the list the SDK's entry passes its resource template." } }

query = '''
param reexports: list<table>;
let listed = rows(from=$reexports, columns=["resource", "path", "as"]);
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let uses = select * from tree-nodes where kind = "use";
let visibilities = select * from tree-nodes where kind = "visibility";
let visible = select l."parent" as "id" from "syntax-child" as l join visibilities as r on l."child" = r."id";
let public-uses = select l."id" as "id" from uses as l join visible as r on l."id" = r."id";
let imports = select l."occurrence" as "id", l."target" as "target", l."binding" as "binding", l."file" as "file", l."span" as "span" from "static-import" as l;
let placed = capture(from=imports, path="file", pattern="{*lead}resources/{resource}.rs", captures=["lead", "resource"]);
let owning-uses = axis(from=placed, relation="syntax-child", direction=nearest-ancestor, domain=uses);
let reexported = select l."resource" as "resource", l."target" as "path", l."binding" as "as", l."file" as "file", l."span" as "span", l."related" as "use" from owning-uses as l;
let used = select l."resource" as "resource", l."path" as "path", l."as" as "as", l."file" as "file", l."span" as "span" from reexported as l join public-uses as r on l."use" = r."id";
let unlisted-uses = antijoin(left=used, right=listed, left-on=["resource", "path", "as"], right-on=["resource", "path", "as"]);
let unlisted-rows = project(from=unlisted-uses, columns=["file", "path", "as"]);
let unlisted = extend(from=unlisted-rows, values={"problem": "is re-exported here and missing from the reexports list"});
let resource-files = project(from=placed, columns=["file", "resource"]);
let unused = antijoin(left=listed, right=used, left-on=["resource", "path", "as"], right-on=["resource", "path", "as"]);
let unused-placed = select r."file" as "file", l."path" as "path", l."as" as "as" from unused as l join resource-files as r on l."resource" = r."resource";
let unwritten = extend(from=unused-placed, values={"problem": "is in the reexports list and not re-exported here"});
let mismatched = union(left=unlisted, right=unwritten);
emit mismatched subject "file" key("path", "as");
'''

[diagnostic]
primary = "file"
message = "`{path} as {as}` {problem}"
help = "Make the `reexports` list of the SDK's entry and the resource module's `pub use` lines the same items: add the `{ resource, path, as }` the module re-exports to the list, or write the listed `pub use <path> as <as>;` in the module (`tm scaffold` writes the module from the list)."

[given]
include = ['**']
params = { reexports = [{ resource = 'languages', path = 'dep::Thing', as = 'Thing' }, { resource = 'languages', path = 'types::Local', as = 'Local' }] }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
pub mod resources;
'''
files.'src/resources.rs' = '''
pub mod languages;
'''
files.'src/resources/languages.rs' = '''
//! The languages resource.

mod types;

pub use dep::Thing as Thing;
pub use types::Local;
'''
files.'src/resources/languages/types.rs' = '''
/// A value of the resource itself.
pub struct Local;
'''

[[scenarios]]
id = 'listed-and-written'
scenario = 'Every listed item is re-exported, and nothing else of another crate.'

[[scenarios]]
id = 'written-and-not-listed'
scenario = 'A resource module re-exports an item the list does not have.'
given.files.'src/resources/languages.rs' = '''
//! The languages resource.

mod types;

pub use dep::Other as Other;
pub use dep::Thing as Thing;
pub use types::Local;
'''
then.findings = [
  { path = 'src/resources/languages.rs' },
]

[[scenarios]]
id = 'listed-and-not-written'
scenario = 'The list has an item its resource module does not re-export.'
given.params = { reexports = [{ resource = 'languages', path = 'dep::Thing', as = 'Thing' }, { resource = 'languages', path = 'types::Local', as = 'Local' }, { resource = 'languages', path = 'dep::Gone', as = 'Gone' }] }
then.findings = [
  { path = 'src/resources/languages.rs' },
]

[[scenarios]]
id = 'private-use-unlisted'
scenario = 'A private use of the resource module is no re-export.'
given.files.'src/resources/languages.rs' = '''
//! The languages resource.

mod types;

use std::fmt::Debug;

pub use dep::Thing as Thing;
pub use types::Local;

/// Says a local value, so the private import is used.
pub fn said(local: &dyn Debug) -> String {
    format!("{local:?}")
}
'''
