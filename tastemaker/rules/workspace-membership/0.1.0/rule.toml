description = "Every placed crate belongs to a Cargo workspace: its manifest is a member or a workspace's own manifest."
why = "A crate no Cargo workspace lists is never built, linted or tested with the rest."

query = '''
let manifests = select * from "tastemaker.placed" where template = "cargo-package";
let members = project(from="workspace-member", columns=["package"]);
let unlisted = antijoin(left=manifests, right=members, left-on=["path"], right-on=["package"]);
let roots = project(from="workspace-member", columns=["workspace"]);
let outside = antijoin(left=unlisted, right=roots, left-on=["path"], right-on=["workspace"]);
emit outside subject "path" key("path");
'''

[diagnostic]
primary = "path"
message = "`{path}` is a placed crate that no Cargo workspace lists"
help = "Add the crate's directory to the `members` of its Cargo workspace (the `[workspace]` table of the root Cargo.toml), or remove its entry from tastemaker.toml if it is not meant to be built."

[given]
files.'Cargo.toml' = '''
[workspace]
members=["crates/*"]
resolver="3"
'''
files.'crates/app/Cargo.toml' = '''
[package]
name="app"
version="0.1.0"
edition="2024"
'''
files.'crates/app/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''
files.'tastemaker.toml' = '''
workspace = { name = "fixture", dependencies = [{ package = "idiomatic.arch", path = "../../.." }] }
rules = [
  { rule = "idiomatic.arch/workspace-membership", include = ["**"] },
]
# Every crate is a crate instance, which places its manifest; the spec's own findings are not this rule's subject.
specs = [
  { spec = "idiomatic.arch/crate", include = ["**"], exclude = ["**/src", "**/tests", "**/benches"] },
]
'''

[[scenarios]]
id = 'every-placed-crate-scope-member-or-workspace'
scenario = 'Every placed crate in scope is a member or the workspace root.'
given.files.'crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"
'''
given.files.'crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''
then.only = ['idiomatic.arch/workspace-membership', 'idiomatic.arch/workspace-membership#unknown']

[[scenarios]]
id = 'empty-selection'
scenario = 'Only the workspace root manifest in scope.'
given.files.'crates/support/Cargo.toml' = '''
