# Cargo refuses a placed crate it neither lists nor excludes: it is in no workspace, so it is reported at its manifest.
[[scenarios]]
id = 'manifest-inside-workspace-workspace-neither-lists-nor'
scenario = 'A manifest inside a workspace that the workspace neither lists nor excludes.'
given.files.'Cargo.toml' = '''
[workspace]
members=["crates/app"]
resolver="3"
'''
given.files.'crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"
'''
given.files.'crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''
then.only = ['idiomatic.arch/workspace-membership', 'idiomatic.arch/workspace-membership#unknown']
then.findings = [
  { path = 'crates/support/Cargo.toml' },
]

[[scenarios]]
id = 'dependency-outside'
scenario = 'A member depends on a package outside the workspace, which the run does not read.'
given.files.'crates/app/Cargo.toml' = '''
