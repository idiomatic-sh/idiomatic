description = "Every module file declares exactly the `.rs` files of the directory beside it (a test file may instead be declared by its sibling logic file with `#[path]`), each with the gating of its role, and every directory of `.rs` files has its module file beside it."
why = "A module is its file beside its directory, and the file declares what the directory holds: `inbound.rs` declares the files of `inbound/`, `greet.rs` the files of `greet/`, and `lib.rs` those of `src/`. A namespace file (`inbound.rs`, `use_cases.rs`, `outbound.rs`, `domain.rs`, `collections.rs`, `adapters.rs` and the module file of each use case, port, concept, collection and adapter beside them) holds declarations and no code: an item in it (a function, a type, an impl) is a finding. A file the module file does not declare is never compiled, a declaration with no file is an error that only the build finds, and a directory with no module file beside it is silently not part of the crate. A test file `X_test.rs` has two homes, and exactly one: the directory's module file declares it (`#[cfg(test)] mod X_test;`), or its sibling logic file `X.rs` declares it itself (`#[cfg(test)] #[path = \"X_test.rs\"] mod tests;`, as `schemas.rs` does and as the command line's infrastructure files do); any other `#[path]` module declares a file its module file cannot see. A test module is compiled only for tests, test support (`fixtures`, `cases`) only under `test` or the `fixtures` feature, so each declaration carries the gating of its role. Module files cannot be templated for a part's optional files (a template sees only its own instance), so the check lives here once for every namespace. Read as written: the `.rs` files the entry selects; a module file is `X.rs` with a directory `X/` beside it that holds `.rs` files directly, or `lib.rs` for the files of its own directory (not `lib.rs`, `main.rs` or `build.rs`); a `mod NAME;` at the top level of the module file, with any visibility or attributes except `#[path]`, is a declaration (a `mod NAME { }` with a body is not); a self-declaration is a bodyless `mod tests;` at the top level of `X.rs` whose `#[path]` attribute names exactly the existing sibling `X_test.rs`, so its module file is neither asked to declare that test nor allowed to; a directory named `src` or `bin` needs no module file; a module generated by a macro is not seen. Gating is read from the `#[cfg(...)]` attribute: `test` named anywhere in it, and for a contract and for test support the feature string too."

query = '''
let listed-files = select l."path" as "file" from "filesystem.file" as l where not glob_any(l."path", "**/src/inbound/{use_cases,contracts}/*/acceptance.rs");
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = project(from=listed-files, columns=["file"]);
let rs-files = capture(from=files, path="file", pattern="{*parent}/{stem}.rs", captures=["parent", "stem"]);
let child-files = capture(from=files, path="file", pattern="{*parent}/{module}/{child}.rs", captures=["parent", "module", "child"]);
let dir-children = select l."file" as "module-path", r."file" as "child-path", r."child" as "child" from rs-files as l join child-files as r on l."parent" = r."parent" and l."stem" = r."module";
let lib-files = capture(from=files, path="file", pattern="{*parent}/lib.rs", captures=["parent"]);
let lib-children-all = select l."file" as "module-path", r."file" as "child-path", r."stem" as "child" from lib-files as l join rs-files as r on l."parent" = r."parent";
let lib-roots = select * from lib-children-all where glob_any(child, "{lib,main,build}");
let lib-children = antijoin(left=lib-children-all, right=lib-roots, left-on=["child-path"], right-on=["child-path"]);
let all-children = union(left=dir-children, right=lib-children);
let mod-children = select * from all-children where glob_any(child, "mod");
let declarable = antijoin(left=all-children, right=mod-children, left-on=["child-path"], right-on=["child-path"]);
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let top-items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from top-edges as l join tree-nodes as r on l."child" = r."id";
let module-items = select * from top-items where kind = "module";
let bodies = select * from tree-nodes where kind = "item-list";
let module-kids = select l."id" as "id", r."child" as "child" from module-items as l join "syntax-child" as r on l."id" = r."parent";
let with-body = select l."id" as "id" from module-kids as l join bodies as r on l."child" = r."id";
let decl-modules = antijoin(left=module-items, right=with-body, left-on=["id"], right-on=["id"]);
let m-name-nodes-all = select * from tree-nodes where kind = "name";
let m-kids = select l."id" as "id", r."child" as "child" from decl-modules as l join "syntax-child" as r on l."id" = r."parent";
let m-name-nodes = select l."id" as "id", r."id" as "name-node" from m-kids as l join m-name-nodes-all as r on l."child" = r."id";
let m-name-tokens = select l."id" as "id", r."child" as "token" from m-name-nodes as l join "syntax-child" as r on l."name-node" = r."parent";
let m-name-texts = select l."id" as "id", r."text" as "name" from m-name-tokens as l join tree-tokens as r on l."token" = r."id";
let decls = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."name" as "name" from decl-modules as l join m-name-texts as r on l."id" = r."id";
let x-token-edges = select l."parent" as "parent", r."id" as "token", r."kind" as "kind", r."text" as "text" from "syntax-child" as l join tree-tokens as r on l."child" = r."id";
let x-paths = select * from tree-nodes where kind = "path";
let x-segments = select * from tree-nodes where kind = "path-segment";
let x-name-refs = select * from tree-nodes where kind = "name-ref";
let x-path-segment-edges = select l."id" as "pathnode", r."child" as "child" from x-paths as l join "syntax-child" as r on l."id" = r."parent";
let x-path-segments = select l."pathnode" as "pathnode", r."id" as "segment" from x-path-segment-edges as l join x-segments as r on l."child" = r."id";
let x-segment-ref-edges = select l."pathnode" as "pathnode", r."child" as "child" from x-path-segments as l join "syntax-child" as r on l."segment" = r."parent";
let x-segment-refs = select l."pathnode" as "pathnode", r."id" as "nameref" from x-segment-ref-edges as l join x-name-refs as r on l."child" = r."id";
let x-path-names = select l."pathnode" as "pathnode", r."text" as "name" from x-segment-refs as l join x-token-edges as r on l."nameref" = r."parent";
let module-set = project(from=all-children, columns=["module-path"]);
let module-decls = select l."id" as "id", l."file" as "file", l."span" as "span", l."name" as "name" from decls as l join module-set as r on l."file" = r."module-path";
let attr-nodes = select * from tree-nodes where kind = "attr";
let cfg-nodes = select * from tree-nodes where kind = "cfg-meta";
let decl-kids = select l."id" as "id", r."child" as "child" from decls as l join "syntax-child" as r on l."id" = r."parent";
let decl-attrs = select l."id" as "id", r."id" as "attr" from decl-kids as l join attr-nodes as r on l."child" = r."id";
let attr-kids = select l."id" as "id", r."child" as "child" from decl-attrs as l join "syntax-child" as r on l."attr" = r."parent";
let cfg-rows = select r."id" as "id", l."id" as "decl" from attr-kids as l join cfg-nodes as r on l."child" = r."id";
let kv-metas = select * from tree-nodes where kind = "key-value-meta";
let literal-nodes = select * from tree-nodes where kind = "literal";
let kv-rows = select l."id" as "id", r."id" as "meta" from attr-kids as l join kv-metas as r on l."child" = r."id";
let kv-kids = select l."id" as "id", l."meta" as "meta", r."child" as "child" from kv-rows as l join "syntax-child" as r on l."meta" = r."parent";
let kv-key-paths = select l."id" as "id", l."meta" as "meta", r."id" as "pathnode" from kv-kids as l join x-paths as r on l."child" = r."id";
let kv-keys = select l."id" as "id", l."meta" as "meta", r."name" as "key" from kv-key-paths as l join x-path-names as r on l."pathnode" = r."pathnode";
let path-keyed = select * from kv-keys where key = "path";
let path-decl-ids = project(from=path-keyed, columns=["id"]);
let path-decl-all = select l."id" as "id", l."file" as "file", l."span" as "span", l."name" as "name" from decls as l join path-decl-ids as r on l."id" = r."id";
let kv-literals = select l."id" as "id", l."meta" as "meta", r."file" as "lpath", r."span" as "lspan" from kv-kids as l join literal-nodes as r on l."child" = r."id";
let path-literals = select l."id" as "id", r."lpath" as "lpath", r."lspan" as "lspan" from path-keyed as l join kv-literals as r on l."id" = r."id" and l."meta" = r."meta";
let literal-values = project(from="string-literal", columns=["file", "span", "value"]);
let path-values = select l."id" as "id", r."value" as "value" from path-literals as l join literal-values as r on l."lpath" = r."file" and l."lspan" = r."span";
let path-decl-valued = select l."id" as "id", l."file" as "file", l."span" as "span", l."name" as "name", r."value" as "value" from path-decl-all as l join path-values as r on l."id" = r."id";
let path-decl-places = capture(from=path-decl-valued, path="file", pattern="{*dir}/{x}.rs", captures=["dir", "x"]);
let tests-named = select * from path-decl-places where name = "tests";
let test-files = capture(from=files, path="file", pattern="{*dir}/{x}_test.rs", captures=["dir", "x"]);
let file-names = capture(from=files, path="file", pattern="{*dir}/{fname}", captures=["dir", "fname"]);
let test-names = select l."file" as "file", l."dir" as "dir", l."x" as "x", r."fname" as "fname" from test-files as l join file-names as r on l."file" = r."file";
let self-shaped = select l."id" as "id", l."file" as "file", l."span" as "span", l."name" as "name", r."file" as "child-path" from tests-named as l join test-names as r on l."dir" = r."dir" and l."x" = r."x" and l."value" = r."fname";
let self-ids = project(from=self-shaped, columns=["id"]);
let self-tests = project(from=self-shaped, columns=["child-path"]);
let other-paths = antijoin(left=path-decl-all, right=self-ids, left-on=["id"], right-on=["id"]);
let other-path-rows = project(from=other-paths, columns=["file", "span", "name"]);
let other-path-findings = extend(from=other-path-rows, values={"problem": "carries a `#[path]` attribute that does not name this file's own test: only `<file>_test.rs` beside `<file>.rs`, declared as `mod tests;`, is declared by `#[path]`"});
let self-children = select l."module-path" as "module-path", l."child-path" as "child-path", l."child" as "child" from declarable as l join self-tests as r on l."child-path" = r."child-path";
let expected = antijoin(left=declarable, right=self-children, left-on=["child-path"], right-on=["child-path"]);
let plain-decls = antijoin(left=module-decls, right=path-decl-ids, left-on=["id"], right-on=["id"]);
let extra = antijoin(left=plain-decls, right=declarable, left-on=["file", "name"], right-on=["module-path", "child"]);
let extra-rows = project(from=extra, columns=["file", "span", "name"]);
let extra-findings = extend(from=extra-rows, values={"problem": "is declared here, but the directory beside this file holds no file of that name"});
let missing = antijoin(left=expected, right=plain-decls, left-on=["module-path", "child"], right-on=["file", "name"]);
let missing-nodes = select l."child-path" as "file", r."span" as "span", l."child" as "name" from missing as l join source-files as r on l."child-path" = r."file";
let missing-tests = select * from missing-nodes where glob_any(name, "*_test");
let missing-plain = antijoin(left=missing-nodes, right=missing-tests, left-on=["file"], right-on=["file"]);
let missing-findings = extend(from=missing-plain, values={"problem": "is a file its module file never declares: the compiler does not read it"});
let missing-test-findings = extend(from=missing-tests, values={"problem": "is a test file that neither its module file declares nor its logic file declares with `#[path]`: the compiler does not read it"});
let twice = select l."module-path" as "file", r."span" as "span", l."child" as "name" from self-children as l join plain-decls as r on l."module-path" = r."file" and l."child" = r."name";
let twice-rows = project(from=twice, columns=["file", "span", "name"]);
let twice-findings = extend(from=twice-rows, values={"problem": "is declared here and again by its logic file with `#[path]`: a test file is declared once"});
let cfg-atoms = select * from tree-nodes where kind = "cfg-atom";
let meta-atoms = axis(from=cfg-rows, relation="syntax-child", direction=descendant, domain=cfg-atoms);
let atom-edges = select l."id" as "meta", l."decl" as "decl", r."child" as "token" from meta-atoms as l join "syntax-child" as r on l."related" = r."parent";
let idents = select * from tree-tokens where kind = "ident";
let test-idents = select * from idents where text = "test";
let strings = select * from tree-tokens where kind = "string";
let fixtures-strings = select * from strings where glob_any(text, "?fixtures?");
let test-hits = select l."meta" as "meta", l."decl" as "decl" from atom-edges as l join test-idents as r on l."token" = r."id";
let fixtures-hits = select l."meta" as "meta" from atom-edges as l join fixtures-strings as r on l."token" = r."id";
let test-cfgs = project(from=test-hits, columns=["meta", "decl"]);
let fixtures-cfgs = project(from=fixtures-hits, columns=["meta"]);
let test-gated = project(from=test-cfgs, columns=["decl"]);
let fixtures-gated = select l."decl" as "decl" from test-cfgs as l join fixtures-cfgs as r on l."meta" = r."meta";
let test-named = select * from plain-decls where glob_any(name, "*_test");
let ungated-tests = antijoin(left=test-named, right=test-gated, left-on=["id"], right-on=["decl"]);
let support-named = select * from plain-decls where glob_any(name, "{fixtures,cases}");
let ungated-support = antijoin(left=support-named, right=fixtures-gated, left-on=["id"], right-on=["decl"]);
let ungated-selves = antijoin(left=self-shaped, right=test-gated, left-on=["id"], right-on=["decl"]);
let ungated-test-rows = project(from=ungated-tests, columns=["file", "span", "name"]);
let ungated-test-findings = extend(from=ungated-test-rows, values={"problem": "is a test module declared without a `#[cfg(...)]` that names `test`"});
let ungated-self-rows = project(from=ungated-selves, columns=["file", "span", "name"]);
let ungated-self-findings = extend(from=ungated-self-rows, values={"problem": "is a test module declared without a `#[cfg(...)]` that names `test`"});
let ungated-support-rows = project(from=ungated-support, columns=["file", "span", "name"]);
let ungated-support-findings = extend(from=ungated-support-rows, values={"problem": "is test support declared without a `#[cfg(...)]` that names `test` and the `fixtures` feature"});
let mod-rs = capture(from=files, path="file", pattern="{*parent}/mod.rs", captures=["parent"]);
let mod-rs-nodes = select l."file" as "file", r."span" as "span" from mod-rs as l join source-files as r on l."file" = r."file";
let mod-rs-findings = extend(from=mod-rs-nodes, values={"name": "mod.rs", "problem": "is the old module-file form: the module file of a directory is `<dir>.rs` beside it"});
let dir-keys = project(from=child-files, columns=["parent", "module"]);
let module-keys = project(from=rs-files, columns=["parent", "stem"]);
let mod-dirs = capture(from=files, path="file", pattern="{*parent}/{module}/mod.rs", captures=["parent", "module"]);
let mod-dir-keys = project(from=mod-dirs, columns=["parent", "module"]);
let exempt-dirs = select * from dir-keys where glob_any(module, "{src,bin}");
let checked-1 = antijoin(left=dir-keys, right=exempt-dirs, left-on=["parent", "module"], right-on=["parent", "module"]);
let checked = antijoin(left=checked-1, right=mod-dir-keys, left-on=["parent", "module"], right-on=["parent", "module"]);
let undeclared = antijoin(left=checked, right=module-keys, left-on=["parent", "module"], right-on=["parent", "stem"]);
let dir-pairs = select l."file" as "file", r."file" as "other" from child-files as l join child-files as r on l."parent" = r."parent" and l."module" = r."module";
let later-dir = select * from dir-pairs where other < file;
let later-dir-paths = project(from=later-dir, columns=["file"]);
let dir-firsts = antijoin(left=child-files, right=later-dir-paths, left-on=["file"], right-on=["file"]);
let undeclared-files = select l."file" as "file", l."module" as "name" from dir-firsts as l join undeclared as r on l."parent" = r."parent" and l."module" = r."module";
let undeclared-nodes = select l."file" as "file", r."span" as "span", l."name" as "name" from undeclared-files as l join source-files as r on l."file" = r."file";
let undeclared-findings = extend(from=undeclared-nodes, values={"problem": "is a directory of .rs files with no module file `<dir>.rs` beside it: none of its files is compiled"});
let logic-items = select * from top-items where glob_any(kind, "{fn,struct,enum,union,trait,impl,const,static,type-alias,macro-rules,macro-call}");
let namespace-names = select * from rs-files where glob_any(stem, "{inbound,use_cases,outbound,domain,application,collections,adapters}");
let namespace-list-paths = project(from=namespace-names, columns=["file"]);
let namespace-members = capture(from=files, path="file", pattern="{*dir}/{namespace}/{member}.rs", captures=["dir", "namespace", "member"]);
let namespace-member-files = select * from namespace-members where glob_any(namespace, "{use_cases,outbound,domain,application,collections,adapters}");
let namespace-member-paths = project(from=namespace-member-files, columns=["file"]);
let namespace-paths = union(left=namespace-list-paths, right=namespace-member-paths);
let module-logic = select l."file" as "file", l."span" as "span", l."kind" as "name" from logic-items as l join namespace-paths as r on l."file" = r."file";
let logic-findings = extend(from=module-logic, values={"problem": "is an item in a namespace file, which declares modules and holds no code: move it into a file of the directory beside it"});
let all-1 = union(left=extra-findings, right=missing-findings);
let all-2 = union(left=all-1, right=missing-test-findings);
let all-3 = union(left=all-2, right=twice-findings);
let all-4 = union(left=all-3, right=other-path-findings);
let all-5 = union(left=all-4, right=ungated-test-findings);
let all-6 = union(left=all-5, right=ungated-self-findings);
let all-7 = union(left=all-6, right=ungated-support-findings);
let all-8 = union(left=all-7, right=mod-rs-findings);
let all-9 = union(left=all-8, right=undeclared-findings);
let all-10 = union(left=all-9, right=logic-findings);
emit all-10 subject "file" key("span", "name", "problem");
'''

[diagnostic]
primary = "span"
message = "`{name}` {problem}"
help = "Make each module file declare exactly the `.rs` files of the directory beside it, one `mod <file>;` per file: add the declaration the finding names to the module file, or delete the declaration of a file that does not exist. Gate each declaration by its role: `#[cfg(test)]` on a `*_test` module and `#[cfg(any(test, feature = \"fixtures\"))]` on `fixtures` (a port's and a collection's contract and fake) and `cases`. Write a directory's module file as `<dir>.rs` beside it, never `mod.rs`, A test file `X_test.rs` is declared once, either in the module file (`#[cfg(test)] mod X_test;`) or in `X.rs` (`#[cfg(test)] #[path = \"X_test.rs\"] mod tests;`): remove the second declaration, and rename or remove any other `#[path]` module. An ignore is not legitimate here: a module file states exactly what the directory holds."

[given]
include = ['src/**']

[[scenarios]]
