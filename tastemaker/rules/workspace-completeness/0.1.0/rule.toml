description = "Every member of a Cargo workspace in scope lies in scope itself."
why = "A member outside what Tastemaker governs is built with the workspace but placed by no spec. In scope stands for placed: the rule reads the files its entry reaches, so a member outside them is taken as unplaced."

query = '''
let scoped = project(from="filesystem.file", columns=["path"]);
let governed = select l."package" as "package", l."workspace" as "workspace" from "workspace-member" as l join scoped as r on l."workspace" = r."path";
let ungoverned = antijoin(left=governed, right=scoped, left-on=["package"], right-on=["path"]);
emit ungoverned subject "workspace" key("workspace", "package");
'''

[diagnostic]
primary = "workspace"
message = "`{workspace}` has member `{package}`, which lies outside the workspace's scope"
help = "Bring `{package}` into scope: its manifest must lie inside the Tastemaker workspace's `include` and this rule entry's `include`, outside their `exclude`, so the specs place it like every other crate; or remove it from the `members` of `{workspace}`. An ignore is never the fix."

[given]
include = ['**']
files.'Cargo.toml' = '''
[workspace]
members=["crates/*"]
resolver="3"
'''
files.'crates/app/Cargo.toml' = '''
[package]
name="app"
version="0.1.0"
edition="2024"
'''
files.'crates/app/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''

[[scenarios]]
id = 'every-member-scope'
scenario = 'Every member is in scope.'
given.files.'crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"
'''
given.files.'crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''

[[scenarios]]
id = 'unselected-member'
scenario = "A member outside the entry's scope."
given.exclude = ['crates/extra']
given.files.'crates/extra/Cargo.toml' = '''
[package]
name="independent"
version="0.1.0"
edition="2024"
'''
given.files.'crates/extra/src/lib.rs' = '''
pub fn independent() {}
'''
given.files.'crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"
'''
given.files.'crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''
then.findings = [
  { path = 'Cargo.toml' },
]

[[scenarios]]
id = 'nested-member-unselected'
scenario = "A member nested under a member's tree, outside the scope."
given.exclude = ['crates/app/crates/support']
given.files.'crates/app/Cargo.toml' = '''
[package]
name="app"
version="0.1.0"
edition="2024"

[dependencies]
support={path="crates/support"}
'''
given.files.'crates/app/crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"
'''
given.files.'crates/app/crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''
then.findings = [
  { path = 'Cargo.toml' },
]

[[scenarios]]
id = 'nested-support'
scenario = "A member nested under a member's tree, in scope."
given.files.'crates/app/Cargo.toml' = '''
[package]
name="app"
version="0.1.0"
edition="2024"

[dependencies]
support={path="crates/support"}
'''
given.files.'crates/app/crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"
'''
given.files.'crates/app/crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''

[[scenarios]]
id = 'path-cargo-excludes-member'
scenario = 'A path Cargo excludes is not a member.'
given.exclude = ['crates/support']
given.files.'Cargo.toml' = '''
[workspace]
members=["crates/app"]
exclude=["crates/support"]
resolver="3"
'''
given.files.'crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"
'''
given.files.'crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''

[[scenarios]]
id = 'nested-workspace'
scenario = 'A nested workspace root is not a member of the outer workspace.'
given.exclude = ['crates/support']
given.files.'Cargo.toml' = '''
[workspace]
members=["crates/app"]
exclude=["crates/support"]
resolver="3"
'''
given.files.'crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"

[workspace]
'''
given.files.'crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''

[[scenarios]]
id = 'empty-selection'
scenario = 'Only the workspace root manifest in scope.'
given.include = ['Cargo.toml']
given.files.'crates/support/Cargo.toml' = '''
[package]
name="support"
version="0.1.0"
edition="2024"
'''
given.files.'crates/support/src/lib.rs' = '''
pub fn ready() -> bool { true }
'''
then.findings = [
  { path = 'Cargo.toml' },
  { path = 'Cargo.toml' },
]
