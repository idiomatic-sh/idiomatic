description = "Each `src/inbound/use_cases/<feature>/acceptance.feature` has its steps file `src/inbound/use_cases/<feature>/acceptance.rs` and each steps file its feature, and a feature names a use case of the crate, `src/inbound/use_cases/<feature>.rs`, or a contract of a language provider, `src/inbound/contracts/<feature>.rs`."
why = "A crate's behaviour is one feature per use case with its steps in a file of their own, so a feature without steps never runs a step, steps without a feature are dead code the runner still declares, and a feature that names no use case describes nothing the crate offers: a language provider's features are named for its contracts, the engine traits it implements; a crate with no use case, an adapter, a command line or an SDK, has no feature. The reverse, a use case with no feature, is the nu-hex's to say, which knows its use cases are required. Read as the file names say: a feature, a steps file and a use case module are paired when they share the `<feature>` name under the same crate."

query = '''
let use-features = capture(from="filesystem.file", path="path", pattern="{*root}/src/inbound/use_cases/{feature}/acceptance.feature", captures=["root", "feature"]);
let contract-features = capture(from="filesystem.file", path="path", pattern="{*root}/src/inbound/contracts/{feature}/acceptance.feature", captures=["root", "feature"]);
let features = union(left=use-features, right=contract-features);
let use-steps = capture(from="filesystem.file", path="path", pattern="{*root}/src/inbound/use_cases/{feature}/acceptance.rs", captures=["root", "feature"]);
let contract-steps = capture(from="filesystem.file", path="path", pattern="{*root}/src/inbound/contracts/{feature}/acceptance.rs", captures=["root", "feature"]);
let steps = union(left=use-steps, right=contract-steps);
let use-cases = capture(from="filesystem.file", path="path", pattern="{*root}/src/inbound/use_cases/{feature}.rs", captures=["root", "feature"]);
let feature-keys = project(from=features, columns=["root", "feature"]);
let step-keys = project(from=steps, columns=["root", "feature"]);
let use-case-keys = project(from=use-cases, columns=["root", "feature"]);
let contracts = capture(from="filesystem.file", path="path", pattern="{*root}/src/inbound/contracts/{feature}.rs", captures=["root", "feature"]);
let contract-keys = project(from=contracts, columns=["root", "feature"]);
let owner-keys = union(left=use-case-keys, right=contract-keys);
let unstepped = antijoin(left=features, right=step-keys, left-on=["root", "feature"], right-on=["root", "feature"]);
let unfeatured = antijoin(left=steps, right=feature-keys, left-on=["root", "feature"], right-on=["root", "feature"]);
let unowned = antijoin(left=features, right=owner-keys, left-on=["root", "feature"], right-on=["root", "feature"]);
let unstepped-rows = project(from=unstepped, columns=["path", "feature"]);
let unfeatured-rows = project(from=unfeatured, columns=["path", "feature"]);
let unowned-rows = project(from=unowned, columns=["path", "feature"]);
let unstepped-findings = extend(from=unstepped-rows, values={"problem": "has no steps file `src/inbound/use_cases/<feature>/acceptance.rs`"});
let unfeatured-findings = extend(from=unfeatured-rows, values={"problem": "has steps and no feature `src/inbound/use_cases/<feature>/acceptance.feature`"});
let unowned-findings = extend(from=unowned-rows, values={"problem": "names no use case or contract: neither `src/inbound/use_cases/<feature>.rs` nor `src/inbound/contracts/<feature>.rs` exists"});
let missing = union(left=unstepped-findings, right=unfeatured-findings);
let findings = union(left=missing, right=unowned-findings);
let runner-tokens = capture(from="string-literal", path="file", pattern="{*root}/tests/bdd.rs", captures=["root"]);
let use-bindings = capture(from=runner-tokens, path="value", pattern="../src/inbound/use_cases/{feature}/acceptance.rs", captures=["feature"]);
let contract-bindings = capture(from=runner-tokens, path="value", pattern="../src/inbound/contracts/{feature}/acceptance.rs", captures=["feature"]);
let bindings = union(left=use-bindings, right=contract-bindings);
let binding-keys = project(from=bindings, columns=["root", "feature"]);
let undeclared = antijoin(left=features, right=binding-keys, left-on=["root", "feature"], right-on=["root", "feature"]);
let undeclared-rows = project(from=undeclared, columns=["path", "feature"]);
let undeclared-findings = extend(from=undeclared-rows, values={"problem": "has no colocated steps module declared by tests/bdd.rs"});
let complete-findings = union(left=findings, right=undeclared-findings);
emit complete-findings subject "path" key("path", "problem");
'''

[diagnostic]
primary = "path"
message = "feature `{feature}` {problem}"
help = "A feature is `src/inbound/use_cases/<use_case>/acceptance.feature` with its steps in `src/inbound/use_cases/<use_case>/acceptance.rs`, for a use case of the crate's `src/inbound/use_cases/` or a contract of its `src/inbound/contracts/`: add the steps file, add the feature, or delete the feature of a crate that has no such use case. `tm scaffold` writes the missing file."

[given]
include = ['*/tests/bdd.rs', 'app/src/inbound/use_cases/*/acceptance.feature', 'app/src/inbound/use_cases/*/acceptance.rs', 'app/src/inbound/use_cases/*.rs']

[[scenarios]]
id = 'feature-steps-use-case'
scenario = 'A feature with its steps and its use case.'
given.files.'app/src/inbound/use_cases/greet.rs' = '''
//! The `greet` use case.
'''
given.files.'app/src/inbound/use_cases/greet/acceptance.feature' = '''
Feature: greet
'''
given.files.'app/src/inbound/use_cases/greet/acceptance.rs' = '''
//! The steps of the `greet` feature.
'''
given.files.'app/tests/bdd.rs' = '''
#[path = "../src/inbound/use_cases/greet/acceptance.rs"]
mod greet;
'''

