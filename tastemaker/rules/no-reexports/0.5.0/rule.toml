description = "Imports, external-crate bindings and type aliases of a path have inherited visibility outside the product’s placed SDK surface."
why = "Consumers use the defining module. Public use, extern crate and type declarations forward another module’s item under a second path. A canonical inbound use-case interface may expose private domain */types and */errors signature vocabulary (the error a use case's signature carries is vocabulary as much as its data), and the application types its contract is made of: a type or trait declared in the crate's application tree that the signature of one of the interface's methods names, or that a type so named names in its fields, variants or methods, or that such a type implements or is implemented by, transitively (the handles a use case returns and the protocol traits they implement are its contract). An application item no such signature reaches, and every service function, stays forbidden. A port factory may expose its adapter connection module's named `Connection` handle for edge construction and injection; mixed exports or adapter implementations are not exempt. Only such a factory may also carry a local `clippy::pub_use` allowance that Clippy requires; `clippy::restriction` remains forbidden. This exception checks the factory location and imported path, not runtime ownership. The product excludes only the src tree of its actual SDK spec placement; CLI and ordinary crate roots receive no exception. The former derive-facade switch is removed. Syntax checking includes inactive cfg code and macro_rules bodies, but not procedural-macro expansion; the compiler construction boundary independently resolves aliases when checking composition."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let imports = select * from tree-nodes where kind = "use";
let external-crates = select * from tree-nodes where kind = "extern-crate";
let bindings = union(left=imports, right=external-crates);
let all-aliases = select * from tree-nodes where kind = "type-alias";
let path-types = select * from tree-nodes where kind = "path-type";
let alias-kids = select l."id" as "id", r."child" as "child" from all-aliases as l join "syntax-child" as r on l."id" = r."parent";
let path-alias-ids = select l."id" as "id" from alias-kids as l join path-types as r on l."child" = r."id";
let aliases = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from all-aliases as l join path-alias-ids as r on l."id" = r."id";
let forwarding = union(left=bindings, right=aliases);
let forwarding-children = select r."child" as "child", l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from forwarding as l join "syntax-child" as r on l."id" = r."parent";
let visibility = select * from tree-nodes where kind = "visibility";
let visible-forwarding = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."id" as "visibility" from forwarding-children as l join visibility as r on l."child" = r."id";
let visible-imports = select * from visible-forwarding where kind = "use";
let token-edges = select r."kind" as "kind", l."parent" as "parent", r."text" as "text", r."id" as "token" from "syntax-child" as l join tree-tokens as r on l."child" = r."id";
let attributes = select * from tree-nodes where kind = "attr";
let resource-paths = select * from tree-nodes where kind = "path";
let resource-segments = select * from tree-nodes where kind = "path-segment";
let resource-names = select * from tree-nodes where kind = "name-ref";
let resource-segment-edges = select l."parent" as "segment", r."id" as "name" from "syntax-child" as l join resource-names as r on l."child" = r."id";
let resource-named = select l."segment" as "segment", r."text" as "text" from resource-segment-edges as l join token-edges as r on l."name" = r."parent";
let resource-keywords = select l."id" as "segment", r."text" as "text" from resource-segments as l join token-edges as r on l."id" = r."parent";
let resource-segment-names = union(left=resource-named, right=resource-keywords);
let resource-path-segments = select l."parent" as "path", r."id" as "segment" from "syntax-child" as l join resource-segments as r on l."child" = r."id";
let resource-path-names = select l."path" as "path", r."text" as "text" from resource-path-segments as l join resource-segment-names as r on l."segment" = r."segment";
let resource-path-parents = select l."parent" as "path", r."id" as "prefix" from "syntax-child" as l join resource-paths as r on l."child" = r."id";
let resource-trees = select * from tree-nodes where kind = "use-tree";
let resource-use-trees = select l."parent" as "id", r."id" as "tree" from "syntax-child" as l join resource-trees as r on l."child" = r."id";
let resource-lists = select * from tree-nodes where glob_any(kind, "{use-tree-list,rename}");
let resource-grouped = select l."parent" as "tree" from "syntax-child" as l join resource-lists as r on l."child" = r."id";
let resource-single-trees = antijoin(left=resource-use-trees, right=resource-grouped, left-on=["tree"], right-on=["tree"]);
let resource-use-paths = select l."id" as "id", r."prefix" as "path" from resource-single-trees as l join resource-path-parents as r on l."tree" = r."path";
let resource-factories = select * from visible-imports where glob_any(file, "**/outbound/*/factory.rs");
let resource-start = select l."id" as "id", r."path" as "path" from resource-factories as l join resource-use-paths as r on l."id" = r."id";
let resource-step-0 = select l."id" as "id", l."path" as "path", r."text" as "text" from resource-start as l join resource-path-names as r on l."path" = r."path";
let resource-match-0 = select * from resource-step-0 where glob_any(text, "*Connection");
let resource-prefix-0 = select l."id" as "id", r."prefix" as "path" from resource-match-0 as l join resource-path-parents as r on l."path" = r."path";
let resource-step-1 = select l."id" as "id", l."path" as "path", r."text" as "text" from resource-prefix-0 as l join resource-path-names as r on l."path" = r."path";
let resource-match-1 = select * from resource-step-1 where glob_any(text, "connection");
let resource-prefix-1 = select l."id" as "id", r."prefix" as "path" from resource-match-1 as l join resource-path-parents as r on l."path" = r."path";
let resource-step-2 = select l."id" as "id", l."path" as "path", r."text" as "text" from resource-prefix-1 as l join resource-path-names as r on l."path" = r."path";
let resource-match-2 = select * from resource-step-2 where glob_any(text, "*");
let resource-prefix-2 = select l."id" as "id", r."prefix" as "path" from resource-match-2 as l join resource-path-parents as r on l."path" = r."path";
let resource-step-3 = select l."id" as "id", l."path" as "path", r."text" as "text" from resource-prefix-2 as l join resource-path-names as r on l."path" = r."path";
let resource-match-3 = select * from resource-step-3 where glob_any(text, "adapters");
let resource-prefix-3 = select l."id" as "id", r."prefix" as "path" from resource-match-3 as l join resource-path-parents as r on l."path" = r."path";
let resource-step-4 = select l."id" as "id", l."path" as "path", r."text" as "text" from resource-prefix-3 as l join resource-path-names as r on l."path" = r."path";
let resource-match-4 = select * from resource-step-4 where glob_any(text, "super");
let resource-imports = antijoin(left=resource-match-4, right=resource-path-parents, left-on=["path"], right-on=["path"]);
let signature-interfaces = select * from visible-imports where glob_any(file, "**/src/inbound/use_cases/*/interface.rs");
let signature-paths = select l."id" as "id", r."path" as "path" from signature-interfaces as l join resource-use-paths as r on l."id" = r."id";
let signature-item-prefix = select l."id" as "id", r."prefix" as "path" from signature-paths as l join resource-path-parents as r on l."path" = r."path";
let signature-type-paths-step = select l."id" as "id", l."path" as "path", r."text" as "text" from signature-item-prefix as l join resource-path-names as r on l."path" = r."path";
let signature-type-paths = select "id", "path" from signature-type-paths-step where glob_any(text, "{types,errors}");
let signature-concept = select l."id" as "id", r."prefix" as "path" from signature-type-paths as l join resource-path-parents as r on l."path" = r."path";
let signature-domain-path = select l."id" as "id", r."prefix" as "path" from signature-concept as l join resource-path-parents as r on l."path" = r."path";
let signature-domain-step = select l."id" as "id", l."path" as "path", r."text" as "text" from signature-domain-path as l join resource-path-names as r on l."path" = r."path";
let signature-domain = select "id", "path" from signature-domain-step where text = "domain";
let signature-crate-path = select l."id" as "id", r."prefix" as "path" from signature-domain as l join resource-path-parents as r on l."path" = r."path";
let signature-crate-step = select l."id" as "id", l."path" as "path", r."text" as "text" from signature-crate-path as l join resource-path-names as r on l."path" = r."path";
let signature-crate = select "id", "path" from signature-crate-step where text = "crate";
let signature-imports = antijoin(left=signature-crate, right=resource-path-parents, left-on=["path"], right-on=["path"]);
let contract-paths = select l."id" as "id", r."path" as "path" from signature-interfaces as l join resource-use-paths as r on l."id" = r."id";
let contract-items = select l."id" as "id", l."path" as "path", r."text" as "text" from contract-paths as l join resource-path-names as r on l."path" = r."path";
let path-ancestry = closure(edges=resource-path-parents, source="path", destination="prefix");
let contract-prefixes = select l."id" as "id", r."prefix" as "prefix" from contract-paths as l join path-ancestry as r on l."path" = r."path";
let contract-prefix-names = select l."id" as "id", l."prefix" as "prefix", r."text" as "text" from contract-prefixes as l join resource-path-names as r on l."prefix" = r."path";
let contract-application = select * from contract-prefix-names where text = "application";
let contract-application-inner = select l."id" as "id", r."prefix" as "inner" from contract-application as l join resource-path-parents as r on l."prefix" = r."path";
let contract-inner-roots = antijoin(left=contract-application-inner, right=resource-path-parents, left-on=["inner"], right-on=["path"]);
let contract-inner-names = select l."id" as "id", r."text" as "text" from contract-inner-roots as l join resource-path-names as r on l."inner" = r."path";
let contract-crate-rooted = select * from contract-inner-names where text = "crate";
let vocabulary-files = select * from tree-nodes where glob_any(file, "{**/src/application/**/*.rs,**/src/inbound/use_cases/*/interface.rs,**/src/inbound/use_cases/*/types.rs}");
let vocabulary-items = select * from vocabulary-files where glob_any(kind, "{struct,enum,trait,type-alias,union}");
let vocabulary-item-children = select l."id" as "item", r."child" as "child" from vocabulary-items as l join "syntax-child" as r on l."id" = r."parent";
let declared-name-nodes = select l."item" as "item", r."id" as "name" from vocabulary-item-children as l join tree-nodes as r on l."child" = r."id" where r."kind" = "name";
let declared-names = select l."item" as "item", r."text" as "text" from declared-name-nodes as l join token-edges as r on l."name" = r."parent";
let name-references = select * from tree-nodes where kind = "name-ref";
let item-references = axis(from=vocabulary-items, relation="syntax-child", direction=descendant, domain=name-references);
let item-reference-texts = select l."id" as "item", r."text" as "text" from item-references as l join token-edges as r on l."related" = r."parent";
let declaration-edges = select l."text" as "from", r."text" as "to" from declared-names as l join item-reference-texts as r on l."item" = r."item";
let vocabulary-impls = select * from vocabulary-files where kind = "impl";
let impl-children = select l."id" as "impl", r."child" as "child", r."ordinal" as "ordinal" from vocabulary-impls as l join "syntax-child" as r on l."id" = r."parent";
let impl-for-keywords = select l."impl" as "impl", l."ordinal" as "for-ordinal" from impl-children as l join tree-tokens as r on l."child" = r."id" where r."kind" = "for-kw";
let impl-path-types = select l."impl" as "impl", l."child" as "type", l."ordinal" as "ordinal" from impl-children as l join path-types as r on l."child" = r."id";
let impl-type-paths = select l."impl" as "impl", l."ordinal" as "ordinal", r."child" as "path" from impl-path-types as l join "syntax-child" as r on l."type" = r."parent";
let impl-type-names = select l."impl" as "impl", l."ordinal" as "ordinal", r."text" as "text" from impl-type-paths as l join resource-path-names as r on l."path" = r."path";
let impl-sides = select l."impl" as "impl", l."ordinal" as "ordinal", l."text" as "text", r."for-ordinal" as "for-ordinal" from impl-type-names as l join impl-for-keywords as r on l."impl" = r."impl";
let impl-traits = select * from impl-sides where ordinal < for-ordinal;
let impl-selves = select * from impl-sides where ordinal > for-ordinal;
let implemented-edges = select l."text" as "from", r."text" as "to" from impl-selves as l join impl-traits as r on l."impl" = r."impl";
let implementor-edges = select l."text" as "from", r."text" as "to" from impl-traits as l join impl-selves as r on l."impl" = r."impl";
let impl-edges = union(left=implemented-edges, right=implementor-edges);
let vocabulary-edges = union(left=declaration-edges, right=impl-edges);
let vocabulary-reach = closure(edges=vocabulary-edges, source="from", destination="to");
let contract-traits = select * from tree-nodes where kind = "trait" and glob_any(file, "**/src/inbound/use_cases/*/interface.rs");
let contract-references = axis(from=contract-traits, relation="syntax-child", direction=descendant, domain=name-references);
let contract-roots = select r."text" as "from" from contract-references as l join token-edges as r on l."related" = r."parent";
let contract-reached = select r."to" as "text" from contract-roots as l join vocabulary-reach as r on l."from" = r."from";
let contract-root-names = select l."from" as "text" from contract-roots as l;
let contract-vocabulary = union(left=contract-reached, right=contract-root-names);
let contract-named = select l."id" as "id" from contract-items as l join contract-vocabulary as r on l."text" = r."text";
let contract-application-imports = select l."id" as "id" from contract-named as l join contract-crate-rooted as r on l."id" = r."id";
let domain-signature-ids = project(from=signature-imports, columns=["id"]);
let allowed-signature-ids = union(left=domain-signature-ids, right=contract-application-imports);
let other-forwarding = antijoin(left=visible-forwarding, right=resource-imports, left-on=["id"], right-on=["id"]);
let forbidden-forwarding = antijoin(left=other-forwarding, right=allowed-signature-ids, left-on=["id"], right-on=["id"]);
let forwarding-rows = project(from=forbidden-forwarding, columns=["file", "span", "kind"]);
let forwarding-described = extend(from=forwarding-rows, values={"problem": "declaration has explicit forwarding visibility"});
let metas = select * from tree-nodes where glob_any(kind, "{token-tree-meta,key-value-meta,path-meta}");
let meta-attributes = axis(from=metas, relation="syntax-child", direction=nearest-ancestor, domain=attributes);
let attribute-metas = select r."id" as "attribute", l."id" as "meta", r."file" as "file", r."span" as "span" from meta-attributes as l join attributes as r on l."related" = r."id";
let meta-path-edges = select l."attribute" as "attribute", r."child" as "child", l."meta" as "meta" from attribute-metas as l join "syntax-child" as r on l."meta" = r."parent";
let paths = select * from tree-nodes where kind = "path";
let meta-paths = select l."attribute" as "attribute", l."meta" as "meta", r."id" as "path-node" from meta-path-edges as l join paths as r on l."child" = r."id";
let meta-path-segment-edges = select l."attribute" as "attribute", r."child" as "child", l."meta" as "meta" from meta-paths as l join "syntax-child" as r on l."path-node" = r."parent";
let segments = select * from tree-nodes where kind = "path-segment";
let segment-name-ref-edges = select r."child" as "child", l."id" as "segment" from segments as l join "syntax-child" as r on l."id" = r."parent";
let name-refs = select * from tree-nodes where kind = "name-ref";
let segment-name-refs = select r."id" as "name-ref", l."segment" as "segment" from segment-name-ref-edges as l join name-refs as r on l."child" = r."id";
let segment-identifiers = select r."kind" as "kind", l."name-ref" as "name-ref", l."segment" as "segment", r."text" as "text", r."token" as "token" from segment-name-refs as l join token-edges as r on l."name-ref" = r."parent";
let attribute-names = select l."attribute" as "attribute", l."meta" as "meta", r."text" as "name" from meta-path-segment-edges as l join segment-identifiers as r on l."child" = r."segment";
let meta-tree-edges = select l."attribute" as "attribute", r."child" as "child", l."name" as "name" from attribute-names as l join "syntax-child" as r on l."meta" = r."parent";
let token-trees = select * from tree-nodes where kind = "token-tree";
let attribute-trees = select l."attribute" as "attribute", r."id" as "id", l."name" as "name" from meta-tree-edges as l join token-trees as r on l."child" = r."id";
let attribute-tree-roots = project(from=attribute-trees, columns=["id"]);
let attribute-owned-nodes = axis(from=tree-nodes, relation="syntax-child", direction=nearest-ancestor, domain=attribute-tree-roots);
let attribute-nested-tokens = select r."kind" as "kind", l."related" as "root", r."text" as "text", r."token" as "token" from attribute-owned-nodes as l join token-edges as r on l."id" = r."parent";
let attribute-root-tokens = select r."kind" as "kind", l."id" as "root", r."text" as "text", r."token" as "token" from attribute-tree-roots as l join token-edges as r on l."id" = r."parent";
let attribute-tree-tokens = union(left=attribute-nested-tokens, right=attribute-root-tokens);
let attribute-tokens = select r."attribute" as "attribute", r."name" as "name", l."text" as "text" from attribute-tree-tokens as l join attribute-trees as r on l."root" = r."id";
let pub-use-mentions = select * from attribute-tokens where glob_any(text, "{pub_use,restriction}");
let suppressing-mentions = select * from pub-use-mentions where glob_any(name, "{allow,expect}");
let suppressions = project(from=suppressing-mentions, columns=["attribute"]);
let visible-import-attribute-edges = select r."child" as "attribute" from visible-imports as l join "syntax-child" as r on l."id" = r."parent";
let stray-suppressions = antijoin(left=suppressions, right=visible-import-attribute-edges, left-on=["attribute"], right-on=["attribute"]);
let stray-candidates = select r."file" as "file", r."span" as "span" from stray-suppressions as l join attributes as r on l."attribute" = r."id";
let resource-export-files = select l."file" as "file" from visible-imports as l join resource-imports as r on l."id" = r."id";
let ordinary-stray-rows = antijoin(left=stray-candidates, right=resource-export-files, left-on=["file"], right-on=["file"]);
let broad-suppressions = select * from suppressing-mentions where text = "restriction";
let broad-rows = select r."file" as "file", r."span" as "span" from broad-suppressions as l join attributes as r on l."attribute" = r."id";
let stray-rows = union(left=ordinary-stray-rows, right=broad-rows);
let stray-described = extend(from=stray-rows, values={"kind": "attribute", "problem": "suppresses `clippy::pub_use` outside an SDK surface"});
let declaration-and-suppression-findings = union(left=forwarding-described, right=stray-described);
let macro-definitions = select * from tree-nodes where glob_any(kind, "{macro-rules,macro-def}");
let macro-descendants = axis(from=macro-definitions, relation="syntax-child", direction=descendant, domain=token-trees);
let macro-trees = project(from=macro-descendants, columns=["related"]);
let macro-tree-children = select r."child" as "child", r."ordinal" as "ordinal", l."related" as "tree" from macro-trees as l join "syntax-child" as r on l."related" = r."parent";
let macro-tokens = select r."kind" as "kind", l."ordinal" as "ordinal", r."file" as "file", r."span" as "span", r."text" as "text", r."id" as "token", l."tree" as "tree" from macro-tree-children as l join tree-tokens as r on l."child" = r."id";
let macro-publics = select * from macro-tokens where kind = "pub-kw";
let macro-binding-keywords = select * from macro-tokens where glob_any(kind, "{type-kw,use-kw,extern-kw}");
let macro-keyword-pairs = select r."token" as "binding", r."ordinal" as "binding-ordinal", r."text" as "kind", r."file" as "file", l."token" as "public", l."ordinal" as "public-ordinal", r."span" as "span", l."tree" as "tree" from macro-publics as l join macro-binding-keywords as r on l."tree" = r."tree";
let macro-ordered-pairs = select * from macro-keyword-pairs where public-ordinal < binding-ordinal;
let macro-trivia = select * from macro-tokens where glob_any(kind, "{whitespace,comment}");
let macro-significant-tokens = antijoin(left=macro-tokens, right=macro-trivia, left-on=["token"], right-on=["token"]);
let macro-pair-candidates = select r."ordinal" as "between", l."binding" as "binding", l."binding-ordinal" as "binding-ordinal", l."public" as "public", l."public-ordinal" as "public-ordinal" from macro-ordered-pairs as l join macro-significant-tokens as r on l."tree" = r."tree";
let macro-pair-after-public = select * from macro-pair-candidates where between > public-ordinal;
let macro-pair-blockers = select * from macro-pair-after-public where between < binding-ordinal;
let macro-adjacent-pairs = antijoin(left=macro-ordered-pairs, right=macro-pair-blockers, left-on=["public", "binding"], right-on=["public", "binding"]);
let macro-rows = project(from=macro-adjacent-pairs, columns=["file", "span", "kind"]);
let macro-described = extend(from=macro-rows, values={"problem": "in a macro body beside `pub` forwards a name with explicit visibility"});
let findings = union(left=declaration-and-suppression-findings, right=macro-described);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "{kind} {problem}"
help = "Import from the defining module and remove forwarding visibility. Only the src tree of the product’s actual SDK spec placement is excluded by its Tastemaker entry; neither a CLI nor an ordinary crate root has a reexport allowance. The narrow port factory resource-handle export, canonical inbound one-item private domain signature-type exports and one-item application exports of a type the interface's signatures reach are allowed; grouped, renamed and implementation exports are not."

[given]
include = ['**']

[[scenarios]]
id = 'private-imports'
scenario = 'Private imports and owned declarations.'
given.exclude = ['**/src/lib.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
pub mod owned;
'''
given.files.'src/owned.rs' = '''
use crate::owned::inner::Thing;
pub struct Owned(u8);
mod inner {
    pub struct Thing;
}
'''

[[scenarios]]
id = 'public-import'
scenario = 'A public import in an ordinary crate root.'
given.include = ['**/src/lib.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"

[features]
derive = []

[dependencies]
fixture_macros = { path = "macros" }

[workspace]
members = ["macros"]
'''
given.files.'macros/Cargo.toml' = '''
[package]
name = "fixture_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true
'''
given.files.'macros/src/lib.rs' = '''
use proc_macro::TokenStream;

#[proc_macro_derive(Entity)]
pub fn entity(_input: TokenStream) -> TokenStream {
    TokenStream::new()
}

#[proc_macro_derive(Relation, attributes(relation))]
pub fn relation(_input: TokenStream) -> TokenStream {
    TokenStream::new()
}

#[proc_macro_derive(Scalar)]
pub fn scalar(_input: TokenStream) -> TokenStream {
    TokenStream::new()
}

#[proc_macro_derive(Catalog)]
pub fn catalog(_input: TokenStream) -> TokenStream {
    TokenStream::new()
}

#[proc_macro_derive(Features)]
pub fn features(_input: TokenStream) -> TokenStream {
    TokenStream::new()
}

#[proc_macro]
pub fn table(_input: TokenStream) -> TokenStream {
    TokenStream::new()
}
'''
given.files.'src/lib.rs' = '''
pub use crate::inner::Thing;
mod inner {
    pub struct Thing;
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 1 },
]

[[scenarios]]
id = 'crate-import'
scenario = "A crate-visible import forwards another module's item."
given.exclude = ['**/src/lib.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
