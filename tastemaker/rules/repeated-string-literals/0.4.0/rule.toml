description = "A string literal of six or more characters, not an import specifier, not one lower-case word and not written where the language admits only a literal, whose decoded value appears in at least `min-files` files in scope, reported at each occurrence."
why = "The same text written in many files is one value with no single definition: a change to it is a search-and-replace, and a typo in one copy is a silent divergence. Name it once, as a constant or a function, where the concept it names lives. Read from the decoded value (`\"a\\n\"` and `\"a\n\"` written two ways are one value); values the entry's `allowed` lists are never reported. An import specifier (`'../../context'` in `import { x } from '../../context'`, a `require`, an `import \"fmt\"`, a `#[path]`) is not counted: it names a module where it is loaded, and the import relations read it. A string written where the language admits only a literal, so no constant can stand in for it, is not counted either: in Rust an attribute's arguments (`#[serde(rename_all = \"kebab-case\")]`, `#[deprecated = \"…\"]`), a `cfg` predicate (`feature = \"std\"`) and an ABI (`extern \"system\"`). A value that is one lower-case word (`source`, `reference`, `running`) is a format's vocabulary, a column, a key or a state a file's format names, and is never counted, as `constants-once` already treats it; a value with any other character (`two words`, `Source1`, `cases.jsonl`) is. Not seen: a literal inside a macro's tokens that the provider does not decode, byte strings, and a value built at run time."

query = '''
param min-files: integer;
param allowed: set<string>;
let long = select * from "string-literal" where import = "false" and glob_any(value, "??????*") and glob_any(value, "*[!a-z]*");
let fixed_places = select id, file from "syntax-tree" where kind = "attr" or kind = "cfg-atom" or kind = "abi";
let written = select occurrence as id, file from long;
let fixed = axis(from=written, relation="syntax-child", direction=nearest-ancestor, domain=fixed_places);
let free = antijoin(left=long, right=fixed, left-on=["occurrence"], right-on=["id"]);
let literals = select * from free where value not in $allowed;
let spread = group-count(from=literals, keys=["value"], count="files", distinct="file");
let repeated = select * from spread where files >= $min-files;
let occurrences = select r."files" as "files", l."file" as "file", l."span" as "span", l."value" as "value" from literals as l join repeated as r on l."value" = r."value";
emit occurrences subject "file" key("span");
'''

[params.min-files]
type = "integer"
description = "The fewest distinct files a value must appear in to be reported."

[params.allowed]
type = "set<string>"
description = "Values that may repeat freely, such as a common format string."

[diagnostic]
primary = "span"
message = "the string `{value}` is written in {files} files"
help = "Name it once, as a constant or a function where its concept lives, and use that."

[[scenarios]]
id = 'one-message-written-three-files'
scenario = 'One message written in three files.'
given.include = ['**']
given.params = { min-files = 3, allowed = ['{} {}'] }
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
mod load;
mod save;

pub(crate) fn fail() -> &'static str {
    "configuration missing"
}
'''
given.files.'src/load.rs' = '''
pub(crate) fn fail() -> &'static str {
    "configuration missing"
}
'''
given.files.'src/save.rs' = '''
pub(crate) fn fail() -> &'static str {
    "configuration missing"
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 5 },
  { path = 'src/load.rs', line = 2 },
  { path = 'src/save.rs', line = 2 },
]

