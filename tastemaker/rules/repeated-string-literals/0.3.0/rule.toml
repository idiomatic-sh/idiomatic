[[scenarios]]
id = 'import-specifier-three-files'
scenario = 'One module imported by the same specifier in three files.'
given.include = ['**']
given.params = { min-files = 3, allowed = [] }
given.files.'src/load/index.ts' = '''
import { context } from "../shared/context";

export const load = context;
'''
given.files.'src/save/index.ts' = '''
import { context } from "../shared/context";

export const save = context;
'''
given.files.'src/show/index.ts' = '''
export { context as show } from "../shared/context";
'''
given.files.'src/shared/context.ts' = '''
export const context = 1;
'''

