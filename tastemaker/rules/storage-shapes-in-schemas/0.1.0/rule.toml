description = "A string table is written only in an outbound adapter's `schemas.rs`: no other file declares a struct or field named `*Table`, `*Pool`, `*Interner`, `*Strings`, `strings` or `interned` that holds a `Vec` of `String` or `str`, nor, in a crate that declares such a table, an integer newtype named `*Ref`."
why = "The core holds plain Rust values: a name is a `Box<str>`, a path is a path. How they become stored bytes is the adapter's concern, done with serde in its `schemas.rs`, so a change of format never reaches the core. A string table with numeric references into it is the storage's shape: written in the core it ties every user of a value to one encoding, and the reference is meaningless without the table it came from. Read as written: a struct whose name ends in `Table`, `Pool`, `Interner` or `Strings`, or whose record field is named `strings`, `interned`, `interner`, `pool`, `table` or ends in `_table`, `_pool` or `_strings`, and which names `Vec` and `String` or `str` in its declaration; and a struct named `*Ref` that names an integer type (`u8` to `u128`, `usize`), in a package that also declares such a table outside the adapters. Not seen: a table of another element type (`Vec<Vec<u8>>`), a table named otherwise, a map used as an interner, a table reached through a type alias, and a reference named otherwise (`Slot(u32)`). Byte offsets, spans and indices are not read at all: a position in a source file or in an in-memory list is a domain value, and a byte offset or index into stored bytes cannot be told from it by name, so the rule does not claim to find one."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."kind" = "ident";
let structs = select * from tree-nodes where kind = "struct";
let struct-children = select l."id" as "struct", r."child" as "child" from structs as l join "syntax-child" as r on l."id" = r."parent";
let struct-name-nodes = select l."struct" as "struct", l."child" as "node" from struct-children as l join tree-nodes as r on l."child" = r."id" where r."kind" = "name";
let struct-name-tokens = select l."struct" as "struct", r."child" as "token" from struct-name-nodes as l join "syntax-child" as r on l."node" = r."parent";
let struct-names = select l."struct" as "struct", r."text" as "name", r."file" as "file", r."span" as "span" from struct-name-tokens as l join tree-tokens as r on l."token" = r."id";
let inside = axis(from=structs, relation="syntax-child", direction=descendant, domain=tree-tokens);
let inner = select l."id" as "struct", r."text" as "text" from inside as l join tree-tokens as r on l."related" = r."id";
let integer-rows = select l."struct" as "struct" from inner as l where glob_any(l."text", "{u8,u16,u32,u64,u128,usize}");
let vec-rows = select l."struct" as "struct" from inner as l where l."text" = "Vec";
let text-rows = select l."struct" as "struct" from inner as l where glob_any(l."text", "{String,str}");
let integers = project(from=integer-rows, columns=["struct"]);
let vecs = project(from=vec-rows, columns=["struct"]);
let texts = project(from=text-rows, columns=["struct"]);
let reference-names = select * from struct-names where glob_any(name, "{*Ref}");
let integer-references = select l."name" as "name", l."file" as "file", l."span" as "span" from reference-names as l join integers as r on l."struct" = r."struct";
let table-names = select * from struct-names where glob_any(name, "{*Table,*Pool,*Interner,*Strings}");
let table-vecs = select l."struct" as "struct", l."name" as "name", l."file" as "file", l."span" as "span" from table-names as l join vecs as r on l."struct" = r."struct";
let tables = select l."name" as "name", l."file" as "file", l."span" as "span" from table-vecs as l join texts as r on l."struct" = r."struct";
let fields = select * from tree-nodes where kind = "record-field";
let field-children = select l."id" as "field", r."child" as "child" from fields as l join "syntax-child" as r on l."id" = r."parent";
let field-name-nodes = select l."field" as "field", l."child" as "node" from field-children as l join tree-nodes as r on l."child" = r."id" where r."kind" = "name";
let field-name-tokens = select l."field" as "field", r."child" as "token" from field-name-nodes as l join "syntax-child" as r on l."node" = r."parent";
let field-names = select l."field" as "field", r."text" as "name", r."file" as "file", r."span" as "span" from field-name-tokens as l join tree-tokens as r on l."token" = r."id";
let table-fields = select * from field-names where glob_any(name, "{strings,interned,interner,pool,table,*_table,*_pool,*_strings}");
let inside-fields = axis(from=fields, relation="syntax-child", direction=descendant, domain=tree-tokens);
let field-inner = select l."id" as "field", r."text" as "text" from inside-fields as l join tree-tokens as r on l."related" = r."id";
let field-vec-rows = select l."field" as "field" from field-inner as l where l."text" = "Vec";
let field-text-rows = select l."field" as "field" from field-inner as l where glob_any(l."text", "{String,str}");
let field-vecs = project(from=field-vec-rows, columns=["field"]);
let field-texts = project(from=field-text-rows, columns=["field"]);
let held-vecs = select l."field" as "field", l."name" as "name", l."file" as "file", l."span" as "span" from table-fields as l join field-vecs as r on l."field" = r."field";
let held-tables = select l."name" as "name", l."file" as "file", l."span" as "span" from held-vecs as l join field-texts as r on l."field" = r."field";
let all-tables = union(left=tables, right=held-tables);
let table-packages = select l."package" as "package" from all-tables as t join "file-package" as l on t."file" = l."path";
let packages-with-tables = project(from=table-packages, columns=["package"]);
let packaged-references = select l."name" as "name", l."file" as "file", l."span" as "span", r."package" as "package" from integer-references as l join "file-package" as r on l."file" = r."path";
let references = select l."name" as "name", l."file" as "file", l."span" as "span" from packaged-references as l join packages-with-tables as r on l."package" = r."package";
let shapes = union(left=all-tables, right=references);
emit shapes subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{name}` is a storage shape outside an adapter's `schemas.rs`"
help = "Keep the core's value plain (`Box<str>`, a path, a count) and move the table, the offset or the index into the `schemas.rs` of the outbound adapter that stores it, converting to and from the core type there with serde. If `{name}` is not a storage shape, name it for what it is (a source `Span` is a `SourceRange`). An ignore is never the fix."

[given]
include = ['**/*.rs']
exclude = ['**/outbound/*/adapters/*/schemas.rs', '**/outbound/*/adapters/*/schemas/**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'domain-string-table'
scenario = "A string table with `TextRef(u32)` references into it in the keeping domain's `types.rs` is found."
given.files.'crates/core/src/domain/keeping/types.rs' = '''
/// A reference into the table.
pub struct TextRef(pub u32);

/// The strings the stored rows refer to.
pub struct Interner {
    /// The table.
    pub strings: Vec<Box<str>>,
}
'''
then.findings = [
  { path = 'crates/core/src/domain/keeping/types.rs', line = 2 },
  { path = 'crates/core/src/domain/keeping/types.rs', line = 5 },
  { path = 'crates/core/src/domain/keeping/types.rs', line = 7 },
]

[[scenarios]]
id = 'adapter-schemas-string-table'
scenario = "The same table and `TextRef(u32)` in the lint store adapter's `schemas.rs` pass."
given.files.'crates/core/src/lib.rs' = '''
//! The core.
'''
given.files.'crates/core/src/outbound/lint_store/adapters/postcard/schemas.rs' = '''
/// A reference into the table.
pub struct TextRef(pub u32);

/// The strings the stored rows refer to.
pub struct Interner {
    /// The table.
    pub strings: Vec<Box<str>>,
}
'''

[[scenarios]]
id = 'adapter-implementation-string-table'
scenario = "The same table in an adapter's implementation file, not its `schemas.rs`, is found."
given.files.'crates/core/src/outbound/lint_store/adapters/postcard/adapter.rs' = '''
/// A reference into the table.
pub struct TextRef(pub u32);

/// The strings the stored rows refer to.
pub struct Interner {
    /// The table.
    pub strings: Vec<Box<str>>,
}
'''
then.findings = [
  { path = 'crates/core/src/outbound/lint_store/adapters/postcard/adapter.rs', line = 2 },
  { path = 'crates/core/src/outbound/lint_store/adapters/postcard/adapter.rs', line = 5 },
  { path = 'crates/core/src/outbound/lint_store/adapters/postcard/adapter.rs', line = 7 },
]

[[scenarios]]
id = 'core-schemas-string-table'
scenario = "The same table in a `schemas.rs` of the core, outside any adapter, is found: only an outbound adapter's `schemas.rs` may hold it."
given.files.'crates/core/src/domain/keeping/schemas.rs' = '''
/// A reference into the table.
pub struct TextRef(pub u32);

/// The strings the stored rows refer to.
pub struct Interner {
    /// The table.
    pub strings: Vec<Box<str>>,
}
'''
then.findings = [
  { path = 'crates/core/src/domain/keeping/schemas.rs', line = 2 },
  { path = 'crates/core/src/domain/keeping/schemas.rs', line = 5 },
  { path = 'crates/core/src/domain/keeping/schemas.rs', line = 7 },
]

[[scenarios]]
id = 'ordinary-domain-type'
scenario = "An ordinary domain type with a `Box<str>` field, a list of names and a count pass."
given.files.'crates/core/src/domain/keeping/types.rs' = '''
/// A kept lint.
pub struct Lint {
    /// Its name.
    pub name: Box<str>,
    /// Its messages.
    pub messages: Vec<String>,
    /// How many files it ran on.
    pub files: u32,
}
'''

[[scenarios]]
id = 'positions-and-offsets'
scenario = "An in-memory `RowIndex(usize)` and a source `ByteOffset(usize)` in the domain pass: they are positions, not storage shapes."
given.files.'crates/core/src/domain/recording/types.rs' = '''
/// A byte offset into a source file.
pub struct ByteOffset(pub usize);

/// A position in the list of rows.
pub struct RowIndex(pub usize);
'''

[[scenarios]]
id = 'reference-without-table'
scenario = "A `TextRef(u32)` in a crate that declares no string table passes, and so does a table of another element type."
given.files.'crates/core/src/domain/keeping/types.rs' = '''
/// A reference.
pub struct TextRef(pub u32);

/// A table of raw rows.
pub struct RowTable {
    /// The rows.
    pub rows: Vec<Vec<u8>>,
}
'''
