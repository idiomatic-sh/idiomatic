description = "A crate's integration test (`tests/**/*.rs`, and a colocated `acceptance.rs` that `tests/bdd.rs` runs) names its own crate, other crates' `fixtures` modules and whatever else `allowed` lists, and no other crate of the repository."
why = "A scenario that reaches into another crate's logic tests that crate from the wrong place: it belongs in the crate that owns the behaviour. A crate of the repository is one whose manifest declares a `[lib]` name; std and the test crates are none, so they are always allowed. A path is read as written, from imports and from the paths code names: its first segment is the crate. Allowed: the file's own crate (the `[lib]` name of the manifest its package is), any path through a `fixtures` module, and the globs of `allowed`. Declared canonical contract paths are matched exactly after Cargo binding normalization; a whole-crate alias import is not a declared contract. Not seen: a path inside a macro invocation's tokens."

query = '''
param allowed: set<string>;
param test-contracts: list<table>;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file" from "syntax-tree" as l where l."text" = "";
let documents = select * from tree-nodes where kind = "toml";
let entries = project(from="entry", columns=["file", "owner", "occurrence", "key", "decoded"]);
let lib-keys = select * from entries where key = "lib";
let lib-roots = select l."occurrence" as "entry", l."file" as "manifest" from lib-keys as l join documents as r on l."owner" = r."id";
let lib-tables = select l."manifest" as "manifest", r."id" as "table" from lib-roots as l join "mapping" as r on l."entry" = r."owner";
let names = select * from entries where key = "name";
let libs = select l."manifest" as "manifest", r."decoded" as "lib" from lib-tables as l join names as r on l."table" = r."owner";
let crates = project(from=libs, columns=["lib"]);
let package_keys = select * from entries where key = "package";
let package_roots = select l.occurrence as entry, l.file as manifest from package_keys as l join documents as r on l.owner = r.id;
let package_tables = select l.manifest as manifest, r.id as table from package_roots as l join "mapping" as r on l.entry = r.owner;
let package_names = select l.manifest as manifest, r.decoded as package from package_tables as l join names as r on l.table = r.owner;
let imports = project(from="static-import", columns=["file", "span", "target"]);
let references = project(from="reference", columns=["file", "span", "target"]);
let mentions = union(left=imports, right=references);
let qualified = capture(from=mentions, path="target", pattern="{head}::{*rest}", captures=["head", "rest"]);
let root_names = capture(from=mentions, path="target", pattern="{head}", captures=["head"]);
let roots = extend(from=root_names, values={rest: ""});
let headed = union(left=qualified, right=roots);
let packaged = select l.file as file, l.span as span, l.target as target, l.head as head, l.rest as rest, r.package as manifest from headed as l join "file-package" as r on l.file = r.path;
let direct = select l.file as file, l.span as span, l.target as target, l.head as head, l.rest as rest, l.manifest as manifest, r.lib as canonical from packaged as l join libs as r on l.head = r.lib;
let dependencies = select l.file as file, l.span as span, l.target as target, l.head as head, l.rest as rest, l.manifest as manifest, r.package as package from packaged as l join "package-dependency" as r on l.manifest = r.source and l.head = r.binding;
let targets = select l.file as file, l.span as span, l.target as target, l.head as head, l.rest as rest, l.manifest as manifest, r.manifest as dependency from dependencies as l join package_names as r on l.package = r.package;
let aliases = select l.file as file, l.span as span, l.target as target, l.head as head, l.rest as rest, l.manifest as manifest, r.lib as canonical from targets as l join libs as r on l.dependency = r.manifest;
let repository = union(left=direct, right=aliases);
let owned = select l.file as file, l.span as span, l.target as target, l.head as head, l.rest as rest, l.canonical as canonical, r.lib as own from repository as l join libs as r on l.manifest = r.manifest;
let others = select * from owned where canonical != own;
let unfixtured = select * from others where not glob_any(target, "{*::fixtures,*::fixtures::*}");
let unallowed = select * from unfixtured where not glob_any(target, $allowed);
let declared = rows(from=$test-contracts, columns=["path"]);
let contracts = capture(from=declared, path="path", pattern="{head}::{*rest}", captures=["head", "rest"]);
let matched = select l.file as file, l.span as span, l.target as target, l.canonical as canonical, l.rest as rest from unallowed as l join contracts as r on l.canonical = r.head and l.rest = r.rest;
let refused = antijoin(left=unallowed, right=matched, left-on=["file", "span", "target", "canonical", "rest"], right-on=["file", "span", "target", "canonical", "rest"]);
let rows = project(from=refused, columns=["file", "span", "head"]);
let tests = select * from rows where glob_any(file, "{**/tests/**/*.rs,**/acceptance.rs}");
emit tests subject "file" key("span");
'''

[params.allowed]
type = "set<string>"
description = "Paths of another crate a test may name besides its fixtures, each a glob as written in code (`*::types::*`); `[]` allows only the crate's own paths and fixtures."

[params.test-contracts]
type = "list<table>"
description = "Explicit canonical public contract paths, each { path }; not package or implementation wildcards."

[diagnostic]
primary = "span"
message = "this test names `{head}`, another crate of the repository, outside its fixtures"
help = "Move the scenario to the crate that owns the behaviour (its tests/bdd.feature or its own tests), or reach the other crate through its `fixtures` module."

[given]
include = ['**']
params = { allowed = [], test-contracts = [] }
files.'Cargo.toml' = '''
[workspace]
members = ["app", "store"]
resolver = "3"
'''
files.'app/Cargo.toml' = '''
[package]
name = "demo-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "app"
path = "src/lib.rs"

[dev-dependencies]
store = { package = "demo-store", path = "../store" }
'''
files.'app/src/lib.rs' = '''
//! The app.

/// Runs.
pub fn run() {}
'''
files.'store/Cargo.toml' = '''
[package]
name = "demo-store"
version = "0.1.0"
edition = "2024"

[lib]
name = "store"
path = "src/lib.rs"
'''

[[scenarios]]
id = 'test-names-another-crates-logic'
scenario = "A crate's test names another crate's domain: it is refused, its own crate and the other's fixtures pass."
given.files.'app/tests/end_to_end.rs' = '''
//! The app end to end.

use app::run;
use store::domain::compare;
use store::fixtures::rows;

#[test]
fn runs() {
    run();
    compare();
    rows();
}
'''
given.files.'store/src/lib.rs' = '''
//! The store.

pub mod domain {
    /// Compares.
    pub fn compare() {}
}

pub mod fixtures {
    /// Rows.
    pub fn rows() {}
}
'''
then.findings = [
  { path = 'app/tests/end_to_end.rs', line = 4 },
]

