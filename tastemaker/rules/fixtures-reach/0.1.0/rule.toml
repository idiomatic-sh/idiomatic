description = "A file the `fixtures` feature builds names another crate's `fixtures` module only when the crate's own `fixtures` feature enables that crate's `fixtures` (`<dep>/fixtures`)."
why = "A crate's fixtures are built for its own tests and, through its `fixtures` feature, for other crates' tests. A fixtures file that names a dependency's `fixtures` compiles under `cargo test`, where `[dev-dependencies]` enable them, and fails when the crate is built with `--features fixtures` alone (cargo-hack), where only the feature's own `<dep>/fixtures` entries do: the break shows up only at the manual each-feature stage. A file is built by the feature when it is `fixtures.rs` or under a `fixtures/` directory, or its module is declared under a `cfg` naming the `fixtures` feature, and it carries no `#![cfg(test)]` (the form for fixtures that stand on a dev-dependency's fixtures). The crate a path names is its first segment, matched to the dependency the manifest binds under that name (`package-dependency`); `<dep>/fixtures` is read from the manifest's `[features] fixtures` list, so the entry reaches the `Cargo.toml` files too. Not seen: a dependency whose key holds a dash, a module nested below a feature-gated module outside a `fixtures/` directory, and a path inside a macro's tokens."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let rust-files = select l."path" as "file" from "filesystem.file" as l where glob_any(l."path", "**/*.rs");
let path-gated = select * from rust-files where glob_any(file, "{**/fixtures.rs,**/fixtures/**}");
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select l."file" as "file", r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let top-items = select r."id" as "id", r."kind" as "kind", r."file" as "file" from top-edges as l join tree-nodes as r on l."child" = r."id";
let attr-nodes = select * from tree-nodes where kind = "attr";
let cfg-nodes = select * from tree-nodes where kind = "cfg-meta";
let cfg-atoms = select * from tree-nodes where kind = "cfg-atom";
let idents = select * from tree-tokens where kind = "ident";
let test-idents = select * from idents where text = "test";
let strings = select * from tree-tokens where kind = "string";
let fixtures-strings = select * from strings where glob_any(text, "?fixtures?");
let bangs = select * from tree-tokens where text = "!";
let top-attrs = select l."id" as "id", l."file" as "file" from top-items as l join attr-nodes as r on l."id" = r."id";
let top-attr-kids = select l."id" as "attr", l."file" as "file", r."child" as "child" from top-attrs as l join "syntax-child" as r on l."id" = r."parent";
let inner-attr-rows = select l."attr" as "attr", l."file" as "file" from top-attr-kids as l join bangs as r on l."child" = r."id";
let inner-cfg = select l."attr" as "decl", l."file" as "file", r."id" as "id" from top-attr-kids as l join cfg-nodes as r on l."child" = r."id";
let inner-cfg-on = select l."decl" as "decl", l."file" as "file", l."id" as "id" from inner-cfg as l join inner-attr-rows as r on l."decl" = r."attr";
let inner-atoms = axis(from=inner-cfg-on, relation="syntax-child", direction=descendant, domain=cfg-atoms);
let inner-atom-edges = select l."id" as "meta", l."file" as "file", r."child" as "token" from inner-atoms as l join "syntax-child" as r on l."related" = r."parent";
let inner-tests = select l."meta" as "meta", l."file" as "file" from inner-atom-edges as l join test-idents as r on l."token" = r."id";
let inner-fixtures = select l."meta" as "meta" from inner-atom-edges as l join fixtures-strings as r on l."token" = r."id";
let inner-test-only = antijoin(left=inner-tests, right=inner-fixtures, left-on=["meta"], right-on=["meta"]);
let test-only-files = project(from=inner-test-only, columns=["file"]);
let modules = select * from top-items where kind = "module";
let names = select * from tree-nodes where kind = "name";
let module-kids = select l."id" as "id", l."file" as "file", r."child" as "child" from modules as l join "syntax-child" as r on l."id" = r."parent";
let module-names = select l."id" as "id", l."file" as "file", r."id" as "name-node" from module-kids as l join names as r on l."child" = r."id";
let module-name-tokens = select l."id" as "id", l."file" as "file", r."child" as "token" from module-names as l join "syntax-child" as r on l."name-node" = r."parent";
let module-named = select l."id" as "id", l."file" as "file", r."text" as "name" from module-name-tokens as l join tree-tokens as r on l."token" = r."id";
let module-attrs = select l."id" as "decl", r."id" as "attr" from module-kids as l join attr-nodes as r on l."child" = r."id";
let module-attr-kids = select l."decl" as "decl", r."child" as "child" from module-attrs as l join "syntax-child" as r on l."attr" = r."parent";
let module-cfgs = select r."id" as "id", l."decl" as "decl" from module-attr-kids as l join cfg-nodes as r on l."child" = r."id";
let module-atoms = axis(from=module-cfgs, relation="syntax-child", direction=descendant, domain=cfg-atoms);
let module-atom-edges = select l."decl" as "decl", r."child" as "token" from module-atoms as l join "syntax-child" as r on l."related" = r."parent";
let module-fixtures = select l."decl" as "decl" from module-atom-edges as l join fixtures-strings as r on l."token" = r."id";
let fixtures-decls = select l."file" as "file", l."name" as "name" from module-named as l join module-fixtures as r on l."id" = r."decl";
let decl-places = capture(from=fixtures-decls, path="file", pattern="{*dir}/{stem}.rs", captures=["dir", "stem"]);
let child-places = capture(from=rust-files, path="file", pattern="{*dir}/{stem}/{child}.rs", captures=["dir", "stem", "child"]);
let declared-gated = select r."file" as "file" from decl-places as l join child-places as r on l."dir" = r."dir" and l."stem" = r."stem" and l."name" = r."child";
let lib-places = capture(from=fixtures-decls, path="file", pattern="{*dir}/{root}.rs", captures=["dir", "root"]);
let lib-roots = select * from lib-places where glob_any(root, "{lib,main}");
let sibling-places = capture(from=rust-files, path="file", pattern="{*dir}/{child}.rs", captures=["dir", "child"]);
let root-gated = select r."file" as "file" from lib-roots as l join sibling-places as r on l."dir" = r."dir" and l."name" = r."child";
let gated-0 = union(left=path-gated, right=declared-gated);
let gated-1 = union(left=gated-0, right=root-gated);
let gated = antijoin(left=gated-1, right=test-only-files, left-on=["file"], right-on=["file"]);
let imports = project(from="static-import", columns=["file", "span", "target"]);
let references = project(from="reference", columns=["file", "span", "target"]);
let mentions = union(left=imports, right=references);
let fixtures-mentions = select * from mentions where glob_any(target, "{*::fixtures,*::fixtures::*}");
let gated-mentions = select l."file" as "file", l."span" as "span", l."target" as "target" from fixtures-mentions as l join gated as r on l."file" = r."file";
let named-crates = capture(from=gated-mentions, path="target", pattern="{krate}::{*rest}", captures=["krate", "rest"]);
let owned = select l."file" as "file", l."span" as "span", l."krate" as "krate", r."package" as "manifest" from named-crates as l join "file-package" as r on l."file" = r."path";
let dependencies = select l."source" as "manifest", l."binding" as "krate" from "package-dependency" as l where l."kind" != "peer";
let on-dependencies = select l."file" as "file", l."span" as "span", l."krate" as "krate", l."manifest" as "manifest" from owned as l join dependencies as r on l."manifest" = r."manifest" and l."krate" = r."krate";
let feature-elements = select * from "sequence-element" where glob_any(decoded, "*/fixtures");
let feature-owners = select l."decoded" as "decoded", r."key" as "name", l."file" as "file", r."owner" as "table" from feature-elements as l join "entry" as r on l."owner" = r."occurrence";
let feature-tables = select l."decoded" as "decoded", r."owner" as "heading", l."name" as "name", l."file" as "file" from feature-owners as l join "mapping" as r on l."table" = r."id";
let feature-headings = select l."decoded" as "decoded", l."name" as "name", l."file" as "file", r."owner" as "root", r."key" as "section" from feature-tables as l join "entry" as r on l."heading" = r."occurrence";
let documents = select * from tree-nodes where kind = "toml";
let top-level-features = select l."decoded" as "decoded", l."name" as "name", l."file" as "file", l."section" as "section" from feature-headings as l join documents as r on l."root" = r."id";
let fixtures-feature = select * from top-level-features where section = "features" and name = "fixtures";
let enabled = capture(from=fixtures-feature, path="decoded", pattern="{krate}/fixtures", captures=["krate"]);
let enabled-keys = select l."file" as "manifest", l."krate" as "krate" from enabled as l;
let unenabled = antijoin(left=on-dependencies, right=enabled-keys, left-on=["manifest", "krate"], right-on=["manifest", "krate"]);
let findings = project(from=unenabled, columns=["file", "span", "krate"]);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "names `{krate}`'s `fixtures`, which this crate's `fixtures` feature does not enable"
help = "Add `<dep>/fixtures` to this crate's `[features] fixtures` list, so the feature builds what the file names; or, when only this crate's own tests need it, gate the file `#![cfg(test)]`."

[given]
include = ['**/*.rs', '**/Cargo.toml']
exclude = ['**/*_test.rs', '**/tests/**', '**/benches/**']
files.'Cargo.toml' = '''
[workspace]
members = ["demo", "other"]
resolver = "3"
'''
files.'other/Cargo.toml' = '''
[package]
name = "other"
version = "0.1.0"
edition = "2024"

[features]
fixtures = []
'''
files.'other/src/lib.rs' = '''
//! Other.

#[cfg(any(test, feature = "fixtures"))]
pub mod fixtures;
'''
files.'other/src/fixtures.rs' = '''
//! Fakes.

/// A fake.
pub struct Fake;
'''
files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
other = { path = "../other", features = ["fixtures"] }

[features]
fixtures = []
'''
files.'demo/src/lib.rs' = '''
//! Demo.

#[cfg(any(test, feature = "fixtures"))]
pub mod fixtures;
'''
files.'demo/src/fixtures.rs' = '''
//! Fakes standing on other's.

use other::fixtures::Fake;

/// The fake.
pub fn fake() -> Fake {
    Fake
}
'''

[[scenarios]]
id = 'unenabled-dev-fixtures'
scenario = "A fixtures file names a dev-dependency's fixtures that the fixtures feature does not enable."
then.findings = [
  { path = 'demo/src/fixtures.rs', line = 3 },
]

[[scenarios]]
id = 'fixtures-feature-enables-dependency'
scenario = "The fixtures feature enables the dependency's fixtures: it passes."
given.files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dependencies]
other = { path = "../other" }

[features]
fixtures = ["other/fixtures"]
'''

[[scenarios]]
id = 'test-only-fixtures-file'
scenario = "A fixtures file gated `#![cfg(test)]` names a dev-dependency's fixtures: the fixtures feature never builds it, so it passes."
given.files.'demo/src/fixtures.rs' = '''
//! Fakes standing on other's, compiled only for this crate's tests.
#![cfg(test)]

use other::fixtures::Fake;

/// The fake.
pub fn fake() -> Fake {
    Fake
}
'''

[[scenarios]]
id = 'nested-fixtures-file'
scenario = "A file under a `fixtures/` directory names the fixtures of a dependency the feature does not enable."
given.files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dependencies]
other = { path = "../other" }

[features]
fixtures = []
'''
given.files.'demo/src/fixtures.rs' = '''
//! Fakes.

pub mod contract;
'''
given.files.'demo/src/fixtures/contract.rs' = '''
//! Fakes standing on other's.

use other::fixtures::Fake;

/// The fake.
pub fn fake() -> Fake {
    Fake
}
'''
then.findings = [
  { path = 'demo/src/fixtures/contract.rs', line = 3 },
]

[[scenarios]]
id = 'feature-gated-module'
scenario = "A module declared under `#[cfg(feature = \"fixtures\")]` outside a fixtures directory names the fixtures of a dependency the feature does not enable."
given.files.'demo/Cargo.toml' = '''
[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dependencies]
other = { path = "../other" }

[features]
fixtures = []
'''
given.files.'demo/src/lib.rs' = '''
//! Demo.

#[cfg(any(test, feature = "fixtures"))]
pub mod fixtures;

#[cfg(feature = "fixtures")]
pub mod conformance;
'''
given.files.'demo/src/fixtures.rs' = '''
//! Fakes.

/// A fake.
pub struct Own;
'''
given.files.'demo/src/conformance.rs' = '''
//! Fakes standing on other's.

use other::fixtures::Fake;

/// The fake.
pub fn fake() -> Fake {
    Fake
}
'''
then.findings = [
  { path = 'demo/src/conformance.rs', line = 3 },
]
