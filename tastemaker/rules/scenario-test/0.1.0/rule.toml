description = "A scenario test holds `use` lines and at least one `#[test]` function, nothing else: no helper of its own and nothing `pub`."
why = "A scenario test builds a real owner or program from its group's fixtures, runs it, and asserts on what it observed; it is a test of a group (`service_test/<group>/test.rs`), not a table of cases, so `unit-test`'s `CASES` and `subject` shape does not fit it. What keeps it honest is its own shape: it proves something only through `#[test]` functions, so a file with none proves nothing; and every helper it needs lives in the group's `fixtures.rs` (or a parent's fixtures), so a test file never grows a second, private copy of the setup or exports an item another test imports. A top-level item that is neither a `use` nor a `#[test]` function (`#[tokio::test]` and the like count) is reported where it stands, and a file with no `#[test]` function is reported where its code begins."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let roots = select * from tree-nodes where kind = "source-file";
let item-edges = select r."child" as "id" from roots as l join "syntax-child" as r on l."id" = r."parent";
let items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from item-edges as l join tree-nodes as r on l."id" = r."id";
let tests = select l."declaration" as "id" from "decorates" as l where glob_any(l."target", "{test,*::test}");
let test-items = select l."id" as "id", l."file" as "file" from items as l join tests as r on l."id" = r."id";
let test-fns = select l."id" as "id", l."file" as "file" from test-items as l join items as r on l."id" = r."id" where r."kind" = "fn";
let kept = select * from items where glob_any(kind, "{use,attr}");
let kept-ids = project(from=kept, columns=["id"]);
let test-ids = project(from=test-fns, columns=["id"]);
let allowed = union(left=kept-ids, right=test-ids);
let extra = antijoin(left=items, right=allowed, left-on=["id"], right-on=["id"]);
let extra-found = select l."kind" as "kind", l."file" as "file", l."span" as "span" from extra as l;
let tested = project(from=test-fns, columns=["file"]);
let untested = antijoin(left=roots, right=tested, left-on=["file"], right-on=["file"]);
let untested-found = select l."kind" as "kind", l."file" as "file", l."span" as "span" from untested as l;
let found = union(left=extra-found, right=untested-found);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{kind}` breaks the scenario test's shape: it holds `use` lines and at least one `#[test]` function, nothing else"
help = "Move a helper, a type or a constant into the group's `fixtures.rs` (or the parent's `service_test/fixtures.rs` when sibling groups share it) and import it; make nothing in the test `pub`. A file with no `#[test]` function proves nothing: give it the test it is for, or delete it. A case table belongs in a `test.rs` beside its source, in `unit-test`'s shape."

[given]
include = ["**/test.rs"]

[[scenarios]]
id = "scenario-with-tests-and-fixtures"
scenario = "A scenario test that imports its setup from fixtures and holds only `#[test]` functions passes."
given.files.'src/owner/service_test/publication/test.rs' = '''
//! The owner publishes what it observed.
use super::fixtures::published_owner;

#[test]
fn publishes_each_row_once() {
    let owner = published_owner();
    assert_eq!(owner.rows(), 2);
}

#[tokio::test]
async fn publishes_after_a_restart() {}
'''

[[scenarios]]
id = "scenario-without-a-test"
scenario = "A scenario test with no `#[test]` function proves nothing and is reported where its code begins."
given.files.'src/owner/service_test/publication/test.rs' = '''
//! The owner publishes what it observed.
use super::fixtures::published_owner;
'''
then.findings = [{ path = "src/owner/service_test/publication/test.rs", line = 2 }]

[[scenarios]]
id = "scenario-exporting-a-helper"
scenario = "A scenario test that exports a `pub fn` helper is reported at the helper."
given.files.'src/owner/service_test/publication/test.rs' = '''
//! The owner publishes what it observed.
#[test]
fn publishes_each_row_once() {
    assert_eq!(rows(), 2);
}

pub fn rows() -> u8 {
    2
}
'''
then.findings = [{ path = "src/owner/service_test/publication/test.rs", line = 7 }]

[[scenarios]]
id = "scenario-with-a-private-helper-or-type"
scenario = "A private helper function, a type or a nested module in a scenario test is reported: setup lives in fixtures."
given.files.'src/owner/service_test/publication/test.rs' = '''
#[test]
fn publishes_each_row_once() {
    assert_eq!(rows(), 2);
}

fn rows() -> u8 {
    2
}

struct Probe;

#[cfg(test)]
mod more;
'''
then.findings = [
  { path = "src/owner/service_test/publication/test.rs", line = 6 },
  { path = "src/owner/service_test/publication/test.rs", line = 10 },
  { path = "src/owner/service_test/publication/test.rs", line = 12 },
]
