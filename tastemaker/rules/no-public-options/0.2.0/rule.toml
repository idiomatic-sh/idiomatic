[[scenarios]]
id = 'timings-flag'
scenario = "The cli-timings template's flag, a variant with an `off` default rather than a public `Option`."
given.files.'cli/src/timings.rs' = '''
//! `--timings`: where a run's time went, by crate, hex and port method.
//!
//! Every port method carries `#[tracing::instrument(level = "info", skip_all)]` (the
//! `port-spans` rule), so a span's target is its module path, whose first segment is the
//! crate and second the hex, and its name is the method. Without the flag no subscriber is
//! installed and a span costs one atomic load. `--timings` (or `--timings=tree`) prints the
//! tree below once, on exit, to stderr; `--timings=chrome` writes a Chrome trace
//! (`trace-<timestamp>.json`, opened in Perfetto) through `tracing-chrome`. Standard output
//! is the same with the flag and without it.
//!
//! The tree: one row per crate, under it one per hex, under that one per port method, each
//! level sorted by busy time.
//!
//! ```text
//! crate / hex / method                        calls       busy       self   share
//! tastemaker_check                                12    1.200 s    0.100 s   48.0%
//!   analysis                                      3    1.100 s    0.050 s   44.0%
//!     analyze                                     3    1.100 s    0.050 s   44.0%
//! ```
//!
//! `calls` counts the spans that closed, `busy` sums the time each was entered (overlapping entries of one span counted once), `self` is
//! busy time less the busy time of the spans opened inside them, and `share` is busy time
//! over the run's wall time.

use std::collections::BTreeMap;
use std::sync::{Arc, Mutex};
use std::time::{Duration, Instant};

use tracing_subscriber::layer::SubscriberExt as _;

/// How `--timings` reports.
#[derive(Clone, Copy, Debug, Default, PartialEq, Eq, clap::ValueEnum)]
pub enum Timings {
    /// No report: no subscriber is installed, so a span costs one atomic load.
    #[default]
    Off,
    /// The tree of crate, hex and method, printed once on exit to stderr.
    Tree,
    /// A Chrome trace file, for drilling into one run.
    Chrome,
}

/// The global `--timings[=tree|chrome]` flag, which the command line flattens in.
#[derive(Clone, Debug, Default, clap::Args)]
pub struct TimingsArgs {
    /// Report where the time went: `tree` (what `--timings` alone means) prints calls, busy
    /// and self time by crate, hex and port method to stderr on exit; `chrome` writes a trace
    /// file; `off`, without the flag, reports nothing.
    #[arg(long, global = true, value_enum, default_value = "off", num_args = 0..=1, require_equals = true, default_missing_value = "tree")]
    pub timings: Timings,
}

/// What `install` keeps alive for the run: dropped, it prints the tree or flushes the trace.
pub enum TimingsGuard {
    /// No flag: nothing was installed.
    Off,
    /// The tree, and when the run started.
    Tree(TimingsTree, Instant),
    /// The trace file's writer.
    Chrome(tracing_chrome::FlushGuard),
}

impl Drop for TimingsGuard {
    fn drop(&mut self) {
        if let Self::Tree(tree, started) = self {
            let _ = tree.print(started.elapsed(), &mut std::io::stderr());
        }
    }
}

/// Installs the subscriber `timings` asks for, or none, for the whole run.
#[must_use]
pub fn install(timings: Timings) -> TimingsGuard {
    match timings {
        Timings::Off => TimingsGuard::Off,
        Timings::Tree => {
            let tree = TimingsTree::default();
            let _ = tracing::subscriber::set_global_default(
                tracing_subscriber::registry().with(tree.clone()),
            );
            TimingsGuard::Tree(tree, Instant::now())
        }
        Timings::Chrome => {
            let (layer, guard) = tracing_chrome::ChromeLayerBuilder::new().build();
            let _ =
                tracing::subscriber::set_global_default(tracing_subscriber::registry().with(layer));
            TimingsGuard::Chrome(guard)
        }
    }
}

/// Calls, busy time and the busy time of the spans opened inside, for one row.
#[derive(Clone, Copy, Debug, Default)]
pub struct TimingsRow {
    calls: u64,
    busy: Duration,
    inner: Duration,
}

impl TimingsRow {
    fn add(&mut self, other: Self) {
        self.calls += other.calls;
        self.busy += other.busy;
        self.inner += other.inner;
    }
}

/// One open span's clock: its busy time so far, how many entries are open (a span is
/// entered again by `in_scope` and on several threads at once), when the first of them
/// opened, and the busy time of the spans that closed inside it. Busy time is the time at
/// least one entry is open.
#[derive(Default)]
struct Clock {
    busy: Duration,
    depth: usize,
    entered: Option<Instant>,
    inner: Duration,
}

/// The aggregating layer: each closing span adds its clock to the row of its crate, hex
/// and method.
#[derive(Clone, Default)]
pub struct TimingsTree {
    rows: Arc<Mutex<BTreeMap<(String, String, String), TimingsRow>>>,
}

impl<S> tracing_subscriber::Layer<S> for TimingsTree
where
    S: tracing::Subscriber + for<'span> tracing_subscriber::registry::LookupSpan<'span>,
{
    fn on_new_span(
        &self,
        _attributes: &tracing::span::Attributes<'_>,
        id: &tracing::span::Id,
        context: tracing_subscriber::layer::Context<'_, S>,
    ) {
        if let Some(span) = context.span(id) {
            span.extensions_mut().insert(Clock::default());
        }
    }

    fn on_enter(&self, id: &tracing::span::Id, context: tracing_subscriber::layer::Context<'_, S>) {
        if let Some(span) = context.span(id)
            && let Some(clock) = span.extensions_mut().get_mut::<Clock>()
        {
            if clock.depth == 0 {
                clock.entered = Some(Instant::now());
            }
            clock.depth += 1;
        }
    }

    fn on_exit(&self, id: &tracing::span::Id, context: tracing_subscriber::layer::Context<'_, S>) {
        if let Some(span) = context.span(id)
            && let Some(clock) = span.extensions_mut().get_mut::<Clock>()
        {
            clock.depth = clock.depth.saturating_sub(1);
            if clock.depth == 0
                && let Some(entered) = clock.entered.take()
            {
                clock.busy += entered.elapsed();
            }
        }
    }

    fn on_close(&self, id: tracing::span::Id, context: tracing_subscriber::layer::Context<'_, S>) {
        let Some(span) = context.span(&id) else {
            return;
        };
        let Some(clock) = span.extensions_mut().remove::<Clock>() else {
            return;
        };
        if let Some(parent) = span.parent()
            && let Some(outer) = parent.extensions_mut().get_mut::<Clock>()
        {
            outer.inner += clock.busy;
        }
        let mut target = span.metadata().target().split("::");
        let owner = target.next().unwrap_or_default().to_owned();
        let hex = target.next().unwrap_or_default().to_owned();
        if let Ok(mut rows) = self.rows.lock() {
            rows.entry((owner, hex, span.name().to_owned()))
                .or_default()
                .add(TimingsRow {
                    calls: 1,
                    busy: clock.busy,
                    inner: clock.inner,
                });
        }
    }
}

impl TimingsTree {
    /// Writes the tree: each crate, its hexes and their methods, each level by busy time.
    pub fn print(&self, wall: Duration, out: &mut impl std::io::Write) -> std::io::Result<()> {
        let Ok(rows) = self.rows.lock() else {
            return Ok(());
        };
        type Hexes<'a> = BTreeMap<&'a str, (TimingsRow, Vec<(&'a str, TimingsRow)>)>;
        let mut crates: BTreeMap<&str, (TimingsRow, Hexes<'_>)> = BTreeMap::new();
        for ((owner, hex, method), row) in rows.iter() {
            let (crate_row, hexes) = crates.entry(owner.as_str()).or_default();
            crate_row.add(*row);
            let (hex_row, methods) = hexes.entry(hex.as_str()).or_default();
            hex_row.add(*row);
            methods.push((method.as_str(), *row));
        }
        writeln!(
            out,
            "{:<40} {:>8} {:>10} {:>10} {:>7}",
            "crate / hex / method", "calls", "busy", "self", "share"
        )?;
        let mut crates: Vec<_> = crates.into_iter().collect();
        crates.sort_by(|left, right| right.1.0.busy.cmp(&left.1.0.busy));
        for (owner, (row, hexes)) in crates {
            line(out, owner, 0, row, wall)?;
            let mut hexes: Vec<_> = hexes.into_iter().collect();
            hexes.sort_by(|left, right| right.1.0.busy.cmp(&left.1.0.busy));
            for (hex, (row, mut methods)) in hexes {
                line(out, hex, 1, row, wall)?;
                methods.sort_by(|left, right| right.1.busy.cmp(&left.1.busy));
                for (method, row) in methods {
                    line(out, method, 2, row, wall)?;
                }
            }
        }
        Ok(())
    }
}

/// One row of the tree, indented two spaces per level.
fn line(
    out: &mut impl std::io::Write,
    name: &str,
    depth: usize,
    row: TimingsRow,
    wall: Duration,
) -> std::io::Result<()> {
    let share = if wall.is_zero() {
        0.0
    } else {
        row.busy.as_secs_f64() / wall.as_secs_f64() * 100.0
    };
    let label = format!("{}{name}", "  ".repeat(depth));
    writeln!(
        out,
        "{label:<40} {:>8} {:>8.3} s {:>8.3} s {share:>6.1}%",
        row.calls,
        row.busy.as_secs_f64(),
        row.busy.saturating_sub(row.inner).as_secs_f64(),
    )
}
'''

