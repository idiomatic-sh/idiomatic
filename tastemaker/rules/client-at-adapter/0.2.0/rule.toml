description = "A client or store library of the core is named - imported or written as a path - only in an adapter (a file the adapter spec places, or any file beneath an outbound port's `adapters/`), its port's factory.rs and an edge's composition.rs (a command's or an entry's `src/resources/<resource>/<verb>/`, a contract's under `src/inbound/contracts/`, a benchmark host's), never in a port's types.rs or errors.rs: the rule itself admits those files, so an entry reads `**` and excludes no production role."
why = "A client library (a database driver, an HTTP client, a store) is the part of an adapter that touches the outside world. The core depends on it as an ordinary dependency, with no cargo feature per adapter, so the placement is what keeps use cases and domain free of it: the library is named in the adapter that wraps it (`src/outbound/<port>/adapters/<implementation>/`), in its port's `factory.rs`, which receives the client the edge opened, and in an edge's `composition.rs`, which opens it. The libraries are those the entry lists in `libraries`, and the rule is a shared one of the product (a nested spec instance's files are not its enclosing spec's to check). A port's own `types.rs` and `errors.rs` are not excluded: the library is named in none of a port's plain files. Not seen: a path inside an attribute or a macro invocation."

query = '''
param libraries: set<string>;
let imports = project(from="static-import", columns=["occurrence", "file", "span", "target"]);
let references = project(from="reference", columns=["occurrence", "file", "span", "target"]);
let mentions = union(left=imports, right=references);
let clients = select * from mentions where glob_any(target, $libraries);
let governed-roles = select l."path" as "file" from "tastemaker.placed" as l where l."package" = "idiomatic.arch" and l."spec" = "adapter" and glob_any(l."template", "{adapter,adapter-connection,adapter-writer,settings,schemas}");
let adapter-tree = select l."path" as "file" from "filesystem.file" as l where glob_any(l."path", "{**/outbound/*/adapters/**,**/outbound/*/factory.rs,**/src/resources/*/*/composition.rs,**/src/inbound/contracts/**/composition.rs,**/benchmarks/linters/*/composition.rs,**/benches/**/composition.rs}");
let adapters = union(left=governed-roles, right=adapter-tree);
let outside = antijoin(left=clients, right=adapters, left-on=["file"], right-on=["file"]);
emit outside subject "file" key("span");
'''

[params.libraries]
type = "set<string>"
description = "The client and store libraries of the product's adapters, each as a path glob of the crate as it is written in code: `rusqlite::*`."

[diagnostic]
primary = "span"
message = "client library `{target}` is named outside an adapter, a port's factory and an edge's composition"
help = "Move the code that uses `{target}` into the adapter of the outbound port it serves (`src/outbound/<port>/adapters/<implementation>/`), and take the client it needs as a parameter of the port's `factory.rs`, which the edge's `composition.rs` opens and passes. An ignore is never the fix."

[given]
include = ['**']
params = { libraries = ['rusqlite::*'] }

[[scenarios]]
id = 'adapter-names-client-library'
scenario = 'An adapter names its client library.'
given.files.'src/outbound/store/adapters/sqlite/adapter.rs' = '''
use rusqlite::Connection;

/// The store adapter over a SQLite connection.
pub struct SqliteStore {
    connection: Connection,
}
'''
given.files.'src/lib.rs' = '''
//! The crate.
'''

[[scenarios]]
id = 'port-s-factory-names-client-library'
scenario = "A port's factory names the client library."
given.files.'src/outbound/store/factory.rs' = '''
use rusqlite::Connection;

/// Builds the SQLite adapter from the connection the edge opened.
pub fn sqlite(connection: Connection) -> Connection {
    connection
}
'''
given.files.'src/lib.rs' = '''
//! The crate.
'''

[[scenarios]]
id = 'edge-s-composition-opens-client'
scenario = "An edge's composition opens the client."
given.files.'src/resources/greeting/show/composition.rs' = '''
pub fn compose() {
    let _ = rusqlite::Connection::open_in_memory();
}
'''
given.files.'src/lib.rs' = '''
//! The crate.
'''

[[scenarios]]
id = 'no-client'
scenario = 'A core with no client library in its code.'
given.files.'src/inbound/use_cases/greet/use_case.rs' = '''
use std::sync::Arc;

/// The greet use case.
pub struct GreetUseCaseImpl {
    names: Arc<str>,
}

/// Pure matching libraries do not open a client or touch the outside world.
pub fn prepare_pattern() {
    let _pattern = globset::GlobBuilder::new("hello*").build();
}
'''

[[scenarios]]
id = 'use-case-import'
scenario = 'A use case imports the client library.'
given.files.'src/inbound/use_cases/greet/use_case.rs' = '''
