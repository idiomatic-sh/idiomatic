description = "A composition holds a `Services` struct only with a service in it: a struct named `Services` with no fields is a finding."
why = "A composition's `Services` exists for the services it holds (an optional structure is omitted, never filled with a placeholder: hollow artifacts are banned). The composition templates declare none, so a composition that builds its service in a function has no `Services`, and one that keeps services has them as fields: required or absent, never empty. An empty `Services` is a namespace for functions, which belong in the module. Read from syntax: a struct named `Services` with no record or tuple field, written `{}`, `()` or `;`, at any depth of the file; a struct under another name is `hollow-artifacts`' where a spec places it."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let struct-nodes = select * from tree-nodes where kind = "struct";
let field-lists = select * from tree-nodes where glob_any(kind, "{record-field-list,tuple-field-list}");
let struct-field-lists-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from struct-nodes as l join "syntax-child" as r on l."id" = r."parent";
let struct-field-lists = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from field-lists as l join struct-field-lists-edges as r on l."id" = r."child";
let field-nodes = select * from tree-nodes where glob_any(kind, "{record-field,tuple-field}");
let struct-fields-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from struct-field-lists as l join "syntax-child" as r on l."id" = r."parent";
let struct-fields = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from field-nodes as l join struct-fields-edges as r on l."id" = r."child";
let filled-lists = select l."parent" as "parent" from struct-field-lists as l join struct-fields as r on l."id" = r."parent";
let fieldless-structs = antijoin(left=struct-nodes, right=filled-lists, left-on=["id"], right-on=["parent"]);
let names = select * from tree-nodes where kind = "name";
let name-tokens = select l."id" as "id", r."child" as "token" from names as l join "syntax-child" as r on l."id" = r."parent";
let name-words = select l."id" as "id", r."text" as "text" from name-tokens as l join tree-tokens as r on l."token" = r."id";
let services-names = select * from name-words where text = "Services";
let fieldless-struct-children = select r."child" as "child", l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from fieldless-structs as l join "syntax-child" as r on l."id" = r."parent";
let hollow-services = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from fieldless-struct-children as l join services-names as r on l."child" = r."id";
emit hollow-services subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this composition's `Services` holds no service"
help = "Delete the empty `Services` and make what hung on it a function of the module; keep `Services` only for the services a composition holds as fields."

[given]
include = ['**/composition.rs']

[[scenarios]]
id = 'composition-builds-service-function-no-services'
scenario = 'A composition that builds its service in a function, with no Services.'
given.files.'src/composition.rs' = '''
//! The wiring: the one place each implementation is chosen.

/// The greeting service, composed from its factory.
pub fn build() -> impl crate::greeting::interface::GreetingInterface {
    crate::greeting::factory::memory()
}
'''

[[scenarios]]
id = 'with-services'
scenario = 'A composition whose Services holds a service.'
given.files.'src/composition.rs' = '''
//! The wiring: the one place each implementation is chosen.

/// The services composed, one per domain.
pub struct Services<Greeting> {
    greeting: Greeting,
}

/// A pair of services held without names.
pub struct Pair<Greeting, Farewell>(Greeting, Farewell);

/// The services, composed from their factories.
pub fn services() -> Services<impl crate::greeting::interface::GreetingInterface> {
    Services {
        greeting: crate::greeting::factory::memory(),
    }
}
'''

[[scenarios]]
id = 'empty-services'
scenario = 'A composition with an empty Services.'
given.files.'src/composition.rs' = '''
//! The wiring: the one place each implementation is chosen.

/// The services composed, one per domain.
#[derive(Debug, Default)]
pub struct Services {}

impl Services {
    /// The greeting service, composed from its factory.
    pub fn greeting(&self) -> impl crate::greeting::interface::GreetingInterface {
        crate::greeting::factory::memory()
    }
}
'''
then.findings = [
  { path = 'src/composition.rs', line = 4 },
]

[[scenarios]]
id = 'unit-services'
scenario = 'A composition with a unit Services used as a namespace.'
given.files.'src/composition.rs' = '''
//! The wiring: the one place each implementation is chosen.

/// The services composed, one per domain.
#[derive(Clone, Copy, Debug, Default)]
pub struct Services;

impl Services {
    /// The greeting service, composed from its factory.
    pub fn greeting(self) -> impl crate::greeting::interface::GreetingInterface {
        crate::greeting::factory::memory()
    }
}
'''
then.findings = [
  { path = 'src/composition.rs', line = 4 },
]

[[scenarios]]
id = 'other-struct'
scenario = "A fieldless struct under another name is not this rule's."
given.files.'src/composition.rs' = '''
//! The wiring: the one place each implementation is chosen.

/// The language the composition registers, a unit value implementing its port.
#[derive(Clone, Copy, Debug)]
pub struct Greek;

impl crate::greeting::interface::GreetingInterface for Greek {
    fn greet(&self) -> String {
        String::from("χαῖρε")
    }
}

/// The services composed, one per domain.
pub struct Services {
    greeting: Greek,
}

/// The services.
pub fn services() -> Services {
    Services { greeting: Greek }
}
'''
