description = "Each item's `item_test.rs` runs the collection's shared cases, `contract::check`, when the collection has a `fixtures/contract.rs`."
why = "A collection is N implementations of one shape, so every item runs the cases the collection states once, as an adapter runs its port's contract; the item's own cases come beside them. A collection with no `fixtures/contract.rs` has no shared cases and its items state their own (`unit-cases`). The call is recognised as a written path call, `…::contract::check(..)` or `check_with(..)`, or a call of the name a file imports that as; a call through a re-export is not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let files = select * from tree-nodes where kind = "source-file";
let item-tests = capture(from=files, path="file", pattern="{*root}/collections/{collection}/{item}/item_test.rs", captures=["root", "collection", "item"]);
let contracts = capture(from=files, path="file", pattern="{*root}/collections/{collection}/fixtures/contract.rs", captures=["root", "collection"]);
let contract-keys = project(from=contracts, columns=["root", "collection"]);
let required = select l."file" as "file", l."span" as "span" from item-tests as l join contract-keys as r on l."root" = r."root" and l."collection" = r."collection";
let path-calls = select l."file" as "file", l."span" as "span", l."target" as "target" from "static-call" as l join "reference" as r on l."file" = r."file" and l."span" = r."span" and l."target" = r."target";
let qualified-calls = select * from path-calls where glob_any(target, "{contract::check,contract::check_with,*::contract::check,*::contract::check_with}");
let qualified = project(from=qualified-calls, columns=["file"]);
let check-imports = select * from "static-import" where glob_any(target, "{contract::check,contract::check_with,*::contract::check,*::contract::check_with}");
let imported-calls = select l."file" as "file" from path-calls as l join check-imports as r on l."file" = r."file" and l."target" = r."binding";
let calling = union(left=qualified, right=imported-calls);
let silent = antijoin(left=required, right=calling, left-on=["file"], right-on=["file"]);
emit silent subject "file" key("file");
'''

[diagnostic]
primary = "span"
message = "this item's test never runs the collection's shared cases"
help = "Call the collection's contract from this item_test.rs: `super::super::fixtures::contract::check(&Item)` with the item built from its fixtures, then state the item's own cases in `CASES`."

[given]
include = ['**/*.rs']
files.'src/collections/passes/pass_a/item_test.rs' = '''
//! Proves one pass.

#[test]
fn succeeds() {
    super::super::fixtures::contract::check(&super::item::PassA);
}
'''

[[scenarios]]
id = 'runs-check'
scenario = 'An item running the shared cases.'
given.files.'src/collections/passes/fixtures.rs' = '''
pub mod contract;
'''
given.files.'src/collections/passes/fixtures/contract.rs' = '''
//! What every item of the collection must pass.

use super::super::interface::ItemInterface;

/// The shared rows.
pub const CASES: &[u8] = &[];

/// Runs the shared rows against one item.
pub fn check(item: &impl ItemInterface) {
    let _ = item;
}
'''

[[scenarios]]
id = 'imported-check'
scenario = 'An item that imports check.'
given.files.'src/collections/passes/fixtures.rs' = '''
pub mod contract;
'''
given.files.'src/collections/passes/fixtures/contract.rs' = '''
//! What every item of the collection must pass.

use super::super::interface::ItemInterface;

/// The shared rows.
pub const CASES: &[u8] = &[];

/// Runs the shared rows against one item.
