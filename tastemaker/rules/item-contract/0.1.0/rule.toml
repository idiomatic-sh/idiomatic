    let _ = item;
}
'''
given.files.'src/collections/passes/pass_a/item_test.rs' = '''
//! Proves one pass.

use super::super::fixtures::contract::check;

#[test]
fn succeeds() {
    check(&super::item::PassA);
}
'''

