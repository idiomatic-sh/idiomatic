description = "An `interface.rs` (a use case's, an outbound port's or a collection's) declares one trait with a `self` method, plus only the handle traits that its methods return, no free function, and default bodies that call only the trait's own methods. A trait no method returns is a finding, and there is no new file primitive. A collection's item trait (`.../collections/<collection>/interface.rs`) may have no `self` method."
why = "An interface only declares what its part offers, whether it is named `<Name>UseCase`, `<Name>Port` or `<Name>Item`. A second trait is allowed only as a handle, a trait that a method of the file's other trait returns (`fn worker(&self) -> Box<dyn FactsWorker>`), so an object the port hands out is declared beside the port and no new file primitive is needed; a trait that no method of another trait in the file returns, beyond the first, is a second interface and gets a part of its own; a trait with no `self` method is a value trait, implemented rather than called, and lives in `types.rs`, not in an `interface.rs`; a free function is logic, which belongs in a concept's `service.rs`, a use case or an adapter; a default body is the template-method pattern only while it composes the trait's own methods. The suffix of the trait's name is `kind-suffix`'s, not this rule's. A collection's `interface.rs` (`.../collections/<collection>/interface.rs`) declares the collection's item trait (`RelationsItem`, `RefinementsItem`), which may have no `self` method, only associated consts, types and functions: a collection item is a value its items implement, so the value-trait arm does not read it. Traits and functions local to a function body, and code macros generate, are not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select l."child" as "child" from "syntax-child" as l join source-files as r on l."parent" = r."id";
let top-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from tree-nodes as l join top-edges as r on l."id" = r."child";
let traits = select * from top-nodes where kind = "trait";
let names = select * from tree-nodes where kind = "name";
let token-edges = select l."parent" as "parent", l."file" as "file", r."text" as "text" from "syntax-child" as l join tree-tokens as r on l."child" = r."id";
let trait-name-edges = select l."id" as "trait", l."file" as "file", r."child" as "child" from traits as l join "syntax-child" as r on l."id" = r."parent";
let trait-name-nodes = select r."id" as "name", l."trait" as "trait", l."file" as "file" from trait-name-edges as l join names as r on l."child" = r."id";
let trait-names = select l."trait" as "trait", l."file" as "file", r."text" as "word" from trait-name-nodes as l join token-edges as r on l."name" = r."parent";
let trait-list-edges = select r."child" as "child", l."id" as "trait" from traits as l join "syntax-child" as r on l."id" = r."parent";
let item-lists = select * from tree-nodes where kind = "assoc-item-list";
let trait-lists = select r."id" as "list", l."trait" as "trait" from trait-list-edges as l join item-lists as r on l."child" = r."id";
let trait-fn-edges = select r."child" as "child", l."trait" as "trait" from trait-lists as l join "syntax-child" as r on l."list" = r."parent";
let fn-nodes = select * from tree-nodes where kind = "fn";
let trait-fns = select r."id" as "fn", l."trait" as "trait" from trait-fn-edges as l join fn-nodes as r on l."child" = r."id";
let fn-return-edges = select r."child" as "child", l."trait" as "trait" from trait-fns as l join "syntax-child" as r on l."fn" = r."parent";
let ret-types = select * from tree-nodes where kind = "ret-type";
let fn-returns = select r."id" as "id", l."trait" as "returner" from fn-return-edges as l join ret-types as r on l."child" = r."id";
let return-parts = axis(from=fn-returns, relation="syntax-child", direction=descendant, domain=tree-nodes);
let return-part-rows = project(from=return-parts, columns=["returner", "related"]);
let return-words = select l."returner" as "returner", r."file" as "file", r."text" as "word" from return-part-rows as l join token-edges as r on l."related" = r."parent";
let returned-pairs = select l."trait" as "trait", r."returner" as "returner" from trait-names as l join return-words as r on l."file" = r."file" and l."word" = r."word";
let returned-by-another = select * from returned-pairs where trait != returner;
let returned-ids = project(from=returned-by-another, columns=["trait"]);
let roots = antijoin(left=traits, right=returned-ids, left-on=["id"], right-on=["trait"]);
let root-counts = group-count(from=roots, keys=["file"], count="roots", distinct="id");
let crowded-files = select * from root-counts where roots > 1;
let crowded-rows = select l."file" as "file", l."span" as "span" from roots as l join crowded-files as r on l."file" = r."file";
let crowded = extend(from=crowded-rows, values={"problem": "is one of several traits in interface.rs that no method returns: the file holds one port trait and only the handles its methods return, each other interface is its own part"});
let free-rows = select * from top-nodes where kind = "fn";
let free-projected = project(from=free-rows, columns=["file", "span"]);
let free = extend(from=free-projected, values={"problem": "is a free function in interface.rs: logic belongs in a concept's service.rs, a use case or an adapter"});
let findings-a = union(left=crowded, right=free);
let fn-param-edges = select r."child" as "child", l."trait" as "trait" from trait-fns as l join "syntax-child" as r on l."fn" = r."parent";
let param-lists = select * from tree-nodes where kind = "param-list";
let fn-params = select r."id" as "list", l."trait" as "trait" from fn-param-edges as l join param-lists as r on l."child" = r."id";
let receiver-edges = select r."child" as "child", l."trait" as "trait" from fn-params as l join "syntax-child" as r on l."list" = r."parent";
let self-params = select * from tree-nodes where kind = "self-param";
let receivers = select l."trait" as "trait" from receiver-edges as l join self-params as r on l."child" = r."id";
let value-rows = antijoin(left=traits, right=receivers, left-on=["id"], right-on=["trait"]);
let value-checked = select * from value-rows where not glob_any(file, "**/collections/*/interface.rs");
let value-projected = project(from=value-checked, columns=["file", "span"]);
let value = extend(from=value-projected, values={"problem": "has no `self` method, so it is a value trait: it lives in types.rs, not in an interface.rs"});
let findings-b = union(left=findings-a, right=value);
let body-edges = select r."child" as "child", l."trait" as "trait" from trait-fns as l join "syntax-child" as r on l."fn" = r."parent";
let block-nodes = select * from tree-nodes where kind = "block-expr";
let bodies = select r."id" as "id", l."trait" as "trait" from body-edges as l join block-nodes as r on l."child" = r."id";
let body-nodes = axis(from=bodies, relation="syntax-child", direction=descendant, domain=tree-nodes);
let body-parts = project(from=body-nodes, columns=["trait", "related"]);
let body-kinds = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span", l."trait" as "trait" from body-parts as l join tree-nodes as r on l."related" = r."id";
let call-rows = select * from body-kinds where kind = "call-expr";
let call-projected = project(from=call-rows, columns=["file", "span"]);
let calls = extend(from=call-projected, values={"problem": "is a call in a default body: a default body calls only the trait's own methods"});
let findings-c = union(left=findings-b, right=calls);
let method-calls = select * from body-kinds where kind = "method-call-expr";
let method-ref-edges = select r."child" as "child", l."file" as "file", l."span" as "span", l."trait" as "trait" from method-calls as l join "syntax-child" as r on l."id" = r."parent";
let name-refs = select * from tree-nodes where kind = "name-ref";
let method-refs = select l."file" as "file", r."id" as "ref", l."span" as "span", l."trait" as "trait" from method-ref-edges as l join name-refs as r on l."child" = r."id";
let method-token-edges = select l."file" as "file", l."span" as "span", r."child" as "token", l."trait" as "trait" from method-refs as l join "syntax-child" as r on l."ref" = r."parent";
let called-methods = select r."text" as "method", l."file" as "file", l."span" as "span", l."trait" as "trait" from method-token-edges as l join tree-tokens as r on l."token" = r."id";
let fn-name-edges = select r."child" as "child", l."trait" as "trait" from trait-fns as l join "syntax-child" as r on l."fn" = r."parent";
let fn-name-nodes = select r."id" as "name", l."trait" as "trait" from fn-name-edges as l join names as r on l."child" = r."id";
let fn-name-token-edges = select r."child" as "token", l."trait" as "trait" from fn-name-nodes as l join "syntax-child" as r on l."name" = r."parent";
let own-methods = select r."text" as "method", l."trait" as "trait" from fn-name-token-edges as l join tree-tokens as r on l."token" = r."id";
let foreign-method-rows = antijoin(left=called-methods, right=own-methods, left-on=["trait", "method"], right-on=["trait", "method"]);
let foreign-method-projected = project(from=foreign-method-rows, columns=["file", "span"]);
let foreign-methods = extend(from=foreign-method-projected, values={"problem": "calls a method the trait does not declare: a default body calls only the trait's own methods"});
let findings-d = union(left=findings-c, right=foreign-methods);
let first-children = select * from "syntax-child" where ordinal = 0;
let call-receiver-edges = select l."id" as "id", r."child" as "receiver" from method-calls as l join first-children as r on l."id" = r."parent";
let path-exprs = select * from tree-nodes where kind = "path-expr";
let path-receivers = select l."id" as "call", r."id" as "id" from call-receiver-edges as l join path-exprs as r on l."receiver" = r."id";
let path-receiver-nodes = axis(from=path-receivers, relation="syntax-child", direction=descendant, domain=tree-nodes);
let path-receiver-parts = project(from=path-receiver-nodes, columns=["call", "related"]);
let path-receiver-token-edges = select l."call" as "call", r."child" as "token" from path-receiver-parts as l join "syntax-child" as r on l."related" = r."parent";
let self-tokens = select * from tree-tokens where text = "self";
let self-receiver-rows = select l."call" as "id" from path-receiver-token-edges as l join self-tokens as r on l."token" = r."id";
let other-receiver-rows = antijoin(left=method-calls, right=self-receiver-rows, left-on=["id"], right-on=["id"]);
let other-receiver-projected = project(from=other-receiver-rows, columns=["file", "span"]);
let other-receivers = extend(from=other-receiver-projected, values={"problem": "calls a method on something other than `self`: a default body calls only the trait's own methods"});
let findings = union(left=findings-d, right=other-receivers);
emit findings subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "this {problem}"
help = "Keep one port trait in interface.rs, plus only the handle traits its methods return: move a value trait to types.rs, a second interface to a part of its own, a free function or other logic to a concept's service.rs, a use case or an adapter, and make a default body call only the trait's own methods on `self`. An ignore is never the fix: a file that is not exactly one interface is not an interface.rs."

[given]
include = ['**/interface.rs']

[[scenarios]]
id = 'one-port'
scenario = 'One port whose default body calls its own method.'
given.files.'src/greeting/interface.rs' = '''
use super::types::Greeting;

pub trait GreetingPort {
    fn greet(&self, name: &str) -> Greeting;

    fn greet_all(&self, names: &[String]) -> Vec<Greeting> {
        let first = self.greet("all");
        vec![first]
    }
}
'''

[[scenarios]]
id = 'one-use-case'
scenario = "One use case's trait."
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What the `greet` use case promises, in its own vocabulary.

use super::types::Greeting;

/// What `greet` offers its callers.
pub trait GreetUseCase {
    /// Runs `greet`.
    fn greet(&self, name: &str) -> Greeting;
}
'''

[[scenarios]]
id = 'one-item'
scenario = "One collection item's trait."
given.files.'src/collections/shapes/interface.rs' = '''
//! What every shape of the `shapes` collection offers.

/// The one shape every item of `shapes` implements.
pub trait ShapesItem {
    /// The area of the shape.
    fn area(&self) -> f64;
}
'''

[[scenarios]]
id = 'two-traits'
scenario = 'Two traits in one interface.rs.'
given.files.'src/greeting/interface.rs' = '''
