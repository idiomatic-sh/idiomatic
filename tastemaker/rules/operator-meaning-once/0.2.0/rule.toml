description = "An operation kind's meaning is implemented once, in its operators: the engine names a variant of the operators' call only when `engine-calls` lists it, no module under `modules` is named after a kind, and no function under `functions` is, a kind being the snake case of an identifier the `kinds` files list in a macro call."
why = "The operators crate holds the one meaning of every operation kind, reached through one evaluation call; the engine supplies resources, walks and delivery behind the driver ports. An engine that matches or builds another variant of the call (a `Union` of its own), or that grows a module named after a kind (`domain/operator/union.rs`), holds a second implementation of that kind, which drifts from the first where no parity test looks. The kinds are read from the macro call that declares them, so a new kind is covered without editing the entry. A function named after a kind (`fn union`) where the evaluator lives is the same second implementation without a module of its own. Read syntactically: a variant is named by a path in an expression or a pattern (`reference`), a module by its `mod` declaration, and a function by its `fn` declaration: a free function, or an associated function of an inherent `impl`. A method of a trait, declared in the trait or written in an `impl` of it, is not read: its name is the trait's, so `FactsWorker::rows` is no kind's meaning wherever it lives. Not seen: a variant written only inside a macro's arguments (`matches!(call, OperatorCall::Union { .. })`), whose tokens no syntax says are a path. Test code, fixtures and acceptance files are left out by the entry's `exclude`."

query = '''
param calls: set<string>;
param engine-calls: set<string>;
param engine: set<string>;
param kinds: set<string>;
param modules: set<string>;
param functions: set<string>;
let named = select file, span from "reference" where glob_any(file, $engine) and glob_any(target, $calls) and not glob_any(target, $engine-calls);
let variants = extend(from=named, values={"problem": "names a call of the operators the engine does not make"});
let nodes = select id, kind from "syntax-tree" where text = "" and glob_any(file, $kinds);
let tokens = select id, text from "syntax-tree" where text != "" and kind = "ident" and glob_any(file, $kinds);
let macro-calls = select id from nodes where kind = "macro-call";
let trees = select r.child as id from macro-calls as l join "syntax-child" as r on l.id = r.parent where r.field != "path";
let kind-tokens = axis(from=trees, relation="syntax-child", direction=descendant, domain=tokens);
let declared = select r.text as kind from kind-tokens as l join tokens as r on l.related = r.id;
let keyed-kinds = extend(from=declared, values={"pair": 1});
let modules = select name, file, span from "defines" where kind = "namespace" and glob_any(file, $modules);
let keyed-modules = extend(from=modules, values={"pair": 1});
let kind-modules = select l.file as file, l.span as span from keyed-modules as l join keyed-kinds as r on l.pair = r.pair where l.name = snake(r.kind);
let modules-named = extend(from=kind-modules, values={"problem": "declares a module named after an operation kind"});
let fn-nodes = select id, file from "syntax-tree" where text = "" and kind = "fn" and glob_any(file, $functions);
let fn-parents = select l.id as id, r.parent as parent from fn-nodes as l join "syntax-child" as r on l.id = r.child;
let item-lists = select id from "syntax-tree" where text = "" and kind = "assoc-item-list" and glob_any(file, $functions);
let listed = select l.id as id, l.parent as list from fn-parents as l join item-lists as r on l.parent = r.id;
let list-owners = select l.id as id, r.parent as owner from listed as l join "syntax-child" as r on l.list = r.child;
let trait-decls = select id from "syntax-tree" where text = "" and kind = "trait" and glob_any(file, $functions);
let in-traits = select l.id as id from list-owners as l join trait-decls as r on l.owner = r.id;
let impl-nodes = select id from "syntax-tree" where text = "" and kind = "impl" and glob_any(file, $functions);
let for-keywords = select id from "syntax-tree" where kind = "for-kw" and glob_any(file, $functions);
let impl-children = select l.id as impl, r.child as child from impl-nodes as l join "syntax-child" as r on l.id = r.parent;
let trait-impls = select l.impl as id from impl-children as l join for-keywords as r on l.child = r.id;
let in-trait-impls = select l.id as id from list-owners as l join trait-impls as r on l.owner = r.id;
let trait-methods = union(left=in-traits, right=in-trait-impls);
let free-functions = antijoin(left=fn-nodes, right=trait-methods, left-on=["id"], right-on=["id"]);
let name-nodes = select id from "syntax-tree" where text = "" and kind = "name" and glob_any(file, $functions);
let fn-children = select l.file as file, r.child as child from free-functions as l join "syntax-child" as r on l.id = r.parent;
let fn-names = select l.file as file, l.child as name from fn-children as l join name-nodes as r on l.child = r.id;
let name-children = select l.file as file, r.child as token from fn-names as l join "syntax-child" as r on l.name = r.parent;
let idents = select id, text, span from "syntax-tree" where kind = "ident" and glob_any(file, $functions);
let fn-named = select l.file as file, r.span as span, r.text as name from name-children as l join idents as r on l.token = r.id;
let keyed-functions = extend(from=fn-named, values={"pair": 1});
let kind-functions = select l.file as file, l.span as span from keyed-functions as l join keyed-kinds as r on l.pair = r.pair where l.name = snake(r.kind);
let functions-named = extend(from=kind-functions, values={"problem": "declares a function named after an operation kind"});
let found-modules = union(left=variants, right=modules-named);
let found = union(left=found-modules, right=functions-named);
emit found subject "file" key("span");
'''

