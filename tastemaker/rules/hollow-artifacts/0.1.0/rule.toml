impl GreetingInterface for GreetingMemoryAdapter {}
'''
given.files.'src/greeting/errors.rs' = '''
/// A unit error carries its message through a foreign derive: not a placeholder.
#[derive(Debug, thiserror::Error)]
#[error("the greeting is missing")]
pub struct Missing;

#[derive(Debug, thiserror::Error)]
pub enum GreetingError {
    #[error("unknown")]
    Unknown,
}
'''
