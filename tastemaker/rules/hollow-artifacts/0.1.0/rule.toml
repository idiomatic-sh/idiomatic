description = "No file of only comments and imports, and no fieldless struct or variantless enum that implements nothing beyond the derivable std traits."
why = "A shape filled for its own sake misleads the reader and the next agent: a role file with no declarations, or an empty type kept as a namespace or placeholder. A top-level macro call (`ryo::reads! {.. }`, `declare!`, `link!`) is a declaration and counts as content, and a unit struct the call names (`pub(crate) struct ScopeItem;` beside `ryo::reads! { ScopeItem =>.. }`) is implemented by it: the macro writes the impl, which is not in the text."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let files = select * from tree-nodes where kind = "source-file";
let item-nodes = select * from tree-nodes where glob_any(kind, "{fn,struct,enum,union,const,static,type-alias,trait,trait-alias,impl,macro-rules,macro-def,module,macro-call}");
let items-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from files as l join "syntax-child" as r on l."id" = r."parent";
let items = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from item-nodes as l join items-edges as r on l."id" = r."child";
let hollow-files = antijoin(left=files, right=items, left-on=["id"], right-on=["parent"]);
let file-findings-labelled = extend(from=hollow-files, values={"what": "this file declares nothing but comments and imports"});
let file-findings = project(from=file-findings-labelled, columns=["id", "file", "span", "kind", "what"]);
let names = select * from tree-nodes where kind = "name";
let struct-nodes = select * from tree-nodes where kind = "struct";
let item-lists = select * from tree-nodes where kind = "item-list";
let scopes = union(left=files, right=item-lists);
let structs-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from scopes as l join "syntax-child" as r on l."id" = r."parent";
let structs = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from struct-nodes as l join structs-edges as r on l."id" = r."child";
let field-lists = select * from tree-nodes where glob_any(kind, "{record-field-list,tuple-field-list}");
let struct-field-lists-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from structs as l join "syntax-child" as r on l."id" = r."parent";
let struct-field-lists = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from field-lists as l join struct-field-lists-edges as r on l."id" = r."child";
let field-nodes = select * from tree-nodes where glob_any(kind, "{record-field,tuple-field}");
let struct-fields-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from struct-field-lists as l join "syntax-child" as r on l."id" = r."parent";
let struct-fields = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from field-nodes as l join struct-fields-edges as r on l."id" = r."child";
let filled-lists = select l."parent" as "parent" from struct-field-lists as l join struct-fields as r on l."id" = r."parent";
let fieldless-structs = antijoin(left=structs, right=filled-lists, left-on=["id"], right-on=["parent"]);
let fieldless-types = project(from=fieldless-structs, columns=["id", "file", "span", "kind"]);
let enum-nodes = select * from tree-nodes where kind = "enum";
let enums-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from scopes as l join "syntax-child" as r on l."id" = r."parent";
let enums = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from enum-nodes as l join enums-edges as r on l."id" = r."child";
let variant-lists = select * from tree-nodes where kind = "variant-list";
let enum-variant-lists-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from enums as l join "syntax-child" as r on l."id" = r."parent";
let enum-variant-lists = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from variant-lists as l join enum-variant-lists-edges as r on l."id" = r."child";
let variant-nodes = select * from tree-nodes where kind = "variant";
let enum-variants-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from enum-variant-lists as l join "syntax-child" as r on l."id" = r."parent";
let enum-variants = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from variant-nodes as l join enum-variants-edges as r on l."id" = r."child";
let filled-enum-lists = select l."parent" as "parent" from enum-variant-lists as l join enum-variants as r on l."id" = r."parent";
let variantless-enums = antijoin(left=enums, right=filled-enum-lists, left-on=["id"], right-on=["parent"]);
let variantless-types = project(from=variantless-enums, columns=["id", "file", "span", "kind"]);
let all-empty-types = union(left=fieldless-types, right=variantless-types);
let test-empty-types = select * from all-empty-types where glob_any(file, "{*_test.rs,**/*_test.rs,fixtures.rs,**/fixtures.rs,fixtures/**,**/fixtures/**}");
let empty-types = antijoin(left=all-empty-types, right=test-empty-types, left-on=["id"], right-on=["id"]);
let attributes = select * from tree-nodes where kind = "attr";
let type-attributes-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from empty-types as l join "syntax-child" as r on l."id" = r."parent";
let type-attributes = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from attributes as l join type-attributes-edges as r on l."id" = r."child";
let metas = select * from tree-nodes where kind = "token-tree-meta";
let attribute-metas-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from type-attributes as l join "syntax-child" as r on l."id" = r."parent";
let attribute-metas = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from metas as l join attribute-metas-edges as r on l."id" = r."child";
let token-tree-nodes = select * from tree-nodes where kind = "token-tree";
let meta-paths-all = select * from tree-nodes where kind = "path";
let meta-paths-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from attribute-metas as l join "syntax-child" as r on l."id" = r."parent";
let meta-paths = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from meta-paths-all as l join meta-paths-edges as r on l."id" = r."child";
let path-segments = select * from tree-nodes where kind = "path-segment";
let meta-path-segments-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from meta-paths as l join "syntax-child" as r on l."id" = r."parent";
let meta-path-segments = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from path-segments as l join meta-path-segments-edges as r on l."id" = r."child";
let name-refs = select * from tree-nodes where kind = "name-ref";
let meta-path-name-refs-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from meta-path-segments as l join "syntax-child" as r on l."id" = r."parent";
let meta-path-name-refs = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from name-refs as l join meta-path-name-refs-edges as r on l."id" = r."child";
let derive-identifiers-all = select * from tree-tokens where kind = "ident";
let derive-identifiers = select * from derive-identifiers-all where text = "derive";
let derive-name-tokens-edges = select r."child" as "child", l."id" as "parent" from meta-path-name-refs as l join "syntax-child" as r on l."id" = r."parent";
let derive-name-tokens = select r."parent" as "parent", l."text" as "text" from derive-identifiers as l join derive-name-tokens-edges as r on l."id" = r."child";
let derive-name-refs = select l."parent" as "parent" from meta-path-name-refs as l join derive-name-tokens as r on l."id" = r."parent";
let derive-segments = select l."parent" as "parent" from meta-path-segments as l join derive-name-refs as r on l."id" = r."parent";
let derive-path-ids = select l."parent" as "id" from derive-segments as l join derive-segments as r on l."parent" = r."parent";
let derive-paths = select l."parent" as "parent" from meta-paths as l join derive-path-ids as r on l."id" = r."id";
let derive-metas = select l."parent" as "id" from derive-paths as l join derive-paths as r on l."parent" = r."parent";
let derive-trees-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from derive-metas as l join "syntax-child" as r on l."id" = r."parent";
let derive-trees = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from token-tree-nodes as l join derive-trees-edges as r on l."id" = r."child";
let identifiers = select * from tree-tokens where kind = "ident";
let std-derives-all = select * from tree-tokens where kind = "ident";
let std-derives = select * from std-derives-all where glob_any(text, "{Debug,Default,Clone,Copy,PartialEq,Eq,PartialOrd,Ord,Hash,std,core,alloc,fmt,clone,default,cmp,hash,marker}");
let foreign-identifiers = antijoin(left=identifiers, right=std-derives, left-on=["id"], right-on=["id"]);
let foreign-derive-tokens-edges = select r."child" as "child", l."id" as "parent" from derive-trees as l join "syntax-child" as r on l."id" = r."parent";
let foreign-derive-tokens = select r."parent" as "parent", l."text" as "text" from foreign-identifiers as l join foreign-derive-tokens-edges as r on l."id" = r."child";
let foreign-derive-trees = select l."parent" as "parent" from derive-trees as l join foreign-derive-tokens as r on l."id" = r."parent";
let foreign-derive-attributes = select l."parent" as "parent" from attribute-metas as l join foreign-derive-trees as r on l."id" = r."parent";
let foreign-derive-types = select l."parent" as "parent" from type-attributes as l join foreign-derive-attributes as r on l."id" = r."parent";
let underived-types = antijoin(left=empty-types, right=foreign-derive-types, left-on=["id"], right-on=["parent"]);
let type-names-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from underived-types as l join "syntax-child" as r on l."id" = r."parent";
let type-names = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from names as l join type-names-edges as r on l."id" = r."child";
let type-name-tokens-edges = select r."child" as "child", l."id" as "parent" from type-names as l join "syntax-child" as r on l."id" = r."parent";
let type-name-tokens = select r."parent" as "parent", l."text" as "text" from identifiers as l join type-name-tokens-edges as r on l."id" = r."child";
let named-types = select r."text" as "declared", l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from type-names as l join type-name-tokens as r on l."id" = r."parent";
let paths = select * from tree-nodes where kind = "path";
let impl-path-types = select * from tree-nodes where kind = "path-type";
let impls = select * from tree-nodes where kind = "impl";
let impl-types-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from impls as l join "syntax-child" as r on l."id" = r."parent";
let impl-types = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from impl-path-types as l join impl-types-edges as r on l."id" = r."child";
let for-edges = select r."ordinal" as "before", r."child" as "child", l."id" as "parent" from impls as l join "syntax-child" as r on l."id" = r."parent";
let for-keywords = select * from tree-tokens where kind = "for-kw";
let for-positions = select l."before" as "before", l."parent" as "parent" from for-edges as l join for-keywords as r on l."child" = r."id";
let typed-impls = select r."before" as "before", l."id" as "id", l."parent" as "impl", l."ordinal" as "ordinal" from impl-types as l join for-positions as r on l."parent" = r."parent";
let self-types = select * from typed-impls where before < ordinal;
let trait-types = select * from typed-impls where ordinal < before;
let trait-paths-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from trait-types as l join "syntax-child" as r on l."id" = r."parent";
let trait-paths = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from paths as l join trait-paths-edges as r on l."id" = r."child";
let trait-segments-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from trait-paths as l join "syntax-child" as r on l."id" = r."parent";
let trait-segments = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from path-segments as l join trait-segments-edges as r on l."id" = r."child";
let trait-name-refs-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from trait-segments as l join "syntax-child" as r on l."id" = r."parent";
let trait-name-refs = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from name-refs as l join trait-name-refs-edges as r on l."id" = r."child";
let std-traits-all = select * from tree-tokens where kind = "ident";
let std-traits = select * from std-traits-all where glob_any(text, "{Debug,Default,Clone,Copy,PartialEq,Eq,PartialOrd,Ord,Hash,StructuralPartialEq}");
let std-trait-tokens-edges = select r."child" as "child", l."id" as "parent" from trait-name-refs as l join "syntax-child" as r on l."id" = r."parent";
let std-trait-tokens = select r."parent" as "parent", l."text" as "text" from std-traits as l join std-trait-tokens-edges as r on l."id" = r."child";
let std-name-refs = select l."parent" as "parent" from trait-name-refs as l join std-trait-tokens as r on l."id" = r."parent";
let std-segments = select l."parent" as "parent" from trait-segments as l join std-name-refs as r on l."id" = r."parent";
let std-paths = select l."parent" as "parent" from trait-paths as l join std-segments as r on l."id" = r."parent";
let std-trait-types = select l."impl" as "impl" from trait-types as l join std-paths as r on l."id" = r."parent";
let foreign-self-types = antijoin(left=self-types, right=std-trait-types, left-on=["impl"], right-on=["impl"]);
let self-type-paths-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from foreign-self-types as l join "syntax-child" as r on l."id" = r."parent";
let self-type-paths = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from paths as l join self-type-paths-edges as r on l."id" = r."child";
let self-type-segments-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from self-type-paths as l join "syntax-child" as r on l."id" = r."parent";
let self-type-segments = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from path-segments as l join self-type-segments-edges as r on l."id" = r."child";
let self-type-name-refs-edges = select r."child" as "child", r."ordinal" as "ordinal", l."id" as "parent" from self-type-segments as l join "syntax-child" as r on l."id" = r."parent";
let self-type-name-refs = select l."id" as "id", l."kind" as "kind", r."ordinal" as "ordinal", r."parent" as "parent", l."file" as "file", l."span" as "span" from name-refs as l join self-type-name-refs-edges as r on l."id" = r."child";
let self-type-tokens-edges = select r."child" as "child", l."id" as "parent" from self-type-name-refs as l join "syntax-child" as r on l."id" = r."parent";
let self-type-tokens = select r."parent" as "parent", l."text" as "text" from identifiers as l join self-type-tokens-edges as r on l."id" = r."child";
let self-labels = select r."text" as "implemented", l."file" as "file" from self-type-name-refs as l join self-type-tokens as r on l."id" = r."parent";
let macro-calls = select * from tree-nodes where kind = "macro-call";
let call-edges = select r."child" as "child" from macro-calls as l join "syntax-child" as r on l."id" = r."parent";
let call-trees = select r."id" as "id" from call-edges as l join token-tree-nodes as r on l."child" = r."id";
let call-tree-edges = select r."child" as "child" from call-trees as l join "syntax-child" as r on l."id" = r."parent";
let call-labels = select l."text" as "implemented", l."file" as "file" from identifiers as l join call-tree-edges as r on l."id" = r."child";
let named-labels = union(left=self-labels, right=call-labels);
let implemented-types = select l."id" as "id" from named-types as l join named-labels as r on l."declared" = r."implemented";
let placeholder-types = antijoin(left=named-types, right=implemented-types, left-on=["id"], right-on=["id"]);
let placeholders = project(from=placeholder-types, columns=["id", "file", "span", "kind"]);
let type-findings-labelled = extend(from=placeholders, values={"what": "this type holds nothing and implements no trait: a placeholder"});
let type-findings = project(from=type-findings-labelled, columns=["id", "file", "span", "kind", "what"]);
let findings = union(left=file-findings, right=type-findings);
emit findings subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "{what}"
help = "Give the file the declarations it exists for, or delete it with its `mod` line; give a placeholder type the values or the trait it carries, or delete it (functions belong in a module, not on an empty type)."

[given]
include = ['src/greeting/**']

[[scenarios]]
id = 'files-declarations-types-hold-or-implement-something'
scenario = 'Files with declarations and types that hold or implement something pass.'
given.files.'src/greeting/adapters.rs' = '''
//! The greeting adapters.

pub(crate) mod memory;
'''
given.files.'src/greeting/adapters/memory/adapter.rs' = '''
use super::super::super::interface::GreetingInterface;

/// A unit adapter implements its interface: not a placeholder.
#[derive(Debug, Default)]
