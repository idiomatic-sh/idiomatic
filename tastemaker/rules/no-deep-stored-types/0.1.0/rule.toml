description = "A type that derives a serialization trait holds records of such types at most three levels deep: none holds a record that holds a record that holds a record."
why = "A stored or schema type is the shape of data that outlives a run or crosses a process: a file, a store, a JSON answer. Each level of record in it is a level every reader and writer of that data descends, and a level a change to the data has to thread through; past three, the shape wants flattening into tables of its own (a row per kind, the way the stores keep theirs). The types are the structs with named fields and the enums that derive a trait the entry lists in `derives` (`Serialize`, `Deserialize`); a level is a field whose type, written as a single name, is another such type that the same file declares, so a type with a field of `Vec<Row>` holds `Row`. A type that holds itself is not a level, and a tuple struct that wraps one value (`struct Name(String)`) is a name for a value and not a record, and so is an enum whose variants hold nothing (a status, a kind). Not seen: a field of a qualified path (`inner::Row`), a type another file declares or the file imports, and a type that derives nothing the entry lists."

query = '''
param derives: set<string>;
let derived = select d."declaration" as "id" from "decorates" as d where d."target" = "derive" and glob_any(d."arguments", $derives);
let tree-nodes = select l."id" as "id", l."kind" as "kind" from "syntax-tree" as l where l."text" = "";
let record-lists = select l."id" as "id" from tree-nodes as l where l."kind" = "record-field-list";
let variant-lists = select * from tree-nodes where kind = "variant-list";
let variants = select * from tree-nodes where kind = "variant";
let data-lists = select * from tree-nodes where glob_any(kind, "{record-field-list,tuple-field-list}");
let list-variants = select l."id" as "list", r."child" as "variant" from variant-lists as l join "syntax-child" as r on l."id" = r."parent";
let listed-variants = select l."list" as "list", l."variant" as "variant" from list-variants as l join variants as v on l."variant" = v."id";
let variant-parts = select l."list" as "list", r."child" as "part" from listed-variants as l join "syntax-child" as r on l."variant" = r."parent";
let data-variants = select l."list" as "id" from variant-parts as l join data-lists as d on l."part" = d."id";
let data-ids = project(from=data-variants, columns=["id"]);
let shapes = union(left=record-lists, right=data-ids);
let holders = select r."parent" as "id" from shapes as l join "syntax-child" as r on l."id" = r."child";
let stored = select d."id" as "id" from derived as d join holders as h on d."id" = h."id";
let held = select r."owner" as "from", r."definition" as "to" from "resolves" as r join stored as s on r."owner" = s."id";
let linked = select h."from" as "from", h."to" as "to" from held as h join stored as t on h."to" = t."id";
let links = select * from linked where from != to;
let two = select a."from" as "from", b."to" as "to" from links as a join links as b on a."to" = b."from";
let three = select a."from" as "from", b."to" as "to" from two as a join links as b on a."to" = b."from";
let roots = project(from=three, columns=["from"]);
let placed = select d."id" as "id", d."name" as "name", d."file" as "file", d."span" as "span" from "defines" as d;
let found = select p."name" as "name", p."file" as "file", p."span" as "span" from roots as r join placed as p on r."from" = p."id";
emit found subject "file" key("span");
'''

[params.derives]
type = "set<string>"
description = "The derives that make a type a stored or schema type, as globs over the derive's arguments (such as `*Serialize*`)."

[diagnostic]
primary = "span"
message = "`{name}` holds a record that holds a record that holds a record, four levels of stored types"
help = "Flatten the shape: keep a table of the inner records and refer to them by key, or split the type by what reads it. A shape a file format or a pinned output dictates is ignored in the source with the reason, never silently."

[given]
include = ['**/*.rs']
exclude = ['**/tests/**', '**/*_test.rs']
params = { derives = ['*Serialize*', '*Deserialize*'] }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'four-levels'
scenario = 'A type that holds three levels of stored types below it is reported at its name.'
given.files.'src/lib.rs' = '''
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
pub struct Image {
    pub head: Head,
    pub rows: Vec<Row>,
}

#[derive(Serialize, Deserialize)]
pub struct Head {
    pub cell: Cell,
}

#[derive(Serialize, Deserialize)]
pub struct Cell {
    pub leaf: Leaf,
}

#[derive(Serialize, Deserialize)]
pub struct Leaf {
    pub n: u8,
}

#[derive(Serialize, Deserialize)]
pub struct Row {
    pub name: String,
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'three-levels'
scenario = 'A type that holds two levels below it is not reported.'
given.files.'src/lib.rs' = '''
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
pub struct Image {
    pub head: Head,
}

#[derive(Serialize, Deserialize)]
pub struct Head {
    pub cell: Cell,
}

#[derive(Serialize, Deserialize)]
pub struct Cell {
    pub n: u8,
}
'''

[[scenarios]]
id = 'types-that-derive-nothing'
scenario = 'Four levels of types that derive no serialization trait are not reported.'
given.files.'src/lib.rs' = '''
pub struct A {
    pub b: B,
}

pub struct B {
    pub c: C,
}

pub struct C {
    pub d: D,
}

pub struct D {
    pub n: u8,
}
'''

[[scenarios]]
id = 'a-type-that-holds-itself'
scenario = 'A type that holds itself is not a level.'
given.files.'src/lib.rs' = '''
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
pub struct Node {
    pub next: Option<Box<Node>>,
    pub name: String,
}
'''

[[scenarios]]
id = 'a-wrapper-that-is-not-stored'
scenario = 'A level that derives nothing breaks the chain.'
given.files.'src/lib.rs' = '''
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
pub struct A {
    pub b: B,
}

#[derive(Serialize, Deserialize)]
pub struct B {
    pub c: C,
}

pub struct C {
    pub d: D,
}

#[derive(Serialize, Deserialize)]
pub struct D {
    pub n: u8,
}
'''

[[scenarios]]
id = 'a-newtype-is-not-a-level'
scenario = 'A tuple struct that wraps a record is a name for it and not a level, so the chain is two levels long.'
given.files.'src/lib.rs' = '''
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
pub struct A {
    pub b: B,
}

#[derive(Serialize, Deserialize)]
pub struct B {
    pub c: C,
}

#[derive(Serialize, Deserialize)]
pub struct C(D);

#[derive(Serialize, Deserialize)]
pub struct D {
    pub n: u8,
}
'''

[[scenarios]]
id = 'a-fieldless-enum-is-not-a-level'
scenario = 'An enum whose variants hold nothing is a name for a value and not a level, so a chain that ends in one is three levels long.'
given.files.'src/lib.rs' = '''
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
pub struct A {
    pub b: B,
}

#[derive(Serialize, Deserialize)]
pub struct B {
    pub c: C,
}

#[derive(Serialize, Deserialize)]
pub struct C {
    pub status: Status,
}

#[derive(Serialize, Deserialize)]
pub enum Status {
    Held,
    Over,
}
'''

[[scenarios]]
id = 'an-enum-that-holds-a-record-is-a-level'
scenario = 'An enum with a variant that holds a record is a level: a chain of two structs, such an enum and a record is reported at its first type.'
given.files.'src/lib.rs' = '''
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
pub struct A {
    pub b: B,
}

#[derive(Serialize, Deserialize)]
pub struct B {
    pub shape: Shape,
}

#[derive(Serialize, Deserialize)]
pub enum Shape {
    Plain,
    Pointed(Point),
}

#[derive(Serialize, Deserialize)]
pub struct Point {
    pub x: u8,
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]
