description = "A test has a subject: no `todo!()` or `unimplemented!()` stands in test code, no table named `CASES` is empty, and no fixture read ends in `unwrap_or_default()`."
why = "A test that passes while proving nothing is worse than none: it reports a covered case that is not. A `todo!()` in a test file is a subject nobody wrote; an empty `CASES` runs zero cases and succeeds; `read_to_string(fixture).unwrap_or_default()` turns a missing fixture into an empty string that every check accepts. Found from the macro calls named `todo` or `unimplemented`, the `const` or `static` named `CASES` whose array has no element, and the `unwrap_or_default` calls whose receiver chain reads a file (`read`, `read_to_string`, `read_to_end`, `read_dir`) in the files the entry includes. A cases.rs runner must not compare errors only by discriminant: exact equality or a contextual selector is required. Tables built by functions or aliases are checked by the runtime runner, which refuses an empty selected word. A read reached through a helper is not seen statically."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let paths = select * from tree-nodes where kind = "path";
let segments = select * from tree-nodes where kind = "path-segment";
let name-refs = select * from tree-nodes where kind = "name-ref";
let idents = select * from tree-tokens where kind = "ident";
let macro-calls = select * from tree-nodes where kind = "macro-call";
let types = select l."id" as "type", l."file" as "file", l."span" as "span", l."id" as "node" from macro-calls as l join macro-calls as r on l."id" = r."id";
let p0-c = select l."type" as "type", l."file" as "file", l."span" as "span", r."child" as "node" from types as l join "syntax-child" as r on l."node" = r."parent";
let p0 = select l."type" as "type", l."file" as "file", l."span" as "span", r."id" as "node" from p0-c as l join paths as r on l."node" = r."id";
let p1-c = select l."type" as "type", l."file" as "file", l."span" as "span", r."child" as "node" from p0 as l join "syntax-child" as r on l."node" = r."parent";
let p1 = select l."type" as "type", l."file" as "file", l."span" as "span", r."id" as "node" from p1-c as l join segments as r on l."node" = r."id";
let p2-c = select l."type" as "type", l."file" as "file", l."span" as "span", r."child" as "node" from p1 as l join "syntax-child" as r on l."node" = r."parent";
let p2 = select l."type" as "type", l."file" as "file", l."span" as "span", r."id" as "node" from p2-c as l join name-refs as r on l."node" = r."id";
let ident-edges = select l."type" as "type", l."file" as "file", l."span" as "span", r."child" as "node" from p2 as l join "syntax-child" as r on l."node" = r."parent";
let stubs = select * from idents where glob_any(text, "{todo,unimplemented}");
let todo-calls = select l."file" as "file", l."span" as "span" from ident-edges as l join stubs as r on l."node" = r."id";
let consts = select * from tree-nodes where glob_any(kind, "{const,static}");
let names = select * from tree-nodes where kind = "name";
let const-kids = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from consts as l join "syntax-child" as r on l."id" = r."parent";
let const-names = select l."id" as "id", l."file" as "file", l."span" as "span", r."id" as "name" from const-kids as l join names as r on l."child" = r."id";
let name-kids = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from const-names as l join "syntax-child" as r on l."name" = r."parent";
let case-tokens = select * from tree-tokens where text = "CASES";
let case-consts = select l."id" as "id", l."file" as "file", l."span" as "span" from name-kids as l join case-tokens as r on l."child" = r."id";
let arrays = select * from tree-nodes where kind = "array-expr";
let array-kids = select l."id" as "array", r."child" as "child" from arrays as l join "syntax-child" as r on l."id" = r."parent";
let filled = select l."array" as "array" from array-kids as l join tree-nodes as r on l."child" = r."id";
let empty-arrays = antijoin(left=arrays, right=filled, left-on=["id"], right-on=["array"]);
let refs = select * from tree-nodes where kind = "ref-expr";
let case-kids = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from case-consts as l join "syntax-child" as r on l."id" = r."parent";
let case-refs = select l."file" as "file", l."span" as "span", r."id" as "ref" from case-kids as l join refs as r on l."child" = r."id";
let ref-kids = select l."file" as "file", l."span" as "span", r."child" as "child" from case-refs as l join "syntax-child" as r on l."ref" = r."parent";
let empty-cases = select l."file" as "file", l."span" as "span" from ref-kids as l join empty-arrays as r on l."child" = r."id";
let method-calls = select * from tree-nodes where kind = "method-call-expr";
let call-kids = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from method-calls as l join "syntax-child" as r on l."id" = r."parent";
let call-names = select l."id" as "id", l."file" as "file", l."span" as "span", r."id" as "name" from call-kids as l join name-refs as r on l."child" = r."id";
let call-name-kids = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from call-names as l join "syntax-child" as r on l."name" = r."parent";
let defaults = select * from idents where glob_any(text, "unwrap_or_default");
let default-calls = select l."id" as "id", l."file" as "file", l."span" as "span" from call-name-kids as l join defaults as r on l."child" = r."id";
let reads-in = axis(from=default-calls, relation="syntax-child", direction=descendant, domain=name-refs);
let read-kids = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "child" from reads-in as l join "syntax-child" as r on l."related" = r."parent";
let reads = select * from idents where glob_any(text, "{read,read_to_string,read_to_end,read_dir}");
let read-defaults = select l."file" as "file", l."span" as "span" from read-kids as l join reads as r on l."child" = r."id";
let first = union(left=todo-calls, right=empty-cases);
let prior = union(left=first, right=read-defaults);
let helper-tokens = select * from tree-tokens where glob_any(file, "{cases.rs,**/cases.rs}") and text = "discriminant";
let variant-only = project(from=helper-tokens, columns=["file", "span"]);
let found = union(left=prior, right=variant-only);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this test proves nothing"
help = "Write the subject the test is for, put the rows in `CASES`, and let a fixture that cannot be read fail the test (`expect` it)."

[[scenarios]]
id = 'variant-only-error-runner'
scenario = 'An error runner that checks only the variant, with no context, is reported at each use.'
given.files.'src/cases.rs' = 'fn same(a: &Error, b: &Error) -> bool { std::mem::discriminant(a) == std::mem::discriminant(b) }'
then.findings = [
  { path = 'src/cases.rs', line = 1 },
  { path = 'src/cases.rs', line = 1 },
]

[[scenarios]]
id = 'exact-error-runner'
scenario = 'An error runner that compares the exact error is not reported.'
given.files.'src/cases.rs' = 'fn same(a: &Error, b: &Error) -> bool { a == b }'

[[scenarios]]
id = 'todo-subject'
scenario = 'A todo stands in for the subject.'
given.include = ['**/*.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib_test.rs' = '''
//! The test.

#[test]
fn runs() {
    todo!()
}
'''
then.findings = [
  { path = 'src/lib_test.rs', line = 5 },
]

[[scenarios]]
id = 'empty-cases'
scenario = 'An empty table of cases.'
given.include = ['**/*.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib_test.rs' = '''
//! The test.

const CASES: &[u8] = &[];
'''
then.findings = [
  { path = 'src/lib_test.rs', line = 3 },
]

[[scenarios]]
id = 'default-read'
scenario = 'A fixture read that falls back to empty.'
given.include = ['**/*.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib_test.rs' = '''
//! The test.

#[test]
fn reads() {
    let text = std::fs::read_to_string("expected.txt").unwrap_or_default();
    assert!(text.is_empty());
}
'''
then.findings = [
  { path = 'src/lib_test.rs', line = 5 },
]

[[scenarios]]
id = 'real-test'
scenario = 'Cases, and a read that fails the test.'
given.include = ['**/*.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib_test.rs' = '''
//! The test.

const CASES: &[u8] = &[1, 2];

#[test]
fn reads() {
    let text = std::fs::read_to_string("expected.txt").expect("the fixture");
    assert!(CASES.len() > text.len());
}
'''

[[scenarios]]
id = 'empty-row'
scenario = 'A row that holds an empty list in a filled table.'
given.include = ['**/*.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib_test.rs' = '''
//! The test.

const CASES: &[(&str, &[u8])] = &[("one", &[]), ("two", &[1])];
'''
