description = "A local non-dev path dependency never runs from a package in a lower layer to one in a higher layer, the layers being the ordered sets of package directory names `layers` gives."
why = "Layers keep the entry points above the libraries and the libraries above the leaves, so a leaf can change without rebuilding the front ends and no library grows a dependency on a binary. A package is known by its manifest's directory name, nested or directly under the workspace root, ranked by the first set of `layers` holding it (first set, top layer); a dependency from a package to one in an upper layer is reported at the depending manifest. Dev dependencies are left out: tests may reach upwards. Not seen: a package whose directory name no set holds (it has no layer), and registry or git dependencies."

query = '''
param layers: list<set<string>>;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let shipped = select * from "package-dependency" where kind != "dev";
let edges = project(from=shipped, columns=["source", "target"]);
let nested-sources = capture(from=edges, path="source", pattern="{*parent}/{from}/Cargo.toml", captures=["parent", "from"]);
let top-sources = capture(from=edges, path="source", pattern="{from}/Cargo.toml", captures=["from"]);
let nested-named = project(from=nested-sources, columns=["source", "target", "from"]);
let top-named = project(from=top-sources, columns=["source", "target", "from"]);
let sources = union(left=nested-named, right=top-named);
let nested-targets = capture(from=sources, path="target", pattern="{*target-parent}/{to}/Cargo.toml", captures=["target-parent", "to"]);
let top-targets = capture(from=sources, path="target", pattern="{to}/Cargo.toml", captures=["to"]);
let nested-reached = project(from=nested-targets, columns=["source", "target", "from", "to"]);
let top-reached = project(from=top-targets, columns=["source", "target", "from", "to"]);
let targets = union(left=nested-reached, right=top-reached);
let ranked-sources = rank(from=targets, column="from", sets=$layers, output="from-layer");
let ranked = rank(from=ranked-sources, column="to", sets=$layers, output="to-layer");
let upward = select * from ranked where to-layer < from-layer;
let documents = select * from tree-nodes where kind = "toml";
let manifests = project(from=documents, columns=["file", "span"]);
let located = select l."from" as "from", l."source" as "file", r."span" as "span", l."to" as "to" from upward as l join manifests as r on l."source" = r."file";
emit located subject "file" key("file", "to");
'''

[params.layers]
type = "list<set<string>>"
description = "Package directory names from the top layer down: the first set is the top layer."

[diagnostic]
primary = "span"
message = "`{from}` depends on `{to}`, a package in a layer above it"
help = "Invert the dependency: move what `{from}` needs from `{to}` down into its own layer or below, or move `{from}` up."

[given]
include = ['**']
params = { layers = [['app'], ['domain'], ['leaf']] }
files.'Cargo.toml' = '''
[workspace]
resolver = "3"
members = ["crates/*"]
'''

[[scenarios]]
id = 'leaf-depends-app-above'
scenario = 'A leaf depends on the app above it.'
given.files.'crates/app/Cargo.toml' = '''
[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
'''
given.files.'crates/app/src/lib.rs' = ''
given.files.'crates/domain/Cargo.toml' = '''
[package]
name = "domain"
version = "0.1.0"
edition = "2024"

[dependencies]
leaf = { path = "../leaf" }
'''
given.files.'crates/domain/src/lib.rs' = ''
given.files.'crates/leaf/Cargo.toml' = '''
[package]
name = "leaf"
version = "0.1.0"
edition = "2024"

[dependencies]
app = { path = "../app" }
'''
given.files.'crates/leaf/src/lib.rs' = ''
then.findings = [
  { path = 'crates/leaf/Cargo.toml', line = 1 },
]

[[scenarios]]
id = 'every-dependency-runs-down'
scenario = 'Every dependency runs down.'
given.files.'crates/app/Cargo.toml' = '''
[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
'''
given.files.'crates/app/src/lib.rs' = ''
given.files.'crates/domain/Cargo.toml' = '''
[package]
name = "domain"
version = "0.1.0"
edition = "2024"

[dependencies]
leaf = { path = "../leaf" }
'''
given.files.'crates/domain/src/lib.rs' = ''
given.files.'crates/leaf/Cargo.toml' = '''
[package]
name = "leaf"
version = "0.1.0"
edition = "2024"
'''
given.files.'crates/leaf/src/lib.rs' = ''

[[scenarios]]
id = 'dev-upward'
scenario = "A leaf's tests use the app above it."
given.files.'crates/app/Cargo.toml' = '''
[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
'''
given.files.'crates/app/src/lib.rs' = ''
given.files.'crates/domain/Cargo.toml' = '''
[package]
name = "domain"
version = "0.1.0"
edition = "2024"

[dependencies]
leaf = { path = "../leaf" }
'''
given.files.'crates/domain/src/lib.rs' = ''
given.files.'crates/leaf/Cargo.toml' = '''
[package]
name = "leaf"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
app = { path = "../app" }
'''
given.files.'crates/leaf/src/lib.rs' = ''

[[scenarios]]
id = 'values-to-core'
scenario = "Ryo's values crate depends on the core above it."
given.params = { layers = [['cli'], ['markdown', 'python', 'rust', 'toml'], ['sdk'], ['core'], ['query_language'], ['values'], ['language']] }
given.files.'crates/core/Cargo.toml' = '''
[package]
name = "core"
version = "0.1.0"
edition = "2024"
'''
given.files.'crates/core/src/lib.rs' = ''
given.files.'crates/values/Cargo.toml' = '''
[package]
name = "values"
version = "0.1.0"
edition = "2024"

[dependencies]
core = { path = "../core" }
'''
given.files.'crates/values/src/lib.rs' = ''
then.findings = [
  { path = 'crates/values/Cargo.toml', line = 1 },
]

[[scenarios]]
id = 'top-level-edge-depends-on-the-other-edge'
scenario = "The command line, a package directly under the workspace root (`cli/Cargo.toml`), depends on the SDK, which the layers rank above it: it is reported at the command line's manifest."
given.params = { layers = [['sdk'], ['cli']] }
given.files.'Cargo.toml' = '''
[workspace]
resolver = "3"
members = ["cli", "crates/*"]
'''
given.files.'cli/Cargo.toml' = '''
[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ryo = { package = "sdk", path = "../crates/sdk" }
'''
given.files.'cli/src/main.rs' = ''
given.files.'crates/sdk/Cargo.toml' = '''
[package]
name = "sdk"
version = "0.1.0"
edition = "2024"
'''
given.files.'crates/sdk/src/lib.rs' = ''
then.findings = [
  { path = 'cli/Cargo.toml', line = 1 },
]
