[[scenarios]]
id = 'placed-cli-output'
scenario = 'The CLI spec places the process output module.'
given.files.'app/Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/output.rs"

[dependencies]
serde = "1"
serde_json = "1"
'''
given.files.'app/src/output.rs' = '''
pub fn print(answer: &impl serde::Serialize) {
    serde_json::to_writer(std::io::stdout().lock(), answer).unwrap();
}
'''
given.files.'tastemaker.toml' = '''
workspace = { name = "fixture", dependencies = [{ package = "idiomatic.arch", path = "../../.." }] }
rules = [{ rule = "idiomatic.arch/no-json-in-process", include = ["**"] }]
specs = [{ spec = "idiomatic.arch/cli", include = ["app"], params = { library = "fixture", markdown = "absent", product = "fixture", writes = [] } }]
'''
then.only = ['idiomatic.arch/no-json-in-process', 'idiomatic.arch/no-json-in-process#unknown']

