description = "`serde_json` is named and depended on only where JSON crosses the process boundary: no `serde_json` identifier, in a path, an import or another macro's arguments, and no normal dependency on it outside a boundary package."
why = "JSON is a command's output format and another tool's input, not how a process talks to itself. The process presentation boundary is the CLI spec's placed output template, which prints, and its placed output schemas, the wire shapes every command prints the same way, and each command's placed `schemas.rs`, which encodes its own answer; a file merely named output.rs or schemas.rs is not. Other boundary adapters, tests and benches are the entry's `exclude`. The crate is matched by its name as written, token by token, so a path inside another macro's arguments (`format!(\"{}\", serde_json::json!(..))`) counts. A package that depends on `serde_json` as a normal dependency is a finding at that dependency's line, unless it is a boundary package: the one that holds the CLI spec's placed output module or a command's placed schemas, or one whose manifest the entry's `exclude` leaves out. The dependency is matched by the package depended on, so a crate renamed in the manifest (`json = { package = \"serde_json\" }`) counts. Not seen: JSON reached through a re-export of `serde_json` by another crate."

query = '''
let placed-files = select l."path" as "file", l."entry" as "entry", l."package" as "package", l."template" as "template", l."version" as "version", l."spec" as "spec" from "tastemaker.placed" as l;
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let names = select * from tree-tokens where text = "serde_json";
let idents = select * from names where kind = "ident";
let json = project(from=idents, columns=["file", "span", "text"]);
let cli = select * from placed-files where spec = "cli";
let outputs = select * from cli where glob_any(template, "{output,schemas,*/schemas}");
let commands = select * from placed-files where spec = "command" and glob_any(template, "{schemas,*/schemas}");
let presentation = union(left=outputs, right=commands);
let adapters = select * from placed-files where spec = "adapter" and glob_any(template, "{schemas,*/schemas}");
let edges = union(left=presentation, right=adapters);
let internal = antijoin(left=json, right=edges, left-on=["file"], right-on=["file"]);
let boundary-packages = select r."package" as "file" from edges as l join "file-package" as r on l."file" = r."path";
let json-dependencies = select l."source" as "file", l."binding" as "binding", l."package" as "text" from "package-dependency" as l where l."package" = "serde_json" and l."kind" = "normal";
let inside-dependencies = antijoin(left=json-dependencies, right=boundary-packages, left-on=["file"], right-on=["file"]);
let tables = select l."occurrence" as "table" from "entry" as l where l."key" = "dependencies";
let table-mappings = select r."id" as "mapping" from tables as l join "mapping" as r on l."table" = r."owner";
let dependency-entries = select r."file" as "file", r."key" as "key", r."span" as "span" from table-mappings as l join "entry" as r on l."mapping" = r."owner";
let declared = select l."file" as "file", r."span" as "span", l."text" as "text" from inside-dependencies as l join dependency-entries as r on l."file" = r."file" and l."binding" = r."key";
let in-process = union(left=internal, right=declared);
emit in-process subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{text}` is JSON in process"
help = "Keep the value typed (a struct or enum with serde derives) and pass it through a port; serialize it in a command's `schemas.rs`, the CLI spec's output module or the adapter where JSON crosses the process boundary, and depend on `serde_json` only from that package or from a boundary package the entry's `exclude` names. Inside the process an ignore is never the fix."

[[scenarios]]
id = 'no-json'
scenario = 'No JSON: nothing is reported.'
given.include = ['**']
given.exclude = ['**/adapters/**', '**/*_test.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/lib.rs' = '''
mod plain;
'''
given.files.'src/plain.rs' = '''
use std::fmt;
'''

[[scenarios]]
id = 'domain-value'
scenario = 'A domain file holds a JSON value.'
given.include = ['**']
given.exclude = ['**/adapters/**', '**/*_test.rs']
given.files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
given.files.'src/domain.rs' = '''
use serde_json::Value;
'''
given.files.'src/lib.rs' = '''
mod domain;
'''
then.findings = [
  { path = 'src/domain.rs', line = 1 },
]

