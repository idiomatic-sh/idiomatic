description = "Whether a file or a build is unchanged is decided by a digest of its content, never by its stamp alone: no text is made from a modification time (a `{modified}` or `{mtime}` capture, or a `modified` or `mtime` value passed to a macro)."
why = "A file's size and modification time say it may be unchanged, not that it is: a checkout, a copy or a fast rebuild leaves a file with new content under the same size and time (a time kept in seconds is the same for every rebuild within it), and a key made from them then reuses what was computed from the old content. The stamp only decides whether to hash again; the key, the record and the comparison hold the content's digest (`blake3::hash` of the bytes), which a stamp keeps from one run to the next. A stamp formatted into text (`format!(\"{}:{modified}\", meta.len())`) is that key, so it is the finding. Read from the string tokens and macro arguments as written. Not seen: a time read under another name, and a stamp compared as a typed value without being formatted."

query = '''
let strings = select * from "syntax-tree" where kind = "string";
let captured = select l."file" as "file", l."span" as "span", l."text" as "text" from strings as l where glob_any(l."text", "*\{modified\}*") or glob_any(l."text", "*\{modified:*") or glob_any(l."text", "*\{mtime\}*") or glob_any(l."text", "*\{mtime:*");
let passed = select l."file" as "file", l."span" as "span", l."target" as "text" from "mention" as l where glob_any(l."target", "{modified,mtime}");
let found = union(left=captured, right=passed);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{text}` makes a key from a modification time"
help = "Key on the digest of the content (`blake3::hash` of the bytes); keep the size and the time beside the digest only to decide whether to hash the file again."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'listing-keyed-by-stamp'
scenario = 'The operation files and the definition files are keyed by their size and modification time (asymptote lock and Tastemaker packages at 5149cd075d).'
given.files.'src/lib.rs' = '''
pub struct Stamp(pub String);

pub fn stamp(path: &std::path::Path) -> std::io::Result<Stamp> {
    let meta = std::fs::metadata(path)?;
    let modified = meta
        .modified()?
        .duration_since(std::time::UNIX_EPOCH)
        .map_or(0, |since| since.as_nanos());
    Ok(Stamp(format!("{}:{modified}", meta.len())))
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 9 },
]

[[scenarios]]
id = 'build-keyed-by-stamp'
scenario = 'The program build a cache is kept under is its size and modification time in seconds (ryo process at 5149cd075d).'
given.files.'src/lib.rs' = '''
pub fn build(version: &str) -> String {
    let program = std::env::current_exe()
        .ok()
        .and_then(|path| std::fs::metadata(path).ok());
    let modified = program
        .as_ref()
        .and_then(|meta| meta.modified().ok())
        .and_then(|time| time.duration_since(std::time::UNIX_EPOCH).ok())
        .map_or(0, |since| since.as_secs());
    format!(
        "{} {} {}",
        version,
        program.map_or(0, |meta| meta.len()),
        modified
    )
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 14 },
]

[[scenarios]]
id = 'digest-gated-by-stamp'
scenario = 'A file is keyed by the digest of its bytes; its size and time only say whether to hash it again (asymptote sources).'
given.files.'src/lib.rs' = '''
pub struct Record {
    pub size: u64,
    pub modified: std::time::SystemTime,
    pub digest: String,
}

pub fn record(path: &std::path::Path, known: Option<&Record>) -> std::io::Result<Record> {
    let meta = std::fs::metadata(path)?;
    let modified = meta.modified()?;
    if let Some(kept) = known.filter(|kept| kept.size == meta.len() && kept.modified == modified) {
        return Ok(Record { size: kept.size, modified, digest: kept.digest.clone() });
    }
    let bytes = std::fs::read(path)?;
    Ok(Record {
        size: meta.len(),
        modified,
        digest: blake3::hash(&bytes).to_hex().to_string(),
    })
}
'''
