description = "No `.ok()` turns a `Result` into an `Option`, and no `Result::ok` is passed to an adapter such as `filter_map`."
why = "`.ok()` drops the error: a file that cannot be read, a value that does not decode or a path outside its root becomes `None`, and the caller treats a failure as absence. The error is propagated with `?`, mapped into the caller's own error, or matched for the one kind that means absence (`ErrorKind::NotFound`). Read from the syntax: every method call named `ok` with no argument, and every path `Result::ok`, in the files the entry includes. A method of another type named `ok` with no argument is reported too: name it otherwise. Where dropping the error is the meaning (a probe whose failure is an answer), an ignore says why."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let idents = select l."id" as "id", l."text" as "text" from "syntax-tree" as l where l."kind" = "ident";
let name-edges = select * from "syntax-child" where field = "name-ref";
let ref-tokens = select l."parent" as "owner", l."child" as "name-ref", r."child" as "token" from name-edges as l join "syntax-child" as r on l."child" = r."parent";
let named = select l."owner" as "owner", l."name-ref" as "name-ref", r."text" as "name" from ref-tokens as l join idents as r on l."token" = r."id";
let ok-names = select * from named where name = "ok";
let method-calls = select * from tree-nodes where kind = "method-call-expr";
let ok-calls = select l."owner" as "id", l."name-ref" as "name-ref" from ok-names as l join method-calls as r on l."owner" = r."id";
let arg-list-edges = select * from "syntax-child" where field = "arg-list";
let arg-edges = select * from "syntax-child" where field = "args";
let given-args = select l."parent" as "id" from arg-list-edges as l join arg-edges as r on l."child" = r."parent";
let bare-ok-calls = antijoin(left=ok-calls, right=given-args, left-on=["id"], right-on=["id"]);
let call-sites = select r."id" as "id", r."file" as "file", r."span" as "span" from bare-ok-calls as l join tree-nodes as r on l."name-ref" = r."id";
let segments = select * from tree-nodes where kind = "path-segment";
let ok-segments = select l."owner" as "segment", l."name-ref" as "name-ref" from ok-names as l join segments as r on l."owner" = r."id";
let segment-edges = select * from "syntax-child" where field = "segment";
let ok-paths = select r."parent" as "path", l."name-ref" as "name-ref" from ok-segments as l join segment-edges as r on l."segment" = r."child";
let qualifier-edges = select * from "syntax-child" where field = "qualifier";
let qualified = select l."path" as "path", l."name-ref" as "name-ref", r."child" as "qualifier" from ok-paths as l join qualifier-edges as r on l."path" = r."parent";
let qualifier-segments = select l."name-ref" as "name-ref", r."child" as "segment" from qualified as l join segment-edges as r on l."qualifier" = r."parent";
let qualifier-names = select l."name-ref" as "name-ref", r."name" as "name" from qualifier-segments as l join named as r on l."segment" = r."owner";
let result-oks = select * from qualifier-names where name = "Result";
let path-sites = select r."id" as "id", r."file" as "file", r."span" as "span" from result-oks as l join tree-nodes as r on l."name-ref" = r."id";
let found = union(left=call-sites, right=path-sites);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`ok` drops this error"
help = "Propagate the error with `?`, map it into this function's own error, or match the one kind that means absence (`Err(error) if error.kind() == ErrorKind::NotFound`). When dropping it is the meaning, say why above the line: `// ignore: idiomatic.arch/no-ok-on-result - <why the error is the answer>`."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
mod code;
'''

[[scenarios]]
id = 'image-that-does-not-decode'
scenario = 'A cache image that does not decode is read as no image (the store adapter at 5149cd075d).'
given.files.'src/code.rs' = '''
pub struct Image;
pub struct ImageBytesSchema<'a>(pub &'a [u8]);
impl TryFrom<ImageBytesSchema<'_>> for Image {
    type Error = ();
    fn try_from(_: ImageBytesSchema<'_>) -> Result<Self, ()> { Err(()) }
}
pub fn image(bytes: &[u8]) -> Option<Image> {
    Image::try_from(ImageBytesSchema(bytes)).ok()
}
'''
then.findings = [
  { path = 'src/code.rs', line = 8 },
]

[[scenarios]]
id = 'entries-filtered-by-result-ok'
scenario = 'Directory entries that cannot be read are filtered out with `Result::ok`.'
given.files.'src/code.rs' = '''
pub fn names(directory: &std::path::Path) -> std::io::Result<Vec<std::path::PathBuf>> {
    Ok(std::fs::read_dir(directory)?
        .filter_map(Result::ok)
        .map(|entry| entry.path())
        .collect())
}
'''
then.findings = [
  { path = 'src/code.rs', line = 3 },
]

[[scenarios]]
id = 'errors-propagated'
scenario = 'Errors propagated, mapped, and one kind matched as absence.'
given.files.'src/code.rs' = '''
pub fn read(path: &std::path::Path) -> std::io::Result<Option<String>> {
    match std::fs::read_to_string(path) {
        Ok(text) => Ok(Some(text)),
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(None),
        Err(error) => Err(error),
    }
}
pub fn names(directory: &std::path::Path) -> std::io::Result<Vec<std::path::PathBuf>> {
    std::fs::read_dir(directory)?
        .map(|entry| entry.map(|entry| entry.path()))
        .collect()
}
pub fn ok_or(value: Option<u8>) -> Result<u8, ()> {
    value.ok_or(())
}
'''
