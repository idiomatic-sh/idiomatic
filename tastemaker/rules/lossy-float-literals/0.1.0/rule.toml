description = "No float literal is at or above `limit`, where binary64 no longer holds every integer exactly."
why = "From 2^53 (about 9e15) on, an `f64` skips integers, so a literal written that large may not be the value it spells, and arithmetic on it silently rounds (clippy's `lossy_float_literal` and `excessive_precision`). The literal's text is compared as a binary64 number, so `1e16` and `10000000000000000.0` both count. Not seen: a literal with a type suffix (`1e16f64`), whose text is not a plain number, and a literal inside a macro invocation's tokens."

query = '''
param limit: string;
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let floats = select * from tree-tokens where kind = "float-number";
let lossy = select * from floats where float_text_gte(text, $limit);
emit lossy subject "file" key("span");
'''

[params.limit]
type = "string"
description = "The smallest magnitude reported, as number text (such as `1e15`)."

[diagnostic]
primary = "span"
message = "`{text}` is past the integers binary64 holds exactly"
help = "Use an integer type for exact values, or write the value binary64 actually holds."

[given]
include = ['**']
params = { limit = '1e15' }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''
files.'src/lib.rs' = '''
mod code;
'''

[[scenarios]]
id = 'float-literals-below-limit'
scenario = 'Float literals below the limit.'
given.files.'src/lib.rs' = '''
pub fn f() -> f64 {
    1.5 + 1e14 + 999999999999999.0
}
'''

[[scenarios]]
id = 'float-literal-written-exponent'
scenario = 'A float literal written with an exponent.'
given.files.'src/code.rs' = '''
pub fn f() -> f64 {
    1e16
}
'''
then.findings = [
  { path = 'src/code.rs', line = 2 },
]

[[scenarios]]
id = 'float-literal-written-digits'
scenario = 'A float literal written in digits.'
given.files.'src/code.rs' = '''
pub fn f() -> f64 {
    10000000000000000.0
}
'''
then.findings = [
  { path = 'src/code.rs', line = 2 },
]
