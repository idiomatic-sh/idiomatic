[[scenarios]]
id = 'private-pub-self-pub-super-pub-super'
scenario = 'Private, pub(self), pub(super) and pub(in super) declarations, and pub fields.'
given.files.'schemas.rs' = '''
pub(super) struct RecordSchema {
    pub limit: Option<u32>,
}
struct PrivateSchema;
pub(self) struct OwnSchema;
pub(in super) struct ParentSchema;
pub(super) enum KindSchema {
    Plain,
}
pub(super) fn helper() {}
pub(super) const LIMIT: u8 = 1;
mod nested {
    pub(super) struct InnerSchema;
}
impl RecordSchema {
    pub fn limit(&self) -> Option<u32> {
        self.limit
    }
}
'''

[[scenarios]]
id = 'public-error'
scenario = 'A refusal ending SchemaError may be public.'
given.files.'schemas.rs' = '''
pub enum NameSchemaError {
    Empty,
}
'''
