description = "Control flow nests at most `max-depth` levels: an `if`, `match`, `loop`, `while` or `for` has at most `max-depth` of them around it."
why = "Each level of nesting is a condition the reader keeps in mind to follow the innermost line; past a few, the code wants early returns or a function of its own (clippy's `excessive_nesting`). An `else if` continues its chain rather than nesting in it, so it is not a level. Counted over the syntax tree, across a closure or a nested function in between. Not seen: nesting written inside a macro invocation's tokens."

query = '''
param max-depth: integer;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let flow = select * from tree-nodes where glob_any(kind, "{if-expr,match-expr,loop-expr,while-expr,for-expr}");
let flow-parents = select l."id" as "id", l."kind" as "kind", r."parent" as "parent" from flow as l join "syntax-child" as r on l."id" = r."child";
let else-ifs = select l."id" as "id" from flow-parents as l join flow as r on l."parent" = r."id" and l."kind" = r."kind";
let levels = antijoin(left=flow, right=else-ifs, left-on=["id"], right-on=["id"]);
let enclosing = axis(from=levels, relation="syntax-child", direction=ancestor, domain=levels);
let depths = group-count(from=enclosing, keys=["id", "file", "span", "kind"], count="depth", distinct="related");
let deep = select * from depths where depth > $max-depth;
emit deep subject "file" key("span");
'''

[params.max-depth]
type = "integer"
description = "The most control-flow expressions allowed around one (such as 4)."

[diagnostic]
primary = "span"
message = "this {kind} sits under {depth} levels of control flow, over the limit"
help = "Return early, or move the inner levels into a function of their own."

[given]
include = ['**']
params = { max-depth = 2 }
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'two-levels'
scenario = 'Two levels: nothing is reported.'
given.files.'src/lib.rs' = '''
pub fn f(a: bool, b: bool) -> u8 {
    if a {
        if b {
            return 1;
        }
    }
    0
}
'''

[[scenarios]]
id = 'loop-under-three-levels'
scenario = 'A loop under three levels.'
given.files.'src/code.rs' = '''
pub fn f(a: bool, b: bool, v: &[u8]) -> u8 {
    for x in v {
        if a {
            match b {
                true => loop {
                    return *x;
                },
                false => {}
            }
        }
    }
    0
}
'''
given.files.'src/lib.rs' = '''
mod code;
'''
then.findings = [
  { path = 'src/code.rs', line = 5 },
]

[[scenarios]]
id = 'else-if-chain'
scenario = 'An else-if chain is one level.'
given.files.'src/lib.rs' = '''
pub fn f(a: u8) -> u8 {
    if a == 1 {
        1
    } else if a == 2 {
        2
    } else if a == 3 {
        if a > 0 { 3 } else { 4 }
    } else {
        0
    }
}
'''
