description = "A string constant is declared in one file: a constant of the same name holding the same string, declared in two or more files of one package, is reported at each declaration, unless every other declaration is in a sibling adapter of one port, which may not name another adapter's constant; so is a function of a `constants.rs` that returns a string another file declares, under any name."
why = "Two constants with one name and one value are one concept written twice: the store's directory in the domain and again in the disk adapter, the path pin's prefix in the packages domain and again in its adapter. A change to one leaves the other behind, and nothing says they must agree. Declare it once, where its concept lives, and let the other file name it by path (`const STORE: &str = crate::domain::definitions::constants::STORE;`), or pass it in. Read from the decoded value and the constant's name, within one package: another package can name a constant only through a dependency the rule does not see, and the crates of a language may not depend on one another; a constant whose value is built from another constant holds no literal and is never counted. A function of a `constants.rs` whose body holds one string and no other is a constant written as a function (`fn cache_directory() -> &'static str { \".ryo_cache\" }`): its string, unless it is one lower-case word, is matched by value alone, under whatever name the other file gives it. A value that is one lower-case word (`path`, `text`, `git`) is a format's vocabulary in an adapter, a column or a key that file's format names, and the domain may spell the same word for a concept of its own (a template's `path` key, an Arrow `path` column): such a word is one concept only between two adapters, or between two files outside adapters. Two adapters of one port (`adapters/vue/` and `adapters/svelte/` of the `embedded` port, each scanning its own markup for the same script tag) are not one concept written twice: neither may name the other's constants (adapter-owns-no-adapter) and the port's domain does not own a markup tag, so a constant they both declare is each one's own; it is reported when another file outside the sibling adapters, or the same adapter's other file, declares it. Not seen: the same text under two names between constants, a word declared in an adapter and again outside one, and a literal inside a list a constant holds under another name."

query = '''
let tree-nodes = select l."id" as "id", l."file" as "file" from "syntax-tree" as l where l."text" = "";
let constants = select l."id" as "id", l."name" as "name" from "defines" as l where l."kind" = "constant";
let parts = axis(from=constants, relation="syntax-child", direction=descendant, domain=tree-nodes);
let named-parts = select l."related" as "related", r."name" as "name" from parts as l join constants as r on l."id" = r."id";
let literals = select l."name" as "name", r."value" as "value", r."file" as "file", r."span" as "span" from named-parts as l join "string-literal" as r on l."related" = r."occurrence";
let declared = select r."package" as "package", l."name" as "name", l."value" as "value", l."file" as "file", l."span" as "span" from literals as l join "file-package" as r on l."file" = r."path";
let distinctive = select * from declared where glob_any(value, "*[!a-z]*");
let words = select * from declared where not glob_any(value, "*[!a-z]*");
let adapter-words = select * from words where glob_any(file, "**/adapters/**");
let domain-words = select * from words where not glob_any(file, "**/adapters/**");
let distinctive-spread = group-count(from=distinctive, keys=["package", "name", "value"], count="files", distinct="file");
let distinctive-repeated = select * from distinctive-spread where files >= 2;
let distinctive-found = select r."files" as "files", l."name" as "name", l."value" as "value", l."file" as "file", l."span" as "span" from distinctive as l join distinctive-repeated as r on l."package" = r."package" and l."name" = r."name" and l."value" = r."value";
let adapter-spread = group-count(from=adapter-words, keys=["package", "name", "value"], count="files", distinct="file");
let adapter-repeated = select * from adapter-spread where files >= 2;
let adapter-found = select r."files" as "files", l."name" as "name", l."value" as "value", l."file" as "file", l."span" as "span" from adapter-words as l join adapter-repeated as r on l."package" = r."package" and l."name" = r."name" and l."value" = r."value";
let domain-spread = group-count(from=domain-words, keys=["package", "name", "value"], count="files", distinct="file");
let domain-repeated = select * from domain-spread where files >= 2;
let domain-found = select r."files" as "files", l."name" as "name", l."value" as "value", l."file" as "file", l."span" as "span" from domain-words as l join domain-repeated as r on l."package" = r."package" and l."name" = r."name" and l."value" = r."value";
let functions = select l."id" as "id", l."name" as "name" from "defines" as l where l."kind" = "function" and glob_any(l."file", "**/constants.rs");
let function-parts = axis(from=functions, relation="syntax-child", direction=descendant, domain=tree-nodes);
let named-function-parts = select l."id" as "function", l."related" as "related", r."name" as "name" from function-parts as l join functions as r on l."id" = r."id";
let function-literals = select l."function" as "function", l."name" as "name", r."value" as "value", r."file" as "file", r."span" as "span" from named-function-parts as l join "string-literal" as r on l."related" = r."occurrence";
let literal-counts = group-count(from=function-literals, keys=["function"], count="literals");
let one-literal = select * from literal-counts where literals = 1;
let returned-any = select l."name" as "name", l."value" as "value", l."file" as "file", l."span" as "span" from function-literals as l join one-literal as r on l."function" = r."function";
let returned-distinctive = select * from returned-any where glob_any(value, "*[!a-z]*");
let returned = select r."package" as "package", l."name" as "name", l."value" as "value", l."file" as "file", l."span" as "span" from returned-distinctive as l join "file-package" as r on l."file" = r."path";
let valued = union(left=declared, right=returned);
let value-spread = group-count(from=valued, keys=["package", "value"], count="files", distinct="file");
let value-repeated = select * from value-spread where files >= 2;
let returned-values = project(from=returned, columns=["package", "value"]);
let shared-values = select r."files" as "files", r."package" as "package", r."value" as "value" from returned-values as l join value-repeated as r on l."package" = r."package" and l."value" = r."value";
let value-found = select r."files" as "files", l."name" as "name", l."value" as "value", l."file" as "file", l."span" as "span" from valued as l join shared-values as r on l."package" = r."package" and l."value" = r."value";
let named-found = union(left=distinctive-found, right=adapter-found);
let all-named = union(left=named-found, right=domain-found);
let every = union(left=all-named, right=value-found);
let adapter-files = capture(from="filesystem.file", path="path", pattern="{*port}/adapters/{adapter}/{*rest}", captures=["port", "adapter"]);
let in-adapter = select l."package" as "package", l."value" as "value", l."file" as "file", l."span" as "span", r."port" as "port", r."adapter" as "adapter" from valued as l join adapter-files as r on l."file" = r."path";
let outside-files = antijoin(left=valued, right=adapter-files, left-on=["file"], right-on=["path"]);
let outside = select l."package" as "package", l."value" as "value", l."file" as "file", l."span" as "span" from outside-files as l;
let beside-any = select l."file" as "file", l."span" as "span" from outside as l join valued as r on l."package" = r."package" and l."value" = r."value" where l."file" != r."file";
let adapter-beside-outside = select l."file" as "file", l."span" as "span" from in-adapter as l join outside as r on l."package" = r."package" and l."value" = r."value" where l."file" != r."file";
let adapter-beside-adapter = select l."file" as "file", l."span" as "span" from in-adapter as l join in-adapter as r on l."package" = r."package" and l."value" = r."value" where l."file" != r."file" and (l."port" != r."port" or l."adapter" = r."adapter");
let outside-pairs = union(left=beside-any, right=adapter-beside-outside);
let counterparts = union(left=outside-pairs, right=adapter-beside-adapter);
let countered = group-count(from=counterparts, keys=["file", "span"], count="counterparts");
let kept = select l."files" as "files", l."name" as "name", l."value" as "value", l."file" as "file", l."span" as "span" from every as l join countered as r on l."file" = r."file" and l."span" = r."span";
let occurrences = project(from=kept, columns=["files", "name", "value", "file", "span"]);
emit occurrences subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "the constant `{name}` = `{value}` is declared in {files} files"
help = "Declare `{name}` once, where its concept lives, and name it by its path everywhere else, or pass it in."

[given]
include = ['src/**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'store-declared-twice'
scenario = 'The store directory declared in the definitions domain and again in the disk adapter.'
given.files.'src/domain/definitions/constants.rs' = '''
//! The names a workspace is loaded by.

/// A workspace's file.
pub const WORKSPACE_FILE: &str = "tastemaker.toml";
/// The store's directory beneath the project root.
pub const STORE: &str = ".tastemaker_cache";
'''
given.files.'src/outbound/repository/adapters/disk/constants.rs' = '''
//! The names the disk adapter looks for and skips.

/// A workspace's file.
pub(super) const WORKSPACE_FILE: &str = crate::domain::definitions::constants::WORKSPACE_FILE;
/// The store Tastemaker keeps at a project's root, never walked: it is no file of the project.
pub(super) const STORE: &str = ".tastemaker_cache";
'''
then.findings = [
  { path = 'src/domain/definitions/constants.rs', line = 6 },
  { path = 'src/outbound/repository/adapters/disk/constants.rs', line = 6 },
]

[[scenarios]]
id = 'declared-once-named-by-path'
scenario = 'The workspace file declared once and named by its path in the adapter; another constant holds the same text under another name.'
given.files.'src/domain/definitions/constants.rs' = '''
//! The names a workspace is loaded by.

/// A workspace's file.
pub const WORKSPACE_FILE: &str = "tastemaker.toml";
'''
given.files.'src/outbound/repository/adapters/disk/constants.rs' = '''
//! The names the disk adapter looks for and skips.

/// A workspace's file.
pub(super) const WORKSPACE_FILE: &str = crate::domain::definitions::constants::WORKSPACE_FILE;
/// What marks a repository's root.
pub(super) const GIT: &str = ".git";
'''
given.files.'src/outbound/hooks/adapters/git/constants.rs' = '''
//! The hook adapter's names.

/// The directory git keeps its hooks under.
pub(super) const DIRECTORY: &str = ".git";
'''

[[scenarios]]
id = 'cache-directory-as-a-function'
scenario = 'The cache directory a constant in the image adapter, and again the string a function of the corpus adapter returns.'
given.files.'src/outbound/image/adapters/file/constants.rs' = '''
//! The names of the file image adapter.

/// The directory of a root that holds what a run keeps.
pub(super) const DIRECTORY: &str = ".ryo_cache";
'''
given.files.'src/outbound/corpus/adapters/ignore/constants.rs' = '''
//! The names of the ignore adapter.

/// The directory a repository keeps what a run kept for the next in, which is never listed.
#[must_use]
pub(crate) fn cache_directory() -> &'static str {
    ".ryo_cache"
}
'''
then.findings = [
  { path = 'src/outbound/image/adapters/file/constants.rs', line = 4 },
  { path = 'src/outbound/corpus/adapters/ignore/constants.rs', line = 6 },
]

[[scenarios]]
id = 'a-word-of-two-adapters'
scenario = 'The git command named by the same word in the hooks adapter and the repository adapter.'
given.files.'src/outbound/hooks/adapters/git/constants.rs' = '''
//! The hook adapter's names.

/// The command it runs.
pub(super) const GIT: &str = "git";
'''
given.files.'src/outbound/repository/adapters/git/constants.rs' = '''
//! The repository adapter's names.

/// The command it runs.
pub(super) const GIT: &str = "git";
'''
then.findings = [
  { path = 'src/outbound/hooks/adapters/git/constants.rs', line = 4 },
  { path = 'src/outbound/repository/adapters/git/constants.rs', line = 4 },
]

[[scenarios]]
id = 'a-template-key-and-a-column'
scenario = 'A template context key `path` in the domain and an Arrow column `path` in its adapter: two concepts that share a word.'
given.files.'src/domain/contexts/constants.rs' = '''
//! The keys a template's context holds.

/// The key of the placed file's path.
pub const PATH: &str = "path";
'''
given.files.'src/outbound/inventory/adapters/arrow/constants.rs' = '''
//! The columns of the inventory's Arrow batches.

/// The column of a file's path.
pub(super) const PATH: &str = "path";
'''

[[scenarios]]
id = 'two-packages-each-their-own'
scenario = 'Two languages, each a package of its own, declare the same standard: neither may name the other.'
given.include = ['**']
given.files.'css/Cargo.toml' = '''
[package]
name = "css"
version = "0.1.0"
edition = "2024"
'''
given.files.'css/src/domain/nodes/constants.rs' = '''
