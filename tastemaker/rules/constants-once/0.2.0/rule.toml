[[scenarios]]
id = 'sibling-adapters-of-one-port'
scenario = "The vue and svelte adapters of the embedded port each declare the script tag they scan for: neither may name the other's constants, so neither is reported; the same text declared again in the port's domain is reported at all three."
given.files.'src/outbound/embedded/adapters/vue/constants.rs' = '''
//! The text the vue adapter reads with.

/// What opens a script tag.
pub(super) const OPEN: &str = "<script";
'''
given.files.'src/outbound/embedded/adapters/svelte/constants.rs' = '''
//! The text the svelte adapter reads with.

/// What opens a script tag.
pub(super) const OPEN: &str = "<script";
'''

[[scenarios]]
id = 'sibling-adapters-and-the-domain'
scenario = "The same script tag declared in two sibling adapters and again in a domain file: the domain's is repeated by an adapter, so each of the three is reported."
given.files.'src/outbound/embedded/adapters/vue/constants.rs' = '''
//! The text the vue adapter reads with.

/// What opens a script tag.
pub(super) const OPEN: &str = "<script";
'''
given.files.'src/outbound/embedded/adapters/svelte/constants.rs' = '''
//! The text the svelte adapter reads with.

/// What opens a script tag.
pub(super) const OPEN: &str = "<script";
'''
given.files.'src/domain/markup/constants.rs' = '''
//! The names of the markup concept.

/// What opens a script tag.
pub const OPEN: &str = "<script";
'''
then.findings = [
  { path = 'src/outbound/embedded/adapters/vue/constants.rs', line = 4 },
  { path = 'src/outbound/embedded/adapters/svelte/constants.rs', line = 4 },
  { path = 'src/domain/markup/constants.rs', line = 4 },
