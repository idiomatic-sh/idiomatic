description = "An `errors.rs` declares exactly one `enum`, named `<Name>Error`, and no other type."
why = "A part's failures are one enum named for the part that produces them: `GreetError` in a use case, `PoliteError` in a concept, an adapter's `NamesMemoryError`, so a caller finds the error type of a part by its name and the file has no second concept in it. A second enum, a struct, a union, a type alias or a trait in `errors.rs` is another thing the part owns: a wire shape belongs in `schemas.rs`, a value in `types.rs`. RyoQL cannot compare a PascalCase name with a snake_case directory, so the stem of the name is pinned by the part spec's templates, which write the declaration named from the directory; this rule gives that declaration its role and its suffix. Read as written: in each file the entry selects, the `enum`, `struct`, `union`, `type` and `trait` items at the top level of the file; impl blocks, functions and constants are allowed beside the enum, and a type generated by a macro is not seen."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let top-items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from top-edges as l join tree-nodes as r on l."child" = r."id";
let enums = select * from top-items where kind = "enum";
let others-all = select * from top-items where glob_any(kind, "{struct,union,type-alias,trait}");
let e-name-nodes-all = select * from tree-nodes where kind = "name";
let e-kids = select l."id" as "id", r."child" as "child" from enums as l join "syntax-child" as r on l."id" = r."parent";
let e-name-nodes = select l."id" as "id", r."id" as "name-node" from e-kids as l join e-name-nodes-all as r on l."child" = r."id";
let e-name-tokens = select l."id" as "id", r."child" as "token" from e-name-nodes as l join "syntax-child" as r on l."name-node" = r."parent";
let e-name-texts = select l."id" as "id", r."text" as "name" from e-name-tokens as l join tree-tokens as r on l."token" = r."id";
let enum-rows = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."name" as "name" from enums as l join e-name-texts as r on l."id" = r."id";
let o-name-nodes-all = select * from tree-nodes where kind = "name";
let o-kids = select l."id" as "id", r."child" as "child" from others-all as l join "syntax-child" as r on l."id" = r."parent";
let o-name-nodes = select l."id" as "id", r."id" as "name-node" from o-kids as l join o-name-nodes-all as r on l."child" = r."id";
let o-name-tokens = select l."id" as "id", r."child" as "token" from o-name-nodes as l join "syntax-child" as r on l."name-node" = r."parent";
let o-name-texts = select l."id" as "id", r."text" as "name" from o-name-tokens as l join tree-tokens as r on l."token" = r."id";
let other-rows = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."name" as "name" from others-all as l join o-name-texts as r on l."id" = r."id";
let enum-paths = project(from=enums, columns=["file"]);
let absent = antijoin(left=source-files, right=enum-paths, left-on=["file"], right-on=["file"]);
let absent-rows = project(from=absent, columns=["file", "span"]);
let absent-findings = extend(from=absent-rows, values={"name": "errors.rs", "problem": "declares no `enum`: the file holds the part's one error enum"});
let counts = group-count(from=enums, keys=["file"], count="n", distinct="id");
let plural = select * from counts where n > 1;
let plural-rows = select l."file" as "file", l."span" as "span", l."name" as "name" from enum-rows as l join plural as r on l."file" = r."file";
let plural-findings = extend(from=plural-rows, values={"problem": "is one of several enums in this file, which holds exactly one"});
let well-named = select * from enum-rows where glob_any(name, "*Error");
let misnamed = antijoin(left=enum-rows, right=well-named, left-on=["id"], right-on=["id"]);
let misnamed-rows = project(from=misnamed, columns=["file", "span", "name"]);
let misnamed-findings = extend(from=misnamed-rows, values={"problem": "is not named `<Name>Error`"});
let other-struct = select * from other-rows where kind = "struct";
let other-rows-struct = project(from=other-struct, columns=["file", "span", "name"]);
let other-findings-struct = extend(from=other-rows-struct, values={"problem": "is a struct, a second type in a file that holds only the error enum"});
let other-union = select * from other-rows where kind = "union";
let other-rows-union = project(from=other-union, columns=["file", "span", "name"]);
let other-findings-union = extend(from=other-rows-union, values={"problem": "is a union, a second type in a file that holds only the error enum"});
let other-type-alias = select * from other-rows where kind = "type-alias";
let other-rows-type-alias = project(from=other-type-alias, columns=["file", "span", "name"]);
let other-findings-type-alias = extend(from=other-rows-type-alias, values={"problem": "is a type alias, a second type in a file that holds only the error enum"});
let other-trait = select * from other-rows where kind = "trait";
let other-rows-trait = project(from=other-trait, columns=["file", "span", "name"]);
let other-findings-trait = extend(from=other-rows-trait, values={"problem": "is a trait, a second type in a file that holds only the error enum"});
let all-1 = union(left=absent-findings, right=plural-findings);
let all-2 = union(left=all-1, right=misnamed-findings);
let all-3 = union(left=all-2, right=other-findings-struct);
let all-4 = union(left=all-3, right=other-findings-union);
let all-5 = union(left=all-4, right=other-findings-type-alias);
let all-6 = union(left=all-5, right=other-findings-trait);
emit all-6 subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "`{name}` {problem}"
help = "Keep one `enum <Name>Error` in `errors.rs` and no other type: name the enum for its part (`<Dir>Error`, and `<Port><Dir>Error` for an adapter), fold a second enum's variants into it, and move a struct, union or alias to the part's `types.rs` (a wire shape to `schemas.rs`). An ignore is not legitimate here: a part has one error type."

[given]
include = ['**/errors.rs']

[[scenarios]]
id = 'part-error'
scenario = 'The one enum named for its part.'
given.files.'src/inbound/use_cases/greet/errors.rs' = '''
//! The `greet` use case's failures.

/// Why `greet` failed.
#[derive(Debug, thiserror::Error)]
pub enum GreetError {
    /// The name was empty.
    #[error("the name is empty")]
    EmptyName,
}
'''

[[scenarios]]
id = 'adapter-error'
scenario = "An adapter's error is named for its port and itself."
given.files.'src/names/adapters/memory/errors.rs' = '''
//! The `greet` use case's failures.

/// Why `greet` failed.
#[derive(Debug, thiserror::Error)]
pub enum NamesMemoryError {
    /// The name was empty.
    #[error("the name is empty")]
    EmptyName,
}
'''

[[scenarios]]
id = 'impl-beside-enum'
scenario = 'An impl block beside the enum is allowed.'
given.files.'src/inbound/use_cases/greet/errors.rs' = '''
//! The `greet` use case's failures.

/// Why `greet` failed.
#[derive(Debug, thiserror::Error)]
pub enum GreetError {
    /// The name was empty.
    #[error("the name is empty")]
    EmptyName,
}

impl GreetError {
    /// Whether to retry.
    pub fn retryable(&self) -> bool {
        false
    }
}
'''

[[scenarios]]
id = 'no-enum'
scenario = 'A file with no enum.'
given.files.'src/inbound/use_cases/greet/errors.rs' = '''
//! The `greet` use case's failures.
'''
then.findings = [
  { path = 'src/inbound/use_cases/greet/errors.rs', line = 1 },
]

[[scenarios]]
id = 'two-enums'
scenario = 'Two enums in one file.'
