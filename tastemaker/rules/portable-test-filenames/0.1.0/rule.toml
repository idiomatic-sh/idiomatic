description = "A test that writes files names none with a character Windows refuses in a file name, unless it runs only on Unix."
why = "Windows refuses `< > : \" | ? *` in a file name: a test that creates `star*.txt` or `what?.txt` fails there before the code under test runs, so the Windows gate fails on the test, not on the product. Read in a function that creates files (`fs::write`, `File::create`, `create_dir`, `create_dir_all`, `fs::copy`, `fs::rename`): a string literal written as one name or path (no space, no `{`, `(` or `=`) that holds `?`, `<`, `>` or `|`, or a `*` against a letter, digit or `_` (`star*.txt`; a glob's `*.rs` or `**/` is not a name). A literal that opens with `<` and closes with `>` is markup being written, not a name. A function decorated `#[cfg(unix)]` or `#[cfg(not(windows))]` runs only where those names are valid and is not reported. A literal held in a helper the function calls is not seen."

query = '''
let creating = select l."owner" as "owner" from "static-call" as l where glob_any(target, "{*fs::write,*fs::File::create,File::create,*fs::create_dir,*fs::create_dir_all,*fs::copy,*fs::rename}");
let named = select l."owner" as "owner", l."file" as "file", l."span" as "span", l."value" as "value" from "string-literal" as l where glob_any(value, "{*[?<>|]*,*[a-zA-Z0-9_][*]*,*[*][a-zA-Z0-9_]*}") and not glob_any(value, "*[ {(=]*") and not glob_any(value, "<*>");
let unix = select l."declaration" as "owner" from "decorates" as l where target = "cfg" and glob_any(arguments, "{*unix*,*not(windows)*}");
let written = select l."owner" as "owner", l."file" as "file", l."span" as "span", l."value" as "value" from named as l join creating as r on l."owner" = r."owner";
let found = antijoin(left=written, right=unix, left-on=["owner"], right-on=["owner"]);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{value}` is a file name Windows refuses"
help = "Name the file with characters every platform takes, or decorate the test `#[cfg(unix)]` when what it proves is a name only Unix allows (a name with `*` or `?` in it): the Windows gate then runs the rest of the suite."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'pattern-characters-written-as-names'
scenario = 'A test that writes `star*.txt` and `what?.txt` on every platform, as the init replay test did at 861e39f970, is reported at both names.'
given.files.'tests/init.rs' = '''
#[test]
fn init_writes_names_with_pattern_characters_as_the_names_themselves() {
    let scratch = tempfile::tempdir().expect("the scene directory");
    let root = scratch.path();
    for (path, text) in [
        ("star*.txt", "a file named with a star\n"),
        ("what?.txt", "a file named with a question mark\n"),
        ("data[1]/rows.txt", "a directory named with brackets\n"),
    ] {
        let file = root.join(path);
        std::fs::create_dir_all(file.parent().expect("a parent")).expect("the directory");
        std::fs::write(&file, text).expect("the file");
    }
}
'''
then.findings = [
  { path = 'tests/init.rs', line = 6 },
  { path = 'tests/init.rs', line = 7 },
]

[[scenarios]]
id = 'unix-only-names-and-globs'
scenario = 'The same names in a test decorated `#[cfg(unix)]`, as the replay test is at 5149cd075d, and a test that writes files beside the globs it checks are not reported.'
given.files.'tests/init.rs' = '''
#[cfg(unix)]
#[test]
fn init_writes_names_with_pattern_characters_as_the_names_themselves() {
    let scratch = tempfile::tempdir().expect("the scene directory");
    for (path, text) in [("star*.txt", "a star\n"), ("what?.txt", "a question mark\n")] {
        std::fs::write(scratch.path().join(path), text).expect("the file");
    }
}

#[test]
fn a_rule_reads_the_globbed_files() {
    let scratch = tempfile::tempdir().expect("the scene directory");
    std::fs::create_dir_all(scratch.path().join("src")).expect("the directory");
    std::fs::write(scratch.path().join("src/lib.rs"), "fn f() {}\n").expect("the file");
    let include = ["src/*.rs", "**/tests/**", "{name}"];
    assert_eq!(include.len(), 3, "{include:?}");
}
'''

[[scenarios]]
id = 'markup-written-to-a-file'
scenario = 'A test that writes markup (`<p>`) into a file with an ordinary name is not reported: the markup is what the file holds, not its name.'
given.files.'tests/page.rs' = '''
#[test]
fn a_page_is_written() {
    let scratch = tempfile::tempdir().expect("the scene directory");
    std::fs::write(scratch.path().join("page.html"), "<p>").expect("the file");
}
'''
