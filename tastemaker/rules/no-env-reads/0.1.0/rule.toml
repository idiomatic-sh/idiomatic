description = "No code reads an environment variable: no `std::env::{var,var_os,vars,vars_os}`, called, passed as a value or imported under any name, and no `option_env!`, including inside another macro's arguments, except a read of a variable one of the rule's exceptions names."
why = "Behavior changes through a command or a flag, never an environment variable, except the few conventions the rule names as its exceptions, each with why: a read written `std::env::var(\"PAGER\")` (or `var_os`, `env::var`), whose variable is a string literal one exception admits, is not a finding. `env!` (a compile-time Cargo constant) and `std::env::args` are not reads. Paths are matched as written: a read through a renamed `std` (`use std as s; s::env::var`) is not seen, and inside a macro's arguments `var`/`vars` count when the same token tree names `env`. No attribute reaches the rule; a Tastemaker in-source ignore with its reason is the only way to silence one finding."

query = '''
param exceptions: set<string>;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let references = project(from="reference", columns=["file", "span", "target"]);
let imports = project(from="static-import", columns=["file", "span", "target"]);
let mentions = union(left=references, right=imports);
let path-reads = select * from mentions where glob_any(target, "{std::env::var,std::env::var_os,std::env::vars,std::env::vars_os,env::var,env::var_os,env::vars,env::vars_os,std::env::[*],option_env,std::option_env,core::option_env}");
let idents = select * from tree-tokens where glob_any(text, "{option_env,var,vars,var_os,vars_os,env}");
let named-idents = select * from idents where kind = "ident";
let ident-parents = select r."parent" as "parent", l."file" as "file", l."span" as "span", l."text" as "target" from named-idents as l join "syntax-child" as r on l."id" = r."child";
let option-env-tokens = select * from ident-parents where target = "option_env";
let option-env = project(from=option-env-tokens, columns=["file", "span", "target"]);
let mentioned = project(from="mention", columns=["occurrence", "file", "span", "target"]);
let tree-idents = select r."parent" as "parent", l."file" as "file", l."span" as "span", l."target" as "target" from mentioned as l join "syntax-child" as r on l."occurrence" = r."child";
let tree-os-tokens = select * from tree-idents where glob_any(target, "{var_os,vars_os}");
let tree-os = project(from=tree-os-tokens, columns=["file", "span", "target"]);
let tree-vars = select * from tree-idents where glob_any(target, "{var,vars}");
let tree-env-tokens = select * from tree-idents where target = "env";
let tree-env = project(from=tree-env-tokens, columns=["parent"]);
let tree-var-env = select l."file" as "file", l."span" as "span", l."target" as "target" from tree-vars as l join tree-env as r on l."parent" = r."parent";
let macro-reads = union(left=tree-os, right=tree-var-env);
let token-reads = union(left=option-env, right=macro-reads);
let literals = project(from="string-literal", columns=["span", "value"]);
let admitted-literals = select * from literals where value in $exceptions;
let literal-nodes = select r."id" as "literal" from admitted-literals as l join tree-nodes as r on l."span" = r."span";
let literal-parents = select r."parent" as "list" from literal-nodes as l join "syntax-child" as r on l."literal" = r."child";
let arg-lists = select * from tree-nodes where kind = "arg-list";
let admitted-lists = select l."list" as "list" from literal-parents as l join arg-lists as r on l."list" = r."id";
let list-calls = select r."parent" as "call" from admitted-lists as l join "syntax-child" as r on l."list" = r."child";
let call-children = select r."child" as "callee" from list-calls as l join "syntax-child" as r on l."call" = r."parent";
let path-exprs = select * from tree-nodes where kind = "path-expr";
let callee-exprs = select l."callee" as "callee" from call-children as l join path-exprs as r on l."callee" = r."id";
let callee-children = select r."child" as "node" from callee-exprs as l join "syntax-child" as r on l."callee" = r."parent";
let paths = select * from tree-nodes where kind = "path";
let admitted-paths = select r."span" as "span" from callee-children as l join paths as r on l."node" = r."id";
let named-reads = antijoin(left=path-reads, right=admitted-paths, left-on=["span"], right-on=["span"]);
let reads = union(left=named-reads, right=token-reads);
emit reads subject "file" key("span");
'''

[exceptions.pager]
admits = ["PAGER"]
why = "clig.dev, Environment variables: `PAGER`, \"if you want to automatically page output\". A command line pages a long answer on a terminal through the pager its user names, as git, gh and jj do."

[diagnostic]
primary = "span"
message = "`{target}` reads an environment variable"
help = "Take the value as a command-line flag or argument (a clap `#[arg]` on the command's arguments) or a key of the tool's configuration file, and pass it down from the command; never read the environment. Ignore only a read an outside convention requires, naming it: `// ignore: idiomatic.arch/no-env-reads - <the convention that requires this variable>` on its own line above the read. A variable a convention every command line shares requires (clig.dev's `PAGER`) is one of the rule's own exceptions instead: `tm explain rule/no-env-reads` lists them, and a read of one, written with the name as a string literal, is not a finding."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'composition-root-calls-std-env-var-under'
scenario = 'A composition root calls std::env::var under a module-wide allow of disallowed methods.'
given.files.'src/lib.rs' = '''
#![allow(clippy::disallowed_methods)]

pub fn mode() -> Result<String, std::env::VarError> {
    std::env::var("PRODUCT_MODE")
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'vars-as-value'
scenario = 'Std::env::vars passed as a value.'
given.files.'src/lib.rs' = '''
pub fn values() -> usize {
    let read = std::env::vars;
    read().count()
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 2 },
]

[[scenarios]]
id = 'renamed-import'
scenario = 'Std::env::var_os imported under another name.'
given.files.'src/main.rs' = '''
use std::env::var_os as lookup;

fn main() {
    let _ = lookup("PRODUCT_MODE");
}
'''
then.findings = [
  { path = 'src/main.rs', line = 1 },
]

[[scenarios]]
id = 'vars-call'
scenario = 'Std::env::vars called: it is reported.'
given.files.'src/main.rs' = '''
fn main() {
    let _ = std::env::vars().count();
}
'''
then.findings = [
  { path = 'src/main.rs', line = 2 },
]

[[scenarios]]
id = 'vars-os'
scenario = 'Std::env::vars_os called: it is reported.'
given.files.'src/main.rs' = '''
fn main() {
    let _ = std::env::vars_os().count();
}
'''
then.findings = [
  { path = 'src/main.rs', line = 2 },
]

[[scenarios]]
id = 'option-env'
scenario = 'Option_env! read: it is reported.'
given.files.'src/main.rs' = '''
fn main() {
    let _ = option_env!("PRODUCT_MODE");
}
'''
then.findings = [
  { path = 'src/main.rs', line = 2 },
]

[[scenarios]]
id = 'option-env-in-macro'
scenario = "Option_env! inside another macro's arguments."
given.files.'src/main.rs' = '''
fn main() {
    let _ = format!("{:?}", option_env!("PRODUCT_MODE"));
}
'''
then.findings = [
  { path = 'src/main.rs', line = 2 },
]

[[scenarios]]
id = 'var-in-macro'
scenario = "Std::env::var inside another macro's arguments."
given.files.'src/main.rs' = '''
fn main() {
    println!("{:?}", std::env::var("PRODUCT_MODE"));
}
'''
then.findings = [
  { path = 'src/main.rs', line = 2 },
  { path = 'src/main.rs', line = 2 },
]

[[scenarios]]
id = 'vars-os-in-macro'
scenario = 'Std::env::vars_os mentioned in the tokens of a macro that does not read them as expressions.'
given.files.'src/main.rs' = '''
macro_rules! show {
    ($($tokens:tt)*) => {};
}

fn main() {
    show!(std::env::vars_os);
}
'''
then.findings = [
  { path = 'src/main.rs', line = 6 },
]

[[scenarios]]
id = 'module-import'
scenario = 'A read through an imported std::env module.'
given.files.'src/lib.rs' = '''
use std::env;

pub fn mode() -> Option<std::ffi::OsString> {
    env::var_os("PRODUCT_MODE")
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]

[[scenarios]]
id = 'allow-attempt'
scenario = 'An allow attribute does not reach the rule.'
given.files.'src/lib.rs' = '''
#[allow(no_env_reads)]
pub fn mode() -> Option<std::ffi::OsString> {
    std::env::var_os("PRODUCT_MODE")
}

pub mod exempt {
    #![allow(no_env_reads)]

    pub fn mode() -> Option<std::ffi::OsString> {
        std::env::var_os("PRODUCT_MODE")
    }
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 3 },
  { path = 'src/lib.rs', line = 10 },
]

[[scenarios]]
id = 'args-and-env'
scenario = 'A flag and a compile-time Cargo constant are not reads.'
given.files.'src/main.rs' = '''
fn main() {
    let _ = std::env::args().any(|argument| argument == "--verbose");
    let _ = env!("CARGO_MANIFEST_DIR");
    let arguments: Vec<String> = std::env::args().collect();
    let _ = arguments.iter().any(|argument| argument == "--verbose");
}
'''

[[scenarios]]
id = 'method-named-var'
scenario = "A method named var or var_os on a value is not std's read."
given.files.'src/lib.rs' = '''
pub struct Settings;

impl Settings {
    pub fn var(&self, _: &str) -> u8 {
        0
    }
    pub fn var_os(&self) -> u8 {
        0
    }
}

pub fn read(env: &Settings) -> u8 {
    env.var("MODE") + env.var_os()
}
'''

[[scenarios]]
id = 'read-variable-rule-s-pager-exception-admits'
scenario = "A read of a variable the rule's pager exception admits, its name written at the read."
given.files.'src/lib.rs' = '''
/// The pager its user names, read through the rule's `pager` exception.
pub fn pager() -> Option<std::ffi::OsString> {
    std::env::var_os("PAGER")
}

/// The same read through an imported `std::env`.
pub fn named() -> Result<String, std::env::VarError> {
    use std::env;
    env::var("PAGER")
}
'''

[[scenarios]]
id = 'pager-by-a-binding'
scenario = 'The admitted variable read through a binding, so its name is not at the read.'
given.files.'src/lib.rs' = '''
/// The admitted name, but not written at the read: the rule cannot see which variable it is.
pub fn pager() -> Option<std::ffi::OsString> {
    let name = "PAGER";
    std::env::var_os(name)
}
'''
then.findings = [
  { path = 'src/lib.rs', line = 4 },
]
