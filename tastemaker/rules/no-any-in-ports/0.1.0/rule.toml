description = "A port or worker interface names no `Any`: no `Box<dyn Any>` handed across it and no `into_any` that lets the caller downcast to the adapter's own type."
why = "An interface that hands back `Box<dyn Any>` lets the code on the other side downcast to the adapter's concrete type, so the adapter can never be swapped without the caller changing: the port no longer hides the implementation. Typed handles (a finish method that takes what it needs, typed) keep the boundary. Read as written in the port's interface files: the identifier `Any` and a method named `into_any`."

query = '''
let tokens = select l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."kind" = "ident";
let any = select * from tokens where text = "Any" or text = "into_any";
emit any subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "`{text}` crosses a port: the caller can downcast to the adapter's own type"
help = "Give the interface typed methods instead: the worker's finish takes typed handles, or the adapter keeps what it made and the port answers only in the core's types. An ignore is never the fix."

[given]
include = ['src/outbound/*/interface.rs', 'src/outbound/*/types.rs']

[[scenarios]]
id = 'a-worker-handed-back-as-any'
scenario = 'A worker interface that hands itself back as `Box<dyn Any>`, as Tastemaker`s inventory worker did, is reported at the method and at `Any`.'
given.files.'src/outbound/inventory/interface.rs' = '''
//! What the `inventory` port asks of the outside.

/// What a worker of the inventory does.
pub trait InventoryWorker: Send {
    /// Keeps the sources.
    fn keep(&mut self, sources: Vec<Source>) -> Result<(), InventoryError>;
    /// The worker, to be finished.
    fn into_any(self: Box<Self>) -> Box<dyn std::any::Any + Send>;
}
'''
then.findings = [
  { path = 'src/outbound/inventory/interface.rs', line = 8 },
  { path = 'src/outbound/inventory/interface.rs', line = 8 },
]

[[scenarios]]
id = 'an-any-held-in-a-port-type'
scenario = 'A handle in the port`s `types.rs` that wraps `Arc<dyn Any>` for the adapter to downcast is reported at `Any`: the port no longer hides the adapter.'
given.files.'src/outbound/lint_store/types.rs' = '''
//! The types of the port.

/// What a run read, as the adapter keeps it.
pub struct StoreGeneration(pub std::sync::Arc<dyn std::any::Any + Send + Sync>);
'''
then.findings = [
  { path = 'src/outbound/lint_store/types.rs', line = 4 },
]

[[scenarios]]
id = 'a-typed-worker'
scenario = 'A worker whose methods speak typed values, as ryo`s rows port does, is not reported.'
given.files.'src/outbound/rows/interface.rs' = '''
//! What the `rows` port asks of the outside.

/// What every `rows` adapter implements.
pub trait RowsPort: Send + Sync {
    /// Starts the answer with its columns.
    fn begin(&self, columns: &[Heading]);
    /// One row of the answer.
    fn row(&self, cells: Cells<'_>);
}
'''
