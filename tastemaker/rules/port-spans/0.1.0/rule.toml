}

impl<S: StorageInterface> crate::greeting::interface::GreetingInterface for GreetingStoredAdapter<S> {
    #[tracing::instrument(skip_all, level = "info")]
    fn greet(&self) -> String {
        self.storage.load()
    }

    #[tracing::instrument(level = "info", skip_all)]
    fn count(&self) -> usize {
        self.storage.load().len()
    }
}
'''
