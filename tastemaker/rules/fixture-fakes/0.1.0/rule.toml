description = "A hex's `fixtures.rs`, and each fixture split out of it under `fixtures/`, implement exactly its own hex's ports (an adapter hex's one port, or a use-case hex's use cases' ports): every one of them, and no other hex's."
why = "A port's fake is written once, beside the port, and every caller's test reaches it through the owning crate's `fixtures` feature. A fake of another hex's port in this hex's `fixtures.rs` is a second copy of it, and a port with no fake cannot be replaced, so a bench or a test that runs a command with one part real and the rest faked cannot be built. Several fakes of one port, such as a working one and a failing one, are allowed. A port is recognised by a trait name ending in `Interface`, matched by name to a trait declared in the hex's `interface.rs` or, in a use-case hex, in one of its `use_cases/<use_case>/interface.rs`."

query = '''
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let impls = select * from tree-nodes where kind = "impl";
let module-impls-edges = select l."id" as "id", r."parent" as "module-impls-p", l."file" as "file", l."span" as "span" from impls as l join "syntax-child" as r on l."id" = r."child";
let module-impls-kinds = select * from tree-nodes where glob_any(kind, "{source-file,item-list}");
let module-impls = select l."id" as "id", l."file" as "file", l."span" as "span" from module-impls-edges as l join module-impls-kinds as r on l."module-impls-p" = r."id";
let impl-children = select r."child" as "child", l."id" as "id", r."ordinal" as "ordinal", l."file" as "file", l."span" as "span" from module-impls as l join "syntax-child" as r on l."id" = r."parent";
let path-types = select * from tree-nodes where kind = "path-type";
let impl-types = select l."id" as "id", l."ordinal" as "ordinal", l."file" as "file", l."span" as "span", l."child" as "type" from impl-children as l join path-types as r on l."child" = r."id";
let for-tokens = select * from tree-tokens where kind = "for-kw";
let impl-for = select l."ordinal" as "for", l."id" as "id" from impl-children as l join for-tokens as r on l."child" = r."id";
let impl-types-for = select r."for" as "for", l."id" as "id", l."ordinal" as "ordinal", l."file" as "file", l."span" as "span", l."type" as "type" from impl-types as l join impl-for as r on l."id" = r."id";
let trait-types = select * from impl-types-for where ordinal < for;
let trait-names-path-edges = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "trait-names-path-c" from trait-types as l join "syntax-child" as r on l."type" = r."parent";
let trait-names-path-kinds = select * from tree-nodes where kind = "path";
let trait-names-path = select l."id" as "id", l."file" as "file", l."span" as "span", r."id" as "trait-names-pt" from trait-names-path-edges as l join trait-names-path-kinds as r on l."trait-names-path-c" = r."id";
let trait-names-seg-edges = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "trait-names-seg-c" from trait-names-path as l join "syntax-child" as r on l."trait-names-pt" = r."parent";
let trait-names-seg-kinds = select * from tree-nodes where kind = "path-segment";
let trait-names-seg = select l."id" as "id", l."file" as "file", l."span" as "span", r."id" as "trait-names-sg" from trait-names-seg-edges as l join trait-names-seg-kinds as r on l."trait-names-seg-c" = r."id";
let trait-names-ref-edges = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "trait-names-ref-c" from trait-names-seg as l join "syntax-child" as r on l."trait-names-sg" = r."parent";
let trait-names-ref-kinds = select * from tree-nodes where kind = "name-ref";
let trait-names-ref = select l."id" as "id", l."file" as "file", l."span" as "span", r."id" as "trait-names-nr" from trait-names-ref-edges as l join trait-names-ref-kinds as r on l."trait-names-ref-c" = r."id";
let trait-names-edges = select l."id" as "id", l."file" as "file", l."span" as "span", r."child" as "trait-names-c" from trait-names-ref as l join "syntax-child" as r on l."trait-names-nr" = r."parent";
let trait-names = select l."id" as "id", l."file" as "file", l."span" as "span", r."text" as "trait" from trait-names-edges as l join tree-tokens as r on l."trait-names-c" = r."id";
let interface-impls = select * from trait-names where glob_any(trait, "*Interface");
let whole-fake-rows = capture(from=interface-impls, path="file", pattern="{*hex}/fixtures.rs", captures=["hex"]);
let module-fake-rows-captured = capture(from=interface-impls, path="file", pattern="{*hex}/fixtures/{fixture}.rs", captures=["hex", "fixture"]);
let module-fake-rows = project(from=module-fake-rows-captured, columns=["id", "file", "span", "trait", "hex"]);
let split-fake-rows-captured = capture(from=interface-impls, path="file", pattern="{*hex}/fixtures/{fixture}/fixture.rs", captures=["hex", "fixture"]);
let split-fake-rows = project(from=split-fake-rows-captured, columns=["id", "file", "span", "trait", "hex"]);
let kept-fake-rows = union(left=whole-fake-rows, right=module-fake-rows);
let fake-rows = union(left=kept-fake-rows, right=split-fake-rows);
let traits = select * from tree-nodes where kind = "trait";
let trait-named-name-edges = select l."id" as "id", r."child" as "trait-named-name-c" from traits as l join "syntax-child" as r on l."id" = r."parent";
let trait-named-name-kinds = select * from tree-nodes where kind = "name";
let trait-named-name = select l."id" as "id", r."id" as "trait-named-nm" from trait-named-name-edges as l join trait-named-name-kinds as r on l."trait-named-name-c" = r."id";
let trait-named-edges = select l."id" as "id", r."child" as "trait-named-c" from trait-named-name as l join "syntax-child" as r on l."trait-named-nm" = r."parent";
let trait-named = select l."id" as "id", r."text" as "trait" from trait-named-edges as l join tree-tokens as r on l."trait-named-c" = r."id";
let trait-named-paths = select r."file" as "file", r."span" as "span", l."trait" as "trait" from trait-named as l join traits as r on l."id" = r."id";
let trait-named-files = project(from=trait-named-paths, columns=["file", "span", "trait"]);
let interface-traits = capture(from=trait-named-files, path="file", pattern="{*hex}/interface.rs", captures=["hex"]);
let use-case-traits-captured = capture(from=trait-named-files, path="file", pattern="{*hex}/use_cases/{use_case}/interface.rs", captures=["hex", "use_case"]);
let use-case-traits = project(from=use-case-traits-captured, columns=["file", "span", "trait", "hex"]);
let hex-traits = antijoin(left=interface-traits, right=use-case-traits, left-on=["file", "trait"], right-on=["file", "trait"]);
let own-traits = union(left=hex-traits, right=use-case-traits);
let foreign = antijoin(left=fake-rows, right=own-traits, left-on=["hex", "trait"], right-on=["hex", "trait"]);
let foreign-rows = project(from=foreign, columns=["file", "span", "trait"]);
let foreign-fakes = extend(from=foreign-rows, values={"problem": "is another hex's port: its fake lives in that hex's fixtures"});
let own-ports = select * from own-traits where glob_any(trait, "*Interface");
let unfaked = antijoin(left=own-ports, right=fake-rows, left-on=["hex", "trait"], right-on=["hex", "trait"]);
let unfaked-rows = project(from=unfaked, columns=["file", "span", "trait"]);
let missing-fakes = extend(from=unfaked-rows, values={"problem": "is this hex's port and has no fake in its fixtures"});
let findings = union(left=foreign-fakes, right=missing-fakes);
emit findings subject "file" key("span", "trait");
'''

[diagnostic]
primary = "span"
message = "`{trait}` {problem}"
help = "A port's fake lives in the fixtures of the hex that declares it (fixtures.rs, or a split fixture): write the missing one there, move a foreign one there, and reach it from other crates through the owning crate's `fixtures` feature from `[dev-dependencies]`."

[given]
include = ['**/interface.rs', '**/fixtures.rs']

[[scenarios]]
id = 'own-fake'
scenario = "A fake of the hex's own port."
given.files.'src/greeting/fixtures.rs' = '''
use super::interface::GreetingInterface;

pub struct GreetingFake;

impl GreetingInterface for GreetingFake {
    fn greet(&self) -> String {
        String::new()
    }
}
'''
given.files.'src/greeting/interface.rs' = '''
pub trait GreetingInterface {
    fn greet(&self) -> String;
}
'''
given.files.'src/greeting/types.rs' = '''
pub struct Greeting(pub String);
'''

[[scenarios]]
id = 'foreign-fake'
scenario = "A fake of another hex's port, which itself has no fake."
given.files.'src/greeting/fixtures.rs' = '''
use super::interface::GreetingInterface;

pub struct GreetingFake;

impl GreetingInterface for GreetingFake {
    fn greet(&self) -> String {
        String::new()
    }
}

pub struct StorageFake;

impl crate::storage::interface::StorageInterface for StorageFake {
    fn load(&self) -> String {
        String::new()
    }
}
'''
given.files.'src/greeting/interface.rs' = '''
pub trait GreetingInterface {
    fn greet(&self) -> String;
}
'''
given.files.'src/storage/interface.rs' = '''
pub trait StorageInterface {
    fn load(&self) -> String;
}
'''
then.findings = [
  { path = 'src/greeting/fixtures.rs', line = 13 },
  { path = 'src/storage/interface.rs', line = 1 },
]

[[scenarios]]
id = 'use-case-fake'
scenario = "A fake of the hex's use cases' ports."
given.files.'src/greeting/fixtures.rs' = '''
use super::use_cases::greet::interface::GreetingGreetInterface;

pub struct GreetingFake;

impl GreetingGreetInterface for GreetingFake {
    fn greet(&self) -> String {
        String::new()
    }
}
'''
given.files.'src/greeting/use_cases/greet/interface.rs' = '''
pub trait GreetingGreetInterface {
    fn greet(&self) -> String;
}
'''

[[scenarios]]
id = 'split-own-fake'
scenario = "A fake of the hex's own port in a fixture split out of fixtures.rs."
given.include = ['**/interface.rs', '**/fixtures.rs', '**/fixtures/*.rs', '**/fixtures/*/fixture.rs']
given.files.'src/greeting/fixtures.rs' = '''
pub mod provider;
'''
given.files.'src/greeting/fixtures/provider.rs' = '''
pub mod fixture;
'''
given.files.'src/greeting/fixtures/provider/fixture.rs' = '''
use crate::greeting::interface::GreetingInterface;

pub struct GreetingFake;

impl GreetingInterface for GreetingFake {
    fn greet(&self) -> String {
        String::new()
    }
}
'''
given.files.'src/greeting/interface.rs' = '''
pub trait GreetingInterface {
    fn greet(&self) -> String;
}
'''

[[scenarios]]
id = 'split-foreign-fake'
scenario = "A fake of another hex's port in a split fixture, and one in a fixture's module file."
given.include = ['**/interface.rs', '**/fixtures.rs', '**/fixtures/*.rs', '**/fixtures/*/fixture.rs']
given.files.'src/greeting/fixtures.rs' = '''
pub mod provider;
'''
given.files.'src/greeting/fixtures/provider.rs' = '''
pub mod fixture;
'''
given.files.'src/greeting/fixtures/provider/fixture.rs' = '''
use crate::greeting::interface::GreetingInterface;

pub struct GreetingFake;

impl GreetingInterface for GreetingFake {
    fn greet(&self) -> String {
        String::new()
    }
}

pub struct StorageFake;

impl crate::storage::interface::StorageInterface for StorageFake {
    fn load(&self) -> String {
        String::new()
    }
}
'''
given.files.'src/greeting/fixtures/storage.rs' = '''
pub struct LoadedStorage;

impl crate::storage::interface::StorageInterface for LoadedStorage {
    fn load(&self) -> String {
        String::from("loaded")
    }
}
'''
given.files.'src/greeting/interface.rs' = '''
pub trait GreetingInterface {
    fn greet(&self) -> String;
}
'''
given.files.'src/storage/interface.rs' = '''
pub trait StorageInterface {
    fn load(&self) -> String;
}
'''
then.findings = [
  { path = 'src/greeting/fixtures/provider/fixture.rs', line = 13 },
  { path = 'src/greeting/fixtures/storage.rs', line = 3 },
  { path = 'src/storage/interface.rs', line = 1 },
]

[[scenarios]]
id = 'missing-fake'
scenario = "A port with no fake, and a use case whose port has none while its sibling's has one."
given.include = ['**/interface.rs', '**/fixtures.rs', '**/fixtures/*.rs', '**/fixtures/*/fixture.rs']
given.files.'src/greeting/fixtures.rs' = '''
/// A greeting the tests share.
pub const GREETING: &str = "hello";
'''
given.files.'src/greeting/interface.rs' = '''
pub trait GreetingInterface {
    fn greet(&self) -> String;
}
'''
given.files.'src/ordering/fixtures.rs' = '''
use super::use_cases::place::interface::OrderingPlaceInterface;

pub struct OrderingFake;

impl OrderingPlaceInterface for OrderingFake {
    fn place(&self) -> u32 {
        1
    }
}
'''
given.files.'src/ordering/use_cases/cancel/interface.rs' = '''
pub trait OrderingCancelInterface {
    fn cancel(&self) -> bool;
}
'''
given.files.'src/ordering/use_cases/place/interface.rs' = '''
pub trait OrderingPlaceInterface {
    fn place(&self) -> u32;
}
'''
then.findings = [
  { path = 'src/greeting/interface.rs', line = 1 },
  { path = 'src/ordering/use_cases/cancel/interface.rs', line = 1 },
]

[[scenarios]]
id = 'non-port-trait'
scenario = 'A trait in the port file that is not a port owes no fake.'
given.files.'src/clock/fixtures.rs' = '''
