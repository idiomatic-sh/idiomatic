description = "Production code does not build allocation-size estimators or heap-retention accounting from container capacity and allocator footprint queries."
why = "If reaching for custom memory management seems necessary, the ownership or lifetime design needs correction. Computing retained heap bytes by multiplying capacity by a type's layout, summing allocator footprints, or saving those estimates in a reclamation ledger adds another memory-management system beside Rust. The observed regression spent its CPU walking reusable scratch and estimating its bytes. This rule connects sizing calls through the syntax of one arithmetic expression or aggregate; it does not depend on a helper, field, or module being named bytes, budget, retire, or ledger. It catches direct and checked/saturating capacity-times-layout expressions and arithmetic or sum/fold aggregation of memory_usage calls, including nested closures. Standard size_of aliases imported from core::mem or std::mem are followed by their import binding. Ordinary allocation/reserve, capacity bounds, scoped RAII/drop, and length-based wire-format planning are allowed. Tests, fixtures, and benches can measure memory and are outside this production policy. The derived ledger (`file_dag/derived/ledger.rs` and `ledger/`) is the one production owner of retained-byte accounting and is outside this rule; accounting written anywhere else still fails. This is not typed interprocedural taint analysis: estimates hidden across arbitrary helpers, custom allocator APIs, unresolved aliases and macro expansions are not proven. No exception or baseline is supplied."

query = '''
let tree = select id, kind, text, file, span from "syntax-tree" where not glob_any(file, "{benches/**,**/benches/**,tests/**,**/tests/**,**/*_test.rs,**/fixtures/**,**/fixtures.rs,**/file_dag/derived/ledger.rs,**/file_dag/derived/ledger/**}");
let methods = select * from tree where kind = "method-call-expr";
let name-edges = select * from "syntax-child" where field = "name-ref";
let ref-tokens = select l.parent as owner, r.child as token from name-edges as l join "syntax-child" as r on l.child = r.parent;
let names = select l.owner as owner, r.text as name, r.file as file from ref-tokens as l join tree as r on l.token = r.id where r.kind = "ident";
let method-names = select l.id as id, r.name as name from methods as l join names as r on l.id = r.owner;
let capacity = select id from method-names where name = "capacity";
let memory = select id from method-names where name = "memory_usage";
let arithmetic-methods = select id from method-names where glob_any(name, "{saturating_mul,checked_mul,wrapping_mul,saturating_add,checked_add,wrapping_add,saturating_sub,checked_sub,wrapping_sub}");
let aggregate-methods = select id from method-names where glob_any(name, "{sum,fold,try_fold}");
let binaries = select * from tree where kind = "bin-expr";
let binary-tokens = select l.id as id, r.child as token from binaries as l join "syntax-child" as r on l.id = r.parent;
let arithmetic-binaries = select l.id as id from binary-tokens as l join tree as r on l.token = r.id where r.text = "*" or r.text = "+" or r.text = "-" or r.text = "+=" or r.text = "-=" or r.text = "*=";
let arithmetic = union(left=arithmetic-methods, right=arithmetic-binaries);
let calls = select * from tree where kind = "call-expr";
let children = select l.id as call, r.child as child from calls as l join "syntax-child" as r on l.id = r.parent;
let paths = select l.call as id, l.child as path from children as l join tree as r on l.child = r.id where r.kind = "path-expr";
let path-starts = select path as id, id as call from paths;
let path-tokens = axis(from=path-starts, relation="syntax-child", direction=descendant, domain=tree);
let call-names = select l.call as id, r.text as name, r.file as file from path-tokens as l join tree as r on l.related = r.id where r.kind = "ident";
let direct-size = select id from call-names where name = "size_of" or name = "size_of_val";
let size-imports = select binding as name, file from "static-import" where glob_any(target, "{std,core}::mem::{size_of,size_of_val}");
let alias-size = select l.id as id from call-names as l join size-imports as r on l.name = r.name and l.file = r.file;
let sizes = union(left=direct-size, right=alias-size);
let capacities-in = axis(from=arithmetic, relation="syntax-child", direction=descendant, domain=capacity);
let sizes-in = axis(from=arithmetic, relation="syntax-child", direction=descendant, domain=sizes);
let calculated = select l.id as id from capacities-in as l join sizes-in as r on l.id = r.id;
let aggregates = union(left=arithmetic, right=aggregate-methods);
let footprints-in = axis(from=aggregates, relation="syntax-child", direction=descendant, domain=memory);
let footprint-sums = select id from footprints-in;
let estimates = union(left=calculated, right=footprint-sums);
let nested = axis(from=estimates, relation="syntax-child", direction=descendant, domain=estimates);
let outer-estimates = select id from nested;
let smallest = antijoin(left=estimates, right=outer-estimates, left-on=["id"], right-on=["id"]);
let found = select r.file as file, r.span as span from smallest as l join tree as r on l.id = r.id;
emit found subject file key(span);
'''

[diagnostic]
primary = "span"
message = "Custom memory management indicates an ownership or lifetime design problem."
help = "Restructure ownership so Rust releases temporary data at the appropriate scope; do not add heap-accounting or reclamation machinery to compensate. This expression estimates retained allocation bytes. Use scoped owners for temporary work, keep genuinely shared state with its owning operation, and use ordinary bounded buffers without a second heap-accounting system."

[given]
include = ["**/*.rs"]
files.'Cargo.toml' = '''
[package]
name = "heap_policy_fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = "actual-vector-byte-estimator"
scenario = "The real scratch helper multiplies retained vector capacity by its element layout."
given.files.'src/lib.rs' = '''
fn vector_bytes<T>(values: &Vec<T>) -> usize {
    values.capacity().saturating_mul(size_of::<T>())
}
'''
then.findings = [{ path = "src/lib.rs", line = 2 }]

[[scenarios]]
id = "renamed-helper-and-reversed-operands"
scenario = "Renaming a helper does not hide the same allocation accounting."
given.files.'src/lib.rs' = '''
fn describe<T>(items: &Vec<T>) -> usize {
    std::mem::size_of::<T>() * items.capacity()
}
'''
then.findings = [{ path = "src/lib.rs", line = 2 }]

[[scenarios]]
id = "import-alias"
scenario = "An imported layout function keeps its meaning under an alias."
given.files.'src/lib.rs' = '''
use core::mem::size_of as layout;
fn retained<T>(items: &Vec<T>) -> usize {
    items.capacity().checked_mul(layout::<T>()).unwrap_or(usize::MAX)
}
'''
then.findings = [{ path = "src/lib.rs", line = 3 }]

[[scenarios]]
id = "cached-ledger-initialization"
scenario = "Saving an estimate for later does not make a custom heap ledger acceptable."
given.files.'src/lib.rs' = '''
struct Entry { charge: usize }
fn remember<T>(items: &Vec<T>) -> Entry {
    Entry { charge: items.capacity().saturating_mul(size_of::<T>()) }
}
'''
then.findings = [{ path = "src/lib.rs", line = 3 }]

[[scenarios]]
id = "actual-allocator-footprint-sum"
scenario = "Summing compiled matcher footprints recreates the real per-rule heap accounting."
given.files.'src/lib.rs' = '''
struct Matcher;
impl Matcher { fn memory_usage(&self) -> usize { 16 } }
fn retained(matchers: &[Matcher]) -> usize {
    matchers.iter().map(|matcher| matcher.memory_usage()).sum::<usize>()
}
'''
then.findings = [{ path = "src/lib.rs", line = 4 }]

[[scenarios]]
id = "rebuild-retained-vector-for-every-admission"
scenario = "Rebuilding a retained Vec to charge its exact heap capacity is custom allocation accounting."
given.files.'src/lib.rs' = '''
struct Matches;
struct Cache { selections: Vec<Matches> }
fn admit(cache: &mut Cache) {
    let mut entries = Vec::new();
    entries.try_reserve_exact(cache.selections.len() + 1).unwrap();
    let _old = cache.selections.capacity().saturating_mul(size_of::<Matches>());
    entries.append(&mut cache.selections);
    cache.selections = entries;
}
'''
then.findings = [{ path = "src/lib.rs", line = 6 }]

[[scenarios]]
id = "allocator-footprint-added-to-ledger"
scenario = "Charging an allocator footprint to a running total is allocation accounting."
given.files.'src/lib.rs' = '''
struct Matcher;
impl Matcher { fn memory_usage(&self) -> usize { 16 } }
fn add(total: usize, matcher: &Matcher) -> usize {
    total.saturating_add(matcher.memory_usage())
}
'''
then.findings = [{ path = "src/lib.rs", line = 4 }]

[[scenarios]]
id = "ordinary-bounded-buffer"
scenario = "A bounded reusable byte buffer needs no custom heap-size arithmetic."
given.files.'src/lib.rs' = '''
fn bounded(bytes: &mut Vec<u8>) {
    bytes.clear();
    if bytes.capacity() > 65536 { *bytes = Vec::new(); }
    bytes.reserve(4096);
}
'''

[[scenarios]]
id = "scoped-raii-and-drop"
scenario = "Rust ownership and explicit drop are ordinary lifetime tools."
given.files.'src/lib.rs' = '''
fn process() {
    let temporary = vec![0_u8; 4096];
    consume(&temporary);
    drop(temporary);
}
fn consume(_: &[u8]) {}
'''

[[scenarios]]
id = "encoded-length-planning"
scenario = "Length-based wire-format sizing describes actual data rather than retained heap capacity."
given.files.'src/lib.rs' = '''
fn encoded<T>(values: &[T]) -> Option<usize> {
    values.len().checked_mul(size_of::<T>())
}
'''

[[scenarios]]
id = "unconnected-layout-and-capacity"
scenario = "Unrelated layout information and an ordinary capacity check in one function are not joined by name cooccurrence."
given.files.'src/lib.rs' = '''
fn encode(bytes: &mut Vec<u8>) -> usize {
    if bytes.capacity() < 4096 { bytes.reserve(4096); }
    size_of::<u64>()
}
'''

[[scenarios]]
id = "bench-instrumentation"
scenario = "A benchmark may observe allocation size without adding runtime reclamation machinery."
given.files.'benches/memory.rs' = '''
fn observed<T>(items: &Vec<T>) -> usize {
    items.capacity() * size_of::<T>()
}
'''

[[scenarios]]
id = "fixture-instrumentation"
scenario = "Fixture observations stay outside production allocation policy."
given.files.'src/fixtures/memory.rs' = '''
fn observed<T>(items: &Vec<T>) -> usize {
    items.capacity() * size_of::<T>()
}
'''

[[scenarios]]
id = "ordinary-capacity-versus-wire-header"
scenario = "Comparing byte capacity to a wire header length is an ordinary buffer bound, not size aggregation."
given.files.'src/lib.rs' = '''
fn fits(bytes: &Vec<u8>) -> bool {
    bytes.capacity() >= size_of::<u64>()
}
'''

[[scenarios]]
id = "accounting-outside-the-ledger"
scenario = "A derived module other than the ledger multiplies capacity by layout and is refused."
given.files.'src/application/file_dag/derived/owner.rs' = '''
fn vector_bytes<T>(values: &Vec<T>) -> usize {
    values.capacity().saturating_mul(size_of::<T>())
}
'''
then.findings = [{ path = "src/application/file_dag/derived/owner.rs", line = 2 }]

[[scenarios]]
id = "accounting-in-the-ledger"
scenario = "The derived ledger is the one owner of retained-byte accounting, so its estimate is allowed."
given.files.'src/application/file_dag/derived/ledger.rs' = '''
fn vector_bytes<T>(values: &Vec<T>) -> usize {
    values.capacity().saturating_mul(size_of::<T>())
}
'''

[[scenarios]]
id = "accounting-in-a-ledger-part"
scenario = "A part under the ledger directory is the same owner."
given.files.'src/application/file_dag/derived/ledger/credit.rs' = '''
fn vector_bytes<T>(values: &Vec<T>) -> usize {
    values.capacity().saturating_mul(size_of::<T>())
}
'''
