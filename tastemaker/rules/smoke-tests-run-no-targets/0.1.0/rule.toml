description = "A smoke test runs no target: nothing in a registry's smoke test or the test root calls into the targets' findings check."
why = "A smoke test proves that what a registry would publish installs and runs; a target is a real project, pinned, whose cold run alone takes minutes. Run from a smoke test, every target is run twice, once by the test and once by the bench that measures it and holds every round to the target's expected findings, and every test run waits for real projects it does not prove anything new about. Read in the files the entry places as smoke tests (`smoke_test.rs` at the root of the distribution test target and in each registry's directory): an expression whose path names `target_test` (`target_test::findings(..)`, `super::target_test::installed_findings(..)`). The module declaration `mod target_test;` and the bench, which runs the targets, are not reported."

query = '''
let tree = select l."id" as "id", l."kind" as "kind", l."text" as "text", l."file" as "file", l."span" as "span" from "syntax-tree" as l;
let named = select * from tree where kind = "ident" and text = "target_test";
let up = axis(from=named, relation="syntax-child", direction=ancestor, domain=tree);
let called = select l."id" as "id", l."file" as "file", l."span" as "span" from up as l join tree as r on l."related" = r."id" where r."kind" = "path-expr";
let found = project(from=called, columns=["file", "span"]);
emit found subject "file" key("span");
'''

[diagnostic]
primary = "span"
message = "this smoke test runs the targets: a target is the bench's to run"
help = "Delete the call: the smoke test proves the install (`--version`, the dry-run publish, the languages it links), and the `distribution` bench runs every target through `target_test` and holds every round to its expected findings."

[given]
include = ['**']
files.'Cargo.toml' = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2024"
'''

[[scenarios]]
id = 'targets-run-by-the-smoke-tests'
scenario = 'The test root that checks every registry`s targets and Cargo`s smoke test that runs its targets through the installed command, as at 5149cd075d, are reported at each call.'
given.files.'distribution/smoke_test.rs' = '''
pub(crate) mod target_test;

/// Every registry's targets run once and print exactly their findings.
#[test]
fn targets_have_their_findings() {
    let failed = REGISTRIES
        .iter()
        .filter_map(|(registry, _, languages)| target_test::findings(registry, *languages).err())
        .map(|error| error.to_string())
        .collect::<Vec<_>>();
    assert!(failed.is_empty(), "{}", failed.join("\n"));
}
'''
given.files.'distribution/registries/cargo/smoke_test.rs' = '''
#[test]
fn installs_and_runs() {
    let directory = tempfile::tempdir().unwrap();
    let installed = command(directory.path()).unwrap();
    assert!(has_version(&output(Command::new(&installed).arg("--version")).unwrap()));
    super::target_test::installed_findings("cargo", &installed).unwrap();
}
'''
then.findings = [
  { path = 'distribution/smoke_test.rs', line = 8 },
  { path = 'distribution/registries/cargo/smoke_test.rs', line = 6 },
]

[[scenarios]]
id = 'smoke-tests-prove-the-install'
scenario = 'A test root that declares the targets` module for the bench and a smoke test that runs `--version` alone are not reported.'
given.files.'distribution/smoke_test.rs' = '''
pub(crate) mod target_test;

#[test]
fn every_registry_is_declared() {
    assert_eq!(REGISTRIES.len(), 1);
}
'''
given.files.'distribution/registries/cargo/smoke_test.rs' = '''
#[test]
fn installs_and_runs() {
    let directory = tempfile::tempdir().unwrap();
    let installed = command(directory.path()).unwrap();
    assert!(has_version(&output(Command::new(&installed).arg("--version")).unwrap()));
}
'''
