description = "An `interface.rs` declares exactly one `pub trait`, and its name ends in the suffix of its kind: `UseCase` for a use case, `Port` for an outbound port, `Item` for a collection; the retired `Interface` suffix is a finding. A handle, a `pub trait` that a method of another trait in the file returns, is not the interface and is not named by the kind."
why = "A trait is recognised by its name: the directory is the stem and the kind is the suffix, so `inbound/use_cases/greet/interface.rs` declares `GreetUseCase`, `outbound/names/interface.rs` declares `NamesPort` and a collection's `interface.rs` declares `ShapesItem`, and a reader, an agent and the nominal-interface lint know what a trait is from its last word. The `Interface` suffix named all three alike and is retired for the parts. RyoQL cannot compare a PascalCase name with a snake_case directory, so the stem of the name is pinned by the part spec's templates, which write the declaration named from the directory; this rule gives that declaration its role and its suffix. A port may also declare the handles its methods return (`fn worker(&self) -> Box<dyn FactsWorker>`), so that an object the port hands out is declared beside the port and needs no new file primitive; `interface-shape` holds the file to the port trait plus the handles. Read as written: in each file the entry selects, the `trait` items at the top level of the file that carry a `pub` visibility (`pub`, `pub(crate)` or `pub(super)`); a trait without one, a trait declared inside a function or an inline module and a trait generated by a macro are not seen."
params = { kind = { type = "string", description = "Which interface the file holds: use-case, port or collection." }, exposed = { type = "set<string>", description = "The ports the product's SDK exposes, by directory name: only a listed port may drop the `Port` suffix." } }

query = '''
param kind: string;
param exposed: set<string>;
let tree-nodes = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span" from "syntax-tree" as l where l."text" = "";
let tree-tokens = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", l."text" as "text" from "syntax-tree" as l where l."text" != "";
let source-files = select * from tree-nodes where kind = "source-file";
let top-edges = select r."child" as "child" from source-files as l join "syntax-child" as r on l."id" = r."parent";
let top-items = select r."id" as "id", r."kind" as "kind", r."file" as "file", r."span" as "span" from top-edges as l join tree-nodes as r on l."child" = r."id";
let traits-all = select * from top-items where kind = "trait";
let n-name-nodes-all = select * from tree-nodes where kind = "name";
let n-kids = select l."id" as "id", r."child" as "child" from traits-all as l join "syntax-child" as r on l."id" = r."parent";
let n-name-nodes = select l."id" as "id", r."id" as "name-node" from n-kids as l join n-name-nodes-all as r on l."child" = r."id";
let n-name-tokens = select l."id" as "id", r."child" as "token" from n-name-nodes as l join "syntax-child" as r on l."name-node" = r."parent";
let n-name-texts = select l."id" as "id", r."text" as "name" from n-name-tokens as l join tree-tokens as r on l."token" = r."id";
let trait-named = select l."id" as "id", l."kind" as "kind", l."file" as "file", l."span" as "span", r."name" as "name" from traits-all as l join n-name-texts as r on l."id" = r."id";
let v-vis-nodes = select * from tree-nodes where kind = "visibility";
let v-pub-kw = select * from tree-tokens where kind = "pub-kw";
let v-pub-vis = select l."parent" as "vis" from "syntax-child" as l join v-pub-kw as r on l."child" = r."id";
let v-vis-kids = select l."id" as "id", r."child" as "child" from traits-all as l join "syntax-child" as r on l."id" = r."parent";
let v-item-vis = select l."id" as "id", r."id" as "vis" from v-vis-kids as l join v-vis-nodes as r on l."child" = r."id";
let pub-ids = select l."id" as "id" from v-item-vis as l join v-pub-vis as r on l."vis" = r."vis";
let pub-traits = select l."id" as "id", l."file" as "file", l."span" as "span", l."name" as "name" from trait-named as l join pub-ids as r on l."id" = r."id";
let r-token-edges = select l."parent" as "parent", l."file" as "file", r."text" as "text" from "syntax-child" as l join tree-tokens as r on l."child" = r."id";
let r-list-edges = select r."child" as "child", l."id" as "trait" from traits-all as l join "syntax-child" as r on l."id" = r."parent";
let r-item-lists = select * from tree-nodes where kind = "assoc-item-list";
let r-lists = select r."id" as "list", l."trait" as "trait" from r-list-edges as l join r-item-lists as r on l."child" = r."id";
let r-fn-edges = select r."child" as "child", l."trait" as "trait" from r-lists as l join "syntax-child" as r on l."list" = r."parent";
let r-fn-nodes = select * from tree-nodes where kind = "fn";
let r-fns = select r."id" as "fn", l."trait" as "trait" from r-fn-edges as l join r-fn-nodes as r on l."child" = r."id";
let r-ret-edges = select r."child" as "child", l."trait" as "trait" from r-fns as l join "syntax-child" as r on l."fn" = r."parent";
let r-ret-types = select * from tree-nodes where kind = "ret-type";
let r-returns = select r."id" as "id", l."trait" as "returner" from r-ret-edges as l join r-ret-types as r on l."child" = r."id";
let r-parts = axis(from=r-returns, relation="syntax-child", direction=descendant, domain=tree-nodes);
let r-part-rows = project(from=r-parts, columns=["returner", "related"]);
let r-words = select l."returner" as "returner", r."file" as "file", r."text" as "word" from r-part-rows as l join r-token-edges as r on l."related" = r."parent";
let r-pairs = select l."id" as "trait", r."returner" as "returner" from trait-named as l join r-words as r on l."file" = r."file" and l."name" = r."word";
let r-others = select * from r-pairs where trait != returner;
let r-ids = project(from=r-others, columns=["trait"]);
let pub-roots = antijoin(left=pub-traits, right=r-ids, left-on=["id"], right-on=["trait"]);
let pub-paths = project(from=pub-traits, columns=["file"]);
let absent = antijoin(left=source-files, right=pub-paths, left-on=["file"], right-on=["file"]);
let absent-rows = project(from=absent, columns=["file", "span"]);
let absent-findings = extend(from=absent-rows, values={"name": "interface.rs", "problem": "declares no `pub trait`: the file holds the part's one interface"});
let counts = group-count(from=pub-roots, keys=["file"], count="n", distinct="id");
let plural = select * from counts where n > 1;
let plural-rows = select l."file" as "file", l."span" as "span", l."name" as "name" from pub-roots as l join plural as r on l."file" = r."file";
let plural-findings = extend(from=plural-rows, values={"problem": "is one of several `pub trait`s in this file, which holds exactly one"});
let kinded = extend(from=pub-roots, values={"k": $kind});
let k-use-case = select * from kinded where k = "use-case";
let good-use-case = select * from k-use-case where glob_any(name, "*UseCase");
let bad-use-case = antijoin(left=k-use-case, right=good-use-case, left-on=["id"], right-on=["id"]);
let retired-use-case = select * from bad-use-case where glob_any(name, "*Interface");
let misnamed-use-case = antijoin(left=bad-use-case, right=retired-use-case, left-on=["id"], right-on=["id"]);
let retired-rows-use-case = project(from=retired-use-case, columns=["file", "span", "name"]);
let retired-findings-use-case = extend(from=retired-rows-use-case, values={"problem": "keeps the retired `Interface` suffix: the trait of a use case is named `<Dir>UseCase`"});
let misnamed-rows-use-case = project(from=misnamed-use-case, columns=["file", "span", "name"]);
let misnamed-findings-use-case = extend(from=misnamed-rows-use-case, values={"problem": "does not end in `UseCase`: the trait of a use case is named `<Dir>UseCase`"});
let k-port = select * from kinded where k = "port";
let port-dirs = capture(from=k-port, path="file", pattern="{*prefix}/{part}/interface.rs", captures=["prefix", "part"]);
let listed-port = select * from port-dirs where part in $exposed;
let unlisted-port = select * from port-dirs where part not in $exposed;
let good-port = select * from unlisted-port where glob_any(name, "*Port");
let bad-port = antijoin(left=unlisted-port, right=good-port, left-on=["id"], right-on=["id"]);
let retired-port = select * from bad-port where glob_any(name, "*Interface");
let misnamed-port = antijoin(left=bad-port, right=retired-port, left-on=["id"], right-on=["id"]);
let retired-rows-port = project(from=retired-port, columns=["file", "span", "name"]);
let retired-findings-port = extend(from=retired-rows-port, values={"problem": "keeps the retired `Interface` suffix: the trait of an outbound port is named `<Dir>Port`"});
let misnamed-rows-port = project(from=misnamed-port, columns=["file", "span", "name"]);
let misnamed-findings-port = extend(from=misnamed-rows-port, values={"problem": "does not end in `Port`: the trait of an outbound port is named `<Dir>Port`, or its plain noun only when the product lists the port as exposed by its SDK (`exposed`)"});
let listed-other = select * from listed-port where glob_any(name, "{*UseCase,*Item,*Interface}");
let listed-other-rows = project(from=listed-other, columns=["file", "span", "name"]);
let listed-findings-port = extend(from=listed-other-rows, values={"problem": "ends in the suffix of another kind: the trait of an exposed port is its plain noun"});
let k-collection = select * from kinded where k = "collection";
let good-collection = select * from k-collection where glob_any(name, "*Item");
let bad-collection = antijoin(left=k-collection, right=good-collection, left-on=["id"], right-on=["id"]);
let retired-collection = select * from bad-collection where glob_any(name, "*Interface");
let misnamed-collection = antijoin(left=bad-collection, right=retired-collection, left-on=["id"], right-on=["id"]);
let retired-rows-collection = project(from=retired-collection, columns=["file", "span", "name"]);
let retired-findings-collection = extend(from=retired-rows-collection, values={"problem": "keeps the retired `Interface` suffix: the trait of a collection is named `<Dir>Item`"});
let misnamed-rows-collection = project(from=misnamed-collection, columns=["file", "span", "name"]);
let misnamed-findings-collection = extend(from=misnamed-rows-collection, values={"problem": "does not end in `Item`: the trait of a collection is named `<Dir>Item`"});
let all-1 = union(left=absent-findings, right=plural-findings);
let all-2 = union(left=all-1, right=retired-findings-use-case);
let all-3 = union(left=all-2, right=misnamed-findings-use-case);
let all-4 = union(left=all-3, right=retired-findings-port);
let all-5 = union(left=all-4, right=misnamed-findings-port);
let all-6 = union(left=all-5, right=retired-findings-collection);
let all-7 = union(left=all-6, right=misnamed-findings-collection);
let all-8 = union(left=all-7, right=listed-findings-port);
emit all-8 subject "file" key("span", "problem");
'''

[diagnostic]
primary = "span"
message = "`{name}` {problem}"
help = "Declare exactly one `pub trait` in `interface.rs` and name it for what its directory is: `<Dir>UseCase` in a use case's `interface.rs`, `<Dir>Port` in an outbound port's, `<Dir>Item` in a collection's, with `<Dir>` the directory name in PascalCase. Rename a trait that still ends in `Interface`, and move a second trait to the part that owns it (a value trait belongs in `types.rs`). An ignore is not legitimate here: the suffix is how every reader and the nominal-interface lint tell the kind of a trait."

[[scenarios]]
id = 'use-case'
scenario = "A use case's trait ends in UseCase."
given.include = ['**/interface.rs']
given.params = { kind = 'use-case', exposed = [] }
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What the `greet` use case promises.

/// The promise.
pub trait GreetUseCase {
    /// Does it.
    fn run(&self);
}
'''

[[scenarios]]
id = 'outbound-port-s-trait-ends-port'
scenario = "An outbound port's trait ends in Port."
given.include = ['**/interface.rs']
given.params = { kind = 'port', exposed = [] }
given.files.'src/outbound/names/interface.rs' = '''
//! What the `names` port asks of the outside.

/// The promise.
pub trait NamesPort {
    /// Does it.
    fn run(&self);
}
'''

[[scenarios]]
id = 'collection-s-trait-ends-item'
scenario = "A collection's trait ends in Item."
given.include = ['**/interface.rs']
given.params = { kind = 'collection', exposed = [] }
given.files.'src/collections/shapes/interface.rs' = '''
//! The shape every item of `shapes` implements.

/// The promise.
pub trait ShapesItem {
    /// Does it.
    fn run(&self);
}
'''

[[scenarios]]
id = 'private-helper'
scenario = 'A private trait beside the pub one is not the interface.'
given.include = ['**/interface.rs']
given.params = { kind = 'use-case', exposed = [] }
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What `greet` promises.

/// The promise.
pub trait GreetUseCase {
    /// Does it.
    fn run(&self);
}

trait Helper {}
'''

[[scenarios]]
id = 'retired-suffix'
scenario = 'The retired Interface suffix.'
given.include = ['**/interface.rs']
given.params = { kind = 'use-case', exposed = [] }
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What `greet` promises.

/// The promise.
pub trait GreetInterface {
    /// Does it.
    fn run(&self);
}
'''
then.findings = [
  { path = 'src/inbound/use_cases/greet/interface.rs', line = 4 },
]

[[scenarios]]
id = 'use-case-without-suffix'
scenario = "A use case's trait without its suffix."
given.include = ['**/interface.rs']
given.params = { kind = 'use-case', exposed = [] }
given.files.'src/inbound/use_cases/greet/interface.rs' = '''
//! What `greet` promises.

/// The promise.
pub trait GreetUseCaseImpl {
    /// Does it.
    fn run(&self);
}
'''
then.findings = [
  { path = 'src/inbound/use_cases/greet/interface.rs', line = 4 },
]

[[scenarios]]
id = 'port-with-use-case-suffix'
scenario = 'A port named like a use case.'
given.include = ['**/interface.rs']
given.params = { kind = 'port', exposed = [] }
given.files.'src/outbound/names/interface.rs' = '''
//! What `names` asks.

/// The promise.
pub trait NamesUseCase {
    /// Does it.
    fn run(&self);
}
'''
then.findings = [
  { path = 'src/outbound/names/interface.rs', line = 4 },
