'''
then.findings = [
  { path = 'src/inbound/use_cases/greet/interface.rs', line = 4 },
  { path = 'src/inbound/use_cases/greet/interface.rs', line = 10 },
]

[[scenarios]]
id = 'port-plain-noun'
scenario = 'A port trait under its plain noun, as the SDK exposes it.'
given.include = ['**/interface.rs']
given.params = { kind = 'port', exposed = ['language'] }
given.files.'src/outbound/language/interface.rs' = '''
//! What the `language` port asks of the outside.

/// The promise, named for its noun because the SDK exposes it.
pub trait Language {
    /// Does it.
    fn run(&self);
}
'''

[[scenarios]]
id = 'port-plain-noun-unlisted'
scenario = 'A port under its plain noun when the product does not list it as exposed.'
given.include = ['**/interface.rs']
given.params = { kind = 'port', exposed = [] }
given.files.'src/outbound/language/interface.rs' = '''
//! What the `language` port asks of the outside.

/// The promise, named for its noun because the SDK exposes it.
pub trait Language {
    /// Does it.
    fn run(&self);
}
'''
then.findings = [
  { path = 'src/outbound/language/interface.rs', line = 4 },
]

[[scenarios]]
id = 'port-with-handle'
scenario = 'A handle a port method returns is not named by the kind.'
given.include = ['**/interface.rs']
given.params = { kind = 'port', exposed = [] }
given.files.'src/outbound/facts/interface.rs' = '''
//! What the `facts` port asks of the outside.

/// What every `facts` adapter implements.
pub trait FactsPort {
    /// Starts a worker.
    fn worker(&self) -> Box<dyn FactsWorker>;
}

/// One worker the port hands out.
pub trait FactsWorker {
    /// Adds a row.
    fn add(&self, id: u32);
}
'''

[[scenarios]]
id = 'unreturned-second-trait'
scenario = 'A second trait no method returns.'
given.include = ['**/interface.rs']
given.params = { kind = 'port', exposed = [] }
given.files.'src/outbound/facts/interface.rs' = '''
//! What the `facts` port asks of the outside.

/// What every `facts` adapter implements.
pub trait FactsPort {
    /// Starts a worker.
    fn worker(&self) -> Box<dyn FactsWorker>;
}

/// One worker the port hands out.
pub trait FactsWorker {
    /// Adds a row.
    fn add(&self, id: u32);
}

/// A trait no method returns.
pub trait FactsSink {
    /// Writes a row.
    fn write(&self, id: u32);
}
'''
then.findings = [
  { path = 'src/outbound/facts/interface.rs', line = 4 },
  { path = 'src/outbound/facts/interface.rs', line = 16 },
  { path = 'src/outbound/facts/interface.rs', line = 16 },
]
