description = "Every resolved local package dependency names a declared sibling manifest, independent of dependency alias, condition or kind."
why = "Capability boundaries use package identities, not import or Cargo binding spellings. The source and target are resolved package-dependency manifest files. An allowed target must have the same parent directory as the source package and its exact package-directory identity must be declared. Normal, build, target-specific and dev dependencies are all checked; a test must not introduce an engine backdependency into a semantic capability. A self-manifest dev reference reusing its fixture feature adds no other package and is allowed by source/target identity equality. Path declarations with an unmatched or unavailable target fail closed instead of disappearing during capture. Registry/git packages without a repository manifest are outside this local policy and are checked by the paired internal-package-allowlist. Refused or incomplete manifest facts remain ordinary TM coverage failures, not permission to assume no dependency. This checks dependency shape, not semantic cohesion or runtime ownership."
query = '''
param allowed-siblings: set<string>;
let dependencies = select source, target, package, origin from "package-dependency";
let explicit_paths = select source, target, package from dependencies where origin = "path";
let resolved = select l.source as source, l.target as target, l.package as package from dependencies as l join "filesystem.file" as r on l.target = r.path;
let candidates = union(left=explicit_paths, right=resolved);
let sources = capture(from=candidates, path="source", pattern="{*parent}/{from}/Cargo.toml", captures=["parent", "from"]);
let targets = capture(from=sources, path="target", pattern="{*target-parent}/{to}/Cargo.toml", captures=["target-parent", "to"]);
let allowed = select source, target, package from targets as l where l.parent = l."target-parent" and l.to in $allowed-siblings;
let own_manifest = select source, target, package from candidates as l where l.source = l.target;
let permitted = union(left=allowed, right=own_manifest);
let denied = antijoin(left=candidates, right=permitted, left-on=["source", "target", "package"], right-on=["source", "target", "package"]);
let documents = select file, span from "syntax-tree" where kind = "toml" and text = "";
let located = select l.source as file, r.span as span, l.target as target, l.package as package from denied as l join documents as r on l.source = r.file;
emit located subject "file" key("file", "target", "package");
'''

[params.allowed-siblings]
type = "set<string>"
description = "Exact directory identities of allowed sibling package manifests, not Cargo dependency aliases or patterns."

[diagnostic]
primary = "span"
message = "local dependency `{package}` is outside the declared sibling manifest contract allowlist"
help = "Use the declared capability contracts. Keep engine scheduling, caches and leases in the engine; review responsibility before changing the allowlist. Renaming a dependency alias does not change its manifest identity."

[given]
include = ['crates/operators/Cargo.toml']
params = { allowed-siblings = ['language', 'values'] }
files.'Cargo.toml' = '''
[workspace]
resolver = "3"
members = ["crates/*", "elsewhere/*"]
'''
files.'crates/operators/Cargo.toml' = '''
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
language = { path = "../language" }
values = { path = "../values" }
'''
files.'crates/operators/src/lib.rs' = ''
files.'crates/language/Cargo.toml' = '''
[package]
name = "language"
version = "0.1.0"
edition = "2024"
'''
files.'crates/language/src/lib.rs' = ''
files.'crates/values/Cargo.toml' = '''
[package]
name = "values"
version = "0.1.0"
edition = "2024"
'''
files.'crates/values/src/lib.rs' = ''
files.'crates/core/Cargo.toml' = '''
[package]
name = "core"
version = "0.1.0"
edition = "2024"
'''
files.'crates/core/src/lib.rs' = ''
files.'crates/derived/Cargo.toml' = '''
[package]
name = "derived"
version = "0.1.0"
edition = "2024"
'''
files.'crates/derived/src/lib.rs' = ''
files.'elsewhere/values/Cargo.toml' = '''
[package]
name = "foreign-values"
version = "0.1.0"
edition = "2024"
'''
files.'elsewhere/values/src/lib.rs' = ''

[[scenarios]]
id = 'declared-semantic-siblings'
scenario = 'The declared portable sibling manifests are allowed.'

[[scenarios]]
id = "same-layer-sibling"
scenario = "Resolved manifest identity rejects same-layer-sibling."
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
derived = { path = "../derived" }
"""
then.findings = [{ path = "crates/operators/Cargo.toml", line = 1 }]

