[[scenarios]]
id = 'workspace-inherited-backdependency'
scenario = 'Workspace inheritance cannot hide the actual engine manifest.'
given.files.'Cargo.toml' = """
[workspace]
resolver = "3"
members = ["crates/*", "elsewhere/*"]
[workspace.dependencies]
innocent = { package = "core", path = "crates/core" }
"""
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
innocent = { workspace = true }
"""
then.findings = [{ path = "crates/operators/Cargo.toml", line = 1 }]

[[scenarios]]
id = 'self-fixture-feature'
scenario = 'A self-manifest fixture feature is not another capability dependency.'
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[features]
fixtures = []
[dev-dependencies]
operators = { path = ".", features = ["fixtures"] }
"""

[[scenarios]]
id = 'distinct-foreign-manifest-identities'
scenario = 'Two forbidden manifests with the same basename remain two findings.'
given.files.'Cargo.toml' = """
[workspace]
resolver = "3"
members = ["crates/*", "elsewhere/*", "another/*"]
"""
given.files.'another/values/Cargo.toml' = """
[package]
name = "another-values"
version = "0.1.0"
edition = "2024"
"""
given.files.'another/values/src/lib.rs' = ''
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
first = { package = "foreign-values", path = "../../elsewhere/values" }
second = { package = "another-values", path = "../../another/values" }
"""
then.findings = [
  { path = 'crates/operators/Cargo.toml', line = 1 },
  { path = 'crates/operators/Cargo.toml', line = 1 },
]

[[scenarios]]
id = 'root-package-target-not-dropped'
scenario = 'A root package manifest is denied rather than discarded by the sibling path capture.'
given.files.'Cargo.toml' = """
[package]
name = "workspace-root"
version = "0.1.0"
edition = "2024"
[workspace]
resolver = "3"
members = ["crates/*", "elsewhere/*"]
"""
given.files.'src/lib.rs' = ''
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
root_alias = { package = "workspace-root", path = "../.." }
"""
then.findings = [{ path = 'crates/operators/Cargo.toml', line = 1 }]

[[scenarios]]
id = 'root-package-source-not-dropped'
scenario = 'A root source manifest is denied rather than discarded before matching.'
given.include = ['Cargo.toml']
given.files.'Cargo.toml' = """
[package]
name = "workspace-root"
version = "0.1.0"
edition = "2024"
[workspace]
resolver = "3"
members = ["crates/*", "elsewhere/*"]
[dependencies]
core = { path = "crates/core" }
"""
given.files.'src/lib.rs' = ''
then.findings = [{ path = 'Cargo.toml', line = 1 }]

[[scenarios]]
id = 'path-outside-repository-fails-closed'
scenario = 'A path climbing outside the repository has no permitted manifest identity and cannot disappear.'
given.files.'crates/operators/Cargo.toml' = """
[package]
name = "operators"
version = "0.1.0"
edition = "2024"
[dependencies]
foreign = { package = "outside-contract-never-present", path = "../../../../outside-contract-never-present" }
"""
then.findings = [{ path = 'crates/operators/Cargo.toml', line = 1 }]
