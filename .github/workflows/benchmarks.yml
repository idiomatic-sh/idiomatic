# Temporary compute-ref capture of exact UP031 process failures on Linux x86.
# The public benchmarks workflow is unchanged; this file exists only on this ref.
name: benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmarks:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: ubuntu-26.04-up031-process-capture-ryo
          save-if: true
          workspaces: crates/ryo -> ../../target
      - name: Install exact Ruff reference
        run: |
          uv tool install --force ruff==0.16.5
          test "$(ruff --version)" = 'ruff 0.16.5'
      - name: Build and seal Ruff benchmark consumer
        run: |
          set -euo pipefail
          mkdir -p target/checks/up031-process
          cd crates/ryo
          CARGO_BUILD_JOBS=6 cargo bench --locked -j6 --no-run -p idiomatic-sh-ryo-python --bench ruff --message-format=json \
            > ../../target/checks/up031-process/worker-build.jsonl \
            2> ../../target/checks/up031-process/worker-build.stderr
          python3 ../../.github/scripts/seal_cargo_artifact.py \
            ../../target/checks/up031-process/worker-build.jsonl \
            ruff bench /languages/python/benchmarks/linters/ruff/bench.rs true \
            ../../target/checks/up031-process/worker
      - name: Capture two independent process observations per source
        run: |
          set -euo pipefail
          root="$PWD/target/checks/up031-process"
          worker="$root/worker"
          reference="$(command -v ruff)"
          sha256sum "$worker" "$reference" > "$root/executable-sha256.txt"
          ruff --version > "$root/ruff-version.txt"
          uname -m > "$root/architecture.txt"
          git rev-parse HEAD > "$root/source-head.txt"
          for target in default py37; do
            profile="$PWD/.github/fixtures/up031-process-bootstrap-$target/repro"
            for attempt in 1 2; do
              output="$root/$target/attempt-$attempt"
              mkdir -p "$output"
              set +e
              RYO_VERIFY_CASE_RESULTS="$output/cases.jsonl" "$worker" verify-reference-cases \
                "$reference" "$profile" > "$output/stdout.txt" 2> "$output/stderr.txt"
              status=$?
              set -e
              echo "$status" > "$output/status.txt"
              test "$status" -eq 1
              python3 - "$output" <<'PY'
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          rows = [json.loads(line) for line in (root / 'cases.jsonl').read_text().splitlines()]
          assert len(rows) == 3, len(rows)
          assert {row['name'] for row in rows} == {
              'escaped-annotation-modulo', 'backslash-annotation-modulo', 'annotation-addition-negative'
          }
          for row in rows:
              if row['name'] == 'annotation-addition-negative':
                  assert row['case_passed'] is True
                  continue
              observed = row['process_observation']
              assert observed['kind'] == 'process-failure' and observed['exit'] == 2
              for artifact in observed['artifacts'].values():
                  assert (root / artifact['path']).is_file(), artifact
          PY
            done
          done
      - name: Verify both complete target profiles and offline process receipts
        run: |
          set -euo pipefail
          root="$PWD/target/checks/up031-process"
          cd crates/ryo
          CARGO_BUILD_JOBS=6 cargo build --release --locked -j6 -p idiomatic-sh-ryo-benchmark \
            --bin ryo-benchmark-collector --message-format=json \
            > ../../target/checks/up031-process/collector-build.jsonl \
            2> ../../target/checks/up031-process/collector-build.stderr
          python3 ../../.github/scripts/seal_cargo_artifact.py \
            ../../target/checks/up031-process/collector-build.jsonl \
            ryo-benchmark-collector bin /crates/benchmark/src/main.rs false \
            ../../target/checks/up031-process/collector
          cd ../..
          for target in py310 py37; do
            profile="$PWD/.github/fixtures/up031-process-certified/$target/repro"
            registration="$PWD/.github/fixtures/up031-process-certified/$target/registration.json"
            output="$root/certified-$target"
            mkdir -p "$output"
            RYO_VERIFY_CASE_RESULTS="$output/cases.jsonl" "$root/worker" verify-cases \
              "$(command -v ruff)" "$profile" > "$output/stdout.txt" 2> "$output/stderr.txt"
            "$root/collector" validate-case-receipts "$registration" "$output/cases.jsonl" \
              > "$output/offline-audit.json" 2> "$output/offline-audit.stderr"
            python3 - "$output" <<'PY'
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          assert (root / 'stdout.txt').read_text().strip() == '43 cases passed against both contestants'
          audit = json.loads((root / 'offline-audit.json').read_text())
          assert (audit['case_count'], audit['raw_exact'], audit['documented_discrepancies'], audit['contract_only'], audit['errors']) == (43, 41, 2, 0, [])
          PY
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: up031-x86-process-capture
          path: target/checks/up031-process/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
