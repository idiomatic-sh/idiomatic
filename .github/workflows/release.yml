# The release workflow on GitHub Actions, its thin edge, as ruff's is. A green check on main (check.yml's push run, `gate` passed) releases each
# product whose version has no tag yet, in two runs. The run `workflow_run` starts only tags: its `tag` job runs `ci/tag/command.py
# --push`, which names each product whose workspace version in crates/<product>/Cargo.toml has no tag (`idiomatic-sh-<product>-v<version>`),
# the commit that changed it having had a red check or this one changing it, and creates that tag at the commit; its `dispatch` job
# then dispatches this workflow (`workflow_dispatch`) from each new tag with `publish`, ryo's first and each run awaited, since
# tastemaker depends on ryo's crates. It builds and publishes nothing: crates.io's trusted publishing refuses a `workflow_run`
# run. A push to main starts nothing here: the release workflow starts when check.yml's run on it completes, and its `tag` job
# runs only when that run's `gate` passed, on that run's commit. A red or cancelled run tags nothing; the next green run on main
# releases. The dispatched run (or a maintainer's hand run, which releases ONE product, the `product` input) checks the product
# first: `asymptote check --root crates/<product> --groups <group>` runs each of that product's groups (its tests and packaging
# tests and its lint, one job per group and machine, and the repository root's `repository` group). The `build` job builds the
# product's wheel (Ryo's only for its binary) on each of eight targets' own machines through PyO3/maturin-action (the manylinux
# 2_17 and musllinux_1_2 containers on Linux), one matrix whose rows run the same steps; then the `publish` job runs
# `ci/release/command.py --product <product>`
# once per product over what the rows built: it makes the product's npm packages and its GitHub Release archives from the wheels'
# binaries, hands every package to its registry's dry run, and, when it publishes, uploads to crates.io (skipping a version
# already there), then npm and PyPI, and last creates the product's GitHub Release with `gh`. A run is a dry run unless all three
# hold: it is dispatched with `publish` from the product's own tag, by the maintainer (the repository variable RELEASE_MAINTAINER,
# unset until a maintainer sets it) or by this workflow's `dispatch` job, and each registry trusts this workflow for
# publishing: crates.io, npm and PyPI each through its trusted publishing (OIDC), with no token kept in the repository, which only
# a maintainer can arrange (the `distribution` spec).
name: release
on:
  # A green check on main: the run check.yml's push to main started, completed with its `gate` passed. Its jobs tag the commit
  # and dispatch the release; they build and publish nothing.
  # A red, cancelled or pull request run starts nothing: the next green run on main releases.
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      product:
        description: The one product this run releases (publish ryo before tastemaker, which depends on its crates)
        type: choice
        required: true
        options: [ryo, tastemaker, asymptote]
      publish:
        description: Upload to npm, PyPI and crates.io (maintainers only); otherwise every publish is a dry run
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # The products a green check on main releases, each one's tag created at the commit the check ran on.
  tag:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      products: ${{ steps.tag.outputs.products }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The pushed commit and its parent, whose versions are compared.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - id: tag
        run: uv run ci/tag/command.py --push
        env:
          GH_TOKEN: ${{ github.token }}
  # The release of each product the `tag` job tagged: this workflow dispatched from the product's new tag with `publish`, one product
  # at a time and each run awaited, ryo's first (tastemaker depends on its crates, which must be on crates.io before tastemaker's
  # publish). Dispatched by this job's token, the run is a `workflow_dispatch` one, which crates.io's trusted publishing accepts.
  # This job builds and publishes nothing, and it alone holds `actions: write`.
  dispatch:
    needs: tag
    if: ${{ needs.tag.result == 'success' && needs.tag.outputs.products != '[]' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTS: ${{ needs.tag.outputs.products }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for product in $(jq -r '.[]' <<< "$PRODUCTS"); do
            tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/idiomatic-sh-$product-v" --jq ".[] | select(.object.sha == \"$COMMIT\") | .ref | ltrimstr(\"refs/tags/\")")"
            since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f product="$product" -f publish=true
            run=""
            for _ in $(seq 20); do
              run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --branch "$tag" --json databaseId,headBranch,createdAt --jq "[.[] | select(.headBranch == \"$tag\" and .createdAt >= \"$since\")] | first | .databaseId // empty")"
              [ -n "$run" ] && break
              sleep 15
            done
            [ -n "$run" ] || { echo "::error::no release run for $tag started within 5 minutes"; exit 1; }
            gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 60 --exit-status
          done
  # A hand run's check rows for its product: `ci/groups` keeps, of the release's rows (`RELEASE_ROWS`, a group on its machine), the
  # repository root's and each whose group the product's tools declare, so no row asks a product for a group it has none of.
  groups:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    outputs:
      rows: ${{ steps.groups.outputs.rows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - id: groups
        run: uv run ci/groups/command.py --product ${{ inputs.product }} --rows
  # A hand run's checks: the check run a release starts on has already checked its tree. One job per row the `groups` job kept:
  # the tools of a group share one build, and no two groups do. bench holds the linter benches: every default verified, ryo
  # against the pinned reference over every project, and ryo's cost, verification times and growth judged against the lock. The
  # repository root's row runs the root's `repository` group, which no product has: the root's tools alone.
  check:
    if: github.event_name == 'workflow_dispatch'
    needs: groups
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.groups.outputs.rows) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        if: runner.os == 'Linux'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Match check.yml's cache for this machine, group and product. Clean only the product's workspace.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ${{ matrix.runner }}-${{ matrix.group }}-${{ inputs.product }}
          save-if: true
          workspaces: crates/${{ inputs.product }} -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      - run: asymptote check --root ${{ matrix.root || format('crates/{0}', inputs.product) }} --groups ${{ matrix.group }}
  build:
    needs: check
    # Only a dispatched run builds, its product the input, once its check passed: the run a completed check starts builds nothing.
    if: ${{ !cancelled() && !failure() && github.event_name == 'workflow_dispatch' }}
    name: build (${{ matrix.product }}, ${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(format('["{0}"]', inputs.product)) }}
        platform:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-26.04, manylinux: 2_17 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-26.04-arm, manylinux: 2_17 }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-26.04, manylinux: musllinux_1_2 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-26.04-arm, manylinux: musllinux_1_2 }
          - { target: x86_64-apple-darwin, runner: macos-26, macosx-deployment-target: "10.12" }
          - { target: aarch64-apple-darwin, runner: macos-26, macosx-deployment-target: "11.0" }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
          - { target: aarch64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.platform.runner }}
    env:
      # The repository's .cargo/config.toml links with mold on Linux, which the build containers lack, and links the C runtime
      # statically on Windows: RUSTFLAGS replaces that configuration, with the same flag on Windows and none elsewhere.
      RUSTFLAGS: ${{ contains(matrix.platform.target, 'windows') && '-C target-feature=+crt-static' || ' ' }}
      # The oldest macOS each binary runs on, maturin's and rustc's defaults, so building on a newer macOS does not raise it.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.macosx-deployment-target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        if: matrix.product == 'asymptote'
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: crates/asymptote/distribution/registries/pypi
          args: --locked --out ${{ github.workspace }}/dist/${{ matrix.platform.target }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        if: matrix.product == 'tastemaker'
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: crates/tastemaker/distribution/registries/pypi
          args: --locked --out ${{ github.workspace }}/dist/${{ matrix.platform.target }}
      # Ryo ships to Cargo alone, so it has no PyPI project: its command line crate's wheel is built only for the binary its GitHub
      # Release archives, with the profile a PyPI project names.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        if: matrix.product == 'ryo'
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: crates/ryo/cli
          args: --locked --bindings bin --profile dist --out ${{ github.workspace }}/dist/${{ matrix.platform.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The artifact holds `<target>/<wheel>`, so the publish job's merged download of a product's artifacts is `dist/<target>`.
        with:
          name: ${{ matrix.product }}-${{ matrix.platform.target }}
          path: dist
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(format('["{0}"]', inputs.product)) }}
    # Each product's publish in a group of its own: one product's publishes never overlap, and products publish side by side.
    concurrency:
      group: release-${{ matrix.product }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      # A run publishes only from the product's own tag, dispatched with `publish`: by the maintainer's hand, or by this workflow's
      # `dispatch` job for a tag the `tag` job made (crates.io's trusted publishing refuses a `workflow_run` run, so the run a
      # completed check starts publishes nothing itself). Otherwise the job builds and dry-runs the product and uploads nothing.
      PUBLISH: ${{ inputs.publish && github.ref_type == 'tag' && startsWith(github.ref_name, format('idiomatic-sh-{0}-v', matrix.product)) && ((vars.RELEASE_MAINTAINER != '' && github.triggering_actor == vars.RELEASE_MAINTAINER) || github.triggering_actor == 'github-actions[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      # npm's trusted publishing needs npm 11.5.1 or later: the latest Node 24, not a runner's cached one, bundles it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # This product's artifacts, merged: a directory per target.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.product }}-*
          merge-multiple: true
          path: dist
      # crates.io: its trusted publishing, the short-lived token its auth action exchanges this run's OIDC token for.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io
        if: env.PUBLISH == 'true'
      # crates.io, then npm and PyPI, all three through OIDC trusted publishing (`id-token: write`); npm and PyPI exchange the
      # OIDC token themselves.
      - run: uv run ci/release/command.py --dist dist --product ${{ matrix.product }} ${{ env.PUBLISH == 'true' && '--publish' || '--dry-run' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.PUBLISH == 'true' && steps.crates-io.outputs.token || '' }}
      # The GitHub Release, last: the product's one, tagged `<package>-v<version>` (the directory its archives were written
      # to, and the tag cargo-binstall's `pkg-url` names), the tag made at this run's commit when it does not exist yet. Each is a
      # draft while its archives and their checksums upload, then published; a published release is immutable.
      - name: GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archives in dist/archives/*/; do
            tag="$(basename "$archives")"
            (cd "$archives" && sha256sum -- * > SHA256SUMS)
            gh release create "$tag" --draft --target "$(git rev-parse HEAD)" --title "$tag" --generate-notes
            gh release upload "$tag" "$archives"*
            gh release edit "$tag" --draft=false
          done
