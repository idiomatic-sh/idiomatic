# The check workflow on GitHub Actions, its thin edge: a machine of each platform, the toolchains (every sample's among them: a
# sample whose toolchain is missing fails its test), `tools/install.py`, which installs every tool the
# checks run at the version declared for it (the command-line tools built from this checkout among them), and one call of
# `asymptote check --groups <group>` per job: first the `build` group on each platform, which compiles what the checks compile and
# alone saves the build cache, then, from that cache, a job for each of the `lint` and `check` groups of the `asymptote.toml` files (the
# release workflow runs the `release` group; the benches of `perf` run only when asked for with `--groups perf`).
# It runs on every pull request and every push to main, and still by hand; the per-change gate stays
# `asymptote check --hook pre-commit`, the git hook `asymptote init` installs, which runs the `lint` group. A pull request's `speed`
# job then runs the `speed` group on Linux, the change benched against main: a measure more than 15% slower fails it.
name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: true
          workspaces: |
            crates/asymptote -> target
            crates/tastemaker -> target
            crates/ryo -> target
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
      - run: asymptote check --groups build
  check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
        group: [lint, check]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: false
          workspaces: |
            crates/asymptote -> target
            crates/tastemaker -> target
            crates/ryo -> target
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
      - run: asymptote check --groups ${{ matrix.group }}
  speed:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: false
          workspaces: |
            crates/asymptote -> target
            crates/tastemaker -> target
            crates/ryo -> target
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
      - run: asymptote check --groups speed
