# The check workflow on GitHub Actions, its thin edge: a machine of each platform, the toolchains (every sample's among them: a
# sample whose toolchain is missing fails its test), `tools/install.py`, which installs every tool the
# checks run at the version declared for it (our own command-line tools among them, as their published releases), and one call of
# `asymptote check --groups <group>` per job: first the `build` group on each platform, which compiles what the checks compile and
# alone saves the build cache, then, from that cache, a job for each of the `lint`, `check`, `clippy` and `api` groups of the `asymptote.toml` files (the
# release workflow runs the `release-*` groups; the benches of `perf` run only when asked for with `--groups perf`).
# It runs on every pull request and every push to main, and still by hand; the per-change gate stays
# `asymptote check --hook pre-commit`, the git hook `asymptote init` installs, which runs the `lint` group. A pull request's `speed`
# job then runs the `speed` group on Linux, the change benched against main: a measure more than 15% slower fails it. Manual
# validation runs the same group, including Ryo's existing Rust warm-memory guard.
name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: true
          # Keep valid intermediate Cargo artifacts when a later quality check fails.
          cache-on-failure: true
          workspaces: |
            crates/asymptote -> ../../target
            crates/tastemaker -> ../../target
            crates/ryo -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      - name: Save the installed tools before quality checks
        if: steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
      - id: build_check
        run: |
          mkdir -p target/checks
          set +e
          asymptote check --groups build --format json > target/checks/build.json 2> target/checks/build.stderr
          build_status=$?
          set -e
          cat target/checks/build.json
          cat target/checks/build.stderr >&2
          printf '%s\n' "$build_status" > target/checks/build.status
          exit "$build_status"
      - name: Failed tool diagnostics
        if: failure() && steps.build_check.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-tools-build-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            target/checks/
            crates/*/target/checks/
            .asymptote/cache/check.store
            crates/*/.asymptote/cache/check.store
            tools/lints/.asymptote/cache/check.store
            .asymptote/cache/check.failures.json
            crates/*/.asymptote/cache/check.failures.json
            tools/lints/.asymptote/cache/check.failures.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  check:
    needs: build
    strategy:
      fail-fast: false
      # The tests (check) on every machine; lint, clippy and Ruff's candidate profiles once on Linux x64, and the SDK's API once, on
      # macOS, where cargo-public-api ships a prebuilt: none of their verdicts depends on the platform.
      matrix:
        include:
          - { os: ubuntu-26.04, group: lint }
          - { os: ubuntu-26.04, group: check }
          - { os: ubuntu-26.04, group: ruff-candidates }
          - { os: macos-26, group: check }
          - { os: windows-2025, group: check }
          - { os: ubuntu-26.04, group: clippy }
          - { os: macos-26, group: api }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: false
          workspaces: |
            crates/asymptote -> ../../target
            crates/tastemaker -> ../../target
            crates/ryo -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      - name: Save the installed tools before quality checks
        if: steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
      - id: quality
        run: |
          mkdir -p target/checks
          set +e
          asymptote check --groups ${{ matrix.group }} --format json > target/checks/${{ matrix.group }}.json 2> target/checks/${{ matrix.group }}.stderr
          quality_status=$?
          set -e
          cat target/checks/${{ matrix.group }}.json
          cat target/checks/${{ matrix.group }}.stderr >&2
          printf '%s\n' "$quality_status" > target/checks/${{ matrix.group }}.status
          exit "$quality_status"
      - name: Failed tool diagnostics
        if: failure() && steps.quality.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-tools-${{ matrix.group }}-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            target/checks/
            crates/*/target/checks/
            .asymptote/cache/check.store
            crates/*/.asymptote/cache/check.store
            tools/lints/.asymptote/cache/check.store
            .asymptote/cache/check.failures.json
            crates/*/.asymptote/cache/check.failures.json
            tools/lints/.asymptote/cache/check.failures.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: SDK API comparison evidence
        if: failure() && matrix.group == 'api' && steps.quality.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-api-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            crates/*/target/sdk-api/actual.txt
            crates/*/target/sdk-api/recorded.txt
            crates/*/target/sdk-api/diff.txt
            crates/*/target/sdk-api/metadata.json
          if-no-files-found: ignore
          retention-days: 7
  speed:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: false
          workspaces: |
            crates/asymptote -> ../../target
            crates/tastemaker -> ../../target
            crates/ryo -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      - name: Save the installed tools before quality checks
        if: steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
      - id: speed_check
        run: |
          mkdir -p target/benchmarks/speed
          set +e
          asymptote check --groups speed --format json > target/benchmarks/speed/check.json 2> target/benchmarks/speed/check.stderr.log
          speed_status=$?
          cat target/benchmarks/speed/check.json
          cat target/benchmarks/speed/check.stderr.log >&2
          exit "$speed_status"
      - name: Speed comparison and Rust memory evidence
        if: always() && steps.speed_check.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-evidence-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            target/benchmarks/speed/**
            .asymptote/cache/check.failures.json
            crates/*/.asymptote/cache/check.failures.json
            tools/lints/.asymptote/cache/check.failures.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
