# The check workflow on GitHub Actions, its thin edge: the pull request gate. A `changes` job reads which products a pull request to
# main changes, and for each of them the `check` job runs that product's whole check fan-out, the groups and machines release.yml's
# own `check` job runs (`asymptote check --root crates/<product> --groups <group>`, one job per group and machine): the tests on
# every machine the products ship to, the SDK's API on macOS, where cargo-public-api ships a prebuilt, and every other group once,
# on Linux. A change to the files outside crates/<product>/ (tools/, ci/, .github/, the root's configurations) is every product's,
# so it runs all three, and the `root` job's check group (the ci/ tests) beside its lint group. The `root` job runs the repository
# root's lint group on every pull request: its `commitizen` tool checks the pull request's commits and its title, which a squash
# merge makes the commit main keeps. A hand run checks the one product its `product` input names, and no root: the release pull
# request workflow (release-pr.yml) starts one on its branch, since a pull request a workflow opens starts no workflow, and that
# run's `gate` is the check the pull request's head commit needs. Each
# job is a machine, the toolchains (every sample's among them: a sample whose toolchain is missing fails its test),
# `tools/install.py`, which installs every tool the checks run at the version declared for it, prebuilt, and one `asymptote check`
# call. The `gate` job waits for every other and fails when one failed or was cancelled; a product the change does not reach is
# skipped, which passes; the independent speed guard is also required by `gate`. The commit gate stays `asymptote check --hook pre-commit`,
# the git hook `asymptote init` installs, which runs the `lint` group.
name: check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      product:
        description: The one product this run checks
        type: choice
        required: true
        options: [ryo, tastemaker, asymptote]
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract-review:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require exact-source Astra and Opus reviews
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || format('refs/remotes/origin/{0}', github.event.repository.default_branch) }}
        # Bootstrap is immutable until the base branch contains the review policy.
        # Workflow edits still depend on repository governance and required checks.
        run: |
          policy_revision=763a846f1f17af7d6a503874524b7a33adf56e73
          if git cat-file -e "$REVIEW_BASE:ci/contract_review/service.py" 2>/dev/null; then
            policy_revision=$REVIEW_BASE
          fi
          review_policy=$(mktemp -d)
          trap 'rm -rf "$review_policy"' EXIT
          mkdir -p "$review_policy/ci/contract_review"
          for file in command.py service.py; do
            git show "$policy_revision:ci/contract_review/$file" > "$review_policy/ci/contract_review/$file"
          done
          python3 -I "$review_policy/ci/contract_review/command.py" --root "$GITHUB_WORKSPACE"

  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A hand run's product; every product when the pull request changes a file outside the products; otherwise the ones it changes.
      products: ${{ github.event_name != 'pull_request' && format('["{0}"]', inputs.product) || (steps.filter.outputs.repository == 'true' && '["ryo","tastemaker","asymptote"]' || steps.filter.outputs.changes) }}
      repository: ${{ github.event_name == 'pull_request' && steps.filter.outputs.repository == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # A file is the repository's when it matches `**` and none of the products' directories.
          predicate-quantifier: some-with-excludes
          filters: |
            ryo: crates/ryo/**
            tastemaker: crates/tastemaker/**
            asymptote: crates/asymptote/**
            repository:
              - "**"
              - "!crates/ryo/**"
              - "!crates/tastemaker/**"
              - "!crates/asymptote/**"
  # The repository root's lint group on every pull request, its check group too when the change is the repository's. A
  # workspace's check runs its members' tools of the same groups too.
  root:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        if: runner.os == 'Linux'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # A cache per machine and group, since each group builds with its own toolchain, features or flags.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          shared-key: ubuntu-26.04-root
          save-if: true
          workspaces: |
            crates/asymptote -> ../../target
            crates/tastemaker -> ../../target
            crates/ryo -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      - run: asymptote check --root . --groups ${{ needs.changes.outputs.repository == 'true' && 'lint,check' || 'lint' }}
  check:
    needs: changes
    if: needs.changes.outputs.products != '[]'
    name: check (${{ matrix.product }}, ${{ matrix.check.group }}, ${{ matrix.check.runner }})
    strategy:
      fail-fast: false
      # Each changed product, times release.yml's check rows: one job per independent build, the tools of a group sharing one.
      matrix:
        product: ${{ fromJSON(needs.changes.outputs.products) }}
        check:
          - { runner: ubuntu-26.04, group: lint }
          - { runner: ubuntu-26.04, group: clippy }
          - { runner: macos-26, group: api }
          - { runner: ubuntu-26.04, group: check }
          - { runner: ubuntu-26.04-arm, group: check }
          - { runner: macos-26, group: check }
          - { runner: windows-2025, group: check }
          - { runner: ubuntu-26.04, group: release-tests }
          - { runner: ubuntu-26.04-arm, group: release-tests }
          - { runner: macos-26, group: release-tests }
          - { runner: windows-2025, group: release-tests }
          - { runner: ubuntu-26.04, group: release-clippy }
          - { runner: ubuntu-26.04, group: release-coverage }
          - { runner: ubuntu-26.04, group: release-msrv }
          - { runner: ubuntu-26.04, group: release-dylint }
          - { runner: ubuntu-26.04, group: release-hack }
          - { runner: ubuntu-26.04, group: release-resolution }
    runs-on: ${{ matrix.check.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        if: runner.os == 'Linux'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Match release.yml's cache for this machine, group and product. Clean only the product's workspace.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ${{ matrix.check.runner }}-${{ matrix.check.group }}-${{ matrix.product }}
          save-if: true
          cache-on-failure: true
          workspaces: crates/${{ matrix.product }} -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      - run: asymptote check --root crates/${{ matrix.product }} --groups ${{ matrix.check.group }}
  # The product gate also requires the independent speed and Ruff authoring guards. The strict full inventory records parity
  # separately and remains a release acceptance requirement while rules are still being implemented.
  gate:
    needs: [changes, root, check, speed, ruff-candidates, contract-review]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: root, check, ruff-candidates
  ruff-candidates:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.products), 'ryo')
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ubuntu-26.04-ruff-candidates-ryo
          save-if: true
          cache-on-failure: true
          workspaces: crates/ryo -> ../../target
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: Install pinned tools
        run: uv run --script tools/install.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: asymptote check --root crates/ryo --groups ruff-candidates
  speed:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          # Keep this release-mode cache separate from check and the other Ruff jobs.
          cache-workspace-crates: true
          shared-key: ubuntu-26.04-speed-ryo
          save-if: true
          cache-on-failure: true
          workspaces: crates/ryo -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      - name: Save the installed tools before quality checks
        if: steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
      # The language spec embeds the contract spec's passing Parse fixture. Catch
      # producer/consumer drift before timing Tastemaker; this reads no check cache.
      - name: Check the inherited language contract fixture
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          language = tomllib.loads(Path("crates/ryo/tastemaker/specs/language/0.1.0/spec.toml").read_text())
          contract = tomllib.loads(Path("crates/ryo/tastemaker/specs/contract/0.1.0/templates/contract/template.toml").read_text())
          actual = language["given"]["files"]["demo/src/inbound/contracts/parse/contract.rs"]
          expected = next(
              scene["given"]["files"]["contract.rs"]
              for scene in contract["scenarios"]
              if scene["id"] == "rendered-template-passes"
          )
          if actual != expected:
              raise SystemExit("language Parse scenario fixture differs from the contract template's passing fixture; update the scenario and run tm validate")
          PY
      - id: speed_check
        run: |
          mkdir -p target/benchmarks/speed
          set +e
          asymptote check --groups speed --format json > target/benchmarks/speed/check.json 2> target/benchmarks/speed/check.stderr.log
          speed_status=$?
          cat target/benchmarks/speed/check.json
          cat target/benchmarks/speed/check.stderr.log >&2
          exit "$speed_status"
      - name: Speed comparison and Rust memory evidence
        if: always() && steps.speed_check.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-evidence-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            target/benchmarks/speed/**
            .asymptote/cache/check.failures.json
            crates/*/.asymptote/cache/check.failures.json
            tools/lints/.asymptote/cache/check.failures.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  ruff-all-defaults:
    # Deliberately strict: the Ruff authoring guard and native subset jobs are
    # separate; this job records every pinned default.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ubuntu-26.04-ruff-all-defaults-ryo
          save-if: true
          cache-on-failure: true
          workspaces: crates/ryo -> ../../target
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-
            cargo-bin-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned tools
        run: uv run --script tools/install.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save installed tools
        if: steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}-${{ github.sha }}
      - name: Build one Ruff worker and seal its artifact
        run: |
          mkdir -p target/checks/ruff-all-defaults
          cd crates/ryo
          CARGO_BUILD_JOBS=6 cargo bench --no-run --locked -p idiomatic-sh-ryo-python --bench ruff --message-format=json \
            > ../../target/checks/ruff-all-defaults/worker-build.jsonl \
            2> ../../target/checks/ruff-all-defaults/worker-build.stderr
          python3 ../../.github/scripts/seal_cargo_artifact.py \
            ../../target/checks/ruff-all-defaults/worker-build.jsonl \
            ruff bench /languages/python/benchmarks/linters/ruff/bench.rs true \
            ../../target/checks/ruff-all-defaults/worker
      - name: Build shared benchmark inventory runner
        run: |
          cd crates/ryo
          CARGO_BUILD_JOBS=6 cargo build --release --locked -p idiomatic-sh-ryo-benchmark \
            --bin ryo-benchmark-collector --message-format=json \
            > ../../target/checks/ruff-all-defaults/inventory-build.jsonl \
            2> ../../target/checks/ruff-all-defaults/inventory-build.stderr
          python3 -m unittest discover -s ../../.github/scripts -p 'test_seal_cargo_artifact.py'
          python3 ../../.github/scripts/seal_cargo_artifact.py \
            ../../target/checks/ruff-all-defaults/inventory-build.jsonl \
            ryo-benchmark-collector bin /crates/benchmark/src/main.rs false \
            ../../target/checks/ruff-all-defaults/inventory-runner
      - name: Verify all 413 pinned Ruff defaults
        working-directory: crates/ryo
        env:
          RAYON_NUM_THREADS: "1"
        run: |
          ruff --version
          set +e
          python3 languages/python/benchmarks/linters/ruff/verify_profiles.py "$(command -v ruff)" \
            --full-inventory \
            --worker "$GITHUB_WORKSPACE/target/checks/ruff-all-defaults/worker" \
            --inventory-runner "$GITHUB_WORKSPACE/target/checks/ruff-all-defaults/inventory-runner" \
            --output-dir "$GITHUB_WORKSPACE/target/checks/ruff-all-defaults/execution"
          inventory_status=$?
          set -e
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          summary = Path("../../target/checks/ruff-all-defaults/execution/summary.json")
          if not summary.is_file():
              print("Ruff all-defaults runner produced no inventory summary")
          else:
              data = json.loads(summary.read_text())
              rows = data.get("rules", [])
              counts = data.get("counts", {})
              failures = Counter(str(row.get("reason") or "unspecified") for row in rows if row.get("status") == "FAIL")
              print(json.dumps({
                  "provider": data.get("provider"),
                  "total": len(rows),
                  "counts": counts,
                  "run_state": data.get("run_state"),
                  "all_passed": len(rows) == 413 and counts.get("PASS") == 413 and counts.get("FAIL") == 0,
                  "failure_reasons_top10": failures.most_common(10),
              }, sort_keys=True))
          PY
          exit "$inventory_status"
      - name: All-defaults inventory and per-rule receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruff-all-defaults-${{ github.run_attempt }}
          path: target/checks/ruff-all-defaults/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
