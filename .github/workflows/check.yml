# The check workflow on GitHub Actions, its thin edge: the pull request gate, and on a push to main the run that seeds the caches a
# pull request restores and that the release starts on. Asymptote alone decides what runs inside a job; the `changes` job
# (`ci/changes/command.py`) decides which products a run checks. A pull request checks each product whose directory it touches
# and every product that reads one of those, closed over who reads whom (a patched build, a tool input, a run-time read); every
# product when it touches a path they all read (`SHARED` in ci/changes/use_case.py: the workflows, the CI helpers, the tools, the
# toolchain and cargo configuration, the root's Tastemaker package and definitions); and on every change, wherever it lies, the
# products whose tests read the whole tree. A push to main checks every product, and a hand run the one its `product`
# input names: the release pull request workflow (release-pr.yml) starts one on its branch, since a pull request a workflow opens
# starts no workflow. Every run runs the `root` job (the repository's own groups) and the `pull-request` job (the message main
# keeps). For each checked product: one `check-linux` job (its `lint`, `clippy`, `check`, `release-tests`, `release-coverage` and
# `memory` groups, each one the product's tools declare, in one asymptote call, so the tests share one build), and the release's
# rows in the `check` job, the other machines (ARM, macOS, Windows) and groups (`CHECK_ROWS`), so a platform or packaging blocker
# shows on the pull request that brings it, not at the release; for ryo also `python-release` and the `bench` job. A product that
# builds against another product's tree waits with its `release-resolution` row while that product's version has no tag yet: the
# version it needs is published by the release this run gates (ryo-gnv5). The skipping is a job's own condition on the `changes`
# job's `skips` output, never a workflow `paths` filter, so every job, `gate` among them, reports on every pull request and no
# required check sits pending. Every cache is saved by a run on main alone (`github.ref == refs/heads/main`) and restored by every
# run: the Rust cache under one key per machine and product, shared by the groups of a machine (no job id in it), the installed
# tools under one key per machine and the hash of the files that pin them, and each job's `.asymptote/cache` store under its
# groups and the hash of those files, this workflow, the toolchains and the helper scripts, so any of them changing opens an
# empty store. A pull request that edits one of them starts cold, once. A job whose answer stands on state outside the
# repository keeps no store: release-resolution (crates.io's live index), api (the newest release tag) and the pull-request job
# (the event). The bench job keeps none either: asymptote reuses a tool's result without the receipts its run wrote, and the
# upload requires the receipts, so every bench tool runs in full. Each job is a machine, the toolchains (every sample's among
# them: a sample whose toolchain is missing fails its test), `tools/install.py`, which installs every tool the checks run at the
# version declared for it, prebuilt, and one `asymptote check` call. The `gate` job waits for every other and fails when one
# failed or was cancelled, or was skipped but the ones the `changes` job's `skips` names. A draft pull request runs no check:
# every job but `gate` is skipped until it is ready for review, and `gate` runs and fails, since GitHub counts a skipped required
# check as passing. `gate` is the one verdict: a pull request merges only after the `gate` of a run on its head commit passed, by
# process (no repository rule enforces it). The commit gate stays `asymptote check --hook pre-commit`, the git hook `asymptote
# init` installs, which runs the products' `lint` groups and the root's `repository` group.
name: check
on:
  # `edited` too: an edited title starts a run, so the pull-request job checks the title the pull request now has. A draft runs
  # no check (every job but `gate` is skipped while the pull request is a draft, and `gate` fails), and `ready_for_review` starts
  # the run the draft skipped. Never `pull_request_target`, which runs a fork's code with the repository's secrets.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # A merge to main: its run saves the stores every pull request to main restores.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      product:
        description: The one product this run checks
        type: choice
        required: true
        options: [ryo, tastemaker, asymptote]
permissions:
  contents: read
env:
  # nextest's `ci` profile (each product's .config/nextest.toml): no fail-fast, so a machine reports every red test.
  NEXTEST_PROFILE: ci
concurrency:
  group: check-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}-${{ inputs.product }}
  # A newer push to a pull request, or a newer hand run, cancels the one in progress; a merge to main never cancels the run
  # seeding the stores, and each commit has a group of its own, so no pending run is replaced: the release starts on each run's
  # green `gate`, and a commit with no run would never release.
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  # What this run checks: the products a pull request touches (every product on a push to main, a hand run's one), the release's
  # rows for them, and the jobs left with nothing to run, which their own conditions skip and the gate lets skip. A pull request's
  # checkout is GitHub's merge of it into main, so the merge and its first parent, main's newest commit, are all it reads of git;
  # the tags it asks GitHub for say which product's version is unreleased.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    outputs:
      products: ${{ steps.changes.outputs.products }}
      rows: ${{ steps.changes.outputs.rows }}
      skips: ${{ steps.changes.outputs.skips }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.8"
      - id: changes
        run: uv run ci/changes/command.py --event=${{ github.event_name }} --product=${{ inputs.product }}
        env:
          # The release tags, read through `gh`: unauthenticated, GitHub's rate limit refuses it.
          GH_TOKEN: ${{ github.token }}
  # The repository root's own groups, which no product has, so the root's tools alone.
  root:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.8"
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ubuntu-26.04-root
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: |
            crates/asymptote -> ../../target
            crates/tastemaker -> ../../target
            crates/ryo -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      # Saved by main's runs only, and only when the restore missed: a pull request restores what main saved.
      - name: Save the installed tools
        if: github.ref == 'refs/heads/main' && steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      # The root's asymptote store: main's newest for this group and machine, under the installed tools' pins.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .asymptote/cache
          key: asymptote-${{ runner.os }}-${{ runner.arch }}-root-repository-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            asymptote-${{ runner.os }}-${{ runner.arch }}-root-repository-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-
      - run: asymptote check --root . --groups repository,repository-check
      - name: Save the asymptote store
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .asymptote/cache
          key: asymptote-${{ runner.os }}-${{ runner.arch }}-root-repository-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
  # The message main keeps (commitizen): a pull request's title, or the commits a push to main added, from the event GitHub hands
  # the run. The event is no file of the repository,
  # and no stamp holds it, so this job keeps no asymptote store: it checks the live event every time.
  pull-request:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.8"
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      # Saved by main's runs only, and only when the restore missed: a pull request restores what main saved.
      - name: Save the installed tools
        if: github.ref == 'refs/heads/main' && steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - run: asymptote check --root . --groups pull-request
  # The tests on Linux x86 of each product the run checks: the product's `lint`, `clippy`, `check`, `release-tests`,
  # `release-coverage` and `memory` groups in one asymptote call, so the tests share one build and the coverage run adds its
  # instrumented one. A run on main seeds the Rust cache and the stores a pull request restores.
  check-linux:
    name: check-linux (${{ matrix.product }})
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !contains(fromJSON(needs.changes.outputs.skips), 'check-linux')
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.changes.outputs.products) }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.8"
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # One cache per machine and product, shared by the groups run there. Clean only the product's workspace.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.product }}
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: crates/${{ matrix.product }} -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      # Saved by main's runs only, and only when the restore missed: a pull request restores what main saved.
      - name: Save the installed tools
        if: github.ref == 'refs/heads/main' && steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      # The product's asymptote store: main's newest for these groups, under the installed tools' and this workflow's pins.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.product }}/.asymptote/cache
          key: asymptote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.product }}-check-linux-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            asymptote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.product }}-check-linux-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-
      # The job's groups the product's tools declare: asymptote refuses a group none of them does (asymptote has no `memory`).
      - id: groups
        run: uv run ci/groups/command.py --product ${{ matrix.product }} --groups lint,clippy,check,release-tests,release-coverage,memory
      - run: asymptote check --root crates/${{ matrix.product }} --groups ${{ steps.groups.outputs.groups }}
      - name: Save the asymptote store
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.product }}/.asymptote/cache
          key: asymptote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.product }}-check-linux-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve raw check diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-diagnostics-${{ matrix.product }}-check-linux
          path: |
            crates/${{ matrix.product }}/target/checks/
            target/checks/
          if-no-files-found: ignore
  # The release's machines and groups beyond Linux x86's tests, for each product the run checks, a pull request's too: one job per
  # row of the `changes` job's `rows`, a product and a row of `CHECK_ROWS` (ci/changes/use_case.py), each an independent build. A
  # row's groups share one asymptote call, so its tools share one build. `store` is whether the row keeps an asymptote store;
  # `save` is whether its run seeds the Rust cache (one row per machine, since all of a machine's rows share the one key: the first
  # save wins and the rest would be wasted).
  check:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !contains(fromJSON(needs.changes.outputs.skips), 'check')
    name: check (${{ matrix.product }}, ${{ matrix.check.label }}, ${{ matrix.check.runner }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.rows) }}
    runs-on: ${{ matrix.check.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        if: runner.os == 'Linux'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # No go.mod at the root: there is nothing for the module cache to key on.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Exact per platform: Python's 3.12 builds for macOS and Windows stop at 3.12.10, Linux's go on to 3.12.16.
          python-version: ${{ runner.os == 'Linux' && '3.12.16' || '3.12.10' }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.8"
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # One cache per machine and product, shared by the groups run there. Clean only the product's workspace.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.product }}
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.check.save }}
          cache-on-failure: true
          workspaces: crates/${{ matrix.product }} -> ../../target
      # The installed tools, restored whole while the tool table is unchanged: install.py then leaves every tool at its declared
      # version as it is.
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
        env:
          # cargo-binstall asks GitHub for each release: unauthenticated, the rate limit stalls it.
          GH_TOKEN: ${{ github.token }}
      # Saved by main's runs only, and only when the restore missed: a pull request restores what main saved.
      - name: Save the installed tools
        if: github.ref == 'refs/heads/main' && steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      # The product's asymptote store: main's newest for this group and machine, under the installed tools' and this workflow's
      # pins. None for a group whose answer stands on state outside the repository, which no stamp holds: release-resolution
      # resolves against crates.io's live index, and api's semver baseline is the newest release tag.
      - if: matrix.check.store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.product }}/.asymptote/cache
          key: asymptote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.product }}-${{ matrix.check.label }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            asymptote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.product }}-${{ matrix.check.label }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-
      # The row's groups the product's tools declare, as the `check-linux` job asks its own.
      - id: groups
        run: uv run ci/groups/command.py --product ${{ matrix.product }} --groups ${{ matrix.check.groups }}
      - run: asymptote check --root crates/${{ matrix.product }} --groups ${{ steps.groups.outputs.groups }}
      - name: Save the asymptote store
        if: always() && github.ref == 'refs/heads/main' && matrix.check.store
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.product }}/.asymptote/cache
          key: asymptote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.product }}-${{ matrix.check.label }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve raw check diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-diagnostics-${{ matrix.product }}-${{ matrix.check.label }}-${{ matrix.check.runner }}
          path: |
            crates/${{ matrix.product }}/target/checks/
            target/checks/
          if-no-files-found: ignore
  # The one verdict, run on every event, a draft pull request's too: GitHub counts a skipped required check as passing, so a
  # skipped gate would let a draft merge with no check. It fails on a draft, which runs no check, and otherwise when a job it waits
  # for failed or was cancelled, or was skipped but the ones the `changes` job left with nothing to run (its `skips`). A failed
  # `changes` job fails it, and skips every job that waits for it, none of which it then lets skip.
  gate:
    needs: [changes, root, pull-request, check-linux, check, python-release, bench]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: A draft pull request has no verdict
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error title=Draft pull request::A draft pull request runs no check, so it has no verdict: mark it ready for review, which runs the checks."
          exit 1
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.changes.outputs.skips }}
  # Ryo's Python release build, on every run that checks ryo, a pull request's too.
  python-release:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !contains(fromJSON(needs.changes.outputs.skips), 'python-release')
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.8"
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ubuntu-26.04-python-release-ryo
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: crates/ryo -> ../../target
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: Install pinned tools
        run: uv run --script tools/install.py
        env:
          GH_TOKEN: ${{ github.token }}
      # Saved by main's runs only, and only when the restore missed: a pull request restores what main saved.
      - name: Save the installed tools
        if: github.ref == 'refs/heads/main' && steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      # Ryo's asymptote store for this group: main's newest, under the installed tools' pins.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/ryo/.asymptote/cache
          key: asymptote-${{ runner.os }}-${{ runner.arch }}-ryo-python-release-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            asymptote-${{ runner.os }}-${{ runner.arch }}-ryo-python-release-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-
      - run: asymptote check --root crates/ryo --groups python-release
      - name: Save the asymptote store
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/ryo/.asymptote/cache
          key: asymptote-${{ runner.os }}-${{ runner.arch }}-ryo-python-release-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml', 'tastemaker.toml', 'asymptote.toml', '.github/workflows/check.yml', 'ci/scripts/**', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
  bench:
    # Ryo's linter benches, on every run that checks ryo, each on one Linux runner (never a check matrix row), its one asymptote
    # group: the collector verifies every default of the bench against its cases, then runs ryo and the pinned reference over each
    # project of its language, any difference a failure, and publishes ryo's cost, its verification times and its growth as one
    # document, judged against the committed lock. The tool's run line pins the whole process tree to four processors and four workers, so the job sets no
    # worker count of its own. It restores no asymptote store: a reused tool writes no receipts, and the upload requires them, so
    # every bench tool runs in full on every run. The job's limit is above the bench tools' timeouts, so asymptote reports a
    # timeout before the runner cancels the job.
    name: bench
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !contains(fromJSON(needs.changes.outputs.skips), 'bench')
    runs-on: ubuntu-26.04
    timeout-minutes: 390
    env:
      CARGO_BUILD_JOBS: "6"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.8"
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: ubuntu-26.04-bench-ryo
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: crates/ryo -> ../../target
      - id: cargo_bin_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - name: Install pinned tools
        run: uv run --script tools/install.py
        env:
          GH_TOKEN: ${{ github.token }}
      # Saved by main's runs only, and only when the restore missed: a pull request restores what main saved.
      - name: Save the installed tools
        if: github.ref == 'refs/heads/main' && steps.cargo_bin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install.py', 'crates/*/Cargo.toml', 'tools/lints/Cargo.toml') }}
      - run: asymptote check --root crates/ryo --groups bench
      - name: Bench documents and per-rule receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.run_attempt }}
          path: target/benchmark/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
