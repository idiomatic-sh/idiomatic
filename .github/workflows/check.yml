# The check workflow on GitHub Actions, its thin edge: a machine of each platform, the toolchains (every sample's among them: a
# sample whose toolchain is missing fails its test), `tools/install.py`, which installs every tool the
# checks run at the version declared for it (the command-line tools built from this checkout among them), and one call of
# `asymptote check --groups lint,check`, which runs the tools of those groups (the release workflow runs the `release` group; the
# benches run only when asked for with `--groups perf`).
# It runs only when dispatched by hand; the per-change gate is `asymptote check --hook pre-commit`, the git hook `asymptote init` installs.
name: check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: The tools the checks run, each at the version declared for it
        run: uv run --script tools/install.py
      - run: asymptote check --groups lint,check
